id: compact.modular-invariance-requires-self-dual-lattice
kind: proposition
title: 配分函数对一切 τ 模不变 ⇒ Narain 格自对偶（必要性；原书无论证）
statement: |
  设 D = 26 的玻色闭弦紧化在 k 维环面上，Narain 格为 Γ（compact.narain-lattice）。
  断言：**若紧化部分的配分函数 Z_Γ 对一切 τ 模不变，则 Γ 必须自对偶（Γ* = Γ）。**
  与 compact.self-dual-lattice-gives-modular-invariance（充分性）合起来，即
  「模不变 ⟺ Γ 偶自对偶」——这正是 Narain 紧化的分类前提。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.compactification-radius, conv.worldsheet-euclidean]
sources:
  - ref: polchinski-1998-v1
    loc: "§8.4, eq. (8.4.24) 的后半句，p.252"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E139，Q21。
      **证据等级 L1（原书直读）**：抽取记录 §12.10 表 A 的 Q21 已在原书 p.252 逐字确认
      「a little thought shows that it is also necessary if modular invariance is to hold
      for all τ」，并维持「拆两节点」的建议。
      ⚠⚠ **原书对这半句只有这一句话，没有论证**。
      伴读者本人也复现不出这一步（笔记 p.477：「Unfortunately that little thought has
      escaped me so far.」）。
tags: [compactification, torus, narain, lattice, modular-invariance, consistency, unproved-assertion]
notes: |
  **档位（lead 裁决 2026-09-11，依 reviewer-ch5 建议，见 docs/STATUS_LEVELS.md
  「断言 + 骨架」一节）**：来源给出断言而关键步骤只有断言的，标
  **physical-argument**，缺口逐条写进推导的 `gaps`；**不**标 conjecture
  （conjecture 保留给来源本身当猜想提出、或结论真伪在文献中未定的命题）。
  本卡的推导 status 因此定为 physical-argument，不再是暂定值。

  **对 Narain 链的后果**：(8.4.24) 的这半句是「模不变的紧化恰好由偶自对偶格分类」
  的必要方向。没有它，compact.narain-moduli-space 只是「偶自对偶格给出的那些理论
  构成的空间」，而不是「全部模不变紧化的空间」。

  升级路径：这在数学上是标准结论（自对偶性可由 θ 级数的模性质反推），
  但需要一个真正的数学来源；本项目尚未登记这样的文献。
author: curator-polchinski-ch8
created: "2026-09-11"
