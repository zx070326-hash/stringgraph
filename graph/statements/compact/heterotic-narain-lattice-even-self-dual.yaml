id: compact.heterotic-narain-lattice-even-self-dual
kind: proposition
title: 杂化弦的玻色构造与环面紧化：动量格必须是号差 (26−d, 10−d) 的偶自对偶洛伦兹格
statement: |
  **玻色构造**（§11.6）：把杂化弦的左移部门整个写成玻色子，即 **26 个左移玻色子与
  10 个右移玻色子**（右移一侧另有 ψ̃^μ）。紧化到 d 个非紧维时，记无量纲动量
    l_{L,R} = (α'/2)^{1/2} k_{L,R}                              （(11.6.1)），
  紧化方向的动量 (l_L^m, l_R^n)（d ≤ m ≤ 25，d ≤ n ≤ 9）取值于一个格 Γ（(11.6.2)）。
  定义号差为 (26−d, 10−d) 的内积
    l ∘ l′ = l_L·l_L′ − l_R·l_R′                                （(11.6.3)）。

  **断言**：一致的 CFT 要求（原书逐字：'the requirements for a consistent CFT are **locality of
  the OPE plus modular invariance**'，并注明这是 Vol.1 §8.4 Narain 紧化的结论）
    **Γ 必须是号差 (26−d, 10−d) 的偶自对偶洛伦兹格**：
      l ∘ l ∈ 2Z  对一切 l ∈ Γ                                   （(11.6.4a)），
      Γ = Γ^*（自对偶）                                          （(11.6.4b)）。

  **d = 10（不紧化）的特例**：此时 ∘ 只剩左移部分、是**正定**的，
  l_L^m 构成一个 **16 维偶自对偶欧氏格**。

  **本命题不断言的内容**：
    (1) **不**给出「locality + modular invariance ⟺ 偶自对偶」的论证。
        原书明写把它推给 Vol.1 §8.4（'From the discussion of Narain compactification in
        section 8.4, we know that …'），本卡不重复那里的论证。
    (2) 不断言 16 维时这样的格恰有两个——那是
        math.even-self-dual-euclidean-lattices-dimension-16。
    (3) 不断言谱的完整内容。原书脚注 2（p. 75，逐字）：'To be precise it is still necessary to
        specify the spectrum, which amounts to specifying which primary fields appear.
        **Modular invariance generally restricts the possibilities greatly.**'
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
