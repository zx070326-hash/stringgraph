    loc: "§11.6, eq. (11.6.1)–(11.6.4b), pp. 73–74（26 左 + 10 右玻色子、无量纲动量、格 Γ、∘ 内积、偶与自对偶两条件；逐字：'the lattice must be an even self-dual Lorentzian lattice of signature (26−d, 10−d)'）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E63；式号与公式逐页读到原书页图）。
      ⚠ **§11.6 的后半（pp. 76–83）本轮跳读**（抽取记录 §3.2），
      故 (11.6.11) 之后的内容（含 [H] 提到的 (11.6.15)）本卡不覆盖。
  - ref: polchinski-1998-v1
    loc: "§8.2、§8.4（Narain 紧化；原书在 §11.6 明写引用这两节）"
    note: |
      原书把「locality + modular invariance ⇒ 偶自对偶」的论证推给这里。
      ⚠ 本图对应的节点在**未合并**分支 agent/curator/polchinski-ch8 上
      （compact.narain-lattice、compact.modular-invariance-requires-self-dual-lattice、
      compact.self-dual-lattice-gives-modular-invariance）。
      **本轮不加边**，只在 notes 指向；待那支合并后由 lead 决定接边。
tags: [heterotic, compactification, narain, lattice, modular-invariance, so32, e8e8]
notes: |
  ★【与 compact 区 Narain 一支的接口（本轮只指向，不加边）】
  分支 agent/curator/polchinski-ch8（**未合并 main**）已建：
    · compact.narain-lattice —— 玻色弦 D = 26 的 Narain 格；
    · compact.modular-invariance-requires-self-dual-lattice —— 必要方向
      （Vol.1 (8.4.24) 的后半句，原书逐字 'a little thought shows that it is also necessary'，
       **原书对这半句无论证**，伴读者本人也复现不出）；
    · compact.self-dual-lattice-gives-modular-invariance —— 充分方向；
    · compact.even-lattice-gives-mutual-locality —— 偶 ⇒ 相互局域。
  本卡是这四条在**杂化弦号差 (26−d, 10−d)** 下的版本。
  合并后建议的接边方向：本卡 ← 那三条（必要 + 充分 + 偶⇒局域），
  并注意本卡的号差是 (26−d, 10−d) 而 ch8 一支是 (k, k)，需要 convention_map 或换代。
  ⚠ **在那支合并前，本卡的推导只能靠 Polchinski 的「推给 §8.4」这一句支撑**，
  这一点已写进推导的 gaps。

  【与 §11.2 费米子构造的关系】原书逐字：'**It is easy to see** that the earlier fermionic
  construction and the present bosonic one are equivalent under bosonization.'
  ——又一条 'easy to see'，无论证。见 worldsheet.heterotic-bosonic-construction-gauge-groups。

  【为什么放在 compact 区】§11.6 的标题是 'The bosonic construction and toroidal
  compactification'，而 (11.6.2)–(11.6.4) 讲的是紧化动量格；d = 10 只是其 Γ 退化为欧氏的特例。
  本图 compact 区已有 Narain 一支（虽未合并），放这里可与之对齐。
  ★【2026-09-11 记号与依赖更新】statement 第 (2) 条提到的
  math.even-self-dual-euclidean-lattices-dimension-16 已于本日换代拆卡：
  「维数必是 8 的倍数」→ math.even-unimodular-rank-divisible-by-8（Zagier Prop 12(i)，rigorous）；
  「16 维恰有两个且不同构」→ math.even-unimodular-rank-16-classification（Chenevier–Lannes Cor 3.6，rigorous）；
  Polchinski 记号 `Γ_16`/`Γ_8` 的等同 → math.even-self-dual-euclidean-lattices-dimension-16-v2。
  （statement 文本按项目规矩不可改，此处仅作指路。）
  ⚠ **本卡才是杂化弦「规范群恰有两个」整条链的真正瓶颈**：本卡断言的是「一致 CFT ⇒ 内部格偶自对偶」，
  原书把论证推给 v1 §8.4，本图它是 physical-argument。数学侧两张卡升到 rigorous **不会**改变这一点。

