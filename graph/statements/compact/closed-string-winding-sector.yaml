id: compact.closed-string-winding-sector
kind: definition
status: rigorous
title: 闭弦的绕数扇区 X(σ¹ + 2π) = X(σ¹) + 2πRw
statement: |
  设紧化坐标 X ≡ X^{25} 满足 X ≅ X + 2πR（conv.compactification-radius）。
  闭弦的世界面空间坐标是周期的（σ¹ ≅ σ¹ + 2π，即 conv.worldsheet-coordinate-length
  取 ℓ = 2π）。因为 X 只需在时空的圆上单值，闭弦的场位形不必逐点周期，
  只需**在时空的等价关系意义下**周期：
    **X(σ¹ + 2π, σ²) = X(σ¹, σ²) + 2πR w,   w ∈ Z**.
  整数 w 称为该位形的**绕数**（winding number）：弦绕紧化圆 w 圈。
  w ≠ 0 的位形与 w = 0 的位形不能连续形变到彼此，故 Hilbert 空间按 w 分解为
  互不连通的扇区，每个 w 是一个超选量子数。未紧化时只有 w = 0。
uses: [worldsheet.closed-string-mode-expansion]
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.compactification-radius, conv.worldsheet-coordinate-length]
sources:
