    loc: "§8.2, eq. (8.2.3)（绕数边界条件），p.236"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E120，证据等级 L1
      （Schrans §8.11，笔记 p.436–437）。
      ⚠ **(8.2.3) 的式号只有 Schrans §8.49/§8.73 正文的交叉引用锚定，其目录无独立条目**
      （抽取记录 §10）。
tags: [compactification, closed-string, winding, torus, definition]
notes: |
  「绕数扇区之间不连通、w 是超选量子数」这句话是本图的表述；抽取记录里没有
  对应的原文位置，来源只给了边界条件本身。若日后需要，可拆出一条独立命题
  «紧化闭弦的位形空间的连通分支由 π_1(S^1) = Z 标号» 并另找数学来源。

  绕数与零模的关系（2πRw = 2π(α'/2)^{1/2}(α_0 − ᾱ_0)）不在本定义卡内，
  它是 compact.left-right-momenta 的推导内容。
