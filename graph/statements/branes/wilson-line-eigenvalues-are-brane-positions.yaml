id: branes.wilson-line-eigenvalues-are-brane-positions
kind: proposition
title: Wilson 线的本征值 θ_i 就是第 i 张 D 膜的位置 X'(0) = θ_i R'
statement: |
  设玻色开弦带 U(n) Chan–Paton 因子，一个方向紧化在半径 R 并取 Wilson 线背景
  A_d = −(1/2πR) diag(θ_1, …, θ_n)（compact.wilson-line-background），
  再对该方向作 T 对偶（对偶半径 R' = α'/R）。则带 Chan–Paton 指标 (i, j) 的开弦满足
    **X'(π) − X'(0) = − ( 2π ℓ − θ_j + θ_i ) R',   ℓ ∈ Z**,
  且端点 i 被固定在
    **X'(0) = θ_i R' = − 2π α' A_{ii}**   （加一个可任选的整体常数）。
  即：**Wilson 线的本征值 θ_i 在对偶描述中就是第 i 张 D 膜在对偶方向上的位置**；
  n 个互不相同的 θ_i 对应 n 张分开放置的平行 D 膜，θ_i 相同的那些膜重合。
  对偶坐标的模式展开相应为
    X'(z, z̄) = θ_i R' + (σ¹/π) ΔX' − (2α')^{1/2} Σ_{m ≠ 0} (α_m/m) e^{−mσ²} sin(mσ¹)
  ——只含 sin 项，端点处自动固定，与 Dirichlet 条件一致。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.compactification-radius, conv.worldsheet-coordinate-length]
sources:
