tags: [d-brane, t-duality, wilson-line, chan-paton, open-string, dirichlet]
notes: |
  这条把两个看起来无关的对象等同起来：规范场的一个**内部**参数（Wilson 线本征值）
  与一个**几何**量（膜的位置）。它是「D 膜的动力学由其上的规范理论描述」这条线索的起点
  （branes.massless-open-string-gauge-field-and-collective-coordinates）。

  ⚠ 上游 compact.wilson-line-shifts-open-string-momenta 含一处来源明说不理解的步骤
  （Chan–Paton 态的电荷指派 ±1）；本条继承那个缺口。
