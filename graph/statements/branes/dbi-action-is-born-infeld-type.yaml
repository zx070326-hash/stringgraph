id: branes.dbi-action-is-born-infeld-type
kind: proposition
title: Dp 膜的低能有效作用量是 Born–Infeld 型的行列式平方根（弱陈述）
statement: |
  **弱陈述**：Dp 膜的低能有效作用量（branes.d-brane-from-t-duality）是
  **Born–Infeld 型**的，即形如
    S_p ∝ ∫ d^{p+1}ξ  [ − det( 世界体上的对称二阶张量 ) ]^{1/2},
  其中被取行列式的张量含三部分：时空度规到世界体的拉回、反对称张量场到世界体的拉回、
  以及膜上 U(1) 规范场的场强；后两者只通过**规范不变的组合**
    **𝓕_{μν} = 2π α' F_{μν} − B_{μν}**
  出现（因为 B_{μν} → B_{μν} + ∂_μΛ_ν − ∂_νΛ_μ 必须伴随 A_μ → A_μ + Λ_μ/(2πα')）。
  规范场为零时它化为诱导度规的体积泛函，即 Nambu–Goto 型作用量在 p + 1 维世界体上的推广。

  **本陈述不含任何数值系数、不含张力 τ_p 的表达式、也不宣称行列式内各项的确切排版形式**
  ——理由见 notes。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: polchinski-1998-v1
    loc: "§8.7, eq. (8.7.2)（Dp 膜作用量）与 (8.7.10)（规范不变组合 2πα'F − B），p.270"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E154 与 **Q25**。
      ⚠⚠ **式号已核实，但表达式没有任何来源从原书抄出**（对原书 L0）。
      Schrans §8.115 开头逐字：「**I must admit that I find the discussion around (8.7.20)
      very hard to follow, especially the derivation of the Born-Infeld term 2πα'F_{ab}
      in the D-brane action.** I will therefore take a (few) step(s) back and **follow the
      derivation of that term as presented in [22]** … **I will use the original
      calculation [23]**」——即他**没有复现原书的推导，改用了两篇外部文献**。
tags: [d-brane, dbi, born-infeld, effective-action, open-string, weak-statement]
notes: |
  **为什么只建弱陈述**（抽取记录 Q25 的明确要求）：
  1. 表达式**没有任何源从原书抄出**；本项目手上的写法来自 Schrans 的替代推导。
  2. Schrans 由外部文献得到的张力 **T_p = 1/(√α'(2π√α')^p)** 与原书的 τ_p（(8.7.15)/(8.7.26)）
     **归一化不同**——他自陈「This is (8.7.20) but with a different definition of τ_p」。
     抽取记录明令 **curator 不得把这个 T_p 挂到 polchinski-1998-v1**，本卡因此不写张力。
  3. Schrans 的 Open Questions 第 8 条针对 (8.7.5)（作用量里的几何因子）：他看不出该因子的来源。

  **仅供参考、标 L0（不得当作本卡的陈述内容）**：Schrans 替代推导给出的形式是
  S_p = −T_p ∫d^{p+1}ξ e^{−Φ}[−det(G_{ab} + B_{ab} + 2πα'F_{ab})]^{1/2}，
  其中 G_{ab}(ξ) = G_{μν}(X(ξ))∂_aX^μ∂_bX^ν、B_{ab} 同理为拉回。
  **这一行的每一个系数与因子都未与原书核对**，记在此仅为日后核对时的对照。

  若图中日后需要 DBI 的严格来源，应另找（抽取记录 Q25 建议 Leigh 1989 /
  Abouelsaood–Callan–Nappi–Yost 1987 / Tseytlin 综述）；本项目尚未登记这些文献。
author: curator-polchinski-ch8
