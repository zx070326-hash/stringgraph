id: branes.rr-charge-quantization-v2
kind: proposition
title: R–R 荷的 Dirac 量子化条件：μ_p μ_{6−p} = π n / κ₁₀²，n ∈ Z（v2：不再引原书误印的 (13.3.12)，只引 (13.3.11)+(13.3.13)+(13.3.7)）
statement: |
  设 type II 超弦中 Dp 膜与 D(6−p) 膜分别是 F_{p+2} 与 F_{8−p} = ∗F_{p+2} 的电源
  （branes.d-brane-rr-coupling），荷 μ_p、μ_{6−p} 按 (13.3.5) 归一化（branes.d-brane-rr-charge-value）。
  则两者必须满足广义 Dirac 量子化条件
    **μ_p μ_{6−p} = π n / κ₁₀²,    n ∈ Z**.                                (13.3.13)
  这是四维 Dirac 条件 μ_e μ_m = 2πn（(13.3.11)，由「Dirac 弦必须不可观测」得出）的推广：
  Dp 膜世界体与 D(6−p) 膜世界体在十维中 Poincaré 对偶，把 D(6−p) 膜看作 F_{p+2} 的磁源、
  Dp 膜看作电源，对 Dp 膜施加同一条「Dirac 弦不可观测」的要求即得 (13.3.13)。
  在 (13.3.5) 的归一化下，(13.3.13) 与由圆柱振幅定出的荷 (13.3.7)
    μ_p² = (π/κ₁₀²)(4π²α')^{3−p}
  互洽：代入得 μ_p μ_{6−p} = π/κ₁₀²，即 n = 1（那一步单独建卡，见下）。

  **本命题不断言**：n 的取值（那是 branes.d-brane-charge-minimal-dirac-quantum）；
  围绕 D(6−p) 膜的 (p+2)-球面上的磁通 ∫_{S_{p+2}}F_{p+2} 的具体系数
  （原书 (13.3.12) 在此处**误印**，本卡不引它，见 notes）；
  p = 3 自对偶情形（μ_3² = πn/κ₁₀²）的额外微妙之处（原书未讨论）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.string-coupling-tension-ratio]
sources:
  - ref: polchinski-1998-v2
    loc: "§13.3「Dirac quantization condition」, eqs. (13.3.8)（∫_{S_2}F_2 = μ_m）、(13.3.9)（相位 exp(iμ_e∮_P A_1) = exp(iμ_e∫_D F_2)）、(13.3.10)、(13.3.11)（μ_eμ_m = 2πn，「The Dirac string must be invisible, so this phase must be 1」）、(13.3.13)（μ_pμ_{6−p} = πn/κ₁₀²），pp. 147–149；fig. 13.3, p. 148；输入式 (13.3.7)，p. 147"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E19 与 §6「E19 复核」，证据等级 L1
      （原书页图；§6 由 researcher 于 2026-09-11 用 Cambridge Core ch.13 单章 PDF 印刷 p.148 重核）。
      ⚠ 逻辑方向：这是**一致性条件**，不是 μ_p 的推导（μ_p 由 (13.3.7) 的振幅计算给出）。
      ⚠ **本卡有意不引 (13.3.12)**：原书 p. 148 印作 ∫_{S_{p+2}}F_{p+2} = μ_{6−p}/2κ₁₀²
      （抽取记录第 417 行转录无误，2005 corrected 版仍如此），但它与同节 (13.3.11)+(13.3.13)
      不自洽——按印出来的形式代入得 μ_pμ_{6−p} = 4πnκ₁₀²，与 (13.3.13) 差 4κ₁₀⁴。
      正确形式 2κ₁₀²μ_{6−p} 由两条独立证据确认（见 notes）。本卡只用 (13.3.11)+(13.3.13)+(13.3.7)
      三条互洽且 L1 的式子。
tags: [d-brane, rr-charge, dirac-quantization, electric-magnetic-duality, type-ii]
notes: |
  ★★【v2 改了什么（curator，2026-09-11，依 reviewer-branes + researcher 复核 + lead 裁决）】
  **唯一的改动是把 v1 陈述里的 (13.3.12) 那一行去掉**：v1 写
  ∫_{S_{p+2}}F_{p+2} = μ_{6−p}/2κ₁₀² 并标 (13.3.12)，那是原书 p. 148 印出来的形式，
  但它与同节的 (13.3.11)、(13.3.13) 不自洽。v2 的陈述只用三条互洽且 L1 的式子：
  (13.3.11)（四维 Dirac 条件）、(13.3.13)（十维推广的结论）、(13.3.7)（输入荷）。
  磁通的正确系数是 **∫_{S_{p+2}}F_{p+2} = 2κ₁₀² μ_{6−p}**（κ₁₀² 在分子），两条独立证据：
  · **书内**：Dirac 弦不可观测要求 exp(iμ_p ∫_{S_{p+2}}F_{p+2}) = 1，即 μ_p·(∫F) = 2πn。
    代 ∫F = 2κ₁₀²μ_{6−p} 得 2κ₁₀²μ_pμ_{6−p} = 2πn，**正是 (13.3.13)** ✓；
    代印出来的 μ_{6−p}/2κ₁₀² 得 μ_pμ_{6−p} = 4πnκ₁₀²，与 (13.3.13) 差 4κ₁₀⁴ ✗。
    同一归一化下 (13.3.5) 的场方程 (1/2κ₁₀²)d∗F = μδ 也给 ∫∗F = 2κ₁₀²μ（(13.3.6) 的传播子
    2κ₁₀²i/k² 同源）。
  · **书外**：Polchinski, hep-th/9510017 (PRL 75 (1995) 4724) p. 5，(12)–(15)：作用量
    S = (α_p/2)∫F∗F + iμ_p∫A_{p+1}，逐字 'from the action (12) one finds total flux Φ = μ_p/α_p'，
    Dirac 条件 (15) μ_pμ_{6−p}/α_p = 2πn；书的归一化对应 α_p = 1/(2κ₁₀²)（代入 (13) 与 (15)
    分别精确复现书 (13.3.7) 与 (13.3.13)），故 Φ = 2κ₁₀²μ_p——**乘**，不是除
    （抽取记录 -ch13.md §6.4，L1 页图；researcher 读的是 v3）。
  ⇒ **原书 (13.3.12) 是排印错误**（分数线两侧倒置，与 Vol.1 (6.6.21) 的 4α' ↔ ¼α' 同型），
  Cambridge Core 2005 「with corrections」版仍印错误形式，官方勘误表未收。
  **(13.3.13) 与「n = 1 最小量子」两个下游结论不受影响**。
  ⚠ 引用 hep-th/9510017 的荷归一化时必须带上该文 p. 6 作者自承的未解矛盾
  （'This is twice the value found in ref. [13] … We have not succeeded in reconciling these
  calculations'）；本卡不用该文的荷值，只用它的通量–荷关系。
  ⚠ 该文尚未登记进 literature/sources.bib（key 建议 polchinski-1995-dbranes），故本卡不在
  sources 里列它，只在此处经抽取记录 §6.4 转引；登记后可补一条 ref。
  【本卡在 agent 分支上的历史】本卡曾有一版把 (13.3.12) 改写成 2κ₁₀²μ_{6−p} 并称抽取记录「误读」；
  researcher 核印刷页后确认转录无误、错在原书，该版**未进入 main**，按 lead 指示就地改为现在的写法。
  v1 卡片按规则保留不动并写 superseded_by。

  本卡只承载**条件**本身。「(13.3.7) 的荷恰好以最小量子 n = 1 满足它」是另一条命题
  branes.d-brane-charge-minimal-dirac-quantum（原书「Remarkably」句），分开建卡是因为
  前者是 Dirac 弦不可观测的一般论证，后者是把已算出的荷代入的一步代数。

  【本图缺的上游】四维 Dirac 量子化条件本身在 math/ 区无节点；Poincaré 对偶、Dirac 弦、分片势等
  拓扑语言在图上无支撑。本卡的推导只能记录原书的论证骨架。
