id: branes.d-brane-bps-half-susy
kind: proposition
title: Dp 膜是 BPS 态：保留 type II 的 32 个超对称中的 16 个，未破缺组合是 Q + β^⊥ Q̃
statement: |
  设 type II 超弦（IIA 或 IIB，体内理论）中有一张 Dp 膜——按 Vol.1 第 8 章的同一套论证
  （branes.d-brane-from-t-duality 的超弦版：对 type I 在 9 − p 个方向上作 T 对偶所得的
  开弦端点超平面）。记 type II 的 32 个超对称荷为 Q_α（左动）与 Q̃_α（右动），
  β^m ≡ Γ Γ^m（Γ 是十维手征矩阵），β^⊥ ≡ ∏_{m ⊥ 膜} β^m（乘积跑遍垂直于膜的方向）。

  **命题**：Dp 膜**保留其中的 16 个超对称**，未破缺的组合是
    **Q_α + (β^⊥ Q̃)_α**,        β^⊥ = ∏_{m 垂直} β^m          (13.2.5)(13.2.6)
  （只有一个 Dirichlet 方向 9 时即 Q'_α + (β^9 Q̃')_α，(13.2.2)）。
  闭弦从 D 膜散射的振幅只在这 16 个超对称下不变；另外 16 个被自发破缺，
  相应的 Goldstone 费米子（goldstino）就是膜上无质量开弦谱 (13.2.1) 中的 R 部门态 |α; k⟩_R，
  其顶点算子 (13.2.4) 恰是被破缺超对称流的边界积分。
  原文逐字（斜体为原书所有）：「what is striking is that it leaves half the supersymmetries unbroken:
  *it is a BPS state*. This same argument holds for any number of dualized dimensions,
  and so for Dp-branes for all p.」

  **本命题不断言**：
  (a) 「Dp 膜自发破缺平移不变性」对一切 p 成立。原书脚注 1 逐字：由 Mermin–Wagner–Coleman 定理，
      「If it has one or zero noncompact directions, quantum fluctuations force it into a unique
      translationally invariant state」；但对超对称「supersymmetry can be broken even by a
      zero-dimensional object」，故本命题的 BPS 性对 p ≤ 1 仍成立，只是平移破缺的图像不成立。
  (b) 超对称代数中带膜荷的中心项 (13.2.9)（本图未建卡）。
  (c) 「BPS 态必须携带守恒荷」——那是以 App. B.2 的 BPS 概念为前提的推论（见 branes.d-brane-rr-coupling）。
      「BPS 态」一词在本卡按 App. B §B.2 的含义使用：被一部分超荷湮灭的短表示
      （branes.bps-bound-point-particle-d4；ch.13 p. 141 逐字「BPS states, which are discussed in section B.2」），
      但 App. B 的界只对点粒子荷，D 膜荷版的代数是 (13.2.9)（branes.brane-charges-in-susy-algebra，在本卡之后）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: polchinski-1998-v2
    loc: "§13.2, eqs. (13.2.2)（T 对偶后守恒的组合 Q' + β^9 Q̃'）、(13.2.4)（goldstino 顶点算子）、(13.2.5)(13.2.6)（一般 p 的未破缺组合与 β^⊥），pp. 139–140；逐字「*it is a BPS state*」与「This same argument holds for any number of dualized dimensions, and so for Dp-branes for all p.」；脚注 1（p. 140，Mermin–Wagner–Coleman 限定）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E6、#E7，证据等级 L1（原书页图）。
      ⚠ 论证强度原书自陈：「We conclude by analogy that the D-brane also spontaneously breaks 16 of the
      32 spacetime supersymmetries」（p. 140）——「动量不守恒 ↔ 集体坐标 Goldstone 玻色子」的类比推广，
      不是独立计算（抽取记录 §3.1 第 3 条）。
  - ref: polchinski-1998-v2
    loc: "§13.1, eqs. (13.1.1)(13.1.2)（T 对偶反射右动 X^9_R 与 ψ̃^9）、(13.1.3)（自旋场上的作用 𝒱̃' = β^9 𝒱̃）、(13.1.6)（多方向时 β^9 → ∏_m β^m），pp. 136–138"
    note: |
      抽取记录 #E2。⚠ 原书自陈符号只到「up to signs」：(13.1.6) 之后逐字
      「There are some signs that should be noted but should not distract attention from the main physical point.」
tags: [d-brane, bps, supersymmetry, type-ii, t-duality, goldstino]
notes: |
  这是 branes 区超弦部分的**入口卡**：branes.d-brane-rr-coupling（BPS ⇒ 带守恒荷）、
  branes.d-brane-bps-no-force（两张平行膜共同保留同一组超对称）、
  branes.orientifold-plane-rr-charge（整套 D 膜是 BPS 态，质量与总荷线性）都以本卡为上游。

  ⚠ **本图缺的上游**（不是本卡的错，是图的现状）：
  1. type II 的时空超对称（32 个超荷、两个 gravitino）在 main 上无节点
     （ch10 分支有 worldsheet.type-ii-spacetime-supersymmetry，未合）；
  2. Vol.2 App. B §B.2 的 BPS 界 (B.2.39) **现已抽（L1，2026-09-11）并建卡 branes.bps-bound-point-particle-d4**；
     但它只对点粒子荷（p. 448 逐字「if we include only charges that can be carried by point particles」），
     D 膜荷的代数是 (13.2.9)（branes.brane-charges-in-susy-algebra，原书自承「still not complete」）。
     「BPS ⇒ 质量与荷线性」对 D 膜因此只有 (13.2.9) 层面的支撑；
  3. Dp 膜的定义卡 branes.d-brane-from-t-duality 是**玻色弦**的；超弦版原书只说
     「by the same arguments as for the bosonic string in chapter 8, which the reader should review」（p. 138）。
  待这些补齐后本卡的推导应改边。
