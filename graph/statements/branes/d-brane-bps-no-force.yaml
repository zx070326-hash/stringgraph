id: branes.d-brane-bps-no-force
kind: proposition
title: 平行同号静态 Dp 膜之间无力：圆柱振幅中 R–R 交换与 NS–NS 交换精确相消（限定平行、同维、同号、静态；作者自承例外不在内）
statement: |
  **设定（适用域，是陈述的一部分）**：type II 超弦中两张**平行、同维、R–R 荷同号、相对静止**的
  Dp 膜（#ND = 0），相距 y。它们共同保留的超对称与单张 Dp 膜相同（(13.2.5)，
  branes.d-brane-bps-half-susy），两膜系统仍是 BPS 态。

  **命题**：圆柱真空振幅在长柱极限下分成 NS–NS 交换（引力子 + dilaton，吸引）与 R–R 交换
  （(p+1)-形式势，排斥）两部分，二者**精确相消**：
    **𝒜_R–R = − 𝒜_NS–NS**,                                        (13.3.2)
  故两膜之间的静力为零。NS–NS 部分的长程形式是
    𝒜_NS–NS ≈ i V_{p+1} · 2π (4π²α')^{3−p} G_{9−p}(y)（(13.3.1) 末行），
  G_d(y) = 2^{−2} π^{−d/2} Γ(½d − 1) y^{2−d}。原文逐字：「There is no force between static BPS objects
  of like charge. … The vanishing of the force comes about from a cancellation between attraction
  due to the graviton and dilaton and repulsion due to the R–R tensor.」

  **本命题不断言**（每条都有原文依据）：
  (1) 反平行（膜–反膜）构型：那时 NS–NS 与 R–R 同为吸引，间距 y² < 2π²α' 时圆柱振幅发散、出现快子
      （§13.4，「evidently it represents D4-brane/anti-D4-brane annihilation」）。
  (2) 相对运动：超对称全破，有 O(v⁴) 的速度依赖势（(13.5.7)）。
  (3) ★ **「超对称未破缺 ⇒ 真空圈振幅为零」这条一般规则**。原书在任意夹角 D4 膜的势 (13.4.23) 之后
      自承反例，逐字：「Curiously this covers only eight of the sixteen phases (13.4.11), so that if some
      phases (13.4.11) are unity but not those of the form exp(±2iφ'_a), then **supersymmetry is
      unbroken but the potential is nonzero. This is an exception to the usual rule that the vacuum
      loop amplitudes vanish by Bose–Fermi cancellation.**」原书只给现象，不给机制；
      本图不为该例外建卡，只把它作为本命题适用域的边界记录。
      因此本卡只对上述**平行、同维、同号、静态**构型断言无力，**不**由「BPS」二字推广到任意保留超对称的构型。
  (4) (13.3.1) 的完整前缀系数（页图读数与复算相差一个 π 的幂，抽取记录 Q3）。
  (5) 张力 τ_p 与荷 μ_p 的数值（branes.d-brane-tension、branes.d-brane-rr-charge-value）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.worldsheet-euclidean]
sources:
  - ref: polchinski-1998-v2
    loc: "§13.3, eqs. (13.3.1)(13.3.2)，p. 146；逐字「There is no force between static BPS objects of like charge.」与「Due to supersymmetric cancellation in the trace, the R–R exchange amplitude is 𝒜_R–R = −𝒜_NS–NS and so the total force vanishes as expected.」；BPS 性与保留的超对称见 §13.2, (13.2.5), p. 140"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E16，证据等级 L1（原书页图）。
      ★ **以同文件 §7 为准**（researcher 2026-09-11 独立复核）：§7.1 订正 E16 逐字块漏抄的
      "is independent of"（原句："its energy is determined only by its charge and **is independent of** the
      separations"）；§7.3 定案 (13.3.1) 的完整前缀与被积测度 (π dt/t²)，抽取记录 Q3 关闭。
      ⚠ (13.3.1) 用「≈」；(13.3.2) 不是独立算出的，而是「Due to supersymmetric cancellation in the trace」
      直接断言——**超对称输入而非计算输出**。
      ⚠ (13.3.1) 明写是 (10.8.4) 的修改版（「The exchange of light NS–NS closed strings was isolated in
      eq. (10.8.4). Modify this expression by …」）——与 §10.8 存在技术性的公式依赖（抽取记录 Q5）。
  - ref: polchinski-1998-v2
    loc: "§13.4「Branes at general angles」, (13.4.23) 之后一段，p. 157（作者自承的例外：超对称未破缺但势非零）；反平行快子 (13.4.27) 附近，p. 158"
    note: 抽取记录 #E25 与 Q8（L1）。这条决定了本卡适用域的写法。
superseded_by: branes.d-brane-bps-no-force-v2
tags: [d-brane, bps, no-force, cylinder-amplitude, ns-ns, r-r, type-ii]
notes: |
  【为什么把例外写进 statement】抽取记录 Q8 明令：若图里要建「BPS ⇒ 无力」的一般命题，
  (13.4.23) 后的例外必须写进限定，否则该卡是错的。本卡因此把命题收窄到 #ND = 0 的平行构型，
  并把一般规则明列为「不断言」。

  【BPS 链（lead 指示 2026-09-11，依 appB 抽取 §5-B / Q3）】
  susy.bps-bound-point-particle-d4（App. B (B.2.36)–(B.2.39)，**仅点粒子荷**）
  → susy.brane-charges-in-susy-algebra（§13.2 (13.2.9)，原书自承「still not complete」）
  → 本卡（「its energy is determined only by its charge and **is independent of** the separations」）。
  ⚠ 上行的逐字句于 2026-09-11 订正：旧 notes（与抽取记录 E16 旧行）漏抄 "is independent of"，
  语义恰好反转成「能量由荷**与间距**共同决定」。原句说的是能量**与间距无关**，
  即无力性本身的同义说法（auditor 一手核 p.146 发现，researcher 独立复核，抽取记录 `-ch13.md` §7.1）。
  这也是本卡推导里 susy.brane-charges-in-susy-algebra 一边维持 `inferred: true` 的理由（auditor rulings-3）。
  本卡**不**直接依赖 App. B：(B.2.39) 只对点粒子荷（p. 448 逐字），不得整体挂在 D 膜的 BPS 界上。
  branes.d-brane-bps-half-susy 是 (13.2.9) 的上游（原书顺序：(13.2.5) → (13.2.7) → (13.2.9)）。

  【本卡是两张下游卡的输入】
  - branes.d-brane-rr-charge-value：用 (13.3.2) 把 R–R 交换与场论 (13.3.6) 对照得 μ_p² = e^{2Φ₀}τ_p²；
  - branes.d-brane-tension 的推导**不**依赖本卡（只用 NS–NS 侧 (13.3.1) 与 (13.3.3)）。

  【去重（2026-09-11）】上面 BPS 链里的两张卡曾被并行重复建卡；lead 裁决保留 `susy.*` 版，
  `branes.*` 两版已标 `superseded_by`，本 notes 与本卡推导的边均已改指 susy.*。

  ★【(13.3.1) 的完整前缀：抽取记录 Q3 已关闭（curator，2026-09-11，依 researcher §7.3）】
  完整式为
    A_NS–NS ≈ [iV_{p+1}·4×16 / (8π(8π²α')⁵)] ∫_0^∞ (π dt/t²)(8π²α't)^{(9−p)/2} exp(−t y²/2πα')
          = iV_{p+1}·2π(4π²α')^{3−p} G_{9−p}(y)                                     (13.3.1)
  旧转录漏了**被积测度里的 π**，这正是 Q3「π 幂次差一次」的成因；补上后把第一行积出来与第二行逐位比对，
  **2、π、α' 三者幂次同时闭合**；分母是 (8π²α')⁵（α' 一次方，页图直接读到）。
  ⚠ 本卡陈述仍只用 (13.3.1) 的**末行**，完整前缀只进 notes 与推导 summary，故**不换代**。
  ⚠ 陈述「本命题不断言 (4)」括号里的「页图读数与复算相差一个 π 的幂」**已过时**（那个 π 在测度里）；
  按原则 1 不就地改陈述文本，该括号留待本卡下次实质换代时删去；不断言 (4) 本身仍然成立。

  【与 §10.8 的关系】(13.3.1) 是 (10.8.4) 的修改版。**已解决（2026-09-11）**：本卡推导已加非 inferred 边
  depends_on worldsheet.type-i-tadpole-cancellation-so32（抽取记录 Q5 末段把这条边交 curator 判断，
  判为**要建**，因为它是技术性而非叙事性的公式依赖）。只借用该卡推导里的圆柱振幅 (10.8.4)，
  **不借用** (n ∓ 32)² / SO(32) 结论；本推导最弱的一环 (13.3.2) 也不因这条边而变强。

  ★★【2026-09-11 换代为 branes.d-brane-bps-no-force-v2（curator, small-backlog-7）】
  换代理由是**拆卡**，不是纠错：本卡 statement 同时断言 (13.3.1)（NS–NS 长程形式）与
  (13.3.2)（R–R 与 NS–NS 相消 ⇒ 无力），而原书对这两件的论证强度不同——前者是显式计算
  （抽取记录 §7.3 已复算闭合），后者是「Due to supersymmetric cancellation in the trace」的断言
  （R–R 侧的圆柱振幅从未被显式算出）。
  (13.3.1) 已独立为 branes.d-brane-cylinder-long-distance-ns-ns；
  v2 只保留 (13.3.2) 并 depends_on 那张新卡。
  本卡的唯一推导 --via-cylinder-ns-ns-rr-cancellation 已 `git mv` 改指 v2；
  (13.3.1) 的计算部分移入新卡的推导，相消那一半原样适用于 v2。
  故本卡自换代起**无推导**；同时唯一一条活边
  （branes.d-brane-rr-charge-value--via-rr-exchange-field-theory-matching）已改指 v2，
  故不触发「依赖已换代且无推导的命题」这条 validate error。
