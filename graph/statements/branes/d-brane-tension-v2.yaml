id: branes.d-brane-tension-v2
kind: proposition
title: Dp 膜的张力：τ_p² = (π/κ²)(4π²α')^{3−p}，显式 τ_p = 1/(g (2π)^p α'^{(p+1)/2})（v2：T 对偶递推改挂在 (13.3.23) 之后）
statement: |
  type II 超弦中 Dp 膜（branes.d-brane-bps-half-susy）的张力 τ_p 满足
    **τ_p² = (π / κ²) (4π²α')^{3−p}**,                                    (13.3.4)
  其中 κ 是**物理测得**的十维引力耦合（依赖 dilaton 背景）。
  原书在 (13.3.4) 之后只写了一句「This satisfies the same T-duality relation as in the bosonic
  string.」，**没有写出那条关系式**。
  在 g ≡ τ_F1/τ_D1 与 κ² = ½(2π)^7 g² α'^4 的约定（conv.string-coupling-tension-ratio）下显式为
    **τ_p = 1 / ( g (2π)^p α'^{(p+1)/2} ) = (2κ²)^{−1/2} (2π)^{(7−2p)/2} α'^{(3−p)/2}**.   (13.3.23)
  特别地 τ_0 = 1/(g α'^{1/2})，τ_1 = 1/(2π g α')，τ_F1/τ_D1 = g。
  **由 (13.3.23) 得**（相邻两个 p 相除，(2π)^p 与 α'^{(p+1)/2} 各降一阶）：
    τ_p / τ_{p−1} = 1 / (2π α'^{1/2}) = (4π²α')^{−1/2}，
  这就是原书那句话所指的、与玻色弦相同的 T 对偶递推。

  **本命题不断言**：
  (a) R–R 荷 μ_p 的值（branes.d-brane-rr-charge-value）；
  (b) 膜上规范耦合 g²_{Dp} = 1/((2πα')² τ_p)（(13.3.25)，需要 DBI 作用量的展开，本图未建卡）；
  (c) (13.3.1) 圆柱振幅的完整前缀系数（页图读数与复算相差一个 π 的幂，见 notes）；
  (d) 「(13.3.4) 本身蕴含那条递推」——本卡的递推是由 (13.3.23) 得的，不是由 (13.3.4) 得的
      （(13.3.4) 给的是 τ_p²，其相邻比是 (4π²α')^{−1/2}，与 (13.3.23) 一致，但原书不在那里写）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.string-coupling-tension-ratio]
sources:
  - ref: polchinski-1998-v2
    loc: "§13.3, eq. (13.3.4)，p. 146（τ_p²；其后逐字「This satisfies the same T-duality relation as in the bosonic string.」）；§13.3「Coupling constants」, eq. (13.3.23)，p. 150（显式 τ_p 的两种写法）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E17、#E22，证据等级 L1（原书页图）。
      抽取者已独立复算：(13.3.4) 与 (13.3.22)+(13.3.23) 逐位自洽；(13.3.23) 两种写法互验通过（§0.3(a)）。
      ⚠ 原书说「the same T-duality relation as in the bosonic string」但**不写出该关系**；
      Vol.1 §8.7 的递推 τ_p = τ_{p−1}/(4π²α')^{1/2}（polchinski-1998-v1#E156，二手源）
      与本章 (13.3.23) 给出的 τ_p/τ_{p−1} = 1/(2πα'^{1/2}) 相同（抽取记录 Q7 已验，不是矛盾）。
      ★ (13.3.1) 的完整前缀与被积测度已由抽取记录 §7.3（researcher 独立 L1 页图 + 三重幂次复算，2026-09-11）定案，
      Q3 关闭；详见 notes。
tags: [d-brane, tension, type-ii, string-coupling, t-duality]
notes: |
  ★★【v2 改了什么（curator，2026-09-11，依 reviewer-branes）】
  **只改了 T 对偶递推式在陈述里的位置与归属，公式本身一字未改。**
  v1 把 τ_p/τ_{p−1} = 1/(2πα'^{1/2}) 紧接在 (13.3.4) 之后写成「它满足与玻色弦相同的 T 对偶递推」，
  读起来像原书在 (13.3.4) 旁写了该式；实际上原书那里**只有一句话**
  「This satisfies the same T-duality relation as in the bosonic string.」，**不给式子**。
  v2 把该式移到 (13.3.23) 之后并标明「由 (13.3.23) 得」——那是本图能在原书里落到式号的唯一出处
  （(13.3.23) 的 τ_p = 1/(g(2π)^pα'^{(p+1)/2}) 相邻相除即得）。
  ⚠ 数值内容完全不变；改的是**归属**（哪一步是原书写的、哪一步是本图算的）。
  ⚠ Vol.1 §8.7 的玻色弦递推 τ_p = τ_{p−1}/(4π²α')^{1/2} 只有二手源
  （polchinski-1998-v1#E156），本卡**不**以它为根据，只在 sources 的 note 里记「两者一致」。

  【与 Vol.1 §8.7 的关系】玻色弦 D 膜张力 (8.7.26) 在本图无卡
  （polchinski-1998-v1#E156 是二手源，且 branes.dbi-action-is-born-infeld-type 明令不写张力）。
  本卡是本图第一张给出 τ_p 数值的卡，且只对 type II 超弦。

  ★【(13.3.1) 的完整前缀：抽取记录 Q3 已关闭（curator，2026-09-11，依 researcher §7）】
  `-ch13.md` §7.3 用独立 L1 页图（印刷 p.146 = PDF p.11）复核出旧转录**漏了被积测度里的 π**，完整式为
    A_NS–NS ≈ [iV_{p+1}·4×16 / (8π(8π²α')⁵)] ∫_0^∞ (π dt/t²)(8π²α't)^{(9−p)/2} exp(−t y²/2πα')
          = iV_{p+1}·2π(4π²α')^{3−p} G_{9−p}(y)                                     (13.3.1)
  （分母是 (8π²α')⁵，α' **一次方**，本轮页图直接读到；旧记录「页图读作 α'²」判为嵌套上标的读图失真，
  与 -sec10-8.md#Q1「α'² 是系统性假象」的裁定一致，这是第三条证据。）
  抽取者把第一行积出来与第二行逐位比对：**2 的幂、π 的幂、α' 的幂三者同时闭合，无残留因子**（§7.3(b)）；
  去掉测度里的 π 则两行相差 1/π（对任意 p 都不为 1）⇒ π 必须在测度里。
  ⇒ **Q3 两半（α' 幂次与 π 幂次）全部关闭**，「前缀不进任何节点」的限制解除。
  ⚠ 本卡陈述仍只用 (13.3.1) 的**末行**（它另被 (13.3.3)+(13.3.4) 独立背书：2iκ²τ_p² = 2iπ(4π²α')^{3−p}）；
  完整前缀只记在本 notes 与推导 summary 里，**不**进陈述——故本卡不换代。
  ⚠ 陈述「本命题不断言 (c)」括号里的「页图读数与复算相差一个 π 的幂」**已过时**（那个 π 在测度里）。
  按原则 1 不就地改陈述文本，该括号留待本卡下次实质换代时删去；不断言 (c) 本身（本卡不给出前缀）仍然成立。
  ⚠ §7.3 的两处读数与旧轮页图判读冲突，真正的根据是三重幂次同时闭合的复算，不是像素；
  若日后有更高分辨率页图或官方勘误表，以那个为准。

  【与 spectrum.gravitational-coupling-kappa 的关系】那张卡的 κ = πα'g'_c 是 D = 26 玻色弦的量，
  与本卡十维的 κ 不是同一个归一化，不得互相代入。
