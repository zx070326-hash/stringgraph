id: swampland.wgc-sharp-form-i
kind: proposition
title: "AMNV sharp 版 (I)：最小荷态满足 M_{q_min}/q_min ≤ 1（已被作者本人反驳）"
statement: |
  Arkani-Hamed–Motl–Nicolis–Vafa 2006 §3 (p.10) 的三个 sharp 版本之一，逐字（M_Pl = 1 单位）：

    "Working in M_Pl = 1 units, we are making a conjecture about mass/charge ratios
       (M/Q) ≲ 1    (19)
     To find a sharper conjecture, we have to decide (a) what states should satisfy this bound
     and (b) what to mean by "1". For the last point, it is natural to take the (M/Q) ratio that
     is equal to one for large extremal black holes. As for the states to consider, there are
     three natural possibilities:
       (I)   (M_{q_min}/q_min) ≤ 1,   for the state of minimal charge;"

  即：**最小电荷的态**的质荷比 ≤ 大极端黑洞的质荷比。

  原文对三个版本共同的前提（逐字）："Of course, for these statements to have a sharp meaning,
  the state must be exactly stable for M to be meaningful."，并立刻指出最小荷态未必稳定
  （电荷 +1 的重粒子可衰变为 −2 与 +3 的轻粒子，其 Kepler/Coulomb 束缚态的 M/Q 可能大于 1）。

uses_conventions: [conv.extremality-normalization]
sources:
  - ref: arkani-hamed-2006
    loc: "arXiv:hep-th/0601001v2, §3, (I)（在 eq. (19) 之后，(I)(II)(III) 本身不占用 (1)–(30) 的编号）, p.10"
tags: [swampland, weak-gravity, refuted, amnv]
notes: |
  from: arkani-hamed-2006#E18、#E19（另见 #U6）。

  【本条已被作者本人反驳】见 swampland.wgc-sharp-form-i--via-so32-spinor（kind: refutation）。
  按 docs/STATUS_LEVELS.md，proposition 的状态由推导计算，故此处只作指引，不写 status。

  【"Weak Gravity Conjecture"这个名字不出自本文】id 前缀 wgc- 只是本项目的记号（#Q3）。

  【★ 反驳在适用域内，故 effective = refuted】反例是弱耦合 SO(32) 杂化弦的 SO(32) 旋量与
  Wen–Witten 的半整数荷缠绕弦——**都在弦论紧化里，有引力、Planck 质量有限**，即猜想的适用域
  被满足。这与 Ooguri–Vafa §3.2 的"引力解耦反例"性质完全不同（后者前提不满足，不构成反驳，
  见 swampland.finiteness-criteria-fail-without-gravity）。

  【★ 2026-09-11 补正：反驳只靠 SO(32) 旋量那一支】researcher 取到 Wen–Witten NPB 261, 651 (1985)
  的**逐字摘要（L2）**，结论是否定的：摘要讲 O(10)/E₆ 被 Wilson 线破缺时的最小磁荷与分数电荷，
  **没有 winding、没有 half-integral、没有 stable、没有 mass 任何一词，设定也不是 SO(32)**。
  ⇒ AMNV 那句"half-integrally charged winding strings considered by Wen and Witten"是 **AMNV 的
  刻画**，本项目未在一手材料中证实。图中已把 wen-witten-1985 从
  swampland.wgc-sharp-form-i--via-so32-spinor 的 sources 移入其 notes/gaps，**不建依赖边**。
  **反驳本身不受影响**：AMNV 对 SO(32) 旋量那一支不引任何文献，该支自足。
  SO(32) 谱的一手来源应是 Polchinski Vol.2 §11（相应节点待 agent/curator/polchinski-v2-ch11
  合并后补边）。

  【转录风险】(I) 与 (II) 的下标在页图上是嵌套下标（M_{q_min}、q_{M_min}），纯文本转录易互换；
  引用前须回原页图复核（PDF 第 11 页；抽取记录 #U6）。

  【(19) 未建独立节点】eq. (19) 的 (M/Q) ≲ 1 **没有指定对哪个态**，原文自己说要先"decide (a)
  what states should satisfy this bound"才能变精确。把它建成 proposition 会产生"(19) 是否被
  (I) 的反例反驳"这种无法回答的记账问题（抽取记录 #Q5）。故本图只建 (I)/(II)/(III) 三卡，
  (19) 的原文只作为本卡与另两卡 statement 中的引文出现。
