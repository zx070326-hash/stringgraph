    loc: "arXiv:hep-th/0605264v1, §3.2, Example b), p.11–p.12（本段公式无编号）"
tags: [swampland, n2-supersymmetry, curvature, rigid-limit, gravity-decoupling]
notes: |
  from: ooguri-vafa-2006#E23（另见 #U5、#Q2）。

  【换代原因】本卡取代 swampland.rigid-n2-vector-moduli-ricci-positive（v1）。v1 照抄原文
  断言无条件"正定"且未写出前提 Im τ > 0。reviewer-swampland（2026-09-11）独立重算确认恒等式，
  但指出缩并后 v^i v̄^j R_{ij̄} = ¼‖g^{−1/2}A(v)g^{−1/2}‖²（A(v)_{nm} = v^i∂_iτ_{nm}）一般只是
  **半正定**：τ 为常数（自由理论）时 R ≡ 0。故 v2 加前提 Im τ > 0、把结论改为"半正定，非退化时
  严格正定"。

  【原文措辞被说强了】"which is manifestly positive definite" 中 "manifestly" 只支持半正定
  （表达式是平方和形式）；严格正定需要额外的非退化条件，原文未提。这是本图的判定，不是原文。

  【status = physical-argument，理由】纯数学部分（恒等式 + 半正定 + 严格正定的充要条件）已拆为
  math.holomorphic-prepotential-ricci-semi-positive（rigorous，reviewer 复核）。本卡多出来的是
  **物理输入**："4d 全局 N=2 向量多重态模空间的度规就是全纯 pre-potential 的虚部 Im ∂∂F"，以及
  它由局部 N=2 经 M_Pl → ∞ 得到（原文引 [17] de Wit–Van Proeyen，本项目未抽取）。这一步是
  物理论证，故本卡的推导取 physical-argument。

  【★ 转录风险（复核前必读）】原文式 F(z) = (i/8)M_Pl² + F(z) 中左右两个 F 是**不同的量**
  （花体 F = 引力理论的 pre-potential，直体 F = 刚性极限的），页图上字体可区分，纯文本转录后
  丢失。**复核必须回原页图**（抽取记录 #U5）。本卡 statement 中的相应公式已按纯 ASCII 转写，
  同样须回原页核对。

  【★ 原文编号误植】末句 "the conjecture 2 can be violated" 按内容应为 **conjecture 3**
  （曲率）。这是本项目的判定，非原文（抽取记录 #Q2；同型误植在 §3.1 Example v 有两处）。

  【本卡不反驳任何猜想】它发生在 M_Pl → ∞ 的引力解耦极限，**不在**
  swampland.applicability-domain 的适用域内，因此挂到
  swampland.finiteness-criteria-fail-without-gravity，**不是** Conjecture 3 的 refutation。
  结论减弱为半正定后这一点不变：半正定（含 R = 0 的自由理论）同样与"带引力时曲率为负"对立。
