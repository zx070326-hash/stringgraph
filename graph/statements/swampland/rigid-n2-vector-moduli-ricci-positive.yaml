id: swampland.rigid-n2-vector-moduli-ricci-positive
kind: proposition
title: 全局 N=2 理论中向量多重态模空间的 Ricci 曲率正定（引力解耦极限）
statement: |
  断言：在 4 维**全局**（非引力）N=2 超对称理论中，向量多重态模空间的 Ricci 曲率**正定**。

  Ooguri–Vafa 2006 §3.2 Example b（p.11–p.12）的原文，逐字（⚠ 原文排印错误
  "supsersymmetries"，照抄）：

    "We saw in the example v in section 3.1 that, in theories with local N = 2
     supsersymmetries, the sign of curvature of vector multiplet moduli may be indefinite, but
     the scalar curvature becomes strictly negative near infinite distance singularities.
     On the other hand, it is straightforward to see that, in non-gravitational theories with
     global N = 2 supersymmetry, the Ricci curvature of the vector multiplet moduli space is
     positive definite. In this case, the metric can be written as
       g_{ij-bar} = Im tau_{ij},      tau_{ij} = d_i d_j F(z),
     where F(z) is the pre-potential. The Ricci curvature then is
       R_{ij-bar} = - d_i d-bar_j log det g
                  = (1/4) g^{kl-bar} g^{mn-bar} (d_i tau_{km})(d-bar_j tau-bar_{l-bar n-bar}),
     which is manifestly positive definite. The essential step is to use the fact that
     g_{ij-bar} is the imaginary part of tau_{ij}, which is holomorphic in z."

  原文接着给出刚性极限的取法（K = −log(4F − 4F̄ + z̄^i ∂_i F − z^i ∂̄_i F̄)，
  F(z) = (i/8)M_Pl² + F(z)，令 M_Pl → ∞），并下结论（逐字，⚠ 编号误植见 notes）：
  "This shows how the conjecture 2 can be violated by taking the decoupling limit M_Pl → ∞."
