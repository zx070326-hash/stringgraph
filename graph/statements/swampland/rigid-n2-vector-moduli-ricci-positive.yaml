notes: |
  【已换代】本卡断言无条件"正定"且未写出前提 Im τ > 0。reviewer-swampland（2026-09-11）
  独立重算确认恒等式，但指出缩并后一般只得**半正定**（τ 常数的自由理论给 R ≡ 0）。
  现行卡为 swampland.rigid-n2-vector-moduli-ricci-positive-v2；纯数学部分拆为
  math.holomorphic-prepotential-ricci-semi-positive（rigorous）。本卡与其推导保留不动。

  from: ooguri-vafa-2006#E23（另见 #U5、#Q2）。

  【status = physical-argument（rigorous 例外候选，待复核）】原文对这一段用的是
  "it is straightforward to see"、"which is manifestly positive definite"、"This shows how"，
  **是本文最接近严格论证的一段**：前提写全了（g = Im τ，τ 全纯），计算是有限步复几何。
  按 docs/STATUS_LEVELS.md 的 lead 裁决（2026-09-10），此类"前提完整 + 有限步初等计算"在
  **reviewer 独立复核并留 `reviewer-verified` 记录后**可标 rigorous；**缺此记录一律
  physical-argument**。本轮无复核记录，故取 physical-argument。
  => **建议 reviewer 复核 R_{ij̄} = ¼ g^{kl̄}g^{mn̄}(∂_iτ_{km})(∂̄_jτ̄_{l̄n̄}) 这一步**，
  复核后可把 --via-holomorphic-prepotential 升为 kind: proof / status: rigorous。

  【★ 转录风险（复核前必读）】原文式 F(z) = (i/8)M_Pl² + F(z) 中左右两个 F 是**不同的量**
  （花体 F = 引力理论的 pre-potential，直体 F = 刚性极限的），页图上字体可区分，纯文本转录后
  丢失。**复核必须回原页图**（抽取记录 #U5）。本卡 statement 中的相应公式已按纯 ASCII 转写
  （d 表示偏导，tau 表示 τ），同样须回原页核对。

  【★ 原文编号误植】末句 "the conjecture 2 can be violated" 按内容应为 **conjecture 3**
  （曲率）。这是本项目的判定，非原文（抽取记录 #Q2；同型误植在 §3.1 Example v 有两处）。

  【本卡不反驳任何猜想】它发生在 M_Pl → ∞ 的引力解耦极限，**不在**
  swampland.applicability-domain 的适用域内，因此挂到
  swampland.finiteness-criteria-fail-without-gravity，**不是** Conjecture 3 的 refutation。
