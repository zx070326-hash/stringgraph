id: swampland.heterotic-t6-extremal-nonrotating-mass-formulas
kind: proposition
title: "杂化弦 on T⁶ 的非转动极端黑洞：Case I/II/III 的三条质量-电荷关系（Sen (2.56)(2.60)(2.64)）"
statement: |
  **设定（这一段是陈述的一部分，不是注释）。**
  杂化弦紧化在六维环面 T⁶ 上，四维无质量场为度规 G_{μν}、反对称张量 B_{μν}、28 个 U(1) 规范场
  A^{(a)}_μ、伸缩子 Φ 与 28 × 28 标量矩阵 M（满足 MLM^T = L、M^T = M，L = diag(−I₂₂, I₆)），
  有效作用量取 Sen (2.3)（其整体常数 **C 作者自述任意、可吸收进 Φ**）。
  考虑对 Kerr 解 (2.23) 作 O(7,23) 变换所得的 28 参数带电转动黑洞解 (2.29)–(2.37)，
  其守恒量由 (2.38)–(2.40) 给出

      M = ½ m (1 + cosh α cosh β)
      J = ½ m a (cosh α + cosh β)
      Q^{(a)} = (m/√2) sinh α cosh β · n^{(a)}        (1 ≤ a ≤ 22)
              = (m/√2) sinh β cosh α · p^{(a−22)}     (23 ≤ a ≤ 28)

  其中 n⃗ 是 22 维单位矢、p⃗ 是 6 维单位矢，α、β、n⃗、p⃗ 与 Kerr 参数 m、a 共 28 个参数；
  并按 (2.42) 定义 Q⃗_{L/R} := ½(I₂₈ ∓ L) Q⃗，于是 **Q⃗_L 是 22 维矢量、Q⃗_R 是 6 维矢量**。

  **前提。**
  (P1) **非转动**：a = 0，因而由 (2.39) 得 J = 0。
  (P2) **极端极限按 Sen 对 a = 0 的取法**：`m → 0` 且**保持 (2.38) 的物理质量 M 固定**
       （原文逐字："The extremal limit corresponds to the case when the horizon approaches the
       singularity, i.e. `m → 0` keeping the physical mass `M` defined in eq.(2.38) fixed."）。
  (P3) **归一化按 Sen 的隐含读数**：原文**不声明 α'、G_N、M_Pl 中的任何一个**；M 与 Q 都从解的
       渐近行为读出，即 `g^E_tt → −(1 − 2M/ρ)`（等价于 G_N = 1）与 `F^{(a)}_{ρt} → Q^{(a)}/ρ²`
       （无 1/4π 因子，故与 (2.3) 的任意常数 C 无关）。
       ⚠ **这两条读数规则原文没有写出**，是抽取者由 (2.30)+(2.37) 与 (3.6)–(3.8) 复算的；
       详见 conv.sen-1995-normalization 的 notes 与本卡推导的 gaps。

  **命题。** 在 (P1)(P2)(P3) 下，按 α 与 β 的大小关系分三种情形，各自的极限取法与结果为：

  **Case I（α > β）**：取 `m → 0, α → ∞, m cosh α ≡ m₀` 有限、`β` 有限 (2.54)。则 (2.55)
      M = (m₀/2) cosh β，Q⃗_L = (m₀/√2) cosh β · n⃗，Q⃗_R = (m₀/√2) sinh β · p⃗，
  从而 (2.56)

      **M² = ½ Q⃗_L²**  且  **Q⃗_R = √2 M tanh β · p⃗** ，

  故 **Q⃗_R² < Q⃗_L²**（原文逐字 "Thus here `Q⃗_R² < Q⃗_L²`."）。

  **Case II（α < β）**：取 `m → 0, β → ∞, m cosh β ≡ m₀` 有限、`α` 有限 (2.58)。则 (2.59)
      M = (m₀/2) cosh α，Q⃗_L = (m₀/√2) sinh α · n⃗，Q⃗_R = (m₀/√2) cosh α · p⃗，
  从而 (2.60)

      **M² = ½ Q⃗_R²**  且  **Q⃗_L = √2 M tanh α · n⃗** ，

  故 **Q⃗_L² < Q⃗_R²**（原文逐字 "In this limit `Q⃗_L² < Q⃗_R²`."）。

  **Case III（α = β）**：取 `m → 0, α = β → ∞, m cosh²α ≡ m₀` 有限 (2.62)。则 (2.63)
      M = m₀/2，Q⃗_L = (m₀/√2) n⃗，Q⃗_R = (m₀/√2) p⃗，从而 (2.64)

      **M² = ½ Q⃗_L² = ½ Q⃗_R²** 。

  三种情形的视界面积在极限下都趋于零（(2.57)(2.61)(2.65)），表面引力分别趋于
  (1/4M)cosh β、(1/4M)cosh α、∞。

  **本卡不断言：**
  (a) 这些解饱和或不饱和 Bogomol'nyi 界、是否超对称——那是 swampland.heterotic-t6-bps-bound
      加 Sen p.11 的分类，不在本卡；
  (b) `J ≠ 0`（转动）极端黑洞的任何性质；
  (c) 这些 Q 与任何电荷格、量子化条件或偶自对偶性的关系——**Sen 全文没有**，只在 p.4 提了一句
      「28 维电荷格 Λ 存在」并引 Narain；
  (d) 本卡的 (M, Q⃗_L, Q⃗_R) 与 Arkani-Hamed–Motl–Nicolis–Vafa 2006 eqs. (22)(23) 的
      (M, Q_L, Q_R) 是同一归一化下的同一批量——**那个桥在两篇原文中都不存在**（见 notes）；
  (e) 解 (2.29)–(2.37) 本身的正确性——Sen 只说 "a straightforward algebraic exercise"、不展示过程；
      本图没有对应的解卡，缺口记在推导的 gaps。
