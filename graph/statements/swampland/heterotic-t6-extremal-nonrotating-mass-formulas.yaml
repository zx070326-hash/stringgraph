notes: |
  from: literature/extractions/sen-1995-bh-torus.md E4–E9、§1.1–§1.4、§5.1–§5.2。

  【★ 为什么单独建这张卡】swampland.heterotic-t6-substates-below-extremality（及其 v2）此前把
  「极端黑洞 M² = ½Q_R² / M² = ½Q_L²」只当作 AMNV (22)(23) 的转述来用，一手出处
  **sen-1995-bh-torus 当时只有篇级 loc（L0）**。本卡把 Sen 的原始三条关系（含 Sen 自己的前提）
  独立落图，使 AMNV 侧与 Sen 侧成为两张可分别审计的卡。

  【★★ AMNV 丢掉了 Sen 的两个前提 —— 本卡的主要存在理由】
  AMNV §4 只写 "The extremal black hole solutions in this theory were constructed by Sen [8]"，
  **(P1) a = 0 与 (P2) m → 0 保 M 固定这两个前提一个都没写**。而 Sen p.11 逐字：
  「Also for non-zero `J`, eqs.(2.38)-(2.40) shows that `M²` is always larger than `(Q⃗_R²/2)`,
  even in the extremal limit `a → m`. This shows that **the extremal black holes carrying
  non-zero angular momentum do not correspond to supersymmetric solutions.**」
  ⇒ **凡引用 (2.56)/(2.60) 的节点必须带 J = 0。**

  【★★ 与 AMNV (22)(23) 的对应关系，以及那座不存在的桥】
  逐字对应（抽取记录 E8 的结论）：
    **AMNV (22) `M² = ½Q_R²`（BPS） = Sen (2.60)（Case II）**；
    **AMNV (23) `M² = ½Q_L²`（非 BPS） = Sen (2.56)（Case I）**；
    AMNV 的 `Q_R² − Q_L² > 0` ⟺ Sen 的 `α < β`；`Q_L² − Q_R² > 0` ⟺ `α > β`。
  ⚠ **但两边的归一化无法闭合**：AMNV 自称 `M_Pl = 1`、`α' = 4`（后者只用于其弦谱 (24)），
  Sen **一个都不声明**；Sen 的 Q 是连续参数 (2.40)、从不与格点归一化挂钩，AMNV 的 Q 受其 (21)
  的偶自对偶格条件约束。**「Sen 的 Q_R」=「AMNV 的 Q_R」这一步在两篇一手文献里都没有依据**
  （详见 conv.sen-1995-normalization 的 notes）。⇒ 凡画这座桥的边必须 `inferred: true`。

  【★ AMNV 没有引用 Case III】AMNV 的 (22)(23) 用**严格**不等号 `Q_R² − Q_L² > 0` /
  `Q_L² − Q_R² > 0` 划分，**恰好把 `Q_L² = Q_R²` 排除在外**；该情形是 Sen 的 Case III (2.64)，
  本卡把它一并收录。

  【★ 不要挂 α' 约定卡】Sen 全文不出现 α'，给本卡挂任何 α' 族约定都是凭空造约定
  （conv.sen-1995-normalization 是**另一篇** Sen 1995 = hep-th/9504147 的 α' = 16、G_N = 2，
  **与本卡无关**；conv.amnv-2006-units 是 AMNV 的 α' = 4、M_Pl = 1，也不是本卡的）。
  本卡只声明 **conv.metric-mostly-plus**：号差由 (2.21) `(G_{μν})_{as} = η_{μν}` 与 (2.23) Kerr
  解首项 `−[…]dt²` 读出，**该读出同样是抽取者复算**，但结论与本图 canonical 一致，引用无需换算。

  【建议的后续卡（本轮未建，交 lead 排期）】
  (1) `swampland.heterotic-t6-general-rotating-charged-solution`（28 参数解本身，(2.29)–(2.37)，
      physical-argument，Sen "straightforward algebraic exercise" 不展示）；
  (2) `swampland.heterotic-t6-rotating-extremal-not-susy`（J ≠ 0 的极端黑洞从不饱和 BPS 界，p.11）；
  (3) Lean 岛候选 S1：三种极端极限的代数一致性（`M² = ½Q_L²`、`Q_R² = Q_L² tanh²β ≤ Q_L²`），
      见抽取记录 §5.4。**不要**与 AMNV 的格条件 `Q_L² − Q_R² ∈ 2Z` 合并成一条（来源不同）。

  【查重】`uv run stringgraph search 极端黑洞 / 杂化 / Bogomol` 只命中 AMNV 一系的 swampland 卡与
  两张 BPS 界（d = 4 点粒子）卡，无同内容者。
