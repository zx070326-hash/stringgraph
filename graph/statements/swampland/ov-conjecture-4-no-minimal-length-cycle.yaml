id: swampland.ov-conjecture-4-no-minimal-length-cycle
kind: proposition
title: "Ooguri–Vafa Conjecture 4：模空间中给定同伦类内不存在最小长度的非平凡 1-cycle"
statement: |
  Ooguri–Vafa 2006 §2 (p.4) 的 Conjecture 4，逐字：

    "Conjecture 4: There is no non-trivial 1-cycle with minimum length within a given homotopy
     class in M."

  原文给出两条动机，**结论强度不同**：
  (a) Teichmüller 商 / 不动点论证（p.4，逐字节选）："Suppose M is obtained from dividing a
      contractible Teichmüller T space by a group action Γ … If Γ is indeed generated by
      elements with fixed points, then π₁(M) would be trivial … thus making M simply connected.
      Clearly in this case there is no 1-cycle of minimum length."  => 给出 M 单连通（强）。
  (b) 全局荷 / 无毛定理论证（p.5，逐字节选）："If there is a non-trivial 1-cycle in M with
      minimum length, we can use it to define a state with a non-zero global charge by going
      over the corresponding path on the circle. Since there are no global charges in a
      gravitational theory (to be consistent with no-hair theorems for black holes), this cannot
      happen. This suggests that at least the center of π₁ is trivial."  => 只给出 π₁ 的中心平凡（弱）。

  原文由本条得到的推论（p.5，逐字）："Conjecture 4 suggests there is a partner to the axion. …
  the conjecture 4 would require that there exists another direction where S¹ shrinks to a point,
  *i.e.* a radial partner to the axion."（⚠ 原文 "and its has a compact moduli space" 的 "its"
  系排印错误，应为 "it"。）

  适用域见 swampland.applicability-domain。
uses_conventions: [conv.moduli-metric-planck-units]
sources:
  - ref: ooguri-vafa-2006
    loc: "arXiv:hep-th/0605264v1, §2, Conjecture 4, p.4–p.5（含两条动机与轴子伴侣推论）"
tags: [swampland, conjecture, moduli-space, topology, fundamental-group, ooguri-vafa]
notes: |
  from: ooguri-vafa-2006#E12（另见 #E16、#E18、#E19、#E25）。

  【措辞强度在两处不同】摘要用 "We also propose that there is no non-trivial 1-cycle of minimum
  length in the moduli space"，正文标题是 "Conjecture 4"。本卡以正文为准。

  【两条动机的结论强度不同，故是两条独立推导】不动点论证给"M 单连通"，全局荷论证只给
  "π₁ 的中心平凡"——原文自己指出了这个差距（"at least the center of π₁ is trivial"）。

  【轴子径向伴侣未单独建卡】它是本条加上"瞬子尺度可与 Planck 尺度分离"这一前提的推论
  （摘要称 "prediction"）。本轮不建，前提在原文里是条件句（"If we can separate the scale of
  the instanton effects from those at the Planck scale"）。

  【本条在引力解耦时被明确违反】§3.2 Example d（T² 上的 D5 膜，模空间 R⁴×T²）与 §3.2 开头的
  G/H 例子都违反本条，但**都在引力解耦极限**，不在适用域内 =>
  挂到 swampland.finiteness-criteria-fail-without-gravity，**不是**本条的 refutation。
