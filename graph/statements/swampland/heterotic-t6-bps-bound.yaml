id: swampland.heterotic-t6-bps-bound
kind: proposition
title: "杂化弦 on T⁶ 的 Bogomol'nyi 界 M² ≥ Q⃗_R²/2（Sen 的归一化约定下；Sen 外包给 [24][25]，本文不证）"
statement: |
  **设定（这一段是陈述的一部分，不是注释）。**
  杂化弦紧化在六维环面 T⁶ 上，四维无质量场谱与有效作用量取 Sen (2.1)–(2.5)
  （28 个 U(1) 规范场 A^{(a)}_μ，L = diag(−I₂₂, I₆)，作用量整体常数 C 作者自述任意）。
  电荷按 (2.42) 分解为 `Q⃗_{L/R} := ½(I₂₈ ∓ L) Q⃗`，于是 **Q⃗_L 是 22 维、Q⃗_R 是 6 维矢量**。
  质量 M 与电荷 Q^{(a)} 按 Sen 的隐含读数取（`g^E_tt → −(1 − 2M/ρ)`，`F^{(a)}_{ρt} → Q^{(a)}/ρ²`；
  原文**不声明 α'、G_N、M_Pl 中的任何一个**，这两条读数规则是抽取者复算的，见 gaps）。

  **命题（Sen p.11 逐字，无式号）。**

      "In the normalization convention that we have been using, the Bogomol'nyi bound that
       follows from the space-time supersymmetry of the theory, is given by

           M² ≥ (Q⃗_R²/2)   [24, 25]."

  即：在上述归一化下，该理论中任何（渐近平坦的）态的质量满足 **M² ≥ ½ Q⃗_R²**。

  **本卡明确记录的三件事：**
  (i) **这条界是 Sen 从外部引入的，本文不给任何推导**——原文把它整体外包给
      `[24]`（Gibbons–Hull, Phys. Lett. B109 (1982) 109；Harvey–Liu, Phys. Lett. B268 (1991) 40；
      Kallosh–Linde–Ortín–Peet–Van Proeyen, Phys. Rev. D46 (1992) 5278）
      与 `[25]`（A. Sen, Mod. Phys. Lett. A8 (1993) 2023）。
      **本项目这几篇一篇都没有登记、没有核实**（见 gaps）。
  (ii) **"In the normalization convention that we have been using" 是 Sen 全文关于归一化的唯一自述**
      ——他承认结论依赖归一化，但**通篇没有把这套约定写成 α'/G_N/M_Pl 的取值**。
  (iii) 界里出现的是 **Q⃗_R（右移荷）而非 Q⃗_L**，这是该理论中 BPS 结构的不对称来源。

  **本卡不断言：**
  (a) 哪些解饱和这条界——那是 Sen p.11 紧随其后的分类（Case II/III 饱和、Case I 不饱和、
      `J ≠ 0` 从不饱和），本图未建卡，见 notes；
  (b) 这条界的任何推导、或时空超对称代数的形式（本图 susy 区的 BPS 卡是 d = 4 点粒子一路，
      与本卡的归一化、荷的含义都不同，**不得互引系数**）；
  (c) Q⃗_R 与任何电荷格、量子化条件的关系（Sen 全文没有）；
  (d) 本卡的 Q⃗_R 与 Arkani-Hamed–Motl–Nicolis–Vafa 2006 的 Q_R 是同一归一化下的同一个量。
uses_conventions:
  - conv.metric-mostly-plus
