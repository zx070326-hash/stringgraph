tags: [swampland, bps, bogomolnyi, heterotic, black-hole, sen-1995, outsourced-claim]
notes: |
  from: literature/extractions/sen-1995-bh-torus.md E9（含 §0.3 U-a 的引用编号留痕）、§1.2、§5.1–§5.2。

  【★ 为什么单独建这张卡 —— 一条"被引用而非被证明"的界】
  swampland.heterotic-t6-substates-below-extremality（及其 v2）里「BPS 黑洞 M² = ½Q_R²」这条
  **饱和**关系，其背后的**不等式**从来没有在本图里出现过。Sen 是唯一给出该不等式原文的一手来源，
  但他自己也只是引用。把它单列出来，是为了让「AMNV 说 (22) 是 BPS」这句话的依据在图上可见，
  **并让它的真实来源深度（外包两跳、本项目未核实）如实反映在 effective status 与 gaps 上**。

  【★ Sen p.11 那一段的完整逐字（分类部分，本卡不断言，留作后续卡的来源）】
    "In the normalization convention that we have been using, the Bogomol'nyi bound that follows
     from the space-time supersymmetry of the theory, is given by M² ≥ (Q⃗_R²/2)[24, 25]. Thus we
     see that the extremal black holes in **cases II and III saturate the Bogomol'nyi bound, and
     hence give rise to supersymmetric solutions, whereas those in case I do not**. Also for
     non-zero J, eqs.(2.38)-(2.40) shows that M² is always larger than (Q⃗_R²/2), even in the
     extremal limit a → m. This shows that **the extremal black holes carrying non-zero angular
     momentum do not correspond to supersymmetric solutions.** (Similar observations have been
     made in ref.[26].) For special cases α = β and α = 0, the non-rotating solutions constructed
     here reproduce the solutions discussed in ref.[5]."
  ⇒ **建议的后续卡**（本轮未建，交 lead 排期）：
     `swampland.heterotic-t6-extremal-susy-classification`（Case II/III 饱和 ⇒ 超对称、Case I 不）
     与 `swampland.heterotic-t6-rotating-extremal-not-susy`（J ≠ 0 从不饱和）。
     二者都 depends_on 本卡 + swampland.heterotic-t6-extremal-nonrotating-mass-formulas。

  【★ 不要把本卡当成 AMNV 的 (22) 的来源】AMNV (22) 说的是**饱和**（等号），本卡说的是**不等式**。
  而且两边的 Q_R 归一化无法闭合（见 conv.sen-1995-normalization 的 notes 与
  swampland.heterotic-t6-extremal-nonrotating-mass-formulas 的 notes）。

  【★ 与本图 susy 区 BPS 卡的关系】susy.bps-bound-point-particle-d4 是 d = 4 扩展超对称中心荷的
  BPS 界 m ≥ q_i（Polchinski 附录 B.2 一路，**仅对点粒子可携带的荷**），与本卡**不是同一条界**：
  归一化不同、荷的含义不同（本卡的 Q⃗_R 是 28 维电荷的右移 6 维投影）。**两卡之间本图不建边**，
  因为把它们对上需要一个两处原文都不给的字典。

  【查重】`uv run stringgraph search Bogomol / 极端黑洞` 只命中 susy/branes 两张 d = 4 点粒子 BPS 卡
  与 AMNV 一系的 swampland 卡，无同内容者。
