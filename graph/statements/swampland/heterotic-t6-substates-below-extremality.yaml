id: swampland.heterotic-t6-substates-below-extremality
kind: proposition
title: "SO(32) 杂化弦 on T⁶：Q_L² > Q_R² 时谱中总有 M² = ½Q_L² − 1 的亚极端态"
statement: |
  设 SO(32) 杂化弦紧化在 T⁶ 上，模空间一般点处规范群为 U(1)^28；电荷是 28 维矢量
  Q = (Q_L | Q_R)（Q_L 22 维、Q_R 6 维），落在偶自对偶格上，满足（Arkani-Hamed 等 2006
  eq. (21)）

    Q_L² − Q_R² ∈ 2Z 。

  在 M_Pl = 1、α' = 4 的归一化下（原文 eqs. (22)–(24)）：
    极端黑洞：Q_R² − Q_L² > 0 时 BPS，M² = ½Q_R²；Q_L² − Q_R² > 0 时非 BPS，M² = ½Q_L²；
    微扰杂化弦谱：M² = ½Q_R² + N_R = ½Q_L² + N_L − 1，其中 N_{R,L} 是振子贡献。

  断言（原文 eq. (25) 与其前一句，逐字）：

    "But the string spectrum also guarantees that, as we go down to smaller charges along a
     basis of directions in charge space, we are guaranteed to find a state with a mass/charge
     ratio smaller than for extremal BH's. The inequality is saturated for the BPS states which
     have Q_R² > Q_L², but for Q_L² > Q_R² the extremal black holes have M² = ½Q_L² while there
     is always a state with mass
       M² = ½Q_R² = ½Q_L² − 1    (25)
     since there is a charge vector with Q_L² − Q_R² = 2 on the charge lattice."

  即：在该背景下，沿电荷空间的一组基方向总能找到质荷比小于极端黑洞的态。

  **本卡只断言该背景下的事实，不断言任何普遍性命题。**
uses_conventions: [conv.extremality-normalization]
sources:
