tags: [swampland, weak-gravity, heterotic, charge-lattice, black-hole, amnv]
notes: |
  from: arkani-hamed-2006#E22（另见 #U3、#Q2）。

  【两套归一化必须同时声明】M_Pl = 1（§3 起）与 **α' = 4**（§4，原文逐字 "where we chose units
  with α' = 4"）。否则 (24) 与 (25) 里的 −1 无意义。⚠ α' = 4 **与本图 canonical 的
  conv.alpha-prime-regge 不是同一归一化**；本卡不声明 alpha-prime 族约定，只在此记账，
  凡把本卡接到用 conv.alpha-prime-regge 的节点上的边必须写 convention_map。

  【(24) 里 −1 的来源】原文逐字 "The −1, coming from the tachyon in the left-moving bosonic
  string, is crucial."

  【⚠ 原文排印错误】Figure 4 图题首句逐字为 "The charge M of the heterotic string states of
  charge Q approaches the M = Q line from below"，按内容应为 "The mass M"（抽取记录 #E22 备注 4）。

  【抽取者复算（原文未显式写出）】由 (24) 取 N_L = 0 与 Q_L² − Q_R² = 2 得 N_R = 0 且
  M² = ½Q_R² = ½Q_L² − 1，比极端黑洞的 ½Q_L² 小 1，与 (25) 一致。**该复算原文没有写出**，
  在推导中标 inferred: true。
