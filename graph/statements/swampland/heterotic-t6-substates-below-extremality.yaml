      （见上）。三条红线：
      (1) **9504147 ≠ 9411187**，两个 bib key 绝不可互换（同作者、同年、标题都以 "black hole" 开头）；
      (2) 9504147 **没有任何弱引力猜想形式**（无 m ≤ qM_Pl、无亚极端/超极端比较、无 remnant 论证），
          不得用它支撑本卡的任何断言；
      (3) **归一化完全不同且原文不给换算**：9504147 是 α' = 16、G_N = 2、T = g²/32π
          （见 conv.sen-1995-normalization），本卡用的是 AMNV 的 α' = 4、M_Pl = 1。
          **9504147 的 (24)/(37) 系数不得搬到本卡的记号里**；其 C = 4（(49)）是熵匹配的**拟合值**，
          与本卡无关。
