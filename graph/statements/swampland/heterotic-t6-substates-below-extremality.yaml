      421 (1995) [arXiv:hep-th/9411187]."）。
      **该归属已由 L1 交叉核实**：另一篇 Sen 1995（hep-th/9504147，本项目已逐页读全文）在其 p.6
      逐字把黑洞解归给**同一篇** 9411187（"Most general electrically charged rotating black hole
      solutions in this theory were constructed in ref.[7]"）。
      ⚠ 本条**正文本项目未获取（L0）**，loc 只到篇级；起始页 421 已 L1（由 AMNV 参考文献转录），
      终页 440 未核实。
  - ref: sen-1995-bh
    loc: "arXiv:hep-th/9504147v2, p.6 与 References [7], p.15"
    note: >-
      ⚠⚠ **本条不是 (22)(23) 的出处**，登在这里只承载一件事：它 L1 地证实了上一条的归属
      （见上）。三条红线：
      (1) **9504147 ≠ 9411187**，两个 bib key 绝不可互换（同作者、同年、标题都以 "black hole" 开头）；
      (2) 9504147 **没有任何弱引力猜想形式**（无 m ≤ qM_Pl、无亚极端/超极端比较、无 remnant 论证），
          不得用它支撑本卡的任何断言；
      (3) **归一化完全不同且原文不给换算**：9504147 是 α' = 16、G_N = 2、T = g²/32π
          （见 conv.sen-1995-normalization），本卡用的是 AMNV 的 α' = 4、M_Pl = 1。
          **9504147 的 (24)/(37) 系数不得搬到本卡的记号里**；其 C = 4（(49)）是熵匹配的**拟合值**，
          与本卡无关。
      详见 literature/extractions/sen-1995-bh.md §0.3 与 §5.4。
tags: [swampland, weak-gravity, heterotic, charge-lattice, black-hole, amnv]
notes: |
  from: arkani-hamed-2006#E22（另见 #U3、#Q2）。

  【两套归一化必须同时声明】M_Pl = 1（§3 起）与 **α' = 4**（§4，原文逐字 "where we chose units
  with α' = 4"）。否则 (24) 与 (25) 里的 −1 无意义。⚠ α' = 4 **与本图 canonical 的
  conv.alpha-prime-regge 不是同一归一化**；本卡不声明 alpha-prime 族约定，只在此记账，
  凡把本卡接到用 conv.alpha-prime-regge 的节点上的边必须写 convention_map。

  【★ 第三套归一化：不要把 Sen hep-th/9504147 的系数搬进来（2026-09-11 补）】
  另一篇 Sen 1995（hep-th/9504147 = bib key `sen-1995-bh`，本项目已 L1 逐页读全文）用的是
  **α' = 16、G_N = 2、T = g²/32π**（见 conv.sen-1995-normalization），与本卡的 α' = 4、M_Pl = 1
  **完全不同，且两篇都不给换算**。该文的 (24) m² = Q̄_R²/(8g²)、(37) 熵公式、(49) C = 4
  **都不得搬到本卡的记号里**；误用 G_N = 1 会让 (37) 的系数差 2 倍。
  ⇒ 本卡 (22)(23) 的一手出处是 **sen-1995-bh-torus（hep-th/9411187）**，不是 `sen-1995-bh`。
  两个 bib key 是本项目已知最易撞车的一对。

  【(24) 里 −1 的来源】原文逐字 "The −1, coming from the tachyon in the left-moving bosonic
  string, is crucial."

  【⚠ 原文排印错误】Figure 4 图题首句逐字为 "The charge M of the heterotic string states of
  charge Q approaches the M = Q line from below"，按内容应为 "The mass M"（抽取记录 #E22 备注 4）。

  【抽取者复算（原文未显式写出）】由 (24) 取 N_L = 0 与 Q_L² − Q_R² = 2 得 N_R = 0 且
  M² = ½Q_R² = ½Q_L² − 1，比极端黑洞的 ½Q_L² 小 1，与 (25) 一致。**该复算原文没有写出**，
  在推导中标 inferred: true。
