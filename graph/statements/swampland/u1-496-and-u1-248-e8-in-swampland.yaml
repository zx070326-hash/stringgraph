id: swampland.u1-496-and-u1-248-e8-in-swampland
kind: proposition
title: 10 维 N=1 的 U(1)^496 与 U(1)^248 × E₈ 属于 swampland（Vafa 2005 §4）
statement: |
  Vafa 2005 §4 (p.6–p.7) 的猜想，逐字（公式在原文无编号）：

    "The gauge fields that arise in string theory seem more restricted than would have been
     expected based on the requirement of semiclassical consistency of the effective field
     theory. There are many such examples. For example consider N = 1 supersymmetric theories
     in 10 dimensions with gauge groups:
       U(1)^{496};  U(1)^{248} × E₈
     Both of these theories are consistent as far as anomalies are concerned [6]. Thus they
     both appear to be consistent semiclassically. However, we have no way of constructing
     either of these theories in string theory. It is hard to believe that they actually
     exist, though we have no proof of this. It would be very interesting either to construct
     these or what is more likely, to find what consistency condition goes wrong with these
     theories which renders them inconsistent."

  本图取的陈述：10 维 N=1 超对称规范理论中，规范群为 U(1)^496 或 U(1)^248 × E₈ 的两个理论
  **不作为一致量子引力理论的低能有效理论出现**（即属于 swampland）。

  原文自称的强度：**"It is hard to believe that they actually exist, though we have no proof
  of this."**
uses_conventions: []
sources:
