notes: |
  由 curator 于 2026-09-11 从抽取记录 E112 建立。

  **⚠ 按抽取记录 Q18 的建议单独建节点。** Q18 指出「态-算子对应在振幅中的使用」在本书有三个落点，
  用法强度不同：
  1. (5.4.5)：用「V 对应 L₀^m = 1 的最高权态」判定 V 是维数 1 的主场（属第 5 章，另一 curator）；
  2. (3.6.26) 的归一化：见 spectrum.chan-paton-yang-mills-coupling (1) 末句；
  3. (6.7.9)–(6.7.18)：本卡片。
  「**第 3 类比前两类强得多**（要求径向序 = 时间序、完备基、Zamolodchikov 内积良定义）」，
  故 Q18 建议「**不要把三者挂到同一个 state-operator-correspondence 节点上**」。
  本图遵此：本卡片是独立节点，只在依赖里引 worldsheet.state-operator-isomorphism，
  并把三条额外前提写进 statement。

  **area 选择**：`cft.`（纯 CFT 内容，与弦无关），理由同本批次其它 cft.* 节点。
