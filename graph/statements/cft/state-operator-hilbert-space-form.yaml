id: cft.state-operator-hilbert-space-form
kind: proposition
title: 球面 n 点函数写成 Hilbert 空间矩阵元：Zamolodchikov 内积与「OPE 系数 = 矩阵元」
statement: |
  设二维 CFT 在 S₂ 上，按 worldsheet.state-operator-isomorphism 把 z = 0 处的算子 A_j
  映到单位圆上的态 Ψ_{A_j}[φ_b]（φ_b 为圆上的边界场构型）。则：

  **(1)（两点函数 = 卷积，(6.7.9)）** 把 z = ∞（即 u = 1/z 片的原点 u = 0）处的算子 A_i
  映到 Ψ_{A_i}[φ_b(u)]；由于 u 片与 z 片的圆参数关系是 σ ↦ 2π − σ，两点函数写成
    **⟨ A_i'(∞) A_j(0) ⟩_{S₂}  =  ∫ [dφ_b]  Ψ_{A_i}[φ_b^Ω] Ψ_{A_j}[φ_b]**，
  形式上是一个**卷积**（对同一组边界场积分）而非通常意义的内积
  （Ω 表示上述圆参数的反向）。

  **(2)（Zamolodchikov 内积，(6.7.11)）** 由 (1) 定义配对
    **⟨⟨ i | j ⟩⟩ ≡ ⟨ A_i'(∞) A_j(0) ⟩_{S₂}**，
  记 G_{ij} = ⟨⟨i|j⟩⟩。它是态空间上的一个双线性配对（**Zamolodchikov 内积**），
  由 cft.tensor-two-and-three-point-functions (1) 知 G_{ij} 只在 h_i = h_j、h̄_i = h̄_j 时非零。

  **(3)（三点函数 ↔ OPE 系数，(6.7.14)/(6.7.15)）** 三点函数与 OPE 系数 c^k_{ij}（(2.4.20)）
  由该配对相联系：
    **c_{ikj} = Σ_ℓ c^ℓ_{kj} G_{iℓ}**，
  即「结构常数」与「OPE 系数」通过 G 升降指标互换。

  **(4)（四点函数，(6.7.16)/(6.7.18)）** 四点函数由在中间插入**完备态基**得到，
  写成 OPE 系数与 G 的求和。

  ⚠⚠ **本命题的三条未证前提**（抽取记录明确要求单独建节点并标明）：
  (a) **OPE 收敛**（本图未证，lead 裁决 2026-09-10 的标准缺口，researcher Q3）；
  (b) **完备基假设**（态空间有可数完备基且插入完备关系合法）；
  (c) **径向序 = 时间序**（路径积分自动含时序，Hilbert 空间侧需显式时序；
      两者在世界面 CFT 上的等同**本书未证明**）。
