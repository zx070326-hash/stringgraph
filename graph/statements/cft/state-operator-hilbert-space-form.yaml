    note: |
      literature/extractions/polchinski-1998-v1.md#E112，等级 **L1**（schrans-2020 §6.78–§6.82，
      笔记 p.349–352，逐页读到）；⚠ (6.7.10)/(6.7.16) 只有 [S] 正文交叉引用，目录无独立条目
      （抽取记录 §7）。
      ⚠⚠ **[S] 在这一节留下三条「看不懂」的记录，都指向原书的论证有跳跃**（逐字）：
      1. §6.79：「[6.320] O_i(z)O_j(0) = Λ^{h_i+h_j}⟨⟨i|j⟩⟩/(z^{h_i+h_j}⟨1⟩_{S₂}) + …
         **I am not sure how to get rid of the Λ-factor.**」
      2. §6.82：「Now **Joe used the Σ_n G^{mn} to raise c_{nℓj} to c^m_{ℓj}, but there is also a
         z₂^{h₂} so I am not sure how this exactly works.**」
      3. §6.82 脚注 10：「Recall from QFT that **time-ordering is needed in the Hilbert space
         mechanism, but that this is automatically included in the path-integral formalism.**」
      抽取记录的结论逐字：「**curator：这一节整体建议标 physical-argument**；
      特别是『OPE 系数 = Hilbert 空间矩阵元』这条要单独建节点并标明依赖
      『OPE 收敛（Q3）+ 完备基假设 + 径向序 = 时间序』三条未证前提。」——本卡片即此。
