sources:
  - ref: polchinski-1998-v1
    loc: "§6.7, eq. (6.7.5)（两点函数）、(6.7.6)（三点函数）、(6.7.7)（四点函数与交叉比），p.199"
    note: |
      literature/extractions/polchinski-1998-v1.md#E111，等级 **L1**（schrans-2020 §6.75–§6.77，
      笔记 p.342–345，逐页读到）。
      [S] 关于 (6.7.7) 的收尾逐字（笔记 p.349）：「The four-point function [6.312] is thus determined
      by Möbius invariance up to some function of the anharmonic ratio x. This function is not
      arbitrary but needs to satisfy some constraints, set by more general conformal transformations.
      In some cases these constraints allow to determine this function completely…
      **This process is known as the conformal bootstrap. This is linked to the associativity of
      three operators in (2.9.3)** and in our fig.2.9.」
      ⚠ **[S] 的技术手法与原书可能不同**（抽取记录 E111）：他为避开 Λ → ∞ 的奇异性保持 Λ 有限
      并用 Mathematica 算 Jacobian（图 6.11/6.12），自述「Arguably we should take Λ → ∞ but
      if we do that now we will see that it leads to complications」。**原书怎么处理无穷远点未核实。**
tags: [cft, mobius, correlation-function, structure-constants, cross-ratio, bootstrap, primary-field]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E111 建立。area 选择理由见
  cft.one-and-two-point-functions-mobius-fixed 的 notes（纯 CFT 内容，与弦无关）。

  **与既有节点的关系**：worldsheet.ope-associativity-bootstrap 已经陈述了 (2.9.3) 的结合性；
  本卡片 (3) 末段指出四点函数的未定函数受该结合性约束，是两者的接口，
  但**本卡片不断言自举的任何具体结果**。

  **(2) 是 CFT 里最常被引用的公式之一**；本图把它建在 `cft.` 区，
  日后若做 Lean 形式化（三点函数的形式由权唯一定出——这是有限维线性代数 + 函数方程），
  这是一个可行的候选岛。
