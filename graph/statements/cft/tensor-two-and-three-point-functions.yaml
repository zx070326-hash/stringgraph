id: cft.tensor-two-and-three-point-functions
kind: proposition
title: Möbius 不变性把主场两点函数定到 δ_{h_i h_j}、三点函数定到常数 C_ijk、四点函数定到交叉比的未定函数
statement: |
  设二维 CFT 在 S₂ 上，O_i 为权 (h_i, h̄_i) 的主场，关联函数 Möbius 不变。则：

  **(1)（两点函数的选择定则，(6.7.5)）** 用共形变换 z ↦ z + ε(z − z₁)(z − z₂)
  （它固定 z₁ 与 z₂）作用于两点函数，得
    (z₁ − z₂)( h_i − h_j ) ⟨ O_i O_j ⟩ = 0，
  故 **h_i ≠ h_j 时两点函数恒为零**（反全纯侧同理给 h̄_i = h̄_j）。

  **(2)（三点函数，(6.7.6)）** 三点函数被 Möbius 不变性定到一个常数：
    **⟨ O_i(z₁) O_j(z₂) O_k(z₃) ⟩
      = C_{ijk} · z₁₂^{h_k−h_i−h_j} z₁₃^{h_j−h_i−h_k} z₂₃^{h_i−h_j−h_k} × （反全纯侧同式，h → h̄）**，
  其中 C_{ijk} 是与坐标无关的常数（**结构常数**）。

  **(3)（四点函数，(6.7.7)）** 四点函数只被定到**交叉比（非调和比）**
    x = z₁₂ z₃₄ / ( z₁₃ z₂₄ )
  的一个**未定函数**：Möbius 不变性把坐标依赖压缩成 x（与 x̄）的函数，不能再定得更死。
  该函数并非任意——它须满足由更一般的共形变换（及 OPE 结合性）给出的约束；
  在某些情形这些约束足以完全定出它，这一程序称为**共形自举（conformal bootstrap）**，
  与三算子 OPE 的结合性（worldsheet.ope-associativity-bootstrap，(2.9.3)）直接相接。

  **本命题不断言什么**：不给出 C_{ijk} 的值（那是具体理论的数据）；
  不断言自举约束的可解性；不涉及非主场。
