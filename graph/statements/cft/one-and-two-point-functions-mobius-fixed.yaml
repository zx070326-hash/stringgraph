notes: |
  由 curator 于 2026-09-11 从抽取记录 E110 建立。

  **area 选择说明（任务书要求 curator 判断并说明）**：本卡片放 **`cft.`** 而不是 `worldsheet.`
  或 `spectrum.`，理由是它的内容**与弦无关**——它是任意二维 CFT 在球面上的一般结果
  （只用主场的变换律与 Möbius 不变性），不涉及 X^μ、α'、时空维数或任何弦特有的结构。
  按 graph/schema/areas.yaml，`cft` 的定义正是「二维共形场论本体：顶点算子代数、模不变性、自举」。
  这是本图 `cft/` 目录下的第一批节点。
  与之对照：worldsheet.bc-ghost-* 那几条虽然也是 CFT 结果，但放在 `worldsheet.` 是因为
  本图已有 bc 鬼场族在那里，且它们的 λ = 2 取值与弦的规范固定绑定。

  **本卡片依赖 worldsheet.sphere-conformal-killing-group（一个 worldsheet.* 节点）**：
  这是一条跨区的边，但内容上没有问题——那条命题本身也是纯几何的（P¹ 的 CKV），
  只是历史上先在 worldsheet 区建立。若日后 cft 区扩大，可考虑把它搬过来（须换代，不得改 id）。
