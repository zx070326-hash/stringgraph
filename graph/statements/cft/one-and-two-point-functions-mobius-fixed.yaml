id: cft.one-and-two-point-functions-mobius-fixed
kind: proposition
title: Möbius 不变性定死球面上的一点与两点函数：⟨A⟩ ≠ 0 只对 h = h̄ = 0；两点函数的幂次与单值性条件
statement: |
  设一个共形场论定义在 S₂ 上，其主场（worldsheet.primary-field）按权 (h, h̄) 变换，
  且关联函数在 PSL(2,C)（worldsheet.sphere-conformal-killing-group）下不变。则：

  **(1)（一点函数）** 球面上总可以用平移把一个算子的坐标固定到 z = 0。
  在剩余的刚性标度 z ↦ z' = γ z 下 A'(z') = γ^{−h} γ̄^{−h̄} A(z)（(2.4.13)），故 A'(0) = γ^{−h}γ̄^{−h̄}A(0)，
  与不变性相容当且仅当
    **⟨ A ⟩_{S₂} ≠ 0  仅对 h = h̄ = 0 的算子**   （(6.7.3)）。

  **(2)（两点函数）** 先用平移把第二个算子移到原点（z ↦ z − z₂，(6.7.4)），
  再用标度 z ↦ z₁₂^{−1} z，得
    **⟨ A_i(z₁, z̄₁) A_j(z₂, z̄₂) ⟩  =  z₁₂^{−h_i−h_j} z̄₁₂^{−h̄_i−h̄_j} ⟨ A_i(1,1) A_j(0,0) ⟩**。

  **(3)（单值性）** 关联函数在 z₁ 绕 z₂ 一周后必须回到自身，要求 z₁₂ 的总幂次的
  全纯与反全纯部分之差为整数，即
    **J_i + J_j ∈ Z**,   J ≡ h − h̄  （自旋）。

  **本命题不断言什么**：不断言 h_i ≠ h_j 时两点函数为零（那是
  cft.tensor-two-and-three-point-functions 的 (6.7.5)，用的是更强的共形变换）；
  不涉及非主场（descendant）。
