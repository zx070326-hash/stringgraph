notes: |
  【为什么立卡】research/attempts/physical-exponential-equals-lattice-voa/proof.md (P3)
  与 status.yaml 第 161 行（移交条目 C2）指出：桥卡 worldsheet.physical-exponential-equals-voa-vertex-operator-v2
  断言 (2) 括注里的洛朗指标移位 K ↦ K − nν 依赖一个"单值因子" z^{2α'nk_0·p} = z^{nν}，
  但图中此前**没有任何节点承载**这个因子（振子部分由 worldsheet.exponential-vertex-operator-modes
  承载，零模移位由 worldsheet.momentum-tower-fock-space 的 S_n 承载，两者都不含这个标量指数）。
  proof.md 把它作为"本尝试自己写出的定义"引入，并在 §7.1 [GAP-def-cards] 里登记为毕业阻塞项——
  本卡就是补上它，使桥卡的"读法 2"（把断言 (2) 的洛朗指标移位溯源到一个显式承载的算子而非
  隐藏在括注文字里）有一张可引用的定义卡。

  【为什么 status 是 rigorous 而不是 physical-argument】本卡的**定义本身**
  （在给定 k_0² = 0 与整性条件 (I) 的塔上，逐层用一个由已给数据算出的标量幂做乘法）是纯粹的
  初等代数构造，不依赖任何未经证明的物理断言——层无关性是三行代数（k_0²=0 的直接推论）。
  物理上"这就是 X^μ 零模项的贡献"这句翻译**不是**本卡断言的内容（见【本卡明确不断言】(a)），
  它只出现在 statement 的"物理动机"段用来解释记号来历，与
  worldsheet.momentum-tower-fock-space 对 S_n ↔ e^{ink_0·x} 记号的处理方式完全一致
  （那张卡同样是 formalized/rigorous 的纯代数定义，物理记号只是命名）。

  【α' 换算——诚实记为待办，不阻塞本卡】任务书提醒 goddard-2008 用 α' = 1/2 的 DDF 归一化，
  与本图 conv.alpha-prime-regge（一般 α'）的逐系数换算，本卡**未做**，因为定义本身不需要它——
  Z_n(z) 的层无关性只用到 k_0² = 0 与整性条件 (I)（ν ∈ Z），对任意 α' 归一化都成立，
  换算只影响"这是 X^μ 哪个具体系数的贡献"这句物理解释，已在 (a) 与 sources 的 note 里
  显式标为待澄清、且标了 `inferred: true`（该 source 边的论证在文献里找不到精确系数核对，
  但它指向的物理事实——X^μ 模展开含 p ln z 零模项——本身是图外常识，此处不再拆出新节点）。

  【与 worldsheet.momentum-tower-fock-space 的分工】那张卡的 S_n 移动层指标（"平移"），
  本卡的 Z_n(z) 不移动层指标、只在每层乘一个标量（"相位/幂次记账"）。两者是顶点算子
  Z_n(z) ∘ S_n ∘ (振子部分) 复合里独立的三个因子（复合本身见【本卡明确不断言】(b)）。

  【search 查重】`uv run stringgraph search "零模"`、`"Z_n"`、`"monodromy"`、`"单值"`
  （2026-09-19）均无与本卡重复的命中（"单值"命中的是既有卡里对 (w/z)^{mnk_0²} 或
  ⟨α,β⟩ 型 cocycle 单值性的记录，是不同对象：那些是**两个顶点算子之间**的 OPE 单值因子，
  本卡是**单个顶点算子在动量塔上**的零模标量因子，见【本卡明确不断言】(c) 的呼应说明）。
