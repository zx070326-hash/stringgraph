id: worldsheet.tower-zero-mode-monodromy-factor
kind: definition
status: rigorous
title: 类光动量塔上的零模标量因子 Z_n(z) = z^{2α'nk_0·p̂}（层无关，值为 z^{nν}）
statement: |
  沿用 worldsheet.momentum-tower-fock-space 的动量塔 T(p;k_0) = ⊕_{N∈Z} F(p+Nk_0)（参考向量
  k_0 ≠ 0，基点动量 p），并沿用 worldsheet.physical-exponential-equals-voa-vertex-operator-v2
  的两条设定假设：k_0 **类光**（k_0² = 0）与**整性条件** (I) ⟨k,p̃⟩ = 2α'(k_0·p) ∈ Z
  （记 ν := 2α'(k_0·p) ∈ Z，α' 按 conv.alpha-prime-regge，度规按 conv.metric-mostly-plus）。

  对每个 n ∈ Z，定义 T(p;k_0) 上的**标量算子**（"零模单值因子"）Z_n(z)：
  在第 N 层 F(p + N k_0) 上，Z_n(z) 作用为乘以标量
    Z_n(z)|_{F(p+Nk_0)} := z^{ 2α' n k_0·(p + N k_0) } · id_{F(p+Nk_0)}。

  **层无关性（定义的直接推论，非独立命题）**：由 k_0² = 0，
    2α' n k_0·(p + N k_0) = 2α' n (k_0·p) + 2α' n N k_0² = nν + 0 = nν，
  与层指标 N 无关。故
    Z_n(z) = z^{nν} · id_{T(p;k_0)}，
  是塔上的一个**整数次幂单项式**乘法算子（ν ∈ Z 由整性条件 (I) 保证，故 z^{nν} 是普通形式
  洛朗单项式，不是分数幂）。

  **物理动机（命名依据，不是本卡断言的内容——见下方边界条款 (a)）**：记号里的 "p̂" 读作
  "塔上逐层取值 p + N k_0 的动量算子"；物理上这一因子对应闭弦/开弦坐标场 X^μ(z) 标准模展开中
  含 p^μ ln z 的**零模项**对正规序指数 :e^{i n k_0·X(z)}: 贡献的标量因子。这就是本卡记号
  "Z_n(z) = z^{2α' n k_0·p̂}" 的来历，也是 worldsheet.physical-exponential-equals-voa-vertex-operator-v2
  断言 (2) 括注里洛朗指标移位 K ↦ K − nν 的物理侧出处。

  **本卡明确不断言的三条：**
  (a) **不独立证明这一物理推导本身。** worldsheet.momentum-tower-fock-space 明确声明它
      "不引入 x^μ 本身，也不引入 [x^μ, p^ν]"（该卡边界 (a)）；本图目前没有任何节点承载
      "X^μ(z) 的标准模展开、其零模项为 -i·2α' p^μ ln z" 这一物理事实，故"Z_n(z) 就是那一项
      产生的因子"这句翻译，与 worldsheet.momentum-tower-fock-space 处理 S_n ↔ "e^{i n k_0·x}"
      的方式相同：是命名/记账动机，是**边界条款**，不是被本卡证明或依赖的等式。
      🔴 **待澄清（本卡未解决，如实记录）**：Polchinski (2.7.26)（开弦 X^μ(z,z̄) 的模展开式）
      与本图的 α' 归一化 conv.alpha-prime-regge、goddard-2008 (arXiv:0802.3249) 里 α' = 1/2
      的 DDF 公式之间的精确系数换算，本卡未独立核对；不影响本卡定义本身的良定义性
      （定义只用到 momentum-tower-fock-space 已给出的层动量数据与初等指数运算）。
  (b) **不断言与 worldsheet.exponential-vertex-operator-modes 的振子部分 V^{(b)}_J 复合后的
      算子性质**（例如 Z_n(z) 与 V^{(b)}_J 的乘积等于某个"完整"顶点算子）。那是
      research/attempts/physical-exponential-equals-lattice-voa 未毕业草稿里的定义，
      本图未收录该复合定义。
  (c) **不断言 k_0² ≠ 0 的情形。** 此时 2α' n k_0·(p+Nk_0) = nν + 2α'nN k_0² 依层 N 变化，
      Z_n(z) 不再是标量乘法算子；本卡只覆盖类光设定（呼应
      worldsheet.isotropic-tower-vertex-operators-commute 对单值因子 (w/z)^{mnk_0²}
      在非类光时不可对易的记录）。
