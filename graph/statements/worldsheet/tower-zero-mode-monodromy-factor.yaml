      (2.7.26) 的精确内容（-i·2α' p^μ ln z 项的系数与符号）未经本卡逐字核实，
      也未与 conv.alpha-prime-regge 做逐系数换算，是本卡【明确不断言】(a) 登记的待澄清事项。
