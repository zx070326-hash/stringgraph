    note: |
      L1（E40、E42）。右移一侧的投影就是第 10 章的 GSO 投影；本图对应节点
      worldsheet.gso-projection 与 worldsheet.superstring-sector-consistency-conditions。
tags: [heterotic, so32, gso, periodicity, bosonization, definition]
notes: |
  ⚠【(11.2.7) 的记号提醒】抽取记录逐字记下了 's·s′ + l/2 ∈ Z（l = −1 在 NS、−1/2 在 R）'，
  但 s（SO(8) 权矢量）与 l 的**定义**在 §10.3/§10.5，抽取记录没有逐字转录那些定义，
  本图也**没有**自旋场/权矢量标号的节点。
  因此本卡把 (11.2.7) 作为**式号记录**列出，其内容不承载本卡的任何下游断言；
  下游只用 (11.2.8) 的结论 exp(πiF̃) = 1。
  → 若日后要把 (11.2.7) 用作论证的一环，**必须先补 §10.3/§10.5 的 s 记号节点**。

  【本图没有玻色化节点】(11.2.11)/(11.2.12) 的复化与玻色化在本图无支撑：
  第 10 章的玻色化（E25、E27、E30）本轮与上一轮均未入图。
  后果：worldsheet.heterotic-so32-partition-function 的「OPE 局域闭合 easily verified by means
  of bosonization」这一步在图上没有依据，已在那张卡的推导 gaps 记明。

  【为什么是 definition 而不是 proposition】这组周期条件与投影是**被选定的**，
  与 §10.6 的三条一致性条件（worldsheet.superstring-sector-consistency-conditions，
  同样是 definition）平行。它们的**自洽性**（模不变、OPE 闭合）才是命题。

  【status: physical-argument】依赖 worldsheet.rns-fermion-number-operator（其鬼场部分经玻色化，
  本身 physical-argument）与 worldsheet.heterotic-string-construction（同级），
  且 (11.2.6) 的「T_B 周期性只要求 O(32)」这一步本身是形式论断。
