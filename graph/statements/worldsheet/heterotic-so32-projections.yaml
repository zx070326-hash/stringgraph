id: worldsheet.heterotic-so32-projections
kind: definition
status: physical-argument
title: SO(32) 杂化弦的定义：λ^A 的周期条件只需差一个 O(32) 转动，取全部同号的 ±，并强加 exp(πiF) = exp(πiF̃) = 1
statement: |
  在 worldsheet.heterotic-string-construction 的场内容上，**SO(32) 杂化弦**由下列周期条件与
  投影定义：

  **(a) 周期条件的一般形式**（(11.2.6)）。能动张量 T_B（(11.2.5a)）的周期性只要求 λ^A
  周期到一个任意的 O(32) 转动：
    λ^A(w + 2π) = O^{AB} λ^B(w),   O ∈ O(32)。
  原书逐字：'Periodicity of T_B only requires that the λ^A be periodic up to an arbitrary
  O(32) rotation.'（w 是柱面坐标，w ≅ w + 2π。）

  **(b) 右移一侧**。右移部门与 §10 的 RNS 超弦相同，取超弦的 GSO 投影
    exp(πiF̃) = 1                              （(11.2.8)）
  相互局域性在 §11.2 写成
    s·s′ + l/2 ∈ Z                             （(11.2.7)，l = −1 在 NS、−1/2 在 R）
  的形式（s 是 §10.3/§10.5 的 SO(8) 权矢量标号；见 notes 的记号提醒）。

  **(c) 左移一侧**（本理论的定义性选择）。取
    λ^A(w + 2π) = ± λ^A(w)                     （(11.2.9)）
  **32 个分量同号**（即 O = ±1 ∈ O(32)），并强加
    exp(πiF) = 1                               （(11.2.10)）。
  这里 F 是左移的世界面费米子数。

  **(d) 费米子化/玻色化的记账**（(11.2.11)、(11.2.12)）。把 λ^A 两两复化
    λ^{K±} = 2^{−1/2}(λ^{2K−1} ± i λ^{2K}),   K = 1, …, 16，
  再玻色化为 16 个左移标量 H^K(z)；左移费米子数是各 U(1) 荷之和
    F = Σ_{K=1}^{16} q_K。

  **本卡不断言的内容**：
    (1) 不断言这组选择是被推导出来的。**它是定义**：原书是先写下这组周期条件与投影，
        再验证 OPE 局域闭合与模不变（worldsheet.heterotic-so32-partition-function）。
    (2) 不断言 O(32) 的其它取法给出什么——那是 worldsheet.heterotic-e8e8-construction
        （分成两组 16）与 §11.3 的扭曲构造
        （worldsheet.heterotic-so16-so16-nonsupersymmetric-tachyon-free）的内容。
    (3) 不断言玻色化本身的严格性（本图无玻色化节点，见 notes）。
