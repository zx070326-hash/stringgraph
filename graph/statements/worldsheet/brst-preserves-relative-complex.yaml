id: worldsheet.brst-preserves-relative-complex
kind: proposition
title: Q_B 把相对复形 {b_0Ψ = 0, L_0Ψ = 0} 映到自身，且关于 ⟨·,·⟩_rel 自伴
statement: |
  设定与记号沿用 worldsheet.brst-quantization（Q_B，受限模，总 Virasoro 零模
  L_0 := L^tot_0 = L^m_0 + L^g_0 − 1）与 worldsheet.bc-ghost-hermitian-conjugation
  （b_n† = b_{−n}、c_n† = c_{−n}、⟨↓|c_0|↓⟩ = 1、相对形式 ⟨Ψ, Ψ'⟩_rel := ⟨Ψ|c_0|Ψ'⟩）。
  设物质中心荷 c^m = 26（故 Q_B² = 0，worldsheet.brst-nilpotent-at-c26），并令
    C_rel = { |Ψ⟩ ∈ V : b_0|Ψ⟩ = 0, L_0|Ψ⟩ = 0 }。
  则

  (1) **Q_B 保持 C_rel**：Q_B C_rel ⊆ C_rel。
      理由：由 worldsheet.brst-anticommutator-b-mode，{Q_B, b_0} = L_0 与 [Q_B, L_0] = 0
      （后者是 {Q_B, b_0} = L_0 与 Q_B² = 0 的推论：[Q_B, L_0] = [Q_B, {Q_B, b_0}] = 0）。
      于是 b_0 Q_B|Ψ⟩ = (L_0 − Q_B b_0)|Ψ⟩ = 0 且 L_0 Q_B|Ψ⟩ = Q_B L_0|Ψ⟩ = 0。
      故相对上同调 H_rel = ker(Q_B|_{C_rel}) / im(Q_B|_{C_rel}) 有定义。

  (2) **Q_B 关于 ⟨·,·⟩_rel 自伴**：对 |Ψ⟩, |Ψ'⟩ ∈ C_rel，
        ⟨Q_B Ψ, Ψ'⟩_rel = ⟨Ψ, Q_B Ψ'⟩_rel。
      （Q_B 是 Grassmann 奇算符；这里的"自伴"按含 c_0 插入的相对形式理解，
      符号约定见 notes。）

  (3) **推论**：⟨·,·⟩_rel 在 H_rel 上诱导良定义的厄米形式——BRST 恰当态与 BRST 闭态
      的相对内积为零：若 |Ψ⟩ ∈ ker Q_B|_{C_rel} 且 |Λ⟩ ∈ C_rel，则 ⟨Ψ, Q_BΛ⟩_rel
      = ⟨Q_BΨ, Λ⟩_rel = 0。

  本命题**不**断言该形式正定（那是 worldsheet.no-ghost-theorem-brst），
  也**不**断言上同调集中在单一鬼数。
uses_conventions: [conv.virasoro-standard, conv.intercept-sign-a]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.3，p.134 的无编号正文断言（schrans-2020 目录 `4.32 Q_B takes Ĥ into itself`、`4.33 The Need for a New Inner Product on Ĥ`）"
    note: |
      **原书在此处不给公式号**（schrans-2020 把这两条标为无编号正文断言）。
      抽取记录 literature/extractions/polchinski-1998-v1.md#E66。未核对原书。
  - ref: polchinski-1998-v1
    loc: "§4.3，eq. (4.3.6)（{Q_B, b_m} = L^tot_m，是 (1) 的代数依据），p.132"
    note: 式号经 schrans-2020 目录核实。
  - ref: fgz-1986
    loc: "§2.1（相对复形 relative to the center 的构造）；Theorem 2.8（unitary isomorphism，说明相对形式在上同调上良定义）"
    note: |
      数学侧对应：FGZ 在 ℒ_0-相对复形上做半无限上同调，并断言诱导的同构是 unitary，
      这蕴含 (3)。编号已核实（literature/extractions/brst-cohomology-sources.md §1.2–1.3）。
      FGZ **没有**以 {d, b_0} = L_0 的形式陈述 (1)，本图未核实其相对复形的良定义论证细节。
tags: [brst, cohomology, ghosts, bosonic-string, inner-product]
notes: |
  本命题是 worldsheet.no-ghost-theorem-brst 与 worldsheet.brst-cohomology-equals-ocq-physical
  两条陈述里**已经被默默使用但没有节点承载**的两个前提（"Q_B 保持 C_rel"与
  "⟨·,·⟩_rel 在上同调上良定义"）。把它们提出来后，那两个节点的陈述可追溯性变强，
  但本轮**不改动那两个节点**（陈述不可变；若 lead 认为应加 uses/depends_on 边，
  可在其推导节点上补边，不需要新建陈述）。

  (2) 的符号约定：Q_B 奇、c_0 奇，故 ⟨Ψ|c_0 Q_B|Ψ'⟩ 与 ⟨Ψ|Q_B c_0|Ψ'⟩ 相差一个符号与一个
  {Q_B, c_0} 项。本节点断言的是**存在一套与 worldsheet.bc-ghost-hermitian-conjugation 相容的
  符号约定使 (2) 成立**，具体符号取法见推导 summary。若 reviewer 认为该措辞过松，
  应新建 v2 把符号写死——curator 选择不写死，因为原书在此处无公式号可对。

  (1) 中 [Q_B, L_0] = 0 的推导用到 Q_B² = 0，故本命题的前提含 c^m = 26。
  若只要 (1) 的前半（b_0 Q_B Ψ = 0），不需要 Q_B² = 0。
