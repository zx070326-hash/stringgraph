id: worldsheet.brst-preserves-relative-complex
kind: proposition
title: Q_B 把相对复形 {b_0Ψ = 0, L_0Ψ = 0} 映到自身，且关于 ⟨·,·⟩_rel 反自伴
statement: |
  设定与记号沿用 worldsheet.brst-quantization（Q_B，受限模，总 Virasoro 零模
  L_0 := L^tot_0 = L^m_0 + L^g_0 − 1）与 worldsheet.bc-ghost-hermitian-conjugation
  （b_n† = b_{−n}、c_n† = c_{−n}、⟨↓|c_0|↓⟩ = 1、⟨↓|↓⟩ = 0、
  相对形式 ⟨Ψ, Ψ'⟩_rel := ⟨Ψ|c_0|Ψ'⟩）。厄米共轭按 (AB)† = B†A†（对 Grassmann 奇算符
  **不**附加额外符号），并用 Q_B† = Q_B。记号说明：此处 L^g_0 是**不含常数**的鬼场 level
  算符（以 |↓⟩ 为正规序参照，L^g_0|↓⟩ = 0），常数已单独写成末项 −1；与
  worldsheet.bc-ghost-normal-ordering-constant 的共形正规序 L^g_0（其 L^g_0|↓⟩ = a^g|↓⟩ = −|↓⟩）
  相差正是这个常数 a^g = −1。令
    C_rel = { |Ψ⟩ ∈ V : b_0|Ψ⟩ = 0, L_0|Ψ⟩ = 0 }。
  物质中心荷 c^m 取任意值，除非下面显式声明。则

  (1) **Q_B 保持 C_rel**：Q_B C_rel ⊆ C_rel，**对任意 c^m 成立**。
      理由：由 worldsheet.brst-anticommutator-b-mode，{Q_B, b_0} = L_0，故
        b_0 Q_B|Ψ⟩ = (L_0 − Q_B b_0)|Ψ⟩ = 0；
      又 [Q_B, L_0] = 0，因为 Q_B 的每一项（c_n L^m_{−n}、: c_m c_n b_{−m−n} :、c_0）
      的总 level 移动都是零，而在固定动量扇区上 L_0 = α'p² + N^tot − 1，其中 N^tot 是
      总 level 算符、p 与 Q_B 对易；故 L_0 Q_B|Ψ⟩ = Q_B L_0|Ψ⟩ = 0。
      于是 Q_B|Ψ⟩ ∈ C_rel，(C_rel, Q_B|_{C_rel}) 是良定义的分次复形。
      **只有当 c^m = 26**（worldsheet.brst-nilpotent-at-c26，Q_B² = 0）**时**，
      H_rel = ker(Q_B|_{C_rel}) / im(Q_B|_{C_rel}) 才是上同调。

  (2) **Q_B 关于 ⟨·,·⟩_rel 反自伴**：对 |Ψ⟩, |Ψ'⟩ ∈ C_rel，
        ⟨Q_B Ψ, Ψ'⟩_rel = − ⟨Ψ, Q_B Ψ'⟩_rel。
      在上面写死的约定下这个负号不是可选的，而是被确定的：
        ⟨Q_BΨ, Ψ'⟩_rel = ⟨Ψ|Q_B† c_0|Ψ'⟩ = ⟨Ψ|Q_B c_0|Ψ'⟩
                       = ⟨Ψ|{Q_B, c_0}|Ψ'⟩ − ⟨Ψ|c_0 Q_B|Ψ'⟩,
      而由模式展开逐项算得
        {Q_B, c_0} = Σ_{m ∈ Z} m : c_m c_{−m} :
      （只有三次鬼场项中 b 的指标为零的那些项贡献；物质项与 −c_0 项的贡献各自为零）。
      该算符**不含 b_0、c_0**，故把 b_0-湮灭扇区映到自身；而该扇区中无 c_0 插入的配对
      因 ⟨↓|↓⟩ = 0 为零，于是 ⟨Ψ|{Q_B, c_0}|Ψ'⟩ = 0，余下的正是负号。

  (3) **推论**：⟨·,·⟩_rel 在 H_rel 上诱导良定义的厄米形式——BRST 恰当态与 BRST 闭态
      的相对内积为零：若 |Ψ⟩ ∈ ker Q_B|_{C_rel} 且 |Λ⟩ ∈ C_rel，则
        ⟨Ψ, Q_BΛ⟩_rel = −⟨Q_BΨ, Λ⟩_rel = 0。
      (2) 中的负号不影响这条推论。

  本命题**不**断言该形式正定（那是 worldsheet.no-ghost-theorem-brst），
  也**不**断言上同调集中在单一鬼数。
uses_conventions: [conv.virasoro-standard, conv.intercept-sign-a]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.3，p.134 的无编号正文断言（schrans-2020 目录 `4.32 Q_B takes Ĥ into itself`、`4.33 The Need for a New Inner Product on Ĥ`）"
    note: |
      **原书在此处不给公式号**（schrans-2020 把这两条标为无编号正文断言）。
      抽取记录 literature/extractions/polchinski-1998-v1.md#E66。未核对原书。
      原书对 (2) 的符号如何取，本图无逐字证据；本节点的负号是在本图自己写死的约定下算出的，
      见 notes 的反例记录。
  - ref: polchinski-1998-v1
    loc: "§4.3，eq. (4.3.6)（{Q_B, b_m} = L^tot_m，是 (1) 的代数依据），p.132"
    note: 式号经 schrans-2020 目录核实。
  - ref: fgz-1986
    loc: "§2.1（相对复形 relative to the center 的构造）；Theorem 2.8（unitary isomorphism，说明相对形式在上同调上良定义）"
    note: |
      数学侧对应：FGZ 在 ℒ_0-相对复形上做半无限上同调，并断言诱导的同构是 unitary，
      这蕴含 (3)。编号已核实（literature/extractions/brst-cohomology-sources.md §1.2–1.3）。
      FGZ **没有**以 {d, b_0} = L_0 的形式陈述 (1)，本图未核实其相对复形的良定义论证细节。
tags: [brst, cohomology, ghosts, bosonic-string, inner-product]
notes: |
  本命题是 worldsheet.no-ghost-theorem-brst 与 worldsheet.brst-cohomology-equals-ocq-physical
  两条陈述里**已经被默默使用但没有节点承载**的两个前提（"Q_B 保持 C_rel"与
  "⟨·,·⟩_rel 在上同调上良定义"）。把它们提出来后，那两个节点的陈述可追溯性变强，
  但本轮**不改动那两个节点**（陈述不可变；若 lead 认为应加 uses/depends_on 边，
  可在其推导节点上补边，不需要新建陈述）。

  【(2) 的符号：初稿写成自伴（无负号）是错的，reviewer-ch4 给出反例，2026-09-11 已改正】
  初稿只断言"存在一套符号约定使 ⟨Q_BΨ,Ψ'⟩_rel = ⟨Ψ,Q_BΨ'⟩_rel 成立"，未写死符号。
  在本图实际采用的约定（(AB)† = B†A†、Q_B† = Q_B、⟨Ψ,Ψ'⟩_rel = ⟨Ψ|c_0|Ψ'⟩）下，
  正号版本有显式反例（reviewer-ch4，2026-09-11，curator 独立复核）：取 α'k² = 0、e·k ≠ 0，
    |Ψ⟩ = e·α_{−1}|0;k⟩ ⊗ |↓⟩ （物质 level 1、鬼场 level 0，L_0 = α'k² + 1 − 1 = 0），
    |Ψ'⟩ = b_{−1}|0;k⟩ ⊗ |↓⟩ （物质 level 0、鬼场 level 1，L_0 = 0），
  两者都在 C_rel 中。逐项算得（γ 为 L^m_{±1} 的零模系数，两边相同）
    ⟨Ψ, Q_BΨ'⟩_rel = +γ (e*·k),    ⟨Q_BΨ, Ψ'⟩_rel = −γ (e*·k)，
  关键的一步是 ⟨↓|c_1 c_0 b_{−1}|↓⟩ = −⟨↓|c_0|↓⟩ = −1。e·k ≠ 0 时两者不相等，
  故正号版本为假，负号版本成立。

  (1) 已与 c^m = 26 解耦：[Q_B, L_0] = 0 只用"Q_B 每项的 level 移动为零"，
  不需要 Q_B² = 0。用导子恒等式 [Q_B, {Q_B, b_0}] = [Q_B², b_0] 是同一结论的另一条路，
  它才需要 c^m = 26。c^m = 26 在本节点里只用于"H_rel 是上同调"这一句。
