id: worldsheet.light-cone-gauge
kind: definition
status: rigorous
title: 光锥规范（世界面 diff × Weyl 的规范固定）
statement: |
  在 Polyakov 形式（worldsheet.polyakov-action）中，用世界面微分同胚与 Weyl 重标度的
  规范自由度（worldsheet.polyakov-action-symmetries, worldsheet.polyakov-weyl-invariance）
  施加下列规范条件，合称光锥规范：
    (LC1) X^+(τ, σ) = x^+ + τ，  即世界面时间 τ 与时空光锥时间 X^+ 相等（差一个常数）；
    (LC2) 世界面度规满足 det γ_{ab} = -1（用 Weyl 变换消去整体标度）
          与 ∂_σ γ_{σσ} = 0（这是 (1.3.9)–(1.3.10)「∫ f dσ 不变」论证所用的条件），
          并把 σ 的坐标长度固定为 ℓ（见 conv.worldsheet-coordinate-length）。
  施加 (LC1) 要求 p^+ ≠ 0（即 X^+ 沿世界面严格单调）。
uses: [worldsheet.light-cone-coordinates, worldsheet.polyakov-action,
       worldsheet.polyakov-action-symmetries, worldsheet.polyakov-weyl-invariance]
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.worldsheet-coordinate-length, conv.worldsheet-lorentzian]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, **eq. (1.3.8a,b,c)** 是三条规范条件本身（X⁺ = τ；**∂_σ γ_{σσ} = 0**；det γ_ab = −1），p.17–18；(1.3.9) 是不变长度元 f dσ 的变换律（f = γ_{σσ}(−det γ_ab)^{−1/2}）；(1.3.10) 是逆度规矩阵；p.20 第一行另有波速 c = ℓ/2πα'p⁺（**正文，无式号**）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——**一处订正 + 一条作者自承缺口**】

      ⚠ **订正**：本节点 (LC2) 里的 `∂_σ γ_{σσ} = 0` 旧 note 说是「由 [S] 目录标题推知，
      属 curator 重建，待核对原书」。**现已核实：它就是 (1.3.8b)**，是原书三条规范条件之一，
      不是 (1.3.9)。(1.3.9) 是**不变长度元的变换律** f'dσ' = f dσ（[S] 的标题「Invariance of
      f dσ」是对的，但那不是 ∂_σγ_{σσ} = 0 的出处）。旧 note 的「属 curator 重建」现予撤销。

      ★★ **原书 p.18 脚注 4 的作者自承缺口（本图先前完全没有，且直接封顶本节点的 status）**，逐字：
        "We have shown how to assign a definite (τ,σ) value to each point on the world-sheet, but
         **we have not shown that this is a good gauge — that different points have different
         coordinates**. Already for the point particle τ is a good coordinate only if the world-line
         does not double back through an x⁺-hyperplane. For the string we need this and also that f
         is positive everywhere. It is not hard to show that for allowed classical motions, in which
         all points travel at less than the speed of light, these conditions are met. In the quantum
         theory, one can show for the point particle that the doubled-back world-lines give no net
         contribution. **Presumably this can be generalized to the string, but this is one of those
         fine points not to dwell on.**"
      → **「光锥规范是好规范」在量子层面只是 "Presumably"**：经典情形原书说 "not hard to show"
        （未做），点粒子的量子情形说 "one can show"（未做），弦的量子情形明说是**推测**。
      → 本节点及其下游的 status **不得高于 physical-argument**，且这条限定必须随下游传播。
        本图目前没有把「规范是好规范」单列节点，故它只能作为本条来源的限定存在。

      配套式号（同为 L1，供下游对号入座）：(1.3.11) 光锥规范下的拉氏量；(1.3.12a,b) x^-、Y^-；
      (1.3.13) 边界条件；(1.3.14) γ_{τσ} = 0；(1.3.15) ∂_σX^i = 0 at σ = 0,ℓ；
      **(1.3.17)** p_− = −p⁺ = −(ℓ/2πα')γ_{σσ}（即 γ_{σσ} = 2πα'p⁺/ℓ 的来源）；
      (1.3.18) Π^i；(1.3.19) H。
      见 literature/extractions/polchinski-1998-v1.md §12.5（E10–E19）与 §12.10 表 C 第 1 项。
tags: [bosonic-string, gauge-fixing, light-cone, quantization]
notes: |
  **与既有节点的 τ 归一化差异**：worldsheet.light-cone-quantization 写
  X^+ = x^+ + 2α' p^+ τ_std，本节点（Polchinski）写 X^+ = x^+ + τ_P。
  二者差一个世界面时间重标度 τ_P = 2α' p^+ τ_std（属 diff 的一部分），
  物理内容相同；换算见 conv.worldsheet-coordinate-length。
  在 Polchinski 的归一化下 τ 有长度量纲，且 dX^i/dτ = p^i/p^+，
  这正是模式展开 worldsheet.open-string-mode-expansion 中零模项的形式。

  「规范可完全固定」这一断言本身带有前提（p^+ ≠ 0、不讨论大规范变换/Gribov 问题），
  因而不属于本定义节点：本节点只写下规范条件 (LC1)(LC2) 本身。
  「(LC1)(LC2) 在 p^+ ≠ 0 下把 diff × Weyl 完全固定」作为可错的命题，
  写在 worldsheet.light-cone-gauge-lagrangian 的陈述首句（那里记为 physical-argument）。
