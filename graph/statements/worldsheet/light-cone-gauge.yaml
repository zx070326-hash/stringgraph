id: worldsheet.light-cone-gauge
kind: definition
status: rigorous
title: 光锥规范（世界面 diff × Weyl 的规范固定）
statement: |
  在 Polyakov 形式（worldsheet.polyakov-action）中，用世界面微分同胚与 Weyl 重标度的
  规范自由度（worldsheet.polyakov-action-symmetries, worldsheet.polyakov-weyl-invariance）
  施加下列规范条件，合称光锥规范：
    (LC1) X^+(τ, σ) = x^+ + τ，  即世界面时间 τ 与时空光锥时间 X^+ 相等（差一个常数）；
    (LC2) 世界面度规取单位行列式形式 det γ_{ab} = -1（用 Weyl 变换消去整体标度），
          并把 σ 的坐标长度固定为 ℓ（见 conv.worldsheet-coordinate-length）。
  施加 (LC1) 要求 p^+ ≠ 0（即 X^+ 沿世界面严格单调），
  在此前提下 (LC1)+(LC2) 把 diff × Weyl 完全固定，只留下有限维的剩余变换。
uses: [worldsheet.light-cone-coordinates, worldsheet.polyakov-action]
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.worldsheet-coordinate-length]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.7)–(1.3.10)（规范固定；(1.3.9)/(1.3.10) 的「∫ f dσ 不变」论证）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E10，证据等级：
      「规范固定发生在 (1.3.7)–(1.3.10) 区间，已核实」（Schrans 目录
      「1.6 p 17: Below Eq. (1.3.7) Determining p_+」「1.7/1.8 p 18: Eq. (1.3.9)
      Invariance of f dσ / Fixing the Gauge」「1.9 p 18: Eq. (1.3.10)」）。
      规范条件写成 X^+ = x^+ + τ 的具体形式未逐字核对原书。
tags: [bosonic-string, gauge-fixing, light-cone, quantization]
notes: |
  **与既有节点的 τ 归一化差异**：worldsheet.light-cone-quantization 写
  X^+ = x^+ + 2α' p^+ τ_std，本节点（Polchinski）写 X^+ = x^+ + τ_P。
  二者差一个世界面时间重标度 τ_P = 2α' p^+ τ_std（属 diff 的一部分），
  物理内容相同；换算见 conv.worldsheet-coordinate-length。
  在 Polchinski 的归一化下 τ 有长度量纲，且 dX^i/dτ = p^i/p^+，
  这正是模式展开 worldsheet.open-string-mode-expansion 中零模项的形式。

  「规范可完全固定」这一断言本身带有前提（p^+ ≠ 0、不讨论大规范变换/Gribov 问题）；
  本节点把它作为定义的一部分声明，其论证内容与后果见
  worldsheet.light-cone-gauge-lagrangian（那里记为 physical-argument）。
author: curator-polchinski-ch1
