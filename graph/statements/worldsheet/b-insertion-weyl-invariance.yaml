id: worldsheet.b-insertion-weyl-invariance
kind: proposition
title: S-矩阵公式中的 b 插入与 c 插入是 Weyl 不变的
statement: |
  在 worldsheet.string-s-matrix 的公式 (5.3.9) 中，鬼场 b_ab 与 c^a 本身是 Weyl 不变的
  （它们由 δg_ab 的对称无迹部分与 diff 参数 δσ^a 换来，这两者都不带 Weyl 权）。
  由参考度规的 Weyl 变分
    δĝ_ab = + 2ω ĝ_ab ,   δĝ^{ab} = − 2ω ĝ^{ab} ,   δ(ĝ^{1/2}) = + 2ω ĝ^{1/2}
  逐因子计数可知：模插入
    (b, ∂_{t^k} ĝ) = ∫ d²σ  ĝ^{1/2}  b_ab  ∂_{t^k} ĝ^{ac} ĝ^{bd} …（缩并到 b^{ab}∂_k ĝ_ab 的形式）
  中，各因子的 Weyl 权相消，故整个 b 插入 Weyl 不变；c^a(σ̂_i) 插入同理。

  换言之，b 插入本身在 Weyl 变换下的变分可被鬼场路径积分的鬼数反常吸收，不带来新的
  Weyl 破坏。顶点算子的 Weyl 权（要求 (1,1) 主场，即物质态的质量壳条件）是一个**独立的**
  条件，本卡不覆盖；(5.3.9) 整体的 Weyl 不变性还需要它以及物质 + 鬼场的总中心荷为零。
uses_conventions:
  - conv.worldsheet-euclidean
sources:
