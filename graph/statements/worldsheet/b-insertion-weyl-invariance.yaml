      笔记 p.262：「Now it is just a matter of counting」；**未核对 Polchinski 原书**）。
      ⚠ 本卡 statement 中写出的缩并形式是 curator 为使「权相消」可核对而补的写法，
      抽取记录只给出结论与三条 Weyl 权，**不是来源逐字**。
tags: [worldsheet, s-matrix, ghosts, weyl, moduli]
notes: |
  这条与 worldsheet.s-matrix-diff-invariance 是 §5.4 的一对：先查 Weyl 不变（容易，是数权），
  再查 diff 不变（难，原书只有断言）。两者强度差得很远，故分成两卡。
