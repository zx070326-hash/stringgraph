notes: |
  【本卡为什么是 worldsheet.ten-dimensional-superstring-theories 的依赖】
  那张卡的论证第 (a) 步用到「IIA/IIB 有两个引力微子（N = 2），而开弦多重态是 N = 1 的表示」，
  这一步的前一半正是本卡。

  【「等价关系 ⟹ 局域对称性」这条原则】原书说 'We have learned that such equivalence relations
  are the signature of a local spacetime symmetry'，指向 Vol.1 的相应讨论
  （玻色弦一侧的对应现象是无质量矢量的 e^μ ≅ e^μ + λk^μ ⟹ 规范对称性，
  本图 worldsheet.physical-states-level-one 与 worldsheet.open-string-intercept-v2 涉及）。
  **本图没有把这条原则单独建卡**，故本卡的核心一步在图上无支撑。
  → 待建：worldsheet.null-state-equivalence-signals-gauge-symmetry。
