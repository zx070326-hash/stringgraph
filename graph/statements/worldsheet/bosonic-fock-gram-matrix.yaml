sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/FockGram.lean :: StringFormal.NoGhost.Fock.{creationMonomial, creationMonomial_eq_monomial, creationMonomial_zero, creationMonomial_single, creationMonomial_add_single, creationMonomial_mem_levelSubmodule, commute_creation, foldr_creation_vacuum, annihilation_creationMonomial, annihilation_creationMonomial_add_single, annihilation_creationMonomial_of_apply_eq_zero, pairing_creationMonomial_add_single, pairing_creationMonomial, pairing_creationMonomial_of_ne, pairing_creationMonomial_self, pairing_creationMonomial_of_hypotheses, monomialNorm_one, pairing_creationMonomial_one, basisMonomials_eq_creationMonomial, linearIndependent_creationMonomial, monomialNorm_pos, pairing_creationMonomial_self_pos, pairing_self_pos_of_ne_zero, monomialNorm_single, pairing_creationMonomial_self_eq_zero_zmod_two}"
    note: |
      本仓库，形式化侧提交 **f3603a1**（分支 agent/formalizer/fock-gram），由 lead 以 **05afdea**
      （"Merge branch 'agent/formalizer/fock-gram'"）合入 main；Lean 4 + Mathlib v4.33.1，无 sorry。
      逐条对应：
        (0) → `creationMonomial`（定义）、`creationMonomial_eq_monomial`（= X^d）、
              `creationMonomial_zero` / `_single` / `_add_single`（递归刻画）、
              `creationMonomial_mem_levelSubmodule`（level）、
              `commute_creation`（(H1) 作为 `Module.End` 里的 `Commute`）、
              **`foldr_creation_vacuum`**（沿任意用 `List.count` 枚举 d 的列表逐个作用，结果相同）；
        (1) → **`annihilation_creationMonomial`**，递推形 `annihilation_creationMonomial_add_single`，
              以及 `annihilation_creationMonomial_of_apply_eq_zero`；
        (2) → **`pairing_creationMonomial_of_hypotheses`**（本卡 formal.lean_decl；
              假设逐字为 `hvac`(H4)、`hleft`(H2)、`hright`(H3)，B 是任意 `F →ₗ F →ₗ R`），
              其无条件特例 `pairing_creationMonomial`（`= if d = e then monomialNorm η d else 0`）、
              `_of_ne` / `_self`；η ≡ 1 的字面形 `monomialNorm_one` 与 `pairing_creationMonomial_one`；
              递推步 `pairing_creationMonomial_add_single`；
        (3a) → `monomialNorm_pos`、`pairing_creationMonomial_self_pos`
              （只需 `[CommRing R] [PartialOrder R] [IsStrictOrderedRing R]`，比本卡陈述的全序弱）；
        (3b) → **`pairing_self_pos_of_ne_zero`**（`[LinearOrder R] [IsStrictOrderedRing R]`）；
        (4) → `basisMonomials_eq_creationMonomial` + `linearIndependent_creationMonomial`；
        (f) → `monomialNorm_single` 与 **`pairing_creationMonomial_self_eq_zero_zmod_two`**
              （ZMod 2 上 (α^1_{−1})²|k⟩ 的模 = 2! = 0 的机器反例）。
      **公理检查已由 formalizer 跑过**：`--import StringFormal.NoGhost.FockGram --all`，
      25 条声明全部 ok，只用 propext / Classical.choice / Quot.sound（formal/TODO.md 的
      `fock-gram` 项，2026-09-11）。**curator 未自行重跑 `lake build`**；
      合并 formal 改动时仍应由 lead 跑 `uv run stringgraph check-axioms`。
  - ref: polchinski-1998-v1
    loc: "§4.1，eq. (4.1.16)–(4.1.18)，p.123–124（level 1 态 e·α_{−1}|0;k⟩ 的范数）"
    note: |
      **只覆盖 |d| = 1 的对角元，不承载本卡的递推**。抽取记录
      literature/extractions/polchinski-1998-v1.md#E56，证据等级 [已核实]（式号与内容经第三方笔记复现）。
      Polchinski 在此按 (α^μ_n)† = α^μ_{−n} 直接算单个振子态的范数（即 G(1_{(μ,1)}) = η^{μμ}），
      **不写一般 d 的 Gram 矩阵、不做 Leibniz 归纳、不讨论基环特征**。
      这是本项目在文献侧能定位到的最接近的陈述；一般 d 的公式在教科书里是「自由振子的标准事实」，
      被直接使用而不被陈述（与 worldsheet.transverse-ddf-fock-gram-matrix 的 gsw source note 同一判断）。
  - ref: gsw-1987-v1
    loc: "§2.2.1 'Commutation relations and mode expansions'，p.75 起（振子代数与模式展开）"
    note: |
      定位强度 L4：目录页码由检索后端读取 CUP frontmatter PDF 得到
      （literature/extractions/brst-cohomology-sources.md §5.1），**未逐字核对正文，式号未核实**。
      只定位对象（振子代数与 Fock 空间），**不承载本卡任何结论**。
      GSW 用 mostly-minus，已按 conv.metric-mostly-plus 反号读。
tags: [bosonic-string, fock-space, gram-matrix, oscillator-algebra, positive-definite, characteristic-zero, no-ghost, formalized]
notes: |
  【查重（2026-09-11，curator，分支 agent/curator/lean-wire-5）】
  跑 `uv run stringgraph search Gram / determinant / Fock / 线性无关`。命中并逐卡比对：
  · worldsheet.fock-indefinite-form —— 其 (2) 已给出**同一公式**，但对象是**那一个特定型**
    `Fock.pairing`（Lean 里按单项式基对角地定义）。本卡是条件版 + 算符乘积读法 + 整空间正定 +
    特征零边界，见【不断言】(c) 的四条增量。**不新建会丢掉的正是这四条**，
    其中 ① 是 formal/TODO.md 的 `fock-gram` 项逐字要求「图侧推导应引这条，不要引对角那条」。
  · worldsheet.transverse-ddf-fock-gram-matrix —— 同一段算术在 **DDF 算子 A^i_n 与动量塔**上，
    是条件命题、未形式化（A^i_n 与塔上的型在 Lean 中尚未同时具备）。两卡目标对象不同，
    本卡**不**取代它，只为它提供「假设集自洽 + 条件版蕴含已被机器验证」的对照与升级样板。
  · worldsheet.ddf-operators-adjoint（已 superseded）/ -v2 —— 讲伴随关系本身，不算 Gram 矩阵。
  · worldsheet.transverse-oscillator-commutators —— 只给光锥横向振子的对易子，不算配对。
  ⇒ **没有既有节点承载「创生单项式（作为算符乘积）的 Gram 矩阵之条件版」**。

  【为什么要条件版（本卡存在的核心理由）】Lean 里 `Fock.pairing` 是用
  `basisMonomials.constr` **按单项式基对角地定义**的，所以 `pairing_creationMonomial`
  （= 结论 (2) 的无条件特例）本身廉价：它几乎是定义的展开。数学内容在两处：
  ① `Fock.pairing_unique`（满足 (H2)(H3)(H4) 的型唯一——这是 worldsheet.fock-indefinite-form 的 (1)），
  ② 本卡的 (2)，它把「对角性」从**定义**降级为**结论**：任何满足三条假设的型都有这个 Gram 矩阵。
  只有 ②（Lean 侧 `pairing_creationMonomial_of_hypotheses`，经 `pairing_unique` 归约）
  才与 worldsheet.transverse-ddf-fock-gram-matrix 那种「型不预设对角」的条件命题同型。
  故本卡的 formal.lean_decl 填 `_of_hypotheses` 而**不是** `pairing_creationMonomial`。

  【一卡多条的取舍】(0)(1) 是 (2) 的两个证明步骤，但都独立可陈述且下游会单独引用
  （(0) 是「算符乘积只依赖多重集」，(1) 是 Leibniz 记账），故与 (2) 同卡；
  (3)(4)(f) 是同一个 Gram 矩阵在不同基环假设下的三种读法，也留同卡
  （与 worldsheet.kac-determinant-level-two 把 (1)–(4) 放一卡是同一取舍）。
  若日后 (3b) 的整空间正定要被单独引用（例如无鬼定理的横向正定一步），
  按项目原则应**拆出新卡**而不是改本卡陈述。

  【(f) 的意义：一条机器发现的边界】`pairing_creationMonomial_self_eq_zero_zmod_two`
  是形式化过程中**新发现**的（formal/TODO.md `fock-gram` 项标注「正特征退化（新发现）」）：
  在 worldsheet.transverse-ddf-fock-gram-matrix 的结论 (2) 里，
  「每个对角元是正整数故非零」这一步在有序域上是对的，但它**默默用了特征零**
  （正整数在 ZMod 2 里可以是 0）。只假设「交换环 + 序」不够。
  本卡把这条边界显式登记，并已把它写进那张卡的 notes（同一分支）。

  【下游】(3b) 是无鬼定理「横向 Fock 空间正定」那一步在**协变振子**侧的机器验证样板；
  真正接进 worldsheet.no-ghost-theorem-v4 还要经 DDF 侧的
  worldsheet.transverse-ddf-fock-gram-matrix（未形式化，见那张卡的升级路径）。
