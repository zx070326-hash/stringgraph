id: worldsheet.bosonic-fock-gram-matrix
kind: proposition
title: 玻色振子 Fock 空间上创生单项式的 Gram 矩阵（条件版：对任意满足互伴 (H2)(H3) 与真空归一化 (H4) 的双线性型）——正交、对角元 ∏ (n η^{μμ})^{d} · d!，η > 0 时整个空间正定；「对角元非零」需特征零
statement: |
  【设定】设 D ∈ ℕ，R 是交换环，F = F(D,R) 是 worldsheet.bosonic-fock-space 给出的
  Fock 空间（Osc(D) = {(μ,n) : μ = 0..D−1, n ≥ 1} 上的多项式代数，真空 |k⟩ = 1），
  η 为该卡的对角度规（分量 η^{μμ} ∈ R），算符按该卡
    α^μ_{−n} = 乘以 X_{(μ,n)}（产生），   α^μ_n = (n η^{μμ}) ∂/∂X_{(μ,n)}（湮灭），  n ≥ 1。

  对每个有限支撑的 d : Osc(D) → ℕ 记**创生单项式**

      |{d}⟩ := ∏_{(μ,n)} (α^μ_{−n})^{d(μ,n)} |k⟩ ,

  并记 G(d) := ∏_{(μ,n)} (n η^{μμ})^{d(μ,n)} · d(μ,n)!（有限乘积；整数按 Z → R 的典范同态读入）。

  则：

  **(0) 良定义与次序无关（任意交换环 R）。** 产生算符两两交换，故 |{d}⟩ 与因子次序无关：
  对**任意**枚举多重集 d 的列表 l（即对一切 v ∈ Osc(D)，l 中 v 的出现次数 = d(v)），
  沿 l 逐个作用产生算符所得的向量都等于 |{d}⟩；且 |{d}⟩ = X^d（单项式），
  |{d + 1_{(μ,n)}}⟩ = α^μ_{−n} |{d}⟩，|{d}⟩ 落在 level Σ n·d(μ,n) 的分量里。
  （这正是「|{d}⟩ 是算符乘积 ∏ (α^μ_{−n})^{d(μ,n)} 作用在真空上」这句话的精确含义。
  注意本卡里「产生算符交换」是**定理**而非假设，见【不断言】(a)。）

  **(1) 湮灭算符穿过创生算符串（Leibniz，任意交换环 R）。** 对一切 (μ,n) 与一切有限支撑 d：

      α^μ_n |{d}⟩ = (n η^{μμ}) · d(μ,n) · |{d − 1_{(μ,n)}}⟩

  （d(μ,n) = 0 时右端为 0）。等价的递推形：α^μ_n |{d + 1_{(μ,n)}}⟩ = (n η^{μμ})(d(μ,n)+1) |{d}⟩。

  **(2) 条件 Gram 矩阵（任意交换环 R；本卡的主结论）。** 设 B : F × F → R 是**任意**
  R-双线性型，满足

      (H4) 真空归一化：  B(|k⟩, |k⟩) = 1；
      (H2) 互伴（左）：  B(α^μ_{−n} P, Q) = B(P, α^μ_n Q)   （一切 μ、n ≥ 1、P, Q ∈ F）；
      (H3) 互伴（右）：  B(P, α^μ_{−n} Q) = B(α^μ_n P, Q)   （同上）。

  则对一切有限支撑的 d, e：

      B(|{d}⟩, |{e}⟩) = δ_{d,e} · G(d) = δ_{d,e} · ∏_{(μ,n)} (n η^{μμ})^{d(μ,n)} · d(μ,n)! 。

  特别地（η ≡ 1，即全部 η^{μμ} = 1 的正定度规，如横向扇区）对角元就是字面的
  ∏_{(μ,n)} n^{d(μ,n)} · d(μ,n)!。
  **本条不需要任何序结构、任何特征假设、任何可逆性**，也不假设 B 对称或非退化。

  **(3) η > 0 时整个 Fock 空间正定（需序）。** 设 R 另有全序使之成为严格有序交换环
  （例如 R = ℝ），且 η^{μμ} > 0 对一切 μ。则
    (3a) 每个对角元 G(d) > 0；
    (3b) **对一切 P ∈ F，P ≠ 0 ⇒ ⟨P, P⟩ > 0**，其中 ⟨·,·⟩ 是 (2) 的型
         （由 worldsheet.fock-indefinite-form (1) 它唯一存在）。
  即：型在**整个** F 上正定——不只是「单项式之间正交、对角元为正」，
  而是没有任何非零的零模态或负模态。

  **(4) 创生单项式线性无关（任意交换环 R，且与型无关）。** {|{d}⟩ : d 有限支撑} 是
  F 的一组 R-基，特别地线性无关。**理由是 F 作为 R-模在单项式上自由**
  （worldsheet.bosonic-fock-space 的构造），**不是**由 (2)(3) 的正定性推出的；
  故 (4) 在型退化的情形（见【不断言】(f)）依然成立。

  【本节点明确**不**断言】
  (a) **(H1)（产生算符互相交换）不是本卡的假设**：在 F 上它是定理（乘法交换），
      与之配套的 [α^μ_m, α^ν_{−n}] = (m η^{μμ}) δ^{μν} δ_{mn} 以及 α^μ_n|k⟩ = 0（n ≥ 1）
      同样是定理（worldsheet.bosonic-fock-space）。只有 (H2)(H3)(H4) 是对 B 的假设。
      ⚠ **编号与 worldsheet.transverse-ddf-fock-gram-matrix 不一致**：那张卡的
      (H1) = 振子代数、(H2) = 伴随、(H3) = 真空湮灭、(H4) = 真空归一化；
      本卡沿用 formal/StringFormal/NoGhost/FockGram.lean 的编号，(H2)(H3) 是伴随的**两个方向**、
      (H4) 是真空归一化，而那张卡的 (H1)(H3) 在本卡里是定理。对照两卡时不要按编号硬对。
  (b) **不**断言 (H2)(H3)(H4) 在物理内积/DDF 设定下成立。满足这三条的型**存在且唯一**
      是 worldsheet.fock-indefinite-form 的 (1)；本卡只证「若 B 满足三条，则 (2)」这一步蕴含。
  (c) **不**重复 worldsheet.fock-indefinite-form 的 (2)。那张卡给的是**那一个特定型**
      `Fock.pairing`（按单项式基对角地定义）上的同一公式；本卡的增量是
      ①把 B 放宽为任意满足 (H2)(H3)(H4) 的型（条件版，才是那类条件命题的忠实对应，
      见 notes【为什么要条件版】）、②(0)(1) 把单项式读成**算符乘积**并给出 Leibniz 步、
      ③(3b) 的整空间正定、④(f) 的特征零边界。
  (d) **不**涉及 DDF 算子 A^i_n、不涉及动量塔。本卡只在**单个动量**上的协变振子 Fock 空间里工作。
      DDF 版本是 worldsheet.transverse-ddf-fock-gram-matrix（条件命题，未形式化）；
      本卡**不**证明 DDF 算子满足那张卡的 (H1)–(H4)，那是无鬼岛里另一项义务。
  (e) **不**断言 Minkowski 情形正定：conv.metric-mostly-plus 下 η^{00} = −1，
      类时方向的模为 −n < 0（worldsheet.fock-indefinite-form (4)）。(3) 要求 η 逐分量为正，
      即横向/欧氏扇区——这正是无鬼定理只谈横向扇区的原因。
  (f) **「对角元非零」不对任意交换环成立——「正交基」与正定需特征零。**
      (2) 对任意交换环成立，但「G(d) ≠ 0」不然：在 R = ZMod 2、η ≡ 1 上，
      (α^1_{−1})² |k⟩ 是**非零**向量而其模 G = 2! = 0。
      故正特征下型在创生单项式上真退化（虽由 (4) 它们仍线性无关，但不构成非退化型的正交基）；
      worldsheet.transverse-ddf-fock-gram-matrix 结论 (2) 里的「有序域」假设**承重**，
      它承重的方式是逼出特征零，而不只是提供序。
  (g) 「†」是 R-双线性型意义下的**转置**，不是 Hilbert 空间的 Hermitian 共轭；
      复（半双线性）情形本图与 Lean 侧均未做。继承 worldsheet.fock-indefinite-form
      的 notes【2026-09-11（二）】的同一条限定。(3b) 在 Hermitian 版本里应读作 Σ |c_d|² G(d) > 0。
  (h) 零模（x^μ、p^μ、α^μ_0）、拓扑完化、以及 L_0/物理态条件均不在本卡内：
      继承 worldsheet.bosonic-fock-space 的缺口 (i)(ii)。
uses_conventions: [conv.metric-mostly-plus]
