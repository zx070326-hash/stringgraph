sources:
  - ref: polchinski-1998-v1
    loc: "§4.1（旧协变量子化），p.121–125：level 1 见 eq. (4.1.16)–(4.1.18)，p.123–124（**式号与内容已核实**，抽取记录 #E56，给 A = −1 即 a = 1）；level 2 约 eq. (4.1.19)–(4.1.28)，p.124（页码已核实/式号未核实，#E57，给 D = 26）；节末 p.124–125（页码已核实/式号未核实，#E58）陈述无鬼定理"
    note: |
      这是原书中唯一由一条连贯分析同时定出 a = 1 与 D = 26 的位置，故被 ms.critical-dimension-bosonic
      取为 canonical_source。已按 conv.intercept-sign-a 做 a = −A 换算。
      **无单一位置覆盖本卡片的全部合取**，其余三条路线的位置见下列各条。
  - ref: polchinski-1998-v1
    loc: "§1.3（光锥），约 eq. (1.3.37)–(1.3.42)，p.23–24（页码已核实/式号未核实，抽取记录 #E18）"
    note: |
      原书正文走表示论计数（第一激发级须为无质量 SO(D−2) 矢量）；显式的 [J^{i−}, J^{j−}] 验证
      是习题 1.3。本卡片 (I) 陈述的 Δ_n 显式版本取自 gsw-1987-v1 §2.3.1。
  - ref: polchinski-1998-v1
    loc: "§4.3（BRST），eq. (4.3.10)，p.132（**式号与内容均已核实**，抽取记录 #E64）"
    note: 四条路线中定位最强的一处，但只覆盖 D = 26、不覆盖 a。
  - ref: polchinski-1998-v1
    loc: "§3.4（Weyl 反常）末尾，p.95–96，式号约在 (3.4.24)–(3.4.32) 区间（**完全未核实**，抽取记录 #E53/Q6）"
    note: |
      本卡片定位最弱的一处。抽取记录 Q6 明确要求不写死式号，并要求人工确认原书写的是
      「c^m = 26」还是直接写「D = 26」。硬约束：§3.4 = p.90–96，(3.4.31)（中心荷为常数）在 p.96–97。
  - ref: gsw-1987-v1
    loc: "§2.3.1, eq. (2.3.32)（[J^{i−}, J^{j−}] 的显式计算与 Δ_n）；§2.2.1–2.2.2（OCQ 谱与截距）；§2.3.3, p.102–112（无鬼定理与谱生成代数）"
    note: |
      GSW 用 mostly-minus 号差与 α' = 1/2 的开弦归一化，已转写为 conv.metric-mostly-plus 与
      conv.alpha-prime-regge；Δ_n 的表达式与号差无关。§2.3.3 的页码经核实
      （literature/extractions/brst-cohomology-sources.md §5.1/§5.3），式号未核实。
