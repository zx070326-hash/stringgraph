id: worldsheet.critical-dimension-bosonic-v2
kind: proposition
title: 玻色弦临界维数 D = 26：四条路线各自的前提与结论，外加开弦截距 a = 1
statement: |
  【记号与约定】
  中心荷一律写上标 c^m（物质）、c^g（鬼场），以免与鬼场模式 c_n 撞号。
  开弦物理态条件写 (L_0 − a)|ψ⟩ = 0，截距 a 的符号取 conv.intercept-sign-a：
  Polchinski 写 (L_0 + A)|ψ⟩ = 0 且临界值 A = −1，换算 a = −A，本卡的 a = 1 即原书的 A = −1。

  本命题是下列 (I)–(V) 五条的**合取**：它断言五条各自成立。
  它**不**断言 (I)–(IV) 互相等价，**不**断言由任一条可推出另一条，
  也**不**把四条当作四份互不相关的独立证据（见【"独立"的确切含义】）。

  (I) 光锥路线（洛伦兹代数闭合）。
      前提：开弦光锥规范量子化（worldsheet.light-cone-quantization）；洛伦兹生成元 J^{i−}
      因代入 α^−_n = L^⊥_n/((2α')^{1/2} p^+) 而成为横向模式的三次式（i = 2..D−1）；
      正规序常数取横向零点能的 ζ 正规化值 a = (D−2)/24。
      结论：[J^{i−}, J^{j−}] = −(1/(2α'(p^+)²)) Σ_{n≥1} Δ_n (α^i_{−n}α^j_n − α^j_{−n}α^i_n)，
      其中 Δ_n = n(26−D)/12 + (1/n)[(D−26)/12 + 2(1−a)]（整体归一化依赖 α' 与 p^+ 的约定，
      Δ_n 的形式不依赖）；故洛伦兹代数在 H_lc 上闭合（即对所有 n ≥ 1 有 Δ_n = 0）
      **当且仅当** D = 26 且 a = 1。
      这是四条路线中**唯一**同时定出 D 与 a 的一条，也是唯一以「当且仅当」形式给出 D 的一条。
      （节点：worldsheet.critical-dimension-light-cone）

  (II) 旧协变路线（无鬼定理的等号情形）。
      前提：旧协变物理态空间 H_phys（(L_0 − a)|ψ⟩ = 0 与 L_n|ψ⟩ = 0, n > 0；
      worldsheet.old-covariant-physical-states），H_0 ⊂ H_phys 为其零模态（伪态）子空间；
      本条的一切断言只在非退化（非零）动量扇区上成立（DDF 构造所需）。
      结论：**若** D = 26 且 a = 1，则 (a) Fock 内积在 H_phys 上半正定；(b) H_phys/H_0 上的
      诱导内积正定；(c) H_phys/H_0 与 24 个横向振子的 Fock 空间等距同构。
      **且** D > 26 时（取 a = 1、限于非零动量）存在负模物理态。
      本路线的逻辑形式是「在 (D, a) = (26, 1) 处幺正、在 D > 26 处不幺正」，
      **不是**「幺正 ⟹ D = 26」的等价式：D ≤ 25 一侧本命题**不作断言**
      （该分支在图中另有节点 worldsheet.no-ghost-theorem-subcritical，走补充模 + BRST 相对
      上同调的另一条路线，且附带 D ≥ 2 与三条动量假设）。
      （节点：worldsheet.critical-dimension-old-covariant → worldsheet.no-ghost-theorem-v4）

  (III) BRST 路线（BRST 荷幂零）。
      前提：bc 系统权 λ = 2、鬼场正规序常数 a^g = −1、物质中心荷 c^m 的 BRST 荷 Q_B
      （worldsheet.brst-quantization-v2），作用在**受限模**上——每个向量被除有限多个模式外的
      L^m_n、b_n、c_n 零化，以保证 Q_B 与 Q_B² 逐项有限。
      结论：Q_B² = (1/2) Σ_{m∈Z} ((c^m − 26)/12)(m³ − m) c_{−m} c_m，
      故 Q_B² = 0 ⟺ c^m = 26 ⟺ 总中心荷 c^m + c^g = 0。
      本路线**只**定出 c^m，**不**定出截距 a。
      （节点：worldsheet.critical-dimension-brst）

  (IV) Weyl 反常路线（总中心荷为零）。
      前提：Polyakov 路径积分对 diff × Weyl 取商，Weyl 是**规范冗余**并被用来固定规范
      （worldsheet.conformal-gauge-fixing）；量子层面 Weyl 反常正比于中心荷
      （worldsheet.weyl-anomaly-trace）且该中心荷为常数
      （worldsheet.weyl-anomaly-central-charge-constant）；Faddeev–Popov 鬼场是 λ = 2 的
      bc 系统（worldsheet.faddeev-popov-ghost-action），贡献 c^g = −26
      （worldsheet.bc-ghost-central-charge）。
      结论：反常抵消要求 c^{tot} = c^m + c^g = c^m − 26 = 0，即 c^m = 26。
      本路线同样**只**定出 c^m，**不**定出 a。
      （节点：worldsheet.critical-dimension-weyl-anomaly）

  【(III)(IV) 的结论与「D = 26」的关系】
      (III)(IV) 直接得到的是关于**物质中心荷**的条件 c^m = 26，而不是 D = 26。两者的关系是：
        · 作为对理论的**约束**，c^m = 26 比 D = 26 **弱**：任何中心荷为 26 的物质 CFT 都满足它
          （紧化、非几何背景等），平坦的 26 维时空只是其中一个解；
        · 作为**结论**，c^m = 26 比 D = 26 **强**：它对任意物质 CFT 成立，
          而不只对 D 个平坦自由玻色子成立。
      要由 c^m = 26 得到 D = 26，必须再加一步
        c^m = D  （D 个平坦自由玻色子的中心荷；worldsheet.free-boson-central-charge-d），
      该步是 (III)(IV) 的**公共输入**，不是任一条路线自身的产物。
      在物质部门取 D 个平坦自由玻色子这一情形下，(III)(IV) 各自给出 D = 26。

  (V) 开弦截距 a = 1，**只对开弦**，且与 D 的取值无关地成立。
      下列三条刻画对任意 D ≥ 4 都各自等价于 a = 1：
        (a) level N = 1 的态无质量；
        (b) 第一级伪态 L_{−1}|0;k⟩ ∝ k·α_{−1}|0;k⟩ 同时满足物理态条件（因而是零模态），
            从而矢量态的偏振有规范自由度 e^μ → e^μ + λ k^μ；
        (c) level 1 的独立态构成无质量小群 SO(D−2) 的矢量表示，
            而非有质量小群 SO(D−1) 的某个表示。
      a = 1 出现在路线 (I) 的结论与路线 (II) 的前提里；路线 (III)(IV) 完全不涉及 a。
      本命题**不**对闭弦作任何断言：闭弦的对应量是 (a, ã) = (1, 1) 与质量壳 α'm²/4 = N − a，
      本图未建节点。
      （节点：worldsheet.open-string-intercept-v2）

  【"独立"的确切含义】
      「四条独立论证」在本命题中**只**指**论证方式**独立，不指输入独立：
        · (III) 与 (IV) 共享 c^g = −26（worldsheet.bc-ghost-central-charge）与
          c^m = D（worldsheet.free-boson-central-charge-d）两个输入，判据都是同一个数
          c^m − 26 = 0；差别只在把这两个输入拼起来的机制——(III) 是模式代数中 {Q_B, Q_B}
          的计算，(IV) 是路径积分测度的 Weyl 变分。若 c^g 或 c^m 的计算有误，两条同时失效，
          故**不得**把 (III)(IV) 当作两份互不相关的证据。
        · (II) 与 (III) 之间有一条已建的等价节点 worldsheet.brst-cohomology-equals-ocq-physical
          （BRST 相对上同调 ≅ H_phys/H_0）；本命题不使用它，也不因此断言两条路线等价。
        · (I) 与 (II)(III)(IV) 之间的等价在本图中**无节点**。
        · (I) 与 (V) 共享光锥一侧的输入（横向振子对易关系、开弦质量壳、
          ζ 正规化的正规序常数）。

  【本命题不断言什么】
      (1) 不断言 (I)–(IV) 互相蕴含或等价（见上一节）。
      (2) 不断言 D ≤ 25 时会发生什么（无论 a 取何值）。
      (3) 不对闭弦截距、闭弦质量壳、或紧化背景（c^m = 26 但 D ≠ 26 的解）作断言。
      (4) 不断言 D = 26 是玻色弦一致性的**充分**条件（相互作用、模不变性、快子等均在范围外）。
      (5) 不断言 a = 1 与 D = 26 之间有蕴含关系：(V) 的三条刻画对任意 D ≥ 4 都等价于 a = 1，
          而 (III)(IV) 完全不给 a。
