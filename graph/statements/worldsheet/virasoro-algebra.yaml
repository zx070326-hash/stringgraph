id: worldsheet.virasoro-algebra
kind: definition
status: rigorous
title: Virasoro 代数
statement: |
  Virasoro 代数 Vir 是由 {L_n : n ∈ Z} 与中心元 c 张成的复李代数，李括号为
  [L_m, L_n] = (m-n) L_{m+n} + (c/12) m (m^2-1) δ_{m+n,0}，[L_n, c] = 0。
  它是圆周上多项式向量场李代数（Witt 代数）的唯一非平凡中心扩张。
uses: []
uses_conventions: [conv.virasoro-standard]
sources:
  - ref: polchinski-1998-v1
    loc: "§2.6, eq. (2.6.19)"
  - ref: virasoro-lean-2025
    loc: "Lean 形式化定义"
tags: [cft, algebra, lie-algebra]
notes: |
  形式化状态（2026-09-10，lean-formalizer）：本卡片的**定义部分**已在 Lean 中完成，
  `StringFormal.Virasoro.VirasoroAlgebra R`（`R` 为交换 ℚ-代数）带 `LieRing` 与
  `LieAlgebra R` 实例，括号关系见 `VirasoroAlgebra.lie_lgen_lgen`，中心性见
  `VirasoroAlgebra.cgen_lie` / `.ofCentre_lie`，中心扩张的正合性见
  `.toWitt_surjective` / `.ofCentre_injective` / `.toWitt_eq_zero_iff`。
  公理检查：只依赖 propext / Classical.choice / Quot.sound。

  **缺口**：statement 文本最后一句"它是 Witt 代数的**唯一**非平凡中心扩张"**没有**形式化。
  这需要 H²(Witt, R) 一维且由 Virasoro cocycle 的类生成；Mathlib v4.33.1 有 2-cocycle
  （`LieModule.Cohomology.twoCocycle`）但**没有** 2-coboundary 与上同调商，无法直接表述。
  因此本节点 status 保持 `rigorous` 而非 `formalized`。

  **建议**（需 lead/curator 决定）：把这张卡片拆成两条——
  (a) 定义卡（生成元、括号、中心性），可标 `formalized`；
  (b) 命题卡"Virasoro 是 Witt 代数的唯一一维非平凡中心扩张"（Kytölä arXiv:2510.21741
      形式化了 H²≠0 与一维性，可作为其 `formalized` 推导的来源）。
  在拆分前，本卡片的有效状态以 (b) 为准，即 `rigorous`。

  【已拆分，2026-09-11，curator；lead 裁决 2026-09-10，见 docs/ROADMAP.md 待拆清单】
  上面 formalizer 建议的 (a)(b) 两卡已建立：
  - (a) worldsheet.virasoro-algebra-v2（definition，**formalized**）——本卡片陈述的
    前两行（生成元、括号、中心性）逐字保留，另把 Lean 中已证的模同构 Vir ≅ W(R) × R、
    张成性与中心扩张正合列写进陈述；本卡片的 formal 字段所指的声明只覆盖这一部分。
  - (b) worldsheet.virasoro-unique-central-extension（proposition，推导 --via-witt-cohomology，
    **rigorous**）——本卡片陈述第三行的唯一性断言，并把「扩张等价」与「李代数同构」
    两层含义分开写清。它仍未形式化（Mathlib v4.33.1 无 2-上边缘与上同调商）。
  另新建 math.witt-algebra（definition，formalized）承载本卡片陈述里顺带提到的 Witt 代数。

  **本卡片自 2026-09-11 起冻结**：全图中所有原先引用本 id 的 `uses` 与 `depends_on`
  已就地改指 (a)（它们用到的都是括号关系，(a) 逐字包含）；没有一处用到唯一性断言。
  唯一保留的引用是本卡片同批被取代的 worldsheet.verma-module 的 `uses`
  （两张旧卡一起冻结成历史快照），以及若干节点 notes / 陈述文本里的历史性提及。
