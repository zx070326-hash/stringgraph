id: worldsheet.polyakov-nambu-goto-classical-equivalence
kind: proposition
title: Polyakov 作用量与 Nambu–Goto 作用量的经典等价
statement: |
  Polyakov 作用量 S_P[X, γ]（worldsheet.polyakov-action）对世界面度规 γ_{ab} 的变分给出
  世界面能动张量为零的约束
    T_{ab} ≡ -(4π/(-γ)^{1/2}) δS_P/δγ^{ab} = 0,
  等价地
    ∂_a X^μ ∂_b X_μ - (1/2) γ_{ab} γ^{cd} ∂_c X^μ ∂_d X_μ = 0.
  在诱导度规 h_{ab} = ∂_a X^μ ∂_b X_μ 非退化处，该约束的通解是
    γ_{ab} = f(τ,σ) h_{ab},  f > 0 任意（这是 Weyl 自由度）。
  把通解代回 S_P，f 完全相消，得
    S_P[X, γ = f h] = -(1/(2π α')) ∫ dτ dσ (-det h)^{1/2} = S_NG[X].
  因此在 h_{ab} 非退化处，S_P 与 S_NG 给出相同的 X^μ 经典运动方程。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.worldsheet-lorentzian]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.2, p.12 的五步：**(1.2.14)** `δ_γS_P` 的显式变分 → **(1.2.15)** 行列式变分 `δγ = γγ^{ab}δγ_ab = −γγ_abδγ^{ab}` → **(1.2.16)** `h_ab = ½γ_abγ^{cd}h_cd`（即 T_ab = 0 的展开形式）→ **(1.2.17)** `h_ab(−h)^{−1/2} = γ_ab(−γ)^{−1/2}`（消去 Weyl 因子）→ **(1.2.18)** `S_P[X,γ] → −(1/2πα′)∫dτdσ(−h)^{1/2} = S_NG`（**经典等价的结论式**）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E6。
      **【订正 2026-09-11（curator-v1-sec13，researcher 第七轮 L1 页图逐字）】**
      旧 loc「约 eq. (1.2.15)–(1.2.16)」**只指到中间步**：
      - (1.2.15) 是行列式变分这条**技术引理**（页码 p.12 与内容此前已由 Schrans 目录核实，现升 **L1**）；
      - (1.2.16) 是 `h_ab = ½γ_abγ^{cd}h_cd`，即本节点陈述第二式的原书形式；
      - **本节点真正断言的那件事（代回后 S_P = S_NG）是 (1.2.18)**，
        中间还多一步 (1.2.17)（把 Weyl 因子写成 `h_ab(−h)^{−1/2} = γ_ab(−γ)^{−1/2}`）。
      「T_ab = 0 约束的公式号未核对原书」这句作废。

      ⚠ **记号张力：已由 reviewer-batch14（2026-09-11）裁定「只加 note，不换代」**，理由是
      本节点断言的是 `T_ab = 0`，而下列两处差异都只是**整体非零因子**，不影响该结论。
      两处差异逐条：
      (a) **整体符号**：本节点 statement 写 `T_{ab} ≡ −(4π/(−γ)^{1/2}) δS_P/δγ^{ab}`
          （下指标、对 `γ^{ab}` 变分），而**原书 (1.2.22)（p.13）逐字是
          `T^{ab} = −4π(−γ)^{−1/2}(δ/δγ_ab)S_P`**（上指标、对 `γ_ab` 变分）。
          因 `δγ_ab = −γ_acγ_bd δγ^{cd}`，逐字比对时两者差一个整体符号。
      (b) **少一个因子 −1/α'**：原书 (1.2.22) 的显式式是
          `T^{ab} = −(1/α')(∂^aX^μ∂^bX_μ − ½γ^{ab}∂_cX^μ∂^cX_μ)`，
          而本节点 statement 第二式写的是括号内那部分
          `∂_aX^μ∂_bX_μ − ½γ_abγ^{cd}∂_cX^μ∂_dX_μ = 0`，**省掉了前置的 −1/α'**。
      ⇒ 下游若要引用本节点的 `T_ab` **本身**（而不是「它为零」），必须先补上 (a)(b) 两个因子；
        凡只用 `T_ab = 0` 的边不受影响。
      **不换代的边界**：若日后有节点需要 `T_ab` 的**归一化数值**（如接到 conv.worldsheet-stress-tensor-normalization
      或场论通行定义），应新建一张写全因子的卡，而不是改本卡文本（项目原则 1）。
      另注意 (1.2.22) 下方原书自陈其 `T^{ab}` **比场论通行定义多一个 `−2π`**
      （逐字见 worldsheet.energy-momentum-tensor-free-scalar 的 notes）。
      见 literature/extractions/polchinski-1998-v1.md §13.3(b)(c) 的 §1.2 式号全表。
tags: [bosonic-string, action, classical, equivalence, polyakov, nambu-goto]
notes: |
  只主张**经典**等价。量子等价（路径积分层面）不在 §1.2 论证，
  且事实上 Polyakov 形式在量子层面多出 Weyl 反常（见第 3 章 §3.4），
  这正是两者量子上不等价的表现。抽取记录 #E6 明确标注「注意这只是经典等价」。
author: curator-polchinski-ch1
created: "2026-09-10"
