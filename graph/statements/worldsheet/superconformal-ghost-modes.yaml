id: worldsheet.superconformal-ghost-modes
kind: definition
status: rigorous
title: 超共形鬼场 βγ 与 bc 的模式、基态与鬼场 Virasoro/超 Virasoro 生成元
statement: |
  超弦的鬼场部门由两对场组成：
    反对易的 (b, c)，权 (2, 0) 与 (−1, 0)（与玻色弦相同）；
    **对易**的 (β, γ)，权 (3/2, 0) 与 (−1/2, 0)。
  在扇区参数 ν（worldsheet.rns-fermion-periodicity）下模式展开为
    β(z) = Σ_{r ∈ Z+ν} β_r / z^{r + 3/2},    γ(z) = Σ_{r ∈ Z+ν} γ_r / z^{r − 1/2},
    b(z) = Σ_{m ∈ Z} b_m / z^{m+2},          c(z) = Σ_{m ∈ Z} c_m / z^{m−1},
  （反）对易关系
    [γ_r, β_s] = δ_{r,−s},    {b_m, c_n} = δ_{m,−n}。
  **基态**（按原书的分组：β_0 归入降算符、γ_0 归入升算符，与玻色弦的 b_0/c_0 分组平行）
    NS： β_r|0⟩_NS = 0 (r ≥ 1/2)，  γ_r|0⟩_NS = 0 (r ≥ 1/2)；
    R ： β_r|0⟩_R  = 0 (r ≥ 0)，    γ_r|0⟩_R  = 0 (r ≥ 1)；
    bc： b_m|0⟩ = 0 (m ≥ 0)，       c_m|0⟩ = 0 (m ≥ 1)。
  **鬼场生成元**
    L^g_m = Σ_n (m+n) °b_{m−n} c_n° + Σ_r (1/2)(m + 2r) °β_{m−r} γ_r° + a^g δ_{m,0},
    G^g_r = − Σ_n [ (1/2)(2r + n) β_{r−n} c_n + 2 b_n γ_{r−n} ]，
  其中 a^g 是鬼场正规序常数，本卡**保持为符号**（值见
  worldsheet.superconformal-ghost-normal-ordering-constants）。

  **一条真实的约束（BRST 荷存在性的前提）**：β 与 γ 的周期性**必须**与它们所配的约束 T_F 相同
  （即同一个 ν）。原书逐字：'The ghosts β and γ must have the same periodicity (10.2.4) as the
  generator T_F with which they are associated. This is necessary to make the BRST current
  periodic, so that it can be integrated to give the BRST charge.'

  本卡是定义。它**不**断言 L^g_m、G^g_r 满足超 Virasoro 代数、不断言 a^g 的值、
  也**不**断言这个 Fock 空间上的内积性质。
uses:
  - worldsheet.bc-ghost-cft
  - worldsheet.rns-fermion-periodicity
  - worldsheet.superconformal-ghost-central-charge
  - worldsheet.conformal-normal-ordering-v2
uses_conventions:
