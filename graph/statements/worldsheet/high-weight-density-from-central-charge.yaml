id: worldsheet.high-weight-density-from-central-charge
kind: proposition
title: "紧酉 CFT 的高权态密度由中心荷决定：Z(iℓ) ≈ exp[π(c+c̃)/(12ℓ)]（ℓ → 0）"
statement: |
  设一个**紧、酉**的二维 CFT，其环面配分函数按 worldsheet.torus-partition-function-general-cft
  定义并**假设模不变**。取 τ = iℓ（纯虚），则
    Z(iℓ)  ≈  exp[ π(c + c̃) / (12 ℓ) ]     当 ℓ → 0 ,
  其中 ≈ 是原书使用的渐近记号（**无误差估计**）。
  由于 ℓ → 0 时收敛因子 q = exp(−2πℓ) → 1，配分函数由**高权态的密度**决定，
  故上式等价地说：高权处的态密度由中心荷决定。自由玻色子情形 c = c̃ = d 只是数玻色子个数。

  ⚠ **适用条件（原书同页脚注 1，逐字必须带上）**：
  「To be precise, the result holds in **compact unitary** CFTs. In nonunitary theories there are
  usually operators of negative weight, whose contribution will dominate that of the unit operator.
  In the linear dilaton theory, the central charge depends on V^μ but the density of states does not:
  here the exception occurs because of complications due to the **noncompactness** of X^μ combined
  with **lack of translation invariance**.」

  **本卡不断言什么**：不给出态密度的具体渐近形式（原书不写 Cardy 公式的
  exp(2π√(ch/6)) 形式，也**不引 Cardy**）；不给出误差项；不断言反向（由态密度定中心荷）。
