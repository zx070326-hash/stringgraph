notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E14 建立。

  **为什么建这张卡**：抽取记录称其脚注是「本章质量最高的假设显式化样本」。
  它同时是抽取记录 Q2 的一半：τ₂ → ∞ 端「无快子时求和是否收敛」这一问题，
  正是本卡的态密度增长 exp[π(c+c̃)/(12ℓ)] 与压制因子 exp(−πα'm²τ₂) 的竞争，
  而原书用一句「in the absence of tachyons it will converge」带过
  （spectrum.one-loop-torus-amplitude 的 gaps 已记）。**本图目前没有该收敛性的节点**，
  留给 lead/auditor 按 Q2 裁决。
