    note: |
      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E14，等级 **L1（原书页图逐字）**。
      原文的论证骨架逐字：「Consider the partition function for τ = iℓ as ℓ → 0. The convergence
      factor q = exp(−2πℓ) is approaching unity, so the partition function is determined by the
      density of states at high weight. **Using modular invariance**, this is equal to the partition
      function at τ = i/ℓ. In the latter case, q = exp(−2π/ℓ) is going to zero, so the state of lowest
      weight dominates the sum. This is the unit state, with L₀ = L̃₀ = 0, giving …」
      ⚠ **原书没有把它叫作 Cardy 公式，也没有引 Cardy**（抽取记录 §3.3 第 4 条）。
