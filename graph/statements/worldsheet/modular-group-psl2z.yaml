  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/MathlibBridges.lean :: **StringFormal.Bridge.psl2z_im_smul_eq**（卡面 Im(γ·τ) = Im τ/|cτ+d|² 这一行的数学来源；桥层逐字重述 Mathlib 的 `ModularGroup.im_smul_eq_div_normSq`）"
    note: |
      **本条专为卡面那一行的恒等式而设（curator，2026-09-11，small-backlog-7 #4）。**
      桥层声明的内容是 `(g • τ).im = τ.im / ‖(g 1 0) * τ + (g 1 1)‖ ^ 2`，即
      Im(γ·τ) = Im τ / |cτ + d|²（(c, d) = (g 1 0, g 1 1)），Lean 4 + Mathlib v4.33.1。
      数学内容**全部属 Mathlib**（`ModularGroup.im_smul_eq_div_normSq`），桥层只做逐字重述——
      归属见下面第三条 source 引的桥层文件头 "What is *not* claimed here"。
      ⇒ 本行的**数学正确性**已在 Lean 侧验证；上面第一条 source 的 note 记录的是另一件事：
      **Polchinski 原书是否写出它未核**（物理文献一手出处的记账缺口）。
      ⚠ 本条**不**使本卡的 formalized 依赖于这一行：本卡整体的 formalized 依据是
      lean_decl `psl2z_smul_eq` 加下面第二条 source 里逐条列出的 (a)–(d) 对应，
      `psl2z_im_smul_eq` 是那份清单里的 (b)，本条只是把它单独提出来对准卡面的这一行。
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/MathlibBridges.lean :: StringFormal.Bridge.psl2z_smul_eq（本卡 formal.lean_decl）；同文件 psl2z_im_smul_eq、psl2z_T_smul、psl2z_S_smul、neg_smul_eq、neg_one_smul_eq、neg_one_mem_center、center_eq_pm_one、center_le_ker_toPermHom、smul_eq_of_pslMk_eq、pslPermHom、pslMk_smul、PSL2Z、pslMk"
    note: |
      本仓库，桥层提交 **c15b0db**（"formal: bridge PSL(2,Z) card to Mathlib; prove
      Z(SL(2,Z)) = {+-I} and the descent of the H-action"），分支合并提交 **845b9b9**；
      Lean 4 + Mathlib **v4.33.1**。`formal.lean_decl` 所指声明全文：

          theorem psl2z_smul_eq (g : SL(2, ℤ)) (τ : ℍ) :
              ((g • τ : ℍ) : ℂ) =
                ((g 0 0 : ℂ) * (τ : ℂ) + (g 0 1 : ℂ)) / ((g 1 0 : ℂ) * (τ : ℂ) + (g 1 1 : ℂ))

      即卡面 γ·τ = (aτ + b)/(cτ + d)，(a, b; c, d) = (g 0 0, g 0 1; g 1 0, g 1 1)。

      **卡面五项与桥层声明的逐条对应**（每条都是逐字重述，证明是 `rfl` / `simp` / 引用 Mathlib）：
      (a) 群与作用 γ·τ = (aτ+b)/(cτ+d) → `psl2z_smul_eq`（= lean_decl）；
          载体是 Mathlib 的 `SL(2, ℤ)`（`Matrix.SpecialLinearGroup (Fin 2) ℤ`，det = 1 的整数矩阵）
          与它在 `ℍ` 上的 `MulAction`。
      (b) 作用保持 H，且 Im(γ·τ) = Im τ/|cτ + d|² → `psl2z_im_smul_eq`
          （`(g • τ).im = τ.im / ‖(g 1 0) * τ + (g 1 1)‖ ^ 2`，Mathlib
          `ModularGroup.im_smul_eq_div_normSq`）；「保持 H」在 Lean 侧还内建于作用的类型
          （作用的靶就是 `ℍ`）。
      (c) γ 与 −γ 给出同一分式线性映射 → `neg_smul_eq`、`neg_one_smul_eq`；
          有效作用的群是 PSL(2,Z) = SL(2,Z)/{±I} → `PSL2Z`（= Mathlib 的 `PSL(2, ℤ)`
          `= SL(2,ℤ) ⧸ Z(SL(2,ℤ))`）+ **`center_eq_pm_one`**（`Z(SL(2,ℤ)) = {1, −1}` 作为集合，
          这条 Mathlib 没有，是本项目自己证的）+ `center_le_ker_toPermHom`、
          `smul_eq_of_pslMk_eq`、`pslPermHom` 与 `MulAction PSL2Z ℍ` 实例（`pslMk_smul`）。
      (d) T = ((1,1),(0,1)) : τ ↦ τ + 1 → `psl2z_T_smul`；
          S = ((0,−1),(1,0)) : τ ↦ −1/τ → `psl2z_S_smul`。
          两个矩阵与卡面逐字一致：Mathlib `ModularGroup.coe_T = !![1, 1; 0, 1]`、
          `ModularGroup.coe_S = !![0, -1; 1, 0]`（v4.33.1，
          `Mathlib/LinearAlgebra/Matrix/SpecialLinearGroup.lean` L825–L840，curator 读源码 L1 核对）。
      ⇒ 卡面断言无一遗漏，故本卡 status 由 rigorous 升为 **formalized**。
      **check-axioms 运行记录（curator lean-wire-10, 2026-09-11，在主工作树 D:\physics\string 上，
      其 `.lake` 构建时间 13:54:53 晚于源文件 13:53:02）**：上列 12 条有证明内容的声明
      `12 ok, 0 non-standard, 0 missing; 0 errors`，公理集合一律
      `propext Classical.choice Quot.sound`。
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/MathlibBridges.lean 文件头 docstring 的 \"What is *not* claimed here\" 一节"
    note: |
      **诚实归属**：(a)(b)(d) 的数学内容全部是 Mathlib 的
      （`UpperHalfPlane.coe_specialLinearGroup_apply`、`ModularGroup.im_smul_eq_div_normSq`、
      `UpperHalfPlane.modular_T_smul`、`UpperHalfPlane.modular_S_smul`、`ModularGroup.SL_neg_smul`），
      桥层只做逐字重述。本项目自己新证的只有 (c) 里的 `center_eq_pm_one`
      （经 `Matrix.SpecialLinearGroup.mem_center_iff`：中心元是纯量阵 r·I 且 r² = 1，在 ℤ 上迫使 r = ±1）
      及其两个推论 `center_le_ker_toPermHom`、`smul_eq_of_pslMk_eq`。
      桥层文件头逐字声明**不**断言的内容，与本卡 notes 里列的三条「本卡不断言」一致：
      不证 PSL(2,Z)-作用的**忠实性**、不证由 S、T 生成
      （那是 worldsheet.modular-group-generated-by-s-and-t）、不给基本域、不断言它是环面的模等价。
tags: [worldsheet, torus, modular-group, psl2z, moduli]
notes: |
  本卡只是群及其作用的定义，status = rigorous 指定义本身精确，**不**断言
  (i) 它就是环面的等价关系（worldsheet.torus-modular-equivalence），
  (ii) 它由 S、T 生成（worldsheet.modular-group-generated-by-s-and-t），
  (iii) 它有基本域 F₀（worldsheet.modular-fundamental-domain）。三条都是命题，状态各自计算。

  **2026-09-11（curator lean-wire-10）：status rigorous → formalized。** 依据是 formalizer 新建的
  桥层 `formal/StringFormal/Math/MathlibBridges.lean`（`namespace StringFormal.Bridge`），见上面
  第二、三条 source。`lean_decl` **不得直指 Mathlib**（`Matrix.ProjectiveSpecialLinearGroup` 等），
  必须指桥层的逐字重述——formal/CLAUDE.md 的「桥层规则」。

  **卡面有一处隐含依赖，在 Lean 侧被显式化了（记账）**：卡面从「γ 与 −γ 给出同一映射」
  直接跳到「有效作用的群是 SL(2,Z)/{±I}」。这一步实际用的不只是 −I ∈ Z(SL(2,Z))，
  而是**中心恰等于 {±I}**——否则 Mathlib 的 `PSL(2,ℤ) = SL(2,ℤ) ⧸ Z(SL(2,ℤ))`
  未必等于卡面写的那个商 SL(2,Z)/{±I}。桥层的 `center_eq_pm_one` 正是补上这一步
  （Mathlib 没有这条；`StringFormal/Math/ModularGroupGenerators.lean` 此前刻意只用了 −I ∈ Z）。
  ⇒ 本卡在 Lean 侧比在卡面上更明确，但**断言集合相同**，不构成换代理由。

  **「有效作用」的读法（口径，2026-09-11）**：本卡的「有效作用的群是 PSL(2,Z)」按
  「作用下降到的商群」读，即 Z(SL(2,Z)) 落在作用核里、作用良定义地降到 PSL(2,Z)
  （Lean: `center_le_ker_toPermHom` + `smul_eq_of_pslMk_eq` + `MulAction PSL2Z ℍ` 实例）。
  它**不**按「忠实作用」读：核恰等于中心（即 PSL(2,Z) → Perm ℍ 单）本卡不断言，
  Lean 侧也没证，两边口径一致，故不影响 formalized。
  若将来有人要用忠实性，正确做法是新建一张命题卡（它是真的，但需要证明），
  不要重读本卡的这句话。

  **【记账缺口：Im(γ·τ) = Im τ/|cτ+d|² 的物理文献一手出处】（curator，2026-09-11，small-backlog-7 #4；
  ★ 2026-09-11 由 researcher 第十三轮关闭，结论 negative）**
  卡面这一行此前只标「curator 补，不是来源逐字」，图上没有任何 source 对准它。处理经过：
    (1) 复查抽取记录 literature/extractions/polchinski-1998-v1.md：§5.1 的 (5.1.12)/(5.1.13) 附近
        **没有**该恒等式；
    (2) 因此给它单独加了一条 stringformal-2026 source，指桥层 `StringFormal.Bridge.psl2z_im_smul_eq`
        （Mathlib `ModularGroup.im_smul_eq_div_normSq` 的逐字重述）作为**数学**来源；
    (3) ★ **原写「Polchinski §5.1 印刷 p.148 是否写出该式仍未核，留给 researcher」已完成**：
        researcher 第十三轮读了印刷 pp.145–151 的 Cambridge Core 页图（抽取记录 §20，L1），
        **答案是「没有」**——全节不印此式，连记号 τ₂ 都要到第 7 章才引入。
        ⇒ 缺口的性质变了：不再是「未核」，而是「**原书确实不印，此行在本项目内只有 Mathlib 一个来源**」。
        第一条 source 的 loc 已据 §20.5 的建议收紧到 (5.1.13) 与 (5.1.14) 下方散文两处。
  ⚠ 这条缺口**不**影响本卡的 status：定义卡的 formalized 由 lean_decl 与逐条对应清单承担，
  而该恒等式在 Lean 侧已验证；缺的只是"物理书上写在哪一行"这条引文（现已确认：哪一行都没有）。
  ⚠ 定义卡没有 `gaps` 字段（那是推导的字段），故本缺口记在本 notes 与 source note 里。

  **【researcher 第十三轮的另两条发现，记账】（抽取记录 polchinski-1998-v1.md §20.3，L1 页图）**
  (A) **原书把「modular group」这个名字挂在 (5.1.14) 上，不是挂在 τ 的分式线性作用 (5.1.13) 上。**
      p.148 逐字：「The transformation [σ¹; σ²] = [[d, b],[c, a]] [σ′¹; σ′²]  (5.1.14) … These large
      coordinate transformations form the group SL(2,Z) … The group of transformations **(5.1.14)**
      is known as the *modular group*.」即书里的模群首先是**世界面上的大坐标变换（微分同胚）**；
      τ-平面上的 PSL(2,Z) 是紧接一句里的另一个说法（"The group on the τ-plane is SL(2,Z)/Z₂ = PSL(2,Z)"）。
      ⚠ 顺带：(5.1.14) 印的矩阵元排列是 **[[d, b],[c, a]]**，不是 [[a,b],[c,d]]。
      ⇒ 本卡正文写「模群 = PSL(2,Z) 作用在上半平面上」是**通行说法**，但**不是原书那一句的逐字含义**。
      按原则 1 与 graph/CLAUDE.md 不改正文，只在此记明；下次实质换代时可考虑把两个空间分开写。
  (B) **「S、T 生成模群」在原书 §5.1 与 §7.2 两处都只断言、不证。** §5.1 (5.1.12) 上方逐字只说
      "Repeated application of these two transformations … generates (5.1.13)"，无证明无引文；
      §7.2 p.210 再次用而不证（ch7 抽取记录的 negative-evidence 第 6 条）。
      ⇒ **同一个缺口在两章各出现一次**。本图对应的卡
      worldsheet.modular-group-generated-by-s-and-t-v2 的论证全部来自 Lean/Mathlib，
      其 sources 已同记此条；任何把生成性挂在 Polchinski §5.1 上并给较高 status 的节点都应降级
      （researcher §20.5 的提醒；本图目前没有这样的节点）。
  (C) 原书对「为什么恰好是这两个生成元」给出的**全部**依据是格点标号上的作用：
      τ → τ+1 是 (m,n) → (m−n, n)，τ → −1/τ 是 (m,n) → (n,−m)（p.148 逐字）。

  **【两条断言已拆成独立命题卡】（curator small-backlog-9, 2026-09-11，lead 派工第 3 项）**
  本卡一张卡承担五件事——(i) 群 SL(2,Z)、(ii) Möbius 作用的公式、(iii) Im 变换式与「保持 H」、
  (iv) γ 与 −γ 同一映射 ⇒ 取商到 PSL(2,Z)、(v) S、T 两个标准元素——而四条 `--via-lean` 推导
  都只能整张挂它，谁用了哪一件在图上看不出来。本轮拆出两张命题卡：
    · **math.mobius-action-preserves-upper-half-plane**（= (iii)，own=formalized，
      `lean_decl: StringFormal.Bridge.psl2z_im_smul_eq`）；
    · **math.sl2z-center-is-pm-one**（= (iv) 里那条**此前在图上完全没有节点**的关键事实
      Z(SL(2,Z)) = {±I}，own=formalized，`lean_decl: StringFormal.Bridge.center_eq_pm_one`）。
  **本卡 statement 一字未改，也不加 `superseded_by`**：拆出不是换代，本卡的断言集合不变。
  下游按各自**实际用到的部件**加边指新卡，指向本卡的边一律保留（它仍供给群与作用的定义）。
  ⇒ 上面「卡面有一处隐含依赖，在 Lean 侧被显式化了（记账）」一段讲的正是
  math.sl2z-center-is-pm-one 那件事，现在它有自己的卡可以引了。
  三张卡 own status 都是 formalized，故拆卡与改边**不改变任何下游的 effective**；收益是可追溯性。
