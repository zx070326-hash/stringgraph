    loc: "§5.1, eq. (5.1.13), p.148（一般模变换 τ' = (aτ+b)/(cτ+d)，ad − bc = 1）；§5.1, (5.1.14) 下方散文, p.148（**无式号**：「The group on the τ-plane is SL(2,Z)/Z₂ = PSL(2,Z), because τ′ is unchanged if all the signs of a, b, c, d are reversed」，以及「modular group」这个名字）；S、T 见 (5.1.12), p.148"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E70/#E71（L1，读到 schrans-2020
      §5.2–§5.3 笔记 p.244–246）**与 §20（2026-09-11，researcher 第十三轮，印刷 pp.145–151 页图 L1）**。
      T = ((1,1),(0,1))、S = ((0,−1),(1,0)) 的显式矩阵出自 schrans-2020 §5.3（核对源）；
      **原书 (5.1.12) 印的是作用而非矩阵**：`T : τ′ = τ + 1`、`S : τ′ = −1/τ`（§20.2 逐字）。

      ★★ **【记账缺口关闭，结论是 negative】Im(γ·τ) = Im τ/|cτ+d|² 不在 Polchinski §5.1 里**
      （2026-09-11，researcher 第十三轮，抽取记录 §20.1，**negative evidence, L1**）：
      印刷 pp.145–151（§5.1 全节 + §5.2 头两页）逐页通读，**不出现** `Im(γτ)`、
      `Im τ/|cτ+d|²`、`τ₂ → τ₂/|cτ+d|²`、`|cτ+d|` 中的任何一个；记号 `τ₂` 在 §5.1 里
      **根本没有被引入**（首次使用在第 7 章 (7.2.9) 一带）；§5.1 里 `Im τ` 只出现两次，
      都不是变换律（"so we can restrict attention to Im τ > 0"、"open only at Im τ → ∞"）。
      ⇒ **不能把 §5.1 登记为该行的来源**，本条 loc 因此只写 (5.1.13) 与 (5.1.14) 下方散文两处
      （researcher §20.5 的建议）。此前「未核」的判断（small-backlog-7 #4）到此关闭。
      ⚠ negative evidence 的边界：§20 只覆盖印刷 pp.145–151 与第 7 章全章；pp.152–165 与第 9 章未读。
      ⇒ 卡面那一行的数学依据由下面的 stringformal-2026 source 承担，且已拆成独立命题卡
      **math.mobius-action-preserves-upper-half-plane**（见 notes）；它在本项目内**目前只有
      Mathlib 一个来源**。researcher §20.5 列的一手候选（Serre ch. VII、Apostol ch. 2、
