id: worldsheet.schwarzian-transformation-of-t
kind: proposition
title: 能动张量不是主场：共形变换下多出 Schwarzian 导数项
statement: |
  设 T(z) 是中心荷 c 的共形场论的全纯能动张量（worldsheet.tt-ope-central-charge）。
  在共形变换 z → w(z) 下，
    T'(w) = (∂w/∂z)^{-2} [ T(z) - (c/12) S(w; z) ],
  其中 S(w; z) 是 w 作为 z 的函数的 Schwarzian 导数
    S(w; z) = w'''/w' - (3/2) (w''/w')^2,   ' ≡ d/dz。
  故 T 是权 (2,0) 的算子但**不是主场**：附加项正比于中心荷 c，
  在 c = 0 或对 SL(2,C) 变换（w = (az+b)/(cz+d)，其 Schwarzian 恒为零）时消失。
  等价的常见写法是 T'(w) = (∂z/∂w)^2 T(z) + (c/12) S(z; w)，
  两者由 Schwarzian 的反演恒等式 S(z; w) = -(∂w/∂z)^{-2} S(w; z) 相联。
uses_conventions:
  - conv.worldsheet-complex-coords
  - conv.virasoro-standard
sources:
  - ref: polchinski-1998-v1
    loc: "§2.4, eq. (2.4.26), p.48（**有限形式**：(∂_z z')² T'(z') = T(z) − (c/12){z', z}）、(2.4.27)（Schwarzian 导数 {f,z} = (2∂³_zf ∂_zf − 3∂²_zf ∂²_zf)/(2∂_zf ∂_zf)）；无穷小形式是 (2.4.24)（一般 c）与 (2.4.23)（自由标量特例 c = D）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——一处式号订正】

      ⚠ **订正**：旧 loc 把「T 的共形变换」挂在 (2.4.23)。原书 **(2.4.23) 是自由标量的特例**
      （系数写作 D/12），一般 c 的**无穷小**变换律是 **(2.4.24)**，
      而本节点陈述的**有限**变换律（带 Schwarzian）是 **(2.4.26)**。
      **(2.4.27) 不变**（Schwarzian 导数的定义式，L1 确认）。

      ⚠ **系数 −(c/12) 与写法**：原书 (2.4.26) 逐字是 `(∂_z z')² T'(z') = T(z) − (c/12){z', z}`，
      与本节点 statement 的第一式 `T'(w) = (∂w/∂z)^{−2}[T(z) − (c/12)S(w;z)]` 逐字同型
      （把 z' 记作 w、{·,·} 记作 S）。**「系数 −(c/12) 未核对原书」这句现予撤销**，
      但 Schwarzian 本身原书用的是 `{f,z} = (2f'''f' − 3f''f'')/(2f'f')` 这个写法，
      与 statement 里的 `w'''/w' − (3/2)(w''/w')²` 恒等而不逐字（约去 2f'f' 即得）。
      见 literature/extractions/polchinski-1998-v1.md §12.1（E33）。
tags: [cft, central-charge, schwarzian, energy-momentum-tensor]
notes: |
  这条的下游用途：柱面与平面之间的 T 的关系（worldsheet.cylinder-plane-l0-shift），
  即指数映射 w = ln z 下的 Schwarzian 给出 L_0 的 -c/24 移位。
  这是「Casimir 能量 / 正规序常数」在 CFT 中的几何来源。
author: curator-polchinski-ch2-3
created: "2026-09-10"
