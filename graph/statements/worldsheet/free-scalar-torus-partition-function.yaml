id: worldsheet.free-scalar-torus-partition-function
kind: proposition
title: "自由标量的环面配分函数 Z_X(τ) = (4π²α'τ₂)^{−1/2}|η(τ)|^{−2}，d 个标量给 Z = iV_d Z_X^d"
statement: |
  设 d 个无质量自由标量 X^μ（μ = 0,…,d−1）构成的 CFT 定义在 T²(τ) 上，时空体积为 V_d，
  配分函数按 worldsheet.torus-partition-function-general-cft 的迹定义（玻色，(−1)^F ≡ 1）。则
    Z(τ) = i V_d · Z_X(τ)^d ,     Z_X(τ) = (4π²α'τ₂)^{−1/2} |η(τ)|^{−2} ,
  其中 τ₂ = Im τ，η 是 Dedekind η（math.dedekind-eta-function）。
  分解成因子的来历：
    (a) 每个标量的**动量零模**给 (4π²α'τ₂)^{−1/2}——来自 ∫d^dk/(2π)^d exp(−πτ₂α'k²) 与
        Σ_k → V_d(2π)^{−d}∫d^dk；
    (b) 每个标量的**振子**给 |η(τ)|^{−2}——来自 (qq̄)^{−1/24}∏_{n≥1}|1−q^n|^{−2}，
        用 Σ_{N≥0} q^{nN} = (1−q^n)^{−1}；
    (c) 整体因子 i **来自把发散的 k⁰ 积分定义为 k⁰ → i k^d 的转动**（原书逐字：
        "the i comes from the rotation k⁰ → ik^d needed to define the divergent integral"）。

  **本卡不断言什么**：不断言 Z(τ) 的模不变性（那需要 math.dedekind-eta-modular-transformation，
  是 worldsheet.torus-vacuum-amplitude 一侧的内容）；不断言带顶点算子的期望值 (7.2.4)；
  不断言用全纯性重算的 (7.2.22)（那条在原书里**整体数值系数定不出来**，见 notes）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.alpha-prime-regge
  - conv.metric-mostly-plus
