      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E8、#E9，等级 **L1（原书页图逐字）**。
      原文逐字（p.210）：「Also, the i comes from the rotation k⁰ → ik^d needed to define the
      divergent integral. Also, the earlier C^X_{T²}(τ) is Z_X(τ)^d.」
tags: [worldsheet, cft, torus, partition-function, free-scalar, dedekind-eta]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E9 建立。

  **τ₂^{−1/2}|η|^{−2} 这个组合是全书模不变性论证的原子**：(7.3.6)、(8.2.11)、(8.4.21) 都靠它
  （抽取记录 #E9 备注）。

  **原书的第二条路线（全纯法）本图不建卡**：(7.2.11)–(7.2.22) 用 ⟨T_{ww}⟩ 与度规微扰重算，
  得 (7.2.22) Z(τ) = |∂_wϑ₁(0|τ)|^{−2d/3}τ₂^{−d/2}，**紧接一句逐字「up to a numerical coefficient
  that must be fixed by other means」**（抽取记录 #E10）——即该路线自承定不出整体常数，
  靠与 (7.2.8) 对照来固定。它**不是**一条独立的完整推导，故不作为本卡的第二条 derivation；
  原书另说「We leave to the reader the direct path integral evaluation」，第三条路线完全没做。
  详见抽取记录 Q6。
