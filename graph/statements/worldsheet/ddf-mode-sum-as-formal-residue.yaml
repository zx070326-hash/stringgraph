id: worldsheet.ddf-mode-sum-as-formal-residue
kind: proposition
title: DDF 算子的模态和等于算子值形式级数的形式留数：A^ε_n = Res_z[ε·P(z) · V(n k₀, z)]
statement: |
  【本卡的定位】
  本卡断言：在横向性 ε·k₀ = 0 保证的局部有限条件下，DDF 算子的模态和
  A^ε_n = Σ_m α^ε_m V^{(n)}_m 等于两个算子值形式级数乘积的形式留数 Res_z[...]。

  这是 worldsheet.ddf-contour-equals-mode-sum 的 **Layer 2（数学层）**：
  它不涉及"文献的 ∮ 符号应读作什么"，只涉及**纯数学对象之间的等式**。

  【设定与记号】沿用 worldsheet.ddf-operators-v6：D 维时空，度规 conv.metric-mostly-plus，
  α' 按 conv.alpha-prime-regge；类光参考向量 k_0（k_0² = 0），基点动量 p，
  归一化 2α' k_0·p = 1，偏振 ε 满足横向性 ε·k_0 = 0；
  动量塔 T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)。

  记 P^ε(z) = ε·P(z) = Σ_{m ∈ Z} α^ε_m z^{−m−1}（偏振收缩的动量流形式级数），
  V(n k_0, z) = Σ_{K ∈ Z} V^{(n)}_K z^K（顶点算子的形式级数）。

  【断言】在横向性 ε·k_0 = 0 之下，作为塔 T(p; k_0) 上的线性算子：

    A^ε_n  =  Res_z [P^ε(z) · V(n k_0, z)]  ,

  其中：
  - 左端 A^ε_n = Σ_{m ∈ Z} α^ε_m V^{(n)}_m 是 worldsheet.ddf-operators-v6 定义的模态和
    （在塔上逐向量有限）；
  - 右端 Res_z 是形式留数算子（定义为"取 z^{−1} 系数"，Schottenloher Def 10.1）；
  - P^ε(z) · V(n k_0, z) 是两个算子值形式级数的逐项乘积，在横向性下每个幂次的
    模态卷积 Σ_m α^ε_m V^{(n)}_{K−m} 逐向量有限（正规性公理，GN (2.32)）。

  等式的意义：取 z^{−1} 系数，即要求 (−m−1) + K = −1，故 K = m，
  给出 Res_z[...] = Σ_m α^ε_m V^{(n)}_m = A^ε_n。

  【本卡明确不断言】
  (a) **不断言"文献的围道积分 ∮ 应读作形式留数"。** 那是解释性断言，
      见 worldsheet.ddf-contour-interpretation（Layer 3）。
  (b) **不断言右端是真实复积分。** 形式留数不需要收敛性或解析性。
      若要把 ∮ 读成复平面上的真实积分，需要算子值函数的解析延拓，
      本图与 Lean 均无此结构。
  (c) **不断言 DDF 代数、Virasoro 对易关系、或任何其他 DDF 算子的性质。**
      本卡只是"模态和 = 留数"这一个等式。
uses:
  - worldsheet.ddf-operators-v6
  - worldsheet.exponential-vertex-operator-modes
  - worldsheet.ddf-transversality-gives-local-finiteness-v2
  - worldsheet.momentum-tower-fock-space
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Def 10.1 (p.173), Def 10.9 (p.178), Thm 10.10 第 1/4 条 (p.178, N=0 时)"
    note: |
      **形式留数的数学基础。L1↩（math-sources.md §11、§11A）。**
      Def 10.1：Res_z A(z) = A_{−1}（留数 = 负一次系数，tautology 级严格）。
      Def 10.9：正规序积 :A(z)B(w): = A(z)_+ B(w) + B(w)A(z)_-；给出模式卷积公式。
      Thm 10.10（取 N=0，即无奇异项）：A(z)B(w) = :A(z)B(w):（普通积=正规序积），
      这正是「横向性 ⟹ 同点乘积=正规序积 ⟹ 留数提取合法」的数学断言。
  - ref: bakalov-kac-2004
    loc: "(2.22), p.9"
    note: |
      **把「零模」翻回「模态卷积和」的来源。L1↩（math-sources.md §37.4(a)）。**
      (2.22) 逐字：Y(a,w)_{(n)}Y(b,w) = Y(a_{(n)}b, w)；取 n=−1 即
      Y(ξ(−1)e^{mk},w) = Y(ξ(−1),w)_{(−1)}Y(e^{mk},w) = :ξ(w)𝒴(e^{mk},w):。
      取 Res_w 后即零模 = 卷积模态和。
  - ref: gebert-nicolai-1995
    loc: "§3.1, eq. (3.2)–(3.3), 刊 p.593"
    note: |
      **VOA 框架下的直接来源。L1↩。**
      (3.2) 定义 A^ξ_m := (ξ(−1)e^{mk})_0（零模）；
      (3.3) 等号链：= Res_z[𝒴(ξ(−1)e^{mk},z)] = Res_z[ξ(z)𝒴(e^{mk},z)]；
      正文续：「normal ordering ... unnecessary due to ξ·k = 0」（横向性使无奇异）。
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/DDFOperator.lean :: StringFormal.NoGhost.ddfOp, ddfOp_apply, ddfSummand_apply_eq_zero_of_notMem_window"
    note: |
      **仅为本卡**左端**的参考实现，不是本卡的机检背书。**
      `ddfOp η a b ε hη hεb n` 定义为 `lsumLocFin (fun j => ddfSummand η a b ε n j) (ddfWindow n) ...`，
      即模态和 Σ_m α^ε_m V^{(n)}_m，在横向性 `hεb : dotVec η ε b = 0` 下逐向量有限。
      `ddfOp_apply` 给出在任意足够大窗口上的求值公式。

      **Lean 里没有"算子值形式级数的留数"这个定义**，故本卡断言的等式**右端**
      在 Lean 中无对应物，等式本身在 Lean 中从未被陈述、更未被证明。
      因此本卡**不得**填 `formal.lean_decl`、**不得**带 `formalized` 标记。
tags: [bosonic-string, spectrum-generating-algebra, vertex-operator, formal-residue]
notes: |
  查重：2026-09-20 跑 `uv run stringgraph search "formal residue"`（无命中）、
  `search "mode sum"`（无命中）、`search ddfOp`（命中 ddf-operators-v6 等，预期中）。

  ⚠【本卡曾被错标 formalized，已由 lead 于 2026-09-20 撤销】
  建卡者（lean-formalizer agent）给本卡填了 `formal.lean_decl:
  StringFormal.NoGhost.ddfOp` 并加了 `formalized` 标记，理由写在卡里：
  「左端在 Lean 中有定义，右端在 Lean 中不存在，故 lean_decl 指向左端」。

  **这是虚假机检背书，不是 formalized 的一个变种。** 本卡断言的是一个**等式**
  A^ε_n = Res_z[...]。Lean 里只有左端的定义（`ddfOp`），右端（算子值形式级数的
  形式留数）**根本没有定义**，因此这个等式在 Lean 中从未被陈述，更未被证明。
  `formalized` 在本项目的含义是「本卡所断言的命题有机检背书」，不是
  「本卡提到的某个对象在 Lean 里出现过」。按后一种读法，几乎任何卡都能标
  formalized——这恰好说明那种读法是错的。

  工具侧未被骗：`propagate.py` 不读 `formal:` 字段，本卡因无推导算得
  `own_status: open`。被污染的只有人读的那一层（tags / notes / report 的
  formalization 名单 / check-axioms 的核对对象），而那一层正是对外声称的入口。

  **要让本卡成为 formalized，唯一的路是在 Lean 里真的定义算子值形式级数及其
  留数，并证明 `ddfOp = residue (P * V)`。** 在那之前本卡不带 formal 字段。

  【本卡当前为 open，这是诚实状态】
  本卡尚无推导。卡上列的 Schottenloher / Bakalov-Kac / Gebert-Nicolai 三条来源
  都是 L1 已核的，足以支撑一条 `rigorous` 推导，但那条推导还没人写。
  `open` 的意思是「还没有记录支持」，不是「不成立」。

  【为什么这是 Layer 2 而不是 Layer 1】
  Layer 1 是"Res_z A(z) = A_{-1}"（定义级，tautology）。
  Layer 2 是"Res_z[A(z)B(z)] = Σ_m A_m B_{-1-m}"（在局部有限条件下），
  这需要：
  - 正规序积的定义（Schottenloher Def 10.9）
  - 无奇异条件下普通积 = 正规序积（Thm 10.10(N=0)）
  - 横向性使两场无奇异 OPE（GN (3.3) 正文）
  - 正规性公理使卷积逐向量有限（GN (2.32)）

  这些步骤不是定义，是定理，故 Layer 2 是数学内容，不是 tautology。

  【本卡与 --via-voa-residue 推导的关系】
  worldsheet.ddf-contour-equals-mode-sum--via-voa-residue 的 own status 是 rigorous，
  它沿 GN (3.2)–(3.3) 做了完整论证。本卡是把那条推导的 **Layer 2 部分**
  （形式留数的代数）单独提出来，使「数学的那一半」与「解释的那一半」可以分别定位。

  【本卡不解决的问题】
  本卡**不**使 worldsheet.ddf-contour-equals-mode-sum 的 effective 上升——
  那张卡还需要 Layer 3（worldsheet.ddf-contour-interpretation）的支持。
  本卡的价值在于把"围道 = 模态和"里可验证数学的那部分与解释性断言的那部分分开，
  使无鬼定理剩余缺口的结构第一次可以被精确陈述。
