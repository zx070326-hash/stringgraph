id: worldsheet.metric-variation-operator-p1
kind: definition
status: rigorous
title: "算子 P₁ 及其形式转置 P₁^T"
statement: |
  设 (M, g) 是二维 Riemann 流形，∇ 是 g 的 Levi-Civita 联络。

  **算子 P₁** 把向量场 δσ^a 送到对称无迹二阶张量：
    (P₁ δσ)_ab = ½ ( ∇_a δσ_b + ∇_b δσ_a − g_ab ∇_c δσ^c ) 。
  由构造它对称且无迹：g^{ab}(P₁δσ)_ab = ∇_c δσ^c − (d/2)∇_c δσ^c = 0（d = 2）。

  **形式转置 P₁^T** 把对称无迹二阶张量 u_ab 送到向量场：
    (P₁^T u)_a = − ∇^b u_ab 。

  两者之间的配对取 M 上的 L² 内积
    (u, v) = ∫ d²σ  g^{1/2}  u^{ab} v_ab      （对称无迹张量），
    (w, x) = ∫ d²σ  g^{1/2}  w^a x_a          （向量场）。

  ⚠ 本卡只定义两个微分算子与配对，**不**断言它们互为伴随（那是
  worldsheet.p1-formal-adjoint），也**不**断言度规变分的分解公式
  （那是 worldsheet.diff-weyl-metric-variation）。
uses: []
