id: worldsheet.diff-weyl-metric-variation
kind: proposition
title: "diff × Weyl 下度规的无穷小变分：δg_ab = −2(P₁δσ)_ab + (2δω − ∇·δσ) g_ab"
statement: |
  设 (M, g) 是二维 Riemann 流形。在由向量场 δσ^a 生成的无穷小微分同胚与参数 δω 的无穷小
  Weyl 变换的复合下，度规的变分为
    δg_ab = − ∇_a δσ_b − ∇_b δσ_a + 2 δω  g_ab
          = − 2 (P₁ δσ)_ab + ( 2 δω − ∇_c δσ^c )  g_ab ,
  其中 P₁ 如 worldsheet.metric-variation-operator-p1 所定义。

  该式把 δg 分成两块：**对称无迹部分** −2(P₁δσ)_ab（只由 δσ 的「非共形部分」贡献）
  与**纯迹部分** (2δω − ∇·δσ) g_ab（Weyl 参数与 δσ 的散度只以组合 2δω − ∇·δσ 出现）。
  推论：迹部分总可以被 δω 吸收，故 diff × Weyl 在度规上的作用等价于 P₁ 的像加上任意的纯迹项。
uses_conventions:
  - conv.worldsheet-euclidean
sources:
