tags: [bosonic-string, no-ghost, ddf-spans, critical-dimension, null-state, momentum-tower, open]
notes: |
  【为什么立卡（curator，分支 agent/curator/b26-findings；依派活任务交付物 #4）】
  worldsheet.ddf-spanning-rank-inequality notes (iii) 订正了"D=26 无通用机制"的旧读法，
  指出真正的机制是"同一个二阶算子 𝒟₂ 逐层作用"；本卡把那条订正展开成一张独立的、可核的
  陈述卡，承载 Type1/Type2 两族映射的具体验证方程，供任何日后想攻克该卡 notes (iv) 的
  "N≥5 重叠"问题的人从这里起步。

  【查重】`uv run stringgraph search "null state"`、`search quasi-physical`、
  `search ocq-null`、`search descTwo` 均无同内容命中（"ocq-null" 模糊命中的是
  worldsheet.ddf-spanning-rank-inequality 本身，因其正文含"零态"字样，非重复卡；
  "null state" 命中的是 worldsheet.ocq-spurious-states-v2 等既有卡，内容不重叠，见下）。

  【与 worldsheet.ocq-spurious-states-v2 的关系，不是同一对象】本卡的对象活在**动量塔**
  T(k;k_0)（worldsheet.tower-physical-quotient-form 的设定），是后者"单个 Fock 空间 F(k) 上
  的伪态/零态"定义（S(k)、N(k)）在塔上、按"种子准物理态 + 具体算子"组织的一个特例化展开，
  不是同一对象的换代或不同定义，两卡互不 supersede。

  【第 (3) 条的关键输入：worldsheet.tower-physical-quotient-form (2)，formalized】
  本卡最初的规划（未落地在此文件的草稿）曾打算只断言"χ₁、χ₂ 被全部正模湮灭"（即
  ∈ H_phys），但这**不**自动给出 ∈ H_null（零态要求额外与全体物理态正交）。
  curator 核对后发现补上这一步只需引用已 formalized 的
  worldsheet.tower-physical-quotient-form 断言 (2)（H_spur ∩ H_phys(a₀) ⊆ H_null(a₀)，
  "易方向"，Lean `towerSpurious_inf_towerPhys_le_towerNull`）：χ₁(φ)、χ₂(φ) 按构造就是
  L_{−n}（n=1,2）像之和，manifestly ∈ H_spur；配合 (1)(2) 已证的 ∈ H_phys(a₀)，直接得
  ∈ H_null(a₀)。**本卡因此在 depends_on 里正式挂了这条边（非 inferred，来源是该卡断言 (2)
  的逐字内容与本卡 (3) 的显式引用）**，而不是把"落在 H_null"当成不言自明的断言。

  【与 gt-longitudinal-k-algebra notes 的 A^L 反例核对：两套记账未裁决的 1 之差】
  gt-longitudinal-k-algebra.yaml 的 2026-09-12 追记按 A^L 单项式记账在 N=2 给出 24+1=25
  （24 个 A^L_{−1}A^i_{−1} 加纵向 Verma 根基 1 个），比本卡的 25+1=26 少 1；两条记账用的是
  **不同的基**（A^L 单项式 vs 本卡的 Q_1/Q_0 准物理种子），差的那 1 在哪一侧的哪一部分
  暂未逐项核对——这是一条**尚未裁决**的记账细节，留给任何要合并两套记账的人；本卡不裁决。

  【本卡不是 (B-26) 的解，只是把已知开放内容前移一步】本卡证明了两族映射的像落在 H_null
  内，这只是构造零态的**充分**方式之一；worldsheet.ddf-spanning-rank-inequality 仍然 open，
  其 notes (iv) 记录的 N≥5 重叠问题**不受本卡影响**——本卡对 N≥5 未验证任何新内容，只是
  把 N=2 的具体计算抽象成一般 N 的映射定义（"像落在 H_null 内"这件事对一切 N≥2 成立，
  但"像是否张成/是否够大"这件事，恰是 (B-26) 本身，本卡刻意不碰，见【本卡明确不断言】(a)）。

  【2026-09-12：Type 2 在 N=2 现已 Lean 化（worldsheet.level-two-null-state-requires-d26），
  Type 1 的独立性与占据数计数仍未（curator，claim #490，依派活任务交付物 #3）】
  formal/StringFormal/NoGhost/NullSeedsTwo.lean（合入 c4ace50）把本卡 (2)（Type 2 族）在
  N=2 这一个特例做成了机检等式：`descTwo_*` 一族（`towerLop_one_apply_descTwo`、
  `towerLop_two_apply_descTwo`、`descTwo_mem_towerPhysSubmodule_iff` 等）逐字对应本卡
  N=2 处的 L_1χ₂(φ)=12(h+1)L_{-1}φ、L_2χ₂(φ)=(26h+c)φ 两条验证方程及其 h=−1（a₀=1）代入，
  并且比本卡多给出一条：D=26 的**必要性**（本卡只写"当且仅当"，但从未把它单独做成一条
  可引用的 iff）。图上承载见新卡 worldsheet.level-two-null-state-requires-d26
  （status formalized，配套推导 --via-lean）——**两卡不 supersede、不合并**：那张卡只做
  N=2 的 Type 2，本卡的范围是一般 N 的 Type 1 与 Type 2 两族；那张卡的 notes 里也记着
  同一条分工。

  **仍未 Lean 化、仍停留在 physical-argument 的部分**（本卡与其推导
  --via-blueprint-hand-computation 的 status **不因此改变**，按项目原则 1/2 不得就地
  升档）：
  (i) **Type 1 族（(1)）完全没有 Lean 对应**——NullSeedsTwo.lean 的 `towerLop_neg_one_mem_
      towerNullSubmodule` 只处理"L_0φ=0 的种子送到 H_null"这一半（不含 D，因
      centralTerm 1 = 0），**不含**本卡 (1) 里"L_1χ₁(φ)=2h_{r,N−1}φ 在 a₀=1 处为零"
      这条验证方程本身的显式 Lean 引理（虽然代数上是同一件事，但没有以本卡记号显式写出）；
  (ii) **25 个 Type-1 种子的线性无关**未做——文件头 Gaps 逐字点名"25 Type-1 seeds and
      their linear independence"未覆盖；
  (iii) **占据数计数 p_{D−1}(2) − p_{D−2}(2) = D**（本卡【N=2 特例】段"dim Q_1 = D−1、
      dim Q_0 = 1、合计 25+1=26"这条数值核对背后的一般公式）未做形式化。
      formalizer 的诊断（NullSeedsTwo.lean 文件头 Gaps，逐字）：`B26 2` 这条秩不等式
      需要同时求出两个 `finrank`，而 Lean 里对 `Osc D →₀ ℕ`（占据函数的类型）`decide`
      无法展开——与 `formal/StringFormal/Math/PartitionCard.lean` 遇到的同一堵墙
      （`Nat.Partition` 的基数在 Mathlib 里没有可 `decide` 的实例路径，需要桥引理把计数
      搬到显式 `Finset (Multiset ℕ)` 字面量上）。⇒ 阻碍不是"独立性证不出"，而是**计数**
      本身在当前 Lean 基础设施下算不出来；这与 worldsheet.ddf-spanning-rank-inequality
      的新 notes（同一批交付物 #4）记录的诊断一致。
  ⇒ 本卡（一般 N，(1)(2)(3) 全部）与其推导的 status 仍是 physical-argument，
  不受这次 Lean 化影响；只有它的 N=2、Type-2 特例现在有了一个独立、更严格（formalized）
  的旁证。

  【2026-09-12（二）：N=2 的完整实例（Type 1 + Type 2 + 计数 + 线性无关 + 落在 H_null）
  现已全部 Lean 化，但本卡 status 仍不升级（curator，分支 agent/curator/b26-two-wire，
  依派活任务交付物 #3）】
  formal/StringFormal/NoGhost/LevelTwoCount.lean（合入 main，无 sorry）在上面【2026-09-12】
  一段记录的三条缺口——(i) Type 1 族无 Lean 对应、(ii) 25 个 Type-1 种子的线性无关、
  (iii) 占据数计数 p_{D−1}(2) − p_{D−2}(2) = D——现已**全部**补齐：
    (i) Type 1 族 ⇒ `typeOneTwo`、`typeOneTwo_mem_towerNullSubmodule`（本卡 (1) 在 N=2、
        且不限于层真空的准物理种子上的显式构造：`L_{−1}((e·α_{−1})|0;p_{−2}⟩)`，
        `e·p_{−2}=0`）；
    (ii) 线性无关 ⇒ **`linearIndependent_nullFamilyTwo`**（D 个候选——D−2 个横向 Type-1、
        1 个沿 a−b̃ 方向的 Type-1、1 个 Type-2——联合线性无关，**不用 D=26**，文件头
        docstring 逐字"Independence does not use `D = 26`"）；
    (iii) 占据数计数 ⇒ **`levelTwo_count_identity`**（math.level-two-partition-difference
        的 Pascal 恒等式 p_{D−1}(2) − p_{D−2}(2) = D，对一切 D 成立）。
  三者拼上 worldsheet.level-two-null-state-requires-d26 的 `descTwo_single_mem_towerNullSubmodule`
  （Type-2 后代的物理性，**唯一用到** `(D:K)=26` 的一步），给出
  **`descTwo_single_mem_towerNullSubmodule` 是本卡 (2)(3) 在 N=2 处的完整机检版本**，
  D−1 个 Type-1 种子的具体身份是 **{ε_i} ∪ {a}**（D−2 个横向偏振方向 ε_i，加一个沿
  基点动量方向 a 的种子，满足 a·p_{−2}=0——即本卡 (1) 里"φ ∈ Q_{N−1}"在 N=2 时的
  D−1 维具体张成基），图上承载完整结果的新卡是
  **worldsheet.ddf-spans-physical-states-level-two**（formalized，配套推导
  `--via-lean`）。

  ⚠ **本卡 status 仍是 physical-argument，不因此升级**：本卡断言的是**一般 N**
  的 (1)(2)(3)（含一般 N 的 Type1/Type2 构造、验证方程与落在 H_null 内），
  LevelTwoCount.lean 只做了 **N=2 这一个特例**的机检——按项目原则 1/2
