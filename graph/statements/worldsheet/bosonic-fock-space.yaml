id: worldsheet.bosonic-fock-space
kind: definition
status: formalized
title: D 个自由玻色振子的 Fock 空间（代数版，无零模）与其 level 分级
statement: |
  固定维数 D ∈ ℕ 与基环 R（交换幺环；物理情形取 R = ℝ 或 ℂ）。

  **振子标签**：Osc(D) := {(μ, n) : μ ∈ {0, 1, …, D−1}, n ∈ Z, n ≥ 1}，
  其中 (μ, n) 命名产生算符 α^μ_{−n}。注意 n = 0 **不在**标签集内：零模不属于本定义。

  **Fock 空间**：F(D, R) := Osc(D) 上的自由交换 R-代数，即多项式代数
    F(D, R) = R[ X_{(μ,n)} : (μ,n) ∈ Osc(D) ]
  （等价地：产生算符张成的自由模上的对称代数）。真空 |k⟩ 即常数 1；单项式
    X^d = ∏_{(μ,n)} X_{(μ,n)}^{d(μ,n)}     （d : Osc(D) → ℕ，有限支撑）
  对应态 ∏_{(μ,n)} (α^μ_{−n})^{d(μ,n)} |k⟩。F(D,R) 的元素是这些单项式的**有限** R-线性组合。
  动量 k 在本定义中只是标记「这一份 Fock 空间挂在哪个动量真空上」的外部标签，
  不出现在 F(D,R) 的任何结构中（见 notes 的缺口 (i)）。

  **算符**：设 η 为**对角**时空度规，由分量 η^{μμ} ∈ R（μ = 0..D−1）给定；
  conv.metric-mostly-plus 下 η = diag(−1, +1, …, +1)。定义 F(D,R) 上的 R-线性算符
    α^μ_{−n} := 乘以 X_{(μ,n)}                    （产生算符，n ≥ 1）
    α^μ_{n}  := (n η^{μμ}) · ∂/∂X_{(μ,n)}          （湮灭算符，n ≥ 1）
  它们满足振子（Heisenberg）代数
    [α^μ_m, α^ν_{−n}] = (m η^{μμ}) δ^{μν} δ_{mn} · id,
    [α^μ_{−m}, α^ν_{−n}] = [α^μ_m, α^ν_n] = 0        （m, n ≥ 1），
  在对角 η 下这就是通行写法 [α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0}（m, n ≠ 0）。
  特别地 α^μ_n |k⟩ = 0（n ≥ 1）。

  **level 分级**：单项式 X^d 的 level 定义为
    N(d) := Σ_{(μ,n)} n · d(μ,n)
  （即权函数 (μ,n) ↦ n 下的加权次数）。记 F_N ⊆ F(D,R) 为 level 恰为 N 的单项式张成的
  R-子模（加权齐次分量）。则
    |k⟩ ∈ F_0,   α^μ_{−n}(F_N) ⊆ F_{N+n},   α^μ_n(F_{N+n}) ⊆ F_N。
  level 为 N 的单项式只用到模数 n ≤ N 的振子、且每个指数 d(μ,n) ≤ N，故这样的 d 只有有限多个；
  于是每个 F_N 是**有限生成** R-模，R 为域时 dim_R F_N < ∞。
uses: []
uses_conventions: [conv.metric-mostly-plus]
