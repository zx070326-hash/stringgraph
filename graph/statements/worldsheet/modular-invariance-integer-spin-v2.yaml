id: worldsheet.modular-invariance-integer-spin-v2
kind: proposition
title: "T 变换下的模不变性 ⇒ 先 c − c̃ ∈ 24Z（单位算子），再一般层 h − h̃ ∈ Z（四条前提显式化，(1) 的量词改为净简并非零的层）"
statement: |
  设一个二维 CFT 的环面配分函数按 worldsheet.torus-partition-function-general-cft 写作
    Z(τ) = Σ_i q^{h_i − c/24} q̄^{h̃_i − c̃/24} (−1)^{F_i} ,   q = e^{2πiτ} ,
  并**假设**下列三条技术前提：

    (P1) **谱离散**：权的取值集合 {(h_i, h̃_i)} 可数，从而谱可按 (h, h̃) 分「层」；
    (P2) **每层简并有限**：每个层 (h, h̃) 只含有限多个态，从而该层在 Z 中的系数
         a_{(h,h̃)} := Σ_{i ∈ 该层} (−1)^{F_i}（**带符号的净简并度**）有定义；
    (P3) **绝对收敛**：上式在所用的 τ 区域（某条 τ₂ = const 的水平线的邻域）绝对收敛，
         从而可固定 τ₂、把对 τ₁ 的依赖当作 Σ_layers a_{(h,h̃)} e^{2πi(h−h̃)τ₁}·（τ₂ 因子）
         型的展开，逐层比较系数；

  再**假设** Z 在 T : τ ↦ τ + 1 下不变。则

  (1) 对每个满足
        (P4) **该层的净 (−1)^F 加权简并非零**，即 a_{(h,h̃)} ≠ 0
      的层 (h, h̃)，量 h − h̃ − (c − c̃)/24 必须是整数；
  (2) 取单位算子所在的层（h = h̃ = 0；假设单位算子在谱中且该层净简并非零，
      酉紧 CFT 中它的系数为 +1）⇒ **c − c̃ 必须是 24 的倍数**；
  (3) **有了 (2) 之后**，(1) 对一般的净简并非零层化为自旋整数性
        h − h̃ ∈ Z 。

  ⚠ **(1) 只覆盖净简并非零的层**：净 (−1)^F 加权简并为零的层（有世界面费米子时完全可能：
  玻色态与费米态数目相同的层）在 Z(τ) 中根本不出现，T 不变性对它**不施加任何约束**。
  因此本卡**不**断言「对每个态 i 都有 h_i − h̃_i ∈ Z」。在无世界面费米子的 CFT
  （(−1)^F ≡ +1，所有简并度为正）里 (P4) 对每个非空层自动成立，此时 (1) 退化为对每个态成立。

  ⚠ **(3) 的前提是 (2)，顺序不可颠倒**：脱离 c − c̃ ∈ 24Z，(1) 只给出
  h − h̃ ∈ (c−c̃)/24 + Z，即所有净简并非零层的自旋同余于一个公共的非整数值。
  在 26 维平坦时空里 c = c̃ = 26，前提自动满足。

  ⚠ **c − c̃ ∉ 24Z 的 CFT 并不被排除**：原书紧接一段逐字「CFTs for which c − c̃ is not a
  multiple of 24 are certainly of interest. These cannot be separately modular-invariant,
  but with appropriate projections can be combined into a modular-invariant theory.」
  即本命题的结论是「**单独**模不变」的必要条件，不是「有物理意义」的必要条件。

  **本卡不断言什么**：不涉及 S : τ ↦ −1/τ 给出的约束（那是另一类条件，
  如 §8.4 的自对偶格；第 7 章对此不提供任何东西）；不断言模不变性本身
  （模不变性在本卡里是**假设**，其地位见 notes）；不断言 (P1)–(P3) 对任何具体 CFT 成立
  （它们是本命题的前提，不是结论）。
uses_conventions:
