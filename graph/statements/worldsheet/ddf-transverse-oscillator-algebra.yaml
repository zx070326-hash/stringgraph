id: worldsheet.ddf-transverse-oscillator-algebra
kind: proposition
title: DDF 算子满足横向自由振子代数 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}
statement: |
  设 A^i_n 是 worldsheet.ddf-operators-v5 定义的 DDF 算子（i = 2..D-1，n ∈ Z \ {0}；
  同一条类光参考方向 k_0² = 0，同一套横向偏振 ε^i·k_0 = 0 且 ε^i·ε^j = δ^{ij}，
  标度按 2α' k_0·p = 1 逐塔取定）。则在扇区 {p : k_0·p ≠ 0} 的动量塔上

    [A^i_m, A^j_n] = m δ^{ij} δ_{m+n, 0}，    i, j = 2..D-1，  m, n ∈ Z \ {0}。

  即 {A^i_n} 生成一份 D-2 维横向自由玻色振子代数（Heisenberg 代数），
  与世界面横向振子 α^i_n 的代数（worldsheet.transverse-oscillator-commutators）逐字同型。

  注意右端**没有**中心项以外的贡献，也没有 k_0 或 p 的残余依赖：
  这正是归一化 2α' k_0·p = 1 与类光条件 k_0² = 0 的作用。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      与 worldsheet.ddf-operators-v5 同一处来源；本节点承载的是 v4 陈述文本里
      「且满足横向振子代数 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}，即一个 D-2 维横向自由振子代数」
      这一句。**式号仍未核实（L0）**；GSW 用 mostly-minus，已按 conv.metric-mostly-plus 转写；
      GSW 取 α' = 1/2，故其归一化写作 k_0·p = 1。
  - ref: goddard-thorn-1972
    loc: "eq. (3)–(6)（式号未核实；正文未获取）"
    note: |
      「谱生成代数」这一名称的来源即在于本命题：DDF 算子生成一份自由振子代数，
      从而由一个物理态生成整塔物理态。式号沿用旧节点 worldsheet.ddf-operators，未与原文核对
      （literature/extractions/brst-cohomology-sources.md §3.1：GT 1972 正文四条获取路径全部失败）。

      **【2026-09-11（四）归属削弱，curator；本条 source 保留不删】**
      按 goddard-2008 参考文献表（L1 逐字，extractions/gsw-1987-v1.md E3）：
      **Goddard 本人把本对易关系 (5.5) 归给 [43] Brower–Goddard 1973 与 [44] Brower–Goddard 1972，
      不归给本文**；本文（其 [45]）对应的是**无鬼定理本身**（该综述 §6, p.15, (6.4)，无编号），
      且 GT 证明真正使用的代数是 (6.3) 的 [L_m, K_n] = −n K_{m+n}。
      故本条 source 的正当性**弱于**下面的 goddard-2008 与 gebert-nicolai-1995。
      brower-goddard-1972 / brower-goddard-1973 已登记进 sources.bib，但**正文均未获取（L0），
      不得承载论证**，故本节点暂不把它们列为 source。
  - ref: goddard-2008
    loc: "§5 'Spectrum Generating Algebra', p. 11, eq. (5.5)；偏振正交归一 ε^i·ε^j = δ^{ij} 与 k·ε^i = 0 见同页 (5.1) 之后的正文"
    note: |
      **【2026-09-11（四）重写，curator；旧措辞「不给编号」在本命题上是错的】**
      本命题在该文中是**带编号的显示公式** (5.5)，逐字
      `[A^i_m, A^j_n] = m δ^{ij} δ_{m,−n},   1 ≤ i, j ≤ D − 2.`
      （researcher L1 逐页读图，extractions/gsw-1987-v1.md §2 E3）。
      **★ 本节点 notes 说「v4 没写出的隐含前提」的 ε^i·ε^j = δ^{ij}，现在有逐字来源**：
      (5.1) 之后正文逐字「orthonormal polarization vectors for a photon of momentum k, i.e.
      **ε^i · ε^j = δ^{ij}, k · ε^i = 0**」——两条偏振条件同时给出。
      **仍然成立的限制**：历史综述，(5.5) **无证明**；且作者本人把它归给 [43]/[44]（Brower–Goddard），
      见上一条 source 的归属削弱说明。故只升可追溯性，不承载论证。
      **号差** (−,+,+,+) = mostly-plus，与 conv.metric-mostly-plus 一致，**无需换算**；归一化逐字 k·p = 1。
  - ref: gebert-nicolai-1995
    loc: "§3.1 'DDF vertex operators', p. 594, eq. (3.4)（右端显式保留算子 k(0) = k·α_0）；其依据是 p. 593, eq. (3.1)（物理态的李括号）与 §2.1, p. 582, eq. (2.62)（零模字典 [ψ_0, φ_0] = ([ψ,φ])_0）；归一化 k·r = 1 见 p. 594 同页正文；d − 2 个正交归一偏振见 §3.2, p. 599"
    note: |
      **【2026-09-11（四）新增，curator】本命题在数学物理文献中的证明所在处**（CMP 172 (1995) 571–622；
      researcher L1 逐页读期刊排版 PDF，extractions/gsw-1987-v1.md §4 E15/E17）。
      (3.4) 逐字 `[A^ξ_m, A^η_n] = m(ξ·η) δ_{m+n,0} (k(−1))_0 = m(ξ·η) δ_{m+n,0} k(0)`，
      引出句逐字「**According to (2.62)** the above commutator then translates into」。
      **★ 这是本图目前唯一逐字回答「右端为何恰好是 m δ^{ij}、不带 α' 或 k_0·p 的残余因子」的来源**：
      G–N **把算子 k(0) 显式留在右端**，并在同页逐字说明「one has to find a lightlike vector k = k(r)
      such that **k·r = 1**. In this case the transversal DDF operators … realize **precisely** the algebra of
      d − 2 transversal oscillators」。k·r = 1 即本节点的 2α' k_0·p = 1。
      这直接回应了本节点 statement 末段「右端没有 k_0 或 p 的残余依赖……正是归一化的作用」那句话。
      **论证路线不是两个顶点算子的 OPE + 围道形变**，而是「物理态的李括号 (3.1) + 零模字典 (2.62)」，
      全程形式级数：推导见 worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket。
      **适用限制**：G–N 的前提是格点顶点代数（偶格、洛伦兹号差、双乘性上闭链 ε），
      本图尚无对应的卡，故该推导的有效状态仍被压在 open。
tags: [bosonic-string, spectrum-generating-algebra, oscillator-algebra]
notes: |
  【拆卡来源，2026-09-11】本节点是 worldsheet.ddf-operators-v4 的拆分产物之一，
  理由与 worldsheet.ddf-commute-with-virasoro 相同（v4 是定义卡却断言了两条命题）。
  docs/ROADMAP.md 待拆清单的 `ddf-operators-v4` 项，lead 已同意。

  【陈述文本相对 v4 的两处显式化】v4 只写 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}，
  没有写出右端 δ^{ij} 所隐含的**偏振正交归一** ε^i·ε^j = δ^{ij}（v4 只要求 ε·k_0 = 0），
  也没有写出 m, n ≠ 0 的量词（v4 在定义处写了 n ∈ Z \ {0}）。本节点把这两点写进前提。
  这不是对 v4 的纠错：v4 的横向指标沿用 worldsheet.light-cone-quantization 的
  正交归一横向标架，δ^{ij} 本来就在那套约定里；此处只是把隐含前提写出来以便形式化。

  【为什么不是 rigorous】本命题的标准论证是两个顶点算子的 OPE 加围道形变
  （见推导 --via-conformal-weight 的 summary），不是有限步初等计算，
  因此不适用 docs/STATUS_LEVELS.md 的 rigorous 例外条款；
  两条一手来源（GSW、GT 1972）的定位都未核实到式号，也没有可引用的数学文献严格证明
  （kac-raina-1987 的讲号/命题号在本项目中未核实且两版不可互换，不得猜编号）。
  故 physical-argument。
  ⚠ **【2026-09-11（四）更新】本段末句「没有可引用的数学文献严格证明」已过时**：
  gebert-nicolai-1995 §3.1 (3.4) 是带编号的严格结果（见下方新块与 source）。
  但本节点的**有效状态仍是 physical-argument**，best_derivation 仍是 --via-conformal-weight，
  原因见新块第 (3) 条。本段其余内容（对 --via-conformal-weight 那条推导的定级理由）不变。

  【2026-09-11（四）文献更新：两条来源升级 + 一条新推导，curator】
  按 researcher 的核实（literature/extractions/gsw-1987-v1.md §2、§4、§9(1)(3)）：
  (1) **goddard-2008 (5.5) 是带编号的显示公式**（不是「不给编号」），且
      **ε^i·ε^j = δ^{ij} 与 k·ε^i = 0 在 (5.1) 后逐字同时给出**——本节点上面说的
      「v4 没写出的隐含前提」自此有了逐字来源。仍无证明，只升可追溯性。
      同时 **Goddard 本人把 (5.5) 归给 Brower–Goddard [43]/[44]，不归给 goddard-thorn-1972**，
      已在 GT 那条 source note 里补记（不删该 source）。
  (2) **gebert-nicolai-1995 (3.4) 给出本命题的顶点代数证明**，路线是
      「物理态的李括号 (3.1) + 零模字典 (2.62)」——**与 --via-conformal-weight 的 OPE + 围道路线
      完全不同，是第三条独立路线**（第二条是 tomassini-2008 Theorem 2.4 的修改版 DDF）。
      新推导 worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket 承载它，`status: rigorous`。
      **它还逐字回答了 --via-conformal-weight 的 gaps 第 1 条**（右端为何无 α'/k_0·p 残余）：
      (3.4) 把算子 k(0) 显式留在右端，只有在 k·r = 1（即本节点的 2α' k_0·p = 1）时才退化为 m δ^{ij}。
  (3) **有效状态没变，仍是 physical-argument。** 两个上限：
      (a) G–N 的前提是格点顶点代数，本图无「D 个自由玻色子（含类光方向与不定号差）⊗ C[Z k_0]
          构成顶点代数、动量塔为其模」的卡，桥接边只能 inferred 到
          worldsheet.string-cft-is-a-vertex-algebra-v2（effective = open）；
      (b) 本节点 statement 末句的「与 worldsheet.transverse-oscillator-commutators 逐字同型」
          把任何推导拉到那张 physical-argument 的卡之下。
      **⇒ 建议（交 lead/auditor）**：按「一个节点一个命题」，把 (b) 那句比较拆成独立节点
      （新建 + superseded_by，不得就地改本节点文本）；把 (a) 的缺卡列进 docs/ROADMAP.md。
  ⚠ **工具显示提醒**：`stringgraph status` 的 `own_status` 取全部推导中 status 最高者，
  故本节点现在显示 `own_status: rigorous` 而 `effective: physical-argument`——不是矛盾，
  rigorous 的那条是新的零模路线，被自己的 open 依赖压住。

  【ε·p = 0 问题（extractions/gsw-1987-v1.md Q5）已核查：不是本命题的缺口】
  G–N §3.2 (p.599) 要求偏振「orthogonal to both r and k」，比本节点多一条 ε·p = 0。
  但 (3.1) 的推导逐字只用 ξ·k = η·k = k·k = 0；且横向空间是商 {ξ : ξ·k = 0}/ℝk，
  A^{ξ+ck}_m = A^ξ_m（m ≠ 0）而 ξ·η 不变，故 ξ·r = 0 是代表元的选取而非额外前提，
  **δ^{ij} 不受影响**。推理是本项目的（G–N 未写 WLOG），
  已登记在 --via-zero-mode-bracket 的 gaps 第 5 条。**本节点的前提不需要修改。**

  【升级路径与 Lean 现状】**Lean 侧完全未起步**：`formal/StringFormal/NoGhost/VertexOperator.lean`
  文件头 "Mathematical gaps" 第 2 条逐字写「No operator products. `V(b, z) V(b', w)` and hence
  `[A^i_m, A^j_n]` are untouched.」，DDF.lean 文件头 "What is NOT here" 第 1 条同样说
  组装与该对易关系都没做。所以本条比 worldsheet.ddf-commute-with-virasoro **更远**离形式化：
  后者只差一个基例，本条需要先有顶点算子的乘积/重排序（E_+ E_- 交换），
  而 Lean 侧目前连伴随 V(b)_J† = V(−b)_{−J} 都没有。
  另一条独立路线是走数学文献的顶点算子代数（DDF 算子在 Borcherds / FLM 传统里是标准对象），
  但需要 researcher 先拿到带编号的严格陈述。

  【为什么它对无鬼定理是必需的】worldsheet.no-ghost-theorem-v4 第 (1b) 条断言
  H_phys(k;k_0)/H_0(k;k_0) 与横向 DDF Fock 空间 H^⊥(k) **等距同构**；
  「H^⊥(k) 上的 Gram 矩阵就是 24 个横向振子 Fock 空间的正定 Gram 矩阵」这一步
  正是本命题（加上 A^i_n 的伴随关系 (A^i_n)† = A^i_{−n}，后者本图尚无独立节点，
  见下条）。没有本命题，无鬼定理的正定性结论没有依据。

  【已知缺口，建议后续立卡】(A^i_n)† = A^i_{−n} 在本图中**没有节点**，
  但 H^⊥(k) 上 Gram 矩阵的计算需要它（Lean 侧对应 V(b)_J† = V(−b)_{−J}，同样未做，
  且当前只有 R-双线性型、无 sesquilinear 结构）。本节点不断言它。
