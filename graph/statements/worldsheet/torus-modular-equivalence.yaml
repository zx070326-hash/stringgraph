tags: [worldsheet, torus, modular-group, moduli]
notes: |
  Im τ < 0 的一支：τ ↦ τ̄ 不是 PSL(2,Z) 元素而是反全纯映射（对应世界面定向反转），
  故「取 Im τ > 0」是对**可定向**环面的约定，不是模变换的推论。本图未建定向反转的节点。
