id: worldsheet.torus-modular-equivalence
kind: proposition
title: 由 PSL(2,Z) 联系的两个 τ 描述同一个环面
statement: |
  设 τ ∈ H，γ = ((a,b),(c,d)) ∈ SL(2,Z)，τ' = (aτ + b)/(cτ + d)。则平坦环面
  T²(τ) 与 T²(τ')（worldsheet.torus-modulus）是同一个环面：存在微分同胚与 Weyl 变换的复合
  把其中一个的度规送到另一个的度规。

  换言之：模参数 τ 与 τ' 若落在同一个 PSL(2,Z) 轨道上，则给出的世界面在 diff × Weyl 下等价。
  由于 γ 与 −γ 诱导同一个 τ 变换，作用在模参数上的群是 PSL(2,Z) = SL(2,Z)/{±I}。

  ⚠ 本节点**只**断言这一个方向（同轨道 ⇒ 同环面）。反方向「不同轨道 ⇒ 不同环面」
  在本图由 worldsheet.modular-fundamental-domain 承担，且那条的论证不完整。
