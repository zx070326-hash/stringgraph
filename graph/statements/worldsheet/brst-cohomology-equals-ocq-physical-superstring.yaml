id: worldsheet.brst-cohomology-equals-ocq-physical-superstring
kind: proposition
title: 超弦的两个酉同构（Lian–Zuckerman 1989 Theorem 2.20）：T ∩ P ≅ P/rad P ≅ H⁰_rel（横向空间 ≅ OCQ 物理态模零态 ≅ 相对 BRST 上同调）
statement: |
  **设定**与 worldsheet.no-ghost-theorem-superstring-cohomological 的 (H1)–(H5) 完全相同：
  RNS 弦，扇区标号 κ = ½（NS）/ 0（R）；D = 10（物质中心荷 c^m = 15、鬼 c^g = −15，
  故 Q_B² = 0）；质心动量 **p ≠ 0**（并按 lian-zuckerman-1989 的假设取 p 在未来半光锥）；
  相对复形 C_rel(p,κ) = 被 b₀、L₀ 零化（NS）/ 再被 β₀、G₀ 零化（R）的子复形；
  R 扇区 βγ 零模表示为 lian-zuckerman-1989 p.306 (7) 的 T₀ ⊕ T₁；GSO 投影之前。
  鬼数零点按 conv.superstring-ghost-number-zero 的 canonical（相对上同调集中在 0）。

  **三个空间**：
    **P(p,κ)**（OCQ 物理态空间）：物质 Fock 空间 V(p,κ) 中满足
        L^m_n |v⟩ = δ_{n,0} κ |v⟩  (n ≥ 0),    G^m_{n+κ} |v⟩ = 0  (n ≥ 0)
      的向量组成的子空间。注意 L₀ 本征值 = κ（NS 为 ½、R 为 0）——这就是**超弦的截距**，
      在 lian-zuckerman-1989 的 L₀ 归一化下取此值（见 notes 的约定换算）。
    **rad P(p,κ)**（零态空间）：P 中与 P 的一切向量正交的向量（即 P 上厄米形式的根基）。
    **T(p,κ)**（横向空间）：V(p,κ)^{Vir_κ^+} 中一个满足
        ch_q T(p,κ) = dim R(p,κ) · q^{p·p/2} · φ_κ(q)^{−8}
      的子空间（8 个横向玻色 + 8 个横向费米振子的特征标）。
    **H⁰_rel(p,κ)**：相对 BRST 上同调在鬼数 0 处的分量。

  **断言**：
    **(1)** 包含映射 λ : P → C⁰_rel，λ(v) = v ⊗ |q_F = 1⟩ ⊗ |q_B = 1 − κ⟩ 诱导一个
        **酉同构** P / rad P ≅ H⁰_rel(p,κ)；
    **(2)** 包含映射 T ∩ P ↪ P 诱导一个**酉同构** T ∩ P ≅ P / rad P。
  即（原文逐字）'There are unitary isomorphisms T ∩ P ≅ P/rad P ≅ H⁰_rel.'
  这里"酉"（unitary）指保各空间上诱导的厄米形式。

  **本命题不断言**：
    (a) 不断言正定性。正定性是独立的一条（作者自命名 "No-ghost Theorem"）：
        worldsheet.no-ghost-theorem-superstring-cohomological。
        ⚠ 逻辑上 (2) + T∩P 正定 ⟹ H⁰_rel 正定，但 lian-zuckerman-1989 的正定性证明
        （Corollary 2.15(ii)）**不走这条路**，而是 Euler–Poincaré + 消灭定理；
        Corollary 2.19(ii) 另外独立给出 T∩P 的正定性。故两卡不互为推论。
    (b) 不断言 T 是唯一的，也不断言 T 与任何具体的 DDF 型构造逐字一致
        （lian-zuckerman-1989 Proposition 2.18 只断言**存在**这样的 T，且 T(p,0) = T⁺ ⊕ T⁻）。
    (c) 不断言 T 与 Polchinski 的 H^⊥（逐字"没有 X^{0,1}、ψ^{0,1}、b、c、β、γ 激发"）
        是同一子空间——二者只作为分级内积空间同构，见 notes。
    (d) 不断言 p = 0（lian-zuckerman-1989 Proposition 5.5 给出不同结果）。
    (e) 不断言绝对复形的上同调（那是 Theorem 5.1 / 5.4 与
        worldsheet.brst-cohomology-picture-independence）。
    (f) 不断言 GSO 投影后的版本（lian-zuckerman-1989 §4 Proposition 4.3）。
