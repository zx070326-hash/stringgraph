id: worldsheet.open-string-intercept
kind: proposition
title: 开弦截距 a = 1
statement: |
  考虑 D 维自由玻色开弦。在旧协变量子化中（worldsheet.old-covariant-physical-states），
  质量壳条件 (L_0 - a)|ψ⟩ = 0 配合 α^μ_0 = (2α')^{1/2} p^μ、L_0 = α' p^2 + N 给出
    α' m^2 = N - a,
  其中 a 是截距（intercept，Regge 轨迹在 m^2 = 0 处的截距）。
  则一致性要求
    a = 1.
  等价的刻画（每条都单独等价于 a = 1，与 D 的取值无关）：
    (a) N = 1 能级无质量，即 α' m^2 = 0 处于 N = 1；
    (b) 第一级伪态（spurious state）L_{-1}|0;k⟩ ∝ k·α_{-1}|0;k⟩ 本身是物理态（因而是零模态），
        从而矢量态的偏振有规范自由度 e^μ → e^μ + λ k^μ；
    (c) N = 1 的 D-2 个态 α^i_{-1}|0;k⟩ 构成无质量小群 SO(D-2) 的矢量表示
        （而非有质量小群 SO(D-1) 的某个表示）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.1（OCQ 的第一级与第二级伪态分析；第一级给 a = 1）"
    note: "抽取记录 polchinski-1998-v1#E56（level 1，(4.1.16)–(4.1.18) 已核实；lead 2026-09-11 订正：原写 E57，E57 是 level 2）。"
  - ref: polchinski-1998-v1
    loc: "§1.3（光锥谱的第一激发级须为无质量 SO(D-2) 矢量）"
    note: "抽取记录 polchinski-1998-v1#E18。"
  - ref: gsw-1987-v1
    loc: "§2.2.1–2.2.2（OCQ 谱、截距与无质量矢量）"
    note: GSW 用 mostly-minus 号差与 α' = 1/2 的开弦归一化，已转写为 conv.metric-mostly-plus 与 conv.alpha-prime-regge。
tags: [bosonic-string, critical-dimension, intercept, open-string, spectrum]
notes: |
  本节点只讲**开弦**截距，且刻意与 D = 26 分离：a = 1 不需要 D = 26（上面 (a)(b)(c) 三条
  刻画都对任意 D ≥ 4 成立），而 D = 26 的三条路线中 BRST 路线（worldsheet.critical-dimension-brst）
  只给出 c_m = 26 而不给出 a = 1。汇总节点 worldsheet.critical-dimension-bosonic 的陈述含 a = 1，
  故其推导必须显式依赖本节点，见 worldsheet.critical-dimension-bosonic--via-three-routes。

  闭弦对应的量是 a = ã = 1（左右各一份），质量壳为 α' m^2 / 4 = N - a；需要时另建节点。

  from: polchinski-1998-v1#E56（level 1 ⇒ a = 1）, polchinski-1998-v1#E57（level 2）, polchinski-1998-v1#E18
  （lead 2026-09-11 订正：原只写 E57 且称抽取记录不存在；现文件已在 main，E56 = level 1 已核实，E57 = level 2 式号未核实。）

  **【2026-09-11：本卡片已换代 → worldsheet.open-string-intercept-v2】**（curator，
  依据 docs/ROADMAP.md「待拆清单」条目与 lead 的同意。本次**只加 superseded_by 与本段 notes，
  statement 文本、sources、tags 一字未动**，符合根 CLAUDE.md 原则 1。）

  拆分理由：本卡片的 statement 把两件事绑在一起——
    (i) 质量公式 α'm² = N − a（连同 L_0 = α'p² + N 的代入），**已被 Lean 覆盖**
        （worldsheet.open-string-l0-equals-level-plus-mass、
        worldsheet.physical-states-level-grading，均 formalized）；
    (ii)「一致性要求 a = 1」，只有 physical-argument 支撑（两条推导的输入分别是
        「谱须组织成洛伦兹小群表示」与「伪态必须解耦」，都是一致性要求而非定理）。
  绑在一张卡上时 (i) 被 (ii) 封顶，两者无法分别记账。新卡 v2 只承载 (ii)，
  (i) 由上述两张 formalized 卡片承载（**不另建新卡**）。

  换代的机械后果：两条推导 --via-light-cone-representation 与 --via-null-state-decoupling
  因 id 规则 `<statement-id>--via-<method>` 无法就地改 id，已 `git mv` 成
  `open-string-intercept-v2--via-...` 并改 target，内容基本沿用（改动见各文件 notes）。
  因此**本卡片在换代后没有任何推导**，`stringgraph report` 会把它列入 "open propositions"；
  这是换代的正常副作用而非新增缺口——本卡片换代后已无任何入边
  （原先依赖它的 worldsheet.critical-dimension-bosonic--via-three-routes 与
  worldsheet.leading-regge-trajectory--via-spin-counting 已改指 v2），
  故换代不改变任何节点的有效状态。

  需要引用本卡片内容的下游一律改引：a = 1 → worldsheet.open-string-intercept-v2；
  质量公式 → worldsheet.open-string-l0-equals-level-plus-mass（+ 逐 level 刻画则
  worldsheet.physical-states-level-grading）。
superseded_by: worldsheet.open-string-intercept-v2
