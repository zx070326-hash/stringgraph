tags: [cft, representation-theory, super-virasoro, rns, kac-determinant]
notes: |
  【本卡与玻色版 worldsheet.kac-determinant-v2 的关系：两条不同的公式，不得互相顶替】
  worldsheet.kac-determinant-v2 是**玻色 Virasoro** 的 Kac 行列式（Verma 模 V(c,h) 的
  Shapovalov 行列式，指标 r,s ≥ 1 整数，重数 p(N−rs)）。本卡是**超 Virasoro** 的两扇区版本
  （指标 r,s ∈ ½ℕ，重数 p̂，R 扇区多一个 (h+c/16) 前因子），且用的是完全不同的一套变量归一化。
  两卡的上游文献也不同：玻色版是 Kac [13]/[14] 猜 + Feigin–Fuchs 证；
  超版是 Kac [14]（NS）/ Friedan–Qiu–Shenker [7,8]（R）猜 + 本卡的来源证。
  ⚠ **下游接线时不得把 worldsheet.kac-determinant-v2 当作超 Virasoro 的上游**——
  worldsheet.rns-fock-module-free-over-negative-super-virasoro--via-lian-zuckerman-1989
  的 gaps 里此前专门写了这条告诫，本卡建立后那条告诫仍然有效（只是「无卡可接」那一半已关）。

  【为什么 NS 与 R 合成一卡，而不按「一节点一命题」拆开】
  按根 CLAUDE.md 原则「文献把两件事写在一个定理里而它们**被分别推导**时，拆开」。
  这里两件事**不是**分别推导的：MRC 的证明段「Proof of the Determinant Formulas」(pp. 286–287)
  是**一个对 n 的归纳**同时给出 (8) 与 (9)，其两个输入 Proposition 4.10 与 Proposition 4.13
  也各自一条命题里同时覆盖 𝔤 = n̂s 与 𝔤 = r̂ 两支。故合成一卡。
  ⚠ 代价是 statement 里 p̂ 有两个定义；按 auditor 的指令（rulings §4）**两个定义已分开写在 (B) 里**，
  任何引用本卡的下游必须指明用的是哪个扇区的 p̂。
  ⇒ 若日后只需要单扇区（例如只做 NS 的形式化），应新建更窄的卡，**不要**改本卡。

  【ℕ 是否含 0 —— 这是解读，不是原文】
  MRC 写「Let r, s ∈ ½ℕ」，**没有**说明 ℕ 是否含 0。本卡 statement 按 **ℕ ∌ 0** 读，
  依据是 auditor 的两条论证（rulings §1.2 末，标注为「解读，非原文明写」）：
    (i) 若允许 r = 0，则 (8)(9) 对一切 n 都会多出伪因子 ψ_{0,s}^{p̂(n)}，
        且 Proposition 4.10 里的 d̂(0) = #{(r,s) | 2rs = 0} 为无穷；
    (ii) 反面校验：n = ½ 时 (8) 只剩 (r,s) = (½,½)，det = ψ_{½,½} = h，
        与 Prop 3.6 给的 dim = p̃(1) = 1 及 (G_{−½}v, G_{−½}v) ∝ h 一致。
  ⇒ **这一条是本卡陈述里唯一的非逐字成分**，已在 statement (A) 内联标注。

  【「n ≧ 0」与本卡写的「n ≥ 1」】
  原文在 (9) 之后印的是「if n ≧ 0」，紧接着又单列了 n = 0 的两个值。
  auditor 2026-09-12 指出（rulings §1.1 末）：n = 0 时 (9) 的指数是 ½p̂(0) = ½，**非整数**，
  故 (9) 在 n = 0 处**字面上不成立**，其实际适用范围是 **n ≥ 1**，n = 0 由单列的两个值给出。
  本卡 statement 因此写 n ≥ 1 并把两个单列值一并写出。
  ⚠ **这是对原文适用范围的一次收紧，不是对公式的改动**；原文印的「n ≧ 0」逐字记在此处备查。
  ⚠ 对照：(8) 在 n = 0 处乘积为空、det = 1，与 M^λ = ℂv_λ、(v_λ,v_λ) = 1 一致，NS 侧无此问题。

  【(9) 前因子指数 ½p̂(n) 的来历（auditor 的解释，本卡 statement 不承担）】
  Prop 3.6 (3)：h = −c/16 时 R(λ) 的一维商 S(λ) 的每个 γ 分量维数是 ½p̂(n)；
  且 Prop 4.10 的证明里逐字说「the number of such e_I v_λ is equal to the number of such
  e_K e₀⁻ v_λ and is equal ½ p̂(n)」——(h + c/16) 因子来自含 e₀⁻ 的那一半基，
  故指数 ½p̂(n)，两个 γ 相同、**无 ±**。
  ⚠ 这段是**为什么**，不是**是什么**；本卡 statement 只写「指数是 ½p̂(n)，无 ±」这个事实。

  【本卡之外的相关命题（**都还没有卡**，列此以免下次重复找）】
  · **Proposition 3.14(c)**, p.273：Rad( , )_λ 是 M(V(λ)) 的极大真子模（超版的 Shapovalov 对应）。
    这是「行列式为零 ⟺ 有奇异向量」那一步的正经上游，**有编号，比行列式好引**。
  · **Proposition 4.10**, p.283（h-次数计数，含 d̂(i) 的定义）与 **Proposition 4.13**, p.286
    （det 在簇 𝒱_{r,s} 上取零）：本卡推导的两条内部支柱，已写进推导的 sources，未单独立卡。
  · **Theorem 5.1**（linkage）与 **Proposition 5.2**（character sum）：逐字未取（math-sources.md Q55.4）。

  【形式化状态：本卡上限 rigorous，formalized 现在不可能】
  与玻色版同理且更甚：本仓库 formal/ 里没有超 Virasoro 的任何声明；
  Kytölä 的 VirasoroProject 连**玻色**的 ShapovalovForm / KacDeterminant 都没有
  （math-sources.md §34.7 三条独立证据），PBW 是公开的硬瓶颈。
  ⇒ **不要把本卡列进「formalization frontier」的待办**。

  【查重记录】新增前跑过 `uv run stringgraph search 行列式 / Neveu / super-virasoro /
  Shapovalov / contravariant`：图中此前**没有**任何超 Virasoro Kac 行列式节点
  （命中的 worldsheet.kac-determinant{,-v2,-level-two,-level-three,-level-four} 全是玻色版）。
