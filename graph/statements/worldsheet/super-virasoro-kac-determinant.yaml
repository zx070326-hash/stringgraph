sources:
  - ref: meurman-rocha-caridi-1986
    loc: "**Sect. 3, eqs. (7), (7'), (8), (9), p. 274**（**原文无定理号**：这四个是 Sect. 3 末尾的无编号显示公式）；重数函数 p̂ / p̃ 的定义在 **Proposition 3.6, p. 270**（(1)(2)(3) 三条）与其紧邻上文的分拆记号段；省略常数的 Note 紧接 (9) 之下"
    note: |
      **L1 逐字**（physics-auditor 2026-09-12 页图复核，
      literature/extractions/page-check-rulings-2026-09-12.md §1.1 与 §1.2；
      同一裁决的摘要追加在 literature/extractions/math-sources.md §55.9）。

      **(a) 「无定理号」是作者自证的**：p.264 章节导览逐字「In Sect. 3 we present some basic
      results on the Neveu-Schwarz and Ramond algebras and their highest weight representations.
      **The determinant formulas are stated at the end of this section.** In Sect. 4 … We conclude
      this section with the proof of the determinant formulas which consists of two parts: the
      degree computation (Proposition 4.10) and the proof of the vanishing of the determinant on
      the variety of its irreducible factors (Proposition 4.13).」
      ⇒ **本图任何地方写「Meurman–Rocha-Caridi, Theorem X（超 Virasoro Kac 行列式）」都是编造的号。**

      **(b) (9) 的指数逐字读数**：`( h + c/16 )^{½ p̂(n)}`，**没有 ±**。
      math-sources.md §55.3 分层里记的 `±(1/2)p̃(n)` 与波浪号 `p̃` 两处读数**已作废**
      （§55.9 表格逐条判定）：p.274 全部印 `p̂`（尖帽），「Let p̂(i) be as in Proposition 3.6」。

      **(c) 引出句逐字**：「We now state the formulas for the determinant of ( , )_{h,c,n,γ}
      (we omit the subscript γ if 𝔤 = n̂s). The formula for the Neveu-Schwarz algebra was conjectured
      by Kac [14], and the one for the Ramond algebra was conjectured by D. Friedan, Z. Qiu, and
      S. H. Shenker [7, 8]. Let r, s ∈ ½ℕ, r ≦ s. Set, for 𝔤 = n̂s」；
      (8) 行末标 **[14]**，n = 0 两值行末标 **[7, 8]**。

      **(d) Note 逐字**：「The nonzero constant depending on the choice of a basis of M(V(λ))
      has been omitted in (8), (9).」——与 Feigin–Fuchs 玻色版「C 非零」同型，
      **本卡 (D) 照此写，不写 α_N。**

      **(e) Prop 3.6 逐字**（p.270）：「dim M(ℂ(λ))^{λ−nδ} = p̂(n) = p̃(2n), where p̃(0) = 1,
      p̃(s) = Σ_{i=0}^{s} p("H₀", i) p("H₁"(≦1), s−i), s > 0; dim M(R(λ))^{λ−nδ}_γ = p̂(n),
      where p̂(0) = 1, p̂(n) = Σ_{i=0}^{n} p(i) p(𝒟, n−i), n > 0, γ ∈ ℤ₂; If λ(e₀) = −λ(e₀⁺)/16,
      then dim M(S(λ))^{λ−nδ}_γ = ½ p̂(n) for n > 0, p̂(n) as in (2).」
      ⚠ **第 (3) 条里的 `λ(e₀) = −λ(e₀⁺)/16` 照 auditor 的逐字转录抄在这里**；
      它与 §55.4 记的 Proposition 3.10 条件（`λ(e₀⁺) = −λ(e₀')/16`，即 h = −c/16）
      **两处转录不一致**，本项目未再复核。本卡 statement **不使用 (3)**，故不受影响
      （(3) 只是 auditor 解释 (9) 前因子指数 ½p̂(n) 来历的旁证，见 notes）。
