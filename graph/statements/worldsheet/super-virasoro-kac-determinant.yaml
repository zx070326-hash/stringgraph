id: worldsheet.super-virasoro-kac-determinant
kind: proposition
title: 超 Virasoro（Neveu–Schwarz 与 Ramond）Kac 行列式公式（MRC 1986 Sect. 3, eqs. (7)–(9)；原文无定理号）
statement: |
  **全部记号与归一化按 conv.super-virasoro-central-charge-mrc（MRC 1986 自己的一套），
  不是本图 conv.virasoro-standard 的 c/12 变量。**

  设 𝔤 是 Neveu–Schwarz 代数 n̂s 或 Ramond 代数 r̂，λ ∈ 𝔥*，
  h := λ(e₀⁺)、c := λ(e₀')。设 ( , )_λ 是最高权模 M(V(λ)) 上的逆变形式，
  ( , )_{h,c,n} 记其在权空间 M(V(λ))^{λ−nδ} 上的限制（𝔤 = n̂s，省略 γ），
  ( , )_{h,c,n,γ} 记其在 ℤ₂-齐次分量 M(V(λ))^{λ−nδ}_γ 上的限制（𝔤 = r̂，γ ∈ ℤ₂）。

  ---
  **(A) 零点多项式。** 设 r, s ∈ ½ℕ、r ≦ s。
  （此处 ℕ **不含** 0；**这是本图的解读，MRC 未明写**，理由见 notes【ℕ 是否含 0】。）

    𝔤 = n̂s：
      h^±_{r,s}(c) = −(1/8)[ (r²+s²)(5−c) ± √(c²−10c+9) (r²−s²) − 8rs − ½ + ½c ]        … (7)

    𝔤 = r̂：
      h^±_{r,s}(c) = −(1/8)[ (r²+s²)(5−c) ± √(c²−10c+9) (r²−s²) − 8rs − ½ + ½c ] − 1/16  … (7')

  并置（对 r ≠ s，两个 𝔤 都用）

      ψ_{r,s}(h,c) = (h − h⁺_{r,s}(c))(h − h⁻_{r,s}(c)) ,

  以及（**只对 𝔤 = n̂s 定义**）

      ψ_{r,r}(h,c) = h + (1/16)(1−c)(4r²−1) 。

  ---
  **(B) 重数函数 p̂（MRC Proposition 3.6）。两个扇区的 p̂ 是两个不同的函数，必须分开读。**

  先约定分拆计数记号（MRC p.270 定义段）：p(n) 是 n 的分拆数；对全体分拆之子集 S，
  p(S, n) 是 n 的、属于 S 的分拆数；对正整数子集 H，"H" 记所有部分都落在 H 中的分拆之集，
  "H"(≦ d) 记所有部分都落在 H 中、且没有部分出现超过 d 次的分拆之集；
  H₀ 是正偶数之集、H₁ 是正奇数之集；p(𝒟, n) 是把 n 分拆成互不相同的部分的分拆数。

    𝔤 = n̂s（Prop 3.6 (1)）：  p̂(n) = p̃(2n) ,
        其中 p̃(0) = 1 ,  p̃(s) = Σ_{i=0}^{s} p("H₀", i) · p("H₁"(≦1), s−i)   (s > 0) 。

    𝔤 = r̂（Prop 3.6 (2)）：   p̂(0) = 1 ,
        p̂(n) = Σ_{i=0}^{n} p(i) · p(𝒟, n−i)   (n > 0) 。

  ---
  **(C) 行列式公式。**

    **(8)  𝔤 = n̂s，n ∈ ½ℤ₊：**

        det( , )_{h,c,n}  =  ∏_{2rs ≦ n,  r − s ∈ ℤ}  ψ_{r,s}(h,c)^{p̂(n−2rs)} ,

      乘积取遍满足 r, s ∈ ½ℕ、r ≦ s、2rs ≦ n、**r − s ∈ ℤ** 的全部 (r,s)；p̂ 取 (B) 的 NS 定义。

    **(9)  𝔤 = r̂，n ∈ ℤ 且 n ≥ 1，γ ∈ ℤ₂：**

        det( , )_{h,c,n,γ}  =  ( h + c/16 )^{½ p̂(n)}  ∏_{2rs ≦ n,  r − s ∈ ½+ℤ}  ψ_{r,s}(h,c)^{p̂(n−2rs)} ,

      乘积取遍满足 r, s ∈ ½ℕ、r ≦ s、2rs ≦ n、**r − s ∈ ½ + ℤ** 的全部 (r,s)；p̂ 取 (B) 的 R 定义。
      **前因子的指数是 ½ p̂(n)，其上没有 ±**：γ = 0̄ 与 γ = 1̄ 两支用同一个指数。
      **n = 0 的两个值单列**，不由 (9) 给出：

        det( , )_{h,c,0,0̄} = 1 ,   det( , )_{h,c,0,1̄} = h + c/16 。

      （原文在 (9) 后印的是「if n ≧ 0」；本卡写 n ≥ 1，理由见 notes【n ≧ 0 与 n ≥ 1】。）

  ---
  **(D) 常数。** (8) 与 (9) 两式**各相差一个依 M(V(λ)) 的基底选择而定的非零常数，该常数已被省略**
  （原文 Note 逐字：「The nonzero constant depending on the choice of a basis of M(V(λ))
  has been omitted in (8), (9).」）。

  ---
  **本卡不断言的内容：**
    (1) 不断言 (7)–(9) 在 conv.virasoro-standard 的 c/12 变量下的形态。两套变量间的字典
        （c^{MRC} = (2/3)c^{std} 等）是 auditor 自算，登记在 conv.super-virasoro-central-charge-mrc 的
        notes (D) 里，**本卡的陈述不依赖它，也不承担它**。
    (2) 不断言 M(V(λ)) 的构造、逆变形式 ( , )_λ 的存在性与唯一性（那是 MRC Proposition 3.14），
        也不断言「Rad( , )_λ = 极大真子模」（Prop 3.14(c)）。
    (3) 不断言 (D) 里那个常数的值或正负号；**任何形如 det = α_N ∏… 的写法在本卡里没有来源背书**。
    (4) 不断言 h = λ(e₀⁺) 就是标准 L₀ 在最高权向量上的本征值（MRC Sect. 2 对 e₀^± 的定义本项目未读）。
    (5) 不断言公式的任何推论（可约性判据、幺正性区域、linkage 定理 Theorem 5.1、
        character sum 公式 Proposition 5.2）。
