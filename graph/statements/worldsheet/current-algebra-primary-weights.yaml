id: worldsheet.current-algebra-primary-weights
kind: proposition
title: 流代数主场的 Sugawara 权：h_r = Q_r / ((k + h(g)) ψ²) = Q_r / (2k̂ + Q_g)；SU(2) level k 的自旋 j 主场 h_j = j(j+1)/(k+2)
statement: |
  设单李代数 g 的 level-k 流代数（math.affine-lie-algebra-current-ope）作用在 CFT 的态空间上，
  T^s_B 为其 Sugawara 能动张量（worldsheet.sugawara-central-charge）。
  反复用降算符 j^a_n（n > 0）作用可到达被所有 j^a_n（n > 0）湮灭的态，称为流代数的
  **最高权态 / 主场态**；它们在零模下按 g 的某个表示 r 变换：
    j_0^a |r, i⟩ = |r, j⟩ t^a_{r, ji}                                          （(11.5.38)）.
  则：
  **(1)** 这样的态也被 L_n^s（n > 0）湮灭，故是 Virasoro 代数（T^s_B）的最高权态
      （原书逐字：'It is therefore also annihilated by the L_n^s for n > 0, eq. (11.5.26), so is a highest
      weight state of the Virasoro algebra'）；
  **(2)** 其 L_0^s 本征值为
        L_0^s |r, i⟩ = ( Q_r / ((k + h(g)) ψ²) ) |r, i⟩                         （(11.5.39)）,
      即相对于 T^s_B 的共形权
        **h_r = Q_r / ((k + h(g)) ψ²) = Q_r / (2k̂ + Q_g)**                       （(11.5.40)）,
      Q_r、Q_g 分别为表示 r 与伴随表示的 Casimir（math.compact-lie-algebra-index-and-casimir 的 (11.4.7)）。
  **(3)** g = SU(2)、level k、自旋 j 的主场：
        h_j = j(j+1) / (k + 2)                                                  （(11.5.41)）.

  **本命题不断言的内容**：
    (1) 不断言相对于完整能动张量 T_B 的权（若 T_B ≠ T^s_B，还要加陪集部分 T_B′ 的贡献；原书 (11.5.39) 写的是 L_0^s）；
    (2) 不断言主场表示的截断 k̂ ≥ |α·λ|、k ≥ 2|J³|（(11.5.42)–(11.5.44)，'at any given level, only a finite
        number of representations are possible'）——那是另一条命题，本轮未建卡；
    (3) 不断言 (11.5.40) 两个表达式相等所需的 (k + h(g))ψ² = 2k̂ + Q_g 之外的任何 h(g) 定义（原书 §11.4 中段未核实）；
    (4) 不断言 type I Chan–Paton 因子的抽象描述 (11.5.45)–(11.5.46) 与「结合律禁止 E₈ × E₈」——
        原书用被动语态 'has been shown to' 且不给引文（抽取记录 E62 备注）。
