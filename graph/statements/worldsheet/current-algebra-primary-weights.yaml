notes: |
  【数值核对（本图内部，取 f^{abc} = ε^{abc}、d^{ab} = δ^{ab} 的 SU(2) 归一化）】
  Cartan 元 H = J³、E^± = J^±，[H, E^±] = ±E^±，故根 α = ±1、ψ² = 1；Q_j = j(j+1)，Q_g = Q_{j=1} = 2，
  由 h(g)ψ² = Q_g 得 h = 2；(k + h)ψ² = k + 2 = 2k̂ + Q_g（k = 2k̂/ψ² = 2k̂）⇒ h_j = j(j+1)/(k+2)，与 (11.5.41) 一致 ✓。
  同一归一化下 compact.self-dual-radius-su2-current-algebra 的中心项 (m/2)δ^{ij} 即 k̂ = 1/2、k = 1，
  与那张卡 notes 里「level k = 1」的旁注一致 ✓。⚠ 原书 (11.4.14) 的归一化是否就是这一套，本图未核实（pp. 61–65 跳读）。

  【与 Verma 模 / 幺正性的关系】(1) 说主场态是 Virasoro 最高权态（worldsheet.verma-module-v2 的语言）；
  不需要幺正性。(2) 只用 (11.5.26a) 的形式：正模项 j^a_{−n}j^a_n 湮灭主场态，剩下 j_0^a j_0^a = Q_r。
  截断 (11.5.42)–(11.5.44) 才用到幺正性（范数非负），故拆开。
