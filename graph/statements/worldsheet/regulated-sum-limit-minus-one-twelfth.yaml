id: worldsheet.regulated-sum-limit-minus-one-twelfth
kind: proposition
title: 指数截断求和的极限：lim_{u→0+} [Σ_{n≥1} n e^{-un} − 1/u²] = −1/12
statement: |
  对 u > 0，级数 Σ_{n≥1} n e^{-un} 绝对收敛（记其和为 f(u)）。则极限
    lim_{u → 0+} [ f(u) − 1/u² ] = −1/12
  存在且等于 −1/12。

  这等价于说：f(u) 在 u → 0+ 的发散部分**恰好**是 1/u²（没有 1/u 项），
  且余下的有限部分**恰好**是 −1/12。

  本命题是 worldsheet.regulated-sum-laurent-expansion 的一个**更窄**的版本：
  它只断言上述极限存在并给出其值，不断言余项的阶
  （即不断言 f(u) − 1/u² − (−1/12) = O(u²)，那是更强的陈述）。
uses_conventions: []
formal:
  lean_decl: StringFormal.RegulatedSum.tendsto_regulatedSum_sub_invSq
  lean_file: StringFormal/Math/RegulatedSum.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/RegulatedSum.lean :: StringFormal.RegulatedSum.tendsto_regulatedSum_sub_invSq"
    note: |
      本仓库，提交 1b95be8（"formal: prove Laurent constant Sum n e^{-un} - 1/u^2 -> -1/12 as
      u -> 0+"），并入 main 经 9889711（"Merge branch 'agent/formalizer/zeta-bridge'"）；
      Lean 4 + Mathlib v4.33.1。声明全文：

          theorem tendsto_regulatedSum_sub_invSq :
              Tendsto (fun u : ℝ => (∑' n : ℕ, (n : ℝ) * exp (-(u * n))) - 1 / u ^ 2)
                (𝓝[>] (0 : ℝ)) (𝓝 (-1 / 12)) := ...

      与本卡正文逐字对应：`∑' n : ℕ, (n : ℝ) * exp (-(u * n))` 是 f(u)（n=0 项为 0，故求和
      实际从 n=1 起，与卡面 Σ_{n≥1} 一致）；`Tendsto ... (𝓝[>] 0) (𝓝 (-1/12))` 即 u → 0+ 时
      f(u) − 1/u² → −1/12。**本卡刻意不写 O(u²) 阶**（那是母卡
      worldsheet.regulated-sum-laurent-expansion 多断言的部分，Lean 未证，见该卡笔记）。
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.32)（p.22，同一截断求和在原书里的出处；仅作语境定位，不承载本卡的任何论证——本卡的证明是纯分析，见上一条 source）"
    note: |
      本条不提供论证，只说明本卡陈述的数（−1/12）与原书正规化处方所用的同一个极限相同；
      物理诠释（"这就是零点能"）不在本卡断言范围内，见 worldsheet.zeta-regularized-sum-of-integers。
tags: [regularization, analysis, lemma, formalized]
notes: |
  由 curator（zeta-wire）于 2026-09-11 从 formalizer 分支 agent/formalizer/zeta-bridge（已并入 main，
  9889711）新增的 `formal/StringFormal/Math/RegulatedSum.lean` 拆出。

  **为什么单独立卡而不是直接把 worldsheet.regulated-sum-laurent-expansion 标 formalized**：
  该母卡的正文断言 `= 1/u² − 1/12 + O(u²)`，即额外要求余项的**阶**。Lean 文件的
  `tendsto_regulatedSum_sub_invSq` 只证明了极限存在且等于 −1/12——这**蕴含**「无 1/u 项、
  常数恰为 −1/12」，但**不蕴含** `O(u²)` 这个更精细的渐近阶信息（`Asymptotics.IsBigO` 未在
  Lean 里组装，见该文件文档字符串 "What is *not* here"）。若直接把母卡标 formalized，
  就会让工具报告「母卡断言的东西全部机检过」，这不真实（原则 2：状态只能实话实说）。
  按 docs/STATUS_LEVELS.md「定义卡」一段给出的通用处方（"拆卡，让 Lean 对应的那一半成为
  formalized"），这里拆出本卡。

  母卡 worldsheet.regulated-sum-laurent-expansion 新增一条推导
  `--via-lean`（status: rigorous，非 formalized）依赖本卡，见该卡笔记。
