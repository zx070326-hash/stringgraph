notes: |
  【status 的理由】与 worldsheet.rns-action 相同：这是路径积分/算子乘积层面的复合算符
  （需要正规序，Vol.2 把 : : 隐含），本图无算子乘积的严格构造。
  纯代数的模式版本（(10.2.12) 的 L_m、G_r）另有卡片
  worldsheet.rns-super-virasoro-generators，那张卡只用振子代数，故可标得更高。

  【线性 dilaton 的推广未建节点】(10.1.22a,b)/(10.1.23)：T_B、T_F 加 V_μ 项，c = (3/2)D + 6α'V^2
  （E14）。原书 'The reader can verify'，本轮不建。与玻色弦的
  worldsheet.linear-dilaton-central-charge 平行。
