id: worldsheet.rns-superconformal-generators
kind: definition
status: physical-argument
title: Xψ SCFT 的能动张量与超流 (T_B, T_F)
statement: |
  在 worldsheet.rns-action 的 Xψ 理论中定义两个全纯流：
    T_B(z) = −(1/α') ∂X^μ ∂X_μ − (1/2) ψ^μ ∂ψ_μ      （能动张量，权 (2,0)）
    T_F(z) = i (2/α')^{1/2} ψ^μ(z) ∂X_μ(z)            （超流，权 (3/2,0)）
  以及反全纯的一份 (T̃_B, T̃_F)（把 ∂ 换成 ∂̄、ψ 换成 ψ̃）。正规序按 Vol.2 体例隐含。

  **记号约定（重要）**：Polchinski 把超流的**场**记作 T_F（不用常见的 G(z)），
  而把它的**模式**记作 G_r：T_F(z) = Σ_{r∈Z+ν} G_r / z^{r+3/2}。
  从写 G(z) 的文献接边过来时不要把 T_F 与 G_r 当作两个不同对象。

  **本卡不断言的内容**：
    (1) 不断言 (T_B, T_F) 满足超共形代数或任何 OPE——那是
        worldsheet.rns-superconformal-ope 的内容。
    (2) 不断言 T_F 生成 (10.1.10) 的超共形变换（原书把该论证推给习题 10.1）。
    (3) 不断言中心荷的值（见 worldsheet.rns-matter-central-charge）。
