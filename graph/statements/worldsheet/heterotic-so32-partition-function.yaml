notes: |
  ★【本卡的要点是「符号从哪来」】三条理由把 type II 的两个相对负号逐一注销：
  一个来自**超共形鬼场的 F**（左移一侧没有超共形鬼场），一个来自**时空统计**
  （λ^A 是时空标量，其 R 扇区态也是时空标量，不是时空费米子）。
  这正是 worldsheet.heterotic-string-construction 的「左移一侧没有超流」在配分函数上的表现。

  【与 E₈ × E₈ 的对照】(11.2.22) 的 Z_8² 是**八次幂的平方**，原书逐字强调
  'It is important here that the fermions are in groups of 16, so that the minus signs from
  Z_ψ^± (which was for eight fermions) are squared.' ——即同一条符号论证在分组为 16 时仍然成立，
  分组为 8 时**不成立**。见 worldsheet.heterotic-two-supersymmetric-ten-dimensional。

  【自称严格程度】'Modular invariance is straightforward.' 是全部论证，
  原书不写模变换的验证。按 docs/STATUS_LEVELS.md「断言 + 骨架」档位标 physical-argument。

  【与 compact 区的接口（只在 notes 指向，不加边）】玻色构造下同一件事表述为
  「模不变 ⟺ 格偶自对偶」：compact.modular-invariance-requires-self-dual-lattice
  与 compact.self-dual-lattice-gives-modular-invariance（均在分支 agent/curator/polchinski-ch8，
  **本轮未合并**）。本图的 compact.heterotic-narain-lattice-even-self-dual 是杂化弦版本，
  待那支合并后由 lead 决定是否接边。
