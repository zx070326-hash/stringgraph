id: worldsheet.heterotic-so32-partition-function
kind: proposition
title: SO(32) 杂化弦左移部门的配分函数 Z_16 = (1/2)[Z^0_0^16 + Z^0_1^16 + Z^1_0^16 + Z^1_1^16]，四项**全取正号**，且模不变
statement: |
  用 §10.7 的记号（worldsheet.modular-invariance-requires-eight-transverse-fermions）：
  Z^α_β(τ) = Tr_α[q^H exp(πiβQ)] = ϑ[α/2, β/2](0, τ)/η(τ) 是**一对**世界面费米子的迹，
  α 标周期性（R: α = 1、NS: α = 0），β 标是否插入 exp(πiF)。

  **断言**：worldsheet.heterotic-so32-projections 定义的 SO(32) 杂化弦，其 32 个左移费米子
  （= 16 对）的配分函数是
    **Z_16(τ) = (1/2)[ Z^0_0(τ)^16 + Z^0_1(τ)^16 + Z^1_0(τ)^16 + Z^1_1(τ)^16 ]**   （(11.2.13)），
  **四项全取正号**（对比 type II 的 Z_ψ^±(τ) = (1/2)[Z^0_0⁴ − Z^0_1⁴ − Z^1_0⁴ ∓ Z^1_1⁴]），
  并且它（与右移超弦部门、X 部门一起）模不变。原书自称：'Modular invariance is straightforward.'

  **原书给出的三条理由（逐字）**：
    (i) 'With 32 rather than 8 fermions, the signs in the modular transformations are raised to
        the fourth power and so the first three terms must enter with a common sign.'
        （模变换相位对 16 次幂而言是 8 次幂情形的四次方，故前三项必须同号。）
    (ii) 'the relative minus sign in the first and second terms of Z_ψ^+ came from the F of the
        superconformal ghosts, **which we do not have on the left-moving side** of the heterotic
        string.'
    (iii) 'The relative minus sign in the first and third terms came from spacetime statistics,
        **but the λ are spacetime scalars** and so are their R sector states.'

  **本命题不断言的内容**：
    (1) 不断言第四项 Z^1_1^16 的符号是被上述论证定出的。上述三条只覆盖前三项同号
        与两个相对负号的**消失**；原书对第四项未单独论证。
    (2) 不断言完整的模不变性验证（原书只说 'straightforward'，不做）。
    (3) 不断言 (1/2) 这个前因子的来源（它是对两种周期条件求和再投影的记账）。
    (4) 不断言 ϑ/η 函数的模变换公式本身——那在 §7.2/§10.7，本图只有
        worldsheet.modular-invariance-requires-eight-transverse-fermions 一张卡记了变换式。
