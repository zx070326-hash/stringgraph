sources:
  - ref: polchinski-1998-v2
    loc: "§11.5, eq. (11.5.16)–(11.5.17), p. 68（杂化弦的流 iλ^Aλ^B 构成 SO(n) 代数、level k = 1、n = 3 例外 k = 2；一般表示 r 的自由费米子构造 (1/2)λ^Aλ^B t^a_{r,AB}、level k = T_r/ψ²）"
    note: |
      L1（抽取记录 literature/extractions/polchinski-1998-v2.md E60）。
      抽取记录只记了这两式与结论，未转录原书由 λλ OPE 算出 (11.5.1) 系数的中间步骤；
      原书本段自评（E60 所录的逐字之一）：'It is easy to see that…'。
tags: [current-algebra, free-fermion, so-n, level-one, heterotic, cft]
notes: |
  【与 ch11 杂化弦卡的关系】这是原书 §11.5 对 §11.2 的**回指**：SO(32) 杂化弦的 32 个 λ^A 给 level-1 的 SO(32)
  流代数，E₈ × E₈ 杂化弦的两组 16 个 λ 各给 level-1 的 SO(16)（再由 (11.2.26) 的旋量流扩大到 E₈——
  **该扩大原书 §11.5 未陈述**，本卡不断言）。worldsheet.heterotic-so32-massless-spectrum 推导里
  「λ^A_{−1/2}λ^B_{−1/2}|0⟩ 按 SO(32) 的 [2] = 伴随变换」的李代数事实，其在原书内的支撑就是 (11.5.16)：
  双线性 iλ^Aλ^B 的零模就是 so(n) 的生成元。该推导加了一条 inferred 边指向本卡
  （§11.2 不前引 §11.5，故 inferred）。

  【与 U(1) 与玻色化的关系】复化 λ^{K±}（(11.2.11)）后 Cartan 子代数的流 iλ^{2K−1}λ^{2K} = i∂H^K
  就是 worldsheet.u1-current-algebra-is-free-boson 的 (11.5.15) 与 worldsheet.fermion-bosonization-two-dimensions 的接口；
  本卡不加边（原书此处不写）。
