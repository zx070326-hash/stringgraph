      **curator 未自行重跑 `lake build`**；合并前应由 lead 跑 `uv run stringgraph check-axioms`。
      推导见 worldsheet.vertex-operator-adjoint--via-lean。
      ⚠ **Lean 证的比本卡 (1) 强**：不需要 k_0² = 0，也不需要 2α' k_0·p = 1；
      详见该推导的 notes【本推导证明的比目标卡多三处】与 gaps 第 1 条。
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      与 worldsheet.ddf-operators-v5 / worldsheet.ddf-operators-adjoint 同一处来源，
      **核实等级沿用**：章节页码 L4/L2（literature/extractions/brst-cohomology-sources.md §5.2–5.3），
      **式号与正文 L0**（Google Books 只定位到 'DDF' 首现 p.103，正文未获取）。
      ⚠ **GSW 在此处不单独陈述顶点算子模的伴随关系**：教科书只对合成后的 DDF 算子说一句
      「A^i_n 是厄米的」，把顶点算子的伴随当作径向量子化的常识跳过。
      本节点把那一步单列出来，是 worldsheet.ddf-operators-adjoint--via-vertex-operator-adjoint
      的 gaps 第 2 条要求的（逐字：「本图中没有承载它的节点……若 reviewer 要求，
      应把它单列成一条命题节点」）。因此本条来源承载的是**命题所在的语境**，不是它的论证。
      GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写；GSW 取 α' = 1/2，
      其归一化写作 k_0·p = 1，是 (★) 的特例。
  - ref: polchinski-1998-v1
    loc: "§6.6，eq. (6.6.24)（两个正规序指数顶点算子的乘积/OPE：:e^{ik₁·X(z₁)}::e^{ik₄·X(z₄)}: = |z₁₄|^{α'k₁·k₄} :(…)e^{i(k₁+k₄)·X(z₄)}:），p.195"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E109，位置证据等级 **[已核实] / L1**
      （式号与内容经第三方笔记 [S] §6.72 复现）。
      这是**重排序因子的来源**：把两个指数算符换序所付的代价是 |z₁₄|^{α' k₁·k₄} 一类的幂因子，
      k₁·k₄ = 0 时该因子为 1。推导 summary 第 3 步用的正是这条规则在
      k₁ = n k_0、k₄ = −n k_0（同一个算符的两半）上的自配对情形，指数 ∝ α' n² k_0² = 0。
      ⚠ **限定三条**：(i) Polchinski 写的是**两个不同插入点的算符之积**的 OPE，
      不是**同一个算符内部** E_+ 与 E_- 两半的重排序；后者是前者的形式极限，
      本图**没有节点**承载这一步（见推导 gaps）。
      (ii) 那里是闭弦、双全纯的 |z|^{…}；开弦边界归一化只有全纯一半，
      指数按 worldsheet.ddf-operators-v5 说明 (c) 的开弦约定读。
      (iii) 抽取记录同处（#E109 备注）标明该 OPE **依赖 OPE 的收敛性**（该记录的 Q3 未解决）。
  - ref: polchinski-1998-v1
    loc: "§4.1（p.121 起）（协变 Fock 空间与 (α^μ_n)† = α^μ_{−n}；页码已核实、式号未核实）"
    note: |
      提供振子层面的伴随规则，本命题的论证把它逐因子用在正规序指数的展开上。
      与 worldsheet.fock-indefinite-form 同一处来源、同一核实等级（#E54，页码已核实、式号未核实）。
  - ref: goddard-2008
    loc: "arXiv:0802.3249，无鬼定理一节（DDF 态按横向振子 Fock 空间计数，其内积正定）"
    note: |
      作者本人的历史综述（L3，二手）。**预设**本命题（DDF 算子的伴随关系的唯一非初等输入
      就是本命题），但不给证明、不给编号（brst-cohomology-sources.md §3.1 第 1 条）。
      只作为「这是被默认使用的标准事实」的二手证据，不承载论证。
tags: [bosonic-string, vertex-operator, momentum-tower, adjoint, spectrum-generating-algebra, no-ghost]
notes: |
  【为什么立卡】worldsheet.ddf-operators-adjoint--via-vertex-operator-adjoint 的 gaps 第 2 条
  逐字要求：「**第 2 步的顶点算子伴随 (V^{(n)}_J)† = V^{(−n)}_{−J} 是本推导唯一的非初等步骤，
  且本图中没有承载它的节点**……若 reviewer 要求，应把它单列成一条命题节点。」
  同一条缺口在 worldsheet.ddf-operators-v5 的 notes (4)（「顶点算子的伴随 V(b)_J† = V(−b)_{−J}
  未做」）与 formal/StringFormal/NoGhost/VertexOperator.lean 文件头 "Mathematical gaps" 第 3 条
  （「no adjointness of `V_K` for `Fock.pairing` is proved」）各登记一次。
  本卡关闭这三处登记的同一个缺口（在「有节点承载」这个意义上；论证本身仍是 physical-argument）。
  lead 已同意立卡（docs/ROADMAP.md 待建清单）。

  查重：2026-09-11 跑 `uv run stringgraph search 顶点算子 / vertex / 伴随 / 厄米 / 共形权`。
  既有的伴随类节点是 worldsheet.virasoro-generators-adjoint（L_m^† = L_{−m}，已 formalized）、
  worldsheet.fock-indefinite-form（(α^μ_n)† = α^μ_{−n}，已 formalized）、
  worldsheet.bc-ghost-hermitian-conjugation（b_n† = b_{−n}、c_n† = c_{−n}）与
  worldsheet.ddf-operators-adjoint（(A^i_n)† = A^i_{−n}）；
  既有的顶点算子类节点是 worldsheet.string-cft-is-a-vertex-algebra-v2 与 math.vertex-algebra-*
  一族（顶点代数的局域性与结合性，不涉及不变型或伴随）。
  **没有任何节点断言顶点算子模的伴随关系。**

  【与 worldsheet.virasoro-generators-adjoint 的关系】三条伴随关系是**同一机制的三个实例**
  （由「厄米」场构成的权 h 场，其模在径向共轭下指标反射 J_m^† = J_{−m}）：
    h = 1 的 ∂X^μ  → (α^μ_m)† = α^μ_{−m}   （worldsheet.fock-indefinite-form，formalized）
    h = 2 的 L_m   → L_m^† = L_{−m}          （worldsheet.virasoro-generators-adjoint，formalized）
    h = 0 的 :e^{i n k_0·X}: → 本命题        （**未形式化**）
  前两条已机器验证，是因为它们在**单层** Fock 空间上是振子的有限（双）线性和，
  逐项配对 + 指标反射即可。本命题不同：它跨层（V^{(n)}_J 移动动量），
  且要处理正规序指数两半的重排序。因此本命题**不能**沿用那两条的 formalized 状态。
  【⚠ 已消解 2026-09-12：VertexAdjoint.lean】上面这段的末两行**已过时**，逐条订正：
    · 「**未形式化**」→ 已形式化（`Fock.towerPairing_towerVertex_left`，见 formal 字段与
      推导 --via-lean）。三个实例现在全部机器验证。
    · 「要处理正规序指数两半的重排序」→ **这一步不存在**：V(b)_K = E₋(b)E₊(b) 是正规序，
      其伴随 E₊(b)†E₋(b)† = E₋(−b)E₊(−b) **本身就是正规序**，产生因子自动在左，
      不需要把 E₊ 换到 E₋ 右边，也不产生任何 c-数自缩并因子。
    · 「跨层」这条**成立且确实是难点所在**，但它已由 worldsheet.momentum-tower-fock-space 的
      `Fock.towerPairing`（层间正交，formalized）解决；本命题的塔层部分只是
      「层标签移位 + 层间正交挑出唯一非零配置」。

  【为什么不是 rigorous】——**本段只适用于推导 --via-radial-conjugation；
  2026-09-12 起本卡另有一条 formalized 推导 --via-lean，本卡的有效状态由后者决定。**
  按 docs/STATUS_LEVELS.md 的 rigorous 例外条款，需要
  「前提完整 + 有限步初等计算 + reviewer 已独立复核并记录」。该推导的论证有两处不满足：
  (i) 「厄米共轭在径向量子化下作用为 z ↦ 1/z̄」这条规则本图**没有节点**
      【2026-09-11（四）更新：已有节点 worldsheet.radial-hermitian-conjugation，
      但该卡 effective 仍是 physical-argument，故此条只是搬家】；
  (ii) 【**已消解 2026-09-12：VertexAdjoint.lean**；原文保留如下，不删】
      原文：「正规序指数两半的重排序在**代数** Fock 空间上是一步形式操作，
      文献侧最近的可引用式（Polchinski (6.6.24)）讲的是两个不同插入点算符之积的 OPE，
      且依赖 OPE 收敛性。」
      **订正：此步不存在。** VertexAdjoint.lean 证明的是：伴随把正规序的 E₋(b)E₊(b)
      送成 E₊(b)†E₋(b)† = E₋(−b)E₊(−b)，**本身就是正规序**（产生因子自动落在左边），
      因此根本不需要把 E₊ 换到 E₋ 的右边，也就没有任何「同点重排序」要付的 c-数代价。
      这同时解释了为什么 `Fock.pairing_vertexOsc_left` 对**任意** b 成立而不需要 b·b = 0。
      ⇒ 此前把这一步登记为「本推导唯一的非初等步骤 / 唯一无节点的缺口」的所有地方
      （本卡、--via-radial-conjugation 的 gaps 第 4 条、ddf-operators-adjoint 一族）
      都应读作**该步骤是虚构的**，不是「尚未完成」。
  故 --via-radial-conjugation 仍是 physical-argument。**无 reviewer-verified 记录。**

  【升级路径】——**(i) 已于 2026-09-12 走完，见本 notes 末段；(ii) 仍开放。**
  (i) 走 Lean（最短）：VertexOperator.lean 已有正规序指数的两半
      （`Fock.creaExp` = E_-，即乘以一个显式 Fock 元素；`Fock.vertexSub` = E_+，即变量平移）
      与模 `Fock.vertexOsc`，DDF.lean 已有塔与 `towerVertex`。缺两件：
      塔上的双线性型（worldsheet.momentum-tower-fock-space 的 notes 记的
      `towerPairing := Σ_j Fock.pairing`），以及本命题本身。
      在代数模型里「重排序」不是解析操作，只是 `creaExp` 的乘法与 `vertexSub` 的平移交换次序，
      因此这一步预期是可做的；k_0² = 0 进入 Lean 的方式是显式假设 `dotVec η b b = 0`。
      做完后本命题可升 formalized，并连带把 worldsheet.ddf-operators-adjoint 的
      非初等输入变成机器验证的。
      ⚠ 结构性限制：Lean 侧只有 R-双线性型，**无 sesquilinear 结构**，
      故即使做完也只覆盖边界 (a) 说的实极化情形。
  (ii) 走数学文献：顶点算子代数（Borcherds / FLM）传统里「不变双线性型」与算子的伴随
      （adjoint vertex operator）是标准且带编号的对象。需 researcher 先取得可引用陈述；
      与 worldsheet.ddf-operators-adjoint 升级路径 (ii)、
      worldsheet.ddf-transverse-oscillator-algebra 升级路径 (ii) 是同一条。

  【下游】worldsheet.ddf-operators-adjoint--via-vertex-operator-adjoint 的第 2 步。
  本卡不改变该推导的有效状态（那里已是 physical-argument），只把此前挂在 gaps 里的
  裸断言换成一条有来源、有边界、有升级路径的节点。

  【记号歧义登记（本图内部，非文献）】DDF 算子的模态和在本图中有两种写法：
  worldsheet.ddf-operators-adjoint--via-vertex-operator-adjoint 的 summary 写
  A^i_n = Σ_{m ∈ Z} α^i_m V^{(n)}_{−m}，而 formal/StringFormal/NoGhost/DDF.lean 文件头
  "What is NOT here" 第 1 条写 A^i_n = Σ_{m ∈ ℤ} α^i_m ∘ V^{(n)}_m。
  两者差一个求和指标的反射，在「对全部 m ∈ Z 求和」下是同一个算子，
  但**逐项对应关系相反**，形式化时必须先定死一种。本卡的 V^{(n)}_J 按「z^J 的系数」定义
  （与 Lean 的 `vertexOsc` 一致）。这条只是记号，不影响本命题的任何断言
  （(1) 对**每个** J 成立，与如何求和无关）。已在报告中提请 lead/auditor 择一规范化。

  【2026-09-11（四）：两条此前无节点的前提现已各有承载卡（curator；**只加本段 notes，
  陈述文本未动**；推导 --via-radial-conjugation 已加两条非 inferred 依赖）】
  本卡 notes【为什么不是 rigorous】列的两条理由 (i)(ii) 中，第 (i) 条
  （「『厄米共轭在径向量子化下作用为 z ↦ 1/z̄』这条规则本图**没有节点**」）**已过时**：
    · 该规则现由 worldsheet.radial-hermitian-conjugation 承载（definition，
      own status rigorous / effective physical-argument）。其 (4) 还把本卡推导第 1 步里
      「h ≠ 0 时反射带 h 依赖的指标平移」写成精确形式：在本卡用的「z^J 的系数」指标下
      反射是 **J ↦ −J − 2h**，只有 h = 0 时才是纯粹的 J ↦ −J；
    · 本卡 statement 与推导 summary 所用的「:e^{i n k_0·X}: 在 k_0² = 0 时权为 0」
      现由 worldsheet.exponential-vertex-operator-weight 承载（(1)(2)(b)(3)，
      开弦边界归一化 h = α'k²；effective physical-argument）。
  **但 status 定级不变，仍是 physical-argument**，理由三条：两张新卡自身的 effective
  都是 physical-argument；新卡的来源锚点仍弱（radial 卡的 (1) 无任何式号锚点，
  weight 卡的主来源内容未核对）；且本卡推导**唯一剩下真正无节点的那一步**——
  同一个算符内部 E_+ 与 E_- 的**重排序**——没有变（文献侧只有分离插入点的
  Polchinski (6.6.24)，Lean 侧只分别有两半 `Fock.creaExp` / `Fock.vertexSub`、不给换序）。
  【为什么不是 rigorous】的第 (ii) 条因此**完整保留**。
  notes【升级路径】(i) 也不变：Lean 侧仍缺塔上的双线性型与本命题本身。

  【2026-09-11 下午（curator，对接 TowerPairing.lean）】本卡 (1) 用到**跨层配对**
  （V^{(n)}_J 把第 N 层送到第 N+n 层，故等式两侧的配对发生在相邻的不同层之间），
  而塔上型的「层间正交」是 worldsheet.momentum-tower-fock-space (2) 的**约定式定义**：
  它现已形式化（那张卡 2026-09-11 下午升为 formalized，lean_decl = `Fock.towerPairing`），
  但在 Lean 里它是 `towerPairing`（各层配对的**单位权求和**）的**定义**及其在 rung 基上的展开
  `towerPairing_single_single_of_ne`，**不是物理证明**，也不是 δ^D(p − p′) 正交性的推导。
  即：本卡引用它时借到的证据是「这套约定自洽、且塔卡的 (4) 由之推出」，不是「已被证明」。
  连带更新上面【升级路径】(i) 里的「缺两件」：第一件（塔上的双线性型）已由 formalizer 在
  1a7445e 落地（`Fock.towerPairing` 与三条伴随，其中**跨层的** `towerPairing_towerShift_left`
  正是本卡 (2)(b) 的 S_n^† = S_{−n}）；现只缺第二件，即本命题本身——TowerPairing.lean
  文件头 Gaps 第 2 条逐字把它记为未做（"The vertex operator is not yet self-adjoint …
  graph node `worldsheet.vertex-operator-adjoint`"），因而 A^i_n 的伴随在 Lean 侧仍不可用。
  【⚠ 已消解 2026-09-12】上面这一整段的末句已过时：第二件（本命题本身）已由
  formal/StringFormal/NoGhost/VertexAdjoint.lean 做完（fb006f5），A^ε_n 的伴随随之可用
  （worldsheet.ddf-operators-adjoint-v2）。TowerPairing.lean 文件头 Gaps 第 2 条也随之过期。

  【2026-09-12：Lean 接线（curator，分支 agent/curator/adjoint-wire；
  **statement 文本一字未动**，只加 formal 字段、一条 stringformal-2026 来源与本 notes）】
  新增推导 worldsheet.vertex-operator-adjoint--via-lean（status **formalized**，
  lean_decl `StringFormal.NoGhost.Fock.towerPairing_towerVertex_left`）。
  原推导 --via-radial-conjugation 保留为 physical-argument 的历史记录，两条并存、工具取高者。
  Lean 侧给出**两个数学结论**，都与本卡此前的记账有出入，逐条记下：

  **(i) 本卡写的 (V^{(n)}_J)† = V^{(−n)}_{−J} 是对的，而且是被机器验证为「必须如此」的。**
  在 Fock 层，伴随把顶点动量 b 送成 −b：
  `Fock.pairing_vertexOsc_left` : ⟨V(b)_K v, w⟩ = ⟨v, V(−b)_{−K} w⟩。
  同动量的写法 ⟨V(b)_K v, w⟩ = ⟨v, V(b)_{−K} w⟩ 被
  `Fock.add_self_eq_zero_of_pairing_vertexOsc_same_momentum` **证伪**：它若对某一个 b 成立则 2b = 0
  （见证是最低阶矩阵元 v = |0⟩、w = α^μ_{−1}|0⟩、K = 1，左端 b^μ、右端 −b^μ）。
  理由是 E₋(z) = exp(+Σ_{m>0}(b·α_{−m}/m)z^m) 与 E₊(z) = exp(−Σ_{l>0}(b·α_l/l)z^{−l})
  的指数**带相反的整体符号**，故 α^μ_m ↦ α^μ_{−m} 把 E₋(b) 送到 E₊(−b) 而不是 E₊(b)。
  在**塔上**这个翻号看不见，因为 −(n b) = (−n) b：Fock 层的 b ↦ −b 恰好就是
  零模移位 e^{i n k_0·x} 的 n ↦ −n，本卡 (1) 的形状原样保留。

  **(ii) 伴随完全不需要 k_0² = 0，也没有「同点 E₊E₋ 重排序」这一步。**
  `pairing_vertexOsc_left` 与 `towerPairing_towerVertex_left` 的**唯一**假设是
  `hη : ∀ μ, η μ * η μ = 1`（度规分量平方为 1，本开发处处如此）：
  没有 `dotVec η b b = 0`（类光），没有 `dotVec η b a = 1`（归一化 (★)）。
  原因见上面【为什么不是 rigorous】(ii) 的订正：E₋E₊ 的伴随 E₊(−b)†E₋(−b)† 本身正规序。
  **k_0² = 0 与 (★) 在本卡里剩下的唯一角色**因此要改写为：
    它们只保证**洛朗指标的记账**——单值性指数 2α' n k_0·(p + N k_0) = n 与层指标 N 无关，
    故 V^{(n)}_K 的指标位移 K ↦ K − n 是一个与层无关的整数位移，
    「J 跑遍 Z」「反射 J ↦ −J」这两句话才有指称。
    而这一点在 Lean 里已经**烘进 `towerVertex` 的定义**（位移写死为 −n），
    不是 `towerPairing_towerVertex_left` 的假设。
  ⇒ 本卡 statement 里「设 k_0² = 0」是一条**未被使用的前提**，本卡是 Lean 结论的特例，
  故 formalized 成立。**但本卡边界 (e)（「k_0² ≠ 0 时……伴随关系不再是纯粹的指标反射」）
  现在与已验证的结论表面冲突**：那一步重排序并不发生。
  按项目原则 1 不得就地改陈述文本，已在推导 --via-lean 的 gaps 第 1 条完整登记，
  并在本轮报告中提请 lead/auditor 裁决是否新建 -v2（把 (1) 放宽到任意 b、把 (e) 改写为
  「k_0² ≠ 0 时失效的是洛朗指标的整数性，不是伴随关系」）。
