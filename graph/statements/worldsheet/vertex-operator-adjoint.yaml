sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/VertexAdjoint.lean :: StringFormal.NoGhost.Fock.towerPairing_towerVertex_left（本卡 formal.lean_decl，即 (1)）；Fock 层 StringFormal.NoGhost.Fock.pairing_vertexOsc_left（⟨V(b)_K v, w⟩ = ⟨v, V(−b)_{−K} w⟩，**对任意 b**）；两半 Fock.pairing_creaExp_left / Fock.pairing_vertexAnn_left；b·b = 0 的平凡特例 Fock.pairing_vertexOsc_left_of_dotVec_zero；审计引理 Fock.add_self_eq_zero_of_pairing_vertexOsc_same_momentum；(2)(b) 的 S_n† = S_{−n} 在 formal/StringFormal/NoGhost/TowerPairing.lean :: StringFormal.NoGhost.Fock.towerPairing_towerShift_left"
    note: |
      【2026-09-12 新增】本仓库，Lean 4 + Mathlib v4.33.1，无 sorry；lead 以 **fb006f5** 合入 main
      （formal 侧提交 8b4e706）。该文件 16 条声明，formalizer 自述公理只有
