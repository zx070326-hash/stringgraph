id: worldsheet.vertex-operator-adjoint
kind: proposition
title: 类光指数顶点算子的模在动量塔的双线性型下互为伴随：(V^{(n)}_J)† = V^{(−n)}_{−J}（k_0² = 0）
statement: |
  记号与设定沿用 worldsheet.momentum-tower-fock-space 与 worldsheet.ddf-operators-v5：
  D ∈ N，交换环 R，对角度规 η（conv.metric-mostly-plus），α'（conv.alpha-prime-regge）；
  k_0 是一个**类光**参考向量（k_0² = 0），p 是基点动量且标度按 2α' k_0·p = 1 取定
  （worldsheet.ddf-operators-v5 的 (★)，故 k_0·p ≠ 0，位于非退化扇区）；
  T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0) 是该数据上的动量塔，
  ⟨·,·⟩_T 是它的层间正交双线性型（worldsheet.momentum-tower-fock-space (2)）。

  【被断言的对象】对每个 n ∈ Z，把正规序指数顶点算子
    :e^{i n k_0·X(z)}:  =  Σ_{J ∈ Z} V^{(n)}_J  z^J
  的第 J 个 Laurent 系数记作 V^{(n)}_J（**z^J 的系数**，与 Lean 侧 `Fock.vertexOsc` /
  `towerVertex` 的指标约定相同）。V^{(n)}_J 是 T(p;k_0) 上的 R-线性算子，等于
    V^{(n)}_J = S_n ∘ (逐层的振子部分)，
  即零模移位 S_n = e^{i n k_0·x}（worldsheet.momentum-tower-fock-space (1)）与产生-湮灭正规序
  指数的振子部分的复合；它把第 N 层送到第 N + n 层。由 (★) 与 k_0² = 0，单值性指数
  2α' n k_0·(p + N k_0) = n 在整条塔上是同一个整数，故 J 跑遍 Z（无分数幂）。
  n = 0 时 V^{(0)}_J = δ_{J,0} · id。

  (1) **伴随关系**。设 k_0² = 0。则对一切 n, J ∈ Z 与一切 v, w ∈ T(p;k_0)：

        ⟨ V^{(n)}_J v , w ⟩_T  =  ⟨ v , V^{(−n)}_{−J} w ⟩_T,

      即在塔的双线性型意义下 **(V^{(n)}_J)† = V^{(−n)}_{−J}**。
      （左端 V^{(n)}_J 把第 N 层送到第 N+n 层，右端 V^{(−n)}_{−J} 把第 N+n 层送回第 N 层，
      故等式的两侧配对落在同一层上，这是层间正交下唯一可能非零的配置。）

  (2) **两条直接特例，用于对照**。
      (a) n = 0：两侧都退化为 ⟨v, w⟩_T 的 δ_{J,0} 倍，(1) 平凡成立。
      (b) 只取零模部分（把振子部分换成恒等）：(1) 退化为
          S_n^† = S_{−n}，即 worldsheet.momentum-tower-fock-space (4)，
          那一条是塔的定义的直接展开，**不需要**本命题。
          本命题的全部新内容在于振子部分（正规序指数的两半）在伴随下的行为。

  【本命题**不**断言什么】——六条边界：
  (a) 「†」是 **R-双线性型 ⟨·,·⟩_T 意义下的转置**，不是 Hilbert 空间的 Hermitian 共轭。
      与 worldsheet.momentum-tower-fock-space 的边界 (d)、
      worldsheet.fock-indefinite-form 的 notes【2026-09-11（二）】、
      worldsheet.virasoro-generators-adjoint 的边界 (a) 是同一条限定：
      物理上的协变 Fock 空间是复空间、带 Hermitian 半双线性形式，其上的 † 还含一次复共轭；
      两者在实极化下一致，**复情形本图与 Lean 侧均未做**。
  (b) **不**断言 :e^{i n k_0·X}: 的共形权为 0，也不断言它是主场。
      本命题的论证**用到**这一点（见推导），但那是一条独立的、本图中**没有节点**的事实；
      最接近的是 worldsheet.ddf-commute-with-virasoro，那条断言的是 [L_m, A^i_n] = 0，
      其推导内部才出现「k_0² = 0 ⟹ 指数算符权为 0」。
  (c) **不**断言 V^{(n)}_J 之间的任何乘积/对易关系，也**不**断言算子乘积
      V^{(n)}(z) V^{(m)}(w) 的 OPE。那是 [A^i_m, A^j_n] 一路的内容
      （worldsheet.ddf-transverse-oscillator-algebra），本命题不涉及。
  (d) **不**断言 V^{(n)}_J 的模态和组装出的 A^i_n 良定义（那是
      worldsheet.ddf-transversality-gives-local-finiteness），也**不**断言 DDF 算子的伴随
      （那是 worldsheet.ddf-operators-adjoint，本命题是它的输入）。
  (e) **不**覆盖 k_0² ≠ 0。类光条件是本命题的前提，不是结论：k_0² ≠ 0 时正规序指数的
      两半重排序会留下一个 z 的非零次幂（∝ z^{2α' n² k_0²}），伴随关系不再是纯粹的指标反射
      （见推导 summary 第 3 步）。
  (f) **不**覆盖退化扇区 k_0·p = 0（含 p = 0）：那里 (★) 无法满足，单值性指数不是整数，
      本命题的 J ∈ Z 这个量词失去意义。
