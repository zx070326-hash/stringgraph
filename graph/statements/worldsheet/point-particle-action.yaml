id: worldsheet.point-particle-action
kind: definition
status: rigorous
title: 相对论性点粒子的世界线作用量（Nambu 型）
statement: |
  设 D 维 Minkowski 时空 R^{1,D-1} 带度规 η_{μν}，世界线由映射 X^μ(τ) 给出，
  τ 是任意的世界线参数，Ẋ^μ = dX^μ/dτ。质量 m > 0 的相对论性点粒子的作用量取为
  质量乘以世界线的固有时长度：
    S_pp[X] = -m ∫ dτ (-Ẋ^μ Ẋ_μ)^{1/2}.
  作用量仅在类时世界线（Ẋ^μ Ẋ_μ < 0）上有定义，且在世界线重参数化
  τ → τ'(τ)（dτ'/dτ > 0）下不变。
uses: []
uses_conventions: [conv.metric-mostly-plus]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.2, eq. **(1.2.2)**, p.10：`S_pp = −m ∫ dτ (−Ẋ^μ Ẋ_μ)^{1/2}`"
    note: |
      **【订正 2026-09-11（curator-v1-sec13，据 researcher 第七轮 L1 页图逐字，pp.9–15 读毕）】**
      本节点旧 loc 写「约 eq. (1.2.1)」，**式号错**：
      - **(1.2.1) 是世界线重参数化 `X′^μ(τ′(τ)) = X^μ(τ)`（p.9）**，不是作用量；
      - 点粒子作用量是 **(1.2.2)，p.10**；
      - 其变分 `δS_pp = −m ∫ dτ u̇_μ δX^μ` 是 (1.2.3)（p.10），归一化 D-速度
        `u^μ = Ẋ^μ(−Ẋ^νẊ_ν)^{−1/2}` 是 (1.2.4)（p.10）。
      ⚠ **(1.2.3) 正是 conv.alpha-prime-regge 一度误挂的那个式号**——它与 α′ 毫无关系。
      「§1.2 起于 p.9」不变。作用量形式此前由 Headrick 习题解答 1.1 第 (1) 式间接确认，
      现由原书页图直接确认，证据等级升到 **L1**。
      见 literature/extractions/polchinski-1998-v1.md §13.3(b) 的 §1.2 式号全表。
tags: [bosonic-string, action, point-particle, classical]
notes: |
  m = 0 的情形本作用量退化（恒为 0），这正是引入 einbein 形式
  （worldsheet.point-particle-einbein-action）的动机。
  **2026-09-11 更新**：公式号已核对原书，是 **(1.2.2), p.10**（不是 (1.2.1)）；
  「未核对原书」的旧记录作废，见上方 sources note。
author: curator-polchinski-ch1
created: "2026-09-10"
