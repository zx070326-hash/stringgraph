      原书 §10.4 的页图，全部式号与公式内容均直接看到）。
      statement 里的四处英文引号（'For the bc system we would be finished…'、
      'the equivalence (10.4.13) will hold — all OPEs will be correct — if…'、
      'One can check that the total partition functions agree…'、
      'The need for extra degrees of freedom is not surprising…'）均为该记录
      「文献自称的严格程度」栏与备注栏的逐字转录。
  - ref: polchinski-1998-v2
    loc: "§10.4, eq. **(10.4.6)**、**(10.4.7)**, pp. 16–17（δ(γ) 的定义性 OPE 性质）"
    note: |
      L1 一手（E29）。断言 (6) 里的 δ(γ) 就是这里定义的算子；
      本图对应节点 worldsheet.superconformal-ghost-unit-operator-vacuum。
  - ref: polchinski-1998-v2
    loc: "§10.3, eq. **(10.3.30)**–**(10.3.34)**, p. 15（bc 系统的玻色化，作为本节的对照）"
    note: |
      L1 一手（E27）。原书断言 (1) 的那句 'For the bc system we would be finished: this
      approach leads to the same bosonization as before' 指的就是这一段；
