tags: [superstring, ghosts, beta-gamma, bosonization, cft, central-charge, worldsheet]
notes: |
  ★【本卡填的是 ch10 curator 明写的待建项】worldsheet.rns-fermion-number-operator 的 notes
  逐字写着：「鬼场部门的 F 定义为 (10.4.9) 电流的荷、并用「对 e^{lφ} 取值 l」来刻画——
  这经过 βγ 的玻色化（(10.4.9)/(10.4.13)/(10.4.19)），**本图没有玻色化节点**。
  → 待建（本轮未做）：worldsheet.beta-gamma-bosonization…」本卡即是。
  本轮已给那张卡补上指向本卡的 uses 边。

  ★【"sign is changed" 这句到底改了什么：本图的读法（非原书文字）】
  抽取记录同时记下两件事：(a) §1.1 的约定表说 H、**φ**、χ、ρ **全部**按 ∼ −ln z 归一；
  (b) §10.4 逐字说 "the sign of the current–current OPE and therefore of the φφ OPE is changed"。
  本图的读法：**归一化系数没变**（φφ ∼ −ln z），变的是**电流的写法**——
  bc 侧的费米子数流是 i∂H（(10.3.13)，虚系数，(i∂H)(i∂H) ∼ +1/z²），
  βγ 侧是 ∂φ（(10.4.9)，实系数，∂φ∂φ ∼ −1/z²），于是玻色化的指数**由虚变实**
  （e^{iqH} vs e^{lφ}）。这个读法有一条强证据（下面的算术全部自洽）：

  【算术核对（本图内部重建，原书在抽取到的范围内不写这些式子）】
  设 T_B^φ = −(1/2)(∂φ)² + κ ∂²φ，⟨φφ⟩ = −ln z。则
    h(e^{lφ}) = −l²/2 + κ l,      c_φ = 1 + 12 κ²。
    取 κ = −(λ' − 1/2)：
      λ' = 3/2 ⇒ κ = −1，c_φ = 1 + 12 = **13** = 3(2λ'−1)² + 1 ✓（与原书的中心荷贡献相符）；
      h(e^{−φ}) = −1/2 + 1 = **1/2** ✓（= (10.4.21)）；
      h(e^{−φ/2}) = −1/8 + 1/2 = **3/8** ✓（= (10.4.24)，见
        worldsheet.ramond-ground-state-vertex-operator）。
    ηξ（λ = 1 的 bc 型）：c = −3(2·1−1)² + 1 = **−2** ✓（原书给的 −2）；h_η = 1, h_ξ = 0。
    合计 13 − 2 = **11** = c^{βγ}（λ' = 3/2）✓。
    权的核对：h(β) = h(e^{−φ}) + h(∂ξ) = 1/2 + 1 = **3/2** = λ' ✓；
              h(γ) = h(e^{φ}) + h(η) = (−1/2 − 1) + 1 = **−1/2** = 1 − λ' ✓。
  ⚠ **以上全部是本图做的算术，κ = −(λ'−1/2) 与 h(e^{lφ}) 的公式在抽取记录里没有出现**
  （抽取记录只给了中心荷贡献 3(2λ'−1)²+1 与 −2、以及 h(e^{−φ}) = 1/2、h(e^{−φ/2}) = 3/8）。
  它们自洽是本卡对抽取转录之正确性的一个有力旁证，但**不得当作原书内容引用**。
  → 建议 researcher 核实原书 §10.4 里 T_B^φ 的显式表达式（式号大约在 (10.4.15)–(10.4.16)，
    抽取记录未覆盖），核实后应把它建成独立节点。

  【本卡为什么与 worldsheet.bc-ghost-bosonization 不重复】那张卡讲"一般 λ 的 bc 由单个
  玻色子玻色化"；本卡讲"βγ **做不到**，必须加 ηξ（再加 χ）"。原书自己把两者对置
  （'For the bc system we would be finished … For the βγ system, however …'）。
  两卡的结论是**相反方向**的，合并会丢掉这个对置。

  【断言 (7) 的地位】"对易场的模式可以激发任意多次 ⇒ 态密度更大 ⇒ 需要额外自由度"
  是一个**计数上的启发**，不是证明。它同时是超弦无鬼定理"照搬玻色弦论证"的障碍之一
  （见 worldsheet.superconformal-ghost-modes 的 notes 与
   worldsheet.no-ghost-theorem-superstring 的 gaps）。
