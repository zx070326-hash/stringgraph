id: worldsheet.beta-gamma-bosonization
kind: proposition
title: "βγ 系统的玻色化需要额外自由度：βγ ≅ ∂φ，但朴素的 β ≅ e^{−φ}、γ ≅ e^{φ} 给出错误 OPE；正确的字典是 β ≅ e^{−φ}∂ξ、γ ≅ e^{φ}η（ηξ 是 λ = 1 的 bc 型系统），进一步 η ≅ e^{−χ}、ξ ≅ e^{χ}；弦论情形 (λ' = 3/2) δ(γ) ≅ e^{−φ}，权 1/2"
statement: |
  【设定】worldsheet.superconformal-ghost-modes 定义的**对易**一阶系统 (β, γ)，
  权 (λ', 1 − λ')；弦论的超共形鬼场是 λ' = 3/2（即 h_β = 3/2, h_γ = −1/2）。
  玻色侧的场 φ、χ 按 conv.nonembedding-scalar-normalization 归一
  （φ(z)φ(0) ∼ −ln z）。`≅` 的语义按 conv.ope-tilde-notation（equivalent to）。

  【断言 (1)：电流的等同】
        βγ(z) βγ(0)  ∼  − 1/z²                                       （(10.4.8)）
  这与 ∂φ 的二点函数相同，故
        βγ(z)  ≅  ∂φ(z)                                              （(10.4.9)）
  ⚠ 原书在此处**明确指出与 bc 情形的差别**（逐字）：
  "For the bc system we would be finished: this approach leads to the same bosonization as
   before. For the βγ system, however, **the sign of the current–current OPE and therefore of
   the φφ OPE is changed**."
  （本图对这句的读法见 notes：归一化系数不变，改变的是指数取实还是取虚。
   **这个读法是本图的，不是原书逐字内容。**）

  【断言 (2)：朴素字典是错的】
        β ≅ e^{−φ},   γ ≅ e^{φ}        （(10.4.10)，**原书在式子上标了 `?`**）
  给出**错误**的 OPE（(10.4.11)），与正确的 (10.4.12) 不符。
  即：βγ 系统**不能**像 bc 那样由单个玻色子玻色化。

  【断言 (3)：正确字典需要额外自由度】
        β(z) ≅ e^{−φ(z)} ∂ξ(z),      γ(z) ≅ e^{φ(z)} η(z)            （(10.4.13)）
  其中新引入的一对场满足
        η(z) ξ(0) ∼ 1/z,      η(z)η(0) = O(z),      ∂ξ(z)∂ξ(0) = O(z)  （(10.4.14)）
  原书对这条的措辞逐字："the equivalence (10.4.13) **will hold — all OPEs will be correct — if**
  η and ξ satisfy …"（即：这是一个**充分条件**式的构造，不是从 βγ 推出来的）。
  ηξ 是一个 **λ = 1 的 bc 型（反对易）系统**，其能动张量
        T_B^{ηξ}  =  − η ∂ξ                                          （(10.4.17)）
  且
        T_B^{βγ}  ≅  T_B^{φ}  +  T_B^{ηξ}                            （(10.4.18)）

  【断言 (4)：中心荷核对】T_B^{φ} 贡献 3(2λ' − 1)² + 1，T_B^{ηξ} 贡献 −2，
  两者之和为 βγ 系统的 3(2λ' − 1)² − 1
  （即 λ' = 3/2 时 13 + (−2) = 11 = c^{βγ}，见 worldsheet.beta-gamma-central-charge）。

  【断言 (5)：把 ηξ 再玻色化】用第二个自由玻色子 χ 表示 ηξ：
        η ≅ e^{−χ},      ξ ≅ e^{χ}                                   （(10.4.19a)）
  于是
        β ≅ e^{−φ+χ} ∂χ,        γ ≅ e^{φ−χ}                          （(10.4.19b)）

  【断言 (6)：弦论情形的具体算子（λ' = 3/2）】
        δ(γ)  ≅  e^{−φ},      其权  h = 1/2                          （(10.4.21)）
  （δ(γ) 是 worldsheet.superconformal-ghost-unit-operator-vacuum 里那个与 NS 鬼场基态
   |0⟩_NS 对应的算子。）快子与无质量 NS 顶点算子的**鬼场/费米部分**分别是
        e^{−φ}        与        e^{−φ} e^{± i H^a}                    （(10.4.22)）
  （H^a 是 worldsheet.spin-field-vertex-operators 的五个玻色子之一。）

  【断言 (7)：为什么需要额外自由度（原书给的理由，是启发式的）】逐字：
  "The need for extra degrees of freedom is not surprising. The βγ theory has a **greater density
   of states** than the bc theory because the modes of a commuting field **can be excited any
   number of times**."

  【本命题不断言的内容】
    (1) **不**断言配分函数相等的验证。原书逐字 "**One can check** that the total partition
        functions agree, in the appropriate sectors."——不做。
    (2) **不**断言 (10.4.13) 的**必要性**（原书只给"如果 η, ξ 满足…则一切 OPE 正确"这个方向）。
    (3) **不**断言 T_B^{φ} 的显式表达式（原书在抽取到的范围内只给它的中心荷贡献；
        本图的重建见 notes，标为未在原书核实）。
    (4) **不**断言 R 扇区的鬼场顶点算子 Σ = e^{−φ/2}——见
        worldsheet.ramond-ground-state-vertex-operator。
    (5) **不**断言"picture number"的任何内容（原书全章不用这个词）。
    (6) **不**断言 φ、χ、ηξ 三者的态空间与 βγ 的态空间之间的同构（"等价"的含义仍未定，
        继承 worldsheet.fermion-bosonization-two-dimensions 的核心 gap）。
