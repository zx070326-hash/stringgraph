sources:
  - ref: polchinski-1998-v2
    loc: "§10.4, eq. **(10.4.8)**（βγ·βγ ∼ −1/z²）、**(10.4.9)**（βγ ≅ ∂φ）、**(10.4.10)**（朴素字典，式上带 `?`）、**(10.4.11)**（错误的 OPE）、**(10.4.12)**（正确的 OPE）、**(10.4.13)**（β ≅ e^{−φ}∂ξ, γ ≅ e^{φ}η）、**(10.4.14)**（η, ξ 的 OPE）、**(10.4.17)**（T_B^{ηξ} = −η∂ξ）、**(10.4.18)**（T_B^{βγ} ≅ T_B^φ + T_B^{ηξ}）、**(10.4.19a,b)**（η ≅ e^{−χ}, ξ ≅ e^{χ}；β, γ 的最终形式）、**(10.4.21)**（λ' = 3/2, δ(γ) ≅ e^{−φ}, h = 1/2）、**(10.4.22)**（快子与无质量 NS 顶点算子的费米部分）, pp. 17–18；中心荷核对（T_B^φ 给 3(2λ'−1)²+1、T_B^{ηξ} 给 −2、合为 3(2λ'−1)²−1）在同处"
    note: |
