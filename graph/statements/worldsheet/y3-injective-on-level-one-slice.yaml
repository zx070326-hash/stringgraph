notes: |
  【与 claim.md 的对应，逐字核对 —— curator 亲自 Read claim.md 全文、SixSliceInjective.lean
  全文 356 行、DDF.lean 第 108 行 towerMomentum 定义，非转述 status.yaml 的自我报告】

  与姐妹卡 worldsheet.x4-injective-on-level-one-slice 完全相同的核对结论适用于本卡（同一
  towerBigrade D R j 1 上的定理，同一 towerMomentum a b j := a + j·b 机制、j=0/b=0/a=p 特例
  复现「∀ p 任意」）；此处不重复展开，仅记录 y3 特有的差异点：

  【D 无关性】同姐妹卡：本卡对每个 D（无下界约束）、每个 CharZero 的 Algebra ℚ 交换环 R 成立；
  D=26 不出现在本卡陈述或其 Lean 证明里。

  【归一化差异，诚实记录，取自 SixSliceInjective.lean 文件头 docstring（curator 亲自 Read）】
  Lean 证明算出的常数是 120（≠0，蕴含单射），proof.md 手算给出 30；两者相差恰是**目标振子
  模数** 4（120 = 4×30），而非姐妹卡 x4 的因子 5（-2040 = 5×(-408)）——这是 towerModeVec 力矩
  提取约定（CCR 归一化 α^μ_{-p}|0;p⟩ 上多一个模数因子 p）与 proof.md「读裸系数」约定之间的
  系统性差异，随目标 level（y3 是 4、x4 是 5）而不同，不是数值不一致。非零性等价，结论
  （单射）不受影响。

  【范围边界，明确不断言】本卡**不**断言、**不**依赖：
  (a) 形式 A ⟹ 形式 B 的四步桥接（未在 Lean 里实现，按任务书明确排除，非缺口，
      见 status.yaml「仍未做」条目）；
  (b) SixSeedKernelSharp（形式 B）在一般 D 上成立；
  (c) N=6 的 (B-26) 无条件闭合（仍需 D=26 且仍需上面 (a) 的桥接）。

