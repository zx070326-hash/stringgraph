id: worldsheet.no-ghost-theorem-superstring
kind: proposition
title: 超弦无鬼定理（Polchinski §10.5 末的陈述）：BRST 上同调内积正定、同构于 OCQ、同构于横向 Hilbert 空间 H^⊥；且在 exp(πiF) 的每个本征子空间上分别成立
statement: |
  设 D = 10（或更一般地物质中心荷 c^m = c̃^m = 15），Q_B 如
  worldsheet.superstring-brst-charge 所定义，并加上
  worldsheet.superstring-brst-additional-conditions 的附加条件
  （b_0 = L_0 = 0，R 扇区另加 β_0 = G_0 = 0）。定义**横向 Hilbert 空间**
    **H^⊥ := 不含 X^{0,1}、ψ^{0,1}、b、c、β、γ 激发的态空间**
  （这个定义是原书逐字给出的）。则：

  **(1)** BRST 上同调上的内积**正定**；
  **(2)** BRST 上同调与 OCQ 物理态空间（worldsheet.ocq-superstring-physical-states）**同构**；
  **(3)** BRST 上同调与 H^⊥ **同构**；
  **(4)** 由于 exp(πiF) 与 Q_B 交换（worldsheet.rns-fermion-number-operator），
      可以取 exp(πiF) 的确定本征值的子空间，**无鬼定理在每个本征子空间上分别成立**。

  ⚠⚠ **本卡的 status 由推导承载，而那条推导只有一句话的来源。**
  原书对 (1)(2)(3) 的全部论证是一句：
  '**The proof is a direct imitation of the bosonic argument of chapter 4.**'
  **书中不给证明，也不引用任何原始文献（此处无脚注、无引文）。**
  故本图对本命题的推导状态是 `physical-argument`，**不是** `rigorous`，
  尽管玻色弦一侧的对应命题（worldsheet.no-ghost-theorem-brst / -v4）在文献中有严格处理。

  **本命题不断言的内容**：
    (1) 不断言 (2)(3) 中同构的具体构造（原书不给映射）。
    (2) 不断言零动量或退化动量扇区的情形（玻色弦一侧的对应命题限 k^+ ≠ 0；
        原书在超弦一侧对动量条件**只字不提**，本卡照此不作断言，也不宣称覆盖全部动量）。
    (3) 不断言 picture 的选择无关性——原书全章不出现 'picture' 一词
        （见 notes 与 gaps）。
    (4) 第 (4) 条只断言「分别成立」，不断言 GSO 投影后的谱是什么。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.virasoro-standard
  - conv.intercept-sign-a
sources:
  - ref: polchinski-1998-v2
    loc: "§10.5 末, p. 25, **无式号**（逐字：'The reader can again work out the first few levels by hand, the result being exactly the same as for OCQ. The no-ghost theorem is as in the bosonic case. The BRST cohomology has a positive definite inner product and is isomorphic to OCQ and to the transverse Hilbert space H^⊥, which is defined to have no X^{0,1}, ψ^{0,1}, b, c, β, or γ excitations. The proof is a direct imitation of the bosonic argument of chapter 4. We have defined exp(πiF) to commute with Q_B. We can therefore consider subspaces with definite eigenvalues of exp(πiF) and the no-ghost theorem holds separately in each.'）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E39；整段逐字读到原书页图）。
      ⚠ **无式号是原书事实**；抽取记录明确要求不要编式号。
      ⚠ 「The proof is a direct imitation of the bosonic argument of chapter 4.」**就是全部论证**。
  - ref: polchinski-1998-v1
    loc: "§4.4, p.137–142（玻色弦无鬼定理的 BRST 证明：light-cone number 分次、Q_B = Q_1 + Q_0 + Q_{−1}、S = {Q_1, R} 是数算符、严格下三角）"
    note: |
      Vol.2 明写以此为模板（'a direct imitation of the bosonic argument of chapter 4'），
      故这条来源是文献指定的。本图对应节点是 worldsheet.no-ghost-theorem-brst
      与其推导 --via-polchinski-4-4（自身也是 physical-argument）。
  - ref: polchinski-1998-v2
    loc: "§10 Exercises, exercise 10.14, p. 43（'Work out the massless level of the open superstring in BRST quantization.'）"
    note: |
      L1。原书正文说 'The reader can again work out the first few levels by hand'，
      对应的习题就是这一道；[H] Problem 10.14 给了解答（低能级验证，非定理证明）。
tags: [superstring, no-ghost-theorem, brst, unitarity, rns]
notes: |
  ★★★【本卡是本轮抽取对本项目最直接有用的结果，也是最需要小心的一张】
  抽取记录 E39 与 Q4 的要点，逐条落在本卡与其推导上：

  【为什么陈述是三重的，却不拆】(1)(2)(3) 在原书里是**同一句话**的三个并列子句，
  且共用同一句「direct imitation」作为论证。按 graph/CLAUDE.md「文献把两件事写在一个定理里
  而它们被分别推导时才拆」的判据，这里**没有**分别推导，故不拆。
  ⚠ 但若日后取得 Ohta 1986 / Henneaux 1987 等独立来源，很可能会发现它们分别处理
  (1) 与 (3)（玻色弦一侧的 worldsheet.no-ghost-theorem-v4 就正在被建议按来源集合拆分），
  届时应新建 v2 并拆。

  【H^⊥ 的定义是逐字的】'defined to have no X^{0,1}, ψ^{0,1}, b, c, β, or γ excitations'
  ——可直接写进节点，本卡照此。

  【第 (4) 条别漏】「无鬼定理在 exp(πiF) 的每个本征子空间上分别成立」是 GSO 投影后
  谱仍无鬼的依据。若没有它，worldsheet.gso-projection 之后的一切谱都没有幺正性支撑。

  【picture 问题】原书全章不出现 'picture' 一词，但他用的顶点算子是 −1 与 −1/2 picture
  （(10.4.22)/(10.4.25)）。抽取记录 Q4 末尾记下一条 **L4 级、不得入库**的现代信息：
  picture number 会影响 BRST 上同调，零动量 R–R 态在不同 picture 下不等价。
  若属实，本卡的陈述隐含了 picture 的选择。**本图不采信该信息**，只作为待查线索。

  【升级路径】把本命题抬到 rigorous 的目标文献（reading-list.md 已登记为 P1）：
    ohta-1986（Phys. Rev. D 33 (1986) 1681；Phys. Lett. B 179 (1986) 347）、
    henneaux-1987（Phys. Lett. B 183 (1987) 59）；
  另有候选 Phys. Lett. B 218 (1989) 309、arXiv:1212.3592、arXiv:1009.0107。
  ⚠ 这些**均只到标题/摘要级，尚未抽取，不得直接作为来源写进本图**。

  ★★★【2026-09-11 更新：升级路径已走通一半，本卡陈述与状态**不变**】
  researcher 第七轮取得四篇一手文献的全文/摘要（见 literature/extractions/ 下
  lian-zuckerman-1989.md、figueroa-ofarrill-kimura-1989.md、ito-morozumi-nojiri-uehara-1986.md、
  ohta-1986.md、henneaux-1987.md、kato-ogawa-1983.md）。结论是：
  **本卡把 (1)(2)(3)(4) 绑成一条命题，而这些来源分别推导其中不同的部分**，
  故 curator 没有给本卡加新推导，而是按 graph/CLAUDE.md 的拆卡判据新建了两张卡：

  | 本卡断言 | 新卡 | 最强推导 |
  |---|---|---|
  | (1) 内积正定 | worldsheet.no-ghost-theorem-superstring-cohomological | --via-lian-zuckerman-1989（**rigorous**，Corollary 2.15(ii)，作者自命名 "No-ghost Theorem"）；另有 --via-figueroa-ofarrill-kimura-1989（physical-argument）与 --via-ohta-imnu（physical-argument） |
  | (2) ≅ OCQ、(3) ≅ H^⊥ | worldsheet.brst-cohomology-equals-ocq-physical-superstring | --via-lian-zuckerman-1989（**rigorous**，Theorem 2.20 的两个酉同构，λ 显式给出） |
  | (4) exp(πiF) 每个本征子空间上分别成立 | **仍只有本卡承载** | 候选严格来源：lian-zuckerman-1989 §4 Proposition 4.3（GSO 的上同调版），本图未建卡 |

  拆卡的硬理由（不是风格选择）：**figueroa-ofarrill-kimura-1989 §6 只证正定性，
  完全不建立任何同构**；而 lian-zuckerman-1989 把正定性（Corollary 2.15(ii)，
  用 Euler–Poincaré，自述不用横向空间）与两个同构（Theorem 2.20）分别证明。
  若把它们挂在本卡上，就会出现"推导只覆盖目标的一部分"的记账缺陷。

  **本卡不加 superseded_by，理由三条**：
  (1) 本卡是 Polchinski §10.5 那一句话的忠实登记，有独立的史料价值；
  (2) 新卡的设定与本卡不同（新卡显式要求 p ≠ 0、固定 R 扇区零模表示、限 GSO 之前），
      不是同一陈述的改写；
  (3) 断言 (4) 只有本卡承载，换代会丢掉它。
  ⇒ 是否把本卡换代为按 lian-zuckerman-1989 措辞的 v2（并把 (4) 单列），**留给 lead 裁决**。

  【本卡的 gaps 前三条（三处 βγ 结构差异）现在有了文献答案】
  那三条记的是"Polchinski 完全不讨论"，**这一点不变**；但本轮查明**文献里有人讨论**：
    (i) βγ 不等价真空 / picture：lian-zuckerman-1989 p.304 + p.306 (7)（选唯一使 deg 有上界的
        表示）；figueroa-ofarrill-kimura-1989 §4（Schrödinger 与 Henneaux 两种表示都做，
        (5.1) 证两者相对上同调作为**无分次**空间同构）；
        picture 无关性本身另见 worldsheet.brst-cohomology-picture-independence（Dedushenko 2015）。
    (ii) R 扇区 β₀ 零模：lian-zuckerman-1989 Definition 2.2 + **Theorem 2.7** +
        Definition 2.11（朴素内积在 R 扇区相对复形上恒零，须用 D_R 的原像定义）；
        figueroa-ofarrill-kimura-1989 §4 的双复形 + {F₀, K} = 1（引 henneaux-1987）；
        物理侧 ito-morozumi-nojiri-uehara-1986 (3.19) 的 δ(ζ₀) 型度规。
    (iii) βγ 占据数无上界：lian-zuckerman-1989 p.306（唯一使 deg 有上界的空间）；
        figueroa-ofarrill-kimura-1989 p.112（固定 Verma 模、固定 L₀ 本征值的相对子复形有限维）。
  ⇒ **本卡的 gaps 不改**（它们记的是原书的缺口），但读者应同时看新卡。

  【原 notes 的【升级路径】一段已过时，此处订正】那里写 ohta-1986 与 henneaux-1987
  "均只到标题/摘要级"——本轮核实后结论更细：
    - **ohta-1986 正文仍未取得（L0）**，且据 ito-morozumi-nojiri-uehara-1986 p.952 Note added
      （L1 逐字）'he did not present the proof of the no-ghost theorem in the Ramond sector'，
      **它只能作 NS 扇区的来源**；
    - **henneaux-1987 正文仍未取得（L0）**，且其**摘要里没有 "no-ghost" 字样**，
      只说 R 扇区上同调 'explicitly computed' 与交换鬼零模的无穷简并是 spurious
      ⇒ 它只支撑一个技术引理，不支撑无鬼定理本身；
    - 真正把结论抬到 rigorous 的是本轮取得全文的两篇数学论文
      **lian-zuckerman-1989**（CMP 125, 301）与 **figueroa-ofarrill-kimura-1989**（CMP 124, 105），
      两篇互不引用、独立完成（LZ p.335 Note added in proof）。
