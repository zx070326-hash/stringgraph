id: worldsheet.sugawara-level-one-simply-laced
kind: proposition
title: 单 laced 李代数的 Sugawara 中心荷：c^{g,k} = k dim(g) rank(g) / (dim(g) + (k−1) rank(g))，特别地 c^{g,1} = rank(g)
statement: |
  设 g 是单 laced（所有根等长）的单李代数。对其 level-k 流代数的 Sugawara 中心荷
  c^{g,k} = k dim(g)/(k + h(g))（worldsheet.sugawara-central-charge 的 (11.5.25)），利用单 laced 代数的恒等式
    h(g) + 1 = dim(g) / rank(g)
  得
    c^{g,k} = k dim(g) rank(g) / ( dim(g) + (k − 1) rank(g) )                  （(11.5.34)）,
  于是 level 1 时
    **c^{g,1} = rank(g)**                                                       （(11.5.35)）.

  例（原书 (11.5.36)，g = SU(2) = SO(3)，dim 3、rank 1）：c^{su(2),k} = 3k/(2 + k) = 1, 3/2, 9/5, 2, 15/7, … → 3。

  **本命题不断言的内容**：
    (1) 不断言 h(g) + 1 = dim(g)/rank(g) 的证明（原书作为事实给出；对单 laced 代数它等价于
        「根的个数 dim(g) − rank(g) = rank(g)·h(g)」，本图未建卡）；
    (2) 不断言 c^{g,1} = rank(g) 与「rank(g) 个自由玻色子」之间的同构（Frenkel–Kac 顶点构造）——原书
        §11.4/§11.5 **没有**这条陈述（抽取记录 E59–E62 无此内容；§11.6 的玻色构造只到规范玻色子的计数）；
    (3) 不断言一般界 rank(g) ≤ c^{g,k} ≤ dim(g)（(11.5.37)）。
uses_conventions:
  - conv.virasoro-standard
sources:
