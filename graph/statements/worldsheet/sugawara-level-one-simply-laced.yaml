    loc: "§11.5, eq. (11.5.34)–(11.5.36), p. 72（单 laced：h(g) + 1 = dim(g)/rank(g)，c^{g,k} 的化简式，c^{g,1} = rank(g)，SU(2) 序列 1, 3/2, 9/5, 2, 15/7, … → 3）"
    note: |
      L1（抽取记录 literature/extractions/polchinski-1998-v2.md E61；式号与公式逐字读自原书页图 p. 72）。
tags: [sugawara, central-charge, simply-laced, level-one, current-algebra, cft]
notes: |
  【为什么单列】c^{g,1} = rank(g) 是杂化弦规范群与「16 个左移玻色子」对接的关键数字：
  SO(32) 与 E₈ × E₈ 都是 rank 16 的单 laced 代数，level 1 的 Sugawara 中心荷恰为 16 = 32 × (1/2)。
  但**原书 §11.5 没有把这句话写出来**（E61 只到 (11.5.37)），本图不加边到杂化弦卡。

  【数值核对】E₈：dim 248、rank 8 ⇒ h = 30，c^{E₈,1} = 248/31 = 8 ✓。SO(32)：dim 496、rank 16 ⇒ h = 30，
  c = 496/31 = 16 ✓。SU(2)：dim 3、rank 1 ⇒ h = 2，c = 3/3 = 1 ✓（与 (11.5.36) 的首项一致）。
  这些核对是本图做的。
