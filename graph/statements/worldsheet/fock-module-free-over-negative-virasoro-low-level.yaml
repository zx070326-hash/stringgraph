id: worldsheet.fock-module-free-over-negative-virasoro-low-level
kind: proposition
title: 单一动量、层 N ≤ 4 处玻色弦 Fock 模在 Virasoro 负部下自由：Kac 行列式非零 ⇒ p(N) 个标准降算符向量在 Fock 空间中线性无关（FockFreeLowLevel.lean）
statement: |
  设 D ∈ N、R 是交换环、ℚ-代数且**无零因子**，η : Fin D → R 是对角度规分量、满足
  η^μ η^μ = 1（∀μ；conv.metric-mostly-plus 的号差版满足之），a : Fin D → R 是零模参数
  （a^μ = (2α')^{1/2} k^μ，conv.alpha-prime-regge，固定动量扇区）。设 F = F(D,R) 是 Fock 空间
  （worldsheet.bosonic-fock-space），L_n（n ∈ Z）是其上的 Sugawara 型 Virasoro 算子
  （worldsheet.fock-space-virasoro-representation，中心荷 c = D），|k⟩ := 1 ∈ F 是真空。
  记 h := ½α₀² ∈ R 为真空的权（等于 conv.alpha-prime-regge 下的 α'k²）。

  **标准降算符向量**（按 level 的分拆排序，共 p(N) 个）：

      N = 1 (p = 1):  L₋₁|k⟩；
      N = 2 (p = 2):  L₋₂|k⟩,  L₋₁²|k⟩；
      N = 3 (p = 3):  L₋₃|k⟩,  L₋₂L₋₁|k⟩,  L₋₁³|k⟩；
      N = 4 (p = 5):  L₋₄|k⟩,  L₋₃L₋₁|k⟩,  L₋₂²|k⟩,  L₋₂L₋₁²|k⟩,  L₋₁⁴|k⟩。

  记 det_N(c,h)（N = 2,3,4）为 worldsheet.kac-determinant-level-{two,three,four} 算出的那族
  Verma 侧 Kac 多项式，det₁(h) := 2h（N = 1 的情形，不依赖 c）。

  **断言（N = 4，本卡标题所指；N = 1,2,3 是同一机制的姊妹陈述，见 notes）**：若
  det₄(D, h) ≠ 0，则上列 N = 4 的五个标准降算符向量在 F 上 **R-线性无关**。

  **姊妹陈述（N = 1, 2, 3，同一机制，Lean 中各自独立成立、互不蕴含）**：
  det₁(h) ≠ 0 ⇒ L₋₁|k⟩ ≠ 0（单向量族线性无关）；
  det₂(D,h) ≠ 0 ⇒ N = 2 的两个向量线性无关；
  det₃(D,h) ≠ 0 ⇒ N = 3 的三个向量线性无关。

  **机制**：|k⟩ 是 Sugawara 作用下权 (D,h) 的最高权向量；由 Verma 模的万有性质
  （worldsheet.verma-module-v2），存在唯一的等变 R-线性映射
  vermaToFock : V(D,h) → F 把 Verma 模的最高权向量送到 |k⟩；把 Fock 双线性型 ⟨·,·⟩
  （worldsheet.fock-indefinite-form）沿 vermaToFock **拉回**，得到 V(D,h) 上一个
  **归一化逆变**双线性型（逆变性用到 L_n 在 ⟨·,·⟩ 下互为伴随，即
  worldsheet.virasoro-generators-adjoint 的 L_n^† = L_{−n}；归一化即拉回型在 Verma
  最高权向量上取值 1）；Gram 矩阵沿 vermaToFock **严格相等**地搬运（不只是行列式相等），
  故这 p(N) 个标准降算符向量在 F 上关于 ⟨·,·⟩ 的 Gram 行列式**就是** det_N(D,h)；
  再用「Gram 行列式非零 ⇒ 线性无关」（math.gram-determinant-nonzero-implies-linear-independence）。

  【本节点明确**不**断言】
  (a) **N ≥ 5**：本卡只到 N = 4；一般 N 需要一般 (c,h) 处的 Kac 行列式公式
      （worldsheet.kac-determinant-v2，rigorous、未形式化，瓶颈是 PBW），见蓝图 §B.2。
      **本卡对无鬼定理的形式化瓶颈无任何影响**：那条链是
      worldsheet.kac-determinant-v2 → math.verma-module-free-over-negative-part → PBW
      （worldsheet.no-ghost-theorem-v4 的上游），本卡覆盖的判据仍只到 N = 4，
      且走的是 Fock 侧的一个独立实例，不缩短、不绕过那条瓶颈。
  (b) 判据的**必要性**：det_N = 0 处，F 中那 p(N) 个向量仍可能线性无关——本卡只证
      vermaToFock **像**的线性无关，不断言 vermaToFock **单射**（vermaToFock 未必单射，
      见 notes）。
  (c) **多个动量的联合结论**或**跨 level 的联合线性无关**：本卡是**单一动量**
      （a 是给定参数，不含零模算符 x^μ，继承自 Sugawara.lean 的范围限制）；
      N = 1..4 的向量合在一起是否线性无关未在本卡陈述（可望由 L_0 本征值分层正交配合
      得到，但 Lean 侧未组装这一步）。
  (d) **D = 26、a₀ = 1 或任何质壳条件**：本卡对 D、h 无限制。D = 26、a₀ = 1（质壳
      h = 1 − N）处的数值核对见本卡 notes：det₁ = det₂ = 0（判据在这两层空转），
      det₃ = 2304，det₄ = 2649563136。
  (e) **V(D,h) ≠ 0 本身**作为独立结论：本卡的构造副产品地蕴含它（拉回型的归一化本身
      需要 Verma 最高权向量非零），但本卡陈述层面只断言 F 中的线性无关；把它当独立结论
      单列见 math.verma-module-free-over-negative-part 的 notes 与本卡 notes 的分工说明。
  (f) 文件所在目录（Virasoro/）与其 import（NoGhost/PhysicalStates.lean）不一致：
      纯粹是任务分派时的路径遗留，不影响内容，见 notes。
