sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/LevelTwo.lean :: StringFormal.NoGhost.Fock.exists_mem_physSubmodule_pairing_self_neg'（**带撇的那条**，第 (3) 条；它比不带撇的版本多输出 zeroModeSq = −2 与 b ≠ 0，正是 formal.lean_decl 指的那条）；不带撇的 Fock.exists_mem_physSubmodule_pairing_self_neg 是它的弱化版（不给动量量词）；另有 Fock.exists_zeroModeSq_eq_neg_two（第 (1) 条）、Fock.levelTwoScalar_intercept_one_mem_physSubmodule 与 Fock.pairing_levelTwoScalar_intercept_one（第 (2) 条）；文件末尾另有 D = 27、K = ℚ 的具体 example（它用的是**不带撇**的那条）"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1；形式化提交 ea303c5，合并进 main 的提交 c32f026。
      全文 grep `sorry` 零命中。**curator 未自行重跑 `lake build`，也未跑
      `uv run stringgraph check-axioms`**；formal/TODO.md 的 `negative-norm-above-26` 条目
      没有逐字登记「公理只有标准三条」，见推导 gaps。
  - ref: brower-thorn-1971
    loc: "Goddard 2008 综述 arXiv:0802.3249 归属于此文；本文摘要未见维数条件，未裁决"
    note: |
      **文献侧的候选归属，不是本命题的来源**：Goddard 2008 把「D > 26 时物理态中出现鬼」
      归给 Brower–Thorn 1971（其 ref [29]），但该文摘要只说 leading nine trajectories，
      没有出现 D > 26 或任何维数条件；正文未获取。二手归属与一手摘要的张力如实登记，
      不裁决。见 literature/extractions/brst-cohomology-sources.md §3.2。
      本命题的证明**不依赖**这条来源，它是本仓库内的独立构造。
  - ref: polchinski-1998-v1
    loc: "§4.1, p.124 正文的结论性断言（「If D > 26, there are negative-norm states」）+ **exercise 4.1**（p.143，原书逐字「The derivation is left to the reader」）；§4.4 是 BRST 版本，属另一条陈述"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐页）】

      ⚠ 旧 loc 写「§4.1 末（p.124–125）：只陈述结论，证明推迟到 §4.4 的 BRST 版本」——
      **前半句对，后半句不准**。原书对 D > 26 的负模态**没有**把证明推给 §4.4，
      而是**留成习题 4.1**：
        p.124「If D > 26, there are negative-norm states; if D < 26 the OCQ spectrum has positive
              norm but more states than in light-cone quantization. **The derivation is left to the reader.**」
        p.143「**4.1** Extend the OCQ, for A = −1 and general D, to the second excited level of the
              open string. **Verify the assertions made in the text about extra positive- and
              negative-norm states.**」
      §4.4 证的是 D = 26 那一侧（BRST 上同调正定），**不覆盖 D > 26 的反例**。

      → 「Polchinski 不给 D > 26 的显式负模态构造」这句**仍然成立且现在是 L1**：
        原书连推导都没做，只写了断言并留成习题。本命题的形式化构造（本仓库 LevelTwo.lean）
        因此比原书**更强**，不是复现原书。
      见 literature/extractions/polchinski-1998-v1.md §12.3（E57/E58）与 §12.10 表 B 第 12 项、表 C 第 5 项。
tags: [bosonic-string, unitarity, critical-dimension, old-covariant, no-ghost, formalized]
notes: |
  【本卡与 worldsheet.no-ghost-theorem-v4 第 (2) 条的关系】v4 的第 (2) 条是
  「D > 26 ⟹ 存在 p ≠ 0 与 |ψ⟩ ∈ H_phys(p) 使 ⟨ψ|ψ⟩ < 0（至少在 a = 1 时）」。
  本卡就是那一条的**机器验证见证**，并已加为
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的依赖（非 inferred）。
  三点必须讲清，以免被误读为「无鬼定理已形式化」：
  - **本卡不是 v4**。v4 还有第 (1) 条（D = 26 的半正定与逐塔等距同构），那一条要 DDF 张成定理，
    Lean 侧完全未做（formal/TODO.md 的 `ddf-operators`、`ddf-spans`）。
  - **一条推导须支撑整条目标陈述**，所以不能给 v4 单挂一条「只证第 (2) 条」的 --via-lean 推导；
    正确做法就是本卡这样：把第 (2) 条立成独立陈述，再作为依赖接进 v4 的现有推导。
    这与 worldsheet.no-ghost-theorem-subcritical（LZ 1991）的处理方式相同。
  - **v4 的 effective 不因本卡上升**：它的瓶颈是两条 DDF 对易关系与 ddf-operators-adjoint
    （均 physical-argument），与第 (2) 条无关。
  - Lean 的 `physSubmodule η a a₀` 是**固定动量的代数 Fock 空间**上的物理态子空间，
    与 v4 记号段里的 H_phys(p)（建在动量本征态 |0;p⟩ 上的 F(p) 的子空间）设定一致；
    差别只在 Lean 侧没有位置算符 x^μ 与对 p 的直积分（无零模完化），见边界 (e)。

  【formalizer 的观察：ℚ 上必须用两个分量】第 (1) 条的动量在 Lean 里由
  `Fock.exists_zeroModeSq_eq_neg_two` 给出，显式取 a^0 = 3/2、a^1 = 1/2。
  **单分量不行**：α'k² = −1 要求 −(a^0)² = −2，即 (a^0)² = 2，在 ℚ 上无解。
  所以这条见证需要 D ≥ 2（一个类时方向加一个类空方向）与除法（域）。
  D > 26 自然蕴含 D ≥ 2，但这一点在把本卡推广到别的基环时要紧：
  在一般有序**环**上第 (1) 条可能失败（例如 ℤ 上 −x² + y² = −2 无解）。

  【查重】`uv run stringgraph search negative-norm / ghost / level-two` 于 2026-09-11 未找到
  承载「D > 26 显式负模物理态」的既有节点：worldsheet.no-ghost-theorem-v2/v3/v4 把它作为
  整条定理的第 (2) 条，worldsheet.ocq-level-two-scalar-norm 只给一般 (D, a) 的模的闭式
  而不作存在性断言，worldsheet.fock-indefinite-form 的负模态在**全 Fock 空间**上（不是物理态）。
  本卡与三者都不重复：它断言的是**物理态子空间**上存在负模态，且带 D > 26、a = 1 的量词。
