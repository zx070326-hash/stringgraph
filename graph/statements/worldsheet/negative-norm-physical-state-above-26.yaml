id: worldsheet.negative-norm-physical-state-above-26
kind: proposition
title: D > 26、截距 a = 1 时旧协变物理态空间在非零动量上含负模态（显式 level-2 见证）
statement: |
  设 K 是有序域（Lean 侧写作 [Field K] [LinearOrder K] [IsStrictOrderedRing K]；ℚ、ℝ 均满足），
  D > 26，η = mostly-plus 的 Minkowski 对角度规 diag(−1, +1, …, +1)（conv.metric-mostly-plus），
  截距 a = 1（conv.intercept-sign-a，物理态条件写作 (L_0 − 1)|ψ⟩ = 0；Polchinski 的 A = −1）。

  记号沿用固定动量扇区的代数 Fock 空间：F = F(D, K) 如 worldsheet.bosonic-fock-space，
  零模参数 a^μ = α^μ_0 = (2α')^{1/2} k^μ（conv.alpha-prime-regge），
  L_n 如 worldsheet.virasoro-generators-free-boson，
  ⟨·,·⟩ 如 worldsheet.fock-indefinite-form，
  H_phys(α_0) 如 worldsheet.old-covariant-physical-states（该动量扇区上的物理态子空间）。
  记 s := α_0·α_0 = Σ_μ η^{μμ} a^μ a^μ = 2α' k²。

  **(1) 质量壳上的动量存在。** 只要 D ≥ 2（D > 26 蕴含之），就存在零模参数 α_0 使
      s = α_0·α_0 = −2，即 α' k² = −1——这正是截距 a = 1 处 level 2 的质量壳（α'k² + 2 = a）。
      （在 K = ℚ 上需要**两个**非零分量：一个类时、一个类空，例如
       a^0 = 3/2、a^1 = 1/2 给 −(3/2)² + (1/2)² = −2；单个分量的 α'k² = −1 在 ℚ 上无解。）

  **(2) 显式负模物理态。** 对每个这样的 α_0，取第二能级标量态
      ψ₂ = [ α_{−1}·α_{−1} + c₂ (α_0·α_{−2}) + c₃ (α_0·α_{−1})² ] |k⟩,
      c₂ = (D − 1)/5,   c₃ = (D + 4)/10
      （即 worldsheet.ocq-level-two-scalar-norm-closed-form 第 (6) 条的态）。则
        ψ₂ ∈ H_phys(α_0)      且      ⟨ψ₂, ψ₂⟩ = −2 (D − 26)(D − 1)/25 < 0，
      负号来自 D > 26（有序域上 (D − 26)(D − 1) > 0）。

  **(3) 结论。** 存在零模参数 α_0 与 ψ ∈ H_phys(α_0) 使 ⟨ψ, ψ⟩ < 0。
      即：**D > 26、a = 1 时旧协变物理态空间上的 Fock 型不是半正定的**。

  **(4) 该见证的动量非零。** 由 (1) 的 α_0·α_0 = −2 ≠ 0 立得 α_0 ≠ 0，即 k ≠ 0。
      因此本命题给出的是**非零动量扇区**上的负模态，而不是 p = 0 处那个对任何 D
      （包括 D = 26）都存在的平凡负模态 α^0_{−1}|0;0⟩。
      （α_0 ≠ 0 是 Lean 声明结论的一部分：`b ≠ 0`。）

  【本命题**不**断言什么】
  (a) **不**断言 D ≤ 26 时半正定（那是无鬼定理，worldsheet.no-ghost-theorem-v4 第 (1) 条）。
  (b) **不**断言 a ≠ 1 时也有负模态。文献中流传的更强形式「D > 26 时对任意 a 均有负模态」
      在本图中没有可核实来源（见 worldsheet.no-ghost-theorem-v4 的 gaps）。
  (c) **不**断言这是「level 2 标量物理态」的模：ψ₂ 张成 level 2 物理态的小群不变部分这一点
      未形式化，见依赖节点 worldsheet.ocq-level-two-scalar-norm-closed-form 的边界 (a)。
      对本命题而言无关紧要——一个负模态就够。
  (d) **不**给出所有负模态，不给出负特征值的个数，不做能级 N ≥ 3 的分析。
  (e) 与整个无鬼定理形式化岛一样：**逐动量扇区、代数版（无位置算符 x^μ、无完化）、对角 η、
      R-双线性型而非 Hermitian 半双线性型**。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.virasoro-standard
  - conv.intercept-sign-a
