  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/LightCone.lean :: StringFormal.NoGhost.towerPhys_bigrade_one_le_ddfSpan_sup_spurious（本卡 formal.lean_decl）；见证版 witness_towerPhys_bigrade_one_le_ddfSpan_sup_spurious；双分次 towerBigrade / towerBigrade_eq_inf / mem_towerBigrade；DDF 张成 ddfSpan / mem_ddfSpan_of_list / single_polState_vec_mem_ddfSpan；领头项 ddfOp_neg_one_apply_towerVacuum；伪态 towerLop_neg_one_apply_single_vacuum_eq；层化 single_mem_towerPhysSubmodule_iff。formal/StringFormal/NoGhost/PhysicalStates.lean :: StringFormal.NoGhost.Fock.mem_physSubmodule_inf_levelSubmodule_one_iff（能级 1 物理态的完整解）"
    note: |
      本仓库，formalizer-noghost-b（分支 agent/formalizer/noghost-b，lead 以 4aded75 合入 main），
      Lean 4 + Mathlib v4.33.1，无 sorry。**curator 未自行重跑 `lake build`**；
      合并前应由 lead 跑 `uv run stringgraph check-axioms`。这是本卡 status formalized 的依据。
      **逐句字典**：T_{j,N} ⇒ `towerBigrade D R j N`（= `towerRungSubmodule j ⊓ towerLevelSubmodule N`）；
      H_phys(a₀) ⇒ `towerPhysSubmodule η a b a₀`；a₀ = ½η(a,a) ⇒ `invTwo R * Fock.zeroModeSq η a`；
      D(Ε) ⇒ `ddfSpan η a b hη Ε`；|0;k−k_0⟩ ⇒ `Finsupp.single (-1) (Fock.vacuum D R)`；
      伪态 ⇒ `towerLop η a b (-1) (Finsupp.single (-1) (Fock.vacuum D R))`；
      (T)(O) ⇒ `TransverseFrame.transverse` / `.orthonormal`；(T′) ⇒ `hεa : ∀ i, dotVec η (Ε.vec i) a = 0`；
      (C) ⇒ `hspan : FrameSpansOrthogonal η Ε (towerMomentum a b (-1))`；
      结论的 ⊆ + 加法 ⇒ `≤ ddfSpan … ⊔ Submodule.span R {…}`（子模的 sup 就是和）。
  - ref: goddard-2008
    loc: "§6 'No-Ghost Theorem', p.15, eq. (6.4)（arXiv:0802.3249v1）：逐字 'For D = 26, if |ψ⟩ is a physical state … it can be written in the form |ψ⟩ = |f⟩ + |n⟩'"
    note: |
      **不承载本卡的论证**（该文无证明，转引 goddard-thorn-1972，正文未获取；
      逐字引文取自 worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 (B-26) gap，
      researcher 2026-09-11 逐页读图，literature/extractions/gsw-1987-v1.md §2）。
      **与本卡的三处差别**：(i) 文献在 D = 26 上断言，本卡在**一切 D** 上断言（因为只做 N = 1）；
      (ii) 文献断言 |n⟩ 是**零模态**，本卡只说它是伪态（a₀ = 1 时两者一致）；
      (iii) 文献对**一切能级**断言，本卡只做 N = 1。故本卡是 (6.4) 的一个**严格更弱**的增量，
      不是 (6.4) 本身；(6.4) 的承重点 (B-26) 仍未关闭。
tags: [bosonic-string, spectrum-generating-algebra, no-ghost, ddf-spans, formalized]
notes: |
  【为什么立卡（curator 2026-09-11，lean-wire-13）】
  「DDF 态张成物理态模零模态」（formal/TODO.md 的 `ddf-spans`、蓝图 §B.6）是无鬼定理里
  **困难的那一半**，此前在图中只以「未做」的形式出现在
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 gaps 与
  worldsheet.ddf-operators-preserve-physical-states--via-lean 的 gaps 第 1 条里。
  formalizer-noghost-b 把 **N = 1 那一层做完了**，本卡登记这个增量。
  ⚠ 它**不**改变 worldsheet.no-ghost-theorem-v4 的 effective：那条卡的瓶颈是
  (B-26)（D = 26 唯一进入之处），与 N = 1 无关——恰恰相反，N = 1 之所以能做完，
  正是因为 D = 26 在那里不进入。

  【D = 26 为什么在 N = 1 不进入】
  能级 1 的物理态由一个偏振向量 e 参数化（ψ = Σ_μ η_μ e^μ α^μ_{−1}|0;p_{−1}⟩），
  L_1 条件把 e 限制在 p_{−1}^⊥ 内，那是 D − 1 个方向；右端是 D − 2 个横向 DDF 方向
  加 1 个纵向（动量）方向，恰好 (D − 2) + 1 = D − 1。**这个计数对一切 D 都平衡**，
  故 N = 1 不含 26。蓝图 §B.5 预言的正是这一点：26 只在 N ≥ 2 的计数
  p_{D−1}(N) − p_{D−2}(N) 与零模态个数的比较里出现。

  【质壳把双分次压到反对角（为什么取 (j, N) = (−1, 1)）】
  `massShell_of_mem_towerBigrade`（LightCone.lean，需 (N)(S) 与 `NoZeroDivisors R`）：
  T_{j,N} 中非零的物理态满足 **α'p² + j + N = a₀**。在本卡的截距 a₀ = α'p² 下这就是
  **j + N = 0**：能级 N 的物理态只能住在第 −N 层。所以 N = 1 的那一片恰是 T_{−1,1}，
  而 DDF 态 A^{ε}_{−1}|0;k⟩ 也正落在第 −1 层能级 1（A^ε_{−n} 把层 −n、能级 +n）。
  ⚠ **本卡的断言本身不需要这条引理**（也不需要 (N)(S) 与 `NoZeroDivisors`）：
  双分次片是前提里给定的，不是推出来的。这条引理解释的是「为什么 T_{−1,1} 是对的那一片」，
  即本卡与 worldsheet.no-ghost-theorem-v4 (1b) 的「N = a − α'p²」那一句的接口。

  【本卡的两条额外假设都是真实的，不是技术性的】
  · (T′) η(ε_i, a) = 0：没有它，A^{ε_i}_{−1}|0;k⟩ **不等于** α^{ε_i}_{−1}|0;k−k_0⟩，
    右端会多出 (ε·k)Φ_1|0;k−k_0⟩；机检反例见 worldsheet.ddf-operators-v6 的 notes
    （WitnessInt.lean 的 D = 3 整数见证 ε·a = 1 ≠ 0）。
  · (C) 完备性：没有它，L_1 条件解出的偏振 e ∈ p_{−1}^⊥ 未必能拆成「横向 + 动量」；
    反例见 worldsheet.transverse-frame-spans-orthogonal-complement 的 notes。
  两条在显式光锥见证上都成立，故本卡**非空**：Lean 的
  `witness_towerPhys_bigrade_one_le_ddfSpan_sup_spurious` 把两条全部兑现，
  在那个标架上本卡的结论无条件成立。

  【与 worldsheet.gt-longitudinal-k-algebra 的分工】
  那张卡给 (6.2)(6.3) 的**代数**（[L_m,K_n] = −nK_{m+n} 等），并在【不断言】(a) 里
  明确把 (6.2) 的**刻画**留给 (B-26)。本卡走的是 (6.4) 的形式（物理态 = DDF + 伪态）而不是
  (6.2) 的形式（物理态 + K 条件 = DDF），且只到 N = 1；两者都不关闭 (B-26)。
  Lean 侧 `ddfCharacterization = towerPhysSubmodule ⊓ towerKerK` 与
  `ddfSpan_le_ddfCharacterization`（DDF 态满足 K 条件那一侧）已有，反向仍缺。

  【2026-09-11（lightcone-frame，curator）：`uses` 加了标架定义卡，陈述与 status 均未动】
  本卡【断言】里的四条前提 (T)(O)(T′)(C) 逐条是新定义卡 `worldsheet.ddf-light-cone-frame`
  的 (F5)(F7)(F6)(F8)。该卡把文献的光锥标架（ε_i ∈ span{k_0,p}^⊥，另加共轭类光方向 b̃）
  写成一条定义，是本卡这四条前提的**对象承载处**，故加入 `uses`。
  ⚠ **不是** `depends_on`：proposition 的 `uses` 不参与状态传播，本卡 effective 仍是 formalized。
  之所以不走 depends_on，理由写在 --via-lean 推导的 notes 末段（两条：接口边裁决 + 与
  tests/test_graph.py 固定不变量的冲突），那里也写了 lead 要改回去该动哪两处。
  ⚠ 新定义卡 status 是 **rigorous**（八条条件无单个 Lean 声明打包），故它**不能**用来给本卡
  的四条前提背书成「已形式化的标架」；本卡的前提仍是各自写在卡面上的那四条。
