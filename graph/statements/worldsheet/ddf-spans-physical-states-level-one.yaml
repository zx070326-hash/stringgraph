id: worldsheet.ddf-spans-physical-states-level-one
kind: proposition
title: DDF 态在 N = 1 张成物理态模伪态（Goddard 2008 (6.4) 的 N = 1 增量）：塔上第 −1 层、振子能级 1 的物理态 ⊆ DDF 张成 + R·L_{−1}|0; k − k_0⟩；**D = 26 不进入**
statement: |
  【设定】记号沿用 worldsheet.ddf-operators-v6、worldsheet.momentum-tower-fock-space、
  worldsheet.old-covariant-physical-states 与
  worldsheet.transverse-frame-spans-orthogonal-complement：
  D ∈ N；系数环 R 是交换 Q-代数；对角度规分量 η_μ 满足 (η) η_μ² = 1
  （conv.metric-mostly-plus）；η(x, y) = Σ_μ η_μ x^μ y^μ；基点动量 p 与参考向量 k_0，
  重标度 a^μ := (2α')^{1/2} p^μ、b^μ := (2α')^{1/2} k_0^μ（conv.alpha-prime-regge）；
  动量塔 T(p; k_0) = ⊕_{j ∈ Z} F(p + j k_0)，第 j 层重标度动量 p_j := a + j·b；
  L_m 是逐层作用的 Sugawara 算子（worldsheet.virasoro-generators-free-boson，零模取该层动量）。
  记 |0; k⟩ := 第 0 层的振子真空（动量 a），|0; k − k_0⟩ := 第 **−1** 层的振子真空（动量 p_{−1} = a − b）。

  【双分次与物理子空间】
    T_{j,N} := {x ∈ T(p;k_0) : x 支撑在第 j 层，且该层分量的振子能级为 N}（第 j 层、能级 N 的双分次片）；
    H_phys(a₀) := {x : (L_0 − a₀)x = 0 且 L_m x = 0 ∀ m ≥ 1}。
  本卡把截距**逐字取为基态自身的值**
    a₀ := α' p² = ½ η(a, a)
  （即 L_0|0;k⟩ = a₀|0;k⟩ 的那个 a₀；**不**要求 a₀ = 1）。

  【DDF 张成】给定横向标架 Ε = (ε_1, …, ε_{D−2}) 记
    D(Ε) := span_R { A^{ε_{i_1}}_{−n_1} ⋯ A^{ε_{i_r}}_{−n_r} |0; k⟩ : r ≥ 0，i_1..i_r ∈ {1..D−2}，n_1..n_r ≥ 1 }
  （r = 0 时是 |0;k⟩ 本身；A^ε_n 是 worldsheet.ddf-operators-v6 的模态和算子）。

  【断言】设横向标架 Ε 满足
    (T)  η(ε_i, b) = 0            （横向性，ε_i·k_0 = 0）；
    (O)  η(ε_i, ε_j) = δ_{ij}      （正交归一）；
    (T′) η(ε_i, a) = 0            （**偏振与基点动量正交**，ε_i·p = 0；
         这是 worldsheet.ddf-operators-v6 的 notes 登记的那条缺假设，(T) 不蕴含它）；
    (C)  Ε 在 v^⊥ 上完备，v := p_{−1} = a − b
         （worldsheet.transverse-frame-spans-orthogonal-complement 的完备性谓词；
         (T)(O) 不蕴含它）。
  则
    **H_phys(a₀) ∩ T_{−1, 1}  ⊆  D(Ε) + R · L_{−1}|0; k − k_0⟩** 。
  即：第 −1 层、振子能级 1 上的每个物理态都是「DDF 态 + 一个伪态」，
  其中伪态取 L_{−1} 作用在第 −1 层真空上得到的那一个。

  【本断言**不**需要的假设，逐条】
  (1) **不需要 D = 26**，也不需要 D 的任何上下界：N = 1 处的计数 (D − 1) = (D − 2) + 1
      对一切 D 成立（D − 1 个横向-加-纵向方向 = D − 2 个横向 + 1 个动量方向）。
  (2) **不需要 (N) k_0² = 0 与 (S) 2α' k_0·p = 1**：它们控制的质壳记账已经包含在
      「x ∈ H_phys(a₀)」这个前提里（见 notes 的【质壳把双分次压到反对角】）。
  (3) **不需要截距 a₀ = 1**（快子壳）：a₀ 逐字是基态值 α'p²。
  (4) 不需要任何实结构、正定性、或对 R 的进一步限制（除 Q-代数）。

  【本卡明确不断言】
  (a) **不断言等式**。反向包含「D(Ε) + 伪态 ⊆ H_phys」是另外的命题
      （worldsheet.ddf-operators-preserve-physical-states 那一支），本卡只给一个方向。
  (b) **不断言 N ≥ 2 的任何情形**。N = 2 的两个缺口见推导 gaps。
  (c) **不断言 L_{−1}|0;k−k_0⟩ 是零模态（null）**：只有在 a₀ = 1 时它才与全部物理态正交
      （文献里 N = 1 的光子零态）；本卡不设 a₀ = 1，故只称它为**伪态**（spurious）。
  (d) 不断言 DDF 态非零、线性无关，也不断言 D(Ε) 上的 Gram 矩阵正定。
  (e) **不断言 Goddard 2008 (6.2) 的 K 条件刻画**「物理态 + K_n|ψ⟩ = 0 (n>0) = DDF 态」，
      也不断言无鬼定理的承重步 (B-26)（见
      worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 gaps）。
uses:
  - worldsheet.ddf-light-cone-frame
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.intercept-sign-a]
