id: worldsheet.same-point-product-of-orthogonal-momentum-vertex-operators
kind: proposition
title: 正交动量指数顶点算子的**同点乘积**等于动量之和的顶点算子：b·b′ = 0 ⟹ Σ_{J+K=L} V^{(b)}_J V^{(b′)}_K = V^{(b+b′)}_L（K-求和逐向量有限）
statement: |
  【设定：代数 Fock 空间上的模，无 OPE、无围道、无收敛性、无零模】
  按 worldsheet.bosonic-fock-space 取 D 个自由玻色振子的**代数** Fock 空间
  F = F(D, R)（多项式代数，无零模、无完化），系数环 R 是交换 ℚ-代数。
  取对角时空度规分量 η_μ，记收缩 x·y := Σ_μ η_μ x^μ y^μ（conv.metric-mostly-plus 的收缩约定）。
  ⚠ **本卡不需要归一化 η_μ² = 1**（同 worldsheet.orthogonal-momentum-vertex-operators-commute；
  全文只把 η_μ 当作 R 中的一族元素，不做双重收缩）。

  取两个**常**向量 b, b′ ∈ R^D，按 conv.alpha-prime-regge 它们是
    b^μ = (2α')^{1/2} k^μ,   b′^μ = (2α')^{1/2} k′^μ。
  记 V^{(b)}_J（J ∈ Z）为 worldsheet.exponential-vertex-operator-modes 定义的正规序指数
  :e^{i k·X(z)}: 的**振子部分**的 z^J 洛朗系数（z^J-系数约定；Lean 侧 `Fock.vertexOsc η b J`），
  同理 V^{(b′)}_K 与 V^{(b+b′)}_L（后者的动量参数是逐分量的和 b + b′）。
  再记 levelBound(P) 为 P ∈ F 中出现的最高振子能级（worldsheet.bosonic-fock-space 的 level 分级）。

  【断言】设

      b·b′ = 0        （等价 k·k′ = 0）。

  则：

  **(1) 局部有限性。** 对每个 L ∈ Z 与每个 P ∈ F，只有有限多个 K ∈ Z 使
  V^{(b)}_{L−K}( V^{(b′)}_K P ) ≠ 0；更精确地，该向量在

      K < −levelBound(P)   或   K > L + levelBound(P)

  时为零。**注意上端的界与 K 无关地成立**：V^{(b′)}_K P 本身的能级是 levelBound(P) + K，
  随 K 增长，所以朴素的能级计数给不出上端；正确的记账是先把相干态因子提到左边，
  只留下湮灭半 Ψ^{b′}_M P，而后者的能级界**对 M 一致**地不超过 levelBound(P)。

  **(2) 同点乘积公式。** 于是

      W_L := Σ_{J + K = L} V^{(b)}_J ∘ V^{(b′)}_K
           （等价写法 Σ_{K ∈ Z} V^{(b)}_{L−K} ∘ V^{(b′)}_K）

  是 F 上处处有定义的 R-线性算子，且作为算子恒等式

      **Σ_{J + K = L} V^{(b)}_J V^{(b′)}_K  =  V^{(b+b′)}_L** ，   ∀ L ∈ Z。

  等价的有限和形式：任何包含窗口 −levelBound(P) ≤ K ≤ L + levelBound(P) 的有限指标集
  s ⊂ Z 都算得对，即 Σ_{K ∈ s} V^{(b)}_{L−K}( V^{(b′)}_K P ) = V^{(b+b′)}_L P。

  【正交性在哪两处被用到——这一段是陈述的一部分】
  (i) **(1) 的上端**（局部有限性）：把相干态因子穿过 V^{(b)} 需要 b·b′ = 0；
  (ii) **真空值**：V^{(b)}_J ( V^{(b′)}_K 1 ) 的计算需要 b·b′ = 0。
  与之对照，**产生半的加法公式**

      E₋(b) E₋(b′) = E₋(b + b′)，   系数形式  Φ^{b+b′}_j = Σ_{p+q=j} Φ^b_p Φ^{b′}_q

  **对任意一对动量成立，不需要正交性**（产生半只是交换环 F 里的乘法）。
  缩并只出在**湮灭半**：这是本卡与 worldsheet.orthogonal-momentum-vertex-operators-commute
  共同的机制说明。

  【b·b′ ≠ 0 时本公式不成立（记录为限制，本卡不断言其证明）】
  一般动量下把湮灭半移过产生半留下缩并标量

      exp( (b·b′) Σ_{l ≥ 1} (w/z)^l / l )  =  (1 − w/z)^{−(b·b′)} ，

  它的形式展开**把所有洛朗指标混在一起**：K-求和不再局部有限（(1) 失效），
  乘积也不是**单个**顶点算子（(2) 的右端失效）。
  ⇒ 因此 b·b′ = 0 不是为了方便而设的假设，而是公式成立的条件。
  ⚠ 该"为假"的判断本身**未被证明**，见【本节点明确不断言】(a)。

  【本节点明确不断言】
  (a) **b·b′ ≠ 0 时的任何定量结论**，包括上面那个带单值因子 (1 − w/z)^{−b·b′} 的关系，
      以及"公式为假"这一否定命题本身。本图与 Lean 都没有这些内容
      （Lean 侧连该形式级数都没有定义）。上面【限制】一段的地位是
      **机制说明 + formalizer 的断言**，不是已证结论。
  (b) **完整顶点算子（含零模）的同点乘积**。本卡只谈振子部分；带层移位零模的塔上版本是
      worldsheet.isotropic-tower-vertex-operator-fusion。
  (c) **加权和** Σ_j j V^{(m)}_j V^{(n)}_{−j} = m δ_{m+n,0}（那是
      worldsheet.tower-vertex-weighted-mode-sum），也**不**断言
      worldsheet.ddf-transverse-oscillator-algebra-v2 的任何部分。
  (d) **任何 OPE 形式的陈述**。本卡是模的代数恒等式；上面写出的缩并标量只是**动机说明**。
      算子乘积的 OPE 与"同点"这个词的解析含义（两个插入点 z → w 的极限）都不在本卡范围内：
      本卡的"同点"仅指**洛朗指标相加**这一代数操作。
  (e) **共形权、伴随、幺正性、号差、收敛性、完化**。F 是多项式代数，逐向量是有限和；
      η_μ 只是 R 中一族元素，没有实结构也没有正定性。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
formal:
  lean_decl: StringFormal.NoGhost.Fock.vertexProduct_eq_vertexOsc_add
  lean_file: StringFormal/NoGhost/VertexProduct.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/VertexProduct.lean :: StringFormal.NoGhost.Fock.vertexProduct_eq_vertexOsc_add（本卡 formal.lean_decl，断言 (2)）与有限和形式 StringFormal.NoGhost.Fock.sum_vertexOsc_vertexOsc_of_dotVec_zero；断言 (1) 是 StringFormal.NoGhost.Fock.{vertexAnn_mem_levelSubmodule, vertexAnn_apply_eq_zero_of_level, levelBound_vertexAnn_le, vertexOsc_vertexOsc_apply_eq_zero_of_lt, vertexOsc_vertexOsc_apply_eq_zero_of_gt, vertexOsc_vertexOsc_apply_eq_zero_of_notMem_vertexProdIdx, vertexProdIdx}；组装 StringFormal.NoGhost.Fock.{vertexProduct, vertexProduct_apply, vertexProduct_apply_one, vertexProduct_X_mul}；产生半加法公式 StringFormal.NoGhost.Fock.{creaExpPair, creaExpPair_eq_sum_Icc, sum_mode_creaExpPair_eq_smul, creaExpPair_eq_creaExp_add}（在 formal/StringFormal/NoGhost/VertexCommute.lean）"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry。该文件 17 条声明，formalizer 自述
      2026-09-11 用 `--import StringFormal.NoGhost.VertexProduct --all` 复核公理只有标准三条；
      lead 以 **2c873fa**（"merge: same-point product of orthogonal-momentum vertex operators
      (VertexProduct.lean)"，547 行）合入 main。
      `vertexProduct_eq_vertexOsc_add` 语句逐字（去掉隐式参数）：
        `(η b b' : Fin D → R) (hdot : dotVec η b' b = 0) (L : ℤ) :
         vertexProduct η b b' hdot L = vertexOsc η (b + b') L`，
      其中 `vertexProduct η b b' hdot L = lsumLocFin (fun K => vertexOsc η b (L - K) ∘ₗ
      vertexOsc η b' K) (vertexProdIdx L) …`。**假设只有 `hdot`**——没有 `hη : η_μ² = 1`、
      没有对 L 的限制、没有 b ≠ b′。与本卡断言 (1)(2) 逐字一致
      （`vertexProdIdx L P = Finset.Icc (-(levelBound P)) (L + levelBound P)` 即本卡的窗口）。
      ⚠ **本卡【限制】一段（b·b′ ≠ 0 时不成立）在 Lean 里只是文件头的数学注记，不是定理**。
      该注记（"Mathematical remarks" 第 2 条）逐字：「**For `b · b' ≠ 0` the statement is
      false**, not merely unproved: the contraction produces
      `exp((b·b') Σ_{l≥1} (w/z)^l / l) = (1 - w/z)^{-b·b'}`, whose expansion mixes all Laurent
      indices, so the `K`-sum is not locally finite and the product is not a single vertex
      operator.  On the DDF tower this is exactly the place where `k_0² = 0` enters.」
      本卡据此写【限制】，并在【不断言】(a) 明确它**未被证明**。
      ⚠ 同文件头第 1 条逐字记下正交性用在哪两处（本卡【正交性在哪两处】那一段的来源）：
      「Twice, and both times essentially. (a) *Local finiteness.* The naive level count fails:
      `V^{(b')}_K P` sits at level `levelBound P + K`, which grows with `K` … (b) *Vacuum
      value* … The *creation* halves multiply correctly for any pair of momenta
      (`Fock.creaExpPair_eq_creaExp_add`); only the annihilation half contracts.」
      **curator 未自行重跑 `lake build`**；合并前应由 lead 跑 `uv run stringgraph check-axioms`。
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      **不承载本卡的论证**（论证是 Lean 的），只作对照：DDF 链里"两个 e^{i n k_0·X} 在同一点
      相乘得到 e^{i(m+n) k_0·X}（因为 k_0² = 0，无缩并奇点）"是被默认使用的一步，
      用来把 [A^i_m, A^j_n] 的全部贡献归给横向振子。核实等级沿用
      worldsheet.ddf-operators-v6：章节页码 L4/L2，**式号与正文 L0**。
      GSW 用 mostly-minus（已按 conv.metric-mostly-plus 转写）、取 α' = 1/2，
      **不写洛朗模形式的同点乘积陈述**，也不讨论 K-求和的局部有限性。
tags: [cft, vertex-operator, bosonic-string, spectrum-generating-algebra, ddf, formalized]
notes: |
  【立卡理由】这是 [A^ε_m, A^δ_n] = m(ε·δ)δ_{m+n,0} 那条链的**第 (5a) 步**，
  formal/TODO.md 的 `ddf-operators` 条目逐字如此编号（「(5a) 同点乘积
  `Σ_{J+K=L} V^{(b)}_J V^{(b')}_K = V^{(b+b')}_L`（`b·b'=0`）」）。
  worldsheet.orthogonal-momentum-vertex-operators-commute 的 notes 与
  worldsheet.isotropic-tower-vertex-operators-commute--via-lean 的 gaps (iii) 都把 (5a)
  登记为"未做"，本卡与 worldsheet.isotropic-tower-vertex-operator-fusion 把这一项关闭。

  【与姊妹卡 worldsheet.orthogonal-momentum-vertex-operators-commute 的关系：逻辑独立】
  两张卡都假设 b·b′ = 0，机制也相同（湮灭半无缩并），但**互不蕴含**：
  · 那张卡说两个**固定指标**的模对易 V^{(b)}_J V^{(b′)}_K = V^{(b′)}_K V^{(b)}_J；
  · 本卡说**沿 J + K = L 求和**后的结果是另一个顶点算子。
  从"逐对对易"推不出求和公式（还需要产生半的加法公式与局部有限性），
  反之也推不出（求和后信息已被压缩）。
  ⚠ Lean 侧本卡的证明**不调用**那张卡的主定理 `vertexOsc_comm_of_dotVec_zero`，
  只调用同一文件里的三个**零件**（见推导 depends_on 的说明）。

  【本卡最值得记住的一点：局部有限性不是记账，是实质内容】
  断言 (1) 的上端界"与 K 无关"是纸上推导从不提的一步。朴素论证会说
  "V^{(b′)}_K 把能级抬 K，V^{(b)}_{L−K} 把能级抬 L−K，合起来抬 L，所以低能级处为零"——
  但这**给不出对 K 的一致界**，因为中间态的能级随 K 无界增长。
  Lean 侧真正的输入是 `Fock.levelBound_vertexAnn_le`：**湮灭半**把能级界压住且**对 M 一致**
  （`levelBound (Ψ^b_M P) ≤ levelBound P`），再配合把相干态因子提到左边。
  这与 worldsheet.tower-vertex-weighted-mode-sum notes 里记的"二重和窗口选取会循环"
  是同一类现象：局部有限性在形式化里是有内容的命题，不是显然的。

  【另一条更省的路（formalizer 记录，未走）】湮灭半也有加法公式
  Σ_{L1+L2=M} Ψ^b_{L1} Ψ^{b′}_{L2} = Ψ^{b+b′}_M（两次平移的复合 = 平移之和，
  **且这个和是有限的**），配上产生半的加法公式可把整个乘积化成三重和的重排；
  但重排里对 K 的求和仍是无限的，局部有限性绕不过去。转录自 formal/TODO.md (5a) 末段。

  【查重】2026-09-11 跑 `uv run stringgraph search "same-point" / "product" / "vertex operator" / fusion`。
  最接近的既有节点：worldsheet.orthogonal-momentum-vertex-operators-commute（[V,V] = 0，
  上面已说明逻辑独立）、worldsheet.exponential-vertex-operator-modes（V 的定义卡）、
  worldsheet.ddf-transverse-oscillator-algebra-v2（[A,A]，文献推导）。
  **没有**同点乘积的节点，本卡不重复。
