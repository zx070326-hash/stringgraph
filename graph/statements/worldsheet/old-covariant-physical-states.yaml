id: worldsheet.old-covariant-physical-states
kind: definition
status: rigorous
title: 旧协变量子化中的物理态空间
statement: |
  取 D 个自由玻色子 X^μ 的 Fock 空间 F（度规 η_{μν}，模式 α^μ_n），
  Virasoro 生成元 L_n 由 Sugawara 型构造给出，中心荷 c = D。
  物理态空间定义为 H_phys = {|ψ⟩ ∈ F : (L_0 - a)|ψ⟩ = 0, L_n|ψ⟩ = 0 ∀ n>0}，
  其中 a 是截距常数。零模态为 H_phys 中与所有物理态内积为零者。
uses: [worldsheet.virasoro-algebra-v2]
uses_conventions: [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.1"
  - ref: gsw-1987-v1
    loc: "§2.2.1"
tags: [bosonic-string, quantization]
notes: |
  Fock 空间 F 的形式化定义见 worldsheet.bosonic-fock-space（`formal/StringFormal/NoGhost/Fock.lean`），
  其上的不定双线性型见 worldsheet.fock-indefinite-form；本节点隐含使用了零模 x^μ、p^μ
  与动量 k（L_0 = α'p² + Σ_{n≥1} α_{−n}·α_n 以及物理态条件都依赖 k），这部分**尚未形式化**，
  因此本节点不继承那两个节点的 formalized 状态。
author: seed
created: "2026-09-10"
