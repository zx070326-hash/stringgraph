id: worldsheet.linear-dilaton-cft
kind: definition
status: rigorous
title: 线性 dilaton 共形场论
statement: |
  在 D 个自由标量 X^μ 的理论（worldsheet.free-scalar-cft-action）上，把能动张量修改为
    T(z) = -(1/α') : ∂X^μ ∂X_μ : + V_μ ∂^2 X^μ,
    T̄(z̄) = -(1/α') : ∂̄X^μ ∂̄X_μ : + V_μ ∂̄^2 X^μ,
  其中 V_μ 是一个固定的常向量。该 T 仍满足共形场论所要求的 TT OPE 形式
  （worldsheet.tt-ope-central-charge），故给出一个新的共形场论，称为**线性 dilaton CFT**，
  其名称来自它等价于在世界面上加一项耦合到 Ricci 标量的线性 dilaton 背景 Φ(X) = V_μ X^μ。
  作用量本身（以及 X 的传播子与运动方程）不变，改变的只是能动张量，
  因而算子的共形权与理论的中心荷都随之改变（worldsheet.linear-dilaton-central-charge）。
uses:
  - worldsheet.free-scalar-cft-action
  - worldsheet.energy-momentum-tensor-free-scalar
  - worldsheet.conformal-normal-ordering-v2
  - worldsheet.tt-ope-central-charge-v2
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§2.5（p.49 起），eq. (2.5.2)（线性 dilaton 中心荷）、(2.5.3)（线性 dilaton 变换），p.49"
    note: |
      两个公式号经 schrans-2020 目录核实（`2.27`、`2.28`, p.49）。
      **T 的具体表达式（V_μ ∂^2 X^μ 项的系数）未核实**；见 polchinski-1998-v1.md E35。

      ★ **【原书核实 2026-09-11（L1 页图逐字，p.49）——(2.5.3) 的内容与它下面那一句】**
        「`δX^μ = −εv∂X^μ − εv*∂̄X^μ − (ε/2)α'V^μ[∂v + (∂v)*]` .   (2.5.3)
         **This is a *different* conformal symmetry of the same action. The field `X^μ` no longer
         transforms as a tensor, its variation now having an inhomogeneous piece.** Incidentally,
         the free massless scalar in two dimensions has a remarkably large amount of symmetry —
         much more than we will have occasion to mention.」
      同页并写：「so different values of `V^μ` are to be regarded as **different CFTs**」。

      ⇒ 两条对全图有用的结论：
      (1) **这里、而且只有这里，才是原书说「X^μ 不是 tensor」的地方。** 在普通自由标量 CFT
          （T = (2.4.4)）里 X^μ **是**权 (0,0) 的主场（p.47「All transform as tensors except ∂²X^μ」）。
          本图此前多处把这两句混为一谈，已由 worldsheet.primary-field → primary-field-v2 的
          换代纠正；本卡是「另一个 CFT」这一侧的锚点。
      (2) **不同的 V^μ 是不同的 CFT**，不是同一理论的不同写法——这与本卡 notes 末段
          「限定 free-boson-central-charge-d 的适用范围」是同一件事的原书原话。
      见 literature/extractions/polchinski-1998-v1.md §13.4(c)。
tags: [cft, linear-dilaton, energy-momentum-tensor, definition]
notes: |
  【正规序卡换代（curator 2026-09-11）】uses 已从 worldsheet.conformal-normal-ordering（v1）
  换到 worldsheet.conformal-normal-ordering-v2（任意自由场版本，X 部门逐字退化为 v1）。
  本卡只涉及玻色型场，内容与有效状态不变。

  本节点是「同一个作用量可以配不同的能动张量、给出不同的 CFT」的第一个例子，
  也是后续弦论中 dilaton 背景、Liouville 理论与非临界弦的入口。
  在本图中它的作用是**限定** worldsheet.free-boson-central-charge-d 的适用范围：
  c = D 只对 V_μ = 0 的标准能动张量成立。
  **2026-09-11 `uses` 换代改指（curator-small-backlog-3）**：worldsheet.tt-ope-central-charge（v1）→ worldsheet.tt-ope-central-charge-v2。v1 把「TT OPE 极点结构由共形不变性确定」这条命题内嵌在定义卡里，现拆为定义卡 v2 + 命题卡 worldsheet.tt-ope-pole-structure-from-conformal-invariance；本卡 `uses` 里用的是**定义半**（中心荷 c 的定义与归一化），故改指 v2。statement 正文里对 v1 id 的字面引用按 graph/CLAUDE.md 的裁决不就地改。
