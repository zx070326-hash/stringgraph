sources:
  - ref: polchinski-1998-v2
    loc: "§11.2, eq. (11.2.19)–(11.2.28), pp. 53–55（两组 16、投影、Z_8²、R–NS′ 零点能 0、128+128′、(11.2.25) 的左移内容、E₈ 的 248 = 120+128、(11.2.26)/(11.2.27) 的额外流）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E57；式号与公式逐页读到原书页图）。
      原书对第 (3) 步的措辞逐字：'Consistency of the spacetime theory requires that massless
      vectors transform under the *adjoint* representation of the gauge group. There is indeed a
      group, the exceptional group E₈, that has an SO(16) subgroup under which the E₈ adjoint
      **248** transforms as 120 + 128. Evidently this second heterotic string theory has gauge
      group E₈ × E₈.'
  - ref: polchinski-1998-v2
    loc: "§11.2, (11.2.22) 之后, p. 54（逐字：'It is important here that the fermions are in groups of 16, so that the minus signs from Z_ψ^± (which was for eight fermions) are squared.'；自称 'Again closure and locality of the OPE and modular invariance are easily verified.'）"
    note: |
      L1（E57）。这是 (11.2.22) 的符号论证与自称严格程度。
tags: [heterotic, e8e8, spectrum, gauge-group, gso, modular-invariance]
notes: |
  【算术核对（本图内部）】(11.2.24)：8 个横向玻色子 −1/3；16 个周期费米子 +16/24 = +2/3；
  16 个反周期费米子 −16/48 = −1/3。合计 0 ✓。
  256 = 2^8：16 个实零模 → 8 个费米型产生-湮灭对 → 2^8 维旋量 ✓；128 + 128 = 256 ✓；
  120 + 128 = 248 = dim E₈ ✓（120 = dim SO(16) = 16·15/2 ✓）。

  ★【第 (3) 步是本卡最弱的一环】它由两条都不在本图的外部事实撑着：
    (a) 「时空一致性要求无质量矢量在伴随表示」——原书不证、不引文献；
    (b) E₈ 的存在与分支规则 248 = 120 + 128——属于李代数事实，本图无节点
        （§11.4「A little Lie algebra」E59 本轮未入图，且原书 pp. 61–65 抽取者跳读）。
  抽取记录 E57 备注：这条结论的论证是**排除法 + 自旋统计 + OPE 闭合**，不是穷举证明。

  【与 SO(32) 情形的对照】分成两组 16 时，(11.2.13) 的「全 + 号」论证仍然成立
  （Z_ψ^± 的负号被平方掉）；分成八个一组则不成立——这正是
  worldsheet.heterotic-two-supersymmetric-ten-dimensional 的核心。

  【(11.2.26)/(11.2.27) 的记号】q_K 是玻色化后 16 个左移标量 H^K 的动量（U(1) 荷）；
  它与 §11.6 的格点构造是同一件事的两种写法（Γ_8 的旋量共轭类，(11.6.6b)）。
  本图不为此加边（玻色化无节点）。
