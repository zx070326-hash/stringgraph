id: worldsheet.heterotic-e8e8-construction
kind: proposition
title: E₈ × E₈ 杂化弦：λ^A 分成两组 16 独立取周期条件，无质量矢量的伴随表示要求把 120 + 128 认作 E₈ 的 248
statement: |
  把 worldsheet.heterotic-string-construction 的 32 个 λ^A 分成**两组各 16 个**，
  两组的周期条件**独立**取 ±（(11.2.19)），相应的两个费米子数算符记作
  exp(πiF_1)、exp(πiF_1′)（(11.2.20)）；对 2³ = 8 种周期组合求和，并施加投影
    exp(πiF_1) = exp(πiF_1′) = exp(πiF̃) = 1                （(11.2.21)）。
  左移配分函数是
    Z_8(τ)² = { (1/4)[ Z^0_0(τ)^8 + Z^0_1(τ)^8 + Z^1_0(τ)^8 + Z^1_1(τ)^8 ] }²   （(11.2.22)）。

  **断言**：
    **(1)** 在 R–NS′ 扇区（一组周期、另一组反周期）左移零点能常数为
        −8/24 + 16/24 − 16/48 = **0**              （(11.2.24)），
        故该扇区基态无质量；16 个周期 λ 的零模给出 2^8 = 256 维旋量表示，
        GSO 投影 (11.2.21) 把它分成 **128 + 128′** 并保留前者。
    **(2)** 左移无质量内容是（按 SO(8) × SO(16) × SO(16) 标记）
        (8_v,1,1) + (1,120,1) + (1,1,120) + (1,128,1) + (1,1,128)    （(11.2.25)），
        其中 120 是 SO(16) 的伴随、128 是它的旋量。
    **(3)** 时空理论的一致性要求**无质量矢量按规范群的伴随表示变换**；
        例外李群 **E₈** 有一个 SO(16) 子群，在其下 E₈ 的伴随 **248 分解为 120 + 128**。
        原书逐字：'**Evidently this second heterotic string theory has gauge group E₈ × E₈.**'
    **(4)** 额外的流由玻色化给出 exp[i Σ_{K=1}^{16} q_K H^K(z)]（(11.2.26)），
        其中 q_K = ±1/2（K = 1, …, 8）或 0（K = 9, …, 16），且 Σ_K q_K ∈ 2Z（(11.2.27)）；
        完整无质量谱见 (11.2.28)。

  **本命题不断言的内容**：
    (1) 第 (3) 步是**认出**（'Evidently'），不是证明：原书既不证明「无质量矢量必须在伴随表示」
        这条时空一致性要求，也不证明 E₈ 的存在性或 248 = 120 + 128 的分支规则。
    (2) 不断言 E₈ × E₈ 是唯一的另一个选择——那是
        worldsheet.heterotic-two-supersymmetric-ten-dimensional。
    (3) 不断言整体规范群（E₈ 是单连通的，但本卡不对 SO(16) 与 Spin(16) 的区别作断言）。
    (4) 不断言模不变性的验证（原书：'Again closure and locality of the OPE and modular
        invariance are easily verified.'）。
