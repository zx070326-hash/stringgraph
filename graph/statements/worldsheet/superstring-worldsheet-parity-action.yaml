notes: |
  ★★★【2026-09-11 已换代并拆为两张卡（curator，batch27-fix）】
  · **definition**：worldsheet.superstring-worldsheet-parity-action-v2
    ——只含本卡断言 (1)(2)，即 (10.8.12)(10.8.13)，仍取 `status: rigorous`；
  · **proposition**：worldsheet.open-superstring-omega-squared-is-fermion-parity
    ——本卡断言 (3)(4)，即 (10.8.14)(10.8.15)，推导 physical-argument。
  换代理由（reviewer-batch27 F2，CONFIRMED）：
    (i) (10.8.14)(10.8.15) 是**由 (10.8.13) 推出的命题**，不是定义，本卡把它们塞进定义卡；
    (ii) 更要紧：本卡断言 (3) 写成**无限定**的算符等式 Ω² = exp(πiF)，而由本卡自己的断言 (2)
         在 **R 扇区（r ∈ Z）**得 Ω²ψ_rΩ^{−2} = **+**ψ_r（Ω² 与 ψ_r 对易），
         exp(πiF) 却与全部 ψ^μ 反对易 ⇒ **断言 (3) 与断言 (2) 在 R 扇区矛盾**；
         它只在 exp(πiF) = 1 的 GSO 投影谱上才是原书那句 'physically the same'。
    (iii) 本卡「不断言 (a)」已承认 R 扇区无论证，却仍把 (3) 写成无限定断言并标 rigorous；
         而 notes 里「有限步初等计算 ⇒ rigorous」的理由**只覆盖 NS 扇区**，
         且 STATUS_LEVELS 的 rigorous 例外还要求推导 notes 有 `reviewer-verified` 记录
         （定义卡无推导，无处写）。
  ⚠ 本卡的 uses 里 worldsheet.type-i-open-string-gauge-multiplet 是为断言 (4) 的
  「exp(πiF) = 1 by the GSO projection」加的，随 (10.8.15) 一起移到命题卡
  （命题卡改指更贴切的窄卡 worldsheet.open-superstring-gso-projection）。
  ⚠ 按原则 1，本卡的 id 与 statement 正文**不改**；正文里对其他卡的字面引用同样不追改
  （graph/CLAUDE.md 2026-09-12 裁决）。

  ★★【本卡为什么存在（curator，2026-09-11，klein-mobius）】
  在此之前，本图里凡需要「Ω 在超弦上的作用」的推导都只能把边挂到**玻色弦**的
  worldsheet.worldsheet-parity 上并标 **inferred**，并各自在 gaps 里记一句同样的话：
    · worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences：
      「**Ω 在超弦上的作用（(10.8.13)/(10.8.14)）本图无节点**（依赖边已标 inferred）」；
    · worldsheet.superstring-cylinder-amplitude-closed-channel-v2--via-open-string-trace-doubling：
      「超弦的完整作用 ((10.8.12)–(10.8.15) …) 本图无节点 … Möbius 带那一支才真正需要这些式子」。
  本卡把这条缺口在**开弦**一侧合上。**闭弦一侧仍未合上**（见「不断言 (c)」）。

  ★【为什么 status 取 rigorous】(10.8.13) 是在自由世界面费米子的模代数上给出的**精确算符定义**
  （给定 r 的取值范围，Ω 由相位 exp(−πir) 与真空上的取值唯一确定），
  (10.8.14) 由它经**有限步初等计算**得到（NS：r ∈ Z + ½ ⇒ exp(−πir) 纯虚 ⇒ 平方为 −1）。
  这符合 docs/STATUS_LEVELS.md 对 definition 的 `rigorous` 判据（数学上精确但未形式化）。
  ⚠ **两处照实登记的保留**（不因此降级，但必须写明）：
    (i) **R 扇区的论证原书不给**（见「不断言 (a)」）——原书只写了 NS 扇区那一句；
    (ii) **(10.8.12) 所用的超弦版 doubling trick (10.2.15) 在本图无节点**（见「不断言 (b)」），
         即「几何上的 σ ↦ π − σ」到 (10.8.12) 这一步是从原书导入的。
  ⇒ 本卡的 effective 由 uses 的最低级压下来（worldsheet.type-i-open-string-gauge-multiplet 是
  physical-argument），这是有意的：(10.8.15) 的四项写法确实依赖开弦 GSO 这条物理论证。

  【下游】本卡目前的下游是
  worldsheet.superstring-mobius-strip-amplitude-closed-channel--via-open-string-trace-with-omega
  （Möbius 带的迹里插入的正是 (10.8.15) 的投影算符，抽取记录 #E71 把 #E70 列为明写依赖）。
  ⚠ **Klein 瓶那一支用不到本卡**（那是闭弦拓扑，需要的是 Ω 在闭弦费米子上的作用），
  其推导的 Ω 边仍指玻色卡并保持 inferred。
