notes: |
  【本卡片换代 worldsheet.critical-dimension-bosonic-v2】（curator，2026-09-11，lead 授权，
  依 ms.critical-dimension-bosonic 第二轮回译审计 physics-auditor 的裁定与建议 §6 (i)–(iv)）
  v2 的陈述文本一字未动，只加 superseded_by 与一段 notes（根 CLAUDE.md 原则 1）。
  逐条对应第二轮裁定：

    D1 / C1（本轮最主要的 drift）→ (I) 的前提由「正规序常数取横向零点能的 ζ 正规化值
       a = (D−2)/24」改为「a 作为待定参数进入 Δ_n，不预先代入任何正规化值」，与路线卡
       worldsheet.critical-dimension-light-cone 及里程碑 canonical_text 一致。
       ζ 值那条形状降为 (I) 内的说明段（先代入则 Δ_n = n(26−D)/12，闭合 ⟺ D = 26，
       a = 1 成为推论），并注明两种形状结论相容。
       数值复核（审计第二轮 §4，本卡片采用其结论）：Δ_n 在 (D,a) = (26,1) 处 n = 1..5 全零；
       (27,1) 给 0, −1/8, −2/9, …；(25,1) 反号；(26,0) 给 2, 1, 2/3, …。
    D2 / A1 → 删去 v2 (I) 末句「也是唯一以「当且仅当」形式给出 D 的一条」，并在
       【本命题不断言什么】新增第 (6) 条显式声明不作该断言。里程碑 canonical_text 的
       【不断言】(6) 因此不再是「对陈述卡的免责」，而是与本卡 (6) 逐条对应的同一句话。
    D5 / T4 → (II) 删去 v2 的「零模态（伪态）」括注：伪态是 L_{−n} 的后代且与物理态正交的态，
       零模态是内积在 H_phys 上的根，「H_0 = 物理伪态」在 (26,1) 是无鬼定理的**内容**而非定义。
       本卡按路线卡 worldsheet.critical-dimension-old-covariant-v2 的定义写「零模态子空间」。
    D3 / C2 → (III) 的前提补上「诸 c_{−m} c_m 在 V 上线性无关（对忠实的 Fock 型受限模成立）」，
       措辞照路线卡 worldsheet.critical-dimension-brst-v2，并注明它只被 ⟹ 方向用到。
       （审计补记：在任何满足 {b_m, c_n} = δ_{m+n,0} 的非零受限模上该前提很可能自动成立，
       故 v2 省掉它至多是省了一个可推出的前提，不是物理错误；本卡写出它是保守做法。）
    D4 / C3 → (V) 的「三条刻画对任意 D ≥ 4 都各自等价于 a = 1」改为按刻画分列**图内支撑**的
       维数范围：(a)(b) 对 D ≥ 2，(c) 只覆盖 D = 4 与 D ≥ 6（D = 5 处 SO(4) 的 3 维自对偶
       2-形式表示使计数论证失效，已记入 --via-light-cone-representation 的 gaps）。
       同时按审计补记写明这是**图内支撑**的范围而非刻画本身的真值范围。
    N2（本轮新发现）→ (I) 补 D ≥ 4：D = 3 只有一个横向指标，反对称组合恒为零，洛伦兹代数
       对任意 a 都闭合，iff 的「仅当」方向在 D = 3 有反例；D = 2 无横向振子。
       ⚠ 路线卡 worldsheet.critical-dimension-light-cone 的陈述**尚未**加这条限定
       （本次任务不动路线卡文本）。本卡 (I) 因此**弱于**该路线卡，方向安全；
       路线卡本身应另行换代补上 D ≥ 4，已在推导 --via-four-routes 的 gaps 中登记。
    N3 → (V) 首句由平铺断言「a = 1 与 D 无关地成立」改为路线卡的形状
       「**一致性要求** a = 1」，其中「一致性」显式定义为 (a)/(b)/(c) 三条之一。

