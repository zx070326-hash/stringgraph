id: worldsheet.virasoro-unique-central-extension
kind: proposition
title: Virasoro 代数是 Witt 代数唯一的非平凡一维中心扩张（H²(W, k) 一维）
statement: |
  设 k 是特征零的域。取 Witt 代数 W(k)（math.witt-algebra），以平凡模 k 为系数。

  (1) 二阶李代数上同调 H^2(W(k), k) 是**一维** k-向量空间，由 Virasoro 2-上循环

        γ(ℓ_m, ℓ_n) = ((m^3 − m)/12) δ_{m+n,0}

      的上同调类生成；特别地 [γ] ≠ 0，即由 γ 定义的中心扩张**不分裂**。

  (2) 因此：W(k) 的一维中心扩张按**扩张等价**（保持 k 与 W(k) 上恒等映射的交换图）
      分类为 H^2(W(k), k) ≅ k，其中 0 对应平凡（分裂）扩张 W(k) ⊕ k；
      非零类恰为 {λ[γ] : λ ∈ k^×}。

  (3) 全体非零类给出的李代数**互相同构**（把中心元重标度 C ↦ λ^{-1} C），
      且同构于 worldsheet.virasoro-algebra-v2 的 Vir(k)。
      故在李代数同构的意义下，Vir(k) 是 W(k) 唯一的非平凡一维中心扩张。

  【本节点不断言】
  (a) 高于一维的中心扩张、非平凡系数模的上同调、或 H^n (n ≠ 2) 的计算；
  (b) 特征非零或一般 ℚ-代数基环上的同一结论（来源都在特征零域上工作，见推导的 gaps）；
  (c) 任何形式化：本项目 formal/ 中**没有**这条结论，见推导的 gaps。
uses_conventions: [conv.virasoro-standard]
