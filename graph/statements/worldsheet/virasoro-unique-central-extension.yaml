tags: [cft, algebra, lie-algebra, cohomology, central-extension]
notes: |
  【本卡片是 worldsheet.virasoro-algebra 的拆分产物】（lead 裁决 2026-09-10，见 docs/ROADMAP.md 待拆清单）
  旧卡把这条断言写在定义卡的最后一句（「它是圆周上多项式向量场李代数（Witt 代数）的唯一
  非平凡中心扩张」）。它是一条**需要证明的命题**，不是定义的一部分，且未形式化；
  留在定义卡里会把整卡钉死在 rigorous，连带压低所有只用到括号关系的下游节点。
  现拆出为本卡片，定义部分见 worldsheet.virasoro-algebra-v2（formalized）。

  【为什么陈述里要区分「扩张等价」与「李代数同构」】
  H^2 分类的是**扩张等价类**，λ[γ] 与 [γ] 在 λ ≠ 0, 1 时是不等价的扩张（等价要求中心上是
  恒等映射），但对应的李代数同构（重标度中心元）。物理文献常把两者混为一谈说「唯一」；
  本节点把 (2)(3) 分开写，就是为了不让这个含混进入图。中心元的这一重标度自由度正是
  conv.virasoro-standard 用 c/12 固定归一化所消除的东西。

  【与本项目 Lean 实现的关系】worldsheet.virasoro-algebra-v2 在 Lean 中被**构造**为
  γ 对应的中心扩张（Mathlib `LieAlgebra.ofTwoCocycle`），即上述 (1) 中的那个上循环；
  但「[γ] ≠ 0」与「dim H^2 = 1」在本仓库中都没有证。
author: curator
created: "2026-09-11"
