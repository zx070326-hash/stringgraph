id: worldsheet.kac-determinant-level-two
kind: proposition
title: Verma 模低阶 Gram 元与 level-2 行列式：⟨L₋₁v, L₋₁v⟩ = 2h，det[{L₋₂v, L₋₁²v}] = 2h(16h² + 2h(c−5) + c)（张成集的 Gram，非基的 Gram）
statement: |
  设 R 是交换环且是 ℚ-代数（物理情形取 R = C），(c, h) ∈ R²，V(c,h) 是 Virasoro Verma 模
  （worldsheet.verma-module-v2），v := |c,h⟩ 是最高权向量，约定 conv.virasoro-standard。
  设 B 是 V(c,h) 上的**归一化逆变双线性型**，即 B 逆变（B(L_n x, y) = B(x, L_{−n} y)，
  见 worldsheet.shapovalov-form-uniqueness）且 B(v, v) = 1。记 ⟨x, y⟩ := B(x, y)。

  记 level-1 与 level-2 的三个显式降算符态

      a₁ := L₋₁ v,      a := L₋₂ v,      b := L₋₁² v = L₋₁ (L₋₁ v)。

  则：

  **(1) level 1**：⟨a₁, a₁⟩ = 2h。

  **(2) level 2 的三个 Gram 元**：

      ⟨a, a⟩ = 4h + c/2,      ⟨a, b⟩ = ⟨b, a⟩ = 6h,      ⟨b, b⟩ = 8h² + 4h。

  （⟨a,b⟩ = ⟨b,a⟩ 是 worldsheet.shapovalov-form-uniqueness (2) 的对称性，不是额外假设。）

  **(3) level-2 的 2×2 行列式**：

      ⟨a,a⟩⟨b,b⟩ − ⟨a,b⟩⟨b,a⟩ = 2h( 16h² + 2h(c − 5) + c )。

  **(4) 与 Kac 行列式 N = 2 的比较（本卡不断言二者相等，见【不断言】(a)）**：
  把 (3) 的右端配平后

      2h(16h² + 2h(c−5) + c) = 32 · (h − 0) · (h − h_{1,2}(c)) · (h − h_{2,1}(c)),

  其中 h_{1,2}, h_{2,1} 是二次因子 16h² + 2h(c−5) + c 的两根，满足

      h_{1,2} + h_{2,1} = (5 − c)/8,        h_{1,2} · h_{2,1} = c/16。

  这与 worldsheet.kac-determinant 在 N = 2 处的形状逐项吻合：
  rs ≤ 2 的指标恰为 (1,1)、(1,2)、(2,1)，指数分别为 p(2−1) = p(1) = 1 与 p(2−2) = p(0) = 1；
  h_{1,1}(c) = 0；两根之和与之积与 Kac 公式一致（核对见 notes）；
  且此处的常数是 **α₂ = 32 > 0**。

  【本节点明确**不**断言】
  (a) **(3) 是「level-2 的 Kac 行列式」**。Kac 行列式是 Gram 矩阵在 V_2 的一组**基**上的行列式；
      {a, b} 只被证明**落在** V_2 里。它们**张成** V_2（V_2 的定义是 2 的全体合成 [2]、[1,1]
      所给词的张成），但**线性无关**没有证——那正是 PBW
      （math.verma-module-free-over-negative-part 的 (2)(3)：dim V_2 = p(2) = 2）。
      ⇒ (3) 是**张成集的 Gram 行列式**。若 {a, b} 线性相关（在 V(c,h) = 0 时它们都是 0），
      (3) 仍成立但与「基的 Gram 行列式」无关。
  (b) **B 的存在性**。本卡的一切都以「设 B 是归一化逆变型」为前提；
      存在性见 worldsheet.shapovalov-form-existence（条件的），无条件版本要 V(c,h) ≠ 0。
  (c) **一般 N 的行列式公式**。见 worldsheet.kac-determinant（rigorous，未形式化）。
      本卡只做 N = 1, 2。
  (d) **零点的表示论含义**：(1)(3) 的零点与奇异向量/可约性的对应关系不在本卡内。
      （h = 0 时 (1) 为零，对应真空模的 level-1 零向量 L₋₁|0⟩——这条**解释**本卡不承载。）
  (e) 任何正定性/酉性；B 是 R-双线性型，R 上无序结构。
  (f) **α_N 对一般 N 的正性**。本卡只给出 N = 2 的常数 32。
uses_conventions: [conv.virasoro-standard, conv.verma-module-notation]
