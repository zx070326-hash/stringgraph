id: worldsheet.bc-ghost-hermitian-conjugation
kind: definition
status: rigorous
title: bc 鬼场的厄米共轭 b_n† = b_{−n}、c_n† = c_{−n} 与鬼场零模内积归一化
statement: |
  设定与记号沿用 worldsheet.brst-quantization：权 (λ, 1−λ) = (2, −1) 的 bc 系统，
  模 b_n、c_n，{b_m, c_n} = δ_{m+n,0}，其余反对易子为零；二重简并的鬼场基态
    |↓⟩,  |↑⟩ = c_0|↓⟩,   b_n|↓⟩ = c_n|↓⟩ = 0 (n > 0),  b_0|↓⟩ = 0。

  **厄米共轭**在鬼场 Fock 空间上定义为反线性反自同构，满足
    b_n† = b_{−n},   c_n† = c_{−n}     （所有 n ∈ Z）。
  （注意这一取法与 λ = 2 无关，是把 b(z)、c(z) 取成"厄米"场的模式版本。）

  **零模部门与内积归一化**：b_0、c_0 生成二维 Clifford 代数 {b_0, c_0} = 1，
  在 span{|↓⟩, |↑⟩} 上的表示给出
    ⟨↓|↓⟩ = 0,   ⟨↑|↑⟩ = 0,   ⟨↓|c_0|↓⟩ = ⟨↓|↑⟩ = 1（**本节点固定的归一化**），
  从而 ⟨↑|b_0|↑⟩ = ⟨↑|↓⟩ = 1（取实内积；若取厄米内积则为 ⟨↓|↑⟩ 的复共轭）。
  换言之，**鬼场基态自身的内积为零，必须插入一个鬼场零模才非零**：
  形如 ⟨A|B⟩ 的鬼场矩阵元非零要求 A 与 B 的鬼数之差恰好补齐一个 c_0（或 b_0）。

  **相对复形上的内积**：在相对子空间
    C_rel = { |Ψ⟩ : b_0|Ψ⟩ = 0, L^tot_0|Ψ⟩ = 0 }
  上，上面的内积恒为零（因为 C_rel 中的态都没有 c_0 激发），故必须改用
    ⟨Ψ, Ψ'⟩_rel := ⟨Ψ| c_0 |Ψ'⟩,
  它在 C_rel 上是非退化的（不定的）厄米形式。这就是 worldsheet.no-ghost-theorem-brst 与
  worldsheet.brst-cohomology-equals-ocq-physical 陈述里用的那个 ⟨·,·⟩_rel。

  ⚠ **这是一次非平凡的选择，不是自动的**：Fock 空间上的"自然"内积在 C_rel 上退化，
  插入 c_0 是为恢复非退化性而做的约定。无鬼定理断言的正定性是**这个**形式的正定性。
uses:
  - worldsheet.brst-quantization-v2
uses_conventions: [conv.virasoro-standard]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.3, eq. (4.3.17a,b,c)（α^{μ†}_m = α^μ_{−m}、b^†_m = b_{−m}、c^†_m = c_{−m}）、eq. (4.3.18a,b)（开/闭弦基态内积，需 c_0（与 c̃_0）插入），p.134"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——式号与内容确认，
      **并查明「新内积」那条正文断言的实质**】

      (4.3.17a,b,c) 与 (4.3.18a,b) 的式号与内容逐字确认，「表达式与归一化未核对原书」撤销。

      ★ [S] 目录里那条无编号的 `The Need for a New Inner Product on Ĥ` 对应的原书正文
      **就是 p.135 的这一段**（逐字）：
        "The inner product (4.3.18a) is not quite the correct one to use in `Ĥ`. It is not well
         defined: the ghost zero modes give zero, while the δ²⁶(k−k') contains a factor δ(0)
         because the momentum support is restricted to the mass shell. **Therefore we use in `Ĥ`
         a reduced inner product ⟨ ‖ ⟩ in which we simply ignore the X⁰ and ghost zero modes.**
         It is this inner product that will be relevant for the probabilistic interpretation."

      → **三点后果（本图先前一条都没记）**：
        (1) **§4.4 无鬼定理里用的不是 (4.3.18a)，而是这个人为约化的内积 ⟨ ‖ ⟩**；
        (2) 原书给出的**理由是 (4.3.18a) 本身没有良定义**（鬼场零模给零、δ²⁶ 含 δ(0)），
            即这不是一次方便的选择而是一次**必要的修补**；
        (3) 「忽略 X⁰ 与鬼场零模」是一次**非平凡的人为选择**，形式化时必须显式写进去，
            否则 (4.4.20) 的正定性断言无从表述。
      本节点采用的 ⟨↓|c_0|↓⟩ = 1 是另一种处理鬼场零模的写法（插入 c_0 而非忽略零模），
      **与原书的 ⟨ ‖ ⟩ 是否给出同一个诱导内积，本图仍未验证**——这条缺口不但没消除，
      现在还知道了它两端各是什么。已同步记入 worldsheet.no-ghost-theorem-brst--via-polchinski-4-4 的 gaps。
      见 literature/extractions/polchinski-1998-v1.md §12.3（E62–E67）与 §12.10 表 B 第 10 项、表 C 第 7 项。
  - ref: polchinski-1998-v1
    loc: "§4.4, **eq. (4.4.20)**（⟨ψ‖ψ'⟩ = ⟨ψ_0‖ψ_0'⟩，无鬼定理的正定性断言所用的内积就是 p.135 的约化内积 ⟨ ‖ ⟩）"
    note: |
      【原书核实 2026-09-11，L1】⚠ 订正：旧 loc 写「(4.4.23)（无鬼定理证明末尾的内积）」，
      式号错位——**(4.4.23) 是 OCQ 侧的 Q_B|ψ,↓⟩ = Σ_{n≥0}c_{−n}(L^m_n − δ_{n,0})|ψ,↓⟩**，
      正定性的内积等式是 **(4.4.20)**。
      「⟨↓|c_0|↓⟩ = 1 未与 Polchinski 逐字核对」这条缺口**仍然成立**，且现在定位更准：
      原书那一侧根本不是 (4.3.18a)，而是 p.135 的约化内积。
  - ref: polchinski-1998-v1
    loc: "**Appendix A §A.2, eq. (A.2.18a,b), p.343**（L1 页图逐字）：两个可选内积 **(A) `⟨↑|↑⟩ = ⟨↓|↓⟩ = 1 , ⟨↑|↓⟩ = ⟨↓|↑⟩ = 0`**、**(B) `⟨↑|↓⟩ = ⟨↓|↑⟩ = 1 , ⟨↑|↑⟩ = ⟨↓|↓⟩ = 0`**，随后逐字「Inner product (A) is positive definite and gives `ψ̂† = χ̂`. It is the inner product for an ordinary physical oscillator. **Inner product (B) is not positive, and it makes `ψ̂` and `χ̂` Hermitean. It is the appropriate inner product for the Faddeev–Popov ghost system, as discussed in chapter 4.**」"
    note: |
      **【2026-09-11 新增第二个 L1 来源（curator-v1-sec15，researcher 第九轮 App. A 页图，印刷 p.343）】**
      本节点零模部门的内容（`⟨↓|↓⟩ = ⟨↑|↑⟩ = 0`、`⟨↓|↑⟩ = 1`、`b`/`c` 取厄米）此前只挂在
      **§4.3 (4.3.17)/(4.3.18)** 上；现在附录 A 给了第二个独立位置，且**把「非正定」与
      「`ψ̂`、`χ̂` 厄米」明确绑成一句话**——这正是本卡 statement 里
      「`b_n† = b_{−n}`、`c_n† = c_{−n}` ⇒ 基态自身内积为零」的结构性来源。
      记号对应：**A.2 用的是一般费米振子 `ψ̂`、`χ̂` 与两态 `|↓⟩`、`|↑⟩ = χ̂|↓⟩`**，
      本卡用 `b_0`、`c_0` 与 `|↑⟩ = c_0|↓⟩`；`{ψ̂, χ̂} = 1` (A.2.1c) ↔ `{b_0, c_0} = 1`。
      ⚠ **A.2 通篇不出现字母 `b`、`c` 作为鬼场名，也不写 `bc` 系统的作用量**（抽取记录 §15.2(c) 第 3 条、
      §15.2(g) 第 2 条）：它给的是**一般两态费米振子**加上一句「哪个内积属于 FP 鬼」，
      `bc` 系统本身在 §3.3 / §4.3。故本源**只支撑零模内积的符号结构**，不支撑本卡任何 `n ≠ 0` 的内容。

      ★★ **同段还有一句必须一起记的话（逐字，p.343，紧接 (A.2.18b) 的说明之后）**：
        "**The derivation of the path integral was independent of the choice of inner product**,
         but the relations (A.2.14) determine the expansion of `⟨ψ|` in basis states in terms of
         the inner product."
      ⇒ **禁令（本图规则，抽取记录 §15.2(c) 第 2 条）**：
        **不得把「`bc` 鬼场路径积分」画成依赖「内积非正定」的边。**
        原书明说路径积分的推导与内积选择无关；非正定内积只影响**态空间的解释**
        （以及 `⟨ψ|` 在基态上的展开系数，见 (A.2.14)）。
        任何这样的依赖边都与本条 L1 逐字冲突，reviewer 可据此直接判错。
      见 literature/extractions/polchinski-1998-v1.md §15.2(c)。
  - ref: fgz-1986
    loc: "§2（Λ^∞_* 上的形式与 Theorem 2.8 中的 unitary isomorphism）"
    note: |
      数学侧：FGZ 在半无限形式空间上用的是使 Theorem 2.8 的同构成为 unitary 的那个形式。
      **FGZ 是否与本节点的 ⟨↓|c_0|↓⟩ = 1 归一化一致，本图未核实**；两者相差的整体常数
      不影响正定性断言（正定性对正数倍不变），但会影响任何绝对归一化的比较。
tags: [brst, ghosts, bosonic-string, inner-product, quantization]
notes: |
  为什么单建节点：worldsheet.no-ghost-theorem-brst、
  worldsheet.brst-cohomology-equals-ocq-physical、
  worldsheet.no-ghost-theorem-brst--via-polchinski-4-4 三处都在 statement/summary 里
  写"归一化 ⟨↓|c_0|↓⟩ = 1"，却没有节点承载它，也没有地方记录"这是一次选择"。
  抽取记录 E66 的备注原话：「**内积的定义是无鬼定理的核心，Polchinski 在这里做了一次非平凡的
  选择，转节点时应显式列为依赖。**」本节点即为此建。

  **鬼数与厄米性的相互作用**：由 b_n† = b_{−n}、c_n† = c_{−n}，鬼数算符 gh 满足
  gh† = −gh + const（依赖真空归一化），所以非零矩阵元把鬼数**配对**而不是保持鬼数。
  这就是"⟨↓|↓⟩ = 0，必须插 c_0"的结构性原因，也是 Polchinski 取对称归一化
  gh(|↓⟩) = −1/2 的动机（那使 gh 反自伴）。
  本图在 worldsheet.brst-quantization 中取的是 gh(|0⟩) = 0、gh(|↓⟩) = 1，
  与 Polchinski 相差常数平移 3/2；本节点沿用本图的取法。

  status: rigorous 的理由：本节点是二维 Clifford 模上的内积约定 + 模式的伴随关系，
  纯代数、无收敛问题；uses 只连 worldsheet.brst-quantization（本身 rigorous 的代数节点）。

  **【2026-09-11 换代提示】** 上文（statement 首句与本 notes）提到的
  worldsheet.brst-quantization 已写 superseded_by 指向
  **worldsheet.brst-quantization-v2**，本节点的 `uses` 边已就地换到 v2。
  两版在本节点用到的一切（bc 模式代数、|↓⟩ = c_1|0⟩ 与 |↑⟩ = c_0|↓⟩、{b_0,c_0} = 1、
  gh(c_n) = +1/gh(b_n) = −1、gh(|0⟩) = 0）**逐字相同**；v2 的唯一改动是把鬼场中心荷
  c^g 从数值 −26 改回符号（取值移到 worldsheet.bc-ghost-central-charge），
  而 c^g 不进入本节点的任何一句话。statement 文本按不可变原则保留旧 id 的写法，
  旧 id 仍可解析。本节点的 status 与有效状态不变（v2 同为 rigorous）。
