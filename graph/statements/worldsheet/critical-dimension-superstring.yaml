sources:
  - ref: polchinski-1998-v2
    loc: "§10.1, eq. (10.1.20), p. 4（(II) 的结论：'The ghost central charge is then −26 + 11 = −15, and the condition that the total central charge vanish gives the critical dimension' 0 = (3/2)D − 15 ⟹ D = 10；**式号与内容均已 L1 核实**）"
    note: |
      本卡定位最强的一处，也是原书唯一把 D = 10 写成带式号公式的地方。
      ⚠ 但它把 c^m = (3/2)D 与总中心荷条件合在一个式子里；本卡按项目记账原则拆开。
  - ref: polchinski-1998-v2
    loc: "§10.5, p. 24, **(10.5.23) 下方一段（无式号）**（(I) 的结论 c^m = c̃^m = 15 与其周期性附加条件；逐字见 worldsheet.critical-dimension-superstring-brst 的 sources）"
    note: |
      L1。★ **本卷没有把「Q_B² = 0 ⟺ c^m = 15」写成带式号的公式**，
      抽取记录 E37 明确要求 loc 只能写「§10.5, p. 24, (10.5.23) 下方一段」，**不要编式号**。
      这是本卡与玻色弦汇总卡的一处实质差别（那边 (III) 有 Vol.1 (4.3.10)）。
  - ref: polchinski-1998-v2
    loc: "§10.1, eq. (10.1.14), p. 3（公共输入 c^m = (3/2)D：'Each scalar contributes 1 to the central charge and each fermion 1/2'）；(10.1.19), p. 4（鬼场 c^g = 9 − 12λ，λ = 2 给 −15）"
    note: L1（E8、E11）。
  - ref: polchinski-1998-v2
    loc: "§10.7, pp. 32–35（(III)：Z^α_β 与 (10.7.9)、(10.7.14)；逐字 'It is necessary for the construction of this invariant that there be a multiple of eight transverse fermions.'）"
    note: L1（E47）。
  - ref: polchinski-1998-v2
    loc: "§10.5 开头段, p. 20（(II) 的逻辑地位限定：本书不走超-diff × 超-Weyl 规范固定那条路，把超共形对称性定义为约束）"
    note: |
      L1（E33）。★ 抽取记录把这一条列为「对本项目极重要」：
      它是超弦分支**没有** Weyl 反常路线的直接原因。
  - ref: polchinski-1998-v2
    loc: "§11.1, eq. (11.1.2a,b), p. 46–47（鬼场中心荷通式 c_h = (−1)^{2h+1}[3(2h−1)² − 1]，c_2 = −26、c_{3/2} = +11；式号与表达式均已 L1 核实）"
    note: |
      按抽取记录 Q11 的建议引入：这条通式把 c^g = −15 的两个来源统一成一条，
      且比 Vol.1 (2.5.12)/(2.5.24) 的分立写法定位更强。
      ⚠ 只引用这条**公式**，不引用 §11.1 的分类结论（那带作者自己的完备性警告）。
tags: [superstring, critical-dimension, central-charge, brst, modular-invariance, summary]
notes: |
  【本卡的格式沿用 worldsheet.critical-dimension-bosonic-v2】按 lead 的要求，
  路线**分列**，不压平：每条路线写清自己的前提、结论、以及**不**给出什么。
  与玻色弦汇总卡的三处实质差别，读者必须知道：
    (a) **路线更少**：玻色弦四条（光锥、旧协变、BRST、Weyl 反常），超弦只有两条，
        且其中 (II) 在本卷不被论证；
    (b) **没有光锥路线**：因此超弦的截距不由任何洛伦兹代数闭合条件定出（本卡的 (IV)）；
    (c) **BRST 路线没有显式公式**：Vol.1 有 (4.3.10)，Vol.2 只有一段无式号正文加两道习题。
  综合起来：**本图对 D = 10 的支撑明显弱于对 D = 26 的支撑**，
  这不是记账问题，是文献本身的状况。

  【引用建议】只需要其中某一条时请直接依赖对应的路线节点，不要依赖本汇总卡片：
    (I)  worldsheet.critical-dimension-superstring-brst
    (II) worldsheet.critical-dimension-superstring-anomaly
    (III) worldsheet.modular-invariance-requires-eight-transverse-fermions
    公共输入 worldsheet.rns-matter-central-charge、worldsheet.superconformal-ghost-central-charge

  【与 ms.critical-dimension-superstring 的关系】docs/ROADMAP.md 记该里程碑
  「待 §10–11 入图后起草」。本卡是它的候选指向节点。起草者应特别注意本 notes 的
  (a)(b)(c) 三条差别与【"独立"的确切含义】一节的最后一句
  （「本卷对 D = 10 只有一条实质论证加一条重述」）。
