id: worldsheet.ddf-operators-adjoint-v2
kind: proposition
title: DDF 算子在动量塔的双线性型下互为伴随：(A^ε_n)† = A^ε_{−n}（v2：只含伴随关系本身，不含 Gram 矩阵推论；一切 n ∈ Z，ε 只需横向）
statement: |
  【本卡与 worldsheet.ddf-operators-adjoint 的两处实质差别】
  (a) **拆卡**：旧卡把 (1) 伴随关系与 (2) H^⊥(k) 的 Gram 矩阵推论捆在一张卡上；
      (2) 已由 worldsheet.transverse-ddf-fock-gram-matrix 以**条件命题**的形式单独承载
      （lead 裁决 2026-09-11）。本卡**只含 (1)**。
  (b) **量词放宽**：旧卡写 n ∈ Z \ {0}、i = 2..D−1（正交归一横向标架）、并把类光性 k_0² = 0
      与归一化 2α' k_0·p = 1 写进前提。本卡写 **n ∈ Z（含 n = 0）**、**ε 只需横向 ε·k_0 = 0**、
      并且**不**把 k_0² = 0 与 2α' k_0·p = 1 列为本命题的假设——它们仍是 DDF 数据的一部分
      （worldsheet.ddf-operators-v6 的 (N)(S)），但伴随关系不使用它们。理由见 notes。

  【数据与记号】沿用 worldsheet.ddf-operators-v6：固定 D ∈ N 与交换 Q-代数 R，
  对角时空度规分量 η_μ（conv.metric-mostly-plus，η_μ² = 1），α'（conv.alpha-prime-regge）；
  基点动量 p、参考向量 k_0、偏振 ε；重标度向量 a^μ := (2α')^{1/2} p^μ、b^μ := (2α')^{1/2} k_0^μ。
  按 worldsheet.momentum-tower-fock-space 取动量塔
    T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)，
  ⟨·,·⟩_T 是它的**层间正交**的 R-双线性型（那张卡的 (2)，约定式定义）。
  设横向性
    (T) ε·k_0 = 0    （等价：η(ε, b) = 0）
  成立——这是 worldsheet.ddf-operators-v6 定义 A^ε_n 的参数，没有它模态和不是有限和、
  A^ε_n 这个符号没有指称对象。在 (T) 之下
    A^ε_n := Σ_{m ∈ Z} (ε·α_m) V^{(n)}_m ,   n ∈ Z
  是 T(p;k_0) 上处处有定义的 R-线性算子（worldsheet.ddf-transversality-gives-local-finiteness-v2）。

  (1) **伴随关系**。对一切 n ∈ Z（**含 n = 0**）与一切 v, w ∈ T(p;k_0)：

        ⟨ A^ε_n v , w ⟩_T  =  ⟨ v , A^ε_{−n} w ⟩_T,

      即在塔的双线性型意义下 **(A^ε_n)† = A^ε_{−n}**。
      （A^ε_n 把第 N 层送到第 N+n 层，A^ε_{−n} 把第 N+n 层送回第 N 层，
      故等式两侧的配对落在同一层上——层间正交下唯一可能非零的配置。）
      取 ε = e_i（横向标架，e_i·k_0 = 0、e_i·e_j = δ^{ij}）即得文献记号的
      **(A^i_n)† = A^i_{−n}**。

  (2) **两条被显式排除在假设之外的条件**（这是本卡相对旧卡的信息量所在）：
      (a) **类光性 k_0² = 0 不是 (1) 的假设。** (1) 对任意 k_0 成立。类光性在 DDF 数据中
          仍然必需，但它的作用在别处：保证 k_0·p 沿整条塔不变（从而 (S) 一次取定即对整条塔成立），
          以及保证 V^{(n)}_K 的洛朗指标位移 K ↦ K − n 与层指标无关（见
          worldsheet.vertex-operator-adjoint 的同名讨论）。
      (b) **归一化 2α' k_0·p = 1 不是 (1) 的假设。** 同上，它只进入洛朗指标的整数性记账。
      两条都**不**进入伴随关系的论证。

  【本卡**不**断言什么】——六条边界：
  (a) 「†」是 **R-双线性型 ⟨·,·⟩_T 意义下的转置**，不是 Hilbert 空间的 Hermitian 共轭。
      与 worldsheet.momentum-tower-fock-space 边界 (d)、worldsheet.fock-indefinite-form 的
      notes【2026-09-11（二）】、worldsheet.virasoro-generators-adjoint 边界 (a)、
      worldsheet.vertex-operator-adjoint 边界 (a) 是同一条限定：物理上的协变 Fock 空间是复空间、
      带 Hermitian 半双线性形式，其上的 † 还含一次复共轭；两者在实极化下一致，
      **复情形本图与 Lean 侧均未做**。这条对无鬼定理尤其要紧，因为无鬼定理断言的是
      Hermitian 形式的半正定性。
  (b) **不**断言 H^⊥(k) 的 Gram 矩阵是什么，也**不**断言它正定。那是
      worldsheet.transverse-ddf-fock-gram-matrix（条件命题，把本卡 (1) 写成它的前件 (H2)）。
      本卡只给伴随关系一条。
  (c) **不**断言 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}（那是 worldsheet.ddf-transverse-oscillator-algebra-v2），
      也**不**断言 [L_m, A^ε_n] = 0（那是 worldsheet.ddf-commute-with-virasoro）。
      本卡与这两条**逻辑独立**：伴随关系的论证不使用任何两个 DDF 算子之间、
      或 DDF 与 Virasoro 之间的对易关系。
  (d) **不**断言 A^ε_n ≠ 0，**不**断言 DDF 态张成横向物理谱，**不**断言 H^⊥(k) → H_phys/H_0
      是等距同构（那是 worldsheet.no-ghost-theorem-v4 的 (1b)）。
  (e) **不**断言层间正交是**被证明的**。它是 worldsheet.momentum-tower-fock-space (2) 的
      约定式定义（物理上对应 ⟨p|p′⟩ ∝ δ^D(p−p′)，本图无节点承载 δ 归一化）。
      本卡 (1) 跨层，因而实质使用这条约定。
  (f) **不**覆盖围道积分写法。本卡的 A^ε_n 是模态和（worldsheet.ddf-operators-v6）；
      两种写法的等价是 worldsheet.ddf-contour-equals-mode-sum，那条仍是 physical-argument。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
formal:
  lean_decl: StringFormal.NoGhost.Fock.towerPairing_ddfOp_left
  lean_file: StringFormal/NoGhost/VertexAdjoint.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/VertexAdjoint.lean :: StringFormal.NoGhost.Fock.towerPairing_ddfOp_left（本卡 formal.lean_decl，即 (1)）；镜像 Fock.towerPairing_ddfOp_right；逐项版本 Fock.towerPairing_ddfSummand_left（(α^ε_j V^{(n)}_j)† = α^ε_{−j} V^{(−n)}_{−j}）；偏振模 Fock.towerPairing_towerModeVec_left（(α^ε_p)† = α^ε_{−p}）；顶点算子半 Fock.towerPairing_towerVertex_left；定义与窗口 formal/StringFormal/NoGhost/DDFOperator.lean :: StringFormal.NoGhost.{ddfOp, ddfOp_apply, ddfSummand, ddfWindow, ddfSummand_apply_eq_zero_of_notMem_window, towerModeVec, towerModeVec_mul_towerVertex_of_transverse}"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry；lead 以 **fb006f5** 合入 main
      （formal 侧提交 8b4e706）。该文件 16 条声明，formalizer 自述公理只有
      propext / Classical.choice / Quot.sound（文件末 "## Status" 一段逐字：
      "Complete, no `sorry`; axioms are `propext`, `Classical.choice`, `Quot.sound` only."）。
      **curator 未自行重跑 `lake build`**；合并前应由 lead 跑 `uv run stringgraph check-axioms`。
      Lean 侧本定理的假设逐字只有 `hη : ∀ μ, η μ * η μ = 1` 与 `hεb : dotVec η ε b = 0`
      （后者本来就是 `ddfOp` 的参数），这正是本卡 (2)(a)(b) 的依据；
      该文件的 `towerPairing_ddfOp_left` 文档注释逐字：
      "In particular neither `k_0² = 0` nor the normalisation `2α' k_0·p = 1` is needed —
      those are what make `A^ε_n` commute with the Virasoro generators, not what makes it
      have an adjoint."
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      文献侧本命题的所在处，**只承载语境，不承载论证**。核实等级沿用
      worldsheet.ddf-operators-v5 / worldsheet.ddf-operators-adjoint：章节页码 L4/L2
      （literature/extractions/brst-cohomology-sources.md §5.2–5.3），**式号与正文 L0**。
      教科书在此处对本命题**只写一句话**（「A^i_n 是厄米的」/「(A^i_n)† = A^i_{−n}」一类），
      不给推导、不给编号。GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写；
      GSW 取 α' = 1/2，其归一化写作 k_0·p = 1，是 (S) 的特例。
      ⚠ GSW 写的是围道积分而非模态和（见边界 (f)）。
  - ref: goddard-2008
    loc: "arXiv:0802.3249，无鬼定理一节（把物理态写成 DDF 态 + 零模态，并按横向振子 Fock 空间计数其正定内积）"
    note: |
      作者本人的历史综述（L3，二手）。它**预设**本命题——「DDF 态按横向振子 Fock 空间计数
      且内积正定」若无 (A^i_n)† = A^i_{−n} 便算不出任何 Gram 矩阵——但**不给证明、不给编号**
      （brst-cohomology-sources.md §3.1 第 1 条）。只作为「这是文献中被默认使用的标准事实」
      的二手证据，不承载论证。
  - ref: goddard-thorn-1972
    loc: "eq. (3)–(6)（式号未核实；正文未获取）"
    note: |
      DDF / 谱生成代数的原始出处链条。式号沿用旧节点 worldsheet.ddf-operators，
      **未与原文核对**（brst-cohomology-sources.md §3.1：GT 1972 正文四条获取路径全部失败）。
      摘要只有「absence of ghosts for d ⩽ 26」一句，不含伴随关系。
tags: [bosonic-string, spectrum-generating-algebra, fock-space, momentum-tower, adjoint, no-ghost]
notes: |
  【为什么新建 v2 而不是就地改旧卡】两条独立理由，都要求换代（根 CLAUDE.md 原则 1）：
  (1) **拆卡**。旧卡 worldsheet.ddf-operators-adjoint 的 (2)（Gram 矩阵推论）已于 2026-09-11
      拆到 worldsheet.transverse-ddf-fock-gram-matrix；旧卡 statement 仍带着 (2) 的全文，
      使它无法标 formalized——Lean 侧没有任何东西说 DDF 态有正模
      （VertexAdjoint.lean 文件头 "Remaining gaps" 第 1 条逐字：
      "nothing here says the DDF states have positive norm"）。
  (2) **量词放宽**。旧卡写 n ∈ Z \ {0}、i 取正交归一横向标架、并把 k_0² = 0 与 2α' k_0·p = 1
      写进前提；Lean 证的是 n ∈ Z（含 0）、ε 只需 ε·k_0 = 0、且**不用**那两条。
      放宽量词等于改陈述，必须换代。
  旧卡已加 `superseded_by: worldsheet.ddf-operators-adjoint-v2`，其 statement 一字未动。

  查重：2026-09-12 跑 `uv run stringgraph search adjoint / 伴随 / DDF / Gram`。
  既有的伴随类节点：worldsheet.virasoro-generators-adjoint（L_m† = L_{−m}，formalized）、
  worldsheet.fock-indefinite-form（(α^μ_n)† = α^μ_{−n}，formalized）、
  worldsheet.bc-ghost-hermitian-conjugation（b_n† = b_{−n}、c_n† = c_{−n}）、
  worldsheet.vertex-operator-adjoint（(V^{(n)}_J)† = V^{(−n)}_{−J}，2026-09-12 起 formalized）、
  worldsheet.p1-formal-adjoint（无关，P₁ 的 L² 伴随）。
  **除旧卡外没有任何节点断言 (A^ε_n)† = A^ε_{−n}。**

  【Lean 侧比本卡还一般的一处】`towerPairing_ddfOp_left` 用到 `dotVec η ε b = 0`
  **只因为 `ddfOp` 的定义用到它**（局部有限性）；它下面的 `towerPairing_towerVertex_left`
  完全不需要横向性。VertexAdjoint.lean 文件头逐字记了这一点：
  "`towerPairing_ddfOp_left` uses `dotVec η ε b = 0` only because `ddfOp` does;
  the underlying `towerPairing_towerVertex_left` needs no transversality."
  横向性在本命题中的真实作用是**把伴随重新排成 DDF 求和的书写顺序**
  （`towerPairing_ddfSummand_left` 里的 `towerModeVec_mul_towerVertex_of_transverse`：
  α^ε 与 V 两个因子对易，因为 ε·k_0 = 0 使它们之间无缩并），而不是使伴随存在。

  【与 worldsheet.virasoro-generators-adjoint 的关系】四条伴随关系现在是**同一机制的四个实例，
  且全部机器验证**：
    h = 1 的 ∂X^μ            → (α^μ_m)† = α^μ_{−m}        （worldsheet.fock-indefinite-form）
    h = 2 的 Sugawara L_m    → L_m† = L_{−m}               （worldsheet.virasoro-generators-adjoint）
    h = 0 的 :e^{i n k_0·X}: → (V^{(n)}_J)† = V^{(−n)}_{−J}（worldsheet.vertex-operator-adjoint）
    h = 1 的 ∂X^i e^{i n k_0·X} → 本卡
  旧卡 notes 写「本节点**不能**沿用 virasoro-generators-adjoint 的 formalized 状态，
  因为 A^i_n 含顶点算子，取伴随要把 E_+E_- 重排序，这一步本图与 Lean 侧都未做」——
  **【已消解 2026-09-12】那一步不存在**：V(b)_K = E₋(b)E₊(b) 是正规序，其伴随
  E₊(b)†E₋(b)† = E₋(−b)E₊(−b) **本身就是正规序**，产生因子自动落在左边，
  不需要换序，也不产生任何 c-数自缩并因子。详见 worldsheet.vertex-operator-adjoint 的
  notes【2026-09-12：Lean 接线】(ii) 与推导 --via-lean 的第 2 步。

  【本卡不承载的、仍然是 physical-argument 的两件事】
  (i) **围道 ↔ 模态和字典**（边界 (f)）：worldsheet.ddf-contour-equals-mode-sum。
      文献（GSW / GT）写的是围道积分，本卡写的是模态和；这条字典是
      worldsheet.no-ghost-theorem-v4--via-goddard-thorn 当前**唯一**剩下的 physical-argument 瓶颈。
  (ii) **层间正交**（边界 (e)）：约定，不是结论。

  【下游】worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 (1b) 步；
  worldsheet.transverse-ddf-fock-gram-matrix--via-oscillator-recursion 的前件 (H2)。
  两条依赖边已于 2026-09-12 由旧卡改指本卡。
