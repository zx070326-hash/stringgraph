notes: |
  由 curator 于 2026-09-11 从抽取记录 E89 建立。

  **与第 5 章的关系（待补边）**：Riemann–Roch κ − μ = 3χ（抽取记录 E75，(5.2.9)）在 S₂ 上给
  κ − μ = 6，与本命题的直接构造 κ = 6、μ = 0 互为佐证（[S] §6.67 正是这样用的）。
  第 5 章的节点由另一名 curator 建立，本批次提交时**尚未进入 main**，故本卡片把
  「共形 Killing 方程 ∂̄δz = 0」写进 statement 作为**前提**而不是依赖边，
  推导节点里标 inferred 并留 gap，**待 ch5 节点合入后补边**。

  **[S] 的一处笔误已订正**：他写「we thus need a_n = 0 for n > 3」，但由 δu = Σ a_n u^{2−n}
  的正则性得到的条件是 **n > 2**，且他下一句自己就说「only a₀, a₁, a₂ can be non-zero」。
  本卡片按 n > 2 写（抽取记录 E89 已指出这处前后矛盾）。

  **area 归属（reviewer-ch6 建议，2026-09-11）**：本命题的内容是「P¹ 的共形自同构群 / 全局全纯
  向量场」，更适合 cft 或 math area；现放 worldsheet 是沿用抽取记录 E89 的归类。
  id 不可改，日后换代时新建 cft.* 或 math.* 卡并给本卡写 superseded_by。

  **数学表述的对应**：本命题等价于「P¹ 上的全局全纯向量场空间是 sl(2,C)，dim_C = 3」。
  本图目前**没有**该数学事实的文献来源节点；若日后 researcher 登记一本复几何/黎曼曲面教材，
  可为本命题补一条 --via-<math-source> 的 rigorous 推导（见推导节点的 gaps）。
