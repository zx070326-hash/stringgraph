id: worldsheet.sphere-conformal-killing-group
kind: proposition
title: 球面的共形 Killing 向量为 δz = a₀ + a₁z + a₂z²，κ(S₂) = 6，共形 Killing 群是 PSL(2,C)
statement: |
  设 S₂ 按 worldsheet.tree-level-worldsheet-topologies 用两片坐标 z、u = 1/z 描述，
  并设共形 Killing 向量（CKV）定义为满足全纯条件 ∂̄ δz = 0（及其复共轭）的、
  **在整个 S₂ 上处处正则**的无穷小共形变换 δz。则：

  **(1)** 在 z 片上正则给出 Taylor 展开 δz = Σ_{n ≥ 0} a_n z^n；换到 u 片，
  由 δu = −z^{−2} δz 得 δu = Σ_n a_n u^{2−n}，要求在 u = 0 正则**当且仅当** a_n = 0 对一切 n > 2。
  故全局 CKV 恰为
    δz = a₀ + a₁ z + a₂ z²   （反全纯侧同理 δz̄ = ā₀ + ā₁ z̄ + ā₂ z̄²）。

  **(2)** 三个复参数 (a₀, a₁, a₂) 对应 **κ(S₂) = 6 个实 CKV**。

  **(3)** 相应的有限（整体）变换群是 Möbius 群
    z ↦ (α z + β)/(γ z + δ),  αδ − βγ = 1,  (α,β,γ,δ) 与 −(α,β,γ,δ) 认同，
  即 PSL(2,C) = SL(2,C)/{±1}。

  **本命题不断言什么**：不断言 S₂ 无模（μ = 0），也不由 Riemann–Roch 推出 κ = 6
  ——那是第 5 章的独立结果（见 notes 的「与第 5 章的关系」）；本命题是**直接构造**。
  不断言 PSL(2,C) 在 n 点函数上的作用方式（那在 cft.* 的 Möbius 固定诸节点）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§6.1, eq. (6.1.5a)（δz = a₀ + a₁z + a₂z²）与 (6.1.5b)（反全纯侧），p.166 起"
    note: |
      literature/extractions/polchinski-1998-v1.md#E89，等级 **L1**：式号 (6.1.5a)/(6.1.5b) 与内容
      由 schrans-2020 §6.2（笔记 p.277）给出，抽取者逐页读到。
      κ(S₂) = 6 在 [S] 中另有两处正文独立复述：§6.23「The sphere has six CKVs, see (6.1.5 a,b)」
      （笔记 p.296）、§6.67「…zero moduli and six conformal Killing vectors … 3χ = κ − μ = 6 − 0 = 6」
      （笔记 p.333）。
      ⚠ **「PSL(2,C)」这个记号本身写在原书哪一式未核实**（抽取记录 §7 的未核实清单）。
      ⚠ L1 只保证「[S] 这么写」，不保证原书这么写。
  - ref: schrans-2020
    loc: "§6.2（笔记 p.277）、§6.23（p.296）、§6.67（p.333）：内容的实际读取来源（核对源）"
  - ref: milicic-riemann-surfaces
    loc: "Theorem 1.5.2, p.6"
    note: |
      **数学侧来源（2026-09-11 由 curator-ckg-followups 补），L1 逐字**（math-sources.md §39.7.1）：
      「The homomorphism γ ⟼ φ_γ of PSL(2,C) into the group of all holomorphic automorphisms
      Aut(P¹) of the Riemann sphere is an isomorphism.」
      ⚠ **它直接支撑的是本卡的 (3)（整体群是 PSL(2,C)），而且比 (3) 更强**：
      它还断言 PSL(2,C) **穷尽** Aut(P¹)。本卡 (3) 只说「相应的有限变换群是 Möbius 群」，
      不断言穷尽性——穷尽性的承载节点是 math.automorphisms-of-riemann-sphere-are-mobius。
      ⚠ **它不直接给 (1)(2)**：从「自同构群」到「CKV 向量场空间、κ = 6」还要过桥 (B1)，
      见推导 worldsheet.sphere-conformal-killing-group--via-automorphism-group 的第一条 gap。
      ⚠ 该文件未印年份，bib key 不带年份，偏离 literature/CLAUDE.md 规范，待 lead 裁决。
  - ref: eynard-2018-lectures
    loc: "Ch. 5, Theorem 1.1, eq. (1-1), p.77"
    note: |
      **独立第二来源，L1 逐字**（math-sources.md §39.7(d)）：`ℳ_{0,0} = {(ℂP¹)}`，`Aut = PSL(2,ℂ)`。
      ⚠ 该讲义**每章内部重新计数**，loc 必须写「Ch. 5, Theorem 1.1」，
      只写「Theorem 1.1」会与 Ch. 4 的同号定理混淆。
      ⚠ 同一条还顺带给出 `ℳ_{0,0}` 是单点（μ(S₂) = 0 的旁证），
      但**本卡明写不断言 μ = 0**，故这半句不进本卡。
tags: [worldsheet, tree-level, sphere, conformal-killing-vector, mobius, psl2c]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E89 建立。

  **与第 5 章的关系（★ 2026-09-11 更新，curator-ckg-followups）**：原记录写「ch5 节点尚未进入 main，
  待合入后补边」——**已办**。两条推导现都挂了 worldsheet.conformal-killing-equation（(5.2.7)，
  CKV 的定义与方程）与 worldsheet.ckv-holomorphic-in-conformal-gauge（共形规范复坐标下 ⟺ ∂̄δz = 0）。
  **残余项**：Riemann–Roch κ − μ = 3χ（E75, (5.2.9)）在 S₂ 上给 κ − μ = 6，
  与本命题的直接构造 κ = 6、μ = 0 互为佐证（[S] §6.67 正是这样用的），
  但本图**仍不建那条边**：worldsheet.riemann-roch-kappa-minus-mu 正在被另一名 curator 换代，
  且 μ(S₂) = 0 那一半在图上还是断言。换代落地后由 lead 决定是否接。

  **[S] 的一处笔误已订正**：他写「we thus need a_n = 0 for n > 3」，但由 δu = Σ a_n u^{2−n}
  的正则性得到的条件是 **n > 2**，且他下一句自己就说「only a₀, a₁, a₂ can be non-zero」。
  本卡片按 n > 2 写（抽取记录 E89 已指出这处前后矛盾）。

  **area 归属（reviewer-ch6 建议，2026-09-11）**：本命题的内容是「P¹ 的共形自同构群 / 全局全纯
  向量场」，更适合 cft 或 math area；现放 worldsheet 是沿用抽取记录 E89 的归类。
  id 不可改，日后换代时新建 cft.* 或 math.* 卡并给本卡写 superseded_by。

  **数学表述的对应（★ 2026-09-11 更新）**：本命题等价于「P¹ 上的全局全纯向量场空间是 sl(2,C)，
  dim_C = 3」加上「Aut(P¹) = PSL(2,C)」。原记录写「本图没有该数学事实的文献来源节点」——**已部分办掉**：
  - **群那一半有了**：math.automorphisms-of-riemann-sphere-are-mobius（Miličić Thm 1.5.2，rigorous），
    新推导 worldsheet.sphere-conformal-killing-group--via-automorphism-group 走这条线。
  - **向量场那一半仍然没有**：「全局全纯向量场空间 = Lie(Aut)」这一步
    （math-sources.md §39.8 的桥 (B1)）在本项目登记的文献里**没有来源**，
    新推导对此明留 gap，故它的 status 仍是 physical-argument，**本卡的有效状态没有因此升高**。
  ⇒ 想让本卡到 rigorous，缺的是 (B1) 的来源（或 reviewer 对该步的复核记录），
  而**不是**再多找一本讲 Aut(P¹) 的教材。
