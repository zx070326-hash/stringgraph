      供给本卡「设定」段里被断言为零的那个对象的定义。
      **本图对应节点**：worldsheet.modular-invariance-requires-eight-transverse-fermions
      （其 statement 逐字含 Z^α_β = ϑ[α/2,β/2](0,τ)/η(τ) 与四个迹）。
  - ref: polchinski-1998-v2
    loc: "§10.2, eq. (10.2.19)–(10.2.24), pp. 8–9（exp(πiF) 的构造；(10.2.24b) exp(πiF)|s⟩_R = |s'⟩_R Γ_{s's}）"
    note: |
      L1（E22/E31）。**本图对应节点**：worldsheet.rns-fermion-number-operator。
      ⚠ **本条只供给 exp(πiF) 这个算符本身**；原书在 p.34 那句里**并不**回指 (10.2.24b)，
      也不用 Γ 矩阵的迹来论证 Z¹₁ = 0。⇒ 见「不断言 (b)(c)」。
tags: [superstring, rns, ramond-sector, gso, fermion-number, partition-function, theta-functions]
notes: |
  由 curator 于 2026-09-11（批次 theta-cards）建立。

  ★★★【本卡为什么存在】worldsheet.superstring-total-fermionic-partition-function-vanishes--via-spacetime-supersymmetry-jacobi
  的 gaps 第一条逐字点名要它：
    「**本推导真正用到的两条事实在本图都没有节点（主缺口）**：· **(10.7.16)** … ·**Z¹₁ = 0** ——
      原书在 §10.7 用到它 … 但**不写理由**（标准理由是 R 扇区带 (−1)^F 的迹上有费米零模）。
      ⇒ **待建**：· math.jacobi-abstruse-identity …；
        · **worldsheet.ramond-trace-with-fermion-number-vanishes（Z¹₁ = 0）**。」
  **本卡是其中第二条**（第一条同批建立）。

  ⚠⚠【一条重要更正：原书**确实**写了理由，只是理由不是那条 gap 猜的那个】
  上面那条 gap 写的是「原书**不写理由**（标准理由是 R 扇区带 (−1)^F 的迹上有费米零模）」。
  **researcher-theta 于 2026-09-11 取到 p.34 页图后证明这句话只对了一半**：
  原书**写了**理由——'**due to cancellation between the two R sector ground states**'——
  但**没有展开**（不给 ± 配平的计数，也不引文献）。
  ⇒ 本卡 statement 照录**原书的**理由，**不**把「费米零模」那个说法写进断言。
  ⇒ 「零模」路线只出现在唯一推导的 summary 里，并被标为**本图补的标准论证**（见那条推导的 gaps）。

  ⚠⚠【第二条更正：ϑ 路线不是原书的路线】
  由 (10.7.7c) 与 Vol.1 (7.2.42)（ϑ₁₁(0,τ) = 0）可得同一结论，但 **§10.7 全节不把两者联系起来**
  （researcher §5.3 要点 2 的硬裁定）。⇒ 本卡「不断言 (a)」把它挡在断言外，
  唯一推导对 math.jacobi-theta-functions 的边标 **inferred: true**。
  ⚠ 本图**还没有** (7.2.42) 的节点（math.jacobi-theta-functions 的「不断言 (c)」逐字排除了它）；
  **建议 lead 排期补建 `math.theta-11-vanishes-at-origin`**（由 θ 定义卡两行可证，可标 rigorous），
  届时本卡可加第二条推导 `--via-theta-11-vanishing`，但那条边**仍然要标 inferred**
  （原书不写这条路线），且需 η ≠ 0（math.dedekind-eta-nonvanishing，已 formalized）。

  【本卡与 worldsheet.modular-invariance-requires-eight-transverse-fermions 的关系（别读成循环）】
  本卡只从那张卡借**记号与被断言为零的对象**（Z^α_β 的定义、(10.7.8d)）。
  ⚠⚠ **绝不得反向**：按上面 statement 引的 p.35 逐字，原书**要求**模不变性的建立
  「*without* using the vanishing of Z¹₁」。⇒ 那张卡**不得**依赖本卡。
  这与 worldsheet.superstring-total-fermionic-partition-function-vanishes--via-spacetime-supersymmetry-jacobi
  对同一张卡的处理是同一条纪律（那条推导的 depends_on note 逐字：「**只借记号与对象，绝不借论证方向**」）。

  【这是本书两处「别把偶然相消当成一致性条件」的自我警告之一】
  另一处是 §10.8 脚注 7（p.39，逐字）：'In the vacuum amplitude the sum of the NS–NS and R–R
  divergences is zero for each topology separately because the trace vanishes by supersymmetry.
  **This is not sufficient**, because they will no longer cancel when vertex operators are added …'
  researcher 建议两条卡互相标注（§5.5(c) 逐字：「建议 curator 让两条卡互相 see_also」）。
  本图 schema 没有 see_also 字段 ⇒ 在此以 notes 互指：另一处在
  **worldsheet.superstring-total-fermionic-partition-function-vanishes 的断言 (3)**。
