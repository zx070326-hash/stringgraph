id: worldsheet.ramond-trace-with-fermion-number-vanishes
kind: proposition
title: "R 扇区带 exp(πiF) 的费米迹为零：Z¹₁(τ) = Tr_R[exp(πiF) q^H] = 0（原书理由：两个 R 扇区基态之间相消）"
statement: |
  **设定（是陈述的一部分）**：十维 RNS 超弦的世界面费米子。费米迹记号按
  worldsheet.modular-invariance-requires-eight-transverse-fermions
  （§10.7 (10.7.7a–c)、(10.7.8a–d)）：
    Z^α_β(τ) = Tr_α[ q^H exp(πiβQ) ] ，   q = exp(2πiτ) ，
  其中 α 标记空间周期性（R: α = 1、NS: α = 0），β 标记迹里是否插入 exp(πiF)，
  F 是世界面费米数（worldsheet.rns-fermion-number-operator）。
  ⚠ **这些迹是「对一对维数」取的**（原书 (10.7.8) 之后逐字：'We should emphasize that these
  traces are for a *pair* of dimensions.'）——故下面说的「两个 R 扇区基态」是**一对维数**上的
  R 基态个数，不是十维 R 基态的个数。

  **断言**：对一切 τ ∈ H，
      **Z¹₁(τ) = Tr_R[ exp(πiF) q^H ] = 0** 。
  **原书给出的理由（§10.7, p. 34, (10.7.14) 下方的无式号句，逐字）**：
    '**Note that `Z^1_1` actually vanishes due to cancellation between the two R sector ground
     states**, but we have assigned a formal transformation law for a reason to be explained below.'

  **⚠⚠ 必须与断言一起带走的一条（否则会被用错）**：即便 Z¹₁ = 0，**原书仍故意为 Z¹₁ 保留一条
  形式的模变换律**（(10.7.14) 里 α = β = 1 的那一项），理由在同节 p. 35 兑现，逐字：
    'However, with a general vertex operator insertion the α = β = 1 path integral will no longer
     vanish, nor will the sum of the other three. The general amplitude will then be
     modular-invariant provided that the vacuum is modular-invariant ***without* using the
     vanishing of `Z^1_1` or the abstruse identity (10.7.16) — as we have required.**'
  ⇒ **「Z¹₁ = 0，所以可以把它扔掉」是错的**；本卡的断言只对**无顶点算子插入的真空振幅**
    有用，且**不得**被用作「环面振幅模不变」那条陈述的依据。

  **本命题不断言什么**：
    (a) ⚠⚠ **不断言本式与 ϑ₁₁(0,τ) = 0 的关系**。由 (10.7.7c) Z^α_β = ϑ[α/2;β/2](0,τ)/η(τ) 与
        Vol.1 (7.2.42) ϑ₁₁(0,τ) = 0，两者等价（还需 η ≠ 0）；但 **§10.7 全节没有把两者联系起来**
        ——researcher 的复核逐字裁定：『原书给的理由是「两个 R 扇区基态之间相消」，**不是**
        Vol.1 (7.2.42) 的 ϑ₁₁(0,τ) = 0 … ⇒ 若 curator 想把
        ramond-trace-with-fermion-number-vanishes 接到 math.jacobi-theta-* ，**那条边是
        `inferred: true`**，Polchinski Vol.2 没写。』
        （literature/extractions/polchinski-1998-v2.md §5.3 要点 2）
        ⇒ 本卡**不把 ϑ 路线写进断言**；唯一推导对 θ 定义卡的那条边按此标 inferred。
    (b) **不断言「两个 R 扇区基态」这个计数的来源**。原书在 p.34 那句里**直接说「the two R
        sector ground states」**，既不推导、也不引 (10.2.17)/(10.2.18) 的 Clifford 构造
        （worldsheet.rns-ramond-zero-modes-clifford）。本卡照录原书的理由，不补它。
    (c) **不断言相消的逐态计数**。原书**不写** Tr_R[exp(πiF)] 在 R 基态上的 ± 配平，
        也不写激发态层面为何逐级相消。⇒ 见推导 gaps。
    (d) **不断言 Z¹₀ = Tr_R[q^H] 的任何性质**（它不为零；它的乘积展开在
        spectrum.long-cylinder-* 一带用到）。
    (e) **不断言 Z_ψ^± = 0、Z_{T₂} = 0 或任何逐拓扑相消**。那些在
        worldsheet.superstring-total-fermionic-partition-function-vanishes；本卡只是它的一件输入。
    (f) **不断言 (10.7.14) 的形式模变换律本身**（那在
        worldsheet.modular-invariance-requires-eight-transverse-fermions 的 statement 里）；
        本卡只照录「原书为何仍要给 Z¹₁ 一条形式变换律」这条限定。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
