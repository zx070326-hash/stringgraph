  - ref: polchinski-1998-v2
    loc: "§10.7, eq. **(10.7.8d)**（Z^1_1(τ) = Tr_R[exp(πiF) q^H]）与 (10.7.7a–c)、(10.7.8a–c), p. 33；逐字 'We should emphasize that these traces are for a *pair* of dimensions.'"
    note: |
