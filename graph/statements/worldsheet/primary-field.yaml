id: worldsheet.primary-field
kind: definition
status: rigorous
title: 共形权与主场（tensor / primary）
statement: |
  设 T(z) 是全纯能动张量（worldsheet.traceless-holomorphic-energy-momentum）。
  局域算子 O(0,0) 的**共形权** (h, h̄) 由与 T 的 OPE 定义：
    T(z) O(0, 0) ∼ … + (h / z^2) O(0, 0) + (1/z) ∂O(0, 0),
    T̄(z̄) O(0, 0) ∼ … + (h̄ / z̄^2) O(0, 0) + (1/z̄) ∂̄O(0, 0)。
  若该 OPE 中**没有比二阶更高的极点**（即上式中的 "…" 为零），则称 O 是**主场**
  （Polchinski 称之为 tensor 或 primary）。

  主场在共形变换 z → z'(z)、z̄ → z̄'(z̄) 下按
    O'(z', z̄') = (∂z'/∂z)^{-h} (∂z̄'/∂z̄)^{-h̄}  O(z, z̄)
  变换。非主场（如 T 自身、如 X^μ）的变换律带附加项。
uses:
  - worldsheet.traceless-holomorphic-energy-momentum
  - worldsheet.operator-product-expansion
  - worldsheet.ward-identity
uses_conventions: [conv.worldsheet-complex-coords]
sources:
  - ref: polchinski-1998-v1
    loc: "§2.4, eq. (2.4.14), p.45（**权 h 的一般定义**：T(z)A(0,0) = … + (h/z²)A(0,0) + (1/z)∂A(0,0) + …）、(2.4.15)（**主场的有限共形变换** O'(z',z̄') = (∂_z z')^{−h}(∂_z̄ z̄')^{−h̄}O(z,z̄)）、(2.4.16)（主场的 T·O OPE）、(2.4.17)（典型算子的**权表**：X^μ 为 (0,0)、∂X^μ 为 (1,0)、:e^{ik·X}: 为 (α'k²/4, α'k²/4)）；另 (2.4.11) 是 T·A 的一般展开、(2.4.6) 是 T·X^μ 的 OPE、(2.4.7) 是 δX^μ"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——三处式号订正】

      旧 loc 的三处错误：
      1. **有限共形变换是 (2.4.15)，不是 (2.4.16)**（[S] 把它错标成 (2.4.16)，差一号）。
         (2.4.16) 是主场的 T·O OPE `T(z)O(0,0) = (h/z²)O + (1/z)∂O + …`。
      2. **权的一般定义是 (2.4.14)，不是 (2.4.6)**。(2.4.6) 只是 `T(z)X^μ(0) ∼ (1/z)∂X^μ(0)`，
         即 X^μ 这一个算子的 T·X OPE，不是权的定义式。
      3. **(2.4.17) 是「典型算子的权表」，不是「典型算子的变换」**。

      ⚠ **本节点 notes 第 (1) 条与原书 (2.4.17) 之间有一处待裁定的张力**（curator-v1-locs 2026-09-11）：
      notes 写「X^μ 本身不是主场（(2.4.7)）」，而原书 (2.4.17) 的权表把 X^μ 列为权 (0,0)、
      (2.4.6) 的 T·X OPE 也只有单极点。原书是否在别处明说「X^μ 不是 tensor / primary」，
      本轮页图核实**没有覆盖到**（§12.1 只落实了式号，未转录 (2.4.17) 前后的正文）。
      在裁定前**不得**把「X^μ 不是主场」当作可引的原书结论；本条已上报 lead/auditor。

      **【2026-09-11 裁定已下达，本卡因此换代】** 抽取记录 §13.4（L1 页图，pp.43–49）取到
      (2.4.17) 正下方 p.47 第一行的逐字「**All transform as tensors except `∂²X^μ`.**」，
      主语是 (2.4.17) 权表里的全部五个算符。⇒ **在自由标量 CFT 里 X^μ 是权 (0,0) 的主场**，
      本卡 statement 与 notes 里的相反说法是错的。已换代到 worldsheet.primary-field-v2。

      见 literature/extractions/polchinski-1998-v1.md §12.1（E30/E31/E32）与 §12.10 表 B 第 25 项。
tags: [cft, primary-field, conformal-weight, definition]
superseded_by: worldsheet.primary-field-v2
notes: |
  ⚠⚠ **本卡已于 2026-09-11 换代（superseded_by: worldsheet.primary-field-v2），原因是下面第 (1) 条
  与 statement 末句「非主场（如 T 自身、如 X^μ）」都是错的。** 原书 p.47 第一行逐字
  「All transform as tensors except `∂²X^μ`」（(2.4.17) 权表正下方，L1 页图）⇒
  **自由标量 CFT 里 X^μ 是权 (0,0) 的主场**；「X^μ 不是 tensor」只对**线性 dilaton CFT**
  成立（§2.5 (2.5.3), p.49，那是另一个 CFT）。**本卡文本按项目原则 1 保持原样不改，
  以下内容只作历史记录，不得再被引用。**

  ── 以下为换代前的原文 ──
  两个易错点，均已核实存在于来源：
  (1) X^μ 本身**不是**主场（(2.4.7)），因为 T(z)X^μ(0,0) 的展开带 ln 项；权 (1,0) 的主场是 ∂X^μ。
      **【2026-09-11 已证伪，见上方】**
  (2) T 自身**不是**主场，其变换律多出正比于中心荷的 Schwarzian 项，
      见 worldsheet.schwarzian-transformation-of-t。

  本节点把「共形权」与「主场」两件事写在一起：权对任意算子都有定义（由二阶极点系数读出），
  主场是对同一 OPE 的额外条件。二者共用同一个 OPE，拆开会造成两个节点引用同一公式，
  故合为一条定义。
