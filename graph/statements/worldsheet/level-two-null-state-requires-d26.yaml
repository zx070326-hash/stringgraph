tags: [bosonic-string, no-ghost, ddf-spans, critical-dimension, null-state, momentum-tower, kac-determinant, lean, formalized]
notes: |
  【为什么立卡（curator，claim #490，依派活任务交付物 #1）】
  formal/StringFormal/NoGhost/NullSeedsTwo.lean 与 TowerVirasoro.lean（分支
  agent/formalizer/noghost-pr5-n2，合入 c4ace50）把"D=26 是 level-2 伪态物理的必要充分条件"
  第一次做成机器验证的等式；此前图上唯一承载这个机制的卡是
  worldsheet.ocq-null-state-two-families，其推导 status 只能是 physical-argument
  （手算，未经 Lean/reviewer 复核）。本卡把该卡 (2) 的 N=2 特例部分抽出，
  单独立卡承载已 Lean 化的这部分内容，是图上**第一张 D=26 作为机检对象上推出的方程**的卡。

  查重：2026-09-12 跑 `uv run stringgraph search level-two`、`search "null state"`、
  `search descTwo` 均无同内容命中（kac-determinant-level-two 系列是 Verma 模/Gram 矩阵的卡，
  对象不同；ocq-null-state-two-families 是一般 N 的手算版本，见下段分工）。

  【与 worldsheet.ocq-null-state-two-families 的分工，不是同一张卡】
  那张卡的 (2)（Type 2 族）对一般 N ≥ 2 断言 L₁χ₂(φ)、L₂χ₂(φ) 的公式，status 是
  physical-argument（该卡 sources note 逐字：「全部⟨手算⟩，未经 Lean 校验、未经 reviewer
  复核……status 只能是 physical-argument，不得更高」）。本卡只做 N=2 这一个特例，
  但**完全用 Lean 机检**，是该卡断言 (2) 在 N=2 处的一个独立、更严格的论证——
  两卡不 supersede，一个是一般 N 的手算骨架，一个是 N=2 的机检实例。
  本卡也补上了那张卡**没有**的一条：D=26 的必要性（该卡只证"L₂χ₂(φ)=0 当且仅当 c=26"，
  但从未把"必要性"包进一条单独可引用的 Lean 等价式；本卡 (3) = `descTwo_mem_towerPhysSubmodule_iff`
  把它做成了 iff）。

  【uses 列出的是记法/对象依赖，不是论证依赖】
  本卡的 `uses` 只列出**提供对象/记法**、供读者理解陈述里的符号的四张卡
  （塔、中心荷、H_null 定义、H_phys 定义）。它们各自是否被本卡的**机检证明链**实质消费，
  逐条记在配套推导 worldsheet.level-two-null-state-requires-d26--via-lean 的
  `depends_on` 里（该推导是 status: formalized 的承载处，遵循本图
  proposition 状态必须由推导计算、不得在 statement 上填写的规则）。

  【L₁𝒟₂φ=0 这一步的 Lean 精确对应，供审计】
  `towerLop_one_apply_descTwo` 只给出一般 h 的等式 `12*(h+1) • L₋₁φ`；本卡陈述 (1)
  把 h=−1（即 h0 : L₀φ=−φ）代入后读出"= 0"。这是把一般 h 版本在特定取值处求值，
  是纯代数化简（12·0=0），不需要额外引理，Lean 侧也不需要一条独立命名的定理，
  但为免误读，curator 把这一步的推理链在此写明：φ 满足 h0（h=−1）
  ⟹ `towerLop_one_apply_descTwo` 给出系数 12(−1+1)=0 ⟹ 右端 = 0 • L₋₁φ = 0。

  【与 Kac 侧孪生等式的关系，见 worldsheet.kac-determinant-level-two 的新 notes】
  `Fock.kacDet2_massShell_two : kacDet2 c (1-2) = 2*(c-26)`（对任意 c）与本卡的
  `L₂𝒟₂φ = (D-26)•φ` 是**两条独立计算**：前者是 Gram 矩阵行列式（2×2 矩阵的多项式展开），
  后者是算子直接作用在向量上的等式，两者数值上差一个整体因子 2（(D-26) vs 2(D-26)），
  这个因子差是 notes 里两条来源各自记账方式不同所致（本卡不做归一化统一，也不断言
  这是同一条恒等式的两种写法——见【不断言】(d)）。
