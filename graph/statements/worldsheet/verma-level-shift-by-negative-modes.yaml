id: worldsheet.verma-level-shift-by-negative-modes
kind: proposition
title: Verma 模的 level 移位：负模态 L_{−k}（k ≥ 1）把 V_N 送进 V_{N+k}——任意交换 ℚ-代数，对 (c,h) 无假设，不需要 V(c,h) ≠ 0
statement: |
  设 R 是交换环且是 ℚ-代数，(c, h) ∈ R²，V(c,h) 是 Virasoro Verma 模
  （worldsheet.verma-module-v2），|c,h⟩ 是最高权向量，V_N ⊆ V(c,h) 是 **level N 分量**
  （同上引节点：由 N 的全体**合成** b_1 + … + b_j = N (b_i ≥ 1) 所对应的负模态词
  L_{−b_1} L_{−b_2} … L_{−b_j} |c,h⟩ 张成的 R-子模；N = 0 时即 R·|c,h⟩）。则：

  **(1) 按自然数指标**：对一切整数 k ≥ 1、一切 N ∈ N、一切 x ∈ V_N，

      L_{−k} · x ∈ V_{N+k}，

  即 L_{−k}(V_N) ⊆ V_{N+k}。

  **(2) 按负整数指标（同一命题的重述）**：对一切整数 n < 0、一切 N ∈ N、一切 x ∈ V_N，

      L_n · x ∈ V_{N + |n|}。

  由 |n| ≥ 1 得目标 level **恒 ≥ N + 1 ≥ 1**，特别地**永远不是 0**。

  **本命题不需要的假设**：不需要 R 是域、不需要特征零以外的条件、对 (c, h) **没有任何限制**、
  **不需要 V(c,h) ≠ 0**（若 V(c,h) = 0 则两条平凡成立），也不需要 PBW 基或任何维数信息。
  理由见 notes：V_N 是**按词张成**定义的，不是按 L_0 本征子空间定义的。

  【本节点明确**不**断言】
  (a) **反方向**：正模态 L_k（k ≥ 1）把 V_N 送进 V_{N−k}（N ≥ k）或送到 0（N < k）。
      **本项目未做**：Lean 侧没有这条，图上也没有别的节点承载它。它需要把正模态推过一串
      负模态词（Virasoro 括号的重排，且会生成中心项），属 straightening 一类的计算。
  (b) V_N 之间的**直和/独立性**（⊕_N V_N），也不断言 ⨆_N V_N = V(c,h)。前者只在特征零的域上
      证到（worldsheet.verma-module-v2 的 `isInternal_levelSpan`），后者是同卡的
      `iSup_levelSpan_eq_top`。本卡只讲**一个**算子把**一个**子模送进**另一个**子模。
  (c) V_N ≠ 0、dim V_N = p(N) 或任何维数下界（那要 PBW，见
      math.verma-module-free-over-negative-part；上界见 worldsheet.verma-level-spanned-by-partitions）。
  (d) V_N **恰**是 L_0 的 (h+N)-特征子空间（那是 worldsheet.verma-module-v2 在
      `[Field K] [CharZero K]` 上的 `levelSpan_eq_eigenspace`）。本卡只用 V_N 的张成定义。
  (e) L_0 或中心元 C 在 V_N 上的作用（`lie_lgen_zero_of_mem_levelSpan`，属 worldsheet.verma-module-v2），
      以及词的 L_0 本征值公式（worldsheet.descendant-weight-grading-v2）。
  (f) 一般 Virasoro 模（非 Verma）上的类似结论。本卡的 V_N 是 Verma 模上按词定义的子模。
uses_conventions: [conv.virasoro-standard, conv.verma-module-notation]
formal:
  lean_decl: StringFormal.Virasoro.lie_lgen_mem_levelSpan
  lean_file: StringFormal/Virasoro/Verma.lean
sources:
