id: worldsheet.critical-dimension-light-cone-closed
kind: proposition
title: 闭弦光锥洛伦兹代数闭合要求 D = 26 且 a = ã = 1（左右各一份反常；前提 D ≥ 4）
statement: |
  **【前提】D ≥ 4**（即至少存在两个不同的横向指标 i ≠ j）。理由与开弦一侧
  worldsheet.critical-dimension-light-cone-v2 完全相同，见下方【本命题不断言什么】(i)。

  在**闭弦**光锥量子化中，横向场 X^i（i = 2..D-1）的模式展开
  （worldsheet.closed-string-mode-expansion）含**两组互相对易**的振子：右行 α^i_n 与左行 ᾱ^i_n
  （worldsheet.closed-string-oscillator-commutators）。两组各自带一个横向 Virasoro 生成元
    L^⊥_n = (1/2) Σ_{m∈Z} : α^i_{n-m} α^i_m :,   L̄^⊥_n = (1/2) Σ_{m∈Z} : ᾱ^i_{n-m} ᾱ^i_m :,
  各自带一个正规序常数 a、ã（截距记号按 conv.intercept-sign-a，Polchinski 写 A、Ã）。
  光锥规范把 X^- 的振子完全解出，且**逐手征**地解出：
    α^-_n ∝ L^⊥_n,   ᾱ^-_n ∝ L̄^⊥_n   (n ≠ 0)，
  故洛伦兹生成元
    J^{μν} = （零模部分） - i Σ_{n≥1} (1/n)(α^μ_{-n} α^ν_n - α^ν_{-n} α^μ_n)
                          - i Σ_{n≥1} (1/n)(ᾱ^μ_{-n} ᾱ^ν_n - ᾱ^ν_{-n} ᾱ^μ_n)
  中的 J^{i-} 是右行模式的三次式与左行模式的三次式之和。

  设 H_lc^cl 是闭弦光锥 Fock 空间，H_match ⊂ H_lc^cl 是其 level matching 子空间
  （N = Ñ，worldsheet.closed-string-level-matching）。**本命题断言：**

    [J^{i-}, J^{j-}]
      = -C Σ_{n≥1} [ Δ_n (α^i_{-n} α^j_n - α^j_{-n} α^i_n)
                   + Δ̃_n (ᾱ^i_{-n} ᾱ^j_n - ᾱ^j_{-n} ᾱ^i_n) ],
    Δ_n = n (26 - D)/12 + (1/n) [ (D - 26)/12 + 2(1 - a) ],
    Δ̃_n = n (26 - D)/12 + (1/n) [ (D - 26)/12 + 2(1 - ã) ],

  其中 C ≠ 0 是只依赖 α'、p^+ 与 ℓ 的约定的整体常数（Δ_n、Δ̃_n 的形式不依赖它）。
  即：**反常逐手征地分成两份**，右行那份的系数 Δ_n 与开弦的
  （worldsheet.critical-dimension-light-cone-v2）逐字同形，左行那份把 a 换成 ã。

  在 D ≥ 4 时，固定一对 i ≠ j，算子族
    { α^i_{-n} α^j_n - α^j_{-n} α^i_n }_{n≥1} ∪ { ᾱ^i_{-n} ᾱ^j_n - ᾱ^j_{-n} ᾱ^i_n }_{n≥1}
  在 H_match 上线性无关（对每个 n，取 level matching 的试探态 α^j_{-n} ᾱ^j_{-n}|0;k⟩：
  该族中只有第 n 个右行成员与第 n 个左行成员在它上面不为零，二者的像
  n α^i_{-n} ᾱ^j_{-n}|0;k⟩ 与 n α^j_{-n} ᾱ^i_{-n}|0;k⟩ 因 i ≠ j 而线性无关）。故
    [J^{i-}, J^{j-}] = 0 在 H_match 上  ⟺  对所有 n ≥ 1 有 Δ_n = 0 且 Δ̃_n = 0。
  （试探态取在 H_match 内，故同一结论在整个 H_lc^cl 上也成立。）

  Δ_n 中 n 的正幂系数为零给 D = 26，负幂系数随之为零给 a = 1；Δ̃_n 同样给 ã = 1。因此

    **闭弦光锥洛伦兹代数闭合  ⟺  D = 26 且 a = ã = 1。**

  【本命题不断言什么】
  (i)   **对 D ≤ 3 不作任何断言**（即前提 D ≥ 4 不可省的原因，与开弦一侧同款）：
        D = 3 时只有一个横向指标，反对称组合 α^i_{-n}α^j_n - α^j_{-n}α^i_n 与
        ᾱ^i_{-n}ᾱ^j_n - ᾱ^j_{-n}ᾱ^i_n 恒为零，于是 [J^{i-}, J^{j-}] = 0 对**任意**
        (D, a, ã) 成立而 Δ_n、Δ̃_n 一般不为零，「当且仅当」的**仅当**方向在那里有反例；
        D = 2 无横向振子，J^{i-} 不存在，命题空真。
  (ii)  **不**把 a = ã 当作前提。左右两个正规序常数在本命题中是**两个独立的待定参数**，
        a = 1 与 ã = 1 分别由 Δ_n = 0 与 Δ̃_n = 0 定出。这一点与
        worldsheet.closed-string-intercept 不同：那张卡把 a = ã（由
        worldsheet.closed-string-mass-formula 的左右对称性给出）当作**输入**。
  (iii) **不**断言闭弦的无鬼定理、谱的正定性、或闭弦旧协变量子化的任何事；本图尚无闭弦 OCQ
        物理态空间的节点。本命题只讲光锥洛伦兹代数的闭合条件。
  (iv)  **不**断言与开弦临界维数的等价，也不断言「D = 26 是闭弦一致性的充分条件」
        （相互作用、模不变性、快子等一概在外）。
  (v)   **不**覆盖紧化背景（c^m = 26 而 D ≠ 26 的解）：本命题的 D 是平坦时空的维数，
        论证用的是 D-2 个横向自由玻色场。
