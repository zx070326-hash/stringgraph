id: worldsheet.no-ghost-theorem
kind: proposition
title: 无鬼定理（Goddard–Thorn）
statement: |
  设 D 维自由玻色弦的旧协变物理态空间 H_phys 如 old-covariant-physical-states 所定义。
  若 D = 26 且 a = 1，则 H_phys 上由 Fock 内积诱导的内积是半正定的，
  且 H_phys 模掉零模态后同构于 24 个横向振子生成的 Fock 空间（DDF 态空间）。
  若 D > 26，则对任意 a，H_phys 含负模态。
  若 D ≤ 26 且 a ≤ 1，H_phys 内积半正定（但 D<26 时零模态不足以退耦，谱不幺正于洛伦兹协变的意义下）。
uses_conventions: [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge]
sources:
  - ref: goddard-thorn-1972
    loc: "Theorem 1"
  - ref: brower-1972
    loc: "独立证明"
  - ref: polchinski-1998-v1
    loc: "§4.4 (BRST 版本)"
tags: [bosonic-string, unitarity, critical-dimension]
superseded_by: worldsheet.no-ghost-theorem-v2
notes: |
  这是形式化岛 1 的目标。Lean 声明名预留为 StringFormal.NoGhost.no_ghost_theorem，
  完成后由 lean-formalizer 填写 formal.lean_decl 并把推导状态升为 formalized。
  【已被取代】本节点第 (3) 条"D ≤ 26 且 a ≤ 1 ⇒ 半正定"为假，见
  graph/milestones/no-ghost-theorem.yaml 的审计记录 B1（D = 26、3/8 < a < 1 时 level-2
  标量物理态的模严格为负）；正确陈述见 worldsheet.no-ghost-theorem-v2。
  按项目规则陈述文本不可变，本节点保留作历史，不再挂推导，故有效状态为 open。
