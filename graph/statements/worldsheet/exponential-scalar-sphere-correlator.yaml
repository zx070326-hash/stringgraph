id: worldsheet.exponential-scalar-sphere-correlator
kind: proposition
title: "球面上指数标量算子的期望值 ⟨Π_i e^{iε_i H(z_i)}⟩_{S²} = Π_{i<j} z_ij^{ε_i ε_j}（Σ_i ε_i = 0），且 OPE + 无穷远光滑性把它唯一确定到总归一化"
statement: |
  【设定】取一个全纯世界面标量 H(z)，按 conv.nonembedding-scalar-normalization 归一：
    H(z) H(0) ∼ − ln z。
  记 z_ij := z_i − z_j。

  【断言 (1)：期望值的形式】球面上一组指数算子的期望值为
    ⟨ Π_i e^{i ε_i H(z_i)} ⟩_{S²}  =  Π_{i<j} z_ij^{ε_i ε_j},
  当且仅当荷守恒 Σ_i ε_i = 0；荷不守恒时期望值为零。

  【断言 (2)：唯一性】上式**被下列两条数据唯一确定，至多相差一个总归一化常数**：
    (a) 指数算子之间的 OPE（即各 z_ij → 0 处的极点与零点阶数 ε_i ε_j），
    (b) 期望值在 z_i → ∞ 处的光滑性（"smoothness at infinity"）。
  原书对这一点的逐字表述（(10.3.7) 上方）：
    "The poles and zeros in the OPE together with **smoothness at infinity determine** the
     expectation values of these operators on the sphere, up to an overall normalization."

  【本命题不断言的内容】
    (1) **不**断言断言 (2) 的证明。原书把它推给 **exercise 10.7**（逐字题干：
        "Verify that the expectation value (10.3.7) has the appropriate behavior as z_i → ∞,
         and show that together with the OPE this determines the result up to normalization."），
        正文不做。Headrick 解答手册（headrick-2008，Problem 10.7）给的是 Liouville 型论证
        （两边之比是整函数且在无穷远趋于常数 ⇒ 常数），见 derivation 的 gaps。
    (2) **不**断言 H 作为手征（纯全纯）玻色子的存在性/构造。原书在 (10.3.5) 处只写下全纯 OPE，
        不讨论手征玻色子的零模、自对偶格与配分函数的定义问题。
    (3) **不**断言这个期望值在别的曲面（环面等）上的形式。
    (4) **不**断言总归一化常数的值。

  【本卡为什么单列】抽取记录 E25 的备注明确建议：
  「这是全章严格性最可疑的一块之一：'smoothness at infinity determines' 是物理论证；
    …**这条论证本身是可以数学化的**，但书里放在习题。→ curator 若建 bosonization 节点，
    …并把 (10.3.7) 的唯一性单列。」
  单列的实际作用：worldsheet.fermion-bosonization-two-dimensions 的论证以本卡为前提，
  而本卡是那条论证链上**唯一一处原则上可以升到 rigorous** 的环节（Liouville 型论证）。
