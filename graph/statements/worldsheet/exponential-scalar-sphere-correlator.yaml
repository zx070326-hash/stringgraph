tags: [cft, bosonization, free-field, sphere-correlator, vertex-operator, exponential-operator]
notes: |
  【与本图既有自由标量节点的关系】worldsheet.free-scalar-propagator 给的是
  X^μ(z,z̄) X^ν(0,0) ∼ −(α'/2) η^{μν} ln|z|²（conv.alpha-prime-regge）。
  本卡的 H H ∼ −ln z 是它在「α' = 2、单个标量、只取全纯一半」下的特例
  （见 conv.nonembedding-scalar-normalization 的换算字典 (3)）。
  derivation 里的那条边写了 convention_map。

  【荷守恒 Σ_i ε_i = 0 的地位】原书把它与 (10.3.7) 写在一起。它是 H 的平移不变性
  （零模积分）的推论，但**原书在此处不给这个推理**，本卡照记为断言的一部分。

  【手征玻色子的定义问题是真实的 gap】把 H(z) 当成一个只有全纯部分的场，
  在数学上需要额外结构（手征玻色子/格顶点代数）。Polchinski 全章不讨论，
  本图也没有对应节点。这条 gap 在下游每一张玻色化卡的 derivation 里都重复出现，
  是玻色化整块**最深的**未形式化处。
  → 建议后续任务：从数学侧（格顶点算子代数，如 flm-1988、frenkel-benzvi-2004）
    建一组 math 区节点，把「秩 1 格顶点代数」严格化，再与本卡做接口。
