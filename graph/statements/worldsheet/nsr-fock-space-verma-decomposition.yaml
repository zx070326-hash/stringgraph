id: worldsheet.nsr-fock-space-verma-decomposition
kind: proposition
title: "（争议卡）NSR 物质 Fock 空间作为 super-Virasoro 模完全可约、是 Verma 模的无穷直和"
statement: |
  **设定（这一段是陈述的一部分，不是注释）。**
  取 RNS 弦的**物质**部门 Fock 空间 H(p)：D 个自由玻色场 X^μ 与自由费米场 ψ^μ 的振子 Fock 空间，
  中心动量 p ≠ 0；按扇区取 NS（半整数模，记 κ = ½）或 R（整数模，记 κ = 0）。
  H(p) 是 super-Virasoro 代数（生成元 l_n、g_r 与中心元）的模。
  Verma 模记号按 conv.verma-module-notation。

  **命题（即 Figueroa-O'Farrill–Kimura 1989 所主张、并把证明归属给 Brower–Friedman 1973 的那一条）：**

    H(p) 作为 super-Virasoro 模是**完全可约**的，即同构于 super-Virasoro **Verma 模的无穷直和**。

  **★ 本卡是一张争议卡：图中并列两方，本图未裁决。**

  **主张成立的一方**——Figueroa-O'Farrill–Kimura 1989：
    NS 扇区 p.111 逐字："**It was proven** by Brower and Friedman [11] that this representation is
    **fully reducible** … infinite direct sum of Verma modules"；
    R 扇区 p.115 措辞更弱，逐字："Brower and Friedman **claim** to have proven full reducibility of
    this representation, although they **do not write down the explicit spectrum generating
    algebra**"。

  **主张一般不成立的一方**——Lian–Zuckerman 1989, §2, eqs. (35)-(38), p. 320 的 Remark 逐字：
    "`V(p,κ)` is **in general not a direct sum of Verma modules** of `Vir_κ` even though it is
    `Vir_κ^-`-free."（在 NS 扇区用超 Virasoro（c = 10）的 **Kac 行列式**给出论证）。
    其反例**不取某个具体的 p**，条件是 **`p·p < 0`** 且 `p·p/2 + n` 命中使 Verma 模 `M(h, 10)`
    可约的负半整数；`p ≠ 0` 由 LZ p.303 的全局假设保证。
    ⚠ **LZ 原文不给 Kac 行列式的层数**，用的是定性推论，**不写出显式的反例向量或层**。

  **⇒ 两方的作用域不是同一范围**：**FOK 只声明 `p ≠ 0`、不限定 `p·p` 的符号**，
  其适用范围**真包含** LZ 的反例区 `p·p < 0`。

  **本卡不断言：**
  (a) 哪一方正确——两方的措辞不同（"in general not" vs 无限定的 "fully reducible"）；
      LZ 反例的条件已核实为 `p·p < 0`（见上），但**该反例是定性推论、不给层数、不显式**，
      按 docs/STATUS_LEVELS.md 尚不构成"被接受的反例"，故本图**不裁决**，仅记为争议；
  (b) Brower–Friedman 1973 正文里有没有这条陈述——**该文正文本项目未取得（L0）**，
      其**摘要不含 "reducible"/"Verma"/"direct sum"/"Fock space"/"representation" 任何一词**；
  (c) `Vir_κ^-`-自由性（LZ Corollary 2.19(iii) 用的那条较弱性质）——**那一条两方都同意**，
      本卡说的是比它强的完全可约性。
uses_conventions:
  - conv.verma-module-notation
sources:
  - ref: figueroa-ofarrill-kimura-1989
    loc: "p.111（NS 扇区，逐字 'It was proven by Brower and Friedman [11] that this representation is fully reducible … infinite direct sum of Verma modules'）；p.115（R 扇区，逐字 'Brower and Friedman claim to have proven full reducibility of this representation, although they do not write down the explicit spectrum generating algebra'）"
    note: |
      **L1**（全文 28 页逐页读图，literature/extractions/figueroa-ofarrill-kimura-1989.md）。
      ★ **这是本命题在文献中的唯一正面出处。** FOK **需要**它：附录 A 的超李代数同调消灭定理
      (A.14) 只对 **Verma 模** M 陈述，FOK 据此逐 Verma 模计算 BRST 上同调。
      ⚠ 同一作者 1989 年的另一篇（"BRST Cohomology and its Applications to Two-Dimensional
      Conformal Field Theory"）出现**逐字相同**的两句（Semantic Scholar 引文上下文检索，L3）
      ⇒ **两者不是两条独立证言，是同一条**。
  - ref: brower-friedman-1973
    loc: "abstract（正文本项目未取得，L0）"
    note: |
      ⚠⚠ **本条是「被归属的文献」，不是本命题的来源。** 按 literature/CLAUDE.md 的取证纪律，
      `read_depth` 保持 **abstract，不得升**（正文 L0；已尝试入口见 sources.bib 的 note，
      剩余唯一路线是 WebSearch 找 .edu 扫描件或人工从 APS 下载）。
      **摘要逐字全文**："The no-ghost theorem of Brower for the conventional dual model
      (intercept `α₀=1`) is extended to the Neveu-Schwarz model, and its spectrum-generating
      algebra is constructed. These conformally invariant generators (`A_n`, `B_s`) are obtained
      by a systematic use of the gauges `G_r`. As a consequence it is demonstrated that particular
      dual models having resonances with positive-definite norms and masses are possible."
      ⇒ **摘要只承载两件事：NS 扇区的无鬼定理 + 谱生成代数 (A_n, B_s)。**
      **摘要里没有 "reducible"、没有 "Verma"、没有 "direct sum"、没有 "Fock space"、
      没有 "representation"。** 且**标题与摘要都是 NS-only，完全没有 Ramond**。
  - ref: lian-zuckerman-1989
    loc: "§2, eqs. (35)-(38), p. 320（Remark，逐字 'V(p,κ) is in general not a direct sum of Verma modules of Vir_κ even though it is Vir_κ^- -free.'）"
    note: |
      **L1**（全文 35 页逐页读毕，literature/extractions/lian-zuckerman-1989.md）。
      ★ **反方向的明证。** 关键在措辞是 "**in general** not"——它**没有**说对每个 p 都不成立。
      ⚠ **LZ 不需要完全可约性**：其证明只用 `Vir_κ^-`-自由性（Corollary 2.19(iii)），
      所以这条 Remark 对 LZ 自己的推导毫无影响，**只影响 FOK 那条路线**。
      ⚠ 两篇**互不引用**（LZ p.335 Note added in proof 称收到 FOK 预印本、工作独立）。
  - ref: fgz-1986
    loc: "**Proposition 2.6 之后的 Remark**, p.8445，逐字：'We note that, although V(E, p) in the above proposition is free over ℒ_-, it is **not in general a direct sum of Verma modules** or even generated as an ℒ-module by V(E, p)^{ℒ^+}. As a counterexample one can choose the case in which p·p is a nonpositive even integer.'"
    note: |
      **L1 页图逐字**（researcher 2026-09-11，literature/extractions/brst-cohomology-sources.md §9.6）。
      ★★ **反方向的第二条独立证言，且是玻色版**（2026-09-11 依 lead 指示加入）。
      三条分量：
      (1) **与 LZ p.320 Remark 同构的措辞**（"not **in general** a direct sum of Verma modules"，
          且同样强调"尽管在负模下自由"）⇒ 争议的反方不再只有 LZ 一篇；
      (2) **FGZ 给出了反例条件**：p·p 是**非正偶整数**（LZ 那侧给的是 p·p < 0 且 p·p/2 + n
          命中使 M(h,10) 可约的负半整数）。两个条件**不是同一个**但同向（都在 p·p ≤ 0 一侧），
          且 FGZ 的条件更具体（"nonpositive even integer"）；
      (3) FGZ 还多否认了一件事：V(E,p) 甚至**不由** V(E,p)^{ℒ^+}（即横向空间那一侧）
          作为 ℒ-模生成。
      ⚠⚠ **作用域限定，不可直接当作对本卡的反证**：FGZ 说的是**玻色** Virasoro 与玻色 Fock 模
      V(E,p)（只有 α^μ_n），本卡说的是 **super-Virasoro 与 NSR 物质 Fock 空间**（含 ψ^μ / d^μ）。
      由玻色版到超版的推广**没有**文献中成文的一步。
      ⇒ 本条的真正作用有两层：
        (a) 它堵死了"用玻色情形的类比来支撑 NS 的完全可约性"这条退路——
            抽取记录 brower-friedman-1973.md §6 第 1 条正是这么判的（逐字："FGZ 本人早已指出
            玻色弦的 Fock 空间'一般也不是 Verma 模直和'… **FOK 若想用'玻色情形的类比'来支撑
            NS 的完全可约性，这条路也被 FGZ 自己堵死了**"）；
        (b) FOK p.111 紧接"完全可约"那句之后逐字写的是「However, we will prove their existence
            **the way FGZ did** in the bosonic case.」——即 FOK 自己把方法归给 FGZ，
            而 FGZ 在玻色侧明确否认 Verma 直和。
      ⚠ 本条**不改变**本卡"不裁决"的立场（"本卡不断言 (a)"）：它是第二条同向证言，
      不是本卡命题（超版）的反例。
      ⚠ 抽取记录 brower-friedman-1973.md §6 的 **Q6.2** 曾问"这句在 FGZ 正文哪里"——
      **本条关闭 Q6.2**：在 p.8445、Proposition 2.6 之后的 Remark。
tags: [worldsheet, superstring, super-virasoro, verma-module, brst, disputed, open-question]
notes: |
  from: literature/extractions/brower-friedman-1973.md §2–§3（本轮裁决记录）、
  figueroa-ofarrill-kimura-1989.md §3 第 1 条 / §4 Q1、lian-zuckerman-1989.md Q1。

  【★ 为什么把一条"文献争议"建成节点】这是本项目方法论想展示的场景之一：
  worldsheet.no-ghost-theorem-superstring-cohomological 有三条并列推导，其中
  **FOK 那条需要本命题，LZ 那条不需要**。把本命题建成节点并只让 FOK 的推导依赖它，
  工具就会自动把「两条 derivation 其实强度不同」如实算出来（FOK 那条的 effective 被压到
  conjecture，LZ 那条不受影响），而不是靠人在 notes 里口头说明。

  【★★ 2026-09-11 的四条新证据（researcher 抽 brower-friedman-1973，全部指向"归属可疑"）】
  (a) **`[L1]` 被归属文献的摘要不含任何可约性/Verma 主张**（见上面 brower-friedman-1973 的 note）。
      该文自称的成果是「无鬼定理推广到 NS + 谱生成代数 (A_n, B_s) + 正定范数共振态存在」。
  (b) **`[L1]` 该文的标题与摘要都是 NS-only，完全没有 Ramond。**
      ⇒ **FOK p.115 把一条关于 R 扇区表示的完全可约性归给它，在标题/摘要里找不到任何支撑。**
      FOK 自己那句括注「they do not write down the explicit spectrum generating algebra」
      恰与「该文根本没有处理 R 扇区」相容。（⚠ **这一步是抽取者的推断，不是原文陈述**，
      但它是现有证据下唯一自洽的读法。）
  (c) **`[L3]` 「Verma 模直和」这个说法在整个引用网络里只有一个出处。**
      Semantic Scholar 对该文 35 篇引用方的上下文检索中，**只有 Figueroa-O'Farrill 本人**
      1989 年的另一篇出现该措辞，且两句与 FOK p.111 / p.115 逐字相同。
      ⇒ **FOK 1989 与它不是两条独立证言。整个文献里没有第二个人说过这件事。**
  (d) **`[L3]` 两条非 FOK 系的引用方只把该文归到「NS 的 DDF/SGA 构造 + 无鬼定理」，不到可约性。**
      Hasiewicz–Jaskólski–Ostrowski, hep-th/9901116 逐字「The DDF construction [27] for the
      Neveu-Schwarz model was developed long time ago by Schwarz [28], **and by Brower and
      Friedman [29]**」——**该文自己大量使用 super-Virasoro Verma 模，却把 Verma 模的度规结构
      外包给 Meurman–Rocha 一系，不外包给 Brower–Friedman**；
      Schwarz, hep-th/0011078 逐字「The no-ghost theorem for the dual pion model was also
      established using Brower's methods … **as well as by Brower and Friedman**」。

  【★★ 2026-09-11 追加：LZ 反例的条件已核（researcher 读 lian-zuckerman-1989 pp.319–321 页图）】
  **LZ 的反例不取某个具体的 p**，其条件是：

    **`p·p < 0`，且 `p·p/2 + n` 命中使 Verma 模 `M(h, 10)` 可约的负半整数。**

  其中 `p ≠ 0` 由 LZ **p.303 的全局假设**保证（不是 Remark 本地加的条件）。
  ⚠ **LZ 原文不给 Kac 行列式的层数**，用的是**超 Virasoro（c = 10）Kac 行列式的定性推论**
  ——即他论证的是「存在这样的 (p, n)」，而**不写出显式的反例向量或层**。
  位置：§2, eqs. (35)-(38), p. 320。

  【★★ 由此明确的作用域差异（本卡争议的真正形状）】
    **FOK 只声明 `p ≠ 0`**（其脚注 3/6/9），**不对 `p·p` 的符号作任何限定**；
    **LZ 的反例落在 `p·p < 0` 且命中可约点的那些 p 上。**
  ⇒ **两者不是同一范围**：FOK 声称成立的范围**真包含**了 LZ 说不成立的那一片。
  ⇒ 此前记录的「调和可能」（若 FOK 只用一般动量则两者可并存）**已被这条核实削弱**：
  FOK 从未把自己限制到"一般 p"，所以调和需要的是**FOK 一侧补一个他没写的限定**，
  而不是两篇本来就说的是不同的事。

  【★ 为什么本轮仍不降为 refuted】本卡的量词是"对设定中的 p（`p ≠ 0`）"，若 LZ 的反例条件确实
  可满足，则本卡陈述为假。**但按 docs/STATUS_LEVELS.md，`refuted` 要求"存在被接受的反例"，
  且需要一条 `kind: refutation` 的推导**；而 LZ **不给 Kac 行列式层数、不写出显式反例**，
  其论证是定性推论。⇒ 按根 CLAUDE.md 原则 2「不确定时选低的那级」，本轮维持 `conjecture`，
  并把"是否够格降为 refuted"作为一条**待 lead / auditor 裁决**的事项列出（见推导 gaps）。

  【★ 若日后裁决为"不成立"该怎么做】若 lead / auditor 认定 LZ 的定性反例够格，
  则本卡应新增一条 `kind: refutation` 的推导
  （`worldsheet.nsr-fock-space-verma-decomposition--via-lian-zuckerman-kac-determinant`，
  来源 lian-zuckerman-1989 §2, eqs. (35)-(38), p. 320）使其降为 refuted，
  并把 --via-figueroa-ofarrill-kimura-1989 的 gaps 第一条升级为"其前提已被反驳"。
  **本轮不做**：LZ 不给层数、不写显式反例。

  【★ 本卡的正文在本分支内被修订过一次】本卡与其推导于 2026-09-11 同日先后两次落盘：
  第一次写成时 LZ 反例的 p 条件尚未核实，正文里写的是"裁决所需的事实本项目尚未核对"；
  同日 researcher 读完 LZ pp.319–321 后，该句已**不成立**，故在**本卡尚未进入 main 的同一分支内**
  改写为现在的正文。**这是对草稿的修订，不是对已发布节点的改写**；本卡在 main 上不存在过
  中间版本，也没有任何审计记录引用过它。已在交付报告中向 lead 明示。

  【★ 与 brower-friedman-1973 的使用红线】图里**不得**把 brower-friedman-1973 作为
  「完全可约性 / Verma 模直和」的 source（它只能承载摘要那两件事，loc 只能写 `abstract`）。
  该文**可以**作为 NS 扇区无鬼定理与横向谱生成代数的一条 physical-argument 级来源
  （见 worldsheet.no-ghost-theorem-superstring-cohomological--via-ohta-imnu 与
  --via-figueroa-ofarrill-kimura-1989 里的对应 source）。

  【查重】`uv run stringgraph search Brower / Verma` 命中的是玻色弦 DDF/Kac 行列式一系与
  Shapovalov 形式卡，无同内容者。

  ★★【2026-09-11 小结（curator，small-backlog-10）：反方现在是**两篇互相独立的数学文献**】
  本卡的反方证言此前只有 LZ 一篇，本轮（依 lead 指示，reviewer 落地于 45a27d5）加入了 FGZ 的
  玻色版 Remark 后，**两篇独立数学文献（lian-zuckerman-1989 p.320 Remark 与 fgz-1986
  Proposition 2.6 之后的 Remark）均否认 Fock 模是 Verma 模的直和**，且措辞同构
  （都强调"**尽管**在负部下自由"、都用 "not **in general** a direct sum of Verma modules"），
  各自给出的反例条件同向但不同条（LZ：p·p < 0 且命中 M(h,10) 的可约点；FGZ：p·p 为非正偶整数）。
  正方仍然只有一条证言（FOK 1989，且其 1989 年另一篇的同款两句经核实**不是**独立第二条）。
  ⚠ **status 维持 `conjecture`，不降 `refuted`**：理由不变——两篇反方都**不写出显式的反例向量或层**
  （LZ 是 Kac 行列式的定性推论、FGZ 只给"可取 p·p 为非正偶整数"一句），按 docs/STATUS_LEVELS.md
  「refuted 要求存在被接受的反例」且需一条 kind: refutation 的推导，本图尚不够格；
  按根 CLAUDE.md 原则 2「不确定时选低的那级」，本轮仍只记为争议。
  ⚠ 另一条作用域限定不变：**FGZ 说的是玻色 Virasoro 与玻色 Fock 模**，本卡说的是超版，
  由玻色到超没有成文的一步（见该 source 的 note）。⇒ 两篇同向，但只有 LZ 那篇是对本卡命题的直接反证。

  ★【与新卡 worldsheet.rns-fock-module-free-over-negative-super-virasoro 的分界（2026-09-11 新建）】
  本卡"不断言 (c)"里写的那条较弱性质（`Vir_κ^-`-自由性，LZ Corollary 2.19(iii)）**已单独立卡**。
  两张卡的关系必须记清楚：
    · 新卡（自由性）**无争议**：LZ 逐字断言它，FOK 与 FGZ 也都不否认；effective = physical-argument。
    · 本卡（完全可约 / Verma 直和）**有争议**：status = conjecture。
  LZ 那句 "even though it is Vir_κ⁻-free" 正是把两者分开的原文依据。
  ⇒ **本卡与新卡互不依赖**：新卡不得引本卡为据，本卡也不得把新卡当作支持。
  （按 graph/CLAUDE.md「换代时正文指针不就地改字」，本卡 statement 的 (c) 段原文不动，此处记账。）
