id: worldsheet.ocq-level-two-scalar-norm
kind: proposition
title: 旧协变量子化第二能级标量物理态的模 ∝ (D−1)[16a² + (2D−74)a + 84 − 3D]
statement: |
  设定沿用 worldsheet.old-covariant-physical-states：D 个自由玻色子 X^μ 的 Fock 空间，
  度规 mostly-plus，[α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0}，(α^μ_n)† = α^μ_{-n}，
  开弦零模 α^μ_0 = (2α')^{1/2} k^μ（conv.alpha-prime-regge），
  L_0 = (1/2) α_0·α_0 + Σ_{n≥1} α_{-n}·α_n，截距记号按 conv.intercept-sign-a
  （物理态条件 (L_0 − a)|ψ⟩ = 0，L_n|ψ⟩ = 0 ∀ n > 0；Polchinski 的 A 换算为 a = −A）。
  取基态归一化 ⟨0;k|0;k⟩ = 1。

  在第二能级（N = 2）中考虑只由 η_{μν} 与 α_0^μ 构造的三维子空间
    span{ α_{-1}·α_{-1}|0;k⟩,  (α_0·α_{-1})²|0;k⟩,  (α_0·α_{-2})|0;k⟩ }
  （即小群不变的"标量"部分）。设 a ≠ 2 且 a ≠ 9/4。则：

  (1) 物理态条件 L_1|ψ⟩ = L_2|ψ⟩ = 0 在该三维空间中把解空间约化为一维，
      其生成元（把 α_{-1}·α_{-1} 的系数归一化为 1）为
        |ψ_2⟩ = [ α_{-1}·α_{-1} + c_2 (α_0·α_{-2}) + c_3 (α_0·α_{-1})² ] |0;k⟩，
        c_2 = (1 − D)/(4a − 9),
        c_3 = (D − 4a + 8) / (2(4a − 9)(a − 2))，
      其中质量壳条件 (L_0 − a)|ψ_2⟩ = 0 给 α_0·α_0 = 2α' k² = 2(a − 2)。

  (2) 其模精确等于
        ⟨ψ_2|ψ_2⟩ = (D − 1)[16a² + (2D − 74)a + 84 − 3D] · 2/(4a − 9)²,
      即 (D − 1)[16a² + (2D − 74)a + 84 − 3D] 乘以严格正的因子 2/(4a − 9)²。

  (3) 由 (2) 立得三条推论：
      (3a) 在 a = 1 处 ⟨ψ_2|ψ_2⟩ = (D − 1)(26 − D) · 2/25，故 D > 26 时严格为负；
      (3b) 二次式 16a² + (2D − 74)a + 84 − 3D 关于 a 的判别式为 4(D − 1)(D − 25)，
           故（设 D ≥ 2，首项系数 16 > 0）：
             · **D ≤ 24**：判别式为负，该二次式无实根，对一切实 a 严格为正；
             · **D = 25**：判别式恰为零，有二重根 a = 3/4；该二次式在 a = 3/4 处取零、
               其余处严格为正。故 D = 25、a = 3/4 时 ⟨ψ_2|ψ_2⟩ = 0（零模，不是负模）；
             · **D ≥ 26**：判别式为正，有两个相异实根，两根之间该二次式严格为负；
      (3c) D = 26 时该式因式分解为 2(8a − 3)(a − 1)，在 3/8 < a < 1 上严格为负；
           例如 a = 1/2、3/4、9/10 分别给 ⟨ψ_2|ψ_2⟩ = −50/49、−25/12、−350/243。
uses_conventions: [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge, conv.intercept-sign-a]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.1，level 2 的分析，落在 eq. (4.1.16)–(4.1.18) 之后的 (4.1.19)–(4.1.28) 区间，p.124"
    note: |
      **式号未核实**（抽取记录 literature/extractions/polchinski-1998-v1.md#E57 的位置栏为
      `[页码已核实/式号未核实]`；schrans-2020 目录把 level 2 讨论标在 p.124，但其 4.7/4.8 两条
      都写 (4.1.18)，抽取记录判为笔误之一）。Polchinski 处理的是一般 level-2 态
      (E_{μν}α^μ_{-1}α^ν_{-1} + e_μ α^μ_{-2})|0;k⟩ 并只结论性地给出"A = −1 且 D = 26 时
      才出现额外零态"，**本节点的显式闭式 (1)(2) 不在该处出现**，见本节点 notes。
  - ref: gsw-1987-v1
    loc: "§2.2.2–2.2.3（第二能级伪态与 zero-norm 条件）"
    note: |
      GSW 用 mostly-minus 与 α' = 1/2，已转写。GSW 给的是零态存在条件（a = 1, D = 26）
      而非一般 (D, a) 的模的闭式；本节点的闭式仍属本项目自行核算。
tags: [bosonic-string, quantization, old-covariant, critical-dimension, intercept, spectrum]
notes: |
  **来源实情（必读）**：这条命题的**显式闭式**不是从 Polchinski 或 GSW 逐字抄来的，
  而是本项目内部的两次独立精确计算：
    1. auditor 在 ms.no-ghost-theorem 第一轮回译审计的条目 B1（2026-09-10）中用精确有理数
       求 level-2 物理态的 Gram 矩阵，得到 (D−1)[16a² + (2D−74)a + 84 − 3D] × 正因子，
       并给出 D = 26 处的三个数值 −50/49、−25/12、−350/243 与判别式 4(D−1)(D−25)。
       所用脚本 graph/build/noghost_check.py 在 gitignore 下，未入库。
    2. curator（2026-09-11）用符号代数独立重算（graph/build/lvl2_check.py，同样在 gitignore 下，
       不入库；完整计算已逐步写进推导节点 --via-level-two-gram 的 summary，可徒手复核），
       得到同一结果，并额外定出正因子为 2/(4a − 9)²，三个数值点完全吻合。
  文献侧只支持"D = 26、a = 1 时出现额外零态"这一定性结论（Polchinski §4.1、GSW §2.2.2–2.2.3），
  不支持一般 (D, a) 的闭式。引用本节点时请连同这一点一起引用。

  用途：worldsheet.no-ghost-theorem-v2/v3/v4 的推导 summary 与 gaps 里已经在用这个公式
  （"level-2 标量物理态的模正比于 (D−1)[16a² + (2D−74)a + 84 − 3D]"），此前**没有节点承载它**，
  只散落在 derivation 的自由文本中；本节点把它变成可引用、可审计的陈述。
  它同时是审计条目 B1 判定旧陈述 worldsheet.no-ghost-theorem 第 (3) 条
  （"D ≤ 26 且 a ≤ 1 ⇒ 半正定"）为假的直接依据：由 (3c)，D = 26、3/8 < a < 1 已有负模。

  本节点**不**断言 level-2 的完整 Gram 矩阵性质，也不断言非标量（小群非平凡表示）部分的模；
  它只覆盖由 η 与 α_0 张成的那个三维子空间中的物理态。level-3 的数值检查（审计 B1 提到
  D = 26、a ∈ {0, 1/4, 3/8, 1/2, 3/4} 均出现负特征值）本节点不覆盖。
