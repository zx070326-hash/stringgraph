id: worldsheet.ocq-level-two-scalar-norm
kind: proposition
title: 旧协变量子化第二能级标量物理态的模 ∝ (D−1)[16a² + (2D−74)a + 84 − 3D]
statement: |
  设定沿用 worldsheet.old-covariant-physical-states：D 个自由玻色子 X^μ 的 Fock 空间，
  度规 mostly-plus，[α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0}，(α^μ_n)† = α^μ_{-n}，
  开弦零模 α^μ_0 = (2α')^{1/2} k^μ（conv.alpha-prime-regge），
  L_0 = (1/2) α_0·α_0 + Σ_{n≥1} α_{-n}·α_n，截距记号按 conv.intercept-sign-a
  （物理态条件 (L_0 − a)|ψ⟩ = 0，L_n|ψ⟩ = 0 ∀ n > 0；Polchinski 的 A 换算为 a = −A）。
  取基态归一化 ⟨0;k|0;k⟩ = 1。

  在第二能级（N = 2）中考虑只由 η_{μν} 与 α_0^μ 构造的三维子空间
    span{ α_{-1}·α_{-1}|0;k⟩,  (α_0·α_{-1})²|0;k⟩,  (α_0·α_{-2})|0;k⟩ }
  （即小群不变的"标量"部分）。设 a ≠ 2 且 a ≠ 9/4。则：

  (1) 物理态条件 L_1|ψ⟩ = L_2|ψ⟩ = 0 在该三维空间中把解空间约化为一维，
      其生成元（把 α_{-1}·α_{-1} 的系数归一化为 1）为
        |ψ_2⟩ = [ α_{-1}·α_{-1} + c_2 (α_0·α_{-2}) + c_3 (α_0·α_{-1})² ] |0;k⟩，
        c_2 = (1 − D)/(4a − 9),
        c_3 = (D − 4a + 8) / (2(4a − 9)(a − 2))，
      其中质量壳条件 (L_0 − a)|ψ_2⟩ = 0 给 α_0·α_0 = 2α' k² = 2(a − 2)。

  (2) 其模精确等于
        ⟨ψ_2|ψ_2⟩ = (D − 1)[16a² + (2D − 74)a + 84 − 3D] · 2/(4a − 9)²,
      即 (D − 1)[16a² + (2D − 74)a + 84 − 3D] 乘以严格正的因子 2/(4a − 9)²。

  (3) 由 (2) 立得三条推论：
      (3a) 在 a = 1 处 ⟨ψ_2|ψ_2⟩ = (D − 1)(26 − D) · 2/25，故 D > 26 时严格为负；
      (3b) 二次式 16a² + (2D − 74)a + 84 − 3D 关于 a 的判别式为 4(D − 1)(D − 25)，
           故（设 D ≥ 2，首项系数 16 > 0）：
             · **D ≤ 24**：判别式为负，该二次式无实根，对一切实 a 严格为正；
             · **D = 25**：判别式恰为零，有二重根 a = 3/4；该二次式在 a = 3/4 处取零、
               其余处严格为正。故 D = 25、a = 3/4 时 ⟨ψ_2|ψ_2⟩ = 0（零模，不是负模）；
             · **D ≥ 26**：判别式为正，有两个相异实根，两根之间该二次式严格为负；
      (3c) D = 26 时该式因式分解为 2(8a − 3)(a − 1)，在 3/8 < a < 1 上严格为负；
           例如 a = 1/2、3/4、9/10 分别给 ⟨ψ_2|ψ_2⟩ = −50/49、−25/12、−350/243。
uses_conventions: [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge, conv.intercept-sign-a]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.1, **p.124 正文的结论性断言 + exercise 4.1（p.143）**。⚠ **§4.1 没有 level-2 的推导，也没有 (4.1.24)–(4.1.28) 这些式号**：§4.1 的最后一式是 (4.1.23)，§4.2 从 p.126 开始"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐页）——**旧 loc 的式号区间不存在**】

      ⚠ **两层订正**：
      1. 旧 loc 写「落在 (4.1.19)–(4.1.28) 区间」。**§4.1 的最后一个式号是 (4.1.23)**
         （(4.1.22) 是 Mnemonic (L^m_0 + L^g_0)|ψ,↓⟩ = 0，(4.1.23) 是 (H^m + H^g)|ψ,↓⟩ = 0），
         **(4.1.24)–(4.1.28) 根本不存在**。抽取记录 E57 转述的那套 level-2 联立方程
         （[S] 的 [4.24]/[4.28]/[4.32]）**是 [S] 自己做的习题解答，不是原书内容**。
      2. **原书正文不做 level-2 的推导**。p.124 逐字：
           "The result at the next level is quite interesting: it depends on the constant A and also
            on the spacetime dimension D. Restricting to the value A = −1 found at the first excited
            level, the spectrum only agrees with the light-cone spectrum if in addition D = 26.
            If D > 26, there are negative-norm states; if D < 26 the OCQ spectrum has positive norm
            but more states than in light-cone quantization. **The derivation is left to the reader.**"
         p.143 的**习题 4.1** 逐字：
           "**4.1** Extend the OCQ, for A = −1 and general D, to the second excited level of the open
            string. Verify the assertions made in the text about extra positive- and negative-norm states."

      → 后果：**任何以 polchinski-1998-v1 为来源的 level-2 推导，其 status 不得高于
        physical-argument，且不得引 [S] 的方括号编号当原书式号。** 本节点的闭式 (1)(2)
        本来就标注为「本项目自行核算」，该定性不变；本条只是把 loc 改成原书里真实存在的位置。
      另注意原书这段还给了 **D < 26 的情形**（正模但态数多于光锥），本节点未覆盖。

      见 literature/extractions/polchinski-1998-v1.md §12.3（E57）与 §12.10 表 B 第 12 项、表 C 第 5 项。
  - ref: gsw-1987-v1
    loc: "§2.2.2–2.2.3（第二能级伪态与 zero-norm 条件）"
    note: |
      GSW 用 mostly-minus 与 α' = 1/2，已转写。GSW 给的是零态存在条件（a = 1, D = 26）
      而非一般 (D, a) 的模的闭式；本节点的闭式仍属本项目自行核算。
tags: [bosonic-string, quantization, old-covariant, critical-dimension, intercept, spectrum]
notes: |
  **来源实情（必读）**：这条命题的**显式闭式**不是从 Polchinski 或 GSW 逐字抄来的，
  而是本项目内部的两次独立精确计算：
    1. auditor 在 ms.no-ghost-theorem 第一轮回译审计的条目 B1（2026-09-10）中用精确有理数
       求 level-2 物理态的 Gram 矩阵，得到 (D−1)[16a² + (2D−74)a + 84 − 3D] × 正因子，
       并给出 D = 26 处的三个数值 −50/49、−25/12、−350/243 与判别式 4(D−1)(D−25)。
       所用脚本 graph/build/noghost_check.py 在 gitignore 下，未入库。
    2. curator（2026-09-11）用符号代数独立重算（graph/build/lvl2_check.py，同样在 gitignore 下，
       不入库；完整计算已逐步写进推导节点 --via-level-two-gram 的 summary，可徒手复核），
       得到同一结果，并额外定出正因子为 2/(4a − 9)²，三个数值点完全吻合。
  文献侧只支持"D = 26、a = 1 时出现额外零态"这一定性结论（Polchinski §4.1、GSW §2.2.2–2.2.3），
  不支持一般 (D, a) 的闭式。引用本节点时请连同这一点一起引用。

  用途：worldsheet.no-ghost-theorem-v2/v3/v4 的推导 summary 与 gaps 里已经在用这个公式
  （"level-2 标量物理态的模正比于 (D−1)[16a² + (2D−74)a + 84 − 3D]"），此前**没有节点承载它**，
  只散落在 derivation 的自由文本中；本节点把它变成可引用、可审计的陈述。
  它同时是审计条目 B1 判定旧陈述 worldsheet.no-ghost-theorem 第 (3) 条
  （"D ≤ 26 且 a ≤ 1 ⇒ 半正定"）为假的直接依据：由 (3c)，D = 26、3/8 < a < 1 已有负模。

  本节点**不**断言 level-2 的完整 Gram 矩阵性质，也不断言非标量（小群非平凡表示）部分的模；
  它只覆盖由 η 与 α_0 张成的那个三维子空间中的物理态。level-3 的数值检查（审计 B1 提到
  D = 26、a ∈ {0, 1/4, 3/8, 1/2, 3/4} 均出现负特征值）本节点不覆盖。

  【2026-09-11（二）：第 (2)(3a) 条已机器验证，第 (1)(3b)(3c) 条未；已拆卡】
  （curator，本次**只加本段 notes**，statement 文本、kind、tags、sources 一字未动。）
  formal/StringFormal/NoGhost/LevelTwo.lean（合入 main 的提交 c32f026）在 Lean 中验证了
  本节点的**第 (2) 条闭式**（清分母形式 (4a−9)²⟨ψ₂,ψ₂⟩ = 2(D−1)[16a² + (2D−74)a + 84 − 3D]，
  任意交换 ℚ-代数）与**第 (3a) 条**（a = 1 处 ⟨ψ₂,ψ₂⟩ = −2(D−26)(D−1)/25），
  这是同一结果的第三次独立核算（前两次见上）。
  **未验证**：第 (1) 条的解空间一维性、第 (3b)(3c) 条的判别式分类。
  按「status 只能实话实说」，本节点**不**升为 formalized、保持 rigorous
  （推导 --via-level-two-gram，reviewer-ch4 已复核）；已机器验证的那部分另立新卡
  **worldsheet.ocq-level-two-scalar-norm-closed-form**（formalized），
  并已作为依赖加进本节点的推导。两卡不是重复：新卡只讲显式试探态的模，
  本卡多讲一维性与判别式分类。
  附带登记（formalizer）：第 (3a) 条的质量壳 α'k² = −1 在 ℚ 上**单分量无解**，
  需 D ≥ 2 取一个类时加一个类空分量（如 a^0 = 3/2、a^1 = 1/2）；详见推导 notes。

  【2026-09-12 复核：仍**不**接线（curator，lean-wire-6）】
  这是第二次有人按 `stringgraph report` 的 "formalization frontier" 名单来给本卡接 Lean，
  故把逐条比对的结论写死在这里。对 formal/StringFormal/NoGhost/LevelTwo.lean 逐句核对：
    - 第 (2) 条：`Fock.pairing_levelTwoScalar_physical` 覆盖，但只到**清分母形式**
      (4a−9)²⟨ψ₂,ψ₂⟩ = 2(D−1)[…]。本卡写的「乘以**严格正**的因子 2/(4a−9)²」中的正性
      Lean 未证（定理在任意交换 ℚ-代数上，无序结构，也不设 4a ≠ 9）。
    - 第 (3a) 条：`Fock.pairing_levelTwoScalar_intercept_one` 覆盖。
    - 第 (1) 条（物理态条件把三维子空间约化为一维）：Lean 只有显式试探态 `Fock.levelTwoScalar`
      与域上的**存在性** `Fock.exists_levelTwoScalar_mem_physSubmodule`；唯一性/一维性未证。
    - 第 (3b)(3c) 条：判别式 4(D−1)(D−25) 这句在 Lean 中**只出现在文档注释**
      （LevelTwo.lean 第 679–680 行 `pairing_levelTwoScalar_physical` 的 docstring，及文件头第 48 行），
      **没有对应定理**；D ≤ 24 / D = 25 / D ≥ 26 的三分与 D = 26 的 2(8a−3)(a−1) 完全未做。
  故本卡不填 `formal.lean_decl`、不新增 `--via-lean` 推导：已机器验证的那部分早已由拆出的
  worldsheet.ocq-level-two-scalar-norm-closed-form（formalized）承载，本卡的推导
  --via-level-two-gram 已有一条指向它的边（reviewer-batch8 裁为 inferred）。
  要让本卡升 formalized，须先在 Lean 中补第 (1) 条的一维性与第 (3b)(3c) 条的判别式分类
  （后者需有序域）。frontier 名单只说明「所有依赖都已形式化」，不说明本卡该被形式化。

  记号核对（同次）：Lean 的截距 `a₀` 与本卡的 a **同号同值**，无常数差——
  `Fock.physSubmodule η a a₀` 定义为 ker(L₀ − a₀·id) ⊓ ⨅_{n>0} ker L_n
  （formal/StringFormal/NoGhost/PhysicalStates.lean 第 382–384 行），正是本卡的
  (L_0 − a)|ψ⟩ = 0 与 L_n|ψ⟩ = 0 (n > 0)，符合 conv.intercept-sign-a（Polchinski 的 A = −a）；
  质量壳 `zeroModeSq η a = 2a₀ − 4` 即本卡的 α_0·α_0 = 2(a − 2)。
