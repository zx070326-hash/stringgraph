    loc: "§5.3, eq. (5.3.9), p.156"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E80，L1（读到 schrans-2020 §5.15，
      笔记 p.254–255，其中九条因子含义逐条转录；**未核对 Polchinski 原书**）。
      伴读者对本式地位的评语（逐字）：「This formula is obtained by filling in the various parts
      so is entirely straightforward. But we repeat it here and discuss its different parts
      because of its sheer importance for string theory.」
      ⚠ 「λ 不是独立参数」一句在抽取记录里记为 [S] 转述的「as we will see later」，
      本卡只把它写进因子说明，**不作为断言**。
tags: [worldsheet, s-matrix, amplitude, path-integral, moduli, ghosts, perturbation-theory]
notes: |
  **这是「弦微扰论振幅」这条主线唯一的定义节点**：第 6 章全部树级结果都应挂在它下面
  （那部分由另一名 curator 以 `spectrum.` 前缀处理）。

  **status = physical-argument** 的三条理由，按 docs/STATUS_LEVELS.md 的「定义卡依赖
  路径积分等未定义对象」一档：
  (i) [dφ db dc] 没有数学定义；
  (ii) 对拓扑的求和是发散渐近级数，本书此处不讨论；
  (iii) 上游 worldsheet.genus-g-ghost-path-integral 与
        worldsheet.genus-g-faddeev-popov-determinant 本身就是 physical-argument。

  **本图缺的两条上游**：抽取记录 E80 把依赖列为 E47（世界面拓扑求和）与 E48（λχ 与弦耦合），
  这两条在本图**尚无节点**（属第 3 章 §3.1–§3.2，前几批未建）。本卡改挂
  worldsheet.worldsheet-euler-number（χ 本身）与 worldsheet.polyakov-action（S_m），
  但「对拓扑求和」与「e^{−λχ} 是弦耦合展开」这两个内容目前在图中**没有承载节点**，
  是一处已知缺口，建议 lead 派人补 E47/E48。
