id: worldsheet.string-s-matrix
kind: definition
status: physical-argument
title: 玻色弦 S-矩阵的主公式 (5.3.9)
statement: |
  n 个玻色弦态的 S-矩阵元由下式**定义**：
    S_{j₁…j_n}(k₁,…,k_n)
      = Σ_{紧世界面拓扑}  (1/n_R)  ∫_F d^μ t  ∫ [dφ  db  dc]  exp(− S_m − S_g − λχ)
        × ∏_{(a,i) ∉ f} ∫ dσ_i^a
        × ∏_{k=1}^{μ} (1/4π) ( b, ∂_{t^k} ĝ )
        × ∏_{(a,i) ∈ f} c^a(σ̂_i)
        × ∏_{i=1}^{n} ĝ(σ_i)^{1/2}  V_{j_i}(k_i, σ_i) 。
  各因子的含义：
  1. 对所有紧 Riemann 面求和；取向 / 无取向由弦的类型决定；
  2. n_R 是规范全固定后残余离散对称群的阶（如世界面宇称），除掉以免重复计数；
  3. 在基本域 F 上对 μ 个模 t^k 积分（环面情形 F = F₀，见 worldsheet.modular-fundamental-domain）；
  4. 对物质场 φ 与鬼场 b、c 做路径积分；
  5. 权重 exp(−S_m − S_g − λχ)，λ 是一个参数（原书注明它「不是独立的」，
     那属后文的内容，本卡不断言）；
  6. 若曲面有 κ 个 CKV，用它们固定 κ 个顶点算子坐标（集合 f），其余坐标要积分；
  7. 每个模给一个因子 (4π)^{-1}(b, ∂_{t^k} ĝ)；
  8. 每个被固定的顶点算子坐标给一个 c^a(σ̂_i) 插入；
  9. 最后乘上全部顶点算子，带权重 ĝ^{1/2}。

  ⚠ **本公式在原书中是 S-矩阵的定义，不是从别处导出的定理。**
  ⚠ **它自身没有收敛性或可定义性的论证**：对拓扑的求和是发散的渐近级数，
  单个路径积分的存在性也没有数学定义。本卡不断言任何收敛性。
