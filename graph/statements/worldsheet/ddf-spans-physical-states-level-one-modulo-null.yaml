id: worldsheet.ddf-spans-physical-states-level-one-modulo-null
kind: proposition
title: DDF 张成假设在 (rung −1, 振子能级 1) 一片上成立（模零态形）：H_phys(a₀) ∩ T_{−1,1} ⊆ D(Ε) + H_null，对一切 D——worldsheet.ddf-spanning-hypothesis 唯一已证的片
statement: |
  【设定】记号逐字沿用 worldsheet.ddf-spans-physical-states-level-one（它又沿用
  worldsheet.ddf-operators-v6、worldsheet.momentum-tower-fock-space、
  worldsheet.old-covariant-physical-states、worldsheet.transverse-frame-spans-orthogonal-complement）
  与 worldsheet.tower-physical-quotient-form：
  D ∈ N；系数环 R 是交换 Q-代数；η_μ² = 1（conv.metric-mostly-plus）；
  基点动量 p 与参考向量 k_0，重标度 a := (2α')^{1/2} p、b := (2α')^{1/2} k_0
  （conv.alpha-prime-regge），满足
    (N) η(b, b) = 0；   (S) η(b, a) = 1；
  动量塔 T(p; k_0)，第 j 层动量 p_j := a + j·b；双分次片 T_{j,N}（第 j 层、振子能级 N）；
  截距逐字取基态值 a₀ := α'p² = ½η(a,a)（conv.intercept-sign-a）；
  H_phys(a₀)、H_null(a₀) := H_phys(a₀) ∩ H_phys(a₀)^⊥、D(Ε) 同 worldsheet.ddf-spanning-hypothesis。

  【断言】设横向标架 Ε = (ε_1..ε_{D−2}) 满足
    (T)  η(ε_i, b) = 0；  (O)  η(ε_i, ε_j) = δ_{ij}；
    (T′) η(ε_i, a) = 0（偏振与基点动量正交）；
    (C)  Ε 在 v^⊥ 上完备，v := p_{−1} = a − b（worldsheet.transverse-frame-spans-orthogonal-complement 的谓词）。
  则
      **H_phys(a₀) ∩ T_{−1,1}  ⊆  D(Ε) + H_null(a₀)** 。

  用 worldsheet.ddf-spanning-hypothesis 的分片记号：这就是 DDFSpansOn(T_{−1,1})，
  即 DDF 张成假设限制在 (rung −1, 振子能级 1) 这一片上成立。

  【与 worldsheet.ddf-spans-physical-states-level-one 的关系（为什么是另一张卡）】
  那张卡的结论是 ⊆ D(Ε) + R·L_{−1}|0; k − k_0⟩（**模伪态**）；本卡的结论是 ⊆ D(Ε) + H_null（**模零态**）。
  伪态 L_{−1}|0;k−k_0⟩ 一般**不是**零态（那张卡【不断言】(c)），但「物理态 = DDF + 伪态」
  ⇒「物理态 = DDF + 零态」：伪态部分 = 物理态 − DDF 态是物理态，而「伪态 ∩ 物理态 ⊆ 零态」
  （worldsheet.tower-physical-quotient-form (2)）。故**本卡是那张卡的推论，严格更弱**
  （它不再说出那个零态是谁），不是它的第二条推导；按「一个节点一个命题」分立。
  本卡存在的理由：它的形状与 worldsheet.ddf-spanning-hypothesis 逐字一致（只多了 ∩ T_{−1,1}），
  是那条 open 假设**唯一**已被机检的片。

  【本卡不需要的假设】**不需要 D = 26**，不需要 a₀ = 1，不需要 R 上的序或正定性。
  N = 1 处计数 (D−1) = (D−2) + 1 对一切 D 平衡（那张卡 notes 的【D = 26 为什么在 N = 1 不进入】）。

  【本卡明确不断言】
  (a) 不断言 N ≥ 2 的任何片，不断言全体 H_phys（那是 worldsheet.ddf-spanning-hypothesis）；
      也不断言「逐片 ⇒ 全体」——本图与 Lean 侧都没有那条拼装引理（见那张卡 notes）。
  (b) 不断言反包含，不断言 D(Ε) ∩ H_null = 0，不断言正定性。
  (c) (T′) 与 (C) 是真前件，不可去（那张卡 notes 的两个反例）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard, conv.intercept-sign-a]
