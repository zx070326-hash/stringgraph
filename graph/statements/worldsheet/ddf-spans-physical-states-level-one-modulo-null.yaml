  - ref: goddard-2008
    loc: "§6, p.15, eq. (6.4)（arXiv:0802.3249v1）：'|ψ⟩ = |f⟩ + |n⟩'，|n⟩ 为零模态"
    note: |
      **不承载本卡的论证**（无证明，转引 GT 1972，正文未获取）。本卡与 (6.4) 的形式**逐字相同**
      （|n⟩ 是零态，不再是伪态），差别只剩两处：(i) 文献在 D = 26 上断言，本卡对一切 D；
      (ii) 文献对一切能级，本卡只做 (rung −1, level 1)。
tags: [bosonic-string, spectrum-generating-algebra, no-ghost, ddf-spans, formalized]
notes: |
  【为什么立卡（curator 2026-09-11，noghost-conditional）】
  任务原拟给 worldsheet.ddf-spans-physical-states-level-one 加第二条推导 `--via-lean-modulo-null`
  （Lean `ddfSpans_bigrade_neg_one_one`）。对照后发现该 Lean 定理证的是**模零态**形，而那张卡的
  statement 是**模伪态**形；伪态形 ⇒ 零态形（`mem_ddfSpan_sup_null_of_mem_ddfSpan_sup_spurious`），
  反向不成立。给一张卡挂一条只证明其**推论**的推导会把 status 记错，故改立本卡。

  【继承的两条额外前件（任务要求记录）】
  (T′) η(ε_i, a) = 0 与 (C) `FrameSpansOrthogonal` 逐字从 `towerPhys_bigrade_one_le_ddfSpan_sup_spurious`
  继承（Assembly.lean 的 docstring：'The two extra hypotheses are inherited verbatim from §B.6 and are
  both genuine'）。两条在显式光锥见证上都成立（`witness_towerPhys_bigrade_one_le_ddfSpan_sup_spurious`
  兑现），一般标架下不可去。
  ⚠ 与那张卡不同的第三条：**本卡需要 (N)(S)**（`hbb`、`hba`）。它们不是被 N = 1 的计数用掉的，
  而是被「伪态 → 零态」那一步用掉的（要证 DDF 态是物理态，`ddfSpan_le_towerPhysSubmodule` 需要 (N)(S)）。
  这三条前件在 worldsheet.ddf-spanning-hypothesis 的卡面上都不出现（`DDFSpans` 只带 Ε 的 (T)(O)），
  所以本卡即使推广到一切片，也**不会逐字给出**那张卡——除非先证明 (T′)(C) 可由 (T)(O)(N)(S) 在
  实数上取到（光锥标架的存在性），那是另一张卡的事。

  【更正：statement 的「不需要 a₀ = 1」是真话但会误导（curator 2026-09-22，
   分支 agent/curator/ddf-spanning-intercept-premise）】
  正文【本卡不需要的假设】那句「不需要 a₀ = 1」**不是假的**——a₀ = 1 确实不在本卡的前件表里——
  但它读起来像「本卡在 a₀ ≠ 1 时也有内容」，而**本卡的前件集在 a₀ ≠ 1 时是空的**：
  (N)(S)(T)(T′)(C) 五条合起来已经蕴含 a₀ = 1。所以对 a₀ ≠ 1，本卡是**空真**的。
  正文是 formalized 卡的 statement，按原则 1(c) 不可就地改，故更正写在这里；
  断言本身不变、status 不变、本卡与下游 effective 零移动。

  **推导（两行，无需脚本、无需域、无需 D ≥ 2）**：记 v := a − b。由 (T)(T′)
  η(ε_i, v) = η(ε_i,a) − η(ε_i,b) = 0；由 (N)(S) η(b, v) = η(b,a) − η(b,b) = 1，
  η(a, v) = η(a,a) − η(a,b) = 2a₀ − 1。取**显式见证**
      w := a − (2a₀ − 1)·b，
  则 η(w, v) = (2a₀−1) − (2a₀−1)·1 = 0，且 η(w, b) = η(a,b) − (2a₀−1)·η(b,b) = 1。
  把 (C) 用在 w 上：w = Σ_i c_i ε_i + c₀ v。与 b 配对得 1 = η(w,b) = c₀·η(v,b) = c₀，
  故 **c₀ = 1**；再与 v 配对得 0 = η(w,v) = c₀·η(v,v) = η(v,v)。
  而 η(v,v) = η(a,a) − 2η(a,b) + η(b,b) = 2a₀ − 2，R 是 Q-代数（2 可逆），故 **a₀ = 1**。∎

  ⚠ **不要把这条读成本卡有问题**：本卡在 a₀ = 1 上（唯一非空的情形）仍然逐字为真且已机检；
  受影响的只是那句注解的**读法**。

  【与两张 -v2 卡的关系（本轮同批改动）】
  worldsheet.ddf-spanning-hypothesis-v2 新加的前件 η(v,v) = 0 就是上面这条等式；在 (N)(S) 下
  η(v,v) = 0 ⟺ a₀ = 1。那张卡的 Ε **只带 (T)(O)**，不带 (T′)(C)，所以上面的推导用不上，
  前件必须写在卡面上（旧卡缺它因而逐字为假，见那张卡 notes 的反例）。本卡带 (T′)(C)，
  前件自动满足——**这正是本卡能在 a₀ 上不设条件而仍为真的原因**，不是反例。
  ⚠ 姊妹卡 worldsheet.ddf-spans-physical-states-level-one（模伪态那张）的「(3) 不需要截距 a₀ = 1」
  **成立、不要动**：那张卡**不假设 (N)(S)**，上面推导第二步就断了；没有 (N)(S) 时 (C) 只逼出
  η(v,v) = 0，而 η(v,v) = 0 ⇏ a₀ = 1。

  【给 formalizer 的一条可选简化（curator 不动 formal/）】
  StringFormal.NoGhost.DDFLightConeFrame.dotVec_self_eq_two 现在的证明走秩–零化度，
  因此带 `[Field R]`（LightConeFrame.lean §MassShell）与 `(hD : 2 ≤ D)`。
  上面的显式见证 w 两条都不需要：只用双线性与 (N)(S)(T)(T′)(C)，在任意交换 Q-代数上成立，
  D − 2 = 0 时求和为空也无碍。**curator 未形式化这条**，仅作提示。
