    note: |
      L1（抽取记录 polchinski-1998-v2.md E56；式号、表与两个张量积逐页读到原书页图）。
  - ref: polchinski-1998-v2
    loc: "§10.6, eq. (10.6.19) 一带, p. 31（type I 无质量内容 [0]+[2]+(2)+8′+56 的写法；本卡 (11.2.17) 的右端与之对应）"
    note: |
      L1（E46）。原书把 (11.2.17) 的结果直接称为 type I 超引力多重态；本图对应节点
      worldsheet.type-i-unoriented-closed-spectrum 用的是 [0]/[2]/(2) 记号，
      与这里的 1/28/35 是同一批场的两种写法（[2] = 28、(2) = 35）。
tags: [heterotic, so32, spectrum, massless, supergravity, gauge-multiplet]
notes: |
  ★【496 的两个独立来源，本图刻意不接边】
    (a) 本卡：32 × 31/2 = 496 是 so(32) 的维数，来自世界面上 32 个 λ^A 的配平；
    (b) consistency.gravitational-anomaly-requires-496-fermions：十维 tr R⁶ 项不能由局域反项抵消
        ⇒ 物质部分必须恰有 496 个左手 spin-1/2 场（Green–Schwarz 1984 的低能场论论证）。
  两者数值相同**不是巧合**，但把它们连成边需要「杂化弦的低能极限就是那个有效场论」这一步，
  而本图没有这一步的节点（见 consistency.heterotic-anomaly-free-requires-gs 的占位卡）。
  ⚠ 因此本轮**不加** (a) → (b) 或 (b) → (a) 的边。

  【SO(8) 表示论在本图无节点】(11.2.17)/(11.2.18) 的张量积分解（8_v × 8_v = 1 + 28 + 35、
  8_v × 8 = 8′ + 56）属于附录 B（本轮未读，抽取记录 Q8）。
  与 worldsheet.type-ii-massless-spectrum 的处境相同。

  【与 §11.6 玻色构造的一致性】玻色构造里无质量规范玻色子来自 l_L² = 2 的格点
  （SO(32) 的根），给出同一个伴随表示——见
  worldsheet.heterotic-bosonic-construction-gauge-groups。
