id: worldsheet.heterotic-so32-massless-spectrum
kind: proposition
title: SO(32) 杂化弦的无质量谱：d = 10, N = 1 超引力多重态 + SO(32) 伴随（496）规范多重态
statement: |
  用 SO(8) × SO(32) 表示标记（左移 × 内部），Table 11.2 的无质量行为：
    **左移（NS）**：(8_v, 1) + (1, 496)；左移 R 扇区在无质量能级为空；
    **右移**：ÑS 给 8_v，R̃ 给 8。

  **左移无质量态的来源**（(11.2.16)）：满足 H^⊥ = 0 的左移态恰有两类
    α^i_{−1}|0⟩_NS            →  (8_v, 1)，
    λ^A_{−1/2}λ^B_{−1/2}|0⟩_NS →  (1, [2])，
  后者按 SO(32) 的二阶反对称表示 [2] 变换，维数 32 × 31/2 = **496**，即 so(32) 的**伴随表示**。

  **无质量谱（左 × 右 的张量积）**：
    (8_v, 1) × (8_v + 8) = (1,1) + (28,1) + (35,1) + (56,1) + (8′,1)        （(11.2.17)）
      —— d = 10 的 N = 1 超引力多重态（dilaton 1、反对称张量 28、引力子 35、
         引力微子 56、dilatino 8′），原书称其为 type I 超引力多重态；
    (1, 496) × (8_v + 8) = (8_v, 496) + (8, 496)                            （(11.2.18)）
      —— SO(32) 伴随表示的 **N = 1 规范多重态**（规范玻色子 + 规范微子）。

  **本命题不断言的内容**：
    (1) 不断言时空超对称的存在性（原书在此处只把无质量态按 N = 1 多重态分组；
        本图无杂化弦时空超对称节点）。
    (2) 不断言 SO(8) 表示的分解规则（8_v × 8_v = 1 + 28 + 35 等）——那属于附录 B 的
        旋量/表示论，本图无节点，见 gaps。
    (3) 不断言整体规范群是 SO(32) 还是 Spin(32)/Z₂：本卡断言的是**李代数** so(32) 的伴随
        （496 维）。见 worldsheet.heterotic-string-construction 的 notes。
    (4) 不断言 496 这个数与 consistency 区「引力反常要求 496 个左手费米子」
        （consistency.gravitational-anomaly-requires-496-fermions）之间有推导关系——
        本图**不加这条边**，两者是独立来源下的同一个数字，见 notes。
uses_conventions:
