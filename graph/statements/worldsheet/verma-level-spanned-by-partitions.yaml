sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Virasoro/VermaPBW.lean :: StringFormal.Virasoro.{IsOrdWord, ordSpan, partitionWord, straighten, wordAct_mem_ordSpan, levelSpan_eq_ordSpan, levelSpan_eq_span_range_partitionWord, finrank_levelSpan_le_card_partition}"
    note: |
      本仓库，合并提交 11b4c0f（"merge: Fock form indefinite over ordered rings; Verma level subspaces
      spanned by partitions (formalizer)"），形式化分支 agent/formalizer/straightening-and-indefinite
      @ 9995a96；Lean 4 + Mathlib v4.33.1。逐条对应：
        (1) straightening → `straighten`（结论还带 wordMeasure 不增的上界，见推导 notes）
        (2) 任意词 ∈ 有序词张成 → `wordAct_mem_ordSpan`
        (3) V_N = span{分拆词} → `levelSpan_eq_ordSpan` 与 `levelSpan_eq_span_range_partitionWord`
            （`partitionWord R c h N p`，p : Nat.Partition N）
        (4) dim_K V_N ≤ p(N) → `finrank_levelSpan_le_card_partition`
            （p(N) 写作 `Fintype.card (Nat.Partition N)`）
      `lean_decl` 只填得下一个名字，填了主结论 (4)。文件头自述「No sorry, no new axioms」，
      formal/TODO.md 的 pbw-verma (a) 记「公理只有标准三条」。有序词的 Lean 定义
      `IsOrdWord l`：l 是严格负、**非降**的整数表 [−b_1, …, −b_k]（即 b_1 ≥ ⋯ ≥ b_k ≥ 1），
      `wordAct` 按 foldr 作用，故 `wordAct [−b_1, …, −b_k] |c,h⟩ = L_{−b_1}(⋯(L_{−b_k}|c,h⟩))`，
      与本节点的写法一致。
  - ref: kac-raina-1987
    loc: "Virasoro 代数最高权表示、Verma 模的 PBW 基与特征标这一主题；**不写 Lecture 编号**（sources.bib 的版本陷阱：两版讲号不可互换）"
    note: |
      文献侧不把 straightening 单列为命题——它是 PBW 定理证明的「张成」一半，
      教科书里作为 PBW 的一部分一并陈述。本节点把它拆出来单列，是因为这一半已被机器证明
      而另一半（线性无关）没有；见 math.verma-module-free-over-negative-part--via-pbw-theorem 的 gaps
      （2026-09-11 起 worldsheet.verma-module-pbw-basis 已 superseded_by math.verma-module-free-over-negative-part）。
tags: [cft, representation-theory, verma-module, pbw, straightening, formalized]
notes: |
  【记号约定（curator 2026-09-11 补）】uses_conventions 新增 conv.verma-module-notation：
  本图记 V(c,h)、最高权向量 |c,h⟩，对照 Kytölä 𝒱_{c,h} / v_{c,h}、Lian–Zuckerman M(c,h)、
  Humphreys Z(λ)。**statement 文本未改**（原则 1），该约定只是把已在用的记号显式化并给出对照表。

  【与 math.verma-module-free-over-negative-part 的分工】那张卡是完整的 PBW 结论
  （有序词构成**基**、dim = p(N)、V ≠ 0），rigorous 未形式化。本卡片只是它的
  「≤」一半（张成），formalized。那张卡的推导 --via-pbw-theorem 现在 depends_on 本卡片：
  它 summary (2)(3) 中「有序词张成」这一半由本卡片提供，剩下「线性无关」才是 PBW 真正的输入。
  ⚠ **本卡 statement（范围说明那两句）里写的 worldsheet.verma-module-pbw-basis 已于 2026-09-11
  superseded_by math.verma-module-free-over-negative-part**（两卡内容逐条重叠，后者来源更好，
  其推导 --via-pbw 已删除）。陈述文本按项目原则 1 不改，读到那两句时一律读作新卡。
  记法差别只有基元下标的标号顺序（旧卡 n_1 ≥ … ≥ n_k，新卡 1 ≤ n_1 ≤ … ≤ n_m），同一组基元。

  【formalizer 的三点说明】（2026-09-11，formal/TODO.md pbw-verma (a) 与 VermaPBW.lean 文件头）
  1. (1)(2)(3) 的**张成**结论对任意交换 ℚ-代数 R 成立（`section Span` / `section Level`
     的 `variable [CommRing R] [Algebra ℚ R]`），不需要域。
  2. (4) 的 finrank 界需要 **特征零的域** K（`section Dim` 的 `[Field K] [CharZero K]`），
     因为 `Module.finrank` 与 `finrank_range_le_card` 需要域上的维数理论。
  3. `Fintype.card (Nat.Partition N)` **不可由 `decide` 核归约**：Mathlib 的 `Fintype (Nat.Partition N)`
     实例经 `Fintype.ofSurjective` 从 `Composition N` 构造，不是可计算枚举。
     它**按定义**就是分拆函数 p(N)（Nat.Partition N 是「正整数多重集、和为 N」），
     不需要另证「card = p(N)」，但也不能用它算出具体数值。

  【为什么不把本卡片合进 verma-module-v2】v2 是定义卡，已明确把 PBW 的两半都划出去
  （其【不断言】(a)(b)）；本卡片是命题卡，且其 status 由推导计算（formalized），
  与 v2 的 definition/formalized 是不同性质的东西。

  【与 worldsheet.descendant-weight-grading 的关系】那条只说降算符提高 L_0 本征值，
  不涉及张成或线性无关；不重复。

  【与 worldsheet.verma-level-shift-by-lowering 的关系（2026-09-11 新增那张卡）】
  本卡的 straightening 是**同一 level 内**把词重排成有序词；那张卡是**跨 level** 的移位
  L_{−k}(V_N) ⊆ V_{N+k}（formalized，任意交换 ℚ-代数）。两者都不使用对方：
  本卡 (1) 的 `straighten` 在固定总模态下做归纳，那张卡只是往词前面接一个字母。不重复。
