id: worldsheet.verma-level-spanned-by-partitions
kind: proposition
title: Verma 模的 level N 分量由 N 的分拆所指标的有序单项式张成，故 dim_K V_N ≤ p(N)（PBW 的 straightening 一半）
statement: |
  设 R 是交换 ℚ-代数，(c, h) ∈ R^2，V(c,h) 为 Verma 模（worldsheet.verma-module-v2），
  |c,h⟩ 为其最高权向量，V_N ⊆ V(c,h) 为其 level N 分量（由 N 的全体合成所对应的负模态词
  L_{-b_1} ⋯ L_{-b_k}|c,h⟩，b_1 + ⋯ + b_k = N，b_i ≥ 1，张成的 R-子模；同上引节点）。
  称负模态词 L_{-b_1} L_{-b_2} ⋯ L_{-b_k} |c,h⟩ 为**有序**的，若 b_1 ≥ b_2 ≥ ⋯ ≥ b_k ≥ 1。

  (1) **straightening**：对任意 a ≥ 1 与任意有序词 w = L_{-b_1} ⋯ L_{-b_k}|c,h⟩，
      L_{-a} w 落在总模态为 a + Σ b_i 的有序词所张成的 R-子模内。

  (2) **任意负模态词落在有序词的张成内**：对任意 n_1, …, n_k ≥ 1，
      L_{-n_1} ⋯ L_{-n_k} |c,h⟩ ∈ span_R { 有序词，总模态 = Σ n_i }。

  (3) **V_N 由分拆指标的有序词张成**：
        V_N = span_R { L_{-b_1} ⋯ L_{-b_k} |c,h⟩ : (b_1 ≥ ⋯ ≥ b_k ≥ 1) 是 N 的整数分拆 }，
      即一个由 N 的分拆集合 Par(N) 指标化的张成族。

  (4) **维数上界**：若 R = K 是特征零的域，则
        dim_K V_N ≤ p(N)，
      其中 p(N) = |Par(N)| 是分拆函数。

  【本节点明确**不**断言】
  (a) 上述有序词**线性无关**，即 dim_K V_N ≥ p(N) 与 dim_K V_N = p(N)。那是
      Poincaré–Birkhoff–Witt 定理（对 U(Vir_-)）加诱导模的自由性，由
      worldsheet.verma-module-pbw-basis 承载（rigorous，未形式化）。
  (b) V(c,h) ≠ 0。本节点的一切结论在 V(c,h) = 0 时平凡成立（空洞真），
      非零性同样归 worldsheet.verma-module-pbw-basis。
  (c) 与 Verma 模的不可约性、奇异向量、Kac 行列式无关。
uses_conventions: [conv.virasoro-standard, conv.verma-module-notation]
