id: worldsheet.disk-conformal-killing-group
kind: proposition
title: 圆盘的共形 Killing 群是 PSL(2,R)，κ(D₂) = 3；边界三点可被固定，两种循环序不等价
statement: |
  设 D₂ 按 worldsheet.tree-level-worldsheet-topologies 实现为上半平面 H（边界 = 实轴 ∪ {∞}）。则：

  **(1)** D₂ 的共形 Killing 向量是 S₂ 的 CKV 中与认同 z ∼ 1/z̄ 相容（等价地：在实轴上取实值，
  δz|_{z ∈ R} ∈ R）的那些，即 δz = a₀ + a₁z + a₂z² 且 a₀, a₁, a₂ **全为实**。
  故 **κ(D₂) = 3 个实 CKV**，相应的整体群是实 Möbius 群
    z ↦ (αz + β)/(γz + δ),  α,β,γ,δ ∈ R,  αδ − βγ = 1，模去 ±1，
  即 **PSL(2,R)**；它把 H 映到 H、把边界映到边界。
  与 Riemann–Roch 的对照：χ(D₂) = 1、μ(D₂) = 0，故 3χ = κ − μ = 3 − 0 = 3。

  **(2)（三点固定）** PSL(2,R) 在边界上**保持定向**，因而保持三点的**循环序**：
  给定边界上三个互不相同的点 y₁, y₂, y₃，存在唯一的 PSL(2,R) 元把它们送到任一组指定的
  **同循环序**的三点；而 (y₁,y₂,y₃) 与 (y₁,y₃,y₂) 这两个循环序**不被** PSL(2,R) 联系，
  是两条不同的轨道。
  **后果**：开弦树级振幅在用 PSL(2,R) 固定三个边界坐标之后，仍需对这**两种循环序求和**
  ——这正是 spectrum.open-string-three-tachyon-amplitude 中 「+ (k₂ ↔ k₃)」项的来源。

  **本命题不断言什么**：不断言 D₂ 无模（μ = 0 属第 5 章 Riemann–Roch，本图暂无节点，
  这里只作对照记录）；不涉及 Chan–Paton 因子（两种循环序各自配的迹见 spectrum.chan-paton-*）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§6.1「The disk」, p. 168（(6.1.8) 之后）：CKG 是 PSL(2,C) 中保持圆盘边界的子群 = PSL(2,R)，且「Again, all metrics are equivalent — there are no moduli.」；**无式号**"
    note: |
      **L1 原书页图逐字核实**（literature/extractions/math-sources.md §39.6(c)；Cambridge Core
      ch.6 PDF，PDF 页 = 书页 − 165）。原书逐字：
      「The CKG of the disk is the subgroup of PSL(2,C) that leaves the boundary of the disk fixed.
      For the reflection (6.1.8) this is just the subgroup of (6.1.6) with α, β, γ, δ all real,
      which is **PSL(2,R)**, the Möbius group with real parameters. One CKV is the ordinary
      rotational symmetry of the disk. Again, all metrics are equivalent — there are no moduli.」
      （(6.1.7) 是 z′ = 1/z̄，(6.1.8) 是共形等价的 z′ = z̄；(6.1.6) 是一般 Möbius 变换
      z′ = (αz+β)/(γz+δ)，p.168 上方由 αδ − βγ = 1 与整体反号认同定义 PSL(2,C)。）
  - ref: polchinski-1998-v1
    loc: "§6.4 开头, **p. 178**：「We represent the disk as the upper half-plane so the boundary coordinate y is real. There are no moduli. After fixing the metric, the CKG PSL(2,R) can be used to fix the three vertex operators to arbitrary positions y₁, y₂, y₃ on the boundary, except that this group **does not change the cyclic ordering** of the vertex operators so we must sum over the two orderings.」；**无式号**"
    note: |
      **L1 原书页图逐字核实**（math-sources.md §39.8(C)）。
      **★ 本条直接结案了本卡原先登记的文献歧义：原书站「不被 PSL(2,R) 联系」一边，
      与本卡片 statement (2) 的选择一致；[S] 那句「are linked by a PSL(2,R) transformation」
      确认为伴读者的错误。**
      ⚠ **原书只说 "arbitrary positions"，没有说「唯一」**——statement (2) 里的「存在唯一的
      PSL(2,R) 元」是**非书内陈述**，其承载节点是 math.mobius-group-sharply-three-transitive
      （单可迁性），推导 --via-real-mobius-subgroup 已挂该依赖。
  - ref: polchinski-1998-v1
    loc: "§5.2, eq. (5.2.11a), p. 152：「χ > 0 : κ = 3χ, μ = 0」（配 χ(D₂) = 1 给 κ = 3）"
    note: |
      L1 原书页图（math-sources.md §39.6(a)）。
      ⚠ **2026-09-11 订正**：statement (1) 末句的「3χ = κ − μ = 3 − 0 = 3」这条对照关系
      **不在 §6.4**——researcher 读了书上 pp.178–181，那里没有这条式子。
      它的书内位置是 §5.2 的 **(5.2.9)**（原书写作 μ − κ = −3χ）与 **(5.2.11a)**。
      本条 source 就是为承载这半句而单列的（原先它被错记在 §6.4 的 loc 里）。
  - ref: milicic-riemann-surfaces
    loc: "Theorem 1.7.3, p.10（Aut(D(0,1)) 是 SU(1,1) 的商，核 {±I}）+ §1.9, p.11 的无编号句（SL(2,R) ≅ SU(1,1)）"
    note: |
      **数学侧可选补强，L1**（math-sources.md §39.7.1）；本卡登记它以便日后建一条 rigorous 的
      数学推导。⚠ **「Aut(D) = PSL(2,R)」在该讲义里没有单一编号**，是 Theorem 1.7.3 与 §1.9
      两处合成；引用时要么写两处，要么只引 SU(1,1) 版。
      ⚠ 该文件**未印年份**，bib key 不带年份（`milicic-riemann-surfaces`），
      偏离 literature/CLAUDE.md 的 key 规范，待 lead 裁决。
      ⚠ 本条**目前不承载本卡的任何推导**：现有推导 --via-real-mobius-subgroup 走的是
      Polchinski 的「取相容子群」路线；且 Aut(D) 是**全部**全纯自同构群，
      本卡 statement 刻意不断言 PSL(2,R) 是全部（见 math.mobius-group-sharply-three-transitive 的
      「本命题不断言什么」）。
  - ref: schrans-2020
    loc: "§6.27（笔记 p.299）+ 图 6.7：本卡内容最初的读取来源（核对源）"
    note: |
      ⚠ **2026-09-11 追记**：[S] §6.27 那句「fixed on the real axis … in two ways that **are
      linked by** a PSL(2,R) transformation, depending on the cyclic order」**已由原书 p.178
      确认为错误**，建议加进 [[lit-polchinski-v1-equation-anchors]] 的「[S] 已确证的错误」清单。
      本条只保留为历史读取来源。
