id: worldsheet.disk-conformal-killing-group
kind: proposition
title: 圆盘的共形 Killing 群是 PSL(2,R)，κ(D₂) = 3；边界三点可被固定，两种循环序不等价
statement: |
  设 D₂ 按 worldsheet.tree-level-worldsheet-topologies 实现为上半平面 H（边界 = 实轴 ∪ {∞}）。则：

  **(1)** D₂ 的共形 Killing 向量是 S₂ 的 CKV 中与认同 z ∼ 1/z̄ 相容（等价地：在实轴上取实值，
  δz|_{z ∈ R} ∈ R）的那些，即 δz = a₀ + a₁z + a₂z² 且 a₀, a₁, a₂ **全为实**。
  故 **κ(D₂) = 3 个实 CKV**，相应的整体群是实 Möbius 群
    z ↦ (αz + β)/(γz + δ),  α,β,γ,δ ∈ R,  αδ − βγ = 1，模去 ±1，
  即 **PSL(2,R)**；它把 H 映到 H、把边界映到边界。
  与 Riemann–Roch 的对照：χ(D₂) = 1、μ(D₂) = 0，故 3χ = κ − μ = 3 − 0 = 3。

  **(2)（三点固定）** PSL(2,R) 在边界上**保持定向**，因而保持三点的**循环序**：
  给定边界上三个互不相同的点 y₁, y₂, y₃，存在唯一的 PSL(2,R) 元把它们送到任一组指定的
  **同循环序**的三点；而 (y₁,y₂,y₃) 与 (y₁,y₃,y₂) 这两个循环序**不被** PSL(2,R) 联系，
  是两条不同的轨道。
  **后果**：开弦树级振幅在用 PSL(2,R) 固定三个边界坐标之后，仍需对这**两种循环序求和**
  ——这正是 spectrum.open-string-three-tachyon-amplitude 中 「+ (k₂ ↔ k₃)」项的来源。

  **本命题不断言什么**：不断言 D₂ 无模（μ = 0 属第 5 章 Riemann–Roch，本图暂无节点，
  这里只作对照记录）；不涉及 Chan–Paton 因子（两种循环序各自配的迹见 spectrum.chan-paton-*）。
