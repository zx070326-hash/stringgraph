notes: |
  由 curator 于 2026-09-11 从抽取记录 E90 建立。

  **★ 2026-09-11 订正（curator-surface-class，依 math-sources.md §39.8(C)；researcher 取到原书
  ch.6 页图）——四项，全部是 loc/notes 层面的更正，statement 文本一字未改：**

  1. **文献歧义结案。** 本卡原 notes 记录的歧义（[S] 说两种循环序「are linked by a PSL(2,R)
     transformation」，与本卡的「不被联系」相反）**已由原书 §6.4 开头 p.178 逐字裁定**：
     原书写「this group **does not change the cyclic ordering** of the vertex operators
     so we must sum over the two orderings」。**本卡片当初的选择正确，[S] 是错的。**
     因此原 notes 里的限定句「**但 (a) 是 curator 的数学论证、不是文献内容**」
     **撤销**——理由 (a)（PSL(2,R) 保定向 ⇒ 保循环序）现在有原书正文背书。
     （原理由 (b)：(6.4.2) 里「+ ⟨k₂ ↔ k₃⟩」项的存在，仍是有效的书内旁证。）
  2. **页码更正**：§6.4 开头在书上 **p. 178**，不是原先写的「p.179 附近」。
  3. **「3χ = κ − μ = 3 − 0」从 §6.4 的 loc 里摘出**：researcher 读了 pp.178–181，
     **那里没有这条式子**。它已改挂到独立的 §5.2 (5.2.11a) source 条目上。
  4. **「PSL(2,R) 记号写在原书哪一式未核实」撤销**：该记号在原书出现于**两处、均无式号**——
     **p. 168**（§6.1「The disk」，(6.1.8) 之后）与 **p. 178**（§6.4 开头）。两处 loc 都已写死。

  **⚠ 遗留：statement (2) 的「唯一」不是书内陈述。** 原书只写 "arbitrary positions"。
  唯一性由 math.mobius-group-sharply-three-transitive（PSL(2,R) 在同循环序三元组上**单可迁**）
  承载，推导 worldsheet.disk-conformal-killing-group--via-real-mobius-subgroup 已挂该依赖。
  本图**不因此换代**：命题内容正确、依赖已建，只是来源分工需说明（本条即说明）。

  **与第 5 章的接口（保留原 notes 的记录，并按本轮更新）**：κ − μ = 3χ（(5.2.9)）与 χ(D₂) = 1
  都属第 5 章。本卡建立时 ch5 节点尚未进 main，故只把它们作为**对照**写在 statement 里、不建依赖边。
  ch5 节点现已在 main（worldsheet.riemann-roch-kappa-minus-mu），可补一条
  --via-riemann-roch 的独立推导；但注意 μ(D₂) = 0 那一半在图上仍是断言
  （见 worldsheet.positive-euler-number-no-moduli--via-surface-enumeration 的 gaps 第二条）。

  **待办（不在本次改动范围内）**：推导节点
  worldsheet.disk-conformal-killing-group--via-real-mobius-subgroup 的 sources loc 仍写
  「§6.4 开头（p.179 附近）」且 gaps 第一条仍把文献歧义记为未决——**两处都应按上面 1、2 更新**。
  本次任务的改动范围只限本 statement 卡，故未动；已在报告中提请 lead 派单。
