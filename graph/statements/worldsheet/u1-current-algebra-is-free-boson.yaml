id: worldsheet.u1-current-algebra-is-free-boson
kind: proposition
title: "每个 U(1) 流代数同构于一个自由玻色子 CFT：j^a j^b ∼ δ^{ab}/z² 的流可写成 j^a = i∂H^a（H 按 H(z)H(0) ∼ −ln z 归一），其 Sugawara 张量为 T^s = (1/2) :jj:"
statement: |
  设二维 CFT 含若干全纯 (1,0) 流 j^a，其 OPE 无 1/z 项、且双极点系数归一为
    j^a(z) j^b(0) ∼ δ^{ab}/z²                                                （(11.5.14)）
  （即 g 为 abel 的、结构常数为零的流代数，math.affine-lie-algebra-current-ope 的 (11.5.1) 在 c^{ab}{}_c = 0
  且 k^{ab} = δ^{ab} 时）。则每个这样的 U(1) 流代数**同构于一个自由玻色子 CFT**：
    j^a = i ∂H^a                                                              （(11.5.15)）,
  H^a 为按 conv.nonembedding-scalar-normalization 归一（H(z)H(0) ∼ −ln z）的全纯标量。
  原书逐字：'From this OPE and holomorphicity it follows that each U(1) current algebra is isomorphic to a
  free boson CFT, j^a = i∂H^a (11.5.15). We will often use this equivalence.'

  相应地，U(1) 流的 Sugawara 能动张量为
    T^s_B = (1/2) :jj:                                                        （(11.5.27)）
  （原书逐字：'as one sees by writing the current in terms of a free boson, j = i∂H'），
  中心荷 c = 1（(11.5.25) 在 dim(g) = 1、h(g) = 0 时）。

  **本命题不断言的内容**：
    (1) 不断言「同构」的精确含义（是流生成的子代数的表示同构于 Fock 空间，还是整个 CFT 同构于自由玻色子
        ——原书未说明；后者显然不成立，因为一般 CFT 还有别的场）；
    (2) 不断言 (11.5.27) 有独立于自由玻色子的证明（抽取记录 E61 备注：'由自由玻色子反推，不是独立证明'）；
    (3) 不断言 H^a 的零模 / 动量格结构（紧化半径、顶点算子 e^{iqH} 的谱），那是 compact.* 与玻色化各卡的内容。
uses_conventions:
  - conv.nonembedding-scalar-normalization
  - conv.worldsheet-complex-coords
  - conv.virasoro-standard
sources:
