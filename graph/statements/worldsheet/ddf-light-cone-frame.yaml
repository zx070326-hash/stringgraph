  lean_decl: StringFormal.NoGhost.DDFLightConeFrame
  lean_file: StringFormal/NoGhost/LightConeFrame.lean
sources:
  - ref: gebert-nicolai-1995
    loc: "§3.2 末, p.599 正文：'we can always find d − 2 orthonormal vectors ξ_i ∈ Λ_ℝ, 1 ≤ i ≤ d − 2, orthogonal to both r and k'（常设归一化 r·k = 1 写在 (3.29) 之前）"
    note: |
      **本卡 (F6) (T′) 的文献锚点，L1 逐字**（literature/extractions/gsw-1987-v1.md E17 备注 2 与
      §7 的 Q5；sources.bib 的 gebert-nicolai-1995 条 note 逐字转录同一句）。
      G–N 的 r 是**态的动量**（本卡的 p，重标度后 a），k 是类光参考向量（本卡的 k_0，重标度后 b），
      故「orthogonal to both r and k」逐字就是 (F5)+(F6)。他们在偶自对偶格 Λ 上工作，
      号差与本卡的 conv.metric-mostly-plus 在此处无差别（只用到正交关系与 Gram = δ_{ij}）。
      ⚠ **不承载 (F8)**：G–N 不写完备性；其 p.599 的无鬼定理引文（「account for all physical
      states」）默认了它，但那是引 [26] = GT 1972 的结论，不是对标架的条件陈述。
  - ref: goddard-2008
    loc: "§5 'Spectrum Generating Algebra', p.11, (5.1) 后正文：'the ε^i, 1 ≤ i ≤ D−2, are orthonormal polarization vectors for a photon of momentum k, i.e. ε^i · ε^j = δ^{ij}, k · ε^i = 0'"
    note: |
      **只承载 (F5)(F7)**，L1 逐字（literature/extractions/gsw-1987-v1.md E1）。
      号差逐字 (−,+,+,+)，与 conv.metric-mostly-plus 一致；归一化逐字 k·p = 1，在 α' = 1/2 下即 (F3)。
      ⚠ Goddard **不写** (F6) 与 (F8)，也不写共轭方向 b̃ 的条件 (F4)；这正是
      worldsheet.ddf-operators-v6 的 notes 里登记的那条落差。(F6) 的逐字来源是上面的 gebert-nicolai-1995。
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/LightConeFrame.lean :: StringFormal.NoGhost.{DDFLightConeFrame, witnessDDFLightConeFrame, dotVec_polarization_conj_eq_zero, DDFLightConeFrame.dotVec_trans_conj_eq_zero, DDFLightConeFrame.lie_conjOp_transOp, DDFLightConeFrame.dotVec_self_eq_two}；formal/StringFormal/NoGhost/LightCone.lean :: StringFormal.NoGhost.{LightConeFrame, TransverseFrame, FrameSpansOrthogonal, witnessLightConeFrame, witnessTransverseFrame, dotVec_witnessTransverseFrame_witnessMomentum, witness_frameSpansOrthogonal}；formal/StringFormal/NoGhost/Witness.lean :: StringFormal.NoGhost.{witnessLight, witnessMomentum, witnessConjugate, witnessPolarization, noghost_lightcone_frame_satisfiable, noghost_transverse_gram_satisfiable, dotVec_witnessLight_witnessConjugate, dotVec_witnessConjugate_self, invTwo_mul_zeroModeSq_witnessMomentum}"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry（noghost-a/-b 两批以 6ed1638/4aded75 合入 main；
      `DDFLightConeFrame` 打包及 bonus (ii) 本批，分支 `agent/formalizer/lightcone-struct`，
      `check_axioms` 全 `ok`，公理集只有 `propext`/`Classical.choice`/`Quot.sound`）。
      **逐句字典（现由单个结构 `DDFLightConeFrame η a b` 打包，与本卡八条逐条对应）**：
      (F1) ⇒ `hη : ∀ μ, η μ * η μ = 1`（见证 `Fock.minkowski`，`minkowski_sq`）；
      (F2) ⇒ `frame : LightConeFrame η b` 的 `.isotropic`；(F3) ⇒ `hba`；
      (F4) 的 η(b̃,b̃) = 0 与 η(b,b̃) = −1 ⇒ `frame.conj_isotropic` / `frame.pairing`，
      span 一半 ⇒ 新字段 `hconjSpan : ∃ β γ, frame.conj = β • a + γ • b`
      （见证兑现是 `witnessConjugate_eq_neg_witnessMomentum_add_witnessLight`：β=−1, γ=1，
      即 b̃ = b − a）；(F5) ⇒ `trans : TransverseFrame η b` 的 `.transverse`；
      (F7) ⇒ `trans.orthonormal`；(F6) ⇒ 新字段 `hεa : ∀ i, dotVec η (trans.vec i) a = 0`，
      见证兑现是 `dotVec_witnessTransverseFrame_witnessMomentum`；
      (F8) ⇒ 新字段 `hspan : FrameSpansOrthogonal η trans (towerMomentum a b (-1))`，见证兑现是
      `witness_frameSpansOrthogonal`；(F9) 现由 `DDFLightConeFrame.dotVec_trans_conj_eq_zero`
      （纯双线性，`dotVec_polarization_conj_eq_zero` 的特化）证出，且
      `DDFLightConeFrame.lie_conjOp_transOp` 直接从结构数据消去了 `lie_conjOp_transOp` 原本
      松散的 `hεconj` 前提。`witnessDDFLightConeFrame` 是显式标架的非空性见证。
      **`DDFLightConeFrame` 的八个字段与本卡 (F1)–(F8) 逐条一一对应，无缺项无多余**。
      **bonus (ii) 现已形式化**：`DDFLightConeFrame.dotVec_self_eq_two`（`[Field R]`，`hD : 2 ≤ D`）
      证出卡 notes【curator 手算】(ii) 「(F6)(F7)(F8) 在域上 ⟹ η(a,a) = 2」，秩零化度
      （`LinearMap.finrank_range_add_finrank_ker`）+ `Submodule.finrank_mono` 给出维数计数，
      `SetLike.not_le_iff_exists` 取出 `ker L ⊄ span{ε_i}` 的见证向量 `e`，其余是配对代数。
      **不改本卡条件表**：(F8) 仍是定义里的假设，不因此弱化或替换（对应本卡【不断言】(d)）。
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103）"
    note: |
      **不承载本卡任何条件**：该节正文与式号本项目仍未获取（L0，只有 Google Books 页码区间约束，
      literature/extractions/gsw-1987-v1.md §1）。列在此处只为标注文献侧同一段落的位置。
tags: [bosonic-string, spectrum-generating-algebra, no-ghost, light-cone, definition, frame]
notes: |
  【为什么立卡（curator 2026-09-11，lightcone-frame；lead 派工）】
  worldsheet.ddf-operators-v6 的 notes 末段逐字建议：「(T′) **不是** `ddfOp` 定义的参数……
  正确的落点是「横向标架」那一层」；worldsheet.transverse-frame-spans-orthogonal-complement 的
  notes【一般情形该怎么补】逐字建议：「把「取在 span{k_0,p}^⊥ 里」写成标架的**定义条件**
  （一张 `worldsheet.ddf-light-cone-frame` 定义卡），让 (T′) 与完备性都成为它的组成部分。
  本轮不建」。本卡即那两段点名的卡。两处 notes 已加段指向本卡（同一分支）。

  【为什么曾经不是 formalized，现在是了（formalizer 2026-09-11，分支 agent/formalizer/lightcone-struct）】
  八条条件**逐条**都有 Lean 对应物（sources 第三条的字典），但此前没有任何一个 Lean 声明把它们打包：
  `LightConeFrame` 缺 (F4) 的 span 条件，`TransverseFrame` 缺 (F6)，(F8) 是独立的 `def`，
  (F9) 只作为 `lie_conjOp_transOp` 的散装假设。**现已由 `structure DDFLightConeFrame`
  （`StringFormal/NoGhost/LightConeFrame.lean`）打包，八个字段与 (F1)–(F8) 逐条一一对应**，
  `witnessDDFLightConeFrame` 用显式标架证非空，故按 docs/STATUS_LEVELS.md 定义卡的
  `formalized` 要求（「有 Lean 声明逐句对应」）升级本卡 status 为 `formalized`。
  副产品：(F9) 现有独立证明（`DDFLightConeFrame.dotVec_trans_conj_eq_zero`，纯双线性）；
  `DDFLightConeFrame.lie_conjOp_transOp` 从结构数据直接消去了原来 `lie_conjOp_transOp`
  的松散前提 `hεconj`。**另一个 bonus**：下面【curator 手算】(ii) 的域上维数计数论证
  （η(a,a)=2 的推出）**现已形式化**为 `DDFLightConeFrame.dotVec_self_eq_two`（同分支，
  `[Field R]`，秩零化度 + `Submodule.finrank_mono` 维数计数，`check_axioms` ok），
  故 (ii) 从下面【均未形式化】清单移出；(i)(iii) 仍是手算，未形式化。

  【curator 手算的三条推演（(i)(iii) 仍**未形式化、未经 reviewer 复核**；(ii) 现已 Lean 形式化，
  见上 sources 的 stringformal-2026 条，`DDFLightConeFrame.dotVec_self_eq_two`；三条均不在
  陈述里——本卡【不断言】(d) 明确不把质壳写进定义）】
  设 (F1)–(F7) 成立，并设 {b, b̃, ε_i} 张成全空间（本卡【不断言】(c) 不假设这条）。
  (i) **b̃ 被 (F4) 唯一确定**：写 b̃ = βa + γb，则 η(b,b̃) = β η(b,a) = β，故 β = −1；
      再由 η(b̃,b̃) = η(a,a) − 2γ η(a,b) = η(a,a) − 2γ = 0 得 γ = η(a,a)/2（此处用到 ½ ∈ R）。
      即 b̃ = (η(a,a)/2)·b − a。见证里 η(a,a) = 2，故 b̃ = b − a，与 `witnessConjugate` 逐字一致。
  (ii) **(F8) 隐含快子壳**：v = a − b，由 (F5)(F6) 得 η(ε_i, v) = 0。对任意 e ∈ v^⊥ 把 (F8) 的分解
      与 v 配对：0 = η(e,v) = Σ c_i η(ε_i,v) + c_0 η(v,v) = c_0 η(v,v)。
      在域上（η 非退化、v ≠ 0）dim v^⊥ = D − 1 > D − 2 = dim span{ε_i}（(F7) 给独立性），
      故存在 e ∈ v^⊥ 的分解必须带 c_0 ≠ 0，于是 η(v,v) = 0。
      而 η(v,v) = η(a,a) − 2η(a,b) + η(b,b) = η(a,a) − 2，故 **η(a,a) = 2，即 α' p² = 1**。
      ⇒ (F8) 不是一条「纯线性代数的方便条件」：它在域上等价地钉住了截距 a₀ = 1 的快子壳。
      这解释了为什么 worldsheet.ddf-hypotheses-satisfiable 的见证必须带质壳 (M)。
      **本条现由 `DDFLightConeFrame.dotVec_self_eq_two` 形式化**：Lean 证明不假设「η 非退化」
      或「dim v^⊥ = D−1」这类需要非退化性的说法，而是直接用秩零化度算出
      `finrank (ker L) ≥ D − 1`（`L e := η(e,v)`，`finrank (range L) ≤ 1` 因为陪域是 `R` 自身），
      与 `finrank span{ε_i} ≤ D − 2` 比较得出 `ker L ⊄ span{ε_i}`；手算这里写的「dim v^⊥ = D−1」
      在 Lean 版本里被换成了更弱、不需要非退化性的秩零化度不等式，逻辑等价但适用域更宽。
  (iii) **「基」形式 ⇒ (F8)**：若 {b, b̃, ε_i} 是基且快子壳成立，则由 (i) b̃ = b − a = −v，
      对 e ⊥ v 写 e = βb + β̃b̃ + Σc_iε_i，与 v = −b̃ 配对得 0 = η(e,v) = −β η(b,b̃) = β，
      故 e = β̃b̃ + Σc_iε_i = (−β̃)v + Σc_iε_i，即 (F8)。
      ⇒ 标架的自然形式（{b,b̃,ε} 是基）在快子壳上蕴含 Lean 用的 v^⊥ 形式。反向不成立
      （(F8) 只给生成，不给独立性）。
  ⚠ (i)(iii) 仍只是记账用的手算，要进图必须先形式化（(iii) 需要「是基」这个额外的线性无关性假设，
  本卡未提供），或走 docs/STATUS_LEVELS.md 的 rigorous 例外（reviewer 独立复核 + 推导 notes 写
  reviewer-verified）。

  【与三张邻卡的分工】
  · worldsheet.ddf-operators-v6（definition, formalized）：A^ε_n 本身；(T) 是它的定义参数，
    (N)(S) 是它的定理假设。**本卡不改它、不换代它**（lead 指示），只在它的 notes 里加指针。
  · worldsheet.transverse-frame-spans-orthogonal-complement（proposition, formalized）：
    断言「显式见证标架满足 (F8)」+「(F8) 在一般标架下独立」。本卡把 (F8) 收进定义条件后，
    那张卡的地位不变——它证的是**见证兑现**，正是本卡【非空性】一段引用的东西。
  · worldsheet.ddf-hypotheses-satisfiable（proposition, formalized）：断言 (F1)(F2)(F3)(F5) 加
    ε·ε = 1 与质壳可同时满足。本卡的【非空性】比它多要 (F4)(F6)(F8)，少要「ε 是单个向量」；
    两者的见证是同一组向量。**没有重复**：那张卡是可满足性命题，本卡是定义。

  【2026-09-12 追记（curator，分支 agent/curator/pr34-wire，PR3 落地后）：【不断言】(c) 的
  「线性无关/基/系数唯一」三件事，其中两件半现已在 Lean 里有定理，但仍不构成对 (c) 的推翻】
  formal/StringFormal/NoGhost/LightConeResolutionGen.lean（蓝图 §B′ PR3）新增两条定理，
  都建在本卡的标架对象 `DDFLightConeFrame η a b`（本卡 formal.lean_decl）之上：
  · **`DDFLightConeFrame.frame_decomp_coeff`**（任意 `[CommRing R]`，**不需要** `[Field R]`、
    `[Algebra ℚ R]`、`hD : 2 ≤ D` 中的任何一条）：若 e = λ•b + μ•b̃ + Σᵢ cᵢ•εᵢ，
    则系数**唯一且有显式公式** λ = −(b̃·e)、μ = −(b·e)、cⱼ = εⱼ·e（配对读出，六个收缩
    (F2)(F4)(F5)(F7)(F9) 够用，不涉及除法）。
  · **`span_range_frameVec_eq_top`**（同样 `[CommRing R]`，只额外要 `hD : 2 ≤ D`）：
    {b, b̃, ε_1, …, ε_{D−2}} 的 R-张成是全空间——即张成本身现在**是定理**（(F8) 完备性
    的一个更强、去范围限制的版本：本卡 (F8) 只要求 (a−b)^⊥ 里的向量可分解，这条定理是
    **任意** e ∈ Fin D → R 可分解，走 `DDFLightConeFrame.exists_frame_decomp`+`towerMomentum_neg_one_eq`
    从 (F8) 推出，不是独立假设）。
  ⇒ **这把 (c) 精确拆成了三件事，两件已解决**：「分解系数一旦给定就唯一」（frame_decomp_coeff，
  已证）与「标架张成全空间」（span_range_frameVec_eq_top，已证）都不再是空白；剩下**唯一没有
  的**是「{b, b̃, ε_i} **线性无关**」本身（即张成映射 `frameVec F : Fin D → (Fin D → R)` 是单射
  ——不能仅从上面两条定理导出：唯一分解系数定理只说「若某分解存在则系数唯一」，不排除
  frameVec 的值域比预期低维、系数式在秩亏时仍可能对某些 e 给出「唯一但错误」的读数）。
  ⚠ **本条不改动 (c) 的文字**（陈述不可变）：(c) 原文「不断言线性无关或构成基」仍然为真，
  只是现在能更精确地说**哪一部分**尚缺——「构成基」= 张成（已证）+ 线性无关（仍缺）。
  【与 b̃ = b − a 的关系】(F4) 只给 b̃ ∈ span{a,b} 与配对条件，**不**单独钉死 b̃ 的具体系数；
  `DDFLightConeFrame.two_mul_conjSpan_coeff_right` 证 2γ = η(a,a)（γ 是 b̃ 的 b-系数），
  故 **b̃ = b − a**（γ=1，配合 β=−1）需要 **`(2:R)` 可逆或至少非零因子**（char ≠ 2）**且**
  η(a,a) = 2（快子壳，见本卡【curator 手算】(ii)）两个条件同时成立；`frame_decomp_coeff`/
  `span_range_frameVec_eq_top`（分解唯一性与张成本身）**不需要这两条中的任何一条**——
  这是本卡「张成/唯一性」与「b̃ 的具体值」两件事在类型类需求上的又一处分离
  （呼应上面【为什么曾经不是 formalized】一节记录的 (F4) span-only vs. `conj_eq_light_sub_momentum`
  的 `[Field][Algebra ℚ]` 版本之间的落差；`LightConeResolutionGen.lean` 文件头把这一点
  写成了独立的「deviation 1」）。
  【图上不新建卡】上述两条定理都以本卡的标架对象为前提对象，不引入本卡未声明的新数据，
  故记为本卡 notes 的补充而非新节点；worldsheet.light-cone-monomials-span-fock-level 是
  另一条相关但不同的张成定理（它是 Fock 空间 level-N 分量被光锥**单项式**张成，本条是
  标架**向量本身**（`Fin D → R` 里 D 个方向向量）张成整个坐标空间 `Fin D → R`——前者在
  MvPolynomial 层，本条在线性代数层，两者不可合并）。

  【⭐ 2026-09-25 lead 补注：【本卡明确不断言】(b) 那句「这在一般环上为假」现在有凭据了】
  该句是一条**实质断言**，而此前卡上无任何凭据支持它——它前面列的 (a) 两个反例支持不了它
  （那两个只说"某一组 ε 不好"，不排除同一 `(η,a,b,b̃)` 上存在别的好 ε；事实上在那个 D=3
  的 ℤ 见证上确实存在，平移后的 `ε′_1 = (−1,−1,1)` 就是）。
  现在有一个：`research/attempts/lorentzian-lightcone-frame-existence/proof.md` 定理 6 在
  `R = ℝ[x,y,z]/(x²+y²+z²−1)`、`D = 4` 上构造反例——(F1)–(F4) 与快子壳全部成立，
  `W` 秩 2、`η|_W` 非退化，但 `W` 稳定自由而**不自由**，故无任何 ε。同文件另证：
  在一切 `char ≠ 2` 的域上存在性**为真**，且完整标架存在 ⟺ `η(a,a) = 2`。
