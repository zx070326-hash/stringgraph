id: worldsheet.ddf-light-cone-frame
kind: definition
status: formalized
title: DDF 光锥标架：类光 b、动量 a（η(b,a) = 1）、共轭类光 b̃（η(b,b̃) = −1、b̃² = 0、b̃ ∈ span{a,b}）与取在 span{k₀,p}^⊥ 内的 D−2 个正交归一横向 ε_i——把 (T′) ε·p = 0 与完备性 (C) 写成**定义条件**
statement: |
  【本卡解决的问题】worldsheet.ddf-operators-v6 只把 (T) ε·k_0 = 0 定为 DDF 算子定义的参数，
  worldsheet.transverse-frame-spans-orthogonal-complement 的 Lean 对应物 `TransverseFrame` 也只要求
  (T) 与正交归一 (O)。文献取的标架比这**窄**：偏振取在 span{k_0, p} 的正交补里，于是
  (T′) ε·p = 0 与完备性 (C) 自动成立。宽出来的部分正好是这两条，而它们在一般交换环上
  **不是** (T)(O) 的推论（【本卡明确不断言】(a) 的两个反例）。本卡把文献的标架写成一条定义，
  给 (T′) 与 (C) 一个落点。

  【数据】D ≥ 3；系数环 R 是交换 Q-代数；对角时空度规分量 η_μ（conv.metric-mostly-plus 下
  η = diag(−1,+1,…,+1)），η(x, y) := Σ_μ η_μ x^μ y^μ；基点动量 p 与类光参考向量 k_0，
  重标度 a^μ := (2α')^{1/2} p^μ、b^μ := (2α')^{1/2} k_0^μ（conv.alpha-prime-regge，记号同
  worldsheet.ddf-operators-v6）；共轭类光向量 b̃；D − 2 个向量 ε_1, …, ε_{D−2}。
  记 v := a − b，即动量塔 T(p;k_0) 第 **−1** 层的重标度动量
  （worldsheet.momentum-tower-fock-space；DDF 态 A^ε_{−1}|0;k⟩ 住在该层）。

  【定义】称 (η; a, b, b̃; ε_1, …, ε_{D−2}) 是一个 **DDF 光锥标架**，若下列八条成立：
    (F1) η_μ² = 1（对一切 μ）；
    (F2) η(b, b) = 0                    —— 即 k_0² = 0，worldsheet.ddf-operators-v6 的 (N)；
    (F3) η(b, a) = 1                    —— 即 2α' k_0·p = 1，同卡的 (S)；
    (F4) η(b̃, b̃) = 0，η(b, b̃) = −1，且 b̃ ∈ span_R{a, b}
                                        —— 共轭类光方向，且它落在 {a,b} 张成的平面内；
    (F5) η(ε_i, b) = 0（∀i）             —— (T) 横向性，同卡的定义参数；
    (F6) η(ε_i, a) = 0（∀i）             —— **(T′) 偏振与基点动量正交**；
    (F7) η(ε_i, ε_j) = δ_{ij}            —— (O) 正交归一；
    (F8) **完备性 (C)**：∀ e : {0,…,D−1} → R，η(e, v) = 0 ⟹
         ∃ c_1, …, c_{D−2}, c_0 ∈ R 使 e = Σ_{i=1}^{D−2} c_i ε_i + c_0 v 。
  (F5)+(F6) 合起来就是「ε_i 取在 span{k_0, p} 的正交补里」这句话的逐字写法。

  【一条即时推论（仅用双线性）】由 (F4) 的 b̃ ∈ span_R{a,b} 与 (F5)(F6)：
    (F9) η(ε_i, b̃) = 0（∀i）。
  这正是 Lean `lie_conjOp_transOp`（[α^{b̃}_m, α^{ε_i}_n] = 0）所需而 `TransverseFrame` **不**提供的
  那条额外条件（登记在 worldsheet.gt-longitudinal-k-algebra 的 notes 里）。

  【非空性：显式见证】D ≥ 3、R 交换 Q-代数时取
    η = diag(−1,+1,…,+1)，b = (1,1,0,…,0)，a = (1/2, 3/2, 0,…,0)，b̃ = (1/2, −1/2, 0,…,0)，
    ε_i = e_{i+1}（i = 1..D−2，即第 2 到第 D−1 个坐标向量）
  满足 (F1)–(F8)（逐条的机检出处见 sources 的 stringformal-2026 条）。故本定义不是空的。
  该见证还满足 η(a,a) = 2（即 α' p² = 1，截距 a₀ = 1 的快子壳）与 b̃ = b − a、v = −b̃。

  【文献侧的取法（本定义的来由，**本卡不断言其一般成立**）】
  在实洛伦兹签名（R = ℝ、η 为 Minkowski 型）下：k_0² = 0 且 k_0·p ≠ 0 ⇒ span{k_0, p} 是
  非退化二维平面，其正交补 W := span{k_0,p}^⊥ 恰 D − 2 维且 η|_W 正定；取 W 的任一正交归一基作
  ε_i 即得 (F5)(F6)(F7)，取 b̃ 为 span{a,b} 内由 (F4) 唯一确定的向量即得 (F4)，
  而 (F8) 在快子壳 η(a,a) = 2 上成立（推演见 notes）。**这段论证需要实二次型的非退化性与维数计数，
  在一般交换 Q-代数上不可用**，故本卡把 (F5)–(F8) 写成**条件**而不是推论。

  【本卡明确不断言】
  (a) **不断言 (F5)(F7) ⇒ (F6)(F8)**，两者都有反例：
      · (T) ⇏ (T′)：formal/StringFormal/NoGhost/WitnessInt.lean 的 D = 3 整数见证
        （η = diag(−1,+1,+1)、b = (1,1,0)、a = (0,1,1)、ε = e_2）满足 (F1)(F2)(F3)(F5)(F7)
        却有 ε·a = 1 ≠ 0（机检存在性，`noghost_hypotheses_satisfiable_int`）；
      · (T)(O) ⇏ (C)：同一见证上 v = (−1,0,1)，e = (0,1,0) 满足 η(e,v) = 0 却不在
        span{ε_1, v} 中（curator 手算，登记在
        worldsheet.transverse-frame-spans-orthogonal-complement 的 notes，**未 Lean 化、未经复核**）。
  (b) **不断言存在性的一般形式**：对任意满足 (F1)–(F4) 的 (η, a, b, b̃) 都存在 ε 使 (F5)–(F8) 成立
      ——这在一般环上为假。本卡只给上面那一个显式见证。
  (c) **不断言 {b, b̃, ε_1, …, ε_{D−2}} 线性无关或构成基**，也不断言 (F8) 的分解系数唯一。
      标架的「基」形式与 (F8) 的关系见 notes，那里的推演是手算的。
  (d) **不把质壳 η(a,a) = 2（α' p² = 1）写进定义**。notes 记一条 curator 手算观察：在域上
      (F6)(F7)(F8) 蕴含 η(a,a) = 2，即 (F8) 已经隐含了快子壳；但该观察未形式化、未经复核，
      故不进陈述，也不据此改动本卡的条件表。
  (e) **不断言任何关于 DDF 算子的事**：A^ε_n 的定义、对易关系、伴随、张成，全在别的卡上
      （worldsheet.ddf-operators-v6 起的一族）。本卡只描述标架这一层几何数据。
  (f) 不断言 D = 26、不断言任何正定性或内积号差结论。
uses:
  - worldsheet.ddf-operators-v6
  - worldsheet.momentum-tower-fock-space
