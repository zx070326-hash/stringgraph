id: worldsheet.open-superstring-low-level-spectrum
kind: proposition
title: 开超弦最低两级的谱：NS 快子（m² = −1/(2α')，exp(πiF) = −1）、NS 无质量矢量、R 无质量 Dirac 方程
statement: |
  设 D = 10、开弦、OCQ 物理态条件（worldsheet.ocq-superstring-physical-states），
  质量壳按 worldsheet.open-superstring-mass-shell。则最低能级为：

  **(A) NS 扇区 level N = 0**：态 |0; k⟩_NS，质量壳给
      m² = −k² = **−1/(2α')**，即一个**快子**。它的世界面费米子数是 **exp(πiF) = −1**。

  **(B) NS 扇区 level N = 1/2**：态 |e; k⟩_NS = e·ψ_{−1/2}|0; k⟩_NS。物理态条件给
      L_0：α' k² = 0，  G^m_{1/2}：(2α')^{1/2} k·e = 0，
  而 G^m_{−1/2}|0; k⟩_NS = (2α')^{1/2} k·ψ_{−1/2}|0; k⟩_NS 是零态（null）。故
      k² = 0,   e·k = 0,   e^μ ≅ e^μ + λ k^μ，
  即一个**无质量矢量**，有 D − 2 = 8 个类空极化，且 **exp(πiF) = +1**。

  **(C) R 扇区最低级**：态 |u; k⟩_R = |s; k⟩_R u_s。物理态条件给
      L_0：α' k² = 0，  G^m_0：α'^{1/2} |s'; k⟩_R (k·Γ)_{s's} u_s = 0，
  后者正是**无质量 Dirac 方程** (k·Γ)_{s's} u_s = 0。
  取 k 沿一个光锥方向，k_0Γ⁰ + k_1Γ¹ = −2k_1Γ⁰(S_0 − 1/2)，故物理态条件化为
      (S_0 − 1/2) |s, 0; k⟩_R u_s = 0，
  只有 s_0 = +1/2 的分量存活（一半的分量被投影掉，与 Dirac 方程把 Dirac 旋量的自由度减半一致）。

  **开弦最低能级汇总（原书 Table 10.2「Massless and tachyonic open string states」）**：
      NS+ ： 8_v，m² = 0；      NS− ： 1，m² = −1/(2α')；
      R+  ： 8，m² = 0；        R−  ： 8′，m² = 0。

  **本命题不断言的内容**：
    (1) 不断言 8、8′、8_v 这些 SO(8) 表示标签的表示论内容（16 → (+1/2, 8) + (−1/2, 8′) 等，
        (10.5.17a,b)）——那依赖附录 B.1，本轮未读（抽取记录 Q8）。本卡只把它们当作标签照录。
    (2) 不断言哪些扇区实际出现在某个具体理论的谱里（那要 §10.6 的一致性条件）。
    (3) 不断言 G_0² = L_0（原书用它说明 R 扇区的 G_0 条件蕴含 L_0 条件；那一步逐字带
        'in the critical dimension' 的限定，见 notes）。
