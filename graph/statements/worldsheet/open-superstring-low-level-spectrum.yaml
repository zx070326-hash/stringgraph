sources:
  - ref: polchinski-1998-v2
    loc: "§10.5, eq. (10.5.7)（NS 最低态 m² = −1/(2α')，逐字 'This state is a tachyon. It has exp(πiF) = −1'）、(10.5.8)–(10.5.11)（NS 第一激发态与无质量矢量条件）、(10.5.12)–(10.5.14)（R 最低态与无质量 Dirac 方程）、(10.5.15)（k_0Γ⁰ + k_1Γ¹ = −2k_1Γ⁰(S_0 − 1/2)）、(10.5.16)（(S_0 − 1/2)|s,0;k>_R u_s = 0）、(10.5.17a,b)（旋量分解），pp. 21–23；Table 10.2 同处"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E35；式号、公式与 Table 10.2 的四行逐页读到原书页图）。
      原书对 (10.5.14) 的措辞：'which was our original goal in introducing the superconformal
      algebra'。
  - ref: polchinski-1998-v2
    loc: "§10.5, p. 23（逐字：'The (NS−,NS−) sector contains a closed string tachyon with m² = −2/α'.'）"
    note: |
      L1（E35 附注）。这条是闭弦快子所在的扇区，下游 worldsheet.gso-removes-tachyon 要用。
tags: [superstring, open-string, spectrum, tachyon, ns-sector, ramond-sector, dirac-equation]
notes: |
  【本卡是「快子被消除」这条结论的前提】(10.5.7) 与 Table 10.2 精确地告诉我们快子住在
  **NS−**（开弦）与 **(NS−, NS−)**（闭弦）。§10.6 的一致性条件给出的解里不含这两个扇区，
  这才是「GSO 去掉快子」在本书里的确切内容——见 worldsheet.gso-removes-tachyon。

  【G_0² = L_0 的限定，刻意排除在断言之外】原书逐字：'The G^m_0 condition implies the L_0
  condition, because G_0² = L_0 in the critical dimension and the ghost parts of G_0 annihilate
  the ghost vacuum.' 这句话带两个前提（临界维数、鬼场真空被 G_0 的鬼场部分湮灭），
  且与 math.super-virasoro-algebra 里 {G_0, G_0} = 2L_0 − c/12 的一般式相容当且仅当
  c/12 的那一项被正规序常数吸收——**这个记账在原书里没有展开**。故本卡不断言它。
  → 待建：worldsheet.ramond-g0-squared-equals-l0（含临界维数前提）。

  【表示标签的来源】8_v / 8 / 8′ 是 SO(8) 小群的表示；(10.5.17) 的 16 → (+1/2, 8) + (−1/2, 8′)
  依赖附录 B.1。原书 exercise 10.12 就是让读者验证 (10.5.17)。本卡只照录标签。
