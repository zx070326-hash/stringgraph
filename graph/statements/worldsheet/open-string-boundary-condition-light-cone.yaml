id: worldsheet.open-string-boundary-condition-light-cone
kind: proposition
title: 开弦 Neumann 边界条件在光锥规范世界面度规下的形式
statement: |
  把 Neumann 边界条件 ∂^σ X^μ|_{σ=0,ℓ} = 0
  （worldsheet.open-string-neumann-boundary-condition，其中 ∂^σ = γ^{σa}∂_a 含世界面度规）
  写成分量形式，得到在 σ = 0 与 σ = ℓ 处
    0 = -γ_{ττ} ∂_σ X^μ + γ_{τσ} ∂_τ X^μ
  （已用光锥规范 (LC2) 的 det γ = -1 化简整体因子）。
  特别地，当世界面度规取共形形式 γ_{τσ} = 0 时，该条件退化为 ∂_σ X^μ|_{σ=0,ℓ} = 0。
uses_conventions: [conv.metric-mostly-plus, conv.worldsheet-coordinate-length, conv.worldsheet-lorentzian]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.13)"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E12，证据等级 [已核实]：
      Schrans 伴读笔记 §1.11 给出逐字表达式
      「0 = -γ_ττ ∂_σ X^μ + γ_τσ ∂_τ X^μ（在 σ = 0 与 σ = ℓ）」。
tags: [bosonic-string, boundary-condition, open-string, light-cone]
notes: |
  这是 (1.2.28) 的纯代数改写，本身不含新物理；单列节点是为了让
  worldsheet.open-string-mode-expansion 的 cos(nπσ/ℓ) 形式有一条明确的来源链
  （Neumann 条件 → 光锥度规下的形式 → 模式展开）。
author: curator-polchinski-ch1
created: "2026-09-10"
