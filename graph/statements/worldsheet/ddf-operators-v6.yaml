tags: [bosonic-string, spectrum-generating-algebra, definition, formalized]
notes: |
  取代 worldsheet.ddf-operators-v5（v5 取代 v4，v4 取代 v3，v3 取代 v2）。
  按项目规则陈述文本不可变，故新建本节点。

  【为什么换代（lead 裁决 2026-09-11）】
  formal/StringFormal/NoGhost/DDFOperator.lean 把 DDF 算子定义为**模态和**
  `ddfOp η a b ε hη hεb n = lsumLocFin (fun j => ddfSummand η a b ε n j) (ddfWindow n) …`，
  其中 `ddfSummand η a b ε n j = towerModeVec η a b ε j * towerVertex η b n j`（即 α^ε_j V^{(n)}_j）。
  **横向性 `hεb : dotVec η ε b = 0` 是这个定义的显式参数**——不是为了方便，而是因为
  `lsumLocFin` 的构造要求先给出「窗口外的项在给定向量上为零」的证明
  （`ddfSummand_apply_eq_zero_of_notMem_window`），而该证明的**上**截断整个建立在横向性上。
  非横向时这个和在代数 Fock 塔上不是局部有限的（见 v5 的 notes 与
  worldsheet.ddf-transversality-gives-local-finiteness 的【必要性方向】），算子不可表达。
  v5 用围道积分定义，Lean 里没有对应物；继续以 v5 为定义卡会让整条 DDF 支路的
  formalized 无处落脚，且逼着每条下游推导重复登记「围道 ⟹ 模态和」这一步。
  **裁决：图内定义采模态和，围道积分退为 notes 里的文献写法。**

  【围道 ⟹ 模态和的字典：本图的 open 缺口，诚实登记】
  文献（GSW §2.3.3、GT 1972、goddard-2008 (5.1)）一律把 A^i_n 写成
    A^i_n = ∮ (dz/2πi) ∂X^i(z) e^{i n k_0·X(z)} 。
  它与本卡的模态和相同，是「形式洛朗展开 + 取总 z^{−1} 系数」的标准两行核对：
  ∂X^i(z) ∝ Σ_m α^i_m z^{−m−1}，:e^{i n k_0·X(z)}: = Σ_K V^{(n)}_K z^K，
  总 z^{−1} 系数要求 (−m−1) + K = −1，即 K = m，给出 Σ_m α^i_m V^{(n)}_m。
  **但本图没有任何节点承载这条字典**：最接近的
  worldsheet.ope-pole-mode-commutator-dictionary 是**形式分布版的模态字典**且自身
  effective = open（无推导）；worldsheet.ope-commutator-dictionary 是围道 ⟹ **对易子**，
  不是围道 ⟹ 模态和。
  按 lead 裁决，本卡**不把这条字典写进陈述**，故本卡的 formalized 不受它拖累；
  代价是「本图的 A^ε_n 与文献的 A^i_n 是同一个算子」这句话在图中是 **未论证的**。
  ⚠ 任何要把本图 DDF 结论回译成文献陈述的下游（首当其冲是 ms.no-ghost-theorem 的回译审计）
  必须显式引用这条缺口。补它的两条路：
    (a) 建 `worldsheet.ddf-contour-equals-mode-sum` 卡并给推导（physical-argument 起步）；
    (b) 先把 worldsheet.ope-pole-mode-commutator-dictionary 从 open 救出来。
  curator 建议 (a)，理由是 (b) 的对象（形式分布）与这里需要的对象（塔上的洛朗系数）不同。

  【与 Lean 的逐句字典（本卡 status: formalized 的依据）】
  · 度规对角分量 η_μ，η_μ² = 1 ⇒ `η : Fin D → R` 与假设 `hη : ∀ μ, η μ * η μ = 1`；
  · 内积 x·y ⇒ `dotVec η x y = Σ_μ η μ * x μ * y μ`；
  · a^μ = (2α')^{1/2} p^μ、b^μ = (2α')^{1/2} k_0^μ ⇒ `a b : Fin D → R`；
  · 塔 ⊕_N F(p + N k_0) ⇒ `TowerFock D R = ℤ →₀ Fock D R`，第 j 层动量
    `towerMomentum a b j = a + j·b`（**j = N，无符号翻转**）；
  · (T) ε·k_0 = 0 ⇒ `hεb : dotVec η ε b = 0`，**`ddfOp` 的显式参数**；
  · (N) k_0² = 0 ⇒ `hbb : dotVec η b b = 0`，**只出现在定理假设里**（如
    `lie_towerLop_ddfOp_of_pos`），不是 `ddfOp` 的参数；
  · (S) 2α' k_0·p = 1 ⇒ `hba : dotVec η b a = 1`，同上；
  · α^ε_m = Σ_μ η_μ ε^μ α^μ_m ⇒ `towerModeVec η a b ε m = Σ_μ (η μ * ε μ) • towerMode η a b μ m`；
  · V^{(n)}_K（z^K 系数，层 N → N+n，能级 +（K−n）） ⇒
    `towerVertex η b n K = towerShift n ∘ towerDiag (fun _ => Fock.vertexOsc η (n·b) (K − n))`；
  · α^ε_m V^{(n)}_m ⇒ `ddfSummand η a b ε n m`；
  · 有限窗口 ⇒ `ddfWindow n x = Finset.Icc (n − towerLevelBound x) (towerModeBound x)`；
  · A^ε_n = Σ_m α^ε_m V^{(n)}_m ⇒ **`ddfOp η a b ε hη hεb n`**（`lsumLocFin` 组装）；
  · 「任意够大的窗口都算得对」 ⇒ `ddfOp_apply`。

  **Lean 比本卡更一般的三处**（本卡是 Lean 的特例，故 formalized 成立）：
  (1) Lean 的 `ddfOp` **不假设 (N) 与 (S)**；本卡把它们写进 DDF 数据。取 `hbb`、`hba` 成立即得本卡对象。
  (2) **Lean 对 n = 0 同样有定义**（`ddfOp … (n : ℤ)` 无 n ≠ 0 的限制，局部有限性对 n = 0 照样成立）。
      v2–v5 都写 n ∈ Z \ {0}，本卡改写为 n ∈ Z。文献排除 n = 0 是因为 A^i_0 在**代数**上退化
      （它不移动动量层，且横向振子代数 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0} 在 m = 0 处平凡），
      不是因为它没有定义。⚠ 下游凡引用「A^i_n（n ≠ 0）」的命题（首当其冲
      worldsheet.ddf-operators-adjoint 与 worldsheet.ddf-transverse-oscillator-algebra）
      仍按各自陈述的 n ≠ 0 读，**本卡的 n ∈ Z 不自动放宽它们**。
  (3) Lean 的 ε 是**任意**满足 `dotVec η ε b = 0` 的向量，不要求 ε 属于某个正交归一横向标架，
      也不要求 ε·p = 0。本卡的【横向标架的特例】是它的一个取法。

  **Lean 未覆盖的三处**（故本卡的这些内容仍是 rigorous 层面的记账，不是机器验证）：
  (i) 围道积分写法与本卡模态和的等价（见上面的 open 缺口）；
  (ii) (S) 的单值性来由（z^{2α' n k_0·p} ∈ z^Z）——Lean 只把 (S) 当假设，
      不重现导出它的 OPE 论证；
  (iii) (d)「存在类光 k_0 使 k_0·p ≠ 0」的可满足性——在一般环 R 上为假，
      需 R = R 并引入洛伦兹号差与类光锥，是一条独立待办（DDFOperator/DDF 文件头均已声明）。
  这三处**都不在本卡的陈述里**（(i)(ii) 只在 notes，(iii) 已在【本卡明确不断言】(d) 排除），
  故不阻碍 `status: formalized`。

  【自 v5 保留但未在本卡陈述中重复的说明】
  v5 的说明 (a)（参考方向取**去心直线** {λ k_0 : λ ∈ R\{0}} 而不是射线，标度 λ = 1/(2α' k_0·p)
  的符号随 sign(k_0·p)）与说明 (b)（(S) 沿一条塔不变，因 k_0² = 0 ⇒ k_0·(p + n k_0) = k_0·p）
  在本卡中被压缩进【三个条件及其地位】一段。两者内容不变，
  (b) 的 Lean 对应物是 `dotVec_towerMomentum_right_of_isotropic`。
  说明 (c)（单值性给出 (S)）见上面的 (ii)。
  k_0·p = 0 的扇区（特别是 p = 0）DDF 构造退化，仍不在覆盖范围内（第一轮审计 B6）。

  【偏振 ε 与 ∂X^i 的记号关系（auditor 第五轮观察，转录自 v5）】
  v5 引入偏振 ε^i 但公式写 ∂X^i，二者只在固定横向标架时一致。**本卡不再有这个问题**：
  陈述直接用 ε 与收缩 α^ε_m = ε·α_m，标架化只作为特例出现（与 Lean 的 `towerModeVec` 一致）。

  【2026-09-11（六）：上面那条 open 缺口现已有承载卡，curator】
  【围道 ⟹ 模态和的字典】段逐字建议的方案 (a) 已落实：
    **worldsheet.ddf-contour-equals-mode-sum**（proposition，effective = physical-argument，
    推导 --via-laurent-coefficient-extraction）
  断言「文献的围道积分 A^i_n 与本卡的模态和 A^ε_n 是同一个算子」，
  文献侧锚点是 goddard-2008 §5, p.11, (5.1)–(5.3)（**L1 逐字**，
  literature/extractions/gsw-1987-v1.md §2 E1——这是本项目第一次拿到 A^i_n 定义的逐字文本）。
  ⇒ 该段里「本图没有任何节点承载这条字典」这句话**已过时**；
  「本图的 A^ε_n 与文献的 A^i_n 是同一个算子这句话在图中是未论证的」这句话
  应更新为「**只有 physical-argument 级的论证，缺口逐条登记在那张卡的推导 gaps 里**」。
  ⚠ **本卡的 `status: formalized` 不受影响**（那条字典仍不在本卡陈述里），
  这一点与该段原文一致。
  ⚠ 那段里提到的方案 (b)（救活 worldsheet.ope-pole-mode-commutator-dictionary）**仍未做**；
  新卡的推导刻意**不**把那张 open 的卡列为依赖（对象不同：形式分布 vs 塔上洛朗系数），
  只在 gaps 第 1 条登记，理由见该推导的 notes。

  【Lean 未覆盖的三处里的 (i)，现在的准确说法】
  上文【Lean 未覆盖的三处】(i)「围道积分写法与本卡模态和的等价」**仍未形式化**
  （Lean 中没有形式留数，左端一无所有），但它现在**有图节点了**。
  升它的路线见 worldsheet.ddf-contour-equals-mode-sum 的 notes【补它的两条路】。

  【2026-09-11（六）：`uses` 新增 worldsheet.exponential-vertex-operator-modes，curator】
  本卡【顶点算子的模】一段以记号约定的方式引入 V^{(n)}_K，但此前图中没有承载它的定义卡。
  现已补上 **worldsheet.exponential-vertex-operator-modes**（definition，formalized，
  lean_decl `StringFormal.NoGhost.Fock.vertexOsc`），故加入 `uses`。
  这是**记号来源的显式化**，不改本卡陈述文本、不改本卡 status
  （新卡同为 formalized，min 不下降）。
  分工：新卡只管**振子部分**（单个 Fock 空间），零模移位那一半仍由
  worldsheet.momentum-tower-fock-space 提供；本卡字典里
  `towerVertex η b n K = towerShift n ∘ towerDiag (… Fock.vertexOsc η (n·b) (K − n))`
  正是两者的复合。
