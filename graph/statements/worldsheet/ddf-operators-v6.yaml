    `ddfOp_neg_one_apply_towerVacuum`：A^ε_{−1}|0; k⟩ = α^ε_{−1}|0; k − k_0⟩（**精确相等，无修正项**），
  但该定理的假设逐字是 `hη`、`hεb`（= (T)）**与 `hεa : dotVec η ε a = 0`**，即
    **(T′) 偏振与基点动量正交：ε·p = 0（重标度后 η(ε, a) = 0）**。
  （Lean docstring 把它写作「ε·k = 0」，那里的 k 是塔的基点动量，本卡记作 p、重标度后记作 a；
