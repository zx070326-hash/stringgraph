  【2026-09-11（lightcone-frame 收尾，curator）：两项来自 formalizer 的移交记录，登记本卡 notes】

  (a) **`ddfOp_mem_towerRungSubmodule`（DDFGram.lean）是纯运动学**：A^ε_n 把塔的第 j 层
  （rung j）送到第 j + n 层（动量 k + j k_0 ↦ k + (j+n) k_0），证明只用 `hη`、`hεb`——
  即定义 A^ε_n 本身所需的那两条（(T) 横向性），**不需要** `hbb`（(N) 类光性）、`hba`（(S) 归一化）
  或标架的正交归一。这是本卡对象 A^ε_n 的一条独立性质，此前未在本卡登记
