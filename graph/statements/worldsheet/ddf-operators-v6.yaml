  **顺带的两条数学订正**（本卡未受影响，但与本卡的记账口径有关，记在此处备查）：
    (i) 伴随关系**不需要 (N) 类光性 k_0² = 0、也不需要 (S) 归一化 2α' k_0·p = 1**。
        Lean 侧 `towerPairing_ddfOp_left` 的假设逐字只有 `hη` 与 `hεb`（横向性）。
        这与本卡「(N) 与 (S) 是关于 A^ε_n 的**定理的假设**，不是**定义的参数**」的判断一致，
        并进一步指出：对伴随这条定理而言它们连假设都不是。
    (ii) 横向性 (T) 在伴随证明中的作用是**把伴随排回 DDF 求和的书写顺序**
        （`towerModeVec_mul_towerVertex_of_transverse`：ε·k_0 = 0 ⟹ α^ε 与 V 严格对易），
