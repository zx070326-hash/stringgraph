id: worldsheet.ddf-operators-v6
kind: definition
status: formalized
title: DDF 算子的定义（**模态和**版：A^ε_n = Σ_m (ε·α_m) V^{(n)}_m，横向性 ε·k_0 = 0 是定义的参数）——纯定义，不含对易关系断言
statement: |
  【本卡与 v5 的唯一实质差别】v5 把 A^i_n 写成**围道积分**；本卡把它写成**模态和**，
  并把横向性 ε·k_0 = 0 提升为定义的**参数**（没有它，下面的和不是有限和，算子根本写不出来）。
  围道写法退为文献写法，见 notes。lead 裁决 2026-09-11。

  【数据】固定 D ∈ N 与交换环 R（下面出现顶点算子处另设 R 为 Q-代数），
  对角时空度规分量 η_μ（conv.metric-mostly-plus 下 η = diag(−1,+1,…,+1)，η_μ² = 1），
  以及 α'（conv.alpha-prime-regge）。给定
    · 基点动量 p 与**类光参考向量** k_0，
    · 偏振向量 ε。
  按 worldsheet.momentum-tower-fock-space 的记号取动量塔
    T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)，
  第 N 层的零模是 α^μ_0|_N = (2α')^{1/2}(p + N k_0)^μ。记重标度向量
    a^μ := (2α')^{1/2} p^μ,   b^μ := (2α')^{1/2} k_0^μ。

  【三个条件及其地位】
    (T) 横向性     ε·k_0 = 0        （等价：η(ε, b) = 0）
    (N) 类光性     k_0² = 0         （等价：η(b, b) = 0）
    (S) 归一化     2α' k_0·p = 1    （等价：η(b, a) = 1）
  **(T) 是本定义的参数**：下面的模态和只有在 (T) 下才逐向量有限（见
  worldsheet.ddf-transversality-gives-local-finiteness-v2），故不假设 (T) 时 A^ε_n 这个符号
  没有指称对象。**(N) 与 (S) 是本卡所定义的 DDF 数据的一部分**，但它们的作用是别的：
  (N) 保证 k_0·p 沿整条塔不变（从而 (S) 一次取定即对整条塔成立），
  (S) 由单值性要求 2α' n k_0·p ∈ Z（∀n）取该整数为 1，使洛朗指标的记账是整数移位。
  两者都**不是**下面这个和有意义的前提，因此在形式化里它们是关于 A^ε_n 的**定理的假设**，
  不是 A^ε_n 的**定义的参数**（对照见 notes 的【与 Lean 的逐句字典】）。

  【顶点算子的模】设 V^{(n)}_K（K ∈ Z）是正规序指数 :e^{i n k_0·X(z)}: 在塔上的
  **z^K 洛朗系数**（z^K-系数约定，即 lead 2026-09-11 裁决的 (α) 约定）：
  它把第 N 层送到第 N + n 层，并把振子能级升高 K − n；
  单值因子 z^{2α' n k_0·p} 在 (N)+(S) 下等于 z^n，故指标移位 K ↦ K − n 是整数移位。

  【定义】记偏振收缩的振子模
    α^ε_m := ε·α_m = Σ_μ η_μ ε^μ α^μ_m      (m ∈ Z)，
  在 (T) 之下定义 **DDF 算子**
    A^ε_n := Σ_{m ∈ Z} α^ε_m V^{(n)}_m ,      n ∈ Z 。
  这个形式上无限的和在 T(p;k_0) 上**逐向量是有限和**：对每个 x ∈ T(p;k_0) 只有落在某个
  有限窗口内的 m 使 α^ε_m V^{(n)}_m x ≠ 0（这一点是命题
  worldsheet.ddf-transversality-gives-local-finiteness-v2，(T) 在那里被用于**上**截断），
  故 A^ε_n 是 T(p;k_0) 上处处有定义的 R-线性算子，
  **不需要完化、不需要收敛性假设、不需要解析延拓**。

  【横向标架的特例】取 ε = e_i（i = 2..D−1，横向指标约定与 worldsheet.light-cone-quantization
  一致：0、1 方向组成光锥对 ±），且固定类光直线的同时固定横向标架使 e_i·k_0 = 0、
  e_i·e_j = δ^{ij}，则 A^{e_i}_n 就是文献记号 A^i_n。

  【本卡明确不断言】
  (a) [L_m, A^ε_n] = 0 —— 见 worldsheet.ddf-commute-with-positive-virasoro（m ≥ 1）与
      worldsheet.ddf-commute-with-virasoro（∀m）；
  (b) [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0} —— 见 worldsheet.ddf-transverse-oscillator-algebra；
  (c) A^ε_n ≠ 0，以及 DDF 态张成横向物理谱 —— 本图与 Lean 均未建立；
  (d) 「存在类光 k_0 使 k_0·p ≠ 0」——这是关于**实**洛伦兹二次型的存在性断言，
      在一般交换环 R 上为假，本卡把 (N)(S) 作为给定数据而不证其可满足性。
