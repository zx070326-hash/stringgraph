  **本卡的四条常设假设 (η)(N)(S)(T) 不蕴含 (T′)**：(T) 只说 ε·k_0 = 0。
  · **反例（见证机检满足四条常设假设；ε·a = 1 为一行手算）**：formal/StringFormal/NoGhost/WitnessInt.lean 的 D = 3 整数见证
    η = diag(−1,+1,+1)、b = (1,1,0)、a = (0,1,1)、ε = e_2 机检满足 (η)(N)(S)(T) 与 ε·ε = 1、a·a = 2
    （`noghost_hypotheses_satisfiable_int`），而 **ε·a = 1 ≠ 0** 是一行手算（reviewer-batch30 复核，2026-09-11）：
    WitnessInt.lean **没有**这条的 Lean 声明（只有 D ≥ 4 的 ε·a = 0 版本），docstring 提到它但不机检。
    D ≥ 4 时改取 ε = e_3 即可同时满足 (T′)（`noghost_hypotheses_satisfiable_int_transverse_momentum`），
    Witness.lean 的 Q-代数见证也满足它（`dotVec_witnessTransverseFrame_witnessMomentum`）。
    故「横向性足够」是**假的**，而不是「暂时没证」。
  · **没有 (T′) 时多出什么**：DDF 和在基态上的窗口只有 j = −1、j = 0 两项，j = 0 那项是
    标量 (ε·p_{−1}) 乘一个能级 1 的态，即 A^ε_{−1}|0;k⟩ 会多出 (ε·k) Φ_1|0; k − k_0⟩。
    在 Lean 里就是 `hzero` 那一步（`towerModeVec_zero_apply_single` + `dotVec_vec_towerMomentum`），
    它同时用掉 `hεa` 与 `hεb`。
  · **为什么文献里看不到这条假设**：标准光锥标架把 ε_i 取在 span{k_0, p} 的正交补里
    （k_0² = 0 且 k_0·p ≠ 0 ⇒ 该二维平面非退化，正交补恰 D − 2 维），于是 ε_i·p = 0 **自动**成立；
    Goddard 2008 §5 p.11 只写 'ε^i·ε^j = δ^{ij}, k·ε^i = 0'（k 是那里的参考向量 = 本卡的 k_0）。
    本卡的【横向标架的特例】一段只要求 e_i·k_0 = 0、e_i·e_j = δ^{ij}，**比那个标架宽**，
    宽出来的部分正好丢掉 (T′)。
