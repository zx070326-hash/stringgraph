  见该文件 2026-09-11 追记）。

  (b) **N = 2 起 (T′) 再次被需要，且 DDF 态 ≠ 横向振子态（有伪态混入）**。
  formal/StringFormal/NoGhost/LevelTwoSpan.lean 给出 A^ε_{−2}|0;k⟩ 与 A^ε_{−1}A^δ_{−1}|0;k⟩ 在
  真空上的精确展开：
    `ddfOp_neg_two_apply_towerVacuum`（假设 hη、hεb、**hεa**）：
      A^ε_{−2}|0;k⟩ = [ε·α_{−2} − 2(ε·α_{−1})(k_0·α_{−1})]|0;k−2k_0⟩；
    `ddfOp_neg_one_mul_ddfOp_neg_one_apply_towerVacuum`（假设 hη、hεb、hδb、**hεa**、**hδa**）：
      A^ε_{−1}A^δ_{−1}|0;k⟩ = [(ε·α_{−1})(δ·α_{−1}) + ½(ε·δ)((k_0·α_{−1})² − k_0·α_{−2})]|0;k−2k_0⟩。
  两条定理都需要 **(T′) ε·k = 0、δ·k = 0**（本卡【本卡缺一条假设的登记】段的 hεa/hδa），
  与 N = 1 的领头项引理（`ddfOp_neg_one_apply_towerVacuum`）用到 (T′) 的方式相同——
  故「本卡四条常设假设 (η)(N)(S)(T) 不蕴含 (T′)」这条限制在 N = 2 依旧成立，不是 N = 1 的特例。
  ⚠ **A^ε_{−1}A^δ_{−1}|0;k⟩ 的展开式里 ½(ε·δ)((k_0·α_{−1})² − k_0·α_{−2}) 那一项不是横向振子态**：
  它正比于纵向/伪态方向（k_0·α 系数），只在 ε⊥δ 时消失。⇒ **从 N = 2 起，"DDF 态 = 横向振子态"
  这句话不再成立，必须读成"模伪态"**（即 DDF 张成落在横向子空间加伪态子空间的和里，
