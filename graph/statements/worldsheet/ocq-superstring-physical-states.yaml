sources:
  - ref: polchinski-1998-v2
    loc: "§10.5「OCQ」, eq. (10.5.1)（L^m_n = 0, n > 0 与 G^m_r = 0, r ≥ 0）、(10.5.2)（等价关系）、(10.5.3)（L_0|ψ⟩ = H|ψ⟩ = 0 与其逐字理由），pp. 20–21"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E34；式号与公式内容逐页读到原书页图）。
      原书明写这套形式是 Vol.1 §4.1 的推广（'In this formalism, developed for the bosonic string
      in section 4.1, one ignores the ghost excitations…'），故对
      worldsheet.old-covariant-physical-states 的 uses 是文献明写的。
  - ref: polchinski-1998-v2
    loc: "§10.5 开头段, p. 20（方法论声明，逐字见 statement）"
    note: |
      L1（E33）。★ 这段对本项目极重要：它是超弦分支**没有** Weyl 反常路线的直接原因，
      也是「总中心荷为零」在本卷是**被假定**的一致性条件的依据。
  - ref: polchinski-1998-v1
    loc: "§4.1（玻色弦 OCQ：L^m_m|ψ⟩ = 0 (m ≥ 1) 与 (L^m_0 + A)|ψ⟩ = 0）"
    note: |
      Vol.2 明写以此为模板。⚠ 记账差别：Vol.1 把常数写在括号里，Vol.2 吸进 L_0，
      是同一件事的两种写法（抽取记录 E34 备注）。
tags: [superstring, ocq, physical-states, rns, definition]
notes: |
  【status: physical-argument 的理由】这不是一张纯代数定义卡：
  (a) 「把超共形代数当作约束加在态上」这一步在本卷是**公设**（见 statement 的方法论限定）；
  (b) 「L_0 = H 因为总中心荷为零」这一句把一个尚未成立的条件（c^tot = 0）用作定义的一部分；
  (c) 上游 worldsheet.rns-super-virasoro-generators 与 worldsheet.superconformal-ghost-modes
      的有效状态都是 physical-argument。

  【与 BRST 版的关系】BRST 附加条件见 worldsheet.superstring-brst-additional-conditions；
  R 扇区 (10.5.26) 的 β_0|ψ⟩ = G_0|ψ⟩ = 0 与本卡的 G^m_0|ψ⟩ = 0 的关系由
  [H] Problem 10.14 记下（'…which is exactly the OCQ condition'），
  本图未建 BRST ↔ OCQ 在超弦情形的等价节点（玻色弦一侧有
  worldsheet.brst-cohomology-equals-ocq-physical）。
  → 待建：worldsheet.brst-cohomology-equals-ocq-physical-superstring。

  【E33 的另一半：本书不构造规范不变形式】'there is an analogous gauge-invariant form' 是
  **未加论证的断言**（书中不构造、不引用）。按抽取记录 Q5 的建议，本图**不**为它建节点。
