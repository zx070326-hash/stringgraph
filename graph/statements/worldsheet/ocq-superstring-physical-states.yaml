id: worldsheet.ocq-superstring-physical-states
kind: definition
status: physical-argument
title: 超弦的旧协变（OCQ）物理态条件：L^m_n = 0 (n > 0)、G^m_r = 0 (r ≥ 0)、L_0 = 0
statement: |
  按旧协变量子化（OCQ；玻色弦情形见 worldsheet.old-covariant-physical-states），
  超弦的物理态定义为满足下列条件的态（忽略鬼场激发，上标 m 表示只取物质部门）：
    L^m_n |ψ⟩ = 0    (n > 0),
    G^m_r |ψ⟩ = 0    (**r ≥ 0**)，
  其中 **r ≥ 0 含 r = 0**，即 R 扇区的零模条件 G^m_0|ψ⟩ = 0；NS 扇区没有 r = 0 的模式，
  最低的条件是 G^m_{1/2}|ψ⟩ = 0。
  态的等价关系（零态/伪态的模去）：
    L^m_n |χ⟩ ≅ 0    (n < 0),      G^m_r |χ⟩ ≅ 0    (r < 0)。
  质量壳条件写成
    L_0 |ψ⟩ = H |ψ⟩ = 0，
  其中 L_0 是**物质加鬼场**的总 Virasoro 零模，它等于世界面哈密顿量 H
  ——原书给的理由逐字：'The mass-shell condition can always be written in terms of the total
  matter plus ghost Virasoro generator, which is the same as the world-sheet Hamiltonian H
  **because the total central charge is zero**'。
  正规序常数已按 Vol.2 的体例吸进 L_0（见 worldsheet.rns-super-virasoro-generators 的
  【常数的记账位置】），故此处不出现显式的 −a。

  ⚠ **方法论限定（原书 §10.5 开头，逐字）**：与玻色弦不同，本书**不**从超-diff × 超-Weyl 不变的
  作用量出发规范固定，而是「直接在规范固定的形式里推广，**把超共形对称性定义为一个约束**」：
  'there is an analogous gauge-invariant form … However, it is not necessary to proceed in this
  way … Rather we can generalize directly in the gauge-fixed form, defining the superconformal
  symmetry to be a constraint and proceeding in parallel to the bosonic case to construct a
  consistent theory.'
  故本卡的条件是**被假定的**，不是从规范不变性导出的。

  本卡是定义。它**不**断言物理态空间的内积性质（见 worldsheet.no-ghost-theorem-superstring），
  也**不**断言具体的质量谱（见 worldsheet.open-superstring-mass-shell）。
