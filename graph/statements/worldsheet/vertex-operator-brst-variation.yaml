id: worldsheet.vertex-operator-brst-variation
kind: proposition
title: "维数 1 主场顶点算子的 BRST 变分：δ_B V = iε ∂(cV)"
statement: |
  设 V(w) 是物质部门的顶点算子，且它按态-算子对应（worldsheet.state-operator-isomorphism）
  产生一个 L_0^m = 1 的最高权态，即 V 是**维数 1 的主场**。则它在 BRST 变换下的变分为
    δ_B V(w) = i ε [ Q_B , V(w) ] = i ε  ∂( c V )(w) ,
  其中 c 是鬼场、Q_B 是 BRST 荷（worldsheet.brst-current-bosonic-string）。
  （原书 (5.4.5) 是同一式的 σ 坐标写法。）

  这条的用途：δ_B V 是一个全导数，故它在顶点算子坐标的积分下积掉，
  这是 S-矩阵 BRST 不变性的一半（另一半是 b 插入的变分，
  见 worldsheet.b-insertion-brst-variation）。
uses_conventions:
  - conv.worldsheet-complex-coords
  - conv.worldsheet-euclidean
  - conv.virasoro-standard
sources:
