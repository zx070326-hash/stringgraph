    loc: "§5.4, eq. (5.4.5), p.161"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E85，L1（读到 schrans-2020
      §5.26–§5.27，笔记 p.264–265；**未核对 Polchinski 原书**）。
tags: [worldsheet, s-matrix, brst, vertex-operator, ghosts]
notes: |
  ⚠ **态-算子对应在本书振幅部分有三个用法不同的落点**（抽取记录 **Q18**）：
  (1) 本节点这一处（用「V 对应 L_0^m = 1 的最高权态」断定 V 是维数 1 主场）；
  (2) §3.6 顶点算子归一化常数的确定；
  (3) §6.7 把 S₂ 上的 n 点函数改写成 Hilbert 空间矩阵元（要求径向序 = 时间序、完备基、
      Zamolodchikov 内积良定义）。
  Q18 建议**不要**把三者挂到同一个 state-operator 节点上，第 (3) 类应另建
  `state-operator-correspondence--hilbert-space-form` 并标明额外假设。
  本卡只用第 (1) 类，是三者中最弱的用法；(3) 属第 6 章，由另一名 curator 负责。
author: curator-polchinski-ch5
