id: worldsheet.type-ii-massless-spectrum
kind: proposition
title: type IIA / IIB 的无质量谱（(10.6.8a,b)）与手征性差别
statement: |
  由 worldsheet.gso-projection 的扇区组合读出的无质量谱为
    **IIA**： [0] + [1] + [2] + [3] + (2) + 8 + 8′ + 56 + 56′,
    **IIB**： [0]² + [2]² + [4]_+ + (2) + 8′² + 56²,
  其中 [n] 表示 n 阶反对称张量表示、(2) 表示对称无迹张量（引力子）、
  8/8′ 与 56/56′ 是 SO(8) 的旋量与向量-旋量表示，下标 + 表示自对偶，
  上标 ² 表示该表示出现两次。

  **手征性**：IIA 的谱在时空宇称（交换 8 ↔ 8′、56 ↔ 56′）下不变，故**非手征**；
  IIB 的谱**手征**。这与两者 GSO 投影的差别（IIA 在 NS–R 与 R–NS 取相反投影）直接对应。

  **本命题不断言的内容**（表示论内容全部推给附录 B，本轮未读，抽取记录 Q8）：
    (1) 不断言 R–R 基态的张量分解 32 × 32 = [0] + [1] + … + [10]（(10.2.25)）
        或 Table 10.1 按 (exp(πiF), exp(πiF̃)) 四种符号给出的分解
        （(+,+) → 16×16 = [1]+[3]+[5]_+ 等）；
    (2) 不断言 8、8′、56、56′、[n]、(2) 这些标签的表示论内容；
    (3) 不断言时空超对称（见 worldsheet.type-ii-spacetime-supersymmetry）。
  这些标签在本卡里**只作为标签照录**。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
sources:
  - ref: polchinski-1998-v2
    loc: "§10.6, eq. (10.6.8a)（IIA 无质量谱）、(10.6.8b)（IIB 无质量谱），pp. 27–28；手征性讨论逐字：'In the IIA theory the opposite GSO projections are taken in the NS–R and R–NS sectors, so the spectrum is nonchiral. That is, the spectrum is invariant under spacetime parity, which interchanges 8 ↔ 8′ and 56 ↔ 56′. On the world-sheet, this symmetry is the product of spacetime parity and world-sheet parity. In the IIB theory the same GSO projection is taken in each sector and the spectrum is chiral.'"
    note: L1（抽取记录 polchinski-1998-v2.md E42；式号与逐字措辞逐页读到原书页图）。
  - ref: polchinski-1998-v2
    loc: "§10.2, eq. (10.2.25) 与 Table 10.1, pp. 9–10（R–R 基态的分解；本卡不断言，只记位置）；§10.5 Table 10.3, p. 23（闭弦无质量能级的 SO(8) 表示乘积）"
    note: |
      L1（E23、E35）。⚠ 这两处的内容依赖附录 B.1（'The products of spinors are discussed in
      section B.1.'），本轮未读，故本卡不断言它们。
tags: [superstring, type-ii, spectrum, chirality, massless]
notes: |
  【本卡的可核对性有限，务必知道】(10.6.8a,b) 的右端是表示论的记号串。
  本图**没有** SO(8)/SO(9,1) 表示论的节点，也没有读附录 B.1，
  故本卡实质上是「照录原书的两行公式并标明它们是 GSO 解的读数」。
  任何需要这些表示内容的下游推理都应先建表示论节点。
  → 待建（需先取附录 B.1 页图）：math.so8-representations 或
  worldsheet.d10-dirac-representation-decomposition。

  【IIB 的 [4]_+ 与自对偶】(10.6.8b) 里的 [4]_+ 是自对偶四形式，
  它是 IIB 手征性的来源之一，也是后来 D3 膜 / AdS_5×S^5 一支的关键
  （本图 holography 区的 ads5-cft4-duality-v2 属于那一支）。**本卡不建立那条连接**。

  【Table 10.3 未入图】闭弦无质量能级的 SO(8) 表示乘积表（p. 23）本轮不建节点，
  理由同上（表示论内容无支撑）。
