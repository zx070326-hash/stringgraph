id: worldsheet.bc-ghost-number-anomaly-sphere
kind: proposition
title: 球面上鬼数不守恒 3 个单位：非零 bc 期望值必须比 b 多恰好三个 c 插入
statement: |
  在 λ = 2 的 bc 鬼场 CFT（worldsheet.bc-ghost-cft）中，鬼数流 j = − :bc: **不是主场**：
  在坐标变换 z ↦ u 下它按 (2.5.17) 的 λ = 2 情形变换，
    (∂_z u) j_u(u) = j_z(z) + (3/2) · (∂²_z u) / (∂_z u)。
  取球面两片的过渡函数 u = 1/z（worldsheet.tree-level-worldsheet-topologies），
  比较绕 z 片原点与绕 u 片原点的两个围道积分，得两者相差 **3**（每个手征部门）。

  **结论**：S₂ 上 bc 期望值非零的**必要条件**是全纯部门的 c 插入数比 b 插入数多恰好 3，
  反全纯部门同理（合计六个多余的 c 型插入），这正是 worldsheet.bc-ghost-sphere-cc-correlator (1)
  的内容，也与 κ(S₂) − μ(S₂) = 6 一致。

  **本命题不断言什么**：不给出该必要条件的充分性；不断言一般亏格上的计数
  （一般公式属第 5 章的鬼数反常 ⇒ Riemann–Roch，抽取记录 E82，本图暂无节点）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§6.3, eq. (6.3.6)（为什么必须三个 c 插入），p.176–177；用到 §2.5 eq. (2.5.17)（鬼流的非张量变换）"
    note: |
      literature/extractions/polchinski-1998-v1.md#E96，等级 L1（schrans-2020 §6.25，笔记 p.297）。
      ⚠ **勘误依赖（抽取记录 Q14 的第 4 条）**：[S] 在此处逐字写
      「which is (6.3.6) **with the correction from Joe's errata page included**」——
      即他认为**印刷版的 (6.3.6) 有误**，他用的是勘误表更正后的版本。
      **Polchinski 官方勘误表本项目未能取得**（KITP 的三条 URL 全部 404，见抽取记录 Q10/Q14），
      故「印刷版有误」这一事实目前**只有 schrans-2020 一个来源**，本图无法核对更正内容。
      本卡片写出的变换式取自 worldsheet.bc-ghost-cft 已登记的 (2.5.15)–(2.5.17)，
      与 (6.3.6) 的更正无关；**「围道积分差 3」这一数值结论则依赖上述未核对的更正**。
  - ref: schrans-2020
    loc: "§6.25（笔记 p.297）：内容与勘误依赖的读取来源（核对源）"
tags: [worldsheet, bc-ghost, ghost-number, anomaly, sphere, tree-level, errata-dependent]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E96 建立。

  **⚠ 本卡片是本批次「六处勘误依赖」中的第一处**（抽取记录 Q14 列出 (5.3.5)、习题 3.6、
  (5.4.10)、(6.3.6)、(6.4.2)、Stirling 公式共六处）。处理口径：陈述照二手源写，
  在 sources.note 与推导 gaps 里逐条记「按 schrans-2020 的说法印刷版有误、他按官方勘误表更正；
  **官方勘误表本项目未取得**」。不因此降低 status（陈述内容本身有独立佐证：κ(S₂) = 6），
  但下游节点不得把「(6.3.6) 的具体形式」当作已核实。

  **与既有节点的关系**：worldsheet.bc-ghost-cft 已经陈述了「j 不是主场，(2.5.15)–(2.5.17)，
  这正是鬼数不守恒与 Riemann–Roch 型计数的来源」。本卡片把那句话在 S₂ 上兑现成一个**数值**（3），
  是该定义卡内嵌断言的显式化，不是重复。
