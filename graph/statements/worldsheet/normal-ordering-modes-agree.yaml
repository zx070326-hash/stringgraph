id: worldsheet.normal-ordering-modes-agree
kind: proposition
title: 共形正规序与产生-湮灭正规序给出同一组 Virasoro 生成元（m ≠ 0 逐字相同，L_0 相差常数 a^X = 0 / a^g = -1）
statement: |
  **记号**。对自由场的双线性场考虑两种正规序：
  · **共形正规序** : … :_c —— 从算子乘积中减去所有自缩并（worldsheet.conformal-normal-ordering），
    缩并由两点函数给出，与坐标有关；
  · **产生-湮灭正规序** : … :_a —— 把模指标为负的（产生）模写到左边，
    即 worldsheet.virasoro-generators-free-boson 中的 : α_p α_q :（p ≤ q 不换序，否则换序）；
    费米场同理，每次换序带一个负号。

  考虑下列两个双线性能动张量（conv.worldsheet-complex-coords）：
  (a) **X 部门**：T^X(z) = -(1/α') : ∂X^μ ∂X_μ :(z)，D 个自由玻色子，靶空间度规 η mostly-plus
      （worldsheet.energy-momentum-tensor-free-scalar；模展开 ∂X^μ(z) = -i(α'/2)^{1/2} Σ_m α^μ_m z^{-m-1}，
      [α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0}）；
  (b) **鬼场部门**：λ = 2 的 bc 系统的 T^g(z) = : (∂b) c : - λ ∂( : b c : )
      （worldsheet.bc-ghost-cft；b(z) = Σ_n b_n z^{-n-2}，c(z) = Σ_n c_n z^{-n+1}，{b_m, c_n} = δ_{m+n,0}），
      其产生-湮灭正规序取相对于基态 |↓⟩（被全部 b_n、c_n (n > 0) 与 b_0 湮灭，
      worldsheet.bc-ghost-ground-state-ghost-number (i)）。
  以上每一个 T 都可以按两种正规序各写一次，记为 T^{(c)}(z) 与 T^{(a)}(z)，
  其 Laurent 模（worldsheet.energy-momentum-laurent-modes，L_m = ∮ (dz/2πi) z^{m+1} T(z)）
  分别记为 L_m^{(c)} 与 L_m^{(a)}。

  **断言**：

  (i) （**差是 c-数**）对 (a)、(b) 两种情形，
        T^{(c)}(z) - T^{(a)}(z) = f(z) · 1,
      其中 f(z) 是一个不含算子的形式 Laurent 级数（c-数形式级数），1 是恒等算子。

  (ii) （**只落在 m = 0**）进一步地 f(z) = a · z^{-2}（a ∈ C 为常数），因而
        L_m^{(c)} = L_m^{(a)}  对一切 m ≠ 0，
      两者作为算子逐字相同（不是"相差可忽略项"，而是同一个算子）。

  (iii) （**L_0 相差常数**）m = 0 时
        L_0^{(c)} = L_0^{(a)} + a,
      其中该常数由本图两条既有命题给出：
        · X 部门：a = a^X = 0（worldsheet.normal-ordering-constant-ax；
          conv.metric-mostly-plus、conv.alpha-prime-regge、conv.virasoro-standard 下），
          故 X 部门两组生成元**对一切 m 逐字相同**；
        · 鬼场部门（以 |↓⟩ 为产生-湮灭真空）：a = a^g = -1
          （worldsheet.bc-ghost-normal-ordering-constant），故 L_0^{g,(c)} = L_0^{g,(a)} - 1，
          与 worldsheet.brst-quantization 的 statement 中写的 L_n = L^m_n + L^g_n + a^g δ_{n,0} 一致
          （那里的 L^g_n 是产生-湮灭序，a^g δ_{n,0} 正是本条 (iii) 的移位）。

  (iv) （**中心荷不受影响**）若 {L_m^{(c)}} 满足标准 Virasoro 关系（conv.virasoro-standard）
        [L_m^{(c)}, L_n^{(c)}] = (m-n) L_{m+n}^{(c)} + (c/12) m(m^2-1) δ_{m+n,0},
      则由 (ii)(iii)
        [L_m^{(a)}, L_n^{(a)}] = (m-n) L_{m+n}^{(a)} + 2 m a δ_{m+n,0} + (c/12) m(m^2-1) δ_{m+n,0},
      反之亦然。多出的 2 m a δ_{m+n,0} 是把 L_0 平移一个常数所产生的项，
      作为 Witt 代数上的 2-上循环它是**上边缘**（平移 L_0 即可消去），不改变中心扩张类；
      中心荷由 m^3 项的系数读出，故 **c 与正规序的选取无关**。
      特别地 a^X = 0 时连这一项都没有，X 部门两组生成元满足同一个 Virasoro 代数。

  **推论（本命题的用处）**：任何只用到 m ≠ 0 的 L_m 的论断（Virasoro 关系的非中心部分、
  物理态条件 L_m|ψ⟩ = 0 (m ≥ 1)、场的局域性、中心荷的取值）与两种正规序的选取无关；
  只有涉及 L_0 **谱**的论断（质量公式、截距、L_0 移位）必须指明用的是哪一种正规序，
  并按 (iii) 换算。
uses_conventions:
  - conv.metric-mostly-plus
