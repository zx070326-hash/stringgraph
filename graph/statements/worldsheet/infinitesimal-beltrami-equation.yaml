id: worldsheet.infinitesimal-beltrami-equation
kind: proposition
title: "无穷小 Beltrami 方程：μ_{k z̄_m}{}^{z_m} = ∂_{z̄_m} v_k^{z_m}"
statement: |
  设改变模 t^k 等价于在坐标片 m 上作坐标变换
    z'^{(m)} = z^{(m)} + δt^k  v_k^{z_m}
  （原书 (5.4.9)）。则 Beltrami 微分（worldsheet.beltrami-differential）与该坐标变换的
  生成向量场 v_k 之间满足**无穷小 Beltrami 方程**
    μ_{k  z̄_m}{}^{z_m}  =  ∂_{z̄_m}  v_k^{z_m}     （原书 (5.4.11)）。
  即：μ_k 度量的正是 v_k 偏离全纯的程度——若 v_k 在某片上全纯，则该片上 μ_k = 0，
  模的改变可以被该片内的（共形）坐标变换吸收。

  ⚠ 本卡采用的 (5.4.10) 一步依赖原书勘误，见 sources。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
