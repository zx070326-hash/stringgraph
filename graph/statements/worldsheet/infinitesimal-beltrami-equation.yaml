      （读到 schrans-2020 §5.28–§5.30 正文，笔记 p.265–266）。
      ⚠⚠ **勘误依赖（抽取记录 Q14 的第 3 条）**：伴读者在 §5.29 末逐字写
      「which is (5.4.10) taking into account the correction on Joe's errata page」。
      ⚠ **Polchinski 官方勘误表本项目未能取得**（KITP 三条 URL 全 404，见抽取记录 Q10 第 6 点、
      Q14），故「印刷版 (5.4.10) 有误」这一事实目前只有 schrans-2020 单源支撑。
