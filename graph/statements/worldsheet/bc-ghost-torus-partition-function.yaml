sources:
  - ref: polchinski-1998-v1
    loc: "§7.2「The bc CFT」, eqs. (7.2.23)(7.2.24)(7.2.25)(7.2.26)(7.2.27), p.212；整体符号的自陈在 p.213 首句"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E11，等级 **L1（原书页图逐字）**。
      原文逐字（p.212）：「Recall, however, that for anticommuting fields the simple trace corresponds
      to a path integral with **antiperiodic** boundary conditions in the time direction. In order to
      calculate the Faddeev–Popov determinant, the ghosts must have the same periodicity as the original
      coordinate transformations, which were periodic.」
      原文逐字（p.213 首句）：「Again, we do not try to keep track of the overall sign, setting it to
      be positive.」
