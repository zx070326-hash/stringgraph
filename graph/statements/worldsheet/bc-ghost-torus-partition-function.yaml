notes: |
  ★【已被换代（curator，2026-09-11，依 lead 裁决）】本卡 (1) 把前因子写成
  「(qq̄)^{13/12} = (qq̄)^{−(c+c̃)/24}」——右端在 c = c̃ = −26 时等于 (qq̄)^{13/6}，**这是错的**（差一倍）；
  正确关系是 q^{−c/24} q̄^{−c̃/24} = (qq̄)^{13/12}（等价地 (qq̄)^{−(c+c̃)/48}）。数值 13/12 与下游
  （|η|⁴、(7.3.6) 的 −48）都没错。main 提交 2249859 曾就地改本卡 statement；按原则 1 已恢复原文，
  订正版是 worldsheet.bc-ghost-torus-partition-function-v2。

  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E11 建立。

  **为什么这条重要**：|η|⁴ 恰好抵消两套玻色振子（|η|^{−2} 各一套），这就是 (7.3.6) 里指数
  −48 = −24×2 的来历（26 − 2 = 24 个横向模）。**「鬼场抵消两套振子」不是巧合，而是本卡的内容。**

  **本卡记录了本章第三处「作者自承的缺口」**（另两处：(7.2.22) 的整体数值系数、
  (7.2.24) 讨论里未追踪的符号），见抽取记录 Q6。
