id: worldsheet.bc-ghost-torus-partition-function
kind: proposition
title: "bc 鬼场的环面配分函数：带 (−1)^F 的裸迹为零，插入四个零模后给 |η(τ)|⁴"
statement: |
  设 λ = 2 的 bc 鬼场 CFT（worldsheet.bc-ghost-cft，c = c̃ = −26）定义在 T²(τ) 上，
  按 worldsheet.torus-partition-function-general-cft 取迹（世界面费米数 F 即鬼数 mod 2）。则

  (1)（**反周期迹**，即不插 (−1)^F）
        Tr[ exp(2πiτ₁P − 2πτ₂H) ] = (qq̄)^{13/12} Tr(q^{L₀} q̄^{L̃₀})
          = 4 (qq̄)^{1/12} ∏_{n=1}^{∞} |1 + q^n|⁴ ,
      前因子 (qq̄)^{13/12} = (qq̄)^{−(c+c̃)/24}（c = c̃ = −26），4 来自四个鬼场基态
      |↓↓⟩、|↑↓⟩、|↓↑⟩、|↑↑⟩。

  (2)（**Faddeev–Popov 所需的周期鬼场**）鬼场必须与原坐标变换同周期（周期性），
      而反交换场的朴素迹对应时间方向的**反**周期边条件，故正确的配分函数带 (−1)^F，而它**为零**：
        Z(τ) = Tr[ (−1)^F exp(2πiτ₁P − 2πτ₂H) ] = 0 。
      两种看法：算符侧——|↓↓⟩、|↑↑⟩ 与 |↑↓⟩、|↓↑⟩ 的鬼数 mod 2 相反，四项两两相消；
      路径积分侧——**模与 CKV 带来的鬼场零模**使配分函数为零。

  (3)（**插入零模后的非零结果**）零模必须用插入饱和；环面上最简单的非零振幅
      ⟨c(w₁) b(w₂) c̃(w̄₃) b̃(w̄₄)⟩ 相当于在迹里插 c₀b₀c̃₀b̃₀（它把四个基态投影到唯一的 |↑↑⟩），
      结果为
        Tr[ (−1)^F c₀ b₀ c̃₀ b̃₀ exp(2πiτ₁P − 2πτ₂H) ]
          = (qq̄)^{1/12} ∏_{n=1}^{∞} |1 − q^n|⁴ = |η(τ)|⁴ 。
      ⚠ 注意无穷乘积里的**符号由 (1) 的 (1+q^n) 变成 (1−q^n)**，这来自迹里的 (−1)^F。
      该结果**与四个鬼场的插入位置无关**，因为环面上的 CKV 与全纯二次微分都是常数。

  ⚠ **整体符号是人为设定的**：原书逐字「Again, we do not try to keep track of the overall sign,
  setting it to be positive.」故 (3) 右端的符号不是算出来的。

  **本卡不断言什么**：不断言插入位置无关性以外的位置依赖细节；不断言 |η|⁴ 与
  自由标量振子的相消关系（那在 spectrum.one-loop-torus-amplitude 的推导里用）。
