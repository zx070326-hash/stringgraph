id: worldsheet.polyakov-weyl-invariance
kind: proposition
title: Polyakov 作用量的 Weyl 不变性
statement: |
  Polyakov 作用量 S_P[X, γ]（worldsheet.polyakov-action）在世界面 Weyl 重标度
    γ'_{ab}(τ,σ) = e^{2 ω(τ,σ)} γ_{ab}(τ,σ),   X'^μ(τ,σ) = X^μ(τ,σ)
  下不变（ω 为任意光滑实函数）：S_P[X, γ'] = S_P[X, γ]。
  这一不变性是世界面维数等于 2 的特殊性质：在 d 维世界体上
  (-γ)^{1/2} γ^{ab} 在 Weyl 变换下带因子 e^{(d-2)ω}。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.worldsheet-lorentzian]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.2, eq. **(1.2.21)**, p.13：`X′^μ = X^μ`, `γ′_ab(τ,σ) = exp(2ω(τ,σ)) γ_ab(τ,σ)`"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E7。
      **【订正 2026-09-11（curator-v1-sec13，researcher 第七轮 L1 页图逐字）】**
      **Weyl 不变性的式号是 (1.2.21)，p.13**，不是旧 loc 写的「约 (1.2.19)–(1.2.20) 附近」——
      **(1.2.19) 是 Poincaré、(1.2.20) 是 diff**，三条变换在原书里各有独立式号。
      Weyl 变换的写法 `γ′_ab = exp(2ω)γ_ab` 此前只由 Headrick 习题 1.3 第 (8) 式确认，
      现由原书 (1.2.21) 直接确认，证据等级升到 **L1**。
      见 literature/extractions/polchinski-1998-v1.md §13.3(b) 的 §1.2 式号全表。
tags: [bosonic-string, symmetry, classical, polyakov, weyl]
notes: |
  本条是**经典**陈述。量子层面 Weyl 不变性一般被反常破坏（Weyl 反常，§3.4），
  要求总中心荷为零；这是 D = 26 的第二条独立路线，不在本节点范围。
  Weyl 不变性与 diff 不变性合起来给出足以取光锥规范
  （worldsheet.light-cone-gauge）与共形规范的规范自由度。
author: curator-polchinski-ch1
created: "2026-09-10"
