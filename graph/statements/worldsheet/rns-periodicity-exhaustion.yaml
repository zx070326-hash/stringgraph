sources:
  - ref: polchinski-1998-v2
    loc: "§10.2, eq. (10.2.1)（柱面费米作用量）、(10.2.2a,b)、(10.2.3a,b)，pp. 5–6；逐字 'This condition plus Lorentz invariance still allows two possible periodicity conditions'；X^μ 周期性的理由与 orbifold 括注同页"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E15；式号与逐字措辞均逐页读到原书页图）。
      ⚠ 抽取记录特别提醒：「只有 R 与 NS 两种」这个结论**依赖「要最大 Poincaré 不变性」
      这个额外假设**，转节点时必须写进陈述本身——本卡的 (P1) 即此。
  - ref: polchinski-1998-v2
    loc: "§10.2, (10.2.4) 下方, p. 6（四个闭弦扇区，逐字：'Thus there are four different ways to put the theory on a circle, each of which will lead to a different Hilbert space … We will denote these by (ν, ν̃) or by NS–NS, NS–R, R–NS, and R–R. They are analogous to the twisted and untwisted sectors of the Z_2 orbifold.'）"
    note: L1（E16）。
tags: [rns, superstring, ns-sector, ramond-sector, periodicity, sectors]
notes: |
  【为什么把闭弦四扇区并入本卡而不单列】原书 E16 的整段就是 (10.2.3) 的一行推论
  （左右独立各两种 ⟹ 四种），没有独立论证；按 graph/CLAUDE.md「文献分别推导才拆」的判据不拆。
  开弦的情形不同（要用边界条件与一次场重定义），故单列
  worldsheet.open-superstring-two-sectors。

  【本卡刻意不写的一步】「四个扇区各自给出一个不同的 Hilbert 空间」这句里的「不同」
  在原书是描述性的（'essentially there are four different kinds of closed superstring'），
  本卡照抄为推论，不主张它们两两不同构。
