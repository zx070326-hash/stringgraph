id: worldsheet.superstring-relative-cohomology-vanishing
kind: proposition
title: 超弦（RNS）相对 BRST 上同调的消灭定理：D = 10、p ≠ 0 时 H^n_rel(p,κ) = 0 除 n = 0
statement: |
  **设定**（数学侧表述；与 worldsheet.no-ghost-theorem-superstring-cohomological 的
  (H1)–(H5) 逐条同构，故意重写以使本卡自足）。取 N = 1 超 Virasoro 代数
  （math.super-virasoro-algebra），扇区标号 κ = ½（Neveu–Schwarz，模式 r ∈ Z + ½）
  与 κ = 0（Ramond，模式 r ∈ Z）。
    (H1) **临界维数**：物质部门是 D = 10 个自由 X^μψ^μ，物质中心荷 c^m = (3/2)D = 15；
         鬼部门是 λ = 2 的 bcβγ 一阶 SCFT，c^g = −15
         （worldsheet.superconformal-ghost-central-charge）。总中心荷为零，
         故 Q_B² = 0（worldsheet.superstring-brst-nilpotent-at-c15），BRST 上同调有定义。
    (H2) **动量**：固定质心动量 p，**p ≠ 0**。（p = 0 不在本陈述范围内，见"本命题不断言"。）
    (H3) **相对复形**：C_rel(p,κ) 取为被下列算符零化的子复形——
           NS：b₀ 与 L₀；
           R： b₀、β₀、L₀ 与 G₀，
         其中 L₀、G₀ 是**物质加鬼场**的总生成元（即
         worldsheet.superstring-brst-additional-conditions 所加的条件）。
         因 {Q_B, b₀} = L₀、[Q_B, β₀] = G₀，Q_B 保持 C_rel，记
         H^n_rel(p,κ) = ker(Q_B|_{C_rel}) / im(Q_B|_{C_rel})。
    (H4) **鬼数分次**：n 是鬼数，零点按 conv.superstring-ghost-number-zero 的 canonical
         （Lian–Zuckerman 1989：鬼数 = U + κ 的本征值；该家的零点使本定理的非零次数落在 0）。
    (H5) **R 扇区 βγ 零模表示**：β₀、γ₀ 是**对易**的鬼零模，其表示不唯一且不等价
         （worldsheet.superconformal-ghost-unit-operator-vacuum；LZ p.304 逐字
         "Representations corresponding to distinct charges are inequivalent."）。
         本陈述**不固定**这个选择，而以存在量词的形式陈述（见断言 (2)）。

  **断言**（在 (H1)(H2)(H3)(H4) 之下）：
    **(1) NS 扇区**：取标准 NS 鬼真空（βγ 的 Bose-sea charge 取使能量分次 deg 有上界的那一个），
        则 H^n_rel(p, ½) = 0 对一切 n ≠ 0。
    **(2) R 扇区**：**存在**一种 β₀γ₀ 零模表示（使相对复形 (H3) 有定义、且 (H4) 的鬼数分次
        取整数值），使 H^n_rel(p, 0) = 0 对一切 n ≠ 0。

  **本命题不断言**：
    (a) 不断言 H⁰_rel 上的任何**正定性**——那是
        worldsheet.no-ghost-theorem-superstring-cohomological，由本定理加 Euler–Poincaré
        与号差公式推出。本定理本身是纯上同调陈述，其证明不涉及任何厄米形式。
    (b) 不断言 H⁰_rel 的**维数**（LZ Corollary 2.15(i) 的 "Quantization Condition"），
        也不断言它与横向空间或 OCQ 物理态的同构（那是
        worldsheet.brst-cohomology-equals-ocq-physical-superstring）。
    (c) 不断言 p = 0。零动量时本定理**失效**（LZ Proposition 5.5 逐字
        "For p = 0, the vanishing theorem does not hold because the Fock space V(p,κ) is
        not Vir_κ^- -free"），相对上同调在多个鬼数上非零。
    (d) 不断言**绝对**（非相对）复形的上同调（那是 LZ Theorem 5.1 / 5.4 与
        worldsheet.brst-cohomology-picture-independence 的内容）。
    (e) 不断言 GSO 投影后的版本（LZ §4 Proposition 4.3，本图未建卡）。
