sources:
  - ref: lian-zuckerman-1989
    loc: "**Theorem 2.4**, p.309（陈述）/ **Corollary 3.4**, p.323（证明），逐字：'Suppose p ≠ 0: then H^n_rel(p,κ) = 0 unless n = 0.'，紧随逐字 'This is the analogue of the vanishing theorem proven by FGZ.'"
    note: |
      L1（全文 35 页逐页读图，literature/extractions/lian-zuckerman-1989.md E3）。
      ★ **作者自评（p.335 逐字）：'The only mathematically non-trivial result is the
      vanishing theorem (2.4).'** —— 这是本卡单独立卡的首要理由：LZ 论文的全部数学分量
      集中在这一条，而它此前只作为两条下游推导的 source 出现。
      ⚠ 前提链（全文散布，引用必须集齐）：p ≠ 0（Theorem 2.4 逐字 'Suppose p ≠ 0'）；
      D = 10（p.308 逐字 'From now on, we will take D = 10'）；复形取 p.306 (8)，
      **R 扇区用 T₀ ⊕ T₁**（p.306 (7)）。
      ⚠ **p.305 Remark 的半空间假设 {p^D > 0} 与本定理无关**：该假设只定 R 扇区旋量因子
      R(p,0) 上厄米型 ⟨,⟩_R 的整体符号，而本定理的证明不涉及任何厄米形式
      （auditor 2026-09-11 裁决 (c) 逐条核对：'Theorem 2.4 / Corollary 3.4 与
      Proposition 3.3 的前提只写 "p ≠ 0"（p.309、p.323），证明是有限过滤 + 长正合列，
      不涉及任何厄米形式'）。⇒ 本卡 (H2) 只写 p ≠ 0 是**精确**的，不是简化。
      ⚠ **编号陷阱**：p.305 **Lemma** 1.4 与 p.306 **Definition** 1.4 同号，引用必须带类型词；
      各章公式号重起，引用公式必须带章号。
      ⚠ LZ 的中心荷归一化是 c/8 (m³ − 2κm)（不是本图的 c/12），故其 D = 10 ↔ 本图 c^m = 15；
      跨来源依赖边上须写 convention_map。
  - ref: lian-zuckerman-1989
    loc: "§3 的证明链（陈述 p.309，证明 pp.321–323）：**Lemma 3.1**（Poincaré 对偶 H^m_rel ≅ (H^{−m}_rel)*）→ **Proposition 3.2**（有限过滤）→ **Proposition 3.3**（伴随分次复形的 H^m = 0, m < 0）→ **Theorem 3.3.1**（超李代数同调的正合序列 (40)）+ **Corollary 2.19(iii)**（V(p,κ) 是自由 Vir_κ^- 模）⇒ **Corollary 3.4 = Theorem 2.4**"
    note: |
      L1。Theorem 3.3.1 自述是经典李代数同调定理的推广，逐字：'a generalization of a theorem
      in the theory of classical Lie algebra homology (a good exposition is given in [18];
      see also [23])'。Corollary 2.19(iii)（Vir_κ^- 自由性）的证明经 Proposition 2.18，
      用**超 Virasoro 的 Kac 行列式**（[22] = Meurman–Rocha）与 M_κ(h', 9) 的幺正性
      （[7, 9, 10]）；本图**没有超 Virasoro Kac 行列式卡**（只有玻色版
      worldsheet.kac-determinant-v2），故这条输入未上图，见推导 gaps。
  - ref: lian-zuckerman-1989
    loc: "**Proposition 5.5**, p.333（p = 0 的例外情形），逐字：'For p = 0, the vanishing theorem does not hold because the Fock space V(p,κ) is not Vir_κ^- -free'；并显式列出 H^n_rel(0,κ) 与 H^n(0,κ)（κ=0：n = 0, ±1；κ=½：n = ±½, ±3/2）"
    note: |
      L1。本条是"本命题不断言 (c)"的来源：**零动量不是"未讨论"，而是结论确实不同**，
      且 LZ 给出了失效的确切机制（Vir_κ^- 自由性失效 ⇒ §3 的证明链断在 Corollary 2.19(iii)）。
  - ref: lian-zuckerman-1989
    loc: "p.306 (7)（零模表示的选择：κ=½ 取 T_{1/2}、**κ=0 取 T₀ ⊕ T₁**，逐字 'Fortunately, for each sector κ = ½, 0, there is a unique such space in which deg is bounded above'）、p.306 (8)（复形 C(p,0) = R(p,0) ⊗ U(0) ⊗ Λ_∞ ⊗ (T₀ ⊕ T₁)、C(p,½) = R(p,½) ⊗ U(½) ⊗ Λ_∞ ⊗ T_{1/2}）、p.304（逐字 'Representations corresponding to distinct charges are inequivalent.'）"
    note: |
      L1。本条锁定断言 (2) 的存在量词由哪个实例见证：**T₀ ⊕ T₁**。
      ⚠ 这与 FOK 1989 / IMNU 1986 的见证（C[γ₀]，单个 Bose-sea charge，FOK 称 "Henneaux 表示"）
      **不是同一个空间**；两者给出的相对上同调是否同构，本图未核实（见推导 gaps）。
tags: [superstring, brst, cohomology, rns, vanishing-theorem, ramond-sector]
notes: |
  【为什么单建这张卡】
  本定理此前只以 source 的形式出现在两条推导里
  （worldsheet.no-ghost-theorem-superstring-cohomological--via-lian-zuckerman-1989 与
  worldsheet.brst-cohomology-equals-ocq-physical-superstring--via-lian-zuckerman-1989），
  两条推导的 gaps 各记了一条"消灭定理无独立卡"。三条理由：
    (1) **它是 LZ 全文唯一的非平凡数学内容**（作者自评 p.335 逐字见 sources）；
    (2) 它是**两条**下游推导的共同上游，不立卡就要在两处重复记账，且两篇独立文献
        （LZ 与 FOK）各自证明它这一事实无法落在图的结构上；
    (3) 它的**失效条件**（p = 0，Proposition 5.5）是本图目前唯一有显式反例机制的
        超弦 BRST 前提，值得独立可查。
  ⇒ 两条下游推导自本卡起 depends_on 本卡（**非 inferred**：LZ 在 Corollary 2.15 与
  Theorem 2.20 的证明里**明确引用** Theorem 2.4），其 gaps 里"消灭定理无独立卡"一条
  自本卡建立起作废，已改为指向本卡。

  【与玻色弦一侧的对应】
  LZ 1989 Theorem 2.4  ↔  FGZ 1986 Theorem 2.7(i)（玻色弦消灭定理）。
  LZ 在 Theorem 2.4 后逐字自述 'This is the analogue of the vanishing theorem proven by FGZ.'
  ⚠ 本图玻色弦一侧**也没有**为 FGZ 的消灭定理单建卡（同型的记账缺口，已列入报告交 lead）。

  【鬼数零点的依赖】(H4) 的 n = 0 只在 conv.superstring-ghost-number-zero 的 canonical
  （LZ 家）下成立。若改用 FOK 或 Dedushenko 的零点，非零次数整体平移；且 R 扇区还要
  换零模表示（见该约定卡的换算表 (B)(C) 与"使用规则"第 3 条）。

  【与 no-ghost-theorem-superstring-cohomological 的分工】
  本卡 = "上同调集中在一个次数"（纯上同调，无度量）；那张卡 = "该次数上的形式正定"
  （用本卡 + Euler–Poincaré + Proposition 2.14(ii) 的 char = sign）。
  这正是 graph/CLAUDE.md "一个节点一个命题"的拆法：LZ 自己也把两者分成
  Theorem 2.4 与 Corollary 2.15(ii) 两条编号结果。

  ⚠⚠ **本卡片已被取代（curator，2026-09-11，依 reviewer-batch22 CONFIRMED + lead 裁决）**，
  见 superseded_by。原因只有一条：(H4) 写「n 是鬼数」是**陈述漂移**——LZ 的鬼数取值在 Z + κ，
  NS 扇区是半整数，故按本卡字面 NS 的 n = 0 不可达；Theorem 2.4 用的是 Definition 2.2 的
  **相对次数**（F^n = B^{n−κ} ∩ Ker K，即 n = 鬼数 + κ ∈ Z）。
  v2 只改 (H4) 一条并补了换算与来源，其余逐字未动。
  本卡的推导 `--via-lian-zuckerman-1989` 已 git mv 改指 v2（纯换名式换代，论证原样适用），
  本卡不再留推导；无活推导依赖本卡。
