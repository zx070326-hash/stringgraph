id: worldsheet.tower-physical-quotient-form
kind: proposition
title: 动量塔上的零态与商型：H_null := H_phys ∩ H_phys^⊥，伪态 ⊆ H_phys^⊥，且 ⟨,⟩_T 在 H_phys/H_null 上诱导良定义的对称双线性型
statement: |
  **设定**。沿用 worldsheet.momentum-tower-fock-space 的动量塔 T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)
  （代数直和）与其上的 R-双线性型 ⟨·,·⟩_T（层间正交是那张卡的约定式定义），
  沿用 worldsheet.ddf-operators-preserve-physical-states 的塔上物理子模
    H_phys(a₀) := { Ψ ∈ T(p;k_0) : (L_0 − a₀)Ψ = 0 且 L_mΨ = 0 对一切 m ≥ 1 }
  （L_m 逐层用该层动量的 Sugawara 生成元，不移动层指标；a₀ ∈ R 是塔上统一的截距常数，
  按 conv.intercept-sign-a），以及它的正模那一半
    P := { Ψ : L_mΨ = 0 ∀ m ≥ 1 }（worldsheet.ddf-operators-preserve-positive-mode-conditions）。
  R 是交换环且为 Q-代数（凡出现 L_m 处）。**型是 R-双线性，不是半双线性**；「⊥」「†」一律指
  对 ⟨·,·⟩_T 的转置。

  【定义（塔上的三个子模）】
    · **伪态** H_spur := Σ_{n ≥ 1} L_{−n} T(p;k_0)（各 L_{−n} 像的和，**不含质量壳条件**，
      也**不依赖 a₀**；这是 worldsheet.spurious-subspace 的无壳伪态子空间逐字装在塔上）；
    · **正交补** W^⊥ := { Χ : ⟨Χ, Ψ⟩_T = 0 对一切 Ψ ∈ W }；
    · **零态** H_null(a₀) := H_phys(a₀) ∩ H_phys(a₀)^⊥（物理且与所有物理态正交的态）。

  **断言**。

  (1) **伪态与物理态正交（塔上版）**：H_spur ⊆ H_phys(a₀)^⊥，对一切 a₀ ∈ R。
      唯一输入是塔上的伴随关系 L_m^† = L_{−m}（worldsheet.momentum-tower-fock-space (3) 那一半）
      与物理态的正模条件 L_mΨ = 0（m ≥ 1）。**不用质量壳条件，也不用 a₀ 的任何取值。**

  (2) **易方向**：H_spur ∩ H_phys(a₀) ⊆ H_null(a₀)。即塔上「既是伪态又是物理态」的态一定是零态；
      特别地零态自身范数为零：Χ ∈ H_null ⟹ ⟨Χ,Χ⟩_T = 0。
      具体形式：若 n ≥ 1 且 L_{−n}Ψ 恰好是物理态，则 L_{−n}Ψ ∈ H_null(a₀)。

  (3) **配对只依赖零态类**：对 Ψ, Φ ∈ H_phys(a₀) 与 Χ, Χ' ∈ H_null(a₀)，
        ⟨Ψ + Χ, Φ + Χ'⟩_T = ⟨Ψ, Φ⟩_T；
      更一般地 Ψ − Ψ' ∈ H_null 且 Φ − Φ' ∈ H_null ⟹ ⟨Ψ,Φ⟩_T = ⟨Ψ',Φ'⟩_T。

  (4) **商上的诱导型**：由 (3)，⟨·,·⟩_T 在商模 H_phys(a₀)/H_null(a₀) 上诱导一个良定义的
      R-双线性型 ⟨·,·⟩_quot，其计算规则是
        ⟨[Ψ], [Φ]⟩_quot = ⟨Ψ, Φ⟩_T   （Ψ, Φ ∈ H_phys(a₀) 的任意代表元），
      商映射 [·] 满射，且 ⟨·,·⟩_quot **对称**（继承 ⟨·,·⟩_T 的对称性）。
      **这个商上的型正是无鬼定理断言其正定的那个对象**（在 D = 26、a₀ = 1 时）。

  (5) **通用层（本卡所断言的一般形式）**：设 M 是任意 R-模，B 是 M 上的双线性型，
      P ⊆ M 是子模，且 B **自反**（LinearMap.IsRefl：B x y = 0 ⟹ B y x = 0；
      **比对称弱**）。令 rad_P := { χ ∈ P : B χ φ = 0 ∀ φ ∈ P }。则 B 在 P/rad_P 上诱导
      良定义的双线性型，计算规则同 (4)；rad_P 中的代表元给出整行为零；B 对称时诱导型对称。
      (1)–(4) 是它在 M = T(p;k_0)、B = ⟨·,·⟩_T、P = H_phys(a₀) 的实例。

  【本命题明确不断言】
  (a) **不断言反包含 H_null(a₀) ⊆ H_spur**（「每个零范数物理态都是伪态」）。那是无鬼定理的
      困难一半，需要 DDF/光锥分解；因此 **(4) 的商是「物理态模正交根基」，尚未等同于
      「物理态模伪态」**。这与 worldsheet.spurious-orthogonal-to-physical 的同一条边界一致。
  (b) **不断言 ⟨·,·⟩_quot 非退化**：它按构造是非退化的，但
      「∀q, (∀q', ⟨q,q'⟩_quot = 0) ⟹ q = 0」这条陈述本卡不断言（Lean 侧亦未抽出）。
  (c) **不断言任何正定性**：一般交换环上没有序；D = 26、a₀ = 1 时的正定性是
      worldsheet.no-ghost-theorem-v4 的内容，本卡不涉及。
  (d) **不断言 H_spur 与 DDF 算子的任何关系**，也**不断言**质量壳版伪态
      S(k) = H_spur ∩ ker(L_0 − a₀) 的任何性质（塔上没有 worldsheet.ocq-spurious-states-v2
      的 on-shell 细化）。
  (e) **不断言 H_phys(a₀) ≠ 0**、不断言商非零、不断言任何维数或分级。
  (f) **不断言塔上的 H_phys 与逐层 Fock 空间上的物理子模之间的关系**（与
      worldsheet.ddf-operators-preserve-physical-states 的「不断言 (f)」同一条）。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.virasoro-standard
  - conv.intercept-sign-a
