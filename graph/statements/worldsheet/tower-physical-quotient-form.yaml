sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/TowerNull.lean。本卡 formal.lean_decl = StringFormal.NoGhost.towerQuotientPairing（(4) 的诱导型），配套 towerQuotientPairing_mk（计算规则 = 良定义）、towerQuotientPairing_comm（对称）、TowerPhysQuot（商类型）、towerPhysMk / towerPhysMk_surjective、towerNullInPhys / mem_towerNullInPhys、towerQuotientPairing_mk_eq_zero_of_mem_towerNullSubmodule、towerQuotientPairing_mk_eq_zero_of_mem_towerSpuriousSubmodule；(1) = towerSpuriousSubmodule_le_towerOrthComplement；(2) = towerSpurious_inf_towerPhys_le_towerNull、towerLop_neg_apply_mem_towerNullSubmodule、towerPairing_self_eq_zero_of_mem_towerNullSubmodule；(3) = towerPairing_add_null / towerPairing_add_null_left / towerPairing_add_null_right / towerPairing_eq_of_sub_mem_towerNullSubmodule；子模定义 towerSpuriousSubmodule / towerNullSubmodule / towerOrthComplement（含 mem_ 展开引理与 towerNullSubmodule_le_towerPhysSubmodule）；(5) 通用层 StringFormal.{radicalIn, QuotRadical, QuotRadical.mk, QuotRadical.mk_surjective, quotRadicalForm, quotRadicalForm_mk, quotRadicalForm_comm, quotRadicalForm_mk_eq_zero_of_mem_radicalIn}；另 towerPairing_isRefl、Fock.pairing_isRefl、Fock.orthComplement_eq_orthogonal"
    note: |
      本仓库，formalizer 提交 **c985285**（"formal: add tower spurious/null states and the induced form
      on H_phys/H_null"，分支 agent/formalizer/noghost-c），由 lead 以 **43d7d54** 合入 main。
      Lean 4 + Mathlib v4.33.1，**无 sorry**。**curator 未自行重跑 `lake build` 与 `check-axioms`**；
      按项目纪律，含 formal 改动的分支由 lead 在合并前跑（本分支只改 graph/，不改 Lean）。

      逐条对照（去掉隐式参数后的 Lean 语句）：
        · (1) `towerSpuriousSubmodule_le_towerOrthComplement : towerSpuriousSubmodule η a b
              ≤ towerOrthComplement η (towerPhysSubmodule η a b a₀)`，证明体里唯一的输入是
              `Fock.towerPairing_towerLop_left`（L_m^† = L_{−m}）与 `mem_towerPhysSubmodule` 的正模那一半；
        · (2) `towerSpurious_inf_towerPhys_le_towerNull`，其中
              `towerNullSubmodule η a b a₀ = towerPhysSubmodule η a b a₀ ⊓ towerOrthComplement η (towerPhysSubmodule η a b a₀)`
              逐字就是本卡的 H_null；
        · (3) `towerPairing_eq_of_sub_mem_towerNullSubmodule`（两侧同时移动）与 `towerPairing_add_null`；
        · (4) `towerQuotientPairing := quotRadicalForm (Fock.towerPairing η) (towerPhysSubmodule η a b a₀) (towerPairing_isRefl η)`，
              良定义性就是 `towerQuotientPairing_mk` 这条 simp 规则（商类型
              `TowerPhysQuot := QuotRadical (Fock.towerPairing η) (towerPhysSubmodule η a b a₀)`）；
        · (5) `quotRadicalForm` 及其 API，**唯一假设是 `LinearMap.IsRefl B`**，M 是任意 R-模。
      ⚠ 本卡 (a) 对应文件头 "## Gaps" 第 1 条逐字：「`H_null = H_spurious ∩ H_phys` is only one
      inclusion. … `TowerPhysQuot` is therefore the quotient by the *orthogonal radical* … but it is
      not yet known to agree with "physical modulo spurious".」(b)(c)(d) 对应同处第 2、3、4 条。
  - ref: polchinski-1998-v1
    loc: "§4.1，eq. (4.1.8)（⟨ψ|χ⟩ = Σ_k ⟨L_kψ|χ_k⟩ = 0）与 eq. (4.1.9)（加零态不改变内积、商上内积良定义），p.122"
    note: |
      文献侧只有**单个 Fock 空间**（固定动量）上的版本，且式号经 schrans-2020 目录核实、未核对原书
      （抽取记录 literature/extractions/polchinski-1998-v1.md#E55；同一定位见
      worldsheet.spurious-orthogonal-to-physical）。**本卡的对象是动量塔**，Polchinski 不写塔，
      更不区分「模零态」与「模伪态」两个商（他直接商掉 N = H_phys ∩ S）。
      ⇒ 本条只作文献对应，**不承载本卡**：承载的是上一条 Lean 来源。
  - ref: gsw-1987-v1
    loc: "§2.2.1–2.2.2（spurious 与 zero-norm 态；伪态与物理态正交）"
    note: |
      同上：单动量扇区的教科书版本，已从 mostly-minus / α' = 1/2 转写；不承载塔上的陈述。
tags: [bosonic-string, no-ghost, momentum-tower, spurious, null-state, quotient, lean]
notes: |
  【为什么立卡（curator 2026-09-11，small-backlog-14）】
  formal/StringFormal/NoGhost/TowerNull.lean 已在 main 上（提交 c985285，合并 43d7d54），
  但图上没有任何节点认领它：worldsheet.spurious-orthogonal-to-physical 与
  worldsheet.spurious-subspace-orthogonal-to-physical 都是**单个 Fock 空间** F(k) 上的卡
  （lean_decl 指向 PhysicalStates.lean 的 `Fock.spuriousSubmodule_le_orthComplement`），
  而 DDF 构造与无鬼定理的断言都住在**动量塔**上。TowerNull.lean 文件头逐字写明立此文件的理由：
  「Without the objects below the statement of the no-ghost theorem cannot be written down on the
  tower at all.」本卡认领塔上的那一份。

  查重：2026-09-11 跑 `uv run stringgraph search 商空间 / 动量塔 / spurious / 零态`，
  命中的全是单 Fock 版或上同调版（brst-cohomology-equals-ocq-physical 等），
  **没有节点断言塔上的 H_null 或塔上的商型**。

  【与 worldsheet.spurious-orthogonal-to-physical 的分工】那张卡的 notes 记着一条缺口：
  「陈述 (2) 的后半（加零态不改变内积、商上形式良定义）**没有具名引理**」。
  **本卡在塔上关闭了这条缺口**（(3)(4) 各有具名 Lean 引理：`towerPairing_add_null`、
  `towerQuotientPairing_mk`），但**没有在单 Fock 上关闭它**——单 Fock 的 QuotientForm.lean
  仍是旧写法，见下面【可重构但未做】。两张卡不互相 supersede：对象不同（F(k) vs T(p;k_0)）。

  【只有易方向（本卡最重要的边界）】(2) 给的是 H_spur ∩ H_phys ⊆ H_null，**反方向没有**。
  因此 (4) 的商是**「物理态模正交根基」**，不是**「物理态模伪态」**——这两个商在
  (D, a₀) = (26, 1) 时才由无鬼定理证明一致（worldsheet.spurious-orthogonal-to-physical 的 notes
  把这条记为「建议提交里程碑流程规范化的措辞冲突」，本卡不改变那个状态，只是在塔上把两者
  的差别写成了可检验的形式）。反方向需要 DDF/光锥分解，即 formal/TODO.md 的 `ddf-spans` 项。

  【通用层为什么要一般化到任意 M（不是风格选择，是 Mathlib 障碍）】
  Lean 侧的 (5) 不是为了漂亮：TowerNull.lean 文件头逐字记录了一条**实实在在的 Mathlib 级障碍**——
  对 `M = ℤ →₀ k`（而 `TowerFock D R = ℤ →₀ Fock D R` 正是这个形状），
  实例合成 `HasQuotient ↥P (Submodule R ↥P)` **失败**，因为 `ℤ →₀ k` 同时是 `AddMonoidAlgebra`，
  两条通往 `AddCommMonoid (ℤ →₀ k)` 的路径（`AddCommGroup.toAddCommMonoid ∘ Finsupp.instAddCommGroup`
  与 `Finsupp.instAddCommMonoid`）不是可归约地 defeq。文件头给了最小复现：
  `example (R : Type) [CommRing R] (p : Submodule R (ℤ →₀ R)) (q : Submodule R p) : Type := p ⧸ q`
  失败，而把 `ℤ →₀ R` 换成抽象的 `[AddCommGroup M] [Module R M]` 上的 `ℤ →₀ M`、
  或换成 `MvPolynomial ℕ R`，都成功。⇒ 对抽象 M 证完再实例化，是**绕过实例搜索的唯一办法**；
  直接写 `↥(towerPhysSubmodule …) ⧸ …` 不能 elaborate，手写 `@Submodule.hasQuotient` 又会让
  后面的 `liftQ` 在 `whnf` 处发散。本卡 (5) 把这件事记进图里，免得下次有人「简化」掉它。
  ⇒ 附带收获：(5) 的唯一假设是 **`LinearMap.IsRefl B`（自反，比对称弱）**，
  所以这一层对任何自反双线性型都可用，不限于本图的塔。

  【可重构但未做】TowerNull.lean 文件头 Gaps 第 5 条逐字：单 Fock 的 `QuotientForm.lean`
  「is literally the `M := Fock D R`, `B := Fock.pairing η`, `P := Fock.physSubmodule η a a₀` instance」，
  按 (5) 重构可以删掉 `Fock.nullInPhys` / `Fock.physPairing` / `Fock.quotientPairingAux` /
  `Fock.quotientPairing` 四个声明，**但那一支没做**（formalizer 有意把该分支限制在一个关注点上）。
  同处还记着 `Fock.orthComplement_eq_orthogonal`：单 Fock 的手写正交补与 Mathlib 的
  `LinearMap.BilinForm.orthogonal` 是同一个对象。这两条都记在
  worldsheet.fock-indefinite-form 的 notes 里，供后续 formalizer 参考。本卡不认领它们。
