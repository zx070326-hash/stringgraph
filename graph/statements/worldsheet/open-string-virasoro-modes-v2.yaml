id: worldsheet.open-string-virasoro-modes-v2
kind: definition
status: rigorous
title: 开弦的一套 Virasoro 生成元（doubling trick）与零模归一化 α_0 = (2α')^{1/2} p
statement: |
  **doubling trick。** 开弦世界面带边。Neumann 边界条件
  （worldsheet.open-string-neumann-boundary-condition）使能动张量的全纯与反全纯部门在边界上
  相等，于是可以把 T̄ 视为 T 到上半平面镜像的解析延拓，把带边区域上的两个部门
  合并为**整个复平面上的一个**全纯 T。相应地，开弦只有**一套** Virasoro 生成元 {L_m}，
  由 worldsheet.energy-momentum-laurent-modes 的围道公式给出；
  它们在自由玻色子 Fock 空间上的显式模式表达式由
  worldsheet.virasoro-generators-free-boson 给出：
    L_m = (1/2) Σ_{n ∈ Z} : α_{m-n} · α_n :,   α_p · α_q ≡ η_{μν} α^μ_p α^ν_q。
  （闭弦相反：全纯与反全纯是两套独立的 Virasoro 代数 {L_m} 与 {L̄_m}。）

  **零模归一化。** 开弦取
    α^μ_0 = (2 α')^{1/2}  p^μ,
  其中 p^μ 是弦的总时空动量（conv.alpha-prime-regge、conv.metric-mostly-plus）。
  闭弦的对应取法是 α^μ_0 = ᾱ^μ_0 = (α'/2)^{1/2} p^μ，与开弦相差因子 2，
  这是开闭弦公式最常见的混淆点。
  能级算符（level operator）记作
    N ≡ Σ_{n ≥ 1} α_{-n} · α_n。

  ⚠ 本节点是**定义/归一化约定的记录**，不断言任何由此推出的等式。
  特别地，「L_0 = α' p^2 + N」**不在本节点内**：它是一条命题，见
  worldsheet.open-string-l0-level-form。截距 a 的取值同样不在本节点内
  （见 worldsheet.open-string-intercept；符号约定见 conv.intercept-sign-a）。
