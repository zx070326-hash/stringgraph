notes: |
  ⚠ **本卡片已被取代（curator，2026-09-11）**，见 superseded_by。
  取代原因是 docs/ROADMAP.md「待拆清单」里 reviewer-batch2 的一条：本卡片**仍内嵌
  doubling trick 命题**。statement 首段以「**doubling trick。**」开头，用陈述句写
  「Neumann 边界条件使能动张量的全纯与反全纯部门在边界上相等，于是可以把 T̄ 视为 T 到
  上半平面镜像的解析延拓……相应地，开弦只有**一套** Virasoro 生成元」——
  这是一条有前提、有结论、可证可驳的**命题**，却写在一张 definition 卡里，
  与本卡片末段自称的「本节点是定义/归一化约定的记录，不断言任何由此推出的等式」直接矛盾。
  拆成两张：
    worldsheet.open-string-virasoro-modes-v3   —— 纯定义：倍增域上的 L_m 围道定义
                                                  （反射 T̄ 到下半平面写成**定义域约定**）
                                                  + 开弦零模归一化 (2α')^{1/2}
    worldsheet.open-string-doubling-trick      —— 命题：Neumann ⟹ T̄ 是 T 的镜像解析延拓
                                                  ⟹ 开弦只有一套 Virasoro
                                                  （推导 --via-boundary-condition，physical-argument）
  按不可变原则，本卡片的 id 与 statement 文本不作任何修改。
  图中唯一引用本卡片的结构边（worldsheet.open-string-l0-level-form--via-zero-mode-substitution）
  已按语义换代：模定义与零模归一化 → v3，「只有一套 Virasoro」→ 新增 doubling-trick 边。
  拆分不改变任何节点的有效状态（v3 与本卡片同为自身 rigorous / 有效 physical-argument）。

  **仍在散文中提到本卡片 id 的地方**（statement 文本不可改，故保留；旧 id 仍可解析）：
  worldsheet.open-string-l0-equals-level-plus-mass 的 statement（零模归一化的指路）、
  worldsheet.open-string-l0-level-form 的 statement（同上，该卡自身也已换代）。
  两处都是**指路**而非依赖边，读者顺 superseded_by 到 v3 即可。

  本节点取代 worldsheet.open-string-virasoro-modes（后者已写 superseded_by 指向本节点）。
  **拆分理由**（reviewer-ch23 在旧卡 notes 里标的「待拆」）：旧卡把
  「开弦的模定义与零模归一化」（定义）与「L_0 = α' p^2 + N」（命题）写在同一张卡上，
  违反「一个节点一个命题」。本节点只保留定义部分；等式部分见
  worldsheet.open-string-l0-level-form。
  旧卡在被拆分时**没有任何入边或出边**（图中无节点引用它），故本次拆分不改动任何其它节点。

  **【2026-09-11 换代提示】** 上文与 statement 末段提到的 worldsheet.open-string-l0-level-form
  已被再次拆分并写 superseded_by：纯代数的「L_0 在 level N 片上 = α'k² + N」现为
  **worldsheet.open-string-l0-equals-level-plus-mass**（formalized），
  「X 部门无加性常数（a^X = 0）」归 worldsheet.normal-ordering-constant-ax。
  statement 文本按不可变原则保留旧 id；旧 id 仍可解析，其 superseded_by 指向新卡。

  与 worldsheet.virasoro-generators-free-boson 的分工：那条给的是**任意**自由玻色子 Fock 空间上
  L_m 的纯代数定义（uses 为空、可形式化）；本条只加两件开弦特有的东西——
  doubling trick（为什么只有一套 Virasoro）与开弦零模归一化 (2α')^{1/2}。
  注意那条的 statement 里已经写出 L_0 = (1/2)α_0·α_0 + Σ_{n≥1}α_{-n}·α_n，
  本条不重复。

  **有效状态的来源**：本节点自身 rigorous，但 uses 里的
  worldsheet.energy-momentum-laurent-modes 有效状态是 physical-argument
  （它经 OPE 与围道，由 traceless-holomorphic-energy-momentum 拉低），
  故本节点有效状态为 physical-argument。这与旧卡相同，拆分不改变任何状态。
  保留 energy-momentum-laurent-modes 这条边是**有意的**：doubling trick 是关于
  能动张量 T 在边界上的解析延拓的陈述，离不开 T 的围道/Laurent 定义。

  **零模与形式化（承自旧卡）**：worldsheet.bosonic-fock-space（status: formalized）
  的空间**不含零模**——它是 α^μ_{-n}（n ≥ 1）生成的多项式代数，动量 k 只是外部标签。
  本节点的 α^μ_0 = (2α')^{1/2} p^μ 以零模为核心，故**尚未形式化**；
  要落到 Lean 侧必须先显式扩张那个定义补上 x^μ、p^μ（见 bosonic-fock-space 的 notes 缺口 (i)）。
  因此本节点的 uses 不加 worldsheet.bosonic-fock-space。
