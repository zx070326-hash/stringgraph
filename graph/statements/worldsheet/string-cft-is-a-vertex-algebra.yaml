id: worldsheet.string-cft-is-a-vertex-algebra
kind: proposition
title: 玻色弦世界面 CFT（D 个洛伦兹号差自由玻色子 ⊗ λ=2 的 bc 鬼场）的场满足顶点代数的局域性假设（Gui Def. 7.2 / Schottenloher Def. 10.7）
statement: |
  设玻色弦的世界面 CFT 由下列两部分的张量积给出：
  (a) D 个自由玻色子 X^μ（μ = 0, …, D-1）的 CFT（worldsheet.free-scalar-cft-action），靶空间度规
      η = diag(-1, +1, …, +1)（conv.metric-mostly-plus），态空间为各动量 k 上的 Fock 空间
      F_k（worldsheet.bosonic-fock-space，振子 [α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0}），
      全纯场为 ∂X^μ(z) ∝ Σ_m α^μ_m z^{-m-1}（归一化常数依 conv.alpha-prime-regge、conv.worldsheet-complex-coords，
      本命题不依赖其具体值）及其正规序积，特别是 T^X(z) = -(1/α') :∂X^μ ∂X_μ:(z)
      （worldsheet.energy-momentum-tensor-free-scalar）；
  (b) λ = 2 的 bc 鬼场系统（worldsheet.bc-ghost-cft），态空间为鬼场 Fock 空间（基态二重简并），
      全纯场为 b(z) = Σ_n b_n z^{-n-2}、c(z) = Σ_n c_n z^{-n+1}（{b_m, c_n} = δ_{m+n,0}）及其正规序积，特别是 T^g(z)。
  取 V 为张量积态空间（对每个固定 k 按 level 作 N-分次），V′ 为其分次对偶，配对 ⟨v′, v⟩ 为双线性配对
  （**不**要求正定；洛伦兹不定号见 worldsheet.fock-indefinite-form），E 为上述全纯场及其正规序积的集合。

  **命题**：E 中任意两个场 A(z), B(z) 互为局域，在下述两种意义下同时成立：
  (i) **形式局域性**（math.formal-distribution-locality；Schottenloher Definition 10.7）：
      存在 N 使 (z - w)^N [A(z), B(w)] = 0 于 End(V)[[z^{±1}, w^{±1}]]（费米型场取反对易子）；
  (ii) **复解析局域性**（math.vertex-algebra-complex-analytic-locality；Gui Definition 7.2）：
      对每个 v ∈ V, v′ ∈ V′，Σ_n ⟨v′, A(z_1) P_n B(z_2) v⟩ 与 Σ_n ⟨v′, B(z_2) P_n A(z_1) v⟩ 分别在 0 < |z_2| < |z_1|、
      0 < |z_1| < |z_2| 上 a.l.u. 收敛并解析延拓到 Conf²(C^×) 上同一个全纯函数，其在 z_1 = z_2 的极点阶有与 v, v′ 无关的上界。
  于是 (V, E) 满足 Schottenloher Theorem 10.10（math.locality-ope-equivalences）、Gui Proposition 7.12
  （math.vertex-algebra-ope-analytic-convergence）与顶点代数重构定理（Gui Theorem 5.12）的全部局域性前提；
  特别地 V 上由 E 生成一个（超）顶点算子代数，其共形向量对应 T = T^X + T^g，中心荷 c = D - 26（conv.virasoro-standard）。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-complex-coords
  - conv.virasoro-standard
sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Definition 10.7, p. 177（本节点断言被满足的形式侧假设）；pp. 181–182：**单个**自由玻色子的 Fock 空间实现 S = C[T_1, T_2, …]，a_n(P) = ∂P/∂T_n (n>0)，a_{−n}(P) = n T_n P，Φ(z) = Σ a_n z^{−n−1} 是场且 Φ(z)Φ(w) ∼ 1/(z−w)²；p. 179 Heisenberg 例子 [A(z),A(w)] = ∂δ(z−w) Z"
    note: |
      **本节点的断言在该书中没有被证明。** 该书只做单个自由玻色子（c = 1，正定 Fock 空间），
      无 D 分量、无洛伦兹号差 η、无 bc 鬼场、无路径积分定义（math-sources.md §11.4、§13.3）。
      列出它只为标明「已核实的最接近结果」在哪里。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, Definition 7.2, p. 70（本节点断言被满足的解析侧假设）；Theorem 5.12 (Reconstruction theorem), pp. 55–56（其假设之一逐字为「Locality: Any two fields of E are local」）；§6 Heisenberg VOA 的构造（本轮只读到目录级）"
    note: |
      **本节点的断言在该书中没有被证明。** Gui 不做弦论：无 c = 26、无 Weyl 反常、无路径积分（math-sources.md §8.8）。
      两条对本节点有利的事实：(1) 全书用 V′-双线性配对而非正定内积，故洛伦兹不定号本身不构成障碍；
      (2) Gui §7.7 说 Lie 括号版局域性「the easiest to verify in concrete examples」，再经 §7.8→§7.9 得到复解析版——
      即验证本节点的可行路线是先验模式对易关系，而不是直接验解析收敛。
      两条不利的事实：(1) 书中没有一处处理不定内积下的幺正性；(2) Theorem 5.12 **假设** Virasoro 关系与 c，不推导 c 的值。
  - ref: virasoro-lean-2025
    loc: "Theorem 10.1 / Corollary 10.2（单分量 Heisenberg 代数的 Sugawara 构造给出 c = 1 的 Virasoro 表示；Lean 已验证）"
    note: |
      **只有 c = 1 的单分量**，无 D 分量、无洛伦兹号差（sources.bib 使用限制 (1)(2)），且**不含任何局域性/OPE 陈述**
      （使用限制 (4)）：它停在 Lie 代数层面，连本节点 (i) 的单玻色子特例都不覆盖。列出它是因为它是本图中
      离本节点最近的**已形式化**结果。
  - ref: polchinski-1998-v1
    loc: "§2.1–§2.7（物理侧：把 ∂X∂X、bc、TT 等基本 OPE 直接当作理论的定义，并断言 OPE 收敛，见 worldsheet.operator-product-expansion）"
    note: |
      物理侧从未陈述、更未验证顶点代数公理；Polchinski 的做法等价于**假定**本节点成立。
      本节点就是把这个隐含假定显式化。
tags: [cft, vertex-algebra, ope, locality, gap, bottleneck, open]
notes: |
  **本节点无推导，有效状态为 open——这是刻意的。** 它是 OPE 严格化路线的真正瓶颈根（math-sources.md §13.3、Q13）：
  数学侧的定理（形式局域性的等价刻画、顶点代数结合性、复解析局域性 ⇒ OPE 收敛）遍地都是且都干净，
  **缺的是「弦论那个具体理论满足这些定理的假设」这一步**。本轮检索没有找到任何文献证明 D 分量洛伦兹号差
  自由玻色子 ⊗ bc 鬼场（按路径积分定义）构成满足 Gui Def 7.2 / Schottenloher Def 10.7 假设的顶点代数。
  **已核实的只有单个 c = 1 自由玻色子（Kytölä Thm 10.1 / Cor 10.2，且只到 Lie 代数层面；Schottenloher pp.181–182，
  形式层面）**。

  **与无鬼定理缺口的关系**：Gui 与 Kytölä 都不做洛伦兹不定内积（math-sources.md §8.8、sources.bib virasoro-lean-2025
  限制 (2)）。**这与无鬼定理路线（worldsheet.no-ghost-theorem-v4）的不定内积缺口是同一个缺口**：
  两条路线都需要「在 η^{00} = −1 的 Fock 空间上把标准数学构造重做一遍」。本节点因此被设计成可被两条路线共享的依赖。

  **为什么把 (i)(ii) 放在一个节点里而不拆成两个**：本节点无推导，谁也不能给其中一条加边；
  且在 Gui 的常设假定下 (ii) ⇒ (i)（Gui §7.10，复解析版 ⇒ 形式变量版）。
  若日后有人只证出 (i)（例如按 Schottenloher 的形式路线逐对场验证 (z−w)^N[A,B] = 0，这在自由场里是有限计算），
  **请新建一个只含 (i) 的弱节点**（如 worldsheet.string-cft-fields-formally-local），不要给本节点挂推导——
  本节点的文本冻结为 (i) ∧ (ii)。

  **两点技术性提醒**（验证本节点时会碰到）：
  (1) 零模与动量：X^μ 的零模 α^μ_0 ∝ p^μ 使 L_0 的谱连续，V 只能逐动量 k 作 N-分次；Gui 的 CFT-type 假设
      （V(0) = C1、dim V(n) < ∞）在固定 k 的 F_k 上成立，但对 ∮ 完备基 Σ_k 的处理需要额外论证；
      顶点算子 e^{ik·X} 更不在本节点的 E 中。
  (2) bc 是费米型场，(i) 中的对易子须换成反对易子，对应的是顶点**超**代数；Schottenloher Ch.10 与 Gui 讨论的是
      玻色型顶点代数，超代数版本的编号本轮未核实。

  **验证路线的预估**（供 formalizer / 下一轮 researcher 参考，不是断言）：Gui §7.7 指出 Lie 括号版局域性
  最易验证；对自由场，模式对易关系 [α_m, α_n]、{b_m, c_n} 与 Sugawara 型 [L_m, α_n]、[L_m, L_n] 是有限计算
  （后者 Kytölä 已形式化 c = 1 情形），由 Gui §7.8→§7.9（方法出自 [FHL93]）即可升到复解析版。
  真正的新工作是 D 分量 + η + 鬼场的簿记，以及 (1)(2) 两点。

  ---

  ⚠ **【2026-09-11 换代：本节点已被 worldsheet.string-cft-is-a-vertex-algebra-v2 取代，勿再引用】**
  （reviewer-batch3 必修第 2 条，curator）。

  被取代的**唯一原因**是陈述末句「特别地 V 上由 E 生成一个（超）顶点算子代数，其共形向量对应
  T = T^X + T^g，中心荷 c = D − 26」——它是与 (i)(ii) 并列的**第三条独立命题**，违反「一个节点一个命题」，
  且其内容比 (i)(ii) 强得多：

  (1) **重构定理的前提不止局域性**。Gui Theorem 5.12 另外要求真空向量 Ω 与 creation property、平移算子、
      分次 V = ⊕_{n≥0}V(n) 且 V(0) = C·Ω、dim V(n) < ∞。弦论的 V 只能逐动量分解为 F_k，而 **k ≠ 0 的分支上
      没有真空**：|0;k⟩ 的 L_0 本征值是 α'k²（worldsheet.virasoro-generators-free-boson），既非 0 也一般非整数，
      故该分支上根本没有「V(0) = C·Ω 的 N-分次」，末句在 k ≠ 0 处**不良定**，而不只是「未证」。
      （本 notes 上文「两点技术性提醒」(1) 原写「Gui 的 CFT-type 假设在固定 k 的 F_k 上成立」，
      这句话在 k ≠ 0 时不对；v2 已改正。）
  (2) **c = D − 26 是两条已有命题之和**：c^X = D（worldsheet.free-boson-central-charge-d）与
      c^g = −26（worldsheet.bc-ghost-central-charge），各自在图上有推导，不该被一条无推导的 open 卡吞掉。
  (3) **E 中「正规序积」是哪种正规序未表态**：本节点写 T^X = -(1/α'):∂X^μ∂X_μ: 并引
      worldsheet.energy-momentum-tensor-free-scalar（**共形**正规序），却要求 E 落进 Schottenloher/Gui 的框架
      （**产生-湮灭**正规序）。v2 把 E 的正规序钉死为产生-湮灭，并写明与共形正规序相差 c-数
      （L_0 上为 a^X = 0 / a^g = −1）以及局域性对加 c-数不敏感。

  换代时**没有任何推导指向本节点**，唯一把它列进 depends_on 的
  worldsheet.ope-commutator-dictionary--via-locality-theorem 已在同一提交中改挂到 v2
  （并按命名规则更名为 worldsheet.ope-pole-mode-commutator-dictionary--via-locality-theorem）。
  本节点保留只为存档与可追溯。
