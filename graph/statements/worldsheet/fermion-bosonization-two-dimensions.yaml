tags: [cft, bosonization, free-field, fermion, superstring, worldsheet]
notes: |
  ★【本卡填的是本图一处最大的结构性空白】在本卡之前，本图**完全没有玻色化节点**，
  而 Vol.2 第 10、11 章有多处论证的**唯一手段**是玻色化：
    - worldsheet.heterotic-so32-ope-local-and-closed（原书逐字 'easily verified by means of
      bosonization'，此前零支撑，本轮接到本卡）；
    - worldsheet.rns-fermion-number-operator 的**鬼场**部分（F = e^{lφ} 的荷 l，经 βγ 玻色化，
      见 worldsheet.beta-gamma-bosonization）；
    - worldsheet.superstring-sector-consistency-conditions 里 (10.6.4) 的相位
      （依赖自旋场的分支切割与 cocycle）。

  【中心荷的数值核对（本图内部，非原书文字）】玻色侧一个标量 c = 1；
  费米侧两个 Majorana–Weyl 费米子 c = 2 × (1/2) = 1。相符。
  同样地 h(e^{iH}) = 1/2（按 conv.nonembedding-scalar-normalization 的换算 h = q²/2，q = 1），
  等于费米子 ψ 的权 1/2。**这两条是本图做的算术核对，原书在 §10.3 未逐字写出**，
  故只记在 notes，不进 statement。

  【"等价"缺少数学陈述，是本卡最该被后续工作收紧的地方】
  原书的 `≅` 只有 Notation 页的一句 'equivalent to'。数学侧的严格版本是
  「秩 1 偶格顶点算子代数 ≅ 一对自由费米子的 Clifford 顶点超代数」这一类命题
  （boson–fermion correspondence），文献里是定理级的（Frenkel–Lepowsky–Meurman、
  Frenkel–Ben-Zvi 等）。
  → 建议后续任务：在 math 区建「boson–fermion correspondence（格顶点代数版）」节点，
    给本卡加一条 rigorous 的独立推导路线，并写清与 Polchinski 的 `≅` 的接口
    （尤其是：数学定理讲的是**顶点代数同构**，Polchinski 讲的是**关联函数与配分函数相等**，
    两者不是同一条命题）。

  【与 §10.6 的接口】本卡的 ψ ≅ e^{iH} 是 §10.6 (10.6.4) 那个相位公式的技术前提之一
  （R 扇区顶点算子是 e^{±iH/2} 型，带分支切割）。
  见 worldsheet.spin-field-vertex-operators 与 worldsheet.vertex-operator-cocycle。
