id: worldsheet.fermion-bosonization-two-dimensions
kind: proposition
title: "二维玻色化：一对（复化的）Majorana–Weyl 世界面费米子等价于一个全纯标量，ψ ≅ e^{iH}、ψ̄ ≅ e^{−iH}"
statement: |
  【设定与记号】
    - 费米侧：两个全纯 Majorana–Weyl 世界面费米子 ψ¹, ψ²，OPE 按 conv.metric-mostly-plus
      归一为 ψ^μ(z)ψ^ν(0) ∼ η^{μν}/z（(10.1.7)，此处 μ, ν ∈ {1,2} 为类空方向，故 η^{μν} = δ^{μν}）。
      取复组合
        ψ  = 2^{−1/2}(ψ¹ + i ψ²),    ψ̄ = 2^{−1/2}(ψ¹ − i ψ²)        （(10.3.8)）
      （⚠ 这里的上划线是**复组合的标号**，不是 conv.ope-tilde-notation 里的反全纯部门或欧氏伴随。）
    - 玻色侧：一个全纯标量 H(z)，按 conv.nonembedding-scalar-normalization 归一
      （H(z)H(0) ∼ −ln z），其基本算子是 e^{± i H}。
    - `≅` 的语义按 conv.ope-tilde-notation：**equivalent to**（原书 Notation 页的分工），
      即"两个理论的算子在全部相关关联函数中可以互相替换"，而**不是**恒等式。

  【断言 (1)：OPE 逐条同形】e^{±iH} 的三条 OPE（(10.3.6a,b,c)）与复费米子 ψ, ψ̄ 的三条 OPE
  （(10.3.9a,b,c)）**同形**（原书逐字：所引 (10.3.9) 与 (10.3.6) 的对应是逐条的）。

  【断言 (2)：算子字典】由断言 (1) 得到等价
        ψ(z)  ≅  e^{i H(z)},        ψ̄(z)  ≅  e^{− i H(z)}          （(10.3.10)）
  并且这个等价**可以扩展到全部局域算子**（原书逐字："the equivalence of the theories can be
  extended to all local operators"）。特别地
        ψ ψ̄  ≅  i ∂H,        T_B^ψ  ≅  T_B^H                        （(10.3.13)）
  （左式是费米子数流与能动张量的等同）。原书对这一整件事的命名逐字：
  "This rather surprising equivalence is known as *bosonization*."

  【断言 (3)：算符层面与统计】在算符（而非关联函数）层面
        ψ(z)  ≅  ° e^{i H(z)} °                                      （(10.3.14)）
  （`° °` 是创生-湮灭正规序，原书 p. 7 的记号），且玻色化后的算子**确实反对易**（(10.3.15)），
  这一点由 Campbell–Baker–Hausdorff 公式（Vol.1 **(6.7.23)**）与 Vol.1 **(8.2.21)** 得到。

  【断言 (4)：配分函数相等】费米侧与玻色侧的配分函数逐项相等（(10.3.17) = (10.3.18)，
  另见 (10.3.19)）。原书对这条的定位逐字：
  "**We know indirectly that these must be equal**, since we can use the OPE to construct an
   analog in the fermionic theory for any local operator of the bosonic theory and vice versa"；
  "in fact the equality of (10.3.17) and (10.3.18) **follows from the equality of the product and
   sum expressions for theta functions, section 7.2**"。

  【断言 (5)：推广到一般曲面（原书的断言，条件苛刻）】原书逐字：
  "Note that while bosonization was derived for the sphere, **the sewing construction from
   chapter 9 guarantees that it holds on all Riemann surfaces**, provided that we make
   equivalent projections on the spectra."
  本卡把它照记为断言，**不**独立支持它：本图没有 sewing 构造的节点。

  【本命题不断言的内容】
    (1) **不**断言"等价"的精确数学含义。原书用 `≅`（equivalent to），既没有给出两个理论之间
        态空间的同构、也没有给出算子代数的同构陈述。**这是本卡最重要的未定处。**
    (2) **不**断言手征（纯全纯）玻色子 H 的存在性/构造（见 worldsheet.exponential-scalar-sphere-correlator）。
    (3) **不**断言费米侧与玻色侧的**中心荷**相等作为独立事实（它是断言 (2) 的 T_B^ψ ≅ T_B^H 的推论；
        数值核对见 notes）。
    (4) **不**断言 theta 函数的乘积式 = 求和式（Vol.1 §7.2）。本图无该节点。
    (5) **不**断言多种费米子并存时的正确算符定义——那需要 cocycle，见
        worldsheet.vertex-operator-cocycle（原书 §10.3 脚注 2 明说这是一处被延后修补的漏洞）。
