id: worldsheet.modular-fundamental-domain
kind: proposition
title: F₀ = {|Re τ| ≤ ½, |τ| ≥ 1} 是模群在上半平面上的基本域
statement: |
  设
    F₀ = { τ ∈ H : −½ ≤ Re τ ≤ ½ 且 |τ| ≥ 1 } 。
  则每个 τ ∈ H 都可以由某个模变换（worldsheet.modular-group-psl2z）送进 F₀，
  且该代表元在**边界上的认同**之外唯一：
    Re τ = −½ 与 Re τ = +½ 上的点由 T : τ ↦ τ + 1 相互认同；
    |τ| = 1 上 Re τ < 0 与 Re τ > 0 的两半由 S : τ ↦ −1/τ 相互认同。
  因此环面的模空间（diff × Weyl 等价类的空间）可以取成 F₀（作了上述边界认同）。

  ⚠ 边界的认同在本书中未被严格处理，见本节点唯一一条推导的 gaps。
