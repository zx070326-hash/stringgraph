      ⇒ 该记账在本图属 worldsheet.rns-fock-module-free-over-negative-super-virasoro 那张卡。
  - ref: lian-zuckerman-1989
    loc: "**Proposition 5.5**, p.333（p = 0 的例外情形），逐字：'For p = 0, the vanishing theorem does not hold because the Fock space V(p,κ) is not Vir_κ^- -free'；**Theorem 5.1**, p.330（NS 绝对上同调）；**Theorem 5.4**, p.331 附近（R 绝对上同调）；**Proposition 4.3(ii)**, p.329–330（GSO 子复形：dim H^n(P̄₊C_rel) = 8p₀^{(8)}(−p·p/2) 仅 n = 0）；**p.328** 逐字 'However, Corollary 2.15 (i) implies that dim H⁰_rel(p,0) ≠ dim H⁰_rel(p,½).'"
    note: |
      L1，E9/E10 与 researcher 第二轮 §7.5。本条是"不断言 (f)(g)(h)"的来源。
      ★★ **p.328 那句逐字是 LZ 自己对本卡断言的一次使用**：他把 Corollary 2.15(i) 用来说明
      GSO 之前两扇区维数**不等**（这是 §4 开头列的"两个不良特征"之一）。
