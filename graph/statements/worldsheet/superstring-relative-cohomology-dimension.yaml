notes: |
  ★★【本卡为什么新建（curator，2026-09-11）】两条既有记账缺口逐字点名要它：
  (1) worldsheet.superstring-relative-cohomology-vanishing-v2 的"本命题不断言 (b)"：
      「不断言 H⁰_rel 的**维数**（LZ Corollary 2.15(i) 的 "Quantization Condition"）」；
  (2) worldsheet.superstring-gso-covariant-equivalent--via-lian-zuckerman-1989 的 gaps
      逐字：「**Corollary 2.15(i)（维数公式 / 'Quantization Condition'）本图没有卡**：
      depends_on worldsheet.no-ghost-theorem-superstring-cohomological 因此标 inferred
      （那张卡的 statement 是 2.15(ii) 正定性）。**正解是为 2.15(i) 单建卡。**」
  本卡关闭这两条，且那条 inferred 边已同批改指本卡并去掉 inferred。
  与玻色侧 worldsheet.bosonic-relative-cohomology-dimension（FGZ Theorem 2.7(ii)）
  是同一批、同一结构的两张卡。

  【为什么"消灭"与"维数"与"正定"必须分三张卡】
  LZ 自己就把它们分成三处编号结果：**Theorem 2.4**（消灭）、**Corollary 2.15(i)**（维数，本卡）、
  **Corollary 2.15(ii)**（正定）。三者的论证输入不同：
    - 消灭：§3 的有限过滤 + 长正合列 + Poincaré 对偶 + Cor 2.19(iii)，**不用任何厄米形式**；
    - 维数（本卡）：Euler–Poincaré + 消灭 + Proposition 2.14(ii) 的 **char**；
    - 正定：同上，但用 Proposition 2.14(ii) 的 **sign**（号差）那一半。
  ⇒ 本卡与正定卡共用两条输入、各取 Prop 2.14(ii) 的一半，**不是互为推论**。

  【p^{(8)}_κ 与 dim R(p,0) 两处未核实（**都不进断言**）】
  (a) **p^{(8)}_κ 的定义**：本图未逐字取得。合理猜测 p^{(8)}_κ(n) = [q^n] φ_κ(q)^{−8}
      （旁证见 sources 里的 Prop 2.18），与 FGZ 的 p_{(D)}(n) = [q^n] φ(q)^{−D} 同型，
      8 = D − 2 是横向数；**φ_κ(q) 本身的定义（NS/R 两扇区的费米因子）本图也没有**。
      同一条缺口已记在 worldsheet.superstring-gso-covariant-equivalent--via-lian-zuckerman-1989
      的 gaps 第三条（"计数记号 p₀^{(8)}(·) 的定义本图未核实"）。
  (b) **dim R(p,0)**：LZ 只说它是 Spin(D−1,1) 的旋量表示。D = 10 的 Dirac 旋量维数是 32，
      于是 ½(2·0+1)·dim R(p,0) = ½·32 = **16**，与 auditor 2026-09-11 转录的 LZ p.314
      "Case 1（p·p = 0）**sign C_rel(p,0) = 16**" 一致。⚠ **这是本图的算术核对，不是 LZ 的字**：
      LZ 未在抽取记录覆盖的位置写出 dim R(p,0) = 32。故"不断言 (e)"。
      ⚠ 这个 16 与 worldsheet.superstring-cylinder-amplitude-closed-channel-v2 里那个 16
      （开弦迹里的 R 扇区计数）**看起来同源但本图未建立等同**，不得互相搬运。

  【★ Proposition 2.14(i)（Q* = Q）**不是**本卡的依赖（researcher 第三轮 §9.2 的 negative evidence）】
  Corollary 2.15 的三行证明逐字只引 **Theorem 2.4、Euler–Poincaré 原理、Proposition 2.14(ii)**，
  两部分都指向 2.14(**ii**)（句末 "also" 是作者自己的佐证）。**2.14(i) 在该证明里一个字都没出现。**
  ⟨,⟩_rel 下 Q 的自伴性确实是"sign H^n 有定义"的背景条件，但那是 Corollary 2.15(**ii**) 一侧
  更关心的事，且原文没把它列为依赖。⇒ 本卡的推导**不拉这条边**；日后若有人要补，**必须标 inferred**。

  【与玻色侧 worldsheet.bosonic-relative-cohomology-dimension 的对应与差别】
  对应：LZ Corollary 2.15(i) ↔ FGZ Theorem 2.7(ii)。LZ 在 Theorem 2.4 紧随句逐字自述
  'This is the analogue of the vanishing theorem proven by FGZ.'，在 Prop 2.18 的证明里又说
  'we will prove their existence the way FGZ did in the bosonic case'——**两篇的整体路线自觉平行**。
  四处实质差别：
    (a) **公式形状**：FGZ 是 p_{(24)}(1 − p·p/2)（单个系数）；LZ 是
        ½(2κ+1)·dim R(p,κ)·p^{(8)}_κ(κ − p·p/2)（带扇区前因子与旋量维数因子）。
        自变量里的常数项也不同：玻色是 1（截距 a = 1），超弦是 κ（NS 的 ½、R 的 0）。
    (b) **分段**：FGZ 显式写"1 − p·p/2 非非负整数时为 0"；**LZ 的语句里没有这一支**，
        本卡照实不补（"不断言 (i)"）。
    (c) **上游**：FGZ 经 Proposition 2.4（= Thm 1.12 + Euler–Poincaré）；
        LZ 经 Proposition 2.14(ii)（char = sign）+ Theorem 2.4 + Euler–Poincaré。
        ⇒ **两条链的共同项只有 Euler–Poincaré 原理**，而本图对它连一张卡都没有（两侧同款 gap）。
    (d) **厄米形式**：FGZ 的消灭定理（Thm 1.12）假设里含非退化厄米形式；LZ 的消灭定理完全不用，
        厄米形式只在 Proposition 2.14 这一层进入（即本卡与正定卡这一层），**不在消灭那一层**。
  ⇒ 两卡**互不依赖**：两篇文献各自独立证明自己那一侧，本图不主张由一侧推出另一侧。

  【R 扇区零模表示的选择绑定在本卡上】
  与消灭卡（断言写成存在量词）不同，**本卡的维数公式是在 (H5) 的 T₀ ⊕ T₁ 下给出的具体数**，
  换表示后右端是否不变本图未核实（"不断言 (d)"）。这是本卡比消灭卡**更依赖表示选择**的地方：
  Definition 2.11 的 ⟨,⟩_rel（R 扇区要用 D_R 原像）正是因为 ⟨T₁, T₁⟩_T = 0，
  而 Proposition 2.14(ii) 的 char/sign 公式建立在这个形式上。
