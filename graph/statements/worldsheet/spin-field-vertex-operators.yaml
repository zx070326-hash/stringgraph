    note: |
      L1 一手（抽取记录 literature/extractions/polchinski-1998-v2.md E26；抽取者逐页读了
      原书 §10.3 的页图，八条式号与公式内容均直接看到）。
      statement 里的三处英文引号（'uniquely identify … determine'、'One can check'、
      'This is known as spectral flow'、'sometimes called a spin field'）均为该记录
      「文献自称的严格程度」栏与「原文陈述」栏的逐字转录。
  - ref: polchinski-1998-v2
    loc: "§10.3, **脚注 2**, p. 14（cocycle 的必要性，逐字见 statement 断言 (6)）"
