id: worldsheet.spin-field-vertex-operators
kind: proposition
title: "自旋场与 R 扇区顶点算子：一般周期 ν 的费米子基态算子 A_ν ≅ e^{i(1/2 − ν)H}（权 h = (ν−1/2)²/2），R 扇区 (ν = 0) 的两个基态 |s⟩ ≅ e^{isH} (s = ±1/2, h = 1/8)，十维的自旋场 Θ_s ≅ exp[i Σ_{a=0}^{4} s_a H^a]"
statement: |
  【设定】一对复化的全纯 Majorana–Weyl 费米子 ψ, ψ̄（worldsheet.fermion-bosonization-two-dimensions
  的 (10.3.8)）与其玻色等价物 H（conv.nonembedding-scalar-normalization）。
  取**一般**（不必是 0 或 1/2 的）周期性
        ψ(w + 2π)  =  exp(2πi ν) ψ(w)                                （(10.3.20)）
  （w 是柱面坐标，w ≅ w + 2π；ν = 0 是 R 扇区、ν = 1/2 是 NS 扇区，
   见 worldsheet.rns-fermion-periodicity）。

  【断言 (1)：参考态由湮灭条件唯一确定】态 |0⟩_ν 由
        ψ_{n+ν} |0⟩_ν  =  ψ̄_{n+1−ν} |0⟩_ν  =  0,      n = 0, 1, 2, …   （(10.3.23)）
  确定。原书逐字："The conditions (10.3.23) **uniquely identify** the state |0⟩_ν, and so the
  corresponding OPEs (10.3.24) **determine** the bosonic equivalent"。

  【断言 (2)：玻色等价物与权】与 |0⟩_ν 对应的算子 A_ν 满足
        A_ν  ≅  exp[ i (−ν + 1/2) H ]                                （(10.3.25)）
  其共形权为
        h  =  (1/2) (ν − 1/2)²。
  原书对这条的措辞逐字："**One can check** the identification (10.3.25) by verifying that the
  weight is h = (1/2)(ν−1/2)²"。

  【断言 (3)：谱流】
        |0⟩_{ν+1}  =  ψ̄_{−ν} |0⟩_ν                                   （(10.3.26)）
  原书逐字："This is known as *spectral flow*."（把 ν 移动整数单位与作用一个费米子模式等价。）

  【断言 (4)：R 扇区的两个简并基态】ν = 0 时有**两个**简并基态，玻色等价物为
        |s⟩  ≅  e^{i s H},        s = ± 1/2                          （(10.3.27)）
  其权为 h = (1/2)(0 − 1/2)² = **1/8**（断言 (2) 在 ν = 0 的特例）。
  ⚠ 这两个算子带 z^{±1/2} 型**分支切割**：原书 (10.2.7) 下方逐字
  "Notice that in the NS sector the branch cut in z^{−1/2} offsets the original antiperiodicity,
   while in the R sector it introduces a branch cut."

  【断言 (5)：十维的自旋场】十个 ψ^μ 两两复化需要**五个**玻色子
        H^a,     a = 0, 1, 2, 3, 4                                   （(10.3.28a,b)）
  R 扇区态 |s⟩（s = (s_0, …, s_4)，各 s_a = ±1/2）的顶点算子是
        Θ_s  ≅  exp[ i Σ_{a=0}^{4} s_a H^a ]                         （(10.3.29)）
  原书逐字：这个算子 "sometimes called a *spin field*"。

  【断言 (6)：一处被作者明确指出、并延后修补的技术漏洞】原书 §10.3 脚注 2（p. 14）逐字：
  "The precise operator definition has a subtlety when there are several species of fermion.
   The H^a for different a are independent and so the exponentials **commute rather than
   anticommute**. A cocycle is needed, as in eq. (8.2.22). A general expression will be given
   in the next section."
  故 (10.3.29) **按字面写下时统计是错的**；修补是 (10.4.26)–(10.4.28) 的 cocycle 因子，
  见 worldsheet.vertex-operator-cocycle。**本卡把这条漏洞记入陈述本身**，
  即断言 (5) 只在"配上 cocycle 之后"才是正确的算子定义。

  【本命题不断言的内容】
    (1) **不**断言权公式 h = (ν−1/2)²/2 的证明。原书说 'One can check'，
        并把它推给 **exercise 10.8**（三种算法：(2.7.8) 的对易子、§2.9 的助记法、(2.7.11)）。
    (2) **不**断言 R 扇区基态的**时空**旋量表示内容（16、16′ 的分解等）——那是附录 B.1，
        见 worldsheet.rns-ramond-zero-modes-clifford 与 worldsheet.rns-fermion-number-operator。
    (3) **不**断言 Θ_s 的权值（原书在 (10.3.29) 处不写；本图的算术核对见 notes）。
    (4) **不**断言含鬼场的完整 R 扇区顶点算子——那要乘上 e^{−φ/2}，
        见 worldsheet.ramond-ground-state-vertex-operator。
    (5) **不**断言一般实 ν 的扇区在弦论中出现（§10.3 是把 ν 当连续参数以便谈谱流；
        RNS 弦只用 ν ∈ {0, 1/2}，见 worldsheet.rns-periodicity-exhaustion）。
