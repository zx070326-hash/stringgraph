      「**这是一处真实的技术漏洞被延后修补**，转节点时不要漏。」
      本卡按此把它写进 statement 而不是只写在 notes。
  - ref: polchinski-1998-v2
    loc: "§10.2, (10.2.7) 下方一句, p. 6（R 扇区引入分支切割的逐字句）"
    note: |
      L1 一手（E17）。同一句也被 worldsheet.rns-fermion-periodicity 引用。
      这条是 §10.6 (10.6.4)/(10.6.5)「相互局域性」条件的物理起点
