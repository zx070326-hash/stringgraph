  - ref: polchinski-1998-v2
    loc: "§10「Exercises」, **exercise 10.8**, pp. 43–44（逐字：'Verify the weight of the fermionic ground state A_ν for general real ν: (a) from the commutator (2.7.8); (b) from the mnemonic of section 2.9.'）"
    note: |
      L1 一手（E49）。★ 这是「断言 (2) 的权公式在原书正文无证明」的直接证据。
tags: [cft, bosonization, spin-field, ramond-sector, spectral-flow, superstring, vertex-operator]
notes: |
  【数值核对（本图内部算术，非原书文字）】
    - ν = 1/2（NS）：A_{1/2} ≅ exp[0] = 1，h = 0 ✓——即 NS 基态对应单位算子
      （与 worldsheet.rns-mode-expansions 侧的 (10.3.1)/(10.3.2) 一致）。
    - ν = 0（R）：h = 1/8，与 e^{iH/2} 按 conv.nonembedding-scalar-normalization 的
      h = q²/2（q = 1/2）相符 ✓。
    - 十维自旋场 Θ_s 的权：Σ_{a=0}^{4} s_a²/2 = 5 × (1/8) = **5/8**，
      恰等于 R 扇区物质正规序常数 a^m = D/16 = 10/16 = 5/8
      （worldsheet.rns-matter-normal-ordering-constants，(10.2.13)）。
      **原书在 (10.3.29) 处不写这个数**，本图记为算术核对。
    - ν = 1（谱流一整步）：h = (1/2)(1/2)² = 1/8 = ν = 0 的值，与 (10.3.26) 说的
      「移动一整步等于作用一个费米子模式」相容（ψ̄_{−ν} 在 ν = 0 时是 ψ̄_0，权变化为 0）✓。

  ★【断言 (6) 是本卡最该被下游注意的内容】原书自己承认 (10.3.29) 按字面写下时
  「exponentials commute rather than anticommute」，即**统计是错的**。
  修补（cocycle）在下一节给出。故任何用到 Θ_s 的下游节点（GSO、(10.6.4) 的相位、
  R–R 顶点算子）都必须同时依赖 worldsheet.vertex-operator-cocycle。
  本轮已把 worldsheet.superstring-sector-consistency-conditions 里记为「本图无节点」的
  那两块（自旋场、cocycle）建出来。

  【与 worldsheet.rns-ramond-zero-modes-clifford 的分工】那张卡讲 ψ_0^μ 的 Clifford 代数与
  R 扇区基态的简并**在态空间侧**；本卡讲同一件事**在算子侧**（e^{isH} 型自旋场）。
  两者不是重复：一个是模式代数，一个是顶点算子；玻色化是连接它们的字典。

  【一般实 ν 为什么值得写下来】谱流（断言 (3)）只有把 ν 当连续参数才有意义，
  且它是「R 与 NS 扇区由同一族联系」这一结构性事实的来源。
  Polchinski 用它来"定出"玻色等价物（断言 (1)(2)）。
