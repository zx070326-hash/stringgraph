notes: |
  【立卡理由：worldsheet.exponential-vertex-operator-weight 的 notes 里已写好的预案】
  那张卡的【升级路径】(i) 逐字建议：
    「⚠ 完成后不能直接把本卡标 formalized：Lean 证的是**模形式**，本卡 (1) 断言的是 **OPE 形式**；
      两者互推要经 worldsheet.ope-pole-mode-commutator-dictionary（physical-argument），
      那条字典会把 --via-lean 封在 physical-argument。
      **建议（提请 lead/auditor）**：Lean 完成时**拆一张模形式的卡**
      （如 `worldsheet.exponential-vertex-operator-mode-weight-identity`，
      只断言上面那条 L_m 恒等式、不提 OPE），让它承载 formalized，
      本卡则新增一条 `--via-mode-identity` 推导（依赖新卡 + 字典，physical-argument）。」
  lead 2026-09-11 裁决执行该预案。**本卡的 id 与陈述范围与那段预案逐字一致。**
  这也正是 docs/STATUS_LEVELS.md「正确做法是拆卡，让 Lean 对应的那一半成为 formalized」的实例。

  查重：2026-09-11 跑 `uv run stringgraph search mode-weight / 共形权恒等式 / 顶点算子`。
  唯一相关的既有节点是 worldsheet.exponential-vertex-operator-weight（OPE 形式，physical-argument），
  本卡是它的模形式姊妹卡，两者**不重复**：一个说 OPE 极点，一个说算子恒等式。

  【为什么 m = 0 是真正的例外，不是疏漏】
  `formal/StringFormal/NoGhost/VertexWeightNeg.lean` 文件头「尚缺」第 1 条逐字：
    「`m = 0`。这不是本文件的疏漏而是**真的不同**：`m = 0` 时 Sugawara 求和的 `j = 0` 与
      `j = m` 并成一项 `½ :α_0·α_0:`，中间段为空，代入 `m ≠ 0` 的系数会得到错误答案
      （见 `NoGhost/VertexWeight.lean` 头部关于 `Fock.Lop_zero_apply_creaExp` 的说明）。
      真空上的正确形式已有，一般态上的算子形式尚缺。」
  实际的 m = 0 关系在动量塔上是 ⁅L_0, V^{(n)}_K⁆ = K V^{(n)}_{K−n}，本图目前**没有节点**承载它。
  ⚠ 这条缺口是 worldsheet.ddf-commute-with-virasoro 的 m = 0 情形不能标 formalized 的
  **唯一**直接原因（formal/TODO.md (5) 逐字：「`hm : m ≠ 0` 在 `lie_towerLop_ddfOp_of_ne` 里
  只用了一次」），也是 worldsheet.ddf-commute-with-nonzero-virasoro 只写 m ≠ 0 的原因。
  **修正一处易错读法（lead 2026-09-11）**：DDF 侧缺的结论是 **⁅L_0, A^ε_n⁆ = 0**，
  **不是** −n A^ε_n。A^ε_n 是权 1 流的**零模**，⁅L_m, j_0⁆ = ((h−1)m − 0) j_m 在 h = 1 时为零；
  L_0 本征值的移位来自 `towerVertex` 的**动量移位**（p ↦ p + n k_0，
  质量壳 α'(p+nk_0)² = α'p² + n），不是来自这个括号。

  【与塔上版本的关系（下游 DDF 链实际用的是塔上版本）】
  Lean 把本卡的单 Fock 恒等式搬到动量塔上得到（`m ≠ 0`，均需 b·b = 0）
    `lie_towerLop_towerVertex_of_ne`：⁅L_m, V^{(n)}_K⁆ = (K − m − n + n(b·a)) V^{(n)}_{K−m}，
    `lie_towerLop_towerVertex_of_ne_normalized`：再加 b·a = 1 得 (K − m) V^{(n)}_{K−m}，
  两者在 `formal/StringFormal/NoGhost/DDFOperatorNeg.lean`；
  `m ≥ 1` 的先行版本 `lie_towerLop_towerVertex_of_pos(_normalized)` 在
  `formal/StringFormal/NoGhost/VertexWeight.lean`。
  塔上写成真正的对易子 ⁅L_m, ·⁆ 是因为 `towerLop` 逐层用该层动量，吸收了本卡"两侧参数不同"这件事。
  **搬运是机械的**（formal/TODO.md (5) 逐字：「证明与 (3e) 的 `_of_pos` 逐字相同，
  只把 `Fock.lie_Lop_vertexOsc_of_pos` 换成 `..._of_ne`」），
  故塔上版本的量词范围与本卡相同：**一切 m ≠ 0**。
  下游 worldsheet.ddf-commute-with-nonzero-virasoro 即建在塔上版本之上。

  【b·a 项不是权：一处容易算错的地方，转录自 OPE 卡】
  b·a = 2α' k·p 是零模贡献的分次移位。在 DDF 归一化下（k = n k_0，2α' k_0·p = 1）
  b·a = n，正是 worldsheet.ddf-commute-with-virasoro 推论里「A^i_n 把能级移动 −n」的那个 n。
  把 b·a 误读成共形权的一部分会得到错的 h。单个 Fock 空间上这一项无处安放，
  这正是 worldsheet.ddf-operators-v6 需要动量塔的原因。

  【与 worldsheet.exponential-vertex-operator-weight 的分工，供 reviewer 核对】
  · 本卡：模恒等式，代数，formalized，m ≠ 0，不谈"权"这个词的定义。
  · 那张卡：OPE 形式，含 h = α'k²/4（闭弦）/ α'k²（开弦）的数值与主场判据，physical-argument。
  · 桥：worldsheet.exponential-vertex-operator-weight--via-mode-identity（新增，physical-argument，
    经 worldsheet.ope-pole-mode-commutator-dictionary，该字典自身 effective = open）。
