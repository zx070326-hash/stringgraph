id: worldsheet.light-cone-quantization
kind: definition
status: rigorous
title: 玻色弦的光锥量子化（开弦）
statement: |
  取光锥坐标 x^± = (x^0 ± x^1)/√2 与横向坐标 x^i (i = 2..D-1，共 D-2 个)，
  内积写作 a·b = -(a^+ b^- + a^- b^+) + a^i b^i。
  开弦模式展开取 X^μ(τ,σ) = x^μ + 2α' p^μ τ + i(2α')^{1/2} Σ_{n≠0} (α^μ_n/n) e^{-inτ} cos(nσ)，
  约定 α^μ_0 = (2α')^{1/2} p^μ。

  光锥规范固定残余（共形）规范自由度，取
    X^+(τ,σ) = x^+ + 2α' p^+ τ，  等价于 α^+_n = 0 (n ≠ 0)，且要求 p^+ ≠ 0。
  于是 Virasoro 约束 L_n = -α^+_0 α^-_n + L^⊥_n = 0 把 X^- 的振子完全解出：
    α^-_n = L^⊥_n / ((2α')^{1/2} p^+)          (n ≠ 0)，
    α^-_0 = (L^⊥_0 - a) / ((2α')^{1/2} p^+)，
  其中横向 Virasoro 生成元 L^⊥_n = (1/2) Σ_{m∈Z} : α^i_{n-m} α^i_m : （对 i = 2..D-1 求和），
  a 是 L^⊥_0 的正规序常数，在本定义中作为待定实参数保留。

  独立自由度是零模 (x^i, p^i, x^-, p^+) 与横向振子 α^i_n (i = 2..D-1, n ∈ Z\{0})，
  正则关系 [α^i_m, α^j_n] = m δ^{ij} δ_{m+n,0}，(α^i_n)^† = α^i_{-n}。
  光锥 Fock 空间
    H_lc = span{ α^{i_1}_{-n_1} ... α^{i_k}_{-n_k} |0; k^+, k^i⟩ }，  α^i_n |0; k⟩ = 0 (n > 0)，
  其内积正定：横向振子代数是 D-2 份谐振子代数，不含不定度规方向，故无鬼态需要排除。
  能级算符 N = Σ_{n≥1} α^i_{-n} α^i_n，把 α^-_0 = (2α')^{1/2} p^- 代回质量壳给出
    α' m^2 = N - a   （开弦）。

  洛伦兹生成元在 H_lc 上表示为
    J^{μν} = x^μ p^ν - x^ν p^μ - i Σ_{n≥1} (1/n) (α^μ_{-n} α^ν_n - α^ν_{-n} α^μ_n)，
  凡出现 α^-_n 处均代入上面的横向表达式；于是 J^{i-} 是横向模式的三次式，
  其算符排序取正规序。
uses:
  - worldsheet.virasoro-algebra-v2
  - worldsheet.light-cone-coordinates
  - worldsheet.light-cone-gauge
  - worldsheet.open-string-mode-expansion
  - worldsheet.light-cone-canonical-commutators
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard, conv.worldsheet-coordinate-length]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3（光锥规范）：规范条件 **(1.3.8a,b,c)**；开弦模式展开 **(1.3.22)**；正则对易 (1.3.24a,b)/(1.3.25a,b)；零点能 **(1.3.31)** A = ((D−2)/2)Σ_{n≥1}n 与 **(1.3.32)** Σn → −1/12，截断因子 (1.3.33)，截断后 (1.3.34)，**(1.3.35)** A = (2−D)/24；质量壳 **(1.3.36)** m² = (1/α')(N + (2−D)/24)；能级 (1.3.37)；A = −1, D = 26 是 **(1.3.40)**，p.23"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——式号全部落实，含一处订正；
      **另有两条作者自承缺口**】

      ⚠ **订正**：旧记录（E16）把 A 的定义式猜在「(1.3.33)–(1.3.35)」区间。
      **A 的定义式是 (1.3.31)**；(1.3.35) 是其正规化后的取值，原书写作 **A = (2−D)/24**
      （不写 −(D−2)/24）。旧 loc「约 (1.3.32)–(1.3.36)」现予细化为上面各式。

      ★ **作者自承缺口之一（p.21，逐字）——直接封顶「光锥路线」的严格程度**：
        "In a careful treatment of light-cone quantization, this constant is determined as follows.
         The choice of light-cone gauge has obscured the Lorentz invariance of the theory. It is
         necessary to check this by finding the operators M^{μν} that generate Lorentz
         transformations, and verifying that they have the correct algebra … One finds that this is
         the case only for the specific value A = −1, and only if D = 26.
         **We do not wish to spend this much time on light-cone quantization, so we will try to show
         that the result is plausible without a complete treatment. We assure the reader that we will
         obtain the values of A and D honestly in the conformal gauge approach**, which will also give
         us insight into why Lorentz invariance would be lost in the light-cone approach for the wrong
         A or D."
      → **[M^{i−}, M^{j−}] = 0 的显式验算原书根本没做，也没有留成习题**；(1.3.40) 走的是
        **表示论计数**（massive vector 需 D−1 个自旋态、massless 只需 D−2；第一激发能级只有
        D−2 个态 α^i_{−1}|0;k⟩，故必须无质量）。§3.4 开头 p.90 另有一句自评「as we briefly and
        rather **heuristically** explained in section 1.3」。
      → **不要**把「光锥洛伦兹代数闭合」当成本书的一个可引结论——本书没有它。

      ★ **作者自承缺口之二（p.24，逐字）**：
        "The higher excited states of the string, which are massive, do form full representations of
         SO(D−1). One can check this by hand for a few levels, and in a more complete analysis it
         follows from the existence of the full set of Lorentz generators. **We will show this
         indirectly in the coming chapters, by finding a consistent covariant quantization.**"
      → 即**光锥量子化的洛伦兹不变性在本书中从未被直接验证**，只被协变量子化间接背书。

      ★ **丢弃发散项的理由比旧记录强（p.22，逐字）**：
        "The cutoff-dependent first term is proportional to the length ℓ of the string and can be
         canceled by a counterterm in the action proportional to ∫d²σ(−γ)^{1/2}. **In fact, Weyl
         invariance *requires* that it be canceled**, leaving only the cutoff-independent second
         term… **This finite remainder is an example of a Casimir energy.**"
      见 literature/extractions/polchinski-1998-v1.md §12.5（E10–E19、E18/Q2）与 §12.10
      表 A 的 Q2、表 B 第 8 项、表 C 第 2、3 项。
  - ref: gsw-1987-v1
    loc: "§2.3.1（光锥规范、横向振子 Fock 空间、洛伦兹生成元 J^{μν}）"
    note: GSW 用 mostly-minus 号差与 α' = 1/2 的开弦归一化；此处已转写为 conv.metric-mostly-plus 与 conv.alpha-prime-regge。
tags: [bosonic-string, quantization, light-cone]
notes: |
  本节点只写开弦（题面允许开/闭二选一）。闭弦对应式为
  规范条件 X^+ = x^+ + α' p^+ τ，α^μ_0 = ᾱ^μ_0 = (α'/2)^{1/2} p^μ，
  质量壳 α' m^2 / 4 = N - a = Ñ - a（左右能级匹配）；需要时另建节点，不在此混写。

  本节点刻意不固定 a 的值：a = (D-2)/24 来自 ζ 正规化，属于论证而非定义，
  因此放在 worldsheet.critical-dimension-light-cone--via-lorentz-algebra 的 gaps 里。
  a = 1 本身是一条独立命题，见 worldsheet.open-string-intercept。
  这样本定义本身是纯代数的（Fock 空间 + 二次型），可标 rigorous。

  质量壳系数说明：按 conv.alpha-prime-regge（开弦 α' m^2 = N - a，a 为截距）写作 α' m^2 = N - a。
  文献中出现的 m^2 = (2/α')(N - a) 属于另一套 α' 归一化（或闭弦式的误记），本项目不采用。

  2026-09-10（curator-polchinski-ch1）：把本定义的上游定义补上。原先 uses 只有
  worldsheet.virasoro-algebra，本定义中出现的光锥坐标、光锥规范、开弦模式展开与
  正则对易关系都是凭空写出的；现已分别建节点并接上：
    worldsheet.light-cone-coordinates（x^± 与内积）、
    worldsheet.light-cone-gauge（规范条件）、
    worldsheet.open-string-mode-expansion（模式展开，Polchinski (1.3.22)）、
    worldsheet.light-cone-canonical-commutators（等时对易关系，Polchinski (1.3.24b)）。
  四者都是 definition 且 status rigorous，故本节点的有效状态不变（仍 rigorous）。
  振子对易关系 [α^i_m, α^j_n] = m δ^{ij} δ_{m+n,0} 与质量壳 α'm^2 = N - a 在本定义中
  是直接写出的；它们作为命题的来源链分别见
  worldsheet.transverse-oscillator-commutators 与 worldsheet.open-string-mass-shell，
  不加进 uses（那会把纯代数的定义层拉低到 physical-argument）。

  ℓ 的取法：本节点写 cos(nσ)、e^{-inτ}，即 ℓ = π、c = 1；Polchinski 保留一般的 ℓ。
  已声明 conv.worldsheet-coordinate-length 说明两者的换算。
author: curator-critdim
created: "2026-09-10"
