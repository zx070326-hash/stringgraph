sources:
  - ref: polchinski-1998-v2
    loc: "§10.8「The Möbius strip」, eqs. **(10.8.12)**、**(10.8.13)**, pp. 41–42；逐字：'In the open string Ω acts as  Ω ψ^μ(w) Ω^{−1} = ψ̃^μ(π − w̄) = ψ^μ(w − π),  **using the doubling trick (10.2.15)**. In terms of the modes this is  Ω ψ_r^μ Ω^{−1} = exp(−πir) ψ_r^μ.  **The phase is imaginary in the NS sector and squares to −1.**'"
    note: |
      **L1 原书页图**，抽取记录 literature/extractions/polchinski-1998-v2-sec10-8.md **#E70**
      （该条已单页重渲染复核）。
      ⚠ 本卡**只取 #E70 的前两式**；同条里的 (10.8.14)(10.8.15) 归命题卡
      worldsheet.open-superstring-omega-squared-is-fermion-parity。
      ⚠ 抽取记录告警：`polchinski-1998-v2.md` **E48 记了 (10.8.13)/(10.8.14)/(10.8.15) 三式，
      但漏了 (10.8.12) 与「doubling trick (10.2.15)」这条明写依赖**；本卡把两者都补上。
  - ref: polchinski-1998-v2
    loc: "§10.2, eq. **(10.2.15)**（doubling trick；被 (10.8.12) 明写引用）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md **#E20**）。
      ⚠⚠ **本图无对应节点**：worldsheet.open-string-doubling-trick 是**玻色弦**语境的，
      (10.2.15) 是它在**世界面费米子**上的版本。故本卡只在此定位来源，**不**建依赖边
      （见「本定义不断言 (b)」）。⇒ 待建：worldsheet.open-superstring-doubling-trick。
  - ref: polchinski-1998-v1
    loc: "§1.4, eq. (1.4.19) 附近（玻色弦的世界面宇称：开弦 σ ↦ ℓ − σ、Ω α_n^i Ω^{−1} = (−1)^n α_n^i、Ω² = 1、无取向投影 (1+Ω)/2）"
    note: |
      本图对应节点 **worldsheet.worldsheet-parity**（本卡唯一的 uses）。
      ★ 本卡只借它的**玻色部门**作用与 Ω 的几何定义；**不借它的 Ω² = 1**
      （开超弦上 Ω² 不是恒等，见「不断言 (a)」与命题卡）。
tags: [superstring, type-i, worldsheet-parity, orientifold-projection, definition]
notes: |
  ★★【v2 的换代理由（curator，2026-09-11，batch27-fix）】
  v1 = worldsheet.superstring-worldsheet-parity-action 把四件事放在一张 `kind: definition,
  status: rigorous` 的卡上：(10.8.12)(10.8.13)（**定义**）与 (10.8.14)(10.8.15)（**命题**）。
  reviewer-batch27 F2 证实后两者不但是命题，而且 (10.8.14) 作为无条件算符等式
  **在 R 扇区与 (10.8.13) 矛盾**（Ω² 与 ψ_{r∈Z} 对易、exp(πiF) 与之反对易）。
  ⇒ 按「一个节点一个命题」拆卡：本卡（definition，仍可 rigorous）+
  worldsheet.open-superstring-omega-squared-is-fermion-parity（proposition，physical-argument）。

  ★【为什么 v2 仍取 status: rigorous】(10.8.13) 是在自由世界面费米子的模代数上给出的**精确算符
  定义**：给定 r 的取值范围，Ω 由相位 exp(−πir) 与它在真空上的取值唯一确定。本卡**不再**包含
  任何需要论证的命题，故 STATUS_LEVELS 对 definition 的 `rigorous` 判据（数学上精确但未形式化）
  在此无保留地成立。
  ⚠ **一处照实登记的保留（不降级，但必须写明）**：(10.8.12) 所用的超弦版 doubling trick
  (10.2.15) 在本图无节点（见「不断言 (b)」），即「几何上的 σ ↦ π − σ」到 (10.8.12) 这一步
  是从原书导入的。
  ⚠ **与 v1 的 effective 差别（有意）**：v1 的 uses 里有
  worldsheet.type-i-open-string-gauge-multiplet（physical-argument），它是为 (10.8.15) 里
  「exp(πiF) = 1 by the GSO projection」加的，把 v1 的 effective 压到 physical-argument。
  该 uses **随 (10.8.15) 一起移到命题卡**，故本卡 effective = rigorous。

  【下游】本卡的下游是 worldsheet.open-superstring-omega-squared-is-fermion-parity
  （它 uses 本卡），Möbius 带那一支再经该命题卡接入
  worldsheet.superstring-mobius-strip-amplitude-closed-channel-v2--via-open-string-trace-with-omega。
  ⚠ **Klein 瓶那一支用不到本卡**（闭弦拓扑，需要
  worldsheet.closed-superstring-worldsheet-parity-action）。
