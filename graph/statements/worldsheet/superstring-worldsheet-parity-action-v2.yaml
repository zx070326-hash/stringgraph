id: worldsheet.superstring-worldsheet-parity-action-v2
kind: definition
status: rigorous
title: 世界面宇称 Ω 在**开超弦世界面费米子**上的作用：Ωψ^μ(w)Ω^{−1} = ψ^μ(w − π)、Ωψ_r^μΩ^{−1} = exp(−πir)ψ_r^μ（v2：只保留 (10.8.12)(10.8.13) 这条定义；Ω² = exp(πiF) 与四项投影算符 (10.8.14)(10.8.15) 已拆为命题卡 worldsheet.open-superstring-omega-squared-is-fermion-parity）
statement: |
  **设定（是陈述的一部分）**：**开**超弦（RNS 形式），世界面为条带 0 ≤ Re w ≤ π
  （conv.worldsheet-euclidean、conv.worldsheet-complex-coords），ψ^μ 与 ψ̃^μ 是世界面费米子。
  世界面宇称 Ω 在玻色部门上的作用按 worldsheet.worldsheet-parity（开弦 σ ↦ ℓ − σ，
  Ω α_n^i Ω^{−1} = (−1)^n α_n^i）。**本卡只给出它在费米部门上的作用，仅此而已。**

  **定义**：
    **(1) 场的层面**（原书逐字：'In the open string Ω acts as'，'**using the doubling trick
        (10.2.15)**'）：
          Ω ψ^μ(w) Ω^{−1} = ψ̃^μ(π − w̄) = ψ^μ(w − π)                              (10.8.12)
    **(2) 模的层面**（原书逐字：'In terms of the modes this is'）：
          Ω ψ_r^μ Ω^{−1} = exp(−πir) ψ_r^μ                                        (10.8.13)
        两个扇区都在本定义的范围内，但**相位的性质不同，下游不得混用**：
          · **NS 扇区** r ∈ Z + ½ ⇒ exp(−πir) 是**纯虚**数（原书逐字 'The phase is imaginary
            in the NS sector'）；
          · **R 扇区** r ∈ Z ⇒ exp(−πir) = (−1)^r 是**实**数。

  **本定义不断言**：
    (a) ⚠⚠ **不断言 Ω² = exp(πiF) (10.8.14)，也不断言四项联合投影算符 (1+Ω+Ω²+Ω³)/4 (10.8.15)**。
        这两式**不是定义，是由 (2) 出发的命题**，且**在 R 扇区与 (2) 不相容**：由 (2) 得
        Ω²ψ_r^μΩ^{−2} = exp(−2πir)ψ_r^μ，在 NS 扇区（r ∈ Z + ½）给 **−ψ_r^μ**（与 exp(πiF) 一致），
        在 **R 扇区（r ∈ Z）给 +ψ_r^μ**——即 Ω² 与 ψ_r^μ **对易**，而 exp(πiF) 按定义与全部 ψ^μ
        **反对易**。⇒ (10.8.14) 作为**无条件**算符恒等式不从本卡推出。
        这两式连同其适用范围的限定归
        **worldsheet.open-superstring-omega-squared-is-fermion-parity**（proposition），
        本卡**不**承载它们。
        ★ 这正是 v2 相对 v1（worldsheet.superstring-worldsheet-parity-action）的**唯一实质改动**：
        v1 把 (10.8.14)(10.8.15) 当作断言 (3)(4) 写进一张 `status: rigorous` 的定义卡
        （reviewer-batch27 F2）。
    (b) **不断言超弦版 doubling trick (10.2.15) 本身**。(10.8.12) 是**用它**得到的（原书明写），
        而本图的 worldsheet.open-string-doubling-trick 是**玻色弦**语境的（Neumann 条件使
        T̄ 成为 T 的镜像解析延拓）；**(10.2.15) 在世界面费米子上的对应版本本图无节点**。
        故本卡**不**把它列入 uses，只在 sources 里定位（口径与
        worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences 的处理一致：
        「加了会是一条名实不符的边」）。
    (c) ⚠⚠ **不断言 Ω 在闭超弦上的作用**。闭弦那一支在本图另有卡：世界面费米子层面见
        worldsheet.closed-superstring-worldsheet-parity-action（(10.8.8a,b)、(10.8.9)），
        态/顶点算子层面见 worldsheet.type-i-unoriented-closed-spectrum
        （§10.6 (10.6.16)–(10.6.18)，含 Ṽ_{s'}V_s = −V_sṼ_{s'}）。**本卡只覆盖开弦。**
    (d) **不断言 Chan–Paton 指标上的转置与 SO(n)/Sp(k) 的二选一**。那是
        spectrum.chan-paton-gauge-group（Vol.1 §6.5，M(λ^a)^T M^{−1} 与 M 的对称/反对称）。
    (e) **不断言任何振幅**。Möbius 带振幅是
        worldsheet.superstring-mobius-strip-amplitude-closed-channel-v2；
        Klein 瓶是 worldsheet.superstring-klein-bottle-amplitude-closed-channel。
    (f) **不断言 orientifold / O 面的现代表述**（属 branes area）。
    (g) **不断言原书单独讨论过 R 扇区**。(10.8.13) 取 r = 0 给 Ωψ_0^μΩ^{−1} = ψ_0^μ，
        这是把原书的式子按其字面取值；**原书在 §10.8 只对 NS 扇区给出说明**
        （逐字只有 'The phase is imaginary in the NS sector and squares to −1'）。
        Ω 在 R 扇区零模构成的 Clifford 模（自旋场）上的具体作用**原书不写**，本卡也不断言。
