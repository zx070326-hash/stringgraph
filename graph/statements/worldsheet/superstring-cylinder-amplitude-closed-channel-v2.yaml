  - ref: polchinski-1998-v2
    loc: "§10.7, eq. **(10.7.9)**（费米迹 Z_ψ^±(τ) = ½[Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴ ∓ Z¹₁⁴]，8 个横向费米子 = 4 对 ⇒ 幂次 4）；(10.7.7)–(10.7.8)（Z^α_β 的定义，'these traces are for a pair of dimensions'）"
    note: |
      本图对应节点是 **worldsheet.modular-invariance-requires-eight-transverse-fermions**
      （其 statement 就含 (10.7.7)–(10.7.9) 的记号与组合）。Vol.2 §10.8 **明写**用 (10.7.9)
