id: worldsheet.energy-momentum-tensor-free-scalar
kind: definition
status: rigorous
title: "自由标量的能动张量 T(z) = -(1/α') : ∂X^μ ∂X_μ :"
statement: |
  世界面平移对称性的 Noether 流即能动张量 T_{ab}。对 worldsheet.free-scalar-cft-action
  的自由标量理论，在复坐标（conv.worldsheet-complex-coords）下其分量为
    T(z) ≡ T_{zz}(z) = -(1/α') : ∂X^μ(z,z̄) ∂X_μ(z,z̄) :,
    T̄(z̄) ≡ T_{z̄z̄}(z̄) = -(1/α') : ∂̄X^μ ∂̄X_μ :,
  正规序按 worldsheet.conformal-normal-ordering（减去自缩并）。
  按 worldsheet.ward-identity，T 与算子的 OPE 决定该算子在世界面坐标变换下的变换律。
uses:
  - worldsheet.free-scalar-cft-action
  - worldsheet.conformal-normal-ordering-v2
  - worldsheet.ward-identity
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§2.3, eq. (2.3.15)（能动张量），p.43"
    note: |
      公式号与「这是能动张量」这一身份经 schrans-2020 目录核实
      （`2.15 p 43: Eq. (2.3.15) The Energy-Momentum Tensor`）；
      **具体表达式的系数 -(1/α') 未核实**，见 literature/extractions/polchinski-1998-v1.md E30。
tags: [cft, free-field, energy-momentum-tensor, definition]
notes: |
  系数 -(1/α') 与 conv.alpha-prime-regge、conv.worldsheet-complex-coords 及
  worldsheet.free-scalar-propagator 的归一化捆绑在一起；它被定死的判据是使
  T 与 X 的 OPE 给出 X 的正确变换律、且 TT OPE 的四阶极点给出 c = D
  （worldsheet.free-boson-central-charge-d）。改动任一约定都必须同时改这个系数。

  status: rigorous 是就「这是一条显式公式」而言；其有效状态由 uses 中的
  worldsheet.conformal-normal-ordering-v2 → worldsheet.free-scalar-propagator 拉到 physical-argument。

  【正规序卡换代（curator 2026-09-11）】uses 已从 worldsheet.conformal-normal-ordering（v1）
  换到 worldsheet.conformal-normal-ordering-v2。**statement 文本里第 6 行仍写着 v1 的 id**，
  按不可违背原则 1（已提交节点的 statement 文本不可改）保持原样。
  这不造成歧义：v2 在 X 部门逐字退化为 v1（v2 放宽的是设定范围并补了费米换序符号），
  本卡的 T(z) 只涉及玻色型的 X^μ。

  注意 X^μ 本身**不是**主场（Polchinski (2.4.7)），只有 ∂X^μ 才是权 (1,0) 的主场；
  见 worldsheet.primary-field 的 notes。
author: curator-polchinski-ch2-3
created: "2026-09-10"
