id: worldsheet.energy-momentum-tensor-free-scalar
kind: definition
status: rigorous
title: "自由标量的能动张量 T(z) = -(1/α') : ∂X^μ ∂X_μ :"
statement: |
  世界面平移对称性的 Noether 流即能动张量 T_{ab}。对 worldsheet.free-scalar-cft-action
  的自由标量理论，在复坐标（conv.worldsheet-complex-coords）下其分量为
    T(z) ≡ T_{zz}(z) = -(1/α') : ∂X^μ(z,z̄) ∂X_μ(z,z̄) :,
    T̄(z̄) ≡ T_{z̄z̄}(z̄) = -(1/α') : ∂̄X^μ ∂̄X_μ :,
  正规序按 worldsheet.conformal-normal-ordering（减去自缩并）。
  按 worldsheet.ward-identity，T 与算子的 OPE 决定该算子在世界面坐标变换下的变换律。
uses:
  - worldsheet.free-scalar-cft-action
  - worldsheet.conformal-normal-ordering-v2
  - worldsheet.ward-identity
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§2.4, eq. (2.4.4), p.44（逐字：T(z) = −(1/α'):∂X^μ∂X_μ:，T̃(z̄) = −(1/α'):∂̄X^μ∂̄X_μ:）；记号 T(z) ≡ T_{zz}、T̃(z̄) ≡ T_{z̄z̄} 是 (2.4.3)；实坐标的 T_ab 是 (2.3.15b)，Noether 流 j_a = i v^b T_{ab} 是 (2.3.15a)"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——本条订正 loc 并撤销
      「系数 −(1/α') 未核实」】

      ⚠ **订正**：旧 loc 把本卡的表达式挂在 §2.3 (2.3.15)，位置错了一节。
      原书 **(2.3.15)** 是实坐标的 Noether 流与能动张量：
        (2.3.15a) j_a = i v^b T_{ab}
        (2.3.15b) T_ab = −(1/α'):(∂_aX^μ∂_bX_μ − ½δ_ab ∂_cX^μ∂^cX_μ):
      本卡陈述的复坐标形式 T(z) = −(1/α'):∂X^μ∂X_μ: 在原书是 **(2.4.4)**。
      **系数 −(1/α') 现为 L1 逐字核实**（(2.3.15b) 与 (2.4.4) 两处一致）。

      配套落实（同为 L1，供下游节点引用）：
        (2.4.1) T_{zz̄} = 0（无迹的复坐标形式）；(2.4.2) ∂̄T_{zz} = ∂T_{z̄z̄} = 0；
        (2.4.3) T(z) ≡ T_{zz}(z)、T̃(z̄) ≡ T_{z̄z̄}(z̄)；(2.4.5) j(z) = iv(z)T(z)。
      见 literature/extractions/polchinski-1998-v1.md §12.1（E30/E31/E32）与 §12.10 表 B 第 24 项。
tags: [cft, free-field, energy-momentum-tensor, definition]
notes: |
  系数 -(1/α') 与 conv.alpha-prime-regge、conv.worldsheet-complex-coords 及
  worldsheet.free-scalar-propagator 的归一化捆绑在一起；它被定死的判据是使
  T 与 X 的 OPE 给出 X 的正确变换律、且 TT OPE 的四阶极点给出 c = D
  （worldsheet.free-boson-central-charge-d）。改动任一约定都必须同时改这个系数。

  status: rigorous 是就「这是一条显式公式」而言；其有效状态由 uses 中的
  worldsheet.conformal-normal-ordering-v2 → worldsheet.free-scalar-propagator 拉到 physical-argument。

  【正规序卡换代（curator 2026-09-11）】uses 已从 worldsheet.conformal-normal-ordering（v1）
  换到 worldsheet.conformal-normal-ordering-v2。**statement 文本里第 6 行仍写着 v1 的 id**，
  按不可违背原则 1（已提交节点的 statement 文本不可改）保持原样。
  这不造成歧义：v2 在 X 部门逐字退化为 v1（v2 放宽的是设定范围并补了费米换序符号），
  本卡的 T(z) 只涉及玻色型的 X^μ。

  ⚠ **【2026-09-11 更正，curator-v1-sec13】本段此前写的「X^μ 本身**不是**主场（Polchinski (2.4.7)）」
  是错的。** 原书 (2.4.17) 权表正下方 p.47 第一行逐字「**All transform as tensors except `∂²X^μ`.**」
  ⇒ 在本卡这个自由标量 CFT（T = (2.4.4)）里，**X^μ 是权 (0,0) 的主场**，∂X^μ 是权 (1,0) 的主场，
  唯一的非 tensor 是 **∂²X^μ**。(2.4.7) 恰是主场变换律 (2.4.15) 在 h = h̃ = 0 的无穷小形式。
  「X^μ 不是 tensor」只在**线性 dilaton CFT**（另一个 T，(2.5.1a,b)）成立，见 §2.5 (2.5.3), p.49。
  详见 worldsheet.primary-field-v2（旧卡 worldsheet.primary-field 已因同一错误换代）。

  ★ **【必须与本卡一起搬运的约定陷阱（2026-09-11，L1）】** Polchinski 的世界面能动张量按
  **(1.2.22)（p.13）** 定义为 `T^{ab} = −4π(−γ)^{−1/2}(δ/δγ_ab)S_P`，其正下方逐字：
  「This has an extra factor of `−2π` relative to the usual definition in field theory;
  this is a standard and convenient convention in string theory.」
  ⇒ **本卡的 T(z) = −(1/α'):∂X∂X:（原书 (2.4.4), p.44）与场论通行的能动张量差一个 −2π 因子。**
  这是同一套归一化的两个面貌，但**只有 p.13 这一句把差别讲明**。任何把本卡公式搬到
  场论式表述（Noether 定理、Einstein 方程源项、Ward 恒等式的场论写法）的节点都必须声明它。
  本图目前**没有** conv.worldsheet-stress-tensor-normalization 这个约定卡；抽取记录 §13.9 B#8
  建议新建，已列入报告交 lead 裁决（新建约定 family 需要指定 canonical，超出本轮范围）。
  见 literature/extractions/polchinski-1998-v1.md §13.3(c) 与 §13.4(a)(c)。
