id: worldsheet.y3-singular-vector-d26-iff
kind: proposition
title: "y3 给出奇异向量当且仅当 D=26（必要性，h=−4 时）"
statement: |
  设 R 是 NoZeroDivisors 且 CharZero 的 ℚ-代数、η : Fin D → R 满足 hη : ∀ μ, η μ * η μ = 1。
  设 φ : TowerFock D R 是共形权 h = −4 的种子态（满足 L_0 φ = h • φ、L_n φ = 0 对所有 n > 0），
  且满足 towerLop η a b (−1) φ ≠ 0。

  定义 level-3 算子
    y3 := 12 L_{−3} + 6 L_{−2}L_{−1} + L_{−1}³  : TowerFock D R → TowerFock D R。

  则 L_2(y3 φ) = 0 当且仅当 (D : R) = 26，即
    towerLop η a b 2 (y3 η a b φ) = 0  ⟺  (D : R) = 26。

  换言之，在 NoZeroDivisors + CharZero + L_{−1}φ ≠ 0 的条件下，临界维度 D=26
  不仅是 y3φ 成为奇异向量的充分条件（见姐妹卡 worldsheet.y3-singular-vector-d26-h-neg4），
  也是必要条件——该值由 L_2 的计算直接产出。
uses:
  - worldsheet.virasoro-generators-free-boson
uses_conventions:
  - conv.metric-mostly-plus
  - conv.virasoro-standard
formal:
  lean_decl: StringFormal.NoGhost.towerLop_two_apply_y3_eq_zero_iff
  lean_file: StringFormal/NoGhost/SingularVectorsSix.lean
sources:
