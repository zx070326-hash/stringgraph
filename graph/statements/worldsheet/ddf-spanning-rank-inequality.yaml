  (i) 【三角性路线的上限恰是 D≠26 的真实答案，任何 Type-1-only 论证都产不出 26】
  §B‴.6 证明：三角性路线只用 L_{-1} 族（对一切 D 成立，不含 D，因
  `centralTerm 1 = 0`）能达到的下界恰是 `dim Z_N ≥ p_{D-1}(N-1)`——**这正好等于
  N=2 处 D≠26 时的真实维数** `dim Z_2 = D-1 = p_{D-1}(1)`（§B″.2 的完整账）。
  𝒟₂ 族（D=26 的全部内容所在）的领头指标被 L_{-1} 族整族占满（§B‴.3 的表），
  任何 (β,ω)-相容序都看不见它。⇒ **任何只用 Type-1 领头项的论证，无论怎么精细化，
  都不可能产出"D=26"这个方程**——这是本卡（B26）与
  worldsheet.ocq-null-state-two-families 里"两族缺一不可"这一结构性事实的一条
  独立、更精确的确证（此前只知道 Type-1 单独给出的是 p_{D-1}(N-1) 这个数，
  §B‴ 才证明这个数**恰好**是 D≠26 时的答案，不是巧合）。

  (ii) 【三角性路线被证伪，不推荐；推荐 PR6′：仅用 L_{-1} 单射性，D-无关，
  ≈700-850 行】§B‴.8 的裁决（三条理由，按重要性排序）：
  1. 上面 (i) 段的上限事实；
  2. **同一个界有更便宜的证法**（PR6′，见 §B‴.9）：`L_{-1}` 在每个 level 片上
