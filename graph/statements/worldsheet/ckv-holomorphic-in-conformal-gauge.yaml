      Conformal Killing Vectors in the Conformal Gauge`）；原书未核对。
      ⚠ **原书的 (5.2.8) 把「模的方程」与「CKV 的方程」写在同一处**；本图按
      「一个节点一个命题」拆成本卡与 worldsheet.moduli-holomorphic-quadratic-differentials 两卡，
      两卡共用同一个 loc。
tags: [worldsheet, ckv, conformal-gauge, holomorphic, moduli]
notes: |
  这条是「CKV 计数 = 全纯向量场计数」的接口，第 6 章球面上 δz = a₀ + a₁z + a₂z²（κ = 6）
  与圆盘上的 PSL(2,R)（κ = 3）都由它加各自的整体正则性条件得到；那两条属 §6，
  由另一名 curator 负责（`spectrum.` 前缀）。
