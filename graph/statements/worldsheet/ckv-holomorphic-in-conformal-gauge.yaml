id: worldsheet.ckv-holomorphic-in-conformal-gauge
kind: proposition
title: "共形规范复坐标下 CKV 方程化为全纯性：∂̄ δz = 0、∂ δz̄ = 0"
statement: |
  在共形规范（ĝ_ab = δ_ab，worldsheet.conformal-gauge-fixing）与复坐标
  z = σ¹ + iσ²（conv.worldsheet-complex-coords）下，把无穷小微分同胚写成 z → z + δz(z, z̄)、
  z̄ → z̄ + δz̄(z, z̄)。则共形 Killing 方程（worldsheet.conformal-killing-equation）
  (P₁δσ)_ab = 0 的两个独立分量恰为
    ∂̄ δz = 0 ,     ∂ δz̄ = 0 ,
  即 **δz 是 z 的全纯函数、δz̄ 是反全纯函数**（且 δz̄ = (δz)‾ 使变换保实）。
  因此在共形规范下，CKV 就是世界面上处处正则的全纯向量场；κ = dim_R ker P₁
  等于这类全纯向量场的实维数。

  ⚠ 「处处正则」是关键限定：全纯性是局部条件，κ 的具体值由曲面的整体结构
  （各坐标片上的正则性 + 过渡函数）决定。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
sources:
