  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§5.1, eq. (5.1.9)–(5.1.11), p.147"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E69（researcher 第四轮，2026-09-11），
      证据等级 [已核实] / L1。
      ⚠ **L1 的含义**（抽取记录 §5.0）：抽取者逐页读到了 schrans-2020 伴读笔记的页图，
      笔记里确有该式号与该内容；**这不等于核对了 Polchinski 原书**——本项目至今没有该书正文。
      g_ab = ((1, ½(τ+τ̄)), (½(τ+τ̄), |τ|²)) 与「τ 取实值时 det g = 0，故必须 Im τ > 0」
      出自 schrans-2020 §5.1（笔记 p.243–244，L1），是核对源，不是原书逐字。
tags: [worldsheet, torus, moduli, teichmueller, geometry]
notes: |
  **一处归一化分歧，需持原书者裁决**：抽取记录 E69 写「等价地可保持周期 σ^a ∈ [0,1]² 不变而改度规：
  w = σ¹ + τσ²」。但 w = σ¹ + τσ² 配 σ^a 周期 1 只能给出格 Z + τZ，与同一条 E69 前半句的
  w ≅ w + 2πm + 2πnτ（格 2πZ + 2πτZ）差整体因子 2π。本卡按**周期 2π** 写，使两半自洽；
  若原书用的是周期 1，则本卡的 Λ(τ) 与周期都应整体除以 2π，**τ 本身与下游一切结论不受影响**
  （τ 是两个周期之比，与整体标度无关）。

  本卡的 status = rigorous 指**这张定义卡本身**在数学上精确（商群、格、平坦度规都是标准对象），
  不表示 Polchinski 的推导严格。
author: curator-polchinski-ch5
created: "2026-09-11"
