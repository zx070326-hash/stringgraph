id: worldsheet.torus-modulus
kind: definition
status: rigorous
title: 模参数为 τ 的平坦环面
statement: |
  设 τ 属于上半平面 H = {τ ∈ C : Im τ > 0}，记 τ¹ = Re τ、τ² = Im τ。
  **模参数（Teichmüller 参数）为 τ 的平坦环面** T²(τ) 定义为复平面对格的商
    T²(τ) = C / Λ(τ),   Λ(τ) = 2π Z + 2π τ Z,
  即在复坐标 w 上作认同
    w ≅ w + 2π m + 2π n τ    (m, n ∈ Z)，
  并带由 C 上的平坦度规 ds² = dw dw̄ 诱导的度规。

  **等价的「固定周期、改度规」写法**：取实坐标 σ¹, σ² 使周期与 τ 无关，
    w = σ¹ + τ σ²,    σ^a ≅ σ^a + 2π  (a = 1, 2),
  则
    ds² = |dσ¹ + τ dσ²|²,
  即
    g_ab = ( (1, τ¹), (τ¹, |τ|²) )     （分量次序 g_11, g_12; g_21, g_22）。
  于是
    det g_ab = |τ|² − (τ¹)² = (τ²)² = (Im τ)²,
  故该度规**正定当且仅当 Im τ ≠ 0**；本定义约定取 Im τ > 0。

  ⚠ 本卡只定义「给定 τ 的平坦环面」这个对象，**不**断言
  (i) 每个环面度规都能化到这个形式（见 worldsheet.torus-metric-reduces-to-modulus），
  (ii) 不同的 τ 给出不同的环面（见 worldsheet.torus-modular-equivalence、
       worldsheet.modular-fundamental-domain）。
uses: []
