id: worldsheet.open-string-doubling-trick
kind: proposition
title: doubling trick：Neumann 边界条件使 T̄ 成为 T 的镜像解析延拓，故开弦只有一套 Virasoro 代数
statement: |
  设开弦世界面在欧氏共形规范下共形映到上半平面 H = {z ∈ C : Im z ≥ 0}，实轴 Im z = 0 是
  弦的边界（conv.worldsheet-euclidean、conv.worldsheet-complex-coords）。
  设 T(z) ≡ T_{zz} 全纯、T̄(z̄) ≡ T_{z̄z̄} 反全纯
  （worldsheet.traceless-holomorphic-energy-momentum），并设弦端点满足 Neumann 边界条件
  （worldsheet.open-string-neumann-boundary-condition）。则：

  **(i) 边界上两部门相等。** 在实轴上
    T(z) = T̄(z̄)   对 z = z̄ ∈ ∂H。
  等价说法：Neumann 条件使**穿过边界的能流为零**，即 T_{z z̄ 分量之外} 的法向流分量在边界上消失，
  写成复坐标就是上式。

  **(ii) 镜像延拓。** 由 (i)，函数
    T̃(z) := T(z)      (Im z > 0),
    T̃(z) := T̄(z^*)    (Im z < 0)      （z^* 是复共轭）
  在实轴上两侧取值一致，故 T̃ 是**整个** C（除算子插入点外）上的单一全纯场——
  即 T̄ 是 T 越过边界的**镜像（Schwarz 反射型）解析延拓**。

  **(iii) 只有一套 Virasoro。** 因此，在 H 上分别由半圆围道定义的 {L_m} 与 {L̄_m}
  不是两组独立的量：把半圆围道用 (ii) 补成整圆，得到
    L_m = ∮_{|z| = r} (dz / 2π i)  z^{m+1} T̃(z),
  这一族 {L_m : m ∈ Z} 已穷尽开弦的共形对称性生成元，且 L̄_m 由 L_m 决定（在上述反射下 L̄_m = L_m）。
  故开弦上只有**一个** Virasoro 代数，其物理态条件只需对一族 L_n 写一次。
  （闭弦无边界，(i) 无从谈起，{L_m} 与 {L̄_m} 保持独立——这是开闭弦最基本的结构差别。）

  **本命题不断言什么**：不断言 T 或 T̄ 各自的全纯性（那是
  worldsheet.traceless-holomorphic-energy-momentum）；不断言 L_m 满足 Virasoro 对易关系
  （那需要 TT OPE 与围道变形字典）；不涉及零模归一化 α_0 = (2α')^{1/2} p
  （那在 worldsheet.open-string-virasoro-modes-v3）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.virasoro-standard
