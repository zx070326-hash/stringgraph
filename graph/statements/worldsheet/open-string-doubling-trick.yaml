notes: |
  【本卡片由 worldsheet.open-string-virasoro-modes-v2 拆出】（curator 2026-09-11，执行
  docs/ROADMAP.md「待拆清单」里 reviewer-batch2 的一条：「open-string-virasoro-modes-v2
  仍内嵌 doubling trick 命题」）。v2 的 statement 首段用陈述句写出上面 (i)(ii)(iii)，
  但 v2 是一张 definition 卡且末段自称「不断言任何由此推出的等式」，自相矛盾；
  更实际的后果是：worldsheet.open-string-l0-level-form--via-zero-mode-substitution 的 gaps
  里长期挂着一条「**doubling trick 本身没有被论证**：v2 把它作为定义记录下来，
  但『Neumann ⟹ T̄ 是 T 的镜像解析延拓 ⟹ 只有一套 Virasoro』这一串本图没有推导节点」。
  本卡片与 worldsheet.open-string-doubling-trick--via-boundary-condition 就是补上的那个节点，
  定义那一半留在 worldsheet.open-string-virasoro-modes-v3。

  **为什么是 physical-argument 而不是 rigorous**（详见推导节点的 summary 与 gaps）：
  三步里没有一步在本图中是严格的——(i) 把经典的 Neumann 条件 ∂^σ X^μ|_∂ = 0 转成
  **量子算符** T 在边界上的等式，靠的是「T 由 X 的正规序双线性给出」这一形式代换，
  且需要洛伦兹世界面 → 欧氏上半平面的 Wick 旋转与共形映射（本图无节点，见 gaps）；
  (ii) 的 Schwarz 反射对算子值分布（而非解析函数）的意义只在关联函数内、且只在算子插入点
  之外成立；(iii) 用的 worldsheet.energy-momentum-laurent-modes 本身有效状态就是 physical-argument。
  按 docs/STATUS_LEVELS.md「不确定时选低的那级」，取 physical-argument。

  **与 D 膜的关系**（范围说明）：本命题的前提是**全部**方向都取 Neumann。若某些方向取
  Dirichlet，镜像延拓仍存在但反射带负号（T 的那部分反号，X 的模展开也随之改变），
  结论 (iii)「只有一套 Virasoro」仍成立而 (i) 的写法要改。本图未建 Dirichlet 支的节点
  （见 worldsheet.open-string-neumann-boundary-condition 的 notes），故本卡片限定在纯 Neumann。
