    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E40 备注，证据等级 **[已核实]**：
      schrans-2020 目录条目 `2.46 p 56: Eq. (2.6.25) The Open String Boundary` 式号已核实，
      且抽取记录逐字写「(2.6.25) 说明开弦情形下 `L` 与 `L̄` 由 doubling trick 合并成**一套**
      Virasoro 代数」——即结论 (iii) 在二手核对源意义上已核实。
      ⚠ **(i)(ii) 的具体表达式（边界上 T = T̄ 的写法、反射公式 T̃(z) = T̄(z^*)）未核对原书**：
      核对源只给条目标题与「合并成一套」这一结论，中间两步是本图按标准 CFT 做法补出的措辞。
      原书正文在付费墙后（抽取记录 §0）。
