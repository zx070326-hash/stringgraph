sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Virasoro/GenericIndependence.lean :: StringFormal.Virasoro.{descFamily2, descFamily3, descFamily4, IsContravariant.gram_det_descFamily2, IsContravariant.gram_det_descFamily3, gramMatrix_descFamily4, IsContravariant.gram_det_descFamily4, IsContravariant.linearIndependent_descFamily2, IsContravariant.linearIndependent_descFamily3, IsContravariant.linearIndependent_descFamily4, descFamily2_mem_levelSpan, descFamily3_mem_levelSpan, descFamily4_mem_levelSpan, span_descFamily2_le_levelSpan, span_descFamily3_le_levelSpan, span_descFamily4_le_levelSpan, composition_two_blocks, levelSpan_two_eq_span_descFamily2, levelSpan_moduleFinite, IsContravariant.finrank_levelSpan_two, IsContravariant.three_le_finrank_levelSpan_three, IsContravariant.five_le_finrank_levelSpan_four, IsContravariant.linearIndependent_descFamily2_of_pos, IsContravariant.finrank_levelSpan_two_of_pos}"
    note: |
      本仓库，形式化侧分支 agent/formalizer/generic-pbw（该文件最后一个提交 **f4df390**），
      由 lead 以 **ff1a7d6**（"Merge branch 'agent/formalizer/generic-pbw'"）合入 main；
      Lean 4 + Mathlib v4.33.1，无 sorry。逐条对应：
        (1) → `IsContravariant.linearIndependent_descFamily{2,3,4}`
              （本卡 formal.lean_decl 取 N = 4 的那条，因为它是三条里最强/最长的一条；
              三条同形，假设为 `hB : IsContravariant R c h B`、`hB1 : B (hwv) (hwv) = 1`、
              `hdet : <det_N 的多项式> ≠ 0`，类型类为
              `[CommRing R] [Algebra ℚ R] [NoZeroDivisors R]`——即本卡陈述的「交换 ℚ-代数、无零因子」），
              其 Gram 行列式一步是 `IsContravariant.gram_det_descFamily{2,3,4}`
              （`descFamily4` 的矩阵形另由 `gramMatrix_descFamily4` 给出），
              向量族本身是 `descFamily{2,3,4} : Fin p(N) → VermaModule R c h`；
        (2) → **`levelSpan_two_eq_span_descFamily2`**（无条件，只用 `composition_two_blocks`：
              2 的合成只有 [2] 与 [1,1]），以及 `span_descFamily2_le_levelSpan`、
              `descFamily{2,3,4}_mem_levelSpan`（三个 level 的向量都落在对应 V_N 里）；
        (3) → **`IsContravariant.finrank_levelSpan_two`**（`[Field K] [CharZero K]`；
              经 `finrank_span_eq_card` 与 (2)），配套 `levelSpan_moduleFinite`；
        (4) → `IsContravariant.linearIndependent_descFamily2_of_pos` 与
              `IsContravariant.finrank_levelSpan_two_of_pos`（`[Field K] [LinearOrder K]
              [IsStrictOrderedRing K]`，前提只要 `0 < h`、`1 < c`，内部调用 `kac_level_two_pos`）；
        (5) → `IsContravariant.three_le_finrank_levelSpan_three`、
              `IsContravariant.five_le_finrank_levelSpan_four`。
      **该文件的 module docstring 逐字写明 (d)(e) 的技术障碍与「这是条件的、泛型的 PBW (b)，
      不是 PBW (b)」**（"## What this does and does not give" 一节），本卡【不断言】(a)(d)(e)
      是它的图侧登记。公理检查由 formalizer 跑过（formal/TODO.md 的 `pbw-verma` (b) 项，
      2026-09-11）：只用 propext / Classical.choice / Quot.sound。
      **curator 未自行重跑 `lake build` / `check-axioms`**；由 lead 在合并含 formal 改动的分支时跑。
  - ref: feigin-fuchs-1982
    loc: "§3.2 «Теорема Каца», Теорема 3.1（俄文原刊 Функц. анализ 16:2 (1982) 第 58 页）"
    note: |
      **只定位「Kac 行列式是 PBW 基的 Gram 行列式」这一经典设定，不承载本卡的任何结论**。
      FF 把 M_{h,c}(k) 定义为 PBW 基 e_{−1}^k, e_{−1}^{k−2}e_{−2}, …, e_{−k} 作用真空所得基的
      Gram 矩阵（L1 已核，literature/extractions/math-sources.md §34.2(b)）——
      注意 FF **已假定那是基**，即预设了本卡想要替代的那条 PBW 线性无关性。
      本卡的逻辑方向相反：**由**行列式非零**推出**线性无关。
      这是「泛型替代」与「经典陈述」的实质差别，不是记号差别。
  - ref: schottenloher-2008
    loc: "Ch. 6 §6.3, Definition 6.11（Gram 矩阵取 V_N 的一组基）、Theorem 6.12, p. 97–98"
    note: |
      同上，**只定位设定**：该处同样把 Gram 矩阵定义在 V_N 的**一组基** b₁,…,b_{P(N)} 上
      （L1 逐页核实，math-sources.md §34.3），即预设线性无关。
      本卡（与 worldsheet.kac-determinant-level-{two,three,four} 的「张成集的 Gram，非基的 Gram」
      同一立场）不预设它；(1) 正是把那一步从假设变成结论——但只在泛型 (c,h) 处，
      且以 B 的存在性为前提，见【不断言】(a)。
tags: [cft, representation-theory, verma-module, shapovalov, kac-determinant, pbw, virasoro, formalized]
notes: |
  【查重（2026-09-11，curator，分支 agent/curator/lean-wire-5）】
  跑 `uv run stringgraph search 线性无关 / PBW / Verma / Gram / determinant`。命中并逐卡比对：
  · math.verma-module-free-over-negative-part（= 旧 worldsheet.verma-module-pbw-basis 的换代）——
    **无条件**的 PBW：基、dim V_N = p(N)、V(c,h) ≠ 0，对一切 (c,h)、一切 N。
    本卡是它的**条件泛型片段**（N ≤ 4、det_N ≠ 0、给定 B），不能与之合卡：
    合卡会让一条 rigorous-未形式化的无条件命题被一条 formalized 的条件命题「借光」。
  · worldsheet.verma-level-spanned-by-partitions —— PBW 的另一半（straightening，dim ≤ p(N)），
    已 formalized。本卡引它做 (3) 的上界，并在【不断言】(d)(e) 里登记它与本卡下界的对接障碍。
  · worldsheet.kac-determinant-level-{two,three,four} —— 算出 Gram 行列式本身，
    三张卡都在标题里写「张成集的 Gram，非基的 Gram」，正是因为缺本卡的 (1)。
    ⇒ 本卡是把那三张卡的行列式**用起来**的节点，不重复它们的计算。
  · math.gram-determinant-nonzero-implies-linear-independence（同分支新建）—— 纯线性代数引理。
  ⇒ **没有既有节点承载「泛型 (c,h) 处 N ≤ 4 标准向量线性无关」**。

  【本卡在图中的作用：把三张「张成集的 Gram」卡的限定词部分解除】
  worldsheet.kac-determinant-level-two 的 notes 写着「在 PBW 之前，(3) 的右端只是一个恒等式，
  不是『Kac 行列式在 N = 2 的值』」。本卡的 (1)(2)(3) 表明：在 det₂ ≠ 0 的 (c,h) 处
  **不必等 PBW**——那两个向量确实是 V₂ 的一组基，(3) 确实就是该处的 Kac 行列式。
  这是一条**局部**解除：Kac 零点处（以及 N = 3,4 的维数等式）仍要等真正的 PBW。
  同一段话已写进 worldsheet.kac-determinant-level-two 的 notes（同分支）。

  【为什么 formal.lean_decl 填 N = 4 那条】schema 只放得下一个名字。三条
  `linearIndependent_descFamily{2,3,4}` 同形，填 N = 4 的那条有两个理由：
  它是覆盖最多向量（5 个）、行列式最长（五个因子）的一条，且它依赖的 level-4 Gram 矩阵
  （15 个独立元）是三者中唯一需要 `gramMatrix_descFamily4` 显式重排的。
  (2)(3)(4)(5) 对应的声明全部列在 source loc 里，逐条对应表见该 source 的 note。

  【(4) 与 worldsheet.kac-determinant-level-two 的分工】det₂ > 0 这条**不等式本身**
  登记在那张卡的 notes（`kac_level_two_pos`、`kac_level_two_nonneg`、`kac_level_two_at_c_one`），
  本卡只承载它的**推论**（前提自动满足 ⇒ 线性无关与 dim = 2）。
  两处不要重复陈述同一不等式：那张卡讲行列式的符号，本卡讲由此得到的基。
