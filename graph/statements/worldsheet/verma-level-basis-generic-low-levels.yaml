id: worldsheet.verma-level-basis-generic-low-levels
kind: proposition
title: Verma 模 N ≤ 4 的标准降算符向量在泛型 (c,h) 处线性无关（条件版泛型 PBW 替代）：Kac 多项式非零 ⇒ p(N) 个向量独立；N = 2 另有 V₂ = span 与 dim V₂ = 2 = p(2)，N = 3,4 只到 dim ≥ p(N)
statement: |
  设 R 是交换环、ℚ-代数且**无零因子**，(c,h) ∈ R²，V(c,h) 是 Virasoro Verma 模
  （worldsheet.verma-module-v2），v := |c,h⟩，约定 conv.virasoro-standard 与
  conv.verma-module-notation。V_N ⊆ V(c,h) 是 level N 分量
  （worldsheet.verma-level-spanned-by-partitions 的写法：N 的全体合成所给负模态词的张成）。
  记各 level 的**标准降算符向量**（按分拆排序，共 p(N) 个）：

      N = 2 (p = 2):  a₂ := L₋₂ v,  a₁₁ := L₋₁² v；
      N = 3 (p = 3):  L₋₃ v,  L₋₂L₋₁ v,  L₋₁³ v；
      N = 4 (p = 5):  L₋₄ v,  L₋₃L₋₁ v,  L₋₂² v,  L₋₂L₋₁² v,  L₋₁⁴ v。

  记各 level 的 **Kac 多项式**（即 worldsheet.kac-determinant-level-{two,three,four} 算出的
  那一族向量的 Gram 行列式）：

      det₂(c,h) = 2h(16h² + 2h(c−5) + c),
      det₃(c,h) = 48h²(16h² + 2h(c−5) + c)(3h² + h(c−7) + c + 2),
      det₄(c,h) = 384h³(8h + c − 1)(16h² + 2h(c−5) + c)²(3h² + h(c−7) + c + 2)
                    · (16h² + 10ch − 82h + 15c + 66)。

  设 B 是 V(c,h) 上的**归一化逆变双线性型**（B 逆变且 B(v,v) = 1，
  见 worldsheet.shapovalov-form-uniqueness / -existence）。则：

  **(1) 泛型线性无关（N = 2, 3, 4）。** 对 N ∈ {2,3,4}：若 det_N(c,h) ≠ 0，
  则上列 p(N) 个标准降算符向量在 R 上**线性无关**。
  （机制：这 p(N) 个向量关于 B 的 Gram 矩阵的行列式**就是** det_N(c,h)
  ——那正是 worldsheet.kac-determinant-level-{two,three,four} 的内容——
  再用 math.gram-determinant-nonzero-implies-linear-independence 的 (2)。）
  前提「det_N ≠ 0」是一个**多项式**在 (c,h) 处不为零的条件，故在泛型 (c,h) 处成立，
  只在该 level 的 Kac 零点集上失效。

  **(2) N = 2 的张成等式（无条件，不需要 B、不需要 PBW、不需要无零因子）。**
  对任意交换 ℚ-代数 R：

      V₂ = span_R { a₂, a₁₁ } = span_R { L₋₂ v, L₋₁² v }。

  （理由：2 的合成只有 [2] 与 [1,1] 两个，故 V₂ 的定义性张成集就是这两个向量；
  N = 2 时不需要 straightening。）

  **(3) dim V₂ = 2 = p(2)（特征零域上，泛型）。** 设 R = K 是特征零的域。
  若 det₂(c,h) ≠ 0，则 dim_K V₂ = 2 = p(2)。
  这是 PBW 等式 dim V_N = p(N) 的**第一个**实例：
  worldsheet.verma-level-spanned-by-partitions 只给 ≤，(1)+(2) 补上 ≥。

  **(4) 酉区域上前提自动满足（N = 2）。** 设 K 是有序域（`[Field K] [LinearOrder K]`
  且严格有序）。若 h > 0 且 c > 1，则 det₂(c,h) > 0
  （见 worldsheet.kac-determinant-level-two 的 notes【2026-09-11（三）】），
  故 (1)(3) 的前提自动成立：{a₂, a₁₁} 线性无关且 dim_K V₂ = 2，**无需另加行列式假设**。

  **(5) N = 3, 4 只得到不等式。** 设 K 是特征零的域。
  若 det₃(c,h) ≠ 0 则 dim_K V₃ ≥ 3 = p(3)；若 det₄(c,h) ≠ 0 则 dim_K V₄ ≥ 5 = p(4)。
  **这两条没有升级为等式**，原因是纯技术性的，见【不断言】(d)(e)。

  【本节点明确**不**断言】
  (a) **本卡不是 PBW 的线性无关性一半**（math.verma-module-free-over-negative-part 的 (2)(3)，
      即 worldsheet.verma-module-pbw-basis 的内容）。两处差别都是本质的：
      · 本卡**假设**存在归一化逆变型 B，而它的存在性等价于 v ≠ 0（即 V(c,h) ≠ 0，
        worldsheet.shapovalov-form-existence 的 (4)），后者本身是 PBW 的**推论**；
      · 本卡只在 det_N(c,h) ≠ 0 处有结论，Kac 零点处什么也不给。
      ⇒ math.verma-module-free-over-negative-part **不因本卡而升级为 formalized**，
      formal/TODO.md 的 `pbw-verma` (b) 仍未完成。
  (b) **Kac 零点处的线性相关性**。det_N(c,h) = 0 **不**蕴含那 p(N) 个向量线性相关：
      Gram 判据单向（math.gram-determinant-nonzero-implies-linear-independence 的【不断言】(a)）。
      已知的显式见证：c = 1、h = 1/4 处 level-2 Gram 矩阵四个元全为 3/2，det₂ = 0，
      而退化的是**型**——(L₋₂ − L₋₁²)v 与整个 V₂ 正交（该事实已形式化，
      见 worldsheet.kac-determinant-level-two 的 notes）；按 PBW 那两个向量对一切 (c,h) 都独立。
  (c) **N ≥ 5**。本卡只到 N = 4，因为只有 N ≤ 4 的 Gram 行列式被算出
      （worldsheet.kac-determinant-level-{two,three,four}）。一般 N 的 Kac 行列式公式是
      worldsheet.kac-determinant-v2（rigorous，未形式化），本卡不使用它、也不依赖它。
  (d) **「N = 3, 4 的标准向量张成 V₃、V₄」不是本卡的断言**。
      worldsheet.verma-level-spanned-by-partitions 的 (3) 给出 V_N = span{分拆指标的有序词}，
      但要把那个由 `Nat.Partition N` 指标化的族与本卡写出的三个/五个**显式**向量对上，
      需要 `Fintype.card (Nat.Partition 3) = 3`、`= 5` 一类的枚举引理，
      Mathlib v4.33.1 没有，且 `decide` 化不开（`Nat.Partition` 的 `Fintype` 实例经
      `Fintype.ofSurjective`）。N = 2 绕开了这一点（(2) 用 2 的合成只有两个这一手算事实）。
  (e) **dim V₃ = 3、dim V₄ = 5**。上界 dim_K V_N ≤ p(N) 已有
      （worldsheet.verma-level-spanned-by-partitions 的 (4)），但它写成 `Fintype.card (Nat.Partition N)`，
      与 (5) 的下界 3、5 对不上——同 (d) 的技术原因。另一条路（把 V_N 写成标准向量的张成，
      如 (2) 那样）在 N ≥ 3 需要 straightening：[1,2] 是 3 的合成而 L₋₁L₋₂v 不是三个标准向量之一。
  (f) **B 的存在性与唯一性**。见 worldsheet.shapovalov-form-existence（条件的）与
      worldsheet.shapovalov-form-uniqueness（无条件）。本卡把 B 当**给定**。
  (g) 任何正定性/酉性结论：(4) 只是说 det₂ > 0 使 (1)(3) 的前提自动满足，
      **不**断言 V₂ 上的型正定，也不断言 V(c,h) 酉。
  (h) 与奇异向量、不可约商、最小模型的关系：不在本卡内。
uses_conventions: [conv.virasoro-standard, conv.verma-module-notation]
