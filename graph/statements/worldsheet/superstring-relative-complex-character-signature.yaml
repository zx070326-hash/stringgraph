sources:
  - ref: lian-zuckerman-1989
    loc: "**Proposition 2.14(ii)**, pp.311–312：'char C_rel(p,κ) = ½(2κ+1) dim R(p,κ) p^{(8)}_κ(κ − p·p/2) = sign C_rel(p,κ)'；**Proposition 2.14(i)**：Q* = Q w.r.t. ⟨,⟩_rel；**Definition 2.11**, p.311（⟨,⟩_rel：κ=½ 取 ⟨u,v⟩_B，κ=0 取 √−1⟨u, v̂⟩_B，v = D_R v̂；动机 p.310 逐字 '⟨·, c₀·⟩_C ≡ 0 when restricted to C_rel(p,0) … because ⟨T₁, T₁⟩_T = 0'）；证明 pp.312–317（特征标/号差的分情形计算）"
    note: |
      literature/extractions/lian-zuckerman-1989.md **E5**（第一轮，全文 35 页逐页读图，L1）。
      ⚠ **E5 对 2.14(ii) 的公式是抽取者的转录，未标「逐字」**；第三轮页图复核（§9）只重读了 pp.316–321，
      **pp.312–316 未第二次核**。故本卡断言的公式可追溯性是 L1 页级 + 转录，**不是逐字复核**。
      ⚠ **证明未转录**：E5/§9 只记「真正的工作量在 Proposition 2.14(ii)（特征标/号差计算，pp.312–317）」
      （§9.2 读数 4）；auditor 2026-09-11 转录过 p.313–314 的 (4)(5)(6) 与 'Case 1（p·p = 0）
      sign C_rel(p,0) = 16'（见维数卡 notes），证实那几页是分情形计算，但本图没有逐字。
      ⇒ 本卡推导 status 的限制见推导 gaps。
      ★ **【2026-09-11 更新，上面两条 ⚠ 已过时】**：researcher 第四轮页图（§10.3）已逐字核 p.312 的
      Proposition 2.14，**与 E5 转录一致、无更正**；证明 pp.312–317 的结构（引用清单与分步骤）见 §10.4，
      已写进本卡推导的 summary。剩余缺口只是 Lemma 2.14.1–2.14.5 各自证明的逐行细节（见推导 gaps）。
      ⚠ 排印差：p.312 印作 p^{(8)}_κ(κ − (p·p/2))，p.317 印作 p^{(8)}_κ(κ − p·p/2)；见本卡 notes 第三段。
      ★ **〔2026-09-12 auditor 页图复核，已结清〕** 行内排（p.312，`/` 分数故加括号消歧）
      vs 显示排（p.317，叠排分数故无需括号）之别，**两处都是 `κ − p·p/2`，无实质差异，
      不构成 gap**（rulings §3，lian-zuckerman-1989.md §11）。
  - ref: lian-zuckerman-1989
    loc: "**Corollary 2.15 的证明**, p.317，逐字：'Proof. (i) We recall the Euler–Poincaré Principle for characteristics: Σ_{n∈Z}(−1)^n dim H^n_rel(p,κ) = Σ_{n∈Z}(−1)^n dim C^n_rel(p,κ). Thus by Theorem 2.4, the left-hand side gives dim H⁰_rel(p,κ) while the right-hand side is char C_rel(p,κ). Hence (i) follows from Proposition 2.14 (ii). (ii) Similarly, the Euler–Poincaré Principle for signature states that Σ_{n∈Z} sign H^n_rel(p,κ) = Σ_{n∈Z} sign C^n_rel(p,κ). Again Theorem 2.4 implies that the left-hand side = sign H⁰_rel(p,κ), while the right-hand side is sign C_rel(p,κ). Thus (ii) follows from Proposition 2.14(ii) also.'"
    note: |
      L1 逐字（§9.2）。★ **本条是 (H6) 里 char / sign 两个记号读法的唯一逐字依据**：
      'the right-hand side is char C_rel(p,κ)' 对着 Σ_n (−1)^n dim C^n_rel，
      'the right-hand side is sign C_rel(p,κ)' 对着 Σ_n sign C^n_rel。
      ★ 同时是本卡**被使用的方式**：Cor 2.15(i) 用 char 那一半，(ii) 用 sign 那一半（句末 'also'）。
      ★ negative evidence（§9.2 读数 2）：Prop 2.14(**i**) 在该证明里一字未引，本卡「不断言 (b)」照此。
  - ref: lian-zuckerman-1989
    loc: "**Theorem 2.4**, p.309（'Suppose p ≠ 0: then H^n_rel(p,κ) = 0 unless n = 0.'）；**p.303**（V(p,κ) = R(p,κ) ⊗ U(κ)；R(p,½) = C；R(p,0) 旋量表示；'p will always be assumed non-zero until Sect. 5'）；**p.306 (7)(8)**（零模表示 T_{1/2} / T₀ ⊕ T₁）；**p.308**（'From now on, we will take D = 10'）；**Definition 2.2**（相对次数）；**Proposition 2.18**, p.318（ch_q T(p,κ) = dim R(p,κ) q^{p·p/2} φ_κ(q)^{−8}，p^{(8)}_κ 的旁证）"
    note: |
      L1（E3/E7/§9.3）。本条只供给 (H1)–(H6) 的记号语境，**不是本卡的论证输入**
      （Prop 2.14(ii) 是复形层面的计算，不用消灭定理）。
  - ref: lian-zuckerman-1989
    loc: "**§2, p.311，Definition 2.11 正上方的过渡句**，逐字：'Now using Theorem 2.7 and Proposition 2.10, we have the following well-defined non-degenerate hermitian form on C_rel(p,κ).'；承载者 **Proposition 2.10**, p.311，逐字：'(i) ⟨·, c₀χ₀·⟩_C restricted to ℱ(p,0) is non-degenerate. (ii) D_R|*_ℱ = −D_R|_ℱ … (iii) ⟨·, c₀χ_{1/2}·⟩_C restricted to C_rel(p,½) = ℱ(p,½) is non-degenerate.'；**Definition 2.12(i)**, pp.311–312（char/sign 的定义，及其三条前提：⟨,⟩_T 非退化、dim T^n < +∞ for all n、T^n = 0 for all large enough positive n）"
    note: |
      L1 逐字。literature/extractions/lian-zuckerman-1989.md **§10.1 / §10.2**（researcher 第四轮页图，期刊 pp.311–317 七页一次取全）。
      ★ **本条关闭 (H4)「非退化」此前的无来源状态**（见本卡 notes 第一段）：原文确实印有 "non-degenerate" 一词，
      但它在 **Definition 2.11 正上方的过渡句**里，**不在 Proposition 2.14 的陈述里**（§10.3 negative evidence：
      Prop 2.14 的陈述与证明里没有 "positive definite"/"unitary"，"non-degenerate" 只以散文形式用在 (i) 的证明中）。
      ★ **承载者是 Proposition 2.10(i)(iii)**，κ=0 支另经 **Theorem 2.7** 的收缩同伦 ε 转到 C_rel(p,0)。
      引用时**不要**把非退化性记在 Prop 2.14 名下。
      ★ **Prop 2.14(i) 的证明逐字用到它**：'By non-degeneracy we have Q* = Q'（§10.4）。
      ⚠ **Prop 2.10(ii) 证明句有扫描件疑点**（原文印作 'D_R|*_ℱ = K acts like zero'，按上下文应为 D_R²|_ℱ = K，
      平方上标在 1989 CMP 扫描件上极易丢失，§10.1）；本卡不引用该句，只引 (i)(iii) 与过渡句。
tags: [superstring, brst, cohomology, rns, ramond-sector, character, signature]
notes: |
  【reviewer-batch26 的「(H4) 无来源」已解（curator 2026-09-11，small-backlog-14）】
  researcher 第四轮页图（期刊 pp.311–317，L1 逐字，extraction §10.1）取得 Definition 2.11 正上方的过渡句
  「Now using **Theorem 2.7** and **Proposition 2.10**, we have the following well-defined **non-degenerate**
  hermitian form on C_rel(p,κ)」。⇒ 原文确有 "non-degenerate" 一词，承载者是 **Proposition 2.10(i)(iii)**（p.311），
  **不在 Proposition 2.14 里**。故 (H4) 不再是无来源的附加词，statement 不改，也**不必**在实质换代时删。
  batch26 的判断基于当时图上无来源，现作废；其附带论点「号差对退化型亦有定义」本身仍对，但与 LZ 无关——
  LZ 的 **Definition 2.12(i)** 恰恰把「非退化」写进了 sign 有定义的前提（连同「每层有限维」「次数上有界」两条，
  见本卡推导 gaps）。⚠ 记账修正：**非退化性不要记在 Prop 2.14 名下**，canonical loc 见 sources 第四条。

  【rigorous 维持的条件已满足】batch26 记的降级条件是「researcher 取 pp.311–317 后若与 E5 转录不符则降级」。
  §10.3 的逐字复核结论：**E5 的转录与 p.312 原文一致，无更正**（½(2κ+1)、dim R(p,κ)、下标 κ 的 p^{(8)}_κ、
  自变量 κ − p·p/2、以及 char = … = sign 是一条双等式）。⇒ 条件满足，维持 rigorous。

  【一处排印差，照抄勿统一】p.312 的 Prop 2.14(ii) 印作 p^{(8)}_κ(κ − (p·p/2))（自变量里 p·p/2 **带一层括号**），
  p.317 的 Corollary 2.15(i) 印作 p^{(8)}_κ(κ − p·p/2)（**无内层括号**）。本卡 statement 用的是无内层括号那种
  （与 Cor 2.15、与维数卡一致）。两者是同一表达式的两种排版，不是两个不同的量。（extraction §10.3）

  ★【2026-09-12 auditor 页图复核：上面这条排印差**已结清，不构成任何 gap**】
  physics-auditor 于 2026-09-12 用 LZ 1989 全文 PDF（4× 渲染）复核两处
  （`literature/extractions/page-check-rulings-2026-09-12.md` §3，摘要在
  `lian-zuckerman-1989.md` §11），读数与裁定：
    · p.312 Prop 2.14(ii) 是**行内排**，`p·p/2` 用斜杠分数，故**外加一层圆括号消歧**；
    · p.317 Cor 2.15(i) 是**显示排**，`p·p` 在分子、`2` 在分母的**叠排分数**，无需内层括号；
    · **两处都是 `κ − p·p/2`，都不是 `(κ − p·p)/2`。**
  ⇒ **裁定：无实质差异，纯排版之别。** 上面「照抄勿统一」这条纪律（逐字引文各随其页）
  **仍然正确且继续有效**，但它**不是转录风险**：本卡 statement 写 `κ − p·p/2` 即可，
  **不必注明括号**，也不需要在本卡或任何下游卡上为此留 gap。
  ⚠ 本图此前**没有**任何卡把这条括号差记为 gap（auditor 本轮 grep 全图确认），
  故本条只是把「已结清」这个状态登记下来，不涉及任何卡的增删改。
  【为什么立卡（curator 2026-09-11，small-backlog-12）】
  worldsheet.superstring-relative-cohomology-dimension--via-lian-zuckerman-1989 的 gaps 第一条逐字：
  「Proposition 2.14(ii) … 在本图没有卡 … **目标卡断言的整个右端落在一条未上图的命题上**，
  这是本推导最实质的记账缺口。关闭方式：取 pp.312–317 的页图，为 Prop 2.14(ii) 单建卡。」
  本卡关闭「无卡」这一半，该推导同批加边（非 inferred，Cor 2.15 证明逐字 'follows from Proposition 2.14 (ii)'）；
  「pp.312–317 页图未取、证明未转录」这一半**未关闭**，记在本卡推导的 gaps。

  【为什么 char 与 sign 写在一张卡】LZ 把 2.14(ii) 写成一条三项等式 char = 表达式 = sign；
  下游两条推论各取一半。按「一个节点一个命题」本可拆成两卡，但 (a) LZ 的证明是同一个分情形计算
  同时给出两者（sign 的计算蕴含 char 的计算），(b) 两卡拆开后「char = sign」这个等式本身无处安放。
  故保持 LZ 的原状；下游引用时在 depends_on note 写明用的是哪一半。

  【与 worldsheet.no-ghost-theorem-superstring-cohomological-v2 的推导】
  那条推导（reviewer claim #349 内，本轮未动）用本卡的 sign 半 + 号差版 Euler–Poincaré（本图无卡，
  math.euler-poincare-principle「不断言 (a)」）+ Theorem 2.4。建议 reviewer 释放后由 curator 补两条边。

  【与维数卡记号的一致性】(H6) 的 dim R(p,κ)、p^{(8)}_κ 与维数卡 (H6) 同口径；
  维数卡 2026-09-11 reviewer-batch25 补注「不断言 p^{(8)}_κ 的任何解析形式」，本卡「不断言 (c)」同款。
