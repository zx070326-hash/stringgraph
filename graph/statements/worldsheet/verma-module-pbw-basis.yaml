id: worldsheet.verma-module-pbw-basis
kind: proposition
title: Verma 模的 PBW 基：有序单项式构成基，dim V_N = p(N)，特别地 V(c,h) ≠ 0
statement: |
  设 K 是特征零的域，(c, h) ∈ K^2，V(c,h) 为 Verma 模（worldsheet.verma-module-v2），
  |c,h⟩ 为其最高权向量，V_N 为其 level N 分量（L_0 本征值 h + N）。则

  (1) **PBW 基**：有序单项式
        L_{-n_1} L_{-n_2} … L_{-n_k} |c,h⟩,   n_1 ≥ n_2 ≥ … ≥ n_k ≥ 1,  k ≥ 0
      （k = 0 的空积即 |c,h⟩）构成 V(c,h) 的一组 K-基。等价地：V(c,h) 作为
      U(Vir_-) -模是自由的、秩 1、由 |c,h⟩ 生成，其中 Vir_- := span{L_{-n} : n ≥ 1}。

  (2) **分级维数**：上述基中 level N 的元素恰对应 N 的整数**分拆**，故
        dim_K V_N = p(N)   （p 为分拆函数，p(0) = 1）；
      特别地每个 V_N 是有限维的，且形式特征标为 Σ_N p(N) q^{h+N} = q^h ∏_{n≥1} (1 − q^n)^{-1}。

  (3) **非零性**：由 (2) 的 N = 0 情形，dim_K V_0 = 1，故 |c,h⟩ ≠ 0，特别地
        V(c,h) ≠ 0   对**所有** (c, h) ∈ K^2 成立。

  【范围说明】
  (a) (1)(2)(3) 对所有 (c,h) 成立，**与 Verma 模是否不可约无关**：不可约性、奇异向量、
      不可约商 L(c,h) 的维数都不是本节点的内容（判据是 Kac 行列式，
      见 worldsheet.kac-determinant）。
  (b) 本节点与所用的排序约定无关：把 (1) 里的 n_1 ≥ … ≥ n_k 换成 n_1 ≤ … ≤ n_k
      得到另一组基（同一分拆的另一种代表元），维数结论不变。
  (c) 本节点**未形式化**，见推导的 gaps（Mathlib v4.33.1 无 PBW 定理）。
