      **这条 source 不是本命题的证明**，而是本命题在本项目中**未形式化**这一事实的登记：
      Verma.lean 的 Status 段逐条写明缺 PBW 基（straightening + 线性无关）、缺 dim V_N = p(N)、
      缺 V(c,h) ≠ 0，并指出 Mathlib v4.33.1 没有 PBW 定理。提交 b138286。
tags: [cft, representation-theory, verma-module, pbw]
notes: |
  【本卡片是 worldsheet.verma-module 的拆分产物】（lead 裁决 2026-09-10，见 docs/ROADMAP.md 待拆清单）
  旧卡把「构造 + 分级」（已在 Lean 中完成）与「PBW 基 + dim = p(N)」（未形式化、依赖
  Mathlib 尚无的 PBW 定理）写在同一张定义卡上。现构造部分见
  worldsheet.verma-module-v2（formalized），本卡片承载其余部分。

  【引用本卡片还是 v2？——分派规则】
  - 只用到「V(c,h) 的构造、最高权关系、万有性质、L_0 分级」→ 引 worldsheet.verma-module-v2；
  - 用到「基 / 维数 p(N) / 特征标 / **模非零**」→ 引本卡片。
  按此规则改指本卡片的三处（拆卡时逐条读上下文判定）：
  - worldsheet.kac-determinant--via-feigin-fuchs：Kac 行列式是逆变形式在 level N 的
    **PBW 基**下的 Gram 行列式，其表述本身就需要 (1)(2)；
  - worldsheet.no-ghost-theorem-brst--via-fgz：所需的表示论输入是「模在负模态下自由」
    （FGZ Proposition 2.6 的 free ℒ^--module），即 (1) 的等价形式；
  - worldsheet.no-ghost-theorem-subcritical--via-lian-zuckerman：LZ 把判据归结为
    Verma 模 M(26−D, 1−h) 的半正定性，并用特征标 ch_q（Proposition 3.4 / Theorem 3.5 证明末句），
    需要 (2)；该推导的 gaps 也已逐字点名「PBW 基与 dim V_N = p(N) 尚未形式化」。

  【与 worldsheet.descendant-weight-grading 的分工】
  后者只断言降算符提高 L_0 本征值（h + Σk_i），**明确不断言**这些单项式线性无关；
  线性无关正是本卡片 (1)。两者不重复。
