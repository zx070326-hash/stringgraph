id: worldsheet.fock-indefinite-form
kind: proposition
title: Fock 空间上由 ⟨0|0⟩ = 1 与 (α^μ_n)† = α^μ_{−n} 唯一确定的双线性型，及其由 η^{00} = −1 导致的不定性
statement: |
  设 F = F(D, R) 是 worldsheet.bosonic-fock-space 给出的 Fock 空间，η 为其中的对角度规，
  α^μ_{−n}（产生）与 α^μ_n（湮灭）为其算符（μ = 0..D−1，n ≥ 1），|k⟩ 为真空。

  (1) **存在唯一性**。存在**唯一**的 R-双线性型 ⟨·,·⟩ : F × F → R 满足
      (a) ⟨|k⟩, |k⟩⟩ = 1；
      (b) 产生与湮灭算符互为伴随：对一切 μ ∈ {0..D−1}、n ≥ 1、P, Q ∈ F，
            ⟨α^μ_{−n} P, Q⟩ = ⟨P, α^μ_n Q⟩   且   ⟨P, α^μ_{−n} Q⟩ = ⟨α^μ_n P, Q⟩。
      这就是物理文献中「内积由 ⟨0|0⟩ = 1 与 (α^μ_n)† = α^μ_{−n} 完全确定」一句的精确内容。

  (2) **对称性与单项式基下的显式对角形**。该型对称；且对任意 d, e : Osc(D) → ℕ（有限支撑）与 a, b ∈ R，
        ⟨ a X^d , b X^e ⟩ = δ_{d,e} · a b · ∏_{(μ,n)} (n η^{μμ})^{d(μ,n)} · d(μ,n)!。
      特别地单项式基是正交基，对角元为 ∏_{(μ,n)} (n η^{μμ})^{d(μ,n)} · d(μ,n)!；
      η^{μμ} = ±1 时它是整数，不出现分母。

  (3) **level 正交**。若 M ≠ N、P ∈ F_M、Q ∈ F_N，则 ⟨P, Q⟩ = 0。

  (4) **不定性**。在 conv.metric-mostly-plus（η = diag(−1, +1, …, +1)，故 η^{00} = −1）下，
      对一切 n ≥ 1：
        类时方向 μ = 0（需 D ≥ 1）： ⟨ α^0_{−n}|k⟩ , α^0_{−n}|k⟩ ⟩ = −n；
        类空方向 μ = i ≠ 0（需 D ≥ 2）： ⟨ α^i_{−n}|k⟩ , α^i_{−n}|k⟩ ⟩ = +n。
      于是当 R 是有序域（如 ℝ）且 D ≥ 2 时该型既取到负值又取到正值，即**不定**：
      类时振子生成负模态（「鬼」），这正是无鬼定理必须消去的对象。
      （最后这一步「−n < 0 < n 故不定」是上两条计算在有序域上的直接推论，
      在 Lean 中未单列为定理，见推导节点的 gaps (v)。）
uses_conventions: [conv.metric-mostly-plus]
formal:
  lean_decl: StringFormal.NoGhost.Fock.pairing_unique
  lean_file: StringFormal/NoGhost/Fock.lean
sources:
