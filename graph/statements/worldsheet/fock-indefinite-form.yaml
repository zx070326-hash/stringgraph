  - ref: polchinski-1998-v1
    loc: "§4.1，eq. (4.1.16)–(4.1.18)，p.123–124：level 1 态 e·α_{−1}|0;k⟩ 的范数分析（A < −1 时该 level 含一个负范数态，破坏幺正性）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E56，证据等级 [已核实]（式号与内容经第三方
      笔记复现）。这是文献侧「协变 Fock 内积不定」最接近的可定位陈述，但它是**逐 level 的谱分析**，
      不是本节点的 (1)(2)(3) 那种关于双线性型本身的结构陈述。
      Polchinski 并不把「唯一性」单独陈述——他直接使用 (α^μ_n)† = α^μ_{−n} 定内积。
      本节点的第 (1) 条（存在**且唯一**）是本项目对该做法的精确化，文献侧无对应编号结果。
  - ref: gsw-1987-v1
    loc: "§2.2.1 'Commutation relations and mode expansions'，p.75 起；§2.2.2 'Virasoro algebra and physical states'，p.79 起（负模态态的讨论）"
    note: |
      定位强度 L4（目录页码，见 literature/extractions/brst-cohomology-sources.md §5.1）；
      **式号未核实**。GSW 用 mostly-minus，鬼出现在类时方向这一物理结论不变，
      但逐字公式的符号需按 conv.metric-mostly-plus 反号后才可比。
tags: [bosonic-string, quantization, fock-space, indefinite-metric, no-ghost, formalized]
notes: |
  【为什么这是一条命题而不是定义】内积不是额外规定的，而是被 ⟨0|0⟩ = 1 与伴随关系
  **唯一确定**的——这正是第 (1) 条的内容，也是本节点的主要信息量。定义卡是
  worldsheet.bosonic-fock-space。

  【与既有节点的关系】worldsheet.transverse-oscillator-commutators 断言横向（光锥）振子的
  Fock 内积**正定**；本节点断言协变 Fock 内积**不定**。两者不矛盾：前者只有 D−2 个类空方向，
  后者含类时方向 μ = 0。无鬼定理正是要证明「协变物理态空间模零模态」上诱导的型
  与横向那个正定型等距同构（worldsheet.no-ghost-theorem-v3）。

  【下游】本节点是无鬼定理形式化岛的第二块砖。接下来 formal/TODO.md 的 `sugawara`
  需要先按 worldsheet.bosonic-fock-space 的缺口 (i) 补零模，才能定义 L_0。

  【2026-09-11：(4) 末句已形式化】陈述 (4) 括号里「在 Lean 中未单列为定理，见推导节点的
  gaps (v)」一句已过时：FockSigned.lean 的 `Fock.pairing_indefinite`（有序环）与
  `Fock.pairing_indefinite_field`（有序域）把它补上了，推导 --via-lean 的 gap (v) 已标关闭。
  陈述文本按不可变原则不改。Lean 证明只需有序环 `[CommRing R] [PartialOrder R] [IsStrictOrderedRing R]`，
  比陈述写的「有序域」弱；鬼态存在只需 D ≥ 1，正模态需 D ≥ 2。
  （上一段说的 `sugawara` 一项也已完成，见 worldsheet.virasoro-generators-free-boson 与
  worldsheet.open-string-l0-equals-level-plus-mass。）

  【2026-09-11（二）：「†」在本节点里到底是什么，以及复情形未做】（curator，
  依据 formal/StringFormal/NoGhost/PhysicalStates.lean 文件头 "Mathematical gaps" 第 3 条，
  合并提交 2c8b577。只补 notes，陈述文本未动。）
  陈述 (1)(b) 与标题里的 `(α^μ_n)^† = α^μ_{−n}` 必须按下面的意思读：
  - **`Fock.pairing` 是 R-双线性型**（R 任意交换环），不是半双线性型；
    因此这里的「†」就是**转置**（对该双线性型的伴随），
    **不是** Hilbert 空间意义下的 Hermitian 共轭。
  - 物理上的协变 Fock 空间是**复**空间，带 Hermitian 半双线性形式，
    其上的 α^† 还要取一次复共轭。两者**在实极化下一致**：
    取实系数、实极化矢量时 Hermitian 形式限制到实张成上就是本节点的双线性型，
    第 (2)(3)(4) 条的所有数值（对角元 ∏ (n η^{μμ})^{d}·d!、±n）逐字相同。
    **复情形没有形式化**，也没有在本图中另立节点。
  - 这条限定对整个无鬼定理岛都要紧：无鬼定理断言的是 Hermitian 形式在
    H_phys/H_0 上半正定；目前 Lean 侧一切「范数」「正交」「零模态」
    （worldsheet.old-covariant-physical-states、worldsheet.virasoro-generators-adjoint、
    worldsheet.physical-states-level-one）都在**双线性型**意义下。
    这与推导 --via-lean 的 gaps (iv) 是同一条，此处从陈述侧再登记一次，
    以免下游只读陈述卡的人误以为是 Hermitian 版本。
  - 顺带（2026-09-11（二）新增，来自 PhysicalStates.lean）：陈述 (1)(b) 的伴随关系
    对**一切整数指标** j 成立，不止 n ≥ 1——`Fock.pairing_mode_left` 给出
    ⟨α^μ_j v, w⟩ = ⟨v, α^μ_{−j} w⟩，j = 0 时两边都是零模标量 a^μ = (2α')^{1/2}k^μ 的乘法。
    由它再推出 L_m^† = L_{−m}，见 worldsheet.virasoro-generators-adjoint。

  【2026-09-11（四）：「径向共轭规则」现有承载节点 worldsheet.radial-hermitian-conjugation
  （curator；**只加本段 notes 指针，不加 uses，陈述文本未动**）】
  本卡标题与陈述 (1)(b) 的 `(α^μ_n)^† = α^μ_{−n}` 在文献里是「径向量子化中的厄米共轭」
  这条通用规则在 h = 1 的 ∂X^μ 上的实例（规则的精确表述现见
  worldsheet.radial-hermitian-conjugation 的 (1)(2)(3)，其 (5) 把本卡列为五个实例之一）。
  **但本卡没有把那张卡列为 uses，这是有意的**：
  本卡的 Lean 定义**不经过**那条规则——`Fock.pairing` 由**普遍性质**定义
  （⟨|k⟩,|k⟩⟩ = 1 + 产生与湮灭互为伴随 ⟹ 唯一，`Fock.pairing_unique`），
  整条论证里没有围道、没有 z、没有反演。那张卡的 own status 是 rigorous 但
  effective 是 physical-argument（被 worldsheet.state-operator-isomorphism 封顶）；
  若把它列为 uses，会**无理由地**把本卡的 formalized 压成 physical-argument，
  那是纯由记账方式造成的降级。两条路线在本图中是独立的：Lean 路线更强，
  文献路线更通用（它对振子与 L_m 之外的场也给规则，这正是
  worldsheet.vertex-operator-adjoint 与 worldsheet.ddf-operators-adjoint 不得不走它的原因）。
  同一判断也适用于 worldsheet.virasoro-generators-adjoint。
