    loc: "formal/StringFormal/NoGhost/Fock.lean :: StringFormal.NoGhost.Fock.pairing_unique"
    note: |
      本仓库，合并提交 2fcf86a。`lean_decl` 只填得下一个名字，故填了刻画整个对象的唯一性定理
      `pairing_unique`（对应陈述 (1)）。陈述其余各条对应的声明：
        (2) 对称性  → `Fock.pairing_comm`（及 `Fock.pairing_flip`）
        (2) 对角形  → `Fock.pairing_monomial_monomial`
        (3) level 正交 → `Fock.pairing_eq_zero_of_level_ne`
        (4) 类时 −n → `Fock.pairing_X_X_minkowski_timelike`
        (4) 类空 +n → `Fock.pairing_X_X_minkowski_spacelike`
      伴随关系本身（(1)(b) 对 `Fock.pairing` 成立）是 `Fock.pairing_creation_left` /
      `Fock.pairing_creation_right`；被形式化的型定义是 `Fock.pairing`，
      mostly-plus 度规是 `Fock.minkowski`。全部无 sorry。
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/FockSigned.lean :: StringFormal.NoGhost.Fock.pairing_indefinite、pairing_indefinite_field"
    note: |
      本仓库，合并提交 11b4c0f。陈述 (4) 末句「于是当 R 是有序域且 D ≥ 2 时该型不定」的
      机器检查（2026-09-11 补，关闭推导 --via-lean 的 gap (v)）。陈述括号里写的
      「在 Lean 中未单列为定理」是 2026-09-10 的事实，按陈述不可变原则保留原文；
