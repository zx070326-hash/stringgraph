notes: |
  ★★【本卡为什么存在（curator，2026-09-11，klein-mobius）】
  (10.8.11) 在本图此前**没有独立节点**：它只活在
  worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences 的 summary 第 (2) 步里，
  那条推导的 gaps 逐字记着「**Klein 瓶 (10.8.7)–(10.8.11) 与 Möbius 带 (10.8.12)–(10.8.18)
  两支仍无节点** … 那两支的模变换与长柱极限在图上仍悬空」。本卡把 Klein 那一支落到结构上，
  与 worldsheet.superstring-cylinder-amplitude-closed-channel-v2（圆柱那一支）成对。

  【与另外两张同族卡的分工】
  · 圆柱：worldsheet.superstring-cylinder-amplitude-closed-channel-v2，(10.8.1)–(10.8.4)，∝ n²；
  · Klein 瓶：**本卡**，(10.8.7)–(10.8.11)，∝ 2¹⁰，**无边界故无 Chan–Paton**；
  · Möbius 带：worldsheet.superstring-mobius-strip-amplitude-closed-channel，(10.8.16)–(10.8.18)，
    ∝ ±2n·2⁵；
  · 三者相加（R–R 侧）给 (10.8.19) 的 (n ∓ 32)² 与 SO(32)：
    worldsheet.type-i-tadpole-cancellation-so32-v2。
  三张卡的**公因子**是 K ≡ (V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(e^{−2s})]；本卡的系数是 **2¹⁰**。
  ⚠ 抽取记录 §0.4(a) 的独立算术交叉核验正是把三者的系数 −n²、−2¹⁰、±2n·2⁵ 相加得 −(n ∓ 32)²
  （因 2¹⁰ = 32²），**本卡的 2¹⁰ 是那次核验的三个输入之一**。

  【16 的物理释义（**不进断言**，见「不断言 (d)」）】
  把 s → ∞ 极限下方括号里的常数读作「十维无质量闭弦态的计数」，对照玻色弦 Vol.1 (7.4.4) 的 24
  （26 维横向数），是标准的物理读法。⚠ **这是本图/抽取者的释义，不是原书在 (10.8.11) 处的断言**；
  原书只印出这个数。口径与 worldsheet.superstring-cylinder-amplitude-closed-channel-v2 一致。

  【2¹⁰ 的来历与它**不**能被说成什么】(7.4.19) 的 2²⁶ ↔ 本卡的 2¹⁰，Möbius 的 2¹³ ↔ 2⁵；
  原书**明写**三个面的玻色部分就是 Vol.1 (7.4.1)/(7.4.15)/(7.4.22) 'converted to D = 10'
  ⇒「同一组公式在不同 D 下取值」有原文背书。但原书**从不写** 2^D / 2^{D/2} 的符号形式，
  也不把两个数并列比较 ⇒「2^{D/2} 是普适计数」**没有**文献支持（抽取记录 #E74 (ii)）。
  ⚠⚠ 本图手上有**三个各自独立出处的 32**：(a) 本节的世界面重标度计数；
  (b) GSW (10.2.36) 的积分变量替换 √z_r → z_r；(c) GSW 六边形奇数扭转分布数
  Σ_{k 奇} C(6,k) = 2⁵（本图节点 math.hexagon-odd-twist-count）。
  **没有任何一本书解释这三者为什么相等**（抽取记录 Q5）；**本图不得擅自合并**。

  【本卡不与 consistency.type-i-hexagon-so32-iff 建边】理由同
  worldsheet.type-i-tadpole-cancellation-so32-v2 的（限定 4）：§10.8 全节不出现 'anomaly'，
  §10.6 p.31 把发散与时空反常并列而非串联，§12.2 p.102 逐字说 type I 的规范群由 tadpole 相消定。

  【整体符号那一条值得单独记住】脚注 8 说的是：NS–NS 迹的 + 由**引力子**定、R–R 迹的 − 由
  **(10.6.17)** 定。前者在本图落到 worldsheet.type-ii-massless-spectrum（**inferred**，
  原书不给式号）；后者落到 worldsheet.type-i-unoriented-closed-spectrum（**非 inferred**，
  原书明写式号）。⇒ 本卡的 (10.8.10a,b) 与 (10.8.11) 的整体符号**不是纯计算的产物**。
