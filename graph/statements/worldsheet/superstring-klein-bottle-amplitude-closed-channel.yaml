id: worldsheet.superstring-klein-bottle-amplitude-closed-channel
kind: proposition
title: type I Klein 瓶真空振幅中 NS–NS 交换那一项的闭弦通道形式 (10.8.11)：Z_{K₂,0} = i(2¹⁰V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(e^{−2s})]
statement: |
  **设定（是陈述的一部分）**：type I 弦——十维平坦时空、**无取向**（Ω 投影）的开 + 闭超弦。
  考虑 **Klein 瓶** K₂ 的单圈真空振幅：周长 2π、长 2πt 的圆柱两端经宇称反转 Ω 缝合
  （spectrum.one-loop-klein-bottle-amplitude 的几何），其唯一的模记作 t ∈ (0, ∞)，**无模群**。
  Klein 瓶**没有边界**，故本卡不含 Chan–Paton 因子。
  费米迹记号 Z^α_β(τ) = Tr_α[q^H exp(πiβQ)] 按
  worldsheet.modular-invariance-requires-eight-transverse-fermions（原书 §10.7 (10.7.7)–(10.7.9)，
  **这些迹是「对一对维数」取的**，故下面出现四次幂）。
  **归一化（必须带上）**：原书 p.38 逐字 'Note that the GSO and Ω projection operators each
  contribute a factor of ½.'——这正是下式测度 dt/8t 的来源（对照玻色版 (7.4.15) 的 dt/4t）。
  **闭弦通道的长度**取 **s = π/2t**（原书 p.40 逐字给出三拓扑的换算：圆柱 π/t、Möbius π/4t、
  Klein 瓶 π/2t）。

  **断言**：
    **(1) Klein 瓶上的 GSO 投影算符**：
          [(1 + exp(πiF))/2] · [(1 + exp(πiF̃))/2]                                (10.8.7)
    **(2) 路径积分的边界条件**：在迹里插入 R = Ω exp(πiβF + πiβ̃F̃)，则
          ψ(w + 2πit)  = −R ψ(w) R^{−1}  = −exp(πiβ) ψ̃(w̄)                        (10.8.8a)
          ψ̃(w̄ + 2πit) = −R ψ̃(w̄) R^{−1} = −exp(πiβ̃) ψ(w)                        (10.8.8b)
        （原书逐字：'with the usual extra sign for fermionic fields'），由此
          ψ(w + 4πit) = exp[πi(β + β̃)] ψ(w)                                       (10.8.9)
    **(3) 扇区识别与两个分迹**：**NS–NS 交换**来自在 σ² → σ² + 4πt 下**反周期**的扇区，
        即迹里权重为 **Ω exp(πiF)** 或 **Ω exp(πiF̃)** 的两项，**且这两个迹相等**。
        NS–NS 态与 R–R 态**都**对这些迹有贡献，分别给出
          NS–NS：  q^{−1/3} ∏_{m=1}^∞ (1 + q^{2m−1})⁸ = Z⁰₀(2it)⁴                 (10.8.10a)
          R–R：   −16 q^{2/3} ∏_{m=1}^∞ (1 + q^{2m})⁸ = −Z¹₀(2it)⁴                (10.8.10b)
        其中 q = exp(−2πt)。
    **(4) 闭弦通道（s 积分）形式**：
          Z_{K₂,0} = iV₁₀ ∫₀^∞ (dt/8t)(4π²α't)^{−5} η(2it)^{−8}[Z⁰₀(2it)⁴ − Z¹₀(2it)⁴]
                   = i (2¹⁰V₁₀/(8π(8π²α')⁵)) ∫₀^∞ ds η(is/π)^{−8}[Z⁰₀(is/π)⁴ − Z⁰₁(is/π)⁴]
                   = **i (2¹⁰V₁₀/(8π(8π²α')⁵)) ∫₀^∞ ds [16 + O(exp(−2s))]**       (10.8.11)
        其**玻色部分**就是 Vol.1 (7.4.15) 换到十维（原书逐字：'The bosonic part is (7.4.15)
        converted to D = 10.'）。
        ⚠ 第三行方括号里的 **16** 在本断言里只是**原书印出的那个数**；它「是什么的计数」
        不属本断言，见「本命题不断言 (d)」。

  **本命题不断言**：
    (a) ⚠⚠ **不断言 (10.8.10a,b) 两个迹的整体符号是算出来的**。原书脚注 8（p. 41）逐字：
        'In evaluating these, note that only states with identical ψ and ψ̃ excitations contribute
        to traces containing Ω. The signs from exp(πiF) or exp(πiF̃) just cancel the signs from
        anticommuting ψs past ψ̃s, so that all terms in each trace have the same sign. **The overall
        sign in the NS–NS trace (positive) can be determined from the graviton, and the overall
        sign in the R–R trace (negative) from the argument (10.6.17).**'
        ⇒ (10.8.10a) 的 **+** 靠**引力子**这一物理输入定，(10.8.10b) 的 **−** 靠 §10.6 (10.6.17)
        的论证（worldsheet.type-i-unoriented-closed-spectrum 的 Ṽ_{s'}V_s = −V_sṼ_{s'}）定，
        **两者都不是本处算出来的**。本卡照实登记这一条。
    (b) **不断言 R–R 侧的值，也不断言相消**。'Z_{K₂,1} = −Z_{K₂,0}'（原书由 §10.7 的超对称
        论证：总费米配分函数为零）**不在本卡的断言里**；理由与
        worldsheet.superstring-cylinder-amplitude-closed-channel-v2 的「不断言 (a)」相同：
        算 Z_{K₂,0} 本身不需要它。
    (c) **不断言 Klein 瓶那一支的 tadpole 相加、(n ∓ 32)² 与 SO(32)**。那是
        worldsheet.type-i-tadpole-cancellation-so32-v2。
    (d) **不断言 (10.8.11) 第三行方括号里的 16「是什么的计数」**。本卡只断言原书印出的那个数。
        「16 是十维无质量态的计数（对照玻色弦 Vol.1 (7.4.4) 的 24）」是**抽取记录的转述
        （gloss）**，原书在 (10.8.11) 处不说 16 是什么。该释义移到 notes。
        ⚠ 同样**不断言**这个 16 与本图别处出现的 16 相等或同源
        （口径与 worldsheet.superstring-cylinder-amplitude-closed-channel-v2 的「不断言 (h)」一致）。
    (e) ⚠⚠ **不断言 2¹⁰ 是「2^D 的普适计数」**。原书**从不写符号形式 2^D 或 2^{D/2}**，
        也从不把 Vol.1 (7.4.19) 的 2²⁶ 与本处的 2¹⁰ 并列比较；两者「出自同一组公式在不同 D 下取值」
        这一点**有**原文背书（三条 'converted to D = 10' 的明写引用），而「2^{D/2} 是普适计数」
        **没有**（抽取记录 #E74 的分层裁决 (ii)）。
        ⚠ 尤其**不得**把本卡的 2¹⁰ / Möbius 的 2⁵ 与 GSW 六边形的 2⁵
        （math.hexagon-odd-twist-count、consistency.type-i-hexagon-so32-iff）说成同源：
        **没有任何文献解释这三个 32 为什么相等**（抽取记录 Q5）。
    (f) **不断言由 (10.8.11) 第一行到第二行的模变换步骤**。原书在此**直接写等号**，
        既不重述 (10.8.3) 的两条模变换，也不写 s = π/2t 的换元过程与 η(2it)、Z^α_β(2it)
        在该换元下的具体变换。本图未展开这一步（见推导的 gaps）。
    (g) **不断言 (10.8.3) 第二式的模变换是无限定的**。Z^α_β(it) = Z^β_{−α}(i/t) 是 §10.7
        (10.7.14) 的特例，而 (10.7.14) 在原书里**明确带 'naive' 的限定**（逐字：'The reason
        these modular transformations are naive is that there is no diff-invariant way to define
        the phase of the path integral for purely left-moving fermions'）。
        **§10.8 直接使用而不重述这个限定**；本卡照实记下，故断言 (4) 继承该限定。
    (h) **不断言前缀里 α' 的幂次取自页图读数**。本卡采纳 **(8π²α')⁵**（单撇），根据是
        **复算 + 量纲 + 跨卷控制组**三重复核，**不是**像素判读：
          (i) 独立复算闭合：Klein 瓶取 s = π/2t、(4π²α't)^{−5}，复算给
              2¹⁰/(8π(8π²α')⁵)（抽取记录 §0.4(b) 逐字：「Klein 瓶（s = π/2t，(4π²α't)^{−5}）
              复算同样给出 2¹⁰/(8π(8π²α')⁵)」）；
          (ii) 量纲：V₁₀ 需要 length¹⁰，(8π²α')⁵ 正好给 length¹⁰；
          (iii) 跨卷一致性：Vol.1 对应式 (7.4.19) 用 (8π²α')¹³。
        ⚠ **页图上的小字号读数不可复现**：读出 α'² 的位置与「落在被降为 \scriptstyle 的分式分母里」
        **完全相关**；同一式**首行**以全字号出现的 (4π²α't)^{−5} 读数干净。第二轮单页重渲染
        p.41 的 (10.8.11) **读作单撇**。⇒ 判为**渲染假象**，**不判为原书排印错误**；
        **不得援引 (13.3.12) 的「书错」先例**（那处读数可复现，本处不可复现）。
        ⚠ **残余不确定性（照实登记，不因此降级）**：两轮复核仍只用了**同一条成像管线**
        （Cambridge Core PDF → 页图渲染）；官方勘误表取不到（KITP errata 页 404）。
    (i) **不断言 cross-cap 态 |C⟩ 的形式，也不断言由路径积分导出本式**。玻色版 (7.4.15) 原书
        留作习题 7.13、cross-cap 态留作习题 7.15（spectrum.one-loop-klein-bottle-amplitude 的
        「不断言」已写明）；超弦版本书正文亦不做路径积分推导。
    (j) **不断言带顶点算子的 Klein 瓶振幅**（原书此处只算真空振幅；脚注 7 指出加顶点算子后
        NS–NS 与 R–R 的逐拓扑相消不再成立，那是 tadpole 卡的内容）。
