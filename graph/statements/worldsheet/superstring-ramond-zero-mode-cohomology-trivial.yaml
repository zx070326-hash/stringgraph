sources:
  - ref: lian-zuckerman-1989
    loc: "**Theorem 2.7**, p.310，逐字：'Assume p ≠ 0: the above complex has zero cohomology. Thus C_rel(p,0) = D_R F(p,0).'；证明同页逐字：'For p ≠ 0, say p¹ ≠ 0, we have {D_R|_F, d¹₀/p¹} = 1. Applying this formula on Ω ∈ Ker D_R|_F, one sees that Ω ∈ Im D_R|_F.'（'the above complex' = (ℱ, D_R|_ℱ)，ℱ = Ker b₀ ∩ Ker β₀ ∩ Ker K）"
    note: |
      literature/extractions/lian-zuckerman-1989.md **E4**（第一轮，全文 35 页逐页读图，L1；陈述与证明**都标了逐字**）。
      ★ 证明是**印出的**且**显式构造**收缩同伦（ε = d¹₀/p¹），不是「一点思考就知道」式的断言；
      这是本卡推导标 rigorous 的直接依据。
      ★ E4 备注逐字：「这是 Corrigan–Goddard / Henneaux『零模 supercharge 上同调平凡』的数学版；
      Definition 2.11 的 Remark 称之为 contracting homotopy ε，{D_R, ε} = 1。」
  - ref: lian-zuckerman-1989
    loc: "**Definition 2.11 之后的 Remark**, p.311，逐字：'Recall that (Theorem 2.7) there is a contracting homotopy ε : ℱ → ℱ such that {D_R, ε} = 1. Then one finds that ⟨u, εv⟩_ℬ = ⟨u, εD_R v̂⟩_ℬ = ⟨u, v̂⟩_ℬ.'"
    note: |
      L1 逐字（extraction §10.2，researcher 第四轮页图，期刊 pp.311–317 七页一次取全）。
      ★ **本条是「收缩同伦形式」写进本卡断言的依据**：把 Theorem 2.7 读成「存在 ε 使 {D_R, ε} = 1」
      是**原作者自己的引用方式**（"Recall that (Theorem 2.7) there is a contracting homotopy ε"），
      不是本图的推断。
  - ref: lian-zuckerman-1989
    loc: "**Definition 1.6**（Q, K, D_R, U 的显式模式和；K = π(L₀) + ρ(L₀)，D_R = π(G₀) + ρ(G₀)）与 **Proposition 1.7**, pp.307–308，逐字含 '(ix) D_R² = K'；**Definition 2.2**, pp.308–309（ℬ、ℱ、C_rel 的定义：κ=0 时 ℬ = Ker b₀ ∩ Ker β₀，ℱ^n = ℬ^{n−κ} ∩ Ker K，C^n_rel = ℱ^n ∩ Ker D_R）；**p.302**（超 Virasoro 关系、g^{μν} 号差 ((D−1)+, 1−)）；**p.303**（V(p,κ) = R(p,κ) ⊗ U(κ)，U(κ) = C[α^μ_{−n}, d^μ_{−n+κ}]|p⟩；'p will always be assumed non-zero until Sect. 5'）；**p.306 (7)(8)**（零模表示 T₀ ⊕ T₁）；**p.308**（'From now on, we will take D = 10'）"
    note: |
      L1（extraction §1 / E1 / E2）。本条供给 (H1)–(H7) 的记号语境与 D_R² = K。
      ⚠ **Proposition 1.7 的证明大半外包给 [13] = Ohta、[15] = Terao–Uehara**（E1 逐字：
      '(iv) to (viii) are obtained by straightforward computations, some of which are done in [13, 15, 19]'）；
      (ix) 属于该批之列。本卡把 D_R² = K 写成设定 (H6) 而非断言，即因此。
tags: [superstring, brst, rns, ramond-sector, cohomology, contracting-homotopy, lian-zuckerman]
notes: |
  【为什么立卡（curator 2026-09-11，lz-thm27）】
  worldsheet.superstring-relative-complex-character-signature--via-lian-zuckerman-1989 的 gaps 首条
  （reviewer-batch29）逐字：「**LZ Theorem 2.7（R 扇区 D_R 上同调平凡 / 收缩同伦）无卡、无边**：
  Prop 2.14 的证明两次显式引用它（§10.4），本推导只在 summary/notes 提及；建卡后应加非 inferred 边。」
  本卡关闭该 gap。它同时是
  worldsheet.superstring-relative-complex-nondegenerate-form（(H4) 非退化性那张卡）的两条来源之一
  （p.311 过渡句逐字 'Now using **Theorem 2.7** and **Proposition 2.10** …'）。

  【编号陷阱：与 FGZ 的 Theorem 2.7 同号不同物】
  本图已有 worldsheet.bosonic-relative-cohomology-vanishing / -dimension 两卡，出处是
  **FGZ 1986 Theorem 2.7(i)(ii)**（玻色弦，Q_B 上同调的消灭定理与维数公式）。
  **LZ 1989 的 Theorem 2.7 是完全不同的命题**（超弦 R 扇区，微分是 D_R 不是 Q_B，
  结论是「零模复形上同调平凡」而不是「消灭定理」）。引用时必须写全「LZ 1989 Theorem 2.7」。
  LZ 一侧与 FGZ Theorem 2.7 对应的是 **Theorem 2.4**（消灭定理），已立卡
  worldsheet.superstring-relative-cohomology-vanishing-v2。

  【为什么「零上同调」与「收缩同伦」写在一张卡】
  两者由同一条两行论证（同一个公式 {D_R|_ℱ, d¹₀/p¹} = 1）同时给出，LZ 自己也在 p.311 的 Remark 里
  把后者直接称作 "Theorem 2.7"。按「一个节点一个命题」的判据（文献把两件事写在一个定理里
  **而它们被分别推导**时才拆），此处不拆。下游引用时在 depends_on note 写明用的是哪一面：
  Prop 2.14 的证明用「C_rel(p,0) = D_R ℱ(p,0)」（κ=0 支与 Lemma 2.14.3 的基计数），
  Definition 2.11 的 Remark 用「ε」。

  【与物理文献的对应】E4 备注：这是 Corrigan–Goddard / Henneaux「零模 supercharge 上同调平凡」的
  数学版。本图没有那两篇的卡，也没有登记到 sources.bib，故本卡不建那条边（LZ 正文亦**不引 Henneaux**，
  见 extraction §3 逐字）。
