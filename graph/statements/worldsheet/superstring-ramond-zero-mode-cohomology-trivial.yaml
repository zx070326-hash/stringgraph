id: worldsheet.superstring-ramond-zero-mode-cohomology-trivial
kind: proposition
title: R 扇区零模复形的上同调平凡（Lian–Zuckerman 1989 Theorem 2.7）：p ≠ 0 时 (ℱ(p,0), D_R|_ℱ) 上同调为零，故 C_rel(p,0) = D_R ℱ(p,0)
statement: |
  **设定**（数学侧表述，照 lian-zuckerman-1989 的记号；与
  worldsheet.superstring-relative-complex-character-signature 的 (H1)(H2)(H5) 同口径，
  故意重写以使本卡自足）。取 N = 1 超 Virasoro 代数（math.super-virasoro-algebra），
  本卡只讲 **Ramond 扇区 κ = 0**。
    (H1) **临界维数**：物质部门 D = 10 个自由 X^μψ^μ（LZ p.308 逐字 "From now on, we will take D = 10"），
         鬼部门 λ = 2 的 bcβγ 一阶 SCFT。
    (H2) **动量**：固定 p，**p ≠ 0**（LZ p.303 逐字 "p will always be assumed non-zero until Sect. 5"）。
    (H3) **算符**（LZ Definition 1.6）：K := π(L₀) + ρ(L₀)（物质 + 鬼场的总 L₀），
         D_R := π(G₀) + ρ(G₀)（物质 + 鬼场的总 G₀）。两者都是**奇**算符/偶算符之别按超代数分次。
    (H4) **两个空间**（LZ Definition 2.2）：
           ℱ(p,0) := Ker b₀ ∩ Ker β₀ ∩ Ker K   （鬼零模条件 + 质量壳条件，**不**含 D_R 条件）；
           C_rel(p,0) := ℱ(p,0) ∩ Ker D_R      （再加 G₀ 条件，即相对复形本身）。
    (H5) **R 扇区 βγ 零模表示**取 LZ p.306 (7)(8) 的 T₀ ⊕ T₁。本卡的对象是这个选择下的空间。
    (H6) **(ℱ(p,0), D_R|_ℱ) 是复形**：由 LZ Proposition 1.7(ix) 的 D_R² = K 与 ℱ(p,0) ⊂ Ker K 得
         (D_R|_ℱ)² = 0；本卡把这一条当作设定的一部分（它是 LZ 说 "the above complex" 的根据）。
    (H7) **物质费米零模**：D_R 含 p·d₀ 项，其中 d^μ₀ 是 R 扇区物质费米零模，
         {d^μ₀, d^ν₀} = g^{μν}（LZ p.302 的 Lorentz 度规，号差 ((D−1)+, 1−)）。

  **断言**（Theorem 2.7，p.310，逐字 "Assume p ≠ 0: the above complex has zero cohomology.
  Thus C_rel(p,0) = D_R ℱ(p,0)."）：在 (H1)–(H7) 之下，

      **复形 (ℱ(p,0), D_R|_ℱ) 的上同调为零**，即 Ker D_R|_ℱ = Im D_R|_ℱ；
      **等价地 C_rel(p,0) = D_R ℱ(p,0)**（相对复形恰是 D_R 在 ℱ(p,0) 上的像）。

  **等价的收缩同伦形式**（LZ 在 Definition 2.11 之后的 Remark 里就是这样引用 Theorem 2.7 的，
  p.311 逐字 "Recall that (Theorem 2.7) there is a contracting homotopy ε : ℱ → ℱ such that
  {D_R, ε} = 1"）：**存在 ε : ℱ(p,0) → ℱ(p,0) 使 {D_R|_ℱ, ε} = 1**；LZ 的证明给出显式取法
  ε = d^1₀ / p^1（任一使 p^1 ≠ 0 的坐标方向）。

  **本命题不断言**：
    (a) 不断言任何 **Q_B**（BRST 微分）上同调的性质——本卡的微分是 **D_R**（总 G₀），不是 Q_B；
        Q_B 上同调的消灭定理是 Theorem 2.4（worldsheet.superstring-relative-cohomology-vanishing-v2），
        与本卡是两条独立的结果。
    (b) 不断言 NS 扇区（κ = ½）的任何事：NS 没有 β₀、γ₀ 零模，ℱ(p,½) = C_rel(p,½)，本卡的命题为空。
    (c) 不断言分次形式的结论：LZ 在 p.313 由本定理推出 dim ℱ^n(p,0) = 2 dim C^n_rel(p,0)（式 (6)），
        那一步另需「D_R 保持相对次数」，本图未逐字取得该断言，故不写进本卡。
    (d) 不断言 ε 的唯一性（LZ Remark 末句逐字 "It is remarkable that the right-hand side of this
        equation is independent of the choice ε." 说的是 ⟨u, εv⟩_ℬ 与 ε 的选择无关，不是 ε 唯一）。
    (e) 不断言 p = 0 的情形（LZ Proposition 5.5：p = 0 时消灭定理不成立；本卡对 p = 0 无内容）。
    (f) 不断言 D_R² = K 或 Proposition 1.7 的任何一条——那些写进 (H6)(H3) 作为设定，本图未单独立卡。
    (g) 不断言公式对其他 R 扇区零模表示（FOK / Henneaux 的 C[γ₀] 等）成立。
