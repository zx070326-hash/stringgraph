id: worldsheet.heterotic-left-moving-zero-point-constants
kind: proposition
title: 杂化弦左移一侧的零点能常数（横向计数）：λ^A 反周期（NS 型）时 −1，周期（R 型）时 +1
statement: |
  在 worldsheet.heterotic-so32-projections 的 SO(32) 杂化弦中，左移部门由 8 个横向 X^i
  与 32 个 λ^A 组成。用「零点能助记法」（每个周期玻色子 −1/24、每个周期费米子 +1/24、
  每个反周期费米子 −1/48）逐项相加，左移零点能常数为
    **λ^A 反周期（NS 型）**： −8/24 − 32/48 = **−1**,
    **λ^A 周期（R 型）**  ： −8/24 + 32/24 = **+1**            （(11.2.14)，逐字算式）。

  即左移一侧的质量壳偏移与**玻色弦**相同（NS 型的 −1 就是玻色弦的截距），
  而右移一侧仍是超弦的偏移（0 于 R、−1/2 于 NS，见 worldsheet.closed-superstring-mass-shell）。

  **直接推论（原书逐字）**：'The left-moving NS ground state is therefore a tachyon.'
  即左移基态（λ 反周期、无激发）的 L_0 偏移为 −1，是**左移意义下的快子**。
  第一激发态 λ^A_{−1/2}|0⟩_NS（(11.2.15)）被投影 exp(πiF) = 1 去掉。

  **本命题不断言的内容**：
    (1) **不断言理论有快子**。左移的 −1 能否成为物理快子取决于能级匹配，
        见 worldsheet.heterotic-so32-tachyon-free。
    (2) 不断言 E₈ × E₈ 情形的常数（λ 分成两组 16 时另有 (11.2.24) 的算式，
        见 worldsheet.heterotic-e8e8-construction）。
    (3) 「横向计数」是光锥式的记账：这里数的是 8 个 X^i 而不是 10 个 X^μ，
        与 (10.5.4)/(10.5.5) 的体例一致。
