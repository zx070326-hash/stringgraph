sources:
  - ref: polchinski-1998-v2
    loc: "§11.2, eq. (11.2.14) 与其后一句, p. 52（逐字算式 −8/24 − 32/48 = −1 与 −8/24 + 32/24 = +1；'The left-moving NS ground state is therefore a tachyon.'）；(11.2.15) 即被投掉的第一激发态"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E56；式号与两条算式逐页读到原书页图）。
  - ref: polchinski-1998-v2
    loc: "§10.2, (10.2.13) 上方, p. 7（零点能助记法的逐字陈述：'Each periodic boson contributes −1/24. Each periodic fermion contributes +1/24 and each antiperiodic fermion −1/48.'）；§10.5, (10.5.4)/(10.5.5), pp. 21–22（横向计数的体例）"
    note: |
      L1（E19）。(11.2.14) 逐项写出的三个数就是这条助记法；本图对应节点
      worldsheet.rns-matter-normal-ordering-constants。
tags: [heterotic, so32, zero-point-energy, normal-ordering, intercept]
notes: |
  【算术核对（本图内部）】8 × (−1/24) = −1/3；32 × (−1/48) = −2/3 ⇒ NS 型合计 −1 ✓；
  32 × (+1/24) = +4/3 ⇒ R 型合计 −1/3 + 4/3 = +1 ✓。与原书 (11.2.14) 逐字一致。

  【符号约定】本卡写的是**加在 L_0 里的常数**（Vol.2 体例，见 conv.intercept-sign-a 与
  worldsheet.rns-matter-normal-ordering-constants 的换算说明）：
  左移 NS 型的 −1 对应通行记号的截距 a = 1（玻色弦），R 型的 +1 对应 a = −1。
  ⚠ Vol.1 用 A，Vol.2 用 a^m/a^g，两者同号；通行的 a 与它们反号。混用会差一个符号。

  【助记法本身在本图无独立支撑】它出自 Vol.1 §2.9 末（抽取记录 Q2 有两条 Vol.2 的一手引用
  证实 §2.9 末确有此助记法），但 Vol.1 §2.9 本轮未读页图，本图也没有 ζ 正规化推导它的节点
  （worldsheet.zeta-regularized-sum-of-integers 只覆盖玻色子情形）。已在推导 gaps 记明。
