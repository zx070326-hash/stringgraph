id: worldsheet.no-ghost-theorem-brst
kind: proposition
title: BRST 版无鬼定理：D = 26 时 Q_B 的相对上同调等距同构于 24 个横向振子的 Fock 空间
statement: |
  记号与设定沿用 worldsheet.brst-quantization：物质部门是 D 个自由玻色子 X^μ（中心荷 c^m = D，
  度规 mostly-plus），鬼场是权 (λ, 1-λ) = (2, -1) 的 bc 系统（c^g = -26），
  Q_B 是那里定义的 BRST 荷，作用在受限模上。设 D = 26，故 Q_B^2 = 0
  （worldsheet.critical-dimension-brst），BRST 上同调有定义。

  动量条件：固定动量 k，并取一组光锥坐标使 k^+ ≠ 0；等价地，存在类光 k_0 使 k·k_0 ≠ 0。
  k^+ = 0 的扇区（特别是 k = 0）不在本陈述范围内。

  相对复形：C_rel(k) = {|ψ⟩ ∈ F_matter(k) ⊗ F_ghost : b_0|ψ⟩ = 0, L_0|ψ⟩ = 0}，
  其中 L_0 = L^m_0 + L^g_0 - 1 是总 Virasoro 零模。Q_B 保持 C_rel(k)（因为 {Q_B, b_0} = L_0），
  故可定义相对上同调 H_rel(k) = ker(Q_B|_{C_rel}) / im(Q_B|_{C_rel})。

  鬼数归一化：取 SL(2,C) 不变真空 |0⟩ 的鬼数为 0、gh(c_n) = +1、gh(b_n) = -1，
  于是鬼场基态 |↓⟩ = c_1|0⟩ 的鬼数为 1。（Polchinski 用对称归一化 gh(|↓⟩) = -1/2，
  与此相差常数平移 3/2；本节点采用前者。）

  相对复形上的内积取 ⟨ψ, ψ'⟩_rel := ⟨ψ| c_0 |ψ'⟩（鬼场零模归一化 ⟨↓|c_0|↓⟩ = ⟨↓|↑⟩ = 1），
  它是 C_rel(k) 上的（不定）厄米形式，且 Q_B 关于它自伴，故在上同调上诱导良定义的形式。

  横向空间：H^⊥(k) := 由 α^i_{-n}（i = 2..25，即 D-2 = 24 个横向方向，记号同
  worldsheet.light-cone-quantization；n ≥ 1）作用在 |0; k⟩ ⊗ |↓⟩ 上生成的
  Fock 空间中满足 L_0 = 0（即 α' k^2 + N - 1 = 0）的子空间；其上的内积是横向振子代数的正定内积。

  断言（D = 26，k^+ ≠ 0）：
  (1) H_rel(k) 集中在鬼数 1：鬼数 ≠ 1 的相对上同调为零；
  (2) 鬼数 1 处 H_rel(k) 与 H^⊥(k) 等距同构（保内积的线性双射）；
  (3) 特别地，⟨·,·⟩_rel 在 H_rel(k) 上诱导的内积**正定**（不只是半正定）。
uses_conventions: [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.4 The no-ghost theorem, pp.137–142；定理陈述在 p.138；关键式号 (4.4.1)（L_m = L^X_m + L^K_m + L^g_m）、(4.4.6)、(4.4.7)、**(4.4.9)**（Q_B = Q_1 + Q_0 + Q_{−1}）、(4.4.10)、(4.4.11)、**(4.4.12)**（分级展开 ⇒ Q_1² = 0）、(4.4.13)（Q_1 = −(2α')^{1/2}k⁺Σ_{m≠0}α^-_{−m}c_m）、(4.4.14)（R）、(4.4.15)（S = {Q_1,R}）、(4.4.16)–(4.4.18)、(4.4.19)（|ψ⟩ = (1 − S^{−1}U + …)|ψ_0⟩）、**(4.4.20)**（⟨ψ‖ψ'⟩ = ⟨ψ_0‖ψ_0'⟩，正定性）、**(4.4.21)**（H_OCQ = H_BRST = H_light-cone）、(4.4.22)–(4.4.27)"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐页）——**两处式号错位订正 + 四条假设
      + 内积的非平凡选择**。本条取代旧 note 的「经两个第三方笔记交叉核对（不是核对原书）」】

      ⚠ **式号错位（旧 loc 有两处差一号）**：
        Q_B = Q_1 + Q_0 + Q_{−1}  是 **(4.4.9)**，旧记录写 (4.4.10)；(4.4.10) 是 [N^lc, Q_j] = jQ_j。
        分级展开 ⇒ Q_1² = 0     是 **(4.4.12)**，旧记录写 (4.4.13)；(4.4.13) 是 Q_1 的显式表达式。

      ★ **定理在原书里的确切陈述（p.138，逐字）**：
        "Define the transverse Hilbert space H^⊥ to consist of those states in H that have no
         longitudinal (X⁰, X¹, b, or c) excitations. Since these oscillators are the source of the
         indefinite inner product, H^⊥ has a positive inner product. Light-cone gauge-fixing
         eliminates the longitudinal oscillators directly — the light-cone Hilbert space is
         isomorphic to H^⊥ … **We will show, in the general case, that the BRST cohomology is
         isomorphic to H^⊥. That is, it has the same number of states at each mass level, and has
         a positive inner product. This is the no-ghost theorem.**"

      ★★ **原书定理的四条假设（p.137–139，逐字；本节点的 statement 只覆盖其中的特例）**：
        p.137: "the world-sheet theory consists of **d free X^μ fields including μ = 0, plus some
                compact unitary CFT K of central charge 26 − d**, plus the ghosts. The Virasoro
                generators are a sum L_m = L^X_m + L^K_m + L^g_m (4.4.1).
                **By compact we mean that L^K_0 has a discrete spectrum.**"
        p.138: "**The only information we use about the compact CFT is that it is conformally
                invariant with the appropriate central charge, so there is a nilpotent BRST
                operator, and that it has a positive inner product.**"
        p.139: "**We choose a Lorentz frame in which the momentum component k⁺ is nonzero.**"
      即四条：(i) K 紧致（L^K_0 谱离散）；(ii) K 幺正/内积正定；(iii) 总中心荷使 Q_B 幂零；
      (iv) **k⁺ ≠ 0**。(iv) 尤其要紧：(4.4.13)/(4.4.14) 里 Q_1 与 R 的定义式都含 k⁺ 或 1/k⁺，
      k⁺ = 0 时整个论证崩掉。

      ⚠ **本节点的 statement 是原书定理的特例，不是原书定理本身**：本节点设 K 平凡、d = 26
      （物质部门就是 26 个自由 X^μ）。特例化后 (i)(ii) 自动满足、(iii) 成为 D = 26、
      (iv) 就是本节点已写的 k⁺ ≠ 0。**故本节点与原书不冲突，但也不得声称"这就是 Polchinski §4.4
      的定理"。** 一般形式（d 个 X + 中心荷 26−d 的紧致幺正 CFT）值得单列一张新陈述卡，
      前提是先有「紧致幺正 CFT」的定义卡；本图两者都没有，已列入报告交 lead 排期。

      ★ **内积是一个人为约化的内积（p.135，逐字）**：
        "The inner product (4.3.18a) is not quite the correct one to use in `Ĥ`. It is not well
         defined: the ghost zero modes give zero, while the δ²⁶(k−k') contains a factor δ(0)
         because the momentum support is restricted to the mass shell. **Therefore we use in `Ĥ`
         a reduced inner product ⟨ ‖ ⟩ in which we simply ignore the X⁰ and ghost zero modes.**"
      → (4.4.20) 的 ⟨ψ‖ψ'⟩ 用的就是这个**约化**内积。本节点 statement 里的
        ⟨ψ, ψ'⟩_rel := ⟨ψ|c_0|ψ'⟩ 是另一种处理鬼场零模的写法，**两者的关系本图未核实**；
        「Polchinski (4.4.23) 的归一化未逐字核对」这条旧限定因此仍然成立，且现在知道了
        它的实质：原书那一侧根本不是 (4.3.18a) 而是一个人为约化的内积。

      ★ **§4.4 与 DDF 的连接在原书里是明写的（p.143，逐字）**：
        "Eq. (4.4.19) defines an OCQ-physical state in each cohomology class. For the special case
         of flat spacetime this state can be constructed more explicitly by using the
         **Del Giudice–Di Vecchia–Fubini (DDF) operators**. To explain these we will need to develop
         some more vertex operator technology, **so this is deferred to chapter 8**."
      → 本节点 notes 写「DDF 算子不出现在 Polchinski §4.4 的论证里」——**论证里确实不出现，
        这句仍对**；但「本书从未把 DDF 与 §4.4 接起来」（本图别处的说法）是错的，
        §4.4 → §8.2 的这条边**不必标 inferred**。

      见 literature/extractions/polchinski-1998-v1.md §12.3（E58/Q7、E62–E67）与
      §12.10 表 B 第 9、10、22 项、表 C 第 7、9 项。
  - ref: polchinski-1998-v1
    loc: "§4.1, p.124：「as will be shown in section 4.4」；p.122：「These are in fact equivalent, as will be shown in section 4.4.」；§4.4 开头 p.137：「**In this section we prove that** the BRST cohomology of the string has a positive inner product and is isomorphic to the light-cone and OCQ spectra.」"
    note: |
      【原书核实 2026-09-11，L1】Q7(a)（原书用什么动词）与 Q7(b)（是否引 Goddard–Thorn）关闭：
      (a) **不是 "it can be shown"，是 §4.4 的 "we prove"** 加 §4.1 的 "as will be shown in section 4.4"。
      (b) **§4.1–§4.4 与习题 4.1–4.6 的正文中没有任何文献引用标记**（pp.121–144 逐页看过）。
          Polchinski 的体例是把参考文献集中在书末 References（pp.347–358）。

      ★★ **【2026-09-11 第七轮：书末 References 已取页，Q7(b) 关闭。第 4 章注记 p.350 逐字全文】**
        「**Chapter 4**
         **Classic proofs of the OCQ no-ghost theorem are Brower (1972) and Goddard & Thorn (1972).**
         The basic reference on quantization with constraints is Dirac (1950); a review is
         Henneaux (1985). The BRST symmetry in gauge theory is discussed in modern field theory texts.
         The structure of its cohomology is discussed in Kugo & Ojima (1979). **The BRST operator for
         field theory is derived in Kato & Ogawa (1983); our proof of the no-ghost theorem is loosely
         patterned on the one in that paper.** Other proofs in the BRST context are Freeman & Olive
         (1986), Frenkel, Garland, & Zuckerman (1986), and Thorn (1987).」

      对本节点的四条可执行结论：
      1. **「§4 正文零引文」的结论不变，但不得再据此说「Polchinski 不承认 Goddard–Thorn」。**
         那是全书体例（p.9 逐字「Annotated reference lists appear at the end of each volume.」），
         **书末注记明确把 Brower (1972) 与 Goddard & Thorn (1972) 列为 "classic proofs"**。
      2. ★ **归属关系的硬结论：Polchinski §4.4 的 BRST 证明，作者本人自陈 "loosely patterned on"
         Kato & Ogawa (1983)（`kato-ogawa-1983`），不是 patterned on Goddard–Thorn。**
         GT/Brower 被归类为 **OCQ** 的经典证明，与 §4.4 的 BRST 证明**分属两条路线**；
         GT/Brower 对应的是 §4.1 的 OCQ 陈述 ((4.1.20))，不是本节点。
         ⚠ **"loosely" 是原书用词，不是 "follows" 也不是 "reproduces"，搬进图里必须保留这个限定词。**
      3. **`worldsheet.kac-determinant` / `kac-determinant-v2` 不挂 Polchinski 的决定得到第二重
         独立确认**：书末字母表 pp.353–358 **无 Kac 条目、无 Feigin–Fuchs 条目**（L1 negative
         evidence），且 `thorn-1985`（用 Kac 行列式证无鬼定理）**也不在参考文献里**
         ⇒ **Polchinski 全书不提这条路线**。
      4. 第 4 章注记里另外三条 BRST 侧证明是本项目可直接登记的一手候选：
         Freeman & Olive (1986) Phys.Lett. **B175**, 151；
         Frenkel, Garland & Zuckerman (1986) PNAS **83**, 8442（= 本节点已挂的 `fgz-1986`）；
         Thorn (1987) Nucl.Phys. **B286**, 61（= `thorn-1987`）。
      ⚠ 按 p.347 的免责声明（「To represent accurately the contributions of all who have worked in
      these many areas is an undertaking beyond the scope of this book.」），
      **上述 negative evidence 只说明 Polchinski 没把某文献当入口，不构成对该文献的任何评价。**
      见 literature/extractions/polchinski-1998-v1.md §13.2(a)(b)(c)(g)。
  - ref: fgz-1986
    loc: "Theorem 2.8（第二个同构 T ∩ P ≅ P/rad P 即无鬼定理，FGZ 自述；第一个同构 P/rad P ≅ H^0_∞ 是上同调识别）"
    note: |
      编号已核实（全文五页逐页读毕，见 literature/extractions/brst-cohomology-sources.md §1.3）。
      原文在 Theorem 2.8 之后逐字写：「The second isomorphism of Theorem 2.8 is known as the
      no-ghost theorem in the physics literature (8, 9).」（ref 8 = goddard-thorn-1972,
      ref 9 = brower-1972。）Theorem 2.8 断言三个空间 T ∩ P、P/rad P、H^0_∞
      「All three isomorphic spaces are positive definite and have dimension p_{(24)}(1 - p·p/2)」，
      条件是 D = 26（V(R^{25,1}, p)）与 p ≠ 0。
      本节点的断言 (2)(3) 对应两个同构的复合 H^0_∞ ≅ T ∩ P；第一个同构单独立为
      worldsheet.brst-cohomology-equals-ocq-physical。
      原先引的 "Theorem 1.2" 系凭记忆填写，与原文不符，已订正。
  - ref: fgz-1986
    loc: "Theorem 2.7（(i) p ≠ 0 时 H^i_∞(ℒ, ℒ_0, V(E,p)) = 0 对 i ≠ 0；(ii) dim H^0 = p_{(24)}(1 - p·p/2)），此处已设 D = 26"
    note: |
      本节点断言 (1)「上同调集中在单一鬼数」的来源是 Theorem 2.7(i)，不是 Theorem 2.8。
      编号已核实。（原先此处引的 lian-zuckerman-1989 已删除：该文是
      *BRST cohomology of the super-Virasoro algebras*，处理 RNS 超弦（临界值 c = 15），
      与玻色弦无鬼定理无关，属误引。见 brst-cohomology-sources.md §2.1。）
tags: [bosonic-string, unitarity, brst, cohomology, critical-dimension]
notes: |
  本节点与 worldsheet.no-ghost-theorem-v2 是**两条不同的陈述**：前者关于 Q_B 的相对上同调，
  后者关于旧协变物理态空间 H_phys/H_0。抽取记录 polchinski-1998-v1 的 E58 备注明确指出
  Polchinski §4.1 陈述的是 OCQ 版本、§4.4 证的是 BRST 版本，二者的等价性
  （Kato-Ogawa 定理）本身是一条需要论证的命题，现已建节点：
  worldsheet.brst-cohomology-equals-ocq-physical（= FGZ Theorem 2.8 的第一个同构）。

  本节点断言的是**正定**（不是半正定）：相对上同调已经商掉了 Q_B-恰当态，
  对应 OCQ 侧的"模掉零模态"。

  DDF 算子不出现在 Polchinski §4.4 的论证里（那里用的是光锥振子组合与 light-cone number 分级），
  故 --via-polchinski-4-4 不依赖 worldsheet.ddf-operators-v2。

  k^+ ≠ 0 的条件与 v2 中 DDF 构造要求的 k·k_0 ≠ 0 是同一类条件（审计 B6）：
  两个版本都在零动量/退化扇区外陈述。

  【与 FGZ Theorem 2.8 的逐条对照（2026-09-10 来源核实后补记，陈述不改）】
  FGZ Theorem 2.8 逐字：「The inclusion of P into (V(R^{25,1}, p) ⊗ Λ^0_∞)^{ℒ_0}, p ≠ 0, induces
  a unitary isomorphism from P/rad P ≅ H^0_∞(ℒ, ℒ_0, V(R^{25,1}, p)). The inclusion of T ∩ P into P
  induces a unitary isomorphism T ∩ P ≅ P/rad P. All three isomorphic spaces are positive definite
  and have dimension p_{(24)}(1 - (p·p/2)).」出入如下：
  (a) **次数/鬼数**：FGZ 说上同调集中在半无限次数 0（H^0_∞），本节点说集中在鬼数 1。
      二者相差常数平移 1，来自本节点取 gh(|0⟩) = 0、gh(|↓⟩) = 1 的归一化；FGZ 未给鬼数字典。
      不是矛盾，但本节点的 (1) 是把 FGZ 的 Theorem 2.7(i) 换算过来的结果。
  (b) **动量条件**：FGZ 写 p ≠ 0，本节点写 k^+ ≠ 0。二者等价（类光向量张成 R^{25,1}，
      故 k ≠ 0 时必有类光 k_0 使 k·k_0 ≠ 0），但该等价是初等观察，不出自 FGZ。
      这消解了 --via-fgz 原先记的"FGZ 的动量假设与本陈述是否一致未核实"这一缺口。
  (c) **横向空间的实现**：FGZ 的 T 是 V(E,p) 中被 ℒ^+ 湮灭的正定子空间（Proposition 2.6），
      即 DDF 型的态；本节点的 H^⊥(k) 是由**物质振子** α^i_{-n} 生成的 Fock 空间中 L_0 = 0 的部分。
      二者不是同一个子空间，但作为分级内积空间同构（都是 24 个自由横向振子）。
      本节点断言的是"等距同构"，故断言成立；只是"横向空间"的实现方式与 FGZ 不同。
  (d) **维数公式**：FGZ 给 dim = p_{(24)}(1 - p·p/2)（Theorem 2.7(ii)/2.8），本节点未写维数公式，
      只写 L_0 = 0 即 α' k^2 + N - 1 = 0。二者在 α' = 1/2、mostly-plus 下一致
      （N = 1 - p·p/2 = 1 + m^2/2），无冲突。
  (e) **正定性**：FGZ 逐字写「positive definite」，与本节点断言 (3) 一致（不是半正定）。
  (f) FGZ 还给了第二个证明（Eq. [2.5]–[2.8] 的 Euler–Poincaré signature 论证），自述
      「does not use the existence of the transversal space」。本节点未登记该第二证明，
      它可以成为一条独立的 --via-euler-poincare 推导。
