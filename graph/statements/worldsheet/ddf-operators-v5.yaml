notes: |
  取代 worldsheet.ddf-operators-v4（v4 取代 v3，v3 取代 v2）。按项目规则陈述文本不可变，故新建本节点。

  【相对 v4 的唯一实质改动：拆卡，2026-09-11】
  v4 是"一卡三事"：A^i_n 的**定义**、命题 [L_m, A^i_n] = 0、命题
  [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}。三者的论证性质与形式化路径完全不同：
  定义是"写下一个围道积分"，两条对易关系是需要 OPE / 围道形变的命题。
  按根 CLAUDE.md 原则「一个节点一个命题」与 docs/ROADMAP.md 的待拆清单（lead 已同意），
  本节点只保留**定义**部分，删去 v4 末段的两句代数断言，并在 statement 末尾显式声明
  它们不属于本节点。除此之外，本节点的 statement 与 v4 逐字相同
  （首段到说明 (c) 一字未动）。

  拆卡的直接后果（诚实登记）：v4 作为一张 `status: rigorous` 的**定义**卡，
  把两条从未在本图中被独立论证过的对易关系一起带进了 rigorous，
  下游 worldsheet.no-ghost-theorem-v4--via-goddard-thorn 因此显示为 rigorous。
  拆开后两条对易关系各自挂 physical-argument 的推导（文献里的论证是 OPE + 围道形变，
  且现有来源均未核实到式号），无鬼定理 v4 的有效状态相应下降。
  **这是拆卡暴露出来的既有事实，不是本次改动引入的新弱点。**
  升级路径见两条命题节点各自的 notes 与 formal/TODO.md 的 `ddf-operators` 项。

  【继承自 v4 的说明，未改动】
  v4 相对 v3 的改动（参考方向由射线改为去心直线，说明 (a) 显式写出 λ 的符号）保留，
  理由见 worldsheet.ddf-operators-v4 的 notes（ms.no-ghost-theorem 第三轮审计 A1 附带项 / D2）。
  v3 相对 v2 的改动（归一化由 k_0·p = 1 改为一般 α' 的 2α' k_0·p = 1；显式引入 F(p) 与零模
  α^μ_0 = (2α')^{1/2} p^μ；显式写出 A^i_n 把动量移到 p + n k_0；说明 (c) 的单值性理由）
  同样保留。横向指标范围 i = 2..D-1、参考动量记号 k_0 与态动量记号 p 的区分，与 v2/v3/v4 相同。

  【来源强度】(★) 的一般 α' 形式**没有直接的文献定位**：GSW 与 GT 均在 α' = 1/2（或等价的
  单位 Regge 斜率）归一化下工作，写的是 k_0·p = 1。本节点把 α' 因子按量纲恢复，依据是说明 (c)
  的单值性计算（初等，可自洽核验：α' = 1/2 时退化为 k_0·p = 1）。这属于本项目对文献归一化的
  换算，不是新物理内容；若 researcher 日后拿到 GT 1972 正文或 GSW 原式号，应把 loc 补精确。
  说明 (a) 中"去心直线 vs 射线"的讨论同样**没有文献定位**：文献通常只写"取一个类光 k_0 使
  k_0·p ≠ 0 并归一化"，不讨论参数化。这是本项目为可形式化而做的精确化。

  k_0·p = 0 的扇区（特别是 p = 0）DDF 构造退化，需单独处理（第一轮审计 B6）。

  Fock 空间 F(p) 的形式化定义见 worldsheet.bosonic-fock-space（`formal/StringFormal/NoGhost/Fock.lean`，
  只含振子部分），其上的不定双线性型见 worldsheet.fock-indefinite-form；本节点隐含使用了零模
  α^μ_0 = (2α')^{1/2} p^μ 与动量 p（归一化 (★) 的全部内容都关于 p，A^i_n 还把 p 移到 p + n k_0），
  这部分**尚未形式化**，因此本节点不继承那两个节点的 formalized 状态。

  【Lean 进展 2026-09-11】（自 v4 移入并按拆卡重排。本仓库合并提交 9691057，formal 侧提交 4c12d36，
  新增 `formal/StringFormal/NoGhost/VertexOperator.lean` 与 `formal/StringFormal/NoGhost/DDF.lean`，
  两者均无 sorry，公理只有 propext / Classical.choice / Quot.sound；curator 未自行重跑 lake build。）
  **本节点 status 仍 rigorous，不升 formalized**：A^i_n 本身尚未定义，已形式化的只是它的零件。
  逐条登记，对照 formal/TODO.md 的 `ddf-operators` 项。

  (1) **顶点算子 :e^{i k_0·X}: 的振子部分已形式化**。在**代数** Fock 空间
      （worldsheet.bosonic-fock-space 的 `MvPolynomial (Osc D) R`）上，正规序指数的两半都是初等的：
      产生半 E_-(z) = exp(Σ_{m≥1} (b·α_{-m}/m) z^m) 只是"乘以交换环 Fock D R 的一个显式元素"
      （`Fock.creaExp`，单项式系数即经典指数权）；湮灭半 E_+(z) = exp(−Σ_{l≥1} (b·α_l/l) z^{-l})
      的指数是常系数导子，故 E_+ 就是**变量平移** X_{μ,l} ↦ X_{μ,l} − b^μ T^l（`Fock.vertexSub`），
      一个到 Polynomial (Fock D R) 的代数同态。于是 z^K 系数 `Fock.vertexOsc η b K`
      逐向量是有限和，**全程不用任何收敛性假设**。这里 b^μ = (2α')^{1/2} k_0^μ 是本节点 k_0 的重标度。
      核心恒等式：`Fock.lie_mode_vertexOsc`（[α^μ_p, V_K] = b^μ V_{K−p}，p ≠ 0）与双动量形式
      `Fock.mode_vertexOsc_sub`（左侧模态用参数 a+b、右侧用 a，对**所有** p 含 0 成立）。
      动量塔 `TowerFock D R = ℤ →₀ Fock D R`（第 j 层动量参数 a + j·b）与移位算子 `towerShift n`
      （即零模算符 e^{i n k_0·x}）也已形式化，塔上的 `lie_towerMode_towerVertex` 对**所有** p
      （**含 p = 0**）成立。相对地，单个 Fock 空间上 p = 0 的括号**为零**
      （`Fock.lie_mode_zero_vertexOsc`）：本节点"A^i_n 把动量 p 移到 p + n k_0"这句在形式化里
      是**必需**的，没有动量塔就没有正确的零模关系。塔的索引字典是 j = −N（本节点写作 {k − N k_0}）。
      本节点说明 (b)（k_0² = 0 ⇒ k_0·p 沿塔不变）已形式化为 `dotVec_towerMomentum_right_of_isotropic`。

  (2) **说明 (a) 的存在性部分不可在一般环上形式化，需 R = ℝ。** "存在类光 k_0 使 k_0·p ≠ 0"
      是关于**实**二次型（洛伦兹号差）的断言，在一般交换环 R 上为假。Lean 侧因此把归一化与类光性
      作为显式假设引入（`dotVec η b a = 1` 即 2α' k_0·p = 1，`dotVec η b b = 0` 即 k_0² = 0），
      不证其可满足性（DDF.lean 文件头 "What is NOT here" 第 4 条）。要把说明 (a)
      （去心直线上的标度与符号选取，含 λ 的符号随 sign(k_0·p)）完整形式化，
      **必须取 R = ℝ 并引入洛伦兹号差与类光锥**，这是一条独立待办。

  (3) **A^i_n 的定义本身仍无机器验证**（DDF.lean 文件头 "What is NOT here" 第 1 条：
      `A^i_n = Σ_{m ∈ ℤ} α^i_m ∘ V^{(n)}_m` 未定义）。其模态和在代数 Fock 空间上局部有限
      这一点，Lean 侧的两条支撑引理已在（`lie_towerMode_towerVertex_of_eq_zero`、
      `Fock.vertexOsc_apply_eq_zero_of_level`），但组装未做；该内容现由命题节点
      worldsheet.ddf-transversality-gives-local-finiteness 承载。

  (4) **顶点算子的伴随 V(b)_J† = V(−b)_{−J} 未做**（需 E_+ E_- 重排序，且 Lean 侧目前只有
      R-双线性型，无 sesquilinear 结构）；**x^μ 与 [x^μ, p^ν] 未做**（塔上只有 e^{i n k_0·x}
      这一个移位，且塔建在固定的 a、b 上，不是全动量空间）。

  【2026-09-11（二）：偏振 ε^i 与 ∂X^i 的记号关系（auditor 第五轮精确性观察，
  lead 已同意只补 notes、不建 v6；curator 转录，陈述文本未动）】
  本卡引入偏振 ε^i 但公式写 ∂X^i；二者只在 k_0 无横向分量时一致，
  即固定类光直线的同时也固定了横向标架（ε^i = e_i，i = 2..D−1，ε^i·k_0 = 0 且 ε^i·ε^j = δ^{ij}）。
  canonical_text 与 light-cone-quantization 的横向内积一致。不建 v6。

  这条观察在下游被用到两处，均按上述读法：
  worldsheet.ddf-transverse-oscillator-algebra 把 ε^i·ε^j = δ^{ij} 写进前提
  （其 notes【陈述文本相对 v4 的两处显式化】已登记同一件事），
  worldsheet.ddf-operators-adjoint 第 (2) 条据此得到「对角元全为正」
  （横向指标全类空，δ^{ii} = +1）。
