    loc: "§11.2, (11.2.14)/(11.2.15) 之后与 Table 11.2, pp. 52–53（逐字：'The left-moving side, like the bosonic string, has a would-be tachyon, but there is no right-mover to pair it with so the theory is tachyon-free.'）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E56；逐字句与 Table 11.2 逐页读到原书页图）。
      ★ 抽取记录备注：「杂化弦无快子」的机制**不是** GSO 投掉，而是 level matching 找不到配对。
  - ref: polchinski-1998-v2
    loc: "§10.5, eq. (10.5.18), p. 23（闭弦质量壳与能级匹配 (α'/4)m² = N − ν = Ñ − ν̃）"
    note: |
      L1（E35）。本卡第 (3) 步用的能级匹配即此；本图对应节点
      worldsheet.closed-superstring-mass-shell（其中左移一侧的偏移换成 (11.2.14) 的 −1）。
tags: [heterotic, so32, tachyon, level-matching, spectrum]
notes: |
  【与 conv.alpha-prime-regge 的换算】左移偏移 −1 写成质量是 α'm²/4 = −1，即 m² = −4/α'
  （闭弦体例）。这与玻色闭弦快子 m² = −4/α' 数值相同——本来就该相同，因为左移部门与玻色弦一样。

  【为什么这条值得单独建卡】它是「杂化弦是可用理论」的两条硬条件之一（另一条是无鬼定理），
  且其机制与 type II 不同。下游 worldsheet.heterotic-two-supersymmetric-ten-dimensional
  的「两个超对称杂化弦」结论隐含了这一条。

  【右移一侧最低态无质量这一步的支撑】来自 §10 的 GSO 投影（worldsheet.gso-projection）
  与 worldsheet.closed-superstring-mass-shell 的偏移表；本图有节点，但都是 physical-argument。
