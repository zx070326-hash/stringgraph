sources:
  - ref: lian-zuckerman-1989
    loc: "**Proposition 4.3**, p.329（陈述）/ p.330（证明），逐字：'For κ = 0, ½, (i) there is an isometry H*_rel ≅ H*(P̄_+C_rel) ⊕ H*(P̄_−C_rel) such that the right-hand side is an orthogonal decomposition; (ii) the cohomology of the GSO subcomplex has dim H^n(P̄_+C_rel) = 8p₀^{(8)}(−p·p/2) for n = 0, = 0 otherwise.'；证明逐字：'(i) It is easy to check that P̄_± are orthogonal projectors with respect to ⟨,⟩_rel i.e. P̄²_± = P̄_±, P̄_±* = P̄_±, P̄_+P̄_− = P̄_−P̄_+ = 0, P̄_+ + P̄_− = 1. Furthermore, [Q, P̄_±] = 0. These equations imply that the map H*_rel → H*(P̄_+C_rel) + H*(P̄_−C_rel), [ω] ↦ [P̄_+ω] + [P̄_−ω] is an isometry. (ii) Combining (i) and Theorem 2.4, we have H^n(P̄_+C_rel) = 0 unless n = 0. By the Euler–Poincaré Principle, we have Σ_{n∈Z}(−1)^n dim P̄_+C_rel = dim H^0(P̄_+C_rel). The left-hand side is char P̄_+C_rel which is given by Proposition 4.2.'"
    note: |
      **L1 页图逐字**（researcher 2026-09-11 第二轮，
      literature/extractions/lian-zuckerman-1989.md **§7.3**；Project Euclid 扫描件
      `projecteuclid.org/download/pdf_1/euclid.cmp/1104179468`，**PDF 页 = 期刊页 − 300**）。
      ★ **等距映射是原文显式给出的**（[ω] ↦ [P̄_+ω] + [P̄_−ω]），与 Theorem 2.20 的 λ 同款习惯。
      ★ **依赖是原文明写的**：Theorem 2.4（消灭定理）+ Euler–Poincaré 原理 + Proposition 4.2。
      ⇒ 本卡的边不标 inferred；且 **Prop 4.3 继承 Thm 2.4 的全部前提**（最要紧的是 p ≠ 0）。
      ⚠ **(ii) 只对 P̄_+**，原文不给 P̄_− 的维数公式（见"本命题不断言 (b)"）。
      ⚠ **"It is easy to check" 只用在投影子的四条代数恒等式上**，那几条确实是一行演算
      （researcher §7.3 第 4 点），故不触发 docs/STATUS_LEVELS.md 的"断言 + 骨架"降档。
      ⚠ **编号陷阱**：p.305 **Lemma** 1.4 与 p.306 **Definition** 1.4 同号，引用必须带类型词；
      各章公式号重起（§4 的 (1)(2) 与 §1/§2/§3 的同号式不同），引用公式必须带章号。
  - ref: lian-zuckerman-1989
    loc: "**Proposition 4.2**, p.329，逐字：'char P̄_+C_rel(p,k) = 8p₀^{(8)}(−p·p/2).'（原刊参数印作 (p, k)，按全文其余各处应为 (p, κ)）"
    note: |
      L1（§7.3）。本条是断言 (2) 的右端的来源：Euler–Poincaré 把 dim H⁰ 化归为特征标，
      而特征标由 Prop 4.2 给出。
      ⚠ **原刊排印疑点**：参数写作 **(p, k)**，全文其余各处一律 κ（kappa）；按上下文
      （'Proof. Let κ = ½. Then …' 随后又做 κ = 0）应为 (p, κ)，属**原刊排印错误**的可能性
      大于扫描误读（同页其他 κ 渲染正常）。**本图引用时写 κ。**
      ⚠ **Proposition 4.2 本图没有卡**（它是特征标计算，用 Jacobi 公式，LZ p.328 逐字
      'using Jacobi formula (see [19], Chap. 4)'，[19] = GSW）。见推导 gaps。
  - ref: lian-zuckerman-1989
    loc: "**Definition 4.1**, p.328，逐字：'Let Ḡ_κ = Γ_κ(−1)^{Σ_{n≥1}(d_{−n+κ}d_{n−κ} + b_{−n}c_n + c_{−n}b_n)}. Then one has Q : ½(1 ± Ḡ_κ)C^n_rel(p,κ) → ½(1 ∓ Ḡ_κ)C^{n+1}_rel(p,κ). (1) Let P̄_± = ½(1 ± (−1)^{U+κ}Ḡ_κ). (2) It follows that (P̄_± C*_rel(p,κ), Q) are two subcomplexes of (C*_rel(p,κ), Q). We will denote their cohomology groups by H*(P̄_± C_rel) and call (P̄_± C*_rel, Q) the GSO subcomplex.'；**同页正文（无编号）**的另一个 Ḡ_κ 逐字：'GSO defined the G-parity on the Fock space V(p,κ) by Ḡ_κ = Γ_κ(−1)^{Σ_{n≥1} d_{−n+κ}·d_{n−κ}}, where Γ_{1/2} = −1 and Γ₀ is the chirality operator on R(p,0) with Γ₀² = 1, {Γ₀, d₀} = 0. Note that Ḡ_κ is essentially the Z₂-gradation defined on V(p,κ). Thus a natural extension to C_rel(p,κ) would be'"
    note: |
      L1（§7.1）。★★ **本条承载 (H3)(H4) 的消歧**：`Ḡ_κ` 在 p.328 **一页之内被定义了两次**，
      作用空间不同（正文版只含物质 d；Definition 4.1 版另含 bc 项），**同名同记号**。
      凡在图里写 Ḡ_κ 必须写明是哪一版；本卡一律用 Definition 4.1 版。
      ★ **(1) 的箭头是 ± → ∓**：Q 反转 Ḡ_κ 的本征值，**这正是 P̄_± 必须乘 (−1)^{U+κ} 的全部理由**。
      抽取记录旧条目 E9 略掉了 (1)，按 §7.1 的裁定以本条为准。
      ⚠ Γ_κ 的取值（Γ_{1/2} = −1；Γ₀ 是 R(p,0) 上的手征算符，Γ₀² = 1、{Γ₀, d₀} = 0）
      来自正文版那一段，本卡未把它写进断言（只在设定里提 Ḡ_κ 的版本）。
  - ref: lian-zuckerman-1989
    loc: "**p.329 Remark** 逐字：'We note that each of the factors (−1)^{Σ_{n≥1} b_{−n}c_n}, (−1)^{Σ_{n≥1} c_{−n}b_n}, (−1)^{Σ_{n≥1} β_{−n+κ}γ_{n−κ}}, (−1)^{Σ_{n≥1} γ_{−n+κ}β_{n−κ}} in (−1)^{U+κ} is an involution. Thus we can write (−1)^{U+κ}Ḡ_κ = Γ_κ(−1)^{Σ_{n≥1}(d_{−n+κ}d_{n−κ} + β_{−n+κ}γ_{n−κ} − γ_{−n+κ}β_{n−κ})}. The right-hand side is precisely the \"G-parity\" proposed by Terao, Uehara [15], and Ohta [13], as a generalization of the GSO projection.'"
    note: |
      L1（§7.2）。★★ **两处必须照实记的限定**：
      (1) **"the right-hand side" 指的是上面那个重写式 (−1)^{U+κ}Ḡ_κ = Γ_κ(…)，
          不是 Definition 4.1 的 Ḡ_κ**。抽取记录旧条目 E9 只抄了结论句、没抄被指代的式子，
          容易被误读成「Definition 4.1 = Terao–Uehara/Ohta 的 G-parity」——**那是错的**。
      (2) ⚠ **转录可信度分层**：四个对合因子的类型、左端、Γ_κ、dd 项与结论句**高可信**；
          重写式指数里 **βγ 与 γβ 两项的相对符号**（读到的是 + … −）与各下标 −n+κ / n−κ 的
          精确配对**需复核**（1989 年 CMP 扫描件下标字号极小）。
          ⇒ **本卡不把该公式写进 statement**，只断言那条**指认**；这样就不承担符号风险
          （researcher §7.2(3) 的建议逐字：'只引「(−1)^{U+κ}Ḡ_κ = Terao–Uehara/Ohta 的 G-parity」
          这个指认则无此风险'）。
      ★ 结构上的解释（§7.2(2)）：(−1)^{U+κ} 提供四个鬼场对合因子，与 Definition 4.1 里的
      bc 项相乘后 **bc 项在最终表达式里消失**，只剩 dd 与 βγ 项——这是重写式比 Definition 4.1
      更短更对称的原因。
  - ref: lian-zuckerman-1989
    loc: "**p.330 收尾句**逐字：'We note that the cohomology of the GSO subcomplexes H^0(P̄_+C_rel(p,κ)), κ = 0, ½ no longer have the two undesirable features—i.e. H^0(P̄_+C_rel(p,½)) has no tachyonic states and dim H^0(P̄_+C_rel(p,½)) = dim H^0(P̄_+C_rel(p,0)). Thus we have achieved the \"covariant\" equivalent of the GSO projection.'；**p.328 开头**（两条不良特征与 GSO 的归属）逐字：'… However, Corollary 2.15 (i) implies that dim H^0_rel(p,0) ≠ dim H^0_rel(p,½). Thus one of the basic requirements of a supersymmetric theory — # bosons = # fermions at each mass level — is violated. It turns out that these two undesirable features can be removed by certain natural truncations on the spectrum. They were first proposed by Gliozzi, Scherk and Olive [8] (GSO) in the \"old covariant\" formalism. It turns out that if one projects out the Z₂-odd states of P(p,κ) in both sectors, the above two features will be eliminated. We will discuss these truncations below.'"
    note: |
      L1（§7.4、§7.5）。★★ **三处必须照实记的限定**（任务书与常见转述都写错过）：
      (1) 原文是 `the "covariant" equivalent of the GSO projection`，**引号只包住 covariant**，
          不是 `the "covariant equivalent of the GSO projection"`；
      (2) 动词是 **'we have achieved'**，不是 proved / constructed
          ⇒ **本卡的 statement 不得写成「LZ 证明了 GSO 投影」**；
      (3) **GSO 截断的原始提案归 [8] = gliozzi-scherk-olive-1977**，且 LZ 明说那是在
          **"old covariant"** 形式下提的；LZ 自己只做协变化。
      ⚠ 两条"不良特征" = **NS 扇区有快子** + **玻色/费米态数不等**（后者由 Corollary 2.15(i) 的
      维数公式直接读出）。本卡只断言其中第二条的消除（断言 (3)，由 Prop 4.3(ii) 的公式不含 κ 得到），
      **不断言** NS 无快子那条（见"本命题不断言 (h)"）。
      ⚠ 顺带（§7.5(c)）：**LZ 1989 全文出现 "old covariant" 字样**（此处 + p.335 结论句）；
      这与 lian-zuckerman-1991 记录里「全文无 old covariant 字样」**不矛盾**，那是另一篇。
  - ref: gliozzi-scherk-olive-1977
    loc: "全文（正文未获取，L0）"
    note: |
      ⚠ **本条只承载归属，不支撑任何公式**（见 sources.bib 里该 key 的使用纪律）。
      归属的证据是 LZ p.328 的 L1 转引（见上一条）：'They were first proposed by Gliozzi,
      Scherk and Olive [8] (GSO) in the "old covariant" formalism.'
      bib 条目由 curator 于 2026-09-11 按 lead 指示以 **L0** 登记（卷期页来自 researcher 的
      §7.7，未经 Crossref/INSPIRE 二次核对）。
      ★★【2026-09-11 追加，researcher 已把 bib 条目升到 L2（元数据经 Crossref + INSPIRE 双核对，
      DOI 10.1016/0550-3213(77)90206-1）；但**内容仍是 L0，归属的可追溯性没有变强**】三条限定：
      (1) **摘要级 negative evidence**：INSPIRE 摘要逐字是 'We study the connection between the dual
          spinor model and supersymmetry. We show that in the low-energy region, the dual spinor model
          yields a supersymmetric Yang-Mills theory with O(4) internal symmetry and a supergravity
          theory with O(4) internal symmetry.'
          ——**摘要里没有 'projection'、没有 'truncation'、没有 'GSO'、没有 '10'、没有 'tachyon'、
          没有 'chirality'/'Majorana'**。⇒ **摘要本身不能支撑「本文提出了 GSO 投影」这条归属**；
          归属**只**靠 LZ p.328 的 L1 转引（'They were first proposed by Gliozzi, Scherk and Olive
          [8] (GSO) in the "old covariant" formalism.'）。
      (2) **易混陷阱**：同三位作者另有 **Phys. Lett. B 65(3) (1976) 282–286,
          'Supergravity and the spinor dual model'**（DOI 10.1016/0370-2693(76)90183-0，Crossref 核实）
          ——注意标题里 'spinor dual' 与本条的 'dual spinor' **词序相反**，是两篇不同的文章。
          ⚠ **LZ 的 [8] 到底指哪一篇，本图未裁决**（LZ 的参考文献表本项目未逐条取得）。
          本条按 LZ 转引里的 "old covariant" 语境与通行归属挂在 1977 那篇上，
          但这一步**是本图的选择，不是已核实的事实**。
      (3) ⇒ 引用纪律不变（sources.bib 的使用纪律 (1)(2)）：`loc` 只能写「全文」或 'pp. 253–290'，
          本条只承载归属，**不得**用来支撑任何公式、维数或定理。
