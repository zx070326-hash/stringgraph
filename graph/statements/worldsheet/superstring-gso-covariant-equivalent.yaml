  【reviewer-batch23，lead 落地】(H1) 的继承前提：LZ §1 常设「p 在半空间 {p^D > 0}」（auditor rulings-3 裁定 Thm 2.4 不用它），但 Prop 4.3(i) 谈的是 ⟨,⟩_rel 上的正交投影与等距，而 ⟨,⟩_R 的整体符号正靠该假设固定——故本卡 (i) 的「正交」一词隐含它；(ii) 的维数公式不依赖。
  ★★【本卡为什么新建（curator，2026-09-11）】
  worldsheet.superstring-relative-cohomology-vanishing-v2 的"本命题不断言 (e)"与
  worldsheet.no-ghost-theorem-superstring-cohomological 的"本命题不断言 (e)"都写着
  「不断言 GSO 投影后的版本（LZ §4 Proposition 4.3，**本图未建卡**）」。本卡关闭这个缺口。
  它同时是本图**唯一**一条关于"GSO 之后"的 rigorous 候选来源：
  worldsheet.gso-projection 是 Polchinski 的一致性条件重述（physical-argument 链），
  worldsheet.no-ghost-theorem-superstring 的断言 (4)（无鬼定理在 exp(πiF) 每个本征子空间上
  分别成立）在原书里只有"The proof is a direct imitation of the bosonic argument of chapter 4."
  一句。**LZ Prop 4.3 是数学文献里对应的那条带编号、带完整证明的命题。**

  【与 worldsheet.no-ghost-theorem-superstring 断言 (4) 的关系——未接线，交 reviewer】
  那张卡的 (4) 与本卡的断言 (1) 在结构上对应：都说"投影到某个 Z₂ 分次的本征子空间后结论
  仍分别成立"。但**两侧的投影算子不是同一个对象**：Polchinski 用 exp(πiF)（世界面费米数），
  LZ 用 P̄_± = ½(1 ± (−1)^{U+κ}Ḡ_κ)（含鬼场贡献）。
  **本轮按 lead 指示不改那张卡的边**，只在那张卡与 worldsheet.gso-projection 的 notes 里
  记下"本卡是唯一 rigorous 候选来源"。要接线必须先核实
  exp(πiF) ↔ (−1)^{U+κ}Ḡ_κ 的字典（两侧的鬼场部分差别见本卡 (H3)(H4) 与"不断言 (g)"）。

  【researcher 建议的更细粒度拆分——本轮未做，已列入报告】
  literature/extractions/lian-zuckerman-1989.md §7.7 建议拆四张卡：
  `gso-subcomplex-definition`（Definition 4.1）、`gso-orthogonal-decomposition`（Prop 4.3(i)）、
  `gso-projected-cohomology-dimension`（Prop 4.3(ii)）、`gso-covariant-equivalence`（p.330）。
  本卡按 lead 的派工做成**一张**卡，理由：Prop 4.3 的 (ii) 的证明**用到** (i)（原文
  'Combining (i) and Theorem 2.4'），两者在文献里不是分别推导的，按 graph/CLAUDE.md
  「一个节点一个命题」的判据（"文献把两件事写在一个定理里而它们被**分别推导**时，拆开"）
  不必拆；而 p.330 的收尾句是**作者的定位**而非命题，故只作为断言 (3) 的一半（维数相等）
  加上"不断言 (h)"（无快子）落地。
  ⚠ Definition 4.1 **确实没有卡**，本卡把 P̄_± 写进 (H3)(H4) 的设定里自足；
  若日后 Ḡ_κ 的显式公式经 auditor 复核符号后要进图，那时应单建定义卡。

  【§4 的 negative evidence（researcher 通读 pp.328–333）】
  §4 **不**引 Henneaux、**不**引 FGZ；GSO 相关只引 [8]（GSO）、[13]（Ohta）、[15]（Terao–Uehara）、
  [19]（GSW，用于 Jacobi 公式）。§4 **不出现**时空超对称的证明、不出现 E₈×E₈ / SO(32) /
  模不变性 / 配分函数。⇒ 本卡的"不断言 (c)(d)"是按这条 negative evidence 写的。
