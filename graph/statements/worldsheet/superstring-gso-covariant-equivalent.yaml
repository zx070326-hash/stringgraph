id: worldsheet.superstring-gso-covariant-equivalent
kind: proposition
title: GSO 子复形上同调的正交分解与维数（LZ 1989 Proposition 4.3）：H*_rel ≅ H*(P̄_+C_rel) ⊕ H*(P̄_−C_rel) 且 dim H^n(P̄_+C_rel) = 8p₀^{(8)}(−p·p/2) 仅在 n = 0
statement: |
  **设定**（数学侧表述，照 Lian–Zuckerman 1989 §4 的记号）。
    (H1) **前提继承 Theorem 2.4（消灭定理）**：D = 10、**p ≠ 0**、复形取 LZ p.306 (8) 的
         C(p,κ)（R 扇区零模空间取 T₀ ⊕ T₁），相对复形按 Definition 2.2
         （worldsheet.superstring-relative-cohomology-vanishing-v2 的 (H1)–(H3)(H5)）。
         ⚠ **Proposition 4.3 自身的陈述里一个量词都没有**，`κ = 0, ½` 是唯一显式的；
         上述前提是经其证明所引的 Theorem 2.4 继承来的（researcher 2026-09-11 L1 逐条核定）。
    (H2) **次数 n 是 Definition 2.2 的相对次数**（= 鬼数 + κ ∈ Z，两扇区都整数），
         **不是鬼数**；零点按 conv.superstring-ghost-number-zero 的 canonical。
         （与 worldsheet.superstring-relative-cohomology-vanishing-v2 的 (H4) 同款。）
    (H3) **Ḡ_κ 取 Definition 4.1 的版本（含 bc 鬼场项），不是 p.328 正文那个**。
         ⚠ LZ 在 p.328 一页之内把 `Ḡ_κ` **定义了两次**：正文版（GSO 原始的物质 G-parity，
         指数里只含物质模 d）与 **Definition 4.1** 版（指数里另含 b_{−n}c_n + c_{−n}b_n）。
         两者同名同记号。本卡一律指 **Definition 4.1 版**。
    (H4) **投影子**：P̄_± := ½(1 ± (−1)^{U+κ} Ḡ_κ)（LZ §4 的 (2)），其中 U 是鬼数算符。
         ⚠ **为什么要乘 (−1)^{U+κ}**：Definition 4.1 的 (1) 给出
         Q : ½(1 ± Ḡ_κ)C^n_rel → ½(1 ∓ Ḡ_κ)C^{n+1}_rel，即 **Q 反转 Ḡ_κ 的本征值**；
         故与 Q 对易的投影子是带 (−1)^{U+κ} 的那个组合，**不是** ½(1 ± Ḡ_κ) 本身。
         (P̄_± C*_rel(p,κ), Q) 因此是两个子复形，LZ 称之为 **GSO 子复形**，
         其上同调记作 H*(P̄_± C_rel)。
    (H5) **计数记号 p₀^{(8)}(·) 照抄 LZ，本图未核实其定义**（它在 LZ 的
         Proposition 2.14(ii) / Corollary 2.15(i) 里以 p^{(8)}_κ 出现）。
         本卡只断言下面的等式在 LZ 的这个记号下成立，不断言该记号等于任何别的计数函数。

  **断言**（LZ **Proposition 4.3**，p.329–330，逐字 'For κ = 0, ½, (i) there is an isometry
  H*_rel ≅ H*(P̄_+C_rel) ⊕ H*(P̄_−C_rel) such that the right-hand side is an orthogonal
  decomposition; (ii) the cohomology of the GSO subcomplex has dim H^n(P̄_+C_rel) =
  8p₀^{(8)}(−p·p/2) for n = 0, = 0 otherwise.'）：

    **(1) 正交分解（Prop 4.3(i)）**：对 κ = 0, ½，映射
          H*_rel → H*(P̄_+C_rel) + H*(P̄_−C_rel)，  [ω] ↦ [P̄_+ω] + [P̄_−ω]
        是**等距**，且右端是关于 ⟨,⟩_rel 的**正交**直和分解。
        （其依据是 P̄_± 关于 ⟨,⟩_rel 是正交投影子：P̄²_± = P̄_±、P̄_±* = P̄_±、
        P̄_+P̄_− = P̄_−P̄_+ = 0、P̄_+ + P̄_− = 1，且 [Q, P̄_±] = 0。）
    **(2) P̄_+ 子复形的维数（Prop 4.3(ii)）**：对 κ = 0, ½，
          dim H^n(P̄_+C_rel) = 8p₀^{(8)}(−p·p/2)   （n = 0）
                            = 0                  （n ≠ 0）。
    **(3) 两扇区维数相等**：(2) 的右端**不含 κ**，故
          dim H⁰(P̄_+C_rel(p, ½)) = dim H⁰(P̄_+C_rel(p, 0))。
        这正是 p.330 逐字列出的两条"不良特征"之一的消除
        （另一条见"本命题不断言 (h)"）。

  **G-parity 的归属（本卡断言的是一条指认，不是公式）**：
    LZ p.329 Remark 把 (−1)^{U+κ}Ḡ_κ 重写后逐字指出：
    'The right-hand side is precisely the **"G-parity"** proposed by Terao, Uehara [15],
    and Ohta [13], as a generalization of the GSO projection.'
    ⇒ 本卡断言：**(−1)^{U+κ}Ḡ_κ 就是 Terao–Uehara / Ohta 的 G-parity**。
    ⚠ 这里的 "the right-hand side" 指 Remark 里那个**重写式**，**不是** Definition 4.1 的 Ḡ_κ；
    该重写式的显式指数**不写进本陈述**，理由见"本命题不断言 (e)"。

  **本命题不断言**：
    (a) **不断言"LZ 证明了 GSO 投影"**。GSO 截断的原始提案归 **Gliozzi–Scherk–Olive 1977**，
        且 LZ p.328 逐字说那是在 **"old covariant"** 形式下提的
        （'They were first proposed by Gliozzi, Scherk and Olive [8] (GSO) in the "old covariant"
        formalism.'）。LZ p.330 的收尾动词是 **achieved**（逐字 'Thus we have achieved the
        "covariant" equivalent of the GSO projection.'，**引号只包住 covariant 一个词**），
        即作者把本节当作**对已有物理提案的协变重述**，不是新提出或新证明 GSO 投影。
    (b) **不断言 P̄_− 的维数公式**。原文只对 P̄_+ 给 (ii)，**不得对称化**。
    (c) **不断言时空超对称**。LZ §4 通读六页（pp.328–333）**没有**时空超对称的证明，
        只出现"每个质量级上 #bosons = #fermions"这条**必要条件**（p.328）。
        ⇒ 本卡不得被当作时空超对称的来源。
    (d) **不断言模不变性、配分函数、E₈×E₈ / SO(32)**。§4 里 GSO 是**纯代数截断**，
        没有一圈模不变性的论证（§4 不出现这些字样）。
    (e) **不把 (−1)^{U+κ}Ḡ_κ 的显式指数公式写进本陈述**。researcher 2026-09-11 的 L1 页图
        分层可信度：四个对合因子的**类型**（两个 bc、两个 βγ）、左端 (−1)^{U+κ}Ḡ_κ、前因子 Γ_κ、
        dd 项与结论句是高可信；**βγ 与 γβ 两项之间的相对符号以及下标配对在 1989 年 CMP 扫描件上
        不可靠**（下标字号极小）。按"不确定就不写进陈述"的纪律，本卡只断言上面那条**指认**。
        要把该公式写进图，须先由 auditor 用同一页图复核符号。
    (f) **不断言 p = 0**。前提链经 Theorem 2.4 继承 p ≠ 0（该定理逐字 'Suppose p ≠ 0'）。
    (g) **不断言与 Polchinski 的 exp(πiF) 投影逐字同一**。worldsheet.gso-projection 用的是
        exp(πiF)、exp(πiF̃) 的本征子空间投影（IIB / IIA / 对角 type 0），本卡用的是
        相对 BRST 复形上的 P̄_±。两者在文献里被认为对应同一件事，但**这个字典本图未核实**，
        也不在 LZ 里（LZ 不写 exp(πiF)）。
    (h) **不断言 NS 扇区"无快子"**。p.330 逐字把它与 (3) 并列为两条不良特征的消除
        （'H⁰(P̄_+C_rel(p,½)) has no tachyonic states'），但它是否由 (2) 的公式推出，
        取决于 p₀^{(8)} 的具体定义——**本图未核实该记号 (H5)**，故本卡不断言它。
    (i) **不断言左右移（闭弦）的组合**。LZ §4 处理的是单侧（开弦型）复形，
        IIA/IIB 的手征性区分不在本卡。
