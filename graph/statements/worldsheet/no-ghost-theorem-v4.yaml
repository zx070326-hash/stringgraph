     为什么不把 lian-zuckerman-1991 加进现有推导的 sources：那条推导走纯 D 玻色子的 DDF / 纵向算子路线，
     LZ 走带补充模 L(26−D, 1−h) 的 BRST 相对上同调，是两条独立论证，一条推导只记一个论证。
     也不能另挂一条只支撑 (2) 的 v4 推导：一条推导须支撑整条目标陈述，而 LZ 不覆盖本节点的 (1)。
