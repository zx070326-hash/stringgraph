     **(2) 的 p ≠ 0 有 L1 来源：worldsheet.no-ghost-theorem-subcritical（LZ 1991 Thm 3.5(ii) 反方向，
     (P2) ⇒ p ≠ 0）；本节点现有的推导 worldsheet.no-ghost-theorem-v4--via-goddard-thorn 不依赖它。**
     推理见该 subcritical 节点 notes 的【v4 注】：LZ (ii) 的「当且仅当」反方向给出「存在满足 (P1)–(P3)
     的 p 使商空间不正定」，(P2) 蕴含 p ≠ 0，商已模去 rad 故不正定即含负模向量，而 (D > 26, h = 1)
