notes: |
  【2026-09-11（八）补注：D = 26 在本节点论证里唯一进入之处是 (B-26)（curator，small-backlog-12；
  **只加本段 notes**，statement 文本、kind、tags、sources 一字未动；依 formal/BLUEPRINT-noghost.md §B.5）】
  本节点第 (1) 条的推导 worldsheet.no-ghost-theorem-v4--via-goddard-thorn 现把它的承重步骤单独登记为
  gap **(B-26)**：DDF 代数、伴随、横向 Gram 正定、K_n 代数（新卡 worldsheet.gt-longitudinal-k-algebra）
  与特征标计数（ch H_phys = φ^{−(D−1)}、ch H^⊥ = φ^{−(D−2)}）**全部与 D 无关**；
  **唯一含 26 的断言**是「H_phys 中 H^⊥ 之外的那 p_{D−1}(N) − p_{D−2}(N) 个方向在 D = 26 时恰为零模态」
  （等价：H_phys 上双线性型的秩恰为 p_{D−2}(N)）。文献支撑只有 Goddard 2008 §6 (6.4) 一句无证明结论
  （转引 GT 1972，正文未获取）；两条已知机制（GT 的 K 条件配平、Brower 的 A^L_n）都还没有可形式化的证明。
  ⇒ 读本节点 (1b) 时应知道：**它比 (1a) 半正定强得多，而多出来的那部分（等距同构，即秩恰为 p_{24}(N)）
  正是 (B-26)**。这也是本节点与 worldsheet.no-ghost-theorem-subcritical 的差别所在：
  D ≤ 25 时秩更大但仍半正定，D > 26 时多出的方向有负模（第 (2) 条的 Lean 见证）。
  **有效状态**：本次接线后本节点 effective 一度由 rigorous 降为 physical-argument
  （瓶颈是新卡 worldsheet.gt-longitudinal-k-algebra）；**同日** formalizer-noghost-a 的
  Longitudinal.lean 合入 main（6ed1638），该卡升 formalized，本节点 **回到 rigorous**。
  细节见推导 notes【（八）】。⚠ rigorous 不等于 (B-26) 已证：它仍是 gaps 里的无证明承重点。

  【2026-09-11（四）补注：第 (2) 条已有机器验证的独立见证节点；第 (1) 条仍待 DDF】
  （curator，本次**只加本段 notes**，statement 文本、kind、tags、sources 一字未动。）
  本节点第 (2) 条（D > 26、a = 1 时存在 p ≠ 0 与 |ψ⟩ ∈ H_phys(p) 使 ⟨ψ|ψ⟩ < 0）现有一条
  **机器验证的见证**：worldsheet.negative-norm-physical-state-above-26（formalized，
  lean_decl `StringFormal.NoGhost.Fock.exists_mem_physSubmodule_pairing_self_neg`，
  formal/StringFormal/NoGhost/LevelTwo.lean，合并提交 c32f026）。
  它在有序域上取质量壳 α'k² = −1（`Fock.exists_zeroModeSq_eq_neg_two`，需 D ≥ 2 与
  一个类时加一个类空分量）上的 level-2 标量态，验证它是物理态且
  ⟨ψ₂,ψ₂⟩ = −2(D−26)(D−1)/25 < 0。该卡已加为本节点推导
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的依赖（非 inferred）。
  **第 (1) 条仍待 DDF**：D = 26 的半正定 (1a) 与逐塔等距同构 (1b) 需要「DDF 态张成
  H_phys 模零模态」这一核心步骤，Lean 侧连 DDF 算子 A^i_n 本身都还没定义
  （formal/TODO.md 的 `ddf-operators`、`ddf-spans`）。
  **本节点的 effective 不因此变化**，仍是 physical-argument：瓶颈在第 (1) 条那侧的两条
  DDF 对易关系（worldsheet.ddf-commute-with-virasoro、
  worldsheet.ddf-transverse-oscillator-algebra）与 worldsheet.ddf-operators-adjoint。
  换句话说：**本节点的两条断言现在处在完全不同的认识论位置**——(2) 有机器证明，
  (1) 只有物理论证——而节点级的 effective 只能显示两者的下界。
  （不能给本节点单挂一条「只证 (2)」的 formalized 推导：一条推导须支撑整条陈述。）

  ---
  【2026-09-11 补注：statement 文本内的 ddf-operators-v4 引用应读作 v5；有效状态已下降】
  （curator，本次**只加本段 notes**，statement 文本、kind、tags、sources 一字未动。）

  worldsheet.ddf-operators-v4 已被拆为一张纯定义卡 **worldsheet.ddf-operators-v5** 与三条命题：
  worldsheet.ddf-commute-with-virasoro（[L_m, A^i_n] = 0）、
  worldsheet.ddf-transverse-oscillator-algebra（[A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}）、
  worldsheet.ddf-transversality-gives-local-finiteness（横向性 ⟹ 模态和局部有限）。

  本节点 statement 文本内两处引用 `worldsheet.ddf-operators-v4`
  （记号段的"记号同 worldsheet.ddf-operators-v4"、(1b) 的"A^i_{-n} 是 worldsheet.ddf-operators-v4
  的 DDF 算子"）**按根 CLAUDE.md 原则 1 不改**（已提交节点的 statement 文本不可变）。
  读者应把这两处理解为指向 **worldsheet.ddf-operators-v5**：v5 的 statement 前半段与 v4 逐字相同，
  唯一差别是 v4 末段多两句代数断言，而那两句现由上述两条命题承载，
  并已在推导 worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 depends_on 里显式列出。

