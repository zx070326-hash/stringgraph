  V1（审计 B1，唯一阻塞项）：**第 (2) 条缺动量量词，照字面对 D = 26 亦真、无区分力。**
     v3 的 (2) 写「存在 |ψ⟩ ∈ H_phys 使 ⟨ψ|ψ⟩ < 0」，对 |ψ⟩ 的动量不加任何限制。但取 p = 0、
     能级 N = 1 的态 α^0_{-1}|0; 0⟩：物理态条件 L_n|ψ⟩ = 0 (n > 0) 中只有 L_1 起作用，
     L_1 作用在能级 1 的态上给 α_0·α_1 ∝ p·α_1，p = 0 故为零；L_0 本征值 = N = 1 = a。
     所以它是物理态，而其模是 η^{00} = -1 < 0。**这对任何 D 成立，包括 D = 26。**
     （第三轮审计的数值复核：p = 0、D = 26、a = 1，能级 1 的 Gram 符号 (负,零,正) = (1,0,25)，
     能级 2 为 (25,0,325)。）于是 v3 的 (2) 照字面是真命题但没有内容，区分不了 D > 26 与 D = 26。
     v3 里唯一可能救它的是 (1) 内部那句「k_0·k = 0 的动量扇区（特别是 k = 0）不在本陈述范围内」，
     但它写在 (1) 之内、(2) 之前，按位置读只管 (1)。两种读法差别正是"(2) 有没有内容"。
     本节点的修法（与审计 B1 的建议逐条一致，两条都做，互为冗余保险）：
       (i) 把动量限定提到**全局前言**，显式写明对 (1)(2) 同时生效；
       (ii) 在 (2) 内部显式写出「存在 p ≠ 0 与 |ψ⟩ ∈ H_phys(p) 使 ⟨ψ|ψ⟩ < 0」。
     用 p ≠ 0 而不用 k_0·p ≠ 0 的理由（审计 B1/C3）：(2) 不需要固定 k_0；p ≠ 0 时总能选到类光 k_0
     使 k_0·p ≠ 0；且 FGZ Theorem 2.8 的条件逐字就是 p ≠ 0。
     与 v3 的关系：v3 的 (2) 在"按位置读"下是空真命题、在"排除句全局生效"读法下与 v4 的 (2) 同义。
     v4 只是把读法钉死，**不是**在纠正一个假命题。

