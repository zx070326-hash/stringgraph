  【第 (2) 条对 a 的量化】Goddard-Thorn 1972 的原始结果在 a = 1（截距取临界值）下陈述。
  文献中流传的更强形式"D > 26 时对任意 a 均有负模态"通常归于 Brower 1972 / Thorn 的谱生成代数
  证明，但两篇 1972 年论文的正文均未获取、无抽取记录（第一轮审计 B4 也指出 a = -3、-5 在
  level ≤ 3 的数值检查中未见负模），故本节点只写"至少在 a = 1 时"。a = 1 的情形有独立佐证：
  level-2 标量物理态的模正比于 (D-1)[16a^2 + (2D-74)a + 84 - 3D]，在 a = 1 处为 (D-1)(26-D)，
  D > 26 时严格为负。

  【扇区覆盖（初等观察，不属断言）】(1b) 的逐塔陈述覆盖整个扇区：给定类光方向与扇区内的在壳动量 p
  （能级 N = a - α' p^2 ∈ Z_{≥0}），把 k_0 按 2α' k_0·p = 1 定标后取 k := p + N k_0，则
  α' k^2 = α' p^2 + 2N α' k_0·p = (a - N) + N = a，即 k 在快子壳上，p 属于 k 的塔且该塔唯一。
  又因 k_0^2 = 0，2α' k_0·k = 2α' k_0·p = 1，标度自洽（审计 C1）。
  同理，H_0(k; k_0) 与全局零模态空间 H_0 的关系是 H_0(k; k_0) = H_0 ∩ H_phys(k; k_0)，
  因为不同动量的 Fock 态互相正交；本节点采用塔内定义，不依赖这一等式。

  【全局动量限定的最小必要范围（初等观察，不属断言）】第三轮审计 B2：在壳且 k_0·p = 0 的动量只有
  N = 0 的部分快子（模 1，平凡半正定）、N = 1 的 p = 0 与 p ∥ k_0（后者物理态 ε·α_{-1}|0;p⟩，
  ε·p = 0，Gram 符号 (0,1,24)，无负模）；N ≥ 2 时 p 类时，与任何类光 k_0 自动 k_0·p ≠ 0。
  所以对 (1a) 而言真正必须排除的只有 p = 0，全局限定中的 k_0·p ≠ 0 略宽但无害。
  本节点保留较宽的限定，因为 (1b) 的塔结构本身需要 k_0·p ≠ 0。

  【数值佐证】ms.no-ghost-theorem 第二、三轮审计做过 α' = 1/2、mostly-plus、能级 N ≤ 3 的独立复核
  （直接求 L_1..L_N 的公共核再看 Gram 矩阵特征值符号）：D=26、a=1 时无负特征值，正特征值个数
  逐级等于 p_24(N) = 24 / 324 / 3200，与 (1a)(1b) 一致；D=27、28、a=1 自 N=2 起在类时（故
