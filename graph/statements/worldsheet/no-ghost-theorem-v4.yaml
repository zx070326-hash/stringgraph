id: worldsheet.no-ghost-theorem-v4
kind: proposition
title: 无鬼定理（Goddard–Thorn）：D = 26、a = 1 时逐动量塔上 H_phys/H_0 等距同构于 24 个横向 DDF 振子的 Fock 空间；D > 26 时存在非零动量上的负模物理态
statement: |
  设 H_phys 是 worldsheet.old-covariant-physical-states 定义的 D 维自由玻色开弦旧协变物理态空间
  （单组振子 α^μ_n；(L_0 - a)|ψ⟩ = 0 与 L_n|ψ⟩ = 0 ∀ n > 0；截距记号 a 按 conv.intercept-sign-a，
  即 Polchinski 的 A = -a）。Fock 内积由 (α^μ_n)^† = α^μ_{-n} 与 η_{μν}（conv.metric-mostly-plus）
  诱导，在 Fock 空间上不定。

  记号（固定动量）：F(p) 是建在动量本征态 |0; p⟩ 上的 Fock 空间（零模 α^μ_0 = (2α')^{1/2} p^μ，
  记号同 worldsheet.ddf-operators-v4），H_phys(p) := H_phys ∩ F(p)。质量壳按 conv.alpha-prime-regge
  写作 α' m^2 = N - a，m^2 = -p^2，N 是振子能级；于是 |ψ⟩ ∈ H_phys(p) 处在能级 N = a - α' p^2。

  【全局动量限定（对下述 (1) 与 (2) **同时**生效）】
  本陈述的一切断言都只在**非退化动量扇区**上作出：
    - 零动量 p = 0 一律不在范围内；
    - 在已固定类光参考方向 k_0 的语境（即第 (1) 条）中，进一步排除 k_0·p = 0 的动量。
  理由是 DDF 构造在这些动量上退化，需单独处理。这条限定**不是**只管第 (1) 条的旁注：
  第 (2) 条的断言同样只在 p ≠ 0 上作出，并在该条内部显式写出（见 notes 的【v4 变更记】，
  以及为什么不写出量词会使第 (2) 条失去区分力）。

  (1) 设 D = 26 且 a = 1。固定一条类光参考方向（去心直线 {λ k_0 : λ ∈ R \ {0}}，k_0^2 = 0），
      其标度按 worldsheet.ddf-operators-v4 的归一化条件 2α' k_0·p = 1 逐塔确定（λ 的符号随
      sign(k_0·p)）；条件 k_0·p ≠ 0 只依赖方向不依赖标度。在扇区 {p : k_0·p ≠ 0} 上：

      (1a) 半正定：对每个满足 k_0·p ≠ 0 的动量 p 与每个 |ψ⟩ ∈ H_phys(p)，有 ⟨ψ|ψ⟩ ≥ 0。

      (1b) 逐动量塔的等距同构：设 k 满足
             (i) k 在快子壳（N = 0 的质量壳）上：α' k^2 = a = 1；
             (ii) k_0·k ≠ 0，且 k_0 的标度已按 2α' k_0·k = 1 取定。
           记该塔上的物理态空间与其零模态子空间
             H_phys(k; k_0) := ⊕_{N ≥ 0} H_phys(k - N k_0)，
             H_0(k; k_0)    := {|χ⟩ ∈ H_phys(k; k_0) : ⟨χ|ψ⟩ = 0 ∀ |ψ⟩ ∈ H_phys(k; k_0)}，
           以及横向 DDF Fock 空间
             H^⊥(k) := span{ A^{i_1}_{-n_1} ... A^{i_r}_{-n_r} |0; k⟩ : r ≥ 0, n_j ≥ 1, i_j ∈ {2,...,25} }，
           其中 A^i_{-n} 是 worldsheet.ddf-operators-v4 的 DDF 算子（24 个横向方向 i = 2..25）。
           （由质量壳，H_phys(k - N k_0) 中的态自动处在能级 N，因为
             α'(k - N k_0)^2 = α' k^2 - 2N α' k_0·k = 1 - N = a - N；
            相应地 A^i_{-n} 把动量移到 p - n k_0 并把能级升高 n，故 H^⊥(k) ⊂ H_phys(k; k_0)。）
           则：
             (1b-i)  商空间 H_phys(k; k_0) / H_0(k; k_0) 上由 Fock 内积诱导的内积正定；
             (1b-ii) 包含映射 H^⊥(k) ↪ H_phys(k; k_0) 与商映射的复合
                       H^⊥(k) → H_phys(k; k_0) / H_0(k; k_0)
                     是**等距同构**（保内积的线性双射，不只是线性同构）；
             (1b-iii) 该同构保**能级 N** 分级：H^⊥(k) 一侧的 N 是 DDF 能级 Σ_j n_j，
                     H_phys(k; k_0) 一侧的 N 是振子能级，等价于动量分级 p = k - N k_0，
                     也等价于 N = a - α' p^2。
                     （分级**不是** L_0 分级：在 H_phys 上 L_0 ≡ a = 1 是常数，L_0 分级平凡。）

  (2) 设 D > 26。则至少在 a = 1 时存在**非零**动量上的负模物理态，即存在动量 p ≠ 0
      与 |ψ⟩ ∈ H_phys(p) 使 ⟨ψ|ψ⟩ < 0。
      （量词 p ≠ 0 是本条的一部分，不可省：p = 0 处对任意 D（包括 D = 26）都有负模物理态，
      故省去量词会使本条对 D = 26 亦真、丧失区分 D > 26 的能力。见 notes 的【v4 变更记】。
      本陈述只断言 a = 1 的情形；对一般 a 的加强见 notes。）

  本陈述不对 D ≤ 25 作任何断言（无论 a 取何值），不对 D = 26、a ≠ 1 作断言，
  也不使用"退耦""不幺正"等未定义的措辞。
uses_conventions:
  [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge, conv.intercept-sign-a]
sources:
  - ref: goddard-thorn-1972
    loc: "无编号；摘要末句 'absence of ghosts for d ⩽ 26'，正文未获取"
    note: |
      2026-09-10 核实（literature/extractions/brst-cohomology-sources.md §3）：
      正文四条获取路径全部失败（ScienceDirect 403、CERN CDS 反爬、OSTI 只有元数据、
      Semantic Scholar 无 PDF），故**不能确认也不能否认**文中有编号定理；三条间接证据
      （Goddard 本人 2008 综述复述该结果时不给编号、FGZ 1986 引它为 ref 8 时不给编号、
      该刊该年代 4 页快报体例不用编号定理）一致指向"无编号"。
      摘要逐字（INSPIRE）：「A simple consequence of this counting is the absence of ghosts
      for d ⩽ 26 (d ⩽ 10 for Neveu-Schwartz).」摘要**完全不提 intercept**：Veneziano 模型
      以 α_0 = 1 为前提，故本条只覆盖 a = 1。摘要级证据只覆盖 (1a)，不含 (1b) 的等距同构措辞，
      也不含 (2)（含其动量量词）。
  - ref: goddard-2008
    loc: "arXiv:0802.3249，无鬼定理一节（逐字：'For D = 26, if |ψ⟩ is a physical state … it can be written in the form' DDF 态 + 零模态）"
    note: |
      作者本人的历史综述（L3，二手），是 (1b) 取"包含映射 H^⊥(k) ↪ H_phys 诱导等距同构"这一
      具体形式的最直接可引用依据；综述通篇在 α_0 = 1 下陈述，且明说「The No-Ghost Theorem
      follows for D < 26 by embedding in the D = 26 case」（故 D ≤ 25 不是独立情形，本节点不断言）。
      综述不含新证明，只作归属与形式的证据。逐字引句已在 ms.no-ghost-theorem 第二轮审计 D2 登记。
  - ref: fgz-1986
    loc: "Theorem 2.8 第二个同构（T ∩ P ≅ P/rad P），在固定动量 p ≠ 0 的 V(R^{25,1}, p) 上陈述，维数 p_{(24)}(1 - p·p/2)"
    note: |
      编号已核实（全文五页逐页读毕，brst-cohomology-sources.md §1.3）。这是本节点采用**逐动量**
      表述的直接依据：FGZ 也在固定动量上陈述，并逐字写「All three isomorphic spaces are positive
      definite」（对应 (1b-i)）。FGZ 的动量条件逐字是 **p ≠ 0**，这也是本节点第 (2) 条采用
      p ≠ 0（而非 k_0·p ≠ 0）作为量词的依据——ms.no-ghost-theorem 第三轮审计 C3/B1 明确建议用
      p ≠ 0，因为 p ≠ 0 时总能选到类光 k_0 使 k_0·p ≠ 0。
      两点不逐字对应，如实登记：(a) FGZ 的横向空间 T 是 V(E,p) 中被 ℒ^+ 湮灭的正定子空间
      （Proposition 2.6），不是本节点建在快子壳基态 |0; k⟩ 上的 DDF Fock 空间 H^⊥(k)；二者作为
      分级内积空间同构，但实现方式不同（no-ghost-theorem-brst 的 notes (c) 已记同一差异）。
      (b) FGZ 固定单个动量（单个能级），本节点把同一动量方向上的整条塔 {k - N k_0} 打包成
      N-分级空间；打包是初等的直和，因为不同动量的态在 Fock 内积下正交。
  - ref: brower-thorn-1971
    loc: "Goddard 2008 综述 arXiv:0802.3249 归属于此文；本文摘要未见维数条件，未裁决"
    note: |
      支持本节点断言 (2)（D > 26 有非零动量上的负模物理态）的候选来源。Goddard 2008 把「物理态中
      出现鬼当 D > 26」明确归给更早的 Brower–Thorn 1971（其 ref [29]），而**不是** goddard-thorn-1972
      或 brower-1972——后两篇的摘要里都没有 D > 26 的反例。但 Brower–Thorn 1971 自己的摘要只说
      「no ghosts or unanticipated null ('zero norm') states are found on the leading nine
      trajectories」，**摘要里没有出现 D > 26 或任何维数条件**。二手归属与一手摘要之间存在张力，
      需读正文才能裁决；本项目如实登记两方，不裁决。见 brst-cohomology-sources.md §3.2。
      动量量词 p ≠ 0 同样没有来源逐字支持（来源都不讨论 p = 0 的退化），它来自本项目第三轮审计
      的独立核算，见 notes。
  - ref: brower-1972
    loc: "§II-III（节号未核实）"
    note: Brower 用谱生成代数给出独立证明；节号形式沿用 v2/v3，未与原文核对（APS 403，正文未获取）。
  - ref: gsw-1987-v1
    loc: "§2.3.2-2.3.3（教科书版本：DDF 态张成 H_phys 模零模态）"
    note: GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写；GSW 取 α' = 1/2。
  - ref: polchinski-1998-v1
    loc: "§4.1, p.124：结论 (4.1.20) H_OCQ = H_light-cone，原书注明「as will be shown in section 4.4」；证明在 §4.4（BRST 版本，属 worldsheet.no-ghost-theorem-brst）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐页）——E58/Q7 关闭】

      三点落实，其中两点修正本图先前的记录：
      1. **措辞**：§4.1 (4.1.20) 处逐字「The OCQ at A = −1 and D = 26 is in fact the same as
         light-cone quantization at all mass levels, H_OCQ = H_light-cone **(4.1.20)**, **as will be
         shown in section 4.4**. It is only in this case that consistent interactions are known.」
         §4.4 开头 p.137 逐字「**In this section we prove that** …」。
         → 不是 "it can be shown"。旧 note 的「原文措辞未核实」撤销。
      2. ⚠ **§4.1 与 §4.4 的分工与旧记录设想的不同**：§4.1 (4.1.20) 陈述的是
         **H_OCQ ≅ H_light-cone（同构）**，**不是**「内积正定」；三者同构 + 正定是 §4.4 的 (4.4.21)。
         旧 note 写「§4.1 末只陈述结论」这一点仍对，但结论的内容要按上面写。
      3. **是否引用 Goddard–Thorn / Brower：正文不引，书末注记引，且正是归给本卡这一条。**
         §4.1–§4.4 与习题 4.1–4.6 的**正文**中没有任何文献引用标记（pp.121–144 逐页看过）——
         这一点不变；Polchinski 的体例是把参考文献集中在书末注记（p.9 逐字「Annotated reference
         lists appear at the end of each volume」）。
         ★ **2026-09-11 更新（reviewer-batch14；抽取记录 §13.3(a)，p.350 第 4 章注记 L1 逐字）**：
         旧 note 写「书末 References（pp.347–358）本项目尚未取页」——**该部分现已取页**，逐字为
           「**Classic proofs of the OCQ no-ghost theorem are Brower (1972) and Goddard & Thorn
            (1972).** … The BRST operator for field theory is derived in Kato & Ogawa (1983);
            **our proof of the no-ghost theorem is loosely patterned on the one in that paper.**」
         ⇒ 两条硬结论：
           (i) **本卡（OCQ 版，DDF 构造）正是原书所说的 "OCQ no-ghost theorem"**，
               而 Polchinski 明确把它的 classic proofs 归给 **Brower (1972) 与 Goddard & Thorn (1972)**
               （书目数据：Phys. Lett. B40, 235；Phys. Rev. D6, 1655，pp.353–354 逐字）。
               故「Polchinski 把（OCQ 版）无鬼定理归功于 Goddard–Thorn/Brower」**现在有 L1 背书**，
               旧 note 的禁令撤销。本卡的归属依据由 goddard-2008 + fgz-1986 两条扩为三条。
           (ii) ⚠ **但 §4.4 的证明不是 GT 的复述**：原书自陈它 "**loosely** patterned on"
                Kato & Ogawa (1983)（BRST 路线），与 GT/Brower 的 OCQ 路线**分属两条**。
                故不得把「Polchinski §4.4 —→ goddard-thorn-1972」画成「复述/follows」边；
                BRST 那一支的归属见 worldsheet.no-ghost-theorem-brst，
                且「loosely」这个限定词必须保留。

      ⚠ **另一处与本节点直接相关、本图先前记反的事实**（p.143，逐字）：
        "Eq. (4.4.19) defines an OCQ-physical state in each cohomology class. For the special case
         of flat spacetime this state can be constructed more explicitly by using the **Del Giudice–
         Di Vecchia–Fubini (DDF) operators** … **so this is deferred to chapter 8**."
      → 原书**明写**了 §4.4 ↔ DDF（第 8 章）的连接。本图别处「本书从未把 DDF 与 §4.4 接起来」
        的说法是错的，凡因此标 inferred 的边可以撤销该标记
        （具体在 ddf-* 一带，那些文件由他人持有，已在报告中交 lead）。

      经 conv.intercept-sign-a 换算 A = −1 ↔ a = 1。
      见 literature/extractions/polchinski-1998-v1.md §12.3（E58/Q7）与 §12.10 表 A 的 Q7、
      表 B 第 9、22 项。
