id: worldsheet.point-particle-einbein-equivalence
kind: proposition
title: einbein 点粒子作用量与 Nambu 型作用量的经典等价（m > 0）
statement: |
  设 m > 0。einbein 作用量 S'_pp[X, η]（worldsheet.point-particle-einbein-action）
  对 η 的变分给出代数运动方程
    η^{-2} Ẋ^μ Ẋ_μ + m^2 = 0，  即  η = m^{-1} (-Ẋ^μ Ẋ_μ)^{1/2}
  （取 η > 0 的分支，要求 Ẋ^μ Ẋ_μ < 0）。把该解代回 S'_pp 得
    S'_pp[X, η(X)] = -m ∫ dτ (-Ẋ^μ Ẋ_μ)^{1/2} = S_pp[X],
  即 Nambu 型作用量（worldsheet.point-particle-action）。
  因此在类时世界线上，两者给出相同的 X^μ 运动方程，是经典等价的。
  对 m = 0，S'_pp 仍良定而 S_pp 恒为零，此时不存在这种等价。
uses_conventions: [conv.metric-mostly-plus]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.2：**(1.2.5)**（einbein 作用量，p.10）、**(1.2.6)**（`η′(τ′)dτ′ = η(τ)dτ`，即 η 的一维密度变换律，p.11）、**(1.2.7)**（`η² = −Ẋ^μẊ_μ/m²`，即 η 的运动方程解，p.11）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E2。
      **【核实 2026-09-11（curator-v1-sec13，researcher 第七轮 L1 页图逐字）】**
      **式号 (1.2.5)–(1.2.7) 全部正确**，页码 p.10–11，「约」与「式号未核实」撤销，
      位置的证据等级升到 **L1**；本节点断言的「代回后得 S_pp」这一步的**原文措辞仍未逐字核实**
      （本轮读的是式号表，(1.2.7) 到 (1.2.8) 之间的散文没有逐字转录），故本节点的推导状态不变。
      见 literature/extractions/polchinski-1998-v1.md §13.3(b) 的 §1.2 式号全表。
tags: [bosonic-string, action, point-particle, classical, equivalence]
notes: |
  「经典等价」在此严格地指：两个作用量的 X^μ 的 Euler–Lagrange 方程有相同解集。
  它不主张量子等价（路径积分测度层面的等价不在此处论证，Polchinski 也不在此处论证）。
author: curator-polchinski-ch1
created: "2026-09-10"
