id: worldsheet.open-string-mass-shell
kind: proposition
title: 开弦光锥质量壳条件 α' m^2 = N - a
statement: |
  在开弦光锥量子化中，质量由 m^2 = -p^μ p_μ = 2 p^+ p^- - p^i p^i 给出；
  用光锥哈密顿量 H = -p^- 与 (1.3.36) 的写法即 m^2 = 2 p^+ H - p^i p^i。
  代入由约束解出的 α^-_0 并取正规序，得
    m^2 = (1/α') ( N + A ),   N = Σ_{n≥1} α^i_{-n} α^i_n   （对 i = 2..D-1 求和），
  其中 N 是横向能级算符（本征值为非负整数），A 是光锥正规序常数
  （worldsheet.light-cone-normal-ordering-constant）。
  按 conv.intercept-sign-a 换算 a = -A，本图记号下
    α' m^2 = N - a.
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.intercept-sign-a, conv.worldsheet-coordinate-length]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.36)（开弦质量壳）；光锥哈密顿量见 eq. (1.3.19)"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E17，证据等级 [已核实]，双源：
      Headrick 习题 1.7「Thus the mass spectrum (1.3.36) becomes m^2 = 2p^+H - p^i p^i
      (i = 2,…,24)」；Schrans §1.13「Using the mass-shell condition (1.3.36) in D = 26,
      i.e. α'm^2 = N - 1」。两种写法与式号均已核实。
tags: [bosonic-string, light-cone, mass-shell, spectrum, open-string]
notes: |
  Schrans 引用的 α'm^2 = N - 1 是本式在 D = 26（故 a = 1）时的特例，
  它同时确认了本图的符号约定 a = -A 与 conv.alpha-prime-regge 的
  「开弦 α' m^2 = N - a」写法一致。

  这条质量壳与既有节点 worldsheet.light-cone-quantization 末尾写的
  α' m^2 = N - a 逐字一致；本节点把它作为**命题**单列并给出来源，
  使 worldsheet.open-string-intercept 与 worldsheet.critical-dimension-light-cone
  的推导有一条明确的质量壳依赖，而不是只能指向那条定义。
author: curator-polchinski-ch1
created: "2026-09-10"
