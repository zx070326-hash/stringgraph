tags: [superstring, type-i, mobius-strip, one-loop, rr, closed-channel, cross-cap, chan-paton]
notes: |
  ★★【本卡为什么存在（curator，2026-09-11，klein-mobius）】
  (10.8.18) 在本图此前**没有独立节点**：它只活在
  worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences 的 summary 第 (3) 步
  （逐字只有一行「Möbius 带 M₂：Z_{M₂,1} ∝ ±2n·2^5（上号 SO(n)）」），
  且那条推导的 gaps 明记「Klein 瓶 (10.8.7)–(10.8.11) 与 Möbius 带 (10.8.12)–(10.8.18)
  两支仍无节点 … 在图上仍悬空」。本卡把 Möbius 那一支落到结构上。

  【与另外两张同族卡的分工，以及一处**必须注意的不对称**】
  · 圆柱：worldsheet.superstring-cylinder-amplitude-closed-channel-v2，(10.8.1)–(10.8.4)，
    给的是 **NS–NS** 项 Z_{C₂,0} ∝ n²；
  · Klein 瓶：worldsheet.superstring-klein-bottle-amplitude-closed-channel，(10.8.7)–(10.8.11)，
    给的是 **NS–NS** 项 Z_{K₂,0} ∝ 2¹⁰；
  · Möbius 带：**本卡**，(10.8.16)–(10.8.18)，给的是 **R–R** 项 Z_{M₂,1} ∝ ±2n·2⁵
    （原书逐字 'It is slightly easier to focus on the R–R exchange'）。
  ⚠⚠ **三张卡不是同一侧**：做 (10.8.19) 的 R–R 求和时，圆柱与 Klein 瓶要各自用
  Z_{C₂,1} = −Z_{C₂,0}、Z_{K₂,1} = −Z_{K₂,0}（**两条都不在那两张卡的断言里**，见各自的「不断言」），
  Möbius 则直接用本卡。抽取记录 §0.4(a) 的交叉核验就是这么做的：
  −iK[n² + 2¹⁰ ∓ 2·32·n] = −iK(n ∓ 32)²，其中 K ≡ (V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(e^{−2s})]。
  **本卡的 ±2n·2⁵ 是那次核验的三个输入之一**，且其上号（SO(n)）与 (10.8.19) 的 ∓ 上号自洽。

  【± 号在超弦这里**没有**玻色弦那处的表观矛盾】玻色卡 spectrum.one-loop-mobius-amplitude-v2
  的断言 (5) 专门处理「(7.4.22) 的 ± 上号是 +（SO(n)）而 (7.4.24) 写 (2¹³ ∓ n)²」这个表观矛盾，
  来源是闭弦通道展开的无质量系数 **−24**（本图补算）。
  ⚠ **超弦这一侧不出现同款问题**：(10.8.18) 的上号 + 对应 SO(n)，直接代入 §0.4(a) 的求和
  就给出 (10.8.19) 的上号 −（即 (n − 32)²）对应 SO(n)，两处自洽。
  但**本图未复算**超弦 Möbius 的长柱展开系数（对照玻色的 −24），故这条自洽性是**由系数相加读出的**，
  不是逐项验证的。见推导的 gaps。

  【16 的物理释义（**不进断言**，见「不断言 (d)」）】
  把 s → ∞ 极限下方括号里的常数读作「十维无质量闭弦态的计数」（对照玻色弦 Vol.1 (7.4.4) 的 24）
  是标准的物理读法。⚠ **这是本图/抽取者的释义，不是原书在 (10.8.18) 处的断言**。

  【(1 − 1)⁴ 那一项的处理，与它为什么仍被写进陈述】见 sources 第二条：
  抽取记录 Q3 建议「这一式不进任何节点」，本卡采取的是更弱的做法——**照录页图读数、不断言解释**，
  因为 (10.8.17) 的**右端**是 (10.8.18) 第一行的分子，删掉整条式会让 (10.8.18) 的来历在卡上断掉。
  ⚠ 若 reviewer 判定连页图读数也不该入卡，按原则 1 只能换代（新建 -v2 并写 superseded_by），
  **不得就地删**。

  【本卡不与 consistency.type-i-hexagon-so32-iff 建边】理由同
  worldsheet.type-i-tadpole-cancellation-so32-v2 的（限定 4）：§10.8 全节不出现 'anomaly'，
  §10.6 p.31 把发散与时空反常并列而非串联，§12.2 p.102 逐字说 type I 的规范群由 tadpole 相消定。
