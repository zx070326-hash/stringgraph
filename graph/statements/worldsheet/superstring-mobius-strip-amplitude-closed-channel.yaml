id: worldsheet.superstring-mobius-strip-amplitude-closed-channel
kind: proposition
title: type I Möbius 带真空振幅中 R–R 交换那一项的闭弦通道形式 (10.8.18)：Z_{M₂,1} = ±2in(2⁵V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(e^{−2s})]，上号对应 SO(n)
statement: |
  **设定（是陈述的一部分）**：type I 弦——十维平坦时空、**无取向**（Ω 投影）的开 + 闭超弦，
  开弦带 n 个 Chan–Paton 自由度（spectrum.chan-paton-factors；**本书记号下 Sp(k) 对应 n = 2k**）。
  考虑 **Möbius 带** M₂ 的单圈真空振幅：0 ≤ Re w ≤ π、w ≅ −w̄ + π + 2πit
  （spectrum.one-loop-mobius-amplitude-v2 的几何），唯一的模记作 t ∈ (0, ∞)，**无模群**；
  M₂ 有**一条边界**（故只挂一个 Chan–Paton 迹）与**一个 cross-cap**。
  费米迹记号 Z^α_β(τ) = Tr_α[q^H exp(πiβQ)] 按
  worldsheet.modular-invariance-requires-eight-transverse-fermions（原书 §10.7 (10.7.7)–(10.7.9)，
  **这些迹是「对一对维数」取的**，故下面出现四次幂）。
  **归一化（必须带上）**：原书 p.38 逐字 'Note that the GSO and Ω projection operators each
  contribute a factor of ½.'——这正是下式测度 dt/8t 的来源（对照玻色版 (7.4.22) 的 dt/4t）。
  **闭弦通道的长度**取 **s = π/4t**（原书 p.40 逐字给出三拓扑的换算：圆柱 π/t、Möbius π/4t、
  Klein 瓶 π/2t）。
  ⚠⚠ **本卡给的是 R–R 交换那一项 Z_{M₂,1}**（原书逐字：'It is slightly easier to focus on the
  R–R exchange'），与圆柱、Klein 瓶两张同族卡给 **NS–NS** 项（Z_{C₂,0}、Z_{K₂,0}）**不同**。

  **断言**：
    **(1) 周期性与扇区识别**：在迹里插入 R = Ω exp(πiβF)，则场的周期性是
          ψ^μ(w + 4πit) = −exp(πiβ) ψ^μ(w + 2πit − π) = ψ^μ(w − 2π)               (10.8.16)
        由此（原书逐字）：'It follows that **in the R sector of the trace the fields are periodic
        in the σ²-direction, corresponding to the R–R exchange, while the NS sector of the trace
        gives the NS–NS exchange.**'
        ⚠⚠ **这条判据与圆柱相反**：圆柱上是「**迹里是否出现 exp(πiF)**」分 NS–NS / R–R
        （worldsheet.superstring-cylinder-amplitude-closed-channel-v2 的断言 (2)），
        这里是「**迹的 R 扇区 / NS 扇区**」分。Klein 瓶又是第三条判据
        （σ² → σ² + 4πt 下的周期性）。**三条判据各不相同，不得互相套用。**
    **(2) 两个迹之和**（原书逐字：'the traces with Ω and Ω exp(πiF) sum to'）：
          −16 q^{1/3} ∏_{m=1}^∞ [1 + (−1)^m q^m]⁸ − (1 − 1)⁴ q^{1/3} ∏_{m=1}^∞ [1 − (−1)^m q^m]⁸
            = Z⁰₁(2it)⁴ Z¹₀(2it)⁴                                                  (10.8.17)
        ⚠ 左端第二项的系数 **(1 − 1)⁴** 是页图读数（已单页重渲染复核），**其值为零**；
        它「为什么被写出来」不属本断言，见「本命题不断言 (a)」。
    **(3) 完整的 Möbius 振幅与闭弦通道形式**（原书逐字：'The full Möbius amplitude,
        **rewriting the bosonic part slightly**, is'）：
          Z_{M₂,1} = ±inV₁₀ ∫₀^∞ (dt/8t)(8π²α't)^{−5} · [Z⁰₁(2it)⁴ Z¹₀(2it)⁴] / [η(2it)⁸ Z⁰₀(2it)⁴]
                   = ±2in (2⁵V₁₀/(8π(8π²α')⁵)) ∫₀^∞ ds [Z⁰₁(2is/π)⁴ Z¹₀(2is/π)⁴] / [η(2is/π)⁸ Z⁰₀(2is/π)⁴]
                   = **±2in (2⁵V₁₀/(8π(8π²α')⁵)) ∫₀^∞ ds [16 + O(exp(−2s))]**      (10.8.18)
        **其中上号对应 SO(n)**（原书逐字：'where **the upper sign is for SO(n)**. **We have used
        (7.4.22) in D = 10.**'）。
        ⚠ 第三行方括号里的 **16** 在本断言里只是**原书印出的那个数**；它「是什么的计数」
        不属本断言，见「本命题不断言 (d)」。

  **本命题不断言**：
    (a) ⚠ **不断言 (10.8.17) 左端第二项的含义**。**原书不解释为何要把一个恒为零的项写出来**。
        抽取记录给出的解读（8 个横向费米子分成 4 对，含 Ω 与含 Ω exp(πiF) 的两个迹在该结构上
        逐对相消，故系数 (1−1)⁴）**是抽取者的解读，不是原书内容**（抽取记录 Q3）。
        本卡**照录**该式的页图读数，**不断言**任何解释。
        ⚠ (10.8.18) 的结果**不依赖**这一项（它为零）。
    (b) **不断言 NS–NS 侧的值，也不断言相消**。原书在此只写 R–R 一侧；
        'Z_{M₂,0} = −Z_{M₂,1}' 型的超对称相消（§10.7）**不在本卡的断言里**，
        理由与 worldsheet.superstring-cylinder-amplitude-closed-channel-v2 的「不断言 (a)」相同。
    (c) **不断言三个拓扑的 tadpole 相加、(n ∓ 32)² 与 SO(32)**。那是
        worldsheet.type-i-tadpole-cancellation-so32-v2。
        ⚠ 特别地，**本卡不断言 (10.8.19) 里那个 ∓ 的整体符号是算出来的**——原书自承
        'This calculation does not determine the sign of the tadpole, but it should be n ∓ 32'。
        本卡只断言 (10.8.18) 内部「上号 ↔ SO(n)」这一条对应。
    (d) **不断言 (10.8.18) 第三行方括号里的 16「是什么的计数」**。本卡只断言原书印出的那个数
        （口径与圆柱、Klein 瓶两张同族卡一致）。
    (e) ⚠⚠ **不断言 2⁵ 是「2^{D/2} 的普适计数」**。原书**从不写符号形式 2^{D/2}**，
        也从不把 Vol.1 (7.4.23) 的 2¹³ 与本处的 2⁵ 并列比较（抽取记录 #E74 的分层裁决 (ii)）。
        ⚠ 尤其**不得**把本卡的 2⁵ 与 GSW 六边形的 2⁵
        （math.hexagon-odd-twist-count、consistency.type-i-hexagon-so32-iff）说成同源：
        **没有任何文献解释这三个 32 为什么相等**（抽取记录 Q5）。
    (f) **不断言由 (10.8.18) 第一行到第二行的模变换步骤**。原书在此**直接写等号**，
        既不重述 (10.8.3) 的两条模变换，也不写 s = π/4t 的换元过程。本图未展开这一步
        （见推导的 gaps）。
    (g) **不断言 (10.8.3) 第二式的模变换是无限定的**。Z^α_β(it) = Z^β_{−α}(i/t) 是 §10.7
        (10.7.14) 的特例，而 (10.7.14) 在原书里**明确带 'naive' 的限定**（逐字：'The reason
        these modular transformations are naive is that there is no diff-invariant way to define
        the phase of the path integral for purely left-moving fermions'）。
        **§10.8 直接使用而不重述这个限定**；本卡照实记下，故断言 (3) 继承该限定。
    (h) **不断言前缀里 α' 的幂次取自页图读数**。本卡采纳 **(8π²α')⁵**（单撇），根据是
        **复算 + 量纲 + 跨卷控制组**三重复核，**不是**像素判读：
          (i) 复算闭合（抽取记录 §0.4(b)：圆柱与 Klein 瓶两条独立换元都闭合到
              1/(262144 π¹¹ α'⁵) = 1/(8π(8π²α')⁵)，该前缀是三个面的**公因子**）；
          (ii) 量纲：V₁₀ 需要 length¹⁰，(8π²α')⁵ 正好给 length¹⁰；
          (iii) 跨卷一致性：Vol.1 对应式 (7.4.23) 用 (8π²α')¹³。
        ⚠ **页图上的小字号读数不可复现**：读出 α'² 的位置与「落在被降为 \scriptstyle 的分式分母里」
        **完全相关**；本式**首行**以全字号出现的 (8π²α't)^{−5} 读数干净，第二轮单页重渲染
        p.42 的 (10.8.18) **读作单撇**。⇒ 判为**渲染假象**，**不判为原书排印错误**；
        **不得援引 (13.3.12) 的「书错」先例**（那处读数可复现，本处不可复现）。
        ⚠ **残余不确定性（照实登记，不因此降级）**：两轮复核仍只用了**同一条成像管线**
        （Cambridge Core PDF → 页图渲染）；官方勘误表取不到（KITP errata 页 404）。
    (i) **不断言 ± 号与 SO(n)/Sp(k) 的对应被逐一验证**。原书在 (10.8.18) 处只写一句
        'the upper sign is for SO(n)'，把计数推给 Vol.1 (7.4.22)；而玻色卡
        spectrum.one-loop-mobius-amplitude-v2 自己的推导 gaps 也写明「原书只写出计数」。
        ⇒ 本卡继承那一处的限度。
    (j) **不断言 cross-cap 态 |C⟩ 的形式**（玻色版原书留作习题 7.15，玻色卡已写明）。
    (k) **不断言带顶点算子的 Möbius 振幅**（原书此处只算真空振幅；脚注 7 指出加顶点算子后
        NS–NS 与 R–R 的逐拓扑相消不再成立，那是 tadpole 卡的内容）。
