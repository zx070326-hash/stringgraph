    loc: "§7.4「The Möbius strip」, eq. **(7.4.22)**（玻色弦 Möbius 带真空振幅；Vol.2 §10.8 逐字 'We have used (7.4.22) in D = 10.'）；**(7.4.21)**（ϑ₀₀η 的组合）；**(7.4.23)**（26 维闭弦通道形式 ±2n·2¹³V₂₆/(4π(8π²α')¹³)，与 (10.8.18) 的 ±2n·2⁵V₁₀/(8π(8π²α')⁵) 逐项对照）；Chan–Paton 计数逐字见 (7.4.22) 上方 'For the SO(n) theory the ½n(n+1) symmetric states have Ω = +1 while the ½n(n−1) antisymmetric states have Ω = −1 for a net contribution of n. For the Sp(k) theory these degeneracies are reversed, giving −n (recall that in our notation Sp(k) corresponds to n = 2k Chan–Paton states).'"
    note: |
