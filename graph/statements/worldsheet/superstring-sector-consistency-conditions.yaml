tags: [superstring, gso, sectors, consistency, definition]
notes: |
  ★【本卡是 GSO 投影在本书里的真正起点】抽取记录 E42 明确指出：
  **GSO 投影在本书里是这三条一致性条件之解的重述，不是独立公设**
  （与很多教材把 GSO 当作额外投影公设不同）。
  故本图的依赖方向是：三条条件 → 扇区组合的解（worldsheet.superstring-sector-consistency-solutions）
  → GSO 投影的重述（worldsheet.gso-projection），**不是**反过来。

  【status: physical-argument 的理由】三条条件本身是**被强加的**：
  (a) 的理由是「否则振幅无法自洽定义」（物理论断，不是定理）；
  (b) 是 OPE 闭合的要求，而 OPE 收敛在本图未公理化；
  (c) 明说只是模不变性的一个必要条件，其推导（模变换）在 §10.7 才做。
  另外上游 worldsheet.rns-fermion-number-operator 的鬼场部分经玻色化，本身是 physical-argument。

  【(a) 的相位公式依赖自旋场的分支切割】即 §10.3 的谱流/自旋场（(10.3.20)–(10.3.29)）
  与 §10.4 末的 cocycle（(10.4.26)–(10.4.28)）。**本图没有这两块的节点**
  （玻色化、自旋场、cocycle 均未建），故 (10.6.4) 那个相位在本图无支撑推导，
  推导的 gaps 里记明。

  ★★【三条条件不足以唯一定谱（reviewer-v2-ch10 复核发现，2026-09-11）】
  formal/StringFormal/Math/FiniteCounts.lean 对 (Z_2)^4 做了完整枚举：
  **(a)(b)(c) 字面上有 10 个解，不是原书列出的 6 个。**
  多出的四个是 (NS+,NS+) 加**单个** R–R 扇区，各为原书某个解的**真子群**。
  也就是说本卡的三条条件**不足以唯一确定谱**——还要加上一条原书未明说的
  **极大性**条件（谱含所有与已含扇区相容的扇区），它隐含在 (10.6.9)–(10.6.11)
  把结果重述为 GSO 投影时的措辞 'keeping **all** sectors with …' 里。
  → 极大性作为前提 (d) 写在 worldsheet.superstring-sector-consistency-solutions；
    本卡**不**改（它记的是原书强加了哪三条），只在此记账。
  排除那四个非极大解预期要靠 §10.7 的完整模不变性（条件 (c) 只是它的一个必要条件），
  **本图未建那一块**。
