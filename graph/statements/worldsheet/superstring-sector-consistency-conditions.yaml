id: worldsheet.superstring-sector-consistency-conditions
kind: definition
status: physical-argument
title: 十维超弦扇区组合的三条一致性条件（相互局域性、OPE 闭合、至少一个 R 扇区）
statement: |
  用 worldsheet.superstring-sector-labels 的标号：闭弦扇区记作 (α, F, α̃, F̃)，共 2^10 种
  子集组合。原书**强加**下列三条一致性条件（逐字标号 (a)(b)(c)）：

  **(a) 相互局域性（mutual locality）**。当一个顶点算子绕另一个转一圈时，
      两者的算子乘积获得相位 exp πi(F_1α_2 − F_2α_1 − F̃_1α̃_2 + F̃_2α̃_1)。
      要求该相位为 1，即
        F_1α_2 − F_2α_1 − F̃_1α̃_2 + F̃_2α̃_1 ∈ 2Z。
      **物理理由（原书逐字）**：'the spinor fields have branch cuts in the presence of R sector
      vertex operators. Various pairs of vertex operators will then have branch cuts in their
      operator products — they are not mutually local. The operator F counts the number of
      spinor fields in a vertex operator, so the net phase when one vertex operator circles
      another is …'；'If this phase is not unity, the amplitude with both operators cannot be
      consistently defined.'

  **(b) OPE 闭合**。若 (α_1, F_1, α̃_1, F̃_1) 与 (α_2, F_2, α̃_2, F̃_2) 都在谱中，
      则 (α_1+α_2, F_1+F_2, α̃_1+α̃_2, F̃_1+F̃_2) 也在谱中（各分量 mod 2）。

  **(c) 模不变性的一个必要条件**。**必须至少有一个左移 R 扇区（α = 1）
      与至少一个右移 R 扇区（α̃ = 1）**。
      原书对这一条的定位逐字：'We will study modular invariance in the next section, but
      in order to reduce the number of possibilities it is useful to extract one simple
      necessary condition.'——即它是模不变性的**必要条件之一**，不是模不变性本身。

  另有一条已经用掉的条件：能级匹配把 16 个扇区里的六个（NS− 与其余三者的配对）排除
  （worldsheet.superstring-sector-labels）。

  **本卡是「本书强加哪些条件」的记账**，不是这些条件的论证。
  原书逐字：'Thus there are potentially 2^10 combinations of sectors, but only a few of these
  lead to consistent string theories. **We impose three consistency conditions**'。
  本卡**不**断言这三条是充分的，也**不**断言它们是必要的
  （(c) 明说只是必要条件的一部分；(a)(b) 的必要性论证是物理层面的）。
uses:
  - worldsheet.superstring-sector-labels
  - worldsheet.rns-fermion-number-operator
uses_conventions:
