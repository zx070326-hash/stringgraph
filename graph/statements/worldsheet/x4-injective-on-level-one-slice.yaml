notes: |
  【与 claim.md 的对应，逐字核对 —— curator 亲自 Read claim.md 全文、SixSliceInjective.lean
  全文 356 行、DDF.lean 第 108 行 towerMomentum 定义，非转述 status.yaml 的自我报告】

  claim.md 的定理量词是「∀ p : Fin D → K **任意**（对 p·p 无约束）」；Lean 定理
  `x4_eq_zero_of_mem_towerBigrade_one` 表面量词是「∀ 整数 rung j、u ∈ towerBigrade D R j 1」，
  未显式出现自由动量参数 p。curator 核实两者一致（不是窄化）：`towerBigrade D R j 1` 上
  x4 的作用经 `towerLop`/`towerMomentum a b j := a + j·b`（DDF.lean:108，curator 亲自 Read）
  实现，而 `a b : Fin D → R` 是该定理**完全自由**的 section 变量（无 hab/hbb 等关系假设）。
  取 j = 0、b = 0、a = p（p 任意），towerMomentum a b 0 = a = p 恰好实现「rung 0 = 单份
  F(p)」，故该 Lean 定理对每个（a,b,j）成立 ⟹ 对每个自由动量 p 成立（j=0 特例即复现
  claim.md 的任意 p）。status.yaml 裁决要点 10 独立指出「形式 A 本身对每个 D、每个 eta、
  每个 p 成立」，但未展开 towerMomentum 的具体机制；本条 notes 是 curator 自己核对源码
  补的机制确认。

  【D 无关性，curator 亲自 Read 确认】本卡对**每个** D（Lean 侧 section 变量无下界约束，
  claim.md 保留 D≥2 只是为了与光锥标架惯例兼容）、每个 CharZero 的 Algebra ℚ 交换环 R
  （NoZeroDivisors）成立；D=26 完全不出现在本卡陈述或其 Lean 证明里（D=26 只出现在
  **另一条**命题——形式 A ⟹ 形式 B 桥接的第 3 步，见 SeedCriterionSix 的
  mem_towerSeed_neg_six_one_iff 的 hD26 假设——本卡不涉及，不应被误读为消费了 D=26）。

  【归一化差异，诚实记录，取自 status.yaml】Lean 证明算出的常数是 -2040（≠0，蕴含单射），
  proof.md 手算给出 -408；两者相差恰是力矩阶数因子 5（`towerModeVec` 的 CCR 归一化 vs
  proof.md「读裸系数」的差异），非零性等价，结论（单射）不受影响。该差异已由 lead 逐词
  核验（status.yaml「归一化差异」条目，curator 未重复核验，取自 status.yaml 的记录）。

  【范围边界，明确不断言】本卡**不**断言、**不**依赖：
  (a) 形式 A ⟹ 形式 B 的四步桥接（未在 Lean 里实现，按任务书明确排除，非缺口，
      见 status.yaml「仍未做」条目）；
  (b) SixSeedKernelSharp（形式 B）在一般 D 上成立；
  (c) N=6 的 (B-26) 无条件闭合（仍需 D=26 且仍需上面 (a) 的桥接）。

