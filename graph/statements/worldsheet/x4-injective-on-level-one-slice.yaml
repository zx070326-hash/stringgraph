id: worldsheet.x4-injective-on-level-one-slice
kind: proposition
title: "x4（level-4 合冲词）在自由玻色 Fock 空间任意动量的 level-1 切片上单射"
statement: |
  沿用 worldsheet.virasoro-generators-free-boson 的记号：设 K 是 CharZero 域、Algebra ℚ K，
  D : ℕ（D ≥ 1 即可），η : Fin D → K 满足 hη : ∀ μ, η μ · η μ = 1，p : Fin D → K **任意**
  （对 p·p 不设任何约束；这里的 p 就是该卡 statement 里零模本征值 a^μ = α^μ_0 那个自由参数，
  不预设它与物理动量 k 经 √(2α') 的具体关系）。记 F(p) 为该卡定义的 Fock 空间（基态 |0;p⟩
  满足 α^μ_0|0;p⟩ = p^μ·|0;p⟩，用 α^μ_{-n}（n > 0）作用生成），L_n 为该卡的 Sugawara 生成元。
  定义 level-4 算子

    x4 := -76 L_{-4} - 52 L_{-3}L_{-1} - 12 L_{-2}² - 20 L_{-2}L_{-1}² - 3 L_{-1}⁴  : F(p) → F(p)，

  作用在 level-1 切片 F(p)_1 := span{α^μ_{-1}|0;p⟩}_{μ=0}^{D-1}（维数恰为 D）上。则

    ∀ u ∈ F(p)_1,  x4·u = 0  ⟹  u = 0，

  即 x4|_{F(p)_1} : F(p)_1 → F(p)_5 单射。
