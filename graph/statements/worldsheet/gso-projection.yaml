    loc: "§10.6, eq. (10.6.9)（IIB 的投影）、(10.6.10)（IIA 的投影）、(10.6.11)（0B 的对角投影），pp. 27–28；GSO 命名的逐字句与手征性讨论同处"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E42；式号与全部逐字措辞逐页读到原书页图）。
      ★ 抽取记录明确要求：'GSO 投影在本书里是 E41 结论的重述，不是独立公设。
      转节点时应准确反映：gso-projection 的推导依赖 (10.6.5)/(10.6.6)/(c) 三条一致性条件。'
tags: [superstring, gso, type-ii, chirality, sectors]
notes: |
  【与教科书通行叙述的差别，务必保留】很多教材把 GSO 投影当作为消除快子而额外强加的公设。
  Polchinski 不是：他先解三条一致性条件（相互局域性、OPE 闭合、模不变性的必要条件），
  得到四个扇区组合，**然后**指出这些组合可以写成对 exp(πiF) 的投影。
  本图的依赖方向严格按此。

  【(−1)^{α̃} 的含义】α̃ = 1（R）时取 −1、α̃ = 0（NS）时取 +1，
  即 IIA 在右移 R 扇区取与 IIB 相反的投影。这正是 IIA/IIB 手征性差别的来源。

  【时空超对称与引力微子不在本卡】(10.6.12)–(10.6.15)（引力微子态、等价关系 u_{μs} ≅ u_{μs} + k_μζ_s
  是局域时空超对称的标志）见 worldsheet.type-ii-spacetime-supersymmetry。
  ⚠ 那张卡的 status 受原书一句赤裸断言影响（'if all requirements for a consistent string
  theory are met (and they are)'）。

  ★★【数学文献一侧的对应物（2026-09-11 新建，**本卡未接线**，lead 指示留 reviewer）】
  **worldsheet.superstring-gso-covariant-equivalent**（= Lian–Zuckerman 1989 **Proposition 4.3**）
  是本图目前**唯一** rigorous 的"GSO 之后"候选来源：它在相对 BRST 复形上造出投影子
  P̄_± = ½(1 ± (−1)^{U+κ}Ḡ_κ)，证明 H*_rel ≅ H*(P̄_+C_rel) ⊕ H*(P̄_−C_rel) 是正交分解
  且 dim H^n(P̄_+C_rel) 只在 n = 0 非零。
  ⚠⚠ **为什么不接边**：两侧的投影算子**不是同一个对象**——本卡用世界面费米数 exp(πiF)、
  exp(πiF̃)（不含鬼场），LZ 用含**鬼场贡献**的 (−1)^{U+κ}Ḡ_κ（p.329 Remark 列出四个鬼场对合
  因子）。文献里公认两者对应同一件事，但**这个字典本图未核实，LZ 也不写 exp(πiF)**。
  ⇒ 要接线必须先核字典；硬接一条 inferred 边不如把缺口写明。
  ⚠ 另两点不对齐（都写在新卡的"本命题不断言"里）：
    (1) LZ §4 处理**单侧**（开弦型）复形，**没有** IIA/IIB/type 0 的三分与手征性；
    (2) LZ 的动词是 **achieved**（p.330 'Thus we have achieved the "covariant" equivalent of
        the GSO projection.'，引号只包 covariant），即**协变重述**，不是证明 GSO 投影；
        原始提案 LZ 明确归 **Gliozzi–Scherk–Olive 1977**，且说那是在 "old covariant" 形式下提的
        ——这与本卡"GSO 不是独立公设"的逻辑方向**同向**（本卡由一致性条件解出，LZ 由代数截断
        协变化），两者都不把 GSO 当作额外公设。
