id: worldsheet.gso-projection
kind: proposition
title: GSO 投影是一致性条件之解的重述：IIB 保留 exp(πiF) = exp(πiF̃) = +1，IIA 保留 exp(πiF) = +1、exp(πiF̃) = (−1)^{α̃}
statement: |
  worldsheet.superstring-sector-consistency-solutions 得到的扇区组合可以**等价地重述**为
  对 exp(πiF) 与 exp(πiF̃) 的本征子空间的投影：
    **IIB**：保留所有满足 exp(πiF) = exp(πiF̃) = **+1** 的扇区；
    **IIA**：保留所有满足 exp(πiF) = **+1**、exp(πiF̃) = **(−1)^{α̃}** 的扇区。
  这种「把完整谱投影到 exp(πiF) 与 exp(πiF̃) 的本征空间」的操作称为
  **Gliozzi–Scherk–Olive (GSO) 投影**（原书逐字：'This projection of the full spectrum down to
  eigenspaces of exp(πiF) and exp(πiF̃) is known as the Gliozzi–Scherk–Olive (GSO) projection.'）。

  **手征性**：IIA 在 NS–R 与 R–NS 扇区取**相反**的 GSO 投影，故谱是**非手征**的
  ——它在时空宇称下不变（时空宇称交换 8 ↔ 8′ 与 56 ↔ 56′；在世界面上这个对称性是
  时空宇称与世界面宇称的乘积）。IIB 在每个扇区取**相同**的 GSO 投影，故谱是**手征**的。

  **type 0 的对角 GSO**：例如 0B 由「保留所有满足 α = α̃、exp(πiF) = exp(πiF̃) 的扇区」定义。
  原书逐字：'The projections that define the type II theories act separately on the left- and
  right-moving spinors, while the projections that define the type 0 theory tie the two together.
  The latter are sometimes called *diagonal GSO projections*.'

  ★★ **本命题的要点在于逻辑方向**：GSO 投影在本书里**不是独立公设**，
  而是三条一致性条件之解的**重述**。任何把 GSO 当作额外假设的读法都与本书不符。
  本卡因此**依赖** worldsheet.superstring-sector-consistency-solutions，而不是相反。

  本命题**不**断言 GSO 投影后谱的幺正性（那由 worldsheet.no-ghost-theorem-superstring
  的第 (4) 条承担：无鬼定理在 exp(πiF) 的每个本征子空间上分别成立），
  也**不**断言无质量谱的内容。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
sources:
