notes: |
  **area 选择是权宜之计**：本节点的内容是一般量子场论的（任何闭规范代数），
  与世界面无关。`graph/schema/areas.yaml` 目前没有合适的 area（最接近的 `consistency`
  语义也不对）。curator 建议 lead 考虑新增 `qft`（"一般规范系统与 BRST 形式"）area，
  并把本节点、worldsheet.brst-invariance-of-gauge-fixed-action、
  worldsheet.brst-gauge-choice-independence、worldsheet.brst-charge-general-constraint-algebra、
  worldsheet.brst-nilpotency-from-jacobi、worldsheet.brst-point-particle-cohomology 六个节点迁过去
  （id 迁移需按 graph/CLAUDE.md 走"新建 + superseded_by"，故本轮不自行动手）。

  **本节点只覆盖闭规范代数**（结构常数与场无关）。开规范代数（结构"常数"依赖场，如
  超引力）需要 Batalin–Vilkovisky 形式与额外的高阶鬼场项，δ_B 只在运动方程上幂零；
  本图无相关节点。抽取记录 E60 的"注意"一栏提到这一点。

  与 worldsheet.brst-quantization 的关系：那是弦的**正则/模式**版 BRST（Q_B 的模式展开），
  本节点是**拉氏量/路径积分**版的一般框架。两者是同一形式的两种表述，本图**不**在它们之间
  连 uses 边：连了会把 brst-quantization 的 rigorous（纯代数路线）拉低到本节点下游的
  路径积分论证水平，理由与 brst-quantization 的 notes 中"是否 uses bc-ghost-cft"的裁断相同。
  弦的 j_B（worldsheet.brst-current-bosonic-string）则确实取本框架为出发点。
