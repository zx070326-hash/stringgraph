id: worldsheet.brst-gauge-fixed-action
kind: definition
status: rigorous
title: 一般（闭）规范系统的 BRST 规范固定作用量与 BRST 变换
statement: |
  **适用范围**：本节点讲的是**一般规范系统**，不专属世界面理论；放在 worldsheet area 只因为
  本图目前没有 qft/general area（见 notes）。

  设有场 φ^i 与经典作用量 S_cl[φ]，其规范对称性由生成元 δ_α（α 取规范指标）给出：
    δφ^i = i ε^α (δ_α φ^i)，
  并设规范代数**闭**且结构常数 f^γ_{αβ} 与场无关（"闭规范代数"）：
    [δ_α, δ_β] = i f^γ_{αβ} δ_γ，   f^γ_{αβ} = − f^γ_{βα}。
  取一组规范固定函数 F^A(φ)。引入
    鬼场 c^α（Grassmann 奇，鬼数 +1）、
    反鬼场 b_A（Grassmann 奇，鬼数 −1）、
    Nakanishi–Lautrup 辅助场 B_A（Grassmann 偶，鬼数 0）。

  **规范固定后的量子作用量**定义为
    S_q = S_1 + S_2 + S_3,
    S_1 = S_cl[φ],
    S_2 = − i B_A F^A(φ),
    S_3 = b_A c^α (δ_α F^A)(φ)。

  **BRST 变换**（ε 是 Grassmann 奇的常参数，δ_B 记 ε 已乘上的整体变换）定义为
    δ_B φ^i = − i ε c^α (δ_α φ^i),
    δ_B B_A = 0,
    δ_B b_A = ε B_A,
    δ_B c^α = (i/2) ε f^α_{βγ} c^β c^γ。

  **鬼数**：gh(φ^i) = gh(B_A) = 0，gh(c^α) = +1，gh(b_A) = −1；δ_B 把鬼数提高 1
  （ε 记鬼数 −1 时 δ_B 保鬼数，两种记法等价）。

  记号与归一化说明：上式的 ± 与 i 的位置是**本节点固定的一套自洽归一化**，
  它被选来使 worldsheet.brst-invariance-of-gauge-fixed-action 的
  δ_B(b_A F^A) = i ε (S_2 + S_3) 成立（该恒等式的逐步验算写在该命题的推导里）。
  Polchinski §4.2 的归一化可能与此相差整体符号或 i 的位置，本图**未核对原书**；
  下游命题（BRST 不变性、幂零性、规范选择无关性）的内容不依赖这些约定选择。
