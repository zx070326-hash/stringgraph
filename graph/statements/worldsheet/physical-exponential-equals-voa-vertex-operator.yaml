    （arXiv:math-ph/0412039，全文 L1）§5.2 写 `Y_α(z) := E_α z^{α_0} :e^{φ_α(z)}:`
    ——这是本项目迄今**结构上最接近**的一处（VOA 的 `Y(·,z)` 记号与 Wick 正规序指数
    并排出现）。但它是**一个定义式**（用 `:=` 把 `Y_α` 定义成右端），**不是两个独立
    构造出来的对象之间的等式**；且全文不写 `X^μ(z)`，推导中从不把 `φ_α(z)` 系到时空。
    **教训（判据的第三条，此前只有两条）：定义不等于识别。** 断言 (2) 要的是物理侧
    `:e^{ikX}:` 与 VOA 侧独立定义的 `𝒴(e^α,z)` 各自被构造出来**之后**被证明/断言相等；
