id: worldsheet.closed-superstring-worldsheet-parity-action
kind: definition
status: rigorous
title: 世界面宇称 Ω 在**闭超弦**世界面费米子上的作用：Ωψ(w)Ω^{−1} = ψ̃(w̄)、Ωψ̃(w̄)Ω^{−1} = ψ(w)（Ω 交换左右移），一般插入 R = Ω exp(πiβF + πiβ̃F̃) 时带相位 exp(πiβ) / exp(πiβ̃)；Ω² 与 ψ、ψ̃ 对易
statement: |
  **设定（是陈述的一部分）**：**闭**超弦（RNS 形式），世界面柱面坐标 w = σ¹ + iσ²，
  w ≅ w + 2π（Vol.2 §10.2 的取法，见 worldsheet.rns-fermion-periodicity）；
  ψ^μ(w) 为左移（全纯）世界面费米子、ψ̃^μ(w̄) 为右移（反全纯）世界面费米子；
  F、F̃ 为左右两侧的世界面费米数（worldsheet.rns-fermion-number-operator），
  β、β̃ ∈ {0, 1} 标记迹里是否插入 exp(πiF) / exp(πiF̃)。
  Ω 在闭弦**玻色**部门上的作用按 worldsheet.worldsheet-parity
  （闭弦 σ ↦ −σ，Ω α_n^i Ω^{−1} = ᾱ_n^i、Ω ᾱ_n^i Ω^{−1} = α_n^i，Ω² = 1）。
  **本卡给出它在闭超弦费米部门上的作用。**

  **定义与断言**：
    **(1) 一般插入的伴随作用（原书 (10.8.8a,b) 的中间一项，逐字）**：取
          R = Ω exp(πiβF + πiβ̃F̃)，则
            R ψ(w) R^{−1}  = exp(πiβ)  ψ̃(w̄) ,
            R ψ̃(w̄) R^{−1} = exp(πiβ̃) ψ(w) 。
        ⇒ **R 把左移费米子送到右移费米子、把右移送到左移，各带一个由 β / β̃ 定的相位**。
    **(2) Ω 本身（β = β̃ = 0 的特例）**：
            **Ω ψ(w) Ω^{−1} = ψ̃(w̄) ,   Ω ψ̃(w̄) Ω^{−1} = ψ(w)** 。
        即 **Ω 在闭超弦费米部门上的作用就是交换左移与右移**，与它在玻色部门上交换
        α_n ↔ ᾱ_n（worldsheet.worldsheet-parity）**同款**。
    **(3) 迭代一次（原书 (10.8.9) 的代数内容）**：把 (1) 用两次得
            R² ψ(w) R^{−2} = exp[πi(β + β̃)] ψ(w) ,
        取 β = β̃ = 0：
            **Ω² ψ(w) Ω^{−2} = ψ(w) ,   Ω² ψ̃(w̄) Ω^{−2} = ψ̃(w̄)**
        ——即 **Ω² 与两侧的世界面费米子都对易**。
        ⚠⚠ **这与开超弦截然不同**：开弦上 Ω 把 ψ^μ(w) 送到**同一个场**的平移
        ψ^μ(w − π) 并带相位 exp(−πir)，其平方是 **Ω² = exp(πiF) ≠ 1**
        （(10.8.14)，见 worldsheet.superstring-worldsheet-parity-action）。
        **闭弦这里是「交换两次回到原处」，开弦那里是「同一个场转两次相位」。**
    **(4) 路径积分边界条件的写法（原书 (10.8.8a,b) 全式，逐字）**：在 Klein 瓶（σ² 方向周长
        2πt，迹里插入 R）上，
            ψ(w + 2πit)  = − R ψ(w) R^{−1}  = − exp(πiβ)  ψ̃(w̄) ,
            ψ̃(w̄ + 2πit) = − R ψ̃(w̄) R^{−1} = − exp(πiβ̃) ψ(w) ,
        原书对最前面那个额外负号的全部说明逐字只有一句：
        '**with the usual extra sign for fermionic fields**'。
        迭代得 (10.8.9)：ψ(w + 4πit) = exp[πi(β + β̃)] ψ(w)。

  **本定义不断言**：
    (a) ⚠⚠ **不断言 Ω 在 R–R 顶点算子上的作用，也不断言 (10.6.17)**。
        §10.6 (10.6.16) 把闭超弦的 R–R 顶点算子写作 **V_s Ṽ_{s'}**（按 8 × 8 = [0] + [2] + [4]_+
        变换），(10.6.17) 逐字是 **Ṽ_{s'} V_s = − V_s Ṽ_{s'}**，
        'where the final sign comes from the fermionic nature of the R vertex operators'。
        **这一条已在 worldsheet.type-i-unoriented-closed-spectrum 的断言里**，本卡不重复。
        ⚠ 而「**Ω 把 V_s Ṽ_{s'} 送到 Ṽ_{s'} V_s**」这句本身——即把断言 (2) 的「交换左右」
        搬到**自旋场**上——**在原书 §10.6 没有逐字出处**（抽取记录 #E45 是**转述**：
        「世界面宇称给 Ṽ_{s'}V_s = −V_sṼ_{s'}」；本图的
        worldsheet.type-i-unoriented-closed-spectrum--via-omega-projection 的 summary
        第 (2) 步把它写作「Ω 交换左右，即把 V_sṼ_{s'} 变成 Ṽ_{s'}V_s」，那是**本图的读法**）。
        ⇒ 本卡**不把它写进断言**。V_s 是**自旋场**（R 扇区基态算子），不是 ψ 的多项式，
        断言 (2) 的「Ω 交换 ψ ↔ ψ̃」**不自动**给出它在 V_s 上的作用。
        **这是本卡自觉留下的缺口**，见 notes。
    (b) **不断言投影到 Ω = +1 挑出什么**，也不断言 type I 无取向闭弦谱
        [0] + [2] + (2) + 8′ + 56（那是 worldsheet.type-i-unoriented-closed-spectrum）。
    (c) **不断言 Ω² = 1 作为算符等式**。断言 (3) 只说 Ω² **与世界面费米子对易**；
        原书在闭弦一侧**从不写** Ω² = 1（玻色卡 worldsheet.worldsheet-parity 写了 Ω² = 1，
        但那是**玻色弦**语境）。⇒ 闭超弦上 Ω 的阶是 2 还是 4，本卡不表态。
    (d) **不断言模层面的版本**。原书在闭弦一侧只给场层面的 (10.8.8)，
        **不给** Ω 在 ψ_r、ψ̃_r 上的作用（对照开弦有 (10.8.13)
        Ωψ_r^μΩ^{−1} = exp(−πir)ψ_r^μ）。本卡照此只到场层面。
    (e) **不断言 Ω 在超共形鬼场 β、γ 上的作用**（原书本处不提）。
    (f) **不断言 Klein 瓶振幅本身**（那是
        worldsheet.superstring-klein-bottle-amplitude-closed-channel），
        也不断言 (10.8.10a,b) 两个迹的整体符号（脚注 8：一个由引力子定、一个由 (10.6.17) 定）。
    (g) **不断言 (4) 里那个「usual extra sign for fermionic fields」的来源**。
        原书只有这一句，不给理由；本图的 worldsheet.fermion-periodicity-and-minus-one-to-f
        是**相邻但不同**的事实（周期路径积分给 Tr[(−1)^F e^{−HU}]），**不能**替代。
    (h) **不断言 Ω 在开超弦上的作用**（那是 worldsheet.superstring-worldsheet-parity-action，
        含 Ω² = exp(πiF) 与四项投影算符 (1+Ω+Ω²+Ω³)/4）。**两张卡分别覆盖开、闭两侧。**
