id: worldsheet.ddf-transversality-gives-local-finiteness-v2
kind: proposition
title: 横向性 ε·k_0 = 0 使 DDF 模态和在代数动量塔上局部有限：窗口外的项逐向量为零，故 A^ε_n 是处处有定义的线性算子
statement: |
  记号与 worldsheet.ddf-operators-v6 完全一致：动量塔 T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)
  是**代数**直和（有限支撑，无完化、无解析结构；worldsheet.momentum-tower-fock-space），
  V^{(n)}_K 是 :e^{i n k_0·X(z)}: 在塔上的 **z^K 洛朗系数**（把第 N 层送到第 N+n 层，
  把振子能级升高 K − n），α^ε_m = ε·α_m = Σ_μ η_μ ε^μ α^μ_m 是偏振收缩的振子模。

  【两个界】对塔上的每个向量 x ∈ T(p; k_0)（**不要求 x 是能级齐次的**）定义
    L(x) := 出现在 x 中的振子单项式的最大**能级**（各占据层上取最大值），
    M(x) := 出现在 x 中的振子变量的最大**指标**（各占据层上取最大值）。
  两者都是有限的自然数（x 的支撑有限、每层是多项式）。

  【断言】设横向性成立：ε·k_0 = 0。则对**每个** n ∈ Z、**每个** x ∈ T(p; k_0)
  与**每个**整数 m 满足
    m < n − L(x)   或   m > M(x)
  的情形，都有
    α^ε_m V^{(n)}_m x = 0 。
  等价地：模态和 Σ_{m ∈ Z} α^ε_m V^{(n)}_m x 至多有
  ( M(x) + L(x) − n + 1 ) 项非零，落在有限窗口
    W(n, x) := { m ∈ Z : n − L(x) ≤ m ≤ M(x) }
  之内。因此 worldsheet.ddf-operators-v6 定义的
    A^ε_n = Σ_{m ∈ Z} α^ε_m V^{(n)}_m
  是塔上处处有定义的 R-线性算子，**不需要收敛性假设、不需要完化、不需要解析延拓**；
  并且它可以用**任何**包含 W(n, x) 的有限指标集 s 来计算：
    A^ε_n x = Σ_{m ∈ s} α^ε_m V^{(n)}_m x 。

  【两条截断的机制不同，只有上截断用横向性】
  (下截断，不用横向性) V^{(n)}_m 把能级升高 m − n，能级为负的向量是零，故 m < n − L(x) 时
    已经有 V^{(n)}_m x = 0（顶点算子本身就杀死 x）。
  (上截断，**这里才用 ε·k_0 = 0**) 横向性给出 [α^ε_m, V^{(n)}_K] = 0 对**所有** m（含 m = 0），
    于是 α^ε_m V^{(n)}_m x = V^{(n)}_m α^ε_m x，而 m > M(x) 时 α^ε_m 湮灭 x。

  【本节点明确不断言】
  (a) 必要性（ε·k_0 ≠ 0 时和不是局部有限的）——见 notes，若需引用应另立节点；
  (b) A^ε_n ≠ 0，或它与文献的围道积分写法相同（后者是 worldsheet.ddf-operators-v6 notes 里
      登记的 open 缺口）；
  (c) A^ε_n 与 L_m 或与另一个 A 的任何对易关系。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
