notes: |
  取代 worldsheet.ddf-transversality-gives-local-finiteness（v1，2026-09-11 建）。

  【为什么换代（三处，都不是措辞问题）】
  (1) **v1 的陈述把「worldsheet.ddf-operators-v5 的围道积分展成模态和」写进了 setup**，
      即含 --via-mode-sum 的「第 0 步」。lead 2026-09-11 裁决把 A^ε_n 的定义改为模态和
      （worldsheet.ddf-operators-v6），围道写法退为文献写法；v1 的这句话既指向已被取代的 v5，
      又把一条 open 的字典绑进了陈述，使得**任何 formalized 的推导挂在 v1 上都是超额声明**。
  (2) **v1 的窗口 n − N ≤ m ≤ N 用了同一个界 N 的两侧**，而 Lean 里两侧是**不同的**量：
      下侧用能级界 `towerLevelBound`，上侧用指标界 `towerModeBound`。两者机制不同
      （见陈述末段），恒有 M(x) ≤ L(x)（一个指标 r 的振子至少贡献能级 r），
      故本卡的窗口比 v1 的**更窄**，v1 的窗口是本卡在能级齐次向量 |ψ⟩（L = N，M ≤ N）上的推论。
      ⚠ 「M ≤ L」这一步在 Lean 里**没有具名引理**，故本卡不把 v1 的窗口写进陈述。
  (3) **v1 的精确窗口只对能级齐次的 |ψ⟩ 陈述**（v1 推导 --via-mode-sum 的 gaps 第 5 条就是这件事），
      Lean 的 `towerLevelBound` / `towerModeBound` 是对**任意**向量取 sup，故本卡对任意向量成立。
      这条 gap 因此关闭。

  v1 的推导 worldsheet.ddf-transversality-gives-local-finiteness--via-mode-sum 已随之改名并改挂本卡
  （worldsheet.ddf-transversality-gives-local-finiteness-v2--via-mode-sum，仍 physical-argument），
  v1 因此不再有推导。这是有意的：v1 是围道版陈述的历史记录，本图不再引用它。

  【本节点的来历：Lean 侧发现，文献未明写】
  这是 worldsheet.ddf-operators-v4 的 notes 第 (2) 条登记的观察，2026-09-11 拆卡时立卡（v1），
  同日 Lean 组装完成后换代为本卡。原文要点：横向条件 ε·k_0 = 0 **不只是**为了让被积量成为
  权 1 primary，它还是 A^ε_n 作为**代数**算子良定义的必要输入。
  文献（GSW §2.3.3、GT 1972、goddard-2008 §5）把 A^i_n 写成围道积分，围道积分默认被积量是
  可形变的解析对象，于是「和是否有限」这个问题根本不出现；一旦落到代数动量塔
  （无完化、无解析结构）上，它就是必须先证的第一件事。
  在 Lean 里这一点被推到极致：横向性假设 `hεb` 是 **`ddfOp` 这个定义本身的参数**
  ——非横向时 A^ε_n 根本写不出来，不是"写出来但不收敛"。

  【必要性方向：本节点不断言，登记备查】若 ε·k_0 ≠ 0，则由
  `lie_towerModeVec_towerVertex`（[α^ε_p, V^{(n)}_K] = n (ε·k_0) V^{(n)}_{K−p}）得
  α^ε_m V^{(n)}_m x = V^{(n)}_m α^ε_m x + n (ε·k_0) V^{(n)}_0 x，
  第二项与 m 无关且一般非零，故对一切充分大的 m 都有同一个非零贡献，模态和在代数塔上
  **不是**局部有限的。**这一逆命题不是本节点的断言**（按根 CLAUDE.md「一个节点一个命题」）；
  若日后需要引用，应另立节点 `worldsheet.ddf-nontransverse-mode-sum-diverges`。
  注意它需要 n ≠ 0 且 V^{(n)}_0 x ≠ 0，这两条 Lean 侧都没有证。

  【n = 0 也成立】Lean 的 `ddfSummand_apply_eq_zero_of_notMem_window` 对 n : ℤ 无限制，
  故本卡对 n = 0 一并成立（窗口变成 −L(x) ≤ m ≤ M(x)）。
  worldsheet.ddf-operators-v6 的 notes (2) 已登记这一点；文献排除 n = 0 是代数上的理由，
  不是良定义性的理由。

  【与其他 DDF 节点的关系】
  - worldsheet.ddf-operators-v6：本命题的对象来源（纯定义卡）。逻辑上有一处**循环的外观**：
    v6 的定义里说「这个和逐向量有限（见本命题）」，本命题又依赖 v6 提供对象。
    Lean 里这不是循环：`ddfSummand`（单项）先定义、局部有限性再证、`ddfOp`（和）最后组装，
    三者是严格递增的依赖链。图中把 v6 当作对象卡、本命题当作它的良定义性命题，
    是这条链在两张卡上的投影。
  - worldsheet.ddf-commute-with-positive-virasoro、worldsheet.ddf-commute-with-virasoro、
    worldsheet.ddf-transverse-oscillator-algebra：另外三条命题。逻辑上本命题**在它们之前**——
    先要 A^ε_n 是算子，再谈它的对易子。文献侧的论证走解析围道路线、并不显式经过本命题，
    故本图**不**把本命题连成走文献路线那几条推导的依赖（那会是伪造的边）；
    只有走 Lean / 代数路线的推导（worldsheet.ddf-commute-with-positive-virasoro--via-lean）
    才实质依赖它，那里也确实连了边。
