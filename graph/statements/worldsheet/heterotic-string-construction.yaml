      worldsheet.superconformal-ghost-central-charge（−26 + 11 = −15）两张卡。
tags: [heterotic, worldsheet, action, definition, so32, central-charge]
notes: |
  【status: physical-argument 的理由】与 worldsheet.rns-action 同：本卡把 OPE 列为定义数据，
  而 OPE 收敛性在本图未公理化；另有 Grassmann 场与路径积分的缺口。按「不确定选低一级」取
  physical-argument。

  【「16 = 32 × 1/2」是 SO(32) 的来源】抽取记录 E54 特别标出这一点：规范群不是先验选定的，
  而是「配平 c = 16 的最简办法恰好是 32 个实费米子，它们的内部对称性就是 SO(32)」。
  §11.6 的格点构造给出同样的两个群（worldsheet.heterotic-bosonic-construction-gauge-groups）。

  【⚠ 「SO(32)」这个名字只到李代数的精度】原书 §11.4 脚注 1（p. 60，逐字）：
  'To be precise the Lie algebra determines only the local structure of the group. Many groups,
  differing only by discrete identifications, will have a common Lie algebra.'
  本图凡写 SO(32) 处，断言的都是**李代数** so(32)（以及原书使用的群名），
  **不**断言整体群是 SO(32) 还是 Spin(32)/Z₂。
  ⚠ 抽取记录（E54–E63）**没有**记录原书任何一处写出 'Spin(32)/Z₂'；
  本轮因此不建该区分的节点，也不得据本图断言两者的区别。见本轮报告的「文献歧义」条。

  【左移一侧没有超流】这不是笔误：约束代数在左边只有 Virasoro，右边才有超 Virasoro。
  下游两处直接用到这个不对称：
    (a) 左移 λ^A 不能有类时号差（worldsheet.heterotic-internal-fermions-spacelike）；
    (b) 左移配分函数里没有超共形鬼场的 F 贡献，故 (11.2.13) 全取正号
        （worldsheet.heterotic-so32-partition-function）。

  【与 ch.10 结论卡的关系】worldsheet.ten-dimensional-superstring-theories 的结论
  「恰有三个」是**第 10 章构造范围内**的（原文限定词 'in this chapter'）。
  杂化弦不在那个范围内；那张卡的 statement 已显式声明「不断言杂化弦不存在」。
  本卡与其后继卡就是被排除在外的那两个理论。
