id: worldsheet.heterotic-string-construction
kind: definition
status: physical-argument
title: 杂化弦的世界面构造：(N, Ñ) = (0, 1) 约束代数、场内容 X^μ + ψ̃^μ + 32 个左移 λ^A，中心荷配平 (c, c̃) = (26, 15)
statement: |
  **约束代数的选择**。按 §11.1 的分类，左移与右移的约束代数可以**独立**选取；
  取左移一侧为玻色弦的约束代数（只有 T_B，即 Table 11.1 的 N = 0 行，鬼场中心荷 c^g = −26），
  右移一侧为超弦的 (1,1) 超共形约束代数（T̃_B 与 T̃_F，即 N = 1 行，c̃^g = −15）。
  原书逐字：'This allows the one new possibility, the (N, Ñ) = (0,1) *heterotic string*;
  (N, Ñ) = (1,0) would be the same on redefining z → z̄.'

  **中心荷配平**。总鬼场中心荷 (c^g, c̃^g) = (−26, −15)，故物质部门必须有 (c, c̃) = (26, 15)。
  取十个平坦嵌入坐标 X^μ(z, z̄)（μ = 0, …, 9）与十个右移世界面费米子 ψ̃^μ(z̄)（(11.2.1)），
  它们给出 (c, c̃) = (10, 15)；**剩下的必须是纯左移的 (c, c̃) = (16, 0)**。
  原书逐字：'The ghost central charges add up to (c^g, c̃^g) = (−26, −15), so the remaining
  matter has (c, c̃) = (16, 0). The simplest possibility is to take 32 left-moving spin-1/2
  fields λ^A(z), A = 1, …, 32'（(11.2.2)；每个左移实费米子贡献 c = 1/2，
  32 × 1/2 = 16。原书的用词是 'spin-1/2 fields'，本卡不额外断言它们的时空/世界面旋量类型）。

  **作用量**（(11.2.3)，逐字公式）：
    S = (1/4π) ∫ d²z [ (2/α') ∂X^μ ∂̄X_μ + λ^A ∂̄λ^A + ψ̃^μ ∂ψ̃_μ ]。

  **基本 OPE**（(11.2.4a,b,c)）：X^μX^ν 与 ψ̃^μψ̃^ν 同 RNS 弦（worldsheet.rns-action 里的
  (10.1.6)/(10.1.7)，其中 ψ̃ 一支照抄），另有
    λ^A(z) λ^B(0) ∼ δ^{AB}/z。

  **约束流**（(11.2.5a,b,c)，逐字公式）：
    T_B  = −(1/α') ∂X^μ ∂X_μ − (1/2) λ^A ∂λ^A,
    T̃_B = −(1/α') ∂̄X^μ ∂̄X_μ − (1/2) ψ̃^μ ∂̄ψ̃_μ,
    T̃_F = i(2/α')^{1/2} ψ̃^μ ∂̄X_μ。
  注意 **左移一侧没有超流**：约束代数在左边只是 Virasoro。

  **世界面对称性**：SO(9,1) × SO(32)，其中 SO(32) 作用在 λ^A 上，是**内部**对称性
  （原书逐字：'The world-sheet theory has symmetry SO(9,1) × SO(32). The SO(32), acting on
  the λ^A, is an internal symmetry.'）。

  **本卡不断言的内容**：
    (1) 不断言 32 个 λ^A 是唯一的取法。原书只说这是 'the simplest possibility'；
        §11.6 的玻色构造（compact.heterotic-narain-lattice-even-self-dual）是另一种实现，
        原书说两者经玻色化等价（'It is easy to see'，见那张卡）。
    (2) 不断言周期条件与 GSO 投影——那是 worldsheet.heterotic-so32-projections 的内容。
    (3) 不断言路径积分有数学定义（与 worldsheet.rns-action、worldsheet.free-scalar-cft-action
        同样的缺口，另加 Grassmann/Berezin 积分）。
    (4) 不断言「杂化弦是一致的弦论」——无鬼定理见 worldsheet.no-ghost-theorem-heterotic，
        模不变性见 worldsheet.heterotic-so32-partition-function。
