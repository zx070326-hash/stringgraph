    note: |
      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E27，
      等级 **L1（原书页图逐字，整段已抄录）**。
      抽取记录对本条的判定：「论证链条完整且可检验（BRST-null 态耦合 = 模空间上的全导数
      ⇒ F₀ 的表观边界成对认同 ⇒ 面项抵消 ⇒ 截断会造出真边界），但**关键一步整体外包给 §5.4**，
      本章不重述」。⚠ **fig. 5.2 的边界标记 I/I′/II/II′ 本身未核对**（抽取记录 §3.1：图未读）。
tags: [worldsheet, brst, moduli, unitarity, uv-finiteness, consistency, torus]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E27 建立。

  **这是本章论证价值最高的一条**：它是第 7 章唯一把「UV 有限性」与「幺正性/一致性」显式连起来的
  论证，也是「弦论不能被人为截断」这一流行说法的原文出处。
  与 spectrum.one-loop-uv-finiteness-from-modular-invariance 的关系：后者说「弦论的模积分区域里
  没有 UV 区」，本卡说「你不能靠手动截断在场论里模仿这件事」——两条是不同的命题，
  分卡是有意的。
