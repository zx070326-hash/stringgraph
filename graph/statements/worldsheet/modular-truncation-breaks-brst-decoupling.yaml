id: worldsheet.modular-truncation-breaks-brst-decoupling
kind: proposition
title: "把模积分区域从 F₀ 换成截断区域会造出真边界，使 BRST 零态不再解耦、理论不一致"
statement: |
  考虑把环面振幅（spectrum.one-loop-torus-amplitude）的积分区域从模群的基本域 F₀
  换成一个人为截断的区域，例如原书举的例子
    |τ₁| ≤ ½ ,  τ₂ > 1     （下边缘是**平的**，而不是 F₀ 的 |τ| = 1 圆弧）。
  则：

  (1) 由 worldsheet.brst-variation-is-moduli-space-boundary-term，BRST 零态的耦合是模空间上的
      全导数，故只剩边界项；
  (2) 在 F₀ 上，图 5.2 里标为 **I 与 I′、II 与 II′** 的两对表观边界分别被模变换认同，
      两侧的面项**成对抵消**，故净边界项为零；
  (3) 截断区域引入的是**真边界**（无认同的对象），面项不再抵消；
  (4) 于是 BRST 零态（负模态）有非零振幅，**理论不一致**。

  原书对此的定性总结（逐字）：
  「However, in either case this would spoil the consistency of the theory: unphysical negative norm
  states would no longer decouple. … **Modifying the region of integration introduces real
  boundaries. Surface terms on the modified moduli space will no longer cancel, so there is nonzero
  amplitude for null states and an inconsistent quantum theory.** This is directly analogous to what
  happens in gravity if we try to make the theory finite by some brute force cutoff on the
  short-distance physics: it is exceedingly difficult to do this without spoiling the local spacetime
  symmetry and making the theory inconsistent. **String theory manages in a subtle way to soften the
  short-distance behavior and eliminate the divergences without loss of spacetime gauge invariance.**」

  **本卡不断言什么**：不给出「非零振幅」的定量估计（原书没有算任何截断后的面项）；
  不断言 F₀ 上边界项**确实**为零的完整证明（(2) 依赖 F₀ 的边界认同，而那在原书未严格处理，
  见 worldsheet.modular-fundamental-domain）；不涉及引力侧的类比（那只是原书的修辞）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
sources:
