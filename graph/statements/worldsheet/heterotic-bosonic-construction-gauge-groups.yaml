id: worldsheet.heterotic-bosonic-construction-gauge-groups
kind: proposition
title: 玻色构造给出与费米子构造**相同**的两个规范群：l_L² = 2 的格点就是 SO(32) 或 E₈ 的根
statement: |
  在 compact.heterotic-narain-lattice-even-self-dual 的 d = 10 特例中，内部格是 16 维偶自对偶
  欧氏格，由 math.even-self-dual-euclidean-lattices-dimension-16 只有 Γ_16 与 Γ_8 ⊕ Γ_8 两种。
  断言：

  **(1)** 左移零点能为 −1，故无质量态由「一个单位的左移激发」给出：
      ∂X^μ、∂X^m，或顶点算子 e^{i k_L·X(z)} 且 **l_L² = 2**。
  **(2)** Γ_16 中 l_L² = 2 的格点恰是 **SO(32) 的根**（(11.4.16)）；
      Γ_8 ⊕ Γ_8 中 l_L² = 2 的格点恰是两份 **E₈ 的根**（(11.4.21)）。
  **(3)** 因此（原书逐字）：'**Thus the two possible lattices give the same two gauge groups,
      SO(32) and E₈ × E₈, found earlier.**'
  **(4)** 并且（原书逐字）：'**It is easy to see** that the earlier fermionic construction and
      the present bosonic one are equivalent under bosonization.'

  **本命题不断言的内容**：
    (1) **不**断言 (11.4.16)/(11.4.21) 的具体根系形式。抽取者**没有读到这两式本身**
        （原书 pp. 61–65 在本轮抽取中跳读，只在 §11.5/§11.6 见到对它们的引用），
        故本卡只记「原书说 l_L² = 2 的点就是那些根」，不转录根的坐标表达式。
    (2) 不断言 (4) 的等价性有论证（'It is easy to see' 是全部）。
    (3) 不断言整体规范群（SO(32) 还是 Spin(32)/Z₂）；本卡断言的是**李代数**。
    (4) 不断言完整的谱——见 compact.heterotic-narain-lattice-even-self-dual 的脚注 2。
