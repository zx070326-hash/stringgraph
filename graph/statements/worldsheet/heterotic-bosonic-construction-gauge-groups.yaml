tags: [heterotic, lattice, gauge-group, so32, e8e8, bosonization]
notes: |
  ★【这是「恰有两个」的第二条独立路线】
    路线 A（§11.2，费米子）：排除「八个一组」（自旋统计 + OPE 闭合）
      → worldsheet.heterotic-two-supersymmetric-ten-dimensional；
    路线 B（§11.6，玻色/格点）：16 维偶自对偶欧氏格恰有两个
      → 本卡。
  两条路线在本图都是 physical-argument，但**瓶颈不同**：
  A 的瓶颈是自旋统计与 OPE 闭合两条物理断言；B 的瓶颈是一条**纯数学定理没有数学来源**
  （math.even-self-dual-euclidean-lattices-dimension-16）。
  → 登记 Conway–Sloane / Serre 之后，B 可以整体抬到接近 rigorous 的水平（除了
    「一致 CFT ⟺ 偶自对偶格」那一步仍是物理论证），这是本轮发现的**性价比最高的升级点**。

  【(11.4.16)/(11.4.21) 未核实，是本卡最脆的一环】要把「l_L² = 2 的点 = 根系」坐实，
  必须补读原书 pp. 61–65 的页图（同一份已落盘 PDF，见抽取记录 §3.3，无需重新 fetch）。

  【左移零点能 −1 与 §11.2 的一致性】玻色构造下 26 个左移玻色子的横向计数是 24 × (−1/24) = −1
  （与玻色弦相同）；费米子构造下是 8 × (−1/24) + 32 × (−1/48) = −1
  （worldsheet.heterotic-left-moving-zero-point-constants）。两者一致 ✓。
  ⚠ 这条核对是本图做的，原书没有并列写出。
