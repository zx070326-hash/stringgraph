id: worldsheet.torus-partition-function-general-cft
kind: definition
status: physical-argument
title: "环面配分函数 Z(τ) = Tr[(−1)^F e^{2πiτ₁P − 2πτ₂H}] = Σ_i q^{h_i−c/24} q̄^{h̃_i−c̃/24}(−1)^{F_i}"
statement: |
  设一个二维 CFT 定义在模参数为 τ = τ₁ + iτ₂ 的平坦环面 T²(τ)（worldsheet.torus-modulus）上，
  记 q = exp(2πiτ)。用圆上的算符语言（σ¹ 是空间、σ² 是欧氏时间），取
    P = L₀ − L̃₀            （σ¹ 平移的生成元），
    H = L₀ + L̃₀ − (c + c̃)/24  （σ² 平移的生成元，见 worldsheet.cylinder-plane-l0-shift）。
  **定义**该 CFT 的环面配分函数为
    Z(τ) = Tr[ (−1)^F exp( 2πiτ₁ P − 2πτ₂ H ) ]
         = Σ_i  q^{h_i − c/24}  q̄^{h̃_i − c̃/24}  (−1)^{F_i} ,
  其中 i 跑遍该 CFT 的全部态，(h_i, h̃_i) 是其 (L₀, L̃₀) 本征值，F_i 是**世界面**费米数
  （mod 2）；玻色 CFT 中 (−1)^F ≡ 1。

  几何含义（原书的构造图像）：环面 = 圆上的场论沿欧氏时间演化 2πτ₂、再作 σ¹ 平移 2πτ₁、
  最后把两端认同；「路径积分 = 迹」正是这个认同。
  ⚠ 对反交换场，**朴素的迹对应时间方向的反周期边条件**；要得到 Faddeev–Popov 行列式所需的
  周期鬼场，必须插入 (−1)^F——这正是上式里 (−1)^F 的来历，见
  worldsheet.bc-ghost-torus-partition-function。

  **本卡不断言什么**：不断言上式的收敛性（对一般 CFT 求和的收敛性原书完全不讨论）；
  不断言 Z(τ) 的模不变性（那是对谱的额外要求，见 worldsheet.modular-invariance-integer-spin）；
  不给出任何具体 CFT 的 Z（自由标量见 worldsheet.free-scalar-torus-partition-function，
  bc 鬼场见 worldsheet.bc-ghost-torus-partition-function）。
uses:
  - worldsheet.torus-modulus
  - worldsheet.cylinder-plane-l0-shift
uses_conventions:
