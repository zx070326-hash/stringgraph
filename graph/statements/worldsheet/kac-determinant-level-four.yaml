tags: [cft, representation-theory, verma-module, shapovalov, kac-determinant, virasoro, formalized]
notes: |
  【本卡相对 level-three 的新内容——三件事】
  (i) **p(N) > N 首次出现**（p(4) = 5），Gram 矩阵不再是「N × N」；
  (ii) **有理 Kac 根 h₂₂ = (1−c)/8 首次出现**，它在 (3) 里只需一条线性关系 8h₂₂ = 1 − c，
       不需要和/积对；这也是 det₄ 在 ℚ(c)[h] 上分解出一个**线性**因子的原因；
  (iii) **重数 p(N−rs) = 2 首次以「新」的方式出现**：level-2 的因子 16h² + 2h(c−5) + c 在 det₄ 里
       是平方（p(4−2) = p(2) = 2），而不是像 level 3 那样以一次幂重现。
  「Gram 行列式 = Kac 乘积」这一步与 level 3 同样在 Lean 内部（`gram_level_four_det_eq_kac`），
  假设只有八个根的七条**清过分母的对称函数等式**，结论是乘积形。

  【「level-4 Gram 矩阵整系数」是错的】
  ⟨u₂₂, u₂₂⟩ = c²/2 + 8ch + 4c + 32h² + 32h 带 1/2（来源是 [L₂, L₋₂] 的中心项 c/2 在
  L₂ 两次穿过 L₋₂ 时**没有**被偶数因子吃掉：L₂ u₂₂ = (8h + 8 + c) L₋₂v，再乘 ⟨L₋₂v, L₋₂v⟩ = 4h + c/2）。
  这是 level 4 内**唯一**的非整系数元；其余十四个都是 Z[c,h] 的元素。
  ⚠ 但**不是** N ≤ 4 内唯一的：level 2 的 ⟨L₋₂v, L₋₂v⟩ = 4h + c/2 已经带 1/2
  （worldsheet.kac-determinant-level-two (2)）；level 1 与 level 3 的所有元都是整系数
  （level 3 的 ⟨u₂₁, u₂₁⟩ = 8h² + ch + 8h 里 c/2 被 ⟨L₋₁v, L₋₁v⟩ = 2h 的 2 吃掉）。
  ⇒ 「Gram 矩阵是整系数矩阵」这个常见的随口断言在 N = 2 与 N = 4 都不成立；
  行列式 det₄ 仍是整系数（Lean 证明里 1/2 由 `two_mul_centralTerm_two` 消掉）。

  【为什么「不依赖 √((c−1)(c−25)) 分支」仍然成立】
  与 level-three 卡同理：(3) 只用每一对 {h₁₂,h₂₁}、{h₁₃,h₃₁}、{h₁₄,h₄₁} 的**和与积**，
  加上 h₁₁ = 0 与 h₂₂ 的线性关系；和、积在两支交换下不变，故 (3) 既不需要 R 中存在平方根，
  也不需要选分支，更不需要 R 是域或有序。

  【(3) 的七条关系与 Schottenloher 的 h_{p,q}(c) 相容——curator 手算核对，2026-09-11】
  取 h_{p,q}(c) = (1/48)[(13−c)(p²+q²) + √Δ·(p²−q²) − 24pq − 2 + 2c]（Theorem 6.12），
  记 Δ := (c−1)(c−25)。rs ≤ 3 的五条关系（h₁₁ = 0；(1,2)/(2,1) 的和 (5−c)/8、积 c/16；
  (1,3)/(3,1) 的和 (7−c)/3、积 (c+2)/3）已在 worldsheet.kac-determinant-level-three 的 notes 核过，
  此处只做 rs = 4 的两条：
  · **h₂₂**：p = q = 2 ⇒ p²+q² = 8、pq = 4、p²−q² = 0 ⇒ (1/48)[8(13−c) − 96 − 2 + 2c]
    = (1/48)(6 − 6c) = (1−c)/8。✓ 即 Lean 的假设 e22 : 8h₂₂ = 1 − c。
  · **(1,4) 与 (4,1)**：p²+q² = 17、pq = 4、p²−q² = ∓15 ⇒ 记 U := 17(13−c) − 96 − 2 + 2c = 123 − 15c，
    h₁₄ + h₄₁ = 2U/48 = (123 − 15c)/24 = (41 − 5c)/8；
    h₁₄ · h₄₁ = (U² − 225Δ)/48² = [15129 − 3690c + 225c² − 225(c² − 26c + 25)]/2304
              = (2160c + 9504)/2304 = (15c + 66)/16。✓
    即 Lean 的假设 e4s : 8(h₁₄+h₄₁) = 41 − 5c 与 e4p : 16h₁₄h₄₁ = 15c + 66。
  ⚠ **这一段是 curator 的手算，不在 Lean 里、也不是任何来源的逐字内容**。
  它支持的只是「Lean 的 (3) 所假设的那七条关系，在 R = C 与 Schottenloher 的 h_{p,q}(c) 下
  确实成立」；**(3) 本身的证明不依赖它**（(3) 是条件命题），故本卡的 formalized
  不被这段手算拖低——与 level-two 卡 (4) 的情形不同，那里手算出现在**结论**里。

  【α₄ = 37748736 与 α_N 的乘积公式】
  本卡给出 α₄ = 384·8·16²·3·16 = 37748736 = 2²²·3² > 0。连同 α₁ = 2、α₂ = 32、α₃ = 2304，
  四个值与 worldsheet.kac-determinant-v2 notes (D) 登记的乘积公式
  α_N = ∏_{rs ≤ N} ((2r)^s · s!)^{p(N−rs) − p(N−r(s+1))} 在 N = 1, 2, 3, 4 处逐项吻合
  （N = 4 的八个因子：(1,1) 2¹、(1,2) 8¹、(1,3) 48⁰、(1,4) 384¹、(2,1) 4¹、(2,2) 32¹、
  (3,1) 6¹、(4,1) 8¹，乘积 2·8·384·4·32·6·8 = 37748736）。
  本卡是该公式的**第二个 formalized 数据点**（第一个是 N = 3；N = 2 的 Kac 比较是手算），
  也把那张卡 notes (D) 里「N = 4 来自 CAS」升级为「来自 Lean」。
  ⚠ 该公式本身**未形式化、也不是文献逐字**，见那张卡的登记。本卡只承载 N = 4 的数字。

  【查重】2026-09-11 跑 `uv run stringgraph search kac` 与 `search level-four`：既有节点是
  worldsheet.kac-determinant（已 superseded）、worldsheet.kac-determinant-v2（一般 N，rigorous）、
  worldsheet.kac-determinant-level-two（N ≤ 2，formalized）、
  worldsheet.kac-determinant-level-three（N = 3，formalized）。本卡是 level-three 的
  **同构姊妹卡**（同一前提、同一不断言清单），**不重复**：level-three 不含 level-4 的任何 Gram 元，
  也不含 rs = 4 的两条 Kac 关系。另有 worldsheet.verma-level-spanned-by-partitions（formalized）
  承载一般 N 的张成一半，本卡【不断言】(a) 已指向它。
