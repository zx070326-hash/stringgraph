    loc: "§10.2, eq. (10.2.14)（两个端点的相位条件）、(10.2.15)（doubling trick 的合成公式），pp. 7–8"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E20；式号与公式内容逐页读到原书页图）。
      原书的措辞是直接推理，无「显然/可以验证」类免责。
tags: [rns, superstring, open-string, doubling-trick, ns-sector, ramond-sector]
notes: |
  【与玻色弦 doubling trick 的关系】worldsheet.open-string-doubling-trick 是玻色场 X^μ 的版本
  （Vol.1 (2.6.25)）。本卡是费米场的版本，结构同构但对象不同，故不复用那张卡、也不设依赖边
  （两者共享的只是「用镜像把开弦化成闭弦一侧」这个手法，不是同一条陈述）。
  抽取记录 E20 明确记下这一同构关系。

  【结论 (1) 的逻辑强度】「一次场重定义可以消去 ν'」是一个规范/记号自由度的论断：
  重定义把 ψ̃ 的相位吸收掉，但同时改变 ψ̃ 的边界条件在另一端的表现，
  原书对此不展开。本卡照原文记为结论，推导里记 gap。
