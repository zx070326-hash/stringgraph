id: worldsheet.open-superstring-two-sectors
kind: proposition
title: 开超弦只有 R 与 NS 两个扇区（一次场重定义把第二个边界的相位消去），并可用 doubling trick 合成单个场
statement: |
  开弦世界面取 0 ≤ σ^1 ≤ π。运动方程的表面项为零要求两个端点各带一个相位：
    ψ^μ(0, σ^2) = exp(2πi ν)  ψ̃^μ(0, σ^2),
    ψ^μ(π, σ^2) = exp(2πi ν') ψ̃^μ(π, σ^2)。
  **结论 (1)**：由场重定义 ψ̃^μ → exp(−2πi ν') ψ̃^μ 总可以取 ν' = 0，于是只剩一个参数 ν，
  即开超弦只有 **R（ν = 0）与 NS（ν = 1/2）两个扇区**（闭弦有四个，
  见 worldsheet.rns-periodicity-exhaustion）。
  **结论 (2)（doubling trick）**：可以把 ψ 与 ψ̃ 合成一个定义在 0 ≤ σ^1 ≤ 2π 上的单一场：
    ψ^μ(σ^1, σ^2) ≡ ψ̃^μ(2π − σ^1, σ^2)   （π ≤ σ^1 ≤ 2π），
  从而开弦的模式展开与闭弦的一侧同形。

  本命题**不**断言 Chan–Paton 因子、也不断言开弦谱要做哪种 GSO 投影
  （后者见 worldsheet.type-i-open-string-gauge-multiplet）。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.worldsheet-euclidean
