notes: |
  由 curator 于 2026-09-11 建立，来源是 ch.5 与 ch.7 两处 L1 引文的合并（ch.7 提供措辞，
  ch.5 提供原始出处与「未处理的边界项」这一自承缺口）。

  **为什么必须单列**：它是「弦振幅的规范无关性/幺正性」这条链上唯一承载「全导数 + 边界项」
  这一机制的节点。既有的 worldsheet.brst-gauge-choice-independence 只讲世界面局域的
  「改规范 = 加 BRST 恰当项」，其 sources.note 已记下 §5.4 的边界项缺口但**不覆盖**本命题。
