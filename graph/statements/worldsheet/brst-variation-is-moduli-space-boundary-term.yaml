id: worldsheet.brst-variation-is-moduli-space-boundary-term
kind: proposition
title: "BRST 零态的耦合正比于模空间上的全导数：振幅的 BRST 变分只剩模空间边界项"
statement: |
  在 S-矩阵主公式 worldsheet.string-s-matrix（(5.3.9)）中，被积表达式（含 b 插入、c 插入与
  顶点算子）的 BRST 变分是**模空间上的全导数**。等价的说法（第 7 章的复述，逐字）：
    「the coupling of a BRST-null state is proportional to a total derivative on moduli space」。
  于是

  (1) 振幅的 BRST 变分 = 模空间 F 的**边界项**：
        δ_B S = ∫_F d^μ t  ∂_{t^k}( … )^k  =  ∮_{∂F} ( … ) ,
      即在 F 没有真边界（表观边界成对认同）时为零；
  (2) 因此 BRST 零态（Q_B|Λ⟩ 型）与物理态的振幅为零，负模态解耦——
      **前提是那个边界项确实消失**。

  ⚠ **原书自承这里有一个未处理的项**（§5.4, p.161 逐字）：
  「so the BRST variation vanishes **up to a possible term from the boundary of moduli space**. …
  **In most cases there is no surface contribution, due to what is known as the *canceled propagator
  argument*. In certain circumstances this argument does not apply**, and we will see how to deal
  with this.」
  即 (2) 不是无条件的：它依赖一个解析延拓型的论证（canceled propagator argument），
  而作者自己说该论证在某些情形不适用。

  **本卡不断言什么**：不断言 canceled propagator argument 本身（本图无该节点）；
  不断言在给定曲面上边界项确实为零（环面情形见
  worldsheet.modular-truncation-breaks-brst-decoupling，那张卡讲的正是「一旦造出真边界就不为零」）；
  不断言 BRST 上同调与物理态空间的等同（那是 worldsheet.brst-cohomology-equals-ocq-physical）。
