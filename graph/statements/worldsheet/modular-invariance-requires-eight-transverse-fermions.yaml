id: worldsheet.modular-invariance-requires-eight-transverse-fermions
kind: proposition
title: 环面振幅的模不变性要求横向费米子的个数是 8 的倍数（D = 10 的一条独立必要条件）
statement: |
  考虑 type II 超弦的环面真空振幅（Coleman–Weinberg 形式），把费米部门的迹按扇区写成
    Z^α_β(τ) = Tr_α[ q^H exp(πiβQ) ] = (1/η(τ)) ϑ[α/2, β/2](0, τ)，
  其中 α = 1 − 2ν 标记周期性（R: α = 1、NS: α = 0），β 标记是否插入 exp(πiF)。
  GSO 投影后的费米配分函数取组合
    Z_ψ^±(τ) = (1/2)[ Z^0_0(τ)⁴ − Z^0_1(τ)⁴ − Z^1_0(τ)⁴ ∓ Z^1_1(τ)⁴ ]，
  其中的四次幂对应 **8 个横向费米子按每两个一组**（原书强调这些迹是「for a pair of dimensions」）。

  **本命题的内容**（原书逐字）：'**It is necessary for the construction of this invariant that
  there be a multiple of eight transverse fermions.**'
  即：要让上述组合在模变换
    Z^α_β(τ) = Z^β_{−α}(−1/τ) = exp[−πi(3α² − 1)/12] Z^α_{α+β−1}(τ+1)
  下不变，横向费米子的个数必须是 **8 的倍数**。

  **另外两条同源的事实**（本卡一并断言，它们是同一段论证的读数）：
    (a) 模不变性**固定**了 (10.7.9) 中各项的相对符号，特别是 (Z^0_0)⁴ 与 (Z^1_0)⁴ 的相对符号，
        而后者对应 **R 扇区态的费米统计**；
    (b) 上述模变换是「naive」的，因为**纯左移费米子的路径积分相位没有 diff 不变的定义方式**
        （原书逐字：'The reason these modular transformations are naive is that there is no
        diff-invariant way to define the phase of the path integral for purely left-moving
        fermions.'）；这个相位代表一个 *global gravitational anomaly*。

  ⚠ **本命题给出的不是 D = 10，而是一个更弱的必要条件**：横向费米子个数 ≡ 0 (mod 8)。
  在「D 个平坦 X^μψ^μ 且横向方向为 D − 2 个」的设定下它给 D − 2 ≡ 0 (mod 8)，
  即 D ∈ {2, 10, 18, …}；**只有配合中心荷条件才挑出 D = 10**。
  本卡因此在汇总卡里被列为一条**独立的必要条件**，不是第三条「给出 D = 10」的路线。

  本命题**不**断言环面振幅本身的值（type II 的 Z_{T₂} = 0 依赖 Jacobi 恒等式 (10.7.16)
  与 Z^1_1 = 0），也**不**断言模不变性对带顶点算子的振幅成立
  （原书：'one can show by explicit calculation (or by indirect arguments)'）。
