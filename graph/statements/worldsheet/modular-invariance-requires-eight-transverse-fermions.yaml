sources:
  - ref: polchinski-1998-v2
    loc: "§10.7, eq. (10.7.7a,b,c)（Z^α_β 的三种写法与 theta 函数）、(10.7.8a–d)（四个迹）、(10.7.9)（Z_ψ^± 的组合）、(10.7.14)（模变换），pp. 32–35；逐字 'It is necessary for the construction of this invariant that there be a multiple of eight transverse fermions.' 与 'We should emphasize that these traces are for a pair of dimensions.'"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E47；式号与逐字措辞逐页读到原书页图）。
      ⚠ 原书对模不变性的验证措辞是 'The reader can verify that with the transformations
      (10.7.14), the combinations Z_ψ^± are invariant under τ → −1/τ …'——**推给读者**。
  - ref: polchinski-1998-v2
    loc: "§10.7, (10.7.14) 附近, p. 34（逐字：'Naively then, Z^α_β(τ) = Z^α_{α+β−1}(τ+1) … so that naively Z^α_β(τ) = Z^β_{−α}(−1/τ). The reason these modular transformations are naive is that there is no diff-invariant way to define the phase of the path integral for purely left-moving fermions.'；'The phase represents a global gravitational anomaly, an inability to define the phase of the path integral such that it is invariant under large coordinate transformations.'）"
    note: L1（E47）。本卡断言 (b) 的来源。
  - ref: polchinski-1998-v2
    loc: "§10.7, p. 35（逐字：'modular invariance forces the minus signs in the combination (10.7.9), in particular the relative sign of (Z^0_0)⁴ and (Z^1_0)⁴ which corresponds to Fermi statistics for the R sector states'）"
    note: L1（E47）。本卡断言 (a) 的来源。
  - ref: polchinski-1998-v2
    loc: "§10.7, eq. (10.7.1), p. 31（环面振幅取 Vol.1 (7.3.24) 的 Coleman–Weinberg 形式；逐字：'We make the guess, correctly it will turn out, that the torus amplitude is again given by the Coleman–Weinberg formula (7.3.24)'）"
    note: |
      L1。★ 又一次「猜」——这是本章第二处作者自称 guess 的地方（第一处是 §10.1 的
      'by guesswork'）。本卡的推导据此封顶在 physical-argument。
tags: [superstring, modular-invariance, critical-dimension, torus, consistency, gso]
notes: |
  【为什么单列这张卡】抽取记录 E47 明确指出：「必须有 8 的倍数个横向费米子」是模不变性的要求，
  这是 **D = 10 的一个独立的必要条件来源**，与中心荷路线（E12/E37）不同。
  但它给的是模 8 的条件，不是 D = 10 本身，故不能当作第三条「路线」。
  汇总卡 worldsheet.critical-dimension-superstring 把它列为「附加的必要条件」。

  【本卡未建的相邻内容】(10.7.15) 的 type 0 对角模不变量、(10.7.16) 的 Jacobi
  「abstruse identity」Z^0_0⁴ − Z^0_1⁴ − Z^1_0⁴ = 0、以及 type II 的 Z_{T₂} = 0，本轮不建节点。
  ⚠ 原书特别强调：一般振幅要求真空是模不变的「*without* using the vanishing of Z^1_1 or the
  abstruse identity (10.7.16) — as we have required」，转节点时不要把 Z_{T₂} = 0 当成模不变性
  的**依据**。
