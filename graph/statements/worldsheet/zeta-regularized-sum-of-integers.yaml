id: worldsheet.zeta-regularized-sum-of-integers
kind: proposition
title: 零点能中的发散和 Σ_{n≥1} n 被正规化赋值为 -1/12
statement: |
  在计算光锥规范下横向振子的零点能时出现发散和
    E_0 ∝ (1/2) Σ_{n≥1} n,
  它按下述**正规化处方**被赋予有限值：引入截断（指数截断 Σ_{n≥1} n e^{-εan}，
  或等价地 ζ 函数解析延拓 Σ_{n≥1} n^{-s}|_{s=-1}），
  丢弃截断依赖的发散项 1/(εa)^2，保留有限部分：
    "Σ_{n≥1} n" ⟶ -1/12.
  这一赋值是弦论中计算正规序常数所使用的处方，而不是级数意义下的收敛结论
  （级数 Σ n 在通常意义下发散）。
uses_conventions: []
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.32)（Σ_{n=1}^∞ n → −1/12），p.22；截断因子是 (1.3.33) exp(−εγ_{σσ}^{−1/2}|k_σ|)，截断后的 A 是 (1.3.34)；**原书对本处方的定性在 §2.9 末，p.73**（\"a useful mnemonic\"），一般公式是 **(2.9.19)** Σ_{n=1}^∞(n−θ) ≡ 1/24 − (1/8)(2θ−1)²"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——**两条比旧记录硬得多的依据**】

      (1) **原书 p.73 逐字把这条称为 mnemonic，并明说要用更诚实的方法核对**：
        "**We have now given three honest ways of calculating normal ordering constants: from the
          Virasoro algebra as in eq. (2.7.8), by relating the two forms of normal ordering as in
          eq. (2.7.11), and from the state–operator mapping above. Nevertheless the idea of adding
          up zero-point energies is intuitive and a useful mnemonic, so we give a prescription that
          can be checked by one of the more honest methods:** ..."
        并把发散和的赋值写成**定义**：「One encounters divergent sums of the form Σ_{n=1}^∞(n−θ) …
        **Define this to be** Σ_{n=1}^∞(n−θ) = 1/24 − (1/8)(2θ−1)² **(2.9.19)**. This is the value one
        obtains as in eq. (1.3.32) by regulating and discarding the quadratically divergent part.」
      → **即「zeta 路线不是推导」这一判断现在是原书自陈，不再只是 [S] 的反讽评语或本图的裁断。**
        本节点 notes 里对 status 的选择（physical-argument，不记为 convention）由此得到一手支持。

      (2) **丢弃发散项的理由在原书里比旧记录记的更强**。p.22 逐字：
        "The cutoff-dependent first term is proportional to the length ℓ of the string and can be
         canceled by a counterterm in the action proportional to ∫d²σ(−γ)^{1/2}. **In fact, Weyl
         invariance *requires* that it be canceled**, leaving only the cutoff-independent second term…
         **This finite remainder is an example of a Casimir energy**, coming from the fact that the
         string has a finite length."
      → 丢弃发散项**不是**随意的正规化选择：原书给的理由是 **Weyl 不变性要求存在这个抵消项**。
        这比本节点 notes 末段引的「Headrick 习题 1.5 的 θ-无关性」理由强，且是一手的。
        ⚠ 但它**不改变本节点的 status**：Weyl 不变性要求抵消发散项，
        并不论证「剩下的有限部分就是物理零点能」——后者仍是本节点唯一未证的那一步。

      (3) 配套：中心荷的 Casimir 能量诠释在原书是 (2.9.17) E = −(c+c̃)/24 与
        (2.9.18) E = −π(c+c̃)/12ℓ（本图旧记录没有这两式）。
      见 literature/extractions/polchinski-1998-v1.md §12.4（E15/E42/E43）、§12.5（E10–E19）
      与 §12.10 表 B 第 15 项。
tags: [bosonic-string, regularization, zero-point-energy, light-cone]
notes: |
  **status 的选择（本节点作者的裁断）**：本项目给了两个选项——
  (a) 记为 physical-argument 的命题，或 (b) 记为「正规化约定」的 definition/convention 节点。
  **选 (a)。** 理由：按 docs/STATUS_LEVELS.md，convention 节点「永远不降级任何东西」。
  若把 Σ n = -1/12 记成约定，则由它导出的 A = -(D-2)/24、进而 D = 26 的光锥路线
  会在图上显示为完全严格，而事实上「丢弃发散项后剩下的有限部分就是物理零点能」
  正是这条路线中唯一非严格的一步——把它藏进约定层等于让工具算出的有效状态说谎，
  违反「状态只能实话实说」。度规号差、α' 归一化那种「换一套写法结论不变」的东西
  才是约定；正规化处方带有物理内容（它选择了哪个有限值是物理的），不是约定。

  与本节点配套的**纯数学部分**已单列为 worldsheet.regulated-sum-laurent-expansion
  （rigorous）：那条说的是收敛级数 Σ n e^{-un} 的 Laurent 常数项确实是 -1/12。
  本节点只多主张一件事：**这个常数项就是物理零点能**。这一步没有证明。

  合法性的通常理由是「截断依赖项与正规化细节无关，可被局域抵消项吸收」；
  Headrick 习题 1.5 的 θ-推广（截断项与 θ 无关）是这种理由的一个实例，
  但抽取记录明确说「这不是证明」。
  严格化路线：把零点能定义为算子的 ζ 正规化行列式，或用 Virasoro 中心荷的
  代数计算（c^⊥ = D-2）替代模式求和；届时可加一条 kind: proof 的新推导。
author: curator-polchinski-ch1
created: "2026-09-10"
