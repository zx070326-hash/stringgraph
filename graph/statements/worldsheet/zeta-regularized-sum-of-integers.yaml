id: worldsheet.zeta-regularized-sum-of-integers
kind: proposition
title: 零点能中的发散和 Σ_{n≥1} n 被正规化赋值为 -1/12
statement: |
  在计算光锥规范下横向振子的零点能时出现发散和
    E_0 ∝ (1/2) Σ_{n≥1} n,
  它按下述**正规化处方**被赋予有限值：引入截断（指数截断 Σ_{n≥1} n e^{-εan}，
  或等价地 ζ 函数解析延拓 Σ_{n≥1} n^{-s}|_{s=-1}），
  丢弃截断依赖的发散项 1/(εa)^2，保留有限部分：
    "Σ_{n≥1} n" ⟶ -1/12.
  这一赋值是弦论中计算正规序常数所使用的处方，而不是级数意义下的收敛结论
  （级数 Σ n 在通常意义下发散）。
uses_conventions: []
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.32)（p.22）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E15，证据等级 [已核实]
      （Schrans 目录「1.12 p 22: Eq. (1.3.32) Regularising Σ_n n」）。
      抽取记录明确指出这是「一个正规化步骤而非证明」；Schrans 对该推导的评语
      「This derivation is a delight to mathematicians.」是反讽——那是 Schrans 的评价，
      不是 Polchinski 的措辞（Polchinski 的原措辞未核实，见抽取记录 §0）。
tags: [bosonic-string, regularization, zero-point-energy, light-cone]
notes: |
  **status 的选择（本节点作者的裁断）**：本项目给了两个选项——
  (a) 记为 physical-argument 的命题，或 (b) 记为「正规化约定」的 definition/convention 节点。
  **选 (a)。** 理由：按 docs/STATUS_LEVELS.md，convention 节点「永远不降级任何东西」。
  若把 Σ n = -1/12 记成约定，则由它导出的 A = -(D-2)/24、进而 D = 26 的光锥路线
  会在图上显示为完全严格，而事实上「丢弃发散项后剩下的有限部分就是物理零点能」
  正是这条路线中唯一非严格的一步——把它藏进约定层等于让工具算出的有效状态说谎，
  违反「状态只能实话实说」。度规号差、α' 归一化那种「换一套写法结论不变」的东西
  才是约定；正规化处方带有物理内容（它选择了哪个有限值是物理的），不是约定。

  与本节点配套的**纯数学部分**已单列为 worldsheet.regulated-sum-laurent-expansion
  （rigorous）：那条说的是收敛级数 Σ n e^{-un} 的 Laurent 常数项确实是 -1/12。
  本节点只多主张一件事：**这个常数项就是物理零点能**。这一步没有证明。

  合法性的通常理由是「截断依赖项与正规化细节无关，可被局域抵消项吸收」；
  Headrick 习题 1.5 的 θ-推广（截断项与 θ 无关）是这种理由的一个实例，
  但抽取记录明确说「这不是证明」。
  严格化路线：把零点能定义为算子的 ζ 正规化行列式，或用 Virasoro 中心荷的
  代数计算（c^⊥ = D-2）替代模式求和；届时可加一条 kind: proof 的新推导。
author: curator-polchinski-ch1
created: "2026-09-10"
