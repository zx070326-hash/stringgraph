    loc: "formal/StringFormal/NoGhost/Assembly.lean :: StringFormal.NoGhost.no_ghost_of_spans（本卡 formal.lean_decl，= 断言 (2)）；(1a) = StringFormal.NoGhost.towerPairing_self_nonneg_of_mem_towerPhys_of_spans；(1b) = StringFormal.NoGhost.towerPairing_self_eq_zero_iff_mem_towerNullSubmodule_of_spans；范数计算引理 towerPairing_self_eq_of_spans（⟨Ψ,Ψ⟩ = ⟨d,d⟩，Ψ = d + χ）；前件 = StringFormal.NoGhost.DDFSpans"
    note: |
      本仓库，formalizer 分支 agent/formalizer/noghost-c5（lead 以 34b67ef 合入 main），
      Lean 4 + Mathlib v4.33.1，**无 sorry**。**curator 未自行重跑 `lake build` 与 `check-axioms`**；
      按项目纪律，含 formal/ 改动的分支合并前由 lead 跑两者，本分支只改 graph/。
      这是本卡 status formalized 的依据。
      **逐句字典**：K 的序 ⇒ `[Field K] [LinearOrder K] [IsStrictOrderedRing K] [Algebra ℚ K]`；
      (N)(S) ⇒ `hbb : dotVec η b b = 0`、`hba : dotVec η b a = 1`；
      Ε ⇒ `Ε : TransverseFrame η b`；a₀ ⇒ `invTwo K * Fock.zeroModeSq η a`；
      H_phys ⇒ `towerPhysSubmodule η a b a₀`；H_null ⇒ `towerNullSubmodule η a b a₀`；
      前件 ⇒ `hspan : DDFSpans η a b hη Ε`；商 ⇒ `TowerPhysQuot η a b a₀`；
      ⟨·,·⟩_quot ⇒ `towerQuotientPairing η a b a₀`；
      (2) 逐字 ⇒ `∀ x, 0 ≤ towerQuotientPairing … x x ∧ (towerQuotientPairing … x x = 0 → x = 0)`。
      **D = 26 在该文件中一次不出现**（`grep 26 Assembly.lean` 只命中文档注释）；文件头逐字：
      'The whole content of `D = 26` sits inside `DDFSpans`: the critical dimension never appears in
      the statements or proofs of this file.'
  - ref: goddard-2008
    loc: "§6 'No-Ghost Theorem', p.15, (6.4)–(6.5) 附近（arXiv:0802.3249v1）：从 |ψ⟩ = |f⟩ + |n⟩ 到 ⟨ψ|ψ⟩ = ⟨f|f⟩ ≥ 0 的那一步"
    note: |
      文献侧对应处。**不承载本卡的论证**（本卡的论证是 Lean 机器证明）；该文对这一步也只有一句话。
      文献把「张成」与「正定」写在同一个定理里；本图把它们拆开：张成是
      worldsheet.ddf-spanning-hypothesis（open），正定-给定-张成是本卡（formalized）。
      这正是 graph/CLAUDE.md「一个节点一个命题」在无鬼定理上的实施。
tags: [bosonic-string, no-ghost, ddf-spans, spectrum-generating-algebra, formalized, conditional]
notes: |
  【为什么立卡（curator 2026-09-11，noghost-conditional）】
  Assembly.lean 把 Goddard–Thorn 无鬼定理拆成「张成」+「张成 ⇒ 正定」两半，后者机检完成。
  本图此前没有一张卡承载后者：worldsheet.no-ghost-theorem-v4 是无条件断言（含 26），
  其唯一推导 --via-goddard-thorn 是 rigorous 且带 (B-26) gap。本卡让「已机检的那一半」
  成为图上一个可被引用、可被 `status` 查询的节点，从而使猜想负担的记账精确到一条卡：
  **无鬼定理 = 本卡（formalized）+ worldsheet.ddf-spanning-hypothesis（open）**。

  【有效状态 = open，这是实话，不是缺陷】
  本卡的推导 --via-lean 自身 status 为 formalized，但 `depends_on` 含前件
  worldsheet.ddf-spanning-hypothesis（open，无推导），按 docs/STATUS_LEVELS.md 的
  effective = min(...) 规则，本卡 effective = open。
  这是**正确的记账**：条件命题的有效状态就该由前件决定——「若 X 则 Y」在 X 未建立时对 Y 不提供任何
  已建立的东西。`uv run stringgraph why worldsheet.no-ghost-theorem-conditional-on-ddf-spanning`
  会把瓶颈指到前件那一张卡，这正是本轮想让工具说出来的话。
  ⚠ 不要为了让本卡「显示为 formalized」而给前件挂一条 physical-argument 推导，
  也不要把前件从 depends_on 里拿掉（那会把一条条件命题冒充成无条件命题）。

  【条件命题的前件作为 depends_on 边】
  前件那条边**不是** inferred：它是 Lean 声明里显式的 `hspan` 参数，来源可在 Assembly.lean
  逐字读到。它也**不是**「接口边」（docs/STATUS_LEVELS.md 2026-09-12 裁决）——接口边不在机检链上，
  而 `hspan` 在每一条定理的证明体里都被使用（`Submodule.mem_sup.1 (hspan hv)`）。
  它是第三种：**条件命题的前件**。推导的 note 里写明了这一点。

  【与 worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 (B-26) gap 的关系】
  那条 gap 是「D = 26 唯一进入之处」的记账。本卡把这句话变成一个可检验的事实：
  Lean 文件里 26 一次不出现，而定理成立——所以 26 只能在前件里。
  那条推导的 gaps 末已追记：条件版已 Lean，其剩余非机检内容 = 前件一条。

  【noGhostEquiv 为什么不写（Assembly.lean Gaps 第 2 条）】
  蓝图 §C.5 原计划构造等距同构 ddfSpan ≃ₗ H_phys ⧸ H_null。单射由 `ddf_span_pos` 得，
  满射逐字 = `DDFSpans`。故同构不比 `no_ghost_of_spans` + 前件多任何信息，不值得写；
  本图也不为它立卡（边界 (c)）。

  【与 v4 的分工】
  v4 的 (1b) 断言等距同构、(2) 断言 D > 26 有负模态（后者由
  worldsheet.negative-norm-physical-state-above-26 承载）；本卡只做 (1a)(1b) 的条件化。
  v4 **不**因本卡改 status；v4 的 notes 已追记本卡的存在。
