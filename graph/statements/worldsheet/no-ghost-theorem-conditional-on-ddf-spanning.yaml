id: worldsheet.no-ghost-theorem-conditional-on-ddf-spanning
kind: proposition
title: 无鬼定理的条件版（Goddard–Thorn 的机检骨架）：若 DDF 张成假设成立，则动量塔上 H_phys/H_null 的诱导型正定——**对任意 D、任意有序域**，D = 26 不出现
statement: |
  【设定】记号逐字沿用 worldsheet.ddf-spanning-hypothesis（它又沿用
  worldsheet.momentum-tower-fock-space、worldsheet.ddf-operators-v6、
  worldsheet.ddf-operators-preserve-physical-states、worldsheet.tower-physical-quotient-form）：
  D ∈ N；系数域 K 是**带线性序的有序域**（LinearOrder + IsStrictOrderedRing）且是 Q-代数
  ——例如 K = ℝ 或 K = ℚ；对角度规分量 η_μ² = 1（conv.metric-mostly-plus）；
  基点动量 k 与参考向量 k_0，重标度 a := (2α')^{1/2} k、b := (2α')^{1/2} k_0
  （conv.alpha-prime-regge），满足
    (N) η(b, b) = 0（k_0 类光）；   (S) η(b, a) = 1（归一化 2α' k_0·k = 1）；
  动量塔 T(k; k_0) 与其层间正交的 K-双线性型 ⟨·,·⟩_T；横向标架 Ε = (ε_1..ε_{D−2}) 满足
  η(ε_i, b) = 0 与 η(ε_i, ε_j) = δ_{ij}。
  截距逐字取基态值 a₀ := α' k² = ½ η(a, a)（conv.intercept-sign-a）。

  H_phys := { Ψ ∈ T(k;k_0) : (L_0 − a₀)Ψ = 0 且 L_mΨ = 0 ∀ m ≥ 1 }，
  H_null := H_phys ∩ H_phys^⊥，
  D(Ε) := DDF 张成（worldsheet.ddf-spanning-hypothesis 的记号），
  ⟨·,·⟩_quot := ⟨·,·⟩_T 在商 H_phys/H_null 上诱导的对称双线性型
  （worldsheet.tower-physical-quotient-form 的 (4)：⟨[Ψ],[Φ]⟩_quot = ⟨Ψ,Φ⟩_T）。

  【前件】**DDF 张成假设**（worldsheet.ddf-spanning-hypothesis）：
      H_phys ⊆ D(Ε) + H_null 。

  【断言】在上述设定与前件之下，⟨·,·⟩_quot 在 H_phys/H_null 上**正定**：
    (1a) 对一切 Ψ ∈ H_phys，⟨Ψ, Ψ⟩_T ≥ 0；
    (1b) 对一切 Ψ ∈ H_phys，⟨Ψ, Ψ⟩_T = 0 ⟺ Ψ ∈ H_null；
    (2)  等价地，对商中每个类 x ∈ H_phys/H_null：⟨x, x⟩_quot ≥ 0，且 ⟨x, x⟩_quot = 0 ⟹ x = 0。

  【本卡明确不断言】
  (a) **不断言前件成立**。前件是 worldsheet.ddf-spanning-hypothesis，那张卡刻意无推导；
      本卡的有效状态因此由前件决定（notes）。
  (b) **不含 D = 26，也不含 a₀ = 1**。断言对每个 D ∈ N 成立，截距是被基态钉死的 α'k²
      而不是 1（快子壳 α'k² = 1 是一个特例）。**D = 26 与 a = 1 的全部内容都在前件里**。
  (c) **不断言 H_phys/H_null ≅ D(Ε)（等距同构）**。单射 D(Ε) → H_phys/H_null 由
      (1b) 与「DDF 扇区正定」立即得到，满射逐字就是前件；故「同构」不比「(2) + 前件」多给任何东西
      （Assembly.lean Gaps 第 2 条），本图不为它另立节点。
  (d) **不断言零动量或 k_0·k = 0 的扇区**：(S) 把 k_0·k ≠ 0 写进了设定。
  (e) **不断言 H_phys ≠ 0 或商非零**。
  (f) 与 worldsheet.no-ghost-theorem-v4 的关系：那张卡是 D = 26、a = 1 的无条件断言（含等距同构与
      D > 26 的反例）；本卡是它 (1a)(1b) 那一半的**条件化**版本，把 26 剥离到前件里。
      本卡**不**取代 v4，也不是 v4 的推导——两者是不同命题。
