id: worldsheet.tt-ope-central-charge
kind: definition
status: rigorous
title: TT 算子乘积展开与中心荷 c 的定义
statement: |
  设 T(z) 是二维共形场论的全纯能动张量。其与自身的算子乘积展开的最一般形式为
    T(z) T(0) ∼ c/(2 z^4) + (2/z^2) T(0) + (1/z) ∂T(0),
  其中常数 c 称为该理论的**中心荷**（反全纯部门同理给出 c̄）。
  二阶与一阶极点的系数（2 与 1）由 T 自身是权 (2,0) 算子这一事实固定；
  四阶极点的系数是理论的一个不变量，即 c 的定义。三阶极点因 T 的对称性而缺席。

  归一化：本式与 conv.virasoro-standard 相容，即由此定义的 c 与 Virasoro 代数
  [L_m, L_n] = (m-n)L_{m+n} + (c/12) m(m^2-1) δ_{m+n,0} 中的 c 是同一个数，
  从而单个自由玻色子给 c = 1。
uses:
  - worldsheet.primary-field-v2
  - worldsheet.traceless-holomorphic-energy-momentum
  - worldsheet.operator-product-expansion
uses_conventions:
  - conv.worldsheet-complex-coords
  - conv.virasoro-standard
sources:
  - ref: polchinski-1998-v1
    loc: "§2.4, eq. (2.4.25), p.48（一般 c 的 TT OPE：T(z)T(0) ∼ c/(2z⁴) + (2/z²)T(0) + (1/z)∂T(0)）；中心荷 c 在 **(2.4.24)** 首次定义（ε^{−1}δT(z) = −(c/12)∂³_z v − 2∂_z v T − v∂_z T），自由标量的特例是 (2.4.23) 与 (2.4.22)"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——式号落定，撤销「未核实」】

      §2.4 末尾五式全部 L1：
        (2.4.22) 自由标量的 TT OPE，四阶极点显式为 D/2z⁴（→ worldsheet.free-boson-central-charge-d）
        (2.4.23) ε^{−1}δT(z) = −(D/12)∂³_z v − 2∂_z v T − v∂_z T （自由标量特例）
        (2.4.24) 同式换成一般 c —— **c 在此首次定义**
        (2.4.25) **本节点陈述的 TT OPE**，系数 c/2、2、1 逐字一致
        (2.4.26) 有限形式 (∂_z z')²T'(z') = T(z) − (c/12){z',z}
        (2.4.27) Schwarzian 导数的定义
      即原书**先**用 T 的变换律定义 c（(2.4.24)），**再**把它写成 TT OPE（(2.4.25)）；
      本节点把 OPE 取作定义点，与原书的顺序相反但内容等价（(2.4.24) ⇔ (2.4.25) 由围道字典）。
      **不得**声称本节点的 OPE 是原书的「中心荷定义式」——原书的定义式是 (2.4.24)。

      另一条本轮新落实、与本节点 notes 相关的事实（p.48，(2.4.24) 之后，逐字）：
        "by considering the commutator of two such transformations one can show that **∂_a c = 0**,
         and it is a general result in quantum field theory that an operator that is independent of
         position must be a c-number."（脚注 5 给论证）
      即「中心荷是常数」在本书里出现**两次**且是**两条不同的论证**：§2.4 这一处（CFT 内部，
      靠平移不变性 + 局域性）与 §3.4 的 (3.4.31)（Weyl 反常的 Wess–Zumino 相容性）。
      本图的 worldsheet.weyl-anomaly-central-charge-constant 目前只记了后者，
      **两条不要合并**（见该节点的 sources）。

      见 literature/extractions/polchinski-1998-v1.md §12.1（E33/E34）与 §12.10 表 B 第 6 项。
tags: [cft, central-charge, ope, energy-momentum-tensor, definition]
notes: |
  本节点是「中心荷」在本图中的**定义点**。它与 conv.virasoro-standard 的关系是：
  约定节点固定 Virasoro 代数的归一化，本节点给出同一个 c 的 OPE 刻画，
  两者的一致性由 worldsheet.ope-commutator-dictionary（围道变形字典）建立。

  下游用到本定义的节点：
    worldsheet.free-boson-central-charge-d（c = D）
    worldsheet.bc-ghost-central-charge（c = -26）
    worldsheet.beta-gamma-central-charge（c = +11）
    worldsheet.linear-dilaton-central-charge（c = D + 6α'V·V）
  中心荷不随共形变换改变、且是常数这一点另有节点：
  worldsheet.weyl-anomaly-central-charge-constant（Wess–Zumino 相容性）。

  **待拆**（reviewer-ch23 提出，本轮不拆）：本卡片除了定义中心荷（TT OPE 四阶极点系数）之外，
  还内嵌了「TT OPE 的低阶极点结构由共形不变性完全确定」这条**命题**。
  若日后它们被分别推导或分别引用，应拆成两个节点。
