id: worldsheet.bosonic-relative-cohomology-vanishing
kind: proposition
title: 玻色弦相对 BRST 上同调的消灭定理：p ≠ 0 时 H^i_∞(ℒ, ℒ₀, V(E,p)) = 0 除 i = 0（FGZ 1986 Theorem 2.7(i)）
statement: |
  **设定**（数学侧表述，照 FGZ 1986 的记号；与本图物理侧对象的对照见 notes）。
  记 ℒ 为 Virasoro 代数（worldsheet.virasoro-algebra-v2 的 Vir），ℒ₀ ⊂ ℒ 为含 L₀ 的子代数，
  ℒ^± 为正/负模部分，𝖟 ⊂ ℒ 为中心，Λ^∞_* 为鬼场（半无限形式）模，
  H^•_∞(ℒ, ℒ₀; V) 为系数在 ℒ-模 V 中的**相对**半无限上同调（FGZ §1.2 的 relative subcomplex）。
    (H1) **号差 (D−1, 1)**：FGZ p.8445 左栏逐字 "Now we will restrict our attention to the case
         of signature (D − 1, 1), which is the most interesting from both the mathematical and the
         physical points of view."（本图的 conv.metric-mostly-plus）。
    (H2) **物质模是 Fock 模 V(E, p)**：E 是上述号差的 D 维空间，p 是固定的质心动量，
         V(E,p) 带分次 deg(α^{μ₁}_{m₁} … |p⟩) = (Σ m_i) − p·p/2，形式特征标
         ch_q V(E,p) = q^{p·p/2} φ(q)^{−D}（p.8445 左栏逐字；FGZ 称之为 **Fock module**）。
         其上有厄米形式使 π(L_m)* = π(L_{−m})，故 V(E,p) 是**厄米 ℒ-模**（同页逐字
         "We have π(L_m)* = π(L_{−m}), so that V(E, p) is a Hermitian ℒ-module."）。
    (H3) **D = 26，等价地 π(c) = 26·Id_V**：FGZ p.8445 右栏（Theorem 2.7 正上方）逐字
         "Now we will consider the relative cohomology groups with coefficients in V(E, p),
         so that D = 26."；同页左栏给出接口逐字
         "[π(L_m), π(L_n)] = (m − n)π(L_{m+n}) + (D/12)(m³ − m)δ_{m+n}·Id. Thus π(c) = D·Id by Eq. 2.1."
         ⇒ **"D = 26" 与 "π(c) = 26·Id" 在 FGZ 里是同一个假设的两种写法，不是两条独立条件。**
         鬼场一侧 FGZ Proposition 2.1(i) 算出 ρ(c) = −26·Id_{Λ^∞_*}，故总中心荷为零，
         微分幂零 d² = 0（FGZ Proposition 1.2），上同调有定义。
         ⚠ **这是 FGZ 的假设，不是结论**，见"本命题不断言 (c)"。
    (H4) **D ≥ 2**：经 Proposition 2.6 进入（该命题逐字以 "Let E have signature (D − 1, 1),
         D ≥ 2 and p ≠ 0." 开头，而 Theorem 2.7 的证明用它的第一部分）。
         在 (H3) 下 D = 26 已蕴含之；单独列出是因为 FGZ 的前提链上确有这一条。
    (H5) **次数 i 是相对复形的整数次数，不是"鬼数"**。FGZ p.8445 全页不出现 "ghost" 字样
         （researcher 2026-09-11 的 negative evidence，仅覆盖该页）；物理学家的鬼数在 FGZ 里
         就是这个 i，而**零点由"相对 ℒ₀ 的子复形"这个约定固定**，不是另外声明的。
         ⚠ 换成**绝对**复形（只相对于中心 𝖟）时非零次数是 **±½** 而不是 0（Theorem 2.5），
         故引用本定理必须写明是**相对**复形。
         ⚠ 本图 worldsheet.no-ghost-theorem-brst 用 gh(|0⟩) = 0、gh(c_n) = +1，其相对上同调
         集中在**鬼数 1**；与本卡的 i = 0 相差常数平移 1。该平移是本图从自己的鬼数归一化
         推出的，**FGZ 不给字典**。（与超弦侧 worldsheet.superstring-relative-cohomology-vanishing-v2
         的 (H4) 同款写法：次数与鬼数是两件事。）

  **断言**（Theorem 2.7(i)，p.8445 逐字：**"THEOREM 2.7. Suppose p ≠ 0. Then (i)
  H^i_∞(ℒ, ℒ₀, V(E, p)) = 0, i ≠ 0, …"**）：

    在 (H1)–(H4) 之下，若 **p ≠ 0**，则 **H^i_∞(ℒ, ℒ₀, V(E,p)) = 0 对一切 i ≠ 0**，
    即相对 BRST 上同调集中在**单一**次数 i = 0 上。

  **本命题不断言**：
    (a) 不断言 **H⁰ 的维数**。"dim H⁰_∞(ℒ, ℒ₀, V(E,p)) = p_{(24)}(1 − p·p/2)，若 1 − p·p/2 是
        非负整数，否则为 0" 是同一定理的 **(ii)**，与 (i) 同号不同条，本图未建卡
        （researcher 建议单建一卡，已列入报告）。
        ⚠ 顺带：FGZ 在 Theorem 2.7 之后逐字指出 "Theorem 2.7 implies that the cohomology groups
        are trivial except for a one-dimensional H⁰_∞ in the positive-definite case, but H⁰_∞ can be
        arbitrarily large in the indefinite case."——**不定号差（即本卡的 (H1)）正是 H⁰ 可以很大的情形**。
    (b) 不断言 H⁰ 上的任何**正定性**，也不断言它与横向空间 T ∩ P 或旧协变物理态 P/rad P 的同构。
        那是 FGZ **Theorem 2.8**（= worldsheet.no-ghost-theorem-brst 的断言 (2)(3) 与
        worldsheet.brst-cohomology-equals-ocq-physical）。本定理是纯上同调陈述。
        ⚠ 但与超弦版有一处**不对称**：FGZ 的路线经 **Theorem 1.12**，其假设含"V 是 ℒ^--free
        且带**非退化厄米形式**"，故本定理的证明链**用到**形式的存在与非退化性（不是正定性）；
        LZ 的超弦版消灭定理则完全不用任何厄米形式。
    (c) 不断言 **D = 26 这个数**。FGZ **不推导** D = 26 而是假设它（(H3)）；
        抽取记录 literature/extractions/brst-cohomology-sources.md §1.2 的裁定逐字：
        "FGZ 不推导 D = 26，而是假设它"。
        "Q_B² = 0 ⟹ D = 26" 的原始来源是 kato-ogawa-1983，不是本卡。
    (d) 不断言 **p = 0**。FGZ Proposition 2.8 / 2.9 与其推论把 p = 0 列为例外情形
        （Theorem 1.12 不适用），并在格 L 为偶整格时给出
        H^{±½}_∞(ℒ, 𝖟; V(R^{25,1}, L)) ≅ P(R^{25,1}, L)。
        ⚠ 本图**未逐字核实** p = 0 时相对上同调的具体形态（超弦侧有 LZ Proposition 5.5 的逐字
        失效机制，玻色侧只核到"例外情形"这一层）。
    (e) 不断言**绝对**（只相对于中心 𝖟）复形的上同调。那是 FGZ **Theorem 2.5**
        （H^m_∞(ℒ, 𝖟; V) ≅ H⁰(ℒ, ℒ₀; V) 对 m = ±½，其余为零）。
    (f) 不断言本卡的 (ℒ, ℒ₀) 相对复形与本图 {b₀Ψ = 0, L₀Ψ = 0}（
        worldsheet.brst-preserves-relative-complex）**逐字**同一。两者在文献里公认是同一对象的
        两种写法，但 FGZ 未写出这个字典（见 notes 与推导 gaps）。
    (g) 不断言**横向空间的存在与构造**。那是 Proposition 2.6 的**第二部分**
        （存在正定 T ⊂ V(E,p)^{ℒ^+} 且 ch_q T = q^{p·p/2}φ(q)^{D−2}）；本定理只用它的
        **第一部分**（自由性）。FGZ 逐字把两半分派给不同任务：Theorem 2.7 之后那句
        "we can explicitly construct representatives of the cohomology classes using the second
        part of Proposition 2.6"。
uses:
  - worldsheet.virasoro-algebra-v2
  - worldsheet.brst-quantization-v2
uses_conventions:
  - conv.metric-mostly-plus
  - conv.virasoro-standard
sources:
  - ref: fgz-1986
    loc: "**Theorem 2.7**, p.8445 右栏，逐字：'THEOREM 2.7. Suppose p ≠ 0. Then (i) H^i_∞(ℒ, ℒ₀, V(E, p)) = 0, i ≠ 0, and (ii) dim H^0_∞(ℒ, ℒ₀, V(E, p)) = p_{(24)}(1 − p·p/2), if 1 − p·p/2 is a nonnegative integer and 0 otherwise.'（本卡只取 (i)）"
    note: |
      **L1（页图逐字）**：researcher 2026-09-11 第二轮，
      literature/extractions/brst-cohomology-sources.md §9.1。取件路线：
      `cdn.ncbi.nlm.nih.gov/pmc/blobs/a950/386946/275fe5e6b989/pnas00326-0018.png`
      （期刊页 8445 = 扫描页 -0018）。与 §1.4 表格的旧转述**内容一致，无需更正**。
      ⚠ **定理陈述本身只带一个量词 p ≠ 0**；其余四条前提（D = 26 / π(c) = 26、号差 (D−1,1)、
      D ≥ 2）都写在正文里，逐字位置见 §9.2 的表，本卡 (H1)–(H4) 已逐条集齐。
      ⚠ **编号陷阱**：p.8446 同时有 **Proposition 2.8** 与 **Theorem 2.8**，两者不同，
      引用必须带类型词（§1.4 末尾）。
      ⚠ **本卡只取 (i)**；(ii) 是维数公式，与 (i) 同号不同条，按 graph/CLAUDE.md
      「一个节点一个命题」分开。
  - ref: fgz-1986
    loc: "**Theorem 2.7 正上方一句**（p.8445 右栏）逐字：'In this case the vanishing theorem (**Theorem 1.12**), the Euler–Poincaré principle (**Proposition 1.3**), **Proposition 2.4**, and **the first part of Proposition 2.6** imply the following.'"
    note: |
      L1（§9.3）。★★ **这是本卡依赖边不标 inferred 的依据**：四条依赖是 FGZ **原文明写**的，
      不是抽取者推断。
      ★ **强度措辞是 "imply the following"**——FGZ 把 Theorem 2.7 当作前四条的**直接推论**，
      本身不另给证明。本卡推导的 rigorous 正是按这个口径给的（见推导 summary 与 gaps）。
  - ref: fgz-1986
    loc: "**Proposition 2.6**, p.8445，逐字：'PROPOSITION 2.6. Let E have signature (D − 1, 1), D ≥ 2 and p ≠ 0. Then (i) V(E, p) is a free ℒ^--module and (ii) there exists a positive definite subspace T ⊂ V(E, p)^{ℒ^+} [= all v ∈ V(E, p), annihilated by ℒ^+], such that ch_q T = q^{p·p/2}φ(q)^{D−2}.'；**Theorem 1.12**, p.8444（消灭定理：V 是 n_--free 且带非退化厄米形式时 H^m_∞(g, g₀; V) = 0, m ≠ 0）；**Proposition 1.3**, p.8443（Euler–Poincaré）；**Proposition 2.4**, p.8445"
    note: |
      L1（Prop 2.6 逐字见 §9.2 表第 5 行；Thm 1.12 / Prop 1.3 / Prop 2.4 的内容见 §1.4 编号表）。
      证明链：Prop 2.6(i) 给出 ℒ^--自由性 → 喂给 Thm 1.12 的假设 → 消灭；
      维数由 Prop 1.3 与 Prop 2.4 定出（那是 (ii)，不在本卡）。
      ★ **Theorem 1.12 的假设里有"非退化厄米形式"**——这是本卡与超弦版
      worldsheet.superstring-relative-cohomology-vanishing-v2 的**实质差别**：LZ 的 Theorem 2.4
      走"有限过滤 + 长正合列 + Poincaré 对偶"，auditor 2026-09-11 逐条核对过其证明
      "不涉及任何厄米形式"；FGZ 这一侧把形式的非退化性写进了 Theorem 1.12 的假设。
      ⇒ 两条消灭定理是**类比**（LZ 自述 'This is the analogue of the vanishing theorem proven
      by FGZ.'），**不是同一条论证的两个实例**。
      ⚠ **Proposition 2.4 的前提本图未逐字核实**：抽取记录 §1.4 把它一句话记作
      "dim H^m_∞(ℒ, ℒ₀; V) = 0 for m ≠ 0；m = 0 时等于 Eq. [2.3] 中 1 的系数"，
      与 Theorem 2.7 的结论形式上几乎重复。既然 FGZ 把它列为 2.7 的**输入**，
      它一定对 V 另有假设（本图未核到）。本卡不据 Prop 2.4 断言任何事，见推导 gaps。
  - ref: fgz-1986
    loc: "p.8445 左栏（V(E,p) 的分次与形式特征标）逐字：'The module V(E, p) is also a graded ℒ-module under the following definition of grading: deg α^{μ₁}_{m₁} … |p⟩ = (Σ^N_{i=1} m_i) − (p·p/2). The formal character of V(E, p) is given by ch_q(V(E, p)) = q^{p·p/2}φ(q)^{−D}. The graded ℒ-module V(E, p) will be called a Fock module.'；同页 'We have π(L_m)* = π(L_{−m}), so that V(E, p) is a Hermitian ℒ-module.'；号差限制逐字 'Now we will restrict our attention to the case of signature (D − 1, 1) …'"
    note: |
      L1（§9.2 表第 3 行、§9.6）。本条是 (H1)(H2) 的来源，也是本卡为什么要
      worldsheet.fock-indefinite-form 那条（inferred）边的对象接口：FGZ 只说 V(E,p) 是
      **厄米** ℒ-模，**没有**把"该形式就是由 ⟨p|p⟩ = 1 与 (α^μ_n)† = α^μ_{−n} 唯一确定的那个"
      写成一条陈述。
      ★ **同页 Prop 2.6 之后的 Remark（逐字）**：'We note that, although V(E, p) in the above
      proposition is free over ℒ_-, it is **not in general a direct sum of Verma modules** or even
      generated as an ℒ-module by V(E, p)^{ℒ^+}. As a counterexample one can choose the case in
      which p·p is a nonpositive even integer.'
      ⇒ 两条后果：(1) 本卡的 ℒ^--自由性**不能**被换读成"Verma 模直和"（这正是本推导到
      math.verma-module-free-over-negative-part 的边必须标 inferred 的理由）；
      (2) 这条 Remark 是 worldsheet.nsr-fock-space-verma-decomposition 争议的**玻色侧独立反证**
      （已按 lead 指示加到那张卡的 sources）。
  - ref: fgz-1986
    loc: "**Proposition 2.1(i)**, p.8444（ρ(c) = −26·Id_{Λ^∞_*}）与紧随正文逐字 'We will work in the subcomplex of V ⊗ Λ^∞_* ℒ′ relative to the center. Thus from this point on we will assume that π(c) = 26 Id_V. When V is the Fock module (see Section 2.2), the differential of this subcomplex is known in the physics literature as the BRST operator (see, e.g., ref. 5) and we will call this subcomplex the BRST complex.'（ref. 5 = kato-ogawa-1983）；**Proposition 1.2**, p.8443（全文一句 'd² = 0.'，前提写在正文：假设 H²(g) = 0 且 ω₀、β 取法使 γ = 0）"
    note: |
      L1（§1.2）。本条是 (H3) 的来源，也是"**FGZ 不推导 26**"这一裁定的依据：
      26 在 FGZ 里的地位是「鬼表示的中心荷算出来是 −26（Prop 2.1(i)）」**加上**
      「对相对复形**假设** π(c) = 26」。抽取记录 §1.2 对 curator 的告诫逐字：
      「若图里有节点声称「FGZ 给出 Q²=0 ⟺ c=26 的严格版本」，按本次核实**不成立**」。
      本卡"本命题不断言 (c)"照此写。
  - ref: fgz-1986
    loc: "**Theorem 2.5**, p.8445（H^m_∞(ℒ, 𝖟; V) ≅ H⁰(ℒ, ℒ₀; V) 对 m = ±½，其余为零）；**Proposition 2.8 / 2.9 + 推论**, p.8446（p = 0 例外情形，Theorem 1.12 不适用；格 L 为偶整格时 H^{±½}_∞(ℒ, 𝖟; V(R^{25,1}, L)) ≅ P(R^{25,1}, L)）；**Theorem 2.7 之后两句**（p.8445）逐字 'Theorem 2.7 implies that the cohomology groups are trivial except for a one-dimensional H^0_∞ in the positive-definite case, but H^0_∞ can be arbitrarily large in the indefinite case. It turns out that in the case of signature (25, 1) we can explicitly construct representatives of the cohomology classes using the second part of Proposition 2.6. And this is the case of the most interest in physics.'"
    note: |
      L1（§1.4、§9.5）。本条是"本命题不断言 (d)(e)(g)"与 (a) 的补注的来源：
      绝对复形、p = 0、横向空间的构造都被 FGZ 单独处理，**不在** Theorem 2.7(i) 的范围里。
      ⚠ 玻色侧 p = 0 的具体形态本图只核到"例外情形 + 偶整格时的同构"这一层，
      **不如**超弦侧 LZ Proposition 5.5 的逐字反例陈述精确。
tags: [bosonic-string, brst, cohomology, vanishing-theorem, semi-infinite-cohomology]
notes: |
  ★★【本卡为什么新建（curator，2026-09-11）】
  FGZ Theorem 2.7(i) 此前只以 **source** 的形式出现在 worldsheet.no-ghost-theorem-brst--via-fgz
  的 sources 里（"本节点断言 (1)「上同调集中在单一鬼数」的严格来源"），图上没有节点。
  三条理由，与超弦版 worldsheet.superstring-relative-cohomology-vanishing-v2 的立卡理由同型：
    (1) **消灭定理与无鬼定理是两条不同的命题**：前者纯上同调（哪些次数为零），后者是正定性 +
        与横向空间的等距同构。FGZ 自己就把它们分成 Theorem 2.7 与 Theorem 2.8 两条编号结果；
    (2) 它是本图"BRST 无鬼"分支里唯一一条**只讲消灭**的上游，立卡后
        worldsheet.no-ghost-theorem-brst--via-fgz 可以非 inferred 地指它；
    (3) **超弦版已立卡而玻色版没有**，这个记账缺口在超弦卡的 notes 里被显式记下并"列入报告
        交 lead"。本卡关闭它。

  【与超弦版 worldsheet.superstring-relative-cohomology-vanishing-v2 的对应与差别】
  对应：LZ 1989 Theorem 2.4 ↔ FGZ 1986 Theorem 2.7(i)。LZ 在 Theorem 2.4 紧随句逐字自述
  'This is the analogue of the vanishing theorem proven by FGZ.'
  **三处实质差别**（不是排版差别，跨卡搬运论证时必须注意）：
    (a) **厄米形式**：FGZ 的路线经 Theorem 1.12，其假设含"V 带**非退化**厄米形式"；
        LZ 的路线（有限过滤 + 长正合列 + Poincaré 对偶）**完全不用**厄米形式
        （auditor 2026-09-11 逐条核对）。
    (b) **扇区与零模**：本卡只有一个扇区、无 βγ 零模表示的选择问题；超弦版的断言 (2) 必须写成
        **存在量词**（R 扇区零模表示不唯一且不等价）。
    (c) **p = 0 的反面**：超弦版有 LZ Proposition 5.5 的逐字失效机制（V(p,κ) 不是 Vir_κ^- 自由）；
        玻色版本图只核到 FGZ Proposition 2.8 / 2.9 的"例外情形"。
  **一处相同的陷阱**：两卡的次数都**不是鬼数**（见各自 (H4)/(H5)）。
  ⇒ 两卡互不依赖，各自挂各自的推导。

  【(ℒ, ℒ₀) 与 {b₀ = L₀ = 0} 的字典】
  本卡 (H5)(f) 已声明：FGZ 的相对复形是"相对于子代数 ℒ₀"，本图的相对复形是
  worldsheet.brst-preserves-relative-complex 的 {b₀Ψ = 0, L₀Ψ = 0}。物理文献与数学文献公认
  这是同一对象的两种写法（LZ Definition 2.2 在超弦侧把两者显式对上：B^r = Ker b₀、
  F^n = B^{n−κ} ∩ Ker K），但 **FGZ 本文没有写出这个字典**，故本卡不断言逐字同一，
  推导里也记了这条 gap。

  【Proposition 2.4 的歧义——留给 reviewer / 下一轮 researcher】
  FGZ 把 **Proposition 2.4** 列为 Theorem 2.7 的四条输入之一（§9.3 逐字），但抽取记录 §1.4
  对 Prop 2.4 的一句话转述（"dim H^m_∞(ℒ, ℒ₀; V) = 0 for m ≠ 0；m = 0 时等于 Eq. [2.3] 中
  1 的系数"）与 Theorem 2.7 的结论形式上几乎重复。既然它是**输入**，它必定对 V 另有假设
  （本图未核到；合理猜测是对 Verma 型或可约性受限的 V，Thm 2.7 才是 Fock 模 V(E,p) 的版本）。
  ⇒ 本卡不据 Prop 2.4 断言任何事，也不为它建卡；关闭这条歧义需回 p.8445 逐字读它的假设。
