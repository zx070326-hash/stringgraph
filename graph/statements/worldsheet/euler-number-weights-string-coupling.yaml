id: worldsheet.euler-number-weights-string-coupling
kind: proposition
title: Euler 数项 λχ 给出拓扑展开的耦合常数：闭弦 g_c ∼ e^λ、开弦 g_o ∼ e^{λ/2}
statement: |
  在世界面作用量中可以加一项正比于 Euler 数的项
    S_χ = λ χ,   χ = (1/(4π)) ∫_M d²σ g^{1/2} R + (1/(2π)) ∫_{∂M} ds k,
  λ 为实常数。该项与 diff × Weyl 规范对称性相容（χ 是 Weyl 不变量，
  worldsheet.euler-number-weyl-invariance）且在二维不带来新的动力学（χ 只依赖拓扑），
  因此它在弦微扰展开（worldsheet.worldsheet-sum-over-topologies）中的作用只是给
  每个世界面拓扑一个常数权重 e^{−λ χ}。

  这个权重就是**拓扑展开的耦合常数展开**：
  (i) 闭弦。可定向无边亏格 g 曲面有 χ = 2 − 2g，故拓扑权重
        e^{−λχ} = e^{λ(2g−2)}.
      若约定「每个闭弦顶点算子配一个因子 g_c」，则球面（g = 0）上 n 点树级振幅
      应正比于 g_c^{n−2}，而按上式它正比于 g_c^{n} e^{−2λ}；两者一致要求
        g_c ∼ e^{λ},
      于是亏格展开的权重是 g_c^{2g−2} = g_c^{−χ}：每加一个把手多一个因子 g_c²。
  (ii) 开弦。圆盘有 χ = 1，拓扑权重 e^{−λ}；同样约定「每个开弦顶点算子配一个因子 g_o」，
      圆盘上 n 点树级振幅应正比于 g_o^{n−2}，而按上式它正比于 g_o^{n} e^{−λ}，
      两者一致要求 g_o² ∼ e^{λ}，即
        g_o ∼ e^{λ/2},   故   g_o² ∼ g_c.

  **边界（本卡不断言的东西）**：
  ⚠ 这是**弦耦合常数的定义**，不是动力学结论：λ 是 worldsheet.worldsheet-sum-over-topologies
     定义里的自由参数，上式只是给「弦耦合常数」这个名字下的量赋值，没有任何东西被计算出来。
  ⚠ 用「∼」而不是「=」是照原书：比例常数依赖顶点算子的归一化，本图不固定它，
     也不断言常见写法 g_s = e^λ 中的等号。
  ⚠ 本卡不断言 λ（因而 g_c、g_o）由 dilaton 期望值决定——那是后文（§3.7）的内容。
  ⚠ 本卡不断言拓扑求和的收敛性；作为「展开」它是形式的（渐近）级数。
