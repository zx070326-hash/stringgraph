tags: [bosonic-string, quantization, old-covariant, critical-dimension, intercept, spectrum, formalized]
notes: |
  【为什么新建这张卡（拆卡）】worldsheet.ocq-level-two-scalar-norm 把四件事写在一张卡上：
  (1) 三维标量子空间中物理态解空间一维、(2) 模的闭式、(3a) a = 1 处的 (D−1)(26−D)、
  (3b)(3c) 判别式分类。LevelTwo.lean 机器验证的**只有 (2) 与 (3a)**（外加任意系数下的模、
  Virasoro 条件、域上的非空性），(1) 与 (3b)(3c) 未做。若把整张原卡升为 formalized，
  就等于把未形式化的一维性与判别式分类也一并宣称为机器验证——那是虚报。
  故按 formalizer 建议、lead 同意，拆出本卡只承载已机器验证的那部分。
  原卡 worldsheet.ocq-level-two-scalar-norm **保持 rigorous 不变**（其推导
  --via-level-two-gram 已由 reviewer-ch4 于 2026-09-11 独立复核），并新增一条对本卡的依赖。
  查重：`uv run stringgraph search level-two / 闭式 / negative-norm` 于 2026-09-11 只找到原卡，
  无承载「清分母闭式 + 机器验证」的既有节点。

  【第三次独立核算】本卡的闭式与原卡逐字一致，而两者的计算路径完全独立：
    1. auditor（2026-09-10，ms.no-ghost-theorem 第一轮审计 B1）：精确有理数 Gram 矩阵；
    2. curator（2026-09-11）：符号代数重算，补出正因子 2/(4a − 9)²；
    3. Lean（本卡，LevelTwo.lean）：在**任意交换 ℚ-代数**上从 `Fock.pairing` 的定义
       逐步展开，`linear_combination` 收尾。
  三次都得到 2(D−1)[16a² + (2D−74)a + 84 − 3D]，且 Gram 矩阵逐项吻合
  （⟨A,A⟩ = 2D、⟨A,B⟩ = 2s、⟨B,B⟩ = 2s²、⟨C,C⟩ = 2s、⟨A,C⟩ = ⟨B,C⟩ = 0，
  其中 A = α_{−1}·α_{−1}|k⟩、B = (α_0·α_{−1})²|k⟩、C = (α_0·α_{−2})|k⟩）。
  Lean 的 (V1)(V2) 与原卡的两条物理条件是同一对方程（原卡写 1 + s c₃ + c₂ = 0 与
  D + s c₃ + 2s c₂ = 0，(V1) 是前者的 2 倍，(V2) 逐项相同）。

  【与原卡的记号对应】原卡记 K := α_0·α_0，本卡记 s（Lean 里是 `Fock.zeroModeSq η a`）；
  原卡的 c_2、c_3 与本卡、Lean 的 c₂、c₃ 一一对应（c₂ 配 α_0·α_{−2}，c₃ 配 (α_0·α_{−1})²），
  且 c₂ = (1 − D)/(4a − 9) 与本卡的 −(D − 1)/(4a − 9) 相同、
  c₃ = (D − 4a + 8)/(2(4a − 9)(a − 2)) 与本卡的 (D − 4a + 8)/((2a − 4)(4a − 9)) 相同。
  原卡把闭式写成 ⟨ψ₂,ψ₂⟩ = (D−1)[…]·2/(4a−9)²（要求 4a ≠ 9 才能除），
  本卡按 Lean 写成清分母形式，故在任意 ℚ-代数上成立、不需要 4a ≠ 9。

  【(5) 中「唯一」这一步的地位】(3) 的两个等式是 Lean 定理
  （`four_mul_sub_nine_mul_coeff_two` / `_three`）；由它们在 4a − 9 ≠ 0、s ≠ 0 时**作除法**
  得到 c₂、c₃ 的唯一值，这一步在 Lean 中没有单列为定理
  （`exists_levelTwoScalar_mem_physSubmodule` 只证**存在**：把解代回去验证）。
  这是一行域上除法，登记于此以免被读成「唯一性已机器验证」。

  【Lean 记号换算】Lean 里截距叫 `a₀ : R`（因为 `a : Fin D → R` 已被零模参数占用），
  本卡沿用图中的记号：截距写 a、零模写 α_0。质量壳在 Lean 里写作
  `invTwo R * zeroModeSq η a + 2 = a₀`（第 (2) 条的形式）或
  `zeroModeSq η a = 2 * a₀ - 4`（第 (3)(4) 条的形式），两者在 ℚ-代数上等价。
