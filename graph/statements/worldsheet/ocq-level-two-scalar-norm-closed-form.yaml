id: worldsheet.ocq-level-two-scalar-norm-closed-form
kind: proposition
title: 第二能级标量试探态的模的清分母闭式 (4a−9)²⟨ψ₂,ψ₂⟩ = 2(D−1)[16a² + (2D−74)a + 84 − 3D]（任意交换 ℚ-代数）
statement: |
  固定 D ∈ ℕ、交换 ℚ-代数 R、对角度规分量 η : {0,…,D−1} → R **满足 η^{μμ} η_{μμ} = 1**
  （conv.metric-mostly-plus 的 diag(−1,+1,…,+1) 满足之）、零模参数
  a^μ = α^μ_0 = (2α')^{1/2} k^μ（conv.alpha-prime-regge，固定动量扇区），
  以及截距 a ∈ R（conv.intercept-sign-a，物理态条件写作 (L_0 − a)|ψ⟩ = 0；Polchinski 的 A = −a）。

  设 F = F(D,R)、level 分级 F_N 如 worldsheet.bosonic-fock-space，
  L_n 如 worldsheet.virasoro-generators-free-boson，
  ⟨·,·⟩ 如 worldsheet.fock-indefinite-form（R-双线性型，由 ⟨|k⟩,|k⟩⟩ = 1 与
  (α^μ_n)^† = α^μ_{−n} 唯一确定），H_phys 如 worldsheet.old-covariant-physical-states。
  记 s := α_0·α_0 = Σ_μ η^{μμ} a^μ a^μ = 2α' k²。

  对系数 c₂, c₃ ∈ R 定义**第二能级标量试探态**（α_{−1}·α_{−1} 的系数归一化为 1）
    ψ₂(c₂,c₃) := [ α_{−1}·α_{−1} + c₂ (α_0·α_{−2}) + c₃ (α_0·α_{−1})² ] |k⟩ ∈ F_2,
  其中 α_{−1}·α_{−1} = Σ_μ η^{μμ} α^μ_{−1} α^μ_{−1}，α_0·α_{−n} = Σ_μ η^{μμ} a^μ α^μ_{−n}。

  **(1) 任意系数下的模**（不使用任何物理态条件）：
      ⟨ψ₂, ψ₂⟩ = 2D + 2 s c₂² + 2 s² c₃² + 4 s c₃。

  **(2) Virasoro 条件与物理态判据**：
      L_1 ψ₂ = (2 + 2c₂ + 2c₃ s) · (α_0·α_{−1})|k⟩,
      L_2 ψ₂ = (D + 2c₂ s + c₃ s) · |k⟩,
      L_n ψ₂ = 0  (n ≥ 3，因 ψ₂ ∈ F_2 自动成立)。
    于是质量壳 ½ s + 2 = a（即 α' k² + 2 = a）连同
      (V1) 2 + 2c₂ + 2c₃ s = 0    与    (V2) D + 2c₂ s + c₃ s = 0
    蕴含 ψ₂(c₂,c₃) ∈ H_phys。

  **(3) 系数被钉死（清分母形式）**：在质量壳 s = 2a − 4 下，(V1) 与 (V2) 蕴含
      (4a − 9) c₂ = −(D − 1),        (4a − 9) · s · c₃ = D − 4a + 8。

  **(4) 清分母闭式**：在同样的前提（s = 2a − 4、(V1)、(V2)）下，对**任意**交换 ℚ-代数 R
    与任意满足这些条件的 c₂, c₃ ∈ R：
      (4a − 9)² ⟨ψ₂, ψ₂⟩ = 2 (D − 1) [ 16a² + (2D − 74) a + 84 − 3D ]。
    **本条不需要 4a ≠ 9、不需要 s ≠ 0、不需要 R 是域**：分母已清，这是环上的恒等式。
    方括号内的二次式关于 a 的判别式为 4(D − 1)(D − 25)。

  **(5) 非空性（域上）**：设 R = K 是含 ℚ 的域，4a − 9 ≠ 0 且 s ≠ 0（即 k² ≠ 0，等价于 a ≠ 2）。
    取
      c₂ = −(D − 1)/(4a − 9),      c₃ = (D − 4a + 8)/((2a − 4)(4a − 9)),
    则 (V1)(V2) 成立、ψ₂(c₂,c₃) ∈ H_phys，且第 (4) 条的闭式对它成立。故 (4) 不是空真。
    （由 (3) 的两式在 4a − 9 ≠ 0、s ≠ 0 时作除法即得这组解**唯一**；除法这一步见 notes。）

  **(6) a = 1 的特化**：设 K 是有序域，s = −2（即 α' k² = −1，正是 a = 1 处 level 2 的质量壳），
    c₂ = (D − 1)/5、c₃ = (D + 4)/10（即 (5) 在 a = 1 处的解）。则
      ψ₂(c₂,c₃) ∈ H_phys（截距 a = 1）    且    ⟨ψ₂, ψ₂⟩ = −2 (D − 26)(D − 1)/25。

  【本命题**不**断言什么】
  (a) **不**断言 ψ₂ 张成 level 2 物理态的标量（小群不变）部分，也**不**断言在该三维子空间中
      物理态条件的解空间一维。本命题是关于这一族**显式试探态**的陈述，不是关于某个典范向量的
      陈述。一维性是 worldsheet.ocq-level-two-scalar-norm 第 (1) 条的内容，**未形式化**。
  (b) **不**做判别式的分类讨论（D ≤ 24 无实根 / D = 25 二重根 a = 3/4 / D ≥ 26 两相异实根，
      以及 D = 26 时 2(8a−3)(a−1) 在 3/8 < a < 1 上为负）：那是
      worldsheet.ocq-level-two-scalar-norm 第 (3b)(3c) 条，**未形式化**。
  (c) **不**断言 D ≤ 26 时模非负——那是无鬼定理本身（worldsheet.no-ghost-theorem-v4 第 (1) 条）。
  (d) 与整个无鬼定理形式化岛一样：**逐动量扇区**（k 只以标量参数 a^μ 出现，无位置算符 x^μ、
      无对 k 的直积分）、**代数版**（无完化）、**对角 η**、**R-双线性型而非 Hermitian 半双线性型**。
