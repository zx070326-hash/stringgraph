sources:
  - ref: polchinski-1998-v2
    loc: "§10.6 末, eq. (10.6.19), p. 31（type I 的无质量内容）；逐字结论句：'Thus we have found precisely three tachyon-free and nonanomalous string theories in this chapter: type IIA, type IIB, and type I SO(32).'；论证 (a)(b)(c) 的逐字见 statement 与 note"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E46；式号与逐字措辞逐页读到原书页图）。
      ★ **原文的限定词是 'in this chapter'**——本命题的条件形式正是照此写的。
      (a) 的逐字：'The open string multiplets, with 16 states, are representations of d = 10,
      N = 1 supersymmetry but not of N = 2 supersymmetry. Thus the open superstring cannot
      couple to the oriented closed superstring theories, which have two gravitinos.'
      (c) 的逐字：'There is a further inconsistency in all but the SO(32) theory. We will see in
      section 10.8 that for all other groups, as well as the purely closed unoriented theory,
      there is a one-loop divergence and superconformal anomaly. We will also see, in chapter 12,
      that the spacetime gauge and coordinate symmetries have an anomaly at one loop for all but
      the SO(32) theory.'
  - ref: polchinski-1998-v2
    loc: "§10.6 脚注 5, p. 31（逐字：'At the world-sheet level the problem is that the total derivative null gravitino vertex operators give rise to nonzero world-sheet boundary terms. Only one linear combination of the two null gravitinos decouples, so we must make the world-sheet parity projection in order to eliminate the other.'）"
    note: |
      L1（E46）。这是 (a) 的世界面级理由，本图无对应节点（涉及零引力微子顶点算子的边界项）。
  - ref: polchinski-1998-v2
    loc: "§11.1 末, pp. 48–49（作者对分类完备性的警告，逐字见 notes）"
    note: |
      L1（抽取记录 E53）。★★★ **这是全两卷里对「弦论分类完备」这条常见断言最直接的作者级限定**，
      抽取记录要求：若图里有「十维一致弦论恰有 N 个」这类节点，**必须**引用本条，
      且 status 只能是 conjecture 或 physical-argument。本卡据此写成条件形式并在 notes 记张力。
tags: [superstring, type-i, type-ii, so32, classification, consistency]
notes: |
  ★★★【与作者自己的警告的张力（E46 vs E53），本卡存在的主要理由】
  §10.6 末的结论句用了限定词 'in this chapter'：
    'Thus we have found precisely three tachyon-free and nonanomalous string theories
     **in this chapter**: type IIA, type IIB, and type I SO(32).'
  而 §11.1 末（p. 48–49）作者对分类完备性给出明确警告（逐字）：
    '**It should be emphasized that the analysis in this section had many explicit and implicit
     assumptions, and one should be cautious in assuming that all string theories have been
     found.** Indeed, there are some string theories that do not fall into this classification.
     One is the Green–Schwarz form of the superstring, which has no simple covariant
     gauge-fixing … Another exception is topological string theory, where in a covariant gauge
     the constraints do not satisfy spin-statistics as we have assumed. …
     In fact, we will find the same set of physical string theories from an entirely different
     and nonperturbative point of view in chapter 14, **suggesting** that all have been found.
     To be precise, there are other theories with stringlike excitations, but the theories found
     in this and the previous chapter **seem to be** the only ones which have a limit where they
     become weakly coupled, so that string perturbation theory exists.'
  **本图的处理**：
    · 本卡的 statement 写成 (P1)–(P5) 下的条件式，并显式声明「不断言这是完备分类」；
    · 「三个」这个数只对第 10 章的构造成立；加上第 11 章的两个杂化弦才是通常说的「五个」，
      而即便那样，作者用的词也是 'suggesting' 与 'seem to be'；
    · 任何下游若要断言「十维一致超弦恰有五个」，**必须**同时引用 §11.1 末这段警告，
      且 status 不得高于 physical-argument（抽取记录 E53 的要求）。

  【本卡未覆盖的第 (P5)】时空规范与坐标反常的抵消在第 12 章（本轮未读）。
  本图 consistency 区另有 Green–Schwarz 1984 一支（另一个 curator 的 claim），
  那是同一物理内容的原始文献路线。**两者尚未接边**；接边前不要把本卡的 (P5) 当作已支撑。

  【与 duality/M 理论的关系】§11.1 末提到第 14 章会从非微扰角度重新得到同一组理论。
  本图 duality 区暂无对应节点。
