id: worldsheet.ten-dimensional-superstring-theories
kind: proposition
title: 第 10 章的结论（条件形式）：在该章所列的构造与一致性条件下，无快子且无反常的十维弦论恰有三个——IIA、IIB、type I SO(32)
statement: |
  **⚠ 本命题必须写成条件形式，理由见【条件与限定】与 notes 的【与作者自己的警告的张力】。**

  **前提（本命题的适用范围）**：
    (P1) 世界面构造限于第 10 章的 (1,1) 超共形约束代数（RNS 形式，worldsheet.rns-action），
         物质部门取十个平坦 X^μψ^μ SCFT；
    (P2) 扇区组合满足 worldsheet.superstring-sector-consistency-conditions 的三条条件
         （相互局域性、OPE 闭合、至少一个左移与一个右移 R 扇区）与能级匹配；
    (P3) 开弦扇区与闭弦扇区的耦合满足 OPE 闭合
         （worldsheet.type-i-open-string-gauge-multiplet）；
    (P4) 要求单圈 NS–NS 与 R–R tadpole **各自**在拓扑求和后为零
         （worldsheet.type-i-tadpole-cancellation-so32）；
    (P5) 要求时空规范与坐标对称性在单圈无反常（**原书把这一条推给第 12 章，本图无节点**）。

  **结论**：在 (P1)–(P5) 下，无快子且无反常的十维弦论恰有三个：
    **type IIA、type IIB、type I SO(32)**，
  其中 type I 的无质量内容为
    [0] + [2] + (2) + 8′ + 56 + (8_v + 8)_{SO(n) 或 Sp(k)}，n = 32 且取正交投影。

  **通往该结论的三步**（原书的论证链）：
    (a) 开弦的无质量多重态（16 个态）是 d = 10, N = 1 超对称的表示，**不是** N = 2 的表示，
        故开超弦**不能**耦合到有两个引力微子的取向闭超弦（IIA/IIB）；
        它只能耦合到无取向的闭弦理论 (10.6.18)，因此开弦本身也必须是无取向的。
    (b) 由 (10.6.18) 的手征性，开弦无质量态必须是 8_v + 8。
    (c) 除 SO(32) 外，其余规范群（以及纯闭弦无取向理论）都有单圈发散与超共形反常（§10.8），
        且时空规范/坐标对称性有单圈反常（第 12 章）。

  **本命题不断言的内容**：
    (1) **不**断言这是「所有十维弦论」的完备分类——见 notes 的【与作者自己的警告的张力】；
    (2) 不断言杂化弦不存在（杂化弦在第 11 章，本轮不入图；它们同样是十维、无快子、无反常的，
        但不在第 10 章的构造范围内）；
    (3) 不断言 (P5) 的内容（第 12 章，本图无节点）。
