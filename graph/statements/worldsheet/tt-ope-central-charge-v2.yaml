id: worldsheet.tt-ope-central-charge-v2
kind: definition
status: rigorous
title: 中心荷 c 的定义：TT 算子乘积展开四阶极点的系数（v2：纯定义，极点结构的确定性拆出）
statement: |
  设 T(z) 是二维共形场论的全纯能动张量，并设其与自身的算子乘积展开取如下形式
    T(z) T(0) ∼ c/(2 z^4) + (2/z^2) T(0) + (1/z) ∂T(0),
  其中 c 是一个常数。则称 c 为该理论的**中心荷**（反全纯部门同理给出 c̄）。
  换言之，c 是 T(z)T(0) 展开中 z^{-4} 项系数的两倍；本卡是「中心荷」在本图中的定义点。

  **本卡只定义，不断言。** 上式右端的形状——二阶极点的系数为 2、一阶极点为 ∂T、
  无三阶极点、无高于四阶的极点、四阶极点是不含算子的 c-数——在本卡中是**被假定的形式**，
  不是被论证的结论。「这一形状由共形不变性完全确定、唯一自由参数就是 c」是一条独立的命题，
  见 worldsheet.tt-ope-pole-structure-from-conformal-invariance。

  归一化：本式与 conv.virasoro-standard 相容，即由此定义的 c 与 Virasoro 代数
  [L_m, L_n] = (m-n)L_{m+n} + (c/12) m(m^2-1) δ_{m+n,0} 中的 c 是同一个数，
  从而单个自由玻色子给 c = 1。
uses:
  - worldsheet.traceless-holomorphic-energy-momentum
  - worldsheet.operator-product-expansion
uses_conventions:
  - conv.worldsheet-complex-coords
