id: worldsheet.ddf-spanning-transverse-frame
kind: proposition
title: DDF 张成定理的**带标架前件**版本：在 (F1)(N)(S)(A)(T)(O) 的任意横向标架上、D = 26 时 H_phys = D(Ε) ⊕ H_null——**不要求 η(ε_i, a) = 0**，且给出直和而非仅包含；本项目原创证明
statement: |
  【设定】记号逐字沿用 worldsheet.momentum-tower-fock-space、worldsheet.ddf-operators-v6、
  worldsheet.ddf-operators-preserve-physical-states 与 worldsheet.tower-physical-quotient-form，
  与 worldsheet.ddf-spanning-hypothesis-v2 的【设定】同一套：
  系数环 R 是交换 Q-代数；对角度规分量 η_μ（conv.metric-mostly-plus）；η(x,y) = Σ_μ η_μ x^μ y^μ；
  基点动量 k 与类光参考向量 k_0，重标度 a^μ := (2α')^{1/2} k^μ、b^μ := (2α')^{1/2} k_0^μ
  （conv.alpha-prime-regge）；动量塔 T(k;k_0) = ⊕_{j∈Z} F(k + j k_0)，其上有层间正交的
  R-双线性型 ⟨·,·⟩_T；L_m 是逐层 Sugawara 生成元，不移动层指标。
  三个子空间 H_phys、D(Ε)、H_null 的定义**逐字**取 worldsheet.ddf-spanning-hypothesis-v2
  的【三个子空间】一节（截距 a₀ := α' k² = ½η(a,a)，**不是自由参数**）。

  【前件（本卡与 worldsheet.ddf-spanning-hypothesis-v2 的差别全在这里）】
  设 D = 26，且 (a, b, ε_1, …, ε_{D−2}) 满足下列六条：

      (F1) η_μ² = 1（∀μ）                     —— 与 v2 的设定相同；
      (N)  η(b, b) = 0                        —— 与 v2 相同（k_0 类光）；
      (S)  **η(a, b) = 1**（即 2α' k_0·k = 1） —— **v2 卡面没有这一条**；
      (A)  **η(a, a) = 2**（即 α' k² = 1，截距 a₀ = 1） —— 见下面第 2 点；
      (T)  η(ε_i, b) = 0（∀i）                —— 与 v2 相同（横向性）；
      (O)  η(ε_i, ε_j) = δ_{ij}               —— 与 v2 相同（正交归一）。

  1. ⭐ **本卡对 c_i := η(ε_i, a) 不作任何要求**，`c = (c_1,…,c_{D−2}) ∈ R^{D−2}` **任意**。
     即本卡**不含** (T′) η(ε_i,a) = 0，量化在**一切**满足 (T)(O) 的横向标架上，
     与 v2 的量化范围在这一轴上**相同**（也与 Lean 的 `structure TransverseFrame` 相同——
     它只有 `vec` / `transverse` / `orthonormal` 三个字段，没有 (T′)）。
  2. (A) 与 (S) 合起来给出 v2 的前件：η(v,v) = η(a,a) − 2η(a,b) + η(b,b) = 2 − 2 + 0 = 0，
     `v := a − b`。故在 (N)(S) 下 (A) ⟺ v2 的 η(v,v) = 0 ⟺ 截距 a₀ = 1。
  3. **完备性 (C)**（{a, b, ε_1,…,ε_{D−2}} 是 𝔥 的 R-基）**不是本卡的前件**：它是
     (F1)(N)(S)(T)(O) 的**推论**，对任意交换环成立、且不需要 (T′)——在有序基
     (a, b, ε_1,…,ε_{D−2}) 下 Gram 阵的第二行是 (1,0,…,0)（用 (S)(N)(T)，`c` 不出现在该行），
     沿该行展开得 det G = −1，配 (F1) 使 det η 是单位，故过渡矩阵行列式是单位。
  4. 系数环只要求是交换 Q-代数：**不要求是域、不要求 R 约化、不要求 η(a,a) − |c|² 可逆**
     （该量只作为标量系数出现，从不做分母）。`Q ⊆ R` 用在 u(n) = n∂_{u(−n)}、L_m 的 ½、
     以及若干处除以非零整数。

  【断言（本卡的全部内容）】

      在上述前件下，  **H_phys  =  D(Ε)  ⊕  H_null**  （内直和）。

  即塔上的每个物理态唯一地写成「一个 DDF 态加一个零态」，且 **D(Ε) ∩ H_null = 0**。
  特别地本卡蕴含 v2 的断言 H_phys ⊆ D(Ε) + H_null（在本卡这组更强的前件下）。

  【本卡明确不断言】
  (a) ⛔ **不断言 worldsheet.ddf-spanning-hypothesis-v2。** v2 的【设定】**没有** (S)，
      故 v2 是一条真正更宽的命题，本卡**不蕴含它**、也**不取代它**。
      而且 (S) 是**不可删**且**不可弱化**的：把 (S) 换成 η(a,b) = s 后，零极化 DDF 算子变成
          A^b_n = (η(a,b) − 1)·S_n·V^{(n)}_{−n}      （n ≠ 0），
      障碍恰是标量 s − 1，**s = 2 一样坏**（所以不能弱化成「η(a,b) 可逆」）；
      也不能靠重标度 b → s^{−1}b 绕开，因为那会把动量塔 ⊕_j F(a + jb) 换成另一个塔，
      命题的对象就变了。故 v2 仍然开着，且本卡对它一言未发。
  (b) **不断言 D ≠ 26 时的等号。** D ≠ 26 时只有 ⊇ 方向成立（⊆ 失效）。
      与 v2 的边界 (c) 不同：v2 刻意不为任何 D 断言，本卡**只在 D = 26 上**断言。
  (c) **不断言任何 Lean 内容。** 本卡未形式化（见 notes 的两条 [GAP-LEAN]），
      **不得据本卡说「机器验证」**。
  (d) **不断言本项目的模态和 A^ε_n 与文献的留数式 A^i_n 是同一算子。**
      那条识别是 worldsheet.ddf-contour-equals-mode-sum（physical-argument），
      **不在本卡的证明链上**，但它是本项目表述与文献表述之间的唯一的桥。
      故本卡断言的是**本项目模态和表述下**的张成定理。
  (e) **不断言 (F8)（worldsheet.ddf-light-cone-frame 的完备性条件）。** (C) ≠ (F8)：
      本卡第 3 点的 (C) 是「构成基」，(F8) 是「v^⊥ 里的向量可分解」，两者不同；
      且「(F8) 对一切 (T)(O) 标架成立」是**假的**（见 notes）。
