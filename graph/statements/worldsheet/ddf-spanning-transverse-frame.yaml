tags: [bosonic-string, no-ghost, ddf-spans, spectrum-generating-algebra, original-proof, frame]
notes: |
  【本卡是什么、为什么不是 v2 的换代】
  本卡是 research/attempts/tower-native-ddf-spanning 的毕业产物。它与
  worldsheet.ddf-spanning-hypothesis-v2 **不是换代关系**：v2 的卡面没有 (S)，是一条
  真正更宽、且**至今未证**的命题；本卡只证了带 (S) 的版本。
  **故 v2 不标 `superseded_by`、不就地改卡面、继续留在图上。** 把 v2 标成被取代等于
  假装证了更宽的东西（reviewer `rev-no-tprime` 2026-09-25 裁定的第一条必要条件）。

  【证明梗概（细节在 sources 指向的两份文件）】
  不走 Borcherds 1992 Thm 5.1 的路线（那条路要先知道未知的横向空间 T），而是**塔内原生**：
  · 取 W_j := ker(K_m)_{m≥1}（K_n := b·α_n 是纵向算子），由 K_n = n∂_{Λ_{−n}} 得
    W_j = R[K_{−n}, E^i_{−n}]，这是**可写下来的**空间，不需要事先知道 T。
  · Theorem 1：μ : U(Vir_{<0}) ⊗_R W_j → F(p_j) 是同构。承重论证是
    **(Λ-次数, −K-次数) 字典序滤过下的领项三角性**：按权降序排两组基，矩阵分块下三角、
    对角块是系数全为 1 的置换矩阵，那个 1 来自 K_0 = η(b,a) + j·η(b,b) = 1 + 0 = 1，
    **精确的单位元、不经任何除法**，故 det = ±1 在**任意交换环**上是单位。
    （这一点是本证明能脱离「域」的关键：旧路线要走「单射 ⟹ 满射」，那在一般交换环上是假的。）
  · Theorem 2：T¹ = D(Ε)，秩 p_{D−2}(N)。Theorem 3：D = 26 时 H_phys = D(Ε) ⊕ H_null。
  · **(T′) 的消除（本轮新内容）**：
      引理 A（标架平移）ε_i′ := ε_i − c_i b 恢复 (T′)——η(ε_i′,a) = c_i − c_i·η(b,a) = 0 用 (S)，
        η(ε_i′,b) = −c_i η(b,b) = 0 用 (N)，(O) 与 (C) 保住，a、b、η(a,a) 不动；
      引理 B（零极化 DDF 算子恒为零）**A^b_n = 0 对一切 n ≠ 0**，而 A^b_0 = id。
        物理上 (b·∂X)e^{inb·X} 是全导数（η(b,b) = 0 使顶点算子权为零），非零模积分为零。
      A^ε_n 对 ε 线性 + ε_i′ − ε_i ∈ Rb + D(Ε) 的定义只用 n_k ≥ 1 ≠ 0
        ⟹ **D(Ε′) = D(Ε) 逐元相同**（不只是张成相同）⟹ 原三条定理逐字适用。
    **一句话：(T′) 不是限制，是规范选择。**
    ⚠ **关键边界**：n = 0 时 A^b_0 = id ≠ 0，推论 B.1 在 n = 0 上**是假的**；
      D(Ε) 的定义只跑 n_k ≥ 1 才使这一点无害。

  【两条独立路线 + 一次跨 agent 独立收敛】
  · `proof-no-tprime.md` §4 走引理 A/B（把问题化归到已判 verified 的结论）；
    §5 走「差量审计」：不用引理 A/B，把 c ≠ 0 一路带着走重做全部引理，得同一组结论。
    ⚠ 两者的独立性**只限于「删 (T′) 是否安全」这一问**；两条路线都以 `proof.md` §1–§3 的
    骨架为共同基础，**不构成对 `proof.md` 本身的独立复核**。
  · 另一个 agent 在隔离 worktree 里、任务完全是别的事（标架存在性）、不通信、写入路径不相交，
    **独立收敛到同一机制且证法不同**（走塔指标↔洛朗指标位移 + 电流权恒等式砖块，
    不走全导数围道积分）：research/attempts/lorentzian-lightcone-frame-existence §7。
    两条路线定量吻合到同一个系数 η(b,a) − 1。**这是佐证不是判决。**

  【机器检验（旁证，不是证明）】
  `research/attempts/tower-native-ddf-spanning/scripts/notprime_check.py`：10 族检查
  （[AB0][DUAL][FRAME][SHIFT][LEAD][T1][T2][LonW][DDFonW][MAIN]）、5 组 c ≠ 0 构形，
  精确有理算术，exit 0 零失败；`[T1]` 的 61 个测例**逐个验证 det = ±1**（不只是 Q 上满秩——
  后者对「在 Z 上是否可逆」完全盲，是 2026-09-25 审查抓出并修掉的一处 overstate）。
  ⚠ **机检只到 N ≤ 3，而三条定理都是 ∀N 的**；∀N 完全由手证承担（领项三角性的归纳），
  机检从未被当成证明步骤。

  【为什么 status 是 rigorous 而不是 formalized】
  两条形式化缺口都开着：Theorem 1/2/3 与 1′/2′/3′ 全未形式化（[GAP-LEAN]）；
  引理 B 未形式化（[GAP-B-LEAN]）。**不得据本卡对外说「机器验证」。**
  reviewer 建议：毕业后若做 Lean，把引理 B 的主证明改挂已 formalized 的
  worldsheet.exponential-vertex-operator-current-weight-identity（(CW)）路线，
  可把手验面积从「指数递推 + 收尾抵消」缩到「一次重标号 + 一个标量代入」。

  【(e) 提到的「(F8) 对一切 (T)(O) 标架成立是假的」】
  见 worldsheet.ddf-light-cone-frame 的【本卡明确不断言】(a)：D = 3 的整数见证里
  ε_1 = (0,0,1) 与其平移 ε′_1 = (−1,−1,1) 给出**完全相同的 DDF 算子**，但只有后者满足 (F8)。
  这与本卡不矛盾：本卡断言的是 DDF 张成（只涉及 A^ε_n、n ≠ 0），而 (F8) 是标架向量本身的
  线性代数命题——前者在标架平移下不变，后者不是。
