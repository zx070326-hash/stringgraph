notes: |
  【查重】2026-09-12 跑 `uv run stringgraph search "null-states-lower-bound"`、
  `search "type one"`、`search "typeOneMap"`，均无命中；本图此前没有承载
  「零态维数 D-无关下界」这一命题的节点（worldsheet.ocq-null-state-two-families
  承载的是"两族映射的像落在 H_null 内"这一存在性断言，不含维数下界）。

  【与 worldsheet.ocq-null-state-two-families 的分工，不 supersede】那张卡（physical-argument，
  全部⟨手算⟩）断言 Type 1/Type 2 两族映射的像落在 H_null 内，其证明机制的一部分
  （L_{-1} 送准物理态到零态）与本卡相同，但那张卡**不给出维数下界**（【明确不断言】(a)
  显式声明"不断言一般 N 的完备性/张成性"）；本卡是 Type 1 单族的维数下界，
  已 formalized，是那张卡机制 (1) 的一个更精确、更强（有具体数字）但范围更窄
  （只 Type 1，不含 Type 2）的独立命题。两卡并列，不合并、不 supersede
  （与该卡与 worldsheet.ddf-spans-physical-states-level-two 的既有分工模式一致）。

  【与 worldsheet.ddf-spanning-rank-inequality 的关系，本卡不为其挂依赖】(B-26) 那张卡
  刻意保持 open、无推导（立卡理由已声明）；本卡不作为其 depends_on（那样会给一张刻意
  留白的卡添加一条不足以关闭它的边，读者会误以为"部分进展"，而该卡的 notes 已经详细
  记录了这条 D≠26 部分下界与目标的精确缺口，此处不重复建边，只在该卡 notes 追加
  一段交叉引用（见下）。

  【PR6′ 落地小结（curator，分支 agent/curator/pr6-wire）】
  formal/StringFormal/NoGhost/TypeOneFamily.lean（约 1010 行，无 sorry）与
  SpuriousElimination.lean 新增的任意片 (j,M) 版本（约 130 行，第 9 节）一并落地，
  完成 worldsheet.ocq-null-state-two-families notes【2026-09-12（三）】(ii) 段裁决的
  推荐路线（"仅用 L_{-1} 单射性，D-无关"），产出本卡（Type 1 维数下界）与姊妹卡
  worldsheet.quasi-physical-slice-dimension（准物理子空间维数下界，本卡的直接输入）。
  §B‴.8 裁决的三角性路线（PR6，另一候选）未被实现，本卡对应的是那次裁决明确推荐的
  更便宜路线；三角性路线仍未开工，不受本次工作影响。
