sources:
  - ref: stringformal-2026
    loc: |
      formal/StringFormal/NoGhost/TypeOneFamily.lean ::
      StringFormal.NoGhost.le_finrank_towerNull_inf_towerBigrade_succ
      （本卡 formal.lean_decl，第 985 行起，section NullLowerBound 起于第 979 行）；
      铺垫 typeOneMap（第 942 行，定义）、typeOneMap_apply（第 952 行）、
      typeOneMap_injective（第 957 行，靠 towerLop_neg_one_injective 第 186 行）；
      "N−1" 形式的姊妹定理 le_finrank_towerNull_inf_towerBigrade（第 1003 行，
      本卡【明确不断言】(e) 提到的旧记法，等价、非本卡 lean_decl）。
      L_{-1} 单射本身：towerLop_neg_one_injective（第 186 行，section LopNegOneInjective
      起于第 140 行），靠 towerLop_neg_one_apply_kOp_one（第 148 行，K-代数三行关系）与
      towerLop_neg_one_apply_kOp_one_pow（第 161 行，K_1 幂降级公式）。
    note: |
      本仓库，无 sorry。**类型类核实**：`le_finrank_towerNull_inf_towerBigrade_succ` 所在
      `section NullLowerBound`（第 981 行起）声明
      `variable {D}{K}[Field K][CharZero K][Algebra ℚ K]{η a b:Fin D→K}`；
      定理本身前**没有** `omit` 标注，按完整签名记录。`towerLop_neg_one_injective` 所在
      `section LopNegOneInjective`（第 140 行起）只需 `[CommRing R][Algebra ℚ R]`
      （**不需要 `CharZero`、不需要域结构**——归纳排空只用"非零自然数在 ℚ-代数里可逆"，
      见 `RatTorsion` 节的 `eq_zero_of_natCast_smul_eq_zero`），本卡陈述里的 K 是域，
      是使用处（`le_finrank_towerSeed`/`finrank` 计数）加的更强要求，不是单射性本身所需。
      **curator 未自行运行 `lake build` / `#check` 逐条核实**（本 worktree 无构建缓存），
      结论基于直接读源码 `omit` 标注、`variable`/`section` 声明与调用链，未跑编译器验证。
      **证明结构**（docstring 自述）：`typeOneMap : Q_{-(N+1),N} → H_null ⊓ V_{N+1}`
      由 `L_{-1}` 限制而成（良定义靠 Type-1 后代的物理性判据，见
      worldsheet.ocq-null-state-two-families 断言 (1)(3) 的机制）；`typeOneMap_injective`
      归约到 `towerLop_neg_one_injective`（若 `L_{-1}u = L_{-1}v` 则 `L_{-1}(u-v)=0`，
      `u-v` 落在片 `(-(N+1),N)` 上，单射性给 `u=v`）；最后用
      `worldsheet.quasi-physical-slice-dimension` 的 `le_finrank_towerSeed` 给
      `dim Q_{-(N+1),N} ≥ p_{D−1}(N)`，配单射线性映射不减维数
      （`LinearMap.finrank_le_finrank_of_injective`）收尾。
      **D 不出现，intercept 只通过 `haa` 进入**：docstring 逐字"The intercept enters only
      through `haa : k·k = 2` (i.e. `a₀ = 1`), which is what makes `L_0` vanish on the
      seeds and hence `L_{-1}(seed)` physical; this is the one place PR6′ is not
      intercept-free"。
      **与 N=2 特例（LevelTwoCount.lean）的显式数值比对**（docstring 逐字引用）：
      `LevelTwoCount.le_finrank_towerNullSubmodule_inf_towerBigrade_two`（N+1=2 时）
      给出 D 而非 p_{D−1}(1) = D−1；差的那 1 恰是 Type-2 态 𝒟₂|0;p_{-2}⟩，
      与 §B‴.3 预测的缺口逐字一致——这是本卡【明确不断言】(a) 的具体印证。
