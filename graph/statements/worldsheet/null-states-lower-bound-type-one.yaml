id: worldsheet.null-states-lower-bound-type-one
kind: proposition
title: 动量塔上零态维数的 D-无关下界（Type 1，L_{-1} 单射）：dim(H_null ∩ V_{N+1}) ≥ p_{D−1}(N)，对一切 N（D≠26 时的真实答案，不关闭 (B-26)）
statement: |
  【设定】记号沿用 worldsheet.ddf-spanning-rank-inequality（同一张塔 T(k;k_0)、反对角片
  V_N := towerBigrade(−N, N)、H_null := H_null(a₀) ∩ V_N 记作 Z_N，H_null 逐字取自
  worldsheet.ddf-spanning-hypothesis）与 worldsheet.physical-slice-bounded-by-transverse-count
  的占据数记号 p_{D−1}(N)。另取 worldsheet.ddf-light-cone-frame 的标架对象
  F : DDFLightConeFrame η a b（D ≥ 2）与截距条件 (haa) a₀ = α'k² = 1
  （即 Fock.zeroModeSq η a = 2，等价于 worldsheet.ddf-spanning-hypothesis 里
  a₀ = 1 的取值）。取 worldsheet.quasi-physical-slice-dimension 的准物理子空间
  Q_{j,M} := towerBigrade(j,M) ∩ ⋂_{n≥1} ker L_n。

  【断言】设 hD : 2 ≤ D、haa : a₀ = 1。则对一切 N ∈ N：

      dim_K ( H_null ∩ towerBigrade(−(N+1), N+1) )  ≥  p_{D−1}(N) 。

  证明机制（Type 1）：L_{-1} 在片 towerBigrade(−(N+1), N) 上单射（K-代数事实
  ⁅L_{-1},K_1⁆ = −K_0、K_0 = 1，见 worldsheet.gt-longitudinal-k-algebra 断言 (1)(3)
  在 m=−1,n=1 处的取值，对种子上的向量沿 K_1 的幂降级归纳排空），把该片的准物理子空间
  Q_{−(N+1),N} 单射地送进 H_null ∩ towerBigrade(−(N+1),N+1)（Type 1 后代自动被 L_n
  (n≥2) 湮灭、被 L_1 湮灭当且仅当 a₀=1，且落在 H_spur ⊆ 判定 H_null 的充分条件里，
  这正是 worldsheet.ocq-null-state-two-families 断言 (1)(3) 在这里的具体实现）；
  再用 worldsheet.quasi-physical-slice-dimension 给 dim Q_{−(N+1),N} ≥ p_{D−1}(N)。

  【本卡明确不断言】
  (a) **不是 (B-26) 的解**：worldsheet.ddf-spanning-rank-inequality 要求的零态下界是
      dim Z_N ≥ p_{D−1}(N) − p_{D−2}(N)（相对于**同一个** N 的反对角片 V_N），本卡给出的是
      dim Z_{N+1} ≥ p_{D−1}(N)（换了一个指标记法，对齐见下）。改写成同一记法：本卡在
      N+1 处给出 dim Z_{N+1} ≥ p_{D−1}(N)，而目标需要 dim Z_{N+1} ≥ p_{D−1}(N+1) −
      p_{D−2}(N+1)。**这两者一般不相等**——p_{D−1}(N) 恰是 D ≠ 26 时的真实答案
      （worldsheet.ocq-null-state-two-families notes【三追记】(i) 的 §B‴.6 结果），
      缺口 p_{D−1}(N+1) − p_{D−2}(N+1) − p_{D−1}(N) 由 Type 2（𝒟₂）族补上，本卡不覆盖
      Type 2，也不断言两族之和达到目标（见【明确不断言】(b)）。
  (b) **不覆盖 Type 2 族，不断言两族之和的下界，不断言 N ≥ 5 起两族像的重叠问题**：
      𝒟₂ := 2L_{-2}+3L_{-1}² 族与本卡的 L_{-1} 族像是否相交、相交多少，是
      worldsheet.ddf-spanning-rank-inequality notes【三追记】记录的独立开放问题，
      本卡的 L_{-1}-单射论证对一切 D 成立（不含 D=26 的信息），无法看见这个重叠。
  (c) **不断言这是紧的（tight）**：本卡只给下界，不断言 dim(H_null ∩ V_{N+1}) 恰等于
      p_{D−1}(N)（一般地严格大于，因为 Type 2 族的贡献未计入）。
  (d) **截距不是自由的**：本卡与 worldsheet.quasi-physical-slice-dimension 不同，
      **需要** haa : a₀ = 1（用来保证 Type-1 后代的 L_0 本征值满足零态判据）；这是本卡
      与其上游卡（intercept-free）的唯一差异，也是 PR6′ 唯一用到截距的地方。
  (e) **N 从 0 起始的形式，不是蓝图原始的 "N−1" 形式**：蓝图 §B‴.9 原写法是
      dim(H_null ∩ V_N) ≥ p_{D−1}(N−1)（N ≥ 1），但该形式在 N = 0 处为假——
      p_{D−1}(0) = 1 而层真空 |0;0⟩ 是物理态且非零态（不在 H_null 里）。本卡采用
      "N+1"形式以避免自然数减法与该反例；两个形式在 N ≥ 1 处逐字等价
      （N ↦ N−1 的换元），Lean 侧两条定理都存在（本卡引用前者为 lean_decl，
      后者以 notes 记账）。
uses:
  - worldsheet.ddf-light-cone-frame
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard, conv.intercept-sign-a]
