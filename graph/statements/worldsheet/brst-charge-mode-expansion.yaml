id: worldsheet.brst-charge-mode-expansion
kind: proposition
title: "由 BRST 流的围道积分得到的 Q_B 等于模式展开式 Σ c_n L^m_{−n} + Σ ((m−n)/2) : c_m c_n b_{−m−n} : − c_0"
statement: |
  设定与记号沿用 worldsheet.brst-quantization（bc 系统权 λ = 2，模 b_n、c_n，
  {b_m, c_n} = δ_{m+n,0}；物质 Virasoro 模 L^m_n；受限模）与
  worldsheet.brst-current-bosonic-string（BRST 流 j_B，Q_B = ∮ (dz/2πi) j_B）。
  记号：中心荷写上标 c^m、c^g，鬼场模写下标 c_n。

  断言：把 j_B 的 Laurent 展开逐项做围道积分，得到
    Q_B = Σ_{n ∈ Z} c_n L^m_{−n} + Σ_{m, n ∈ Z} ((m − n)/2) : c_m c_n b_{−m−n} : + a^g c_0,
  且**鬼场正规序常数取 a^g = −1**，即末项为 − c_0。
  这与 worldsheet.brst-quantization 中直接以模式定义的 Q_B 逐项相同。

  **正规序约定**：三次鬼场项里的 : … : 取**以 |↓⟩ 为参照的正规序**（湮灭子 b_j (j ≥ 0)、
  c_j (j ≥ 1) 排在右边；c_0 在此约定下是**产生子**，b_0 是湮灭子），
  与之配套的常数就是末项 a^g c_0 = −c_0。

  **L^g_0 的记号约定（重要，两个不同的算符）**：本节点与 §4.3 的其余 BRST 节点里的 L^g_0
  指**不含正规序常数**的鬼场 level 算符，正规序参照取鬼场基态 |↓⟩，
    L^g_0 = Σ_{j > 0} j ( b_{−j} c_j + c_{−j} b_j ),   故 L^g_0|↓⟩ = 0；
  常数 a^g = −1 被单独写出（Q_B 的末项 −c_0，或 L_0 = L^m_0 + L^g_0 − 1 中的 −1）。
  worldsheet.bc-ghost-normal-ordering-constant 里的 L^g_0 是**共形正规序**的那一个，
  满足 L^g_0|↓⟩ = a^g|↓⟩ = −|↓⟩。两者相差常数 a^g：本节点的 L^g_0 = 那里的 L^g_0 − a^g。
  引用时必须指明取的是哪一个。

  等价的读法（这是 a^g = −1 的物理意义）：把总 Virasoro 零模写成
    L_0 = L^m_0 + L^g_0 + a^g = L^m_0 + L^g_0 − 1（此处 L^g_0 是上面约定的不含常数的那一个），
  末项 − c_0 就是把开弦截距 a = 1（Polchinski 记号 A = −1，conv.intercept-sign-a）
  编码进 Q_B 的那一项：L^g_0|↓⟩ = 0，故 L_0(|ψ⟩⊗|↓⟩) = 0 ⟺ (L^m_0 − 1)|ψ⟩ = 0。

  本命题**不**断言 Q_B² = 0（那需要 c^m = 26，见 worldsheet.critical-dimension-brst
  与 worldsheet.brst-nilpotent-at-c26），也**不**断言 j_B 表达式中全导数项系数的取值
  （由 worldsheet.brst-current-bosonic-string (a)，该项对 Q_B 无贡献）。
uses_conventions: [conv.worldsheet-complex-coords, conv.virasoro-standard, conv.intercept-sign-a]
sources:
  - ref: polchinski-1998-v1
    loc: "§4.3, eq. (4.3.7), p.132（Q_B 的模式展开；⚠ **原书写的是闭弦形式，末项为 + a^B(c_0 + c̃_0)**，紧接一句 a^B = a^g = −1）；配 (4.3.5)（Q_B = (1/2πi)∮(dz j_B − dz̄ j̃_B)）、(4.3.6)（{Q_B, b_m} = L^m_m + L^g_m）、**(4.3.8)**（{Q_B, b_0} = L^m_0 + L^g_0 —— **这是原书给 a^B = a^g = −1 的论证**）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——一处实质订正】

      ⚠ **订正**：本图与 [S] 都把 (4.3.7) 的末项记成 `− c_0`。**原书 (4.3.7) 写的是闭弦的
      一般形式 `+ a^B(c_0 + c̃_0)`**，`− c_0` 是它在开弦（只有一套鬼场模、且 a^B = −1）下的特例。
      本节点 statement 写的是开弦特例，**内容不错**，但不得声称与 (4.3.7) 逐字一致。

      **a^B = a^g = −1 在原书里有明确论证，出处是 (4.3.8)**（旧记录完全没有这条）：
      原书由 {Q_B, b_0} = L^m_0 + L^g_0 读出 Q_B 里 c_0 项的系数必须与 L_0 的正规序常数匹配，
      故 a^B = a^g。这条依赖边在本图中**可以不标 inferred**。

      另一处独立的 a^g = −1 逐字确认在 **(4.1.22)**（p.125）：
      原书写 (L^m_0 + L^g_0)|ψ,↓⟩ = 0 并逐字说明「the ghosts in their ground state |↓⟩,
      **which has L^g_0 = −1**」——注意这里的 L^g_0 是**共形正规序**的那一个
      （与本节点 statement 里「不含正规序常数」的 L^g_0 相差 a^g），
      正是本节点 statement 中「两个不同的算符」那一段所警告的口径差在原书里的实例。
      见 literature/extractions/polchinski-1998-v1.md §12.3（E62–E67）与 §12.10 表 B 第 29 项。
  - ref: polchinski-1998-v1
    loc: "§2.7, p.61：a^g = ½λ(1−λ) 在 (2.7.20) 与 (2.7.21) **之间的无式号正文**里（λ = 2 给 −1）；(2.7.21) 是把常数代回后的 L_m"
    note: |
      【原书核实 2026-09-11，L1】⚠ 订正：旧 loc 说「(2.7.21)（bc 正规序常数 a^g = λ(1−λ)/2）」，
      把式号与内容绑错了——(2.7.21) **不是**那个标量等式，而是代入常数后的 L_m 表达式。
      详见 worldsheet.bc-ghost-normal-ordering-constant 的 sources。
      a^g = −1 现有四处原书逐字确认，「抽取记录原表曾误记 a^g = 0」这段历史至此关闭。
tags: [brst, bosonic-string, ghosts, intercept, quantization]
notes: |
  本命题是把 worldsheet.brst-current-bosonic-string（CFT / 围道语言）与
  worldsheet.brst-quantization（纯代数 / 模式语言）**接起来**的那条边。
  在此之前，图里的 Q_B 有两个互不相干的定义，谁也没说它们是同一个算符。

  它同时是**开弦截距 a = 1 在 BRST 语言中的落点**：a = 1 不是这里被推出来的，
  而是被 a^g = −1（worldsheet.bc-ghost-normal-ordering-constant，来自 λ = 2 的 bc 系统）
  决定的。a = 1 的独立推导见 worldsheet.open-string-intercept。
  Kato–Ogawa 1983 的摘要把 D = 26 与 α_0 = 1 一并归给 Q_B² = 0；本图按"一个节点一个命题"
  把两件事分开：D = 26 在 worldsheet.critical-dimension-brst，a = 1 在这里与
  worldsheet.open-string-intercept。

  本节点只写**开弦 / 全纯侧**。闭弦要把 Q_B 写成全纯与反全纯两部分之和，各带一个 − c_0 型项
  （对应 a = ã = 1），本图无节点。
