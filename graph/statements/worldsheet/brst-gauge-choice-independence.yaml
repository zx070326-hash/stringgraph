id: worldsheet.brst-gauge-choice-independence
kind: proposition
title: 改变规范固定条件等于给作用量加一个 BRST 恰当项，故 BRST 不变态之间的振幅与规范选择无关
statement: |
  设定与归一化沿用 worldsheet.brst-gauge-fixed-action。设两组规范固定函数 F^A 与
  F'^A = F^A + δF^A 给出两个量子作用量 S_q[F] 与 S_q[F']。则

  (1) 两者之差是 BRST 恰当的：
        S_q[F'] − S_q[F] = − i δ_B ( b_A δF^A ) / ε，
      即（在 worldsheet.brst-invariance-of-gauge-fixed-action (1) 的意义下）
      规范固定项与鬼场项的改变量整体是一个 BRST 变分。

  (2) 于是，若被插入的算符（外态）都是 BRST 闭的（δ_B 作用为零）且路径积分测度 BRST 不变，
      则期望值与规范选择无关：
        ⟨ 0 | T{ O_1 ⋯ O_n } | 0 ⟩_{F'} = ⟨ 0 | T{ O_1 ⋯ O_n } | 0 ⟩_F。
      等价的算符表述：BRST 恰当态 Q_B|Λ⟩ 与所有 BRST 闭态正交，
      故物理振幅只依赖上同调类 [·] ∈ ker Q_B / im Q_B。

  本命题的 (2) **假设**路径积分测度的 BRST 不变（无 BRST 反常）。该假设不在本图中论证。
