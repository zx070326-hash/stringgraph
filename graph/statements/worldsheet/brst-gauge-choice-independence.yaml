id: worldsheet.brst-gauge-choice-independence
kind: proposition
title: 改变规范固定条件等于给作用量加一个 BRST 恰当项，故 BRST 不变态之间的振幅与规范选择无关
statement: |
  设定与归一化沿用 worldsheet.brst-gauge-fixed-action。设两组规范固定函数 F^A 与
  F'^A = F^A + δF^A 给出两个量子作用量 S_q[F] 与 S_q[F']。则

  (1) 两者之差是 BRST 恰当的：
        S_q[F'] − S_q[F] = − i δ_B ( b_A δF^A ) / ε，
      即（在 worldsheet.brst-invariance-of-gauge-fixed-action (1) 的意义下）
      规范固定项与鬼场项的改变量整体是一个 BRST 变分。

  (2) 于是，若被插入的算符（外态）都是 BRST 闭的（δ_B 作用为零）且路径积分测度 BRST 不变，
      则期望值与规范选择无关：
        ⟨ 0 | T{ O_1 ⋯ O_n } | 0 ⟩_{F'} = ⟨ 0 | T{ O_1 ⋯ O_n } | 0 ⟩_F。
      等价的算符表述：BRST 恰当态 Q_B|Λ⟩ 与所有 BRST 闭态正交，
      故物理振幅只依赖上同调类 [·] ∈ ker Q_B / im Q_B。

  本命题的 (2) **假设**路径积分测度的 BRST 不变（无 BRST 反常）。该假设不在本图中论证。
uses_conventions: []
sources:
  - ref: polchinski-1998-v1
    loc: "§4.2，eq. (4.2.8)（改变规范固定条件 = 加 BRST 恰当项，故物理振幅与规范选择无关），p.127"
    note: |
      式号经 schrans-2020 目录核实（`4.9–4.12 p 126–127`），表达式未核对原书。
      抽取记录 literature/extractions/polchinski-1998-v1.md#E59。
  - ref: polchinski-1998-v1
    loc: "§5.4, **p.161**（(5.4.6) δ_B(b,∂_kĝ) = iε(T,∂_kĝ) 下方正文，无式号）：**S-矩阵的 BRST 不变性带一个未处理的模空间边界项**"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——**作者自承缺口，本图先前没有**】

      本节点断言的是「改变规范固定条件只加 BRST 恰当项」这一**世界面局域**的陈述（§4.2）。
      但把它推到**振幅层面**（"物理振幅与规范选择无关"）时，原书在 §5.4 明说还有一项没处理，
      p.161 逐字：
        "so the BRST variation vanishes **up to a possible term from the boundary of moduli space**.
         … **In most cases there is no surface contribution, due to what is known as the *canceled
         propagator argument*. In certain circumstances this argument does not apply**, and we will
         see how to deal with this."
      （"canceled propagator argument" 这个名字在 p.196 被再次点明：「The analytic continuation
        argument used here is known for historic reasons as the canceled propagator argument.」）

      → **即：S-矩阵的 BRST 不变性在原书里是有洞的**，洞在模空间边界，靠一个解析延拓型的
        论证（canceled propagator argument）打发，且原书自己说「certain circumstances this
        argument does not apply」。
      → 本节点的 statement **不**覆盖振幅层面，故本条不改变本节点的 status；
        但**凡以本节点为依据主张「弦振幅与规范选择无关」的下游推导都必须挂上这条限定**，
        且不得高于 physical-argument。本图目前没有 S-矩阵层面的节点（§5.3 (5.3.9) 一带
        在 curator-ch5/ch6 分支上），已在报告中把这条交给 lead 转派。

      同页另有一条对 §5.3 主公式有利的原书自述（p.161，逐字）：
        "It is important to note that **the gauge-fixed result (5.3.9) could be written down directly
         from the requirement of BRST invariance, without reference to the gauge-invariant form.**"
      → 这给 (5.3.9) 提供了**第二条独立的辩护路线**，可作为 S-矩阵主公式的第二条 derivation。
      见 literature/extractions/polchinski-1998-v1.md §12.7（E84/E86 一带）与 §12.10 表 C 第 12 项。
tags: [brst, gauge-fixing, quantization, amplitudes]
notes: |
  这是"为什么 BRST 上同调才是物理态空间"的论证的路径积分侧。
  算符侧的对应事实（Q_B 恰当态与闭态正交，需要 Q_B 关于内积自伴）依赖鬼场的厄米共轭约定，
  见 worldsheet.bc-ghost-hermitian-conjugation。

  本命题给的是"规范无关性"，**不**给"BRST 上同调 = 物理态空间"这一识别；
  后者对弦的情形是 worldsheet.brst-cohomology-equals-ocq-physical。
