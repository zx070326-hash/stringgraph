tags: [cft, algebra, lie-algebra, formalized]
notes: |
  【本卡片是 worldsheet.virasoro-algebra 的拆分产物】（lead 裁决 2026-09-10，见 docs/ROADMAP.md 待拆清单）
  旧卡 worldsheet.virasoro-algebra 把两件事写在一张定义卡上：
  (a) 李代数的定义（生成元、括号、中心性）；
  (b)「它是 Witt 代数的**唯一**非平凡中心扩张」。
  (a) 已在 Lean 中完成，(b) 没有（Mathlib v4.33.1 有 2-上循环但没有 2-上边缘与上同调商）。
  合成一张卡使整卡只能标 rigorous，从而把所有引用它的下游都压在 rigorous 以下。
  本卡片**逐字包含**旧卡陈述除最后一句以外的全部内容，故所有引用「Virasoro 代数的括号关系」
  的节点已就地改指本卡片；(b) 由 worldsheet.virasoro-unique-central-extension 承载。

  【基环】陈述对任意 ℚ-代数 R 成立。Witt 代数本身（math.witt-algebra）对任意交换环成立，
  ℚ-代数条件只来自中心项的 1/12。C、R、Q 都满足。

  【已知的形式化缺口 —— 这些是刻意不写进陈述的】
  (i) **基**：`Basis (Option ℤ) R (VirasoroAlgebra R)` 未构造，见 formal/TODO.md
      「Virasoro 代数的基」一项。陈述里只写「张成」与「Vir ≅ W(R) × R」，两者都已证。
  (ii) **唯一性**：见上，已拆出为独立命题卡。
  (iii) 本节点是抽象李代数，**不**断言任何具体表示（Sugawara 构造、自由玻色子的 L_m 等）
      满足这些关系；那些是 worldsheet.virasoro-generators-free-boson 等节点的事。

  【查重】新增前跑过 `stringgraph search virasoro / witt / central`。
