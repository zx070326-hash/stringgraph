id: worldsheet.virasoro-algebra-v2
kind: definition
status: formalized
title: Virasoro 代数（李代数定义；不含唯一性断言）
statement: |
  设 R 是交换环且是 ℚ-代数（物理情形取 R = C；ℚ-代数是为了让 1/12 有意义）。

  **载体**：Vir(R) := W(R) ⊕ R，其中 W(R) 是 Witt 代数（math.witt-algebra）。
  记 L_n := (ℓ_n, 0)（n ∈ Z）与 C := (0, 1)。

  **括号**：Vir(R) 上的 R-双线性李括号由

    [L_m, L_n] = (m − n) L_{m+n} + ((m^3 − m)/12) δ_{m+n,0} · C,
    [C, X] = [X, C] = 0        (X ∈ Vir(R))

  唯一确定（第一式右端第二项即 conv.virasoro-standard 的 (c/12) m(m^2−1) δ_{m+n,0}，
  其中中心荷 c 是 C 在给定表示上的标量值）。这确实是李代数：括号交错且满足 Jacobi 恒等式。

  **结构**：{L_n : n ∈ Z} ∪ {C} 张成 Vir(R)；作为 R-模有线性同构 Vir(R) ≅ W(R) × R。
  投影 π : Vir(R) → W(R)，(w, r) ↦ w 是李代数同态，含入 ι : R → Vir(R)，r ↦ (0, r) 是单射，
  且 ker π = im ι，即

    0 → R → Vir(R) → W(R) → 0

  是正合列，ι(R) 落在 Vir(R) 的中心。故 Vir(R) 是 W(R) 的一个一维中心扩张。

  **本节点不断言**：Vir(R) 是 W(R) 的**唯一**非平凡一维中心扩张。那是一条独立命题，
  见 worldsheet.virasoro-unique-central-extension（未形式化）。
uses: [math.witt-algebra]
uses_conventions: [conv.virasoro-standard]
