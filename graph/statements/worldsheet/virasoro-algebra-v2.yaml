sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Virasoro/Basic.lean :: StringFormal.Virasoro.VirasoroAlgebra；VirasoroAlgebra.{lgen, cgen, toProdₗ, lie_lgen_lgen, cgen_lie, lie_cgen, ofCentre, ofCentre_lie, lie_ofCentre, toWitt, toWitt_surjective, ofCentre_injective, toWitt_eq_zero_iff}；span 版本 VirasoroAlgebra.span_lgen_cgen_eq_top 在 formal/StringFormal/Virasoro/Verma.lean"
    note: |
      本仓库，提交 ecc4c5c（Basic.lean，"formal: replace Virasoro placeholder with a real
      LieRing/LieAlgebra instance"）与 b138286（span_lgen_cgen_eq_top，在 Verma.lean 中）。
      这是本节点 status: formalized 的依据，逐句对应：
      - 载体与生成元 → `VirasoroAlgebra R := LieAlgebra.ofTwoCocycle (virasoroCocycle R)`、
        `lgen`、`cgen`；
      - 括号 → `lie_lgen_lgen : ⁅L n, L m⁆ = (n − m) • L (n+m) + (if n+m = 0 then
        centralTerm R n else 0) • C`，其中 `centralTerm R n = (n^3 − n)/12`；
      - 中心性 → `cgen_lie` / `lie_cgen` / `ofCentre_lie` / `lie_ofCentre`；
      - 模同构与张成 → `toProdₗ : Vir ≃ₗ[R] Witt × R`、`span_lgen_cgen_eq_top`；
      - 正合列 → `toWitt_surjective`、`ofCentre_injective`、`toWitt_eq_zero_iff`。
      无 sorry，公理仅 propext / Classical.choice / Quot.sound。
      **未打包**：`Basis (Option ℤ) R (VirasoroAlgebra R)` 实例尚未构造，故陈述里写的是
      「张成 + 模同构」而不是「以 {L_n} ∪ {C} 为基」；后者由 toProdₗ 与 Witt 的基立即得到，
      但 Lean 中没有这条声明（见 formal/TODO.md 与本节点 notes）。
