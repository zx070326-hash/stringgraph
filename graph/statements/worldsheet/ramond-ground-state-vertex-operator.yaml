id: worldsheet.ramond-ground-state-vertex-operator
kind: proposition
title: "R 扇区基态的顶点算子：βγ 侧的自旋场 Σ = e^{−φ/2}（权 3/8，由 β、γ 与它的半整数幂 OPE 定出），全算子 V_s = e^{−φ/2} Θ_s；加上 bc 鬼场的 −1 后与正规序常数 (10.4.5) 相符"
statement: |
  【设定】worldsheet.beta-gamma-bosonization 的玻色化字典（β ≅ e^{−φ}∂ξ、γ ≅ e^{φ}η，
  φ 按 conv.nonembedding-scalar-normalization 归一），与
  worldsheet.spin-field-vertex-operators 的物质侧自旋场 Θ_s ≅ exp[i Σ_{a=0}^{4} s_a H^a]。
  λ' = 3/2（弦论的超共形鬼场）。

  【断言 (1)：βγ 侧 R 扇区算子由半整数幂 OPE 定出】要求算子 Σ 满足
        β(z) Σ(0) = O(z^{−1/2}),        γ(z) Σ(0) = O(z^{1/2})        （(10.4.23)）
  （即与 β、γ 的 OPE 带 z^{±1/2} 型**分支切割**——这正是 R 扇区的特征），
  则
        Σ  =  e^{− φ/2},        其权  h = 3/8                        （(10.4.24)）

  【断言 (2)：R 基态的完整顶点算子】
        V_s  =  e^{− φ/2}  Θ_s                                       （(10.4.25)）
  即"鬼场侧的自旋场"乘"物质侧的自旋场"。

  【断言 (3)：与鬼场正规序常数的一致性核对】原书逐字：
  "Adding the contribution **−1** of the bc ghosts, the weight of e^{−φ/2} and of e^{−φ}
   **agree with the values (10.4.5)**."
  即：3/8 + (−1) = −5/8 = a^g(R)，1/2 + (−1) = −1/2 = a^g(NS)，
  与 worldsheet.superconformal-ghost-normal-ordering-constants 的两个值相符。

  【本命题不断言的内容】
    (1) **不**断言断言 (1) 的推导。原书的措辞是"(10.4.23) 确定 Σ"，没有给出这个"确定"的论证
        （与 §10.3 的 (10.3.24)/(10.3.25) 同一手法，那里也只有 'determine'）。
    (2) **不**断言 V_s 的总权。原书在 (10.4.25) 处不写；本图的算术核对见 notes。
    (3) **不**断言 V_s 是**物理**（BRST 闭且非平凡）顶点算子，也不断言它满足质量壳条件——
        那是 §10.5/§10.6 的内容（worldsheet.superstring-brst-charge、
        worldsheet.type-ii-massless-spectrum）。
    (4) **不**断言"−1 是 bc 鬼场基态算子 c 的权"这一身份（原书只说 'the contribution −1 of
        the bc ghosts'；本图的读法见 notes，标为未在该处核实）。
    (5) **不**断言 s 的取值范围与时空旋量表示的关系（附录 B.1，本图无节点）。
    (6) **不**断言 cocycle 修补已被包含在 (10.4.25) 里——Θ_s 按字面写下统计是错的
        （worldsheet.spin-field-vertex-operators 断言 (6)），需
        worldsheet.vertex-operator-cocycle。
