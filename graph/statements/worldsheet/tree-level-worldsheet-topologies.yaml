id: worldsheet.tree-level-worldsheet-topologies
kind: definition
status: rigorous
title: 树级世界面的三个拓扑 S₂、D₂、RP₂ 及其复坐标片
statement: |
  本卡片固定树级（χ > 0）闭/开/无取向世界面的复坐标描述，供第 6 章一切树级振幅使用。
  取欧氏世界面与复坐标（conv.worldsheet-euclidean、conv.worldsheet-complex-coords）。

  **(1) 球面 S₂。** 一张复平面不足以覆盖 S₂（差无穷远点），须用两片球极投影坐标：
  由北极投影得 z ∈ C，由南极投影得 u ∈ C，重叠区（两极之外）上过渡函数为
    u = 1/z,      因而 δu = − z^{−2} δz。
  「z = ∞」这一点是指 **u 片的原点 u = 0**；一切「把顶点算子放到无穷远」的说法都按此定义。

  **(2) 圆盘 D₂。** 在 S₂ 上作认同 z ∼ 1/z̄。该认同的不动点集是单位圆 |z| = 1，
  故商空间是**带边**曲面，即二维圆盘；它共形等价于上半平面
    H = {z ∈ C : Im z ≥ 0}，边界为实轴 Im z = 0。
  本图此后一律用上半平面代表 D₂，开弦顶点算子插在实轴上（坐标记作 y ∈ R）。

  **(3) 射影平面 RP₂。** 在 S₂ 上作认同 z ∼ −1/z̄。该认同**无不动点**，
  故商空间**无边界**且**不可定向**，即实射影平面。

  三者的 Euler 数分别为 χ(S₂) = 2、χ(D₂) = 1、χ(RP₂) = 1
  （worldsheet.worldsheet-euler-number；这里只记录取值，不重新论证）。

  **本卡片不断言什么**：不断言这三者穷尽 χ > 0 的曲面；不断言它们上的模空间为空
  （μ = 0 是 Riemann–Roch 的结论，属第 5 章，本图尚无节点，见 notes）；
  不给出任何度规，只给复结构与坐标片。
