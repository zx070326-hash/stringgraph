id: worldsheet.ddf-commute-with-nonzero-virasoro
kind: proposition
title: DDF 算子与**非零**模 Virasoro 生成元对易：[L_m, A^ε_n] = 0（一切 m ≠ 0，一切 n ∈ Z）——弱节点，m = 0 不含在内
statement: |
  记号与 worldsheet.ddf-operators-v6 完全一致：动量塔 T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)
  （代数直和，第 N 层动量 p + N k_0），a^μ = (2α')^{1/2}p^μ、b^μ = (2α')^{1/2}k_0^μ，
  L_m 是 worldsheet.virasoro-generators-free-boson 的 Sugawara 生成元**逐层用该层动量**装在塔上
  （不移动层指标），A^ε_n = Σ_{m ∈ Z} α^ε_m V^{(n)}_m 是 v6 定义的 DDF 算子（把第 N 层送到第 N+n 层）。

  【前提】
    (T) 横向性  ε·k_0 = 0        （v6 的定义参数）
    (N) 类光性  k_0² = 0
    (S) 归一化  2α' k_0·p = 1

  【断言】在 (T)(N)(S) 之下，作为塔 T(p; k_0) 上的线性算子恒等式，

    [L_m, A^ε_n] = 0    对一切 m ∈ Z，m ≠ 0，与一切 n ∈ Z。

  【本节点明确不断言 —— 这是一个弱节点，边界要读准】
  (a) **m = 0 不在断言范围内。** 完整量词版本（∀m，含 m = 0）是
      worldsheet.ddf-commute-with-virasoro，本卡是它的**严格弱化**。
      m = 0 不是本卡的疏漏而是一处真实的缺口，理由见 notes。
  (b) **不断言 A^ε_n 把物理态映为物理态。** 旧协变物理态条件
      （worldsheet.old-covariant-physical-states）是 L_m ψ = 0（∀ m ≥ 1）**与** (L_0 − a)ψ = 0；
      本卡只覆盖前一半（且顺带覆盖 m ≤ −1，那一半物理态条件并不要求），
      **L_0 那一半完全没有覆盖**，见 notes 的【推论的 caveat】。
  (c) **不断言 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}**（worldsheet.ddf-transverse-oscillator-algebra）。
  (d) **不断言 A^ε_n ≠ 0**，也不断言 DDF 态张成任何东西。
  (e) **不断言 (N)(S) 是必要的**。(N) 在 Lean 的塔上版本里确实是**必需**假设
      （否则系数含塔的层指标 j，见 notes），但"必需"在这里是论证层面的观察，不是被断言的命题。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard]
formal:
  lean_decl: StringFormal.NoGhost.lie_towerLop_ddfOp_of_ne
  lean_file: StringFormal/NoGhost/DDFOperatorNeg.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/DDFOperatorNeg.lean :: StringFormal.NoGhost.lie_towerLop_ddfOp_of_ne（本卡 formal.lean_decl）；推论 StringFormal.NoGhost.lie_towerLop_ddfOp_of_neg；上游 StringFormal.NoGhost.{lie_towerLop_ddfSummand_of_ne, lie_towerLop_towerVertex_of_ne, lie_towerLop_towerVertex_of_ne_normalized}；m ≥ 1 的先行版本 StringFormal.NoGhost.lie_towerLop_ddfOp_of_pos（formal/StringFormal/NoGhost/DDFOperator.lean）"
    note: |
      本仓库，合并提交 9ac8f41，Lean 4 + Mathlib v4.33.1，无 sorry，
      **DDFOperatorNeg.lean 的 7 条声明公理只有 propext / Classical.choice / Quot.sound**
      （formal/TODO.md 的 `ddf-operators` 第 (5) 项逐字登记；**curator 未自行重跑 `lake build`**）。
      语句逐字（去掉隐式参数）：
        `theorem lie_towerLop_ddfOp_of_ne (η a b ε : Fin D → R) (hη : ∀ μ, η μ * η μ = 1)
           (hbb : dotVec η b b = 0) (hba : dotVec η b a = 1) (hεb : dotVec η ε b = 0)
           {m : ℤ} (hm : m ≠ 0) (n : ℤ) : ⁅towerLop η a b m, ddfOp η a b ε hη hεb n⁆ = 0`。
      与本卡陈述逐字一致：`hbb` = (N)，`hba` = (S)，`hεb` = (T)，`hm` = m ≠ 0，n 无限制。
  - ref: goddard-2008
    loc: "§5 'Spectrum Generating Algebra', p.11, eq. (5.4)（arXiv:0802.3249v1）：`[L_m, A^i_n] = 0.`"
    note: |
      **本卡是该式的弱化（限 m ≠ 0）**，不是它本身。该文对 m 无限制，量词更强；
      但它是历史综述，(5.4) **无证明、无「we prove」**（researcher L1 逐页读图，
      literature/extractions/gsw-1987-v1.md §2 E2），故本条只提供可追溯性，不承载论证。
      号差逐字 signature (−,+,+,+) = mostly-plus，与 conv.metric-mostly-plus 一致，无需换算；
      归一化逐字 k·p = 1，在 α' = 1/2 下即本卡的 (S)。
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      DDF 链的主来源；本卡承载的是那里「被积量是权 1 primary ⟹ 与 Virasoro 对易」那句话的
      m ≠ 0 部分。**式号仍未核实（L0）**；GSW 用 mostly-minus，已按 conv.metric-mostly-plus 转写；
      GSW 取 α' = 1/2。**GSW 不区分 m = 0 与 m ≠ 0**。
tags: [bosonic-string, spectrum-generating-algebra, virasoro, formalized, weak-node]
notes: |
  【为什么单独建这个弱节点（lead 裁决 2026-09-11）】
  与 worldsheet.brst-nilpotent-at-c26 同一模式：完整量词的卡
  worldsheet.ddf-commute-with-virasoro（∀m，含 m = 0）在本图中只有 physical-argument 的推导
  （--via-conformal-weight 走 OPE + 围道形变；--via-vertex-algebra-primary 自身 rigorous
  但被一条 open 的桥接边压住）。若让下游直接依赖那张卡，Lean 已经做到的部分
  （m ≠ 0，完全机器验证）就完全体现不出来。
  本卡把**已形式化的那一半**单独立起来，让走 Lean 路线的下游不被 m = 0 的缺口拖低。
  **本卡不取代 ∀m 卡**：需要 L_0 关系的下游（首当其冲"DDF 态是物理态"）必须引 ∀m 卡。

  【m = 0 为什么缺：障碍已被钉死在一处】
  formal/TODO.md 的 `ddf-operators` 第 (5) 项逐字：
    「只剩 `m = 0`，且**只卡在一处**——`hm : m ≠ 0` 在 `lie_towerLop_ddfOp_of_ne` 里只用了一次，
      就是引用 `lie_towerLop_ddfSummand_of_ne`。伸缩和与窗口分析在 `m = 0` 处逐字成立
      （`m = 0` 时两项 `(j−m) G_{j−m}` 与 `j G_j` 本来就相同，单项括号自己就是零）。
      真正缺的是单 Fock 恒等式 (3f) 在 `m = 0` 的版本。」
  即：障碍**不在** DDF 算子这一层，而在单个 Fock 空间上的共形权恒等式
  worldsheet.exponential-vertex-operator-mode-weight-identity 的 m = 0 例外——
  Sugawara 正规序求和在 m = 0 时 j = 0 与 j = m 两项**重合**（并成一项 ½:α_0·α_0:，中间段为空），
  把 m ≠ 0 的系数代进去会得到**错**答案。这不是技术疏漏，是真实的分情形。

  ⚠ **一处必须读准的更正（lead 2026-09-11）**：缺的结论是 **[L_0, A^ε_n] = 0**，
  **不是** [L_0, A^ε_n] = −n A^ε_n。理由：A^ε_n 是**权 1 流的零模**，
  一般地 [L_m, j_r] = ((h−1)m − r) j_{m+r}，取 h = 1、r = 0 得零。
  L_0 本征值的移位（"A^ε_n 把能级移动 −n"）来自 `towerVertex` 的**动量移位**
  p ↦ p + n k_0 与质量壳记账 α'(p + n k_0)² = α'p² + n，**不是**来自这个括号。
  ⚠ 文献里确有写成 [L_0, A^i_n] = −n A^i_n 的（tomassini-2008 Theorem 2.4 的 (2.38)），
  但那是**固定纤维**版本的**修改版** DDF 算子，与本图的塔上版本不是同一个对象；
  详见 worldsheet.ddf-commute-with-virasoro 的 source note 与
  literature/extractions/gsw-1987-v1.md §5。**不要把两者混为一谈。**

  【推论的 caveat：本卡覆盖物理态条件的哪一半】
  旧协变物理态（worldsheet.old-covariant-physical-states）要求
    (i) L_m ψ = 0，∀ m ≥ 1；   (ii) (L_0 − a) ψ = 0。
  · (i) **本卡完全覆盖**：m ≥ 1 ⊂ m ≠ 0，故 L_m(A^ε_n ψ) = A^ε_n(L_m ψ) = 0。
  · (ii) **本卡完全不覆盖**：需要 [L_0, A^ε_n] = 0（缺）**与**质量壳的分次记账
    α'(p + n k_0)² = α'p² + n（本图中在 worldsheet.ddf-commute-with-virasoro 的推论里，
    也未单独立卡）。
  因此**不能**从本卡推出"A^ε_n 把物理态映为物理态"。Lean 侧同样不能，
  且还有第二重障碍：`Fock.physSubmodule` 目前只定义在**单个** Fock 空间上，
  塔上的物理子模尚未定义（DDFOperator.lean 文件头 "What is NOT here" 第 3 条）。
  本卡的 (b) 已把这一点写进陈述边界，请下游与 auditor 按此读。
  ⚠ 附带一提：本卡还覆盖了 m ≤ −1，而物理态条件 (i) **并不要求** m ≤ −1；
  那一半的用处在别处（例如与伴随关系的自洽性检验），不要误以为它补上了 (ii)。

  【(N) k_0² = 0 在塔上是必需假设，不是为方便】
  DDFOperatorNeg.lean / VertexWeight.lean 对 `lie_towerLop_towerVertex_of_pos` 的说明逐字记下：
  单个 Fock 空间上第 j 级的系数是
    (K − n) − m + n(k_0·p) + (jn + ½(m+1)n²)(k_0²)，
  **含层指标 j**；k_0² ≠ 0 时 ⁅L_m, V^{(n)}_K⁆ 在整条塔上**不是** V^{(n)}_{K−m} 的标量倍，
  只是逐层成比例、比例因子依赖 j。故本卡的 (N) 不可去。
  相对地，单 Fock 版本（worldsheet.exponential-vertex-operator-mode-weight-identity）
  对任意 b 成立，不需要 b·b = 0。

  【与 worldsheet.ddf-commute-with-virasoro 的关系，一句话】
  本卡 ⊊ 那张卡（量词更窄）。那张卡的 notes 已登记本卡的存在与两者的分工；
  两张卡的陈述文本都不再改动。

  【2026-09-11（六）：本卡已被 ∀m 版覆盖；保留作历史（三段式攻关记录），不换代、不删，curator】
  main 合入 `formal/StringFormal/NoGhost/DDFOperatorAll.lean` 后，
  `lie_towerLop_ddfOp` 把 ⁅L_m, A^ε_n⁆ = 0 证到**每个** m ∈ Z，
  图中 worldsheet.ddf-commute-with-virasoro 因此有了 --via-lean（formalized），
  effective 从 physical-argument 升为 formalized。
  ⇒ **本卡的全部内容自此被那张卡严格包含**（本卡是它限到 m ≠ 0 的弱化）。
  按 lead 裁决：**保留不删、不加 `superseded_by`**。理由两条：
  (1) 本卡不是"更差的表述"，而是攻关中一个真实存在过的量词边界，
      与 worldsheet.brst-nilpotent-at-c26 同一模式；
  (2) 它与 worldsheet.ddf-operators-preserve-positive-mode-conditions 一起构成
      **三段式攻关的可追溯记录**：
        m ≥ 1（DDFOperator.lean，`lie_towerLop_ddfOp_of_pos`）
          → m ≠ 0（DDFOperatorNeg.lean，`lie_towerLop_ddfOp_of_ne`；**本卡**）
          → 正模保持（TowerPhysical.lean；那张弱节点）
          → 一切 m + 完整物理态保持（DDFOperatorAll.lean；
            worldsheet.ddf-commute-with-virasoro 与 worldsheet.ddf-operators-preserve-physical-states）。
  ⚠ **新的下游不应再引本卡**：需要对易关系的引 ∀m 卡，需要物理态保持的引
  worldsheet.ddf-operators-preserve-physical-states。本卡只服务于历史追溯。

  【本卡推导对 v1 的依赖是对的，别去追改】
  本卡的 --via-lean 依赖 worldsheet.exponential-vertex-operator-mode-weight-identity
  （v1，m ≠ 0，`Fock.lie_Lop_vertexOsc_of_ne`）。该卡已被 -v2（一切 m）换代，
  故 validate 会报「depends on superseded statement」。**这是提醒不是错误**
  （docs/STATUS_LEVELS.md【旧推导的去留】）：Lean 的 `lie_towerLop_ddfOp_of_ne`
  **确实**只用 v1，改指 v2 反而会失真。

  【一处必须按新证据更正的旧措辞】
  本卡上文（【m = 0 为什么缺】段）写「把 m ≠ 0 的系数代进去会得到**错**答案」。
  前半句（j = 0 与 j = m 两项重合）对，**后半句是误传**。
  `formal/StringFormal/NoGhost/VertexWeightZero.lean` 文件头逐字：
  「通式系数是 `J - m + a·b + ½ (m+1) (b·b)`，`m = 0` 给 `J + a·b + ½ (b·b)`，
    而直接计算给出的也正是这个。之前记录的「代 `m = 0` 给错答案」指的是**真空引理**
    （`Fock.Lop_apply_creaExp_of_pos` / `_shifted` 的 `0 < m` 假设不可去），
    **不是**最终的对易子系数。」
  即：m = 0 需要单独证的是**真空引理**（L_0|k⟩ = ½(a·a)|k⟩，非零标量倍），
  最终对易子系数从来就是一条统一的多项式。
  详见 worldsheet.exponential-vertex-operator-mode-weight-identity-v2 的 notes。
