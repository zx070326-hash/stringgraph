id: worldsheet.gt-longitudinal-k-algebra
kind: proposition
title: Goddard–Thorn 纵向算子 K_n = k_0·α_n 的代数（Goddard 2008 (6.2)(6.3)）：[L_m, K_n] = −n K_{m+n}、[K_m, K_n] = 0、K_0 = 1（在 2α' k_0·p = 1 的动量塔上）、K_m† = K_{−m}、[K_m, A^ε_n] = 0
statement: |
  【设定】记号与数据沿用 worldsheet.ddf-operators-v6 与 worldsheet.momentum-tower-fock-space：
  D ∈ N；系数环 R 是交换 Q-代数；对角时空度规分量 η_μ 满足 η_μ² = 1
  （conv.metric-mostly-plus 下 η = diag(−1,+1,…,+1)）；α'（conv.alpha-prime-regge）；
  基点动量 p 与参考向量 k_0；重标度向量 a^μ := (2α')^{1/2} p^μ、b^μ := (2α')^{1/2} k_0^μ；
  动量塔 T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)，第 N 层的零模 α^μ_0|_N = (2α')^{1/2}(p + N k_0)^μ；
  ⟨·,·⟩_T 是塔上层间正交的双线性型（worldsheet.momentum-tower-fock-space (2)）；
  L_m 是逐层作用的 Sugawara 算子（worldsheet.virasoro-generators-free-boson，
  零模取该层的动量）；V^{(n)}_K 是 :e^{i n k_0·X(z)}: 在塔上的 z^K 洛朗系数；
  A^ε_n = Σ_m α^ε_m V^{(n)}_m 是 DDF 算子（worldsheet.ddf-operators-v6，横向性 ε·k_0 = 0
  是其定义的参数）。两个条件按 worldsheet.ddf-operators-v6 的记法：
    (N) 类光性  k_0² = 0        （等价：η(b, b) = 0），
    (S) 归一化  2α' k_0·p = 1   （等价：η(b, a) = 1）。

  【定义】对每个 n ∈ Z 定义**纵向算子**
    K_n := k_0 · α_n 的重标度版  =  Σ_μ η_μ b^μ α^μ_n  =  (2α')^{1/2} k_0·α_n ,
  即 worldsheet.ddf-operators-v6 的偏振收缩模 α^ε_n 在**偏振取参考向量自身** ε := b 处的取值。
  它逐层作用、不移动层指标；n = 0 时 K_0|_N = η(b, a + N b) 是第 N 层上的标量。
  （Goddard 2008 在 α' = 1/2 下写作 K_n = k·a_n；那里 (2α')^{1/2} = 1，两种写法逐字一致。）

  【断言】在 T(p; k_0) 上：
    (1) **与 Virasoro 的对易关系**：对一切 m, n ∈ Z，
          [L_m, K_n] = −n K_{m+n}。
        （只用 η_μ² = 1，**不需要** (N)(S)；这是 Goddard 2008 (6.3) 第二式。）
    (2) **K 之间对易**：设 (N)。则对一切 m, n ∈ Z，
          [K_m, K_n] = 0。
        （中心项本为 m η(b,b) δ_{m+n,0}，由 (N) 消失；这是 (6.3) 第三式，
        也是 (N) 在本卡唯一进入之处。）
    (3) **零模是恒等算子**：设 (N) 与 (S)。则
          K_0 = id_{T(p;k_0)}，
        即 K_0 在**每一层**都等于 1：η(b, a + N b) = η(b,a) + N η(b,b) = 1 + 0。
        （这是 Goddard 2008 §5 的适用条件 k·p = 1 在整条塔上的表现。）
    (4) **伴随**：对一切 m ∈ Z 与一切 v, w ∈ T(p;k_0)，
          ⟨ K_m v , w ⟩_T = ⟨ v , K_{−m} w ⟩_T，   即 K_m† = K_{−m}。
        （不需要任何条件；是 (α^μ_n)† = α^μ_{−n} 的线性组合。）
    (5) **与横向 DDF 算子对易**：设 (N)，并设 ε 满足横向性 ε·k_0 = 0（等价 η(ε, b) = 0）。
        则对一切 m, n ∈ Z，
          [K_m, A^ε_n] = 0。
        （两个输入各用一次：(N) 使 K_m 穿过顶点算子 V^{(n)}_j——
        [K_m, V^{(n)}_j] = n η(b,b) V^{(n)}_{j−m} = 0；横向性使 K_m 与 α^ε_j 对易——
        [K_m, α^ε_j] = m η(b,ε) δ_{m+j,0} = 0。）

  由 (1)(2) 与 Virasoro 关系 [L_m, L_n] = (m−n)L_{m+n} + (D/12) m(m²−1) δ_{m+n,0}
  （worldsheet.free-boson-central-charge-d），{L_m} ∪ {K_n} 张成 Virasoro 代数的一个扩张
  （Goddard 2008 的措辞 "an extension of the Virasoro algebra"）；本卡不给这个扩张命名。

  【本卡明确不断言】
  (a) **不断言 (6.2) 的刻画**「DDF 态张成的空间 = 物理态条件 + K_n|ψ⟩ = 0（n > 0）」——
      那是 Goddard–Thorn 无鬼定理证明的承重步骤（(B-26)，见
      worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 gaps），本卡只给代数。
  (b) **不断言 K_n|0;k⟩ = 0（n > 0）**：它是「每个 α^μ_n（n > 0）湮灭真空」的平凡推论，
      属 worldsheet.bosonic-fock-space 的定义内容，本卡不重复。
  (c) **不断言 Brower 的纵向算子 A^L_n = Ã_n + F_n** 及其代数 (6.5)–(6.7)
      （Goddard 2008 §6 p.16；brower-1972）。**K_n 与 A^L_n 是两个不同的对象**：
      K_n 是振子的线性组合，**不**与 Virasoro 对易（(1) 右端非零）；A^L_n 是修正后的
      顶点算子构造，与 L_m 对易。文献里「纵向」一词两者都用，引用时必须分清。
  (d) 不断言任何关于 H_phys、零模态或 D = 26 的事：(1)–(5) **对一切 D 成立**。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard]
