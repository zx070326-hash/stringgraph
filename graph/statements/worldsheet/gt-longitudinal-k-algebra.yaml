tags: [bosonic-string, spectrum-generating-algebra, longitudinal, no-ghost, oscillator-algebra, formalized]
notes: |
  ⚠【更正（reviewer-batch26，lead 落地）】statement (2) 括注「也是 (N) 在本卡唯一进入之处」**与 (3)(5) 矛盾**：(3) K₀ = 1 用 (N)+(S)，(5) [K,A] = 0 用 (N)+(T)（Lean `kOp_zero_eq_id hbb hba`、`lie_kOp_ddfOp hη hbb hεb`）。Lean docstring 原话是「only use of hbb **in the K-algebra**」，指 (6.3) 的三式；卡把范围放大了。正确读法：(N) 在 (6.3) 代数关系里唯一进入之处是 (2)。statement 按原则 1 不改。
  【为什么立卡（curator 2026-09-11，small-backlog-12；依 formal/BLUEPRINT-noghost.md §A.0/§A.1/§D.3 第 1 条）】
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的张成步（「塔上任意物理态 = DDF 态 + 零模态」）
  在文献侧的真实输入是 Goddard 2008 (6.2)(6.3) 的 K_n 代数，而不是 A^i_n 的对易关系
  （E7 按语）。图里此前**没有**任何承载 K_n 的节点，该推导的 notes【（七）】已自报
  「[K_m, A^ε_n] = 0 与领头项结构在图内均无节点」。本卡补上代数这一半；
  刻画 (6.2) 与 (B-26) 仍留在那条推导的 gaps 里（本卡「不断言 (a)」）。

  【蓝图 A.0 的文献裁决：本图走 K_m，不走 Brower 的 A^L_n】
  formal/BLUEPRINT-noghost.md §A.0 裁定 Lean 形式化取 K_m：(a) K_m 是 GT 路线的真实输入；
  (b) K_m 在 Lean 里几乎白送（§A.1）；(c) A^L_n 需要形式化 1/(k_0·P(z))，是全新构造（§A.3），
  且只服务于 D > 26 的负模构造，而那一条已由 LevelTwo.lean 走另一条路证完。
  本卡「不断言 (c)」即据此。**若日后要立 A^L_n 的卡**（蓝图 §D.3 第 2 条建议的
  `worldsheet.brower-longitudinal-operator`），其文献锚点是 Goddard 2008 (5.6)–(5.8)、(6.5)–(6.7)
  （E6/E8，L1），且 E6 按语提醒：Ã_n 不与 Virasoro 对易（(5.6) 右端非零）与
  worldsheet.ddf-transversality-gives-local-finiteness 的「模态和不局部有限」是**两种不同的失效模式**，
  不可混用。

  【D 的角色】(1)–(5) 对一切 D 成立（(N)(S) 与 D 无关；η_μ² = 1 对任意维数的对角度规成立）。
  D = 26 **不**进入本卡；它唯一进入的地方是 (B-26)（蓝图 §B.5）。

  【Lean 落地（2026-09-11 同日，formalizer-noghost-a 合入 main 于 6ed1638；本段取代原「预告」段）】
  formal/StringFormal/NoGhost/Longitudinal.lean 实现了蓝图 §A.1 的全部六条（`towerK` 落地改名 `kOp`）
  与 §A.2 的基础设施。**逐句字典**（本卡 status formalized 的依据）：
    · K_n = Σ_μ η_μ b^μ α^μ_n ⇒ `kOp η a b n := towerModeVec η a b b n`（`kOp_eq_towerModeVec`）；
    · (1) [L_m, K_n] = −n K_{m+n} ⇒ `lie_towerLop_kOp hη m n`（**本卡 lean_decl**）；
    · (2) [K_m, K_n] = 0 ⇒ `lie_kOp_kOp hη hbb m n`；
    · (3) K_0 = id ⇒ `kOp_zero_eq_id hbb hba`（环形式 `kOp_zero_eq_one`）；
    · (4) K_m† = K_{−m} ⇒ `towerPairing_kOp_left m v w`（塔上型 `Fock.towerPairing`）；
    · (5) [K_m, A^ε_n] = 0 ⇒ `lie_kOp_ddfOp hη hbb hεb m n`（算子形式 `kOp_mul_ddfOp`）。
  **三条比文献更精细的结论（Lean 逐条给出，文献一句带过）**：
    (a) **三条关系的假设集不同**：[L,K] 只需 `hη`（η_μ² = 1）；[K,K] = 0 另需 `hbb`（k_0² = 0，
        且这是 K 代数里 `hbb` 的**唯一**用处）；K_0 = 1 另需 `hba`（2α' k_0·p = 1）。
        本卡 (1)(2)(3) 的括注即按此写。
    (b) **K_0 = 1 比文献强**：Goddard 只在「动量 p 满足 k·p = 1 的态」上说 K_0 = 1；Lean 证的是
        **整条塔上的恒等算子**，因为 k_0·(p + N k_0) = k_0·p 沿塔不变
        （`dotVec_towerMomentum_right_of_isotropic`）。本卡 (3) 采 Lean 的强形式。
    (c) **[K, A] = 0 逐项对易，不需要望远镜和**：与 [L_m, A^ε_n] = 0（有望远镜求和与边界项）不同，
        K_m 与每个单项 α^ε_j V^{(n)}_j 逐项对易（`kOp_mul_ddfSummand`），只需取对 x 与 K_m x
        同时够大的窗口；两条几何输入各用一次（`hbb` 过顶点算子，`hεb` 过 α^ε_j）。
  **Lean 比本卡更一般的两处**（本卡是特例，故 formalized 成立）：`kOp` 对任意 b 有定义，(N)(S)
  只是定理假设（与 worldsheet.ddf-operators-v6 的处理一致）；(5) 对一切 m, n ∈ Z 含 n = 0。
  **Lean 另有而本卡不断言的**：`towerKerK = ⋂_{n>0} ker K_n`、`ddfCharacterization = 物理态 ⊓ towerKerK`
  是**定义**（Goddard (6.2) 的左端），`ddfOp_mem_towerKerK`、`ddfOp_mem_ddfCharacterization`、
  `single_vacuum_mem_towerKerK` 是「DDF 态满足 K 条件」那一侧的基础设施；
  **(6.2) 读成等式（= DDF 态张成）即 `ddf-spans`，未做**，本卡「不断言 (a)」不变，
  按 lead 指示**不**为 `ddfCharacterization` 另立「DDF 态刻画定理」卡。
  推导：--via-lean（formalized，best）；--via-mode-algebra（physical-argument）保留为文献侧记录。
  【2026-09-11（lean-wire-13）：**光锥标架代数**记在这里，不另立卡（curator）】
  formalizer-noghost-b 的 formal/StringFormal/NoGhost/LightCone.lean 把本卡的 K_m 放进完整的
  **光锥标架**里，并证出该标架上振子的全部对易表。**不为它们另立卡**的理由：
  它们与本卡 (1)(2) 一样，全部是同一条一般引理 `lie_towerModeVec_towerModeVec`
  在特殊偏振上的取值（本卡【定义】已写明 K_n 就是 `towerModeVec` 在 ε := b 处的值），
  另立卡会复制本卡整段设定却只换一个偏振向量，违反「一个节点一个命题」的精神。
  **对象**：`LightConeFrame η b` 是一对类光方向 (b, b̃)，逐字条件
    η(b,b) = 0、η(b̃,b̃) = 0、**η(b, b̃) = −1**（Lean 字段 `isotropic`/`conj_isotropic`/`pairing`）；
  `TransverseFrame η b` 是 D − 2 个偏振 ε_i，条件 η(ε_i, b) = 0 与 η(ε_i, ε_j) = δ_{ij}。
  记 K_m = α^b_m（本卡的纵向算子）、α^{b̃}_m、α^{ε_i}_m。
  **对易表**（m, n ∈ Z，全部在塔 T(p;k_0) 上，只需 (η) η_μ² = 1）：
    · [α^{b̃}_m, α^{b̃}_n] = 0                                   `lie_conjOp_conjOp`（用 b̃² = 0）；
    · **[K_m, α^{b̃}_n] = −m δ_{m+n,0}**                          `lie_kOp_conjOp`（−1 就是 η(b,b̃)）；
    · [α^{ε_i}_m, α^{ε_j}_n] = m δ_{ij} δ_{m+n,0}                `lie_transOp_transOp`（**正**中心项）；
    · [K_m, α^{ε_i}_n] = 0                                       `lie_kOp_transOp`（用横向性 (T)）。
  这四条**无额外假设**。第五条有：
    · [α^{b̃}_m, α^{ε_i}_n] = 0                                   `lie_conjOp_transOp`，
      **需要额外的 η(b̃, ε_i) = 0**——`TransverseFrame` 只要求 ε_i ⊥ b，**不**要求 ε_i ⊥ b̃。
      显式见证满足它，但一般标架下这是独立条件（与
      worldsheet.transverse-frame-spans-orthogonal-complement 记的完备性是同一类缺口）。
  **与本卡断言的关系**：本卡 (2) [K_m, K_n] = 0 就是上表缺的那一格（`lie_kOp_kOp`，需 (N)）；
  上表新增的是 b̃ 与 ε 两个方向。本卡 (1)(3)(4)(5) 不受影响。
  **两条配套读数**（同文件，本卡不断言，登记备查）：
    · `conjCoeff_eq_neg_dotVec`：向量 v 的 **b̃-分量是 −η(b, v)**；
    · `conjCoeff_towerMomentum`：由 (S) η(b,a) = 1，塔上**每一层**的动量的 b̃-分量都是 **−1**
      （用 (N) 沿塔不变）。这正是蓝图 §B.4 里「L_{−n} = −α^{b̃}_{−n} + …」的领头系数来源。
  ⚠ `conjCoeff_eq_neg_dotVec` **不假设** {b, b̃, ε_i} 是基：它只从**给定的**分解里取系数。
  「每个向量都能分解」是另一件事（完备性），见上引卡。
  ⚠ b̃ 的**存在性**不在本卡也不在 worldsheet.ddf-hypotheses-satisfiable 的断言里
  （该卡【不断言】(c)）：见证是 Witness.lean 的 `noghost_lightcone_frame_satisfiable`，
  Lean 侧由 `witnessLightConeFrame` 打包成 `LightConeFrame` 实例，故上表非空。
  **用途**：这张表是蓝图 §B.4「幺三角基变换」的代数输入，而那一步**仍未证**
  （LightCone.lean 文件头 Scope 段末条逐字：the unitriangularity … is **not** proved）。

  【2026-09-12 追记（curator，分支 agent/curator/pr34-wire，PR4 落地后）：Goddard (6.2) 刻画
  「K-条件 = 不含 α^{b̃}」现有其 ⊇ 半的 Lean 定理，⊆ 半仍缺，缺口精确定位到光锥单项式线性无关性】
  formal/StringFormal/NoGhost/SpuriousElimination.lean（蓝图 §B′ PR4，「Bonus: half of
  Goddard (6.2)」一节，`[CommRing R]`）证出
    **`conjFreeSlice_le_towerKerK_inf_towerBigrade`**（hD : 2 ≤ D，标架 F : DDFLightConeFrame η a b，
    N ∈ ℕ）：conjFreeSlice hD F N ≤ towerKerK η a b ⊓ towerBigrade D R (−N) N，
  即「反对角片上不含 b̃ 方向的光锥单项式张成 ⟹ 满足全部 K_n（n>0）条件」，铺垫引理
  `single_lcMonomial_mem_towerKerK`（对单个光锥单项式的强归纳：层真空被每个 n>0 的 K_n 湮灭，
  K_n 与「乘以不含 b̃ 方向的产生算子」对易——本卡上表 `lie_kOp_transOp`（横向方向）与
  `dotVec_light_frameVec_of_ne` 补上的「K_n 与 α^b_{−r} 本身也对易，因 η(b,b)=0」两条合起来
  覆盖除 b̃ 之外的每个方向）。**这正是本卡断言 (5) [K_m, A^ε_n] = 0 与 K_n 自身湮灭真空
  两件事沿光锥单项式结构逐层展开后的推论，不是本卡断言集合之外的新事实**——本卡不因此
  改写断言，只在此记账其一个具体推论已形式化。
  ⚠ **⊆ 半没有**：`SpuriousElimination.lean` 该节 docstring 原话「The reverse inclusion
  `towerKerK ⊓ towerBigrade ≤ conjFreeSlice` is *not* proved: it needs linear independence
  of the light-cone monomials, which has no cheap proof (blueprint §B′.9 item 2) and is
  deliberately off the critical path」——即 `towerKerK_inf_towerBigrade_eq_conjFree`
  这条等式只有一半有 Lean 定理，另一半（含 b̃ 方向的光锥单项式若混进 K-核里就必须系数为零，
  需要光锥单项式作为一个整体线性无关）与
  worldsheet.light-cone-monomials-span-fock-level 的 notes【本卡明确不断言】(d)
  以及 worldsheet.physical-slice-bounded-by-transverse-count 的【不断言】(d) 记的是
  **同一处缺口**：光锥单项式的张成（span）已 formalized（那两张卡），线性无关（independence）
  未做，二者合起来才是「基」。
  ⚠ **本条不改动本卡断言表**（(a)「不断言 (6.2) 的刻画」原文不变，这是刻意的边界，
  上面这条 Lean 定理只是 (6.2) 左端「⊇」那一半的具体见证，不构成对本卡（1）–（5）的推翻或加强，
  也不改变本卡 status/effective = formalized，只是把「若日后要立 (6.2) 刻画卡」这件事
  （notes 上文【Lean 落地】末段已声明「按 lead 指示不另立卡」）的已知内容精确记账一遍。

