id: worldsheet.gt-longitudinal-k-algebra
kind: proposition
title: Goddard–Thorn 纵向算子 K_n = k_0·α_n 的代数（Goddard 2008 (6.2)(6.3)）：[L_m, K_n] = −n K_{m+n}、[K_m, K_n] = 0、K_0 = 1（在 2α' k_0·p = 1 的动量塔上）、K_m† = K_{−m}、[K_m, A^ε_n] = 0
statement: |
  【设定】记号与数据沿用 worldsheet.ddf-operators-v6 与 worldsheet.momentum-tower-fock-space：
  D ∈ N；系数环 R 是交换 Q-代数；对角时空度规分量 η_μ 满足 η_μ² = 1
  （conv.metric-mostly-plus 下 η = diag(−1,+1,…,+1)）；α'（conv.alpha-prime-regge）；
  基点动量 p 与参考向量 k_0；重标度向量 a^μ := (2α')^{1/2} p^μ、b^μ := (2α')^{1/2} k_0^μ；
  动量塔 T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)，第 N 层的零模 α^μ_0|_N = (2α')^{1/2}(p + N k_0)^μ；
  ⟨·,·⟩_T 是塔上层间正交的双线性型（worldsheet.momentum-tower-fock-space (2)）；
  L_m 是逐层作用的 Sugawara 算子（worldsheet.virasoro-generators-free-boson，
  零模取该层的动量）；V^{(n)}_K 是 :e^{i n k_0·X(z)}: 在塔上的 z^K 洛朗系数；
  A^ε_n = Σ_m α^ε_m V^{(n)}_m 是 DDF 算子（worldsheet.ddf-operators-v6，横向性 ε·k_0 = 0
  是其定义的参数）。两个条件按 worldsheet.ddf-operators-v6 的记法：
    (N) 类光性  k_0² = 0        （等价：η(b, b) = 0），
    (S) 归一化  2α' k_0·p = 1   （等价：η(b, a) = 1）。

  【定义】对每个 n ∈ Z 定义**纵向算子**
    K_n := k_0 · α_n 的重标度版  =  Σ_μ η_μ b^μ α^μ_n  =  (2α')^{1/2} k_0·α_n ,
  即 worldsheet.ddf-operators-v6 的偏振收缩模 α^ε_n 在**偏振取参考向量自身** ε := b 处的取值。
  它逐层作用、不移动层指标；n = 0 时 K_0|_N = η(b, a + N b) 是第 N 层上的标量。
  （Goddard 2008 在 α' = 1/2 下写作 K_n = k·a_n；那里 (2α')^{1/2} = 1，两种写法逐字一致。）

  【断言】在 T(p; k_0) 上：
    (1) **与 Virasoro 的对易关系**：对一切 m, n ∈ Z，
          [L_m, K_n] = −n K_{m+n}。
        （只用 η_μ² = 1，**不需要** (N)(S)；这是 Goddard 2008 (6.3) 第二式。）
    (2) **K 之间对易**：设 (N)。则对一切 m, n ∈ Z，
          [K_m, K_n] = 0。
        （中心项本为 m η(b,b) δ_{m+n,0}，由 (N) 消失；这是 (6.3) 第三式，
        也是 (N) 在本卡唯一进入之处。）
    (3) **零模是恒等算子**：设 (N) 与 (S)。则
          K_0 = id_{T(p;k_0)}，
        即 K_0 在**每一层**都等于 1：η(b, a + N b) = η(b,a) + N η(b,b) = 1 + 0。
        （这是 Goddard 2008 §5 的适用条件 k·p = 1 在整条塔上的表现。）
    (4) **伴随**：对一切 m ∈ Z 与一切 v, w ∈ T(p;k_0)，
          ⟨ K_m v , w ⟩_T = ⟨ v , K_{−m} w ⟩_T，   即 K_m† = K_{−m}。
        （不需要任何条件；是 (α^μ_n)† = α^μ_{−n} 的线性组合。）
    (5) **与横向 DDF 算子对易**：设 (N)，并设 ε 满足横向性 ε·k_0 = 0（等价 η(ε, b) = 0）。
        则对一切 m, n ∈ Z，
          [K_m, A^ε_n] = 0。
        （两个输入各用一次：(N) 使 K_m 穿过顶点算子 V^{(n)}_j——
        [K_m, V^{(n)}_j] = n η(b,b) V^{(n)}_{j−m} = 0；横向性使 K_m 与 α^ε_j 对易——
        [K_m, α^ε_j] = m η(b,ε) δ_{m+j,0} = 0。）

  由 (1)(2) 与 Virasoro 关系 [L_m, L_n] = (m−n)L_{m+n} + (D/12) m(m²−1) δ_{m+n,0}
  （worldsheet.free-boson-central-charge-d），{L_m} ∪ {K_n} 张成 Virasoro 代数的一个扩张
  （Goddard 2008 的措辞 "an extension of the Virasoro algebra"）；本卡不给这个扩张命名。

  【本卡明确不断言】
  (a) **不断言 (6.2) 的刻画**「DDF 态张成的空间 = 物理态条件 + K_n|ψ⟩ = 0（n > 0）」——
      那是 Goddard–Thorn 无鬼定理证明的承重步骤（(B-26)，见
      worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 gaps），本卡只给代数。
  (b) **不断言 K_n|0;k⟩ = 0（n > 0）**：它是「每个 α^μ_n（n > 0）湮灭真空」的平凡推论，
      属 worldsheet.bosonic-fock-space 的定义内容，本卡不重复。
  (c) **不断言 Brower 的纵向算子 A^L_n = Ã_n + F_n** 及其代数 (6.5)–(6.7)
      （Goddard 2008 §6 p.16；brower-1972）。**K_n 与 A^L_n 是两个不同的对象**：
      K_n 是振子的线性组合，**不**与 Virasoro 对易（(1) 右端非零）；A^L_n 是修正后的
      顶点算子构造，与 L_m 对易。文献里「纵向」一词两者都用，引用时必须分清。
  (d) 不断言任何关于 H_phys、零模态或 D = 26 的事：(1)–(5) **对一切 D 成立**。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard]
sources:
  - ref: goddard-2008
    loc: "§6 'No-Ghost Theorem', p.15, eq. (6.2)–(6.3)（arXiv:0802.3249v1）：逐字 'The space generated by the DDF states can be specified by imposing the conditions (6.2) K_n|ψ⟩ = 0, n > 0, in addition to the physical state conditions (4.1). The K_n together with the L_n form an extension of the Virasoro algebra, (6.3) [L_m, L_n] = (m−n)L_{m+n} + (D/12) m(m²−1) δ_{m,−n}, [L_m, K_n] = −n K_{m+n}, [K_m, K_n] = 0.'；K_m = k·a_m 的定义在 §5, p.12, (5.7) 后正文（逐字 'some function F_n of the K_m = k·a_m'）"
    note: |
      L1 逐字（researcher 2026-09-11 逐页读图，literature/extractions/gsw-1987-v1.md §2 **E7**；
      K_m 的定义句在 **E6**）。**本卡断言 (1)(2) 就是 (6.3) 的第二、三式**，逐字有源。
      号差逐字 signature (−,+,+,+) = mostly-plus，与 conv.metric-mostly-plus 一致，无需换算；
      α' = 1/2，故 (2α')^{1/2} = 1，其 K_n = k·a_n 即本卡的 K_n。
      ⚠ **(6.3) 无证明**（历史综述）；E7 按语：「(6.3) 的 [L_m, K_n] = −n K_{m+n} 是 GT 证明
      真正用的代数，不是 A^i_n 的对易关系」。
      ⚠ **断言 (3)(4)(5) 在该文中没有显示公式**：(3) 是 §5 p.11 逐字适用条件 'states of
      momentum p, such that k·p = 1' 与 (5.3) 中 P^μ(z) 的零模 p^μ 合起来的直接读数
      （E6 另有逐字 'The k components essentially vanish: k·A_n = k·p δ_{n,0}'，是同一事实在
      DDF 算子上的表现）；(4) 是 §1 (1.1) 后逐字 'a^{μ+}_n = a^μ_{−n}' 与 k 为实向量的线性组合
      （E5 备注）；(5) 该文未写，本图由模代数补出（见推导）。
  - ref: goddard-thorn-1972
    loc: "无编号；正文未获取（摘要不提 K_n）"
    note: |
      Goddard 2008 §6 把 (6.2)(6.3) 的框架归给 [45] = 本文（逐字 'Having formulated the problem
      like this, we were able to prove the No-Ghost Theorem [45]'）。正文四条获取路径全部失败
      （literature/extractions/brst-cohomology-sources.md §3.1），**本条只承担归属，不承载论证**。
  - ref: stringformal-2026
    loc: "formal/BLUEPRINT-noghost.md §A.1（`towerK η a b m := towerModeVec η a b b m` 与 A1.1–A1.6 六条引理的蓝图）；既有声明 formal/StringFormal/NoGhost/DDFOperator.lean :: StringFormal.NoGhost.{towerModeVec, lie_towerLop_towerModeVec, lie_towerModeVec_towerVertex}、formal/StringFormal/NoGhost/DDFAlgebra.lean :: StringFormal.NoGhost.lie_towerModeVec_towerModeVec、formal/StringFormal/NoGhost/DDF.lean :: StringFormal.NoGhost.dotVec_towerMomentum_right_of_isotropic、formal/StringFormal/NoGhost/VertexAdjoint.lean :: StringFormal.NoGhost.Fock.towerPairing_towerModeVec_left"
    note: |
      蓝图（formalizer，分支 agent/formalizer/noghost-blueprint，合并于 f36a958）的关键观察：
      **K_m 就是 `towerModeVec` 在 ε := b 处的取值**，类光条件 `hbb : dotVec η b b = 0`
      恰是「b 对自己横向」，故本卡 (1)(2)(4) 是既有引理的直接特例，(3) 由
      `dotVec_towerMomentum_right_of_isotropic` 与 `hba` 得出，(5) 需一个窗口论证（A1.5）。
      ⚠ **本条列出的是已在 main 上、无 sorry 的既有声明，不是本卡的 lean_decl**：
      `towerK` 及 A1.1–A1.6 尚未落地（formalizer-noghost-a 进行中，目标文件
      formal/StringFormal/NoGhost/Longitudinal.lean）。届时由 formalizer 填 formal.lean_decl 并
      挂 --via-lean 推导；**本卡当前不写 formal 字段**。
tags: [bosonic-string, spectrum-generating-algebra, longitudinal, no-ghost, oscillator-algebra]
notes: |
  【为什么立卡（curator 2026-09-11，small-backlog-12；依 formal/BLUEPRINT-noghost.md §A.0/§A.1/§D.3 第 1 条）】
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的张成步（「塔上任意物理态 = DDF 态 + 零模态」）
  在文献侧的真实输入是 Goddard 2008 (6.2)(6.3) 的 K_n 代数，而不是 A^i_n 的对易关系
  （E7 按语）。图里此前**没有**任何承载 K_n 的节点，该推导的 notes【（七）】已自报
  「[K_m, A^ε_n] = 0 与领头项结构在图内均无节点」。本卡补上代数这一半；
  刻画 (6.2) 与 (B-26) 仍留在那条推导的 gaps 里（本卡「不断言 (a)」）。

  【蓝图 A.0 的文献裁决：本图走 K_m，不走 Brower 的 A^L_n】
  formal/BLUEPRINT-noghost.md §A.0 裁定 Lean 形式化取 K_m：(a) K_m 是 GT 路线的真实输入；
  (b) K_m 在 Lean 里几乎白送（§A.1）；(c) A^L_n 需要形式化 1/(k_0·P(z))，是全新构造（§A.3），
  且只服务于 D > 26 的负模构造，而那一条已由 LevelTwo.lean 走另一条路证完。
  本卡「不断言 (c)」即据此。**若日后要立 A^L_n 的卡**（蓝图 §D.3 第 2 条建议的
  `worldsheet.brower-longitudinal-operator`），其文献锚点是 Goddard 2008 (5.6)–(5.8)、(6.5)–(6.7)
  （E6/E8，L1），且 E6 按语提醒：Ã_n 不与 Virasoro 对易（(5.6) 右端非零）与
  worldsheet.ddf-transversality-gives-local-finiteness 的「模态和不局部有限」是**两种不同的失效模式**，
  不可混用。

  【D 的角色】(1)–(5) 对一切 D 成立（(N)(S) 与 D 无关；η_μ² = 1 对任意维数的对角度规成立）。
  D = 26 **不**进入本卡；它唯一进入的地方是 (B-26)（蓝图 §B.5）。

  【Lean 侧（预告，不是本卡的依据）】
  formalizer-noghost-a 正在 formal/StringFormal/NoGhost/Longitudinal.lean 实现蓝图 §A.1 的
  `towerK` 与 A1.1–A1.6（claim #357）。落地并合入 main 后：
    · 本卡加 `formal.lean_decl`（预计 `StringFormal.NoGhost.towerK`，配套
      `lie_towerLop_towerK`、`lie_towerK_towerK`、`towerK_zero_eq_id`、`towerPairing_towerK_left`、
      `lie_towerK_ddfOp`）；
    · 新挂推导 worldsheet.gt-longitudinal-k-algebra--via-lean（status formalized），
      现有 --via-mode-algebra 保留为文献侧记录。
  ⚠ Lean 的 `towerK` 对任意 b 有定义（不假设 (N)(S)），(2)(3)(5) 的假设只出现在定理里，
  与 worldsheet.ddf-operators-v6 对 (N)(S) 的处理方式一致。
