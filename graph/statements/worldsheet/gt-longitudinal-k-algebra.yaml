  - ref: stringformal-2026
    loc: "formal/BLUEPRINT-noghost.md §A.1（`towerK η a b m := towerModeVec η a b b m` 与 A1.1–A1.6 六条引理的蓝图）；既有声明 formal/StringFormal/NoGhost/DDFOperator.lean :: StringFormal.NoGhost.{towerModeVec, lie_towerLop_towerModeVec, lie_towerModeVec_towerVertex}、formal/StringFormal/NoGhost/DDFAlgebra.lean :: StringFormal.NoGhost.lie_towerModeVec_towerModeVec、formal/StringFormal/NoGhost/DDF.lean :: StringFormal.NoGhost.dotVec_towerMomentum_right_of_isotropic、formal/StringFormal/NoGhost/VertexAdjoint.lean :: StringFormal.NoGhost.Fock.towerPairing_towerModeVec_left"
    note: |
      蓝图（formalizer，分支 agent/formalizer/noghost-blueprint，合并于 f36a958）的关键观察：
      **K_m 就是 `towerModeVec` 在 ε := b 处的取值**，类光条件 `hbb : dotVec η b b = 0`
      恰是「b 对自己横向」，故本卡 (1)(2)(4) 是既有引理的直接特例，(3) 由
      `dotVec_towerMomentum_right_of_isotropic` 与 `hba` 得出，(5) 需一个窗口论证（A1.5）。
      ⚠ 本条列出的是蓝图所依赖的**既有一般引理**；蓝图中的 `towerK` 落地时改名为 `kOp`
      （Longitudinal.lean，见上一条 source），本卡 formal.lean_decl 指后者。
      【2026-09-11 同日更新】原「本卡当前不写 formal 字段」的说法已过时：formalizer-noghost-a 已合 main。
tags: [bosonic-string, spectrum-generating-algebra, longitudinal, no-ghost, oscillator-algebra, formalized]
notes: |
  【为什么立卡（curator 2026-09-11，small-backlog-12；依 formal/BLUEPRINT-noghost.md §A.0/§A.1/§D.3 第 1 条）】
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的张成步（「塔上任意物理态 = DDF 态 + 零模态」）
  在文献侧的真实输入是 Goddard 2008 (6.2)(6.3) 的 K_n 代数，而不是 A^i_n 的对易关系
  （E7 按语）。图里此前**没有**任何承载 K_n 的节点，该推导的 notes【（七）】已自报
  「[K_m, A^ε_n] = 0 与领头项结构在图内均无节点」。本卡补上代数这一半；
  刻画 (6.2) 与 (B-26) 仍留在那条推导的 gaps 里（本卡「不断言 (a)」）。

  【蓝图 A.0 的文献裁决：本图走 K_m，不走 Brower 的 A^L_n】
  formal/BLUEPRINT-noghost.md §A.0 裁定 Lean 形式化取 K_m：(a) K_m 是 GT 路线的真实输入；
  (b) K_m 在 Lean 里几乎白送（§A.1）；(c) A^L_n 需要形式化 1/(k_0·P(z))，是全新构造（§A.3），
  且只服务于 D > 26 的负模构造，而那一条已由 LevelTwo.lean 走另一条路证完。
  本卡「不断言 (c)」即据此。**若日后要立 A^L_n 的卡**（蓝图 §D.3 第 2 条建议的
  `worldsheet.brower-longitudinal-operator`），其文献锚点是 Goddard 2008 (5.6)–(5.8)、(6.5)–(6.7)
  （E6/E8，L1），且 E6 按语提醒：Ã_n 不与 Virasoro 对易（(5.6) 右端非零）与
  worldsheet.ddf-transversality-gives-local-finiteness 的「模态和不局部有限」是**两种不同的失效模式**，
  不可混用。

  【D 的角色】(1)–(5) 对一切 D 成立（(N)(S) 与 D 无关；η_μ² = 1 对任意维数的对角度规成立）。
  D = 26 **不**进入本卡；它唯一进入的地方是 (B-26)（蓝图 §B.5）。

  【Lean 落地（2026-09-11 同日，formalizer-noghost-a 合入 main 于 6ed1638；本段取代原「预告」段）】
  formal/StringFormal/NoGhost/Longitudinal.lean 实现了蓝图 §A.1 的全部六条（`towerK` 落地改名 `kOp`）
  与 §A.2 的基础设施。**逐句字典**（本卡 status formalized 的依据）：
    · K_n = Σ_μ η_μ b^μ α^μ_n ⇒ `kOp η a b n := towerModeVec η a b b n`（`kOp_eq_towerModeVec`）；
    · (1) [L_m, K_n] = −n K_{m+n} ⇒ `lie_towerLop_kOp hη m n`（**本卡 lean_decl**）；
    · (2) [K_m, K_n] = 0 ⇒ `lie_kOp_kOp hη hbb m n`；
    · (3) K_0 = id ⇒ `kOp_zero_eq_id hbb hba`（环形式 `kOp_zero_eq_one`）；
    · (4) K_m† = K_{−m} ⇒ `towerPairing_kOp_left m v w`（塔上型 `Fock.towerPairing`）；
    · (5) [K_m, A^ε_n] = 0 ⇒ `lie_kOp_ddfOp hη hbb hεb m n`（算子形式 `kOp_mul_ddfOp`）。
  **三条比文献更精细的结论（Lean 逐条给出，文献一句带过）**：
    (a) **三条关系的假设集不同**：[L,K] 只需 `hη`（η_μ² = 1）；[K,K] = 0 另需 `hbb`（k_0² = 0，
        且这是 K 代数里 `hbb` 的**唯一**用处）；K_0 = 1 另需 `hba`（2α' k_0·p = 1）。
        本卡 (1)(2)(3) 的括注即按此写。
    (b) **K_0 = 1 比文献强**：Goddard 只在「动量 p 满足 k·p = 1 的态」上说 K_0 = 1；Lean 证的是
        **整条塔上的恒等算子**，因为 k_0·(p + N k_0) = k_0·p 沿塔不变
        （`dotVec_towerMomentum_right_of_isotropic`）。本卡 (3) 采 Lean 的强形式。
    (c) **[K, A] = 0 逐项对易，不需要望远镜和**：与 [L_m, A^ε_n] = 0（有望远镜求和与边界项）不同，
        K_m 与每个单项 α^ε_j V^{(n)}_j 逐项对易（`kOp_mul_ddfSummand`），只需取对 x 与 K_m x
        同时够大的窗口；两条几何输入各用一次（`hbb` 过顶点算子，`hεb` 过 α^ε_j）。
  **Lean 比本卡更一般的两处**（本卡是特例，故 formalized 成立）：`kOp` 对任意 b 有定义，(N)(S)
  只是定理假设（与 worldsheet.ddf-operators-v6 的处理一致）；(5) 对一切 m, n ∈ Z 含 n = 0。
  **Lean 另有而本卡不断言的**：`towerKerK = ⋂_{n>0} ker K_n`、`ddfCharacterization = 物理态 ⊓ towerKerK`
  是**定义**（Goddard (6.2) 的左端），`ddfOp_mem_towerKerK`、`ddfOp_mem_ddfCharacterization`、
  `single_vacuum_mem_towerKerK` 是「DDF 态满足 K 条件」那一侧的基础设施；
  **(6.2) 读成等式（= DDF 态张成）即 `ddf-spans`，未做**，本卡「不断言 (a)」不变，
  按 lead 指示**不**为 `ddfCharacterization` 另立「DDF 态刻画定理」卡。
  推导：--via-lean（formalized，best）；--via-mode-algebra（physical-argument）保留为文献侧记录。
