  - ref: goddard-2008
    loc: "§6 'No-Ghost Theorem', p.15, eq. (6.2)–(6.3)（arXiv:0802.3249v1）：逐字 'The space generated by the DDF states can be specified by imposing the conditions (6.2) K_n|ψ⟩ = 0, n > 0, in addition to the physical state conditions (4.1). The K_n together with the L_n form an extension of the Virasoro algebra, (6.3) [L_m, L_n] = (m−n)L_{m+n} + (D/12) m(m²−1) δ_{m,−n}, [L_m, K_n] = −n K_{m+n}, [K_m, K_n] = 0.'；K_m = k·a_m 的定义在 §5, p.12, (5.7) 后正文（逐字 'some function F_n of the K_m = k·a_m'）"
    note: |
      L1 逐字（researcher 2026-09-11 逐页读图，literature/extractions/gsw-1987-v1.md §2 **E7**；
      K_m 的定义句在 **E6**）。**本卡断言 (1)(2) 就是 (6.3) 的第二、三式**，逐字有源。
      号差逐字 signature (−,+,+,+) = mostly-plus，与 conv.metric-mostly-plus 一致，无需换算；
      α' = 1/2，故 (2α')^{1/2} = 1，其 K_n = k·a_n 即本卡的 K_n。
      ⚠ **(6.3) 无证明**（历史综述）；E7 按语：「(6.3) 的 [L_m, K_n] = −n K_{m+n} 是 GT 证明
      真正用的代数，不是 A^i_n 的对易关系」。
      ⚠ **断言 (3)(4)(5) 在该文中没有显示公式**：(3) 是 §5 p.11 逐字适用条件 'states of
      momentum p, such that k·p = 1' 与 (5.3) 中 P^μ(z) 的零模 p^μ 合起来的直接读数
      （E6 另有逐字 'The k components essentially vanish: k·A_n = k·p δ_{n,0}'，是同一事实在
      DDF 算子上的表现）；(4) 是 §1 (1.1) 后逐字 'a^{μ+}_n = a^μ_{−n}' 与 k 为实向量的线性组合
      （E5 备注）；(5) 该文未写，本图由模代数补出（见推导）。
  - ref: goddard-thorn-1972
    loc: "无编号；正文未获取（摘要不提 K_n）"
