id: worldsheet.tower-vertex-weighted-mode-sum
kind: proposition
title: 塔上顶点算子的**指标加权和**：k_0² = 0、2α' k_0·p = 1 ⟹ Σ_j j V^{(m)}_j V^{(n)}_{−j} = m δ_{m+n,0}（"全导数留数为零"的纯代数版本）
statement: |
  【设定】按 worldsheet.momentum-tower-fock-space 取沿参考向量 k_0 的动量塔
    T(p; k_0) = ⊕_{N ∈ Z} F(p + N k_0)，
  系数环 R 是交换 ℚ-代数，对角时空度规分量 η_μ **满足 η_μ² = 1**（conv.metric-mostly-plus）。
  按 conv.alpha-prime-regge 记重标度向量
    a^μ := (2α')^{1/2} p^μ,   b^μ := (2α')^{1/2} k_0^μ。
  对每个 n ∈ Z 记 V^{(n)}_K（K ∈ Z）为塔上顶点算子 :e^{i n k_0·X(z)}: 的 z^K 洛朗系数
  （z^K-系数约定，与 worldsheet.ddf-operators-v6 同一约定；Lean 侧 `towerVertex η b n K`）。
  记 towerLevelBound(x)、towerModeBound(x) 为塔矢量 x 的逐层 level / mode 界的上确界
  （x 只有限多层非零）。

  【断言】设

      (T)  k_0² = 0            （等价 b·b = 0，参考向量类光），
      (N)  2α' k_0·p = 1       （等价 b·a = 1，DDF 归一化）。

  则对一切 m, n ∈ Z，作为 T(p; k_0) 上的算子恒等式

      **Σ_{j ∈ Z} j · V^{(m)}_j V^{(n)}_{−j}  =  m · δ_{m+n, 0} · id** 。

  更精确地（有限和形式，这是 Lean 侧的语句）：对每个 x ∈ T(p; k_0) 与任何包含窗口

      m − towerLevelBound(x) − towerModeBound(x)  ≤  j  ≤  towerLevelBound(x) − n

  的有限指标集 s ⊂ Z，都有 Σ_{j ∈ s} j · ( V^{(m)}_j V^{(n)}_{−j} ) x = (m 若 m+n = 0，否则 0) · x。
  ⚠ 被求和项本身在 j < m − towerLevelBound(x) 处已为零；窗口下端多留的
  towerModeBound(x) 余量是**中间步骤的二重和**需要的（见下面【为什么窗口要多留余量】），
  对调用者无代价。

  【右端两项各自的来历——这一段是陈述的一部分】
  · **δ_{m+n,0}**：m + n ≠ 0 时整个和为零。这是"Σ_J (k_0·α_{−J}) V^{(m+n)}_{−J} 是全导数、
    留数为零"的代数版本：把权恒等式
    （worldsheet.exponential-vertex-operator-current-weight-identity 的塔上形式）
    用在动量 m+n、指标 K = 0 上，得 (m+n) Σ_J (k_0·α_{−J}) V^{(m+n)}_{−J} = 0 · V^{(m+n)}_0 = 0，
    再在 ℚ-代数里除掉 m+n。
  · **m**：m + n = 0 时指数退化为恒等（V^{(0)}_K = δ_{K,0}），只剩电流的零模
    k_0·α_0 = 2α' k_0·p = 1，前面的因子 m 来自电流对动量的线性。
  ⇒ **(N) 恰好、且只在这一处承重**：等式右端的那个 m 就是从 2α' k_0·p = 1 来的。

  【为什么这不是同点乘积 (5a) 的推论——这一段是陈述的一部分】
  朴素想法是"对同点乘积 Σ_{J+K=L} V^{(m)}_J V^{(n)}_K = V^{(m+n)}_L 用 ⁅L_0, ·⁆"。
  **这条路走不通**：L_0 对乘积按 Leibniz 作用，只看到两个因子共形权的**和**
  （在 L = 0 处退化成 0 = 0，两个未知量一个方程）；而本卡把权放在**一个**因子上（那个 j）。
  必须把电流 k_0·∂X 作为**新对象**引入，即
  worldsheet.exponential-vertex-operator-current-weight-identity 的内容。
  ⇒ 本卡与 worldsheet.isotropic-tower-vertex-operator-fusion 是**两条独立事实**，
  后者只是前者证明中的一步（融合两个指数）。

  【为什么窗口要多留余量（局部有限性的实质内容）】
  证明中间出现对 (j, J) 的**二重和**。若把电流留在最右边，则 J-求和的下端截断依赖
  V^{(n)}_{−j} x 的 mode 界，而后者随 j → −∞ 发散，窗口的选取会**循环**。
  打破循环的办法是用"电流与两个顶点算子都对易"把电流一路交换到 x 上，
  下端于是变成 −towerModeBound(x)，**与 j 无关**。
  ⇒ 这一步在纸上推导里从不出现，是形式化层面的发现；陈述里的窗口余量就是它的痕迹。

  【本节点明确不断言】
  (a) **(T) 或 (N) 不成立时的任何结论**。特别地不断言"k_0² ≠ 0 时本式为假"。
  (b) **[A^ε_m, A^δ_n] = m(ε·δ)δ_{m+n,0}**。本卡是那条链的第 (5b) 步、也是最后一块**数学**输入；
      把它接到 A^ε_n 上还需要双重局部有限和的 Leibniz 组装，**未做**，
      见 worldsheet.ddf-transverse-oscillator-algebra-v2 与 notes。
  (c) **任何围道/留数的解析陈述**。上面写的"全导数留数为零"是**读法**，
      本卡的内容是代数恒等式：没有围道、没有 z、没有解析延拓。
  (d) **余循环 / Klein 因子 / 一般动量格 / Heisenberg 零模**。塔建在**固定的** p 与 k_0 上；
      x^μ 只以层移位 e^{i n k_0·x} 的形式出现，[x^μ, p^ν] 未形式化。
  (e) **收敛性、完化、幺正性、号差、伴随**。T(p;k_0) 是代数直和，逐向量是有限和；
      η_μ 只是 R 中一族满足 η_μ² = 1 的元素。
  (f) **m, n ≠ 0 的限制不是本卡的假设**：本卡对一切 m, n ∈ Z 成立（含 m = 0，此时右端为 0
      除非 n = 0，而 m = n = 0 时右端也是 0）。下游 DDF 算子那里才有 n ≠ 0 的限制。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
