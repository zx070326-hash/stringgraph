sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/VertexWeightedSum.lean :: StringFormal.NoGhost.sum_weighted_towerVertex_towerVertex（本卡 formal.lean_decl）；塔上权恒等式 StringFormal.NoGhost.{towerCurrent, towerCurrent_single, towerCurrent_zero_of_normalized, towerCurrent_apply_eq_zero_of_lt, towerCurrent_towerVertex_comm, towerCurrent_towerVertex_apply_eq_zero_of_notMem, towerCurrentVertex, towerCurrentVertex_apply, towerCurrentVertex_eq}；零动量退化 StringFormal.NoGhost.Fock.{expWeight_zero_momentum, creaExp_zero_momentum, vertexOsc_zero_momentum} 与 StringFormal.NoGhost.towerVertex_zero_momentum；局部有限性 StringFormal.NoGhost.towerVertex_towerVertex_apply_eq_zero_of_lt；ℚ-代数的除法 StringFormal.NoGhost.eq_zero_of_intCast_smul_eq_zero；动量算术 StringFormal.NoGhost.{dotVec_vertexMomentum_left, dotVec_vertexMomentum_right}"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry。该文件 799 行 / 35 条声明，formalizer 自述
      2026-09-11 用 `--import StringFormal.NoGhost.VertexWeightedSum --all` 复核公理只有标准三条；
      lead 以 **28bc556**（"merge: weighted vertex-operator mode sum (DDF step 5b) via
      current-weight identity (VertexWeightedSum.lean, 35 decls)"）合入 main
      （formal 侧提交链 e7909ad → 7c8024d）。
      `sum_weighted_towerVertex_towerVertex` 语句逐字（去掉隐式参数）：
        `(η a b : Fin D → R) (hη : ∀ μ, η μ * η μ = 1) (hbb : dotVec η b b = 0)
         (hba : dotVec η b a = 1) (m n : ℤ) (x : TowerFock D R) {s : Finset ℤ}
         (hs : ∀ j : ℤ, m - (towerLevelBound x : ℤ) - (towerModeBound x : ℤ) ≤ j →
           j ≤ (towerLevelBound x : ℤ) - n → j ∈ s) :
         ∑ j ∈ s, (j : R) • (towerVertex η b m j * towerVertex η b n (-j)) x
           = (if m + n = 0 then (m : R) else 0) • x`，
      **假设恰好是 `hη`、`hbb`（= 本卡 (T)）、`hba`（= 本卡 (N)）三条**，
      m、n 无任何限制。与本卡断言逐字一致（本卡 (f) 即 "m、n 无限制" 这一点）。
      ★ 本卡【右端两项各自的来历】与【为什么这不是 (5a) 的推论】两段的逐字来源是该定理
      所在 `WeightedSum` 节的段首 docstring 与文件头 "Mathematical remarks" 第 1 条：
      「**(5b) is not a corollary of (5a).** The obvious attempt — apply `⁅L_0, V_K⁆ = K V_K`
      to the same-point product — gives `T_L + U_L = L S_L` with two unknowns, and degenerates
      to `0 = 0` at `L = 0` … The current `k_0·∂X` must be introduced as a new object …
      (Independently re-derived here; it confirms the note left in `formal/TODO.md`.)」
      ★ 本卡【为什么窗口要多留余量】一段的来源是 formal/TODO.md (5b) 的「数学要点」第 3 条，
      逐字：「**二重和的交换靠"电流与两个顶点算子都对易"**：否则 `J`-求和的下端截断依赖
      `V^{(n)}_{-j}x` 的 mode bound，而后者随 `j → -∞` 发散，窗口的选取会**循环**……
      这是一个纯形式化层面的发现：纸上推导从不提这一步。」
      **curator 未自行重跑 `lake build`**；合并前应由 lead 跑 `uv run stringgraph check-axioms`。
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      **不承载本卡的论证**（论证是 Lean 的），只作对照：教科书在推导
      [A^i_m, A^j_n] 时把这一步写成"留数计算：m+n ≠ 0 时被积式是全导数，
      m+n = 0 时指数退化、留下 k_0·α_0 = 1"。核实等级沿用 worldsheet.ddf-operators-v6：
      章节页码 L4/L2，**式号与正文 L0**。GSW 用 mostly-minus（已按 conv.metric-mostly-plus
      转写）、取 α' = 1/2，故其归一化写作 k_0·p = 1，**不写洛朗模形式的加权和陈述**。
  - ref: gebert-nicolai-1995
    loc: "§3.1 'DDF vertex operators', p. 594, eq. (3.4)（右端显式保留算子 k(0) = k·α_0）；归一化 k·r = 1 见同页正文"
    note: |
      **不承载本卡的论证**，只作对照：G–N 的 (3.4) 把算子 k(0) 显式留在 [A^ξ_m, A^η_n] 的右端，
      并说明取 k·r = 1 才「realize **precisely** the algebra of d − 2 transversal oscillators」。
      本卡的 (N) 与右端那个 m 正是这一点的模形式对应物
      （本卡 m + n = 0 分支里 k_0·α_0 = 1 那一步）。
      核实等级沿用 worldsheet.ddf-transverse-oscillator-algebra-v2 的同名 source（L1 逐页）。
      ⚠ G–N 走的是"物理态李括号 + 零模字典"路线，**不写本卡这条加权和**，
      两者的论证互不重叠。
tags: [cft, vertex-operator, bosonic-string, spectrum-generating-algebra, ddf, momentum-tower, formalized]
notes: |
  【立卡理由】这是 [A^ε_m, A^δ_n] = m(ε·δ)δ_{m+n,0} 那条链的**第 (5b) 步**，
  formal/TODO.md 的 `ddf-operators` 条目逐字如此编号，并称它是「**分析的心脏**」
  （文件头：「Together with the transversality step (4) and the same-point product (5a) …
  this is the analytic heart of the DDF bracket」）。
  worldsheet.orthogonal-momentum-vertex-operators-commute 的 notes 与
  worldsheet.isotropic-tower-vertex-operators-commute--via-lean 的 gaps (iii) 都把 (5b)
  登记为"未做"，本卡把这一项关闭。

  【★ "不是 (5a) + L_0 Leibniz 的推论"：两位 formalizer 独立证伪】
  这条记录值得单列，因为它是图上"看似显然的边其实不存在"的最清晰案例。
  · 第一位 formalizer（写 (5a) 那轮）在 formal/TODO.md 留下"L_0 Leibniz 那条路死了"的记录；
  · 第二位（写本卡那轮）**重算一遍并确认**：文件头第 1 条逐字
    「(Independently re-derived here; it confirms the note left in `formal/TODO.md`.)」，
    TODO 里的复核记录逐字「(i) `L_0` Leibniz 那条路确实死了（重算一遍：`T_0 + U_0 = 0·S_0`
    在 `L = 0` 退化成 `0 = 0`），必须引入 `k_0·∂X` 这个场本身」。
  ⇒ 图上**不得**画 worldsheet.isotropic-tower-vertex-operator-fusion → 本卡 的"推论"边；
  那张卡只是本卡**证明中的一步**（融合两个指数），这在推导的 depends_on 里如实记着。

  【★ "全导数" = 权恒等式用两次】
  纸上那句"被积式是全导数，留数为零"在本卡的代数版本里就是：
  **同一条权恒等式（worldsheet.exponential-vertex-operator-current-weight-identity 的塔上形式）
  被使用两次**——
  第一次在动量 m、指标 j 上，把 j V^{(m)}_j 换成 m Σ_J (k_0·α_{−J}) V^{(m)}_{j−J}（引入电流）；
  第二次在动量 m+n、指标 K = 0 上，得 (m+n) Σ_J (k_0·α_{−J}) V^{(m+n)}_{−J} = 0·V^{(m+n)}_0 = 0
  （消掉电流）。中间那一步用 (5a) 把两个指数融合。
  ⇒ "全导数"不是一个独立的引理，而是**权恒等式在 K = 0 处给出零系数**这件事。

  【★ 两个假设各被用到几次（formalizer 记账，照实转录）】
  · **k_0² = 0（(T)）在本文件用三次**，都不可去：权恒等式本身
    （b·b ≠ 0 时 b·∂X 与 e^{ib·X} 有缩并 b²/z，恒等式多出反常项）、
    电流与顶点算子的对易、以及由后者给出的局部有限窗口。
    ⚠ 再加上 (5)(5a) 各用一次（塔上顶点算子对易、同点乘积）与塔上共形权一次，
    类光性在整条 DDF 链上目前已记录**六处**承重；这些计数是 formalizer 的记账，
    本卡**不**断言它是穷尽的。
  · **2α' k_0·p = 1（(N)）只用一次**，在 `towerCurrent_zero_of_normalized`：
    它使 k_0·α_0 = 1 在**每一层**都成立，而这与 k_0² = 0 自洽
    （`dotVec_towerMomentum_right_of_isotropic`：k_0² = 0 ⟹ k_0·p 沿塔不变）。
    等式右端的 m 就来自这里。

  【★ ℚ-代数是必需的，不只为相干态系数】
  最后一步要在 R 里除以 m+n（Lean `eq_zero_of_intCast_smul_eq_zero`）。
  在 ℤ 上只能得到 (m+n)·Σ_j j V^{(m)}_j V^{(n)}_{−j} = 0，**推不出和为零**。
  转录自 formal/TODO.md (5b)「数学要点」第 5 条与 Lean 文件头第 4 条。

  【这条链还剩什么】(5)(5a)(5b) 三块**全部已做**；只剩把 ⁅A^ε_m, A^δ_n⁆ 展成对 (j, l) 的
  二重和、用横向性把 V 挪到右边、用 CCR 化掉 ⁅α^ε_j, α^δ_l⁆、最后套本卡的
  **双重局部有限和 Leibniz 组装**（formal/TODO.md「[A,A] 的整条链」段估 150–250 行，
  「主要工作量在窗口对齐，不再有新的数学内容」；formalizer-ddf-algebra 正在做）。
  故 worldsheet.ddf-transverse-oscillator-algebra-v2 仍**不得**标 formalized。

  【查重】2026-09-11 跑 `uv run stringgraph search 加权和 / 留数 / "vertex operator" / current`。
  最接近的既有节点：worldsheet.ddf-transverse-oscillator-algebra-v2（[A,A] 本身，文献推导）、
  worldsheet.isotropic-tower-vertex-operator-fusion（(5a) 塔版）、
  worldsheet.exponential-vertex-operator-current-weight-identity（本卡的原子输入）。
  **没有**加权和的节点，本卡不重复。
