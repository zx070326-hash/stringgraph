  - ref: fgz-1986
    loc: "**Proposition 2.4**, p.8445 左栏下部（Theorem 2.5 正上方），逐字：'PROPOSITION 2.4. dim H^m_∞(ℒ, ℒ₀; V) = 0 for m ≠ 0, and for m = 0 is equal to the coefficient of 1 in Eq. 2.3, when V is a Hermitian ℒ⁻-free ℒ-module in 𝒪₀.'；其紧邻上文逐字：'Let us consider a general ℒ⁻-free, Hermitian ℒ-module V. Then by Theorem 1.12 all nonzero degree cohomology groups vanish. To find the dimension of the zero degree cohomology group we apply the Euler–Poincaré principle. … This implies the following.'"
    note: |
      L1，§9.9.1 与 §9.9.3（researcher 2026-09-11 第二轮页图复核）。
      ★★ **这是本卡维数那一步的真正上游**：Prop 2.4 把 dim H⁰ 定成 Eq. [2.3] 中常数项的系数，
      Theorem 2.7(ii) 只是把 V = V(E,p)、D = 26 代进去算出 p_{(24)}(1 − p·p/2)。
      ⚠ **两条转录注记（引用前必读）**：
      (1) **"ℒ⁻-free" 的上标减号在扫描件上极小**，单看 Prop 2.4 那一行容易读成 "ℒ-free"；
          按紧邻上文（"a general ℒ⁻-free, Hermitian ℒ-module V"）与 Theorem 1.12 的假设锁定为 **ℒ⁻**。
          同型陷阱见 `primary-sources-round2.md` §1（LZ 1991 Thm 2.25 的 𝒢₋-free 也被渲染成 𝒢-free）。
      (2) **𝒪₀ 这个范畴的定义在 FGZ §1，本图未回查**（L0）。本卡不据 𝒪₀ 断言任何事：
          V(E,p) 属不属于 𝒪₀ 由 FGZ 在套用时自己负责。
      ★ **强度措辞是 "This implies the following"**，即 **Prop 2.4 = Theorem 1.12 + Proposition 1.3**，
      自身不另给证明；由此 §9.3 那份四条依赖清单在逻辑上冗余，见推导 gaps。
  - ref: fgz-1986
    loc: "**Theorem 2.7 正上方一句**（p.8445 右栏）逐字：'In this case the vanishing theorem (**Theorem 1.12**), the Euler–Poincaré principle (**Proposition 1.3**), **Proposition 2.4**, and **the first part of Proposition 2.6** imply the following.'"
    note: |
      L1，§9.3。★★ **这是本卡依赖边不标 inferred 的依据**：四条依赖是 FGZ **原文明写**的，
      不是抽取者推断。
