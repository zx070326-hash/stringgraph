  - ref: fgz-1986
    loc: "**Proposition 2.6**, p.8445，逐字：'PROPOSITION 2.6. Let E have signature (D − 1, 1), D ≥ 2 and p ≠ 0. Then (i) V(E, p) is a free ℒ^--module and (ii) there exists a positive definite subspace T ⊂ V(E, p)^{ℒ^+} [= all v ∈ V(E, p), annihilated by ℒ^+], such that ch_q T = q^{p·p/2}φ(q)^{D−2}.'；**Proposition 1.3**, p.8443（Euler–Poincaré）；**Theorem 1.12**, p.8444（V 是 n_--free 且带非退化厄米形式 ⇒ H^m_∞(g, g₀; V) = 0, m ≠ 0）"
    note: |
      L1（Prop 2.6 逐字见 §9.2 表第 5 行；Thm 1.12 / Prop 1.3 的内容见 §1.4 编号表）。
      ★ **数值 24 在 Prop 2.6(ii) 的 ch_q T = q^{p·p/2}φ(q)^{D−2} 里也出现**（D − 2 = 24），
      但**本卡不走这条路**：本卡的 24 来自把 D = 26 代进 Eq. [2.3]
      （q^{−1}φ²(q)·q^{p·p/2}φ(q)^{−D} = q^{p·p/2−1}φ(q)^{2−D}）。两处的 D − 2 相等是
      Theorem 2.8（无鬼定理）之所以成立的算术内容，**本卡不断言那件事**（见"不断言 (b)(g)"）。
  - ref: fgz-1986
    loc: "**Theorem 2.7 之后两句**（p.8445）逐字：'Theorem 2.7 implies that the cohomology groups are trivial except for a one-dimensional H^0_∞ in the positive-definite case, but H^0_∞ can be arbitrarily large in the indefinite case. It turns out that in the case of signature (25, 1) we can explicitly construct representatives of the cohomology classes using the second part of Proposition 2.6. And this is the case of the most interest in physics.'；**Theorem 2.5**, p.8445（H^m_∞(ℒ, 𝖟; V) ≅ H⁰(ℒ, ℒ₀; V) 对 m = ±½，其余为零）；**Proposition 2.8 / 2.9 + 推论**, p.8446（p = 0 例外情形）"
    note: |
      L1（§1.4、§9.5）。本条是"不断言 (d)(e)(h)(i)"的来源。
      ★ 那句 "H⁰_∞ can be arbitrarily large in the indefinite case" 与本卡断言**不冲突**：
      对**固定的 p**，维数由 p_{(24)}(1 − p·p/2) 给出、有限；"arbitrarily large" 说的是
      **随 p 变化时没有一致上界**（p·p → −∞ 时 1 − p·p/2 → +∞，而 p_{(24)}(n) 随 n 无界增长）。
tags: [bosonic-string, brst, cohomology, dimension-formula, partition-function, semi-infinite-cohomology]
notes: |
  ★【2026-09-12 auditor 页图裁定：原刊 `ch_q T = q^{p·p/2}φ(q)^{D−2}` 漏了负号】
  本卡 sources 里 Prop 2.6 的 loc（逐字引文）与其 note（「数值 24 在 Prop 2.6(ii) 里也出现」）
  都写了 `φ(q)^{D−2}`。physics-auditor 于 2026-09-12 用 p.8445 页图 8× 放大复核后裁定
  （`literature/extractions/page-check-rulings-2026-09-12.md` §2.3，摘要在
  `brst-cohomology-sources.md` §9.12）：**`D` 前确无负号，这是原刊排印错误，
  正确的是 `ch_q T = q^{p·p/2} φ(q)^{−(D−2)}`。** 三条彼此独立的内证：
    (1) φ(q)^{D−2}（D ≥ 3）展开有负系数，不可能是分次向量空间的特征标；
    (2) 由 [2.4] 直接算：不可约 Verma 模的 ℒ⁺-不变子空间是一维最高权向量，故
        ch_q T = Σ_k p_{(D−2)}(k) q^{p·p/2+k} = q^{p·p/2} φ(q)^{−(D−2)}；
    (3) **本卡自己就是第三条内证**：本卡断言的 dim H⁰ = p_{(24)}(1 − p·p/2)
        按 (H5) 是 **φ(q)^{−24}** 的系数，而本卡推导算出的 Euler 特征标是
        q^{−1}φ²(q)·q^{p·p/2}φ(q)^{−D} = q^{p·p/2−1}φ(q)^{−(D−2)}，D = 26 时正是 φ^{−24}。
        ⇒ **两条路算出的 D − 2 = 24 只有在指数取 −(D−2) 时才一致。**
  同页 `ch_q V(E,p) = q^{p·p/2}φ(q)^{−D}` 的负号清晰可见，故可排除「扫描丢字」。

  **本卡的处理（lead 裁决 2026-09-12）：statement 与 sources.loc 的逐字引文都不改**
  （逐字引文按引用纪律保留原刊形态），只在此登记裁定。
  ⚠ **本卡的断言不受影响**：本卡的 24 从来不是从 Prop 2.6(ii) 抄来的，而是把 D = 26 代进
  Eq. [2.3] 的 Euler 特征标算出来的（见上面 (3) 与 sources 里那条 note 的原文）。
  裁定反而**加强**了本卡——它把「两处的 D − 2 相等」从巧合变成一致性检验。
  ⚠ **下游纪律**：凡要把该特征标写进自己 statement 的新卡一律写 `φ(q)^{−(D−2)}`。

  ★★【本卡为什么新建（curator，2026-09-11）】
  worldsheet.bosonic-relative-cohomology-vanishing 的"本命题不断言 (a)"逐字写着：
  「不断言 H⁰ 的维数。… 是同一定理的 (ii)，与 (i) 同号不同条，本图未建卡
  （researcher 建议单建一卡，已列入报告）。」本卡关闭这个记账缺口。
  与超弦侧 worldsheet.superstring-relative-cohomology-dimension（LZ Corollary 2.15(i)）
  是同一批、同一结构的两张卡。

  【为什么"消灭"与"维数"必须分两张卡】三条：
  (1) **前提不同**：按 researcher §9.9.2 的逐字复核，"i ≠ 0 消灭"这条结论**本身不需要 p ≠ 0**
      （Prop 2.4 的假设只有"V 是 𝒪₀ 里的厄米 ℒ⁻-自由模"，p ≠ 0 只用于验证 V(E,p) 的自由性）；
      而维数公式里的 p 是**自变量**，分段判据 "1 − p·p/2 是非负整数" 直接是关于 p 的条件。
  (2) **论证不同**：消灭走 Theorem 1.12；维数走 Euler–Poincaré（Proposition 1.3）+ 特征标计算。
      前者是同调代数，后者是形式幂级数的系数比较。
  (3) **下游不同**：无鬼定理 Theorem 2.8 的"三个空间维数都是 p_{(24)}(1 − p·p/2)"这句话只用本卡；
      GSO / picture 那类结果只用消灭卡。

  【p_{(24)} 的物理释义（**不进断言**）】
  φ(q)^{−24} = Π_{n≥1}(1 − q^n)^{−24} 是 24 个横向玻色振子塔的配分函数，故 p_{(24)}(N) 读作
  "24 个横向振子在能级 N 上的态数"；由 (H7) 的换算，1 − p·p/2 = N 就是 α'm² = N − 1（α' = 1/2）。
  ⚠ **这是本图的读法，FGZ 的正文只把 p_{(D)}(n) 定义成 φ(q)^{−D} 里 q^n 的系数**（(H5) 逐字），
  "24 个横向振子"这句出自抽取者的按语。按 reviewer-batch23 对 gloss 的处理（同款处理见
  worldsheet.superstring-cylinder-amplitude-closed-channel-v2 的断言 (3)），释义留在 notes。
  ⇒ "这个数等于横向 Fock 空间的维数"作为**命题**是 Theorem 2.8 的内容，本卡"不断言 (g)"。

  【★ FGZ 的「物理空间」定义里含截距 a = 1（2026-09-11，researcher 第三轮 §9.10.4）】
  紧接 Theorem 2.7 之后（p.8445 右栏末）逐字：
  「We let P = P(R^{25,1}, p) = {v ∈ V(R^{25,1}, p) : **π(L_n)v = δ_{0,n}v**, n ≥ 0}.
   P is called the **physical space**.」
  ⇒ **π(L₀)v = v，即 L₀ 本征值 = 1 = 玻色弦截距 a = 1，是 FGZ 写在物理空间定义式里的**
  （用 δ_{0,n} 表达），**不是**某处额外声明的假设。
  ⚠ **本卡不涉及 P**（P 是 Theorem 2.8 那一侧的对象），故这条不进本卡的设定；
  记在此处是因为它解释了 (H7)：本卡公式里 "1 − p·p/2" 的那个 **1** 与 FGZ 物理空间定义里的
  那个 **1** 是同一个截距，两处都藏在别处而不在 Theorem 2.7 的语句里。
  ⚠ 对照：lian-zuckerman-1989 的 Definition 2.16 写 π(L_n)v = δ_n **κ**v，即超弦截距 = κ
  （NS 为 ½、R 为 0）——这正是超弦维数卡 worldsheet.superstring-relative-cohomology-dimension
  的公式里 p^{(8)}_κ(**κ** − p·p/2) 那个 κ。**两篇的截距都藏在物理空间的定义式里。**
  ⚠ **negative evidence（§9.10.6，仅覆盖 p.8445）**：Theorem 2.7 的陈述里**不出现**
  "a = 1"、不出现 "intercept"、不出现 "no-ghost"、不出现 "ghost number"。

  【(ℒ, ℒ₀) 与 {b₀ = L₀ = 0} 的字典】
  与消灭卡同款：FGZ 的相对复形是"相对于子代数 ℒ₀"，本图的相对复形是
  worldsheet.brst-preserves-relative-complex 的 {b₀Ψ = 0, L₀Ψ = 0}。物理文献与数学文献公认
  这是同一对象的两种写法，但 **FGZ 本文没有写出这个字典**，故本卡不断言逐字同一（"不断言 (f)"），
  推导里也记了这条 gap。

  【与超弦侧 worldsheet.superstring-relative-cohomology-dimension 的对应与差别】
  对应：FGZ Theorem 2.7(ii) ↔ LZ 1989 Corollary 2.15(i)（LZ 自命名 "Quantization Condition"）。
  三处差别：
    (a) **公式形状**：本卡是 p_{(24)}(1 − p·p/2)（单个分拆型系数 + 分段）；LZ 是
        ½(2κ+1)·dim R(p,κ)·p^{(8)}_κ(κ − p·p/2)，带扇区参数 κ 与旋量表示维数因子。
    (b) **分段**：FGZ 显式写出"1 − p·p/2 非非负整数时为 0"；LZ 的 Corollary 2.15(i) 语句里
        **没有**这一支（本图超弦卡照实记，不补）。
    (c) **上游**：本卡经 Proposition 2.4（Thm 1.12 + Euler–Poincaré）；LZ 经
        Proposition 2.14(ii)（char = sign）+ Theorem 2.4 + Euler–Poincaré。
