id: worldsheet.bosonic-relative-cohomology-dimension
kind: proposition
title: 玻色弦相对 BRST 上同调的维数公式：dim H⁰_∞(ℒ, ℒ₀, V(E,p)) = p_{(24)}(1 − p·p/2)，1 − p·p/2 非非负整数时为 0（FGZ 1986 Theorem 2.7(ii)）
statement: |
  **设定**（数学侧表述，照 FGZ 1986 的记号；与本图物理侧对象的对照见 notes）。
  记 ℒ 为 Virasoro 代数（worldsheet.virasoro-algebra-v2 的 Vir），ℒ₀ ⊂ ℒ 为含 L₀ 的子代数，
  ℒ^± 为正/负模部分，𝖟 ⊂ ℒ 为中心，Λ^∞_* 为鬼场（半无限形式）模，
  H^•_∞(ℒ, ℒ₀; V) 为系数在 ℒ-模 V 中的**相对**半无限上同调（FGZ §1.2 的 relative subcomplex）。
    (H1) **号差 (D−1, 1)**：FGZ p.8445 左栏逐字 "Now we will restrict our attention to the case
         of signature (D − 1, 1), which is the most interesting from both the mathematical and the
         physical points of view."（本图的 conv.metric-mostly-plus）。
    (H2) **物质模是 Fock 模 V(E, p)**：E 是上述号差的 D 维空间，p 是固定的质心动量，
         V(E,p) 带分次 deg(α^{μ₁}_{m₁} … |p⟩) = (Σ m_i) − p·p/2，形式特征标
         ch_q V(E,p) = q^{p·p/2} φ(q)^{−D}（p.8445 左栏逐字；FGZ 称之为 **Fock module**）。
         其上有厄米形式使 π(L_m)* = π(L_{−m})，故 V(E,p) 是**厄米 ℒ-模**（同页逐字
         "We have π(L_m)* = π(L_{−m}), so that V(E, p) is a Hermitian ℒ-module."）。
    (H3) **D = 26，等价地 π(c) = 26·Id_V**：FGZ p.8445 右栏（Theorem 2.7 正上方）逐字
         "Now we will consider the relative cohomology groups with coefficients in V(E, p),
         so that D = 26."；同页左栏给出接口逐字
         "[π(L_m), π(L_n)] = (m − n)π(L_{m+n}) + (D/12)(m³ − m)δ_{m+n}·Id. Thus π(c) = D·Id by Eq. 2.1."
         ⇒ **"D = 26" 与 "π(c) = 26·Id" 在 FGZ 里是同一个假设的两种写法，不是两条独立条件。**
         ⚠ **这是 FGZ 的假设，不是结论**，见"本命题不断言 (c)"。
    (H4) **D ≥ 2**：经 Proposition 2.6 进入（该命题逐字以 "Let E have signature (D − 1, 1),
         D ≥ 2 and p ≠ 0." 开头，而 Theorem 2.7 的证明用它的第一部分）。
         在 (H3) 下 D = 26 已蕴含之；单独列出是因为 FGZ 的前提链上确有这一条。
    (H5) **计数记号 p_{(D)}(n) 的定义**（FGZ p.8445 **左栏**，Proposition 2.4 紧邻上文，逐字）：
         "The formal Euler character is
            ch_q V · Σ_{m∈Z} (−1)^m ch_q Λ^m_∞ = q^{−1} φ²(q) ch_q V   **[2.3]**
          where φ(q) = Π_{n≥1}(1 − q^n). We denote by **p_{(D)}(n) the coefficient of q^n in
          φ(q)^{−D}**, so that p_{(1)}(n) is the classical partition function."
         ⇒ 本卡里的 **p_{(24)}(n) := [q^n] φ(q)^{−24}**，其中 φ(q) = Π_{n≥1}(1 − q^n)。
         ⚠ **定义出处是 p.8445 左栏，不是 Theorem 2.7 处**（Theorem 2.7 在右栏，只用这个记号）。
         ⚠ **p_{(1)} 才是通常的分拆函数**，p_{(24)} 不是。把 p_{(24)} 读成"24 个横向振子的
         多重分拆"是**物理侧的释义**，FGZ 不写这句，故不进本断言（见 notes）。
    (H6) **次数 0 是相对复形的整数次数，不是"鬼数"**。FGZ p.8445 全页不出现 "ghost" 字样
         （researcher 2026-09-11 的 negative evidence，仅覆盖该页）；零点由"相对 ℒ₀ 的子复形"
         这个约定固定，不是另外声明的。
         ⚠ 换成**绝对**复形（只相对于中心 𝖟）时非零次数是 **±½**（Theorem 2.5），
         故引用本定理必须写明是**相对**复形。
    (H7) **归一化提醒（本图补，非 FGZ 语句）**：(H2) 的分次里 p·p 按 FGZ 自己的单位取，
         与本图 conv.alpha-prime-regge 的换算是 **α' = 1/2**——在 (H1) 的号差下 p·p = −m²，
         故 "1 − p·p/2 = N" 即 α'm² = N − 1（α' = 1/2）。**本卡不断言这条换算**，
         它只是提醒：把 p_{(24)}(1 − p·p/2) 的自变量当成"能级"时必须先固定 α'。

  **断言**（Theorem 2.7(ii)，p.8445 右栏逐字：**"THEOREM 2.7. Suppose p ≠ 0. Then (i)
  H^i_∞(ℒ, ℒ₀, V(E, p)) = 0, i ≠ 0, and (ii) dim H^0_∞(ℒ, ℒ₀, V(E, p)) = p_{(24)}(1 − p·p/2),
  if 1 − p·p/2 is a nonnegative integer and 0 otherwise."**）：

    在 (H1)–(H5) 之下，若 **p ≠ 0**，则相对 BRST 上同调的零次项是**有限维**的，且

      **dim H⁰_∞(ℒ, ℒ₀, V(E,p)) = p_{(24)}(1 − p·p/2)**，  当 1 − p·p/2 是**非负整数**时；
      **dim H⁰_∞(ℒ, ℒ₀, V(E,p)) = 0**，                     其余情形（分段的第二支）。

    ⚠ **分段的第二支是断言的一部分**，不是排版附注：1 − p·p/2 若不是整数、或是负整数，
    维数**为零**，即该动量上没有相对上同调类。

  **本命题不断言**：
    (a) 不断言 **i ≠ 0 时的消灭**。那是同一定理的 **(i)**，已单独立卡
        （worldsheet.bosonic-relative-cohomology-vanishing）。两条同号不同条，按
        graph/CLAUDE.md「一个节点一个命题」分开；本卡把 (i) 作为**依赖**而非结论。
    (b) 不断言 H⁰ 上的任何**正定性**，也不断言它与横向空间 T ∩ P 或旧协变物理态 P/rad P 的同构。
        那是 FGZ **Theorem 2.8**（= worldsheet.no-ghost-theorem-brst 的断言 (2)(3) 与
        worldsheet.brst-cohomology-equals-ocq-physical）。本卡是纯维数陈述：它只给一个**数**。
    (c) 不断言 **D = 26 这个数**。FGZ **不推导** D = 26 而是假设它（(H3)）；
        抽取记录 literature/extractions/brst-cohomology-sources.md §1.2 的裁定逐字：
        "FGZ 不推导 D = 26，而是假设它"。
        ⚠ 但 **24 这个下标随 (H3) 走**：p_{(24)} 里的 24 = D − 2 是把 D = 26 代进
        Proposition 2.4 的 Euler 特征标 q^{−1}φ²(q)·q^{p·p/2}φ(q)^{−D} = q^{p·p/2−1}φ(q)^{2−D}
        之后的结果。⇒ 本卡的公式**不能**在 D ≠ 26 时照搬。
    (d) 不断言 **p = 0**。FGZ Proposition 2.8 / 2.9 与其推论把 p = 0 列为例外情形
        （Theorem 1.12 不适用）。本图**未逐字核实** p = 0 时相对上同调的维数。
    (e) 不断言**绝对**（只相对于中心 𝖟）复形上同调的维数。那要经 FGZ **Theorem 2.5**
        （H^m_∞(ℒ, 𝖟; V) ≅ H⁰(ℒ, ℒ₀; V) 对 m = ±½，其余为零）另行推。
    (f) 不断言本卡的 (ℒ, ℒ₀) 相对复形与本图 {b₀Ψ = 0, L₀Ψ = 0}（
        worldsheet.brst-preserves-relative-complex）**逐字**同一。两者在文献里公认是同一对象的
        两种写法，但 FGZ 未写出这个字典（见 notes 与推导 gaps）。
    (g) 不断言 **p_{(24)}(1 − p·p/2) = 横向 Fock 空间在该能级的维数**。这个等号在物理上是
        无鬼定理的内容（Theorem 2.8 / worldsheet.no-ghost-theorem-brst），在本卡里
        p_{(24)} 只是 (H5) 定义的**生成函数系数**。
    (h) 不断言**上同调类的显式代表元**。那要用 Proposition 2.6 的**第二部分**（横向空间 T），
        FGZ 逐字把它派给 "we can explicitly construct representatives of the cohomology classes"；
        本卡（与 (i) 一样）只用它的**第一部分**（自由性）。
    (i) 不断言 H⁰ 在**正定号差**下的形态。FGZ 在 Theorem 2.7 之后逐字说
        "the cohomology groups are trivial except for a one-dimensional H⁰_∞ in the
        positive-definite case, but H⁰_∞ can be arbitrarily large in the indefinite case"
        ——本卡的 (H1) 是**不定**号差那一支。
