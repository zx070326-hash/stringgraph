id: worldsheet.shapovalov-form-existence
kind: proposition
title: Shapovalov 形式的存在性：⟺ Shapovalov 泛函存在（任意 ℚ-代数）；特征零域上 ⟺ V(c,h) ≠ 0，且此时唯一
statement: |
  设 R 是交换环且是 ℚ-代数，(c, h) ∈ R²，V(c,h) 是 Virasoro Verma 模
  （worldsheet.verma-module-v2），|c,h⟩ 是最高权向量，σ 是 Virasoro 反对合
  （math.virasoro-anti-involution）。「逆变型」的定义见 worldsheet.shapovalov-form-uniqueness；
  称逆变型 B **归一化**，若 B(|c,h⟩, |c,h⟩) = 1。

  称 R-线性泛函 f : V(c,h) → R 是 **Shapovalov 泛函**，若

      f(|c,h⟩) = 1,     f(L_n v) = 0  (n < 0, ∀v),     f(L_0 v) = h·f(v)  (∀v)。

  （等价地：f 是 V(c,h) 的**线性对偶**在 σ-扭作用 (X·φ)(v) := φ(σ(X)·v) 下的最高权向量，
  权为 (c,h)，且在 |c,h⟩ 上取值 1。σ-扭对偶对**任意** ℚ-代数 R 都是 Virasoro 模，
  不需要分级、不需要有限性。）

  **(1) 条件构造（任意 ℚ-代数 R）**：设 f 是 Shapovalov 泛函。则

      B(x, y) := (Φ_f(x))(y),    Φ_f : V(c,h) → V(c,h)* 是万有性质给出的唯一 Virasoro 等变映射
                                  且 Φ_f(|c,h⟩) = f（对偶取 σ-扭作用）

  是归一化逆变双线性型。逆变性直接来自 Φ_f 的等变性。
  结合 worldsheet.shapovalov-form-uniqueness，这样的 B **存在且唯一**。

  **(2) 等价（任意 ℚ-代数 R）**：以下两件事互相蕴含：
      (i) 存在归一化逆变型 B；   (ii) 存在 Shapovalov 泛函 f。
      «(ii) ⇒ (i)» 是 (1)。«(i) ⇒ (ii)» 取 f := B(|c,h⟩, ·)：三条性质分别由归一化、
      n > 0 时 L_n|c,h⟩ = 0 与 L_0|c,h⟩ = h|c,h⟩ 经逆变性读出。
      ⇒ 「Shapovalov 泛函存在」**不只是**构造的充分条件，它与结论**等价**。

  **(3) 必要条件 V(c,h) ≠ 0（任意非平凡 R）**：若存在归一化逆变型 B，则

      |c,h⟩ ≠ 0，     特别地 V(c,h) ≠ 0。

      （一行：|c,h⟩ = 0 会给 1 = B(0,0) = 0。）

  **(4) 特征零域上的完全回答**：设 K 是**特征零的域**，(c, h) ∈ K²。则

      存在归一化逆变型 B   ⟺   |c,h⟩ ≠ 0   （⟺ V(c,h) ≠ 0），

  且此时 B **唯一**。
      «⇒» 是 (3)。«⇐» 是构造：level 分解 V(c,h) = ⨁_{N ≥ 0} V_N（worldsheet.verma-module-v2
      在域上的内直和）给出投影 V(c,h) ↠ V_0，而 **V_0 = K·|c,h⟩**（对任意 ℚ-代数 R 都有
      V_0 = R·|c,h⟩），故 |c,h⟩ ≠ 0 时 V_0 是一维，其坐标泛函 f_0 有定义。
      f_0 是 Shapovalov 泛函：f_0(|c,h⟩) = 1 由定义；n < 0 时 L_n 把 V_N 送进 V_{N+|n|}
      而 N + |n| ≥ 1，故 f_0(L_n v) = 0；L_0 在 V_N 上是 h + N，只有 N = 0 分量对 f_0 有贡献，
      故 f_0(L_0 v) = h f_0(v)。再用 (2)。
      ⇒ **在特征零域上，Shapovalov 形式存在性的唯一未决输入是 V(c,h) ≠ 0**
      （即 math.verma-module-free-over-negative-part 的 (4)，其瓶颈是 PBW）。

  【本节点明确**不**断言】
  (a) **V(c,h) ≠ 0 本身**。(3)(4) 把存在性归结到它，但不证明它；那是
      math.verma-module-free-over-negative-part 的 (4)（rigorous，未形式化，瓶颈是 Mathlib 无 PBW）。
      ⇒ 本卡**不**断言「对每个 (c,h) 都存在 Shapovalov 形式」。
  (b) **一般 ℚ-代数 R 上「|c,h⟩ ≠ 0 ⇒ 存在」**。(4) 的构造用到 level 内直和分解，
      而后者只在特征零的域上证到（level 分量靠 L_0 本征值 h + N 分离，一般 R 上这些标量
      未必可区分）。一般 R 上本卡只给 (1)(2)(3)。
  (c) 唯一性的独立内容（那是 worldsheet.shapovalov-form-uniqueness，且它无条件）。
  (d) 任何 Gram 矩阵或行列式公式（见 worldsheet.kac-determinant-level-two、
      worldsheet.kac-determinant）。
  (e) ker B 是极大真子模、V/ker B 不可约（对照 schottenloher-2008 Theorem 6.8(3)）。
  (f) 任何 Hermite 化、正定性或酉性结论；B 是 R-双线性型。
  (g) 经三角分解 U(Vir) = U(vir₋) ⊗ U(vir₀) ⊗ U(vir₊) 与 Harish-Chandra 投影的**教科书构造**。
      那条路线需要 PBW；本卡 (1) 走 σ-扭线性对偶，(4) 走 level 分解的坐标泛函，
      **两者都不用 PBW**，未证内容被压进「V(c,h) ≠ 0」这一条（由 (4)，在域上这是最优的）。
