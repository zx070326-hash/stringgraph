id: worldsheet.shapovalov-form-existence
kind: proposition
title: Shapovalov 形式的存在性等价于「Shapovalov 泛函」的存在，并蕴含 V(c,h) ≠ 0；给定泛函则形式由 σ-扭对偶显式构造
statement: |
  设 R 是交换环且是 ℚ-代数，(c, h) ∈ R²，V(c,h) 是 Virasoro Verma 模
  （worldsheet.verma-module-v2），|c,h⟩ 是最高权向量，σ 是 Virasoro 反对合
  （math.virasoro-anti-involution）。「逆变型」的定义见 worldsheet.shapovalov-form-uniqueness。

  称 R-线性泛函 f : V(c,h) → R 是 **Shapovalov 泛函**，若

      f(|c,h⟩) = 1,     f(L_n v) = 0  (n < 0, ∀v),     f(L_0 v) = h·f(v)  (∀v)。

  （等价地：f 是 V(c,h) 的**线性对偶**在 σ-扭作用 (X·φ)(v) := φ(σ(X)·v) 下的最高权向量，
  权为 (c,h)，且在 |c,h⟩ 上取值 1。σ-扭对偶对**任意** ℚ-代数 R 都是 Virasoro 模，
  不需要分级、不需要有限性。）

  **(1) 条件构造**：设 f 是 Shapovalov 泛函。则

      B(x, y) := (Φ_f(x))(y),    Φ_f : V(c,h) → V(c,h)* 是万有性质给出的唯一 Virasoro 等变映射
                                  且 Φ_f(|c,h⟩) = f（对偶取 σ-扭作用）

  是逆变双线性型且 B(|c,h⟩, |c,h⟩) = 1。逆变性直接来自 Φ_f 的等变性。
  结合 worldsheet.shapovalov-form-uniqueness，这样的 B **存在且唯一**。

  **(2) 等价**：以下两件事互相蕴含：
      (i) 存在归一化逆变型 B（即 B 逆变且 B(|c,h⟩,|c,h⟩) = 1）；
      (ii) 存在 Shapovalov 泛函 f。
      «(ii) ⇒ (i)» 是 (1)。«(i) ⇒ (ii)» 取 f := B(|c,h⟩, ·)：三条性质分别由归一化、
      n > 0 时 L_n|c,h⟩ = 0 与 L_0|c,h⟩ = h|c,h⟩ 经逆变性读出。
      ⇒ 「Shapovalov 泛函存在」**不只是**构造的充分条件，它与结论**等价**，
      因此这条假设**不可去**、也不可能被更弱的假设替代。

  **(3) 必要条件 V(c,h) ≠ 0**：设 R 非平凡（1 ≠ 0）。若存在归一化逆变型 B，则

      |c,h⟩ ≠ 0，     特别地 V(c,h) ≠ 0。

      （一行：|c,h⟩ = 0 会给 1 = B(0,0) = 0。）
      ⇒ 由 (2)，任何对 Shapovalov 形式的无条件构造都必须先证 V(c,h) ≠ 0。

  【本节点明确**不**断言】
  (a) **无条件存在性**。即：本卡**不**断言「对每个 (c,h) 都存在 Shapovalov 形式」，
      也不断言 V(c,h) ≠ 0。后者是 math.verma-module-free-over-negative-part 的 (4)
      （rigorous，未形式化，其瓶颈是 Mathlib 无 PBW）。本卡的 (3) 说明二者不可绕开：
      **在 V(c,h) ≠ 0 被证明之前，「Shapovalov 形式」这个对象的存在性在本图里是有条件的。**
  (b) 唯一性（那是 worldsheet.shapovalov-form-uniqueness，且它无条件）。
  (c) 任何 Gram 矩阵或行列式公式（见 worldsheet.kac-determinant-level-two、
      worldsheet.kac-determinant）。
  (d) ker B 是极大真子模、V/ker B 不可约（对照 schottenloher-2008 Theorem 6.8(3)）。
  (e) 任何 Hermite 化、正定性或酉性结论；B 是 R-双线性型。
  (f) 经三角分解 U(Vir) = U(vir₋) ⊗ U(vir₀) ⊗ U(vir₊) 与 Harish-Chandra 投影
      U(Vir) → U(vir₀) → R 的**教科书构造**。那条路线需要 PBW；本卡 (1) 走的是
      σ-扭线性对偶，**完全不用 PBW、不用分级、不用有限性**，代价是把全部未证内容
      压进「Shapovalov 泛函存在」这一条假设里（由 (2)，这个代价是最优的）。
