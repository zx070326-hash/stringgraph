  - ref: schottenloher-2008
    loc: "Ch. 6 §6.3, Theorem 6.8(1), p. 96（LNP 759, pp. 91-102）"
    note: |
      文献侧最接近的带编号来源（L1 逐页核实，math-sources.md §34.3）：
      「H : M × M → ℂ is **the unique hermitian form** satisfying H(v₀,v₀) = 1, as well as
      H(L_n v, w) = H(v, L_{−n} w) …」——即**无条件**断言存在唯一。
      **三处差别（不可当作本卡的论证来源）**：(i) 限 c, h ∈ ℝ 且是 Hermite 形式；
      (ii) 存在性在那里是无条件的，因为该书默认 M(c,h) ≠ 0（Verma 模非零被当作已知，
      背后是 PBW）——本卡 (3) 正是把这条隐含前提挖出来；(iii) 该书未给出本卡 (2) 的等价刻画。
  - ref: feigin-fuchs-1982
    loc: "§3.2（俄文原刊第 58 页）：M_{h,c}(k) 的定义与「называется формой Шаповалова」"
    note: |
      文献侧对照。FF 把 Shapovalov 形式直接定义成 **PBW 基**下的 Gram 矩阵，
      即默认了本卡【不断言】(f) 的那条教科书路线与 V(c,h) ≠ 0（L1，math-sources.md §34.2(b)）。
tags: [cft, representation-theory, verma-module, shapovalov, virasoro, formalized]
notes: |
  【为什么本卡的标题写成「等价 + 蕴含」而不是「存在性」——最要紧的一条】
  formalizer 在 Shapovalov.lean 文件头 "Route assessment" 第 2 点逐字写：
  "**no** unconditional construction of the normalised Shapovalov form is possible from what is
  currently in this repository; the honest formalisation is the conditional one."
  本卡照此叙述：Lean 里被机器检查的是**条件构造 + 等价 + 必要性**，
  不是「Shapovalov 形式存在」。把后者写进本卡会让 formalized 变成假话。
  无条件存在性由本卡的推导 --via-pbw 承载（rigorous，经
  math.verma-module-free-over-negative-part），它给的是**同一张卡的第二条路线**，
  并在其 notes 里记明它还额外给出本卡不断言的无条件存在性。

  【formalizer 的第 4 点：教科书「定义」在 V(c,h) = 0 时是空的】
  教科书写「Shapovalov 形式由 ⟨u·v_h, w·v_h⟩ := χ(σ(u) w) 定义」，其良定义性依赖
  「u ↦ u·v_h 的核恰是左理想 J(c,h)」，而这正是 V(c,h) ≅ U(vir₋) 的自由性（PBW）。
  若 V(c,h) = 0，那条公式定义的是零空间上的空形式，**归一化 ⟨v_h,v_h⟩ = 1 无法满足**。
  ⇒ 「Shapovalov 形式的存在」与「V(c,h) ≠ 0」在逻辑上是**捆绑**的（本卡 (3) 是这个捆绑的
  一半，另一半由 PBW 给出）。任何号称「先定义形式、再由形式证 V ≠ 0」的写法都是循环的。
  这条观察对图的意义：**worldsheet.kac-determinant 不可能比
  math.verma-module-free-over-negative-part 更强**——行列式公式预设了形式存在、
  预设了 level N 有 p(N) 维的基。

  【σ-扭对偶为什么能绕过 PBW】全对偶 V(c,h) →ₗ R 带 σ-扭作用对任意 ℚ-代数都是 Virasoro 模
  （无分级、无有限性要求），于是「构造形式」被化归为「在这个模里找一个权 (c,h) 的最高权向量」；
  再由 Verma 模的万有性质一步得到形式。教科书的 Harish-Chandra 投影则要先有三角分解。
  两条路线的差别不是技巧问题：前者把未证部分**精确隔离**成一条假设，且由 (2) 这条假设是最优的。

  【记号】本图记 V(c,h)、|c,h⟩（conv.verma-module-notation）。Lean 侧 `hwv R c h`。
  Kytölä 的 VirasoroProject **没有**这个构造（math-sources.md §34.7）。
