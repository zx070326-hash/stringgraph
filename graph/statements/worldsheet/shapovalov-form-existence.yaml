tags: [cft, representation-theory, verma-module, shapovalov, virasoro, formalized]
notes: |
  【★ 陈述沿革（2026-09-11，同一分支内，定稿前）】本卡首版（本分支提交 dfd7fbe）只写到 (1)(2)(3)，
  因为当时 Lean 侧只有「存在 ⟺ 存在 Shapovalov 泛函」。lead 随后把 main 上的
  **080d7f9** 通知本任务：Lean 已补上特征零域上的 **iff V(c,h) ≠ 0**，本卡遂在**合并进 main 之前**
  按 lead 指示把 (4) 写入陈述、lean_decl 改指 `exists_isContravariant_iff_hwv_ne_zero`。
  ⚠ 这不构成对项目原则 1（陈述不可变）的例外：本卡**从未进入 main**，也无任何 main 上的
  节点依赖它。**一旦本分支合并，本卡的 statement 文本即冻结**；此后要改只能新建 v2 + superseded_by。

  【为什么标题写「⟺」而不是「存在」——最要紧的一条】
  Lean 里被机器检查的是**等价与条件构造**，不是「Shapovalov 形式存在」。
  V(c,h) ≠ 0 仍未证（math.verma-module-free-over-negative-part 的 (4)，rigorous）。
  把无条件存在性写进本卡会让 formalized 变成假话。
  formalizer 在 Shapovalov.lean 文件头逐字写过：
  "no unconditional construction of the normalised Shapovalov form is possible from what is
  currently in this repository; the honest formalisation is the conditional one."
  080d7f9 之后这句仍然成立，只是**未决输入从「Shapovalov 泛函存在」收缩到了「V(c,h) ≠ 0」**
  ——后者是图上早已有卡、有来源、有明确瓶颈（PBW）的对象。这是本轮最大的净增量。

  【formalizer 的第 4 点：教科书「定义」在 V(c,h) = 0 时是空的】
  教科书写「Shapovalov 形式由 ⟨u·v_h, w·v_h⟩ := χ(σ(u) w) 定义」，其良定义性依赖
  「u ↦ u·v_h 的核恰是左理想 J(c,h)」，即 V(c,h) ≅ U(vir₋) 的自由性（PBW）。
  若 V(c,h) = 0，那条公式定义的是零空间上的空形式，**归一化 ⟨v_h,v_h⟩ = 1 无法满足**。
  ⇒ 「Shapovalov 形式存在」与「V(c,h) ≠ 0」在逻辑上**捆绑**；本卡 (4) 把这个捆绑
  在特征零域上证成了**等价**。任何「先定义形式、再由形式证 V ≠ 0」的写法都是循环的。
  对图的意义：**worldsheet.kac-determinant 不可能比 math.verma-module-free-over-negative-part
  更强**——行列式公式预设了形式存在、预设了 level N 有 p(N) 维的基。

  【两条路线为什么都绕过了 PBW】(1) 用全对偶 V(c,h) →ₗ R 带 σ-扭作用（对任意 ℚ-代数都是
  Virasoro 模，无分级、无有限性），把「构造形式」化归为「找一个权 (c,h) 的最高权向量」，
  再由万有性质一步得到形式。(4) 用 level 分解取 V_0 = K·|c,h⟩ 的坐标泛函。
  教科书的 Harish-Chandra 投影则要先有三角分解。**差别不是技巧问题**：
  这两条把未证部分精确隔离成一条假设，且 (2)(4) 证明了这条假设是最优的。

  【2026-09-11 傍晚补：更强结论现在有节点了（curator-verma-followups）】
  本卡的【不断言】(a)「不断言对每个 (c,h) 都存在 Shapovalov 形式」仍然有效且**不改**，
  但那条被排除的结论现由新卡 **worldsheet.shapovalov-form-unconditional-existence** 承载：
  「(H) = V(c,h) 在负部上自由（PBW 基，即 math.verma-module-free-over-negative-part 的
  (1)(2)(3)）⇒ 归一化 Shapovalov 形式存在且唯一」，任意交换 ℚ-代数上的条件版 +
  特征零域上的无条件版；其推导 --via-pbw（rigorous）把本卡推导
  worldsheet.shapovalov-form-existence--via-pbw 实际证到、但本卡陈述不承载的那段搬了过去。
  **分工**：本卡是**条件命题**且 formalized（有效状态由 --via-lean 决定），
  新卡更强但封顶 rigorous（输入 (H) 未形式化，瓶颈 Mathlib 无 PBW）。
  下游只需要条件形式（尤其是要在 Lean 里推理）时应引本卡；需要「形式确实存在」这一前提
  （例如 worldsheet.kac-determinant-v2 的 Gram 行列式预设了形式存在）时应引新卡。
  本卡未新增指向新卡的推导：新卡是本卡的**下游**（其推导 depends_on 本卡的 (1)(2)），
  反向再加一条会造环。

  【记号】本图记 V(c,h)、|c,h⟩（conv.verma-module-notation）。Lean 侧 `hwv R c h`。
  Kytölä 的 VirasoroProject **没有** Shapovalov 形式（math-sources.md §34.7）。
