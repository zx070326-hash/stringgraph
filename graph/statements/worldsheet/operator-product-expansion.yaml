id: worldsheet.operator-product-expansion
kind: definition
status: physical-argument
title: 算子乘积展开（OPE）及其收敛性假定
statement: |
  设 {O_i} 是理论的局域算子的一组基。算子乘积展开是如下断言：对任意两个局域算子 A、B，
  存在只依赖坐标差的系数函数 c_i^{AB}，使得在任何期望值中
    A(z, z̄) B(0, 0) = Σ_i c_i^{AB}(z, z̄)  O_i(0, 0),
  该等式在算子意义下成立，即两侧插入任意其它算子后给出相同的关联函数。
  展开的奇异部分由 z → 0 时发散的项组成，记作 A(z,z̄) B(0,0) ∼ （奇异项）。

  **收敛性**：Polchinski 断言在二维共形场论中该展开不只是渐近展开，而是有**有限收敛半径**的
  收敛级数，收敛半径由离 z = 0 最近的其它算子插入点的距离给出；OPE 的这一性质被用于
  围道变形论证（worldsheet.ope-commutator-dictionary）与自举方程
  （worldsheet.ope-associativity-bootstrap）。**该收敛性在来源中未被证明。**
uses: []
uses_conventions: [conv.worldsheet-complex-coords]
sources:
  - ref: polchinski-1998-v1
    loc: "§2.2（p.36 起），约 eq. (2.2.1)–(2.2.4)；(2.2.4)（Taylor 展开）已核实在 p.38"
    note: |
      (2.2.4) 的公式号经 schrans-2020 目录核实（`2.7 p 38: Eq. (2.2.4) A Taylor Expansion`）；
      (2.2.1)–(2.2.3) 未核实。收敛半径的图示对应 (2.9.3) 附近，schrans-2020 §2.77 复现。
      见 literature/extractions/polchinski-1998-v1.md E27 与 Q3。
  - ref: polchinski-1998-v1
    loc: "§2.9, **p.69**（(2.9.2) 下方正文，无式号）：**OPE 收敛性的论证**；配 (2.9.1)（|z| < 1 的设定）、(2.9.2)（按 L_0, L̃_0 本征态展开）、(2.9.3)（三算子结合性）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——**Q3 的结论被修正：
      原书给了论证，不是「书中不证」**】

      原书 p.69 逐字：
        "By the state–operator correspondence this is equivalent to gluing back the disk with the
         appropriate local operator A_{ij,z,z̄}(0,0) and so we are done! To put this in standard form
         expand in a complete set of L_0, L̃_0 eigenstates, A_{ij,z,z̄} = Σ_k z^{h_k−h_i−h_j}
         z̄^{h̄_k−h̄_i−h̄_j} c^k_{ij} A_k **(2.9.2)**, with the z- and z̄-dependence determined by the
         conformal weights as in eq. (2.4.20). **The convergence of the OPE is just the usual
         convergence of a complete set in quantum mechanics. The construction is possible as long as
         there are no other operators with |z'| ≤ |z|, so that we can cut on a circle of radius
         |z| + ε.**"

      → **三点结论（取代抽取记录 Q3 里「抽取者没有在任何公开源里看到 Polchinski 证明这一点」）**：
        (1) 原书**给了**论证，并且明确说明了收敛半径的来源（切开路径积分的圆的半径 |z| + ε）；
        (2) 该论证建立在**态-算子对应**（worldsheet.state-operator-isomorphism）之上，
            而后者本身是路径积分构造、不是定理；
        (3) 「complete set 的通常收敛」在无穷维希尔伯特空间上是一个**未加限定的类比**，
            没有解析估计、没有收敛域定理。
      → **因此：凡把 OPE 收敛性当作 axiom 的记法都应改为 physical-argument**
        （抽取记录 Q3 原建议建 axiom 节点，现改为 physical-argument）。
        本图中承载「OPE 收敛/结合性」的节点是 worldsheet.ope-associativity-bootstrap 与
        math.vertex-algebra-ope-analytic-convergence（后者是数学侧的独立来源，不受本条影响）。
        本图**没有**名为 `worldsheet.ope-convergence` 的节点；是否单列由 lead 决定，已列入报告。

      见 literature/extractions/polchinski-1998-v1.md §12.4（Q3）与 §12.10 表 A 的 Q3。
tags: [cft, ope, definition, convergence]
notes: |
  **为什么 status 是 physical-argument 而不是 rigorous**：作为定义，本节点的严格程度取决于
  被定义对象是否良定义。这里被定义的不只是「形式展开」，还附带了「存在有限收敛半径」的断言，
  而来源既不给出算子基所在的拓扑向量空间，也不证明收敛。按 docs/STATUS_LEVELS.md
  「不确定时选低的那级」，定义本身只能记为 physical-argument。

  **lead 裁决（2026-09-10）**：本批不另建「OPE 收敛」公理节点。凡靠「围道变形 + OPE」
  得到算子代数关系的推导（本批的 ope-commutator-dictionary、free-boson-central-charge-d--via-ope、
  schwarzian-transformation-of-t、ope-associativity-bootstrap 等）一律 status: physical-argument，
  并在 gaps 中写明「OPE 级数收敛与围道变形的合法性在来源中未证明」。
  若日后要把这条瓶颈显式化（例如为形式化做准备），再单建 axiom 节点，
  届时本节点的 notes 应指向它。抽取记录 Q3 记录了同一问题。

  **拆法说明（curator, 2026-09-11；依据 literature/extractions/math-sources.md §8–§14）**：
  本节点一张卡承担了至少四件事，数学侧现已拆成四个 `math` 节点，本节点的 id 与 statement 文本**不改**：
    - math.formal-distribution-locality（definition, rigorous）：形式分布的局域性 (z−w)^N[A(z),B(w)] = 0
      ← Schottenloher Def 10.7；Gui Def 7.6。
    - math.locality-ope-equivalences-v2（proposition, rigorous；初版 math.locality-ope-equivalences 已 superseded_by 它）：
      局域性 ⟺ delta 分解 ⟺ 物理写法的 OPE ⟺ 模式对易子公式 ← Schottenloher Thm 10.10。这是本节点里「A(z)B(0) ∼ 奇异项」那部分的**形式侧**严格版本。
    - math.vertex-algebra-associativity（proposition, rigorous）：Y(A,z)Y(B,w)C = Y(Y(A,z−w)B,w)C 于 V((w))((z−w))
      ← Frenkel–Ben-Zvi Thm 3.2.1（勘误表措辞）。纯形式，无收敛性。
    - math.vertex-algebra-complex-analytic-locality（definition）+ math.vertex-algebra-ope-analytic-convergence
      （proposition, rigorous）：复解析局域性（Gui Def 7.2）⇒ OPE 存在、a.l.u. 收敛于 0 < |z₁−z₂| < |z₂|、奇异项有限
      ← Gui Prop 7.12。这是本节点里「**有限收敛半径**」那句在数学上最贴近的对应物——但**前提是 Def 7.2**，
      Polchinski 没有对应假设。
  **本节点保持 physical-argument，瓶颈只是搬了家**：从这批数学节点到本节点没有任何一条边，因为文献双方互不引用，
  数学侧也没有处理「D 分量 + 洛伦兹号差 + bc 鬼场 + 路径积分定义」。缺的那一步被显式化为
  **worldsheet.string-cft-is-a-vertex-algebra-v2**（proposition，无推导，open；2026-09-11 起取代同名无 -v2 的旧卡）——它才是 OPE 瓶颈的真正根，
  且与无鬼定理的不定内积缺口是同一个缺口。
  **依赖本节点的既有推导一律不改 depends_on**（它们用的是物理 OPE，含收敛半径断言）。严格路线另起一条：
  worldsheet.ope-pole-mode-commutator-dictionary--via-locality-theorem（kind proof, status rigorous；2026-09-11 起挂在新陈述 worldsheet.ope-pole-mode-commutator-dictionary 上，不再挂 ope-commutator-dictionary），其有效状态被上述 open
  节点压到 open，围道那条仍是 best_derivation——这正是想要的效果：图上显示「严格路线存在，卡在弦 CFT 是否顶点代数」。
