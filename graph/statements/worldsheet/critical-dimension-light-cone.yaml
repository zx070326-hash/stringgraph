id: worldsheet.critical-dimension-light-cone
kind: proposition
title: 光锥洛伦兹代数闭合要求 D = 26 且 a = 1
statement: |
  在开弦光锥量子化（worldsheet.light-cone-quantization）中，洛伦兹生成元 J^{μν} 由横向振子
  表示，其中 J^{i-} 因代入 α^-_n = L^⊥_n/((2α')^{1/2} p^+) 而成为横向模式的三次式
  （横向指标 i = 2..D-1）。
  经典上 [J^{i-}, J^{j-}] = 0；量子化后该对易子取值
    [J^{i-}, J^{j-}] = -(1/(2α' (p^+)^2)) Σ_{n≥1} Δ_n (α^i_{-n} α^j_n - α^j_{-n} α^i_n)，
    Δ_n = n (26 - D)/12 + (1/n) [ (D - 26)/12 + 2(1 - a) ]，
  （整体归一化依赖 α' 与 p^+ 的约定，Δ_n 的形式不依赖）。
  因此洛伦兹代数在 H_lc 上闭合（即 [J^{i-}, J^{j-}] = 0，对所有 n ≥ 1 有 Δ_n = 0）
  当且仅当 D = 26 且 a = 1。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard]
sources:
  - ref: gsw-1987-v1
    loc: "§2.3.1，[J^{i-}, J^{j-}] 的显式计算与 Δ_n 的表达式"
    note: GSW 用 mostly-minus 号差；Δ_n 的表达式与号差无关，此处按 conv.metric-mostly-plus 转写。
  - ref: polchinski-1998-v1
    loc: "§1.3，约 eq. (1.3.30)–(1.3.36)；显式的 [J^{i-}, J^{j-}] 计算见习题 1.3"
    note: |
      Polchinski 正文给出的是表示论版本（第一激发级必须填满 SO(D-2) 的无质量矢量表示，
      故 a = 1；再由零点能 -(D-2)/24 = -a 得 D = 26），并把洛伦兹代数的直接验证留作习题。
      本节点陈述的是习题/GSW 的版本。
tags: [bosonic-string, critical-dimension, light-cone, lorentz-invariance]
author: curator-critdim
