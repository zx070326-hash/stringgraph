  - ref: feigin-fuchs-1982
    loc: "§3.2 «Теорема Каца», Теорема 3.1（俄文原刊 Функц. анализ 16:2 (1982) 第 58 页）"
    note: |
      **只用于重数/根结构的对照**。FF 的 M_{h,c}(k) 显式定义为 PBW 基
      e_{−1}^k, e_{−1}^{k−2}e_{−2}, …, e_{−k} 作用于真空所得基的 Gram 矩阵
      （L1，math-sources.md §34.2(b)）；k = 3 时那组基正是本卡的
      {u₁₁₁, u₂₁, u₃} = {L₋₁³v, L₋₂L₋₁v, L₋₃v}，**但 FF 已假定它是基**。
      FF 的形式是 det² 而非 det，其常数 C 只被断言**非零**。
tags: [cft, representation-theory, verma-module, shapovalov, kac-determinant, virasoro, formalized]
notes: |
  【本卡比 worldsheet.kac-determinant-level-two 强在哪里——最要紧的一条】
  level-two 卡的 (4)（「把行列式写成 Kac 乘积形」）**不在 Lean 里**，是 curator 在那张卡
  notes 里做的手算，那张卡的推导 gaps (ii) 因此写明「(4) 的严格程度是 curator 手算 +
  researcher 数值核对，不是 formalized」。
  **本卡的 (3) 在 Lean 内部**：`IsContravariant.gram_level_three_det_eq_kac` 是一条定理，
  假设只有五个根的四条**清过分母的对称函数等式**（h₁₁ = 0、8(h₁₂+h₂₁) = 5−c、16h₁₂h₂₁ = c、
  3(h₁₃+h₃₁) = 7−c、3h₁₃h₃₁ = c+2），结论是乘积形。
  ⇒ 「Gram 行列式 = Kac 乘积」这一步在 level 3 是机器检查的，在 level 2 不是。
  **代价**：Lean 的陈述因此不含 h_{r,s}(c) 的显式公式，只含它们的对称函数
  （见【不断言】(c)）——而这恰好也是**优点**：

  【为什么「不依赖 √((c−1)(c−25)) 分支」是实质改进】
  Schottenloher Theorem 6.12 的 h_{p,q}(c) 含 √((c−1)(c−25))，故单个 h₁₂ 与 h₂₁ 的**标号**
  依赖平方根的分支选择（level-two 卡 notes 已就此留了告诫）。
  本卡 (3) 只用到每一对的**和与积**，而和与积在两支交换下不变，
  所以 (3) 既不需要 R 中存在平方根，也不需要选分支，更不需要 R 是域或有序。
  这就是 Lean 能把这条比较做进定理的技术原因。

  【(3) 的四条关系与 Schottenloher 的 h_{p,q}(c) 相容——curator 手算核对，2026-09-11】
  取 h_{p,q}(c) = (1/48)[(13−c)(p²+q²) + √Δ·(p²−q²) − 24pq − 2 + 2c]（Theorem 6.12），
  记 Δ := (c−1)(c−25)：
  · **h₁₁ = 0**：p = q = 1 ⇒ (1/48)[2(13−c) − 24 − 2 + 2c] = (1/48)[26 − 2c − 26 + 2c] = 0。✓
  · **(1,2) 与 (2,1)**：p²+q² = 5、pq = 2、p²−q² = ∓3 ⇒ 记 S := 5(13−c) − 48 − 2 + 2c = 15 − 3c，
    h₁₂ + h₂₁ = 2S/48 = (15 − 3c)/24 = (5 − c)/8；
    h₁₂ · h₂₁ = (S² − 9Δ)/48² = [225 − 90c + 9c² − 9(c² − 26c + 25)]/2304 = 144c/2304 = c/16。✓
    即 Lean 的假设 e2s : 8(h₁₂+h₂₁) = 5 − c 与 e2p : 16h₁₂h₂₁ = c。
  · **(1,3) 与 (3,1)**：p²+q² = 10、pq = 3、p²−q² = ∓8 ⇒ 记 T := 10(13−c) − 72 − 2 + 2c = 56 − 8c，
    h₁₃ + h₃₁ = 2T/48 = (56 − 8c)/24 = (7 − c)/3；
    h₁₃ · h₃₁ = (T² − 64Δ)/48² = [3136 − 896c + 64c² − 64(c² − 26c + 25)]/2304
              = (768c + 1536)/2304 = (c + 2)/3。✓
    即 Lean 的假设 e3s : 3(h₁₃+h₃₁) = 7 − c 与 e3p : 3h₁₃h₃₁ = c + 2。
  ⚠ **这一段是 curator 的手算，不在 Lean 里、也不是任何来源的逐字内容**。
  它支持的只是「Lean 的 (3) 所假设的那四条关系，在 R = C 与 Schottenloher 的 h_{p,q}(c) 下
  确实成立」；**(3) 本身的证明不依赖它**（(3) 是条件命题），故本卡的 formalized
  不被这段手算拖低——与 level-two 卡 (4) 的情形不同，那里手算出现在**结论**里。

  【α₃ = 2304 与 α_N 的乘积公式】
  本卡给出 α₃ = 48·16·3 = 2304 > 0。连同 level-two 的 α₂ = 32 与 level-1 的 α₁ = 2，
  三个值与 worldsheet.kac-determinant-v2 notes (D) 登记的乘积公式
  α_N = ∏_{rs ≤ N} ((2r)^s · s!)^{p(N−rs) − p(N−r(s+1))} 在 N = 1, 2, 3 处逐项吻合
  （N = 3 的因子是 2^1 · 8^0 · 48^1 · 4^1 · 6^1 = 2304）。
  ⚠ 该公式本身**未形式化、也不是文献逐字**，见那张卡的登记。本卡只承载 N = 3 的数字。

  【查重】2026-09-11 跑 `uv run stringgraph search kac`：既有节点是
  worldsheet.kac-determinant（已 superseded）、worldsheet.kac-determinant-v2（一般 N，rigorous）、
  worldsheet.kac-determinant-level-two（N ≤ 2，formalized）。本卡是 level-two 的**同构姊妹卡**
  （同一前提、同一不断言清单、升一级），**不重复**：level-two 不含 level-3 的任何 Gram 元，
  也不含 Lean 内的 Kac 比较。

  【2026-09-11（lean-wire-7）：【不断言】(a) 在 det₃ ≠ 0 处**局部解除**（curator；只加 notes，
  陈述文本一字未动）】与 level-two 卡的【2026-09-11（三）】同样放宽：特征零域上，若本卡 (2) 的
  det₃(c,h) ≠ 0，则 {u₃, u₂₁, u₁₁₁} 是 V₃ 的一组**基**，dim V₃ = 3 = p(3)
  （`StringFormal.Virasoro.IsContravariant.finrank_levelSpan_three`，GenericIndependence.lean，
  formalizer 分支 agent/formalizer/pbw-n34，lead 以 1b3a6e3 合入 main；无 sorry），
  故 (2)(3) 在这些 (c,h) 处**就是** level-3 的 Kac 行列式本身，不只是张成集的 Gram。
  张成一半现在也有具名引理：`levelSpan_three_eq_span_descFamily3`（无条件，任意交换 ℚ-代数），
  【不断言】(a) 里「这条化简在 Lean 里没有具名引理」的那句已过时——化简由 VermaPBW.lean 的
  `levelSpan_eq_ordSpan`（straightening）吸收，再由 `ordWord_sum_three` 枚举有序词。
  仍未解除：Kac 零点处（det₃ = 0 不蕴含线性相关；要真正的 PBW）与 B 的存在性前提（【不断言】(b)）。
  图侧承载：worldsheet.verma-level-basis-generic-low-levels-v2（(1)(2)(3)）。
