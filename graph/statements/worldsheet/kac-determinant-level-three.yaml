id: worldsheet.kac-determinant-level-three
kind: proposition
title: Verma 模 level-3 的六个 Gram 元与 3×3 行列式 det₃ = 48h²(16h²+2h(c−5)+c)(3h²+h(c−7)+c+2)，**且在 Lean 内部**等于 Kac 乘积形 2304(h−h₁₁)²(h−h₁₂)(h−h₂₁)(h−h₁₃)(h−h₃₁)（张成集的 Gram，非基的 Gram）
statement: |
  设 R 是交换环且是 ℚ-代数（物理情形取 R = C），(c, h) ∈ R²，V(c,h) 是 Virasoro Verma 模
  （worldsheet.verma-module-v2），v := |c,h⟩ 是最高权向量，约定 conv.virasoro-standard。
  设 B 是 V(c,h) 上的**归一化逆变双线性型**，即 B 逆变（B(L_n x, y) = B(x, L_{−n} y)，
  见 worldsheet.shapovalov-form-uniqueness）且 B(v, v) = 1。记 ⟨x, y⟩ := B(x, y)。

  记 level-3 的三个显式降算符态

      u₃ := L₋₃ v,     u₂₁ := L₋₂ L₋₁ v,     u₁₁₁ := L₋₁³ v = L₋₁(L₋₁(L₋₁ v))。

  则：

  **(1) 六个独立 Gram 元**（非对角的另一半由 worldsheet.shapovalov-form-uniqueness (2)
  的对称性给出，不是额外假设）：

      ⟨u₃, u₃⟩     = 6h + 2c
      ⟨u₃, u₂₁⟩    = 10h
      ⟨u₃, u₁₁₁⟩   = 24h
      ⟨u₂₁, u₂₁⟩   = 8h² + ch + 8h
      ⟨u₂₁, u₁₁₁⟩  = 36h² + 12h
      ⟨u₁₁₁, u₁₁₁⟩ = 48h³ + 72h² + 24h

  **(2) 3×3 行列式**（按第一行展开，九个元全部代入）：

      det₃ := det [ ⟨u_i, u_j⟩ ]_{i,j ∈ {3, 21, 111}}
            = 48 h² ( 16h² + 2h(c−5) + c ) ( 3h² + h(c−7) + c + 2 )。

      中间因子 16h² + 2h(c−5) + c 正是 worldsheet.kac-determinant-level-two (3) 的
      level-2 行列式除以 2h。

  **(3) 与 Kac 乘积形的相等——本条是一条 R-多项式恒等式，不含平方根**：
  设 h₁₁, h₁₂, h₂₁, h₁₃, h₃₁ ∈ R 满足（全部是**清过分母**的对称函数条件）

      h₁₁ = 0,
      8(h₁₂ + h₂₁) = 5 − c,      16 h₁₂ h₂₁ = c,
      3(h₁₃ + h₃₁) = 7 − c,      3 h₁₃ h₃₁ = c + 2,

  则

      det₃ = 2304 · (h − h₁₁)² · (h − h₁₂)(h − h₂₁) · (h − h₁₃)(h − h₃₁)。

  指数 2, 1, 1, 1, 1 恰为 p(3 − 1·1) = p(2) = 2、p(3 − 1·2) = p(3 − 2·1) = p(1) = 1、
  p(3 − 1·3) = p(3 − 3·1) = p(0) = 1，与 worldsheet.kac-determinant-v2 在 N = 3 的
  重数结构逐项吻合；常数是 **α₃ = 48 · 16 · 3 = 2304 > 0**。

  **(4) c = 1 处的退化核对**：代 c = 1，Kac 权退化为 h_{r,s} = (r−s)²/4，即
  h₁₁ = 0、h₁₂ = h₂₁ = 1/4、h₁₃ = h₃₁ = 1，而 (2) 的右端变成

      48h²(16h² − 8h + 1)(3h² − 6h + 3) = 144 h² (4h − 1)² (h − 1)²，

  是完全平方——与重根必须成对出现相符。

  【本节点明确**不**断言】
  (a) **(2) 是「level-3 的 Kac 行列式」**。Kac 行列式是 Gram 矩阵在 V_3 的一组**基**上的
      行列式；{u₃, u₂₁, u₁₁₁} 只被证明**落在** V_3 里。它们张成 V_3，但这一步比 level 2
      更弱：3 的合成有**四个**（[3]、[2,1]、[1,2]、[1,1,1]），第四个给出的向量 L₋₁L₋₂v
      要用括号关系 [L₋₁, L₋₂] = L₋₃ 才能化到上面三个的线性组合，而**这条化简在 Lean 里
      没有具名引理**（见推导 gaps (i)）。**线性无关**更是完全没有证——那正是 PBW
      （math.verma-module-free-over-negative-part 的 (2)(3)：dim V_3 = p(3) = 3）。
      ⇒ (2)(3) 是**张成集的 Gram 行列式**与它的一条多项式因式分解。
  (b) **B 的存在性**。本卡的一切都以「设 B 是归一化逆变型」为前提；
      存在性见 worldsheet.shapovalov-form-existence，无条件版本要 V(c,h) ≠ 0。
  (c) **h_{r,s}(c) 的显式表达式**。(3) 只用五个根的**对称函数**（和与积），
      **不引入** √((c−1)(c−25))，因此也**不断言**这些 h_{r,s} 在 R 中存在
      （(3) 是「若 R 中存在满足那四条关系的元素，则……」的条件命题）。在 R = C 上
      worldsheet.kac-determinant-v2 的 h_{r,s}(c) 满足那四条关系——这一步核对见 notes。
  (d) **一般 N 的行列式公式与常数 α_N**。见 worldsheet.kac-determinant-v2（rigorous，未形式化）
      与该卡 notes 里登记的 α_N 乘积公式（未形式化、非文献）。本卡只做 N = 3。
  (e) **零点的表示论含义**（奇异向量、可约性、不可约商）不在本卡内。
  (f) 任何正定性/酉性；B 是 R-双线性型，R 上无序结构。
