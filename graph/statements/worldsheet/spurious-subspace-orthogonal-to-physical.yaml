id: worldsheet.spurious-subspace-orthogonal-to-physical
kind: proposition
title: 无壳伪态子空间与物理态正交：S ⊆ H_phys^⊥（等价重述：S ∩ H_phys ⊆ H_0）
statement: |
  设定与记号沿用 worldsheet.spurious-subspace 与 worldsheet.old-covariant-physical-states：
  固定 D、交换 ℚ-代数 R、对角度规 η（conv.metric-mostly-plus）、零模参数
  a^μ = α^μ_0 = (2α')^{1/2} k^μ（conv.alpha-prime-regge，固定动量扇区）、截距 a
  （conv.intercept-sign-a，物理态条件写 (L_0 − a)|ψ⟩ = 0）；F 上的双线性型 ⟨·,·⟩ 如
  worldsheet.fock-indefinite-form，
    H_phys = {|ψ⟩ ∈ F : (L_0 − a)|ψ⟩ = 0, L_n|ψ⟩ = 0 ∀ n > 0}，
    S = Σ_{n ≥ 1} L_{−n} F   （**不含质量壳条件**），
    H_phys^⊥ = {|χ⟩ ∈ F : ⟨χ|ψ⟩ = 0 ∀ |ψ⟩ ∈ H_phys}，
    H_0 = H_phys ∩ H_phys^⊥（零模态 = H_phys 的根基）。
  则

  **(1) S ⊆ H_phys^⊥**：对一切 |χ⟩ ∈ S 与一切 |ψ⟩ ∈ H_phys 有 ⟨χ|ψ⟩ = 0。
  具体地，对 n ≥ 1 与任意 |φ⟩ ∈ F：⟨L_{−n}φ | ψ⟩ = ⟨φ | L_n ψ⟩ = 0。

  **(1′) 等价重述：S ∩ H_phys ⊆ H_0。**这不是新内容，而是把 (1) 与 H_0 = H_phys ∩ H_phys^⊥
  的定义并列写出：|χ⟩ ∈ S ∩ H_phys 时 |χ⟩ ∈ H_phys 且由 (1) 得 |χ⟩ ∈ H_phys^⊥。
  特别地这样的 |χ⟩ 范数为零：⟨χ|χ⟩ = 0。

  本命题**不**要求 |χ⟩ 在质量壳上，故它比「Polchinski 意义的伪态 ⊥ 物理态」
  （worldsheet.spurious-orthogonal-to-physical 的 (1)）**严格更强**：后者是本命题在
  ker(L_0 − a) 上的限制（worldsheet.ocq-spurious-states-v2 的 S(k) = S ∩ ker(L_0 − a) ⊆ S）。
  又因 H_phys ⊆ ker(L_0 − a)，(1′) 与该卡 (2) 的前半（N ⊆ H_0）是**同一个断言**。

  本命题**不**断言反包含 H_0 ⊆ S ∩ H_phys（「每个零范数物理态都是伪态」）；
  那是无鬼定理难的那一半，本图无节点。
uses_conventions: [conv.metric-mostly-plus, conv.virasoro-standard, conv.alpha-prime-regge, conv.intercept-sign-a]
formal:
  lean_decl: StringFormal.NoGhost.Fock.spuriousSubmodule_le_orthComplement
  lean_file: StringFormal/NoGhost/PhysicalStates.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/PhysicalStates.lean :: StringFormal.NoGhost.Fock.spuriousSubmodule_le_orthComplement（陈述 (1)）；Fock.spurious_inf_physSubmodule_le_nullSubmodule 与 Fock.Lop_neg_apply_mem_nullSubmodule（陈述 (1′)）；Fock.pairing_self_eq_zero_of_mem_nullSubmodule（零范数）；对象 Fock.{orthComplement, mem_orthComplement, nullSubmodule, mem_nullSubmodule, spuriousSubmodule}"
    note: |
      本仓库，合并提交 2c8b577，形式化提交 58216ac；Lean 4 + Mathlib v4.33.1。
      Lean 的 `spuriousSubmodule η a`、`physSubmodule η a a₀`、`orthComplement`、`nullSubmodule`
      与本陈述的 S、H_phys、H_phys^⊥、H_0 **逐字对应**（Lean 里截距叫 `a₀`，零模参数叫 `a`）。
      文件头自述「Complete, no `sorry`; axioms are `propext`, `Classical.choice`, `Quot.sound` only」。
      **curator 未自行重跑 `lake build`**。
  - ref: polchinski-1998-v1
    loc: "§4.1，eq. (4.1.8)，p.122（⟨ψ|χ⟩ = Σ_k ⟨L_k ψ|χ_k⟩ = 0）"
    note: |
      **平行的文献论证，覆盖的是带质量壳的版本**：Polchinski 的伪态含质量壳条件，
      故书中那句话对应 worldsheet.spurious-orthogonal-to-physical，而不是本卡的无壳版。
      同一段计算逐字适用于无壳的 |χ⟩（质量壳条件在计算中根本没被用到），
      这一观察由本图记录、不出自原书。式号经 schrans-2020 目录核实，未核对原书；
      抽取记录 literature/extractions/polchinski-1998-v1.md#E55。
tags: [bosonic-string, quantization, old-covariant, spurious, null-state, formalized]
notes: |
  【本卡的来历】2026-09-11 拆 worldsheet.ocq-spurious-states 时新建
  （lead 裁决，docs/ROADMAP.md 待拆清单）。原因：worldsheet.spurious-orthogonal-to-physical
  的陈述 (1) 逐字写的是「任意伪态 |χ⟩ … ∈ S(k)」，而 S(k) 按 worldsheet.ocq-spurious-states(-v2)
  的定义**带质量壳条件**；Lean 的 `spuriousSubmodule_le_orthComplement` 证的却是对整个无壳 S
  成立的更强命题。为了让 Lean 逐字对应一张卡（docs/STATUS_LEVELS.md 对 definition 传播的
  处理办法），把无壳版单列为本卡；带质量壳的那条命题保持原样、不改一字，
  由本卡加「限制到 ker(L_0 − a)」得到。

  【为什么 (1) 与 (1′) 在同一张卡上，不违反「一个节点一个命题」】(1′) 不含新的数学内容：
  H_0 在 worldsheet.old-covariant-physical-states 中就**定义为** H_phys ∩ H_phys^⊥，
  Lean 里 `nullSubmodule := physSubmodule ⊓ orthComplement physSubmodule` 也是定义，
  于是 `spurious_inf_physSubmodule_le_nullSubmodule` 的证明是把 (1) 与该定义拼一行
  （`⟨hχ.2, spuriousSubmodule_le_orthComplement hχ.1⟩`），没有独立的推导步骤。
  若 reviewer 认为仍应拆，拆分是无损的：(1′) 可单独成卡并 depends_on 本卡。

  【与 worldsheet.spurious-orthogonal-to-physical 的分工】那张卡是 Polchinski 逐字版
  （伪态含质量壳），并且**多含一条本卡没有的内容**：其 (2) 后半「加零态不改变内积、
  Fock 内积在 H_phys/N 上诱导良定义的形式」，那一条在 Lean 里没有具名引理
  （见该卡 --via-lean 的 gaps (i)）。本卡不覆盖它。

  查重：`uv run stringgraph search 伪态 / spurious` 于 2026-09-11 只命中
  ocq-spurious-states、spurious-orthogonal-to-physical、physical-states-level-one、
  virasoro-generators-adjoint，无既有节点承载无壳版 S ⊥ H_phys。
