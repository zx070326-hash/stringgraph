id: worldsheet.descendant-weight-grading
kind: proposition
title: 降算符作用提高 L_0 本征值：L_{-k_1}…L_{-k_n} v 的权为 h + Σ k_i
statement: |
  设 V 是 Virasoro 代数（worldsheet.virasoro-algebra）的一个表示，v ∈ V 是权 h 的最高权向量，即
    L_0 v = h v,   L_n v = 0  (n > 0)。
  设 k_1, …, k_n ≥ 1 为整数。则
    L_0 ( L_{-k_1} L_{-k_2} … L_{-k_n} v ) = ( h + Σ_{i=1}^n k_i ) ( L_{-k_1} … L_{-k_n} v )。
  特别地，由降算符生成的向量若非零，其 L_0 本征值严格大于 h，
  故 v 生成的最高权模按 L_0 本征值分级为 ⊕_{N ≥ 0} V_{h+N}，其中 V_h 由 v 张成。
uses:
  - worldsheet.virasoro-algebra-v2
uses_conventions: [conv.virasoro-standard]
sources:
  - ref: polchinski-1998-v1
    loc: "§2.9, eq. (2.9.14)，p.72"
    note: |
      公式号经 schrans-2020 目录核实（`2.78 p 72: Eq (2.9.14) Non-Highest Weight States in
      Unitary CFTs`）。**来源把这一条放在幺正 CFT 的语境里陈述**；本节点按 reviewer-ch23
      的裁定把它改写为纯粹的最高权模命题（L_0 本征值的计算只用 [L_0, L_{-k}] = k L_{-k}，
      与幺正性无关），幺正性只在下游用到，见 worldsheet.weight-zero-primary-constant。
      ⚠ 抽取记录 Q5：**本次核实没有找到任何证据表明 Polchinski §2.9 讨论 Verma 模或 Kac 行列式**，
      §2.9（p.68–73，标题 "More on states and operators"）中被核对源标注的只有
      (2.9.3)、(2.9.14)、(2.9.15) 三处。这与既有节点 worldsheet.verma-module 把 loc 写成
      「§2.9」有张力，见本节点 notes。
tags: [cft, virasoro, highest-weight, representation-theory]
notes: |
  **本节点是纯表示论命题**：它对 Virasoro 代数的任意最高权模成立，不需要幺正性、
  不需要态-算子同构、不需要那个模是不可约的或是 Verma 模。因此它可以标 rigorous
  而不被 CFT 语境里的 physical-argument 节点拖低。

  与之配对的、**确实**需要幺正性的命题是 worldsheet.weight-zero-primary-constant
  （权为零的主场是常数）；「每个态要么是最高权态、要么是某个最高权态的 descendant」
  这一分解也需要幺正性（或至少完全可约性），已移到该节点的 notes 里，本节点不断言它。

  **对既有节点的提醒（未修改，交 lead / auditor 处理）**：
  worldsheet.verma-module 的 sources 写 `polchinski-1998-v1, loc: §2.9`，
  worldsheet.kac-determinant 亦与 §2.9 相关。按抽取记录 Q5，§2.9 很可能只讲
  最高权态与降算符生成的模，**不讲 Verma 模的形式定义，也不讲 Kac 行列式**；
  Kac 行列式的正确出处应是 kac-1979 / feigin-fuchs-1982（sources.bib 中已有）。
  这是 negative evidence（核对源是选择性注释，不是完整转录），不能当定论，
  需人工翻 p.68–73 确认。

  【拆卡换代记录，2026-09-11（curator）】
  (1) 本节点 `uses` 原为 worldsheet.virasoro-algebra，该卡已拆分并标 superseded_by，
      现就地改指 worldsheet.virasoro-algebra-v2（formalized）。本节点用到的只是
      括号关系与最高权向量的定义，v2 逐字包含，语义无变化。
      **陈述文本第一行的括号指针「（worldsheet.virasoro-algebra）」按纪律不改**
      （改陈述文本等于新建节点）；该 id 仍可解析，其 superseded_by 指向 v2。
  (2) 上面这条「对既有节点的提醒」已被**部分**处理：worldsheet.verma-module 拆卡后，
      新卡 worldsheet.verma-module-v2 把 polchinski-1998-v1 §2.9 降格为背景引用并在
      source note 中逐字记下本条 Q5 的结论，数学侧改以 kac-1979 与本仓库 Lean 文件为准。
      worldsheet.kac-determinant 的 §2.9 问题**仍未处理**（其推导的 sources 是
      kac-1979 Theorem 1 与 feigin-fuchs-1982 §2，本身不引 §2.9），
      「人工翻 p.68–73 确认」这一条仍然挂着，交 researcher。
