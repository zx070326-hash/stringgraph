  「Borcherds 证的 T¹ 就是本项目 D(Ε)」这一跳就同样只有 physical-argument 强度。
  补它的路已在 worldsheet.ddf-contour-equals-mode-sum 的 notes【补它的两条路】登记
  （在 Lean 里引入形式留数）；那条路线完成时，--via-borcherds-1992 的 effective 会随之抬到
  rigorous。**在此之前，本卡的回译审计（首当其冲 ms.no-ghost-theorem 一类里程碑）
  必须显式引用这条缺口**，另加桥接边 gaps 第 3 条的两条子缺口
  （Borcherds 的 II_{1,1} 是二维格而本卡的塔只沿一条类光方向分片；
  本卡塔上的型是约定式定义而 Borcherds 的形式是构造出来的）。

  **(5) 上面各段「本卡仍无推导」的表述按本节订正，其余内容（各 N 片的关闭记录、
  分片拼装、三种等价写法、N ≥ 6 前沿、三角性路线被证伪、26 只在这里、等距同构不多给东西、
  逐句字典）全部一字未改地仍然有效。** 本节只加两条事实：本卡多了一条严格文献来源的推导；
  它的瓶颈指向 worldsheet.ddf-contour-equals-mode-sum。
  statement 正文（不可变的卡片内容）**一字未动**。
