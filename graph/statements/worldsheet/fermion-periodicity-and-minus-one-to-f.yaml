id: worldsheet.fermion-periodicity-and-minus-one-to-f
kind: proposition
title: 费米场的周期路径积分给 Tr[(−1)^F e^{−HU}]，反周期路径积分给普通迹
statement: |
  设一个费米自由度：算符 ψ̂、χ̂ 满足 {ψ̂, χ̂} = 1、ψ̂² = χ̂² = 0，二维态空间由
    ψ̂|↓⟩ = 0,  χ̂|↓⟩ = |↑⟩,  ψ̂|↑⟩ = |↓⟩,  χ̂|↑⟩ = 0
  给出；相干态 |ψ⟩ = |↓⟩ + |↑⟩ψ（ψ 是 Grassmann 数）满足 ψ̂|ψ⟩ = |ψ⟩ψ。
  **费米数算符 F̂ 定义为在 |↓⟩ 上取偶、在 |↑⟩ 上取奇**（即 (−1)^F̂ |↓⟩ = +|↓⟩、
  (−1)^F̂ |↑⟩ = −|↑⟩）。积分 ∫dψ 取 math.berezin-integral 的 Berezin 积分。

  **(1) 相干态对角元的 Berezin 积分给出带 (−1)^F̂ 的迹**：对任意算符 Â（矩阵元
  Â|i⟩ = |j⟩ A_{ji}），
      ∫ dψ  ⟨ψ| Â |ψ⟩  =  A_{↓↓} − A_{↑↑}  =  Tr[ (−1)^F̂ Â ].

  **(2) 取 Â 为欧氏时间演化算符 exp(−ĤU)**，其相干态矩阵元由费米相干态路径积分表示，
  且 ∫dψ 把两端的 Grassmann 变量**等同起来**（周期边条件），于是
      ∫ dψ  ⟨ψ, U | ψ, 0⟩  =  Tr[ (−1)^F̂ exp(−ĤU) ].

  **(3) 反周期情形给普通迹**：若改取**反周期**边条件（两端的 Grassmann 变量差一个负号），
  同一构造给出不带权的迹 Tr[ exp(−ĤU) ]。

  ⚠ **与玻色情形相反**：玻色场是周期路径积分给普通迹；费米场是**周期**给 (−1)^F̂ 加权的迹、
  **反周期**给普通迹。
uses_conventions: []
sources:
  - ref: polchinski-1998-v1
    loc: "**Appendix A §A.2, eq. (A.2.22)–(A.2.23), pp.343–344**（L1 页图逐字）：**(A.2.22)** `∫dψ ⟨ψ|Â|ψ⟩ = A_{↓↓} − A_{↑↑} = Tr[(−1)^F̂ Â]`，逐字「where the fermion number `F̂` has been defined to be **even for `|↓⟩` and odd for `|↑⟩`**」；**(A.2.23)** `∫dψ ⟨ψ,U|ψ,0⟩ = Tr[(−1)^F̂ exp(−ĤU)]`；紧接的逐字总结「**In contrast to the bosonic results (A.1.33) and (A.1.34), the periodic path integral gives the trace weighted by `(−1)^F̂` and the antiperiodic path integral gives the simple trace.**」。设定与相干态见 (A.2.1a,b,c)、(A.2.7a,b)、(A.2.8)、(A.2.12)，费米路径积分本身是 **(A.2.17)**，pp.341–343"
    note: |
      **【2026-09-11 新建（curator-v1-sec15，researcher 第九轮 App. A 页图，L1）】**

      **statement (1)(2) 各有一条原书的显式等式**（(A.2.22)、(A.2.23)）。
      ⚠ **statement (3)（反周期 ⇒ 普通迹）在原书里只有上面那句散文，没有对应的显式等式**，
      抽取记录 §15.2(d) 逐页读图后只录到这一句。本图照实记：(3) 的支撑等级低于 (1)(2)。

      ⚠ **作为对照被引用的玻色结果 (A.1.33)/(A.1.34) 本项目未核**（抽取记录 §15.2(g) 第 4 条：
      它们只在 (A.2.23) 下方被引用到，其本身未取页）。故本卡最后那句「与玻色情形相反」
      的**玻色那一半没有一手核实**，只有 A.2 的这句转述。

      ★ **下游**：这正是第 7 章环面振幅里「周期/反周期边界条件 ↔ 迹里插不插 `(−1)^F`」的
      **书内一手依据**（抽取记录 §15.2(d) 末）。⚠ **本项目尚未回头核对第 7 章是否显式引用
      (A.2.23)**（§15.2(g) 第 5 条），故在 ch.7 节点接上本卡之前，不得声称原书在那里做了这个引用。
tags: [fermion, path-integral, trace, grassmann, torus, partition-function]
notes: |
  **建卡理由**：本图此前没有任何节点承载「周期/反周期边条件 ↔ (−1)^F」这件事，
  而它是环面配分函数（ch.7）与 RNS 弦 GSO 投影链的上游。

  **为什么放在 worldsheet 而不是 math**：内容本身是 0+1 维量子力学的，但本图里它的唯一用途
  是世界面上的环面/圆柱配分函数；纯代数的那一半（Berezin 积分）已单独建在 math.berezin-integral。

  **可以拆的地方（留给日后）**：statement (1)（= (A.2.22)）单独看是**二维态空间上的有限步代数恒等式**，
  若单独建卡可争取 rigorous；(2)(3) 因为要用费米相干态路径积分（(A.2.17) 的连续极限）而封顶
  physical-argument。本轮不拆，是因为原书把三者写在同一段、且 (2) 就是把 (1) 用在 exp(−ĤU) 上；
  若日后 ch.7 链需要一条不封顶的边，正确做法是拆出 (1) 做独立的 rigorous 卡，而不是抬高本卡。

  ⚠ **F̂ 的取法是一次约定**：原书定义 F̂ 在 |↓⟩ 上偶、在 |↑⟩ 上奇。整体翻转（|↓⟩ 取奇）会把
  (−1)^F̂ 整体变号，从而把 (1) 的右边变成 A_{↑↑} − A_{↓↓}。本卡沿用原书取法。
