id: worldsheet.bc-ghost-central-charge-lambda-two
kind: proposition
title: λ = 2 的 bc 鬼场系统中心荷 c^g = −26（模式代数形式，不含一般 λ 公式）
statement: |
  设 b_m、c_n (m, n ∈ Z) 满足反对易关系
    {b_m, c_n} = δ_{m+n,0},  {b_m, b_n} = {c_m, c_n} = 0,
  并设 V 是它们的一个**受限模**（每个 v ∈ V 被除有限多个模式外的 b_n、c_n 零化）。
  在 V 上定义权 λ = 2 的 bc 系统的 Virasoro 模式
    L^g_m = Σ_{n∈Z} (m − n) : b_{m+n} c_{−n} :
  （等价写法 L^g_m = Σ_{n∈Z} (n − m) : c_{−n} b_{m+n} :，两者逐项相差一个由反对易造成的符号）。
  则 {L^g_m} 满足 conv.virasoro-standard 归一化下的 Virasoro 关系，中心荷取值
    c^g = −26,
  即 [L^g_m, L^g_n] = (m − n) L^g_{m+n} + (−26/12) m(m² − 1) δ_{m+n,0}。

  【本命题到此为止】本卡**不**断言一般 λ 的公式 c = −3(2λ−1)² + 1
  （那是 worldsheet.bc-ghost-central-charge，其唯一推导走 OPE，physical-argument），
  **不**断言这组模式就是 Polyakov 路径积分的 Faddeev–Popov 鬼场
  （那一步由 worldsheet.faddeev-popov-ghost-action 承载，physical-argument），
  也**不**断言任何关于物质中心荷或 D 的事。
uses_conventions: [conv.virasoro-standard, conv.worldsheet-complex-coords, conv.ghost-normal-ordering-sl2c]
sources:
  - ref: fgz-1986
    loc: "Proposition 2.1, p.8444 右栏：(i) `ρ(c) = −26 Id_{Λ^∞_*}`；(ii) `ρ(L_m) = Σ_n (n−m) :c_{−n} b_{m+n}:`"
    note: |
      **L1，全文五页逐页读毕**（literature/extractions/brst-cohomology-sources.md §1.2 与 §1.4 的
      编号表第 11 行）。逐字转录见该抽取记录。本卡的两条内容**分别**对应 (i) 与 (ii)：
      (ii) 是鬼场 Virasoro 模式的显式表达式，(i) 是它的中心荷取值。
      ⚠ **FGZ 是 PNAS 公告体裁，Proposition 2.1 没有印出证明。** 按 lead 2026-09-12
      （small-backlog-8 / small-backlog-10(c)）的统一口径——「逐字核实的编号命题 + 明写输入 +
      gaps 记无印出证明」判 rigorous——本卡的推导取 rigorous，缺口写进 gaps。
      ⚠ FGZ 的 26 与「D = 26」无关：紧接 Prop 2.1 的正文逐字
      「from this point on we will assume that π(c) = 26 Id_V」，即**物质**中心荷 26 在 FGZ 里是假设。
  - ref: polchinski-1998-v1
    loc: "§2.5, eq. (2.5.12), p.51（一般 λ 的鬼场中心荷公式，λ = 2 给 −26；式号经 schrans-2020 目录逐字核实）"
    note: |
      **只作旁证，不承载本推导**：原书那里走的是 OPE，且给的是一般 λ 公式。
      本卡的论证由 fgz-1986 Prop 2.1 承载。
tags: [cft, central-charge, ghosts, bc-system, brst, critical-dimension]
notes: |
  **本卡是 worldsheet.bc-ghost-central-charge 的窄化拆分，不是换代。** 两张卡并存：
    · 一般 λ 公式（旧卡，--via-ope，physical-argument）——bosonization / βγ / 超共形鬼场三处要它；
    · λ = 2 的模式代数形式（本卡，--via-fgz-ghost-representation，rigorous）——
      BRST 与 Weyl 反常两条 D = 26 路线只要它。
  依据 docs/STATUS_LEVELS.md 的「拆卡」原则（「正确做法是拆卡，让 Lean 对应的那一半成为
  formalized 定义卡」）的同型处理。

  **Lean 可行性（给 formalizer 的备注，不属本卡断言）**：图中已有 formalized 的
  worldsheet.virasoro-algebra-v2、worldsheet.fock-space-virasoro-representation 与
  worldsheet.free-boson-central-charge-d（--via-lean）。本卡是它们的 Clifford（费米）对应物，
  中心项同样是一个有限和；若形式化成功，本卡可升 formalized，届时 BRST 路线成为本图
  **唯一**端到端机检的 D = 26 路线。

  ---
  【2026-09-12 auditor 注记（两条）：本卡的 `: :` 没有定义；「受限模」的括号注解写松了。
  statement 不可变，本条只入 notes】
  （physics-auditor，ms.critical-dimension-brst-nilpotency 第一轮回译审计 R1-3 与 R1-1。）

  **(A) `: :` 未定义，且与 worldsheet.brst-quantization-v2 的同一字符串要求互斥。**
  本卡写 `L^g_m = Σ_n (m − n) : b_{m+n} c_{−n} :`；brst-quantization-v2 写
  `L^g_n = Σ_m (2n − m) : b_m c_{n−m} :`。换指标后两式**逐字相同**。但：
    · 本卡断言 `[L^g_m, L^g_n] = (m − n) L^g_{m+n} + (−26/12) m(m² − 1) δ_{m+n,0}`
      （纯 (m³ − m) 形式，**无 m 线性项**）⇒ 本卡的 `: :` 必须是 **SL(2,C) 序**
      （湮灭算符 b_n (n ≥ −1)、c_n (n ≥ 2)）。这与本卡来源 fgz-1986 Prop 2.1 的半无穷楔形
      正规序一致，故**本卡自身的断言在其自身意图下为真**。
    · 而 brst-quantization-v2 断言「L_n = L^m_n + L^g_n + a^g δ_{n,0} 在 (m³ − m) 形式下中心荷为
      c^m + c^g」⇒ 那张卡的 `: :` 必须是**能级序**（相对 |↓⟩ = c_1|0⟩）。
  两序的 L^g_0 相差 1；一般地 L′_n = L_n + α δ_{n,0} 给 [L′_m, L′_{−m}] = 2m L′_0 + C(m) − 2mα，
  故**逐字拼接两卡公式会把 m 线性项算错 2m**（= reviewer F2，
  docs/reviews/brst-nilpotency-recompute-2026-09-12.md；本 auditor 已独立重推并确认）。
  **本卡的结论值 c^g = −26 不受影响**：序只改 m 线性项，不改 (m³ − m) 的系数，
  故把 −26 经依赖边供给 worldsheet.critical-dimension-brst-v2 的两条推导是正确的。
  **修法**：本卡换代时把「`: :` 取 SL(2,C) 序」写进 statement，或引用一条鬼场正规序 conv. 卡
  （目前 graph/conventions/ 里没有对应 family：`normal-ordering-constant` 装的是截距符号
  conv.intercept-sign-a，是常数符号约定不是算符排序约定）。
  草案见 docs/drafts/brst-normal-ordering-convention.md。
  ⚠ 这条也与上面「Lean 可行性」那段相关：形式化本卡时**必须**先把 `: :` 定死，
  否则 Lean 声明读不成卡面陈述。

  **(B) statement 里「受限模」的括号注解写松了，下游已因此出错。**
  本卡写「设 V 是它们的一个**受限模**（每个 v ∈ V 被除有限多个模式外的 b_n、c_n 零化）」。
  按字面，这说「不零化 v 的模式只有有限多个」——任何 Fock 模都不满足它：b_{−n} v、c_{−n} v
  对一切 n > 0 非零（它们是产生算符），故不零化 v 的模式有无穷多个。正确的（也是标准的、且
  worldsheet.brst-quantization-v2 与 worldsheet.critical-dimension-brst-v2 都写对了的）条件是**单边**的：
    对每个 v ∈ V 存在 N = N(v)，使 b_n v = c_n v = 0 对一切 n > N。
  本卡的断言本身不因此为假（凡满足单边条件者本卡结论成立；括号注解只是把前提写窄到只剩平凡模，
  属**写松的 gloss** 而非错误命题），但它已经传染下游：
  ms.critical-dimension-brst-nilpotency 的 canonical_text 逐字抄了本卡这句 gloss，
  而不是抄陈述卡 worldsheet.critical-dimension-brst-v2 的单边写法，构成该里程碑第一轮审计的 R1-1（drift）。
  **修法**：本卡换代时把括号改成单边写法。在此之前，引用本卡的人请以
  worldsheet.brst-quantization-v2 / worldsheet.critical-dimension-brst-v2 的写法为准。
  **【2026-09-12 physics-auditor：补声明 conv.ghost-normal-ordering-sl2c；statement 正文一字未动】**
  本卡断言 [L^g_m, L^g_n] 的中心项是**纯** (−26/12) m(m² − 1)（无 m 线性项）。在相差 L_0 常数平移的
  诸正规序中，使中心项无 m 线性项的序**唯一**（平移 α 给 −2mα），即 **SL(2,C) 序**
  （湮灭算符 b_n (n ≥ −1)、c_n (n ≥ 2)）。故本卡声明 conv.ghost-normal-ordering-sl2c
  （family `ghost-normal-ordering`，**canonical: false**；该 family 的 canonical 成员是能级序卡，
  因为图里 BRST 一侧的卡都用能级序——lead 裁决 2026-09-12）。
  本次只加 `uses_conventions` 的一项与本条 notes，**statement、id、status、sources 全未动**，不构成换代
  （先例：commit 5fdda19 对 swampland.heterotic-t6-substates-below-extremality 的同型处理）。
  · **非 canonical 对本卡没有实质后果**：validate 只在「里程碑指向的陈述」上禁用非 canonical 约定，
    而本卡不是任何里程碑的 statement_id；本卡的 status 与下游 effective 都不受影响。
  · **跨 family 的边**：worldsheet.critical-dimension-brst-v2 的两条推导依赖本卡，它们的目标声明
    能级序；两条边已各写 `convention_map`，写明搬运的只有 **(m³ − m) 的系数（= c^g/12）**，
    它与序无关（两套序之差只改中心项中 m 的一次项，不改 m³ 的系数）。
  · ⚠ FGZ Prop 2.1(ii) 本身**没有**给出 `: :` 的湮灭/产生清单；「FGZ 用的就是 SL(2,C) 序」是
    本项目的推断（理由即上面那条唯一性），已记在 conv.ghost-normal-ordering-sl2c 的 sources[0].note。
