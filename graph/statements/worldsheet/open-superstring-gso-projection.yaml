id: worldsheet.open-superstring-gso-projection
kind: definition
status: rigorous
title: 开超弦的 GSO 投影：在 NS 与 R 两个扇区上各投影到 exp(πiF) 的一个固定本征值；与闭超弦相容的两个选择是 I（NS+, R+）与 Ĩ（NS+, R−），投影算符 (1 + ε exp(πiF))/2 在迹里各贡献一个 ½
statement: |
  **设定（是陈述的一部分）**：**开**超弦（RNS 形式，D = 10）。
  世界面费米数算符 exp(πiF) 按 worldsheet.rns-fermion-number-operator
  （含鬼场部分；原书逐字提醒 'this definition is based on **spin** rather than statistics'）；
  扇区标号 (α, F) 按 worldsheet.superstring-sector-labels——**开弦共四个扇区**
  **NS+、NS−、R+、R−**，其中 ± 指 exp(πiF) = ±1，且 α、F **都只 mod 2 有定义**。

  **定义与断言**：
    **(1) 什么叫开超弦的 GSO 投影**：在 **NS 扇区**与 **R 扇区**上**各**把 Hilbert 空间投影到
        exp(πiF) 的**一个固定本征值**上，即从四个扇区里各留一个 NS 与一个 R。
    **(2) 原书列出的两个选择（§10.6 p. 30，逐字，无式号）**：
          **I** ：  **NS+ , R+**
          **Ĩ** ：  **NS+ , R−**
        即两者都保留 **NS+**，区别**只在 R 扇区**取 exp(πiF) = +1 还是 −1。
        ⚠ 原书把这两个称作 'The **two possibilities**'，而这句话的**前提**在它前面一句里：
        'Closure of the OPE in open + open → closed scattering implies that any open string that
        **couples consistently to type I or type II closed superstrings** must have a GSO
        projection in the open string sector.'——**「两个」是在这个前提下的枚举**，
        不是「开超弦的 GSO 投影一共只有两种」（见「本定义不断言 (c)」）。
    **(3) 投影算符与它在迹里的因子**：在每个扇区上，投影算符是
          ( 1 + ε · exp(πiF) ) / 2 ,  ε = 该扇区保留的本征值（±1），
        故它在单圈迹里**贡献一个因子 ½**。原书 §10.8 p. 38 逐字：
        '**Note that the GSO and Ω projection operators each contribute a factor of ½.**'
        ⚠ 这是本卡被 §10.8 三个面的振幅推导直接引用的那一条。

  **本定义不断言**：
    (a) ⚠ **不断言「开弦必须做 GSO 投影」**。那是一条 **proposition**，在
        worldsheet.type-i-open-string-gauge-multiplet 的断言 (1) 前半，理由是上面引的那句
        OPE 闭合（原书只给一句话，不展开）。**本卡只给算符层面的定义**，
        「必须」这一步的强度由那张卡承载。
    (b) **不断言两个选择各自的无质量谱**。'I : NS+, R+ = **8_v + 8**'、
        'Ĩ : NS+, R− = **8_v + 8′**' 在同一张卡的断言 (1) 后半；本卡只给扇区标号，不给表示。
    (c) ⚠⚠ **不断言「只有两个选择」是无条件的**。四个扇区里各取一个 NS 与一个 R，
        组合本有 2 × 2 = 4 种；原书只列 I 与 Ĩ，是因为它已经加上了「与 type I 或 type II
        闭超弦一致耦合」这个前提（断言 (2) 的 ⚠）。**本卡不断言含 NS− 的两种为什么被排除**
        （原书在此处不给理由）。
    (d) **不断言任何物理后果**：不断言 NS+ 去掉了快子（NS 基态有 exp(πiF) = −1，见
        worldsheet.open-superstring-low-level-spectrum 与 worldsheet.gso-removes-tachyon），
        不断言时空超对称，不断言 Chan–Paton 与规范群。
    (e) ⚠ **不断言与闭弦 GSO 投影的关系**。worldsheet.gso-projection 是**闭弦**
        （IIA/IIB/type 0）的 GSO，其论证来路**不同**：闭弦的来自三条扇区一致性条件的解，
        开弦的来自 open + open → closed 的 OPE 闭合。**两张卡不得互相替代**
        （reviewer-batch23 正是因为这个区别把圆柱推导上那条指向闭弦 GSO 卡的边改标 inferred）。
    (f) **不断言含 Ω 的联合投影算符**。(10.8.15) 的 (1 + Ω + Ω² + Ω³)/4 是 Ω 与 GSO
        **合成**的算符，属 worldsheet.superstring-worldsheet-parity-action；
        本卡只给 GSO 单独的那一半。
    (g) **不断言 exp(πiF) 的本征值只有 ±1**（那由 F mod 2 与 (10.2.24) 给出，
        照录在 worldsheet.superstring-sector-labels）。
uses:
  - worldsheet.type-i-open-string-gauge-multiplet
  - worldsheet.superstring-sector-labels
  - worldsheet.rns-fermion-number-operator
uses_conventions:
