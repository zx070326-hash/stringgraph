  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
sources:
  - ref: polchinski-1998-v2
    loc: "§10.6「Unoriented and open superstrings」, p. 30（**本段无式号**）；逐字：'Closure of the OPE in open + open → closed scattering implies that any open string that couples consistently to type I or type II closed superstrings must have a GSO projection in the open string sector. **The two possibilities and their massless spectra are**'  I : NS+, R+ = 8_v + 8 ；  Ĩ : NS+, R− = 8_v + 8′"
    note: |
      L1 原书页图，抽取记录 literature/extractions/polchinski-1998-v2.md **#E45**
      （两行谱与全部逐字措辞逐页读到原书页图）。
      ⚠ **本段无式号**：(10.6.16)–(10.6.18) 属闭弦部分，开弦这两行在原书里是正文表格式排版
      （与 worldsheet.type-i-open-string-gauge-multiplet 的 sources 同一条告警）。
      ★ 本卡从该段里拆出的只有**扇区标号这一层**（NS+/R±），谱与「必须」两层留在那张卡上。
  - ref: polchinski-1998-v2
    loc: "§10.8, p. 38（紧跟 (10.8.2) 之下）逐字：'Note that the GSO and Ω projection operators each contribute a factor of ½.'"
    note: |
      L1，抽取记录 literature/extractions/polchinski-1998-v2-sec10-8.md **#E65** / **§1** 的归一化条。
      ★★ **这是断言 (3) 后半的唯一来源，也是本卡的主要下游用途**：
      §10.8 三个面的振幅都用 dt/**8**t，相对玻色弦 (7.4.1) 的 dt/2t 多出的两个 ½
      正是 GSO 与 Ω 各一个。
  - ref: polchinski-1998-v2
    loc: "§10.6, eqs. (10.6.1)–(10.6.3), pp. 25–26（开弦扇区记作 (α, F)，四个；α = 1 − 2ν；逐字 'Both α and F are defined only mod 2'）"
    note: |
      本图对应节点 **worldsheet.superstring-sector-labels**（本卡 uses 之一）。
      供给 NS±/R± 这套记号本身。
  - ref: polchinski-1998-v2
    loc: "§10.2, eqs. (10.2.19)–(10.2.24), pp. 8–9（exp(πiF) 的构造、含鬼场的推广、exp(πiF)|0⟩_NS = −|0⟩_NS）"
    note: |
      本图对应节点 **worldsheet.rns-fermion-number-operator**（本卡 uses 之一）。
      供给被投影的那个算符。⚠ 那张卡自身 status = physical-argument
      （鬼场部分的推广理由是一句物理论证），故本卡的 effective 被它压到 physical-argument，
      这是有意的，见 notes。
tags: [superstring, open-string, gso, type-i, projection, definition]
notes: |
  ★★【本卡为什么存在（curator，2026-09-11，small-backlog-13）】
  本图此前**没有「开弦 GSO 投影」的节点**，后果在两处可见：
    · worldsheet.superstring-cylinder-amplitude-closed-channel-v2--via-open-string-trace-doubling
      把「GSO 投影贡献的那个 ½」挂在 **worldsheet.gso-projection**（**闭弦** IIA/IIB 的 GSO）上，
      被 reviewer-batch23 裁定「对象不完全同一」而**改标 inferred**（lead 已落地）；
    · worldsheet.superstring-mobius-strip-amplitude-closed-channel--via-open-string-trace-with-omega
      改把它挂在 **worldsheet.type-i-open-string-gauge-multiplet** 上（非 inferred），
      但那张卡**同时**承载着「必须做 GSO」「两个谱」「Chan–Paton 与规范群」「规范微子在伴随表示」
      四件事——**一条边借一件、剩下三件搭便车**。该推导的 notes 已写下正解，逐字：
        「⇒ 若日后为『开弦 GSO 投影』单建一张窄卡，三条推导应一起改指它。」
  **本卡就是那张窄卡。**

  ★【本卡与 worldsheet.type-i-open-string-gauge-multiplet 的分工（一句话）】
  那张卡 = **命题**（开弦**必须**做 GSO；两个选择各自的**谱**；Chan–Paton 与规范群）；
  本卡 = **定义**（GSO 投影是什么算符、两个选择的**扇区标号**、投影算符给一个 ½）。
  ⇒ 本卡 `uses` 那张卡：断言 (2) 里 I / Ĩ 这两个**名字**与「恰是这两个」这个枚举
  都是从那张卡（即原书同一段）继承的，本卡不重新论证。

  ★【为什么 status 取 rigorous】断言 (1)(3) 是在一个已明确定义的算符 exp(πiF)
  （本征值 ±1，F mod 2）上做的**正交投影**，(1 + ε exp(πiF))/2 是幂等自伴算符、迹上给 ½——
  这是有限步初等线性代数，符合 docs/STATUS_LEVELS.md 对 definition 的 `rigorous` 判据
  （数学上精确但未形式化）。
  ⚠ **但本卡的 effective 会被 uses 压到 physical-argument**，这是有意的：
    (i) worldsheet.rns-fermion-number-operator 是 physical-argument（鬼场部分的推广只有一句
        物理理由，且该卡自己记着「基于自旋而非统计」这条约定选择）；
    (ii) worldsheet.type-i-open-string-gauge-multiplet 是 physical-argument
        （原书对「必须」「两个」「谱」每条只给一句话）。
  ⇒ 断言 (2) 的**枚举性**确实只有物理论证支撑，被压下来是正确的记账。

  ⚠⚠【断言 (2) 的「两个」是有前提的——这是本卡最容易被误引的一处】
  原书写 'The two possibilities'，紧接在「与 type I 或 type II 闭超弦一致耦合」之后。
  四个扇区里各取一 NS、一 R 本有四种组合；含 **NS−** 的两种在原书这里被**默默排除**，
  原书**不给理由**（可对照：闭弦一侧的 type 0 理论就含 NS− 扇区，见
  worldsheet.superstring-sector-consistency-solutions 的 0A / 0B）。
  ⇒ 「本定义不断言 (c)」把这一点写死。**不要**把本卡引作「开超弦的 GSO 投影只有两种」。

  【下游（本卡建立时应接的三条边）】
    1. worldsheet.superstring-mobius-strip-amplitude-closed-channel--via-open-string-trace-with-omega
       ——原先从 type-i-open-string-gauge-multiplet 边上借的「开弦 GSO 的 ½」改指本卡；
    2. worldsheet.superstring-cylinder-amplitude-closed-channel-v2--via-open-string-trace-doubling
       ——原先指向闭弦 gso-projection 的 **inferred** 边改指本卡并**去 inferred**；
    3. worldsheet.superstring-worldsheet-parity-action 的 uses 里「exp(πiF) = 1 by the GSO
       projection」那一条**暂不改**：那是 statement 正文里的字面引用，按 graph/CLAUDE.md
       2026-09-12 裁决，正文指针留待该卡下次实质换代时同步；本轮只改依赖边。
       ⚠ 该卡的 uses 仍列 worldsheet.type-i-open-string-gauge-multiplet，**本轮不动**
       （改 uses 属该卡的实质修改，且它是 definition，uses 变动会改 effective 的算法输入）。
       已列入交 lead 的报告。
