id: worldsheet.ghost-number-current-weyl-anomaly
kind: proposition
title: "鬼数流的 Weyl 反常：∇_a j^a = ((1 − 2λ)/4) R"
statement: |
  设 bc 系统的权为 (λ, 1 − λ)，鬼数流为 j = − : bc :（worldsheet.bc-ghost-cft 的约定，
  gh(c) = +1、gh(b) = −1）。在弯曲世界面上，鬼数流的协变散度不为零，而有 Weyl 反常
    ∇_a j^a = ( (1 − 2λ) / 4 )  R ,
  R 为世界面 Ricci 标量。系数由 T 与 j 的 OPE 的三阶极点读出：
    T(z) j(0) ∼ (1 − 2λ)/z³ + j(0)/z² + ∂j(0)/z 。
  弦论的 λ = 2 情形给 ∇_a j^a = − (3/4) R。

  推论（本节点不单独断言，见 worldsheet.riemann-roch-kappa-minus-mu 的推导）：
  鬼数在弯曲世界面上不守恒，其不守恒量正比于 ∫ ĝ^{1/2} R ∝ χ。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.virasoro-standard
sources:
