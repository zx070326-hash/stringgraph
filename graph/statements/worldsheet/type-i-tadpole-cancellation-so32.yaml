id: worldsheet.type-i-tadpole-cancellation-so32
kind: proposition
title: type I 的单圈发散（R–R tadpole）只在规范群 SO(32) 时抵消：总发散 ∝ (n ∓ 32)²
statement: |
  把 type I 的单圈真空振幅按世界面拓扑分解为柱面 C₂、Klein 瓶 K₂、Möbius 带 M₂，
  每个都分成闭弦 NS–NS 交换与 R–R 交换两部分。用模变换取长柱极限（s → ∞），
  三个拓扑的 **R–R 交换发散之和**为
    Z_1 = −i (n ∓ 32)² (V_10 / 8π(8π²α'²)^5) ∫_0^∞ ds [16 + O(exp(−2s))]，
  其中上号对应 SO(n)、下号对应 Sp(n)。故
    **R–R tadpole 为零当且仅当规范群是 SO(32)（n = 32 且取正交投影）**。
  对每个拓扑，NS–NS 发散是 R–R 发散的相反数，故 SO(32) 时 dilaton–引力子 tadpole 也为零。

  **这个发散为什么是「真正的不一致」而不是可以吸收的重整化**（原书的论证）：
  发散来自一个无质量的 R–R tadpole，而唯一可能的源是一个 **10-形式势 C_10**
  ——它的场强恒为零、没有动能项，故其传播子是 1/0，tadpole 的效应是发散 μ_10²/0。
  由 C_10 变分得到的运动方程就是 **μ_10 = 0**；
  原书逐字：'unlike the divergences encountered previously **this one cannot be removed by a
  correction to the background fields. It represents an actual inconsistency.**'

  ⚠ **一条容易漏的技术要点**（原书脚注 7，逐字）：
  'In the vacuum amplitude the sum of the NS–NS and R–R divergences is zero for each topology
  separately because the trace vanishes by supersymmetry. **This is not sufficient**, because
  they will no longer cancel when vertex operators are added near one end of each surface.
  **The NS–NS and R–R tadpoles must vanish separately when summed over topologies.**'
  即本命题的**逻辑形式**是：要求 NS–NS 与 R–R tadpole **各自**在拓扑求和后为零
  ⟹ n = 32 且取正交投影。

  **本命题不断言的内容**：
    (1) 不断言时空规范/坐标反常的抵消——那在第 12 章（本轮未读），
        是 SO(32) 唯一性的**另一个独立理由**；
    (2) 不断言 tadpole 的整体符号：原书逐字 'This calculation does not determine the sign of
        the tadpole, but it should be n ∓ 32'（理由是 cross-cap 数在切开曲面时只 mod 2 守恒，
        故符号不由幺正性定出，而边界数则不然）；
    (3) 不断言 C_10 的存在性有独立论证——原书逐字 'One can guess the resolution of this as
        follows'，并说 'as indeed a more detailed analysis does show'（**不给该分析**）。
