sources:
  - ref: polchinski-1998-v2
    loc: "§10.8, eq. (10.8.1)–(10.8.2a,b)（柱面分解）、(10.8.4)（Z_{C₂,0} 的发散）、(10.8.5)（μ_10 ∫C_10）、(10.8.6)（μ_10²/0）、(10.8.11)（Klein 瓶）、(10.8.13)（Ωψ_r Ω^{−1}）、(10.8.14)（Ω² = exp(πiF)）、(10.8.15)（投影算符）、(10.8.18)（Möbius 带）、**(10.8.19)（总 R–R 发散 ∝ (n ∓ 32)²）**，pp. 37–42；逐字 'The R–R tadpole vanishes only for the gauge group SO(32).' 与 'It represents an actual inconsistency.'"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E48；式号与公式内容逐页读到原书页图）。
      ⚠ 原书对 C_10 那一步的措辞是 'One can guess the resolution of this as follows'
      与 'as indeed a more detailed analysis does show'——**猜 + 不给分析**。
  - ref: polchinski-1998-v2
    loc: "§10.8 脚注 7, p. 39（逐字见 statement：NS–NS 与 R–R tadpole 必须**分别**在拓扑求和后为零）"
    note: L1（E48 备注）。这条决定了本命题的逻辑形式，抽取记录特别标出。
  - ref: polchinski-1998-v1
    loc: "§7.4, eq. (7.4.1)、(7.4.15)、(7.4.22)（玻色弦中同类的发散与抵消；Vol.2 明写 'The cancellation is very similar to what we have already seen in the bosonic theory in chapter 7.'）"
    note: |
      Vol.2 明写引用。⚠ 本图**没有** Vol.1 §7.4 的节点（单圈振幅、Klein 瓶、Möbius 带），
      故这条来源在图上无对应依赖边，见推导的 gaps。
tags: [superstring, type-i, tadpole, so32, consistency, one-loop, divergence]
notes: |
  【本卡是「三个十维理论」里 SO(32) 的第一个理由】第二个理由是第 12 章的时空反常抵消
  （本轮未读）。worldsheet.ten-dimensional-superstring-theories 的条件式写法同时挂这两个。

  【本图缺的上游】Vol.1 §7.4 的单圈振幅（柱面/Klein 瓶/Möbius 带的模变换与长柱极限）
  在本图完全没有节点，Vol.2 §10.7 的环面振幅本图也只建了模不变性那一条必要条件。
  故本卡的推导实质上无法在图内展开计算，只能记录结论与来源。
  → 待建（Vol.1 §7.4 + Vol.2 §10.7–10.8）：spectrum.one-loop-vacuum-amplitudes 一族。

  【与 Green–Schwarz 反常抵消的关系】GS 1984 的 SO(32) / E8×E8 结论走的是时空反常路线，
  本图 consistency 区正在建（另一个 curator 的 claim）。**本卡是世界面 tadpole 路线**，
  两者是不同的论证，不要合并。GS 那边也只给出 SO(32) 与 E8×E8 两个解，
  而本卡的 tadpole 只在 type I 语境下且只给 SO(32)。
