sources:
  - ref: polchinski-1998-v2
    loc: "§10.2, eq. (10.2.19)（exp(πiF)）、(10.2.20)（Σ^{μλ}）、(10.2.21)（S_a）、(10.2.22)（F = Σ_a S_a）、(10.2.24a)（exp(πiF)|0>_NS = −|0>_NS）、(10.2.24b)（exp(πiF)|s>_R = |s'>_R Γ_{s's}），pp. 8–9；'The ghost ground state contributes a factor −1 in the NS sector and −i in the R sector.' 同处"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E22；式号与公式内容逐页读到原书页图）。
      性质 (a) 的逐字来源同处：'The definition (10.2.22) makes it obvious that F is conserved by
      the OPE of the vertex operators, as a consequence of Lorentz invariance.'
      脚注 1（逐字）：'Lorentz invariance of the OPE holds separately for the ψ and X CFTs …
      because they are decoupled from one another. However, the world-sheet supercurrent is only
      invariant under the overall Lorentz transformation.'
  - ref: polchinski-1998-v2
    loc: "§10.4, eq. (10.4.23)–(10.4.25) 之后一段, p. 19（F 的鬼场推广、与 Q_B 交换的理由、'based on spin rather than statistics' 的逐字自评）"
    note: |
      L1（E31）。★ 这段把 E22 里悬着的「鬼场对 F 的贡献」补齐，是 GSO 的完整前提。
      ⚠ 鬼场部分的定义用的是 (10.4.9) 的电流（βγ ≅ ∂φ，即**玻色化**），
      本图**没有**玻色化节点，故这一部分在本卡只按原文记录，见 notes。
  - ref: polchinski-1998-v2
    loc: "§10.5 末, p. 25（逐字：'We have defined exp(πiF) to commute with Q_B.'）"
    note: L1（E39）。性质 (b) 的来源。
tags: [rns, superstring, gso, fermion-number, definition]
notes: |
  【status: physical-argument 的理由】物质部门的 F 是有限的模式双线性式（可写成纯代数），
  但鬼场部门的 F 定义为 (10.4.9) 电流的荷、并用「对 e^{lφ} 取值 l」来刻画——
  这经过 βγ 的玻色化（(10.4.9)/(10.4.13)/(10.4.19)），**本图没有玻色化节点**。
  按「不确定选低一级」，整卡取 physical-argument。
  → 待建（本轮未做）：worldsheet.beta-gamma-bosonization（β ≅ e^{−φ}∂ξ、γ ≅ e^{φ}η，
  (10.4.8)–(10.4.22)）与 worldsheet.fermion-bosonization（ψ ≅ e^{iH}，(10.3.5)–(10.3.19)）。
  建成后可把本卡拆成「物质 F（rigorous）」与「鬼场 F（physical-argument）」两张，
  并新建 v2 而不是改本卡。

  【为什么 F 只 mod 2 有定义】原书 (10.2.19) 处明写。故一切下游只用 exp(πiF) 这个组合，
  不用 F 本身的整数值。§10.6 的扇区标号 (α, F) 里的 F 同样只 mod 2 有定义（(10.6.1)）。

  【R 扇区的表示论内容不在本卡】(10.2.24b) 右端的 Γ_{s's} 与 |s>_R 的分解（16 + 16′ 等）
  依赖附录 B.1（本轮未读，抽取记录 Q8），本卡只照抄公式形式。
