id: worldsheet.rns-fermion-number-operator
kind: definition
status: physical-argument
title: 世界面费米子数算符 exp(πiF)（GSO 投影的算符），含鬼场部分
statement: |
  RNS 弦上定义一个与全部 ψ^μ **反对易**的算符 exp(πiF)，其中 F 是 world-sheet fermion number，
  **只 mod 2 有定义**。物质部门的构造：
    Σ^{μλ} = −(i/2) Σ_{r ∈ Z+ν} [ψ^μ_r, ψ^λ_{−r}],
    S_a = i^{δ_{a,0}} Σ^{2a, 2a+1}   （因子 i 使 S_0 厄米）,
    F = Σ_{a=0}^{4} S_a          （十维，五个 Cartan 方向）。
  作用在基态上：
    exp(πiF) |0⟩_NS = − |0⟩_NS,
    exp(πiF) |s⟩_R  = |s'⟩_R Γ_{s's}。
  **鬼场部分**：F 被推广为对 β、γ 也取**奇**值。原书给的理由逐字：
  'The ultimate reason is that it anticommutes with the supercurrent T_F and so we will need it
  to commute with the BRST operator, which contains terms such as γT_F. The natural definition
  for F is then that it be the charge associated with the current (10.4.9), which is l for e^{lφ}.'
  在基态上鬼场贡献一个因子 **−1（NS 扇区）与 −i（R 扇区）**。

  ⚠ **一处约定选择，必须显式记录**（原书逐字）：'Note that this definition is based on spin
  rather than statistics, since the ghosts have the wrong spin-statistics relation; it would
  therefore be more appropriate to call F the world-sheet spinor number.'

  **两条关键性质**（下游 GSO 与无鬼定理都要用）：
    (a) F 由 OPE 守恒，这是**时空 Lorentz 不变性**的推论（(10.2.22) 的定义使之显然）；
    (b) exp(πiF) 与 BRST 算符 Q_B **交换**（这是上面把 F 推广到鬼场的目的）。

  本卡是定义。它**不**断言 exp(πiF) 的本征值只有 ±1、不断言谱按其本征子空间分解的性质
  （见 worldsheet.gso-projection），也**不**断言 R 扇区旋量表示的维数（那是附录 B.1）。
uses:
  - worldsheet.rns-mode-expansions
  - worldsheet.rns-ramond-zero-modes-clifford
  - worldsheet.superconformal-ghost-modes
uses_conventions:
