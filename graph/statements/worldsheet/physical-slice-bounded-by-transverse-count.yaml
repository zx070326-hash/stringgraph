      `eq_zero_of_mem_towerPhys_inf_towerBigrade_of_orthogonal_conjFreeSlice`（同样无 `omit`，
      其证明内部调用 `towerPhys_inf_towerBigrade_eq_towerOrthComplement`，该定理**自身声明**
