    note: |
      本仓库，无 sorry。**类型类核实**：`finrank_towerPhys_inf_towerBigrade_le` 所在 `section P3`
      （第 1195 行起）声明 `variable {D}{K}[Field K][CharZero K][Algebra ℚ K]{η a b:Fin D→K}`；
