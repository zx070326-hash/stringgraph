tags: [bosonic-string, no-ghost, ddf-spans, spectrum-generating-algebra, fock-space, dimension-bound, formalized]
notes: |
  【查重】2026-09-12 跑 `uv run stringgraph search "physical slice" / "transverse count" /
  "codimension" / "conjFreeSlice"`，均无命中；本图此前没有承载「H_phys ∩ V_N 的维数上界」
  这一命题的节点。

  【本卡与 (B-26) 秩不等式的关系（不新增依赖边，只在此记账）】
  worldsheet.ddf-spanning-rank-inequality 的断言是 dim H_N ≤ dim D_N + dim Z_N。
  本卡给出 dim H_N ≤ p_{D−1}(N)；配合 worldsheet.transverse-ddf-fock-gram-matrix 一侧
  已 formalized 的 dim D_N = p_{D−2}(N)，有

      dim H_N  ≤  p_{D−1}(N)  =  p_{D−2}(N) + (p_{D−1}(N) − p_{D−2}(N))
               =  dim D_N + (p_{D−1}(N) − p_{D−2}(N)) 。

  故只要再有 dim Z_N ≥ p_{D−1}(N) − p_{D−2}(N)（这条恰是 worldsheet.ddf-spanning-rank-inequality
  notes 里登记的、唯一在 D = 26 处成立的剩余缺口），就能推出 dim H_N ≤ dim D_N + dim Z_N，
  即 (B-26) 本身。**本卡不建这条推导**（那需要把两张 formalized 卡与一条尚未证的下界拼接成
  一条新推导，超出本次接线范围），只在 notes 里把逻辑摆清楚，具体记账见
  worldsheet.ddf-spanning-rank-inequality 的 notes 更新。

  【与 worldsheet.light-cone-monomials-span-fock-level 的分工】
  本卡的 p_{D−1}(N) 计数（`conjFreeSlice`/`finrank_conjFreeSlice_le`）建立在那张卡的张成定理
  （`levelSubmodule_eq_span_lcMonomial`）之上：`conjFreeSlice` 是 level-N 光锥单项式里
  conjDeg = 0（不含 b̃）的子集张成，其有限维性与维数上界依赖「level-N 分量由光锥单项式张成」
  这一事实，但本卡不重复断言张成本身，只用其推论（有限维、有限生成集给出的维数上界）。
  按【已被证明的片】的分工原则，这里同样是 `uses`（对象/事实供给）而非 `depends_on`
  （本卡命题的证明逻辑不经由那张卡的陈述文字，而是通过 Lean 证明内部调用其定理）。

  ⚠ 与 worldsheet.transverse-ddf-fock-gram-matrix 的教训一致：本卡状态标 formalized 是因为
  Lean 侧证明**无 sorry**且各环节的类型类需求已逐条核对（见 sources 的 note），而不是因为
  「大家都相信 D-无关的上界成立」。
