id: worldsheet.physical-slice-bounded-by-transverse-count
kind: proposition
title: 反对角片上物理态维数的上界：dim(H_phys ∩ V_N) ≤ p_{D−1}(N)（不含 b̃ 方向的光锥单项式计数，任意 D，(B-26) 上界那一半）
statement: |
  这是 (B-26) 秩不等式（worldsheet.ddf-spanning-rank-inequality）左边 dim H_N 的一条独立上界，
  与右边 dim D_N（已 formalized）无关地成立；**不涉及 D = 26**。

  【设定】记号沿用 worldsheet.ddf-spanning-rank-inequality（同一张塔 T(k;k_0)、系数域 K，
  a₀ := α'k² = ½η(a,a)、反对角片 V_N := towerBigrade(−N, N)、H_N := H_phys ∩ V_N，
  H_phys 逐字取自 worldsheet.ddf-spanning-hypothesis）。另取一个 worldsheet.ddf-light-cone-frame
  的标架对象 F: DDFLightConeFrame η a b（D ≥ 2；F 内部的 (F1) 供给 η_μ² = 1，(F3) 供给
  η(a,b) = 1，(F2) 供给 η(b,b) = 0——即本卡不需要在 F 之外再单独假设这些）。

  【计数对象：不含 b̃ 方向的 level-N 光锥占据数】沿用 worldsheet.light-cone-monomials-span-fock-level
  的方向表 frameVec_F（0 ↦ b、1 ↦ b̃、μ ≥ 2 ↦ ε_{μ−2}）与光锥单项式指标 d : Osc(D) →₀ N
  （Osc(D) = Fin(D) × ℕ₊）。记 conjDeg(d) := d 在方向 1（即 b̃ 方向）上诸模态次数之和
  （「b̃-次数」，与振子能级 level(d) 无关的另一个分次）。置

    p_{D−1}(N) := Fintype.card { d : Osc(D) →₀ N | level(d) = N ∧ conjDeg(d) = 0 } ，

  即「用 D − 1 个方向（b 本身 + D − 2 个横向 ε_i，唯独不用 b̃）把振子能级 N 分配给可数无穷多
  个模态槽」的占据数个数——这与文献里 D − 1 个自由色的整数配分函数计数一致，是
  worldsheet.transverse-ddf-fock-gram-matrix 一侧 p_{D−2}(N)（只用 D − 2 个横向方向）
  的**另一个、更大的**计数，两者不可混淆。

  【断言】对一切 hD : 2 ≤ D、F : DDFLightConeFrame η a b、N ∈ N：

      dim_K H_N  ≤  p_{D−1}(N) 。

  【本卡明确不断言】
  (a) **不断言这是紧的**：不给出反向不等式，也不断言等号在何时成立；「差额恰好由零态补上」
      是 worldsheet.ddf-spanning-rank-inequality 剩余的开放内容（该卡秩不等式的另一半，
      需要 dim(H_null ∩ V_N) ≥ p_{D−1}(N) − p_{D−2}(N)，只在 D = 26 时期望成立）。
  (b) **不涉及 D = 26，也不涉及任何特定 D**：对一切满足 hD : 2 ≤ D 的 D 成立，
      与截距 a₀ 的具体数值无关（a₀ 只通过 H_phys 的定义隐含出现，本卡不对它做任何假设）。
  (c) **不给出 dim D_N 或 dim Z_N 的信息**：dim D_N = p_{D−2}(N) 由
      worldsheet.transverse-ddf-fock-gram-matrix 一侧独立给出；本卡与它是 (B-26) 秩不等式
      的两块独立 D-无关输入中的一块（另一块是 dim D_N 那条），合起来仍差 dim Z_N 的下界。
  (d) **不使用光锥单项式的线性无关性**：证明只用「H_phys ∩ V_N 嵌入 conjFreeSlice 的对偶空间」
      这一单射论证，不需要 {光锥单项式} 是一组基。
  (e) **不断言 V_N 关于伪态/b̃-自由部分的直和分解本身**：那是
      worldsheet.gt-longitudinal-k-algebra 与本卡共同的上游引理（b̃-次数消元），本卡只用其
      证明中间产物，不重复断言它。
uses:
  - worldsheet.ddf-light-cone-frame
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard, conv.intercept-sign-a]
