      用到 `invTwo`，需要 `[Algebra ℚ K]`）。故本卡按**完整**的 `[Field K][CharZero K][Algebra ℚ K]`
      记录，**不**是「声明比 section 变量表窄」的又一个实例——这次窄化机制没有触发，
      是因为 `CharZero K`、`Algebra ℚ K` 真的被证明体用到了。
      **curator 未自行运行 `lake build` / `#check` 逐条核实**（本 worktree 无构建缓存，
