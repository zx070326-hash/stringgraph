      未跑编译器验证。
      **证明结构**（docstring 自述）：把「H_phys ⊓ V_N 里两个态配对同一个 conjFreeSlice 都相等
      则相等」（单射性，`eq_zero_of_mem_towerPhys_inf_towerBigrade_of_orthogonal_conjFreeSlice`，
