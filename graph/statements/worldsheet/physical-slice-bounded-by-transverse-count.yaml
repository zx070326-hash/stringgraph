      「不含 b̃ 的部分 + 伪态部分」，伪态部分配对为零、不含 b̃ 部分由假设为零）打包成一个线性映射
      `physSliceToDual`，`finrank_le_of_injective_toDualHom` 把单射映射搬成 finrank 不等式，
      再用 `finrank_conjFreeSlice_le`（= `p_{D−1}(N)`，来自
