id: worldsheet.free-boson-central-charge-d
kind: proposition
title: D 个自由玻色子的中心荷 c = D
statement: |
  设 L_m 是 worldsheet.virasoro-generators-free-boson 定义的、作用在 D 个自由玻色子的
  Fock 空间 F 上的算子 L_m = (1/2) Σ_{n∈Z} : α_{m-n} · α_n :。则在 F 上
    [L_m, L_n] = (m - n) L_{m+n} + (D/12) m (m^2 - 1) δ_{m+n, 0} · Id_F,
  即这些 L_m 给出 Virasoro 代数（conv.virasoro-standard 的归一化）的一个表示，
  其中心荷为
    c = D  （每个自由玻色子贡献 c = 1）。
  反全纯部门同理给出 c̄ = D。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.virasoro-standard
formal:
  lean_decl: StringFormal.NoGhost.Fock.lie_Lop_Lop
  lean_file: StringFormal/NoGhost/Sugawara.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/Sugawara.lean :: StringFormal.NoGhost.Fock.lie_Lop_Lop"
    note: |
      本仓库，合并提交 7af81b1ca0cacd443e2f7437d58fc34df0292189。机器验证的陈述逐字为
        ⁅Lop η a m, Lop η a n⁆ = (m - n) • Lop η a (m + n)
          + (if m + n = 0 then (D : R) * Virasoro.centralTerm R m else 0) • LinearMap.id,
      其中 `Virasoro.centralTerm R m = (1/12) (m³ - m)`，而 m³ - m = m(m² - 1)，
      故这正是本节点陈述的第一式，中心荷 c = D。
      带假设 `hη : ∀ μ, η μ * η μ = 1`（η 对角且 η_{μμ} = η^{μμ}），`Fock.minkowski` 满足之。
      见推导 worldsheet.free-boson-central-charge-d--via-lean 的 gaps。
      ⚠ 陈述末句「反全纯部门同理给出 c̄ = D」**不在** Lean 里。
  - ref: polchinski-1998-v1
    loc: "§2.4 末至 §2.5 初，约 eq. (2.4.25)–(2.5.1)（由 X^μ 的 TT OPE 直接算出 c = 1，D 个给 c = D）"
    note: |
      **公式号完全未核实，且无页码锚点**——这是抽取记录中唯一一条核心陈述既无式号也无页码
      （见 literature/extractions/polchinski-1998-v1.md E34 与 Q4）。内容（c = D）本身在
      抽取记录第 1.1 节被列为「内容确认，位置见 E34」。**必须人工核对原书。**
  - ref: virasoro-lean-2025
    loc: "Theorem 10.1 + Corollary 10.2（c = 1，Lean 机器验证）；Appendix A.2"
    note: |
      代数路线的**主数学来源**（Kytölä, arXiv:2510.21741，开放获取，researcher 全文核实）。
      只给单个 Heisenberg 族的 c = 1；c = D 由 D 个互相对易的拷贝相加得到，那一步不在来源里。
      详见 --via-mode-algebra 的 sources 与 gaps。
  - ref: kac-raina-1987
    loc: "Heisenberg 代数的 Fock 表示上的 Virasoro（Sugawara 型）作用；**本项目未核实任何编号，故不给 Lecture 号**"
    note: |
      背景引用，不承载论证。**版本陷阱**（researcher 2026-09-10）：第 1 版（World Scientific 1987）约 12 讲，
      第 2 版（Kac–Raina–Rozhkovskaya 2013）18 讲，两版讲号与命题号不可互换。
  - ref: schottenloher-2008
    loc: "Virasoro 代数的 Heisenberg/Fock 表示相关章节，**章节与定理编号未核实**"
    note: 备选数学来源，同样编号未核实；不承载论证。
tags: [cft, central-charge, free-boson, virasoro, sugawara]
notes: |
  **本节点是 D = 26 的三条推导的公共支点**：
    worldsheet.critical-dimension-brst 的末句（c^m = D，故 Q_B^2 = 0 ⟺ D = 26）、
    worldsheet.critical-dimension-weyl-anomaly（c^m + c^g = 0 ⟺ D = 26）、
  以及一切「物质中心荷 = 时空维数」的换算。在本节点建立之前，这一步只作为
  worldsheet.critical-dimension-brst 陈述文本中的一句话存在，没有独立的来源与状态记账
  （见该节点 --via-three-routes 的 gaps 第三条）。**建议 lead 让后续修订把
  critical-dimension-brst 与 critical-dimension-weyl-anomaly 的这一步显式指向本节点。**

  三条推导：
    --via-ope          Polchinski §2.4 的 TT OPE 路线，physical-argument（OPE 收敛未证）
    --via-mode-algebra 直接对易子计算，**rigorous**（lead 裁决 2026-09-10）：主数学来源改为
                       virasoro-lean-2025 Theorem 10.1 + Corollary 10.2（带编号、开放获取、已 Lean 机器验证），
                       剩下的「c = 1 ⇒ c = D」一步经 reviewer-ch23 独立复核。
    --via-lean         **formalized**（2026-09-11 新增）：本仓库 Sugawara.lean 里对 D 分量、
                       带 η 的版本从头证出 c = D，不再依赖「c = 1 ⇒ c = D」那一步外推。
                       --via-mode-algebra 保留：它是文献路线的记账，且其证明结构
                       （直接重排求和）与 Lean 走的路线（刚性 + 2-上圈同调递推）不同，
                       是两条互相独立的论证。
