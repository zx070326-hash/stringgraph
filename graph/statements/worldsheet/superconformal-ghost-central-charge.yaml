sources:
  - ref: polchinski-1998-v2
    loc: "§10.1「Free SCFTs」小节, eq. (10.1.16a,b)（权）、(10.1.17)（作用量）、(10.1.18a,b)（T_B, T_F）、(10.1.19)（中心荷 [−3(2λ−1)^2 + 1] + [3(2λ−2)^2 − 1] = 9 − 12λ），p. 4"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E11；式号与公式内容逐页读到原书页图）。
      原书措辞：'The various free CFTs described in chapter 2 have superconformal
      generalizations.'——直接给出，无证明。
  - ref: polchinski-1998-v2
    loc: "§10.1, eq. (10.1.20), p. 4（逐字：'The ghost central charge is then −26 + 11 = −15, and the condition that the total central charge vanish gives the critical dimension' 0 = (3/2)D − 15 ⟹ D = 10）"
    note: |
      L1（E12）。★ **−26 + 11 = −15 这个拆分在原书正文里逐字出现**，
      故「βγ 贡献 +11」这条 Vol.1 → Vol.2 的依赖是文献自己写出来的，
      本卡的两条依赖边（bc 的 −26、βγ 的 +11）都不必标 inferred。
      注意原文措辞是 'We can anticipate'（预告式），鬼场在 §10.4 才正式引入。
  - ref: polchinski-1998-v2
    loc: "§11.1, eq. (11.1.2a) c_h = (−1)^{2h+1}[3(2h−1)^2 − 1]、(11.1.2b) c_2 = −26, c_{3/2} = +11, c_1 = −2, c_{1/2} = −1, c_0 = −2，p. 46–47；'The sign (−1)^{2h+1} takes into account the statistics of the ghosts, anticommuting for integer spin and commuting for half-integer spin.'"
    note: |
      L1（抽取记录 E51；式号与公式内容逐页读到原书页图）。
      按抽取记录 Q11 的建议引入：这条通式把 Vol.1 (2.5.12)（bc）与 (2.5.24)（βγ）**统一成一条**，
      且**式号与表达式都已 L1 核实**——而 Vol.1 那两条式号虽核实、表达式本身在 v1 抽取记录里
      仍标未核实。故本卡以 Vol.2 为 (10.1.19)/(11.1.2a) 的一手来源，
      Vol.1 只经上游节点（worldsheet.bc-ghost-central-charge / worldsheet.beta-gamma-central-charge）间接进入。
      ⚠ 本卡只引用 (11.1.2a) 这条**公式**，不引用 §11.1 的**分类结论**
      （「Jacobi 恒等式的解只允许 table 11.1 中的代数」）——那条结论带作者自己的完备性警告
      （§11.1 末, p. 48–49），且第 11 章本轮不入图。
tags: [superstring, ghosts, central-charge, beta-gamma, bc-ghost]
notes: |
  【与既有两张卡的关系】worldsheet.bc-ghost-central-charge 给 c^{bc} = −3(2λ−1)^2 + 1
  （λ = 2 时 −26），worldsheet.beta-gamma-central-charge 给 c^{βγ} = 3(2λ'−1)^2 − 1
  （λ' = 3/2 时 +11）。本卡是它们在超弦鬼场部门的**和**，并把「λ 与 λ' 的关系是 λ' = λ − 1/2」
  这一步显式写出（(10.1.16b)：h_β = λ − 1/2）。
  worldsheet.beta-gamma-central-charge 的 notes 早就写着「供日后超弦分支引用
  （c^{超弦总} = (3/2)D + 11 − 26 = 0 ⇒ D = 10）」——本卡正是那个引用点。

  【λ = 2 这个选择本身不是自动的】原书 §10.5 脚注 3（p. 24，逐字）：
  'The bcβγ theory actually has a one-parameter family of superconformal symmetries,
  related by rescaling β → xβ and γ → x^{−1}γ. The general BRST construction (4.3.14)
  singles out the symmetry (10.1.21); this is most easily verified by noting that it correctly
  leads to the OPEs (10.5.22).'
  即 (10.1.21) 那一组 (T_B, T_F) 是被一般 BRST 构造**挑出来**的，不是唯一的超共形结构。
  本卡的中心荷值不依赖该选择（中心荷在这一族里不变），但下游的 BRST 荷
  （worldsheet.superstring-brst-charge）依赖它，故记在此处备查。

  【与玻色弦的 a^g 不要混】玻色弦的鬼场正规序常数是 a^g = −1；超共形鬼场是
  a^g = −1/2（NS）、−5/8（R），见 worldsheet.superconformal-ghost-normal-ordering-constants。
