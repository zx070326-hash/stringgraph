id: worldsheet.superconformal-ghost-central-charge
kind: proposition
title: 超共形鬼场（bc + βγ 的一阶 SCFT）的中心荷 c^g = 9 − 12λ，λ = 2 时 c^g = −26 + 11 = −15
statement: |
  设一阶 SCFT 由一对反对易场 (b, c) 与一对对易场 (β, γ) 组成，权为
    h_b = λ,  h_c = 1 − λ,   h_β = λ − 1/2,  h_γ = 3/2 − λ，
  作用量 S = (1/2π) ∫ d^2 z (b ∂̄c + β ∂̄γ)。则其总中心荷为
    c^g = [ −3(2λ − 1)^2 + 1 ] + [ 3(2λ − 2)^2 − 1 ] = 9 − 12λ，
  其中第一个方括号是 bc（反对易）部分、第二个是 βγ（对易）部分——
  两个方括号的符号差别正是鬼场统计的差别（对易场的中心荷是同权反对易场的反号）。

  **λ = 2 的情形（超弦的超共形鬼场）**：与权 (2,0) 的约束 T_B 相配的是反对易的 (2,0) 鬼场 b，
  与权 (3/2,0) 的约束 T_F 相配的是**对易的** (3/2,0) 鬼场 β，于是
    c^g = 9 − 24 = −15，  拆成 **−26 + 11 = −15**
  （−26 是玻色弦的 bc 鬼场，+11 是 λ' = 3/2 的 βγ 系统）。

  统一写法（本书第 11 章给出的通式，本卡引之作为同一事实的更一般来源）：
  权 h 的一对鬼场贡献
    c_h = (−1)^{2h+1} [ 3(2h − 1)^2 − 1 ]，
  其中符号 (−1)^{2h+1} 记的正是鬼场统计（整数自旋反对易、半整数自旋对易）；
  代入 h = 2 给 c_2 = −26，h = 3/2 给 c_{3/2} = +11，两者之和 −15。

  本命题**不**断言总中心荷为零、也**不**断言 D = 10。
