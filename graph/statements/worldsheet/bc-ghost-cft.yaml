    loc: "§2.7, eq. (2.7.17)（{b_m, c_n} = δ_{m,-n}），p.61"
    note: 公式号经 schrans-2020 目录核实（`2.55`–`2.62`, p.61–62）。
tags: [cft, ghosts, bc-system, definition, faddeev-popov]
notes: |
  **与既有节点 worldsheet.brst-quantization 的关系**：后者是一张较大的定义卡，
  在其 statement 内部已经写死了 λ = 2 的 bc 系统（模展开、{b_m,c_n}、L^g_n、
  c^g = -3(2λ-1)^2+1 = -26、两个简并基态 |↓⟩ = c_1|0⟩ 与 |↑⟩ = c_0c_1|0⟩、gh(c_n)=+1/gh(b_n)=-1）。
  本节点**不修改**该卡片（已提交节点的 statement 不可改），而是把 bc 系统作为
  **一般 λ 的共形场论**单独立出来，使中心荷公式 c = -3(2λ-1)^2 + 1
  （worldsheet.bc-ghost-central-charge）能作为一条有自己来源与状态的命题存在，
  而不是埋在 BRST 定义卡的正文里。记号与鬼数约定与 brst-quantization 保持一致，
  故两者可以并存、日后由 lead 决定是否让 brst-quantization 显式依赖本节点。

  βγ 系统（对易的一阶系统）见 worldsheet.beta-gamma-central-charge。

  **待拆**（reviewer-ch23 提出，本轮不拆）：本定义卡内嵌了至少两条**命题**：
  （a）作用量 S = (1/2π)∫ b ∂̄ c 对任意 λ 共形不变；
  （b）鬼数流 j = -:bc: 不是主场（共形变换带反常项，(2.5.15)–(2.5.17)）。
  二者在来源中各自有推导，日后若被分别引用应拆成独立节点。
