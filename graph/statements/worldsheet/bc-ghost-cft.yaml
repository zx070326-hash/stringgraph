id: worldsheet.bc-ghost-cft
kind: definition
status: rigorous
title: bc 鬼场系统（权 (λ, 1-λ) 的一阶反对易 CFT）
statement: |
  bc 系统是由两个**反对易**（费米型）场 b、c 构成的一阶共形场论，作用量
    S = (1/2π) ∫ d^2 z  b  ∂̄ c,
  其中 b 是权 (λ, 0)、c 是权 (1-λ, 0) 的全纯场（反全纯部门有独立的 b̄、c̄）。
  该作用量对任意 λ 都是共形不变的。
  基本 OPE 为
    b(z) c(0) ∼ 1/z,   c(z) b(0) ∼ 1/z,   b(z) b(0) ∼ 0,   c(z) c(0) ∼ 0。
  能动张量为
    T(z) = : (∂b) c : - λ  ∂( : b c : )。
  鬼数流为 j(z) = - : b c :，其守恒荷即鬼数；约定
    gh(c) = +1,  gh(b) = -1。
  该 j 不是主场：它在共形变换下带反常项（(2.5.15)–(2.5.17)），这正是鬼数不守恒
  （背景鬼数）与 Riemann–Roch 型计数的来源。

  弦论中相关的取值是 λ = 2：此时 b 权 2、c 权 -1，模展开
    b(z) = Σ_{n∈Z} b_n z^{-n-2},  c(z) = Σ_{n∈Z} c_n z^{-n+1},  {b_m, c_n} = δ_{m+n,0}，
  与 worldsheet.brst-quantization 的记号一致。
