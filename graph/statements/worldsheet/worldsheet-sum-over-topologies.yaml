id: worldsheet.worldsheet-sum-over-topologies
kind: definition
status: physical-argument
title: 弦微扰展开的定义：对世界面拓扑求和，每个拓扑一个 Polyakov 路径积分
statement: |
  弦微扰论按**定义**（不是从别处导出的定理）如下给出：给定 n 个渐近弦态（外线数据：
  弦的种类、动量与极化，在世界面上表现为指定的穿孔/边界），S-矩阵元定义为

    S = Σ_{拓扑}  ∫ (Dg DX / V_{diff×Weyl})  exp( − S_P[X, g] − λ χ ),

  其中：
  (i) **求和范围**是所有紧、连通、且其边界与穿孔数据与指定外态相符的二维世界面拓扑。
      取向弦只对可定向曲面求和（亏格 g ≥ 0，开弦另带 b ≥ 0 个边界分支）；
      无取向弦（世界面宇称投影后的理论）还要对不可定向曲面求和。
      对哪一类曲面求和**由弦的类型决定**，不由本定义内部决定。
  (ii) 对每个固定拓扑，做以该拓扑为定义域的 Polyakov 路径积分
      （worldsheet.polyakov-action；对世界面度规 g_{ab} 与嵌入 X^μ 积分，除以规范群体积）。
  (iii) 权重中除物质作用量 S_P 外还有一项 λ χ，其中 χ 是该拓扑的 Euler 数
      （worldsheet.worldsheet-euler-number），λ 是一个实参数。χ 只依赖拓扑，
      故 e^{−λχ} 在每个拓扑上是一个常数因子。

  **相互作用不由额外的相互作用顶点给出**：世界面上没有局部相互作用点，弦的分裂与合并
  完全由世界面的拓扑携带（开弦过程见原书 Fig. 3.4）。

  ⚠ 本卡**不断言**任何收敛性或可定义性：对拓扑的求和是发散的（渐近）级数，
  测度 Dg DX 与规范群体积 V_{diff×Weyl} 都没有数学定义。
  ⚠ 本卡**不断言** λ 与任何时空场（dilaton 期望值）的关系，也不断言 λ 与其它参数的独立性。
uses:
  - worldsheet.polyakov-action
  - worldsheet.worldsheet-euler-number
uses_conventions:
