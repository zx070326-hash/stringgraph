id: worldsheet.polyakov-action-symmetries
kind: proposition
title: Polyakov 作用量的时空 Poincaré 不变性与世界面微分同胚不变性
statement: |
  Polyakov 作用量 S_P[X, γ]（worldsheet.polyakov-action）在下列两类变换下不变：
  (i) 时空 Poincaré 变换：X'^μ(τ,σ) = Λ^μ_ν X^ν(τ,σ) + b^μ，γ'_{ab} = γ_{ab}，
      其中 Λ ∈ O(1, D-1)，b^μ ∈ R^D 常数；
  (ii) 世界面微分同胚（重参数化）：设世界面 M 紧，φ: M → M 为保定向微分同胚
      且 φ(∂M) = ∂M，写成坐标形式 σ^a → σ'^a(σ)：
      X'^μ(σ') = X^μ(σ)，  γ'_{ab}(σ') = (∂σ^c/∂σ'^a)(∂σ^d/∂σ'^b) γ_{cd}(σ)。
  即 S_P[X', γ'] = S_P[X, γ]。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.worldsheet-lorentzian]
sources:
  - ref: polchinski-1998-v1
    loc: "§1.2, p.13：时空 Poincaré 不变性（`X′^μ = Λ^μ_νX^ν + a^μ`, `γ′_ab = γ_ab`）是 **(1.2.19)**；世界面 diff 不变性是 **(1.2.20)**。（另 p.12 的 **(1.2.11)/(1.2.12)** 是同两条变换只作用在 `X^μ` 上的版本，用于 Nambu–Goto 一侧。）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E7。
      **【核实/订正 2026-09-11（curator-v1-sec13，researcher 第七轮 L1 页图逐字）】**
      本节点断言的两条对称性 (i)(ii) 分别是 **(1.2.19)** 与 **(1.2.20)**，页码 **p.13**，
      「约」「附近」「式号未核对原书」三个限定同时撤销，证据等级升到 **L1**。
      ⚠ **旧 loc 把 (1.2.19)–(1.2.20) 当成「对称性列表」是不准的**：原书那里是三条**并列**的
      带式号的变换，其中 **Weyl 不变性单独是 (1.2.21)**，不在本节点范围
      （见 worldsheet.polyakov-weyl-invariance，其 loc 本轮同步订正为 (1.2.21)）。
      见 literature/extractions/polchinski-1998-v1.md §13.3(b) 的 §1.2 式号全表。
tags: [bosonic-string, symmetry, classical, polyakov, diffeomorphism, poincare]
notes: |
  Weyl 不变性是 S_P 的第三个对称性，性质不同（只在世界面维数为 2 时成立，
  且量子层面反常），故拆成独立节点 worldsheet.polyakov-weyl-invariance。
  抽取记录 #E7 把三者写在一条里；本图按「一个节点一个命题」拆开。
