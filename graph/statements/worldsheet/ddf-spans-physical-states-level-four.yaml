id: worldsheet.ddf-spans-physical-states-level-four
kind: proposition
title: DDF 张成假设在 (rung −4, 振子能级 4) 一片上成立，且需要 D = 26 与 3 ≤ D：H_phys ∩ V_4 ⊆ D(Ε) + H_null——第三个消费 D = 26 的机检张成片
statement: |
  【设定】记号沿用 worldsheet.ddf-spanning-hypothesis（同一张塔 T(k;k_0)、系数域 K）与
  worldsheet.ddf-light-cone-frame（标架对象 F : DDFLightConeFrame η a b）：系数域 K 满足
  [Field K][LinearOrder K][IsStrictOrderedRing K][Algebra ℚ K]（有序域，与
  worldsheet.ddf-spans-physical-states-level-three 记号一致）；截距 a₀ := α'k² = ½η(a,a)
  由 F 钉死为 1；V_4 := towerBigrade(−4, 4)（rung −4、振子能级 4 的双分次片）；H_phys、D(Ε)、
  H_null 三个子空间逐字取自 worldsheet.ddf-spanning-hypothesis（H_phys ∩ V_4、D(Ε) ∩ V_4、
  H_null ∩ V_4 即 worldsheet.ddf-spanning-rank-inequality 记号里的 H_4、D_4、Z_4）。

  【断言】设 hD : 3 ≤ D（比 worldsheet.ddf-spans-physical-states-level-three 的 hD : 2 ≤ D
  严格更强，理由见【与...level-three 的关系】），F : DDFLightConeFrame η a b。若
  **(D : K) = 26**，则

      **H_phys ∩ V_4  ⊆  D(Ε) + H_null** 。

  用 worldsheet.ddf-spanning-hypothesis 的分片记号：这就是 DDFSpansOn(V_4)，即 DDF 张成
  假设限制在 (rung −4, 振子能级 4) 这一片上成立——且**只在 D = 26 时**成立（本卡不断言
  D ≠ 26 时的情形，见【本卡明确不断言】(b)）。

  【与 worldsheet.ddf-spans-physical-states-level-three 的关系（姊妹卡，同族第四片）】
  两卡形状同构（都是 DDFSpansOn 在单个反对角片上的实例，都需要 D = 26），是"逐 N 攻克
  worldsheet.ddf-spanning-hypothesis"这条路线上并列的第四个已关闭片，不是彼此的推论或
  换代。与 N=3 不同的两处关键新差别：
  (i) **额外假设 3 ≤ D**（level-three 只需 2 ≤ D）——横截性论证
      （worldsheet.level-four-null-family-transversal）需要一个横向单位偏振
      u（u·p=0, u·u=1），标架只在 Fin(D−2) 非空时供给它；
  (ii) **Type-2 族的"剩余"计数从"裸的 D−1"变成整个 p_{D−1}(2)**——level-3 处 Type-2
      种子是单个偏振 e 标记的一维层一种子（oneSeed(j,e)，给出 D−1 维族，经
      ker(transFunctional) 的秩零化度而非 towerSeed 下界得到）；level-4 处 Type-2 种子本身
      是一整个 level-2 准物理片 Q_{−4,2}（经 worldsheet.quasi-physical-slice-dimension 的
      towerSeed 下界得到，dim ≥ p_{D−1}(2)），Type-1 族同样从"level-3 准物理片 Q_{−4,3}"
      （而非 level-2 一片）出发。

  【本卡不需要的假设】不需要 R 是 Q-代数意义之外的额外结构；不需要横向标架的显式基
  （F 只需满足 DDFLightConeFrame 的八条，加上 hD : 3 ≤ D 保证 Fin(D−2) 非空）。

  【本卡明确不断言】
  (a) **不断言一般 N 的任何片**：本卡只做 N = 4。N ≥ 5 的对应片是否可类似关闭完全开放
      （两族计数从 N=5 起本身不再精确匹配，见
      worldsheet.ddf-spanning-rank-inequality notes【2026-09-12（五）】的 Euler 五边形数
      障碍；N ≥ 12 起需要新奇异向量族，见 worldsheet.ocq-null-state-two-families
      notes【2026-09-12（三）】），均不受本卡影响。
  (b) **不断言 D ≠ 26 时片上不成立（不证否命题）**：本卡只证 D = 26 ⟹ DDFSpansOn(V_4)
      这一个方向；尖锐性/必要性未被证明，登记为未来工作，见配套推导的 gaps。
  (c) **不断言全体 H_phys**（那是 worldsheet.ddf-spanning-hypothesis 本身）：一片一片地
      关闭不自动给出全体，"逐片 ⇒ 全体"的拼装引理是另一条已 formalized 的独立引理
      （Glue.lean），本卡不重复它。
  (d) **不断言两族零态在一般 N 的构造**：那是 worldsheet.ocq-null-state-two-families
      的内容（一般 N，physical-argument）。本卡消费的是该构造在 N = 4 这一个特例上的
      机检版本，不重新断言一般 N 的机制。
  (e) **不断言零态的具体身份对读者可读**：零态族由 Type-1（L₋₁ 作用于 Q_{−4,3}）与
      Type-2（𝒟₂ 作用于 Q_{−4,2}）两部分组成，本卡只断言其像落在 H_null ∩ V_4 里且维数
      之和达到目标，具体索引编码是 Lean 侧的实现细节，不是本卡陈述的一部分。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard, conv.intercept-sign-a]
formal:
  lean_decl: StringFormal.NoGhost.ddfSpans_bigrade_neg_four_four
  lean_file: StringFormal/NoGhost/LevelFourCount.lean
sources:
  - ref: stringformal-2026
    loc: |
      formal/StringFormal/NoGhost/LevelFourCount.lean :: StringFormal.NoGhost.ddfSpans_bigrade_neg_four_four
      （本卡 formal.lean_decl，section ClosingFour，第 1223 行起）；紧邻的
      StringFormal.NoGhost.b26_four_of_D26（同 section，第 1192 行起，⭐⭐ 标记的中间结果）。
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry（文件头 docstring "No sorry"）。
      **curator 未自行重跑 `lake build` 与 `check-axioms`**（本 worktree 无构建缓存）；
      合并前应由 lead 跑 `uv run stringgraph check-axioms`。这是本卡 status formalized
      的依据。

      **逐字核对**：`ddfSpans_bigrade_neg_four_four (hD : 3 ≤ D) (F : DDFLightConeFrame η a b)
      (hD26 : (D : K) = 26) : DDFSpansOn η a b F.hη F.trans (towerBigrade D K (-((4:ℕ):ℤ)) 4)`
      ——与本卡【断言】逐字一致（hD : 3 ≤ D 即本卡强化的假设，`DDFSpansOn …
      (towerBigrade …)` 就是「H_phys ∩ V_4 ⊆ D(Ε) + H_null」的 Lean 展开）。

      文件头模块 docstring 逐字："The fourth antidiagonal slice of `ddf-spans`, after
      `Assembly.ddfSpans_bigrade_neg_one_one` (N = 1, unconditional in D),
      `LevelTwoCount.ddfSpans_bigrade_neg_two_two` and
      `LevelThreeCount.ddfSpans_bigrade_neg_three_three`."

      **证明链（逐层核对，供审计）**：`ddfSpans_bigrade_neg_four_four` 直接调用
      `ddfSpansOn_bigrade_of_b26 F.frame.isotropic F.hba (b26_four_of_D26 hD F hD26)`
      （同 N=2、N=3 一样，`ddfSpansOn_bigrade_of_b26` 是 D-无关、N-无关的纯逻辑翻译引理，
      不建 depends_on 边）；`b26_four_of_D26` 的九个输入 h1-h9 逐一核对
      （第 1198-1211 行逐字读取）：
      h1 = `finrank_towerPhys_inf_towerBigrade_le`
        （worldsheet.physical-slice-bounded-by-transverse-count 的 formal.lean_decl，
        逐字调用，给 dim H_4 ≤ p_{D−1}(4)）；
      h2 = `card_conjFree_four_le`、h4 = `card_ddfLevel_four_ge`、h5 = `card_conjFree_three_ge`、
      h6 = `card_conjFree_two_ge`
        （本文件内部纯计数引理，不对应图上既有节点，不建边）；
      h3 = `levelFour_count_identity`
        （math.level-four-partition-difference 的 formal.lean_decl，逐字调用，给
        p_{D−1}(4) = p_{D−2}(4) + p_{D−1}(3) + p_{D−1}(2)）；
      h7 = `le_finrank_towerSeed (K:=K) hD2 F (-((4:ℕ):ℤ)) 3`
        （worldsheet.quasi-physical-slice-dimension 的 formal.lean_decl，逐字调用，
        给 dim Q_{−4,3} ≥ p_{D−1}(3)——level-3 的实例）；
      h8 = `le_finrank_towerSeed (K:=K) hD2 F (-((4:ℕ):ℤ)) 2`
        （同一条引理，level-2 的实例，给 dim Q_{−4,2} ≥ p_{D−1}(2)）；
      h9 = 内联证明块，`rw [hint, hrung]; exact le_finrank_towerNull_inf_towerBigrade_four
        hD F haa hD26`
        （worldsheet.level-four-null-family-transversal--via-lean 承载的横截性引理
        所在的同一文件、同一 section 的姊妹定理——**唯一使用 (D:K)=26 且唯一使用
        hD : 3 ≤ D 的一步**，见下）；
      最后 `rw [finrank_ddfSpan_inf_towerBigrade F.hη F.frame.isotropic F.hba F.trans 4]`
        （worldsheet.transverse-ddf-fock-gram-matrix 一侧的维数版本，非该卡 headline
        `ddf_gram_diagonal`，给 dim D_4 = p_{D−2}(4)，与 N=2/N=3 derivation 同一记法）。
      九项经 `omega` 拼成 `b26_four_of_D26`。

      **`le_finrank_towerNull_inf_towerBigrade_four` 的结构**（h9，第 1111 行起）：
      构造 `typeTwoAugFour`（Type-1 ⊕ Type-2 的组合线性映射，定义域
      `towerSeed η a b (-4) 3 × towerSeed η a b (-4) 2`），证明其单射性
      （`typeTwoAugFour_injective`，第 1081 行，`hD : 3 ≤ D`，核心是
      worldsheet.level-four-null-family-transversal 的
      `eq_zero_of_towerLop_neg_one_add_descTwo_at_four`），证明其像落在
      `towerNullSubmodule ⊓ towerBigrade(-4,4)` 里（Type-1 半用
      `towerLop_neg_one_mem_towerNullSubmodule_of_mem_towerBigrade`——TypeOneFamily.lean/
      NullSeedsTwo.lean 共享的铺垫引理，与 N=3 derivation 同一条；Type-2 半用
      `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`，其证明体直接调用
      `descTwo_mem_towerNullSubmodule`——NullSeedsTwo.lean 的一般充分性引理，即
      worldsheet.level-two-null-state-requires-d26 sources.loc 里已登记的同一条引理，
      这是本卡与该卡之间可核实、非 inferred 的边，见下），最后用
      `LinearMap.finrank_le_finrank_of_injective` 收尾。
  - ref: goddard-2008
    loc: "§6, p.15, eq. (6.4)（arXiv:0802.3249v1）：'|ψ⟩ = |f⟩ + |n⟩'，对 D = 26 断言"
    note: |
      **不承载本卡的论证**。本卡与 (6.4) 的形式**逐字相同**（D = 26、|n⟩ 是零态），
      差别只剩一处：文献对一切能级断言，本卡只做 (rung −4, level 4) 这一片。
      与 worldsheet.ddf-spans-physical-states-level-three 引用同一条文献锚点，理由同该卡。
tags: [bosonic-string, spectrum-generating-algebra, no-ghost, ddf-spans, critical-dimension, formalized]
notes: |
  【为什么立卡】formal/StringFormal/NoGhost/LevelFourCount.lean 把 N = 4 这一片的 DDF
  张成做成机器验证的定理，是继 worldsheet.ddf-spans-physical-states-level-two（N=2）与
  worldsheet.ddf-spans-physical-states-level-three（N=3）之后第三个真正消费 D = 26 的
  机检张成结果，也是本项目目前的形式化前沿（N ≤ 4 全部关闭，N ≥ 5 完全开放）。本卡承载
  这一结果，形状与两张姊妹卡逐字对齐（同一个"DDFSpansOn 分片实例"模式）。

  【查重】2026-09-12 跑 `uv run stringgraph search "level four" / "level-four" / "N=4" /
  "rung -4" / ddfSpans_bigrade_neg_four`，均无同内容命中；`search ddf-spans` 命中的是
  既有的 N=1/2/3 系列卡与 worldsheet.ddf-spanning-hypothesis 本身，形状相同但片不同，
  不重复。

  【D 只通过一件事进入，与 N=2、N=3 的机制平行但不同】N=2 处 D 经由单个具体向量
  （𝒟₂|0;p₋₂⟩）的物理性进入；N=3 处 D 经由 Type-2 族（Q_{−3,2} 大小的 𝒟₂ 像）落在
  H_null 里这一步进入；N=4 处同样只经 Type-2 族（这次是 Q_{−4,2} 大小的 𝒟₂ 像）落在
  H_null 里这一步进入，具体是 `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`
  内部调用的 `descTwo_mem_towerNullSubmodule`（同一条 NullSeedsTwo.lean 一般充分性引理，
  三片共用同一条 D=26 入口）。**Type-1 族的物理性、两族的横截性（本卡消费的
  worldsheet.level-four-null-family-transversal）、以及全部计数步骤，都不用 D=26**——
  这与 worldsheet.ddf-spans-physical-states-level-two/-level-three notes 是同一个洞察
  在 N=4 上的第三次重复确证。**额外新增的是 3 ≤ D**（横截性论证本身需要，不是 D=26 判据，
  是存在性门槛，见目标卡即本卡自身【与...level-three 的关系】段）。

  【depends_on 的取舍：为什么不挂 worldsheet.ddf-spanning-rank-inequality】
  同 worldsheet.ddf-spans-physical-states-level-two/-level-three 的既有理由：
  `ddfSpansOn_bigrade_of_b26` 是 D-无关、N-无关的纯逻辑翻译引理，本卡只在 N=4 这一个
  具体实例上证明 `B26 4`，不是引用该卡尚未证的 "∀N" 内容。故不建这条边。

  【depends_on 的取舍：Type-1、Type-2 两族在 N=4 都经 le_finrank_towerSeed 挂
  worldsheet.quasi-physical-slice-dimension，不再需要 worldsheet.null-states-lower-bound-type-one
  的 inferred 边】与 worldsheet.ddf-spans-physical-states-level-three--via-lean 不同
  （那里 Type-1 的定义域是 ker(transFunctional)，维数恰为 D−1，走的是秩零化度而非
  towerSeed 下界，因此该卡与 worldsheet.null-states-lower-bound-type-one 之间只能标
  inferred: true 的"共享底层引理"边），本卡的 Type-1 定义域本身就是 towerSeed(−4,3)
  （h7，`le_finrank_towerSeed` 的直接实例），与 Type-2 半（h8）用的是**同一条**
  formal.lean_decl——两次调用同一条引理，故本卡改挂两条边到
  worldsheet.quasi-physical-slice-dimension（均 inferred: false，见配套推导），
  不再需要经由 worldsheet.null-states-lower-bound-type-one 的类比边。
