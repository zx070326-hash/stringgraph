    note: |
      L1（抽取记录 polchinski-1998-v2.md E41；变换式与两句逐字措辞逐页读到原书页图）。
      ⚠ 原书给出变换与结论，**不给标号层面的验算**，也不定义「物理上不同」。
tags: [superstring, sectors, type-ii, gso, field-redefinition, consistency]
notes: |
  【为什么另立此卡（reviewer-v2-ch10 裁决，2026-09-11）】
  本步原先写在 worldsheet.superstring-sector-consistency-solutions 的 statement 里，
  与那张卡的有限组合穷举混在一起。两者的论证种类完全不同：
  穷举是可判定的有限计算（已在 formal/StringFormal/Math/FiniteCounts.lean 机器检查），
  而本步是一个场重定义加上「什么算同一个理论」的物理判断（原书不定义该判据）。
  混卡会把机器检查过的那半也压成 physical-argument，故拆开。
  FiniteCounts.lean 的 docstring 自己把本步列在「Not formalised here」：
  'that the spacetime reflection (10.6.7) identifies IIA′ ≅ IIA and IIB′ ≅ IIB'。

  【下游谁该依赖本卡】任何从「四个扇区解」走到「两个理论 IIA/IIB」的推导，
  例如 worldsheet.ten-dimensional-superstring-theories--via-consistency-conditions
  的第 (1) 步。穷举卡本身**不再**承载这一步。

  【查重】`uv run stringgraph search reflection` / `IIA` / `等价` 均无同内容节点（2026-09-11）。
