id: worldsheet.heterotic-so32-ope-local-and-closed
kind: proposition
title: SO(32) 杂化弦的顶点算子 OPE 局域且闭合（原书：'easily verified by means of bosonization'）
statement: |
  对 worldsheet.heterotic-so32-projections 定义的扇区与投影，保留下来的顶点算子集合满足
    **(a) 相互局域性**（算子乘积无分支切割），
    **(b) OPE 闭合**（任意两个保留算子的 OPE 里只出现保留的算子）。

  原书对此的全部论证是一句：'**It is easily verified by means of bosonization** that the OPE
  is local and closed.'（玻色化即 (11.2.11)/(11.2.12)：把 32 个 λ^A 复化成 16 个 λ^{K±}，
  再写成 16 个左移标量 H^K，费米子数 F = Σ_K q_K。）

  **本命题不断言的内容**：
    (1) 不给出验证过程（原书不给）。
    (2) 不断言这两条**足以**保证理论一致——模不变性是另一条（
        worldsheet.heterotic-so32-partition-function）。
    (3) 不断言玻色化本身成立（本图无玻色化节点）。
uses_conventions:
  - conv.worldsheet-complex-coords
  - conv.ope-tilde-notation
sources:
  - ref: polchinski-1998-v2
    loc: "§11.2, (11.2.12) 之后, p. 51（无式号；逐字：'It is easily verified by means of bosonization that the OPE is local and closed.'）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E56，「文献自称的严格程度」栏逐字）。
  - ref: polchinski-1998-v2
    loc: "§10.6, eq. (10.6.5)、(10.6.6), pp. 25–26（相互局域性与 OPE 闭合这两条条件在本书里的定义）"
    note: |
      L1（E40）。本卡断言的两条正是那里强加的条件 (a)(b)；本图对应节点
      worldsheet.superstring-sector-consistency-conditions。
tags: [heterotic, so32, ope, locality, bosonization, assertion]
notes: |
  ★【为什么值得单独建卡】E₈ × E₈ 的唯一性论证（worldsheet.heterotic-two-supersymmetric-ten-dimensional）
  明确用到「OPE 闭合」来排除「分成 8 个一组」的取法（原书逐字：'the second is inconsistent with
  closure of the OPE thus making the interactions inconsistent'）。
  若不把 OPE 闭合建成节点，那条唯一性论证在图上就是悬空的。

  【本图的最大缺口：没有玻色化节点】(11.2.11)/(11.2.12) 的复化与玻色化、以及 §10.3/§10.4 的
  玻色化（E25、E27、E30）本图**全无节点**。因此「by means of bosonization」这个唯一的
  论证手段在图上没有任何支撑，只能靠 gaps 记录。
  → 建议后续任务：把 Vol.2 §10.3（(10.3.5)–(10.3.29)）的玻色化建成一组节点，
    并注意那里的标量归一化是 α' = 2（H(z)H(0) ∼ −ln z），与本图 conv.alpha-prime-regge 不同，
    需要 convention_map。

  【与 §10.6 三条件的关系】本卡断言的 (a)(b) 与 §10.6 的条件 (a)(b) 是同一对条件，
  只是这里是对杂化弦的扇区集合验证它们，而不是用它们求解扇区组合。

  ⚠⚠【2026-09-11 陈旧提醒（curator-batch28，reviewer-batch18 记录）】statement「不断言 (3)」
  与上面【本图的最大缺口】那段写的「本图无玻色化节点」**现已过时**：`uv run stringgraph
  search bosoniz` 现在返回若干玻色化节点，其中最相关的是
    · worldsheet.fermion-bosonization-two-dimensions（二维玻色化：一对世界面费米子 ≅ 一个全纯标量，
      ψ ≅ e^{iH}、ψ̄ ≅ e^{−iH}）；
    · worldsheet.u1-current-algebra-is-free-boson（U(1) 流代数 ≅ 自由玻色子，j^a = i∂H^a）；
    · worldsheet.vertex-operator-cocycle（格点动量顶点算子的 cocycle 因子）；
  另有 worldsheet.bc-ghost-bosonization、worldsheet.beta-gamma-bosonization、
  worldsheet.ramond-ground-state-vertex-operator、worldsheet.spin-field-vertex-operators 等
  （鬼场/超对称侧的玻色化，与本卡关系较远）。
  ⚠ **这不构成对 statement 的即时换代**：本卡断言 (3) 说的是「本图无玻色化节点」，
  按 graph/CLAUDE.md「statement 正文不可变」的规则，正文里这句陈旧的话**不就地改**；
  上面【本图的最大缺口】那段（notes，非 statement）同样是历史记录，留作对照。
  ⚠ 且现有节点均未逐字覆盖本卡需要的那一步——**32 个 λ^A 复化成 16 个 λ^{K±} 再写成 16 个左移
  标量 H^K**（(11.2.11)/(11.2.12)）——`fermion-bosonization-two-dimensions` 只给「一对费米子 ↔
  一个标量」的一般模式，不给「16 个左移标量」这个杂化弦专属的复化步骤。
  ⇒ 若日后要把本卡的 gaps 实质关闭（把「by means of bosonization」接成图内推导），仍需专门为
  (11.2.11)/(11.2.12) 建卡或建推导，不能直接借用上述任何一张现有节点当 depends_on。
  ⇒ 本卡 statement 与「不断言 (3)」保持不变（原则 1）；下一次本卡实质换代时应重写这一句。
