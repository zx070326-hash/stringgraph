id: worldsheet.weyl-anomaly-central-charge-constant
kind: proposition
title: Wess–Zumino 相容性条件强制中心荷是常数
statement: |
  把 δ_W ln Z[g] 的最一般局域形式（含边界项）按五个待定系数 a_1, …, a_5 参数化（(3.4.27)）。
  由于 Weyl 变换互相对易，两次 Weyl 变分必须对称：
    δ_{W(ω_1)} δ_{W(ω_2)} ln Z = δ_{W(ω_2)} δ_{W(ω_1)} ln Z
  （**Wess–Zumino 相容性条件**）。该条件给出系数之间的关系
    2 a_1 = a_4    （(3.4.30)），
  并且——若把体项系数 a_1 推广为世界面上的**局域**函数，记 a_1 = -C(σ)/12——
  相容性强制
    ∂^a C(σ) = 0    （(3.4.31)），
  即 C 是常数。换言之：**中心荷不能随世界面位置变化**。
uses_conventions: [conv.virasoro-standard, conv.worldsheet-euclidean]
sources:
  - ref: polchinski-1998-v1
    loc: "§3.4, eq. (3.4.27)（五个系数的一般形式）、(3.4.29)、(3.4.30)（2a_1 = a_4）、(3.4.31)（∂^a C = 0），p.96–97"
    note: |
      公式号经 schrans-2020 目录核实（`3.28`–`3.31`, p.96–97）；
      **内容也已核实**：schrans-2020 §3.30、§3.31 的正文逐步复现了 2a_1 = a_4 与 ∂^a C(σ) = 0。
tags: [worldsheet, weyl-anomaly, central-charge, wess-zumino]
notes: |
  这条在 D = 26 的论证中的作用常被略过，但它是必要的一环：
  没有它，「总中心荷为零」这一条件可以只在世界面的某些区域成立，
  从而「c^{tot} = 0」就不是一个关于理论的整体条件。
  相容性把 c 钉成常数之后，「反常抵消」才成为一条对理论（而非对构型）的约束。
author: curator-polchinski-ch2-3
created: "2026-09-10"
