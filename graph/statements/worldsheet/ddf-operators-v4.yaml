id: worldsheet.ddf-operators-v4
kind: definition
status: rigorous
title: DDF 算子（横向指标 i = 2..D-1；类光参考直线 + 归一化 2α' k_0·p = 1）
statement: |
  横向指标约定与 worldsheet.light-cone-quantization 一致：i = 2..D-1（共 D-2 个横向方向），
  0、1 方向组成光锥对 ±。

  设 F(p) 是 D 维自由玻色开弦建在动量本征态 |0; p⟩ 上的 Fock 空间（振子 α^μ_n，
  零模 α^μ_0 = (2α')^{1/2} p^μ，α' 见 conv.alpha-prime-regge）。

  取一条**类光参考方向**，即由某个非零类光向量张成的**去心直线**
  {λ k_0 : λ ∈ R \ {0}}（k_0^2 = 0），以及横向偏振 ε^i（i = 2..D-1，ε·k_0 = 0）。
  DDF 算子定义为

    A^i_n := ∮ (dz / 2πi) ∂X^i(z) e^{i n k_0·X(z)}，   i = 2..D-1，n ∈ Z \ {0}，

  其中 k_0 在该直线上的**标度**取为使

    2 α' k_0·p = 1                                                (★)

  （p 是被作用态的动量）。特别地要求 k_0·p ≠ 0。

  关于 (★) 的三点说明，它们是定义的一部分：

  (a) 条件 k_0·p ≠ 0 只依赖 k_0 的**方向（去心直线）**，不依赖标度：k_0 → λ k_0（λ ∈ R \ {0}）
      仍类光，且 k_0·p ≠ 0 保持成立。标度由 (★) 唯一确定为 λ = 1/(2α' k_0·p)，
      其**符号随 sign(k_0·p)**：k_0·p < 0 时 λ < 0，归一化后的代表元落在原射线的反向上。
      这正是本节点把参考方向取成去心直线 {λ k_0 : λ ∈ R \ {0}} 而不是射线 {λ k_0 : λ > 0}
      的原因；等价的说法是"固定一条射线并额外要求 k_0·p > 0"，但那会人为排除半数动量。
      归一化之后 (★) 蕴含 k_0·p = 1/(2α') > 0，故任一被归一化的代表元总满足 k_0·p > 0。
      故"固定 k_0"在本图中一律理解为"固定一条类光去心直线"，标度（含符号）按 (★) 逐塔确定。

  (b) (★) 沿一条 DDF 塔不变：A^i_n 把动量 p 移到 p + n k_0（顶点算子 e^{i n k_0·X} 携带动量
      n k_0），而 k_0^2 = 0 蕴含 k_0·(p + n k_0) = k_0·p，故若 (★) 对 p 成立则对整条塔
      {p + n k_0 : n ∈ Z} 同时成立：一次重标度覆盖整条塔。跨塔（k_0·p 取不同值的动量）
      需要不同的 λ（可以异号），但按 (a) 这不改变扇区 {p : k_0·p ≠ 0}。

  (c) (★) 的来源是单值性：∂X^i(z) e^{i n k_0·X(z)} 与动量 p 的态的 OPE 带因子
      z^{2α' n k_0·p}（开弦边界归一化），围道积分要良定义需 2α' n k_0·p ∈ Z 对所有 n ∈ Z 成立，
      即 2α' k_0·p ∈ Z；(★) 取该整数为 1。在 α' = 1/2 的归一化下 (★) 退化为文献常见的
      k_0·p = 1（worldsheet.ddf-operators-v2 与 GSW 采用的形式）。

  DDF 算子与所有 Virasoro 生成元对易，[L_m, A^i_n] = 0
  （因 k_0^2 = 0、ε·k_0 = 0 使被积量是权 1 primary），且满足横向振子代数

    [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}，

  即一个 D-2 维横向自由振子代数。
uses: [worldsheet.virasoro-algebra-v2, worldsheet.old-covariant-physical-states]
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      沿用 worldsheet.ddf-operators-v2 的核实结果（literature/extractions/brst-cohomology-sources.md §5.2–5.3）：
      §2.3.2 的标题是 'Construction of transverse physical states'，只占 p.100–101；DDF 与
      spectrum-generating algebra 按目录属 §2.3.3（p.102–112），Google Books 全文检索 'DDF'
      正文首次命中 p.103。章节页码来自 CUP 25 周年版 frontmatter（L4，未逐字核对）+ Google Books
      页码定位。**式号仍未核实（L0）**。GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写。
      GSW 取 α' = 1/2，故其归一化写作 k_0·p = 1，是 (★) 的特例；一般 α' 的形式 (★) 不出自 GSW，见 notes。
      GSW 也没有逐字讨论参考向量取射线还是直线，说明 (a) 的符号讨论是本项目的补充，见 notes。
  - ref: goddard-thorn-1972
    loc: "eq. (3)–(6)（式号未核实）"
    note: 式号沿用旧节点 worldsheet.ddf-operators，未与原文核对；GT 1972 正文未获取，未在 literature/extractions/ 登记。
  - ref: polchinski-1998-v1
    loc: "§4.1（DDF 构造需要 k_0·p ≠ 0 的注记；页码/式号未核实）"
    note: |
      ms.no-ghost-theorem 第一轮审计 B6 指出 Polchinski §4.1 有此注；抽取记录
      literature/extractions/polchinski-1998-v1.md 未覆盖该注，定位未核实。
tags: [bosonic-string, spectrum-generating-algebra]
notes: |
  取代 worldsheet.ddf-operators-v3（v3 又取代 v2）。按项目规则陈述文本不可变，故新建本节点。

  【相对 v3 的唯一实质改动，来自 ms.no-ghost-theorem 第三轮审计 A1 附带项 / D2】
  v3 把参考方向写成**射线** {λ k_0 : λ > 0}，同时说标度"唯一确定为 λ = 1/(2α' k_0·p)"。
  两句互相矛盾：k_0·p < 0 时该 λ < 0，不在射线上。本节点把参考方向改成**去心直线**
  {λ k_0 : λ ∈ R \ {0}}，并在说明 (a) 里显式写出 λ 的符号随 sign(k_0·p)，以及"归一化后
  必有 k_0·p > 0"这一等价刻画。其余文本与 v3 逐字相同。

  这个改动是表述缺陷的修复，不改变构造的内容：
  - 对固定的态动量 p，满足 (★) 的类光向量 k_0 在 v3 与 v4 下**是同一个**（(★) 本身没变）；
  - v3 的射线写法的后果只是：对 k_0·p < 0 的方向，v3 的前提不可满足，相关断言在那里空真而非假
    （第三轮审计 A1 的原话）。v4 去掉这个空真区域，使"固定一条类光方向"覆盖全部
    k_0·p ≠ 0 的动量。
  - worldsheet.no-ghost-theorem-v3 的 (1b) 前提 (ii) 对 k_0·k < 0 的 k 在 v3 下不可满足，
    在 v4 下可满足；这只扩大覆盖面，不改变已覆盖部分的内容。

  【继承自 v3 的说明，未改动】
  v3 相对 v2 的改动（归一化由 k_0·p = 1 改为一般 α' 的 2α' k_0·p = 1；显式引入 F(p) 与零模
  α^μ_0 = (2α')^{1/2} p^μ；显式写出 A^i_n 把动量移到 p + n k_0；说明 (c) 的单值性理由）
  全部保留，理由见 worldsheet.ddf-operators-v3 的 notes（第二轮审计 C1/C2）。
  横向指标范围 i = 2..D-1、参考动量记号 k_0 与态动量记号 p 的区分，均与 v2/v3 相同。

  【来源强度】(★) 的一般 α' 形式**没有直接的文献定位**：GSW 与 GT 均在 α' = 1/2（或等价的
  单位 Regge 斜率）归一化下工作，写的是 k_0·p = 1。本节点把 α' 因子按量纲恢复，依据是说明 (c)
  的单值性计算（初等，可自洽核验：α' = 1/2 时退化为 k_0·p = 1）。这属于本项目对文献归一化的
  换算，不是新物理内容；若 researcher 日后拿到 GT 1972 正文或 GSW 原式号，应把 loc 补精确。
  说明 (a) 中"去心直线 vs 射线"的讨论同样**没有文献定位**：文献通常只写"取一个类光 k_0 使
  k_0·p ≠ 0 并归一化"，不讨论参数化。这是本项目为可形式化而做的精确化。

  k_0·p = 0 的扇区（特别是 p = 0）DDF 构造退化，需单独处理（第一轮审计 B6）。

  Fock 空间 F(p) 的形式化定义见 worldsheet.bosonic-fock-space（`formal/StringFormal/NoGhost/Fock.lean`，
  只含振子部分），其上的不定双线性型见 worldsheet.fock-indefinite-form；本节点隐含使用了零模
  α^μ_0 = (2α')^{1/2} p^μ 与动量 p（归一化 (★) 的全部内容都关于 p，A^i_n 还把 p 移到 p + n k_0），
  这部分**尚未形式化**，因此本节点不继承那两个节点的 formalized 状态。

  【Lean 进展 2026-09-11】本仓库合并提交 9691057（formal 侧提交 4c12d36），新增
  `formal/StringFormal/NoGhost/VertexOperator.lean` 与 `formal/StringFormal/NoGhost/DDF.lean`，
  两者均无 sorry，公理只有 propext / Classical.choice / Quot.sound。
  **本节点 status 不变（仍 rigorous，不升 formalized）**：A^i_n 本身尚未定义，
  已形式化的只是它的两个零件。逐条登记成果与由此暴露的缺口，对照 formal/TODO.md 的 `ddf-operators` 项。

  (1) **顶点算子 :e^{i k_0·X}: 的振子部分已形式化**。在**代数** Fock 空间
      （worldsheet.bosonic-fock-space 的 `MvPolynomial (Osc D) R`）上，正规序指数的两半都是初等的：
      产生半 E_-(z) = exp(Σ_{m≥1} (b·α_{-m}/m) z^m) 只是"乘以交换环 Fock D R 的一个显式元素"
      （`Fock.creaExp`，单项式系数即经典指数权）；湮灭半 E_+(z) = exp(−Σ_{l≥1} (b·α_l/l) z^{-l})
      的指数是常系数导子，故 E_+ 就是**变量平移** X_{μ,l} ↦ X_{μ,l} − b^μ T^l（`Fock.vertexSub`），
      一个到 Polynomial (Fock D R) 的代数同态。于是 z^K 系数 `Fock.vertexOsc η b K`
      逐向量是有限和，**全程不用任何收敛性假设**。这里 b^μ = (2α')^{1/2} k_0^μ 是本节点 k_0 的重标度。
      核心恒等式：`Fock.lie_mode_vertexOsc`（[α^μ_p, V_K] = b^μ V_{K−p}，p ≠ 0）与双动量形式
      `Fock.mode_vertexOsc_sub`（左侧模态用参数 a+b、右侧用 a，对**所有** p 含 0 成立）。
      动量塔 `TowerFock D R = ℤ →₀ Fock D R`（第 j 层动量参数 a + j·b）与移位算子 `towerShift n`
      （即零模算符 e^{i n k_0·x}）也已形式化，塔上的 `lie_towerMode_towerVertex` 对**所有** p
      （**含 p = 0**）成立。相对地，单个 Fock 空间上 p = 0 的括号**为零**
      （`Fock.lie_mode_zero_vertexOsc`）：本节点"A^i_n 把动量 p 移到 p + n k_0"这句在形式化里
      是**必需**的，没有动量塔就没有正确的零模关系。塔的索引字典是 j = −N（本节点写作 {k − N k_0}）。
      本节点说明 (b)（k_0² = 0 ⇒ k_0·p 沿塔不变）已形式化为 `dotVec_towerMomentum_right_of_isotropic`。

  (2) **【本项目 Lean 侧的新发现，文献未明写】横向条件 ε·k_0 = 0 是 A^i_n 作为代数算子良定义的
      必要输入，而不只是为了避免奇异 OPE / 使被积量成为权 1 primary。** 理由：DDF 算子是模态和
      A^i_n = Σ_{m ∈ Z} α^i_m V^{(n)}_m，它在代数 Fock 空间上逐向量是**有限**和，当且仅当可以把
      α^i_m 移到右侧（那里 m 充分大时湮灭该态）；移动的合法性正是 [α^i_m, V^{(n)}] = 0，即 ε·k_0 = 0
      （Lean 侧 `lie_towerMode_towerVertex_of_eq_zero`，配合 `Fock.vertexOsc_apply_eq_zero_of_level`）。
      若 ε·k_0 ≠ 0，则按 (1) 的 [α^μ_p, V_K] = b^μ V_{K−p}，该和每一项都非零，
      在代数 Fock 空间上根本不是局部有限和，A^i_n 连"算子"都算不上。文献（GSW §2.3.3、GT 1972）
      只把 ε·k_0 = 0 当作 primary 条件。本节点陈述文本不改（ε·k_0 = 0 本来就在其中），
      这里只登记该条件的**第二重作用**。

  (3) **本节点断言的 [L_m, A^i_n] = 0 尚未形式化。** 形式化所需的正确中间陈述是
        L_m^{(a+b)} V_J − V_J L_m^{(a)} = (J + b·a − m + (m+1)·½ b·b) V_{J−m}
      （两侧 L_m 的动量参数不同，这是塔上算子的必然写法），共形权
        h = ½ b·b = α' k_0²，故 k_0² = 0 ⇒ h = 0。
      现状：**归纳步已有**（`Fock.vertexOsc_unique` / `Fock.eq_zero_of_vertex_recursion`
      把该恒等式归约为真空上的单条等式），真空 + m = 0 的情形已核验，一般 m 的形式化进行中
      （`StringFormal/NoGhost/VertexWeight.lean`，截至 9691057 未合并）。在此之前
      **图中不得把 [L_m, A^i_n] = 0 或"e^{i k_0·X} 权为 0"记为已机器验证**。

  (4) **说明 (a) 的存在性部分不可在一般环上形式化。** "存在类光 k_0 使 k_0·p ≠ 0" 是关于
      **实**二次型（洛伦兹号差）的断言，在一般交换环 R 上为假。Lean 侧因此把归一化与类光性
      作为显式假设引入（`dotVec η b a = 1` 即 2α' k_0·p = 1，`dotVec η b b = 0` 即 k_0² = 0），
      不证其可满足性。要把说明 (a)（去心直线上的标度与符号选取）完整形式化，必须取 R = ℝ
      并引入号差与类光锥，这是一条独立待办。

  (5) **仍无机器验证的部分**：A^i_n 的定义本身；[L_m, A^i_n] = 0；横向振子代数
      [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}（需顶点算子的乘积/OPE，完全未碰）；顶点算子的伴随
      V(b)_J† = V(−b)_{−J}（需 E_+ E_- 重排序，且 Lean 侧目前只有 R-双线性型，无 sesquilinear 结构）；
      x^μ 与 [x^μ, p^ν]（塔上只有 e^{i n k_0·x} 这一个移位，且塔建在固定的 a、b 上，
      不是全动量空间）。
