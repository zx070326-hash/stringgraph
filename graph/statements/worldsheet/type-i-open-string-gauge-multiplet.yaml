id: worldsheet.type-i-open-string-gauge-multiplet
kind: proposition
title: 开超弦必须做 GSO 投影，两种可能给无质量谱 8_v + 8（I）或 8_v + 8′（Ĩ）；加 Chan–Paton 后规范群为 U(n)（取向）或 SO(n)/Sp(n)（无取向），规范微子在伴随表示
statement: |
  **(1) 开弦必须做 GSO 投影**。原书给的理由逐字：
  'Closure of the OPE in open + open → closed scattering implies that any open string that
  couples consistently to type I or type II closed superstrings must have a GSO projection in
  the open string sector.'
  两种可能的投影及其无质量谱：
    **I** ： NS+, R+ ⟹ 无质量谱 **8_v + 8**；
    **Ĩ** ： NS+, R− ⟹ 无质量谱 **8_v + 8′**。

  **(2) Chan–Paton 因子与规范群**：加上 Chan–Paton 因子后，规范群在**取向**情形是 U(n)，
  在**无取向**情形是 SO(n) 或 Sp(n)。

  **(3) 规范微子在伴随表示**：8 或 8′ 旋量称为 *gauginos*（规范微子），
  它们与规范玻色子由超对称联系，故必须与规范玻色子一样处在规范群的**伴随表示**中
  ——原书给的理由逐字：'because supersymmetry commutes with the gauge symmetry'。

  本命题**不**断言开弦能与哪种闭弦理论耦合（见
  worldsheet.ten-dimensional-superstring-theories），也**不**断言 n 的取值
  （SO(32) 是 §10.8 的 tadpole 条件，见 worldsheet.type-i-tadpole-cancellation-so32）。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
sources:
  - ref: polchinski-1998-v2
    loc: "§10.6「Unoriented and open superstrings」, p. 30（逐字：'Closure of the OPE in open + open → closed scattering implies that any open string that couples consistently to type I or type II closed superstrings must have a GSO projection in the open string sector. The two possibilities and their massless spectra are' I : NS+, R+ = 8_v + 8；Ĩ : NS+, R− = 8_v + 8′；以及 'Adding Chan–Paton factors, the gauge group will again be U(n) in the oriented case and SO(n) or Sp(n) in the unoriented case. The 8 or 8′ spinors are known as gauginos because they are related to the gauge bosons by supersymmetry. They must be in the adjoint representation of the gauge group, like the gauge bosons, because supersymmetry commutes with the gauge symmetry.'）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E45；两行谱与全部逐字措辞逐页读到原书页图）。
      ⚠ 本段**无式号**：(10.6.16)–(10.6.18) 属于闭弦部分，开弦这两行谱在原书里是正文表格式的排版。
tags: [superstring, type-i, open-string, gso, chan-paton, gauge-group]
notes: |
  【开弦 GSO 的理由与闭弦不同】闭弦的 GSO 来自三条一致性条件的解
  （worldsheet.gso-projection）；开弦这里的理由是「开+开→闭 散射中 OPE 的闭合」，
  即开弦扇区必须与它耦合的闭弦扇区相容。**这是一条不同的论证**，
  故本卡不从 worldsheet.gso-projection 继承，而是单独记账。

  【Chan–Paton 因子在本图无节点】U(n) / SO(n) / Sp(n) 这条规则是 Vol.1 §6.5 的内容
  （本图未建）。本卡照录原书的 'again'（表示这是 Vol.1 结论的复用），
  推导里标 inferred。

  【伴随表示那一步的强度】'because supersymmetry commutes with the gauge symmetry' 是
  一句物理理由，本图没有时空超对称的节点（worldsheet.type-ii-spacetime-supersymmetry
  也只是 physical-argument 且带原书的赤裸断言）。
