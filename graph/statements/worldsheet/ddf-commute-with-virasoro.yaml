      **但它仍无证明**（历史综述），故只升可追溯性，不升 status。
      旧结论「不给编号」只对**无鬼定理本身**成立（该文 (6.4) 无编号），已在 source note 里更正。
  (2) **gebert-nicolai-1995 给出了本命题的顶点代数证明**：链条 (2.36) Jacobi 公理 ⇒ (2.38)/(2.41)
      ⇒ (2.56)/(2.57) ⇒ (3.5)，**全程形式级数，不用围道形变、不用收敛性**，
      作者自陈「We immediately infer from (2.41)」「it is clear from (2.57)」。
