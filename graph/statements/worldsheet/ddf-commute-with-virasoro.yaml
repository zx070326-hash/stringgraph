  【本节点的 ε·p = 0 问题（extractions/gsw-1987-v1.md Q5）已核查：不是缺口】
  G–N §3.2 (p.599) 比本图多要一条「偏振与态动量正交」ξ·r = 0。核查结论：
  (3.5) 的证明只用 ξ·k = 0 与 k·k = 0，r 不进入；且横向空间是商 {ξ : ξ·k = 0}/ℝk，
  而 A^{ξ+ck}_m = A^ξ_m（m ≠ 0），故总可把代表元换成满足 ξ·r = 0 的那个。
  **推理是本项目的（G–N 未写 WLOG），已登记在 --via-vertex-algebra-primary 的 gaps 第 5 条。**

  【与 worldsheet.ddf-transverse-oscillator-algebra 的关系】两条是独立命题：
  本条只需要被积量是权 1 primary（k_0² = 0、ε·k_0 = 0），不需要任何两个顶点算子的乘积；
  横向振子代数需要 V(b, z) V(b', w) 的 OPE，形式化路径完全不同（Lean 侧后者尚未起步）。
  故按「一个节点一个命题」分开。

  【2026-09-11（五）：Lean 已覆盖 m ≠ 0；本卡**不**标 formalized。弱节点已立（lead 裁决），curator】
  formal 侧 9ac8f41（`formal/StringFormal/NoGhost/DDFOperatorNeg.lean`，无 sorry，
  7 条声明公理只有标准三条）证得
    `lie_towerLop_ddfOp_of_ne`：k_0² = 0、2α' k_0·p = 1、ε·k_0 = 0、**m ≠ 0** ⟹ ⁅L_m, A^ε_n⁆ = 0，
  n 无限制。这**不是**本卡的全部内容：本卡的量词是 **∀ m ∈ Z（含 m = 0）**。
  按项目原则「status 只能实话实说」，**本卡不标 formalized、不新增 --via-lean 推导**；
  已形式化的那一半由新的弱节点
    **worldsheet.ddf-commute-with-nonzero-virasoro**（m ≠ 0，effective = formalized）
  单独承载，模式与 worldsheet.brst-nilpotent-at-c26 相同。
  本卡的有效状态因此**不变**（physical-argument，best_derivation 仍是 --via-conformal-weight）。

  **剩余障碍已被钉死在一处**（formal/TODO.md `ddf-operators` 第 (5) 项逐字）：
  「`hm : m ≠ 0` 在 `lie_towerLop_ddfOp_of_ne` 里只用了一次，就是引用
    `lie_towerLop_ddfSummand_of_ne`。伸缩和与窗口分析在 `m = 0` 处逐字成立。
    真正缺的是单 Fock 恒等式在 `m = 0` 的版本。」
  即障碍**不在** DDF 这一层，而在 worldsheet.exponential-vertex-operator-mode-weight-identity
  的 m = 0 例外：Sugawara 正规序求和在 m = 0 时 j = 0 与 j = m 两项**重合**
  （并成一项 ½:α_0·α_0:，中间段为空），把 m ≠ 0 的系数代进去会得到**错**答案。
  补上单 Fock 的 m = 0 恒等式后，本卡即可整体升为 formalized。

  ⚠ **必须读准的更正（lead 2026-09-11）**：缺的陈述是 **[L_0, A^ε_n] = 0**，
  **不是** [L_0, A^ε_n] = −n A^ε_n。A^ε_n 是**权 1 流的零模**，
  [L_m, j_r] = ((h−1)m − r) j_{m+r} 在 h = 1、r = 0 时为零。
  本卡【推论】里「A^i_n 把能级移动 −n」那句话说的是**另一件事**：
  L_0 本征值的移位来自顶点算子的**动量移位** p ↦ p + n k_0 与质量壳记账
  α'(p + n k_0)² = α'p² + n（k_0² = 0、2α' k_0·p = 1），不是来自这个括号。
  ⚠ 上面 tomassini-2008 (2.38) 逐字写 [L_0, A^i_n] = −n A^i_n，那是**固定纤维**版本的
  **修改版** DDF 算子，与本图/Lean 的塔上版本不是同一个对象（见 source note 与
  literature/extractions/gsw-1987-v1.md §5）。**不要把两者混为一谈。**

  **本卡【推论】的 caveat（供 auditor 回译时逐条对照）**：推论断言的两半现状不同——
  · 「L_m(A^i_n ψ) = 0 ∀ m > 0」这一半，其所依赖的 [L_m, A^ε_n] = 0（m ≥ 1）**已形式化**
    （经弱节点 worldsheet.ddf-commute-with-nonzero-virasoro）；
  · 「L_0 一条连同质量壳记账」这一半**完全未形式化**：既缺 [L_0, A^ε_n] = 0，
    又缺塔上的物理子模定义（Lean `Fock.physSubmodule` 只在单个 Fock 空间上，
    DDFOperator.lean 文件头 "What is NOT here" 第 3 条）。
  因此「DDF 算子把物理态映为物理态」在本图中**仍是 physical-argument**，不得记为已机器验证。

  【2026-09-11（五）续：正模那一半已单独立卡并 formalized；附 formalizer 对 L_0 记账的更正】
  formal 侧 57fce31 新增 `formal/StringFormal/NoGhost/TowerPhysical.lean`，定义了塔上的
  正模子空间 `towerPositiveModeSubmodule = {Ψ | L_m Ψ = 0 ∀ m ≥ 1}` 并证明
  `ddfOp_mem_towerPositiveModeSubmodule`（A^ε_n 保持它）。
  本推论的**前一半**因此有了独立的 formalized 承载：
    **worldsheet.ddf-operators-preserve-positive-mode-conditions**（弱节点）。
  本卡的推论**整体不变、status 不变**（后一半仍缺）。

  ★ **一处必须纠正的记账（formalizer 2026-09-11，curator 转录）**：
  本图此前有滑向「塔的每一层要用**不同的**截距 a_j = a + j(k_0·p)」的读法。**那是错的。**
  · 塔上的 L_0（Lean `towerLop η a b 0`）在第 j 层**已经用该层自己的动量** p_j = p + j k_0，
    所以 (L_0 − a₀)Ψ = 0 是塔向量上一个**完全统一**的条件，a₀ 是**一个**常数；
  · 在 k_0² = 0 与 2α' k_0·p = 1 之下，第 j 层能级 N 处的 L_0 本征值是
      α' p_j² + N = α' k² + j + N，
    故物理条件是 **α' k² + j + N = a₀**——在 (j, N) 平面上是一条**反对角线 j + N = 常数**，
    **不是**逐层不同的截距；
  · A^ε_n 沿这条反对角线移动（层 +n、振子能级 −n），本征值不变
    （Lean `invTwo_zeroModeSq_towerMomentum_add_shift_cancel`，且与求和指标 j 无关）。
    **这正是 A^ε_n 是权 0 算子的算术理由，也说明层依赖不是障碍。**
  · 推论：L_0 条件把能级逐层钉死为 N = a₀ − α'k² − j，
    这就是本卡推论里「A^i_n 把能级移动 −n」那句话的准确内容。
  ⇒ **剩余障碍只有括号 [L_0, A^ε_n] = 0（formalizer 进行中），不是任何关于截距的额外约定。**
  这与上一段「⚠ 必须读准的更正」是同一件事的两面：缺的是括号，且那个括号等于零而非 −n A^ε_n。

  【2026-09-11（六）：∀m 已机器验证，本卡升为 formalized；升级路径 (i) 的禁令解除，curator】
  main 已合入 `formal/StringFormal/NoGhost/DDFOperatorAll.lean`，其中
    `lie_towerLop_ddfOp`：k_0² = 0、2α' k_0·p = 1、ε·k_0 = 0 ⟹ ⁅L_m, A^ε_n⁆ = 0，
    **对每个 m ∈ Z（含 m = 0）、每个 n ∈ Z**。
  这正是本卡断言的量词，故本卡新增 `formal.lean_decl` 与推导
  worldsheet.ddf-commute-with-virasoro--via-lean（status: formalized），
  有效状态从 physical-argument 升为 **formalized**。
  两条旧推导（--via-conformal-weight、--via-vertex-algebra-primary）保留不删。

  ★ **上面【升级路径】(i) 里那句禁令现予解除**。该段逐字写着
    「**在基例完成前，图中不得把 [L_m, A^i_n] = 0 或「e^{i k_0·X} 权为 0」记为已机器验证。**」
  禁令的条件是「基例（L_m 作用在相干态系数 `Fock.creaExp` 上）未做」。
  **基例现已由三个文件补齐**：
    · `formal/StringFormal/NoGhost/VertexWeight.lean`（m ≥ 1，`Fock.Lop_apply_creaExp_of_pos_shifted`）；
    · `formal/StringFormal/NoGhost/VertexWeightNeg.lean`（m ≤ −1，`Fock.Lop_apply_creaExp_of_neg_shifted`）；
    · `formal/StringFormal/NoGhost/VertexWeightZero.lean`（m = 0，`Fock.Lop_apply_creaExp_zero_shifted`）。
  三者合成 `Fock.lie_Lop_vertexOsc`（一切 m），图中由
  worldsheet.exponential-vertex-operator-mode-weight-identity-v2 承载。
  ⇒ 禁令的前提消失，本卡与该 v2 卡可以、也应当记为已机器验证。
  ⚠ **禁令解除的只是这一条**：「e^{i k_0·X} 的**共形权**为 0」这句 **OPE 语言**的陈述
  （worldsheet.exponential-vertex-operator-weight）**仍未**机器验证——
  Lean 证的是模恒等式，两者之间隔着 worldsheet.ope-pole-mode-commutator-dictionary（effective = open）。
  【升级路径】(ii) 的文献侧（GT 1972 / GSW 式号）同样一字未变，仍未拿到。

  【2026-09-11（六）续：本卡陈述里「A^i_n 把能级移动 −n」这句话在塔的语言下会误导】
  本卡【推论】末句逐字写「即 A^i_n 把能级移动 −n」。陈述文本不可变，故此处只作阅读说明：
  · 在**塔**的语言下，A^ε_n 把第 j 层送到第 j + n 层，同时把该层的**振子能级** N 降 n；
  · 两个移位在 L_0 本征值 α' p_j² + N = α' k² + j + N 中**逐字相消**
    （Lean `invTwo_zeroModeSq_towerMomentum_add_shift_cancel`），
    故 **L_0 本征值不变**，截距 a₀ 也不变。
  · 所以「移动 −n」说的是**振子能级**这一个分量，**不是** L_0 本征值，
    更不是 ⁅L_0, A^ε_n⁆ 的值（那个是 0）。
  · 与之相容的正确读法：物理条件 α' k² + j + N = a₀ 在 (j, N) 平面上是一条
    **反对角线 j + N = 常数**，A^ε_n 沿这条线移动。
  ⇒ 回译审计时请把该句读成「A^i_n 把**振子能级**移动 −n（层数同时 +n，L_0 本征值不变）」。
  这与上面【★ 一处必须纠正的记账】段是同一件事，此处只是把它绑到那句具体文字上。

  【2026-09-11（六）附：另一处需要按新证据更正的旧措辞】
  本卡上文（以及 worldsheet.ddf-commute-with-nonzero-virasoro）多处写
  「Sugawara 正规序求和在 m = 0 时 j = 0 与 j = m 两项重合……**把 m ≠ 0 的系数代进去会得到错答案**」。
  前半句对，**后半句是误传**。`VertexWeightZero.lean` 文件头逐字：
  「通式系数是 `J - m + a·b + ½ (m+1) (b·b)`，`m = 0` 给 `J + a·b + ½ (b·b)`，
    而直接计算给出的也正是这个。之前记录的「代 `m = 0` 给错答案」指的是**真空引理**，
    **不是**最终的对易子系数。」
  即：m = 0 需要单独证的是**真空引理**，最终公式从来就是一条统一的多项式。
  详见 worldsheet.exponential-vertex-operator-mode-weight-identity-v2 的 notes。
