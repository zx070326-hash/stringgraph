notes: |
  【拆卡来源，2026-09-11】本节点是 worldsheet.ddf-operators-v4 的拆分产物之一。
  v4 是一张 `status: rigorous` 的**定义**卡，却在末段一并断言了本命题与
  worldsheet.ddf-transverse-oscillator-algebra，于是这两条命题以「定义的一部分」的身份
  继承了 rigorous，而它们在本图中从未被独立论证过。拆卡后本节点按其**实际论证**
  （OPE + 围道形变，见推导 --via-conformal-weight）标 physical-argument。
  docs/ROADMAP.md 待拆清单的 `ddf-operators-v4` 项，lead 已同意。

  【为什么不是 rigorous】docs/STATUS_LEVELS.md 的 rigorous 例外条款要求
  「前提完整 + 有限步初等计算 + reviewer 已独立复核并记录」。本命题的标准论证不是有限步初等计算：
  它走的是「∂X^i e^{i n k_0·X} 是权 1 primary ⟹ 围道积分与 L_m 对易」，用到
  形式 OPE 与围道形变（T(z) 与被积量的 OPE 只有一阶与二阶极点，且二阶极点系数正比于 k_0² = 0 与 ε·k_0 = 0）。
  本项目尚未把「围道形变 ⟹ 模态对易」这一步作为可引用的严格节点建起来
  （最接近的是 worldsheet.ope-pole-mode-commutator-dictionary，但那是形式分布版的模态字典，
  且它自身不是 formalized 的围道论证）。另外两条一手来源（GSW、GT 1972）的定位都未核实到式号。
  故 physical-argument。
  ⚠ **本段只描述 --via-conformal-weight 那一条推导**；2026-09-11（四）新增的
  --via-vertex-algebra-primary 自身论证是 rigorous（见下方新块），但被一条 open 的桥接边压住，
  故本节点的**有效状态仍是 physical-argument**，best_derivation 仍是 --via-conformal-weight。

  【升级路径】
  (i) 走 Lean：形式化中间恒等式
      L_m^{(a+b)} V_J − V_J L_m^{(a)} = (J + b·a − m + (m+1)·½ b·b) V_{J−m}
      （两侧 L_m 动量参数不同，这是塔上算子的必然写法），共形权 h = ½ b·b = α' k_0²，
      故 k_0² = 0 ⇒ h = 0。**归纳步已有**（`Fock.vertexOsc_unique` /
      `Fock.eq_zero_of_vertex_recursion` 把该恒等式归约为真空上的单条等式，
      配合 `Fock.mode_vertexOsc_sub` 与 `Fock.lie_Lop_mode`），**基例（L_m 作用在
      相干态系数 `Fock.creaExp` 上）未做**（VertexOperator.lean 文件头 "Mathematical gaps" 第 1 条、
      DDF.lean 文件头 "What is NOT here" 第 2 条）。formalizer 正在做
      `formal/StringFormal/NoGhost/VertexWeight.lean`（截至 9691057 未合并）。
      **在基例完成前，图中不得把 [L_m, A^i_n] = 0 或「e^{i k_0·X} 权为 0」记为已机器验证。**
  (ii) 走文献：拿到 GT 1972 正文或 GSW 的式号，或找到数学文献（顶点代数教材）里
      「权 1 primary 的模态与 Virasoro 对易」的带编号严格陈述。注意 kac-raina-1987 的
      讲号/命题号在本项目中**未核实且两版不可互换**（见 literature/sources.bib），不得猜编号。
      **【2026-09-11（四）更新：(ii) 的后半句已经做到】** gebert-nicolai-1995 (2.57) 正是
      「权 Δ primary 的模态与 L_n 的对易」的带编号严格陈述，(3.5) 是它在 Δ = 1、零模处的特例。
      见下方新块与推导 --via-vertex-algebra-primary。GT 1972 / GSW 式号仍未拿到（维持原判）。

  【2026-09-11（四）文献更新：两条来源升级 + 一条新推导，curator】
  researcher 的 DDF 来源核实（literature/extractions/gsw-1987-v1.md，§2、§4、§9）改变了本节点的
  来源图景，但**没有改变本节点的有效状态**。三点：
  (1) **goddard-2008 不再是「预设而不给编号」的模糊二手证据**：本命题在该文是带编号的显示公式
