id: worldsheet.ddf-commute-with-virasoro
kind: proposition
title: DDF 算子与全部 Virasoro 生成元对易：[L_m, A^i_n] = 0（∀ m, n）
statement: |
  设 A^i_n 是 worldsheet.ddf-operators-v5 定义的 DDF 算子（i = 2..D-1，n ∈ Z \ {0}；
  类光参考方向 k_0² = 0，横向偏振 ε·k_0 = 0，标度按 2α' k_0·p = 1 逐塔取定，
  故只在扇区 {p : k_0·p ≠ 0} 上有定义），L_m 是 worldsheet.virasoro-generators-free-boson
  的自由玻色子 Virasoro 生成元（Sugawara 型，c = D）。则在该扇区的动量塔
  ⊕_{N ∈ Z} F(p + N k_0) 上

    [L_m, A^i_n] = 0    对所有 m ∈ Z 与所有 n ∈ Z \ {0}。

  这里 L_m 指作用在塔上、逐层用该层动量的算子（第 N 层动量 p + N k_0），
  A^i_n 把第 N 层送到第 N + n 层；对易子按这一族算子理解。

  推论（本陈述的直接内容，不另立节点）：若 |ψ⟩ 是旧协变物理态
  （worldsheet.old-covariant-physical-states：(L_0 − a)|ψ⟩ = 0 且 L_m|ψ⟩ = 0 ∀ m > 0），
  则 A^i_n|ψ⟩ 满足 L_m (A^i_n |ψ⟩) = 0 ∀ m > 0；L_0 一条需连同质量壳记账
  α'(p + n k_0)² = α' p² + n（由 k_0² = 0 与 2α' k_0·p = 1）一起读，
  即 A^i_n 把能级移动 −n。因此 DDF 算子把物理态映为物理态。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge, conv.virasoro-standard, conv.intercept-sign-a]
formal:
  lean_decl: StringFormal.NoGhost.lie_towerLop_ddfOp
  lean_file: StringFormal/NoGhost/DDFOperatorAll.lean
sources:
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      与 worldsheet.ddf-operators-v5 同一处来源；本节点承载的是 v4 陈述文本里
      「DDF 算子与所有 Virasoro 生成元对易，[L_m, A^i_n] = 0（因 k_0² = 0、ε·k_0 = 0
      使被积量是权 1 primary）」这一句。**式号仍未核实（L0）**；GSW 用 mostly-minus，
      已按 conv.metric-mostly-plus 转写；GSW 取 α' = 1/2。
  - ref: goddard-thorn-1972
    loc: "eq. (3)–(6)（式号未核实；正文未获取）"
    note: |
      DDF 算子与谱生成代数的原始出处链条中的一篇。式号沿用旧节点 worldsheet.ddf-operators，
      未与原文核对（literature/extractions/brst-cohomology-sources.md §3.1：GT 1972 正文四条获取路径全部失败）。

      **【2026-09-11（四）归属削弱，curator；本条 source 保留不删】** 按 goddard-2008 的参考文献表
      （L1 逐字，extractions/gsw-1987-v1.md E3/E7）：**Goddard 本人把 DDF 对易关系归给
      [43]/[44]（Brower–Goddard 1973/1972），把本文（其 [45]）对应的贡献写成无鬼定理本身**
      （该综述 §6, p.15, eq. (6.4)）；且 GT 证明真正使用的代数是 (6.3) 的 [L_m, K_n] = −n K_{m+n}，
      **不是** A^i_n 与 L_m 的对易关系。故本条 source 的正当性**弱于**下面的 goddard-2008
      与 gebert-nicolai-1995：它在历史链条上成立，但「本文论证了本命题」这一点缺证据、且有反证。
  - ref: goddard-2008
    loc: "§5 'Spectrum Generating Algebra', p. 11, eq. (5.4)（arXiv:0802.3249v1）；A^i_n 的定义与适用条件 k·p = 1 见同页 (5.1)–(5.3) 及其后正文"
    note: |
      **【2026-09-11（四）重写，curator；旧措辞「不给编号」在本命题上是错的】**
      本命题在该文中是**带编号的显示公式** (5.4)，逐字 `[L_m, A^i_n] = 0.`，
      引出句逐字「The DDF operators, A^i_n, are well-defined on states of momentum p, such that k · p = 1
      and they can be used to generate physical states because **they commute with the Virasoro algebra**,」。
      **量词对 m 无限制**，与本节点的「对所有 m ∈ Z」一致（researcher 2026-09-11 L1 逐页读图，
      extractions/gsw-1987-v1.md §2 E2）。
      「不给编号」这一旧结论**只对无鬼定理本身成立**（该文 §6, p.15, (6.4) 确无编号），对本对易关系不成立。
      **仍然成立的限制**：该文是历史综述，(5.4) **无证明、无「we prove」**，故本条只升可追溯性，
      不承载论证（承载论证的是 gebert-nicolai-1995）。
      **号差**：§1, p.1, (1.1) 后逐字「signature (−,+,+,+)」= mostly-plus，与 conv.metric-mostly-plus 一致，
      **无需换算**（这一点优于 GSW）；归一化逐字 k·p = 1，在 α' = 1/2 下即本节点的 2α' k_0·p = 1。
  - ref: gebert-nicolai-1995
    loc: "§3.1 'DDF vertex operators', p. 594, eq. (3.5)；其依据是 §2.1, p. 582, eq. (2.57)（链条 (2.36) Jacobi 公理 ⇒ (2.38)/(2.41) ⇒ (2.56)/(2.57)）；DDF 算子作为零模的定义见 p. 593, eq. (3.2)–(3.3)"
    note: |
      **【2026-09-11（四）新增，curator】本命题在数学物理文献中的证明所在处**（CMP 172 (1995) 571–622；
      researcher L1 逐页读期刊排版 PDF，extractions/gsw-1987-v1.md §4 E14–E16）。
      (3.5) 逐字 `[L_(n), A^ξ_m] = 0   ∀ n, m ∈ ℤ`，引出句逐字
      「Moreover, **it is clear from (2.57)** that these operators commute with the Virasoro algebra」；
      (2.57) 逐字 `[L_(n), ψ_m] = {(Δ − 1)(n + 1) − m} ψ_{m+n}  ∀ m, n ∈ ℤ`，
      取 Δ = 1、模指标 m = 0 即得——而 DDF 算子按 (3.2) 恰恰**定义为零模**。
      **该链条全在顶点代数公理内、全程形式级数，不用围道形变、不用收敛性**，
      故它绕开了 --via-conformal-weight 的上限 worldsheet.ope-commutator-dictionary。
      推导见 worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary。
      **量词与本节点一致（∀ m，不设 L_0 例外）**，因为 G–N 的顶点代数 ℱ 天然含整条动量塔；
      ⚠ **不要**据此引 tomassini-2008 (2.38)（那是固定纤维版，逐字为 m ≠ 0 加 [L_0, A^i_n] = −n A^i_n，
      对应一种**修改版** DDF 算子），原因见 extractions/gsw-1987-v1.md §5。
      **适用限制**：G–N 的前提是格点顶点代数（偶格、洛伦兹号差、双乘性上闭链），
      本图尚无「D 个自由玻色子构成顶点代数、动量塔为其模」的卡，故该推导的有效状态仍被压在 open。
