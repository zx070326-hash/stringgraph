id: worldsheet.ddf-operators-v2
kind: definition
status: rigorous
title: DDF 算子（横向指标取 i = 2..D-1）
statement: |
  横向指标约定与 worldsheet.light-cone-quantization 一致：i = 2..D-1（共 D-2 个横向方向），
  0、1 方向组成光锥对 ±。

  在 D 维自由玻色开弦 Fock 空间上，取类光参考动量 k_0（k_0^2 = 0）与横向偏振
  ε^i（i = 2..D-1，ε·k_0 = 0），DDF 算子
    A^i_n := ∮ dz/(2πi) ∂X^i(z) e^{i n k_0·X(z)}，  i = 2..D-1，n ∈ Z\{0}，
  其中 k_0 归一化使 k_0·p = 1（p 是态的动量，故要求 k_0·p ≠ 0）。
  它们与所有 L_m 对易，且满足 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}，
  即一个 D-2 维横向振子代数。
uses: [worldsheet.virasoro-algebra, worldsheet.old-covariant-physical-states]
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: gsw-1987-v1
    loc: "§2.3.3 'The no-ghost theorem and the spectrum-generating algebra', p.102–112（DDF 首现 p.103；式号未核实）"
    note: |
      2026-09-10 来源核实前本条写 "§2.3.2，约 eq. (2.3.4x)"，两处都不成立，已订正
      （见 literature/extractions/brst-cohomology-sources.md §5.2–5.3）：
      §2.3.2 的标题是 'Construction of transverse physical states'，只占 p.100–101；
      DDF 与 spectrum-generating algebra 按目录属 §2.3.3（p.102–112），
      Google Books 全文检索 'DDF' 在正文首次命中 p.103。
      章节页码来自 CUP 25 周年版 frontmatter（经检索后端读取，L4，未逐字核对）+ Google Books
      页码定位（做过两个对照实验验证命中真实性）。**式号仍未核实（L0）**：
      Google Books 只回页码不回 snippet，且返回的不一定是首次出现页，只能当区间约束用。
      GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写。
  - ref: goddard-thorn-1972
    loc: "eq. (3)–(6)（式号未核实）"
    note: 式号沿用旧节点 worldsheet.ddf-operators，未与原文核对；GT 1972 未在 literature/extractions/ 登记。
  - ref: polchinski-1998-v1
    loc: "§4.1（DDF 构造需要 k_0·p ≠ 0 的注记；页码/式号未核实）"
    note: |
      ms.no-ghost-theorem 审计 B6 指出 Polchinski §4.1 有此注；抽取记录
      literature/extractions/polchinski-1998-v1.md 未覆盖该注，定位未核实。
tags: [bosonic-string, spectrum-generating-algebra]
superseded_by: worldsheet.ddf-operators-v3
notes: |
  【已被取代】本节点的归一化写作 k_0·p = 1，只在 α' = 1/2 时正确：在 conv.alpha-prime-regge
  保留一般 α'（α^μ_0 = (2α')^{1/2} p^μ）下，e^{i n k_0·X(z)} 作用在动量 p 的态上的单值性要求
  2α' n k_0·p ∈ Z，正确条件是 2α' k_0·p = 1（见 graph/milestones/no-ghost-theorem.yaml
  第二轮审计 C2；本节点 notes 下方本已承认"未改动量纲/α' 因子"）。此外审计 C1 指出，
  "固定 k_0"应写成"固定 k_0 的方向"——类光重标度不改变条件 k_0·p ≠ 0，标度沿一条 DDF 塔不变、
  跨塔才需重取。修正版本见 worldsheet.ddf-operators-v3。
  按项目规则陈述文本不可变，本节点保留作历史；引用它的旧推导
  worldsheet.no-ghost-theorem-v2--via-goddard-thorn 一并保留不动。

  取代 worldsheet.ddf-operators。旧节点把横向指标写作 i = 1..D-2，与已合并的
  worldsheet.light-cone-quantization（i = 2..D-1）记号不一致；本节点统一为 i = 2..D-1。
  除指标范围、参考动量的记号（旧节点写 k，本节点写 k_0，以便与态动量 p 区分）
  与 sources 的精确化外，内容与旧节点相同：归一化条件仍写作 k_0·p = 1，未改动量纲/α' 因子。

  参考动量条件 k_0·p ≠ 0 在旧节点里只隐含在"归一化使 k·p = 1"里，本节点显式写出
  （ms.no-ghost-theorem 审计 B6）：k_0·p = 0 的扇区（特别是 p = 0）DDF 构造退化，需单独处理。
author: curator
