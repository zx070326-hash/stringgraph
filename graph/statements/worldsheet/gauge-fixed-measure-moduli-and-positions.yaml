tags: [worldsheet, moduli, ckv, faddeev-popov, gauge-fixing, measure]
notes: |
  本节点是 §3.3 的平面 FP 手续（worldsheet.faddeev-popov-ghost-action）向一般亏格的推广的
  **计数部分**；行列式部分见 worldsheet.genus-g-faddeev-popov-determinant，
  鬼场表示见 worldsheet.genus-g-ghost-path-integral。
  κ 个坐标能被固定的前提是 CKV 群在顶点算子位置上作用得足够自由（例如球面上用 PSL(2,C)
  固定三个点）——**这个前提在本节点与来源中都没有被论证**，是 §6 才处理的事。
