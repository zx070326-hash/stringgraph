id: worldsheet.gauge-fixed-measure-moduli-and-positions
kind: proposition
title: "一般亏格上规范固定后的剩余积分变量：μ 个模与 2n − κ 个顶点算子坐标"
statement: |
  设世界面 M 是紧二维曲面，路径积分的出发点是 [dg dφ] d^{2n}σ，其中
  d^{2n}σ = ∏_{i=1}^n d²σ_i 是 n 个顶点算子的位置、φ 记全部物质场。
  对 diff × Weyl 作 Faddeev–Popov 规范固定后，测度分解为
    [dξ dφ]  d^μ t  d^{2n−κ}σ ,
  其中
  (a) ξ 是规范参数（其积分给出规范群体积，被除掉）；
  (b) t^k (k = 1,…,μ) 是**模**——FP 手续固定不了的那 μ 个连续参数
      （worldsheet.moduli-condition-traceless-transverse）；
  (c) κ 个顶点算子坐标被 κ 个共形 Killing 向量固定（记这组被固定的坐标指标集为 f），
      剩下 2n − κ 个坐标仍要积分。

  换言之：**模就是 Faddeev–Popov 手续固定不掉的剩余参数**，而 CKV 就是规范固定后
  仍然残余、可以用来固定顶点算子位置的连续对称性。
uses_conventions:
  - conv.worldsheet-euclidean
