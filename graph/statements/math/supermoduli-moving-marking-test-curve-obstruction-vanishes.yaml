id: math.supermoduli-moving-marking-test-curve-obstruction-vanishes
kind: proposition
title: "带穿孔超模叠的「运动标记」测试族障碍值恒为零（负面结果，Serre 消没）：把旁观穿孔装在运动分量上使测试基变仿射，H^1=0"
statement: |
  【对象与前提】设 h≥2，n≥1。考虑用 Donagi–Witten 一点障碍族 X_η（η∈H^1(C,L^{-1})，C 为亏格 h
  光滑曲线配无效偶 theta 特征 L）测试**带穿孔**超模叠的投影性，但把 n 个旁观 NS 穿孔装在**运动的
  亏格 h 分量**上（即把 CN 的 M^+_{h,1} 换成 M^+_{h,n+1}，其中 n 个点 p_1,...,p_n **固定**、
  第 n+1 个点作为粘接点随测试族运动）。设测试族的约化基空间为
    C° := C ∖ {p_1,...,p_n}（n 个固定穿孔点在底上的像）。
  C° 是**仿射**曲线（从紧曲线 C 上移除 n≥1 个点）。

  【命题】设 F^obs := Hom(Λ²T_-X_η, T_+X_η) 为主障碍类的取值层（Donagi–Witten 一点障碍族的
  Green 障碍类 ω₂(X_η) 取值于 H^1(C°, F^obs) ⊗ Λ² H^1(C,L^{-1})），其中 T_± 是 DW 构造给出的
  向量丛（局部自由，从而 F^obs 是凝聚层）。则由 Serre 消没定理：
    H^1(C°, F^obs) = 0（仿射曲线上凝聚层的 H^1 恒为零）。
  因此障碍类的映射 J: H^1(C,L^{-1}) → H^1(C°, F^obs) **恒等于零**：对**一切** η，
  ω₂(X_η) = J(η) = 0。**该测试路线给不出任何信息。**

  【本节点明确不断言，必须写在陈述本身】
  - **不断言** \overline{\mathfrak S}_{g;n,2r}（或任何带穿孔超模叠）**是投影的**。
  - **不断言**"可用的 η 只有 0"或"参数空间 H^1(C,L^{-1}(-Σp_i)) 为零"——恰恰相反，带穿孔时
    奇切空间 H^1(C,L^{-1}(-Σp_i)) 的维数为 2h-2+n，**比无穿孔情形（2h-2）更大**。
    是**取值空间** H^1(C°, F^obs) 为零，不是参数空间为零。
  - 只断言：这一特定构造（把穿孔装在运动分量上）的测试族**检测不到任何障碍**，这是**方法的
    局限**，不是几何的结论。

  【与姐妹卡的互补关系】本节点解释了为什么
  `math.supermoduli-compactified-punctured-genus-geq3-not-projected` 与
  `math.supermoduli-compactified-punctured-genus-2-not-projected` 必须把所有旁观穿孔装在
  **常值尾巴**上而非运动分量上——本节点证明后者路线结构上不可行（测试值恒为零）。这把"CN
  碰巧用常值尾"变成**结构性的必然**。
