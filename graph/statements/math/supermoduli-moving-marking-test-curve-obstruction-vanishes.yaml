tags: [supermoduli, obstruction-theory, negative-result, serre-vanishing, affine-curve, method-limitation, original-research]
notes: |
  【查重】`uv run stringgraph search "Serre vanishing"` / `"affine curve"` / `"moving marking"` /
  `"obstruction vanishes"`（2026-09-20）均无同内容命中——本节点是首次记录这一**负面**结果。

  【为何单独立卡而不只在姐妹卡的 notes 里提及】(1) 这是与正面结论（定理 M）同等重要的第二个
  交付物（claim.md §5 明确声明"与正面结论同等重要，不得写软"），有独立的证明结构（四步论证 +
  订正记录），值得独立引用；(2) 负面结果本身是可证伪的命题（"这一构造的障碍值恒为零"），
  有明确的 true/false 语义，不是纯粹方法论讨论；(3) 它精确刻画了"为什么必须用常值尾"这一
  设计约束的几何根源，是对图内既有结果（CN、姐妹卡）设计选择的**事后解释**，这种解释性命题
  本身有文档价值；(4) 遵循 claim.md §5 的任务要求："若椭圆尾在穿孔情形有本质障碍，必须精确
  写下来。"——本节点正是那条"本质障碍"的精确陈述。

  【2026-09-18 订正记录的重要性】proof.md §3 命题 N 证明末尾有一段显式的"⚠ **订正记录**"
  （2026-09-18 对抗审查），记录初稿错误地声称"参数空间 H^1(C,L^{-1}(-Σp_i)) 为零"（这在带穿孔
  时是**错的**，该空间维数为 2h-2+n>2h-2），订正为正确的"**取值空间** H^1(C°,F^obs) 为零"。
  这一订正使论证**更强**：η 比 CN 还多（参数空间更大），却依然一个都测不到（取值空间为零）。
  本卡 statement 明确写入"不断言参数空间为零"就是为了防止此错误再次出现。

  【Serre 消没定理的适用性】status.yaml 第二轮裁决（2026-09-20）问题 4 明确验证：F^obs =
  Hom(Λ²T_-X_η, T_+X_η) 确为**局部自由层**（T_± 是 DW 一点障碍族给出的向量丛，外幂与 Hom
  对局部自由封闭），从而 F^obs 凝聚，故 Serre 消没 H^i(C°, F^obs)=0 (i≥1) 适用。

  【与 FKP 非分离粘接 (7.9) 的关系】推论 N′（proof.md §3）：同一个仿射性障碍也杀死 FKP 的
  **非分离**粘接态射 (7.9)（两个被粘 NS 穿孔在**同一条**曲线上）作为本方法的载体——若其中一个
  是运动点、另一个是固定点，测试基仍是 C∖{q}，仍为仿射。这解释了为什么姐妹卡只用**分离**
  粘接 (7.8)（两个穿孔在不同的曲线因子上）。
