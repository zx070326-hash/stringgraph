      （现在直接从原书导入 (10.7.6)；本卡提供的是与之等价的 ϑ 路线的一半）；
    · math.jacobi-theta-functions 的 notes 第 (iv) 条相容性核对（**只是核对，不是依赖**）。
  ⚠ 本轮**没有**把上述推导改接到本卡上：改接需要同时有 (7.2.38a–d)（ϑ₀₁/ϑ₁₀ 的乘积表示），
  而那正是本卡「不断言 (a)」排除掉的部分。**待 researcher 取得 p.215 页图后一并处理。**
