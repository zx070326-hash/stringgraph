    loc: "formal/TODO.md，noghost-pr7 条目（2026-09-12 标记 [x] 已完成）"
    note: "任务追踪记录，佐证本卡对应工作已在仓库主线合入（非孤立分支）。"
tags: [combinatorics, number-theory, binomial-coefficients, partitions, formalized, math-input]
notes: |
  【为什么立卡】formal/StringFormal/NoGhost/LevelThreeCount.lean 的
  `levelThree_count_identity` 与 math.level-two-partition-difference 的
  `levelTwo_count_identity` 同一模式，是"计数一步永远看不见 26"（第一次由 level-2
  版本证实）的**第二条独立证据**：level-3 处该恒等式对一切 D 成立，D=26 只是代入的
  一个特殊值（3575 = 3200 + 350 + 25），恒等式本身不依赖 D 的取值。

  【查重】2026-09-12 跑 `uv run stringgraph search "level-three-partition"`、
  `search "level three partition"`、`search levelThree_count_identity` 均无命中；
  `search "partition difference"` 命中 math.level-two-partition-difference（姊妹卡，
  不重复，见下）。

  【与 math.level-two-partition-difference 的关系，不合并】两卡是同一恒等式链
  （p_{D−1}(N) 的 Pascal 展开）在 N=2、N=3 的两个独立实例，按【一个节点一个命题】
  原则不合并——各自的具体系数（C(D,2) vs (D−1)²+C(D+1,3)）不同，各自被
  worldsheet 侧不同的 N 片（level-two/level-three DDF-spans 卡）独立消费。
  本卡陈述里引用 math.level-two-partition-difference 的 p_{D−1}(2) 记法（差恒等式
  右端的一项），这是记法引用，不建 `uses`/`depends_on` 边——按 graph/CLAUDE.md 与
  math.level-two-partition-difference 既有先例，纯数学卡之间如需要建正式依赖边，
  留给配套推导判断；本卡证明本身（见 sources 的 Lean 逐字核对）是一步 Pascal 恒等式，
  不实际调用 `levelTwo_count_identity` 作为前提（`levelThree_count_identity` 的证明
  独立完整，只是数值上恰好把 p_{D−1}(2) 的展开式包含在右端），故不建边，配套推导
  `depends_on: []`（与 math.level-two-partition-difference--via-lean 同一先例）。

  【本卡不 depends_on 或 uses 任何 worldsheet 节点】同 math.level-two-partition-difference
  明确不断言 (a) 的边界，见【本节点明确不断言】(a)。
