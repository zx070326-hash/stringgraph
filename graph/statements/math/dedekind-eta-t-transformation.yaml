id: math.dedekind-eta-t-transformation
kind: proposition
title: "Dedekind η 的 T 变换：η(τ + 1) = e^{iπ/12} η(τ)"
statement: |
  设 η 如 math.dedekind-eta-function 所定义：τ ∈ H，q ≡ exp(2πiτ)，
  **q^{1/24} ≡ exp(πiτ/12)**（分支由 τ 单值取定，这一约定写在定义卡里，不可省），
  η(τ) = q^{1/24} ∏_{n=1}^{∞} (1 − q^n) 。则对一切 τ ∈ H
    η(τ + 1) = exp(iπ/12) · η(τ) 。

  **推论**：|η(τ + 1)| = |η(τ)|，且 Im(τ+1) = Im τ，故 τ₂ |η(τ)|⁴ 在 T : τ ↦ τ + 1 下不变。

  **本卡不断言什么**：不断言 S 变换 η(−1/τ) = (−iτ)^{1/2}η(τ)（那是
  math.dedekind-eta-s-transformation，强度低两级）；不断言 τ₂|η|⁴ 的**完整**模不变性
  （那还需要 S 那一半）；不断言 η 作为权 1/2 模形式的一般乘子系统（含 Dedekind 和）。
uses_conventions: []
