notes: |
  由 curator 于 2026-09-11（批次 theta-cards）建立。

  ★★★【本卡为什么存在】本图此前**没有 θ 函数卡**，而至少五处写着这条缺口，逐字：
    · math.dedekind-eta-function 的「本卡不断言什么」：「(Polchinski (7.2.43) 的第二个等号 …
      **本图未建 θ 函数卡**，见 notes)」；
    · math.dedekind-eta-function 的 notes「未建的相邻卡」：「θ 函数一族（(7.2.31)–(7.2.42)）
      本批次不建 …」；
    · spectrum.long-cylinder-lightest-state-count--via-q-expansion 的 gaps 第一条：
      「等价路线（由 ϑ 的**三重乘积公式**展开）同样无节点 … ⇒ 待建：
      · math.jacobi-theta-triple-product（ϑ₀₀/ϑ₀₁/ϑ₁₀ 的乘积公式）…」；
    · worldsheet.superstring-total-fermionic-partition-function-vanishes--via-spacetime-supersymmetry-jacobi
      的 gaps 第一条与 notes「升级路径」：「注意本图目前**连 θ 函数卡都没有**」；
    · polchinski-1998-v1-ch7.md §5-C 把 (7.2.41)、(7.2.32) 列为 Lean 岛次选。
  **本卡与 math.jacobi-triple-product、math.jacobi-abstruse-identity 三张一起把这条缺口合上。**

  ★★【断言 (2) 的四重相容性核对（这是本卡敢于写下该式的全部理由，请连同上面的 ⚠ 一起读）】
  记 F_{ab}(v,τ) ≡ Σ_{n∈Z} exp[πi(n + a/2)²τ + 2πi(n + a/2)(v + b/2)]（= 断言 (2) 的右端）。
    **(i) 与 (7.2.31) 相容**：a = b = 0 时 F₀₀(v,τ) = Σ_n exp(πin²τ + 2πinv) = ϑ(v,τ) ✓（逐字式）。
    **(ii) 与 (7.2.37d) 的负号相容**：经典 ϑ₁(v,τ) 的级数是
      ϑ₁ = −i Σ_n (−1)^n exp[πi(n+½)²τ + 2πi(n+½)v]，而
      F₁₁(v,τ) = Σ_n exp[πi(n+½)²τ + 2πi(n+½)(v+½)]；注意
      exp[2πi(n+½)·½] = exp[πi(n+½)] = i(−1)^n，故
      F₁₁ = i Σ_n (−1)^n exp[πi(n+½)²τ + 2πi(n+½)v] = −ϑ₁。
      **这正是 (7.2.37d) 逐字印出的 ϑ₁₁ = −ϑ₁**。⇒ 若把特征标写成别的约定（例如把 b/2 的相位
      放成 exp[−πi(n+a/2)]，或把下标读成 a 而不是 a/2），这个负号就对不上。
      **(7.2.37d) 的负号是本卡最强的一条外部约束。**
    **(iii) 与 (7.2.43) 相容**：由 (ii)，∂_v F₁₁(0,τ) = −∂_vϑ₁(0,τ) = −2πη(τ)³，
      故 [∂_vF₁₁(0,τ)/(−2π)]^{1/3} = η(τ) ✓，与 (7.2.43) 第二个等号逐字一致。
    **(iv) 与 Vol.2 (10.7.6)+(10.7.7c) 相容**：把 F_{ab}(0,τ) 用三重乘积展开（即
      math.jacobi-triple-product 的四个特例）得
        F_{ab}(0,τ) = q^{a²/8} ∏_{m≥1}(1−q^m)[1 + e^{πib} q^{m−½+a/2}][1 + e^{−πib} q^{m−½−a/2}] ；
      除以 η(τ) = q^{1/24}∏(1−q^m) 得
        q^{(3a²−1)/24} ∏_{m≥1}[1+e^{πib}q^{m−(1−a)/2}][1+e^{−πib}q^{m−(1+a)/2}] ，
      在 b = 0 时**逐字等于 (10.7.6)** Tr_α(q^H)（取 α = a），
      即 (10.7.7c) Z^α_β = ϑ[α/2,β/2](0,τ)/η(τ) ✓。
  ⚠ (iv) 用到了 math.jacobi-triple-product（本批次同时建立，status = physical-argument），
  故 (iv) 只是**相容性核对**，不是本卡的论证，也不在本卡的 uses 里（定义卡不吃命题卡）。
  ⚠ (ii)(iii) 用到 ϑ₁ 的经典级数与 ϑ₁'(0) = 2πη³，这两条是**本图外的标准事实**，
  同样只作核对，不作断言（本卡「不断言 (e)(h)」已把它们排除）。

  【为什么 status = rigorous】按 docs/STATUS_LEVELS.md 对 definition 的 rigorous 判据
  （「数学上精确但未形式化」）：断言 (2) 是一个绝对收敛级数，断言 (3) 是初等的控制收敛，
  全卡无路径积分、无形式操作。
  ⚠ **本卡的不确定性不在「严格程度」这个轴上，而在「与原书 (7.2.36) 是否逐字一致」这个轴上**，
  后者由上面的 ⚠、sources 第二条的 researcher 待办与四重核对承载，**不通过 status 表达**。
  （同样的分工见 docs/STATUS_LEVELS.md「断言 + 骨架」一节的理由：
   「论证不完整」与「结论可能为假」是两个不同的轴。）

  【记号词典（读原书时用；本卡不断言，见「不断言 (h)」）】原书 §7.2 同时用两套记号，
  (7.2.37a–d) 给出对照：**ϑ₀₀ = ϑ₃、ϑ₀₁ = ϑ₄、ϑ₁₀ = ϑ₂、ϑ₁₁ = −ϑ₁**（注意最后一条带负号）。
  Vol.2 §10.7 用的是第三套：**Z^α_β(τ) = ϑ[α/2, β/2](0,τ)/η(τ)**，
  其下标与本卡的关系是 **ϑ_{αβ} = ϑ[α/2 ; β/2]**（α, β ∈ {0,1}），
  故 Z⁰₀ ↔ ϑ₀₀、Z⁰₁ ↔ ϑ₀₁、Z¹₀ ↔ ϑ₁₀、Z¹₁ ↔ ϑ₁₁（**都要再除以 η**）。
  ⚠ 这一行对照本身是 (10.7.7c) 的内容，**不在本卡断言里**（「不断言 (f)」）。

  【本轮**未**建的相邻卡（逐条给出理由，供 lead 排期）】
    1. **(7.2.42) ϑ₁₁(0,τ) = 0**：它是断言 (2) 的两行推论（配对 n ↔ −1−n，相位
       exp[±πi(n+½)] = ±i(−1)^n 相消），可以做成一张 rigorous 的小卡。
       本轮不建的原因：它在本批次的唯一用途是给
       worldsheet.ramond-trace-with-fermion-number-vanishes 提供第二条路线，
       而那条路线还要 (10.7.7c)（本图在另一张卡上）；为避免一次加四张卡，
       该推论写在那条推导的 summary 里并在其 gaps 登记。
       **建议 lead 下轮补建 math.theta-11-vanishes-at-origin。**
    2. **(7.2.38a–d) 四个乘积表示**：抽取记录未印出式子，且本图暂无下游直接引用；
       建卡前应与 (7.2.36) 一起取页图。
    3. **(7.2.32)/(7.2.33)/(7.2.39)/(7.2.40) 的周期性与模变换**：原书**全部无证明**
       （#E15 逐字：「**全部无证明**」），建卡只会新增 physical-argument 节点；
       真正有价值的是先找数学来源（见下）。

  【形式化与数学来源情报（**均未核实，交 formalizer / researcher**）】
    · Mathlib 疑有二变量 Jacobi ϑ 的级数定义（Mathlib/Analysis/SpecialFunctions/JacobiTheta/）；
      **本轮未打开任何 Mathlib 文件核对**，不得据此标 formalized。若属实，本卡的 Lean 化路径
      与 math.dedekind-eta-function 同款：在 formal/ 下建桥层逐字重述，lean_decl **指桥层**，
      不得直指 Mathlib（formal/CLAUDE.md 桥层规则）。
    · 数学侧一手来源（本项目 **sources.bib 尚未登记**，故本卡不得引）：
      Whittaker–Watson "A Course of Modern Analysis" §21.3（ϑ 函数与三重乘积）、
      Mumford "Tata Lectures on Theta I"。**交 researcher 登记**；登记后
      math.jacobi-triple-product 可获得一条 rigorous 推导（见那张卡的 gaps）。
  ⚠ 这两条情报都**不是**本卡的 source，本卡的全部来源就是上面 sources 里的四条 Polchinski 条目。
