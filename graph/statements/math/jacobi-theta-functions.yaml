id: math.jacobi-theta-functions
kind: definition
status: rigorous
title: Jacobi ϑ 函数 ϑ_{ab}(v, τ)（a, b ∈ {0,1}）的级数定义（只含级数，不含乘积表示、周期性、模变换）
statement: |
  **设定（是定义的一部分）**：H = { τ ∈ C : Im τ > 0 } 为上半平面，v ∈ C。约定
    q ≡ exp(2πiτ) ,   z ≡ exp(2πiv)
  （Polchinski Vol.1 (7.2.35) 逐字），并对有理数 s 约定 **q^s ≡ exp(2πisτ)**
  ——即 q 的分数次幂按 τ 取定的**单值分支**，不是多值符号
  （与 math.dedekind-eta-function 对 q^{1/24} 的约定同款、同理由）。

  **(1) 基本 ϑ 函数（原书 (7.2.31) 逐字）**：
      ϑ(v, τ) = Σ_{n = −∞}^{∞} exp( πi n² τ + 2πi n v ) 。

  **(2) 带特征标的四个函数（本图据此定义 ϑ_{ab}）**：对 a, b ∈ {0, 1}，
      **ϑ_{ab}(v, τ) ≡ ϑ[a/2 ; b/2](v, τ) ≡ Σ_{n ∈ Z} exp[ πi (n + a/2)² τ + 2πi (n + a/2)(v + b/2) ]** 。
    取 a = b = 0 即化回 (1)：**ϑ₀₀(v, τ) = ϑ(v, τ)**。
    四个函数依次是 ϑ₀₀、ϑ₀₁、ϑ₁₀、ϑ₁₁。
    ⚠⚠ **这一式的出处必须一起读**：原书在 (7.2.36) 处引入记号 ϑ[a ; b](v, τ)，
    但本项目的抽取记录**只记下了式号与记号，没有把 (7.2.36) 的式子本身逐字印出**
    （literature/extractions/polchinski-1998-v1-ch7.md#E15）。
    ⇒ **本卡把上式作为本图对 ϑ_{ab} 的定义**，并在 sources / notes 里列出它与原书四处**逐字**
      内容（(7.2.31)、(7.2.37a–d) 的 ϑ₁₁ = −ϑ₁、(7.2.43) 的 η = [∂_vϑ₁₁(0,τ)/(−2π)]^{1/3}、
      Vol.2 (10.7.6)+(10.7.7c)）的四重相容性核对。若日后取得 (7.2.36) 页图并发现不符，
      **须新建卡并在本卡写 superseded_by**，不得就地改本卡正文。

  **(3) 收敛与全纯（本卡补全的初等事实；原书对此一字不提）**：
    |exp[πi(n + a/2)²τ]| = exp[−π (n + a/2)² Im τ]，故对任意 ε > 0 与任意有界的 v，
    级数 (2) 在 { Im τ ≥ ε } × { |v| ≤ R } 上被一个收敛的常数级数控制，
    从而绝对且局部一致收敛；⇒ **每个 ϑ_{ab} 在 C × H 上全纯**。
    这是初等标准事实，属**定义卡层面的补全**，不改变任何断言。

  **本定义不断言什么（逐条对应原书 §7.2 里被本卡排除的式子）**：
    (a) ⚠ **不断言任何乘积表示**：(7.2.34) 的三重乘积
        ϑ(v,τ) = ∏_{m≥1}(1−q^m)(1+z q^{m−1/2})(1+z^{−1} q^{m−1/2})
        是 **math.jacobi-triple-product**；(7.2.38a–d) 的四个乘积表示本图**未建卡**
        （抽取记录只记式号，未印出式子）。
    (b) **不断言周期性与模变换**：(7.2.32a,b)（v ↦ v+1、v ↦ v+τ）、(7.2.33a,b)（τ ↦ τ+1、
        τ ↦ −1/τ）、(7.2.39a–d)、(7.2.40a–d) 全部不在本卡；也**不断言**原书逐字那句
        'and these in fact determine it up to normalization'（该唯一性在原书**无证明**）。
    (c) **不断言零点性质**：原书逐字 'The theta function has a unique zero, up to the
        periodicity (7.2.32), at v = ½(1+τ)'（无证明）不在本卡；**(7.2.42) ϑ₁₁(0,τ) = 0
        也不在本卡**（它是 (2) 的两行推论，但本图本轮不为它建卡，见 notes）。
    (d) **不断言 Jacobi 的 'abstruse identity'**（(7.2.41) ϑ₀₀⁴ − ϑ₀₁⁴ − ϑ₁₀⁴ = 0）
        ——那是 **math.jacobi-abstruse-identity**。
    (e) **不断言 η 与 ϑ₁₁ 的关系**（(7.2.43) 第二个等号 η(τ) = [∂_vϑ₁₁(0,τ)/(−2π)]^{1/3}）。
    (f) **不断言 ϑ_{ab} 与世界面费米子迹的关系**（Vol.2 (10.7.7c)
        Z^α_β(τ) = ϑ[α/2, β/2](0,τ)/η(τ)）——那条识别在
        worldsheet.modular-invariance-requires-eight-transverse-fermions 的 statement 里。
    (g) **不断言一般特征标**：本卡只定义 a, b ∈ {0,1}（= 原书 ϑ_{ab} 下标的取值范围）。
        实数或复数特征标 ϑ[a;b] 的一般理论不在本卡。
    (h) **不断言 ϑ₁…ϑ₄ 这套记号**：原书 (7.2.37a–d) 给出 ϑ₀₀ = ϑ₃、ϑ₀₁ = ϑ₄、ϑ₁₀ = ϑ₂、
        **ϑ₁₁ = −ϑ₁** 的对照，但本卡**不定义** ϑ₁…ϑ₄，故也不把该对照写成断言；
        它只作为记号词典与相容性证据记在 notes。
