notes: |
  【为什么需要这张卡】worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 与
  worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket 的 gaps 第 1 条逐字写：
  「图中缺一张『D 个自由玻色子（洛伦兹不定号差、含类光方向）⊗ ℂ[Z k_0] 构成顶点代数、动量塔是其模』的卡」，
  并说补上这张卡「是把本条升到 rigorous 的唯一待办」。本卡是那张卡的**数学一般版**，
  物理实例版是 worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower。

  【Borcherds §5 的「n ≥ −1」限制在本卡的设定下不适用（本项目核对，未写进陈述）】
  Borcherds Section 5 逐字：「if R is a (possibly singular) lattice contained in a nonsingular lattice S,
  then the operators L_i for **i ≥ −1** on the vertex algebra of S restrict to operators on the vertex
  algebra of R … In particular if i ≥ −1 then the operator L_i can be defined on the vertex algebra V of R
  **even when R is singular**.」——这条限制是针对「V 只建在退化格 R 自身上」的情形。
  Li–Wang 的 V_(𝔥,L) 里 M(1) 建在**整个非退化 𝔥** 上（(3.9) 的第二个因子），共形向量若要取也在 M(1) 内，
  故 L 的退化并不限制模指标范围。**但本卡不据此断言任何关于 L_n 的事**（见「不断言」第 2 条）——
  这段核对没有来源，只登记在此供后续 researcher 追证。

  【与 worldsheet.string-cft-is-a-vertex-algebra-v2 的分工】那张卡讲的是**含 bc 鬼场**的世界面 CFT
  的**局域性**（且其场集合逐字排除 e^{ik·X}），且目前 effective = open。本卡不含鬼场、不含路径积分，
  是纯代数构造。两张卡互不依赖。

  【引用禁令（math-sources.md §38.2）】本卡**不得**改写成引用
  `FLM, Theorem 8.x`（零证据）、`Lepowsky–Li, Theorem 6.5.3`（无证据）、`Kac, Theorem 5.5`（5.4/5.5 是节号）、
  `Kac, (4.8.3)`（无证据）。Borcherds 只写节号，不写页码（重排本与 PNAS 印本页码不对应，Q33）。
