id: math.supermoduli-compactified-punctured-genus-geq3-not-projected
kind: proposition
title: "紧化带穿孔超模叠 g≥3 非投影（原创，椭圆尾粘接的带穿孔推广，定理 M 的 a=1 分支）：∀g≥3,∀n≥0,∀r≥0, ω₂(S̄_{g;n,2r})≠0"
statement: |
  【对象】记 \overline{\mathfrak S}_{g;n,2r} 为亏格 g、n 个 Neveu–Schwarz（NS）穿孔、2r 个 Ramond
  穿孔的稳定超曲线紧化超模叠（光滑固有 Deligne–Mumford 型超叠，FKP-A Theorem A）。ω₂ 为 Green 第一
  障碍类（记号同 `math.supermoduli-compactified-genus-geq3-not-projected`）。

  【命题】对一切整数 g≥3、一切 n≥0、一切 r≥0：
    ω₂(\overline{\mathfrak S}_{g;n,2r}) ≠ 0，
  从而 \overline{\mathfrak S}_{g;n,2r} **非投影**（特别地非分裂）。

  **宇称加细（仅当 r=0 时可断言分量级信息）**：当 r=0 时，两个宇称分量
  \overline{\mathfrak S}{}^{+}_{g;n,0} 与 \overline{\mathfrak S}{}^{-}_{g;n,0} **均**非投影：
  ω₂(\overline{\mathfrak S}{}^{ε}_{g;n,0}) ≠ 0，ε∈{+,−}。

  **当 r≥1 时，本节点只断言整个叠 \overline{\mathfrak S}_{g;n,2r} 非投影，不指认具体连通分量**
  （r>0 时该叠的连通分量分类本身是开放问题，见来源 `[GAP-COMP]`）。

  【证明思路一句话】取亏格 h=g−1≥2 的"运动分量" C（配无效偶 theta 特征 L）与亏格 a=1 的**常值**
  自旋椭圆尾（带 n+1 个 NS 标记点、2r 个 Ramond 标记点，其中 1 个 NS 点用于粘接），沿 FKP-A 式
  (7.8) 粘接映射的带穿孔推广构造测试族 X_η → \overline{\mathfrak S}_{g;n,2r}，用 Riemann–Roch
  存在性论证证明存在 η 使障碍值 J(η)≠0，再用障碍类沿态射的函子性把它搬运回 ω₂(\overline{\mathfrak
  S}_{g;n,2r})≠0。这是 Corrêa–Noja（`math.supermoduli-compactified-genus-geq3-not-projected`，
  n=r=0 情形）证明骨架在带穿孔粘接映射上的重新装配；h≥2 的技术门槛来自尾巴亏格 a=1 恒定，故
  g=h+1≥3。

  【本节点明确不断言】(g,n,r)=(2,·,·) 的任何情形（见姐妹卡
  `math.supermoduli-compactified-punctured-genus-2-not-projected`，量词范围不同且更窄）；
  **未紧化**的 \mathfrak S_{g;n,2r} 的任何断言（障碍类是在紧化边界的测试曲线上检测到的，与光滑
  轨迹的投影性无逻辑关系）；任何"分裂/可投影"的正面方向；Ramond 节点处的粘接（FKP-A §9.3 仅以
  猜想形式给出该类比，本证明刻意避开，只在 NS 节点处粘接）；r≥1 时任何具体连通分量的断言。
