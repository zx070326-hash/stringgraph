  为准。(2) **不加 `depends_on` 边**：本卡断言"非投影"、上述两处断言"连通/不可约"，是独立命题，
  本卡的证明不使用连通性。(3) 本次改动**不移动**任何节点的 effective（本卡此前此后均为
  rigorous），按原则 8 属顺手补注，未为此派 agent、未写 `docs/reviews/` 文档。
