notes: |
  【查重】`uv run stringgraph search "punctured"` / `"elliptic tail"` / `"Ramond puncture"` /
  `"gluing"`（2026-09-20）均无覆盖本量词范围（紧化+带穿孔+g≥3 任意 n,r）的同内容命中——最接近的
  `math.supermoduli-compactified-genus-geq3-not-projected` 只覆盖 n=r=0；
  `math.supermoduli-ns-ramond-punctures-not-projected`（Wang）覆盖**未紧化**范畴且天花板
  physical-argument；`math.supermoduli-ramond-punctures-not-projected`（Donagi–Ott）覆盖未紧化
  范畴且门槛更窄（g≥5r+1）。

  【⭐ 与既有卡的关系，明确声明】本节点**完全不依赖**
  `math.supermoduli-ns-ramond-punctures-not-projected`（Wang，图中 status=physical-argument）
  与 `math.supermoduli-ramond-punctures-not-projected`（Donagi–Ott）——这两张卡断言的是**未紧化**
  范畴的投影性，与本节点的**紧化**范畴断言逻辑独立，互不包含。reviewer 在第二轮亲自 grep 全文
  proof.md，确认对 Wang/Donagi-Ott 的唯一提及出现在自洽性检验章节（比较与独立性声明），无任何一步
  引用其结论；故 depends_on 不挂这两张卡，本节点天花板不被压低到 physical-argument。也不修订
  `math.supermoduli-space-not-projected`（Donagi–Witten，未紧化）——本节点只使用其一点障碍族
  **构造**（作为图内 rigorous 节点被记账使用，非依赖其断言本身，因为本节点的对象是紧化叠而 DW
  卡的对象是未紧化叠）；也不修订 Corrêa–Noja 三张紧化卡——本节点在 n=r=0 时**重现** CN 的 g≥3
  结果（proof.md §6.1 自洽性检验），在 n+2r>0 时给出 CN 未断言的新范围，是 CN 论证骨架在更一般
  粘接映射上的重新装配，不构成对 CN 卡的修订。

  【FKP 法丛公式的推广——诚实标注，见 derivation 文件的 inferred:true 边】本证明的构造步骤
  （proof.md §4 引理 4.4）需要把 `math.fkp-ns-boundary-gluing-normal-bundle-formula`（FKP-A
  Theorem C，逐字陈述靶为**无穿孔**的 S̄_g）用于**带穿孔的靶** \overline{\mathfrak S}_{g;n,2r}。
  这一步的合理性依据是该公式的证明路径（eq.(9.6) via Lemma 9.1）是关于节点形式邻域的**局部**
  陈述，与靶空间是否带其他穿孔无关（proof.md §4.3 的详细讨论）——但 FKP-A 原文从未把该公式写成
  对任意穿孔数成立的一般性结论。这是一条**依据节点奇点局部性的推断，不是 FKP 论文逐字陈述的
  一般性结论**，已在对应 derivation 的 depends_on 边上诚实标 `inferred: true` 并附此说明。

  【上段已于 2026-09-24 过时，lead 补注】该推断现已被**正面证明**：对应 derivation 的这条边已
  改指 `math.fkp-punctured-normal-line-formula-separating`（本项目 attempt `fkp-96-punctured`
  的原创证明，对分离型 (7.8) 粘接、任意 NS 穿孔数与任意偶数 Ramond 穿孔数直接建立该法丛公式，
  且刻意不引用 FKP Theorem C 以避免循环），边上的 `inferred` 已改为 `false`。上段保留为历史。

  【r≥1 时不断言连通分量的原因】`[GAP-COMP]`：r>0 时 \overline{\mathfrak S}_{g;n,2r} 的连通分量
  分类本身是开放问题（本证明未涉及，也未见公开文献给出），故只能断言"整个叠非投影"而非"某个
  具体分量非投影"。这与 r=0 时可以用 Mumford 意义下宇称局部常值这一标准事实指认分量形成对比。

  【`[GAP-COMP]` 已于 2026-09-24 对 r≥1 关闭，lead 补注】关闭者是本项目论文
  `research/papers/supermoduli-punctured-nonprojected/paper.md` §10.3 的 **Corollary 10.2**：
  r≥1 时 \overline S_{g;n,2r} **不可约**（故连通）。其路线是先用 FKP Remark 2.17 认定该紧化
  即 Jarvis/JKV 型无挠层紧化（并明确排除 Abramovich–Jarvis 的 twisted-curve 叠），再经
  Lemma 10.1 的直接扭转把分量计数还原为 **Jarvis (2000) Thm 3.3.1**，得分量数 d=1。
  图内另有一条**前提更少的独立路线**记在 `math.supermoduli-ramond-components-compactified-connected`
  （own rigorous / effective rigorous）：完全在 FKP 紧化内部走"稠密性 + 点推单值"，
  刻意不使用上述紧化认定，结论较弱（只得连通）但不受该认定风险影响。
  后果：本卡断言的"整个叠非投影"在 r≥1 时**本来就是分量级陈述**——唯一的分量就是整个叠，
  "不指认分量"这句限制变成空话而非开放问题。上段"连通分量分类是开放问题"的说法不再成立，
  保留为历史记录。
  ⚠ 该结论**不是本项目的新数学**，原始出处是 Jarvis (2000)。
  三点说明：(1) 本卡 `statement` 正文第 18 行同样含 `[GAP-COMP]` 的括注，按原则 1（本卡已被
