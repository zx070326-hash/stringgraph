notes: |
  **措辞纪律**：本节点严格保留原文限定性措辞"cannot be a formula for"，不强化为"is wrong"、"the
  computation is incorrect"等更强断言；CDvG 本身的计算是否有误不在本文与本节点的断言范围内。

  **与 `math.supermoduli-genus-3-measure-linear-combination` 的关系**：两者来自同一篇论文但是两个
  独立命题（一个节点一个命题）——该节点是本文自己的正面结果（线性组合形式），本节点是本文对既有
  文献 [20] 的条件性排除论证，不应合并。

  **Witten 2015（arXiv:1501.02499，"The super period matrix with Ramond punctures"）未独立立卡**：
  本节点的排除论证在逻辑上以该文献的极点存在性结果为前提，但该文献本身未被本项目读取、也未登记到
  `literature/sources.bib`（登记 `literature/**` 不在本任务允许写入范围内）。这是一个应报告给 lead
  的缺口：若后续要把"前提 A"接上真正的 depends_on 边（而不是留在本节点正文的文字记录里），需要先
  由 researcher 补做该文献的抽取记录、curator 或 lead 再登记 bib 条目并立卡。
