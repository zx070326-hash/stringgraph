id: math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole
kind: proposition
title: CDvG 2008 亏格三测度 Ansatz 因全纯而不能是 π_*ψ_3/φ_3 的公式（条件性排除论证，前提为 Witten 2015 的超椭圆轨迹极点存在性结果）（Dunin-Barkowski–Fedorov–Sleptsov）
statement: |
  **对象**：[20]（Cacciatori–Dalla Piazza–van Geemen 2008 年提出的亏格三 RNS 超弦测度 Ansatz，具体
  arXiv 号本节点不作判定，见下方"未决事项"）；π_*ψ_3/φ_3（亏格三真实超弦测度，Siegel 上半空间 H_3
  上的截面，记号同 `math.supermoduli-genus-3-measure-linear-combination`）。

  **论证**（p.5，逐字，经 L1 直接读取，未替作者加强）：
  "the Ansatz of [20] is holomorphic everywhere on the Siegel upper half-space H_3, so this Ansatz
  cannot be a formula for π_*ψ_3/φ_3."

  **这是一条条件性排除论证，不是"CDvG 的计算本身有误"的断言**：其逻辑结构是——(前提 A，本文引用
  Witten 2015 的既有结果) 真实测度 π_*ψ_3/φ_3 在超椭圆轨迹上必须有极点；(前提 B，本文自己的观察)
  [20] 的 Ansatz 在整个 H_3 上处处全纯（无此极点）；(结论) 故 [20] 的 Ansatz 不能等于 π_*ψ_3/φ_3。
  **本节点不断言前提 A（Witten 2015 极点存在性结果）本身的证明**——那是另一篇文献
  （Witten, "The super period matrix with Ramond punctures", arXiv:1501.02499）的独立结果，**本
  项目尚未把它登记为图节点**（见下方 gaps）。本节点也不断言 CDvG 的构造/计算过程本身存在错误，只
  断言"[20] 的 Ansatz 不满足真实测度必须满足的一个额外解析性质（超椭圆轨迹处应有极点）"。

  **未决事项（本节点不作判定）**：[20] 的确切 arXiv 号——DBFS 参考文献表本身未在该条目中直接标注
  可核对的 arXiv 号字符串；候选为 arXiv:0801.2543（"Modular Forms and Three Loop Superstring
  Amplitudes"，亏格三，语境更吻合）或 arXiv:0804.0457（"Genus four superstring measures"，亏格
  四）。本项目未能在 DBFS 原文参考文献表 [20] 条目中直接核对到具体数字串，故此身份问题留待后续
  补核，本节点不代替补核工作作出决定。
