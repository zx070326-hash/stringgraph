      arXiv:2505.02950v2, p.5（§1 引言，条件性排除论证逐字）；摘要（对应表述，逐字，经
      export.arxiv.org API 核验）；References [20]（arXiv 号未在条目原文核对到）、[27]（本文
      References 列表 pp.48–52 区间内引用 Witten 极点结果，arXiv:1501.02499——**注意这里的
      "pp.48–52" 是 DBFS 论文自己 References 列表所在的页码范围，不是 Witten 论文里该结果所在的
      页码**，见下方 2026-09-18 note 更正）。
    note: |
      **部分 L1**：摘要 + pp.1–10（Introduction，含本节点引用的 p.5 批评段落）+ pp.42–52（参考文献
      列表）已读（researcher 2026-09-18，抽取记录 dunin-barkowski-fedorov-sleptsov-2025.md E1, E3）。
      [20] 条目本身在参考文献表原文中未见明确 arXiv 号字符串，候选范围见 statement"未决事项"；
      Witten 2015（[27] = arXiv:1501.02499）本身未被本项目独立读取或立卡，只作为本文引用的既有
      结果记录在案。

      **2026-09-18 更正（researcher 重读 Witten 2015 后核实）**：loc 字段里原写的"[27]（Witten 极点
      结果引用），pp.48–52"，经核对，"pp.48–52"实际是**本条 sources 引用的 DBFS 论文自己 References
      列表所在的页码范围**（抽取记录 dunin-barkowski-fedorov-sleptsov-2025.md E3："位置：References，
      pp.48–52"），并非 Witten arXiv:1501.02499 论文内部该结果所在的页码——用它标注"Witten 极点结果"
      的位置会造成误导。Witten 论文里给出这条结果的真正位置是 **Appendix C.4（pp.55–56）**：
      Appendix B.2（Witten 论文 pp.48–49）讲的是亏格二的 D'Hoker–Phong 程序修正（不同机制）；
      Appendix C.1–C.2（Witten 论文 pp.50–52）只是超椭圆轨迹与自旋结构的定义（见新节点
      `math.supermoduli-witten-genus-3-hyperelliptic-pole` 第一部分）；真正给出"测度 π_*(Υ) 有极点"
      并点名 CDvG 论文（[24]）的是 Witten 论文 **Appendix C.4，pp.55–56**。
  - ref: witten-2015-ramond-period-matrix
