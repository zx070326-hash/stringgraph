notes: |
  **措辞纪律**：本节点严格保留原文限定性措辞"cannot be a formula for"，不强化为"is wrong"、"the
  computation is incorrect"等更强断言；CDvG 本身的计算是否有误不在本文与本节点的断言范围内。

  **与 `math.supermoduli-genus-3-measure-linear-combination` 的关系**：两者来自同一篇论文但是两个
  独立命题（一个节点一个命题）——该节点是本文自己的正面结果（线性组合形式），本节点是本文对既有
  文献 [20] 的条件性排除论证，不应合并。

  **2026-09-18 更新：前提 A 已接图，Witten 2015 已登记立卡**（researcher + curator）。本节点的排除
  论证在逻辑上以 Witten 2015（arXiv:1501.02499，"The super period matrix with Ramond punctures"）的
  极点存在性结果为前提；该文献现已登记 `literature/sources.bib`（key
  `witten-2015-ramond-period-matrix`）并立卡为 `math.supermoduli-witten-genus-3-hyperelliptic-pole`，
  推导 `math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole--via-dunin-barkowski-fedorov-sleptsov`
  已补上 depends_on 该新卡的边（`inferred: true`，因为 Υ 与本节点记号 π_*ψ_3/φ_3 的对应关系本项目
  未见任何文献逐字确认，只是同一物理对象在两套记号下的自然识别）。此前"未独立立卡"的缺口已关闭。

  **优先权发现（2026-09-18，本轮最重要的一条）**：Witten 2015 本人已在其论文 p.56，(C.22) 之后逐字
  写道——
  > "The literature actually contains a proposal [24] for a holomorphic measure on M_{3,spin+} that is
  > supposed to arise by integrating over the odd variables in some fashion that has not been
  > specified. This formula is holomorphic along D′, so it does not coincide with π_*(Υ)."
  即：**Witten 本人早在 2015 年就已经针对同一篇被批评的论文（[24] = Cacciatori–Della Piazza–van
  Geemen, arXiv:0801.2543，与本节点 [20] 极可能是同一篇，见新卡与其推导的 gaps）做出与 DBFS 2025
  几乎相同的排除结论**——"CDvG 的全纯 Ansatz 因全纯而不能是真实（沿超椭圆轨迹有极点的）测度"这一
  排除并非 DBFS 首创。DBFS 2025（本节点唯一来源）是把 Witten 2015 已经指出的这一点重新表述、纳入
  自己的引言论证；本节点的 title/statement 措辞把这一排除论证独占地归于"Dunin-Barkowski–Fedorov–
  Sleptsov"，这一 provenance 问题本节点不代为改动 title/statement（根 CLAUDE.md 原则 1），留待 lead
  判断是否需要走里程碑规范化流程调整措辞或补充"Witten 2015 已给出同一结论"的 provenance 说明。

  **DBFS 转述不精确，但排除论证的结论仍然成立**：DBFS 摘要与引言把 Witten 2015 的结果笼统转述为
  "our formula has a polar singularity along the hyperelliptic locus; the existence of this
  singularity was established by Witten in 2015"（单数、笼统，不区分 D/D′）。Witten 原文的实际结构
  是**不对称**的：偶自旋结构模空间 M_{3,spin+} 里的"超椭圆轨迹"分裂为 D（h⁰(L)=2，1 个自旋结构，
  测度处**预期为零点**，作者用"we expect"）与 D′（h⁰(L)=0，35 个自旋结构，测度**确实有极点**，
  作者用肯定语气"thus"）两支——见 `math.supermoduli-witten-genus-3-hyperelliptic-pole`。DBFS 的
  排除论证逻辑（若 CDvG Ansatz 在整个 H_3 全纯，则也在 D′ 上全纯，与 D′ 上应有极点矛盾）**只需要
  D′ 那一支**，故排除论证的最终结论不受这一简化转述影响——但转述本身把 D/D′ 的不对称结构抹平了，
  不精确，供 lead 与后续 auditor 参考。

  **Witten 2015（arXiv:1501.02499，"The super period matrix with Ramond punctures"）未独立立卡**：
  本节点的排除论证在逻辑上以该文献的极点存在性结果为前提，但该文献本身未被本项目读取、也未登记到
  `literature/sources.bib`（登记 `literature/**` 不在本任务允许写入范围内）。这是一个应报告给 lead
  的缺口：若后续要把"前提 A"接上真正的 depends_on 边（而不是留在本节点正文的文字记录里），需要先
  由 researcher 补做该文献的抽取记录、curator 或 lead 再登记 bib 条目并立卡。
  **（2026-09-18：此缺口已按上方"前提 A 已接图"一条关闭，本段保留作历史记录，不删除。）**
  **2026-09-18 优先权裁定落地（lead，依据 physics-auditor 报告
  docs/reviews/cdvg-exclusion-provenance-2026-09-18.md）**：
  · **本卡 title/statement 一个字不改。** auditor 的回译审计裁定本卡对 DBFS 论文的转述 **faithful**
    （量词、条件、逻辑连接词与原文一一对应，未加强未减弱；逐字引文经原文 PDF 复核**逐字符一致**
    含标点），且 title 末尾的作者括号在本项目一贯用法里是**来源标注**而非首创权声明。
  · **Witten 本人的排除陈述已独立立卡**：`math.supermoduli-witten-genus-3-cdvg-exclusion-remark`
    （及其推导 `--via-witten-2015`）。两卡并存而非换代——两者前提强度不同：本卡的前提 B
    「[20] 在整个 H_3 上处处全纯」**严格强于** Witten 的「[24] 沿 D′ 全纯」（前者蕴含后者，反之
    不成立），故本卡的排除论证**不是** Witten 版本的推广，而是用了不必要地更强的前提去得到同一个
    矛盾的、更粗糙但仍然有效的重述。
  · **新发现（auditor 直读 DBFS pp.1–10 Introduction 全节 + pp.42–52 References 全节）**：
    DBFS 在 p.5 的排除段落里**明确引用** Witten [27, appendix C.4]，但引用的只是「Witten 证明了
    π_*ψ_3 有极点并算出阶数」这一**前提 A**；DBFS **从未提及/引用** Witten 本人已在被引用的同一个
    Appendix C.4 里、对同一篇论文做过的排除陈述。DBFS 甚至在脚注 3 里显示出对 C.4 的细致阅读
    （提到 C.4 反驳了 Witten 自己 2013 年的早期猜测），却没有提到紧随同一计算之后的那句排除。
    ⚠ DBFS §2–§6（pp.11–41）本轮未读，见该报告「不确定性」第 1 条。

  **[20] 的 arXiv 号：已解决（但 statement 正文的「未决事项」段按原则 1 不得就地修改，保留原样）**。
  auditor 直读 DBFS References [20] 原文条目（印刷 p.49）："S.L. Cacciatori, F. Dalla Piazza and
  B. van Geemen, *Modular forms and three loop superstring amplitudes*, Nucl. Phys. B **800** (2008)
  565 [**0801.2543**]"，与 Witten References [24]（p.59）的 arXiv 号、卷页、篇名、作者全部吻合；
  lead 用 arXiv 摘要页独立复核 0801.2543 = Cacciatori / Dalla Piazza / van Geemen,
  "Modular Forms and Three Loop Superstring Amplitudes", Nucl.Phys.B800:565-590,2008，三项全中。
  **即 [20] = [24] = arXiv:0801.2543，不再是待核事项。** 另：statement「未决事项」里列为候选之一的
  arXiv:0804.0457（"Genus four superstring measures"）**根本不在 DBFS 的参考文献表里**；DBFS 的
  [21] 实为 Dalla Piazza–van Geemen, *Siegel modular forms and finite symplectic groups*,
  arXiv:0804.3769。候选范围讨论到此关闭。
  ⚠ 「Della Piazza」（Witten 参考文献表）vs「Dalla Piazza」（DBFS 与 arXiv 作者栏）是 Witten 论文
  自身的拼写笔误，指同一人，不影响身份判定；未找到官方勘误，严格说是极强证据支持的推断。
