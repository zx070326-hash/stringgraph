  对占全文绝大部分的主定理证明（pp.4 起）完全未读，两点叠加——按"断言+骨架"准则（`docs/
  STATUS_LEVELS.md`）：有明确断言（"we show"）但既无法核实完整证明骨架，源文献自身也未达到"完整/
  已定稿证明"的严格程度（不同于已发表或长期挂出未撤稿的论文），故本节点对应推导标 physical-argument
  而非 rigorous，是本项目对来源强度的诚实判断，不代表怀疑数学结论本身。

  **与 `math.supermoduli-ramond-punctures-not-projected`（Donagi–Ott）的关系**：见 statement 正文
  "improve"一词的范围限定；本节点不写"Wang 严格改进 Donagi-Ott"，任何比较需加 n>0 限定。

  **覆盖范围地图**（据 correa-noja-2026 抽取记录"未解决的疑问"第2条交叉核实）：Donagi–Witten
  2013（未紧化无穿孔）、Donagi–Noja 2026（未紧化无穿孔，g=4 偶分量）、Corrêa–Noja 2026（紧化无
  穿孔）、Donagi–Ott 2023 + 本节点（未紧化带穿孔）四组结果覆盖互不重叠的象限，未见任何文献处理
  "紧化+带穿孔"这一象限。
