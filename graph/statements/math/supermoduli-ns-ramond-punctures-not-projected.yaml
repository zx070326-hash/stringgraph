id: math.supermoduli-ns-ramond-punctures-not-projected
kind: proposition
title: 带 NS+Ramond 混合穿孔的未紧化超模叠不可投影（Wang, "preliminary draft"）：g≥n+5r+3 时 𝔐_{g,n,2r} 不可投影
statement: |
  **对象**：𝔐_{g,n,2r} 为亏格 g、带 n 个 Neveu–Schwarz 穿孔和 2r 个 Ramond 穿孔的未紧化超黎曼曲面
  模叠（n=0 特例退化为 `math.supermoduli-ramond-punctures-not-projected` 的 𝔐_{g,0,2r}）。

  **定理**（摘要，逐字，经 arXiv API 核验）：
  "We study the supermoduli space 𝔐_{g,n,2r} of Super Riemann Surfaces (SRS) of genus g, with n
  Neveu-Schwarz punctures and 2r Ramond punctures. We improve the result of Donagi, Witten, and Ott by
  showing that the supermoduli space 𝔐_{g,n,2r} is not projected if g ≥ n + 5r + 3."

  **"improve"一词的范围限定**（本项目独立核对量词，非论文自己写明，标记为推断）：n=0 时本文条件退化
  为 g≥5r+3，比 Donagi–Ott（`math.supermoduli-ramond-punctures-not-projected`）的 g≥5r+1 更严格
  （覆盖范围更小），**并非在 n=0 情形下的数值改进**。"improve"更可能指"把 Donagi–Ott 的纯 Ramond
  穿孔结果推广到 NS+Ramond 混合穿孔（n>0）这一更一般的设置"，**不是"在同一设置下给出更宽松的量词
  边界"**。任何"Wang 改进/优于 Donagi–Ott"的比较表述都必须加 n>0 限定，或者不作比较。

  **本节点不断言**：紧化空间；证明的具体技术方法（本项目仅读 pp.1–3，主定理 Theorem 4.2 的完整
  证明在 pp.4 起，未读）；本节点也不断言该结果与 Donagi–Witten/Donagi–Ott 的具体引理之间有结构性
  依赖（引言只是背景回顾，未核实证明本身是否引用二者的具体引理）。

  **文献自陈的严格程度标记**：本文 arXiv 元数据 `comment` 字段明确写 "preliminary draft"——作者
  本人在提交时将此文标注为初步草稿，只有 v1（2025-12-05 提交），核实时未见期刊发表或 v2 修订版。
