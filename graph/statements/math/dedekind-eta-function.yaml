id: math.dedekind-eta-function
kind: definition
status: formalized
title: Dedekind η 函数 η(τ) = q^{1/24} ∏_{n≥1}(1 − q^n)
statement: |
  设 H = { τ ∈ C : Im τ > 0 } 为上半平面，并约定
    q ≡ exp(2πiτ) ,   q^{1/24} ≡ exp(2πiτ/24) = exp(πiτ/12)
  （即 q 的 24 次根**按 τ 取定的单值分支**，不是多值符号）。定义 Dedekind η 函数
    η(τ) = q^{1/24} ∏_{n=1}^{∞} ( 1 − q^n ) ,   τ ∈ H 。
  由 |q| = exp(−2π Im τ) < 1 与 Σ_n |q|^n < ∞，无穷乘积在 H 的紧子集上绝对且一致收敛
  （初等标准事实），故 η 在 H 上全纯，且因每个因子非零而 η 在 H 上无零点。

  **本卡不断言什么**：不断言 η 的任何模变换性质（那是
  math.dedekind-eta-modular-transformation）；不断言 η 与 θ 函数的关系
  （Polchinski (7.2.43) 的第二个等号 η = [∂_v ϑ₁₁(0,τ)/(−2π)]^{1/3}，本图未建 θ 函数卡，
  见 notes）；不涉及 η 作为权 1/2 模形式的一般理论。
uses: []
uses_conventions: []
