notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E9/#E16 建立。

  **为什么单独立一张定义卡**：η 在本图里是三处的共同承重件——(7.2.9) 自由标量配分函数、
  (7.3.6) 环面真空振幅、(7.4.2) 开闭弦通道对偶——而这三处用到的**性质**（模变换）在原书零证明。
  把「定义」与「模变换」分成两张卡，才能让前者保持 rigorous 而不被后者拖低。

  **形式化候选**：抽取记录 §5-C 把 (7.2.44b) 列为本章优先级最高的 Lean 岛；本卡是它的前置定义。
  Mathlib 是否已有 DedekindEta **本轮未核实**（留给 formalizer）。
  本图已有的相关件：math.euler-partition-generating-function（∏(1−X^n) 的形式幂级数侧）。

  **未建的相邻卡**：θ 函数一族（(7.2.31)–(7.2.42)）本批次不建——原书对其**全部性质零证明**
  （周期性唯一确定、零点唯一性、Jacobi abstruse identity 均为断言），且 Möbius 带振幅只需
  ϑ₀₀ 的一个特值；见抽取记录 #E15 与本批次报告的「未做条目」。
