id: math.supermoduli-witten-genus-3-cdvg-exclusion-remark
kind: proposition
title: >-
  Witten 2015：文献中已有的 CDvG 亏格三全纯测度提案（[24] = arXiv:0801.2543）因沿 D′ 全纯而与
  π_*(Υ) 不重合（条件性排除论证，前提为同文 Appendix C.4 的 D′ 支极点结果）（Witten）
statement: |
  **对象**（记号完全沿用 `math.supermoduli-witten-genus-3-hyperelliptic-pole`，即 Witten,
  "The Super Period Matrix With Ramond Punctures", arXiv:1501.02499, Appendix C 的记号）：
  Υ 为 (C.19) 定义的超模空间 M_{3,+} 上的弦论测度；π: M_{3,+} → M_{3,spin+} 为超周期矩阵投影；
  π_*(Υ) 为推前测度；D′ ⊂ M_{3,spin+} 为 h⁰(L)=0 的 35 个偶自旋结构所参数化的那一支不可约除子。

  **论证**（Appendix C.4, p.56, 紧接 (C.22) "Thus π_*(Υ) is of order 1/ε⁴ or 1/q² along D′." 之后，
  逐字，经 L1 直接读取，未替作者加强）：
  "The literature actually contains a proposal [24] for a holomorphic measure on M_{3,spin+} that is
  supposed to arise by integrating over the odd variables in some fashion that has not been specified.
  This formula is holomorphic along D′, so it does not coincide with π_*(Υ)."

  **[24] 的身份**：Cacciatori, Dalla Piazza, van Geemen, "Modular Forms And Three Loop Superstring
  Amplitudes", arXiv:0801.2543, Nucl. Phys. B800 (2008) 565–590。Witten 自己的参考文献表 [24]
  （p.59）逐字条目见 sources；该条目把第二作者姓氏印作 "F. Della Piazza"，正确拼写为 "Dalla Piazza"
  （arXiv:0801.2543 作者栏与 Dunin-Barkowski–Fedorov–Sleptsov 2025 参考文献 [20] 均作 "Dalla
  Piazza"），系 Witten 论文参考文献表自身的笔误，不影响身份判定。

  **本节点断言的精确范围**：这是一条条件性排除论证，其逻辑结构为——
  (前提 A，本文自己在同一附录刚给出) π_*(Υ) 沿 D′ 有极点（阶 1/q²），见
  `math.supermoduli-witten-genus-3-hyperelliptic-pole`；
  (前提 B，本文自己对 [24] 公式的检视) [24] 的提案沿 D′ 全纯；
  (结论) 故 [24] 的提案与 π_*(Υ) 不重合。

  **本节点明确不断言**：
  (a) **不断言 [24] 在整个 Siegel 上半空间 H_3 上处处全纯**——那是 Dunin-Barkowski–Fedorov–Sleptsov
      2025 独立做出的**严格更强**的断言（见
      `math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole`）。本节点只用"沿 D′ 全纯"这个更弱、
      更经济的前提。两张卡的前提强度不同，**不应合并为一张卡**。
  (b) **不断言前提 A 本身的证明**——那是 `math.supermoduli-witten-genus-3-hyperelliptic-pole`
      的内容（status: physical-argument，理由见该卡推导 `--via-witten-2015` 的判据 (a)–(d)）。
  (c) **不断言 [24] 的构造或计算本身有误**——原文只说 "does not coincide with"，不说 "is wrong"。
  (d) **本节点不是编号定理**——Witten 全文 Appendix C 无 Theorem/Proposition 标签，这是紧跟
      (C.19)–(C.22) 计算之后的正文陈述。
  (e) **不断言 π_*(Υ)（Witten 记号）与 π_*ψ_3/φ_3（DBFS 记号）是同一对象**——该记号对接本项目
      未见任何文献逐字确认，已在
      `math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole--via-dunin-barkowski-fedorov-sleptsov`
      的 depends_on 边上标为 `inferred: true`。本节点全程只用 Witten 自己的记号，不跨这条缝。
