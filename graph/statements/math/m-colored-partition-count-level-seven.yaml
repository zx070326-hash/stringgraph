id: math.m-colored-partition-count-level-seven
kind: proposition
title: "m 色分拆计数在 N=7 的显式 10-形状闭式：p_m(7) 按 7 的 10 种分拆形状展开（对一切 m ≥ 0）"
statement: |
  沿用 math.m-colored-partition-count-closed-form 的记号。7 恰有 15 个（无色）分拆，
  按"形状"（各部分大小的重数多重集 {r_s}）归并，恰好分成 10 类不同形状。对**一切** m ≥ 0：

    p_m(7) =  m                          （形状 {1}：分拆 7）
            + 3m²                        （形状 {1,1}：分拆 6+1, 5+2, 4+3）
            + 3m·C(m+1,2)                （形状 {1,2}：分拆 5+1+1, 3+3+1, 3+2+2）
            + m³                         （形状 {1,1,1}：分拆 4+2+1）
            + 2m·C(m+2,3)                （形状 {1,3}：分拆 4+1+1+1, 2+2+2+1）
            + m²·C(m+1,2)                （形状 {1,1,2}：分拆 3+2+1+1）
            + m·C(m+3,4)                 （形状 {1,4}：分拆 3+1+1+1+1）
            + C(m+1,2)·C(m+2,3)          （形状 {2,3}：分拆 2+2+1+1+1）
            + m·C(m+4,5)                 （形状 {1,5}：分拆 2+1+1+1+1+1）
            + C(m+6,7)                   （形状 {7}：分拆 1+1+1+1+1+1+1）

  逐项的 10 个分拆形状与 15 个分拆之间的对应关系（每种形状对应哪些具体分拆）见
  research/attempts/level-n-count-generalization/claim.md（Claim 4 表格）。
