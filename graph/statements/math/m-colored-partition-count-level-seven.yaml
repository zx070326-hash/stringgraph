tags: [combinatorics, partitions, oscillator-counting, no-ghost]
notes: |
  【论证，curator 亲自 Read proof.md §6 与 claim.md Claim 4 全文核对】本卡是姐妹卡
  math.m-colored-partition-count-closed-form 的一般闭式
  p_m(N) = Σ_{λ⊢N} ∏_s C(m+r_s(λ)−1, r_s(λ)) 在 N=7 处的**直接实例**：把 7 的 15 个
  （无色）分拆逐一按各自的重数多重集 {r_s} 归入 10 类形状，每类形状贡献一项 ∏_s C(m+r_s−1,r_s)，
  10 类之和即为上式。proof.md §4 用三条独立方法（分拆形状公式 / 生成函数幂级数 DP / 暴力
  按模式枚举）数值核验 m=1..5 时 p_m(7) = 15, 110, 429, 1240, 2990，逐项精确吻合。无缺口。

  【与 Lean 骨架的关系，仅作记录】proof.md §7 报告：任务原计划要求把本命题的"递归形式"
  （p_{m+1}(7)+C(m+3,2) = p_m(7)+p_{m+1}(6)+p_{m+1}(5)）写成 formal/ 下三条 sorry
  定理骨架，但被本仓库 pre-commit hook（禁止 formal/ 下出现 sorry）拒绝，最终改放
  research/attempts/level-n-count-generalization/scratch.lean（sorry 骨架，
  按 research/CLAUDE.md 的 scratch 豁免不受 formal/ 约束，但也因此不构成
  status: formalized 的证据）。curator 未亲自重跑 lake build 核实 proof.md 所述的编译
  结果，此处是转述 proof.md 的自我报告。

  【范围边界，明确不断言】本卡只断言 N=7 这一个具体实例，不断言任何一般 N 的显式展开
  （一般式见姐妹卡 math.m-colored-partition-count-closed-form）；不含"递归形式"
  （p_{m+1}(7)+C(m+3,2) = p_m(7)+p_{m+1}(6)+p_{m+1}(5)），因为 proof.md 明确声明
  该递归形式与本卡闭式的等价性是"ring 可判定的有限多项式恒等式，此处未重新推导"，
  即证明尚未在本材料中完整写出（proof.md §6 末段原话），故不作为本卡断言的一部分，
  留待未来若有需要单独立卡。

