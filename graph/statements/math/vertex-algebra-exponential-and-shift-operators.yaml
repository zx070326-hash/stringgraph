sources:
  - ref: li-wang-2008
    loc: "(3.2), p.11（E^± 定义与四条立即性质）；p.11 无编号式（Δ̄ 定义、良定义条件与三条立即性质）；Remark 3.3, p.11（Δ 记号、脚注 3 的符号换算警告）"
    note: |
      **L1（researcher 2026-09-18 全文逐页读图 arXiv:0802.0173 pp.9–24；
      逐字文本见 literature/extractions/math-sources.md §36.6(a)(b)）。**
      (3.2) 逐字：「For α ∈ 𝔥, we set ([LW1], [FLM]) E^±(α,x) = exp( Σ_{n=1}^∞ (α(±n)/(±n)) x^{∓n} ).」
      Δ̄ 定义逐字：「Set Δ̄(α,x) = (−x)^{α(0)} exp( Σ_{n=1}^∞ (α(n)/(−n)) (−x)^{−n} ) = (−x)^{α(0)} E^+(−α,−x).
      This is a well defined element of (End W)[[x, x^{−1}]] for any module W for vertex algebra M(1),
      on which α(0) acts semisimply with only integer eigenvalues and α(n) for n ≥ 1 act locally
      nilpotently.」
      脚注 3 逐字（紧接 Remark 3.3 的 Δ(α,x) 定义之后）：「Note that the notation E^-(α,x) in [Li3] is the
      notation E^-(−α,x) in this paper and in [FLM], and all the related formulas have been adjusted
      correspondingly.」
      ⚠ 本卡**不引** [Li3]、[Li2]、[FLM] 原文本身（本项目未独立读过它们，对它们仍是 L3，
      见 math-sources.md §36.6(h)）；(3) 里对 Δ(α,x) 的转述只是搬运 Li–Wang 论文里对 [Li2][Li3]
      记号的**转述**，不是对 [Li2][Li3] 的独立核实。
