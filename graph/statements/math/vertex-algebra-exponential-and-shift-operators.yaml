notes: |
  【为什么合成一张卡而不是两张】E^±(α,x) 与 Δ̄(α,x) 在 Li–Wang p.11 是紧邻定义的一对算子
  （Δ̄ 直接由 E^+ 构造：Δ̄(α,x) = (−x)^{α(0)} E^+(−α,−x)），且 🔴 符号约定归属（脚注 3）同时约束
  两者在 (3.10)/(3.14) 里的用法——拆成两张卡会迫使脚注 3 的警告要么重复两遍，要么让其中一张卡
  依赖另一张卡才能读懂自己的符号，价值不大。判据依「一个节点一个命题」：这里的"命题"是
  "(3.10)/(3.14) 右端两个记号在 Li–Wang 本文里精确是什么，以及它们在跨文献引用时如何变号"，
  是单一、不可再拆的一件事。

  【为什么单独立卡而非塞进 math.lattice-vertex-algebra 的 notes】该卡的 statement 正文里已经把
  E^-、Δ̄ 当作"照抄的记号"使用（原文逐字："本卡照抄为记号，见 gaps"），但从未给出它们的显式定义——
  这正是 research/attempts/physical-exponential-equals-lattice-voa/status.yaml 第 157–160 行
  （C1 移交条目）指出的缺口。补上本卡后，math.lattice-vertex-algebra 的 (3.10) 里 E^-(−α,x)、
  Δ̄(β,x)、Δ̄(α,−x) 三处都有精确定义可查，且符号翻译陷阱在一处钉死。

  【search 查重】`uv run stringgraph search "E^-"`、`"Delta"`、`"单值"`（2026-09-19）：
  前者无命中；"Delta" 命中的是 math.locality-ope-equivalences 等无关卡（用 delta 分布，非本卡的
  Δ̄ 零模算子）；"单值" 无命中。确认非重复。

  【与 (b) 里 Δ 记号的边界】Remark 3.3 说 Δ(α,x) 的三条基本性质「were established in [Li2] and
  [Li3]」——这条历史来源本卡不独立核实（同上，[Li2][Li3] 仍是 L3），本卡只登记 Li–Wang 2008
  自己转述的 Δ 定义式，不登记 [Li2][Li3] 对 Δ 性质的证明。
