id: math.vertex-algebra-exponential-and-shift-operators
kind: definition
status: rigorous
title: 顶点代数的指数算子 E^±(α,x) 与零模移位算子 Δ̄(α,x)（Li–Wang 2008 符号约定）
statement: |
  设 M(1) 是秩为 dim 𝔥 的 Heisenberg 顶点代数（见 math.lattice-vertex-algebra 的设定：
  𝔥 带非退化对称双线性型 ⟨·,·⟩，ĥ 是相应仿射 Heisenberg 代数，M(1) 是其 level 1 最高权模）。
  对 α ∈ 𝔥，记 α(n)（n ∈ Z）为 ĥ 在 M(1) 上的振子模。

  **(1) 指数算子 E^±(α,x)（(3.2)）：**
    E^±(α,x) := exp( Σ_{n=1}^∞ (α(±n)/(±n)) x^{∓n} ) ∈ (End M(1))[[x^{∓1}]]。
  展开写出：E^-(α,x) = exp(Σ_{n≥1} (α(-n)/(-n)) x^n) 只含**产生模** α(-n)（n≥1）；
  E^+(α,x) = exp(Σ_{n≥1} (α(n)/n) x^{-n}) 只含**湮灭模** α(n)（n≥1）。
  立即性质（原文逐字列出，无需证明的定义直接推论）：
    E^±(0,x) = 1,
    E^±(α,x_1) E^±(β,x_2) = E^±(β,x_2) E^±(α,x_1),
    E^+(α,x_1) E^-(β,x_2) = (1 − x_2/x_1)^{⟨α,β⟩} E^-(β,x_2) E^+(α,x_1),
    E^±(α,x) E^±(β,x) = E^±(α+β,x)。

  **(2) 零模移位算子 Δ̄(α,x)（p.11，无编号式）：**
    Δ̄(α,x) := (−x)^{α(0)} exp( Σ_{n=1}^∞ (α(n)/(−n)) (−x)^{−n} ) = (−x)^{α(0)} E^+(−α,−x)。
  它是 (End W)[[x, x^{-1}]] 中良定义的元素，条件是：W 是顶点代数 M(1) 的模，
  α(0) 在 W 上半单作用且本征值全为整数，α(n)（n ≥ 1）在 W 上局部幂零。
  立即性质：Δ̄(0,x) = 1, Δ̄(α,x_1)Δ̄(β,x_2) = Δ̄(β,x_2)Δ̄(α,x_1), Δ̄(α,x)Δ̄(β,x) = Δ̄(α+β,x)。

  **(3) 与记号 Δ(α,x) 的关系（Remark 3.3）：** 文献 [Li2][Li3] 里另有记号
    Δ(α,x) := x^{α(0)} E^+(−α,−x)，
  两者相差 Δ̄(α,x) = (−1)^{α(0)} Δ(α,x)（因 (−x)^{α(0)} = (−1)^{α(0)} x^{α(0)}）。
  本卡以 Δ̄（不带 (−1)^{α(0)} 因子分离）为准，(3.10)/(3.14) 用的正是 Δ̄。

  **(4) 🔴 符号约定归属（脚注 3，逐字，必须钉死）：**
    「the notation E^-(α,x) in [Li3] is the notation E^-(−α,x) in this paper and in [FLM],
    and all the related formulas have been adjusted correspondingly」
  即：**本卡 (1)(2) 中的 E^±、Δ̄ 采用的是 Li–Wang 2008 本文（与 [FLM]）的符号约定**——
  同一记号 E^-(α,x) 在 H.-S. Li 早期论文 [Li3]（= Li, *Extension of vertex operator algebras by a
  self-dual simple module*, J. Algebra 187 (1997)）里代表本卡的 E^-(−α,x)（参数正负号相反）。
  **任何从 [Li3] 或引用 [Li3] 记号的文献里搬运涉及 E^- 的公式到本图，必须先做这一步符号翻译，
  否则符号会整体错一遍**（这是本项目 physical-exponential-equals-lattice-voa 证明尝试
  proof.md §5 里三次独立核对的来源）。
