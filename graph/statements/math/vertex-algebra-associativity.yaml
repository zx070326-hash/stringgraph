id: math.vertex-algebra-associativity
kind: proposition
title: 顶点代数的结合性（形式 OPE）：Y(A,z)Y(B,w)C = Y(Y(A,z−w)B,w)C 于 V((w))((z−w))
statement: |
  设 V 是（复数域上的）**顶点代数**：向量空间 V 带真空向量 |0⟩、平移算子 T ∈ End(V) 与态-场对应
    Y(·, z) : V → End(V)[[z^{±1}]],   A ↦ Y(A, z) = Σ_{n ∈ Z} A_{(n)} z^{-n-1},
  满足真空公理、平移公理，以及**局域性公理**：对任意 A, B ∈ V，形式分布 Y(A, z) 与 Y(B, w)
  按 math.formal-distribution-locality 互为局域（存在 N 使 (z-w)^N [Y(A,z), Y(B,w)] = 0），
  且每个 Y(A, z) 是场（对任意 C ∈ V，A_{(n)} C = 0 当 n 充分大）。
  （公理的精确措辞以来源为准；本图目前没有单独的顶点代数定义卡，见 notes。）

  **命题（结合性）**：对一切 A, B, C ∈ V，在 V((w))((z - w)) 中成立等式
    Y(A, z) Y(B, w) C = Y(Y(A, z - w) B, w) C,                                (1)
  其中左端按下述方式理解：由局域性，级数 Y(A,z)Y(B,w)C 是空间
    V[[z, w]][z^{-1}, w^{-1}, (z - w)^{-1}]
  中某个元素在 V((z))((w)) 中的展开；把该空间嵌入 V((w))((z - w))——令 z ↦ w + (z - w)，
  z^{-1} ↦ (w + (z - w))^{-1} 并视为 (z - w)/w 的正幂级数——(1) 的左端即该元素在此嵌入下的像。
  右端 Y(Y(A, z-w)B, w)C 作为 w 与 (z - w) 的幂级数，由分次理由本来就属于 V((w))((z - w))。

  等价的另一种写法：对一切 A, B, C ∈ V 与充分大的 N ∈ Z_+，
    z^N Y(A, z) Y(B, w) C = z^N Y(Y(A, z - w) B, w) C   在 V[[z^{±1}, w^{±1}]] 中成立，
  其中右端的 (z - w)^{-1} 按 w/z 的正幂展开。

  **本命题是纯形式的**：等式所在的场所 V((w))((z-w))、V[[z^{±1}, w^{±1}]]、
  V[[z,w]][z^{-1},w^{-1},(z-w)^{-1}] 全是形式 Laurent 级数空间，z, w 是形式变量，不涉及任何收敛性。
  在顶点代数语境下，物理侧的「OPE」指的就是这条结合性（把 Y(A,z-w)B = Σ_k (z-w)^{-k-1} A_{(k)}B 代入 (1)）。
