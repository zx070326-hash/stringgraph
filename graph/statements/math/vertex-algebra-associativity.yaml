sources:
  - ref: frenkel-benzvi-2004
    loc: "Theorem 3.2.1 (associativity), §3.2 Associativity（Google Books 页码定位 p. 49，L4）；措辞取作者勘误表 corrections.pdf「To § 3.2」的修订版，非印本正文"
    note: |
      **L1（researcher 2026-09-11 逐页读作者勘误表 https://math.berkeley.edu/~frenkel/BOOK/corrections.pdf；
      math-sources.md §9.1）**。勘误表逐字：「3.2.1. Theorem. Any vertex algebra V satisfies the following
      associativity property: for all A, B, C ∈ V we have the equality in V((w))((z−w)),
      (1) Y(A,z)Y(B,w)C = Y(Y(A,z−w)B,w)C, where by the left hand side we understand its image in
      V((w))((z−w)) under the map described above.」嵌入方式与「另一种写法」（Remark）亦逐字取自勘误表。
      **版次陷阱**：勘误表 PDF 元数据显示 2001-09 生成（L4），很可能是第 1 版的勘误；第 2 版（2004）大概率已把
      修订吸收进正文。编号 Theorem 3.2.1 在第 2 版存在（Google Books 命中 p.49，带控制实验）。
      **禁令**：不得写 Frenkel–Ben-Zvi Theorem 3.3.1（本轮证据指向该编号不存在，math-sources.md §9.2）。
      顶点代数的公理化定义在该书 Ch. 1「Definition of vertex algebra」（web draft 目录 p.20，L4），编号未核实。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, §5.7, p. 53：逐字「in the VOA context, OPEs are just the associativity property (4.9)」；(4.9) 本身未转录"
    note: |
      只用来支撑陈述末句「顶点代数语境下的 OPE 就是结合性」；Gui 的 (4.9) 措辞 researcher 未转录（L0），
      本节点不据此写任何公式。见 math-sources.md §8.8。
  - ref: kac-1998
    loc: "§4.8 (Borcherds identity), Theorem 4.8 与式 (4.8.1)（编号经作者勘误表 kac-1999-corrections L1 确认；正文措辞 L0）"
    note: |
      Kac 把同一内容装在更强的 Borcherds 恒等式（(4.8.1)）里；结合性是其特殊化。**措辞未核实**，
      只作「同一命题在另一本标准教材中的位置」的指路，本节点的任何公式都不取自 Kac。
      **禁令**：不得写 Kac Theorem 2.3 / Corollary 2.2（math-sources.md §10.3）。
