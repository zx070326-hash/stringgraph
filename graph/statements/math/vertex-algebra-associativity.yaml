notes: |
  **为什么与 math.locality-ope-equivalences 分开**：那条是关于任意两个局域形式分布的（不需要顶点代数结构），
  结论是 A(z)B(w) 的奇异部分由有限多个 C^j(w) 给出；本条需要完整的顶点代数结构（真空、平移、态-场对应），
  结论是**所有** OPE 系数场 C^j 都是顶点算子 Y(A_{(j)}B, w)——即「OPE 在代数内封闭」。
  二者在 Gui 的箭头图（2026-07-15 版 p.74）里分别对应「Formal variable」节点与「OPE」节点。

  **为什么与 math.vertex-algebra-ope-analytic-convergence 分开、且绝不可合并**：本条陈述场所是形式级数空间，
  勘误表通篇没有 converge / holomorphic / analytic continuation 任何一词；那条的场所是 O(Conf²(C^×))。
  见 math-sources.md §9.4 的对照表。

  **本图缺一张顶点代数定义卡**：陈述开头的公理列表是概述，不是逐字定义。可核实的逐字定义本轮没有拿到
  （FBZ Ch.1 编号 L4；Kac 正文 L0；Gui 与 Schottenloher 的定义编号 researcher 未转录）。
  建议下一轮 researcher 补 Schottenloher Ch.10 §10.4 起或 Gui §4 的定义编号后，新建 `math.vertex-algebra`
  定义卡并让本节点 `uses` 它；本节点的 statement 文本届时不改（id 与文本冻结），只在新卡上加边。
