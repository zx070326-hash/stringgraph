id: math.supermoduli-compactified-genus-2-odd-split
kind: proposition
title: 紧化亏格二奇自旋分量超模叠是分裂的（Corrêa–Noja Theorem 1.1 item 1）：𝔐̄₂⁻ split
statement: |
  **对象**（Corrêa–Noja arXiv:2606.06733v1 §2，沿用 Donagi–Witten 障碍理论框架）：𝔐̄_g^± 表示无穿孔
  超黎曼面模叠的 Deligne–Mumford 型紧化的两个宇称（自旋结构奇偶）分量。

  **定理**（Theorem 1.1 item (1)，逐字，p.1）：
  "The odd compactified genus-two component 𝔐̄₂⁻ is split."

  （回忆：分裂 ⟹ 投影，见既有节点 `math.supermoduli-space-not-projected` 术语段"every split
  supermanifold is projected"——本定理故亦蕴含 𝔐̄₂⁻ 可投影。）

  **证明方法**（Theorem 3.5，§3）：典范的亏格二对合作用在障碍层（obstruction sheaf）上，作用方式是一个
  非平凡特征标；这迫使第一障碍类在通过一个有限 étale 覆盖后必须消失，从而给出分裂性（惯性特征标判据，
  §2 一般引理的具体应用）。

  **本节点不断言**：紧化亏格二**偶**分量（见 `math.supermoduli-compactified-genus-2-even-not-projected`）
  与 g≥3 情形（见 `math.supermoduli-compactified-genus-geq3-not-projected`）——那是本文 Theorem 1.1
  的另外两项，依赖结构不同，分别单独建卡。
