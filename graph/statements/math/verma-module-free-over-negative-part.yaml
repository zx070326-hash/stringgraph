id: math.verma-module-free-over-negative-part
kind: proposition
title: Virasoro Verma 模作为 U(vir₋)-模自由、秩 1：PBW 基、dim V_N = p(N)、V(c,h) ≠ 0
statement: |
  设 F 是特征零的域，c, h ∈ F。取 Virasoro 代数的三角分解
    vir = vir₋ ⊕ vir₀ ⊕ vir₊,   vir_± := span_F{ L_n : ±n > 0 },  vir₀ := span_F{ L_0, C },
  与最高权 λ ∈ vir₀* 定义为 λ(C) = c、λ(L_0) = h。记 V(c,h) 为对应的 Virasoro Verma 模
  （worldsheet.verma-module-v2 的 U(vir)/J(c,h)；等价的万有性质刻画见 sources 中的 Definition 12.2），
  |c,h⟩ 为其最高权向量。则：

  **(1) 自由性**：V(c,h) 作为左 U(vir₋)-模是**自由的、秩 1**，以 |c,h⟩ 为自由基；等价地
      U(vir₋) ⟶ V(c,h),  u ↦ u·|c,h⟩
  是 U(vir₋)-模同构。

  **(2) PBW 基**：作为 F-向量空间，V(c,h) 有基

      ( L_{-n_m} L_{-n_{m-1}} … L_{-n_1} |c,h⟩ )_{ m ∈ N,  1 ≤ n_1 ≤ n_2 ≤ … ≤ n_m }

      （m = 0 的空积即 |c,h⟩）。

  **(3) 分级维数**：记 V_N 为 L_0 本征值 h + N 的分量。上述基元中落在 V_N 的恰是
      n_1 + … + n_m = N 的那些，它们与 N 的整数**分拆**一一对应，故
        dim_F V_N = p(N)   （p 为分拆函数，p(0) = 1），
      特别地每个 V_N 有限维。

  **(4) 非零性**：由 (3) 的 N = 0 情形 dim_F V_0 = 1，故 |c,h⟩ ≠ 0，于是
        V(c,h) ≠ 0   对**所有** (c, h) ∈ F² 成立。

  【范围】(1)–(4) 与 (c,h) 的取值无关，**与 Verma 模是否不可约无关**：奇异向量、
  不可约商 L(c,h) 的维数都不是本节点的内容（判据是 Kac 行列式，见 worldsheet.kac-determinant）。

  【与 worldsheet.verma-module-pbw-basis 的分工】本节点是**代数侧的核心内容**，按来源
  （Kytölä §12）的设定与记号陈述；worldsheet.verma-module-pbw-basis 是**本项目面向弦论的卡片**，
  额外承载形式特征标 q^h ∏(1−q^n)^{-1}、项目自身的排序写法与 Lean 形式化状态的记账，
  并由 worldsheet.verma-module-pbw-basis--via-pbw 依赖本节点。见本节点 notes。
uses_conventions: [conv.virasoro-standard, conv.verma-module-notation]
sources:
  - ref: virasoro-lean-2025
    loc: "§12, p. 11 正文（无编号）；定义见 Definition 12.2 与 Lemma 12.3，Virasoro 情形见 Definition 12.4"
    note: |
      **L1 逐页读图（researcher 2026-09-11，literature/extractions/math-sources.md §16.3）**。
      p.11 的那句话逐字是：「From the Poincaré–Birkhoff–Witt (PBW) theorem, it can be seen that a basis of
      𝒱_{c,h} is (ℒ_{−n_m} ⋯ ℒ_{−n_1} v_{c,h})_{m∈ℕ, 1≤n_1≤⋯≤n_m}.」
      ⚠ **这句话没有编号**：它是 §12 的正文散文，夹在 Definition 12.5 与 Corollary 12.6 之间，
      **不是 Lemma / Proposition / Theorem**。`loc` 只能写「§12, p. 11 正文（无编号）」，
      **不得写「Kytölä Lemma 12.x」**。
      配套编号：Definition 12.2 用万有性质定义 Verma 模；Lemma 12.3 给出 M_λ := 𝒰(𝔤)/I_λ 的实现
      （I_λ 是由 H − λ(H)1（H ∈ 𝔤₀）与 X（X ∈ 𝔤₊）生成的左理想），与本图
      worldsheet.verma-module-v2 的构造是同一个；Definition 12.4 给出 Virasoro 的三角分解与 𝒱_{c,h}。
      记号对照：Kytölä 写 ℒ_n、C、v_{c,h}、𝒱_{c,h}、𝔳𝔦𝔯_±，本节点写 L_n、C、|c,h⟩、V(c,h)、vir_±。
tags: [algebra, lie-algebra, representation-theory, verma-module, pbw, virasoro, math-input]
notes: |
  【记号约定（curator 2026-09-11 补）】uses_conventions 新增 conv.verma-module-notation：
  本图记 V(c,h)、最高权向量 |c,h⟩，对照 Kytölä 𝒱_{c,h} / v_{c,h}、Lian–Zuckerman M(c,h)、
  Humphreys Z(λ)。**statement 文本未改**（原则 1），该约定只是把已在用的记号显式化并给出对照表。

  **★ 合并记录（2026-09-11，lead 裁决）：worldsheet.verma-module-pbw-basis 已 superseded_by 本节点**，
  其推导 worldsheet.verma-module-pbw-basis--via-pbw 已删除。两卡的 (1)(2)(3) ↔ (1)(2)(3)(4) 逐条重叠；
  取本节点的理由是**来源更好**（那张卡的三条 sources 没有一条是可核实的命题级定位：kac-1979 分节号未核实
  且 sources.bib 对该 key 指向哪一篇存疑、kac-raina-1987 只到主题一级、stringformal-2026 只是形式化状态登记；
  本节点的 virasoro-lean-2025 §12 p.11 是 L1 逐字转录）。
  原先指向那张卡的三条 depends_on 已改指本节点：worldsheet.kac-determinant-v2--via-feigin-fuchs、
  worldsheet.no-ghost-theorem-brst--via-fgz、worldsheet.no-ghost-theorem-subcritical--via-lian-zuckerman。
  ⚠ **本节点 statement 末尾的【与 worldsheet.verma-module-pbw-basis 的分工】一段已过时**：
  那张卡不再是「本项目面向弦论的卡片」而是被本节点取代的历史快照，其推导 --via-pbw 不复存在。
  按项目原则 1，statement 文本**不改**；该段应读作历史记录。
  合并时该卡有两处内容未被本节点承载，已分别安置（详见本节点推导 --via-pbw-theorem 的 notes）：
  (i) **形式特征标** Σ_N p(N)q^{h+N} = q^h ∏_{n≥1}(1−q^n)^{-1}（本节点只到 dim_F V_N = p(N)，
      差一个无来源、无节点的 Euler 分拆恒等式；唯一用到它的下游
      worldsheet.no-ghost-theorem-subcritical--via-lian-zuckerman 已单列 gap）；
  (ii) **下标排序写法**（旧卡 n_1 ≥ … ≥ n_k vs 本节点 1 ≤ n_1 ≤ … ≤ n_m，**同一组基元**，只是反向标号）。
  本节点推导现另挂一条记账边到 worldsheet.verma-level-spanned-by-partitions（formalized 的 straightening 一半）。

  **本节点为什么按「无编号正文」立卡**：researcher 第三轮扫过多份来源后的结论是——
  「Verma 模作为 U(n₋)-模自由秩 1」在文献里**多半根本没有编号**，它要么被写进 Verma 模的定义
  （例如把 V_{h,c} 直接定义成「freely generated by Vir_{<0}」），要么被当作 PBW 的即时推论一笔带过
  （Kytölä §12 就是后者）。**不要去找一条并不存在的「Theorem X.Y」**
  （math-sources.md §16.5）。这与 math.locality-ope-equivalences-v2 那边「Gui 的三版等价没有编号定理」
  是同一种处理。

  ⚠ **不要引 Humphreys 做本节点的来源**（researcher 的核心判断，math-sources.md §16.1–§16.2）：
  Humphreys GTM 9 全书讲的是「代数闭特征零域上的**有限维半单**李代数」，用根系 Φ、Borel B、记号 Z(λ)；
  **Virasoro 不在其适用范围内**（无限维、非半单、无有限根系）。而且本轮核实显示，任务书原先给的
  候选定位 **§20.3 指向的是「最高权定理」**（不可约表示有最高权 / 同权则等价 / dominant integral 的实现），
  **不是**「M(λ) 作为 U(n₋)-模自由秩 1」。故 Humphreys §20.3 在本项目记为「候选、编号未核实」，
  **不入本节点的 sources**。Humphreys 只在上游 math.pbw-theorem 处被引，那是 PBW 本体。

  **仍然缺一条带编号的一手来源（Q17）**。按性价比排的下一轮候选：
  ① Iohara–Koga, *Representation Theory of the Virasoro Algebra* (2011)（主题最对口，目录含
     「Verma Modules I/II」）；② Moody–Pianzola, *Lie Algebras with Triangular Decompositions* (1995)
     （三角分解框架正好覆盖 Virasoro）；③ Feigin–Fuks 1984（经典原始出处）。
  三者本轮**都没有公开可读全文**，一律未登记进 sources.bib。

  **记号统一的待办**：Humphreys 写 Z(λ)、𝔊(L)；Kytölä 写 M_λ / 𝒱_{c,h} / 𝒰(𝔤)；lian-zuckerman-1991
  又是第三套。researcher 建议在 graph/conventions/ 加一条 `family: verma-module-notation`，
  否则 M(λ) / Z(λ) / 𝒱_{c,h} 在图里会被当成三个东西。本批**未做**（约定节点属于全图级改动，
  留给 lead 裁决）。

  **形式化状态（读取日期 2026-09-11）**：本节点**不能**标 formalized。Kytölä 在同一页逐字写
  「These statements about explicit bases of Verma modules are **not yet formalized**, since **Mathlib
  does not currently have the PBW theorem**.」他的 VirasoroProject 已形式化了 Verma 模的理想商构造
  （vermaIdeal、VermaModule、VermaModule.hwVec、VermaModule.universalMap、IsVermaModule），
  **唯独缺显式 PBW 基**。⇒ 形式化侧的缺口是**精确的一条：Mathlib 的 PBW 定理**
  （作者本人称之为 "a major undertaking"），不是整套 Verma 模理论。见 math.pbw-theorem 的 notes。

  **【2026-09-11 补，curator-euler】特征标的组合学部分（Euler 恒等式）已形式化；
  剩余缺口纯粹是 PBW 下界（`formal/TODO.md` 的 pbw-verma (b)）。** 具体地，
  Verma 模的形式特征标 ch_q V(c,h) = q^h ∏_{n≥1}(1 − q^n)^{−1} 由两块拼成：
  (α) 本节点 (3) 的 **dim_F V_N = p(N)**，以及
  (β) Euler 分拆生成函数恒等式 **Σ_{N≥0} p(N) q^N = ∏_{n≥1}(1 − q^n)^{−1}**。
  (β) 现已单独立卡并 **formalized**：math.euler-partition-generating-function
  （`StringFormal.Math.partitionGF_mul_tprod_one_sub_X_pow`，
  `formal/StringFormal/Math/EulerPartition.lean`，任意交换环上成立，公理检查通过）。
  (α) 的**上界** dim_F V_N ≤ p(N)（straightening）也已 formalized，见
  worldsheet.verma-level-spanned-by-partitions。
  ⇒ 因此本节点距离 formalized 的缺口不再包含任何组合学或形式幂级数内容，
  **只剩线性无关那一半（PBW 下界 dim_F V_N ≥ p(N)，以及由它推出的 (1) 自由性与 (4) 非零性）**，
  而那一半的唯一障碍是 Mathlib 没有 PBW 定理（见上一段与 math.pbw-theorem 的 notes）。
  唯一用到特征标的下游 worldsheet.no-ghost-theorem-subcritical--via-lian-zuckerman 相应地
  已新增一条非 inferred 的边指向 (β)，其「Euler 恒等式无节点无来源」的 gap 已关闭。

  【2026-09-11 补，curator：(4) 非零性在自然数 c ≥ 2、任意 h 处现有第二条、与 PBW 无关的证明
  ——不改变本节点距 formalized 的缺口，只是记一笔独立复核】
  `formal/StringFormal/Virasoro/FockFreeLowLevel.lean` 证了
  `hwv_ne_zero_of_two_le [Nontrivial R] (hD : 2 ≤ D) (hw : R) : hwv R (D:R) hw ≠ 0`：
  对**任意自然数 D ≥ 2**（经 `(D:R)` 嵌入到交换 ℚ-代数 R）与**任意** h : R，取洛伦兹符号向量
  η = diag(−1,+1,…,+1)（`lorentzSign`）与零模参数 a = (h−½, h+½, 0,…)（`weightZeroMode`），
  使 Fock 真空的权恰为 h（`vacuumWeight_weightZeroMode`），再用 Fock 真空经 `vermaToFock`
  的原像非零（`hwv_ne_zero`，因为 vermaToFock 把它送到 Fock 真空 1 ≠ 0）。**η 的不定性是
  证明的关键**：Lean 文件头逐字注明「with a positive definite η only h of the form ½∑a_μ²
  would be reachable」——只有洛伦兹号差（至少一个负号）才能让这个构造触达**任意** h（含负值）。
  这是本节点 (4) 在**c 取自然数（经典型 c = D 维自由玻色子中心荷）、任意 h** 这一子集上的
  **第二条独立证明**，走的是「在一个具体表示（Fock 空间）里造非零向量」而不是「PBW 下界」，
  与本节点 (1)–(4) 的证明路线（三角分解 + PBW 基计数）完全不同。
  ⚠ **这不缩小本节点距 formalized 的缺口**：(a) 只覆盖 c ∈ N（经嵌入），不是任意域元素 c ∈ F；
  (b) 只证 (4)，不触及 (1)(2)(3)（自由性、PBW 基、dim V_N = p(N)）——非零性不蕴含自由性；
  (c) 依赖一个具体的表示实现（Fock 空间）而非对任意抽象 Verma 模的论证。
  图侧记账：该 Lean 引理与其在图上的落点详见
  worldsheet.fock-module-free-over-negative-virasoro-low-level 与
  worldsheet.shapovalov-form-existence 的 notes；本节点只记录「(4) 的一个特殊子情形现有第二条
  独立证明」这一事实，不据此修改 statement 或 status。
