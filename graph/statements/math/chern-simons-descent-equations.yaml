tags: [chern-weil, transgression, chern-simons, descent-equations, differential-forms, brs]
notes: |
  【1. 本卡与 GS 记号的换标】来源用 `Tr Fⁿ = dω⁰_{2n−1}`；green-schwarz-1984 用
  `dω⁰_{2n+1 Y} = tr F^{n+1}`。两者**是同一族方程**，换标为 **n_Zumino = n_GS + 1**：
  GS 的 ω⁰_{3Y} = 本卡 n = 2 的 ω⁰_3，GS 的 ω⁰_{7Y} = 本卡 n = 4 的 ω⁰_7，
  GS 的 ω¹_{2n Y} = 本卡的 ω¹_{2n}（下标本身不变）。这条换标写在 consistency.descent-forms-gs-notation。

  【2. ★ GS 1984 的下降方程符号就是本卡的符号（L1 核实）】green-schwarz-1984 的
  (5)(6)(15)(16) 与本卡主来源逐字同一，包括三处符号：
    · GS (5) `ω⁰_{3Y} = tr(AF − ⅓A³)` = 本卡 (ii) 的 n = 2 特例（连 `−⅓` 都一样）；
    · GS (6)(15) `dω⁰ = tr F^{n+1}` **正号、无 2π、无数值因子** = 本卡 (ii)；
    · GS (16) `δω⁰_{2n+1 Y} = − dω¹_{2n Y}` = 本卡 (iii) 的 p = 0 行。
  ⇒ GS (15) 后那句「Explicit expressions for ω⁰_{2n+1 Y} are given in ref. [9]」外包出去的东西，
  在本卡主来源里就是 (2.29)/(5.7)。**这条判定是在 Les Houches 讲义上核实的，不是在 ZWZ 上核实的。**

  【3. Tr 的表示无关性与约定卡的关系】本卡声明 conv.gauge-trace-normalization 是为了固定
  **微分形式那一半**（F = dA + A²、楔号省略、A 是反厄米矩阵一形式）。该约定卡里 tr（基本表示）与
  Tr（伴随表示）之分**在本卡不起作用**：(i)(ii)(iii) 对任一 Ad-不变迹都成立。
  来源另用对称化迹 Str（其 (3.35)），本卡不区分，因为在 Tr Fⁿ 这类表达式里 F 是偶次形式、互相交换。

  【4. 记号沿革】现代文献常把这两族写成 Q_{2n+1}(A, F) 与 Q¹_{2n}，把整套关系叫
  **「Stora–Zumino 下降方程」**。文献学上这个名字是有理由的：本卡主来源开篇逐字把主要功劳给
  参考文献 `[1] R. Stora and B. Zumino, in preparation`，而该文**从未以此形式发表**；
  Stora 一线的通行发表形态是 manes-stora-zumino-1985。⇒ **下降方程的「原始出处」在文献学上是分叉的。**

  【5. 换代记录】本卡与 consistency.descent-forms-gs-notation、
  consistency.descent-omega1-is-consistent-anomaly 一起接手了旧卡
  **consistency.descent-forms-chern-simons**（已 superseded_by 后者）的内容：
  旧卡把「纯微分几何的下降方程」「GS 的标号与引力侧代换」「反常识别」三件事写在一张定义卡里，
  按 graph/CLAUDE.md「一个节点一个命题」拆开。
