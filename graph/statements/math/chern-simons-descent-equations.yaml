id: math.chern-simons-descent-equations
kind: proposition
title: Chern–Weil transgression 与下降方程组：Tr Fⁿ = dω⁰_{2n−1}，δω^p + dω^{p+1} = 0
statement: |
  设 𝔤 是矩阵李代数，A 是取值于 𝔤 的矩阵一形式，

      F := dA + A²        （楔号一律省略，A² ≡ A ∧ A；A 的元素反交换，d 与一形式 A 反交换，d² = 0）

  Tr 是一个 Ad-不变的迹（下面所有断言与表示的选取无关）。设 n ≥ 1。

  **(0) 设定与有效范围（本卡涵盖以下两种意义，二者的断言相同）**

  (a) **代数意义**：把 A、F 当作自由分次微分代数的生成元，所用关系**只有**
      dA = F − A²、dF = FA − AF、d² = 0，不假设任何对易关系、对称性或不变性。
  (b) **局部几何意义**：在 x-空间的某个**有限坐标邻域**上，A 是主丛的一个局部联络表示
      （底空间上的规范势），F 是其曲率。

  ★ **本卡不断言全局版本。** 唯一被本项目逐页核实的来源对此有逐字限定：
  「Equations such as (2.24) and (2.26) are really valid only locally, in some finite neighborhood
  in x-space. It is however well known that they can be given a global meaning by using a connection
  on a principal fibre bundle, rather than a vector potential on the base (x-space).」

  **(i) 闭性**

      DF := dF + [A, F] = 0            （Bianchi 恒等式）
      d Tr Fⁿ = n Tr((dF) F^{n−1}) = n Tr((DF) F^{n−1}) = 0

  **(ii) transgression（Chern–Simons 形式）**

  置 A_t := tA（t ∈ [0,1]），F_t := dA_t + A_t² = tF + (t² − t)A²，并定义

      ω⁰_{2n−1} := n Tr ∫₀¹ dt A F_t^{n−1}

  则

      **Tr Fⁿ = d ω⁰_{2n−1}.**

  显式特例：
      n = 2:  ω⁰_3 = Tr(A dA + ⅔ A³) = Tr(A F − ⅓ A³)
      n = 3:  ω⁰_5 = Tr(A (dA)² + (3/2) A³ dA + (3/5) A⁵)

  ★ ω⁰_{2n−1} **只由 Tr Fⁿ = dω⁰_{2n−1} 定到相差一个恰当形式**；上式给出的是一个具体代表元
  （transgression 代表元）。

  **(iii) 下降方程组**

  设 g 取值于群，记

      𝒜 := g⁻¹A g + g⁻¹ dg,    v := g⁻¹ δg,    ℱ := d𝒜 + 𝒜² = g⁻¹F g

  其中 d = dx^μ ∂/∂x^μ 沿 x 方向、δ = dt^α ∂/∂t^α 沿群参数方向（t^α 是群元所依赖的任意参数），
  且 d² = δ² = dδ + δd = 0，Δ := d + δ 满足 Δ² = 0；v 是取值于 𝔤 的**零次 x-形式、一次 δ-形式**，
  满足 δ𝒜 = −dv − v𝒜 − 𝒜v ≡ −Dv 与 δv = −v²。

  把 ω⁰_{2n−1}(𝒜 + v, ℱ) 按 v 的幂次展开

      ω⁰_{2n−1}(𝒜 + v, ℱ) = ω⁰_{2n−1}(𝒜, ℱ) + ω¹_{2n−2} + ω²_{2n−3} + ⋯ + ω^{2n−1}_0

  （**上标 = v 的幂次，下标 = x-形式次数**）。则

      **δ ω^p_{2n−1−p} + d ω^{p+1}_{2n−2−p} = 0   (p = 0, 1, …, 2n−2),**
      **δ ω^{2n−1}_0 = 0.**

  第一行取 p = 0 即 **δ ω⁰_{2n−1} = − d ω¹_{2n−2}**。

  显式特例：
      n = 2:  ω¹_2 = Tr(v dA)
      n = 3:  ω¹_4 = Tr(v d(A dA + ½ A³))

  每个 ω^p 同样只定到相差恰当形式：把 ω^p ↦ ω^p + dη^p + δζ^p 作相容重定义后方程组仍成立。

  **本卡不含**

  (a) 任何**物理**内容：v 在本卡纯粹是群参数方向的一形式，本卡**不**断言它是 Faddeev–Popov 鬼场、
      **不**断言 δ 是 BRS 算子、**不**断言 ω¹_{2n−2} 是规范反常。那条识别是
      consistency.descent-omega1-is-consistent-anomaly（physical-argument）。
  (b) **唯一性**：本卡不断言 δω⁰ = −dω¹ 的解在恰当形式之外唯一，也不断言 ω¹ 是 Wess–Zumino
      相容条件的**最一般**解。见该 consistency 卡与其推导的 gaps。
  (c) 任何**绝对归一化**：本卡的 ω 全部**未归一**（不含 i、2π、(4π)^{n−1} 之类因子）。
      来源 §5 给出的绝对归一化式 (5.13) 因读图不可靠且原文在该式上方**手写插注「(up to a sign)」**，
      本图**不采信、不转录**（抽取记录 §3.2）。
  (d) **引力/洛伦兹侧**（自旋联络 ω、曲率 R、tr R²、ω⁰_{3L}）：来源全文只处理内部对称群，
      不含引力。GS 记号下的洛伦兹一路见 consistency.descent-forms-gs-notation。
  (e) ω¹_{2n−2} 的一般积分公式（来源 (3.36)）：抽取记录 §3.2 判定该式的前置因子与末项指数**读图不可靠**，
      本图只收上面 n = 2、n = 3 两个清晰的显式特例。
  (f) 同伦算子 k 的性质 k² = 0：来源逐字把它留作「exercise to the reader」，见推导 gaps。
      本卡的 (i)(ii)(iii) 三条**都不使用** k² = 0。
