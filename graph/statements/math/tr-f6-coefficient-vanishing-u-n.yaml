id: math.tr-f6-coefficient-vanishing-u-n
kind: proposition
title: Ω₁₂ 中 tr F⁶ 的系数为 n：U(n) 时对一切 n ≥ 1 恒不为零
statement: |
  设 𝔤 = **u(n)**，F 是取值于 𝔤 的二形式（conv.gauge-trace-normalization）。
  记 **tr** 为 n 维基本表示的迹，**Tr** 为伴随表示的迹，Ω₁₂ := Tr F⁶。则

    Ω₁₂ = n · tr F⁶ + 15 · tr F² · tr F⁴

  即 **tr F⁶ 的系数是 n 本身**，对一切 n ≥ 1 **恒不为零**。

  这是 math.so-usp-adjoint-fundamental-trace-identities 里 Ω₁₂ = (N + 32l) tr F⁶ + 15 tr F² tr F⁴
  在 **l = 0**（U(n) 支）时的特例，但该节点的陈述明写「u(N) 等未涉及」，
  故本节点单独承载 U(n) 支（项目原则 1：一个节点一个命题）。

  **本节点不断言**：
  (a) 系数为零/不为零在物理上意味着什么（是否能被局域反项抵消）——那是物理判断；
  (b) l = 0 与「U(n) 支」这一记号对应本身的来历（见 math.so-usp-adjoint-fundamental-trace-identities
      notes 第 4 条关于 l = η 世界面扭转因子的讨论，本节点不重复）。
uses_conventions:
  - conv.gauge-trace-normalization
