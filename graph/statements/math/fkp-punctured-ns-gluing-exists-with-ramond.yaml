    loc: "Lemma 7.9 陈述与 (7.8)/(7.9)，p.47-48；印刷证明，p.48（'we have an isomorphism
      L≅Hom(L,ω_C)'，即 (2.5) 的 r=0 情形）；Lemma 2.6 / eq.(2.5)，p.7（广义自旋结构的一般
      定义，带 Σr_i 扭转）"
tags: [supermoduli, boundary-divisor, node-locality, fkp-errata, math-input]
notes: |
  【查重】`uv run stringgraph search "gluing"` / `"generalized spin structure"` 均无同内容命中
  （2026-09-24）；唯一相关既有节点 math.fkp-ns-boundary-gluing-normal-bundle-formula 记账的是
  下游的法丛公式（Theorem C），不涉及粘接态射本身是否存在这一更上游的问题，故不重复。

  【立卡理由】同姐妹卡 math.fkp-punctured-fundamental-sequence-ramond-twisted：这是 [FKP-A]
  (7.8)/(7.9) 赖以存在的基础引理，一般 Ramond 穿孔情形下 [FKP-A] 印刷证明有缺口，本节点独立补证。
