notes: |
  【本卡的形成过程，供审计】2026-09-24，两个独立的原创证明尝试 `fkp-79-ramond-twist` 与
  `fkp-96-punctured` 由两个并行 curator 各自毕业进图，各建了一张内容相同的陈述卡
  （`math.fkp-ramond-twist-ns-gluing-well-defined` 与本卡）。因并行，双方查重都查不到对方。
  lead 合并时按原则 1（一条陈述一张卡，可挂多个独立推导）合为本卡，保留两条推导；前者的陈述卡
  已删除（建卡当天、无任何节点依赖、未进里程碑、未标 formalized，按原则 1 就地处理，不留
  superseded 尾巴）。

  【合并时发现并解决的实质分歧】两张原卡对 Ramond 穿孔数的范围写法不同：`fkp-96` 卡写「任意**偶数**
  n_1,n_2≥0」（多加了一条 [FKP-A] 未对该对象声明的宇称假设），`fkp-79` 卡写「任意 n_i≥0」（隐含
  断言奇 n_R 的源对象非空，正踩在抽取记录 E4 登记的未决问题上）。**两者均未采用**：本卡改为条件式
  陈述并在范围红线 (a) 显式记录该未决问题。这是合并带来的净收益，不是任一原卡的内容。

  【查重】两个 curator 各自跑过 `uv run stringgraph search` 的 "gluing" / "Ramond puncture" /
  "generalized spin structure" / "supercurve" / "FKP" / "canonical line bundle"（2026-09-24），
  除彼此外无覆盖本命题的既有节点。`math.fkp-ns-boundary-gluing-normal-bundle-formula` 记账的是
  下游的法丛公式（Theorem C），不涉及粘接态射本身是否存在这一更上游的问题。

  【与既有卡的关系，待 lead 后续处理】
  `graph/derivations/math/supermoduli-compactified-punctured-genus-{2,geq3}-not-projected--via-elliptic-tail-punctured-gluing.yaml`
  两卡的 `gaps` 各记有一条 [GAP-FKP-RAMOND]（"未独立重写该局部计算"），本卡即该缺口的独立证明。
