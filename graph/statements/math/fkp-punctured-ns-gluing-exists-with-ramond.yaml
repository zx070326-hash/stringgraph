id: math.fkp-punctured-ns-gluing-exists-with-ramond
kind: proposition
title: "沿 NS 穿孔粘接两族带 Ramond 穿孔的稳定超曲线仍是稳定超曲线族（FKP Lemma 7.9 的一般 Ramond 情形；FKP 印刷证明只覆盖 R=R'=∅ 子情形）"
statement: |
  【对象与记号，取自 Felder–Kazhdan–Polishchuk arXiv:2006.13271v3（记 [FKP-A]）Definition 2.4
  (p.6)、Lemma 2.6 与 (2.5) (p.7)、§7.5 (pp.47–48)。本节点全程只用 [FKP-A] §7.5 起的**分号记号**
  \overline{\mathcal S}_{g;m,n}（m = NS 穿孔数，n = Ramond 穿孔数，与同文 §8.4/(8.11) 的 "m" 用法
  一致）；[FKP-A] 从未声明此记号与 §1/§5 的逗号记号 \overline{\mathcal S}_{g,n_NS,n_R} 相等，
  本节点也不作此等同。所有模叠均为**紧化**对象（[FKP-A] Theorem A 意义下表示稳定超曲线函子的
  光滑固有 DM 叠，记号带上划线）；本节点不涉及未紧化叠的任何断言。】

  设 S 是偶超概形，
    (X/S; P, P_1,…,P_{m_1}; R_1,…,R_{n_1})，(X'/S; P', P'_1,…,P'_{m_2}; R'_1,…,R'_{n_2})
  是 [FKP-A] Definition 2.4 意义下两族带穿孔的稳定超曲线，P⊂X、P'⊂X' 各是一个待粘接的 NS 穿孔。
  设
    Z := X ⊔_{P≃S≃P'} X'
  按 [FKP-A] §7.5 的构造粘接，赋予穿孔 P^Z_• := j(P_•)⊔j'(P'_•)、R^Z_• := j(R_•)⊔j'(R'_•)，
  R_tot := Σ_i R^Z_i，并令
    δ_Z: O_Z → j_*O_X ⊕ j'_*O_{X'} --(j_*δ_X)⊕(j'_*δ_{X'})--> j_*ω_{X/S}(R) ⊕ j'_*ω_{X'/S}(R')
          --ι--> ω_{Z/S}(R_tot)，
  其中 ι 是分支对偶化层的典范无留数（trace）包含，被可逆层 O_Z(R_tot) 扭转。

  【命题】(Z, 剩余 NS 穿孔, R_tot)/S 是 Definition 2.4 意义下一族带穿孔的稳定超曲线——
  **不需要假设 R=R'=∅**；即 δ_Z^- 在每个几何纤维上诱导 O_Z^- ≅ ω_{Z/S}(R_tot)^-，判据 (2.4) 成立。
  特别地，[FKP-A] 的粘接态射
    \overline{\mathcal S}_{g_1;m_1+1,n_1} × \overline{\mathcal S}_{g_2;m_2+1,n_2}
      ⟶ \overline{\mathcal S}_{g_1+g_2;\,m_1+m_2,\,n_1+n_2}                        …(7.8)
    \overline{\mathcal S}_{g;m+2,n} ⟶ \overline{\mathcal S}_{g+1;m,n}              …(7.9)
  作为超叠之间的态射存在，**对源叠非空的任意 (m_i, n_i)**，不限于 n_1=n_2=0。

  【与 [FKP-A] 原文的关系——本节点存在的理由，措辞需精确】命题本身（(7.8)/(7.9) 对一般 (m_i,n_i)
  存在）正是 [FKP-A] 逐字陈述的 Lemma 7.9 (p.47) 与 (7.8)/(7.9) (p.48)：[FKP-A] **从未**把粘接
  态射的定义域限制在 R=∅。但 [FKP-A] 印刷的 Lemma 7.9 证明 (p.48) 把 Z 上的广义自旋结构写成
  L ≅ Hom(L, ω_C)（**不带**穿孔扭转，逐字抄自同文 Remark 2.3 p.5，而非本应引用的 Lemma 2.6 /
  (2.5) p.7 的带 Σr_i 扭转形式——同一篇论文两条公式之间的抄错，非概念错误）。因此**印刷证明只对
  R=R'=∅ 建立了这条命题**。这是一处「**证明只覆盖子情形**」的缺陷，**不是**命题本身有误，也**不是**
  纯印刷错字；本节点独立补证一般情形（本项目记录为 [GAP-FKP-RAMOND]）。

  判定的决定性机制：Definition 2.4 的第一个条件要求 NS 穿孔与 Ramond 穿孔**不相交**（disjoint），
  故被粘接的节点 z 自动不落在 Ramond 除子支集内，Ramond 扭转在节点邻域被重言截面**典范平凡化**，
  退化为 [FKP-A] 自己那句无出处的 "It is well known that…"（两条独立推导各自顺带证明了这句话）；
  在节点之外，带扭转的结论逐字就是假设 (2.5) 本身。不需要 Definition 2.4 之外的任何额外条件。

  【范围红线——本节点明确不断言】
  (a) **不断言任何 (m_i, n_i) 下源叠非空**。特别地，Ramond 穿孔数 n 是否必须为偶数，在 [FKP-A]
      中是**未判定**的：该文 §2.6 (pp.13–14) 那句 "n_R is necessarily even" 逐字只附着于
      [22]/[23] 此前研究的**经典**对象 S_{g,n_NS,n_R}，[FKP-A] 正文从未对自己构造的
      \overline S_{g,n_NS,n_R} 声明该约束（见 literature/extractions/felder-kazhdan-polishchuk-2020.md
      条目 E4，两种读法 (a)/(b) 未判定，已登记为未决问题）。本节点是**条件式**陈述：凡源对象存在，
      粘接结果即为稳定超曲线族；源对象在哪些 (m_i,n_i) 下存在，不在本节点射程内。
  (b) 不涉及沿 **Ramond** 穿孔的粘接（[FKP-A] §7.6，态射 (7.11)/(7.12)）——那里节点邻域与 Ramond
      除子相交，上述局部平凡化机制整体失效。
  (c) 不涉及 [FKP-A] Lemma 7.10（独立陈述，原文已在带穿孔一般性下证明）。
  (d) 不断言既有节点 `math.fkp-ns-boundary-gluing-normal-bundle-formula`（[FKP-A] Theorem C 的
      法丛公式）对带穿孔靶成立——那是不同的、更下游的命题，与本节点互不蕴含。
