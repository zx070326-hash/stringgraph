    loc: "§11.5 'Current algebras', eq. (11.5.1)–(11.5.8) 与 (11.5.13), pp. 66–68（(1,0) 流的 OPE、Laurent 模、模代数、零模构成 g、Jacobi ⇒ k^{ab} = k̂ d^{ab}、命名句、[L_m, j_n^a] = −n j_{m+n}^a、level k = 2k̂/ψ²）"
    note: |
      L1（抽取记录 literature/extractions/polchinski-1998-v2.md E60；式号与公式逐字读自原书页图 pp. 66–68）。
      原书从 (11.5.1) 到 (11.5.3) 的过渡用的是 Laurent 展开 + 围道（Vol.1 (2.6.14) 的字典），
      本卡在 uses 里挂 worldsheet.ope-commutator-dictionary。
      「Dimensionally, the z^{−2} term must be a c-number …」是原书对 (11.5.1) 形式的全部论证。
tags: [current-algebra, affine-lie-algebra, kac-moody, cft, definition, lie-algebra]
notes: |
  【为什么 status 是 physical-argument 而不是 rigorous】本卡把「流代数」定义为**CFT 里 (1,0) 流的 OPE**
  (11.5.1)，并断言其 Laurent 模满足 (11.5.3)。前者依赖 worldsheet.operator-product-expansion
  （physical-argument），后者经 worldsheet.ope-commutator-dictionary（围道变形，physical-argument）。
  **单独看 (11.5.3)–(11.5.7) 是一条严格的李代数定义**（有限个生成元关系 + Jacobi）；
  若形式化或数学侧需要纯代数版的仿射 Kac–Moody 代数（Kac 的 ĝ = g ⊗ C[t,t^{−1}] ⊕ C K 定义），
  请**另建** `math.affine-kac-moody-algebra` 一类的 rigorous 定义卡并登记数学来源（Kac 1990 / Goddard–Olive 1986），
  不要给本卡升级——本卡的内容是 Polchinski 的 CFT 表述。

  【与 compact.self-dual-radius-su2-current-algebra 的关系】那张卡是本卡在 g = su(2) 的具体实现
  （自对偶半径的 j^± = e^{±2i(α')^{−1/2}X_L}，Vol.1 (8.3.14)），其 notes 明记「原书此处不展开仿射李代数的一般理论」。
  本卡就是那个一般理论的入口；本轮不给那张卡加边（它已提交，且原书 §8.3 不前引 §11.5）。

  【ψ² 的归一化未核实】(11.5.13) 的 k = 2k̂/ψ² 依赖最长根 ψ 的长度，而 Cartan–Weyl 归一化 (11.4.14) 在
  原书 pp. 61–65（抽取跳读区）。c^{g,k} = k dim g/(k + h(g)) 这类**只含 k 与 h(g) 的比值**的公式不受影响
  （k 与 h(g) 都是 ψ² 归一化下的比值），但 (11.5.21) 里显式的 (k + h(g))ψ² 受影响。

  【本卡与 U(1) 因子】(11.5.6)–(11.5.7) 只对单李代数成立；U(1) 流的归一化 (11.5.14) 与自由玻色子同构
  (11.5.15) 单列为 worldsheet.u1-current-algebra-is-free-boson。
