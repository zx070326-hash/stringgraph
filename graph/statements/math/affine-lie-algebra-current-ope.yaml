id: math.affine-lie-algebra-current-ope
kind: definition
status: physical-argument
title: 流代数 / 仿射李代数 / (仿射) Kac–Moody 代数：(1,0) 流的 OPE j^a j^b ∼ k^{ab}/z² + i c^{ab}{}_c j^c/z、模代数 (11.5.3)、单李代数时 k^{ab} = k̂ d^{ab} 与 level k = 2k̂/ψ²
statement: |
  设二维 CFT 含一组全纯的、共形权 (1, 0) 的流 j^a(z)（a = 1, …, dim g；主场）。

  **OPE 形式**。共形不变性要求它们的 OPE 具有形式
    j^a(z) j^b(0) ∼ k^{ab}/z² + i c^{ab}{}_c j^c(0)/z                     （(11.5.1)）
  （原书逐字：'Dimensionally, the z^{−2} term must be a c-number and the z^{−1} term must be
  proportional to a current.'）。

  **模代数**。Laurent 系数 j^a(z) = Σ_{m=−∞}^{∞} j_m^a / z^{m+1}（(11.5.2)）满足闭合代数
    [j_m^a, j_n^b] = m k^{ab} δ_{m,−n} + i c^{ab}{}_c j^c_{m+n}              （(11.5.3)）.
  特别地 m = 0 的模构成一个李代数
    [j_0^a, j_0^b] = i c^{ab}{}_c j_0^c                                     （(11.5.4)）,
  记为 g，于是 c^{ab}{}_c = f^{ab}{}_c 是 g 的结构常数（(11.5.5)；
  math.compact-lie-algebra-index-and-casimir 的 (11.4.1)）。
  j_1^a j_1^b j_{−1}^c 的 Jacobi 恒等式要求
    f^{bc}{}_d k^{ad} + f^{ba}{}_d k^{dc} = 0                              （(11.5.6)）,
  故对**单**李代数 g，
    k^{ab} = k̂ d^{ab}                                                      （(11.5.7)）,
  d^{ab} 为 g 的不变内积（(11.4.4)）。

  **命名**（原书逐字）：'The algebra (11.5.3) is variously known as a *current algebra*, an
  *affine Lie algebra*, or an *(affine) Kac–Moody algebra*.'

  **与 Virasoro 的关系**。流是 (1, 0) 张量，故
    [L_m, j_n^a] = −n j^a_{m+n}                                            （(11.5.8)）.

  **level 的记号**。k̂ 称为中心扩张或 Schwinger 项。取 g 的最长根 ψ（Cartan–Weyl 归一化按原书 (11.4.14)，
  **其内容本图未核实**），定义
    k := 2k̂/ψ²                                                            （(11.5.13)）
  为流代数的 **level**。本卡只把 k 作为记号引入；k̂ > 0 与 k ∈ Z_{≥0} 是两条独立命题
  （worldsheet.current-algebra-central-term-positive、worldsheet.current-algebra-level-quantization）。

  **本卡不断言的内容**：
    (1) 不断言 k̂ 的正性或 k 的整数性（见上）；
    (2) 不断言存在由流构造的能动张量（Sugawara，worldsheet.sugawara-central-charge）；
    (3) 不断言 U(1) 情形与自由玻色子的同构（worldsheet.u1-current-algebra-is-free-boson）；
    (4) 不断言 (11.5.3) 作为抽象李代数的任何结构定理（Kac 意义下的仿射代数理论不在本卡）。
