id: math.supermoduli-ramond-components-compactified-connected
kind: proposition
title: "紧化广义自旋曲线模叠 S̄_{g;n,2r}（FKP 自身紧化，r≥1）连通：一条不依赖紧化认定的独立路线"
statement: |
  【紧化的身份，与姐妹卡一致】本卡断言的紧化对象仍是 **FKP 自己构造的紧化**
  S̄_{g;n,2r}（玻色截断层面）及其超叠 𝔖̄_{g;n,2r}（允许 NS 节点与 Ramond 节点的稳定
  退化）。本卡**不涉及** Jarvis (2000) 的无挠层紧化，也**不需要**二者同构这一未核实命题
  （`[GAP-JARVIS-COMPACT]`）——本卡的证明完全建立在姐妹卡
  `math.supermoduli-ramond-components-light-locus-dense-in-fkp-compactification`
  （FKP 紧化内部的稠密性）与
  `math.supermoduli-ramond-components-monodromy-transitive`（未紧化轨迹的连通性）之上。

  【记号】与两张姐妹卡相同：g≥0，n≥0，r≥1，m=n+2r，2g-2+m>0。

  【命题】设 r≥1，2g-2+n+2r>0。则 S̄_{g;n,2r} 与 𝔖̄_{g;n,2r} 都是连通的（底层拓扑空间
  / π_0 层面）。

  证明：拓扑空间的连通分量在局部连通空间中是开集；S̄_{g;n,2r} 作为光滑固有 Deligne–Mumford
  叠的底空间是局部连通的。故 S̄_{g;n,2r} 的每个连通分量都是开集，因而必与稠密子集 S_{g;n,2r}
  相交（依据姐妹卡的稠密性）。于是自然映射 π_0(S_{g;n,2r})→π_0(S̄_{g;n,2r}) 是满射。
  而由另一姐妹卡，π_0(S_{g;n,2r}) 是单点，故 π_0(S̄_{g;n,2r}) 也是单点，即 S̄_{g;n,2r}
  连通。再由玻色截断与超叠底层拓扑空间相同这一事实，𝔖̄_{g;n,2r} 同样连通。

  【与 `[GAP-COMP]` 的关系——本卡不是关闭者，是第二条独立路线】
  ⚠ **本段由 lead 于 2026-09-24 就地订正**（原文把 `research/papers/supermoduli-punctured-nonprojected/paper.md`
  §10.3 的一句**过去式自述**当成该论文现行的开放问题引用，并据此声称"本卡直接回答了这个问题"。
  该引用失准，订正如下。本卡今日新建、无任何节点 `depends_on` 它、不在里程碑、未 formalized，
  按根 CLAUDE.md 原则 1 就地改，不换代。）

  事实是：paper.md §10.3 的**标题即为** "[GAP-COMP] is closed for $r\ge1$: $\overline S_{g;n,2r}$
  is irreducible"，该节已经关闭了这个缺口，且结论**比本卡更强**（不可约 ⇒ 连通）。原文被误引的
  那句 "we did not know whether … is connected" 是该节开篇对**旧版本**的追述（"An earlier version
  of this section recorded as an open gap that …"），紧接着写 "All three clauses are resolved,
  and by citation rather than by new work."

  两条路线的真实分工（这才是本卡的价值所在）：
  - **paper.md Cor 10.2（主路线，更强）**：先用 FKP Remark 2.17 认定
    \overline{\mathcal S}_{g,n_NS,n_R} 就是 [J],[JKV] 型（无挠层）紧化、明确排除
    Abramovich–Jarvis 的 twisted-curve 叠，再经 Lemma 10.1 的直接扭转把分量计数还原为
    Jarvis Thm 3.3.1，得 d=1，即**不可约**。
  - **本卡（第二条路线，较弱但前提更少）**：完全在 FKP 紧化内部完成（稠密性 + 未紧化连通性），
    **刻意不使用**上述紧化认定（本 attempt 登记为 `[GAP-JARVIS-COMPACT]`），只得到**连通**。

  为什么这条较弱的路线仍值得进图：paper.md 自己在同一节里写道 "(Earlier drafts of this paper
  carried a gap here on the opposite reading; it is withdrawn.)"——即"FKP 紧化是否就是 Jarvis 型
  紧化"这条认定本身，在本项目内部曾被按相反读法处理过。一条**不依赖该认定**的独立论证因此是对
  该处风险的保险：即使那条认定日后出问题，r≥1 的连通性仍然成立（只是拿不到不可约）。

  【与已发表结果的关系——本卡不是新数学，如实标注】本卡命题的数学内容不是本项目的新结果：
  取 Jarvis (2000) Theorem 3.3.11（连同 Note 2.1.5 所允许的模 2 平移）在 r_Jarvis=2、
  Ramond 点 m_i=1、NS 点 m_i=0 的特殊情形，分量数公式 ℓ_{g,2}(m) 的正因子个数在本卡覆盖的
  全部 (g,n,r) 情形下都等于 1，与本卡的"连通"逐格相符（对照表见来源 proof.md §10.1）。
  但 Jarvis 该定理陈述于**他自己的紧化对象**上，是否与 FKP 的紧化一致本卡未核实；
  本卡记录的是一条**完全在 FKP 紧化内部完成、不依赖那条未核实同构**的独立证明路线。

  【本卡不断言】r=0 情形的紧化方向（那需要 Cornalba 1989 的宇称延拓定理，本 attempt 明确
  不重证，直接引用既有文献）；紧化叠的不可约性或纯维数（本卡的证明只用拓扑局部连通性，
  不需要这些代数几何性质）；对应超模叠是否投影（那是另一族既有卡
  `math.supermoduli-compactified-punctured-genus-geq3-not-projected` /
  `math.supermoduli-compactified-punctured-genus-2-not-projected` 的内容，
  本卡与它们的关系见下方 notes）。
