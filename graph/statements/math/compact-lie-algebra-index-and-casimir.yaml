notes: |
  【为什么是 rigorous 定义卡】(11.4.1)–(11.4.7) 是有限维李代数与其表示的标准定义，
  无路径积分、无 OPE；「紧 ⇒ 存在正定不变内积」是标准事实（原书直接使用，不证），
  本卡把它作为**紧李代数**这一概念的一部分来陈述，不作为命题断言。
  若日后需要「半单紧李代数上正定不变内积的存在性」作为独立命题，另建卡并找数学来源。

  【生成元的厄米性约定】(11.4.1) 写 [T^a,T^b] = i f T，即 T^a **厄米**（原书未在 p. 59–60 逐字声明，
  由 exp(iθ_a T^a) 为群元读出）。这与 conv.gauge-trace-normalization（Green–Schwarz 1984 的
  **反厄米** λ^a）相差一个 i：λ^a_GS = −i T^a。本卡**不**声明 conv.gauge-trace-normalization
  ——那条约定管的是十维反常多项式的迹归一化，与本卡无交涉；若把本卡的 T_r 与
  math.so-usp-adjoint-fundamental-trace-identities 的 Tr/tr 系数对接，需在边上写 convention_map。

  【下游】§11.5 的流代数与 Sugawara 构造用到本卡的 d^{ab}（(11.5.7) k^{ab} = k̂ d^{ab}）、
  f^{ab}{}_c（(11.5.5)）、T_r（(11.5.17) 自由费米子构造的 level）、Q_r 与 Q_g（(11.5.40) 主场的权）：
  见 math.affine-lie-algebra-current-ope、worldsheet.free-fermion-so-n-current-algebra-level-one、
  worldsheet.current-algebra-primary-weights。

  【与 ch11 杂化弦卡的关系】worldsheet.heterotic-e8e8-construction 与
  worldsheet.heterotic-bosonic-construction-gauge-groups 的推导原先在 gaps 里写「§11.4 的李代数工具节
  本轮未入图」。本卡入图后那两条推导改指本卡，但本卡**只**覆盖 §11.4 前段，
  它们真正需要的 (11.4.16)/(11.4.21) 根系与 E₈ 的分支规则仍是缺口（见「本卡不断言」(3)(6)）。
  要闭合必须补读原书 pp. 61–65（同一份已落盘 PDF，抽取记录 §3.3）。
