id: math.compact-lie-algebra-index-and-casimir
kind: definition
status: rigorous
title: 李代数的结构常数、紧李代数的正定不变内积 d^{ab}、表示的指标 T_r 与 Casimir Q_r（Polchinski §11.4 前段）
statement: |
  **李代数**。生成元 T^a（a = 1, …, dim g）满足
    [T^a, T^b] = i f^{ab}{}_c T^c                                   （(11.4.1)）
  与 Jacobi 恒等式（(11.4.2)）；f^{ab}{}_c 称为结构常数。群元写作 exp(iθ_a T^a)（(11.4.3)），
  但李代数只决定群的**局部**结构（原书脚注 1，逐字：'To be precise the Lie algebra determines
  only the local structure of the group. Many groups, differing only by discrete identifications,
  will have a common Lie algebra.'）。

  **紧李代数的不变内积**。对紧群，李代数上存在正定的不变内积
    (T^a, T^b) = d^{ab}                                            （(11.4.4)）,
  其不变性 ([T, T′], T″) + (T′, [T, T″]) = 0（(11.4.5)）
  等价于「f^{abc}（用 d 升降指标）完全反对称」（原书逐字：'equivalent to the statement that
  f^{abc} is completely antisymmetric'）。d_{ab} 记 d^{ab} 的逆。

  **表示的指标与 Casimir**。设 t_r^a 是表示 r 中 T^a 的矩阵，则
    Tr(t_r^a t_r^b) = T_r d^{ab}                                    （(11.4.6)）
  定义表示 r 的**指标** T_r；
    t_r^a t_r^b d_{ab} = Q_r                                        （(11.4.7)）
  是表示 r 的 **Casimir 不变量**（与单位矩阵成正比，Q_r 记其本征值）。

  **本卡不断言的内容**（原书 §11.4 pp. 61–65 在抽取时跳读，下列式号只在 §11.5/§11.6 的引用中见到，
  内容未核实，故**不**转录）：
    (1) Cartan–Weyl 基 (H^i, E^α) 与根 α 的一般形式（(11.4.12)）；
    (2) 生成元的归一化，特别是最长根 ψ 的长度 ψ²（(11.4.14)）；
    (3) SO(n) 的根系（(11.4.16)）与 E₈ 的根系（(11.4.21)）；
    (4) 对偶 Coxeter 数 h(g) 的定义处；本图只知道它在 (11.5.21) 被使用，
        且由 (11.5.40) 的两个相等表达式可读出 h(g) ψ² = Q_g（Q_g 为伴随表示的 Casimir）——
        **这是本图的推断**，不是原书 §11.4 的逐字定义；
    (5) Sp(k) 的定义（(11.4.8)–(11.4.10)）：抽取记录只记了式号，未转录内容；
    (6) E₈ 的存在性、dim E₈ = 248、E₈ ⊃ SO(16) 与分支规则 248 = 120 + 128
        （worldsheet.heterotic-e8e8-construction 所需）——不在本卡覆盖的页内。
