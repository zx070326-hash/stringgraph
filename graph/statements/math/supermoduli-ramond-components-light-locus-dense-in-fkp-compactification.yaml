id: math.supermoduli-ramond-components-light-locus-dense-in-fkp-compactification
kind: proposition
title: "光滑（无节点）广义自旋曲线轨迹 S_{g;n,2r} 在 FKP 自身的紧化 S̄_{g;n,2r} 中稠密"
statement: |
  【紧化的身份——本卡专指哪一个紧化，必须先声明】本卡断言的是 **FKP (Felder–Kazhdan–Polishchuk)
  自己构造的紧化对象**：FKP 通过容许节点（NS 节点、Ramond 节点）的稳定超曲线给出的紧化超叠
  𝔖̄_{g;n,2r}，及其玻色截断（粗化到普通概形/叠层面的）紧化 S̄_{g;n,2r}。**本卡完全不涉及、
  也不需要 Jarvis (2000) 用无挠层（torsion-free sheaf）构造的另一个紧化**
  S̄^{1/2,m}_{g,n}（Jarvis 自己的紧化对象）。这两个紧化对象是否同构，是一个已知存在但
  **本卡刻意不使用、也未核实**的命题（proof.md 登记为 `[GAP-JARVIS-COMPACT]`，中等强度、
  非承重）——本卡的论证完全在 FKP 自己的紧化内部完成，不需要这条未核实的同构。

  【记号，延续姐妹卡 `math.supermoduli-ramond-components-monodromy-transitive`】g≥0，n≥0，r≥1，
  m=n+2r，2g-2+m>0。S_{g;n,2r} 是光滑（无节点）广义自旋曲线的模叠（同前定义：线丛 L 配同构
  L^⊗2≅ω_C(R)，R 为 2r 个 Ramond 穿孔之和）。S̄_{g;n,2r} 记 FKP 允许曲线退化出 NS 节点与
  Ramond 节点后得到的紧化（玻色截断层面），𝔖̄_{g;n,2r} 记其超叠本身。

  【命题】设 r≥1（本卡的论证对 r=0 同样成立，因为它不依赖 §3 的点推机制，只依赖边界的
  局部几何；但本卡只在 r≥1 的姐妹卡体系中被引用，故量词范围写作 r≥1 以保持与其他卡一致）。
  则 S_{g;n,2r} 是 S̄_{g;n,2r} 的稠密开子集；等价地 𝔖_{g;n,2r} 在 𝔖̄_{g;n,2r} 中稠密。

  证明依据 FKP Prop 7.8(ii)（p.47）给出的边界局部正规交叉结构：设 [X_0]∈S̄_{g;n,2r} 有 k 个
  节点（NS 与 Ramond 节点合计，与本卡的"n,2r"记号中的穿孔计数无关——节点是曲线退化产生的，
  穿孔是曲线上原有的标记点，二者是不同的几何对象，此为 FKP 记号中另一处需要小心分辨之处）。
  则存在 [X_0] 的一个平展邻域 B 与光滑态射 t=(t_1,...,t_k):B→𝔸^k，使得（在底空间上）
  边界轨迹 u^{-1}(S̄∖S) 恰为 {t_1⋯t_k=0}。光滑态射平坦、开，故 B 中任一含 [X_0] 原像的
  开集 U 之像 t(U) 是含 0 的开集，从而含有坐标全非零的点，即 U 与 u^{-1}(S) 相交；u 本身
  平展故开，于是 [X_0] 的任意开邻域都与 S 相交。因 [X_0] 任意，S 在 S̄ 中稠密。
  最后，超叠与其玻色截断有相同的底层拓扑空间（幂零元不改变拓扑），
  故同一稠密性陈述从 S⊂S̄ 提升到 𝔖⊂𝔖̄。

  【本卡不断言】紧化后的连通性本身（那是姐妹卡
  `math.supermoduli-ramond-components-compactified-connected` 的内容，本卡只提供其证明用到
  的稠密性这一步）；紧化空间是不可约的、或纯维数的（proof.md §5 附注明确指出：若想走
  "边界余维数太高、不可能整个分量落在边界里"这条替代论证，需要 S̄ 纯维数这一额外事实，
  而本卡**不使用**这条替代论证，只用上面基于局部平展开映射的直接论证）。
