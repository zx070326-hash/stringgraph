id: math.quadratic-differentials-minus-holomorphic-vector-fields
kind: proposition
title: "紧黎曼面上 dim H⁰(K²) − dim H⁰(K^{−1}) = 3g − 3（对一切亏格，无需分情形）"
statement: |
  设 X 是**紧、连通**的黎曼面（无边），亏格为 g，K 为典范线丛（等价地典范除子）。记
    H⁰(X, K²)   := X 上**全纯二次微分**的空间
                   （局部写作 φ(z) dz²，φ 全纯，坐标变换下按 (dz/dz')² 变换），
    H⁰(X, K^{−1}) := X 上**全纯向量场**的空间
                   （局部写作 v(z) ∂_z，v 全纯，即全纯切丛的全纯截面）。
  则对**一切** g ≥ 0（**包含 g = 0 与 g = 1，不需要分情形讨论**）

    dim_C H⁰(X, K²) − dim_C H⁰(X, K^{−1}) = 3g − 3 。

  以 χ = 2 − 2g 记 Euler 数，等价写法为

    dim_C H⁰(X, K²) − dim_C H⁰(X, K^{−1}) = −(3/2) χ 。

  ⚠ **本卡只断言这个差，不断言其中任何一个单独的维数。** 要算单个维数还需要
  「deg D < 0 ⇒ l(D) = 0」（负次数线丛无非零全纯截面），那在教材里是 Riemann–Roch
  之前的**独立命题**，本图尚无节点。下面两组数值取自标准结果，**本卡不断言它们**，
  只作与差式的对照：
    g = 0（球面）：dim H⁰(K²) = 0，dim H⁰(K^{−1}) = 3  ⇒  0 − 3 = −3 = 3·0 − 3 ✓
    g = 1（环面）：dim H⁰(K²) = 1，dim H⁰(K^{−1}) = 1  ⇒  1 − 1 = 0 = 3·1 − 3 ✓
uses_conventions: []
sources:
