  按本卡任务的框架要求，仍不得使用"首次"、"新结果"一类措辞——只如实写"检索未见"。

  【与 Jarvis (2000) 的关系】Jarvis 的分量数定理（Thm 3.3.11）在 g=2、r_Jarvis=2、
  m_i=1 的情形下断言分量数=1（即"连通"），与本卡的计算结果**一致**（若 h^0 mod2 是分量
  不变量，则 g=2 时连通性会与"存在跳变"矛盾——本卡的跳变恰恰说明宇称在 r≥1 时不能充当
  分量不变量，从而与连通性不矛盾，是同一现象的具体例证而非反例）。
  ⚠ Jarvis v3 p.17 的 ℓ 定义原文按字面读作 "if g≠2"（经 200dpi 页图反复确认非 OCR 误读），
  语义上显然应为 "if g≥2" 的排印之误；本卡的计算独立于这条修复性解读，直接对 g=2 显式算出
  跳变现象，不依赖 Jarvis 该处文字是否正确。
