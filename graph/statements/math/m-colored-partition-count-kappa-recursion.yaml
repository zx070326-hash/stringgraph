id: math.m-colored-partition-count-kappa-recursion
kind: proposition
title: "m 色分拆计数的 “N−1, N−2 加修正” 递推：κ_N(m) = Σ_{s=0}^N Δ(s)·p_m(N−s)（对一切 N ≥ 2, m ≥ 0），附 N ≤ 7 显式值"
statement: |
  沿用 math.m-colored-partition-count-closed-form 的记号（p_m(N)、p(N) := p_1(N)）。
  对 N ≥ 2、m ≥ 0，定义

    κ_N(m) := p_m(N) + p_{m+1}(N−1) + p_{m+1}(N−2) − p_{m+1}(N)。

  再定义"记账差分" Δ(s)（约定 p(负数) := 0）：

    Δ(s) := p(s−1) + p(s−2) − p(s)   （s ≥ 1）；   **Δ(0) := 0**（单独约定，非字面公式代入——
    字面公式在 s=0 处给出 p(−1)+p(−2)−p(0) = 0+0−1 = −1 ≠ 0，必须单独约定为 0）。

  则对**一切** N ≥ 2、一切 m ≥ 0：

  **(a) 一般式**
    κ_N(m) = Σ_{s=0}^{N} Δ(s) · p_m(N−s)。

  **(b) N ≤ 7 的显式值**（由 p(0..7) = 1,1,2,3,5,7,11,15 直接代入 Δ 的定义得
  Δ(0..4)=0, Δ(5)=1, Δ(6)=1, Δ(7)=3，再代入 (a)）：

    - N ≤ 4： κ_N(m) = 0，对一切 m（Δ(s)=0 对 0≤s≤4）；
    - N = 5： κ_5(m) = 1，对一切 m；
    - N = 6： κ_6(m) = m + 1（**第一个 κ 依赖 m 的 N**）；
    - N = 7： κ_7(m) = p_m(2) + m + 3 = 2m + C(m+1,2) + 3 = C(m+3,2)。

  【本节点明确不断言】Δ(s)（s ≥ 5）经 Euler 五边形数定理展开为
  Δ(s) = p(s−5)+p(s−7)−p(s−12)−p(s−15)+⋯ 这条说明性备注——proof.md 明确声明它既未被证明
  也未被本卡任何一步使用（Euler 五边形数定理本身不是图里已建立的砖块，见姐妹卡
  math.euler-partition-generating-function 的 notes (c)）。本卡的 (a)(b) 完全不依赖它，
  只用到 Claim 2 的卷积递推与 p(0..7) 七个直接算出的小值。
