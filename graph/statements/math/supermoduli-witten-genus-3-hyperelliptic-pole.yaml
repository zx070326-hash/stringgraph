notes: |
  **查重**（2026-09-18）：`uv run stringgraph search hyperelliptic`（命中的都是紧化/投影系列节点，
  如 `math.supermoduli-compactified-genus-2-canonical-projection-fails`，均非本卡内容）；
  `search "genus three"`（no matches）；`search Deligne`（no matches）；`search "spin structure"`
  （命中 `math.supermoduli-space-not-projected` 与 genus-4 系列，均处理"投影/分裂"而非本卡的"轨迹
  分裂 + 测度极点阶数"）；`search witten`（命中多张 Witten 相关卡，均非同一命题）。确认本卡为新增，
  无重复。

  **本卡是什么、为什么现在才立**：`math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole`
  （Dunin-Barkowski–Fedorov–Sleptsov 2025 的条件性排除论证）在逻辑上依赖"真实测度在超椭圆轨迹处
  必须有极点"这一前提，并将其归于 Witten 2015，但该文献此前未被本项目读取、未登记 bib、未立卡——
  这条前提因此只以文字记录的形式挂在那张卡的 statement 正文与 notes 里，未接成图边。本卡是补上的
  那个节点。

  **承重的只是 D′ 那一半**：DBFS 的排除论证逻辑是——若 CDvG 的 Ansatz 在整个 Siegel 上半空间 H_3
  上处处全纯，则它也在 D′ ⊂ M_{3,spin+} 上全纯；而本卡断言 π_*(Υ) 沿 D′ 有极点（(C.22) 之后的肯定
  陈述），两者矛盾，故 Ansatz ≠ π_*(Υ)。D 支上的（预期、未证）零点对 DBFS 的排除论证不构成必要
  前提——即使把 D 支的结论整个去掉，排除论证依然成立。

  DBFS 摘要与引言笼统称"our formula has a polar singularity along the hyperelliptic locus; the
  existence of this singularity was established by Witten in 2015"（单数、不区分 D/D′）——这是对
  Witten 原文不对称结构的简化转述，见 `math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole` 的
  notes 与本任务报告。
