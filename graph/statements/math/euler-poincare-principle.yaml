id: math.euler-poincare-principle
kind: proposition
title: Euler–Poincaré 原理（特征标版）：有限维复形的分次维数交错和等于其上同调的分次维数交错和，Σ_n (−1)^n dim C^n = Σ_n (−1)^n dim H^n(C)；逐权应用即形式特征标的交错和相等
statement: |
  设 k 是域，(C^•, d) 是 k-向量空间的上链复形：C^n（n ∈ Z）是 k-向量空间，
  d_n : C^n → C^{n+1} 是 k-线性映射，d_{n+1} ∘ d_n = 0。记
    Z^n := ker d_n，  B^n := im d_{n−1}，  H^n(C) := Z^n / B^n。

  (1) **有限维版**。设每个 C^n 有限维，且只有有限多个 n 使 C^n ≠ 0。则
        Σ_{n ∈ Z} (−1)^n dim_k C^n  =  Σ_{n ∈ Z} (−1)^n dim_k H^n(C)。
      两端都是有限和。**特别地**：若 H^n(C) = 0 对一切 n ≠ 0，则
        dim_k H^0(C) = Σ_{n ∈ Z} (−1)^n dim_k C^n。

  (2) **分次版（(1) 逐权应用，不是独立断言）**。设 C^• 另带一个由 d 保持的分次
        C^n = ⊕_{λ ∈ Λ} C^n_λ，  d_n(C^n_λ) ⊆ C^{n+1}_λ   （Λ 是任意指标集），
      且对每个 λ，复形 (C^•_λ, d) 满足 (1) 的前提（每个 C^n_λ 有限维、只有有限多个 n 使
      C^n_λ ≠ 0）。则 H^n(C) = ⊕_λ H^n(C_λ)，并对每个 λ 有 (1)；于是以形式特征标
        ch C^n := Σ_λ (dim_k C^n_λ) q^λ,   ch H^n(C) := Σ_λ (dim_k H^n(C_λ)) q^λ
      （Λ ⊆ Z 或 ½Z 时是形式 Laurent 级数，一般是 Λ 上的形式和）写出，有
        Σ_{n} (−1)^n ch C^n  =  Σ_{n} (−1)^n ch H^n(C)。
      左端在 FGZ 的记法里叫「形式 Euler 特征标」。

  【本卡明确不断言】
  (a) **不断言号差版**（Lian–Zuckerman 1989 p.317 逐字 'the Euler–Poincaré Principle for signature
      states that Σ_n sign H^n = Σ_n sign C^n'）：那需要复形上的非退化厄米型与 d 的自伴性，
      是另一条命题，本图尚无卡。
  (b) 不断言 (1) 的前提可以放宽到「每个 C^n 有限维但无限多个非零」——那时两端都可能发散。
  (c) 不断言任何关于具体复形（BRST 复形、半无限上同调复形）的事：把 (1)(2) 用到
      C_rel(p,κ) 或 V ⊗ Λ^∞ 上时，「该复形满足前提」由引用它的推导各自负责。
formal:
  lean_decl: StringFormal.EulerPoincare.euler_poincare
  lean_file: StringFormal/Math/EulerPoincare.lean
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/EulerPoincare.lean :: StringFormal.EulerPoincare.{euler_poincare, euler_poincare_finsum, finrank_cohomology_zero_eq, euler_poincare_graded}"
    note: |
      本仓库（形式化侧提交 `0f5db0a`），Lean 4 + Mathlib v4.33.1。逐条对应：
      · 本卡 **(1)** = `euler_poincare`（求和在 `Finset.Ico a b`，前件
        `Subsingleton (C (a-1))` 与 `Subsingleton (C b)`），以及它的全分次形式
        `euler_poincare_finsum`（两端写成 `∑ᶠ n : ℤ`，前件是卡面的「只有有限多个 C^n ≠ 0」）；
      · 本卡 (1) 的「**特别地**」一支 = `finrank_cohomology_zero_eq`；
      · 本卡 **(2)** = `euler_poincare_graded`（特征标等式在 `Λ → ℤ` 里；
        但 `H^n(C) = ⊕_λ H^n(C_λ)` 本身未形式化，见 --via-lean 推导的 gaps）；
      · 本卡【明确不断言】(a) 号差版同样**不在** Lean 里。
      ★ **Mathlib 没有这条定理**：`Mathlib/Algebra/Homology/EulerCharacteristic.lean`
      只定义了 `eulerChar` / `homologyEulerChar`，并未证两者相等；故本卡走自证而非桥层。
  - ref: fgz-1986
    loc: "**Proposition 1.3**, p.8443（§1.1 'Definitions and Basic Results'）：Euler–Poincaré 原理，Σ_m (−1)^m ch_q(V ⊗ Λ^m_∞) = Σ_m (−1)^m ch_q H^m_∞(g, V)（本卡 (2) 在半无限上同调复形上的实例）；**p.8445 左栏**逐字 'To find the dimension of the zero degree cohomology group we apply the Euler–Poincaré principle. The formal Euler character is …'"
    note: |
      **L1 逐字**（extraction `brst-cohomology-sources.md` §9.11.1，researcher 第五轮页图 p.8443 左栏最下方）：
      「**PROPOSITION 1.3.** *For* `V` *in* `𝒪₀`, `Σ_m (−1)^m ch_q(V ⊗ Λ^m_∞) = Σ (−1)^m ch_q H^m_∞(g, V)`.」
      ★ **唯一的量词是 `V ∈ 𝒪₀`**（不是更大的 `𝒪`）。`𝒪₀` 在同页定义，须展开为
      「每个分次层有限维 + 分次在上方有界」（逐字：'dim Λ^{m,n}_∞ < +∞ for every n ∈ Z and for some n₀ ∈ Z
      is 0 for n > n₀. The g-modules with these properties compose a category 𝒪₀.'）——与本卡 (1)(2) 的前提
      逐点同型，也与 LZ Definition 2.12(i) 对 char/sign 的前提逐点同型。
      ★ **陈述是特征标层面的交错和**（`ch_q H^m_∞(g,V) = Σ_n dim H^{m,−n}_∞(g,V) q^n`，定义在 Prop 1.3 正上方一句），
      即本卡 (2)，不是 (1)；(1) 是它在单个 q 幂次上的读数。
      ★ 「每层有限维」不是 Prop 1.3 的额外假设，而是由 `V ∈ 𝒪₀` 推出（同页逐字 'turns V ⊗ Λ*_∞ into a
      graded space, finite-dimensional in each level'）。⚠ 上同调是无穷乘积 `H^m_∞(g,V) = Π_n H^{m,n}_∞(g,V)`，
      不是直和——转述时别写成 ⊕。
      ★ **"Euler–Poincaré principle" 这个名字是 FGZ 自己在 Prop 1.3 正上方给的**（'The Euler–Poincaré principle
      for each graded level can be contained in the following statement.'），与 Thm 2.7 上方
      'the Euler–Poincaré principle (Proposition 1.3)'（§9.3 逐字）呼应，归属自洽。
      ⚠⚠ **FGZ 没有印出 Prop 1.3 的证明**（§9.11.1 读数 3：Prop 1.3 与 Prop 1.4 之间没有 Proof、没有 □、
      没有 'see ref. N'、没有 'straightforward'；通读 p.8443/p.8444 两页全栏无回补）。
      ⇒ **fgz-1986 对本卡只能给「陈述 + 编号 + 量词」，给不了证明**；本卡推导的 rigorous 不靠它，见 notes。
      ⚠ 引用格式陷阱：同页的**微分定义式印作 `[1.3]`（方括号）**，与 `Proposition 1.3` 同号不同物；
      引用时必须写全类型词。
  - ref: lian-zuckerman-1989
    loc: "**Corollary 2.15 的证明**, p.317，逐字：'We recall the Euler–Poincaré Principle for characteristics: Σ_{n∈Z}(−1)^n dim H^n_rel(p,κ) = Σ_{n∈Z}(−1)^n dim C^n_rel(p,κ).'；**Proposition 4.3(ii) 的证明**, p.330，逐字：'By the Euler–Poincaré Principle, we have Σ_{n∈Z}(−1)^n dim P̄_+C_rel = dim H^0(P̄_+C_rel).'"
    note: |
      L1 逐字（literature/extractions/lian-zuckerman-1989.md §9.2、§7.3）。
      ★ **这是本图对本卡 (1) 唯一的逐字文献陈述**（LZ 以 'We recall' 引入，视为标准事实，不证）。
      p.330 那句是 (1) 的「特别地」一支（先用 Theorem 2.4 消灭 n ≠ 0）。
  - ref: hatcher-2002
    loc: "**Theorem 2.44**, Ch. 2 §2.2 小标题 'Euler Characteristic'，书上 **p. 146**，证明跨 **pp. 146–147**（证明标题印作 'Proof of 2.44'）。逐字：'**Theorem 2.44.** χ(X) = Σ_n (−1)^n rank H_n(X).'"
    note: |
      **L1 逐字**（extraction `math-sources.md` §39.5 追加段，researcher 2026-09-11；全书 PDF
      `pi.math.cornell.edu/~hatcher/AT/AT.pdf`，**PDF 页 = 书页 + 9**）。定理号 2.44 **已核实**，
      此前「凭记忆、L0」的标注作废。
      ★ **量词写在定理正上方的定义句里，不在定理语句内**：'For a finite CW complex X, the Euler
      characteristic χ(X) is defined to be the alternating sum Σ_n(−1)^n c_n where c_n is the number of
      n-cells of X …' ⇒ 引用时必须把 **finite CW complex** 一起带上。
      ★ **证明唯一的外包步骤**是「0→A→B→C→0 正合 ⇒ rank B = rank A + rank C」，Hatcher 逐字
      'whose proof we leave as an exercise'；其余（含把结论应用到 C_n = H_n(X^n, X^{n−1})）都印全。
      ⚠ Hatcher 的版本是**有限 CW 复形的整系数链复形**（rank 而非 dim），本卡取域上向量空间的上链版；
      两者的论证同型（秩–零化度 + 交错和伸缩），但**不是同一条命题**——本卡不把 Hatcher 当作
      自身陈述的逐字来源，只当作「同一论证在教科书里印全了」的旁证。
tags: [homological-algebra, linear-algebra, euler-characteristic, brst, cohomology]
notes: |
  【为什么立卡（curator 2026-09-11，small-backlog-12）】
  三条推导逐字引用同一条原理而图里没有卡：
    · worldsheet.bosonic-relative-cohomology-dimension--via-fgz-1986（FGZ Prop 1.3 → Prop 2.4 → Thm 2.7(ii)）；
    · worldsheet.superstring-relative-cohomology-dimension--via-lian-zuckerman-1989（LZ Cor 2.15(i) 证明第 1 步）；
    · worldsheet.superstring-gso-covariant-equivalent--via-lian-zuckerman-1989（LZ Prop 4.3(ii) 证明第 4 步）。
  三条的 gaps 各记着「Euler–Poincaré 原理在本图无节点」（reviewer-batch23 首记），本卡关闭它们，
  三条推导同批加边（非 inferred：各自原文逐字 'By the Euler–Poincaré Principle' / 'the Euler–Poincaré
  principle (Proposition 1.3)'）。

  【状态（2026-09-11 更新，此前的「暂 physical-argument」段已过时）】推导 --via-rank-nullity 现为
  **rigorous**，走的是 docs/STATUS_LEVELS.md 的例外条款：有限步初等计算 + reviewer 独立复核，
  签名 `reviewer-verified: reviewer-batch26, 2026-09-11` 写在该推导 notes 里。
  ★ **这条 rigorous 的承重墙是本图自己补的证明 + reviewer 签名，不是文献**：
  **FGZ 没有印出 Proposition 1.3 的证明**（§9.11.1 读数 3，页图逐字确认 Prop 1.3 与 Prop 1.4 之间无 Proof），
  LZ 以 'We recall' 引入也不证。⇒ 若有人日后想把本卡的严格性追到 fgz-1986 身上，追不到；
  数学侧印全证明的现成参照是 hatcher-2002 Theorem 2.44（pp.146–147，但那是有限 CW 复形的整系数版，
  不是本卡的域上上链版，只作旁证）。
  三条下游推导的 effective 本已被各自的接口卡封在 physical-argument，本卡状态不改变它们的 effective。

  【已形式化（formalizer 2026-09-11）】本卡 (1)、(1) 的「特别地」一支、以及 (2)
  都已在 Lean 4 + Mathlib v4.33.1 里机检通过，见推导 `--via-lean` 与
  `formal/StringFormal/Math/EulerPoincare.lean`（`lean_decl` = `StringFormal.EulerPoincare.euler_poincare`）。
  两条应记在这里的发现：
    ★ **Mathlib 没有这条定理**。`Mathlib/Algebra/Homology/EulerCharacteristic.lean` 定义了
      `HomologicalComplex.eulerChar` 与 `homologyEulerChar`，却**不证两者相等**。也就是说，
      本卡在主流形式化库里是空缺的，不能当作「引一条 Mathlib 引理就完事」的背景事实。
    ★ **卡面 (2) 里的 `H^n(C) = ⊕_λ H^n(C_λ)` 并未形式化**：Lean 侧的分次版直接以
      「按权索引的复形族」为输入。(2) 的「分解」那一半仍是人读的，引用本卡 (2) 时
      该步由引用者负责；详见 `--via-lean` 的 gaps。

  【号差版另立】LZ Cor 2.15(ii)（worldsheet.no-ghost-theorem-superstring-cohomological-v2 的推导）
  用的是 signature 版：Σ sign H^n = Σ sign C^n，前提多一个非退化厄米型与 Q* = Q。
  本卡「不断言 (a)」；建议另立 `math.euler-poincare-principle-signature`，届时该推导加边。
  本轮该推导在 reviewer 的 claim（#349）内，未动。
