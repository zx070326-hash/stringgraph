id: math.berezin-integral
kind: definition
status: rigorous
title: Berezin 积分：Grassmann 变量上的线性泛函 ∫dθ 1 = 0、∫dθ θ = 1
statement: |
  设 Λ 是域 C 上由 n 个生成元 θ_1, …, θ_n 生成的 Grassmann（外）代数：
    θ_m θ_n = − θ_n θ_m，  特别地 θ_n² = 0。
  因 θ² = 0，单个生成元的最一般函数形如 f(θ) = a + θ b（a, b ∈ C）。

  **(1) 单变量的 Berezin 积分**定义为使
      ∫ dθ  1 = 0,      ∫ dθ  θ = − ∫ θ  dθ = 1
  成立的**线性**映射；更一般的表达式由**要求积分线性、并规定 dθ 与所有 Grassmann 变量反对易**
  唯一确定。

  **(2) 多变量**：对 f(θ) = … + θ_n θ_{n−1} … θ_1 c（即把 f 展开后取「最高次项」的系数 c），
      ∫ dθ_1 … dθ_n  f(θ) = c.
  即 Berezin 积分**挑出最高次系数**。

  **(3) 与普通积分共有的性质**（这三条正是把玻色路径积分的论证搬到费米场上所用到的全部）：
    (a) 线性；
    (b) 交换积分次序至多改变一个符号；
    (c) 分部积分，等价地「全导数的积分为零」：∫ dθ (d/dθ)(a + θ b) = ∫ dθ  b = 0。

  **(4) 变量替换的 Jacobian 与玻色情形互为倒数**：若 θ' = θ a（a ∈ C^×）则 dθ' = a^{−1} dθ。
  一般的（玻色 + 费米）无穷小变量替换下测度的变化为
      δ(d^m x  d^n θ) = d^m x  d^n θ  ( Σ_i (∂/∂x_i) δx_i − Σ_j (∂/∂θ_j) δθ_j ),
  **注意费米部分带相反的符号**。

  ⚠ **本节点断言的是什么**：∫dθ **不是任何通常意义上的积分**，而是从 Λ 到 C 的一个线性映射；
  「积分」记号只是助记。因此本节点**不依赖任何测度论、可测性或收敛性内容**。
