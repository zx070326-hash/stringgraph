id: math.vertex-algebra-commutator-formula
kind: proposition
title: 顶点代数的模式对易子公式 [ψ_m, φ_n] = Σ_{i≥0} C(m,i) (ψ_i φ)_{m+n−i}（G–N (2.38)）
statement: |
  设 (ℱ, 𝒴, 1) 是顶点代数（公理体系与模式约定见 math.vertex-algebra-borcherds-identity；
  特别地模式按 G–N (2.31) 展开 𝒴(ψ, z) = Σ_{n ∈ Z} ψ_n z^{-n-1}，**下标在圆括号外**）。

  **命题（对易子公式）**：对一切 ψ, φ ∈ ℱ 与一切 m, n ∈ Z，
    [ψ_m, φ_n] = Σ_{i ≥ 0} C(m, i) (ψ_i φ)_{m+n−i},
  其中 C(m, i) = m(m−1)⋯(m−i+1)/i! 是二项式系数（i ≥ 0；i < 0 时为 0），
  等式在 End(ℱ) 中成立（两端作用在任意 ξ ∈ ℱ 上相等）。

  **右端是有限和**：由正规性公理（ψ_i φ = 0 当 i 充分大）截断，与 ψ, φ 有关但与 m, n 无关。

  **本命题的四条边界**：
  (a) **这是模式版。** 场版（带 δ 函数）
        [Y(a, u), Y(b, w)] = Σ_{m ≥ 0} Y(a_{(m)} b, w) ∂_w^{(m)} δ(u − w)
      （Bakalov–Kac (2.21)）与本式由取 Res_u 相联；**该换算步骤不在本卡内**，本卡也不主张两者等价的证明。
  (b) **不含任何收敛性、围道积分或径向排序**：z, u, w 始终是形式变量，一切都在
      (End ℱ)[[z^{±1}]] 与形式分布层面。
  (c) **玻色型。** 本卡按 G–N 的写法陈述，ℱ 上不带 Z_2-分次，公式中无 (−1)^{p(ψ)p(φ)} 因子。
      顶点**超**代数（含 bc 鬼场等费米型场）的符号版本不在本卡内。
  (d) **不断言 ψ_i φ 的显式计算。** 右端的 (ψ_i φ) 是 ℱ 中的向量，本卡只说它的顶点算子模式出现在右端；
      在具体模型里算出它是下游各推导的事。

  **与 math.locality-ope-equivalences-v2 第 5 条的关系（不是依赖，是观察）**：那条（Schottenloher
  Thm 10.10 的第 5 条）对**任意两个局域形式分布** A, B 断言
    [A_{(m)}, B_{(n)}] = Σ_{j=0}^{N-1} (m choose j) C^j_{(m+n−j)}，
  其中 C^j 只是「某组由 A, B 唯一确定的形式分布」。本卡是**顶点代数内部**的版本，
  额外的信息正是 C^j(w) = 𝒴(ψ_j φ, w)——即 OPE 系数场本身也是顶点算子。
  两张卡各自独立成立，**互不依赖**。
