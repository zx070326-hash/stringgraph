id: math.super-virasoro-central-charge-equality
kind: proposition
title: 超 Virasoro 代数的两个中心项系数被 Jacobi 恒等式绑定：c_B = c_F
statement: |
  在 math.super-virasoro-algebra 的括号中把两处中心项的系数**先当作两个独立常数**：
    [L_m, L_n] = (m − n) L_{m+n} + (c_B/12)(m^3 − m) δ_{m,−n},
    {G_r, G_s} = 2 L_{r+s} + (c_F/12)(4r^2 − 1) δ_{r,−s},
    [L_m, G_r] = ((m − 2r)/2) G_{m+r}。
  则（超）Jacobi 恒等式
    0 = [L_m, {G_r, G_s}] + {G_r, [G_s, L_m]} − {G_s, [L_m, G_r]}
  的中心部分给出
    (1/6)(c_B − c_F)(m^3 − m) δ_{m+r+s,0} = 0，
  故对所有 m ∈ Z 成立当且仅当
    **c_B = c_F**。
  等价的 OPE 说法：T_B T_B 的四阶极点系数（写作 c_B/2）与 T_F T_F 的三阶极点系数
  （写作 2c_F/3）必须由同一个常数 c 给出。

  本命题**不**断言超 Jacobi 恒等式对整个代数逐条成立（那是另一件事，见
  math.super-virasoro-algebra 的【本卡不断言的内容】(1)）；它只断言：**若**要求上面那一条
  Jacobi 恒等式成立，**则**两个中心荷相等。
