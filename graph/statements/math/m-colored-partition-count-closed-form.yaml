id: math.m-colored-partition-count-closed-form
kind: proposition
title: "m 色分拆计数 p_m(N) 的组合闭式与生成函数等价式（对一切 N, m ≥ 0）"
statement: |
  【记号】固定有限指标集 ι，|ι| = m（"颜色"数）。一个**占据函数**是有限支撑函数
  d : ι × ℕ₊ →₀ ℕ；其**权重** oscWeight(d) := Σ_{(i,n)} n·d(i,n)。定义

    p_m(N) := #{ d : ι × ℕ₊ →₀ ℕ | oscWeight(d) = N }，

  约定 p_m(0) = 1（一切 m ≥ 0）、p_0(N) = 0（N ≥ 1）。记 p(N) := p_1(N)（通常分拆函数）。
  对一个分拆 λ ⊢ N（写作 λ = ∏_s s^{r_s}，r_s = 大小为 s 的部分个数），记
  C(m+r-1, r) := Nat.choose (m+r-1) r（从 m 元集取大小 r 的多重集数，约定 C(m-1,0)=1
  即使 m=0）。

  设 R 是交换环，P_R(X) := Σ_{N≥0} p(N) X^N ∈ R[[X]]（同
  math.euler-partition-generating-function 的记号）。则对**一切** N ≥ 0、一切 m ≥ 0：

  **(闭式)**
    p_m(N) = Σ_{λ ⊢ N}  ∏_{s : r_s(λ) > 0}  C(m + r_s(λ) - 1, r_s(λ))。

  **(生成函数式，与闭式等价)** 作为 ℤ[[X]] 中的形式幂级数恒等式：

    Σ_{N ≥ 0} p_m(N) X^N  =  P_ℤ(X)^m  =  [ ∏'_{n ≥ 1} (1 - X^n) ]^{-m}。

  【本节点明确不断言】p_m(N) 的渐近行为；Δ(s) 的五边形数展开（见姐妹卡
  math.m-colored-partition-count-kappa-recursion 的边界声明）。
