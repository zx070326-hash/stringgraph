notes: |
  【论证结构，curator 亲自 Read proof.md §1 全文核对】(★) 生成函数式的证明分两步：
  Step 1 把「权重 N 的占据函数」逐字等同于「ι 个普通分拆、大小求和为 N 的元组」（数据
  重新打包，非双射构造），给出 Σp_m(N)X^N = P_R(X)^m；再用**承重依赖**
  math.euler-partition-generating-function 的 (1) 式（P_R(X) = [∏(1-X^n)]^{-1} 是环中
  可逆元的逆）得到 P_R(X)^m = [∏(1-X^n)]^{-m}。Step 2 把 (★) 按分拆形状分组重新计数，
  得到闭式（"stars and bars" 初等有限组合学，proof.md 明确声明「不归因于任何图节点，
  是纯有限组合学标准双射事实，也是 Mathlib 的 Nat.multichoose_eq」，故不作为
  depends_on 边，只在本卡 statement 内直接使用）。

  【与 math.euler-partition-generating-function 的对接】该卡内容是"P_ℤ(X) 的乘法逆
  就是 ∏(1-X^n)"（m=1 情形），本卡的证明把它取 m 次幂；只用到该卡的 (1) 式
  （无需域、无需特征零），未用其 (2)-(4)。

  【范围边界，明确不断言】本卡不含 Δ(s)/κ_N(m) 递推（见姐妹卡
  math.m-colored-partition-count-kappa-recursion）、不含 N=7 的显式 10-形状展开
  （见姐妹卡 math.m-colored-partition-count-level-seven，是本卡在 N=7 处的直接实例）。

