notes: |
  【为什么单独建卡】worldsheet.virasoro-algebra-v2 的形式化实现是「Witt 代数的中心扩张」，
  worldsheet.virasoro-unique-central-extension 的陈述则**必须**显式提到 Witt 代数
  （唯一性是关于 H²(W, R) 的断言）。此前 Witt 代数只在旧卡 worldsheet.virasoro-algebra
  的陈述文本里被顺带提及，没有节点，无法作为依赖被引用。

  【约定】本节点声明 conv.virasoro-standard，只为固定 (m − n) 这一项的符号
  （与之相反的约定 [ℓ_m, ℓ_n] = (n − m) ℓ_{m+n} 相当于 ℓ_n ↦ −ℓ_n）。
  中心项的归一化（c/12）与本节点无关，因为 W(R) 没有中心元。

  【area 选择】放在 math 而不是 worldsheet：这是与弦论无关的纯李代数对象，
  worldsheet 侧只通过 Virasoro 代数用到它。

  【查重】新增前跑过 `stringgraph search witt / virasoro / cohomology`：
  图中此前无 Witt 代数节点，唯一相关命中是旧卡 worldsheet.virasoro-algebra
  在陈述文本中提到「Witt 代数」。
