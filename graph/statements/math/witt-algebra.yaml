id: math.witt-algebra
kind: definition
status: formalized
title: Witt 代数（圆周上多项式向量场的李代数）
statement: |
  设 R 是交换环。**Witt 代数** W(R) 是以 {ℓ_n : n ∈ Z} 为基的自由 R-模，
  其李括号由双线性扩张

    [ℓ_m, ℓ_n] = (m − n) ℓ_{m+n}      (m, n ∈ Z)

  给出。该括号满足 [X, X] = 0（交错性）与 Jacobi 恒等式，故 W(R) 是 R 上的李代数。
  W(R) **不含中心元**：以上关系里没有 δ_{m+n,0} 项。

  几何来源（本节点**不断言**，也不用于任何下游论证）：R = C 时 W(C) 同构于
  去心复平面上多项式向量场的李代数，对应 ℓ_n ↦ −z^{n+1} d/dz。
  本节点采取纯代数定义（基 + 结构常数），不含任何解析或几何输入。

  W(R) 的一维中心扩张即 Virasoro 代数（worldsheet.virasoro-algebra-v2）；
  该扩张在同构意义下唯一这件事是一条**独立命题**，见
  worldsheet.virasoro-unique-central-extension，不属于本定义。
uses: []
uses_conventions: [conv.virasoro-standard]
