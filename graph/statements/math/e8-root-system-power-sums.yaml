id: math.e8-root-system-power-sums
kind: proposition
title: E₈ 根系的幂和：Σ_α (α·x)² = 60|x|²、Σ_α (α·x)⁴ = 36|x|⁴、Σ_α (α·x)⁶ = 30|x|⁶，故 P₄ = P₂²/100、P₆ = P₂³/7200（对一切 x ∈ ℚ⁸）
statement: |
  设 Φ ⊂ ℚ⁸ 是 math.e8-root-system 的那 **240 个显式向量**，即

  · ±ε_i ± ε_j（1 ≤ i < j ≤ 8，符号独立；112 个），
  · ½(s₁, …, s₈)，s_i ∈ {+1, −1} 且负号个数为偶数（128 个）。

  对 x = (x₁, …, x₈) ∈ ℚ⁸ 记 α·x := Σ_i α_i x_i（ℚ⁸ 上的标准双线性配对），
  |x|² := Σ_i x_i²，并定义 **根幂和** P_k(x) := Σ_{α ∈ Φ} (α·x)^k。则对**一切** x ∈ ℚ⁸：

      P₂(x) = 60 |x|²
      P₄(x) = 36 |x|⁴
      P₆(x) = 30 |x|⁶

  从而（消去 |x|²，两侧同次齐次）

      **P₄(x) = (1/100) · P₂(x)²**
      **P₆(x) = (1/7200) · P₂(x)³**

  这两条就是 Green–Schwarz 1984 (12b′)(12c′) 与 van Ritbergen–Schellekens–Vermaseren (176)(177)
  中的**纯数字** 1/100、1/7200 的来路——但本卡只谈根幂和，**不谈迹**。

  **本卡不断言**：
  (a) P_k 与李代数 𝔢₈ 的伴随迹 Tr_248 F^k 之间的任何关系（那是 math.adjoint-weights-are-roots-and-zero
      与 math.chevalley-restriction-theorem 两张桥卡的内容，接线在
      math.e8-adjoint-trace-identities--via-root-power-sums）；
  (b) 「这 240 个向量是 E₈ 根系」——那是 math.e8-root-system 的定义内容，本卡只对显式列表做算术；
  (c) k ∉ {2, 4, 6} 的任何幂和（奇数 k 时 P_k = 0 是显然的但本卡不写；k = 8 及以上不成立
      「P_k ∝ |x|^k」，vRSV (178) 给出 k = 10 的非平凡形状）；
  (d) 任何关于反常的事。
