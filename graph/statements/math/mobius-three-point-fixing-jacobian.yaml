notes: |
  由 curator 于 2026-09-11 拆出（任务书：把「PSL(2,C) 三点固定的 Jacobian」作为纯数学部分单列）。

  **为什么值得单列**：第 6 章几乎每条树级振幅都用到「固定三点 + 乘上 c 鬼三点期望值」，
  而两者之所以对消，纯粹因为 Vandermonde 行列式与 (6.3.2)/(6.3.4) 同形。
  单列算术部分后，振幅节点的 gaps 里只剩真正的物理缺口（路径积分测度、FP 手续）。

  **status 历史**：初建时 physical-argument（无 reviewer 复核、无数学来源）。2026-09-11：
  reviewer-ch6 复核 --via-vandermonde 升 rigorous；同日挂上 formalizer 的
  MobiusJacobian.lean（--via-lean，formalized）。

  【formalizer 的三点说明】（2026-09-11，MobiusJacobian.lean 文件头与 formal/TODO.md）
  1. **符号**：det (vandermonde z) = (z₂−z₁)(z₃−z₁)(z₃−z₂) = −z₁₂z₁₃z₂₃，符号随两点换位翻转，
     所以文献一律写绝对值 |z₁₂z₁₃z₂₃|；符号不是物理陈述的一部分。
  2. **Lean 覆盖范围**：只有无穷小变换 δz = a₀ + a₁z + a₂z² 的线性代数（行列式、非退化、双射）。
     PSL(2,R)/PSL(2,C) 的锐三重传递（有限变换）与「Jacobian ⇒ 测度换算」仍是 physical-argument 层面，
     分别由 math.mobius-group-sharply-three-transitive 与（待建的）第 5 章 FP 节点承载。
  3. **孤岛**：MobiusJacobian.lean 只 import Mathlib，不 import `Virasoro/`、`NoGhost/`。
     它同时容纳 spectrum.mandelstam-invariants-sum-rule 的 B 节。

  **待补边**：第 5 章的规范固定测度 (5.3.9)（抽取记录 E77/E80）说明 FP 行列式在固定 CKV 参数后
  产生的正是这个 Jacobian。该节点由另一名 curator 建立，本批次提交时尚未进入 main。
