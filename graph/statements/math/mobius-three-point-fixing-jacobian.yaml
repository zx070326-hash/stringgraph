id: math.mobius-three-point-fixing-jacobian
kind: proposition
title: 固定三点的共形 Killing 群 Jacobian 是 Vandermonde 行列式 z₁₂z₁₃z₂₃
statement: |
  设无穷小 Möbius 变换按 worldsheet.sphere-conformal-killing-group 参数化为
    δz = a₀ + a₁ z + a₂ z²   (a₀, a₁, a₂ 复)，
  并设 z₁, z₂, z₃ 互不相同。则参数到三点位移的线性映射
    (a₀, a₁, a₂) ⟼ (δz₁, δz₂, δz₃),   δz_i = a₀ + a₁ z_i + a₂ z_i²
  的矩阵是 Vandermonde 矩阵（第 i 行为 (1, z_i, z_i²)），其行列式为
    det = (z₂ − z₁)(z₃ − z₁)(z₃ − z₂) = − z₁₂ z₁₃ z₂₃,   z_ij ≡ z_i − z_j，
  故 |det| = |z₁₂ z₁₃ z₂₃| ≠ 0，映射可逆。

  **(1)（球面）** 把全纯与反全纯两侧合起来，用 PSL(2,C) 固定 S₂ 上三个复坐标时
  出现的 Jacobian 因子是  |z₁₂|² |z₁₃|² |z₂₃|²。
  **(2)（圆盘）** 用 PSL(2,R) 固定 D₂ 边界上三个实坐标时同样的计算给  |y₁₂ y₁₃ y₂₃|。

  ⚠ **本命题只断言线性代数**：上面两式与 bc 鬼场三点期望值
  （worldsheet.bc-ghost-sphere-cc-correlator、worldsheet.bc-ghost-disk-three-c-correlator）
  在函数形式上**逐字相同**，这正是「鬼场插入抵消固定坐标的 Jacobian」的算术内容；
  但「Faddeev–Popov 手续给出的正是这个 Jacobian」是路径积分层面的陈述，属第 5 章，
  **本命题不断言它**（本图暂无该节点，见 notes）。
sources:
  - ref: polchinski-1998-v1
    loc: "§6.3, eq. (6.3.2)/(6.3.4)（与本 Jacobian 逐字同形的鬼场三点期望值）；§6.4 eq. (6.4.5)、§6.6 eq. (6.6.4)（三点被固定后的振幅表达式）"
    note: |
      literature/extractions/polchinski-1998-v1.md#E96/#E97/#E104，等级 L1
      （(6.3.2)/(6.3.4) 有 schrans-2020 与 headrick-2008 **两个独立二手源**逐字写出表达式）。
      ⚠ 来源给出的是**鬼场期望值**；Vandermonde 行列式这一步是 curator 补出的线性代数，
      原书是否在此处写出该 Jacobian **未核实**。
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/MobiusJacobian.lean :: StringFormal.Math.{vandermonde_fin_three, mobius_three_point_jacobian, det_mobius_matrix, mobius_three_point_jacobian_eq_neg, mobius_three_point_det_ne_zero, mobius_three_point_fixing_bijective}"
    note: |
      本仓库，formal 侧提交 70b62c5（"formal: prove Mobius three-point fixing Jacobian
      (Vandermonde n=3)"）；Lean 4 + Mathlib v4.33.1。逐条对应：
        行列式 det = (z₂−z₁)(z₃−z₁)(z₃−z₂) → `mobius_three_point_jacobian`（本卡 formal.lean_decl；
          任意交换环，Mathlib `Matrix.det_vandermonde` 的 n = 3 特化）；
          `det_mobius_matrix` 是三个变量写开的同一式；
        符号 det = −z₁₂z₁₃z₂₃ → `mobius_three_point_jacobian_eq_neg`；
        三点互不相同 ⇒ det ≠ 0、映射可逆 → `mobius_three_point_det_ne_zero` /
          `mobius_three_point_fixing_bijective`（域上；后者把 (a₀,a₁,a₂) ↦ (δz_i) 写成
          Vandermonde 矩阵的 mulVec 并证双射）。
      Lean 侧的 `z 0, z 1, z 2` 即本卡的 z₁, z₂, z₃（0 起数）。
      **Lean 只覆盖无穷小/线性代数陈述**：(1)(2) 的「合起来得 |z₁₂|²|z₁₃|²|z₂₃|²、|y₁₂y₁₃y₂₃|」
      是对 |det| 取模/取乘积的一行算术，没有单独的 Lean 声明；PSL(2,R) 的锐三重传递与
      有限变换的测度换算不在 Lean 内（见 math.mobius-group-sharply-three-transitive）。
