tags: [clifford-algebra, spinor, so-n, reality, pseudoreal, representation-theory, mod-8, polchinski-appendix-b]
notes: |
  【与 math.clifford-majorana-weyl-mod-8 的关系】原书的论证方式是「`SO(N)` 类比于 `SO(N+1,1)`，
  只需忽略 `μ = 0, 1`」。因此本卡的推导**依赖**那张卡，而不是独立重做；这也是本卡状态不高于它的原因。

  【SO(8) 那一行能与不能支持什么】`N ≡ 0 (mod 8)` 行是「`8` 与 `8′` 都实、都自共轭」的来源，
  可以用；**不能**用来支持三重性或任何 `8_v ↔ 8 ↔ 8′` 的外自同构轮换主张（App. B 不含，§3.2 第 1 条）。
  若日后建 worldsheet.so8-triality，来源须另找（候选：Vol.2 §10.2–10.6，本轮未核；或 GSW / 数学来源）。

  【升级路径】同 math.clifford-majorana-weyl-mod-8：需 ABS 1964 或 Lawson–Michelsohn 一类数学来源，
  两者本项目均未取得（L0），**未登记到 literature/sources.bib**。
