id: math.so-n-spinor-reality-mod-8
kind: proposition
title: SO(N) 旋量的实性 / Weyl / 实且 Weyl 条件按 N mod 8 的分类（Polchinski Table B.2），含 pseudoreal
statement: |
  设 `SO(N)`（紧致、欧氏号差）的 Γ 矩阵表示。`N = 2l` 时有 `2^l` 维表示，约化为两个 `2^{l−1}` 维
  Weyl 旋量表示；`N = 2l+1` 时有单一的 `2^l` 维表示。术语按原书 p.437 逐字：
  「Here *real* means the algebra can be written in terms of purely imaginary matrices. The term
  *pseudoreal* is often used for `N = 3, 4, 5 mod 8`, where the representation is conjugate to itself
  but cannot be written in terms of imaginary matrices.」

  **命题**：允许的实性 / Weyl 条件只依赖 `N` mod 8，按下表分布。

  **Table B.2（p.437，表题与表体逐字转录）**

  表题：「*Dimensions in which various conditions are allowed for `SO(N)` spinors.*」

  | `N` mod 8 | real | Weyl | real and Weyl |
  |---|---|---|---|
  | 0 | yes | self | yes |
  | 1 | yes | - | - |
  | 2 | yes | complex | - |
  | 3 | pseudo | - | - |
  | 4 | pseudo | self | - |
  | 5 | pseudo | - | - |
  | 6 | yes | complex | - |
  | 7 | yes | - | - |

  附带两条（原书同页）：
  (a) 两个 pseudoreal 表示的乘积是实的（p.437 逐字「two wrongs make a right — the product of two
      pseudoreal representations is real」），显式条件 `u*_{ij} = ε_{ii′}ε_{jj′}u_{i′j′}`（(B.1.39)）；
  (b) `SO(2l)` 的 Weyl 旋量乘积分解与 Minkowski 情形 (B.1.38) 形式相同，只把 `k+1` 换成 `l`（(B.1.41a–c)）。

  **本命题不断言**：
  (1) SO(8) 的**三重性**（triality）。原书 Table B.2 的 `N ≡ 0 (mod 8)` 行只说两个 Weyl 表示
      都是 real 且 self-conjugate，**全附录没有 "triality" 一词、没有 `8_s`/`8_c` 记号**
      （抽取记录 §3.2 第 1 条）。
  (2) `SO(8)` 上 `8 × 8`、`8 × 8′`、`8_v × 8_v` 的具体不可约分解数字（`1 + 28 + 35`、`8 + 56` 之类）。
      (B.1.41) 只给一般 `l` 的规则，**原书没有对 `l = 4` 写出这些数字**（§3.2 第 2 条）。
  (3) 多于一个类时方向的推广（p.438：只说依赖类空与类时维数之**差**，无证明）。
