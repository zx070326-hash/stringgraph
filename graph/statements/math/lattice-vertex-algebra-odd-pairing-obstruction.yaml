tags: [vertex-algebra, lattice, cocycle, no-go, math-input, original-result]
notes: |
  【为什么归入 math 而非 worldsheet】本命题的全部内容是纯代数：一个偶格 L 上的 2-cocycle ε
  （满足 (3.6)–(3.8)）与一个抽象的"无 cocycle 归一化"算子族之间的不相容性，证明只用到群代数、
  扭群代数的可逆元与 (3.14) 的逐系数展开，不引用任何世界面作用量、Virasoro、BRST 或时空维数。
  T、|0;λ⟩ 等记号虽然沿用了 proof.md 里"物理塔"的名字，但本卡（见"不断言"第 3 条）刻意剥离了
  这层物理外衣；按 `graph/schema/areas.yaml`，`math` 是"纯数学基础……供引用"，`worldsheet`
  要求"世界面理论：玻色弦/超弦的作用量、量子化、CFT……"，本命题不含后者的任何要素，故取 `math`。

  【与 worldsheet.physical-exponential-equals-voa-vertex-operator-v2 的关系】那张卡断言的是
  **正面**方向（秩 1 类光 ⟹ cocycle 平凡 ⟹ 存在等式），且卡内 notes 已经引用了本卡对应的
  proof.md 定理 6.8（作为"这不是取巧而是命题成立的边界"的旁证，见 -v2 卡历史与
  prior-art.md §3 的口头版本）。本卡是那条边界论证的量词完整、有证明版本，**不修改**那张卡。

  【与 Grotenhuis 2020 的关系，仅供背景，不构成本卡内容】proof.md 推论 6.9 用本定理精确裁定了
  `grotenhuis-2020`（Leiden 本科毕业论文）p.106 的识别句在他自己设定的一般偶格（如 Leech 格）上
  不成立——他的"We recognise …"是零论证的肉眼识别，且本卡的定理证明了那个识别在存在奇配对的
  偶格上**不可能**成立。若后续要把推论 6.9 单独立卡，引用 Grotenhuis 时必须同时说出
  `research/attempts/physical-exponential-equals-lattice-voa/prior-art.md` §2 的五条限定词
  （本科论文/非同行评议；论证强度为零且他自己的公式内部不自洽；他的命题是正定偶格 Leech
  而非本卡这种一般设定；他自陈关键推广步骤是假设；零模因子对不上），
  且只能主张"首次给出证明"，绝不可主张"首次陈述"——proof.md §0.3 已把这条纪律写死。
