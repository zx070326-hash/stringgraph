id: math.chevalley-restriction-theorem
kind: proposition
title: Chevalley 限制定理：限制映射 S(𝔤*)^𝔤 → S(𝔥*)^W 是同构（不变多项式由其在 Cartan 上的限制唯一决定）
statement: |
  设 𝔤 是复数域上的有限维半单李代数，𝔥 ⊂ 𝔤 是一个 Cartan 子代数，W 是相应的 Weyl 群
  （作用在 𝔥 与 𝔥* 上）。把 S(𝔤*) 看成 𝔤 上的多项式函数环，S(𝔤*)^𝔤 是其中的
  **Ad-不变（等价地 ad-不变）**多项式子环，S(𝔥*)^W 是 𝔥 上 W-不变多项式子环。则
  **限制映射**

      res : S(𝔤*)^𝔤 ⟶ S(𝔥*)^W,   f ↦ f|_𝔥

  是**良定义的分次代数同构**。特别地：

  **(1) 单**（本图实际用到的方向）：一个 Ad-不变多项式函数由它在 𝔥 上的取值唯一确定；
       于是两个 Ad-不变多项式若在 𝔥 上相等，就在整个 𝔤 上相等。
  **(2) 满**：每个 W-不变多项式都可延拓成 𝔤 上的 Ad-不变多项式。
  **(3) 保次数**：res 把 d 次齐次分量映到 d 次齐次分量。

  **本卡不断言**：
  (a) S(𝔥*)^W 的结构（「是多项式环，生成元次数为 d₁, …, d_n」是**另一条** Chevalley 定理，
      即有限反射群不变量环定理；对 W(E₈) 那些次数是 2, 8, 12, 14, 18, 20, 24, 30——本图暂未立卡）；
  (b) 泛包络代数中心 Z(U(𝔤)) 的 Harish-Chandra 同构——那是**第三条**定理，与本卡相关但不同
      （见 notes 的记号陷阱）；
  (c) 任何关于紧群上积分、Weyl 积分公式或特征标的事；
  (d) 正特征或非半单情形。
