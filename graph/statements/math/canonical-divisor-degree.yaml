id: math.canonical-divisor-degree
kind: proposition
title: "紧黎曼面上典范除子的次数：deg K = 2g − 2"
statement: |
  设 X 是**紧、连通**的黎曼面（无边），亏格为 g，K 为典范除子
  （任一非零亚纯 1-形式 ω 的除子 (ω)；任意两个这样的除子线性等价，故 deg K 与 ω 的选取无关）。
  则

    deg K = 2g − 2 。

  等价写法：以 χ = 2 − 2g 记该曲面的 Euler 数，则 deg K = −χ。
  记号与 math.riemann-roch-theorem 完全一致（deg D = Σ_p D(p)，g 是亏格）。

  推论（本卡直接给出、下游要用的两条）：
    deg(2K) = 4g − 4 ,     deg(K^{−1}) = deg(−K) = 2 − 2g 。
uses_conventions: []
sources:
  - ref: hartshorne-1977
    loc: "Ch. IV, §1（Riemann–Roch 所在小节；deg K = 2g − 2 在该节作为紧随 Riemann–Roch 的推论出现）"
    note: |
      ⚠ **本条只定位到小节，没有可核对的定理/推论编号，且原书未取得。**
      一手证据是引用方：D. L. Wynter, *An Exposition of the Riemann Roch Theorem for Curves*
      （University of Chicago REU 2016, pp. 11–12），researcher 已逐页读图（L1 对该文），
      其 **Corollary 5.2** 逐字为「If Y has canonical divisor K, then the degree of K is
      determined by the genus g of the curve Y. More precisely, we have that deg K = 2g − 2」，
      且紧接在它逐字引作 "Theorem IV.1.3, Hartshorne [2]" 的 Riemann–Roch 之后
      （math-sources.md §42.4）。Wynter 那篇未登记进 literature/sources.bib，
      故只写在本注里，不作 `ref`。
      **不得**据此编造 Hartshorne 的编号（例如写成 IV.1.3.3）；本项目对该编号没有任何证据。
  - ref: farkas-kra-1992
    loc: "§III.4 (Divisors and the Riemann–Roch Theorem, pp. 69–78) 与 §III.5 (Applications of the Riemann–Roch Theorem, pp. 79–90), 2nd ed."
    note: |
      ⚠ **只有小节标题与页码是 L1（DNB 出版方目录扫描 `d-nb.info/920606512/04`）；正文未取得。**
      本项目**无法判定** deg K = 2g − 2 落在 III.4 还是 III.5，故 loc 给出两节的页码区间。
      ⚠ **硬性禁令**：不得写 `Theorem III.4.8` 或 III.5 中的任何编号（math-sources.md §42.3）。
  - ref: eynard-2018-lectures
    loc: "Ch. 4（除子与 Riemann–Roch 一章；deg K = 2𝔤 − 2 的具体编号本项目未逐字核到）"
    note: |
      ⚠ **本条不承载编号**：researcher 只逐字核到该章的 Theorem 1.2 (1-10)、Definition 1.2 (1-5)(1-6)
      与 Proposition 5.1；**没有核到 deg K = 2𝔤 − 2 的编号**（读的是 p. 71–77、84–89）。
      列在这里只是因为它是本图唯一全文可得的黎曼面讲义，复核者可自行在 Ch. 4 内定位。
      **抄编号前必须自己翻 PDF**。
tags: [riemann-surface, divisor, canonical-bundle, genus, math-input]
notes: |
  **本节点为什么单立**：math.riemann-roch-theorem 的 statement 明写它**不断言** deg K = 2g − 2
  （那条卡的「刻意不断言的三件事」第 (a) 条）。而
  math.quadratic-differentials-minus-holomorphic-vector-fields--via-riemann-roch-at-2k
  正要用 deg(2K) = 4g − 4 这一步，故必须有一张卡承载它，否则那条推导会出现
  「用了一个图里没有的事实」。

  **教材里的标准证明（本图不复述、也不据此建边）**：对 D = K 用一次 Riemann–Roch，
    l(K) − l(0) = deg K + 1 − g ，
  再用 l(0) = 1（紧连通 ⇒ 全纯函数只有常数）与 l(K) = dim_C H⁰(X, K) = g
  （拓扑亏格 = 全纯 1-形式空间的维数），即得 deg K = 2g − 2。
  ⚠ 本图**没有** l(K) = g 这张卡（见 math.riemann-roch-theorem 的「不断言 (c)」），
  故这条推理**不能**在图里作为一条 depends_on 边落地；本卡因此走「教科书结论」路线，
  推导的 depends_on 为空（数学输入叶子）。若日后补上 l(K) = g 与 l(0) = 1 两张卡，
  可另挂一条 `--via-riemann-roch-at-k` 的推导，那条才是真正的图内论证。

  **可核对性诚实说明**：本卡是本次新增的三张数学卡里**编号最弱的一张**——
  没有任何一条 `loc` 精确到定理号。它之所以仍标 rigorous，依据是 docs/STATUS_LEVELS.md 第 4 级
  「有发表的、数学界接受的完整证明」：deg K = 2g − 2 是黎曼面理论的标准定理，
  三本教材各自都有完整证明，缺的只是本项目的**定位精度**，不是**论证存在性**。
  researcher 下一轮若拿到任一本正文，请把 loc 收紧到编号并删掉本段。
