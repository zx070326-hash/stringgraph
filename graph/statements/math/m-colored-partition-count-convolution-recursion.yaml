id: math.m-colored-partition-count-convolution-recursion
kind: proposition
title: "m 色分拆计数的精确卷积递推：p_{m+1}(N) = Σ_{k=0}^N p(k)·p_m(N-k)（对一切 N, m ≥ 0）"
statement: |
  沿用 math.m-colored-partition-count-closed-form 的记号（p_m(N)、p(N) := p_1(N)）。则
  对**一切** N ≥ 0、一切 m ≥ 0：

    p_{m+1}(N) = Σ_{k=0}^{N} p(k) · p_m(N-k)。

  （右边是通常分拆函数 p 与 m 色分拆计数 p_m 的 Cauchy 卷积。）
