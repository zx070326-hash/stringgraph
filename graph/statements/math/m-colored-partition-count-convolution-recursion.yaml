notes: |
  【论证，curator 亲自 Read proof.md §2 全文核对】直接来自姐妹卡
  math.m-colored-partition-count-closed-form 的生成函数式 Σp_m(N)X^N = P_R(X)^m：
  取 m+1 次幂 = m 次幂乘以 1 次幂，即
  Σp_{m+1}(N)X^N = P_R(X)^{m+1} = P_R(X)^m·P_R(X) = (Σp_m(N)X^N)·(Σp(N)X^N)，
  两边取 X^N 系数（形式幂级数乘法的定义）即得卷积式。proof.md 明确称这是
  "P_R(X)^{m+1} 里剥出一个 m=1 因子"的直接推论，无缺口。

  【范围边界】本卡不含 κ_N(m) 递推（姐妹卡
  math.m-colored-partition-count-kappa-recursion 由本卡代入两次/三次得到）。

