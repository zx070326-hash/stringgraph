id: math.even-self-dual-euclidean-lattices-dimension-16-v2
kind: proposition
title: 记号桥：Polchinski §11.6 的 Γ_16、Γ_8 分别就是 D_16^+ 与 E_8，故 16 维偶自对偶欧氏格恰是 {Γ_16, Γ_8 ⊕ Γ_8}
statement: |
  **本卡只做一件事：把 Polchinski §11.6 的物理侧记号接到数学侧的分类定理上。**
  分类本身（「16 维恰有两类、且两者不同构」）**不在本卡**，在
  math.even-unimodular-rank-16-classification。

  **(P) Polchinski 给出的显式坐标（§11.6, L1）**：
    `Γ_16`：格矢为
      `(n_1, …, n_16)`（全整数，(11.6.5a)）或 `(n_1 + ½, …, n_16 + ½)`（全半整数，(11.6.5b)），
      两种情形都要求 `Σ_i n_i ∈ 2Z`；
    `Γ_8`：同样的描述，分量数换成 8（(11.6.6a,b)）；`Γ_8 ⊕ Γ_8` 是两份 `Γ_8` 的正交直和
    （原书写作直积 `Γ_8 × Γ_8`）。

  **(M) Chenevier–Lannes 给出的显式坐标（§I.1, p. 1, L1）**：
    `E_n = D_n ⊕ Z e`，其中 `D_n = {(x_i) ∈ Z^n : Σ_i x_i ≡ 0 mod 2}`、`e = ½(1,…,1)`、`n ≡ 0 mod 8`；
    同书 p. 33 自陈 `E_n` 亦记作 `D_n^+`（«au moins pour `n ≥ 16`»）。
    ⚠ 这里的 `⊕` 是 `R^n` 内部生成的和（作为阿贝尔群是直和，**不是正交直和**）。

  **断言**：
    **(a)** `Γ_16 = D_16^+`（= Chenevier–Lannes 的 `E_16`），**作为 `R^16` 中的子集逐点相等**，
        不只是同构。
    **(b)** `Γ_8 = D_8^+ = E_8` 根格（Chenevier–Lannes 的 `E_8 = D_8 ⊕ Ze`），同样是逐点相等。
    **(c)** 因此，把 math.even-unimodular-rank-16-classification 的两个同构类
        `{D_16^+, E_8 ⊕ E_8}` 用 Polchinski 记号写出来，就是 `{Γ_16, Γ_8 ⊕ Γ_8}`。

  **本命题不断言的内容**：
    (1) **不**断言分类定理本身（「恰有两类」「两者不同构」）——那是上游的数学卡。
    (2) **不**断言秩被 8 整除——那是 math.even-unimodular-rank-divisible-by-8。
    (3) **不**断言「一致的 16 维内部 CFT ⟺ 偶自对偶欧氏格」这条物理桥；那条仍是 physical-argument，
        在 compact.heterotic-narain-lattice-even-self-dual 一侧。
    (4) **不**断言 `Γ_16` 与 `Spin(32)/Z_2` 权格的关系，也不断言 `l² = 2` 的格点构成根系
        （那是 worldsheet.heterotic-bosonic-construction-gauge-groups 的内容）。
