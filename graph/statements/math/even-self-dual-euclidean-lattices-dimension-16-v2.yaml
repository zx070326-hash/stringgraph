    note: |
      L1（抽取记录 literature/extractions/polchinski-1998-v2.md E63）。
      ⚠ 原书**只给坐标描述**；它既不写 `D_16^+`，也不引任何数学文献。
  - ref: chenevier-lannes-2014
    loc: "arXiv:1409.7616, §I.1, p. 1（`E_n = D_n ⊕ Ze` 的定义）；ch. II §3, p. 33（«Le réseau unimodulaire pair E_n est aussi noté D_n^+ (au moins pour n ≥ 16)»、«Pour n ≥ 16 … on a R(E_n) = R(D_n) = D_n»）"
    note: |
      L1（页图逐字；math-sources.md §47.3、§47.5）。
tags: [lattice, notation-bridge, heterotic, inferred-identification]
notes: |
  ★【本卡整体是抽取者/curator 做的坐标比对，任一文献都没有明写这条等同】
  math-sources.md §47.5 逐字：「`Γ_16 = D_16^+ = E_16(CL)` 的等同是抽取者做的比对（`inferred`，非任一文献明说）
  … curator 若要建这条等同边，**须标 `inferred: true`**」。本卡的推导据此标了 inferred。

  【比对的算术（本图补的，原文没有）】
  `D_16 ⊕ Ze` 的元素是 `x + k e`（`x ∈ D_16`，`k ∈ Z`）：
    · `k` 偶 ⇒ `ke = (k/2)(1,…,1)` 是整向量、分量和 `8k ≡ 0 mod 2`，故整向量部分恰为 `D_16`
      = 「全整数且 `Σ n_i ∈ 2Z`」= (11.6.5a)；
    · `k` 奇，写 `k = 2j+1` ⇒ `x + ke = x + j(1,…,1) + e`，即第 i 个分量为 `x_i + j + ½`；
      取 `n_i = x_i + j` 得 `Σ n_i = Σ x_i + 16j ≡ 0 mod 2`，故半整向量部分恰为
      「全半整数且 `Σ n_i ∈ 2Z`」= (11.6.5b)。反向包含同样逐项可验。
  8 分量情形同理。**这段验算本项目未经第二人复核**，故推导标 physical-argument 而非 rigorous
  （docs/STATUS_LEVELS.md 第 4 级的例外要求 `reviewer-verified:` 记录）。

  【★★ 记号陷阱（math-sources.md §47.5，务必随本卡一起读）】
    1. **`E_16` 不是李代数**：Chenevier–Lannes 的 `E_n := D_n ⊕ Ze` 只是他们对 `D_n^+` 的记号；
       不存在 `E_16` 型李代数，`E_16` 的根系是 `D_16` 型（原书 p. 33）。
    2. **`Λ_16` 在两处指不同的格**：Zagier (2008) p. 34 的 `Λ_16` = 16 维偶幺模不可分解格（= `D_16^+`）；
       Chenevier–Lannes **附录 A**（p. 339）的 `Λ_16` = **Barnes–Wall 格 `BW_16`**（最小范数 4，**不是幺模格**）。
       ⛔ 不可混。本卡一律不使用 `Λ_16` 这个符号。
    3. Zagier 同一篇文章内部也换记号：p. 34 用 `Λ_8/Λ_16`，p. 36 用 `Γ_8/Γ_16`。

  【本卡换代自】math.even-self-dual-euclidean-lattices-dimension-16（旧卡把两条独立数学定理
  ＋ 记号描述压在一起，见 math-sources.md §47.0、§47.6(a)）。旧卡的数学内容已拆到
  math.even-unimodular-rank-divisible-by-8 与 math.even-unimodular-rank-16-classification；
  本卡只留记号桥这一半。
