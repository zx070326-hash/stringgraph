id: math.locality-ope-equivalences
kind: proposition
title: 形式分布的局域性 ⟺ delta 分解 ⟺ 物理写法的 OPE ⟺ 模式对易子公式（Schottenloher Thm 10.10）
statement: |
  设 R 是含幺结合代数，A, B ∈ R[[z^{±1}]] 是形式分布（记号与 math.formal-distribution-locality 相同：
  A(z) = Σ_n A_{(n)} z^{-n-1}），N ∈ N。

  **记号**（按通行定义补写，来源正文的措辞见 notes）：
    D^j := (1/j!) ∂_w^j；
    对只在 z = 0、w = 0 或 |z| = |w| 有极点的有理函数 F(z, w)，i_{z,w} F 表示 F 在区域 {|z| > |w|} 上的
    幂级数展开（即把 (z-w)^{-1} 按 w/z 的正幂展开），i_{w,z} F 表示在 {|z| < |w|} 上的展开；
    二者之差满足 i_{z,w}(z-w)^{-1} - i_{w,z}(z-w)^{-1} = δ(z-w)；
    A(z)_- := Σ_{n < 0} A_{(n)} z^{-n-1}，A(z)_+ := Σ_{n ≥ 0} A_{(n)} z^{-n-1}，
    正规序积 :A(z)B(w): := A(z)_- B(w) + B(w) A(z)_+。

  **命题**：下列五条性质对 A, B 与给定的 N 两两等价：
  1. A, B 互为局域且 (z - w)^N [A(z), B(w)] = 0；
  2. **delta 分解**：存在 C^j ∈ R[[w^{±1}]]（j = 0, …, N-1）使
       [A(z), B(w)] = Σ_{j=0}^{N-1} C^j(w) D^j δ(z - w)；
  3. 存在 C^j ∈ R[[w^{±1}]] 使
       [A(z)_-, B(w)] = Σ_{j=0}^{N-1} i_{z,w} (z - w)^{-(j+1)} C^j(w),
      -[A(z)_+, B(w)] = Σ_{j=0}^{N-1} i_{w,z} (z - w)^{-(j+1)} C^j(w)；
  4. **物理写法的 OPE**：存在 C^j ∈ R[[w^{±1}]] 使
       A(z)B(w) = Σ_{j=0}^{N-1} i_{z,w} (z - w)^{-(j+1)} C^j(w) + :A(z)B(w):,
       B(w)A(z) = Σ_{j=0}^{N-1} i_{w,z} (z - w)^{-(j+1)} C^j(w) + :A(z)B(w):；
  5. **模式对易子公式**：存在 C^j = Σ_{k ∈ Z} C^j_{(k)} w^{-k-1} ∈ R[[w^{±1}]] 使对一切 m, n ∈ Z
       [A_{(m)}, B_{(n)}] = Σ_{j=0}^{N-1} (m choose j) C^j_{(m+n-j)}。
  并且各条中的系数分布 C^j 是同一组，由 A, B 唯一确定：
       C^j(w) = Res_z (z - w)^j [A(z), B(w)],   0 ≤ j < N。

  物理记号下第 4 条的第一式写作 A(z)B(w) = Σ_{j=0}^{N-1} C^j(w)/(z-w)^{j+1} + :A(z)B(w):，
  其中「默认 |z| > |w|」的含义**只是**选定 i_{z,w} 这种形式展开；只写奇异部分即
  A(z)B(w) ∼ Σ_{j=0}^{N-1} C^j(w)/(z-w)^{j+1}。本命题**不含任何收敛性断言**：z, w 始终是形式变量。
uses_conventions: []
superseded_by: math.locality-ope-equivalences-v2
sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Theorem 10.10 (five equivalent properties), p. 178；delta 分解的存在唯一性与系数公式 c^n(w) = Res_z (z−w)^n f(z,w) 见 Proposition 10.6, p. 175；**Definition 10.9（正规序积 :A(z)B(w): = A(z)_+ B(w) + B(w) A(z)_−）, p. 178**；模指标记号段 A_{(n)} = A_{−n−1} = Res_z A(z) z^n 与 A(z)_± 的拆分见 p. 177（紧接 Remark 10.8）；物理记号的翻译段与「This is a kind of operator product expansion」见 p. 179；i_{z,w} / i_{w,z} 与 (10.1) 见 p. 177 \"Analytic Aspects\" 段"
    note: |
      **L1（researcher 逐页读图核实，2026-09-11 两轮，math-sources.md §11.2–§11.3 与 §11A）**：
      五条性质、Proposition 10.6、p. 177 的记号段与 Definition 10.9 **全部已逐字转录**见该文件；
      本节点第 2、4、5 条的公式与「记号」段照抄转录，第 1 条即 Definition 10.7。

      **★ 第 5 条求和下限（原 Q10）：已结案——印本印作 j = 1，判为排印错误，本节点按 j = 0。**
      判定依据见 notes 的「Q10 结案记录」。这是本节点公式与被引页面**不逐字一致**的**唯一**一处，
      按项目原则 2 在此留痕，回译审计时请对照 notes。

      **本卡（v1）的「记号」段不是逐字转录**：它自我声明为「按通行定义补写」，写的是 Kac 一系文献的
      ± 惯例（A(z)_- = Σ_{n<0}，A(z)_+ = Σ_{n≥0}，:AB: = A_- B + B A_+）。第三轮逐字转录 p. 177 记号段与
      Definition 10.9 的结果与之**相反**，那份逐字版是 **math.locality-ope-equivalences-v2**；
      本卡因此 superseded_by v2，且**不再挂任何推导**。经过见 notes 的「换代记录」。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, Definition 5.9 式 (5.27)：[A_m, B_k] = Σ_{l=0}^{N−1} (m choose l) C^l_{m+k−l}"
    note: |
      **只作第 5 条求和下限的旁证**（L1 逐字，math-sources.md §8.3）：这是本图判定
      schottenloher-2008 印本第 5 条的 `j = 1` 是排印错误、下限应为 `j = 0` 的四条依据之一
      （另三条来自 schottenloher-2008 内部，见 notes 的 Q10 结案记录）。
      **本节点的主线不引 Gui**：Gui 的等价性是在**复解析**局域性的前提下证的（前提比本节点强），
      本节点整篇停在形式级数层面。要引 Gui 的解析路线请用
      math.vertex-algebra-ope-analytic-convergence。
      ⚠ 版本陷阱：gui-2023-lectures 的编号随版次变动，`loc` 必须带日期版号。
tags: [vertex-algebra, formal-distribution, locality, ope, commutator, math-input]
notes: |
  **★ Q10 结案记录（2026-09-11 第三轮，math-sources.md §11A.3）**：
  **印本 Theorem 10.10 第 5 条的求和下限印作 `j = 1`；判定为排印错误，本图按 `j = 0`。**
  researcher 先读 PDF 第 7–9 页一次，再单独重取第 8 页放大复读一次，**两次判读一致：页面上确实印着 j = 1**。
  判为排印错误的四条独立依据：
  1. **同一条定理内部不自洽**：第 2、3、4 条都是 Σ_{j=0}^{N−1}，且用的是**同一批** C^j 与**同一个** N。
     若第 5 条真从 j = 1 起，它就严格弱于第 2–4 条，「五条等价」不成立。（L1，同页对照）
  2. **Proposition 10.6 (p. 175) 产出的正是 c^0, …, c^{N−1}**（j 从 0 到 N−1）；第 5 条丢掉 j = 0 项
     等于丢掉 Prop 10.6 给出的一个系数。（L1）
  3. **独立文献的同一条公式下限是 0**：gui-2023-lectures (2026-07-15 版) Definition 5.9 式 (5.27) 写作
     [A_m, B_k] = Σ_{l=0}^{N−1} (m choose l) C^l_{m+k−l}。（L1，另一份文献）
  4. **本章这一带有系统性的交叉引用排印错误**：p. 179 写「according to **4 in Lemma 10.5**」，
     p. 180 两处写「our **Theorem 10.5**」「property **5 in Lemma 10.5**」——**三处**的「10.5」都应为「10.10」
     （10.5 是 delta 恒等式引理，没有 property 4/5）。同一区域已有三处编号误植。（L1）
  另有一条**反例**（researcher 由书上 p.179–180 的数据推出，非原文）：Virasoro 情形书上给
  [T(z),T(w)] = (Z/12)∂³δ(z−w) + 2T(w)∂_wδ(z−w) + ∂_wT(w)δ(z−w)，故 **C⁰(w) = ∂_wT(w) ≠ 0**；
  若第 5 条从 j = 1 起就会把这一项整个丢掉。
  ⚠ **不要用书上 p. 179 的 Heisenberg 例子去「验证」下限**：那里正文写「Because of C¹(w) = Z and
  C^j(w) = 0 for j ≠ 1 …」，即该例恰好 **C⁰ = 0**，j = 0 与 j = 1 在这个例子里给出**相同**答案，
  **它对两者没有区分力**。这是个容易上当的地方。

  **★ 换代记录（2026-09-11，lead 裁决）：本卡 superseded_by math.locality-ope-equivalences-v2。**
  本卡「记号」段自我声明为「按通行定义补写」，把 A(z)_- 写成 Σ_{n<0}、A(z)_+ 写成 Σ_{n≥0}、
  :A(z)B(w): 写成 A(z)_- B(w) + B(w) A(z)_+，并预告「若日后核对原页发现 ± 记法相反，
  只影响第 3、4 条中 ± 的标签」。第三轮 researcher 逐字转录 p. 177 记号段与 Definition 10.9 后确认两件事：
  (a) **原书的方向正好相反**（A(z)_- = Σ_{n≥0}，A(z)_+ = Σ_{n<0}，:AB: = A_+ B + B A_-）；
  (b) 本卡的记号段**自相矛盾**——按它自己的 ± 定义算，A(z)B(w) − :A(z)B(w): = [A(z)_+, B(w)]，
      与它自己的第 3 条第一式 [A(z)_-, B(w)] = Σ_j i_{z,w}(z−w)^{-(j+1)} C^j(w) 对不上。
  曾有一版把记号段**就地改写**为逐字转录（提交 b7d1ac9）。**那违反项目原则 1「陈述不可变」**，
  已按 lead 裁决回退：本卡的 statement 文本恢复为改写前（提交 25e82e6）的原样，逐字转录版另立为 v2。
  **数学内容上 v1 与 v2 的差别只在 ± 两个标签的定义**：:A(z)B(w): 作为算符表达式
  （模指标为负的那一半写在左边）两卡完全相同，第 1–5 条的等价性也完全相同。
  但 v1 的第 3、4 条与 v1 自己的记号段不自洽，**不要引用本卡的第 3、4 条**，改引 v2。
  本卡**没有推导**（原 math.locality-ope-equivalences--via-schottenloher 已改名为
  math.locality-ope-equivalences-v2--via-schottenloher 并改指 v2），故有效状态为 open——
  这是刻意的，且因 superseded_by 已设，`stringgraph report` 会把它列在 superseded 而不是 open 命题里。

  ⚠ **下游一致性（2026-09-11，curator）**：图中有两张卡的陈述文本沿用本卡（v1）的 ± 标签写法
  `:A(z)B(w): = A(z)_- B(w) + B(w) A(z)_+`——worldsheet.string-cft-is-a-vertex-algebra-v2 与
  worldsheet.ope-pole-mode-commutator-dictionary。两者的散文描述都是「把模指标为负的（产生）模写到左边」，
  **与来源逐字一致，挑出的正规序积本身没错**，故结论不受影响；陈述不可变，两卡的文本都不改，
  已在各自 notes 里登记。完整比对见 v2 的同名段落。

  **本节点的作用**：它把图里「OPE 的极点结构 ⟺ 模式对易关系」这条一直只有物理论证的边
  （worldsheet.ope-commutator-dictionary--via-contour-deformation 用围道变形）在**形式分布层面**变成一条
  带编号的严格定理（第 4 条 ⟺ 第 5 条）。它**不能**直接替代物理侧的节点，因为：
  (a) 它的前提是形式局域性（第 1 条），而弦论世界面 CFT 的场是否满足这一前提在本图中是 open
      （worldsheet.string-cft-is-a-vertex-algebra）；
  (b) 它不断言任何收敛性，物理侧 OPE 的「有限收敛半径」在解析侧另有节点
      （math.vertex-algebra-ope-analytic-convergence，前提是复解析局域性）。
  Schottenloher 本人在 p.179 说第 4 条「is **a kind of** operator product expansion as in Sect. 9.3」——
  是「一种」，不是「就是」。本节点忠实保留这一措辞。

  **本卡的记号段是「按通行定义补写」，不是逐字转录**；逐字转录见 v2。
  **不要就地把本卡改成 Kac 惯例或来源惯例中的任何一种**：本卡已冻结。
  若要引用来源方向下的第 3、4 条，用 math.locality-ope-equivalences-v2；
  若日后要引用 Kac 惯例下的同一条定理且需要一张自洽的卡，按项目规则新建节点。

  **与 Kac 的关系**：Schottenloher 正文（p.175）逐字把 Proposition 10.6 归功于 Kac [Kac98*]，
  且本章「based mainly on the course [Kac98*]」。但按 math-sources.md §10.3 的禁令，本节点**不引**
  `Kac, Theorem 2.3` 或 `Kac, Corollary 2.2`（编号存在但内容未核实，且两个归属互相冲突）；
  要 Kac 就引 Schottenloher 的这条可核实替身。

  **建议的后续拆分**：Proposition 10.6（delta 分解的存在唯一性）本身是一条独立引理，日后若有推导
  单独需要它，可拆成 math.formal-delta-decomposition；本批为控制节点数，把它只作为本推导的中间步骤记入 sources。
