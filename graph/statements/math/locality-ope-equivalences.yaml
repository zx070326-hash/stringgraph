id: math.locality-ope-equivalences
kind: proposition
title: 形式分布的局域性 ⟺ delta 分解 ⟺ 物理写法的 OPE ⟺ 模式对易子公式（Schottenloher Thm 10.10）
statement: |
  设 R 是含幺结合代数，A, B ∈ R[[z^{±1}]] 是形式分布（记号与 math.formal-distribution-locality 相同：
  A(z) = Σ_n A_{(n)} z^{-n-1}），N ∈ N。

  **记号**（**逐字转录自来源 p. 177–178**，researcher 2026-09-11 L1 读图；
  本节点用 ASCII 的 i_{z,w} 记原文的 ι_{z,w}，(m choose j) 记二项式系数，其余照抄）：

    D^j := (1/j!) ∂_w^j；

    **模指标**（p. 177 记号段，原文逐字）：对 A = Σ A_m z^m 一律改写为 A = Σ A_{(n)} z^{-n-1}，于是
        A_{(n)} = A_{-n-1} = Res_z A(z) z^n；

    **两种形式展开**（p. 177 "Analytic Aspects" 段，原文逐字）：
        i_{z,w} 1/(z-w)^{j+1} = Σ_{m=0}^{∞} (m choose j) z^{-m-1} w^{m-j},
        i_{w,z} 1/(z-w)^{j+1} = - Σ_{m=1}^{∞} (-m choose j) z^{m-1} w^{-m-j};
      即 i_{z,w} 取 {|z| > |w|} 上的幂级数展开、i_{w,z} 取 {|z| < |w|} 上的展开——
      「|z| > |w|」在本章中**只是这两种形式展开的名字，不是收敛域**。二者之差给出 (10.1)
        i_{z,w}(z-w)^{-1} - i_{w,z}(z-w)^{-1} = Σ_{m ≥ 0} z^{-m-1} w^m + Σ_{m > 0} z^{m-1} w^{-m}
                                              = Σ_{m ∈ Z} z^{-m-1} w^m = δ(z-w)，
      以及（原文逐字）
        D^j δ(z-w) = i_{z,w} 1/(z-w)^{j+1} - i_{w,z} 1/(z-w)^{j+1} = Σ (m choose j) z^{-m-1} w^{m-j}。

    **正负部分的拆分**（p. 177 记号段，原文逐字；⚠ 方向见下面的警告）：
        A(z)_- := Σ_{n ≥ 0} A_{(n)} z^{-n-1},    A(z)_+ := Σ_{n < 0} A_{(n)} z^{-n-1}；
      该拆分满足 (∂A(z))_± = ∂(A(z)_±)，且（原文逐字）"conversely, this property determines this decomposition"。

    **正规序积**（**Definition 10.9, p. 178，原文逐字**）：
        :A(z)B(w): := A(z)_+ B(w) + B(w) A(z)_- ∈ R[[z^{±1}, w^{±1}]]，
      等价地 :A(z)B(w): = Σ_{n∈Z} ( Σ_{m<0} A_{(m)}B_{(n)} z^{-m-1} + Σ_{m≥0} B_{(n)}A_{(m)} z^{-m-1} ) w^{-n-1}，
      并由此得到（同一 Definition 之下，原文逐字）
        A(z)B(w) = +[A(z)_-, B(w)] + :A(z)B(w):,
        B(w)A(z) = -[A(z)_+, B(w)] + :A(z)B(w):。

  ⚠⚠ **约定警告（本节点最容易被抄反的一点）**：来源的下标 `-` 是**模指标 n ≥ 0 的那一半**
  （即 z 的**负**幂部分，含 Res），`+` 是 n < 0 的那一半（z 的**非负**幂部分）。
  **这与物理里常见的「+ = 湮灭部分、- = 产生部分」记法方向相反**，也与「按 z^{±} 的幂次命名」的直觉相反。
  作为**算符表达式**的正规序积与物理写法**一致**（模指标为负的那一半写在左边）；方向相反的**只是 ± 这两个标签**。
  抄下面第 3、4 条时若把 ± 弄反，写出来的等式是错的（见 notes 的「记号段的更正记录」）。

  **命题**：下列五条性质对 A, B 与给定的 N 两两等价：
  1. A, B 互为局域且 (z - w)^N [A(z), B(w)] = 0；
  2. **delta 分解**：存在 C^j ∈ R[[w^{±1}]]（j = 0, …, N-1）使
       [A(z), B(w)] = Σ_{j=0}^{N-1} C^j(w) D^j δ(z - w)；
  3. 存在 C^j ∈ R[[w^{±1}]] 使
       [A(z)_-, B(w)] = Σ_{j=0}^{N-1} i_{z,w} (z - w)^{-(j+1)} C^j(w),
      -[A(z)_+, B(w)] = Σ_{j=0}^{N-1} i_{w,z} (z - w)^{-(j+1)} C^j(w)；
  4. **物理写法的 OPE**：存在 C^j ∈ R[[w^{±1}]] 使
       A(z)B(w) = Σ_{j=0}^{N-1} i_{z,w} (z - w)^{-(j+1)} C^j(w) + :A(z)B(w):,
       B(w)A(z) = Σ_{j=0}^{N-1} i_{w,z} (z - w)^{-(j+1)} C^j(w) + :A(z)B(w):；
  5. **模式对易子公式**：存在 C^j = Σ_{k ∈ Z} C^j_{(k)} w^{-k-1} ∈ R[[w^{±1}]] 使对一切 m, n ∈ Z
       [A_{(m)}, B_{(n)}] = Σ_{j=0}^{N-1} (m choose j) C^j_{(m+n-j)}。
  并且各条中的系数分布 C^j 是同一组，由 A, B 唯一确定：
       C^j(w) = Res_z (z - w)^j [A(z), B(w)],   0 ≤ j < N。

  物理记号下第 4 条的第一式写作 A(z)B(w) = Σ_{j=0}^{N-1} C^j(w)/(z-w)^{j+1} + :A(z)B(w):，
  其中「默认 |z| > |w|」的含义**只是**选定 i_{z,w} 这种形式展开；只写奇异部分即
  A(z)B(w) ∼ Σ_{j=0}^{N-1} C^j(w)/(z-w)^{j+1}。本命题**不含任何收敛性断言**：z, w 始终是形式变量。
