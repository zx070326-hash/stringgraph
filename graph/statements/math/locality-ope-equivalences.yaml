sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Theorem 10.10 (five equivalent properties), p. 178；delta 分解的存在唯一性与系数公式 c^n(w) = Res_z (z−w)^n f(z,w) 见 Proposition 10.6, p. 175；**Definition 10.9（正规序积 :A(z)B(w): = A(z)_+ B(w) + B(w) A(z)_−）, p. 178**；模指标记号段 A_{(n)} = A_{−n−1} = Res_z A(z) z^n 与 A(z)_± 的拆分见 p. 177（紧接 Remark 10.8）；物理记号的翻译段与「This is a kind of operator product expansion」见 p. 179；i_{z,w} / i_{w,z} 与 (10.1) 见 p. 177 \"Analytic Aspects\" 段"
    note: |
      **L1（researcher 逐页读图核实，2026-09-11 两轮，math-sources.md §11.2–§11.3 与 §11A）**：
      五条性质、Proposition 10.6、p. 177 的记号段与 Definition 10.9 **全部已逐字转录**见该文件；
      本节点第 2、4、5 条的公式与「记号」段照抄转录，第 1 条即 Definition 10.7。

      **★ 第 5 条求和下限（原 Q10）：已结案——印本印作 j = 1，判为排印错误，本节点按 j = 0。**
      判定依据见 notes 的「Q10 结案记录」。这是本节点公式与被引页面**不逐字一致**的**唯一**一处，
      按项目原则 2 在此留痕，回译审计时请对照 notes。

      **记号段（原 L0 部分）：已于 2026-09-11 第三轮补齐为逐字转录**，并因此更正了 ± 标签的方向，
      见 notes 的「记号段的更正记录」。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, Definition 5.9 式 (5.27)：[A_m, B_k] = Σ_{l=0}^{N−1} (m choose l) C^l_{m+k−l}"
    note: |
      **只作第 5 条求和下限的旁证**（L1 逐字，math-sources.md §8.3）：这是本图判定
      schottenloher-2008 印本第 5 条的 `j = 1` 是排印错误、下限应为 `j = 0` 的四条依据之一
      （另三条来自 schottenloher-2008 内部，见 notes 的 Q10 结案记录）。
      **本节点的主线不引 Gui**：Gui 的等价性是在**复解析**局域性的前提下证的（前提比本节点强），
      本节点整篇停在形式级数层面。要引 Gui 的解析路线请用
      math.vertex-algebra-ope-analytic-convergence。
      ⚠ 版本陷阱：gui-2023-lectures 的编号随版次变动，`loc` 必须带日期版号。
