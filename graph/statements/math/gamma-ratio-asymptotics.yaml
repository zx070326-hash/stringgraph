id: math.gamma-ratio-asymptotics
kind: proposition
title: Γ 商的渐近 Γ(z+a)/Γ(z+b) ∼ z^{a−b} 与 Beta 函数的 Regge 型渐近 B(a,b) ∼ Γ(b) a^{−b}
statement: |
  **(1)（Γ 商）** 对固定的 a, b ∈ C 与任意 δ > 0，当 |z| → ∞ 且 |arg z| ≤ π − δ 时
    Γ(z + a) / Γ(z + b) = z^{a−b} ( 1 + O(1/z) )。

  **(2)（Beta 函数的单参数渐近）** 由 (1) 与 B(a,b) = Γ(a)Γ(b)/Γ(a+b)
  （math.euler-beta-integral），对**固定**的 b，当 |a| → ∞ 且 |arg a| ≤ π − δ 时
    B(a, b) = Γ(b) · a^{−b} ( 1 + O(1/a) )。

  **(3)（本图使用的形式）** 用于 Regge 极限时取 a = −α(s)（s → +∞，故 a 沿**负实轴**趋于 ∞）、
  b = −α(t)（固定）。形式上代入 (2) 得
    B(−α(s), −α(t)) ∼ Γ(−α(t)) · (−α(s))^{α(t)} ∝ s^{α(t)} Γ(−α(t))，
  即 Regge 幂次由 t 通道的轨迹函数 α(t) 给出。
  ⚠ **该代入超出 (1)(2) 的适用域**：arg a = π 恰是被排除的方向，且 Γ(a) 的极点
  a = 0, −1, −2, … 全部落在这条射线上。物理文献的做法是让 s 带一个小虚部
  （或等价地对极点做平均），本图不把这一步当作已论证，见推导 gaps。

  **(4)（Stirling 公式的记录）** 上面 (1) 的通常证明途径是 Stirling 公式
    Γ(x + 1) = x^x e^{−x} (2π x)^{1/2} (1 + O(1/x))。
  ⚠ 见 notes 中关于 Polchinski 印刷版与二手源转引之间的差异。
sources:
