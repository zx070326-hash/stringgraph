tags: [math, special-functions, gamma-function, asymptotics, stirling, regge]
notes: |
  由 curator 于 2026-09-11 在转写 Polchinski 第 6 章时拆出（把 Regge 渐近里的纯数学部分与
  「振幅」这个路径积分对象分开，使前者不被后者的测度问题拖累）。

  **⚠ 关于 Stirling 公式的一处文献歧义（须记入 auditor 视野）**：抽取记录 #E100 逐字引 [S] 的脚注 4：
  「There is a typo in Joe's book, as per his errata page. Stirling's formula should read
  Γ(x+1) = x^x e^{−x} **(2/πx)^{1/2}**.」——[S] 转引的这个「更正后」形式与标准的
  Γ(x+1) ∼ x^x e^{−x} **(2πx)^{1/2}** 不符（(2/πx)^{1/2} 与 (2πx)^{1/2} 相差因子 πx·(2/2)，
  在 x → ∞ 时是完全不同的量级）。本卡片 (4) 采**标准形式**。
  可能的解释：[S] 自己的转录笔误（他把 (2πx)^{1/2} 打成了 (2/πx)^{1/2}），
  或原书与勘误表用了不同的排版约定。**本项目取不到 Polchinski 官方勘误表**（Q14：KITP 三条 URL 全部 404），
  故无法裁定。这不影响 Regge 幂次结论（(2) 只用 Γ 商的渐近，与 Stirling 前因子无关），
  但**不得照抄 [S] 的那一行**。

  **⚠ 为什么不是 rigorous**：与 math.euler-beta-integral 同样的记账理由——本图没有登记特殊函数
  数学来源，也没有 reviewer 复核记录。升级路径：researcher 登记 DLMF（Γ 商渐近是 DLMF 第 5 章
  「Asymptotic Expansions」一节的标准结果）并核对位置后即可改 rigorous。
