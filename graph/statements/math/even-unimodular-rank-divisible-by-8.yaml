tags: [lattice, number-theory, modular-forms, quadratic-forms, heterotic]
notes: |
  【术语桥：even unimodular（数学）= even self-dual（物理）】
  数学文献写 "even unimodular" / «réseau unimodulaire pair»，物理文献（Polchinski §11.6，(11.6.4b) 写 `Γ = Γ*`）
  写 "even self-dual"。**对正定整格两者是同一件事**（`L = L*` ⟺ `det = 1` ⟺ unimodular）。
  ⚠ 这条等同是抽取者做的术语比对（math-sources.md §47.0、§47.5），**不是 Zagier 原文的句子**；
  依赖本卡的推导若要用物理侧措辞，应在该边上标 `inferred: true`。

  【作者自陈：存在纯代数证明】Zagier 在 p. 34 逐字写：
  «The first statement of Proposition 12 is purely algebraic, and purely algebraic proofs are known,
  but they are not as simple or as elegant as the modular proof just given.
  No non-modular proof of the asymptotic formula (38) is known.»
  ⇒ 本卡**不必**把整套模形式机器拖进依赖图；本图现有的 `--via-zagier` 推导记录的是书上那条模形式证明，
  但「存在纯代数证明」这一事实由作者背书，故本卡不因缺少模形式节点而降级。
  （纯代数路线的标准出处是 Serre *A Course in Arithmetic* Ch. V 或 Milnor–Husemöller Ch. II，
  ⛔ 但两书正文本项目**未取到**，**定理号一律不得写入图**，见 math-sources.md §47.4(a)(b) 与 §47.6(d)。）

  【本卡不覆盖的第三条命题】杂化弦「规范群恰有两个」还要一条**物理桥**：
  「一致的 16 维内部 CFT（局域 OPE + 模不变）⟺ 偶自对偶欧氏格」。
  那条仍是 `physical-argument`（Polchinski §11.6，推给 v1 §8.4），**不在本卡内**，
  也**不会**因本卡是 rigorous 而变严格。
