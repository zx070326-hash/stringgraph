id: math.even-unimodular-rank-divisible-by-8
kind: proposition
title: 正定偶幺模二次型（等价地：偶自对偶欧氏格）的秩必被 8 整除
statement: |
  **(二次型表述，与来源逐字对应)** 设 `Q : Z^m → Z` 是 m 元**正定偶幺模**二次型
  （positive definite even unimodular quadratic form）。则 **m 被 8 整除**。

  **(格论表述)** 设 `L ⊂ R^m` 是秩 m 的格，内积取 R^m 的欧氏正定内积，满足
    (i) **偶**：`x·x ∈ 2Z` 对一切 `x ∈ L`；
    (ii) **幺模**：Gram 行列式为 1（等价地 covolume = 1，等价地 `L = L*`，`L*` 为对偶格）。
  则 `m ≡ 0 (mod 8)`。

  **本命题不断言的内容**：
    (1) **不**断言 16 维（或任何维数）的**分类**。「16 维恰有两个」是一条独立定理，
        见 math.even-unimodular-rank-16-classification。⚠ 本卡**不蕴涵**那一条，
        那一条也**不是**本卡的 n = 16 特例。
    (2) 不断言 `m ≡ 0 (mod 8)` 时这样的格**存在**（存在性由 `E_8` 的 k 重直和给出，本卡不涉及）。
    (3) 不断言不定号差（洛伦兹）情形的任何结论；本卡前提含**正定**。
    (4) 不断言 Zagier Proposition 12 的第 (ii) 条（表示数的渐近公式 `R_Q(n)`），那是同一命题的另一半，
        本图不需要，故不入卡（一节点一命题）。
sources:
