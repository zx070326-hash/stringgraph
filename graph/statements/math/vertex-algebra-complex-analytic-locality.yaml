notes: |
  **为什么这是定义卡而不是命题卡**（math-sources.md §13.2 建议 1）：Gui 证明了复解析版 ⟺ 形式变量版 ⟺ Lie 括号版
  （§7.7 散文断言 + §7.8–§7.12 分段证明，**没有编号定理**），但那是关于本定义与 math.formal-distribution-locality
  的一条命题；本节点本身只是一条定义，不因等价性而变成定理。若日后要把「三版等价」单独立节点，
  loc 只能写「§7.7–§7.12」，且必须注明「本书未把它写成编号定理」。

  **为什么 status 是 rigorous**：被定义对象（若干多变量全纯函数的收敛与延拓性质）全部是标准复分析概念，
  a.l.u. 收敛有逐字定义，Conf²(C^×) 有显式描述，无未定义操作。

  **与物理 OPE 的关系**：这是物理侧「径向排序乘积 R{A(z_1)B(z_2)} 在环域上收敛、两种排序互为解析延拓」的严格版本
  中**关于两个场**的那部分（M 个场是 Gui Theorem 8.1，本批未落卡）。配对是 V′-双线性配对而非正定内积，
  故洛伦兹不定号本身对本定义不是障碍；但 Gui 全书没有一处处理不定内积下的幺正性（math-sources.md §8.8）。

  **弦论能否满足本定义**：本图中为 open——worldsheet.string-cft-is-a-vertex-algebra。
  已核实的只有单个 c = 1 自由玻色子的 Heisenberg 情形（Schottenloher pp.181–182；Kytölä Thm 10.1 / Cor 10.2，
  且后者只到 Lie 代数层面，不含局域性）。

  **本节点刻意不声明任何约定节点**：无度规、无 α'、无 Virasoro 中心项归一化。
