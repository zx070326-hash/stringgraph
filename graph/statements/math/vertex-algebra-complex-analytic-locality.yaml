id: math.vertex-algebra-complex-analytic-locality
kind: definition
status: rigorous
title: 场的局域性（复解析版，Gui Def. 7.2）：矩阵元级数 a.l.u. 收敛并解析延拓到 Conf²(C^×) 上同一个全纯函数，对角线极点阶一致有界
statement: |
  **背景对象**（Gui 讲义的常设假定）：V = ⊕_{n ∈ N} V(n) 是 N-分次复向量空间，P_n 是到 V(n) 的分次投影，
  V′ = ⊕_n V(n)^* 是分次对偶，⟨v′, v⟩ 是 V′ × V → C 的双线性配对（**不是**正定内积）。
  场 A(z) = Σ_{n ∈ Z} A_n z^{-n-1} ∈ End(V)[[z^{±1}]] 取齐次场（其模 A_n 把分次分量平移固定量；精确定义见来源）。
  记 C^× = C \ {0}，Conf²(C^×) = {(z_1, z_2) ∈ C^× × C^× : z_1 ≠ z_2}。

  **a.l.u. 收敛（Definition 7.1）**：设 Ω 是局部紧 Hausdorff 空间。函数级数 Σ_n f_n 在 Ω 上
  **绝对且局部一致收敛**（converges absolutely and locally uniformly, a.l.u.），若每点 x_0 ∈ Ω 有邻域 U 使
    sup_{x ∈ U} Σ_n |f_n(x)| < +∞；
  等价地，对每个紧子集 K ⊂ Ω 有 sup_{x ∈ K} Σ_n |f_n(x)| < +∞。

  **定义（局域性，复解析版；Definition 7.2）**：称齐次场 A(z) 与 B(z) **互为局域**，若对每个 v ∈ V、v′ ∈ V′ 下列两条成立：
  1. 级数
       ⟨v′, A(z_1)B(z_2)v⟩ := Σ_{n ∈ N} ⟨v′, A(z_1) P_n B(z_2) v⟩,                     (7.2a)
       ⟨v′, B(z_2)A(z_1)v⟩ := Σ_{n ∈ N} ⟨v′, B(z_2) P_n A(z_1) v⟩                      (7.2b)
     分别在开集
       Ω_1 = {(z_1, z_2) ∈ C^2 : 0 < |z_2| < |z_1|},   Ω_2 = {(z_1, z_2) ∈ C^2 : 0 < |z_1| < |z_2|}
     上 a.l.u. 收敛（于是 (7.2a)、(7.2b) 自动分别是 Ω_1、Ω_2 上的全纯函数）；
  2. (7.2a) 与 (7.2b) 可以解析延拓到 Conf²(C^×) 上**同一个**全纯函数 f_{v,v′}；
     并且存在 N ∈ N，**只依赖 A, B 而不依赖 v, v′**，使函数
       (z_1 - z_2)^N f_{v,v′}(z_1, z_2)                                                  (7.3)
     在 C^× × C^× 上全纯。

  直观地说：(7.2a)、(7.2b) 分别在 Ω_1、Ω_2 上收敛，并延拓成 Conf²(C^×) 上同一个全纯函数，
  它在 z_1 = z_2 处的极点阶至多为 N，且 N 与 v, v′ 无关。
  （(7.2a)/(7.2b) 中的求和是对**分次指标** n 求和，即「插入完备基 Σ_n P_n」，不是对模式指标求和。）
