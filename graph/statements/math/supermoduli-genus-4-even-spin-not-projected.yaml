id: math.supermoduli-genus-4-even-spin-not-projected
kind: proposition
title: 亏格四偶自旋结构超模叠不可投影（Donagi–Noja）：𝔐₄^+ 非投影，ω₂(𝔐₄^+)≠0；标题/摘要「整个 𝔐₄ 非投影」是不交并逐分量的平凡推论，非独立证明
statement: |
  **对象**（Donagi–Noja arXiv:2608.24996v2 沿用 Donagi–Witten 2013 的障碍理论框架，"we use Green's
  obstruction theory in the form recalled by Donagi–Witten"）：𝔐₄^+ 表示亏格 4、偶自旋结构、无穿孔的
  超黎曼面模叠；ω₂(𝔐) ∈ H¹(X, T_X ⊗ Λ²T_-^∨𝔐) 为 P. Green (1982) 意义下的第一障碍类（primary/Green
  obstruction），与既有节点 `math.supermoduli-space-not-projected` 用同一套约定。

  **定理**（Theorem 1.1，逐字，p.1）：
  "Let 𝔐₄^+ denote the moduli superstack of unpunctured super Riemann surfaces of genus four with even
  spin structure. Then 𝔐₄^+ is non-projected. More precisely, ω₂(𝔐₄^+) ≠ 0."

  **证明方法**：取超椭圆测试曲线 C: y² = x⁶ − 1（亏格 4）配自由（无不动点）阶 6 自同构
  σ(x,y) = (ζx, −y)（ζ 为本原三次单位根），在其 Čech 上同调中显式计算第一障碍类分量的矩阵表示，证得
  该分量非零。

  **本节点的范围红线（★★ 最易误用处）**：
  (1) 本定理**只直接断言偶自旋分量 𝔐₄^+**。标题与摘要所写「genus 4 supermoduli space is not
      projected」（不带分量限定词）依赖"𝔐₄ = 𝔐₄^+ ⊔ 𝔐₄^- 逐分量可投影"这一平凡不交并逻辑：证明
      𝔐₄^+ 不可投影足以推出整个 𝔐₄ 不可投影。**这条平凡逻辑本身不是本文独立论证/强调的一步**（论文
      §2–§5 只给出 𝔐₄^+ 的显式计算），本节点不为它单独建卡；引用本节点时若要精确到"哪个分量"，只能
      引到偶分量。
  (2) 亏格 3（未紧化）非投影性**仍未被证明**：论文致谢部分（p.2）逐字 "is a work in progress, joint
      with him [Mauricio Corrêa]"。
  (3) 本定理**不涉及 Deligne–Mumford 紧化**（正文未讨论紧化空间）。
  (4) 本定理**不涉及穿孔**（对象是 unpunctured 超模叠）。
