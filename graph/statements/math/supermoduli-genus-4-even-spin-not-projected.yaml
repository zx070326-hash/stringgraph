tags: [supermoduli, super-riemann-surface, non-projected, genus-4, math-input, donagi-noja]
notes: |
  与既有节点 `math.supermoduli-space-not-projected`（Donagi–Witten 2013）的关系：该节点红线(1)称
  "g=5 已证，g=3,4 仅为猜测（'we suspect ... g≥3'）"——本节点填补了 g=4 这一格（偶分量非投影已证），
  g=3 仍开放（见上）。该节点红线(4)"不考虑紧化"对本节点同样成立（本节点同样不涉及紧化）。

  奇自旋分量 𝔐₄^- 本身是否非投影，本节点不断言（论文没有对它做独立计算，只靠不交并逻辑搭它的便车）。
