notes: |
  【为什么立卡】math.e8-root-system-power-sums（Lean）证的是根幂和 Σ_α (α·x)^k；
  math.e8-adjoint-trace-identities 说的是伴随迹 Tr_248 F^k。本卡是两者之间的**第一座桥**：
  在 Cartan 元 H 上，伴随迹就是根幂和。E8Roots.lean 的 docstring 把这一步明写为 Lean 之外的
  「mathematical *hypothesis*」，本卡把它做成图节点，让 `why` 能指到它。

  【status 说明】本卡内容是任何半单李代数教材的标准定理（数学上 rigorous），但本项目对 GTM 9 §8 与
  FH Lecture 14 的**内容都未核实（L0）**；按「不确定选低一级」与任务书的裁定，推导标
  physical-argument，**直到 researcher 拿到 L1 来源**（升级路径：核实 GTM 9 §8 相应命题的编号，
  或改引本项目已 L1 读到的其它教材）。

  【坐标的说明（供下游使用）】(3) 里的 α(H) 是线性泛函在 H 上的取值，**不涉及任何内积**。
  把它写成 math.e8-root-system-power-sums 的 α·x 时，只需取 𝔥 的一组基使 𝔥* 的对偶基是 ε_i，
  于是 H = Σ x_i (ε_i 的对偶)，α(H) = Σ α_i x_i。归一化（Killing 型 vs 标准内积）**不进入**
  P₄ = P₂²/100 这类齐次比值。这一步的核对写在 math.e8-adjoint-trace-identities--via-root-power-sums 的 summary。

  【查重】`uv run stringgraph search adjoint` 只命中世界面侧的伴随（†）卡；
  `search cartan`、`search root space`、`search semisimple` 无李代数结构卡。
