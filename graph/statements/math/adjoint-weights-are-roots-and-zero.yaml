    loc: "§8.2「Centralizer of H」, p. 36 的 Proposition（H = C_L(H)）；§8.4「Integrality properties」, p. 39 的 **Proposition 8.4(b)**（α 的根倍数只有 ±α）"
    note: |
      **L1⁻（逐字 OCR snippet，非页图；researcher 2026-09-13，抽取记录 §57.3）——本条目从 L0 升级。**
      路线是 Google Books 的 `jscmd=SearchWithinVolume2` JSON 端点，返回**印刷页 OCR 的逐字文本 + 页号**；
      §50/§52 两轮用的 `&q=` HTML 入口只回页号，故此前记「原文措辞永远 L0」，那条天花板现已作废。
      诚实性对照本轮做实：四条查询各返回 `number_of_results:0`，该卷不回落到固定页。
      **逐字**：p. 36「Proposition . Let H be a maximal toral subalgebra of L. Then H = C_L(H) . Proof .
      We proceed in steps . Write C = C_L(H) .」；p. 39「… ( b ) If α ∈ Φ , the only scalar multiples of α
      which are roots are α and −α . ( c ) If α , β ∈ Φ , then β(h_α) ∈ Z , and β − β(h_α)α ∈ Φ .」
      ⚠ **三条使用限制**：
      (1) 书上印的标题是**无编号的「Proposition.」**；「Proposition 8.2」「Proposition 8.4」是**本书他处的
          引用形式**（各已逐字见到：8.2 在 p.37；8.4 在 p.39/40/45/73/74/88/145 共七处）。
          §8.2 只有一条 Proposition，故「Proposition 8.2 = H = C_L(H)」是**高可信推断，不是逐字**
          ⇒ loc 按上面那样写全，不要单写「Proposition 8.2」。
      (2) **禁写「Proposition 8.4(a)」**：`dim L_α = 1` 的字面文本与部分字母本轮**没取到**（四次查询 0 命中）。
          这一条请引 kirillov-2008 的 Theorem 7.21(2)。
      (3) OCR 有伪影（`C1(H)` = `C_L(H)`、`O`/`Φ` 混淆、下标丢失、`±` 变乱码）
          ⇒ **可照抄措辞与编号，不可照抄公式字符**。
      **副产品**：本书 p. 100/101 确有印出的「dim L = dim H + Card Φ」，但那在 §18.4（Serre 定理的证明里），
      **不是 §8 的独立命题**，不得写成 §8 的结论。
