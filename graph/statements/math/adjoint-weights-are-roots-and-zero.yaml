sources:
  - ref: kirillov-2008
    loc: "preliminary version (liegroups.pdf), Ch. 7「Complex Semisimple Lie Algebras」, pp. 84–89：Definition 7.6、Theorem 7.7(1)、Definition 7.8、Theorem 7.11、Corollary 7.14、Theorem 7.16(1)(2)、Lemma 7.20、Theorem 7.21(2)(5)"
    note: |
      **★ L1 页图逐字（researcher 2026-09-13，抽取记录 literature/extractions/math-sources.md §57）。**
      本卡 (1) 的三句话逐条有出处：
      · 同时对角化与分解 = **Theorem 7.7(1)**「Let 𝔥 ⊂ 𝔤 be a toroidal subalgebra. Then
        𝔤 = ⊕_{α∈𝔥*} 𝔤_α, where 𝔤_α is a common eigenspace for all operators ad h, h ∈ 𝔥,
        with eigenvalue α … In particular, 𝔥 ⊂ 𝔤_0.」＋ **Theorem 7.16(1)** 的 (7.1)(7.2)
        「𝔤 = 𝔥 ⊕ ⊕_{α∈R} 𝔤_α」；
      · 𝔤₀ = C_𝔤(𝔥) = 𝔥 = **Definition 7.8**（Cartan 子代数**定义**为「toroidal subalgebra which
        coincides with its centralizer: C(𝔥) = {x | [x,𝔥] = 0} = 𝔥」）＋ **Theorem 7.11**
        「Let 𝔥 ⊂ 𝔤 be a maximal toroidal subalgebra … Then 𝔥 is a Cartan subalgebra.」（带完整证明），
        即本卡「Cartan 子代数（极大环面子代数）」这个等同在半单情形的出处；
        Theorem 7.16 的证明逐字「This immediately follows from Theorem 7.7 and 𝔤_0 = 𝔥, which is the
        definition of Cartan subalgebra.」
      · **dim 𝔤_α = 1 = Theorem 7.21(2)**「For each α ∈ R, the root subspace 𝔤_α is one-dimensional.」；
        **2α ∉ Φ = Theorem 7.21(5)**「For any root α, the only multiples of α which are also roots are ±α.」
        （证明末逐字「In particular, 2α is not a root.」）。
      本卡 (2) 里的「重数 = rank 𝔤」用 **Corollary 7.14**「rank(𝔤) = dim 𝔥」。
      ⚠ **三条使用限制**：
      (1) **编号只在 preliminary version 里有效**。印本（CUP 2008 精装 / 2017 平装）把同一章排成
          **第 6 章 pp. 108–131**，且条目号一直排到 6.52，与 prelim 的 7.x **不是平移关系**
          ⇒ **绝不许把本条 loc 改写成印本编号**；印本页图本项目尚未取得（Cambridge Core 2026-09-13 全站中断）。
      (2) **Corollary 7.14 倚赖 Theorem 7.13（Cartan 子代数两两共轭），而原书对 7.13 逐字写
          「we quote without proof」** ⇒ 「rank 良定义」这一点在本来源里没有证明。
          本卡 (3) 的迹公式**不需要**它（只需固定一个 𝔥），(2) 里写 rank 时请记住这条。
      (3) 本卡 (3) 的迹公式 **Kirillov 第 7 章一字未提**（我逐页读过 pp.83–90），
          它是 (1) 给出对角化之后的初等线性代数，见推导 summary 第 (5) 步。
