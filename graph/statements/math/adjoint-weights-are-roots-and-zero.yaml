id: math.adjoint-weights-are-roots-and-zero
kind: proposition
title: 半单李代数伴随表示的权 = 根（各重数 1）∪ 零权（重数 = 秩）；故 Tr_𝔤 (ad H)^k = Σ_{α ∈ Φ} α(H)^k（k ≥ 1）
statement: |
  设 𝔤 是复数域上的有限维半单李代数，𝔥 ⊂ 𝔤 是一个 Cartan 子代数（极大环面子代数），
  Φ ⊂ 𝔥* 是 𝔤 相对 𝔥 的根集合。

  **(1) 根空间分解**：𝔤 = 𝔥 ⊕ ⨁_{α ∈ Φ} 𝔤_α，其中 𝔤_α = {X ∈ 𝔤 : [H, X] = α(H) X ∀ H ∈ 𝔥}，
  每个根空间 **dim 𝔤_α = 1**，且零权空间 𝔤₀ = C_𝔤(𝔥) = 𝔥。

  **(2) 伴随表示的权**：伴随表示 ad : 𝔤 → 𝔤𝔩(𝔤) 相对 𝔥 的权集合（计重数）是
  Φ（每个根重数 1）∪ {0}（重数 dim 𝔥 = rank 𝔤）。特别地

      dim 𝔤 = |Φ| + rank 𝔤。

  **(3) 迹公式**：对任一 H ∈ 𝔥，ad H 在 (1) 的分解下是对角的，特征值为 α(H)（α ∈ Φ，各一次）
  与 0（rank 𝔤 次）。因此对一切整数 k ≥ 1

      Tr_𝔤 (ad H)^k = Σ_{α ∈ Φ} α(H)^k

  （零权对 k ≥ 1 不贡献；k = 0 时左端是 dim 𝔤，本卡不用）。

  **E₈ 实例**（(2)(3) 的代入，不是额外断言）：𝔤 = 𝔢₈ 时 |Φ| = 240、rank = 8，故 dim 𝔢₈ = 248，
  且 248 维伴随表示上 Tr_248 (ad H)^k = Σ_{α ∈ Φ(E₈)} α(H)^k。

  **本卡不断言**：
  (a) 对 𝔥 之外的元素 X ∈ 𝔤 的任何迹公式（把 (3) 从 𝔥 推到整个 𝔤 需要 math.chevalley-restriction-theorem
      或「半单元素共轭进 𝔥 + 稠密性」的论证，不在本卡）；
  (b) Φ 是根系、Φ 的具体形状、E₈ 的根表（见 math.e8-root-system）；
  (c) 任何关于紧实形式、规范场 F 或迹归一化的事（tr 与 Tr 的物理约定在 conv.gauge-trace-normalization，
      本卡的 Tr_𝔤 就是 dim 𝔤 维向量空间上线性算子的迹，不含归一化选择）。
