tags: [algebra, lie-algebra, root-system, adjoint, weights, trace-identity, phase2, math-input]
notes: |
  【为什么立卡】math.e8-root-system-power-sums（Lean）证的是根幂和 Σ_α (α·x)^k；
  math.e8-adjoint-trace-identities 说的是伴随迹 Tr_248 F^k。本卡是两者之间的**第一座桥**：
  在 Cartan 元 H 上，伴随迹就是根幂和。E8Roots.lean 的 docstring 把这一步明写为 Lean 之外的
  「mathematical *hypothesis*」，本卡把它做成图节点，让 `why` 能指到它。

  【status 说明（2026-09-13 更新）】本卡内容是任何半单李代数教材的标准定理（数学上 rigorous）。
  2026-09-11 立卡时本项目对 GTM 9 §8 与 FH Lecture 14 的内容都是 L0，故推导被迫标 physical-argument。
  **该理由已消失**：researcher 于 2026-09-13 取到两条独立来源——
  kirillov-2008 的 preliminary version pp. 84–89（**L1 页图**，Theorem 7.7(1)/7.11/7.16(1)/7.21(2)(5) 等，
  带完整证明）与 humphreys-1972 §8.2 p.36 / **Proposition 8.4(b)** p.39（**L1⁻ 逐字 OCR snippet**）。
  推导 --via-root-space-decomposition 因此升为 kind: proof / status: rigorous。
  **仍未升到 formalized**：Mathlib 侧是否有 `dim 𝔤_α = 1` 未查（抽取记录 §57.7 的 Q57.4）。
  **本卡 (3) 的迹公式在两条来源里都没有**——那不是缺口，是因为它只是「对角算子取迹」这一步初等线性代数，
  见推导 summary 第 (5) 步与抽取记录 §57.4。

  【坐标的说明（供下游使用）】(3) 里的 α(H) 是线性泛函在 H 上的取值，**不涉及任何内积**。
  把它写成 math.e8-root-system-power-sums 的 α·x 时，只需取 𝔥 的一组基使 𝔥* 的对偶基是 ε_i，
  于是 H = Σ x_i (ε_i 的对偶)，α(H) = Σ α_i x_i。归一化（Killing 型 vs 标准内积）**不进入**
  P₄ = P₂²/100 这类齐次比值。这一步的核对写在 math.e8-adjoint-trace-identities--via-root-power-sums 的 summary。

  【查重】`uv run stringgraph search adjoint` 只命中世界面侧的伴随（†）卡；
  `search cartan`、`search root space`、`search semisimple` 无李代数结构卡。
