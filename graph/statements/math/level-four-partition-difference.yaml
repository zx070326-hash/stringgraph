id: math.level-four-partition-difference
kind: proposition
title: 四能级"不含一个方向"光锥占据数计数差恒等式 p_{D−1}(4) = p_{D−2}(4) + p_{D−1}(3) + p_{D−1}(2)——第三条支持"计数看不见 26"的 Pascal 恒等式
statement: |
  这是一条**纯组合恒等式**，不涉及弦论的任何算子、度规或质壳条件；D 只是一个自然数参数，
  记号沿用 math.level-two-partition-difference、math.level-three-partition-difference
  （p_m(N) := 把振子能级 N 分配给 m 个可数无穷模态槽的占据数个数）。

  【断言：占据数的显式计数与差】设 D ≥ 2。则

    p_{D−1}(4) = (D−1) + (D−1)² + C(D,2) + (D−1)·C(D,2) + C(D+2,4) ，
    p_{D−2}(4) = (D−2) + (D−2)² + C(D−1,2) + (D−2)·C(D−1,2) + C(D+1,4) ，

  （level-4 占据函数唯一分成五形：单模态占据 4（贡献 m 个）、一模态占据 3 与另一模态
  占据 1（贡献 m² 个）、两个不同模态各占据 2（贡献 C(m,2) 个）、一模态占据 2 与另两个
  不同模态各占据 1（贡献 m·C(m,2) 个）、四个不同模态各占据 1（贡献 C(m+3,4) 个），
  m 取 D−1 或 D−2；五种情形穷尽且不相交，由"模数计数不变量"
  （modeCount，把五形的模数轮廓 (0,0,0,1)(1,0,1,0)(0,2,0,0)(2,1,0,0)(4,0,0,0) 两两分开）
  分类给出，是 Finsupp.oscWeight 在能级 4 的完整分类）。故

    **p_{D−1}(4) = p_{D−2}(4) + p_{D−1}(3) + p_{D−1}(2)** ，

  其中 p_{D−1}(3) = (D−1) + (D−1)² + C(D+1,3)（math.level-three-partition-difference）、
  p_{D−1}(2) = (D−1) + C(D,2)（math.level-two-partition-difference）取自同一恒等式链
  的上两级。展开形式（Pascal 恒等式，对一切 D ≥ 2 成立，由两次
  C(m+2,2) = C(m+1,1)+C(m+1,2) 与 C(m+4,4) = C(m+3,3)+C(m+3,4) 型 Pascal 递推
  加自然数环算术拼成）：

    (D−1)+(D−1)²+C(D,2)+(D−1)·C(D,2)+C(D+2,4)
      =  [(D−2)+(D−2)²+C(D−1,2)+(D−2)·C(D−1,2)+C(D+1,4)]
       + [(D−1)+(D−1)²+C(D+1,3)]
       + [(D−1)+C(D,2)] 。

  在 D = 26 处：29575 = 25650 + 3575 + 350。

  【本节点明确不断言】
  (a) **不断言这与任何弦论对象的联系**：p_{D−1}(4)、p_{D−2}(4) 在本节点里只是显式计数
      公式的值，"它们分别是 dim(H_phys ∩ V_4) 的上界 / dim(D(Ε) ∩ V_4)"是弦论侧节点
      （worldsheet.physical-slice-bounded-by-transverse-count、
      worldsheet.transverse-ddf-fock-gram-matrix）各自独立证明的事，本节点不重复、
      不引用它们（与 math.level-two/-three-partition-difference 明确不断言 (a) 同型）。
  (b) **不断言一般 N 的类比**：一般 N 的差 p_{D−1}(N) − p_{D−2}(N) 需要一般的配分函数
      生成函数论证，本节点只做 N = 4 这一个特例的初等展开；且从 N=5 起该恒等式本身
      **不再精确成立**（两族计数出现 Euler 五边形数超额，见
      worldsheet.ddf-spanning-rank-inequality notes【2026-09-12（五）】），本节点不
      涉及、不预示这一断裂。
  (c) **不断言 D ≤ 1 的情形**：与 math.level-two/-three-partition-difference (c) 同型，
      C(D,2)、C(D+2,4) 等的自然数减法需要 D ≥ 2 才良定义。
  (d) **不是一个新的组合学结果**：这是两次二项式系数 Pascal 递推
      C(m+2,2)=C(m+1,1)+C(m+1,2)、C(m+4,4)=C(m+3,3)+C(m+3,4)（m := D−2）的直接代入实例，
      价值在于把它显式写成弦论计数需要的形状。
  (e) **不断言两条单侧公式各自被独立证明为等式**：与 math.level-two/-three-partition-difference
      同型，Lean 侧真正证明的是**差**恒等式本身，两条单侧显式公式是记法铺垫，见 sources note。
