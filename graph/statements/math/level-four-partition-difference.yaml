sources:
  - ref: stringformal-2026
    loc: |
      formal/StringFormal/NoGhost/LevelFourCount.lean :: StringFormal.NoGhost.levelFour_count_identity
      （本卡 formal.lean_decl，第 1031 行起）；分类引理
      `Finsupp.oscWeight_eq_four_cases`（能级 4 的任意占据函数唯一分成五类，靠
      `modeCount`——模数计数不变量——把五形的模数轮廓两两分开，文件头 docstring 逐字
      "the combinatorial content of `p_m(4)`"）是本卡两条单侧计数公式共同的底层依据。
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry（文件头 docstring "No sorry"）。
      **curator 未自行运行 `lake build` / `check-axioms`**（本 worktree 无构建缓存）；
      结论基于直接读源码，未跑编译器验证；合并前应由 lead 跑
      `uv run stringgraph check-axioms`。

      **逐字核对**（第 1031-1037 行）：
      ```
      theorem levelFour_count_identity (hD : 2 ≤ D) :
          (D - 1) + (D - 1) * (D - 1) + Nat.choose D 2 + (D - 1) * Nat.choose D 2
              + Nat.choose (D + 2) 4
            = ((D - 2) + (D - 2) * (D - 2) + Nat.choose (D - 1) 2 + (D - 2) * Nat.choose (D - 1) 2
                + Nat.choose (D + 1) 4)
              + ((D - 1) + (D - 1) * (D - 1) + Nat.choose (D + 1) 3)
              + ((D - 1) + Nat.choose D 2)
      ```
      ——与本卡【断言】的等式逐字一致（`Nat.choose D 2` = C(D,2)、`Nat.choose (D+2) 4` =
      C(D+2,4) 等）。证明体（第 1038-1046 行，逐字核对）：
      `obtain ⟨m, rfl⟩ : ∃ m, D = m + 2 := ⟨D - 2, by omega⟩`；
      `hp2 : Nat.choose (m+2) 2 = Nat.choose (m+1) 1 + Nat.choose (m+1) 2`
      （`Nat.choose_succ_succ (m+1) 1`）；
      `hp4 : Nat.choose (m+4) 4 = Nat.choose (m+3) 3 + Nat.choose (m+3) 4`
      （`Nat.choose_succ_succ (m+3) 3`）；`simp only` 化简下标算术后 `rw [hp2, hp4,
      Nat.choose_one_right]; ring` 收尾。**不用任何弦论对象**，与
      math.level-two/-three-partition-difference 同一模式（Pascal 递推 + 自然数算术），
      只是多两层递推（C(D,2) 与 C(D+2,4) 两处）。

      两条单侧计数公式 p_{D−1}(4)=…、p_{D−2}(4)=… 本身**未**各自被单独证成等式：
      Lean 侧的 `card_conjFree_four_le`（上界）与 `card_ddfLevel_four_ge`（下界）分别
      只给单侧不等式（与 N=2、N=3 情形同型），`levelFour_count_identity` 直接在自然数
      算术层面证出两个等式的**差**。

      **数值核对**：D=26 时代入得 29575 = 25650 + 3575 + 350（本卡 statement 段已列出）。
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/LevelFourCount.lean，文件头 docstring 第 (4) 块"
    note: "文件头模块文档记录本引理是「第三条支持计数看不见 26 的 Pascal 恒等式」，佐证本卡对应工作已在仓库主线合入。"
tags: [combinatorics, number-theory, binomial-coefficients, partitions, formalized, math-input]
notes: |
  【为什么立卡】formal/StringFormal/NoGhost/LevelFourCount.lean 的
  `levelFour_count_identity` 与 math.level-two/-three-partition-difference 的两条
  姊妹恒等式同一模式，是"计数一步永远看不见 26"的**第三条独立证据**：level-4 处该
  恒等式对一切 D 成立，D=26 只是代入的一个特殊值（29575 = 25650 + 3575 + 350），
  恒等式本身不依赖 D 的取值。

  【查重】2026-09-12 跑 `uv run stringgraph search "level-four-partition"`、
  `search "level four partition"`、`search levelFour_count_identity` 均无命中；
  `search "partition difference"` 命中 math.level-two/-three-partition-difference
  （姊妹卡，不重复，见下）。

  【与 math.level-two/-three-partition-difference 的关系，不合并】三卡是同一恒等式链
  （p_{D−1}(N) 的 Pascal 展开）在 N=2、N=3、N=4 的三个独立实例，按【一个节点一个命题】
  原则不合并——各自的具体系数不同，各自被 worldsheet 侧不同的 N 片
  （level-two/-three/-four DDF-spans 卡）独立消费。本卡陈述里引用
  math.level-three-partition-difference、math.level-two-partition-difference 的
  p_{D−1}(3)、p_{D−1}(2) 记法（差恒等式右端的两项），这是记法引用，不建
  `uses`/`depends_on` 边——按 graph/CLAUDE.md 与两张姊妹卡既有先例，纯数学卡之间
  如需要建正式依赖边，留给配套推导判断；本卡证明本身（见 sources 的 Lean 逐字核对）
  是两步 Pascal 恒等式的直接拼接，不实际调用 `levelThree_count_identity` 或
  `levelTwo_count_identity` 作为前提（`levelFour_count_identity` 的证明独立完整，
  只是数值上恰好把 p_{D−1}(3)、p_{D−1}(2) 的展开式包含在右端），故不建边，配套推导
  `depends_on: []`（与两张姊妹卡的配套推导同一先例）。

  【本卡不 depends_on 或 uses 任何 worldsheet 节点】同 math.level-two/-three-partition-difference
  明确不断言 (a) 的边界，见【本节点明确不断言】(a)。

  【本卡是这条 Pascal 恒等式链目前的最后一环，N≥5 起断裂】与两张姊妹卡不同的是，
  本卡明确记录（明确不断言 (b)）从 N=5 起同型恒等式不再精确成立——这条断裂正是
  worldsheet.ddf-spanning-rank-inequality 与 worldsheet.ocq-null-state-two-families
  两张 notes 反复强调的"Euler 五边形数障碍"的计数侧印证，本卡只记录事实、不给出
  N≥5 的替代恒等式（那是完全不同的未来工作）。
