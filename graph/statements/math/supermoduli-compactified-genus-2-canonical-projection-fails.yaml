id: math.supermoduli-compactified-genus-2-canonical-projection-fails
kind: proposition
title: 紧化亏格二超模空间的典范投影在分离 (−,−) 边界因子处失效，故 S̄₂ 不可投影（Felder–Kazhdan–Polishchuk Theorem 6.3）
statement: |
  **对象**（Felder–Kazhdan–Polishchuk arXiv:2408.11136v1 §1.2.3/§6；论文记号 𝒮_g/𝒮̄_g，与既有节点
  `math.supermoduli-space-not-projected` 的 𝔐_g/𝔐̄_g 指称同一对象）：𝒮̄₂ 为亏格二稳定超曲线模空间的
  Deligne–Mumford 型紧化；π^can: 𝒮₂ → 𝒮_{2,bos} 为超周期映射诱导的典范投影。

  **定理**（§1.2.3，逐字，p.4，紧接目录中 Theorem 6.3 的引言复述）：
  "We show that π^can extends to a regular projection on S̄₂ away from the (−,−) separating node
  divisor D^{−,−}...In fact, we show that π^can is the unique projection regular at a generic point of
  each boundary divisor corresponding to a non-separating node. As a consequence, we derive that S̄₂ is
  not projected."

  **本节点的范围红线**：
  (1) **仅限亏格 2**。同页逐字："there seems to be no canonical projection for g > 2 (for g = 3 the
      projection given by the superperiod map is only defined away from the hyperelliptic locus)"——
      作者本人未在本文对 g≥3 做出断言。
  (2) 本定理是"非投影性"（projectedness）结论，**不是**摘要所称"对任意亏格成立"的**正则性**
      （regularity，测度延拓无极点/无多值）结论——那是本文（转述 Deligne 未发表论证）的另一条不同的
      技术命题，范围是任意亏格，但断言的是不同的性质，本节点不承载它（不建混淆卡）。
uses_conventions: []
sources:
