    loc: "arXiv:2408.11136v1, 摘要；目录 §6 标题；§1.2.3 p.4（逐字引理陈述与 g>2 未解决声明）"
    note: |
      **仅部分 L1**：摘要 + 目录 + Introduction §1.1/§1.2（pp.1–4）已读（researcher 2026-09-18，
      抽取记录 literature/extractions/felder-kazhdan-polishchuk-2024.md E1–E2）。**§2 起正文
      （含 §6 Theorem 6.3 本身的逐字陈述与完整证明）未读**——本节点的定理文本取自引言对 Theorem 6.3
      的**复述**（"(see Theorem 6.3)"），不是 §6 原文的逐字陈述；若需要精确定理编号/引理链，须先补读
      §6。
tags: [supermoduli, super-riemann-surface, non-projected, compactified, genus-2, math-input, felder-kazhdan-polishchuk]
notes: |
  Corrêa–Noja arXiv:2606.06733（`correa-noja-2026`）在其 Theorem 1.1 item (2)（见
  `math.supermoduli-compactified-genus-2-even-not-projected`）中把本节点称为"the Felder–Kazhdan–
  Polishchuk genus-two even non-projectedness theorem"，即把本节点的结论等同于紧化亏格二**偶自旋
  分量** 𝔐̄₂⁺ 非投影（ω₂(𝔐̄₂⁺)≠0）。**这一"等同于偶分量"的措辞是 Corrêa–Noja 一方的识别/转译**，
  本项目对 FKP 原文 §6 未读，无法独立确认 FKP 自己是否明确按宇称分量表述 Theorem 6.3——因此本节点
  统一使用 FKP 引言自己的语言（S̄₂/边界因子），不写"𝔐̄₂⁺"字样；两者的等同关系记在
  `math.supermoduli-compactified-genus-2-even-not-projected` 的 depends_on 边上。
