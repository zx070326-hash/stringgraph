id: math.virasoro-anti-involution
kind: definition
status: formalized
title: Virasoro 代数的反对合 σ：L_n ↦ L_{−n}、C ↦ C 是李代数反自同构且 σ² = id
statement: |
  设 R 是交换环且是 ℚ-代数（物理情形取 R = C），Vir(R) 是 Virasoro 代数
  （worldsheet.virasoro-algebra-v2；生成元 L_n (n ∈ Z) 与中心元 C，括号
  [L_m, L_n] = (m − n) L_{m+n} + ((m³ − m)/12) δ_{m+n,0} C，[C, ·] = 0，
  约定 conv.virasoro-standard）。

  **定义**：σ = σ_R : Vir(R) → Vir(R) 是满足

      σ(L_n) = L_{−n}   (n ∈ Z),      σ(C) = C

  的 R-线性映射。它由这两条唯一确定：Witt 代数 W(R) 以 {ℓ_n : n ∈ Z} 为 R-基，
  而 Vir(R) ≅ W(R) × R 是 R-模同构（worldsheet.virasoro-algebra-v2 的「结构」一段），
  故 σ 就是「Witt 侧按 ℓ_n ↦ ℓ_{−n} 作用、中心侧取恒等」这个映射。

  **(1) 对合**：σ ∘ σ = id_{Vir(R)}。特别地 σ 是 R-线性自同构（R-线性等价），σ^{−1} = σ。

  **(2) 反自同构（anti-automorphism）**：对一切 X, Y ∈ Vir(R)

      σ([X, Y]) = [σ(Y), σ(X)]。

  等价地：σ 是李代数同构 Vir(R) → Vir(R)^op。

  **(2) 为什么不是记号翻转**：在生成元上两边分别为

      σ([L_m, L_n])      = (m − n) L_{−m−n} + ((m³ − m)/12) δ_{m+n,0} C,
      [σ(L_n), σ(L_m)]   = [L_{−n}, L_{−m}] = (m − n) L_{−m−n}
                            + (((−n)³ − (−n))/12) δ_{m+n,0} C.

  第一项的符号由括号反序给出；中心项要用两件事才对上：2-上闭链 n ↦ (n³ − n)/12 是**奇函数**，
  且 δ_{m+n,0} 的支撑上 m = −n，于是 ((−n)³ − (−n))/12 = (m³ − m)/12。
  ⇒ σ 是反自同构这件事**用到了 Virasoro 中心项关于 n ↦ −n 的奇性**；
  若把中心项换成一个偶的 2-上闭链，同一公式给出的 σ 就不再是反自同构。

  【本节点明确**不**断言】
  (a) σ 在泛包络代数 U(Vir) 上的延拓（那是一个反自同构 U(Vir) → U(Vir)），
      也不断言三角分解 U(Vir) = U(vir₋) ⊗ U(vir₀) ⊗ U(vir₊) 或 Harish-Chandra
      投影 U(Vir) → R 的存在。那些需要 PBW（math.pbw-theorem），本项目未形式化。
  (b) 与 Hermite 共轭 L_n† = L_{−n} 的任何关系。σ 是 **R-线性**的（不是共轭线性的）：
      在 R = C 上它对应双线性型的转置，不是 Hilbert 空间意义下的伴随。
      物理侧的 L_n† = L_{−n} 是另一条陈述，见 worldsheet.virasoro-generators-adjoint。
  (c) σ 在 Verma 模或任何表示上诱导的结构。由 σ 定义的逆变（Shapovalov）双线性型见
      worldsheet.shapovalov-form-uniqueness 与 worldsheet.shapovalov-form-existence。
  (d) σ 是 Vir(R) 的**唯一**反对合，或它与其他反对合的关系。
uses: [worldsheet.virasoro-algebra-v2]
uses_conventions: [conv.virasoro-standard]
