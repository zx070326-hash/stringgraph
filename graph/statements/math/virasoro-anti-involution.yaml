  - ref: stringformal-2026
    loc: "formal/StringFormal/Virasoro/Shapovalov.lean :: StringFormal.Virasoro.VirasoroAlgebra.{antiInvolutionₗ, antiInvolutionₗ_lgen, antiInvolutionₗ_cgen, antiInvolutionₗ_comp_self, antiInvolutionₗ_involutive, antiInvolutionₗ_lie, antiInvolution, antiInvolution_apply, antiInvolution_lgen, antiInvolution_cgen, antiInvolution_lie, antiInvolution_involutive, antiInvolution_symm}；Witt 侧 StringFormal.Virasoro.WittAlgebra.{antiInvolutionₗ, antiInvolutionₗ_lgen, antiInvolutionₗ_comp_self, antiInvolutionₗ_involutive, antiInvolutionₗ_lie}；中心项的奇性 StringFormal.Virasoro.cocycleBilin_antiInvolution"
    note: |
      本仓库，形式化侧提交 1731c49（"formal: construct the Shapovalov form from a
      sigma-twisted dual highest weight vector"），已由 lead 以 **b95a406**
      （"merge: Shapovalov form on the Virasoro Verma module (formalizer)"）合入 main；
      Lean 4 + Mathlib v4.33.1。文件头 Status 段自述「No `sorry`, no new axioms」，
      formal/TODO.md 的 `shapovalov-form` 一条已勾选。
      逐句对应：
      - 定义 → `VirasoroAlgebra.antiInvolutionₗ`（经 `toProdₗ` 把 Witt 侧的
        `(lgen R).constr R fun n => lgen R (-n)` 与中心侧的 `LinearMap.id` 并起来），
        打包成 R-线性等价 `VirasoroAlgebra.antiInvolution`；
        生成元上的取值 → `antiInvolution_lgen`（L_n ↦ L_{−n}）、`antiInvolution_cgen`（C ↦ C）；
      - (1) 对合 → `antiInvolution_involutive`（并有 `antiInvolution_symm : σ⁻¹ = σ`）；
      - (2) 反自同构 → `antiInvolution_lie`（本卡 formal.lean_decl），
        其关键引理 `cocycleBilin_antiInvolution` 就是上面「中心项奇性」那一步。
      **curator 未自行重跑 `lake build`**；依据是文件头自述、formal/TODO.md 的勾选，
      以及 b95a406 已在 main 上。合并前应由 lead 跑 `uv run stringgraph check-axioms`。
  - ref: feigin-fuchs-1982
    loc: "§3.2（俄文原刊 Функц. анализ 16:2 (1982) 第 58 页；该处只用到由 σ 定义的 Gram 矩阵 M_{h,c}(k)，**没有给 σ 单独编号**）"
    note: |
      文献侧的对照，**不承载本卡的论证**。FF 在 §3.2 直接说由 M_{h,c}(k) 定义的二次型
      «называется формой Шаповалова»（称为 Shapovalov 形式），反对合本身在那里是隐含的
      记号约定，没有作为带编号的命题出现（L1 逐页核实，
      literature/extractions/math-sources.md §34.2(b)）。
      ⇒ 「σ 是反自同构」在文献里通常被当作显然的一句话，**不要去找一条并不存在的
      「Theorem X.Y」**（与 math.verma-module-free-over-negative-part 的处理同一条纪律）。
tags: [algebra, lie-algebra, virasoro, anti-involution, shapovalov, formalized, math-input]
notes: |
  【为什么立成 definition 而不是 proposition】本卡的主体是「σ 是什么」，(1)(2) 是这个定义的
  **良定义性/结构性断言**，与 worldsheet.virasoro-algebra-v2 把「括号交错且满足 Jacobi」
  「0 → R → Vir → W → 0 正合」写进定义卡是同一种处理。
  按 docs/STATUS_LEVELS.md，definition 卡的 status 表示「有 Lean 声明逐句对应」，
  这里 (1)(2) 都是 Shapovalov.lean 里具名且无 sorry 的定理，故标 formalized。
  ⚠ 若日后 reviewer 认为 (2) 应独立成命题卡，正确的修法是新建 proposition 卡 +
  `--via-lean` 推导，并给本卡写 superseded_by，而不是改本卡的 status。

  【本卡为什么值得单独存在】Shapovalov 型的两张卡（uniqueness / existence）都以 σ 为
  唯一的代数输入；把 σ 抽出来立卡，使「逆变性」这个概念在图里有一个可指的定义点，
  也使「中心项奇性 ⇒ σ 是反自同构」这条**容易被当成显然、实际不显然**的事实被记录下来。

  【记号】文献里 σ 也写作 ω、τ 或 x ↦ x^t。本卡统一写 σ。
  Kytölä 的 VirasoroProject（virasoro-lean-2025）**没有**这个对象
  （researcher 2026-09-11 逐文件核实，literature/extractions/math-sources.md §34.7：
  21 个 .lean 文件里没有 ShapovalovForm.lean，arXiv:2510.21741 的 Table 1 也没有逆变形式）。
  ⇒ 本卡与 Shapovalov 两卡是本项目相对该项目的**净增量**。
