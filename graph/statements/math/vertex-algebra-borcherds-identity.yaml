id: math.vertex-algebra-borcherds-identity
kind: definition
status: rigorous
title: 顶点代数的 Borcherds / Jacobi 恒等式（形式变量版 (2.30)、模式版 (2.36)、留数版 (2.19)）
statement: |
  设 ℱ = ⊕_{n ∈ Z} ℱ_{(n)} 是复向量空间，带真空向量 1 ∈ ℱ 与线性映射
    𝒴 : ℱ → (End ℱ)[[z, z^{-1}]],
  按 **Gebert–Nicolai (2.31)** 展开
    𝒴(ψ, z) = Σ_{n ∈ Z} ψ_n z^{-n-1}   （下标写在圆括号**外**）。
  设正规性（regularity）公理成立：对任意 ψ, φ ∈ ℱ 有 ψ_n φ = 0 当 n 充分大（G–N (2.23)/(2.32)）。

  **(A) Borcherds / Jacobi 恒等式，形式变量版**（G–N 顶点代数定义的第 5 条公理，(2.30) 逐字）：
  对一切 ψ, φ ∈ ℱ，
    z_0^{-1} δ((z_1 - z_2)/z_0) 𝒴(ψ, z_1) 𝒴(φ, z_2)
      − z_0^{-1} δ((−z_2 + z_1)/z_0) 𝒴(φ, z_2) 𝒴(ψ, z_1)
      = z_2^{-1} δ((z_1 - z_0)/z_2) 𝒴( 𝒴(ψ, z_0) φ , z_2 ).

  **(B) 同一恒等式的模式版**（G–N (2.36) 逐字）：对一切 ψ, φ, ξ ∈ ℱ 与一切 l, m, n ∈ Z，
    Σ_{i ≥ 0} (−1)^i C(l, i) ( ψ_{l+m−i}(φ_{n+i} ξ) − (−1)^l φ_{l+n−i}(ψ_{m+i} ξ) )
      = Σ_{i ≥ 0} C(m, i) (ψ_{l+i} φ)_{m+n−i} ξ,
  其中 C(m, i) := m(m−1)⋯(m−i+1)/i!（i ≥ 0），i < 0 时约定为 0。**两端的求和都是有限和**，
  截断由正规性公理给出，不涉及任何收敛性。

  **(C) 同一恒等式的留数版**（Bakalov–Kac (2.19) 逐字，记号 Y(a, z) = Σ_m a_{(m)} z^{-m-1}）：
    Res_{z−w} Y( Y(a, z−w) b, w ) i_{w, z−w} F(z, w)
      = Res_z Y(a, z) Y(b, w) i_{z, w} F(z, w) − Res_z Y(b, w) Y(a, z) i_{w, z} F(z, w),
  「for any a, b ∈ V and **any rational function F(z, w) with poles only at z = 0, w = 0 or z = w**」。

  **本卡的地位（两套公理体系）**：
  · 在 **Gebert–Nicolai** 采用的体系里，(A)/(B) 是顶点代数**定义的第 5 条公理**
    （另四条为 regularity (2.23)、vacuum (2.24)、injectivity (2.25)、conformal vector (2.26)–(2.29)）。
  · 在 **Bakalov–Kac** 采用的（以局域性 + 平移 + 真空为公理的）体系里，(C) 是一条**定理**，
    且作者逐字称它「(which along with the vacuum axioms provides **an equivalent definition** of a
    vertex algebra)」。
  本卡把 (A)(B)(C) 登记为**同一条恒等式的三种写法**。

  ⚠ **模式约定陷阱**（G–N p. 581）：G–N 同时使用两套模式展开——
  (2.31) 𝒴(ψ, z) = Σ_n ψ_n z^{-n-1}（下标在圆括号**外**，形式演算用）与
  (2.47) ψ(z) = Σ_n ψ_{(n)} z^{-n-Δ_ψ}（下标在圆括号**内**，CFT 用），
  换算为 (2.48) ψ_n ≡ ψ_{(n+1−Δ_ψ)}。**本卡的 (A)(B) 用的一律是 (2.31) 那一套。**
  与 Virasoro 生成元记号 L_{(n)}（= ω_{n+1}）混用时必须先做这一换算。

  **本卡不断言的四条**：
  (a) **不断言 Borcherds 1986 §4 的 (v) 就是对易子公式。** (v)
      `(u_m(v))_n(w) = Σ_{i≥0} (−1)^i C(m,i)( u_{m−i}(v_{n+i}(w)) − (−1)^m v_{m+n−i}(u_i(w)) )`
      是本恒等式的**迭代 / 结合律**形式（左端是单个 (u_m(v))_n(w)）；对易子形式是
      math.vertex-algebra-commutator-formula，两者是 (B) 的不同特例。
  (b) **不断言 (A) ⟺ (B) ⟺ (C) 的逐步换算。** 三处来源都把展开留给读者；
      「(C) + 真空公理是顶点代数的等价定义」在 Bakalov–Kac 处也只是**断言**，无证明。
  (c) **不涉及共形向量 ω、中心荷、L_0 谱**：那些是 vertex **operator** algebra 的附加公理
      （L_0 谱下有界 + 本征空间有限维，G–N p. 579），本卡与之无关。
  (d) **不含任何收敛性、围道、径向排序**：z_0, z_1, z_2（或 z, w）始终是形式变量。
