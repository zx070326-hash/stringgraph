      本卡 (A)(B) 与「模式约定陷阱」段全部取自本条。G–N 自陈其定义「using the notation of [21]
      (= Goddard 1989, Meromorphic conformal field theory)」、公理表取自「[15] = FHL 1993
      (Memoirs AMS 104, no. 594)」（刊 p. 578 逐字，参考文献表见 §36.4）。
  - ref: bakalov-kac-2004
    loc: "Definition 2.1, p. 3（顶点代数：局域性 + 平移 (2.14) + 真空 (2.15)/(2.16)）; eq. (2.19), p. 3（Borcherds identity，留数版）"
    note: |
      **L1（researcher 2026-09-11 读 arxiv.org/pdf/math/0402315，PDF 页 = 文章页；math-sources.md §37.4(a)）。**
      逐字：「The most important property of a vertex algebra V is the following *Borcherds identity*
      (which along with the vacuum axioms provides an equivalent definition of a vertex algebra)」。
      ⚠ **本文的 (2.21) 是「场版」对易子公式（带 δ 函数）**
      `[Y(a,u), Y(b,w)] = Σ_{m≥0} Y(a_{(m)}b, w) ∂_w^{(m)} δ(u−w)`，
      **不是**模式版 `[a_{(m)}, b_{(n)}] = Σ_k C(m,k)(a_{(k)}b)_{(m+n−k)}`；模式版本文未写
      （扭转版模式展开见 Remark 3.1 的 (3.7)，取 σ = 1 需读者自己做一步）。
      故本卡的模式版 (B) 只引 Gebert–Nicolai。
  - ref: borcherds-1986
    loc: "Section 4 'Vertex Algebras', relations (i)–(v)（全文无编号定理、无编号公式；作者主页重排本页码与期刊 3068–3071 不对应，故 loc 只写节号）"
    note: |
      **L1（researcher 2026-09-11 逐页读作者主页重排本 math.berkeley.edu/~reb/papers/va/va.pdf；
      math-sources.md §36.2、§37.2）。** 原始文献，本卡的历史出处。
      逐字：「**For any even lattice R** the operators u_n on V satisfy the following relations.」
      随后 (i)–(v)，再逐字：「We will call any module with linear operators D^{(i)}(u) and bilinear
      operators u_n(v) satisfying relations i–v above a **vertex algebra**」。
      ⚠⚠ **引用陷阱（§37.2 的负面结论）**：(v) 是**迭代 / 结合律**形式，**不是**对易子公式。
      从 (v) 推出对易子公式是一步真实推导，原文没有写出来。
      **任何以 Borcherds (v) 为唯一依据的边必须标 `inferred: true`。**
      另：Borcherds 全文没有 Theorem / Proposition 编号，**图里不得写「Borcherds 1986, Theorem X」**。
