notes: |
  【为什么 kind = definition】本卡登记的是顶点代数**公理体系里的那一条公理**（G–N 定义的第 5 条），
  而不是某条被证明的命题。按 docs/STATUS_LEVELS.md，定义卡的 `status` 表示该定义卡本身的地位：
  这里是数学上精确、但未形式化，故 **rigorous**。
  Bakalov–Kac 侧它是定理而非公理——这不改变本卡的分类，只说明「顶点代数」有多套等价的公理化，
  本卡的边界条款 (b) 已把「等价性只是断言」这一点登记在案。

  【为什么与 math.vertex-algebra-associativity 分开】那张卡是 Frenkel–Ben-Zvi Theorem 3.2.1 的
  **结合性**：Y(A,z)Y(B,w)C = Y(Y(A,z−w)B,w)C 于 V((w))((z−w))，对应 G–N (2.37)（本卡 (B) 在 m = 0 的特例）。
  它**严格弱于**本卡的 (B)。此前两条 G–N 推导
  （worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 与
  worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket）的 gaps 里逐字登记了
  「图中没有『顶点代数 Jacobi 恒等式 / Borcherds 恒等式』卡」这个缺卡，**本卡就是补上它**。

  【为什么与 math.locality-ope-equivalences-v2 分开】那张卡（Schottenloher Thm 10.10）讲的是
  **任意两个局域形式分布**（不需要顶点代数结构），其第 5 条给出同一形状的模式对易子公式，
  但其中的 C^j 只是「某组形式分布」；顶点代数里额外成立 C^j(w) = 𝒴(ψ_j φ, w)，即 OPE 系数场本身是顶点算子。
  二者不互为依赖。

  【引用禁令（literature/extractions/math-sources.md §38.2，researcher 2026-09-11）】
  · **不得写** `Kac, (4.8.3)`（该编号无任何证据）；可写的只有 Kac Theorem 4.8 / (4.8.1)（编号经作者勘误表
    L1 确认，**措辞仍 L0**），本卡未引。
  · **不得写** `Kac, Theorem 5.5`（5.4/5.5 是**节号**不是定理号）。
  · **不得写** `Lepowsky–Li, Theorem 6.5.3`（无任何证据；他人转引到的只有 6.2.11 / 6.3.2 / 5.7.1）。
  · **不得写** `FLM, Theorem 8.x`（零证据，连 §8 标题都未取到）。
  · **不得写** `Borcherds 1986, Theorem X`（原文无编号定理）；Borcherds 的 loc 只写节号，
    因为重排本页码与 PNAS 印本不对应（未解决问题 Q33）。

  【uses_conventions 为空的理由】本卡的公式里不出现度规、α'、规范场归一化等物理约定；
  唯一需要固定的是模式展开的约定，而它已在陈述内部由 (2.31) 写死，并把与 (2.47) 的换算 (2.48) 一并写出。
