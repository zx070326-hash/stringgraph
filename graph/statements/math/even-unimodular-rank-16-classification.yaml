id: math.even-unimodular-rank-16-classification
kind: proposition
title: 16 维偶幺模（欧氏）格恰有两个同构类：D_16^+ 与 E_8 ⊕ E_8，且两者不同构
statement: |
  **逐字（Chenevier–Lannes, Corollaire 3.6, 书上 p. 35，法文原文）**：

  > «Tout réseau unimodulaire pair de dimension 16 est isomorphe à `D_16^+` ou à `E_8 ⊕ E_8`
  > (et ces deux réseaux ne sont pas isomorphes).»

  **中译**：任一 **16 维偶幺模格**同构于 `D_16^+` 或 `E_8 ⊕ E_8`，**且这两个格互不同构**。

  **前提的展开（同书 §I.1, p. 1 的定义，逐字）**：
    «Un réseau unimodulaire pair de rang n est un réseau `L ⊂ R^n` de covolume 1 et tel que
    `x·x ∈ 2Z` pour tout `x ∈ L`.»
    —— 即：`R^n` 中（**欧氏正定内积**下）covolume = 1 且 `x·x ∈ 2Z` 的格。
  **两个格的定义（同书 §I.1, p. 1，逐字）**：
    «`E_n = D_n ⊕ Z e` où `D_n = {(x_i) ∈ Z^n, Σ_i x_i ≡ 0 mod 2}`, `e = ½(1,1,…,1)`, et `n ≡ 0 mod 8`.»
    该书 p. 33 自陈记号：«Le réseau unimodulaire pair `E_n` est aussi noté `D_n^+` (au moins pour `n ≥ 16`)»。
    ⇒ 本卡的 `D_16^+` 就是该书 §I.1 的 `E_16`。**`E_16` 不是李代数**（不存在 `E_16` 型李代数）；
    该书 p. 33 另注 «Pour `n ≥ 16` … on a `R(E_n) = R(D_n) = D_n`»，即 `E_16` 的根系是 `D_16` 型。

  **本命题包含的两半**：「至多两个」（每个都同构于二者之一）与「至少两个」（二者不同构）。
  括号里那半句是原文自带的，故**不需要**另找「两者不同构」的来源。

  **本命题不断言的内容**：
    (1) **不**断言秩被 8 整除——那是独立的 math.even-unimodular-rank-divisible-by-8，
        ⚠ 本卡**不是**它的 n = 16 特例，它也**不蕴涵**本卡。
    (2) 不断言 8 维或 24 维的分类（同节 `Corollaire 3.5` 与 `Théorème 3.13` 分别给出，见 notes）。
    (3) 不断言不定号差（洛伦兹）情形的任何结论。
    (4) **不**断言这两个格与 Polchinski §11.6 记号 `Γ_16`、`Γ_8 × Γ_8` 的等同——
        那条记号比对是 math.even-self-dual-euclidean-lattices-dimension-16-v2，且标为 inferred。
