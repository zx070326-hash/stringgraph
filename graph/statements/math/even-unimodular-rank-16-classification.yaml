notes: |
  【同节顺带可用的编号（均 L1 页图，本卡不断言，仅备查）】
    · **`Corollaire 3.5`（p. 34）**：«Tout réseau unimodulaire pair de dimension 8 est isomorphe à `E_8`.»
      —— 8 维唯一，即 `E_8`。若将来需要，应**另建一张卡**，不要塞进本卡。
    · `Proposition 3.2`（p. 33）Venkov 恒等式；`Proposition-Définition 3.3`（p. 34）根系/équicoxeter/`|R(L)| = n·h(L)`；
    · `Théorème 3.12`（p. 41）无根向量者 ≅ Leech 格；`Théorème 3.13`（p. 41）24 维恰 24 类。

  【归属：原文怎么说的，以及禁令】
  该书 p. 33 小标题 «CLASSIFICATION DES RÉSEAUX UNIMODULAIRES PAIRS EN DIMENSION 8, 16 ET 24»
  下第一句逐字：
  «Cette classification est due à **Louis J. Mordell** en dimension 8, à **Ernst Witt** en dimension 16
  et à **Hans-Volker Niemeier** en dimension 24 [Ni73].»
  —— 这是**无编号的散文句**（p. 33），只入本 notes，不作为可引定理。
  ⚠ 原文**只**给 Niemeier 挂了文献标签 `[Ni73]`，对 Mordell 与 Witt **没给标签**。
  ⛔ **禁令（math-sources.md §47.4(e)、§47.6(d)）：不得在图里写「Witt (1941) 证明了 16 维恰有两个……」。**
    本项目找到的是**反向线索**：Chenevier–Lannes 唯一带标签引用 `[Wit41]` 的地方，引的是 `g ≤ 2` 的
    Siegel θ 恒等式，**不是分类**；witt-1941 正文本项目未取到（L0）。可写的最强表述只是
    「Chenevier–Lannes 把 16 维分类归给 Witt 但未给出处」。
  ⛔ **禁令**：Serre *A Course in Arithmetic*、Milnor–Husemöller、Conway–Sloane *SPLAG*、Ebeling
    四本书的**定理号/表号（含常被转引的 "Table 16.7"）一律不得写入图**——四本正文本项目一本都没取到。

  【★★ 两个真会咬人的记号陷阱（math-sources.md §47.5）】
    1. **`E_16` 不是李代数**：Chenevier–Lannes 的 `E_n := D_n ⊕ Ze` 是他们对 `D_n^+` 的记号。
       同一本书 §I.1 写 `E_16`、§II.3 写 `D_16^+`，指**同一个格**，不要当成两条不同结论。
    2. **`Λ_16` 在两处指不同的格**：Zagier (2008) p. 34 的 `Λ_16` = 16 维偶幺模不可分解格（= `D_16^+`）；
       Chenevier–Lannes **附录 A**（p. 339）的 `Λ_16` = **Barnes–Wall 格 `BW_16`**（最小范数 4，**不是幺模格**）。
       ⛔ 两者不可混。

  【Zagier 对本条的态度：只能当旁证，不能当来源】
  Zagier (2008) p. 34 写 «However, in rank 16 one knows that there are two non-equivalent lattices …»，
  p. 36 写 «there are two non-isomorphic even unimodular lattices `Λ_1 = Γ_8 ⊕ Γ_8` and `Λ_2 = Γ_16`
  in dimension 16»——但**不给编号、不给证明、正文不给文献**（该文体例是把参考文献集中到文末）。
  ⇒ **本卡的 sources 不挂 zagier-2008。**

  【认识论：本卡是 rigorous，但它不会把杂化弦「恰有两个」抬到 rigorous】
  杂化弦那条结论的瓶颈是另一条**物理桥**「一致的 16 维内部 CFT（局域 OPE + 模不变）⟺ 偶自对偶欧氏格」
  （Polchinski §11.6，推给 v1 §8.4），那条仍是 `physical-argument`。
