id: math.no-holomorphic-quadratic-differentials-on-disk
kind: proposition
title: "圆盘上没有非零全纯二次微分（带边界条件 + ∞ 点全纯这两条前提）"
statement: |
  **约定**：黎曼面 Σ 上的**全纯二次微分**是给每个全纯坐标片 (U, z) 指定一个全纯函数 φ(z)，
  在换片 z ↦ w 时按
    φ̃(w) = φ(z) · (dz/dw)²
  相容变换的对象；它就是典范线丛的平方 K² = K^{⊗2} 的全纯截面。

  把圆盘 D₂ 实现为上半平面 H，边界 ∂H = R ∪ {∞}；
  D₂ 作为**紧**带边曲面 = H ∪ ∂H（含 ∞ 点），其在 ∞ 附近的坐标片取 u = 1/z。
  设 φ dz² 满足
    (2a)（**全纯性，含 ∞ 点**）φ 在 H 上全纯，且在 ∞ 点的坐标片上 φ̃(u) = φ(1/u)·u^{−4}
         于 u = 0 处也全纯——即 φ dz² 是**整个紧带边曲面 D₂ 上**的全纯二次微分，
         而不只是开上半平面上的；
    (2b)（**边界条件**）φ 在边界上取实值，φ(y) ∈ R 对一切 y ∈ ∂H ∩ R，
         等价地 φ dz² 在反射 z ↦ z̄ 下不变（这正是「二次微分能下降到 H 的双重 = P¹ 上」的相容条件）。
  则 φ dz² = 0。

  ⚠ **(2a) 缺一不可**：只设「φ 在 H 上全纯 + 边界取实值」时结论**字面为假**——
  反例 φ ≡ 1：它在 H 上全纯、在实轴取实值（故满足那两条），却非零；
  它被排除的真正理由是 φ̃(u) = u^{−4} 在 u = 0 有**四阶极点**，即违反 (2a)。
  （这条前提是 reviewer-batch13 于 2026-09-11 指出、
  在 math.no-holomorphic-quadratic-differentials-on-sphere-and-disk-v2 换代时补进陈述的；
  当时的推导**本来就在用**它，只是 v1 的陈述漏写。⇒ 属**陈述漏前提**，不是论证错误。）

  **本命题不断言什么**（逐条，重要）：
  - **不断言球面的情形**。那是姊妹卡 math.no-holomorphic-quadratic-differentials-on-sphere
    （H⁰(P¹, K²) = 0），它是本卡论证的输入，且严格程度更高。
  - **不断言 μ(D₂) = 0**。从「无非零全纯二次微分」到「模数 μ = 0」还要过桥
    worldsheet.moduli-holomorphic-quadratic-differentials，而该桥在**带边**情形下本身缺边界条件。
  - **不断言 (2b) 就是物理侧 μ 用的那个边界条件**。本图的 μ 定义
    （worldsheet.moduli-condition-traceless-transverse）写在**紧无边**曲面上，
    带边时 ker P̂₁^T 需要边界条件，本图与来源都没有给。⚠ 换个边界条件
    （例如只要求 φ 有界、或要求 Im φ|_∂ = 0 的另一种实结构）结论可能不同。
  - **不断言 RP₂ 的情形**（不可定向，需 dianalytic 语言；见姊妹卡的同条）。
  - **不涉及带极点或带标记点的二次微分**（同姊妹卡的警告：Eynard Ch. 5 Thm 4.1 的 `Ω_𝒮`
    是带二阶极点的**仿射**空间，不是 H⁰(K²)）。
  - 不涉及任何世界面/物理内容（Weyl 因子、路径积分测度、鬼场）。
