notes: |
  **★ 拆卡记录（2026-09-11，curator-small-backlog-2）**：本卡是
  math.no-holomorphic-quadratic-differentials-on-sphere-and-disk-v2 的 **(2)（圆盘）那一半**，
  statement 的 (2a)(2b) 与 ⚠ 逐字搬自 v2。球面那半见
  math.no-holomorphic-quadratic-differentials-on-sphere。
  拆卡理由（v2 自己的 notes 里逐字写明）：两半在文献中被分别推导且严格程度不同——
  球面那半已由 reviewer-batch13 复核为正确的初等计算，可标 rigorous；
  **圆盘那半还有两条未复核的缺口**（双重 = P¹ 的逐点相容、边界条件与物理侧 μ 的定义是否一致），
  故本卡的推导保持 physical-argument。合在一张卡上时球面那半被按 min 规则压住。
  ⚠ v2 的 `superseded_by` 指向**球面卡**（v2 的主干内容与 id 里的 `sphere` 在先），
  本卡是那次拆分的另一半；两张卡合起来等价于 v2。

  **与 Polchinski 的关系**：原书 §6.1 对 D₂（p.168）有一句「there are no moduli」的**断言**，
  不给论证；书内的一般理由是 §5.2 的 (5.2.11a)，而那正是
  worldsheet.positive-euler-number-no-moduli 的目标本身（拿来关闭就是循环）。
  本卡走的是**独立的数学路线**，故不把 Polchinski 列为 source。

  **接边提醒（给 lead / 下一轮 curator）**：把本卡接到
  worldsheet.positive-euler-number-no-moduli--via-surface-enumeration 时，
  必须同时接 worldsheet.moduli-holomorphic-quadratic-differentials（μ = 全纯二次微分空间的实维数），
  并把上面「(2b) 未必等于物理侧边界条件」这条写进 note——否则会出现
  「数学卡关掉了一个与物理定义未必相同的问题」。
