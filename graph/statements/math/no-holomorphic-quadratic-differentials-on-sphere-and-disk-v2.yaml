notes: |
  **★ 换代记录（2026-09-11，curator-batch10-14-fix，依 reviewer-batch13）：本卡取代
  math.no-holomorphic-quadratic-differentials-on-sphere-and-disk（v1）。**
  唯一改动是 **(2) 补上前提 (2a)「在 ∞ 点（u = 1/z 片的 u = 0）也全纯」**。
  换代而不是改文本，是因为项目原则 1（已提交陈述的文本不可变）。
  v1 的 (2) 字面为假（反例 φ ≡ 1，见 statement 里的 ⚠），但**它的推导 (C) 并没有错**——
  推导在 ∞ 片上作了正则性要求，只是陈述漏写了这条前提。
  ⇒ 因此本卡**不**是「修正一个错误结论」，而是「把陈述收缩到论证真正覆盖的范围」，
  与 worldsheet.riemann-roch-kappa-minus-mu-v2 那次换代同型。
  v1 已写 `superseded_by`；v1 的推导按 docs/STATUS_LEVELS.md「旧推导的去留」改名改指本卡
  （math.no-holomorphic-quadratic-differentials-on-sphere-and-disk-v2--via-negative-degree），
  并在 (C) 补写前提。

  **建议（给 lead / 下一轮 curator）：本卡还应拆成两张。** (1) 与 (2) 在文献中被分别推导
  （(1) 是 P¹ 两片正则性，(2) 是 Schwarz 反射 + 双重），且**严格程度不同**——
  (A)（球面那半）已由 reviewer-batch13 复核为正确的初等 Laurent 计算，
  而 (C)（圆盘那半）还有两条未复核的缺口（双重 = P¹ 的逐点相容、边界条件与物理侧 μ 的定义是否一致）。
  合在一张卡上，球面那半就被圆盘那半压住、升不到 rigorous。
  ⚠ 本轮**不拆**：拆卡会连带改动 sphere-/disk-conformal-killing-group 两支的散文引用，
  超出本轮 claim 范围。

  **★★ 已拆（2026-09-11，curator-small-backlog-2）——上面那条建议本轮执行了。**
  本卡拆成两张，本卡的 `superseded_by` 指向其中的**球面**那张：
  - `math.no-holomorphic-quadratic-differentials-on-sphere` —— 本卡的 **(1)**，
    推导 `--via-two-patch-regularity`（kind proof，**status rigorous**，
    notes 带 `reviewer-verified: reviewer-batch13, 2026-09-11`，复核记录由旧推导搬来）；
  - `math.no-holomorphic-quadratic-differentials-on-disk` —— 本卡的 **(2)**，
    推导 `--via-schwarz-reflection`（**status physical-argument**，
    两条未复核缺口原样保留，并加一条指向球面卡的实边，因为 (C) 的最后一步就是归约到 (A)）。
  两张新卡合起来等价于本卡；`superseded_by` 只能填一个 id，故填球面那张
  （本卡 id 里 `sphere` 在先，且它是 (C) 的输入），圆盘那半靠本段与两张新卡自己的 notes 互指。
  本卡的推导 `--via-negative-degree` 按 docs/STATUS_LEVELS.md「旧推导的去留」**保留不动**，
  作为拆卡前论证的历史记录（它同时承载 (A)(B)(C) 三条路线）。
  下游散文引用（worldsheet.sphere-conformal-killing-group--via-automorphism-group 与
  worldsheet.disk-conformal-killing-group--via-real-mobius-subgroup 的 gaps 里那两处旧 v1 id）
  已同批改指对应的新卡。

  由 curator-ckg-followups 于 2026-09-11 新建（以下为 v1 的原始建卡记录，逐字保留）。
  **建卡动机是一条点名的待办**：
  worldsheet.positive-euler-number-no-moduli--via-surface-enumeration 的 gaps 第二条逐字写着

  > 「要真正关闭：新建一张『S₂ / D₂ 上不存在非零全局全纯二次微分 ⇒ μ = 0』的卡
  > （直接构造，与 sphere-conformal-killing-group 的两片正则性分析同型），
  > 再把本推导改挂它并撤 inferred。」

  本卡就是那张卡的**数学侧一半**（「不存在非零全纯二次微分」）。

  **★ 本轮只建卡，不改那条推导**（lead 的任务边界；positive-euler-* 由他人持 claim）。
  **给 lead 的接边建议（两条边，缺一不可）**：
  1. `worldsheet.positive-euler-number-no-moduli--via-surface-enumeration`
     加 `depends_on: math.no-holomorphic-quadratic-differentials-on-sphere-and-disk`（本卡）；
  2. 同时加 `depends_on: worldsheet.moduli-holomorphic-quadratic-differentials`
     ——它是「μ = 全纯二次微分空间的实维数」这座桥（math-sources.md §39.8 的 **(B2)**）。
     **只接第 1 条不够**：本卡说的是 H⁰(K²) = 0，它本身不含「μ」这个物理量。
  接完之后 S₂ 与 D₂ 两格才从「断言」变成「有论证」，并可撤掉相应的 inferred 标记。
  ⚠ **接完也不会升到 rigorous**：本卡推导是 physical-argument（见其 gaps），
  桥 (B2) 那张卡也是 physical-argument。

  **⚠ D₂ 那一格有一条本卡关不掉的残余缺口**：本图的 μ 定义
  （worldsheet.moduli-condition-traceless-transverse）写在**紧无边**曲面上，
  带边时 ker P̂₁^T 需要边界条件，本图与来源都没有给
  （positive-euler-number-no-moduli--via-surface-enumeration 的 gaps 最后一条已记）。
  本卡 (2) 自己**选定了**一个边界条件（φ 在 ∂H 上取实值 / 反射不变），
  它与物理侧 μ 的定义是否逐字一致，**本图无节点、无来源**。
  ⇒ 接边时必须把这条写进 note，不要让它悄悄消失。

  **与 Polchinski 的关系**：原书 §6.1 对 S₂（p.167）与 D₂（p.168）各有一句
  「there are no moduli」的**断言**，不给论证；书内的一般理由是 §5.2 的 (5.2.11a)，
  而那正是 positive-euler-number-no-moduli 的目标本身（拿来关闭就是循环）。
  本卡走的是**独立的数学路线**，故不把 Polchinski 列为 source。

  **与 riemann-roch-* 诸卡的关系**：另一名 curator 正在按 math-sources.md §42 建
  math.riemann-roch-theorem / math.canonical-divisor-degree /
  math.quadratic-differentials-minus-holomorphic-vector-fields。
  本卡**有意不依赖**它们（本轮它们还不在 main，且本卡 (1) 有一条不需要 RR 的初等证明）。
  它们落地后，lead 可考虑给本卡补一条 --via-riemann-roch 的推导：
  由 `l(2K) − l(−K) = 3g − 3` 在 g = 0 给 `dim H⁰(K²) − dim H⁰(K^{−1}) = −3`，
  配 `dim H⁰(K^{−1}) = 3`（球面全纯向量场，见 worldsheet.sphere-conformal-killing-group）
  即得 `dim H⁰(K²) = 0`。⚠ 那条路线**反过来依赖** κ(S₂) = 6，与本卡现有推导相互独立，
  不要把两者接成环。
