notes: |
  **★★ 与 item (2)（`math.supermoduli-compactified-genus-2-even-not-projected`）及 FKP
  （`math.supermoduli-compactified-genus-2-canonical-projection-fails`）无依赖关系**：Corrêa–Noja
  论文正文"the second item was first proved by [FKP]"这句话里的"second item"指 item (2)（g=2 偶
  分量），**不指本节点**。§8 组装证明对 item (3) 的论证从头到尾只引用 §2/§5/§6/§7 本文自建的工具，
  未引用 Theorem 3.5、Theorem 4.3 或参考文献 [10]（抽取记录 E7 备注逐字："g≥3 部分的证明完全不引用
  FKP [10]——只有 item (2)……依赖 FKP"）。因此本节点对应的推导 `depends_on: []`，不挂任何指向 FKP
  卡或 item(1)/(2) 卡的边。

  **与 `math.supermoduli-space-not-projected`（Donagi–Witten 2013）的关系**：两者都用 Green
  障碍理论把低亏格"种子"结果沿某种几何构造搬运到更高亏格，但搬运机制不同——Donagi–Witten 用分歧
  三重覆盖，本节点（Corrêa–Noja §5–§6）用椭圆尾粘接映射（"constant-tail NS gluing construction"）。
  两者是覆盖不同参数范围（未紧化 vs 紧化）的独立结果，不构成同一条依赖链。
