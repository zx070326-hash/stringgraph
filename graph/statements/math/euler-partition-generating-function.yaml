id: math.euler-partition-generating-function
kind: proposition
title: Euler 分拆生成函数：(Σ_{N≥0} p(N) X^N) · ∏_{n≥1}(1 − X^n) = 1 于任意交换环的形式幂级数环
statement: |
  【记号】p(N) := N 的整数分拆个数（p(0) = 1；「分拆」= 正整数的多重集，其和为 N）。
  设 R 是交换环，R[[X]] 是 R 上的一元形式幂级数环，

      P_R(X) := Σ_{N ≥ 0} p(N) X^N  ∈ R[[X]]

  （系数经典范同态 ℕ → R 取值；X 就是物理文献里的 q）。

  【无穷乘积的意义】给 R 任取一个使它成为 Hausdorff 拓扑环的拓扑（例如离散拓扑），
  并在 R[[X]] ≅ R^ℕ 上取**逐系数（乘积）拓扑**。下文的 ∏'_{n≥1} 指这个拓扑下的
  无条件收敛无穷乘积（可乘族的 tprod）。因子 1 − X^n 的「低阶部分」随 n 稳定，
  故该族可乘。(3) 给出同一等式的**完全无拓扑**的重述，因此 (1) 的内容与
  「R 上具体选了哪个 Hausdorff 环拓扑」无关。

  **(1) 无逆元形式（任意交换环 R）**：在 R[[X]] 中

      P_R(X) · ∏'_{n ≥ 1} (1 − X^n) = 1.

  特别地 ∏'_{n≥1}(1 − X^n) 在 R[[X]] 中可逆，其逆恰是 P_R(X)。
  **不需要 R 是域、不需要特征零、不需要无零因子。**

  **(2) 几何级数形式（任意交换半环 R）**：

      P_R(X) = ∏'_{n ≥ 1} ( Σ_{j ≥ 0} X^{n j} ).

  **(3) 无拓扑形式（任意交换环 S）**：对每个 N ≥ 0，有限部分积的第 N 个系数最终稳定，
  即对包含关系下一切充分大的有限集 s ⊆ {1, 2, 3, …}，

      coeff_N ( P_S(X) · ∏_{n ∈ s} (1 − X^n) ) = [N = 0]

  （N = 0 时为 1，N ≥ 1 时为 0）。

  **(4) 域上的除法形式**：若 K 是域，则

      P_K(X) = ( ∏'_{n ≥ 1} (1 − X^n) )^{−1} = ∏'_{n ≥ 1} (1 − X^n)^{−1},

  第二个等号是**逐因子取逆**，即物理文献字面写的

      Σ_{N ≥ 0} p(N) q^N = ∏_{n ≥ 1} (1 − q^n)^{−1}.

  (1)–(4) 是同一条恒等式的四种包装，(1) 最一般：(4) 的除法只是 (1) 的重写，
  「取逆」不是本命题的前提而是它的推论。

  【本节点明确**不**断言】
  (a) p(N) 的渐近行为（Hardy–Ramanujan 公式）或任何解析性质。本节点全部在
      **形式幂级数**层面，X 不取复数值，不涉及 |q| < 1 的收敛。
  (b) Dedekind η 函数的模变换性质，也不涉及 q^{1/24} 因子。
  (c) 五边形数定理——那是关于 ∏_{n≥1}(1 − X^n) **自身**展开系数的另一条恒等式，
      与本节点是不同的命题。
  (d) 与 Virasoro 代数、Verma 模、特征标的任何联系。要把本节点接到 Verma 特征标
      ch V(c,h) = q^h ∏_{n≥1}(1 − q^n)^{−1}，还需要 dim V_N = p(N)，
      那由 math.verma-module-free-over-negative-part 承载（rigorous，未形式化）。
