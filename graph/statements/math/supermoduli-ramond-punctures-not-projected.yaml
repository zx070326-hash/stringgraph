    loc: "arXiv:2308.07957v1, 摘要（逐字，经 export.arxiv.org API 核验）；正文 Theorem 1（本项目 L1 读取 PDF 得到的措辞，与摘要一致或几乎逐字一致）"
    note: |
      **部分 L1**：仅 pp.1–6（标题页、摘要、§1 "Preliminaries"、Theorem 1 逐字、Lemma 2、直至
      Corollary 4 与一个应用示例）已读（researcher 2026-09-18，抽取记录 donagi-ott-2023.md E1–E3）。
      **pp.7 起（全文 21 页中的绝大部分，含 Theorem 1 完整证明的核心技术步骤）未读**——本节点的
      status 依据"已发表定理陈述 + 完整证明性文章"的来源强度，非本项目独立复核证明本身。
tags: [supermoduli, super-riemann-surface, non-projected, ramond-puncture, math-input, donagi-ott]
notes: |
  与既有节点 `math.supermoduli-space-not-projected`（Donagi–Witten 2013，无穿孔）在"是否带穿孔"
  维度互补，不构成对该节点红线的修订：该节点只处理无穿孔情形，本节点填补"带纯 Ramond 穿孔"这一此前
  完全未提及的维度。

  **与 `math.supermoduli-ns-ramond-punctures-not-projected`（Wang）的关系**：Wang 论文摘要称
  "improve the result of Donagi, Witten, and Ott"，但**"improve"指的是把结论推广到 NS+Ramond 混合
  穿孔（n>0）的情形，不是在同一设置（n=0）下把界收紧**——事实上在 n=0 时 Wang 给出的界 g≥5r+3
  比本节点的 g≥5r+1 更严格（更弱的结果）。本节点不写"Wang 严格改进 Donagi-Ott"这类无条件比较
  措辞，任何比较均需加 n>0 限定，详见 Wang 节点 notes。
