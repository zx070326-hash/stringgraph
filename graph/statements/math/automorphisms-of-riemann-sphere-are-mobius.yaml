notes: |
  由 curator-ckg-followups 于 2026-09-11 新建，用途是给两处既有的「悬空免责声明」提供上游节点：

  - **math.mobius-group-sharply-three-transitive** 的「本命题不断言什么」第二条写着
    「不断言 PSL(2,C)、PSL(2,R) 是相应曲面的**全部**共形自同构群（那需要 Liouville 型定理，
    本图无节点）」——本卡就是那个节点（复情形的一半；实情形的一半见下）。
  - **worldsheet.sphere-conformal-killing-group** 的 (3)「相应的有限（整体）变换群是 PSL(2,C)」
    此前只有 Polchinski §6.1 的断言（且原书哪一式写了「PSL(2,C)」这个记号本项目未核实）。
    本卡给它一条**数学侧带编号来源**，接法见新推导
    worldsheet.sphere-conformal-killing-group--via-automorphism-group。

  **实情形没有对应的独立卡片（有意为之）**：Miličić 的圆盘侧是 **Theorem 1.7.3**
  （Aut(D(0,1)) ≅ SU(1,1)/{±I}），要变成「Aut(D) ≅ PSL(2,R)」还要接 **§1.9, p.11 的无编号句**
  （Ψ : SL(2,R) → SU(1,1) 是群同构）。**这个合成结论在该讲义里没有单一编号**
  （math-sources.md §39.7.1 的明确警告），故本轮**不建**「Aut(D) ≅ PSL(2,R)」的卡片，
  只把两处 loc 登记在 worldsheet.disk-conformal-killing-group 及其推导的 sources 里。
  若日后要建，必须在 statement 里写清是两处合成，或干脆只写 SU(1,1) 版。

  **与 CKV 计数的关系（重要，别混）**：本卡说的是**群**，图里要的 κ(S₂) = 6 说的是
  **李代数 / 向量场空间的实维数**。两者之间的桥在本图中由
  worldsheet.ckv-holomorphic-in-conformal-gauge（CKV ⟺ 处处正则的全纯向量场；
  status: physical-argument）加上 --via-automorphism-group 里的流完备性论证承担，**不在本卡内**。
  literature/extractions/math-sources.md §39.8 把这条桥记为 **(B1) κ = 2·dim H⁰(K^{−1})**，
  并明写「本轮无来源」。

  **不可定向侧的类比警告**：RP₂ 的共形 Killing 群在文献里有 SO(3) 与 SU(2) 两种写法
  （math-sources.md §39.7.4），相差一个 Z₂。本卡只管 P¹，不涉及该歧义。
