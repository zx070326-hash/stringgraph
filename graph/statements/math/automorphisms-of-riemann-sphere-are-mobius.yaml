id: math.automorphisms-of-riemann-sphere-are-mobius
kind: proposition
title: 黎曼球的全纯自同构恰为 Möbius 变换：Aut(P¹) ≅ PSL(2,C)
statement: |
  设 P¹ = C ∪ {∞} 是黎曼球（紧、连通、亏格 0 的黎曼面），
  **Aut(P¹)** 表示其全体**全纯自同构**（双全纯的双射 P¹ → P¹）在复合下构成的群。
  对矩阵 γ = [[a, b], [c, d]] ∈ SL(2,C)（ad − bc = 1）定义 Möbius 变换
    φ_γ(z) = (a z + b)/(c z + d) ,
  其中 c ≠ 0 时 z = −d/c ↦ ∞、∞ ↦ a/c，c = 0 时 ∞ ↦ ∞（按极限理解）。则：

  **(1)** φ_γ ∈ Aut(P¹)，γ ↦ φ_γ 是群同态，其核恰为 {±I}；
  **(2)** 由此诱导的同态
      PSL(2,C) = SL(2,C)/{±I} ⟶ Aut(P¹)
  是**群同构**。特别地，P¹ 的全纯自同构**恰好**是 Möbius 变换，别无其他
  ——满射性（任一双全纯自映射必为分式线性）是本命题的实质内容。

  **本命题不断言什么**：
  - 不断言任何**可迁性/单可迁性**（那是 math.mobius-group-sharply-three-transitive，
    与本命题互相独立：一个说「群有多大」，一个说「群怎么作用」）；
  - 不断言 Aut(P¹) 的**李代数**是 sl(2,C)，也不断言「P¹ 上的全局全纯向量场空间是 3 维复的」。
    从「自同构**群**」到「全纯**向量场**空间」还需一步（每个全局全纯向量场在紧曲面上的流完备、
    逐时全纯，故其单参群落在 Aut(P¹) 内；反之亦然），这一步**不含在本命题里**，
    由 worldsheet.sphere-conformal-killing-group--via-automorphism-group 承担并在其 gaps 中记录；
  - 不涉及**反全纯**（共轭）自同构，故**不**给出 P¹ 的全体保共形结构（含反定向）变换群；
  - 不涉及带边曲面（圆盘的 Aut(D) 见 worldsheet.disk-conformal-killing-group 的
    milicic-riemann-surfaces 来源条）与不可定向曲面（RP₂ 见 worldsheet.rp2-conformal-killing-group）；
  - 不涉及任何世界面/物理内容（Weyl 因子、顶点算子、路径积分测度）。
