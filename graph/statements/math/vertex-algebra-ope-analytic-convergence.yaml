notes: |
  **这是 worldsheet.operator-product-expansion 里那句「OPE 是有限收敛半径的收敛级数」在数学上最贴近的对应物**，
  但差两件事：
  (1) 前提不同——这里的前提是 Definition 7.2（复解析局域性），Polchinski 没有任何对应的假设，直接断言收敛；
  (2) 收敛域的表述不同——这里是 0 < |z_1 - z_2| < |z_2|（关于 z_2 = 0 处的「另一插入点」即真空插入在 0 与 ∞），
      Polchinski 说的是「到最近的其它算子插入点的距离」，对应 Gui Theorem 8.1 / 8.4 的多点情形（本批未落卡）。

  **与 math.vertex-algebra-associativity 绝不可合并**：那条是形式级数恒等式，本条是全纯函数的 Laurent 展开；
  见 math-sources.md §9.4 对照表。

  **弦论能否满足前提**：open——worldsheet.string-cft-is-a-vertex-algebra。

  **可能的后续节点**（math-sources.md §13.2）：math.n-point-function-analytic-continuation ← Gui Theorem 8.1
  （M 个两两局域的场，乘积级数在 Ω_σ 上 a.l.u. 收敛并延拓到**与排列 σ 无关**的 f ∈ O(Conf^M(C^×))，
  即径向排序的严格版本）。本批未建，因为图里尚无节点需要它。
