      Proposition 7.12 及 §7.11 引言全部逐字转录，本节点照抄。§7.11 引言逐字：「In this subsection, we assume the
      statements in Def. 7.2, and derive the OPE … Thus, the existence of OPE simply follows from complex analysis.」
      **版本陷阱**：只对作者主页「Last update: July 15, 2026」版核实；arXiv:2305.03822 各版编号未核实（L0）。
