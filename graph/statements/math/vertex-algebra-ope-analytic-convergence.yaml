id: math.vertex-algebra-ope-analytic-convergence
kind: proposition
title: 复解析局域性 ⇒ OPE 存在、a.l.u. 收敛于 0 < |z₁−z₂| < |z₂|、奇异项有限（Gui Prop. 7.12）
statement: |
  设 V、V′、P_n、齐次场 A(z), B(z) 如 math.vertex-algebra-complex-analytic-locality 所设，
  且 A, B 按该定义（Gui Definition 7.2）互为局域；N 为该定义第 2 条中的整数，
  f_{v,v′} ∈ O(Conf²(C^×)) 为该定义给出的全纯函数（v ∈ V, v′ ∈ V′）。
  对每个 k ∈ Z 与 z_2 ∈ C^×，定义线性映射 (A_k B)(z_2) : V′ ⊗ V → C 为
    ⟨v′, (A_k B)(z_2) v⟩ := ∮_{C(z_2)} (z_1 - z_2)^k f_{v,v′}(z_1, z_2) dz_1 / (2πi),                (7.14)
  其中 C(z_2) 是 C^× 中绕 z_2 的任一圆周（(z_1 - z_2)^k f_{v,v′} 在 z_1 = z_2 附近除该点外全纯，故与圆周的选取无关）。
  则：
  (i) **奇异项有限**：k ≥ N 时 A_k B = 0；
  (ii) **OPE 的存在与收敛**：对每个 v ∈ V, v′ ∈ V′，
        f_{v,v′}(z_1, z_2) = Σ_{k ∈ Z} (z_1 - z_2)^{-k-1} ⟨v′, (A_k B)(z_2) v⟩,                        (7.15)
      其中右端级数在
        Ω_0 = {(z_1, z_2) : 0 < |z_1 - z_2| < |z_2|}
      上 a.l.u. 收敛到左端。

  用场的写法即 A(z_1)B(z_2) = Σ_{k ∈ Z} (z_1 - z_2)^{-k-1} (A_k B)(z_2)，奇异部分只有 k = 0, …, N-1 共 N 项。
  **注意**：本命题不是无条件的「OPE 收敛」，而是「复解析局域性（Definition 7.2）⇒ OPE 存在且收敛」；
  OPE 系数场 (A_k B) 由围道积分 (7.14) **定义**出来，不是假设存在的。
