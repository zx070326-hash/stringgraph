id: math.vertex-algebra-module-vacuum-axiom
kind: definition
status: rigorous
title: 顶点代数模的真空公理：Y_W(1,x) = id_W
statement: |
  设 (V, Y, 1) 是顶点代数（公理体系见 math.vertex-algebra-borcherds-identity），
  (W, Y_W) 是 V 上的一个模：即对每个 u ∈ V，W 上有算子
    Y_W(u, x) = Σ_{n ∈ Z} u_n x^{-n-1} ∈ (End W)[[x, x^{-1}]]，
  且这些算子对一切 u, v ∈ V、w ∈ W 满足与 V 自身相同的关系组（Borcherds 1986 §4 的 (i)–(v)，
  把其中一个变量的取值范围从 V 换成 W）。

  **真空公理**是该关系组的第 (ii) 条特化到 u = 1（V 的真空向量）：对一切 n ∈ Z、w ∈ W，
    1_n(w) = 0   (n ≠ −1),      1_{-1}(w) = w,
  等价地写成生成函数形式：
    Y_W(1, x) = id_W。

  即真空向量 1 ∈ V 在任意 V-模 (W, Y_W) 上都作用为恒等算子。

  **特例**：取 W = V（Borcherds 逐字「In particular V is a V module」）即退回到顶点代数自身的真空公理
  （对应 Gebert–Nicolai (2.24) 𝒱(1,z) = id_ℱ、Bakalov–Kac (2.15)/(2.16)），
  故本卡登记的是同一条公理形式在**模**这一更一般设定下的版本，不是一条新的独立事实。

  **本卡不断言的两条：**
  1. **不断言这条公理蕴含或等价于其余关系 (i)/(iii)/(iv)/(v)（截断性、L(-1)-导数、结合律/Jacobi 恒等式）。**
     它们是同一模定义里彼此独立的公理条款，各自的图内承载见 math.vertex-algebra-borcherds-identity
     （对 (v) 一半的模式版）；本卡只登记 (ii) 这一条。
  2. **不断言 W 上存在分次、L_0 半单或谱有界等 VOA 模的附加结构。** 那些是顶点算子代数（而非顶点代数）
     模的额外公理，本卡与之无关。
