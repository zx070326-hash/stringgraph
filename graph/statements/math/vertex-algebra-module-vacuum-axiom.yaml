sources:
  - ref: borcherds-1986
    loc: "Section 4 'Vertex Algebras'：关系 (i)–(v)（无编号公式，(ii) 即真空公理）；随后模的定义句（无编号，紧接 (v) 之后）"
    note: |
      **L1（researcher 2026-09-11 逐页读作者主页重排本 math.berkeley.edu/~reb/papers/va/va.pdf；
      逐字文本见 literature/extractions/math-sources.md §37.2）。**
      关系 (ii) 逐字：「`1_n(w) = 0` if `n ≠ −1`, `w` if `n = −1`.」
      模的定义逐字（紧接 (i)–(v) 之后）：「A module over a vertex algebra `V` is a module `W` with
      operators `u_n` on `W` satisfying relations *i*–*v* above for `u, v` in `V`, `w` in `W`.
      In particular `V` is a `V` module.」
      ⇒ 本卡的真空公理就是把 (ii) 中的 `w` 取自任意模 `W`（而非 `V` 自身）。
      ⚠ 原文全篇无编号定理/公式，`loc` 只写节号（见 §36.2 的引用陷阱说明）。
