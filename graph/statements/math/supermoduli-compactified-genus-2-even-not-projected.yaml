      消没），故此依赖列在这里仅作文献学记录，实质依赖边见下方 derivation 的 depends_on。
tags: [supermoduli, super-riemann-surface, non-projected, compactified, genus-2, math-input, correa-noja, felder-kazhdan-polishchuk]
notes: |
  **与 `math.supermoduli-compactified-genus-2-canonical-projection-fails`（FKP Theorem 6.3）的关系**：
  两节点断言的是（据 Corrêa–Noja 自己的识别）同一个底层数学事实的两种表述——FKP 用"S̄₂ 的典范投影
  在 (−,−) 边界因子处失效"的语言，Corrêa–Noja 用"ω₂(𝔐̄₂⁺)≠0"的障碍类语言。**本项目未独立核实
  FKP 原文 §6 是否本身就用宇称分量表述**（见 FKP 卡 notes），因此保留两个节点分立，不合并成一张卡：
  FKP 卡承载 FKP 自己的原始语言与优先权，本节点承载 Corrêa–Noja 自己的语言与独立确认，两者通过
  depends_on 边连接，而不是等同为一个 statement。

  **★★ 与 `math.supermoduli-compactified-genus-geq3-not-projected`（item 3）不构成同一条依赖链**：
  Corrêa–Noja 论文正文"the second item was first proved by [FKP]"这句话里的"second item"指本节点，
  **不指 g≥3 的 item 3**——item 3 的推导不挂 FKP 依赖边（见该节点）。
