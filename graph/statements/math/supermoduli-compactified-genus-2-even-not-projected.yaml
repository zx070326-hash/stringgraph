    note: |
      L1 全文逐页读取（researcher 2026-09-18，抽取记录 correa-noja-2026.md E1, E2, E4, E7）。
  - ref: felder-kazhdan-polishchuk-2024
    loc: "arXiv:2408.11136v1（原始证明所在，本项目未读；间接经 correa-noja-2026 的转述与优先权声明核实其存在）"
