id: math.supermoduli-compactified-genus-2-even-not-projected
kind: proposition
title: 紧化亏格二偶自旋分量超模叠不可投影（Corrêa–Noja Theorem 1.1 item 2 = Theorem 4.3；与 Felder–Kazhdan–Polishchuk Theorem 6.3 同一底层事实的独立确认）：ω₂(𝔐̄₂⁺)≠0
statement: |
  **对象**：记号同 `math.supermoduli-compactified-genus-2-odd-split`。

  **定理**（Theorem 1.1 item (2)，逐字，p.1）：
  "The even compactified genus-two component 𝔐̄₂⁺ is non-projected. More precisely, ω₂(𝔐̄₂⁺) ≠ 0."

  **优先权与依赖归属**（p.2，紧跟定理之后，逐字）：
  "The second item was first proved by Felder–Kazhdan–Polishchuk in [10]. Here we confirm their result
  by computing directly the primary Green obstruction at the separating (−,−)-boundary divisor. Our
  argument is not independent of [10] though, as it relies on their boundary expansion of the
  superperiod map and the elementary hyperelliptic invariant-theoretic vanishing entering their
  analysis of projections."
  ——"[10]"即 Felder–Kazhdan–Polishchuk arXiv:2408.11136（见
  `math.supermoduli-compactified-genus-2-canonical-projection-fails`）。**本文自陈"the second item"
  指本节点（item 2），不是 g≥3 的 item 3**。

  **证明方法**（§4，Lemmas 4.1/4.2, Theorem 4.3）：直接在分离 (−,−)-边界因子处计算第一 Green 障碍的
  法向主部分量，证明该分量不能被消去。§8 组装证明逐字："The second assertion is the Felder–Kazhdan–
  Polishchuk genus-two even non-projectedness theorem, recalled in the form needed here in Section 4.
  In the notation of this paper, this is Theorem 4.3."

  **本节点不断言**：紧化亏格二**奇**分量（split，见 `math.supermoduli-compactified-genus-2-odd-split`）
  与 g≥3 情形（**不依赖本节点或 FKP**，见 `math.supermoduli-compactified-genus-geq3-not-projected`）。
