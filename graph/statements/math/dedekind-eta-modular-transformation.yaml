notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E16 建立。

  **status 说明（为什么 (a)(b) 同卡）**：原书把两式作为一对断言给出，且**都没有推导**，
  故合成一卡不违反「一个节点一个命题」的初衷（文献未分别推导）。
  ⚠ **但两半的可证难度天差地别**：(a) 由乘积定义两行可得（q 不变、q^{1/24} 出相位 e^{2πi/24}），
  (b) 是 η 变换定理的实质内容。**一旦为 (b) 找到数学来源或做出 Lean 证明，就应拆卡**：
  拆成 math.dedekind-eta-t-transformation（可 rigorous/formalized）与
  math.dedekind-eta-s-transformation。本卡现按弱的那一半定级，这是有意的。
  已在本批次报告里作为「建议拆分」列出。

  **形式化目标**：抽取记录 §5-C 的首选 Lean 岛。Mathlib 现状（ModularForm/UpperHalfPlane/
  SlashAction 有；DedekindEta 未核实）留给 formalizer。

  ⛔ **本卡已于 2026-09-11 拆成两张，不要再往它上面挂新边**（lead 依 reviewer-v1-ch7 裁定）：
    - **T 半** → `math.dedekind-eta-t-transformation`（**rigorous**，
      `reviewer-verified: reviewer-ch7, 2026-09-11`；分支约定 q^{1/24} = e^{πiτ/12} 在定义卡里，
      两行验算给出相位 e^{iπ/12}）；
    - **S 半** → `math.dedekind-eta-s-transformation`（**physical-argument**，原书零证明零引用）。
  `superseded_by` 指向 **S 卡**，因为真正的缺口在那一半，下游引用本卡时绝大多数用的也是 S。
  ⚠ **但「指向 S 卡」不表示本卡的内容等于 S 卡**：本卡还含 T 半与「τ₂|η|⁴ 模不变」的推论，
  改指时必须逐条看用的是哪一半——只用 T 的指 T 卡，只用 S 的指 S 卡，两半都用的挂两条边。
  本批次已按此改完第 7 章内的四条推导（见各自 notes）。

  **拆卡理由（reviewer-v1-ch7）**：合卡按弱者定级，使 T 半的实际强度被低估两级，
  并把只用 T 的下游（如 (7.2.29) 整数自旋那条线、Narain 偶格那条线）无谓压低。
  本卡 notes 里原先就写着「一旦为 (b) 找到数学来源或做出 Lean 证明，就应拆卡」；
  reviewer 指出**不必等**：T 半今天就能按 rigorous 例外条款定级，拆卡不需要 S 半有进展。
