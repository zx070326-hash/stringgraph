id: math.dedekind-eta-modular-transformation
kind: proposition
title: "Dedekind η 的模变换：η(τ+1) = e^{iπ/12}η(τ) 与 η(−1/τ) = (−iτ)^{1/2}η(τ)"
statement: |
  设 η 如 math.dedekind-eta-function 所定义（τ ∈ H，q = exp(2πiτ)，q^{1/24} = exp(πiτ/12)）。则
    (a)  η(τ + 1) = exp(iπ/12) · η(τ) ,
    (b)  η(−1/τ) = (−iτ)^{1/2} · η(τ) ,
  其中 (b) 里的 (−iτ)^{1/2} 取**主分支**（τ ∈ H ⇒ −iτ 落在右半平面 Re(−iτ) > 0，
  该处主平方根单值全纯且在 τ = i 处取值 1）。

  **推论（下游实际使用的形式）**：|η(τ)|² 与 τ₂ = Im τ 的组合
    τ₂ |η(τ)|⁴
  在 T : τ ↦ τ+1 与 S : τ ↦ −1/τ 下不变，因而在整个模群下不变
  （用到 Im(−1/τ) = τ₂/|τ|²，|(−iτ)^{1/2}|⁴ = |τ|²）。

  **本卡不断言什么**：不断言 η 是权 1/2 的模形式的一般乘子系统（对一般
  (a b ; c d) ∈ SL(2,Z) 的变换含 Dedekind 和，本卡不涉及）；不断言 (b) 的任何证明
  （Polchinski 对 (a)(b) 均为纯断言，见本卡唯一一条推导的 gaps）。
