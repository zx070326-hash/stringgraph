id: math.e8-root-system
kind: definition
status: rigorous
title: E₈ 根系：ℝ⁸ 中的 240 个向量 {±ε_i ± ε_j (i < j)} ∪ {½ Σ ±ε_i（偶数个负号）}
statement: |
  设 V = ℝ⁸，ε₁, …, ε₈ 为标准基，内积为标准欧氏内积（不涉及本图任何物理约定）。

  **格**：令 L′ := {Σ_i c_i ε_i : c ∈ ℤ⁸, Σ_i c_i 为偶数}，L := L′ + ℤ·(½ Σ_{i=1}^{8} ε_i)。

  **定义**：E₈ 根系 Φ = Φ(E₈) 是 L 中**长度平方为 2** 的全体向量。它恰由以下 **240** 个向量组成：

  · **向量型**（112 个）：±ε_i ± ε_j，1 ≤ i < j ≤ 8，两个符号独立取（28 对 × 4）；
  · **旋量型**（128 个）：½ Σ_{i=1}^{8} s_i ε_i，s_i ∈ {+1, −1}，且 **负号个数为偶数**（2⁷ = 128）。

  **符号约定的等价性**（本卡随定义一并断言）：来源原文写的是「even number of + signs」；
  由于 8 个符号里 + 号个数为偶 ⟺ − 号个数为偶（8 − 偶 = 偶），两种说法给出**同一个** 128 元集合。
  本卡与 formal/StringFormal/Math/E8Roots.lean 统一采用「偶数个负号」的说法。

  **附带数据**（来源同页给出，作为定义的一部分记录）：
  · |Φ| = 240，秩 8，故 |Φ| + 秩 = 248；
  · 单根系 Δ 可取 α₁ = ½(ε₁ − ε₂ − ε₃ − ε₄ − ε₅ − ε₆ − ε₇ + ε₈)，α₂ = ε₁ + ε₂，
    α_i = ε_{i−1} − ε_{i−2}（3 ≤ i ≤ 8）；最高根 α̃ = ε₇ + ε₈；
  · Weyl 群阶 |W| = 2¹⁴ · 3⁵ · 5² · 7。

  **本卡不断言**：
  (a) 「L 中长度平方为 2 的向量**恰好**是上面 240 个」这一完备性的证明——来源只是陈述它
      （Humphreys 自陈是 Bourbaki Ch. VI 构造的概述），本卡照录；
  (b) 任何关于李代数 𝔢₈ 的事：Φ 与「复单李代数 𝔢₈ 相对某个 Cartan 子代数的根集合」的同构
      不在本卡内（那需要 Dynkin 图分类与同型根系唯一性，本图暂无节点；用到时在推导里写 gap）；
  (c) Φ 的幂和 Σ_α (α·x)^k 的任何取值——见 math.e8-root-system-power-sums；
  (d) 任何关于 16 维偶自对偶格、E₈ ⊕ E₈ 与 D₁₆⁺ 的事。
