sources:
  - ref: humphreys-1990-reflection
    loc: "§2.10 (Construction of root systems)，(E₈) 一条，书上 pp. 42–43；同章 Table 2, p. 44（|Φ| = 240、|W| = 2¹⁴3⁵5²7）"
    note: |
      **L1 逐字读图**（抽取记录 literature/extractions/math-sources.md §44.2；Cambridge Core 章级 PDF）。
      原文（跨页）：「(E₈) Let V = R⁸. The choice of lattice is somewhat subtle. Start with the lattice L′
      consisting of all Σ c_i ε_i with c ∈ Z and Σ c_i even. Then let L = L′ + Z(½ Σ ε_i). Define Φ to be
      the set of all vectors of squared length 2 in L. So Φ consists of 240 roots: ±ε_i ± ε_j (i < j),
      ½ Σ ±ε_i (even number of + signs).」随后给出 Δ 与 α̃（本卡「附带数据」逐字照录）。
      §2.10 开场逐字：「We shall outline briefly the construction of (crystallographic) root systems of
      all possible types, following Chapter VI of Bourbaki [1] (which should be consulted for further
      details).」⇒ 完备性的证明细节在 Bourbaki，本项目未取得（见下一条与「本卡不断言 (a)」）。
      ⚠ 原文是「even number of **+** signs」，本卡改写为「偶数个**负**号」，等价性见 statement。
  - ref: bourbaki-lie-4-6
    loc: "Ch. VI, Planche VII（E₈）"
    note: |
      **L3，本项目未取得 Bourbaki 原文。** 该定位来自 Humphreys §2.10 自陈「following Chapter VI of
      Bourbaki [1]」（L1）；「Planche VII」这个编号本身在本项目没有一手证据，按 sources.bib 该条的禁令
      只作转引登记。**不得**据此写任何 Bourbaki 的编号命题。
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/E8Roots.lean :: StringFormal.Math.E8.{e8Roots, e8VectorRoots, e8SpinorRoots, e8Roots_length, e8Roots_nodup, e8RootSet, e8RootSet_card, e8Roots_normSq, e8_dim_248}"
    note: |
      本仓库（主分支合并提交 fb489ee，Lean 4 + Mathlib v4.33.1）把这 240 个向量作为**显式列表**
      `e8Roots : List (Fin 8 → ℚ)` 写出（112 条 `vroot` + 128 条 `spinRoot`，后者按「前后两半宇称相同」
      实现「偶数个负号」）。机器检查过的事实：`e8Roots_length = 240`（`rfl`）、`e8Roots_nodup`
      （240 条两两不同）、`e8RootSet_card = 240`（作为 Finset 的基数）、`e8Roots_normSq`（每条 Σα_i² = 2）。
      **Lean 只核了 ⊆ 方向**（列表里的每个向量长度平方为 2），**没有核完备性**
      （L 中所有长度平方为 2 的向量都在表里）；Lean 文件的 docstring 自己写明「"these 240 vectors are
      exactly the roots of E₈" is here a *definition* (the Humphreys list), not a theorem」。
      因此本卡 **status 是 rigorous 而非 formalized**，也**不挂 formal.lean_decl**：Lean 对象
      `e8Roots` 与本卡「L 中长度平方为 2 的全体向量」这句定义不逐句对应。
tags: [algebra, lie-algebra, root-system, e8, lattice, phase2, math-input]
notes: |
  【为什么立卡】math.e8-adjoint-trace-identities 的系数 1/100、1/7200 的唯一「可算」来路是对根系做幂和
  （math.e8-root-system-power-sums），而幂和的输入就是这 240 个向量。把根系列表单独立成定义卡，
  使「这 240 个向量是 E₈ 的根」这一句在图里有一个可指的、带 L1 来源的定位点。

  【与 Lean 列表的对应】E8Roots.lean 的 `e8Roots` 是本卡 240 元集合的一个**枚举**（有序列表），
  本卡是**集合**。`e8Roots_nodup` + `e8RootSet_card = 240` 保证枚举无重复、恰 240 条；
  `e8Roots_normSq` 保证都是长度平方 2。「都在格 L 里」在 Lean 中没有单独陈述（坐标是整数或全半整数，
  整数型的坐标和为偶——按构造显然，但未写成定理）。

  【status 的选择】rigorous：Humphreys §2.10 是 L1 逐字，Bourbaki 是数学界接受的完整处理；
  完备性 (a) 是有限枚举可核的初等事实，但本项目没有独立复核，也没有 Lean 化，故不升 formalized。

  【记号陷阱不在本卡】E₈ 格 Γ₈ 与 16 维格 Λ₁₆（Γ₈ ⊕ Γ₈ 还是 D₁₆⁺ 的两义）以及杂化弦文献中
  「E₁₆」这类记号，本卡一概不涉及；需要时另立卡。

  【查重】`uv run stringgraph search e8` 命中 math.e8-adjoint-trace-identities（迹恒等式卡）与若干
  consistency 卡；`search root-system`、`search cartan`、`search semisimple` 均无根系/李代数结构卡。
