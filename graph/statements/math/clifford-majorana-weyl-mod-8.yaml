notes: |
  【为什么只能到 physical-argument】详见推导卡 gaps。三条硬理由：
  (1) 不可约表示的**唯一性**在原书只有一句话（p.432 逐字「The above construction of the irreducible
      representation of the `Γ` matrices shows that in even dimensions `d = 2k+2` it is unique up to a
      change of basis」），没有证明；两个 Weyl 表示「inequivalent」也只是断言。
  (2) `B`、`C` 性质的**基无关性**整体外包给习题 B.1。
  (3) 全附录零引用、无编号定理。
  按 docs/STATUS_LEVELS.md 的 rigorous 例外条款也不够格：唯一性不是"有限步初等计算"。

  【升级路径】要把本卡升到 rigorous，需另加数学来源。候选：Atiyah–Bott–Shapiro,
  *Clifford modules*, Topology 3 (1964) suppl. 1；Lawson–Michelsohn, *Spin Geometry*, Ch. I。
  ⚠ **两者本项目均未取得（证据等级 L0）**，因此**未登记到 literature/sources.bib，也不得先写式号/定理号**。
  取得后应新建一条 `--via-<数学来源>` 推导（不改本卡陈述）。

  【抽取者的独立复算，已核对吻合，记账用】
  (a) min. rep. 列 11 行全部由「2 × Dirac 维数，Weyl ÷2，Majorana ÷2」复算吻合：
      d=2→1, 3→2, 4→4, 5→8, 6→8, 7→16, 8→16, 9→16, 10→16, 11→32, 12→64。
  (b) 由 (B.1.21)：`B_1` 可用 iff `k ≡ 0,3 (mod 4)`，`B_2` 可用 iff `k ≡ 0,1 (mod 4)`；
      偶 `d = 2k+2` 的并集是 `d ≡ 0,2,4 (mod 8)`，奇 `d = 2k+3`（只许 `B_1`）是 `d ≡ 1,3 (mod 8)`，
      合起来 `d ≡ 0,1,2,3,4 (mod 8)` = 正文结论句；M–W 需 `k ≡ 0 (mod 4)` ⇒ `d ≡ 2 (mod 8)` = 表中 d=2,10。
      ⚠ 这只是**与原书自洽性的核对**（抽取记录 §0.3a/b），不是独立证明，不构成升级理由。
  (c) p.433「twice the dimension of the Dirac representation」指「实参数数 = 2 × 复维数」，
      不是「两倍 Dirac 旋量」（抽取记录 Q7），记此以免后人误读。

  【约定】Clifford 归一化 `{Γ,Γ} = 2η`、`Σ` 的 `−i/4`、`Γ` 的 `i^{−k}` 三处归一化**写在陈述正文里**，
  图上尚无 `conv.clifford-normalization` 节点；若日后要建，loc = App. B (B.1.1) p.430、(B.1.8)(B.1.11) pp.431–432。

  【可形式化的岛】(B.1.6)(B.1.7a,b) 的显式迭代构造（d=2 的 2×2 矩阵 + 张量积递推）配 (B.1.1) 的验证，
  以及 (B.1.21) 的符号计算，都是有限维矩阵代数，适合作 Lean 热身；难的是"唯一性"与"不等价"。

  【本卡在图上的角色】它是 susy.bps-bound-point-particle-d4（Majorana 性质与 C 的反对称性）与
  consistency.eleven-is-maximal-supersymmetric-dimension（`d ≥ 12` 旋量太大）的上游。
  ⚠ **本卡不含 SO(8) 三重性、不含 `8_s`/`8_c` 记号、不含 SO(8) 意义的 `56`**——App. B 全文没有这些
  （抽取记录 §3.2 第 1–3 条）。worldsheet.so8-triality 若日后建卡，**不得**以 App. B 为来源。
