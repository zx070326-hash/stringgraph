id: math.clifford-majorana-weyl-mod-8
kind: proposition
title: SO(d−1,1) 旋量的 Majorana / Weyl / Majorana–Weyl 条件按 d mod 8 的分类（Polchinski Table B.1）
statement: |
  设 Γ 矩阵满足 Clifford 代数 `{Γ^μ, Γ^ν} = 2η^{μν}`（(B.1.1)），号差取 `(d−1, 1)`，
  即 `η^{μν} = diag(−1, +1, …, +1)`；洛伦兹生成元取 `Σ^{μν} = −(i/4)[Γ^μ, Γ^ν]`（(B.1.8)），
  手征矩阵取 `Γ = i^{−k}Γ^0Γ^1…Γ^{d−1}`（(B.1.11)）。写 `d = 2k+2`（偶）或 `d = 2k+3`（奇）。
  Majorana 条件指 `ζ* = Bζ`（(B.1.20)），其中 `B` 满足 `BΣ^{μν}B^{−1} = −Σ^{μν*}`（(B.1.18)），
  由原书只能取 `B_1 = Γ^3Γ^5…Γ^{d−1}` 或 `B_2 = ΓB_1`（(B.1.16)）。

  **命题**：
  (i) 偶维 `d = 2k+2` 的 Γ 矩阵不可约表示维数为 `2^{k+1}`（Dirac 表示），按 `Γ` 的本征值 ±1
      分解为两个**不等价**的 `2^k` 维 Weyl 表示；奇维 `d = 2k+3` 有单一的 `2^{k+1}` 维不可约表示。
  (ii) Majorana 条件的相容性等价于 `B*B = 1`，而
      **`B_1^*B_1 = (−1)^{k(k+1)/2}`，`B_2^*B_2 = (−1)^{k(k−1)/2}`**（(B.1.21)）。
      因此用 `B_1` 需 `k ≡ 0` 或 `3 (mod 4)`，用 `B_2` 需 `k ≡ 0` 或 `1 (mod 4)`；
      奇维只有 `B_1` 与 `Γ^d = ±Γ` 相容。
  (iii) 由此得结论句（p.433 逐字）：
      **「In all, a Majorana condition is possible if `d = 0, 1, 2, 3`, or `4 (mod 8)`.」**
      Majorana 条件可加在 Weyl 旋量上，当且仅当 `B*B = 1` **且** Weyl 表示自共轭，
      即 `k ≡ 0 (mod 4)`，也即 **`d ≡ 2 (mod 8)`**；`k` 奇（`d ≡ 0` 或 `4 (mod 8)`）时
      Majorana 与 Weyl 只能二选一。
  (iv) 上述性质只依赖 `d` mod 8；最小表示的实分量数每加 8 维乘 16。

  **Table B.1（p.434，表题与表体逐字转录，含原书的 `10=2+8` 写法）**

  表题：「*Dimensions in which various conditions are allowed for `SO(d − 1, 1)` spinors.
  A dash indicates that the condition cannot be imposed. For the Weyl representation, it is indicated
  whether these are conjugate to themselves or to each other (complex). The final column lists the
  smallest representation in each dimension, counting the number of real components. Except for the
  final column the properties depend only on `d` mod 8.*」

  | `d` | Majorana | Weyl | Majorana–Weyl | min. rep. |
  |---|---|---|---|---|
  | 2 | yes | self | yes | 1 |
  | 3 | yes | - | - | 2 |
  | 4 | yes | complex | - | 4 |
  | 5 | - | - | - | 8 |
  | 6 | - | self | - | 8 |
  | 7 | - | - | - | 16 |
  | 8 | yes | complex | - | 16 |
  | 9 | yes | - | - | 16 |
  | 10=2+8 | yes | self | yes | 16 |
  | 11=3+8 | yes | - | - | 32 |
  | 12=4+8 | yes | complex | - | 64 |

  min. rep. 列的规则（p.433 逐字）：「This is twice the dimension of the Dirac representation,
  reduced by a factor of 2 for a Weyl condition and 2 for a Majorana condition.」

  **本命题不断言**：
  (a) `B`、`C` 的上述性质在基变换下不变——原书把这一步整体外包给习题 B.1
      （p.435 逐字「Additional properties of the matrices `B` and `C` are developed in exercise B.1」）。
  (b) 多于一个类时方向的情形——p.438 逐字只说「the analog of table B.1 or B.2 depends on the
      *difference* of the number of spacelike and timelike dimensions」，无证明。
  (c) 欧氏号差 `SO(N)` 的对应分类：那是 Table B.2，见 math.so-n-spinor-reality-mod-8。
