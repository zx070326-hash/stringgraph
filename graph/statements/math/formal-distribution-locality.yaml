id: math.formal-distribution-locality
kind: definition
status: rigorous
title: 形式分布的局域性：(z − w)^N [A(z), B(w)] = 0
statement: |
  设 R 是含幺结合代数（弦论/CFT 里典型取 R = End(V)，V 为复向量空间）。R 上的**形式分布**指
    A(z) = Σ_{n ∈ Z} A_{(n)} z^{-n-1} ∈ R[[z^{±1}]],   A_{(n)} ∈ R,
  两变量形式分布即 R[[z^{±1}, w^{±1}]] 的元素（对 (m,n) ∈ Z^2 逐系数给定）。
  两个单变量形式分布的乘积 A(z)B(w) 在 R[[z^{±1}, w^{±1}]] 中逐系数良定义（(m,n) 系数为 A_{(m)}B_{(n)}），
  对易子相应地定义为
    [A(z), B(w)] := A(z)B(w) - B(w)A(z),  其 (m,n) 系数为 [A_{(m)}, B_{(n)}]。
  又：用 Laurent **多项式**（如 (z - w)^N，按二项式展开成有限和）乘 R[[z^{±1}, w^{±1}]] 的元素总是良定义的。

  **定义（局域性）**：A, B ∈ R[[z^{±1}]] 称为**互为局域**（mutually local），若存在 N ∈ N 使
    (z - w)^N [A(z), B(w)] = 0   在 R[[z^{±1}, w^{±1}]] 中成立。
  满足此式的最小 N 称为该对分布的**局域阶**。约定 N = 0 时左端即 [A(z), B(w)] 本身（即两者对易）。

  记号配套：形式 delta 函数
    δ(z - w) = Σ_{n ∈ Z} z^{n-1} w^{-n} = Σ_{n ∈ Z} z^{-n-1} w^{n} ∈ R[[z^{±1}, w^{±1}]]
  满足 (z - w) δ(z - w) = 0，故非平凡的局域分布确实存在（N = 1 即可）。

  **两条必须留意的形式代数事实**（否则本定义会被误读）：
  (1) R[[z^{±1}, w^{±1}]] **不是环**：一般两个两变量形式分布之积无定义；本定义只用到「Laurent 多项式 × 形式分布」
      与「单变量分布之积」这两种总有定义的运算。
  (2) (z - w)^N f = 0 **不蕴含** f = 0：R[[z^{±1}, w^{±1}]] 中 (z - w)^N 是零因子（δ(z-w) 即其零化元）。
      （相反地，在 F((z_1))((z_2))（F 为域）中 (z_1 - z_2)^N 不是零因子。）
      因此「局域」是一个真正的限制条件，而不是「对易」的换写。
