sources:
  - ref: schottenloher-2008
    loc: "Ch. 10 (Vertex Algebras), Definition 10.7 (Locality), p. 177；形式分布与 Res 见 Definition 10.1, p. 173；形式 delta 函数见 Definition 10.3, p. 174"
    note: |
      **L1（researcher 逐页读图核实，2026-09-11，literature/extractions/math-sources.md §11.1、§11.3）**：
      Definition 10.7 逐字为「Two formal distributions A, B ∈ R[[z^±]] are local with respect to each other
      if there exists N ∈ N such that (z−w)^N [A(z), B(w)] = 0 in R[[z^±, w^±]]」。
      Definition 10.3 的 delta 函数逐字为 δ(z−w) = Σ_{n∈Z} z^{n−1}w^{−n} = Σ_{n∈Z} z^{−n−1}w^{n}。
      本章可放心写编号：schottenloher-2008 的 note 已于 2026-09-11 解除第 10 章的「编号未核实」限制。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, Definition 7.6 (Local fields (formal variable version)), 式 (7.10), p. 72；零因子与 F((z)) 是域见 §7.6–§7.7 与 Lemma 7.7, p. 73"
    note: |
      **L1 逐字**：「There exists N ∈ N depending only on A and B such that the equation
      (z_1 − z_2)^N [A(z_1), B(z_2)] = 0 holds on the level of End(V)[[z_1^{±1}, z_2^{±1}]]」。
      与 Schottenloher Definition 10.7 是同一条件（变量名不同）。
      **版本陷阱**：Gui 的编号只对作者主页 2026-07-15 版核实过，arXiv:2305.03822 各版未核实，
      故 loc 一律写死版本日期（sources.bib 的 gui-2023-lectures note 与 math-sources.md §8.0）。
      陈述中的两条形式代数事实 (1)(2) 取自 Gui §7.6–§7.7 的正文警告。
