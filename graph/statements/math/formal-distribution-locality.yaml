notes: |
  **为什么 status 是 rigorous**：这是一条纯代数定义，被定义对象（R[[z^{±1}, w^{±1}]] 中的一个等式）
  在两本数学书中逐字给出，无任何未定义的解析操作。它**不**断言任何收敛性：z, w 是形式变量，
  不是复平面上的点。整个 Schottenloher 第 10 章停在形式级数层面（p.177 "Analytic Aspects" 段）。

  **本节点刻意不声明任何约定节点**：出现的全部记号（形式分布的模指标 z^{-n-1}、delta 函数、
  局域阶 N）都在陈述文本内写死，与来源逐字一致，不涉及度规号差、α' 归一化或 Virasoro 中心项归一化。
  与 math.laplace-fundamental-solution-2d 的做法相同：把纯数学事实与物理侧的归一化分成两个节点，
  换算陷阱落在两者之间的边上。

  **与物理 OPE 的关系**：本节点是 worldsheet.operator-product-expansion（物理 OPE + 有限收敛半径断言，
  physical-argument）的**形式侧**对应物之一，但**不是**它的替代品：物理 OPE 断言的是复变量的收敛级数，
  本节点只讲形式变量。二者之间缺的那一步是 worldsheet.string-cft-is-a-vertex-algebra（无推导，open）。

  **形式化前景**：Mathlib 的 Mathlib/Algebra/Vertex/VertexOperator.lean 里 `Locality` 写在模块 docstring
  的 **TODO** 段，尚未实现（读取日期 2026-09-11，Mathlib 变动快，用前须复查）。
  故本节点现在只能到 rigorous，不能标 formalized。见 sources.bib 的 virasoro-lean-2025 note (6)。
