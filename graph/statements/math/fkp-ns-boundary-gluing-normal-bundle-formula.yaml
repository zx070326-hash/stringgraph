notes: |
  【查重】`uv run stringgraph search "normal bundle"` / `"gluing"` 均无同内容命中（2026-09-20）。

  【设立本节点的理由】本节点存在的唯一目的是让姐妹卡（定理 M 系列，见
  math.supermoduli-compactified-punctured-genus-geq3-not-projected 等）能够诚实地表达一条推理：
  "FKP 逐字证明的是无穿孔靶的情形；本证明把它用于带穿孔的靶，依据是 Lemma 9.1 的证明是关于节点
  形式邻域的局部陈述，这是几何上合理但超出 FKP 逐字论断范围的推断"。按 graph/CLAUDE.md 的
  `inferred: true` 判据（"这条边如果去掉 inferred，它指向的节点是否就完整承载了我需要的那句话？
  若否，就是在用 flag 藏命题，立卡"）——本节点恰好精确承载"FKP 逐字证明了什么"，从而使下游的
  `inferred: true` 边诚实、有据可查，而不是凭空指向一个并不存在的更宽泛命题。
