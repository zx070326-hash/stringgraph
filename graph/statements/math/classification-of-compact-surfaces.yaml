id: math.classification-of-compact-surfaces
kind: proposition
title: 紧曲面分类定理（含带边、含不可定向）：可定向性 + contour 数 + Euler 数是完全不变量
statement: |
  设 M、N 是紧曲面或紧带边曲面（在来源的意义下：二维拓扑流形，允许有边界，
  允许不可定向）。则 M 与 N 同胚，**当且仅当**下列三项全部相同：
    (1) 可定向性（character of orientability），
    (2) contour 数（来源逐字用 "number of contours"，即边界分支的个数），
    (3) Euler–Poincaré 示性数 χ。

  换言之，(可定向性, contour 数, χ) 是紧带边曲面在同胚意义下的**完全不变量**。

  **本命题不断言什么**：
  - **不**给出 χ 的计算公式（那在 math.positive-euler-surfaces-are-sphere-disk-rp2
    的推导里，取自同书 p.89–90 的**无编号**行间式）；
  - **不**断言「χ > 0 只剩三种曲面」——来源里没有这条陈述，它是
    math.positive-euler-surfaces-are-sphere-disk-rp2 的内容；
  - **不**涉及任何黎曼/复结构、共形结构或度规，纯拓扑；
  - **不**处理非紧曲面。
sources:
  - ref: gallier-xu-2013
    loc: "Ch. 6, Theorem 6.2, p. 97（arXiv 版 5.3.2；三角化版：Theorem 6.1, p. 96，arXiv 版 5.3.1；其组合核心 Lemma 6.1, pp. 92–95，arXiv 版 5.2.5；Proposition 6.1, p. 86，arXiv 版 5.2.2）"
    note: |
      L1 逐页核实，抽取记录 literature/extractions/math-sources.md §39.2.1（原文逐字：
      "Two compact surfaces or compact surfaces with boundary are homeomorphic iff they agree
      in character of orientability, number of contours, and Euler–Poincaré characteristic."）。
      三条随引用必写的限制：
      (a) 原文用 "number of contours"，**不是** "number of boundary components"，本卡照抄该措辞；
      (b) Theorem 6.2 依赖「每个曲面 / 带边曲面可三角化」（Radó），原书 p.96 自陈该证明
          "far from trivial" 且放在 **Appendix E**（Thomassen 的证明），正文不证——见推导 gaps；
      (c) **版本陷阱**：出版版编号 6.2 与 arXiv 单作者版（gallier-2008-surfaces）的 5.3.2
          **不可互换**。
      **2026-09-11 补（math-sources.md §49，L1 页图；PDF 页 = 书页 + 10）**：
      (d) **Theorem 6.2 在书内无独立证明**——p. 97 逐字「For the record, we state the following theorem
          putting all the pieces of the puzzle together」；其内容 = Theorem 6.1（p. 96，有证明）+
          Appendix E 的可三角化性。
      (e) Theorem 6.1 的证明（p. 96 逐字，完整）自己点名的依赖：**Lemma 6.1**（pp. 92–95，每个胞腔复形
          等价于某个规范胞腔复形，六个 Step，步骤照 Ahlfors–Sario [1]）+ **Theorem 5.2**（同伦不变的
          Euler 数）+「equivalence preserves orientability, the number of contours, and χ」（pp. 88/90 无编号段落）。
      (f) **Proposition 6.2（p. 88）是隐含桥**：「orientability of the surface K_g as given by Definition 4.6
          is equivalent to orientability of K as given by Definition 6.4」，无独立证明（回指 Prop 5.8）；
          Theorem 6.1 的 "character of orientability" 从胞腔复形语言过到曲面语言靠它。arXiv 版编号 L0。
  - ref: massey-1967
    loc: "Ch. I §10「The classification of compact, connected 2-manifolds with boundary」, pp. 37–42；闭曲面版是 Theorem 5.1（§7 标题「Proof of Theorem 5.1」）"
    note: |
      **仅目录扫描页 L1，正文未获取**（math-sources.md §39.3）。
      ⚠ **§10 里那条带边分类定理的编号完全无证据（L0）——本图严禁写「Massey Theorem 10.1」**。
      「Theorem 5.1 = 闭紧曲面分类定理」这一条有 L1 旁证（§7 的标题）。
      ⚠ 本书后重印为 GTM 56 (2nd ed. 1987) 并被吸收进 GTM 127 (1991) Ch. I，
      **跨版本定理编号是否一致未核实**。故本条只作第二来源，不单独承载论证。
tags: [math, topology, surface, classification, euler-characteristic, orientability]
notes: |
  由 curator 于 2026-09-11 从 literature/extractions/math-sources.md §39.9(1) 建立，
  用途是关闭 worldsheet.positive-euler-number-no-moduli--via-surface-enumeration 的
  「输入 (1)（曲面分类定理）在本图中无节点、无数学来源」这条 gap。

  **连通性**：来源的 Theorem 6.2 逐字不写 "connected"，但该书（与 Massey §10 的标题
  「compact, **connected** 2-manifolds with boundary」）在定义 "surface" 时是否已含连通性，
  **本图未核实**（抽取记录只取到 Ch.6，未取 Ch.1 的定义）。下游若需要连通性，
  按 Massey 的标题措辞理解为「连通」是安全的；本卡把这一点记在案，见推导 gaps。

  **两条已核实的否定结论（防止日后有人改挂错来源）**：
  - **Munkres, Topology 2nd ed., Theorem 77.5 不对口**：只覆盖闭曲面（多边形边两两粘合），
    **完全不出现 Euler 数**（math-sources.md §39.4）。
  - **Hatcher §1.2 里根本没有分类定理**，有编号的没有、无编号的也没有；
    他只证了「标准曲面两两不同伦等价」这半边（math-sources.md §39.5）。
