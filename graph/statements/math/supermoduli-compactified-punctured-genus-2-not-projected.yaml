id: math.supermoduli-compactified-punctured-genus-2-not-projected
kind: proposition
title: "紧化带穿孔超模叠 g=2、n+2r≥2 非投影（原创，椭圆尾粘接的带穿孔推广，定理 M 的 a=0 分支）：∀n≥0,∀r≥0 with n+2r≥2, ω₂(S̄_{2;n,2r})≠0"
statement: |
  【对象】记号同 `math.supermoduli-compactified-punctured-genus-geq3-not-projected`：
  \overline{\mathfrak S}_{g;n,2r} 为亏格 g、n 个 NS 穿孔、2r 个 Ramond 穿孔的稳定超曲线紧化超模叠，
  ω₂ 为 Green 第一障碍类。本节点固定 g=2。

  【命题】对一切整数 n≥0、r≥0，满足 **n+2r≥2**：
    ω₂(\overline{\mathfrak S}_{2;n,2r}) ≠ 0，
  从而 \overline{\mathfrak S}_{2;n,2r} **非投影**。

  **宇称加细（仅当 r=0 时）**：r=0 时 n+2r≥2 等价于 n≥2；此时**只能断言偶宇称分量**：
    ω₂(\overline{\mathfrak S}{}^{+}_{2;n,0}) ≠ 0（n≥2）。
  本节点**不断言**奇宇称分量 \overline{\mathfrak S}{}^{-}_{2;n,0} 的任何信息（见下方排除清单）。

  **当 r≥1 时，本节点只断言整个叠 \overline{\mathfrak S}_{2;n,2r} 非投影，不指认具体连通分量**
  （同 g≥3 姐妹卡的 `[GAP-COMP]` 限制）。

  【证明思路一句话】取亏格 h=g=2 的"运动分量" C（配无效偶 theta 特征 L）与亏格 **a=0**（有理）的
  固定尾（带 n+1 个 NS 标记点、2r 个 Ramond 标记点），稳定性要求 n+2r≥2；沿 NS 粘接映射构造测试族
  X_η → \overline{\mathfrak S}_{2;n,2r}。宇称加细来自：a=0 的有理固定尾唯一可能的自旋结构是
  O(-1)，其宇称必为**偶**（proof.md §4.2 自旋结构统计），故本分支触及的测试曲线只落在偶宇称分量。

  【本节点明确不断言，与排除清单逐条对应】
  - **(g,n,r)=(2,1,0) 不在本卡覆盖范围内**：n+2r=1<2 不满足前提，(P2) 要求 a=0 时 n+2r≥2；这与
    `math.supermoduli-space-not-projected`（Donagi–Witten，未紧化，覆盖 g≥2,n≤g-1=1 偶宇称）
    的量词范围互不包含，不构成冲突。
  - **g=2 的奇宇称带穿孔分量** \overline{\mathfrak S}{}^{-}_{2;n,0}（n≥1）：不断言，且这是方法的
    结构性必然而非缺陷——CN 已证 \overline{\mathfrak M}{}^{-}_2（n=0 情形）**分裂**
    （`math.supermoduli-compactified-genus-2-odd-split`），若本方法能触及 g=2 奇分量将与之矛盾；
    proof.md §6.2 的反向自洽性检验验证了本方法在 (P1)/(P2) 层面结构上不可能触及该分量。
  - **未紧化**的 \mathfrak S_{2;n,2r} 的任何断言：不涉及。
  - 任何"分裂/可投影"的正面方向：不涉及。
  - Ramond 节点处的粘接（FKP-A §9.3 仅猜想）：本证明刻意避开，只在 NS 节点处粘接。
uses: []
uses_conventions: []
