      2026-09-20 问题 5"量词范围恰好，无过度推广"亲自算术复核 a=0 给 g≥2 且 n+2r≥2；PLAUSIBLE
      佐证：g=2 只够到偶分量"不是差一点没够到，而是本该如此"——CN 证 \overline{\mathfrak M}^-_2
      分裂的路子依赖亏格 2 特有的无穿孔性质，加穿孔后这些性质全不存活）；
      captain_confirmed: false（留船长确认，不代填）。
tags: [supermoduli, super-riemann-surface, non-projected, compactified, punctured, genus-2, ramond-puncture, math-input, original-research]
notes: |
  【查重】同 g≥3 姐妹卡（2026-09-20），另加对 "genus 2" 关键词的检索：最接近的既有卡
  `math.supermoduli-compactified-genus-2-even-not-projected`（FKP，n=r=0）与
  `math.supermoduli-compactified-genus-2-odd-split`（CN，n=r=0，分裂）均不覆盖 n+2r>0 情形。

  【⭐ 与既有卡的关系，明确声明】同 g≥3 姐妹卡：本节点完全不依赖 Wang / Donagi–Ott（未紧化范畴，
  逻辑独立）；不修订 `math.supermoduli-compactified-genus-2-even-not-projected`（FKP，本节点在
  n=r=0 时不适用——(P2) 要求 a=0 时 n+2r≥2，n=r=0 不满足，本节点从设计上就不重现该卡，是补充而非
  重复）；不修订 `math.supermoduli-compactified-genus-2-odd-split`（CN 证明 \overline{\mathfrak
  M}^-_2 分裂）——本节点与其**互补而非矛盾**：本节点只能触及偶宇称分量，proof.md §6.2 显式验证了
  这一互补关系不是巧合而是结构性必然。

  【FKP 法丛公式的推广——诚实标注，同 g≥3 姐妹卡】本证明同样在 proof.md §4 引理 4.4 使用
  `math.fkp-ns-boundary-gluing-normal-bundle-formula`（靶逐字无穿孔）于带穿孔靶，依据同一条
  节点局部性论证；见 derivation 文件的 inferred:true 边与说明。

  【上段已于 2026-09-24 过时，lead 补注】同 g≥3 姐妹卡：该推断已被
  `math.fkp-punctured-normal-line-formula-separating` 正面证明，对应 derivation 的边已改指该卡
  且 `inferred` 改为 `false`。上段保留为历史。

  【r≥1 时不断言连通分量的原因】同 g≥3 姐妹卡的 `[GAP-COMP]`。

  【`[GAP-COMP]` 已于 2026-09-24 对 r≥1 关闭，lead 补注】同 g≥3 姐妹卡：关闭者是本项目论文
  paper.md §10.3 的 **Cor 10.2**（r≥1 时不可约，经 FKP Remark 2.17 + Jarvis 2000 Thm 3.3.1）；
  图内另有前提更少的独立路线 `math.supermoduli-ramond-components-compactified-connected`
  （完全在 FKP 紧化内部，只得连通）。故"不指认分量"在 r≥1 时是空话而非开放问题。
  该结论**不是本项目新数学**，原始出处 Jarvis (2000)。本卡 `statement` 第 18 行的括注按原则 1
  不动，留待下次实质换代；不加 `depends_on` 边（"非投影"与"连通"是独立命题）；
  不移动本卡 effective（此前此后均为 rigorous）。

  【为何单独立卡而不与 g≥3 分支合并】(1) 量词范围本质不同：g≥3 分支对一切 n,r 两种宇称皆可断言
  （r=0 时），g=2 分支的 r=0 情形只能断言偶宇称，且额外要求 n≥2（而非任意 n≥0）；(2) (g,n,r)=
  (2,1,0) 与 g=2 奇宇称分量的排除清单只对本卡有意义，混在一张卡里会使"本节点不断言"段落被迫用
  条件从句稀释量词的精确性，不利于后续引用者快速核验适用范围；这与既有卡
  `math.supermoduli-compactified-genus-2-even-not-projected` 与
  `math.supermoduli-compactified-genus-geq3-not-projected` 分列为两张卡（而非合并进
  `math.supermoduli-space-not-projected`）的先例一致。
