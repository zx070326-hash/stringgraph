tags: [math, arithmetic-group, moduli-space, narain, finite-volume]
notes: |
  from: vafa-2005#E9、#U3；bib note of borel-harish-chandra-1962。

  【★ loc 未核实（本卡最大的弱点）】Borel–Harish-Chandra 1962 的**正文本项目未获取**。
  本卡的 sources.loc 照实写"未核实"，不编定理号（graph/CLAUDE.md 的纪律：不确定编号时照实写，
  不要编 "Theorem 1"）。**抽到该文之前，任何以本卡为依据的边都应视为待复核。**

  【陪集写法】本卡用 Ooguri–Vafa 2006 §3.1 Example iv 的双侧商写法（Γ\G/K）。
  **Vafa 2005 的写法把紧子群与算术子群写在同一个分母里、中间用乘号，是记号松散，
  不是不同的空间**（抽取记录 vafa-2005#E9 备注 2）。

  【只覆盖 T^d 那一支，不给一般猜想升格】Vafa 2005 的三类例子严格性递减：T^d 有
  Borel–Harish-Chandra 撑着，K3 同型，Calabi–Yau 情形原文只到 "are believed to be finite in
  volume"。故本卡单独存在，**不是** swampland.moduli-volume-finite 的推导（那条猜想是对**任意**
  一致量子引力理论的断言，本卡只是它的一个实例）。

  【⚠ 另一处待复核的陪集】Ooguri–Vafa 2006 §3.1 Example iv 的经典 K3 模空间在 v1 页图上印作
  SO(3,19)/(SO(2) x SO(19))，按极大紧子群应为 SO(3) x SO(19)，疑为排印错误（抽取记录
  ooguri-vafa-2006#U3）。本卡不使用该式。
