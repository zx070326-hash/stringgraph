id: math.euler-beta-integral
kind: proposition
title: Euler Beta 积分 B(a,b) = ∫₀¹ t^{a−1}(1−t)^{b−1} dt = Γ(a)Γ(b)/Γ(a+b) 及其极点结构
statement: |
  对复参数 a, b 满足 Re a > 0、Re b > 0，积分
    B(a, b) ≡ ∫₀¹ dt  t^{a−1} (1 − t)^{b−1}
  绝对收敛，且
    B(a, b) = Γ(a) Γ(b) / Γ(a + b)。
  右端把 B 延拓为 (a,b) 的亚纯函数，其奇点全部来自 Γ(a) 与 Γ(b) 的极点：
  B(a,b) 在 a ∈ {0, −1, −2, …} 与 b ∈ {0, −1, −2, …} 处有**单极点**，
  在 a = −n（n ∈ Z_{≥0}）附近
    B(a, b) = [(−1)^n / n!] · Γ(b)/Γ(b − n) · 1/(a + n) + O(1)，
  别处全纯；B(a,b) = B(b,a)。

  **这条在本图中的用途**：开弦四 tachyon 振幅（Veneziano）的 t 积分正是 B 的 Euler 积分表示，
  其发散端点 t → 0, 1 对应 B 的极点，物理上被解读为中间态上壳
  （spectrum.veneziano-amplitude-weak、spectrum.four-tachyon-factorization-disk-normalization）。
sources:
