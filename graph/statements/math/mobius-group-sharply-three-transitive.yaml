id: math.mobius-group-sharply-three-transitive
kind: proposition
title: PSL(2,C) 在黎曼球三点组上单可迁；PSL(2,R) 保持边界循环序，两种循环序是两条轨道
statement: |
  **(1)（复情形）** PSL(2,C) = SL(2,C)/{±1} 通过 z ↦ (αz + β)/(γz + δ) 作用在黎曼球
  P¹ = C ∪ {∞} 上。该作用在**互不相同的有序三元组**上**单可迁（sharply 3-transitive）**：
  对任意两组互不相同的三点 (z₁,z₂,z₃) 与 (w₁,w₂,w₃)，存在**唯一**的 g ∈ PSL(2,C) 使 g(z_i) = w_i。
  特别地，任意三个不同点可以（且只能以唯一方式）被送到 (0, 1, ∞)；
  不变量是交叉比 x = (z₁ − z₂)(z₃ − z₄) / ((z₁ − z₃)(z₂ − z₄))。

  **(2)（实情形）** PSL(2,R)（同式但 α,β,γ,δ 为实、αδ − βγ = 1）把上半平面 H 映到 H、
  把 ∂H = R ∪ {∞} 映到自身，且在 ∂H ≅ S¹ 上**保持定向**，因而**保持三点的循环序**。
  它在「∂H 上按给定循环序排列的互不相同三元组」的集合上**单可迁**；
  于是 ∂H 上互不相同有序三元组的集合在 PSL(2,R) 下恰好分成**两条轨道**
  （两个循环序），(y₁,y₂,y₃) 与 (y₁,y₃,y₂) 属不同轨道。

  **本命题不断言什么**：不涉及任何 Weyl/共形因子、测度或 Jacobian
  （那在 math.mobius-three-point-fixing-jacobian）；不断言 PSL(2,C)、PSL(2,R) 是相应曲面的
  **全部**共形自同构群（那需要 Liouville 型定理，本图无节点）。
sources:
  - ref: polchinski-1998-v1
    loc: "§6.6（用 SL(2,C) 把闭弦四点的 z₁,z₂,z₃ 固定为 0,1,∞，(6.6.4) 附近，p.192–193）与 §6.4 开头（用 PSL(2,R) 固定 D₂ 边界三点，两种循环序）"
    note: |
      literature/extractions/polchinski-1998-v1.md#E104、#E90，等级 L1（内容出自 schrans-2020
      §6.60–§6.63、§6.27，笔记 p.299、p.326–328，逐页读到）。
      ⚠ 来源只**使用**这条群论事实（「固定 z₁ = 0, z₂ = 1, z₃ = ∞」），**没有陈述或证明**它；
      本卡片是 curator 为承载该步骤而拆出的数学节点。
      ⚠ **2026-09-11 追记**：本卡现已另有一条数学侧来源（下一条 milicic-riemann-surfaces），
      但那条覆盖的是「Aut(P¹) ≅ PSL(2,C)」而**不是本卡陈述的单可迁性**；
      单可迁性与循环序两轨道**至今没有带编号的数学文献来源**，见 notes 第 2 条。
  - ref: milicic-riemann-surfaces
    loc: "Theorem 1.5.2, p.6（第 1 章 §1.5，Möbius 变换与 Aut(P¹) 一节）"
    note: |
      **数学侧来源，L1 逐字**（literature/extractions/math-sources.md §39.7.1；讲义全 15 页已读完）。
      原文逐字：「The homomorphism γ ⟼ φ_γ of PSL(2,C) into the group of all holomorphic
      automorphisms Aut(P¹) of the Riemann sphere is an isomorphism.」
      ⚠ **这条定理本身不是本卡的陈述**：它断言的是「PSL(2,C) **穷尽** Aut(P¹)」，
      本卡 (1) 断言的是「PSL(2,C) 在互不相同的有序三点组上**单可迁**」。两者互相独立。
      登记它的两个理由：
      (a) §1.5 正是该讲义建立「PSL(2,C) 通过 z ↦ (az+b)/(cz+d) 作用在 P¹ 上」的那一节，
          本卡 (1) 里的群、作用与记号与之逐字一致，故本卡不再是「只有物理书来源」；
      (b) 该定理已由本图独立承载为 **math.automorphisms-of-riemann-sphere-are-mobius**，
          本卡「本命题不断言什么」的第二条（不断言 PSL(2,C) 是**全部**共形自同构）
          从此有专门节点可指，不再是悬空的免责声明。
      ⚠ **单可迁性本身在该讲义中未核到编号**：本项目对这份讲义只逐字转录了 Theorem 1.5.2
      与 Theorem 1.7.3 两条（math-sources.md §39.7.1 对其余编号只记了标题）。
      ⚠ 实情形（Aut(D)）的对应条目是 **Theorem 1.7.3, p.10 + §1.9, p.11 的无编号句**
      （SL(2,R) ≅ SU(1,1)）——「Aut(D) = PSL(2,R)」在该讲义里**没有单一编号**，
      引用时要么写两处、要么只引 SU(1,1) 版。该条已登记在
      worldsheet.disk-conformal-killing-group 与其推导 --via-real-mobius-subgroup 的 sources 里。
      ⚠ 该文件**未印年份**，bib key 不带年份（`milicic-riemann-surfaces`），
      偏离 literature/CLAUDE.md 的 key 规范，待 lead 裁决。
