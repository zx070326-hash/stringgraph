id: math.mobius-group-sharply-three-transitive
kind: proposition
title: PSL(2,C) 在黎曼球三点组上单可迁；PSL(2,R) 保持边界循环序，两种循环序是两条轨道
statement: |
  **(1)（复情形）** PSL(2,C) = SL(2,C)/{±1} 通过 z ↦ (αz + β)/(γz + δ) 作用在黎曼球
  P¹ = C ∪ {∞} 上。该作用在**互不相同的有序三元组**上**单可迁（sharply 3-transitive）**：
  对任意两组互不相同的三点 (z₁,z₂,z₃) 与 (w₁,w₂,w₃)，存在**唯一**的 g ∈ PSL(2,C) 使 g(z_i) = w_i。
  特别地，任意三个不同点可以（且只能以唯一方式）被送到 (0, 1, ∞)；
  不变量是交叉比 x = (z₁ − z₂)(z₃ − z₄) / ((z₁ − z₃)(z₂ − z₄))。

  **(2)（实情形）** PSL(2,R)（同式但 α,β,γ,δ 为实、αδ − βγ = 1）把上半平面 H 映到 H、
  把 ∂H = R ∪ {∞} 映到自身，且在 ∂H ≅ S¹ 上**保持定向**，因而**保持三点的循环序**。
  它在「∂H 上按给定循环序排列的互不相同三元组」的集合上**单可迁**；
  于是 ∂H 上互不相同有序三元组的集合在 PSL(2,R) 下恰好分成**两条轨道**
  （两个循环序），(y₁,y₂,y₃) 与 (y₁,y₃,y₂) 属不同轨道。

  **本命题不断言什么**：不涉及任何 Weyl/共形因子、测度或 Jacobian
  （那在 math.mobius-three-point-fixing-jacobian）；不断言 PSL(2,C)、PSL(2,R) 是相应曲面的
  **全部**共形自同构群（那需要 Liouville 型定理，本图无节点）。
