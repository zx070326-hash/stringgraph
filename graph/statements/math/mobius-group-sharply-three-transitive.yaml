      ⚠ 来源只**使用**这条群论事实（「固定 z₁ = 0, z₂ = 1, z₃ = ∞」），**没有陈述或证明**它；
      本卡片是 curator 为承载该步骤而拆出的数学节点，**本图目前没有数学文献来源**，见 notes。
