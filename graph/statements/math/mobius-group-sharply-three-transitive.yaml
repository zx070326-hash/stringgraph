notes: |
  由 curator 于 2026-09-11 拆出，用途有二：
  (a) 承载第 6 章一切「用共形 Killing 群固定三个顶点算子坐标」的步骤
      （spectrum.closed-string-four-tachyon-integral、cft.three-point-function-mobius-fixed 等）；
  (b) 裁定抽取记录 E90 的一处**文献歧义**——[S] 的逐字句子说 D₂ 边界三点的两种排法
      「are linked by a PSL(2,R) transformation」，而 (2) 说它们属**不同轨道**。
      本图按 (2) 写，理由见 worldsheet.disk-conformal-killing-group 的 notes。

  **⚠ 为什么不是 rigorous**：(1) 与 (2) 都是经典结果（任何黎曼曲面/双曲几何教材都有），
  但本图**没有登记任何数学来源**，sources 里唯一的条目是**物理书里使用该事实的位置**。
  按 docs/STATUS_LEVELS.md，这既不满足「数学文献来源」也没有 reviewer 复核记录，
  故取 physical-argument。**升级路径**：researcher 登记一本复分析/黎曼曲面教材
  （Ahlfors 复分析中的线性变换与交叉比一章，或 Beardon 的离散群几何第 4 章）并核对定理号；
  或 reviewer 按「初等可复核」例外复核推导里的显式构造。
