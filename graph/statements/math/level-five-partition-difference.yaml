id: math.level-five-partition-difference
kind: proposition
title: 五能级"不含一个方向"光锥占据数计数恒等式 p_{D−1}(5) + 1 = p_{D−2}(5) + p_{D−1}(4) + p_{D−1}(3)——Pascal 恒等式链的第四条，但左端多一个 +1（Euler 五边形数 κ₅=1），这是该链首次出现的结构断裂
statement: |
  这是一条**纯组合恒等式**，不涉及弦论的任何算子、度规或质壳条件；D 只是一个自然数参数，
  记号沿用 math.level-two-partition-difference、math.level-three-partition-difference、
  math.level-four-partition-difference（p_m(N) := 把振子能级 N 分配给 m 个可数无穷模态槽
  的占据数个数）。

  【断言：占据数的显式计数与"差 + 1"】设 D ≥ 2。level-5 占据函数唯一分成七形（单模态占据 5、
  占据 4+1、占据 3+2、占据 3+1+1、占据 2+2+1、占据 2+1+1+1、五个不同模态各占据 1），
  七种情形穷尽且不相交（由模数计数不变量 modeCount 两两分开，是 Finsupp.oscWeight 在能级 5
  的完整分类 Finsupp.oscWeight_eq_five_cases），给出

    p_m(5) = m + 2m² + 2m·C(m+1,2) + m·C(m+2,3) + C(m+4,5) 。

  则**从 N=5 起，N≤4 的干净差恒等式 p_{m+1}(N) = p_m(N) + p_{m+1}(N−1) + p_{m+1}(N−2)
  不再精确成立**；正确的等式在左端多一个 +1：

    **p_{m+1}(5) + 1 = p_m(5) + p_{m+1}(4) + p_{m+1}(3)**     （m-型主恒等式，对一切 m 成立）。

  取 m := D−2 得**弦论侧消费的 (I5) 形**：

    **p_{D−1}(5) + 1 = p_{D−2}(5) + p_{D−1}(4) + p_{D−1}(3)** ，

  取 m := D−1 得**核维数界 (K5) 消费的 κ₅=1 形**：

    **p_D(5) + 1 = p_{D−1}(5) + p_D(4) + p_D(3)** 。

  两者是同一条 m-型恒等式相邻两步的代入（"same lemma, one step up"），其中
  p_{m+1}(4) = (m+1) + (m+1)² + C(m+1,2) + (m+1)·C(m+1,2) + C(m+3,4)
  （math.level-four-partition-difference）、p_{m+1}(3) = (m+1) + (m+1)² + C(m+3,3)
  （math.level-three-partition-difference）取自同一恒等式链的上两级。

  在 D = 26 处 (I5) 读作 **209405 + 1 = 176256 + 29575 + 3575**（即 209406 = 209406）。

  【这个 +1 是什么】+1 是 Euler 五边形数展开 ∏(1−qⁿ) = 1 − q − q² + q⁵ + q⁷ − ⋯ 里
  −q⁵ 的系数，是本链在 N=5 处首次出现的结构断裂：κ_N := p_D(N−1) + p_D(N−2) − p_D(N)
  + p_{D−1}(N) 在 N ≤ 4 恒为 0，在 N = 5 首次等于 1。弦论侧的意义（**本卡不断言，仅指路**）
  见 worldsheet.level-five-null-family-kernel-bound：两族零态 L_{−1}Q_{N−1} 与 𝒟₂Q_{N−2}
  从 N=5 起重叠恰一维，这个 +1 就是重叠，两个 +1 在
  worldsheet.ddf-spans-physical-states-level-five 里相消。

  【本节点明确不断言】
  (a) **不断言这与任何弦论对象的联系**：p_m(5) 在本节点里只是显式计数公式的值；"它是
      dim(H_phys ∩ V_5) 的上界 / dim(D(Ε) ∩ V_5) / 核维数界的输入"是弦论侧节点各自独立
      证明的事，本节点不重复、不引用它们（与 math.level-two/-three/-four-partition-difference
      明确不断言 (a) 同型）。
  (b) **不断言一般 N 的类比**：本节点只做 N = 5 这一个特例的初等 Pascal 展开；N ≥ 6 的
      对应恒等式（以及 κ_N 从 N=5 起的一般行为）需要 Euler 五边形数生成函数论证，本节点
      不涉及、不预示。
  (c) **不断言 D ≤ 1 的情形**：与姊妹卡同型，C(D,2)、C(D+3,5) 等的自然数减法需要 D ≥ 2
      才良定义（(I5) 形），κ₅=1 形只需 D ≥ 1。
  (d) **不是一个新的组合学结果**：这是三次二项式系数 Pascal 递推
      C(m+1,1)（即 Nat.choose_one_right）、C(m+2,2)=C(m+1,1)+C(m+1,2)、
      C(m+4,4)=C(m+3,3)+C(m+3,4) 的一个代入实例加自然数环算术，价值在于把它显式写成
      弦论计数需要的形状，并**首次记录左端 +1**这一结构断裂。
  (e) **不断言各条单侧计数公式各自被独立证明为等式**：与姊妹卡同型，Lean 侧真正证明的
      是"差 + 1"恒等式本身，单侧显式公式 p_m(5)=… 是记法铺垫（Lean 侧 card_conjFree_five_le
      给上界、card_ddfLevel_five_eq 给精确值），见 sources note。
