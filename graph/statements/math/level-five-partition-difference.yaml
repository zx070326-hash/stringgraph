formal:
  lean_decl: StringFormal.NoGhost.levelFive_count_identity
  lean_file: StringFormal/NoGhost/LevelFiveCount.lean
sources:
  - ref: stringformal-2026
    loc: |
      formal/StringFormal/NoGhost/LevelFiveCount.lean :: StringFormal.NoGhost.levelFive_count_identity
      （本卡 formal.lean_decl = (I5) D−2 形，第 121 行起，hD : 2 ≤ D）；同文件姊妹声明
      StringFormal.NoGhost.levelFive_count_identity_gen（m-型主恒等式，第 95 行起，无假设）与
      StringFormal.NoGhost.levelFive_count_identity_full（κ₅=1 D−1 形，第 142 行起，hD : 1 ≤ D，
      worldsheet.level-five-null-family-kernel-bound 消费的就是这一形）。分类引理
      Finsupp.oscWeight_eq_five_cases（能级 5 的任意占据函数唯一分成七类，靠 modeCount
      两两分开）是单侧计数公式 p_m(5) 的底层依据。
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry（文件头 docstring "No sorry"）。
      **curator 未自行重跑 `lake build` / `check-axioms`**（本 worktree 无构建缓存）；
      结论基于直接读源码，合并前应由 lead 跑 `uv run stringgraph check-axioms`。

      **逐字核对**（第 121-127 行，(I5) 形）：
      ```
      theorem levelFive_count_identity (hD : 2 ≤ D) :
          ((D - 1) + 2 * ((D - 1) * (D - 1)) + 2 * ((D - 1) * Nat.choose D 2)
              + (D - 1) * Nat.choose (D + 1) 3 + Nat.choose (D + 3) 5) + 1
            = ((D - 2) + 2 * ((D - 2) * (D - 2)) + 2 * ((D - 2) * Nat.choose (D - 1) 2)
                + (D - 2) * Nat.choose D 3 + Nat.choose (D + 2) 5)
              + ((D - 1) + (D - 1) * (D - 1) + Nat.choose D 2 + (D - 1) * Nat.choose D 2
                  + Nat.choose (D + 2) 4)
              + ((D - 1) + (D - 1) * (D - 1) + Nat.choose (D + 2) 3)
      ```
      ——左端 p_{D−1}(5) + 1、右端 p_{D−2}(5) + p_{D−1}(4) + p_{D−1}(3)，与本卡【断言】
      (I5) 形逐字一致（注意左端的 **+ 1**，这是与 levelFour_count_identity 的结构差别）。
      主恒等式 levelFive_count_identity_gen（第 95-113 行）由三次 Pascal 递推
      （`Nat.choose_succ_succ` 在 (m+1,1)、(m+2,2)、(m+4,4)）加一步 `ring` 证出；
      levelFive_count_identity 与 levelFive_count_identity_full 各由
      `obtain ⟨m, rfl⟩` 代入 m = D−2 / m = D−1 后 `exact levelFive_count_identity_gen m` 收尾。
      **不用任何弦论对象**，与 math.level-two/-three/-four-partition-difference 同一模式
      （Pascal 递推 + 自然数算术），差别只在多一层递推与左端多一个 +1。

      **数值核对**：D=26 时 (I5) 代入得 209405 + 1 = 176256 + 29575 + 3575，即
      209406 = 209406（本卡 statement 段已列出）。
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/LevelFiveCount.lean，文件头 docstring 第 14-37 行"
    note: |
      文件头模块文档逐字记录本恒等式在 N=5 处的结构断裂：
      "the Pascal identity that carried `N ≤ 4` … **fails** for the first time: at `N = 5`
      the right-hand side is one *too big*.  The excess `1` is the coefficient of `−q⁵` in
      Euler's pentagonal expansion"，并说明同一引理"used twice：at m = D−2 it is (I5) …
      at m = D−1 … gives (K5)"。佐证本卡对应工作已在仓库 N=5 工作流中完成。
tags: [combinatorics, number-theory, binomial-coefficients, partitions, pentagonal, formalized, math-input]
notes: |
  【为什么立卡】formal/StringFormal/NoGhost/LevelFiveCount.lean 的 levelFive_count_identity
  是 Pascal 恒等式链（p_{D−1}(N) 的展开）在 N=5 的实例，但**与 N≤4 三张姊妹卡结构不同**：
  从 N=5 起干净的差恒等式失效，左端多一个 +1（Euler 五边形数 κ₅=1）。这条卡记录该断裂
  首次出现的确切算术形态，是"计数看不见 26"这一系列洞察的延续（+1 本身也与 D 的取值无关，
  D=26 只是代入的一个特殊值），同时是 worldsheet.ddf-spans-physical-states-level-five 的 h3
  依赖与 worldsheet.level-five-null-family-kernel-bound (K5) 的计数输入。

  【查重】2026-09-14 跑 `uv run stringgraph search "level-five"`、`search "level five"`、
  `search levelFive_count_identity`、`search pentagonal` 均无同内容命中；`search "partition
  difference"` 命中 math.level-two/-three/-four-partition-difference（姊妹卡，不重复，见下）。

  【与 math.level-two/-three/-four-partition-difference 的关系，不合并】四卡是同一恒等式链
  在 N=2,3,4,5 的四个独立实例，按【一个节点一个命题】原则不合并——各自系数不同，各自被
  worldsheet 侧不同的 N 片独立消费。本卡陈述里引用 math.level-four/-three-partition-difference
  的 p_{m+1}(4)、p_{m+1}(3) 记法（右端两项），这是记法引用，不建 `uses`/`depends_on` 边——
  与三张姊妹卡既有先例一致（levelFive_count_identity 的证明经 levelFive_count_identity_gen
  独立完整，只是数值上恰好把上两级展开式包含在右端，不实际把 levelFour/-Three_count_identity
  作为前提调用），故配套推导 `depends_on: []`。

  【本卡是这条 Pascal 恒等式链的转折点】math.level-four-partition-difference 明确不断言 (b)
  已预告"从 N=5 起同型恒等式不再精确成立"；本卡就是那条断裂的确切记录。与三张姊妹卡不同，
  本卡的等式**不是** N≤4 的干净差，而是差 + 1；这个 +1 的弦论意义（两族零态从 N=5 起重叠
  一维）由 worldsheet.level-five-null-family-kernel-bound 与
  worldsheet.ocq-null-state-two-families notes【2026-09-14 §B⁗.8 订正】承载，本卡只记录纯
  组合事实、不给出弦论解释（明确不断言 (a)）。
