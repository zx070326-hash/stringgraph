    note: |
      **部分 L1**：仅摘要 + pp.1–10（Introduction §1.1–§1.8）+ pp.42–52（参考文献列表）已读
      （researcher 2026-09-18，抽取记录 dunin-barkowski-fedorov-sleptsov-2025.md E0, E2）。
      **pp.11–41（技术推导 §2–§6 与附录 A–D，即"形式证明"本身的具体定理编号与证明步骤）完全未读**
      ——本节点的具体定理编号无法给出，status 依据摘要"we prove"的明确断言与期刊发表信息
      （J. High Energ. Phys. 2025, 193），非本项目独立复核 §2–§6 的证明细节。
tags: [supermoduli, superstring-measure, genus-3, math-input, dunin-barkowski-fedorov-sleptsov]
notes: |
  **系数猜测未单独立卡**：本节点刻意不把"三个系数的具体数值"做成独立图节点——抽取记录明确指出
  pp.11–41（含系数猜测的具体数值与支持证据的具体形式）完全未读，"未解决的疑问"第2条要求"若 curator
  需要把这一结果做成图节点并标注精确的 status……必须先补读 §2–§6 正文"。在补读之前立卡会导致
  status 判断（conjecture？physical-argument？）缺乏可核实的来源定位，故本轮判断为"警告但不建"，
  留待后续补读后再建，见本项目向 lead 的最终报告。

  **与 `math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole` 的关系**：两者都来自同一篇论文，但是
  两个不同的命题——本节点是"本文自己的正面结果"（线性组合形式），另一节点是"本文对 CDvG 2008 既有
  Ansatz 的条件性排除论证"，两者不应合并（一个节点一个命题）。
