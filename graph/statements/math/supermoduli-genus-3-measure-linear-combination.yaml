id: math.supermoduli-genus-3-measure-linear-combination
kind: proposition
title: 亏格三 RNS 超弦测度是三个已知函数的复系数线性组合（形式被证明；具体系数数值未被证明，仅为猜测）（Dunin-Barkowski–Fedorov–Sleptsov）
statement: |
  **对象**：π_*ψ_3/φ_3 为亏格三 RNS 超弦测度（记号约定同既有节点 `math.supermoduli-space-not-
  projected` 系列文献，H_3 为 Siegel 上半空间）。

  **结论**（摘要，逐字，经 export.arxiv.org API 核验）：
  "We prove that the superstring measure is a linear combinaition (with complex coefficients) of three
  known functions."

  **本节点断言的精确范围**——**只是线性组合这一"形式"被证明，不包括三个系数的具体数值**：摘要紧接着
  逐字写道："Furthermore, we conjecture the values of the coefficients of this linear combination and
  provide evidence for this conjecture." 即：三个系数的具体取值**全部**是猜测（有证据支持但未证明），
  **不是"两证一猜"**（这一点本项目的抽取记录经逐字核对摘要后自我更正过一次，特此在本节点正文中明确
  避免重犯：既不写"部分系数已证明"，也不写"三系数皆已确定"）。

  **方法论**（引言，忠实转述）：沿用 Witten 用代数参数化重新推导 D'Hoker–Phong 亏格二测度公式的
  思路，但本文所用的具体参数化此前未被应用于超弦理论。

  **本节点不断言**：三个系数的具体数值（该猜测本项目判断证据深度不足、暂不立卡，见 notes）；本
  节点不断言公式在超椭圆轨迹处的解析行为（极点存在性，见
  `math.supermoduli-genus-3-cdvg-ansatz-excluded-by-pole` 的条件性论证，那是基于 Witten 2015 的
  另一条既有结果，不是本节点本身证明的内容）。
