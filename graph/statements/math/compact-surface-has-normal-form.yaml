    note: |
      抽取记录 literature/extractions/math-sources.md §39.2.0（编号交叉表，L1 逐条对照）、
      §39.2.2（Definition 6.5 逐字）、§39.2.1（p.96 的三角化自陈逐字），
      **以及 §49（2026-09-11，Lemma 6.1 / Prop 6.1 逐字与页码，L1 页图；PDF 页 = 书页 + 10）**。
      Lemma 6.1（p. 92 逐字）：「Every cell complex, K, is equivalent to some canonical cell complex.」
