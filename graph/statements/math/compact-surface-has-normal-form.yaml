      ⚠ **不要**用 `surfclass-n.pdf` / `surfclassif.pdf` 这两个 28 页截断文件取正文（§39.2.0）。
  - ref: massey-1967
    loc: "Ch. I §10「The classification of compact, connected 2-manifolds with boundary」, pp. 37–42（**仅目录扫描页 L1，正文未获取**）"
    note: |
      第二来源，只登记「存在独立的第二条证明路线」这一事实（math-sources.md §39.3）。
      ⚠ **严禁写「Massey Theorem 10.1」**（编号 L0）。
      ⚠ Massey §10 的标题逐字含 "**connected**"，这是本卡把连通性写成显式前提的依据之一。
tags: [math, topology, surface, classification, normal-form, exhaustiveness]
notes: |
  **建卡理由（2026-09-11，curator-batch10-14-fix，依 reviewer-batch11 M2）**：
  math.positive-euler-surfaces-are-sphere-disk-rp2--via-normal-form-enumeration 的枚举要用
  **两件事**：(a) 参数表穷尽所有紧连通曲面（存在规范形），(b) 同不变量 ⟹ 同胚（Theorem 6.2）。
  此前图上只有 (b)（math.classification-of-compact-surfaces），而那张卡的 statement
  **明确声明只给完全不变量、不给存在性**。于是 (a) 是一条**悬空依赖**：枚举推导的
  summary 用了「每个紧带边曲面同胚于一个规范胞腔复形」这句话，图上没有节点承载它。
  本卡就是那个承载节点。

  **与 math.classification-of-compact-surfaces 的分工（不是重复卡）**：
  | | 本卡 | classification 卡 |
  |---|---|---|
  | 断言 | **存在**规范形（穷尽性） | **唯一性**：(可定向性, q, χ) 是完全不变量 |
  | 来源落点 | Lemma 6.1 + Proposition 6.1 + Appendix E | Theorem 6.2 (p.97) |
  | 在枚举里的用处 | 保证候选表没有漏 | 保证三者两两不同胚 |
  两卡都依赖同一条三角化事实（Appendix E），这是同一本书内的共同上游，不是重复计数。

  **连通性**：来源 Theorem 6.2 的逐字文本不含 "connected"，Gallier–Xu 第 1 章对 "surface"
  的定义本图未取到（同 classification 卡的同名记录）。本卡**把连通性写成显式前提**，
  这样下游不必再赌来源的定义。

  **2026-09-11 补（curator-small-backlog-4，依 math-sources.md §49）**：
  - **Proposition 6.2（p. 88，L1 逐字）是一座隐含的桥**：「For a triangulated 2-complex K viewed as a
    cell complex, orientability of the surface K_g as given by Definition 4.6 is equivalent to orientability
    of K as given by Definition 6.4.」它把「胞腔复形可定向（Def 6.4）」与「曲面可定向（Def 4.6）」接起来，
    **无独立证明**（只回指 Proposition 5.8 的证明）。本卡 statement 里的 type (I)/(II) ↔ 可定向/不可定向
    这一对应就靠它。arXiv 版编号 L0，不写。
  - **Theorem 6.2（p. 97）在本书无独立证明**（逐字「For the record, we state the following theorem」），
    依赖 Appendix E 的可三角化性；本卡不引 Thm 6.2，但 classification 卡引，见彼处。
  - 出版版 ↔ arXiv:0805.0562 v1 的编号：Prop 6.1 = 5.2.2，Lemma 6.1 = 5.2.5，Thm 6.1 = 5.3.1，Thm 6.2 = 5.3.2。
