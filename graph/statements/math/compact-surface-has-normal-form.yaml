      Proposition 6.1（p. 86 逐字）：「Every cell complex, K, can be refined to a triangulated 2-complex.」
      证明明说化简「assuming that vertices are primitive objects」，把顶点替换为边序列的手续
      逐字外包「It is given in Ahlfors and Sario [1]」。
      ⚠ **版本陷阱**：出版版（Springer GTC 9, 2013）Ch. 6 的编号与 arXiv 单作者版
