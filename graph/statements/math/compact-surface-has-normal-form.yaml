id: math.compact-surface-has-normal-form
kind: proposition
title: "每个紧连通曲面（含带边）同胚于 Definition 6.5 的某个规范形（穷尽性）"
statement: |
  设 M 是**紧、连通**的二维拓扑流形，允许有边界，允许不可定向（即来源意义下的
  "compact surface or compact surface with boundary"）。则**存在**一个 Gallier–Xu
  Definition 6.5 意义下的规范胞腔复形 K，使 M 同胚于 K 所定的曲面；且 K 的类型与参数落在
    type (I)（可定向）：p ≥ 0, q ≥ 0，  或   type (II)（不可定向）：p ≥ 1, q ≥ 0，
  其中 q 是 contour 数（边界分支数）。

  换言之：**Definition 6.5 的参数表穷尽了所有紧连通带边曲面**——没有任何紧连通曲面落在该表之外。

  **本命题不断言什么**：
  - **不**断言唯一性或「两两不同胚」，那是 math.classification-of-compact-surfaces
    （Theorem 6.2：(可定向性, contour 数, χ) 是完全不变量）；本卡只给**存在**方向。
  - **不**给出 χ 的计算公式（那在来源 pp. 89–90，是**无编号**行间式，由
    math.positive-euler-surfaces-are-sphere-disk-rp2--via-normal-form-enumeration 承载）。
  - **不**涉及任何黎曼/复结构、共形结构或度规，纯拓扑。
  - **不**处理非紧曲面，**不**处理不连通曲面。
sources:
