id: math.pbw-theorem
kind: proposition
title: Poincaré–Birkhoff–Witt 定理：U(L) 以有序单项式为基，等价地 S(L) ≅ gr U(L)
statement: |
  设 F 是域，L 是 F 上的李代数，(X, ≤) 是 L 的一组**全序**的 F-基
  （X 可以是无限集；序是任意选定的全序）。记 U(L) 为 L 的泛包络代数，
  ι : L → U(L) 为典范映射，S(L) 为 L 的对称代数。

  **(1) 有序单项式基（PBW 基）**：集合

      { ι(x_1) ι(x_2) … ι(x_n) : n ≥ 1,  x_i ∈ X,  x_1 ≤ x_2 ≤ … ≤ x_n }  ∪  { 1 }

  是 U(L) 的一组 F-基。称之为 U(L) 的 **PBW 基**。

  **(2) 分次形式**：赋 U(L) 以由 ι(L) 的乘积长度给出的滤过
      F_0 U(L) ⊆ F_1 U(L) ⊆ … ，  F_m U(L) := span_F{ ι(y_1)…ι(y_k) : k ≤ m, y_i ∈ L },
  并取相伴分次代数 gr U(L) := ⊕_m F_m U(L) / F_{m−1} U(L)。则由 L → gr_1 U(L) 诱导的
  典范代数同态

      S(L) ⟶ gr U(L)

  是**同构**（特别地 gr U(L) 交换）。

  **(3) 单射性**：ι : L → U(L) 是单射（(1) 的 n = 1 情形）。

  【(1) 与 (2) 的关系】在来源中 (2) 是定理主体、(1) 是同一小节里的推论：一旦知道
  S(L) ≅ gr U(L)，取 S(L) 的单项式基并逐层提升即得 (1)；反之由 (1) 逐层计数即得 (2)。
  本节点把两者放在同一张卡上，因为来源在**同一小节**里由前者推出后者，两者**不是**被
  分别推导的（见 notes 的编号说明）。

  【范围】本节点按上面写的**任意（可无限维）李代数 + 全序基**陈述。所引来源的原书
  语境是否允许无限维 L **未核实**，见 notes 的第二条警告与推导的 inferred 说明。
uses_conventions: []
sources:
  - ref: humphreys-1972
    loc: "§17.3 (PBW Theorem and consequences), p. 91 起；有序单项式基 = Corollary C, p. 92"
    note: |
      **定位由两条独立证据互证（researcher 2026-09-11，literature/extractions/math-sources.md §15.1–§15.3）**：
      (a) ardizzoni-2010 的正文逐字点名 `[Hu, Corollary C, page 92]`（L1 读图）；
      (b) Google Books 卷 id `mSD4DvUFa6QC` 全文检索，`"PBW Theorem and consequences"` → p.91、
          `"Corollary C"` → p.92，且**无意义串的控制实验返回 "No results"**（该卷没有「无命中回落固定页」的病）。
      印本本身**未取得**，本项目对 Humphreys 正文的等级是 L3/L4，不是 L1。
    # lead 2026-09-11：swanson-2015-pbw（研讨班讲稿）按「个人笔记只作核对源」裁决从 sources[] 降为本注；原 loc：\"研讨班讲稿 “§17: The PBW Theorem”（首行明说 based on §17 of Humphreys），9 页全文；分次版定理与有序单项式基推论的措辞\"
  - ref: ardizzoni-2010
    loc: "arXiv:1008.4523v2, p. 1 Introduction 第一段（逐字引用 [Hu, Corollary C, page 92] 并给出有序单项式基的措辞）；p. 15 References 的 [Hu] 条目"
    note: |
      **L1 逐页读图**。该文对定理的前提逐字写作「a Lie algebra which is assumed to have a totally ordered
      basis (X, ≤)」，**没有有限维假设**——本节点 (1) 的措辞取自这一句。
      注意版本坑：期刊版（Glasgow Math. J. 54 (2012)）把它编作 `[15, Corollary C, p. 92]`，arXiv 版写 `[Hu]`；
      本图引 arXiv 版，因为那是被 L1 读到的那一份。
  - ref: lakos-2024-pbw
    loc: |
      arXiv:1812.04896**v2**, Proposition 6.1, p. 16（逐字：「The PBW theorem holds if 𝔤 is a free K-module.」）；
      该命题所指的「PBW theorem」由 Introduction, p. 1–2 定义：局部形式 = 𝒎^{(n)} : ⊙^n𝔤 → 𝒰^n𝔤/𝒰^{n−1}𝔤 为同构，
      全局形式 (i) = 𝒎_≤ : ⊗_≤𝔤 → 𝒰𝔤 为 K-模同构（有序单项式基）；
      第二条独立证明见 Appendix A（Witt–Lazard），Corollary A.4(f), p. 20。
    note: |
      **L1 全文读毕（researcher 2026-09-11，literature/extractions/math-sources.md §33.2）**。
      前提逐字：「Assume that K is a unital commutative ring, and 𝔤 is a K-module with a compatible
      Lie-ring structure; i. e. 𝔤 is a Lie K-algebra」——**全文无任何有限维假设**，基的索引集 A 任意。
      域是特例（域上的模皆自由）。本条 source 的作用是**背书适用范围**，不是替代 humphreys-1972 的教科书证明；
      两者并列：后者给权威性与完整教科书证明，前者给可核对性（全文可读）与适用范围。
      记号对照（**抄公式时不要混**）：本篇写 𝒰𝔤、⊙^n𝔤、⊗_≤𝔤、J𝔤，本节点写 U(L)、S(L)、gr U(L)；
      对应关系是 ⊙^n𝔤 ↔ S(L) 的 n 次分量、𝒰^n𝔤/𝒰^{n−1}𝔤 ↔ gr_n U(L)。
      ⚠ **版本陷阱**：v2（2024-07-23）的 comments 逐字为「22 pages, Part 3 of original submission
      arXiv:1812.04896v1, rewritten」⇒ **v1 与 v2 的编号不同**，本条所有编号（Prop 6.1、Cor A.4）
      **只对 v2 成立**，`loc` 已写死 v2。
      ⚠ **未发表**：abs 页无 journal-ref，只有 arXiv 自发 DOI 10.48550/arXiv.1812.04896（读取日期 2026-09-11）；
      自称 expository preprint，权威性低于教科书。
tags: [algebra, lie-algebra, universal-enveloping-algebra, pbw, math-input]
notes: |
  **本节点为什么存在**：worldsheet.verma-module-pbw-basis--via-pbw（该推导已于 2026-09-11 随
  两张 Verma 基卡的合并删除，其剩余内容并入 math.verma-module-free-over-negative-part--via-pbw-theorem）
  原先在 gaps 里写着
  「PBW 定理本身在 literature/sources.bib 中没有条目」。researcher 第三轮把 (A) PBW 本体
  定位到了带编号的来源，而 (B) Virasoro Verma 模那一半在文献里**没有编号**
  （见 math.verma-module-free-over-negative-part）。把两者分成两张卡，是为了不让
  「PBW 有干净编号」这一半被「Verma 那半只能指段落」拖低可核对性
  （researcher 建议，math-sources.md §18 配套建议 2）。

  ⚠ **警告一：编号字母未裁决（Q14）**。ardizzoni-2010 把有序单项式基定为 **Corollary C**；
  而按 swanson-2015-pbw 的呈现顺序，它排在 §17.3 的第 4 条结论上（若「第 k 条 = 第 k 个字母」
  成立就该是另一个字母）。两者对不上，说明那个对应假设不成立。
  **硬性禁令：本图只允许写 `Corollary C, p. 92`（有两条独立证据落在同一处），
  绝不允许改写成 Corollary A / B / D / E 中的任何一个，也绝不允许把讲稿的连续编号写进图。**
  持 Humphreys 印本者看一眼 p.91–93 即可结案（math-sources.md §19.2 Q14）。

  §17.3 里还有一条推论断言「H ⊆ L 为子代数时 U(L) 作为 U(H)-模自由，自由基由不涉及 H 的
  有序单项式给出」——那正是 math.verma-module-free-over-negative-part 的直接上游。
  本图**不引它的字母编号**（同一条禁令），需要时按本节点 (1) 重做两行论证即可。

  ⚠ **警告二：无限维适用性未核实（Q15，等级 L0）**。Humphreys 全书的通行语境是
  「代数闭、特征零域上的**有限维半单**李代数」，而 **§17.1 开头对 L 的假设本轮没有核到**。
  本项目要把它用在 Virasoro（无限维、非半单）上，目前只有旁证：
  ardizzoni-2010 的前提只要求「有全序基」，swanson-2015-pbw 明写「possibly infinite dimensional」。
  ⇒ **任何从本节点出发、把 PBW 用在无限维李代数上的边必须标 `inferred: true`**
  （math.verma-module-free-over-negative-part--via-pbw-theorem 已照此处理）。
  Q15 结案（核到 §17.1 的假设声明）后这条 inferred 才能撤。

  **形式化状态**：Mathlib **没有** PBW 定理。`Mathlib/Algebra/Lie/UniversalEnveloping` 的
  全部 17 个声明只围绕构造与泛性质（Rel、ringCon、UniversalEnvelopingAlgebra、mkAlgHom、ι、lift、
  lift_unique、hom_ext 等），**没有滤过、没有与对称代数的同构，连 TODO 段都没有**
  （researcher 逐条读声明名，**读取日期 2026-09-11**）。virasoro-lean-2025 的作者亦逐字自陈
  「Mathlib does not currently have the PBW theorem」，并称补上它是 "a major undertaking"。
  ⇒ **本节点及其下游最高只能到 rigorous，不得标 formalized，直到 Mathlib 有 PBW 为止。**
  复查时请同时看 `Mathlib/Algebra/Lie/UniversalEnveloping.lean` 与 Mathlib 的 1000.yaml 跟踪表。
  **2026-09-11 该复查已做（researcher，math-sources.md §33.6，L1）**：Mathlib 官方定理跟踪表
  `docs/1000.yaml` 里 `Q2270905: Poincaré–Birkhoff–Witt theorem` 条目**存在但没有 `decl` 字段**
  ⇒ **Mathlib 官方登记为「未形式化」**（对照组 `Q1243340` 有 `decl`）；重读源码
  `Mathlib/Algebra/Lie/UniversalEnveloping.lean` 结论不变。Isabelle/AFP 只有微分几何路线的
  *Lie Groups and Algebras*（2024-07-31），无抽象李代数、无泛包络代数、无 PBW；Coq 侧未找到
  （这是「没找到」，不是「已证明没有」）。
  ⇒ **本节点及其下游的 status 上限仍是 `rigorous`，不得标 `formalized`。**

  **★ 2026-09-11 更新记录（curator，落地 math-sources.md §33.7(a)(b)）：适用范围问题已结案。**
  新增 source **lakos-2024-pbw**（arXiv:1812.04896v2, Prop. 6.1, p. 16 + Cor. A.4(f), p. 20；L1 全文读毕），
  其前提逐字是「K 是幺交换环、𝔤 是带相容李环结构的 K-模」，Prop 6.1 只要求 **𝔤 为自由 K-模**，
  **全文没有任何有限维假设**，且全局形式 (i) 的索引集 A 任意（只要求给定一个全序 ≤）。
  按项目原则 1，statement 文本不改；**以下两处因此已过时，日后新建 v2 卡时一并清理**：
  1. statement 的【范围】段末句「所引来源的原书语境是否允许无限维 L **未核实**」——**已过时**：
     lakos-2024-pbw 对任意幺交换环 K、任意（含无限维）自由 K-模李代数陈述并证明本定理，本图已有来源背书无限维。
  2. 上面的**「警告二：无限维适用性未核实（Q15，等级 L0）」整条已过时**，特别是其结论
     「任何从本节点出发、把 PBW 用在无限维李代数上的边必须标 `inferred: true`」**已作废**。
     瓶颈从来不是「Humphreys §17.1 怎么说」，而是「本图有没有一条来源背书无限维」；现在有了。
     据此 `math.verma-module-free-over-negative-part--via-pbw-theorem` 到本节点的边已改 `inferred: false`
     （理由见该推导那条边的 note）。**Q15（核 Humphreys §17.1 对 L 的假设声明）降级为可选**：
     它现在只影响 humphreys-1972 这一条 source 自身的自洽性，不再卡住任何一条边。
  ⚠ **未过时、仍然有效**：`math.pbw-theorem--via-humphreys` 的 gaps 第四条（基环限制）。
  lakos-2024-pbw p. 2 逐字给出「PBW 在一般交换环上会失败」——**有反例**（Širšov、Cartier、Cohn）。
  ⇒ 日后若想把本节点的基环从「域」放宽，**只能放宽到 (i) 𝔤 为循环 K-模的直和（含自由模）、
  (i') K 为 PID（Lazard）或 Dedekind 环（Cartier）、(ii) ℚ ⊂ K（Cohn）之一，不能放宽到任意交换环**。
  本节点当前限定在域上，域是 (i) 的特例，安全。
  ⚠ 上面的**「警告一：编号字母未裁决（Q14）」不受影响**，对 `Corollary C, p. 92` 的硬性禁令继续有效。
