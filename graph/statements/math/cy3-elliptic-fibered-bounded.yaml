notes: |
  from: literature/extractions/math-sources.md §46.1、§46.3、§46.4（researcher 2026-09-11 一手核实轮）。

  【★ 本卡是 math.cy3-cohomology-bounded 三层拆分中的第 (b) 层】
    (a) math.cy3-hypersurface-h11-max-kreuzer-skarke：Kreuzer–Skarke 超曲面的 h^{1,1} 最大值 491；
    (b) 本卡：**椭圆纤维化** CY3 构成有界族（**已证明**）；
    (c) math.cy3-cohomology-bounded：**一般** CY3 上同调是否一致有界（**截至 2026-06 仍开放**）。
  **★★ 本卡与 (c) 之间故意不建边。** 理由：本卡只覆盖椭圆纤维化子类，若建边，工具会沿"取最强推导"
  的规则把 (c) 的有效状态从 conjecture 抬到 rigorous——那是记账错误。子类的定理不能给全类升格。
  （researcher §46.6(a) 也明确警告了这一点。）

  【★ 另一条同子类的显式数值上界（本卡不承载，仅记账）】Grassi, *Spectrum bounds in geometry*,
  arXiv:2304.07819v2, **Corollary 5.3** 逐字 "Then h^{1,1}(X) ≤ 491."（对**椭圆纤维化** CY3）；
  同文 **Proposition 5.1**（归其 ref [29] = W. Taylor）与 **Corollary 5.2** 给 "CxDef(X) ≤ 491"。
  ⚠ 由其 Definition 3.2 可推 CxDef(X) = h^{2,1}(X)，**但 Definition 3.2 的原文未逐字取到（L0）**，
  故本图不写 h^{2,1} ≤ 491；要用必须标 inferred: true。
  ⚠ 该文**全文没有提 Kreuzer–Skarke** ⇒ 它的 491 与 (a) 卡的 491 是**两个不同来源的同一个数字**，
  是否同源本项目未查。
  **若要把 Cor 5.3 建成节点，应是本卡的兄弟卡而不是本卡的改写**（那是数值上界，本卡是有界族）。

  【★ status 为什么可以到 rigorous，而 math.narain-moduli-space-finite-volume-v2 只到
  physical-argument】两者的差别不在"论文有多有名"，而在**本卡的陈述与被引论文的断言是否逐字同一**：
    - 本卡：statement 就是 FHS **摘要首句的逐字翻译**，被引论文的标题也是同一句。
      我们指向的位置（篇 + 摘要首句）是精确、可复核的；缺的只是正文与定理编号。
    - Narain 那张卡：被引的 Borel–Harish-Chandra 是一篇含多条定理的长文，我们**不知道是哪一条**，
      而且从该定理到 Narain 模空间还有两个**完全无来源**的翻译环节（(A) 整点子群是算术子群、
      (D) 双陪集就是 Narain 模空间）。
  ⇒ 这不是双重标准，是"陈述—来源距离"不同。**仍请 reviewer 复核这个判断**：若认为"正文未读"
  一律不得 rigorous，本卡的推导应降为 physical-argument（本卡目前没有出边，降级不影响任何其他节点）。

  【不得称作 Reid 猜想或 Yau 猜想】见 math.cy3-cohomology-bounded 的 notes：
  Anderson–Gray–Nally–Taylor 明确把 "Reid's fantasy"（关于连通性的猜想，归其 [1] = M. Reid 1987）
  与有限性问题区分开。
