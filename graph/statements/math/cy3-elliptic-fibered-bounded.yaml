            Crossref `10.1215/S0012-7094-94-07414-0` 给 **volume 74**，**以 Crossref 为准**；页码 Crossref 未给；
        [10] Y. Kawamata, arXiv:alg-geom/9701006 (1997) —— 本项目未核实；
        [11] Filipazzi–Hacon–Svaldi（= 上一条，已 L2 核实）。
