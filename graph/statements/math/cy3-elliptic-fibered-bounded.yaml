id: math.cy3-elliptic-fibered-bounded
kind: proposition
title: 椭圆纤维化 Calabi–Yau 三折构成有界族（Filipazzi–Hacon–Svaldi）
statement: |
  断言：**椭圆 Calabi–Yau 三折构成一个有界族**（bounded family）。

  Filipazzi–Hacon–Svaldi 摘要首句逐字（arXiv:2112.01352；发表于 J. Eur. Math. Soc. 27 (2025),
  no. 9, 3583–3650）：

    "We show that elliptic Calabi--Yau threefolds form a bounded family."

  ⚠⚠ **本卡只断言这一句。** 同一摘要的**第二个**结论（"the same result holds for minimal
  terminal threefolds of Kodaira …"）**带两个必需的额外假设**（原文逐字："upon fixing the rate
  of growth of pluricanonical forms and the degree of a …"，并自陈 "Both of these hypotheses are
  necessary to prove the boundedness of such a family."）——**本卡不包含那个结论**，
  引用时也不得把它说成无条件的。

  ⚠ **本卡不断言一般 Calabi–Yau 三折的任何有界性**。一般情形（拓扑类型数目是否有限）
  **截至 2026-06 仍是开放问题**，见 math.cy3-cohomology-bounded。

  ⚠ **"有界族 ⇒ 拓扑类型数目有限"这一步不在本卡内**。Anderson–Gray–Nally–Taylor §I 确实逐字断言
  "the number of topological types of elliptic and genus one fibered Calabi-Yau threefolds is
  finite [8, 9, 10, 11]"（其 [11] 即 Filipazzi–Hacon–Svaldi），但该蕴含的证明本项目未核实，
  且那句还覆盖了本卡不涉及的**亏格一纤维化**情形。
