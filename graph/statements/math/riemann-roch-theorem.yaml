    本卡 + math.canonical-divisor-degree
      → math.quadratic-differentials-minus-holomorphic-vector-fields（对 D = 2K 用一次 RR）
      → worldsheet.riemann-roch-kappa-minus-mu-v2--via-riemann-roch（再过两座物理↔数学的桥）。

  ⚠ **形式化天花板：`rigorous`，不可能是 `formalized`**（researcher，读取日期 2026-09-11，
  math-sources.md §42.9）。Mathlib 官方定理跟踪表 `mathlib4/docs/1000.yaml` 中标题含
  "Riemann–Roch" 的条目共 **4** 条（`Q379048` Riemann–Roch theorem、
  `Q4663326` Hirzebruch–Riemann–Roch、`Q7333126` Riemann–Roch for surfaces、
  `Q17102744` Riemann–Roch for smooth manifolds），
  **四条都只有 `title` 字段、没有 `decl`**——按该文件的字段约定这是官方的「尚未形式化」记录
  （对照组：已形式化的条目带 `decl`）。
  ⇒ **本节点及其全部下游不得标 `formalized`**，也不建议把它选进 Phase 2 的 Lean 岛
  （RR 本身是一个大工程）。复查时请同时看 `docs/1000.yaml` 与 Mathlib 的代数几何目录。

  ⚠ **两条被明令禁止写进图的编号**（math-sources.md §42.3、§42.5）：
  1. `Farkas–Kra, Theorem III.4.8`（L4，只有维基转述）；
  2. `Jost, Compact Riemann Surfaces, Corollary 5.4.2`（L4，且 **Jost 的版次未定**：
     DNB 目录扫描与另一份 PDF 的同名小节页码相差 6 页 ⇒ 至少两个版次）。
     **Jost 因版次未定尚未登记进 literature/sources.bib，图里一律不得引 Jost。**

  ⚠ **Griffiths–Harris 本轮完全未查（L0）**，其任何编号同样不得写进图。

  **本卡刻意不断言的三件事**（各自需要独立来源，别指望这一条边解决）：
  (a) `deg K = 2g − 2` —— 另立 math.canonical-divisor-degree；
  (b) `deg D < 0 ⇒ l(D) = 0`（负次数线丛无非零全纯截面）—— 教材里是 RR 之前的独立命题，
      本图尚无节点；缺它就**算不出单个维数**（如 g ≥ 2 时 dim H⁰(K^{−1}) = 0），只能算差；
  (c) `dim_C H⁰(X, K) = g`（拓扑亏格 = 全纯 1-形式的维数）。
