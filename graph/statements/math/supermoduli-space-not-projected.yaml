notes: |
  【1. ★★ 与 consistency.superstring-perturbation-theory-via-super-riemann-surfaces 之间**不建边**】
  Witten 的框架（在超模空间/积分链 Γ 上做全部积分，不下降到普通模空间）**本来就不假设投影存在**；
  他在 §3.3.2 只是**引用**本定理说明「不能指望有全局投影」。若让那张卡 depends_on 本卡，
  会把因果讲反（框架不是从非投影性推出来的）。正确做法是双向 notes 交叉引用（抽取记录 §5.1 的边建议）。

  【2. ★ PCO 方法没有被本定理「反驳」——它被打了补丁】
  Sen–Witten, "Filling The Gaps With PCO's," JHEP 09 (2015) 004, arXiv:1504.00609（bib key sen-witten-2015-pco，
  **本项目只读了摘要，L2**）摘要逐字：「the simplest version of the PCO procedure is valid only locally on the
  moduli space of Riemann surfaces」；「a correct PCO-based algorithm … must be based on piecing together local
  descriptions」；「'vertical integration' was proposed as a relatively simple method to do this」；
  「This involves a hierarchical procedure with corrections of high order」。
  ⇒ PCO 的局部有效性来自**伪奇点**（Witten §3.5，切片在某些模处非法），与投影的存在性是两个不同的问题；
  Witten §6.4.6 p. 109 明说「we view the PCO's as a possible method of integration over odd moduli, but not a basic
  definition」。**图中任何地方不得写「Donagi–Witten 反驳了 PCO 方法」。**

  【3. 后续工作（L2，仅摘要）】Donagi–Witten, "Super Atiyah classes and obstructions to splitting of supermoduli
  space," arXiv:1404.6257（PAMQ 9 (2013) no. 4, 739–788；卷期年份早于 arXiv 提交日属 PAMQ 延迟出版）
  自陈给出 **Theorem 1.2（𝔐_{g,1}）的新证明**，**不扩展 Theorem 1.1 的亏格范围**。未登记为独立 bib key。

  【4. 形式化：不可能】Mathlib 无超流形、无超黎曼面、无模叠；本定理是代数几何/上同调障碍类层面的结果，
  证明本项目未读。**不得选进 Lean 岛**（抽取记录 §5.4）。天花板 rigorous。

  【5. 与 1998 年状态的接口】polchinski-1998-v2 §12.5 p. 126 说 (12.5.27) 的参数化「is always possible locally on
  supermoduli space. It can also be used globally, with careful treatment of the modular identification and the
  limits of moduli space」——那是 1998 年对全局问题的措辞；本定理（2013）把「全局」这一层的一个具体版本
  （全纯投影到约化空间）在 g ≥ 5 否定了。见 consistency.superstring-perturbative-consistency-unproven-1998。
