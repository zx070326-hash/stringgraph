id: math.supermoduli-space-not-projected
kind: proposition
title: 超黎曼面模空间不可全纯投影（Donagi–Witten）：𝔐_g 在 g ≥ 5 时非投影（特别地非分裂）；𝔐_{g,1} 在 g ≥ 2 且偶自旋结构时非投影；𝔐_{g,n} 在 g ≥ 2、g−1 ≥ n ≥ 1 时非投影（奇 g 两种自旋结构、偶 g 仅偶自旋）
statement: |
  **对象与术语**（Donagi–Witten arXiv:1304.7798v2 §1；定义式的措辞取自 Witten arXiv:1209.5461v4 §3.3.2 (3.58)(3.59)）：
  · 𝔐_g：亏格 g 超黎曼面（super Riemann surface）的模空间；𝔐_{g,n}：带 n 个（NS 型）穿孔的情形。
    严格地说它们是模**叠**（moduli stack），见 DW Remark 1.6。其约化空间 𝒮ℳ_g 是带自旋结构的普通黎曼面
    （spin curves）的模空间；复维数 3g−3 | 2g−2（无穿孔）。
  · 一个复超流形 𝔐 称为**全纯投影的（holomorphically projected）**，若存在到其约化空间的全纯投影
    𝔐 → 𝔐_red（Witten 的坐标化表述：可以选局部坐标 (m | η) 使转移函数的偶部分只依赖 m 不依赖 η）；
    称为**全纯分裂的（holomorphically split）**，若还可以选坐标使奇坐标的转移函数在 η 中线性。
    「every split supermanifold is projected」（DW p. 7 逐字），故非投影 ⇒ 非分裂。

  **定理**（DW §1 p. 5，逐字）：
  · **Theorem 1.1.** "The supermanifold 𝔐_g is non-projected, and in particular non-split, for g ≥ 5."
  · **Theorem 1.2.** "The supermanifold 𝔐_{g,1} is non-projected for g ≥ 2, for the case of an even spin structure."
  · **Theorem 1.3.** "The supermanifold 𝔐_{g,n} is non-projected for g ≥ 2 and g−1 ≥ n ≥ 1. This holds for both
    even and odd spin structures if g is odd and for even spin structure if g is even."

  **适用域红线（是陈述的一部分，全部为原文逐字或直接转述）**：
  (1) Theorem 1.1 只到 **g ≥ 5**；紧跟的括注 "(We suspect that this result may hold for g ≥ 3.)" 是**猜测**，
      本卡不断言 g = 3, 4。
  (2) **低亏格存在全纯投影**：Witten §3.3.2 p. 35 逐字 "Supermoduli space is holomorphically projected in low
      orders and this fact has been exploited in explicit computations, especially in [14]"（[14] = D'Hoker–Phong
      两圈计算）；DW p. 4 亦说低亏格投影的存在「follows from the cohomological nature of the obstructions to
      splitting and the nature of the reduced spaces 𝒮ℳ_g for small g」。**g = 2 的显式计算不受本定理影响。**
  (3) 偶 g、奇自旋结构、n ≥ 1 的情形**原文明说未解决**："We do not resolve the question of projectedness of
      𝔐_{g,n} for the case of even g, odd spin structure, and n ≥ 1."
  (4) **不考虑 Deligne–Mumford 紧化**（Remark 1.4 逐字）："Our assertion is that 𝔐_g and 𝔐_{g,n} are non-projected
      without any consideration of the compactification. Asking for the compactification to be projected would only
      be a stronger condition."
  (5) Theorem 1.3 中 n 的上界「probably not optimal」（Remark 1.5）；n ≫ g 时要求点两两不同「very likely kills the
      obstructions to splitness」——本卡对 n > g−1 不作任何断言。

  **本节点不断言**（★★ 最易误用处）：
  (i) **对超弦微扰论或 PCO 方法的任何负面结论**。DW p. 4 逐字：
      > "**The validity of superstring perturbation theory does not depend on a projection**, so the existence of
      > string theory gives no hint that 𝔐_g is projected."
      被本定理否定的是一个**特定策略**——「先沿 𝔐_g → 𝒮ℳ_g 的投影纤维积分、再化约到普通模空间上的积分」
      （DW p. 4："a possible strategy … is to integrate over 𝔐_g by first integrating over the fibers of its
      projection to 𝒮ℳ_g"；摘要："certain approaches to superstring perturbation theory that are very powerful
      in low orders have no close analog in higher orders"）。PCO 方法与投影是两回事，见 notes。
  (ii) 非投影性对**任意** g 成立（见 (1)）。
  (iii) 紧化 𝔐̄_g 的（非）投影性（见 (4)）。
  (iv) 本定理的证明内容——本项目只读了定理陈述所在的 §1（见推导 gaps）。
