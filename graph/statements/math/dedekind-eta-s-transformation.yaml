notes: |
  由 curator 于 2026-09-11 从 math.dedekind-eta-modular-transformation **拆分**而来
  （lead 依 reviewer-v1-ch7 的裁定）。旧卡合写 (7.2.44a)(7.2.44b) 并按弱者定级，
  导致 T 半的强度被低估两级；拆分后 T 半是 math.dedekind-eta-t-transformation（rigorous），
  本卡承载真正的缺口。旧卡的 `superseded_by` 指向本卡。

  **升级路径（两条）**：
  (a) **已走（2026-09-11，curator-small-backlog-4）**：researcher 在 literature/sources.bib 登记了
      siegel-1954-eta（math-sources.md §48，L1 全文逐字），本卡新增推导
      math.dedekind-eta-s-transformation--via-siegel-1954（kind proof / status rigorous，
      走 STATUS_LEVELS 第 4 级主判据）。旧推导 --via-textbook-assertion 按 lead 裁决保留作
      「来源只给断言」的记录，工具取高者。
      ⚠ Apostol GTM 41 的「Theorem 3.1」在本项目零证据（§48.5, Q48.1），**未登记、不得引**。
  (b) **已走（2026-09-11，formalizer `eta-s` + curator lean-wire-9）**：本卡挂
      `formal.lean_decl = StringFormal.DedekindEta.eta_neg_inv`，新增推导
      math.dedekind-eta-s-transformation--via-lean（kind proof / status **formalized**）。
      --via-siegel-1954 与 --via-textbook-assertion 都保留，工具取最高者。

      ⚠⚠ **本条此前写的「Mathlib 无 S 变换 ⇒ 不得标 formalized」是错的，2026-09-11 撤销。**
      错在哪：researcher 的 §48.4 只读了 `Mathlib/NumberTheory/ModularForms/DedekindEta.lean`
      一个文件，那里确实没有 S 变换；但 S 变换在**同目录的另一个文件**
      `Mathlib/NumberTheory/ModularForms/Discriminant.lean`（v4.33.1 新增）里：
        `ModularForm.eta_comp_eq_csqrt_I_inv :`
        `  upperHalfPlaneSet.EqOn (η ∘ (-1 / ·)) ((Complex.sqrt I)⁻¹ • (Complex.sqrt * η))`
      即 η(−1/z) = (√i)⁻¹ √z · η(z)，`Complex.sqrt w = w ^ (2⁻¹ : ℂ)` 是主分支 cpow。
      这正是 §48.7 的 **Q48.2「Delta/Identities/JacobiTheta 侧未查」所漏掉的地方；
      Q48.2 于 2026-09-11 由 formalizer 逐文件读源码结清**（结论：η 的 S 变换在
      `Discriminant.lean`，E₂ 的拟模性在 `EisensteinSeries/E2/Transform.lean`，
      两者都已在 Mathlib；Mathlib 缺的是 η 的 **T** 变换和一般乘子系统）。
      教训：「Mathlib 没有 X」这种否定结论，读一个文件是不够的。
      ⚠ Q48.1（Apostol 的「Theorem 3.1」）**未**结清，那条禁令依然有效。

  **statement 里的「推论」形式化到哪一步了**（2026-09-11）：
  τ₂|η(τ)|⁴ 的 **S** 不变性已形式化（`im_mul_norm_eta_pow_four_S_invariant`，
  以及模群作用形 `im_mul_norm_eta_pow_four_modular_S_smul`），中间件
  `norm_eta_neg_inv_sq`、`norm_eta_neg_inv_pow_four`（|η(−1/τ)|⁴ = |τ|²|η(τ)|⁴）同样有声明。
  **T 半也已形式化**（math.dedekind-eta-t-transformation 的
  `im_mul_norm_eta_pow_four_T_invariant`，2026-09-11）。⇒ **S 版 + T 版合起来，
  τ₂|η|⁴ 的完整模不变性只差一件：worldsheet.modular-group-generated-by-s-and-t
  （模群由 S、T 生成）尚未形式化。** 在它落地之前，**不得**把「τ₂|η|⁴ 在整个模群下不变」
  标为 formalized——本卡的 lean_decl 只覆盖 S 这一个生成元上的等式。
  ⚠ Mathlib 的 `discriminant_S_invariant` / `discriminant_T_invariant`（`Discriminant.lean`）
  是判别式 Δ = η²⁴ 的不变性，**推不出 η 自身的相位**（24 次根的分支信息在 Δ 里丢掉了），
  因此对本卡与 T 卡都不是可用的替代品。

  **相邻 Lean 选题情报（本图目前无对应节点，故只记不接线）**：Mathlib v4.33.1 的
  `Mathlib/NumberTheory/ModularForms/EisensteinSeries/E2/Transform.lean` 已有 E₂/G₂ 的拟模性——
  `G2_S_transform`（G₂(−1/z) = z²G₂(z) − 2πi z 的等价形式）、`G2_slash_action`、
  `E2_slash_action`（对全 SL(2,ℤ)）、`G2_T_transform`，配合 `DedekindEta.lean` 的
  `logDeriv_eta_eq_E2`（logDeriv η = (πi/12)E₂）。若本图日后要建「E₂ 的拟模性」或
  「Eisenstein 级数」卡，这些是现成的 lean_decl 目标。
  ⚠ 2026-09-11 查过：`uv run stringgraph search "E_2"` / `"Eisenstein"` 均无命中，
  图里只有两条 **权 k ≥ 4** 的 Eisenstein 级数提及（在格论推导
  math.even-unimodular-rank-divisible-by-8--via-zagier 与
  math.even-unimodular-rank-16-classification--via-chenevier-lannes 的 gaps 里，
  都明写「本图没有模形式侧的节点」），与 E₂ 的拟模性不是同一件事，故本轮不建卡、不接边。

  ⚠ **statement 正文里「见本卡唯一一条推导的 gaps」一句已过时**（现有三条推导：
  --via-siegel-1954 / --via-textbook-assertion / --via-lean），按原则 1 不改正文；
  读者请看 --via-siegel-1954 的 gaps。
  ⚠ 正文「不断言本式的任何证明（Polchinski 对它是纯断言）」这句也只反映建卡时的状态：
  现在本卡有 Siegel 的严格证明与一条 Lean 证明；同样按原则 1 不改正文。
