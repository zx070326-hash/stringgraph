id: math.dedekind-eta-s-transformation
kind: proposition
title: "Dedekind η 的 S 变换：η(−1/τ) = (−iτ)^{1/2} η(τ)（主分支）"
statement: |
  设 η 如 math.dedekind-eta-function 所定义（τ ∈ H，q = exp(2πiτ)，q^{1/24} = exp(πiτ/12)）。则
    η(−1/τ) = (−iτ)^{1/2} · η(τ) ,
  其中 (−iτ)^{1/2} 取**主分支**（τ ∈ H ⇒ −iτ 落在右半平面 Re(−iτ) > 0，
  该处主平方根单值全纯且在 τ = i 处取值 1）。

  **推论（下游实际使用的形式）**：|η(−1/τ)|⁴ = |τ|² |η(τ)|⁴，配上 Im(−1/τ) = τ₂/|τ|²，
  得 τ₂|η(τ)|⁴ 在 S : τ ↦ −1/τ 下不变。与 math.dedekind-eta-t-transformation 的推论合起来
  （并用「模群由 S、T 生成」，worldsheet.modular-group-generated-by-s-and-t），
  得 τ₂|η(τ)|⁴ 在整个模群下不变。

  **本卡不断言什么**：不断言 T 变换（那是 math.dedekind-eta-t-transformation，强度高两级）；
  不断言 η 是权 1/2 模形式的一般乘子系统（对一般 (a b ; c d) ∈ SL(2,Z) 的变换含 Dedekind 和）；
  不断言本式的任何证明（Polchinski 对它是纯断言，见本卡唯一一条推导的 gaps）。
