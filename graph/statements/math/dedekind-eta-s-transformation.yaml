      原文标题即陈述：「A simple proof of η(−1/τ) = η(τ)√(τ/i)」；√(τ/i) = (−iτ)^{1/2}
      （τ/i = −iτ）——**这一步换算是抽取者所做，原文未写**。
      ⚠ 全文无编号定理/公式/小节/参考文献，**不得写 "Theorem 1"**。
      ⚠ 原文不声明平方根分支、不显式写 Im τ > 0（只由 |q| < 1 蕴含）；本卡 statement 的
      「主分支」「τ ∈ H」是本图补的前提，见 --via-siegel-1954 的 gaps 第一条。
      证明是留数定理（f(z) = cot z·cot(z/τ)，菱形围道 1, τ, −1, −τ），完整自足，
      落地为推导 math.dedekind-eta-s-transformation--via-siegel-1954（rigorous）。
