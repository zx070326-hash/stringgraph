      ⚠ **本式是全书模不变性的承重墙**：(7.2.8)/(7.2.9)（E9）、(7.3.6)（E20）、
      (7.4.2)（E30）、(7.4.19)、(7.4.23)、(8.4.21) 全部直接用它。
