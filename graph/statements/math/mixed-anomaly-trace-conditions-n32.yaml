id: math.mixed-anomaly-trace-conditions-n32
kind: proposition
title: 线性方程组 N + 8l = 24 ∧ N + 2l = 30 在整数上的唯一解是 (N, l) = (32, −1)
statement: |
  **(1) 纯算术部分。** 设 N, l ∈ ℤ 满足

      N + 8l = 24   且   N + 2l = 30。

  则 (N, l) = (32, −1)，且解唯一。

  **(2) 代入 math.so-usp-adjoint-fundamental-trace-identities 的记号。**
  该节点中 l = −1 对应 so(N)、l = +1 对应 usp(N)，于是

  · **SO(N)**（l = −1）：两条件分别化为 N − 8 = 24 与 N − 2 = 30，**各自都给出 N = 32**，
    因而相容；这就是 Green–Schwarz 所说的「两次独立确认」的算术内容。
  · **USp(N)**（l = +1）：两条件分别给 N = 16 与 N = 28，**互相矛盾，无解**。

  **本节点不断言**：这两条方程为什么是混合反常抵消的条件——那是物理，由
  consistency.anomaly-cancellation-so32-effective-theory 承载；本节点只把它们当作给定的方程。
uses_conventions:
  - conv.gauge-trace-normalization
sources:
  - ref: green-schwarz-1984
    loc: "PLB p.120（重印 611），(22)(23) 之后的逐字句：「The cancellation requires that `N + 8l = 24` and `N + 2l = 30` in eq. (12). Thus the cancellation of mixed anomalies gives two independent confirmations of the consistency of choosing the gauge group SO(32).」；方程里的 N、l 由 (12)(13) 定义"
    note: |
      L1 逐页读图（抽取记录 literature/extractions/green-schwarz-1984.md E15）。
      GS **只断言两条方程，不给中间步骤**，也不写出解方程这一步；本节点把那一步显式化。
      ⚠ 「the cancellation requires…」这句里的相对归一化 GS 逐字外包给
      alvarez-gaume-witten-1984 的 eq. (63)（本项目未取得），那是**物理侧**的缺口，
      与本节点的算术无关，记在 consistency 一侧。
tags: [algebra, arithmetic, anomaly, so32, usp, phase2, lean-candidate]
notes: |
  【为什么值得单独建卡】把 GS 那句 "two independent confirmations" 变成可机检的陈述：
  两条方程各自都给 N = 32，这件事本身是非平凡的（两条来自不同反常项的条件相容），
  也是「为什么是 32」的算术入口之一（另一个入口是 math.tr-f6-coefficient-vanishing）。
  抽取记录 §5.2 列为 Lean 候选 A2：ℤ 上两条线性方程，`omega` 一行。

  【status 说明】与 math.anomaly-twelve-form-factorization 同理，按 docs/STATUS_LEVELS.md 的
  rigorous 例外需要 reviewer 独立复核记录，目前没有，故取 physical-argument。
  这是**记账保守**，不是对算术的怀疑。

  【USp 一支的归属】GS 从未写「所以 USp 被排除」，(2) 的 USp 结论是抽取者由 (12)(13) 推出的
  （抽取记录 Q4）。相应的边在推导里标了 inferred。
