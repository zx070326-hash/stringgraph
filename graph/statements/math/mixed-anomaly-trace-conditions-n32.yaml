    note: |
      L1 逐页读图（抽取记录 literature/extractions/green-schwarz-1984.md E15）。
      GS **只断言两条方程，不给中间步骤**，也不写出解方程这一步；本节点把那一步显式化。
      ⚠ 「the cancellation requires…」这句里的相对归一化 GS 逐字外包给
      alvarez-gaume-witten-1984 的 eq. (63)（本项目未取得），那是**物理侧**的缺口，
      与本节点的算术无关，记在 consistency 一侧。
tags: [algebra, arithmetic, anomaly, so32, usp, phase2, lean-candidate]
notes: |
  【为什么值得单独建卡】把 GS 那句 "two independent confirmations" 变成可机检的陈述：
  两条方程各自都给 N = 32，这件事本身是非平凡的（两条来自不同反常项的条件相容），
  也是「为什么是 32」的算术入口之一（另一个入口是 math.tr-f6-coefficient-vanishing）。
  抽取记录 §5.2 列为 Lean 候选 A2：ℤ 上两条线性方程，`omega` 一行。

  【★ 2026-09-11：Lean 声明已就位（岛 2）】formal/StringFormal/Math/GreenSchwarzAlgebra.lean
  用**两条独立声明**分别覆盖本卡的两个分支（本卡 (2) 的 SO 支与 USp 支是两条独立命题）：
  · (1) + (2) 的 SO 支 → `mixed_anomaly_trace_conditions_n32 (N l : ℤ)
    (h₁ : N + 8 * l = 24) (h₂ : N + 2 * l = 30) : N = 32 ∧ l = -1`
    （`formal.lean_decl` 取这条；「解唯一」即此结论本身）；
  · (2) 的 USp 支 → `mixed_anomaly_no_solution_l_one : ¬ ∃ N : ℤ, N + 8 = 24 ∧ N + 2 = 30`。
  两条都是 `omega` 一行。**未被 Lean 覆盖的一句**：(2) 的 SO 支里「两条件**各自单独**都给出
  N = 32」——`mixed_anomaly_trace_conditions_n32` 同时用了两条假设，没有单条件版本；
  记在 math.mixed-anomaly-trace-conditions-n32--via-lean 的 gaps。

  【status 说明】原纸上推导经 reviewer 复核后已是 rigorous；本卡 own status 现由 --via-lean
  升到 formalized，但**有效状态仍是 physical-argument**——瓶颈是
  math.so-usp-adjoint-fundamental-trace-identities（l ↔ so/usp 的字典与 (12) 本身），
  它在本图里 GS 与 Polchinski 都不给证明（后者留作 Exercise 12.1）。

  【USp 一支的归属】GS 从未写「所以 USp 被排除」，(2) 的 USp 结论是抽取者由 (12)(13) 推出的
  （抽取记录 Q4）。相应的边在推导里标了 inferred。
