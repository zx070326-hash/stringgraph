id: susy.brane-charges-in-susy-algebra
kind: proposition
title: 扩展物体的荷进入十维 type II 超对称代数：(13.2.9) 的 F 弦 NS–NS 荷与 R–R p-形式膜荷（原书自承"still not complete"）
statement: |
  **设定**：十维 type II（IIA 或 IIB）超弦，超荷 `Q_α`（左动）与 `Q̃_α`（右动），
  `β^M ≡ ΓΓ^M`。荷的归一化按 §13.2 的新约定——原文逐字：
  「Also, we have **changed conventions** so that all charges are now normalized to one per unit
  world-volume of the respective extended object, and so the string tension `(2πα')^{−1}` appears explicitly.」

  **命题**：把扩展物体携带的荷计入后，超对称代数在 App. B (B.2.36) 的点粒子形式之外多出如下项：
    `{Q_α, Q̄_β} = −2[P_M + (2πα')^{−1}Q^{NS}_M]Γ^M_{αβ}`,                       (13.2.9a)
    `{Q̃_α, Q̃̄_β} = −2[P_M − (2πα')^{−1}Q^{NS}_M]Γ^M_{αβ}`,                       (13.2.9b)
    `{Q_α, Q̃̄_β} = −2Σ_p (τ_p/p!) Q^{R}_{M_1…M_p}(β^{M_1}⋯β^{M_p})_{αβ}`,        (13.2.9c)
  其中 `Q^{NS}_M` 是**基本弦（F 弦）**所带的荷，`Q^R_{M_1…M_p}` 是与 R–R (p+1)-形式势耦合的
  **Dp 膜荷**，IIA 求和跑偶 `p`、IIB 跑奇 `p`；且
    `β^{μ_1}⋯β^{μ_p} = β^⊥Γ^0`（up to an overall sign）                          (13.2.10)
  ——即出现在 (13.2.9c) 里的矩阵正是 branes.d-brane-bps-half-susy 中决定未破缺超对称组合的 `β^⊥`。

  **本命题不断言**：
  (a) 代数的完整性。原文逐字（p.145）：「Incidentally, the algebra (13.2.9) is **still not complete**:
      the *magnetic NS–NS charge* is missing. This is not carried by D-branes or F-strings.
      We discuss this further in the next chapter.」
  (b) (13.2.9) 是"洛伦兹不变性允许的最一般代数"。App. B p.448 只说点粒子情形的最一般代数是 (B.2.36)，
      并把扩展物体的项推给 §11.6 与 ch.13；ch.13 给出这些项，但**没有**补上一个新的最一般性主张。
  (c) (13.2.10) 的整体符号（原书逐字 "up to an overall sign"）。
  (d) 由本代数导出的任何具体 BPS 界（那是 §13.6 (13.6.1)(13.6.2) 的内容，本图未建卡）。
uses_conventions: [conv.metric-mostly-plus, conv.alpha-prime-regge]
sources:
  - ref: polchinski-1998-v2
    loc: "§13.2, eqs. (13.2.9a)(13.2.9b)(13.2.9c)、(13.2.10), pp. 144–145；归一化改动的逐字句同页；自承缺口逐字「Incidentally, the algebra (13.2.9) is still not complete: the magnetic NS–NS charge is missing.」p. 145"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E14，证据等级 L1（原书页图）。
  - ref: polchinski-1998-v2
    loc: "App. B §B.2, (B.2.36a,b) 之后 p.448 逐字：「To be precise, this is the most general algebra if we include only charges that can be carried by point particles. Including charges that can be carried by *extended objects*, additional terms appear. Rather than explain this here, we introduce it in its natural physical context: first in section 11.6, and then in more variety in chapter 13.」；§B.5 p.454 逐字：「additional central charges carried by extended objects are introduced in their physical context in section 13.2.」"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-appB.md#E21、#E25（L1）。
      这两句是**原书自己指定的转承关系**：App. B 给点粒子模板，§13.2 给膜荷扩展。
tags: [supersymmetry, central-charge, brane-charge, type-ii, d-brane, f-string, bps, polchinski-ch13]
notes: |
  【本卡存在的理由】App. B 的 BPS 界 (B.2.39) 只对点粒子荷成立（susy.bps-bound-point-particle-d4）。
  D 膜的 BPS 性在代数层面的依据是 (13.2.9)，而原书自承它不完整。把这两件事分成两张卡，
  是为了让"D 膜 BPS ⇒ 依赖一个作者自承不完整的代数"这条链在图上可见（抽取记录 Q3、§5-B）。

  【§11.6 未核】原书说膜荷"first in section 11.6"（杂化弦的 (11.6.32)）。本项目尚未抽 §11.6
  （ch13 抽取记录 §3.3 标"❓未核"）；本卡只覆盖 §13.2 的十维 type II 版本。

  【去重裁决（2026-09-11）】两个并行 curator 各建了一版同一命题（本卡与 `branes.brane-charges-in-susy-algebra`，
  两版都已进过 main）。lead 裁决**保留本卡**，branes 版标 `superseded_by: susy.brane-charges-in-susy-algebra`。
  branes 版独有的逐字证据、gaps 与「不断言」条目已并入本卡与本卡推导（逐条标〔并入〕）；**statement 未改动**。
  branes 版旧推导 `branes.brane-charges-in-susy-algebra--via-t-dual-supercharges-and-brane-charges`
  按「旧推导的去留」保留作历史记录（预期 stale 警告）。

  【★ statement 未覆盖、留待下次换代的两处符号释义】〔并入 branes 版 statement 的独有内容，**本卡 statement 不改**〕
  · `Q^{NS}_M` 是 F 弦携带的、**与 `B_{MN}` 耦合**的荷；
  · (13.2.9c) 里的 `τ_p` 就是 **Dp 膜张力**（`branes.d-brane-tension`），因为荷已按「每单位世界体归一为 1」重整。
  ⇒ 建议（交 lead / 下次换代）：本卡推导应补一条指向 `branes.d-brane-tension` 的非 inferred 边
  （branes 版推导有这条边，本卡推导没有）。本轮只记录，不擅自加边。

  【依赖方向按原书顺序，反向会成环】〔并入 branes 版〕§13.2 的行文顺序是
  (13.2.5)(13.2.6) 半 BPS（p. 140）→ (13.2.7) R–R 荷（p. 141）→ (13.2.9) 含膜荷的代数（pp. 144–145）。
  故本卡**依赖** `branes.d-brane-bps-half-susy` 与 `branes.d-brane-rr-coupling`，不是反过来；
  `susy.bps-bound-point-particle-d4` 是本卡与半 BPS 卡的共同上游。若按「bps-bound → brane-charges → 半 BPS」
  的直觉建边会与 rr-coupling 卡成环。

  【第 14 章缺口与 §13.6 的式号存疑】〔并入 branes 版〕磁 NS–NS 荷（NS5 膜）在第 14 章，本项目未抽。
  由 (13.2.9) 导出的具体 BPS 界本图未建卡；⚠ 两版并行建卡记的式号不一致：本卡原记 §13.6 (13.6.1)(13.6.2)，
  branes 版记 (13.6.3)（(p,q) 弦）与 (13.6.18)(13.6.19)（D0–Dp）。未复核原书，不在此裁定。

  【荷归一化的换算未核】〔并入 branes 版「不断言 (d)」〕(13.2.9c) 用 `τ_p`，而 §13.3 的 R–R 荷用 `μ_p`
  （branes 版记为 (13.3.5)，其 statement 另一处写 (13.3.7)，两处自相矛盾，未复核）；原书没有并排比较这两种归一化，
  本卡也不断言二者的换算。

  【区划理由】放 `susy` 而非 `branes`：本卡陈述的是**超对称代数的结构**，膜只是荷的携带者；
  同一张卡是 IIA/IIB 全部 p 的膜荷加 F 弦荷，不专属某一种膜。
