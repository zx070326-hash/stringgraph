sources:
  - ref: polchinski-1998-v2
    loc: "App. B §B.5 *d < 10 supergravity*, Table B.3, p.455（表题与表体逐字）；计数式 (B.5.7)(B.5.8) 与 Poincaré 对偶补项的说明 pp.454–456；「not at this point important」句 p.456；KK 荷 BPS 多重态 = 高维无质量多重态 (B.5.9)–(B.5.12) pp.456–457"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-appB.md#E27，证据等级 L1（原书页图）。
      抽取者已逐行复算 scalars / vectors 两列与 (B.5.7)(B.5.8) + 对偶补项一致（§0.3d）：
      d=4(k=7) 28+35+7=70、vectors 7+21=28；d=5(k=6) 21+20+1=42、6+15+6=27；d=3(k=8) 36+56+28+8=128；
      d=6 15+10=25、5+10+1=16；d=7 10+4=14、4+6=10；d=8 6+1=7、3+3=6；d=9 3、2+1=3；10A 1、1。
      ⚠ 这是自洽性核对，不是独立推导；`G`、`H` 两列**无法**这样核对。
tags: [supergravity, moduli-space, 32-supercharges, u-duality, exceptional-groups, polchinski-appendix-b]
notes: |
  【为什么 definition 而不是 proposition】本卡登记的是一张**分类表**（每个 `d` 的场内容与模空间形式），
  作为下游引用的记号/事实库；原书自己把它定位为参考材料（「not at this point important」）。
  `status: physical-argument`：表的 `G/H` 两列没有论证，且依赖未定义的低能有效作用量。

  【`uses` 为什么指向 BPS 卡】(B.5.9)–(B.5.12) 一段用 `d = 4` 的中心荷 BPS 分析（`q_i` 全相等 ⇒ 超短表示）
  说明「KK 荷的 BPS 多重态就是高维的无质量多重态」；这是本节唯一实质用到 App. B §B.2 结果的地方。
  ⚠ 该 BPS 分析同样只覆盖点粒子荷（p.448 逐字「The same caveat applies to the higher-dimensional
  algebras to be introduced later in this appendix」）——表里的 `G/H` 与膜荷无关，但任何从本卡
  出发讨论 BPS 谱的下游卡都必须带上这条限定。

  【记号陷阱】(B.5.2) 用 `A_3` 记十一维 3-形式势，p.454 同节却用 `B_{μνσ}`（抽取记录 Q8）。
  本卡统一用 `A_3`；引用原书时注意两种记号指同一场。

  【低优先】抽取记录 §5-C 把本卡列为"低优先"，理由是原书自称细节不重要。建它的价值在于：
  ch.14（U 对偶）与 compact 区的卡将来需要一个可引的 `G/H` 事实库，且 `E_{7(7)}`、`E_{8(8)}` 这些
  记号在图里首次出现时应有出处。
