id: susy.supergravity-multiplets-32-supercharges
kind: definition
status: physical-argument
title: 32 超荷超引力在 d ≤ 10 的标量 / 矢量计数与模空间 G/H（Polchinski Table B.3）
statement: |
  **设定**：把 `d = 11` 超引力在 `k = 11 − d` 个方向上作环面维数约化，只保留无质量场，
  得到 `d` 维的 32 超荷超引力。标量数由 (B.5.7) `½k(k+1)`（来自 `G_{mn}`）与
  (B.5.8) `(1/3!)k(k−1)(k−2)`（来自 `A_{mnp}`）再加 Poincaré 对偶给出的补项构成；
  矢量数为 `k + ½k(k−1)` 再加补项。规范群在模空间一般点是 `U(1)^{n_V}`。

  **定义/登记的内容**：下表（Table B.3, p.455）给出每个 `d` 的标量数、矢量数，以及低能超引力的
  对称群 `G` 与模空间局部形式 `G/H`。表题逐字：「*Supergravities with 32 supercharges. The group `G`
  is a symmetry of the low energy supergravity theory, and the moduli space is locally `G/H`.*」

  | `d` | scalars | vectors | `G` | `H` |
  |---|---|---|---|---|
  | 10A | 1 | 1 | `SO(1,1,R)` | - |
  | 10B | 2 | 0 | `SL(2,R)` | `SO(2,R)` |
  | 9 | 3 | 3 | `SL(2,R) × SO(1,1,R)` | `SO(2,R)` |
  | 8 | 7 | 6 | `SL(2,R) × SL(3,R)` | `SO(2,R) × SO(3,R)` |
  | 7 | 14 | 10 | `SL(5,R)` | `SO(5,R)` |
  | 6 | 25 | 16 | `SO(5,5,R)` | `SO(5,R) × SO(5,R)` |
  | 5 | 42 | 27 | `E_{6(6)}(R)` | `USp(8)` |
  | 4 | 70 | 28 | `E_{7(7)}(R)` | `SU(8)` |
  | 3 | 128 | - | `E_{8(8)}(R)` | `SO(16,R)` |

  另附原书同节的两句：标量「there is no potential — the scalars are moduli — and the moduli space
  metric is completely determined by symmetry」；以及 p.456 逐字
  「**The details of table B.3 are not at this point important**, but it is interesting to see in
  chapter 14 how the structure fits into string theory.」

  **本卡不断言**：
  (a) 表中 `G`、`H` 的任何推导。原书只说「completely determined by symmetry」，没有给出论证，
      也没有引用（全附录零引用）。
  (b) 这些 `G` 是精确的 U 对偶群或其离散化。附录只说 `G` 是**低能超引力**的对称性；
      离散化到 `G(Z)` 的那一步在 ch.14，本卡不含。
  (c) 各 `d` 的费米子内容。
uses_conventions: [conv.metric-mostly-plus]
uses:
