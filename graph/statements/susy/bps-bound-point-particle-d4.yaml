id: susy.bps-bound-point-particle-d4
kind: proposition
title: d = 4 扩展超对称的 BPS 界 m ≥ q_i（**仅限点粒子可携带的中心荷**）与短 / 超短表示的计数
statement: |
  **设定（适用域，是陈述的一部分）**：`d = 4`，`N` 重扩展超对称，号差 `(−+++)`，超荷 `Q^A_α` 取 Majorana。
  取**只含点粒子可携带的守恒荷**的超对称代数——原文逐字（p.448，此句是本卡适用域的全部内容）：

  「**To be precise, this is the most general algebra if we include only charges that can be carried by
  point particles. Including charges that can be carried by *extended objects*, additional terms appear.
  Rather than explain this here, we introduce it in its natural physical context: first in section 11.6,
  and then in more variety in chapter 13. The same caveat applies to the higher-dimensional algebras to
  be introduced later in this appendix.**」

  在该限定下，代数是
    `{Q^A_α, Q̄^B_β} = −2δ^{AB}P_μΓ^μ_{αβ} − 2iZ^{AB}δ_{αβ}`,                 (B.2.36a)
    `[P^μ, Q^A_α] = [Z^{AB}, Q^C_α] = [Z^{AB}, P_μ] = [Z^{AB}, Z^{CD}] = 0`,   (B.2.36b)
  其中 `Z^{AB}` 是一组守恒荷，**由 Majorana 性质与荷共轭矩阵 `C` 的反对称性**必须在 `AB` 上反对称。

  **命题**：
  (i) 静止系中代数取 `{Q^A_α, Q^{B†}_β} = 2mδ^{AB}δ_{αβ} + 2iZ^{AB}Γ^0_{αβ}`（(B.2.37)）。
      取 `Z^{AB}` 的本征态并转到 skew 标准基
      `Z^{AB} = [[0, q_1, 0, 0], [−q_1, 0, 0, 0], [0, 0, 0, q_2], [0, 0, −q_2, 0], …]`（(B.2.38)），`q_i ≥ 0`。
  (ii) (B.2.37) 左端作为 `(Aα, Bβ)` 的矩阵是非负的，故右端的本征值 `2(m ± q_i)` 也必须非负，于是得
      **Bogomolnyi–Prasad–Sommerfield (BPS) 界**
        **`m ≥ q_i`**                                                          (B.2.39)
      特别地**无质量态必须不带荷**。
  (iii) 表示的计数：`m` 严格大于所有 `q_i` 时有质量表示不受影响，含 `2^{2N}` 个态；
      最大的 `k` 个 `q_i` 彼此相等且等于 `m` 时，代数要求 `2k` 对费米振子湮灭这些态，
      给出**短（BPS）表示**，含 `2^{2(N−k)}` 个态；全部 `q_i` 相等且等于 `m` 时是**超短表示**，
      维数 `2^N`（`N` 偶），与无质量表示相同。

  **本命题不断言**：
  (a) **扩展物体（膜）携带的中心荷**。原书明写这些项不在本附录（上引 p.448 逐字），推给 §11.6 与 ch.13。
      ⇒ 见 susy.brane-charges-in-susy-algebra。**本卡不得被用作 D 膜 BPS 性或 `τ_p = μ_p` 的依据。**
  (b) (B.2.36) 是「洛伦兹不变性允许的最一般代数」这一唯一性主张的证明。原书只写
      「The most general extended supersymmetry algebra allowed by Lorentz invariance is」，
      无证明、无引用（Haag–Łopuszański–Sohnius 全附录未被提及）。
  (c) 高维（`d = 10, 11` 等）的 BPS 界。原书逐字「The same caveat applies to the higher-dimensional
      algebras to be introduced later in this appendix」；附录里的高维代数 (B.5.1)(B.5.4)(B.5.5)(B.6.12)
      只含动量与 Kaluza–Klein 荷，不含膜荷。
uses_conventions: [conv.metric-mostly-plus]
sources:
  - ref: polchinski-1998-v2
    loc: "App. B §B.2 *Extended supersymmetry in d = 4*, eqs. (B.2.36a,b)(B.2.37)(B.2.38)(B.2.39), pp.448–449；点粒子限定的逐字段落在 (B.2.36b) 之后 p.448；短/超短表示的计数在 (B.2.39) 之后 p.449"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-appB.md#E21，证据等级 L1（原书页图）。
      ⚠ 「most general algebra allowed by Lorentz invariance」无证明；BPS 界本身的论证（正定性）是完整的。
  - ref: polchinski-1998-v2
    loc: "App. B §B.2, (B.2.35) p.447（不带中心荷的 N 重代数，原书逐字「This is not the most general algebra」）；(B.1.24)–(B.1.28) pp.434–435（荷共轭矩阵 C 的性质，Z^{AB} 反对称性的依据）"
    note: 抽取记录 #E20、#E11（L1）。
  - ref: polchinski-1998-v2
    loc: "App. B 导言 pp. 439–440 逐字：「The reader should be able to follow the derivation of the various representations (massless, standard massive, and BPS massive). However, the transformations and actions require detailed calculation, and so for these we simply cite for reference some of the key results.」"
    note: |
      抽取记录 #E15 备注（L1）。原书自陈：表示（无质量 / 标准有质量 / BPS 有质量）的推导读者可跟随，
      而变换与作用量只引述结果。本卡只用到表示层，故这句话覆盖本卡 (iii) 的全部内容。
      〔2026-09-11 去重并入：本条是并行建卡 branes.bps-bound-point-particle-d4 的独有证据。〕
tags: [supersymmetry, bps, central-charge, d4, extended-supersymmetry, short-multiplet, polchinski-appendix-b]
notes: |
  【★ 这张卡的边界是本轮抽取最重要的结论之一】App. B 的 BPS 界**只覆盖点粒子中心荷**。
  抽取记录 Q3 明写：`branes.d-brane-bps-no-force` / `branes.d-brane-bps-half-susy` 的 BPS 性
  **不能整体外包给 App. B**；App. B 在 branes 区的角色是「模板 + 正定性论证」，不是 D 膜 BPS 界的来源。
  D 膜那一侧的代数来源是 §13.2 (13.2.9)，见 susy.brane-charges-in-susy-algebra
  （而 (13.2.9) 原书自承「still not complete」）。

  【为什么 physical-argument】(ii) 的正定性论证本身是完整的有限维线性代数（矩阵非负 ⇒ 本征值非负），
  但本卡的前提 (B.2.36) 是无证明的唯一性断言，且 `Z^{AB}` 反对称性依赖 math.clifford-majorana-weyl-mod-8
  一侧同样只有断言的 `C` 性质。按 docs/STATUS_LEVELS.md「断言 + 骨架」档位 ⇒ physical-argument，
  缺口逐条写进推导卡 gaps，不压成 conjecture。

  【去重裁决（2026-09-11）】两个并行 curator 各建了一版同一命题（本卡与 `branes.bps-bound-point-particle-d4`，
  两版都已进过 main）。lead 裁决**保留本卡**，branes 版标 `superseded_by: susy.bps-bound-point-particle-d4`。
  branes 版独有的逐字证据、gaps 与「不断言」条目已并入本卡与本卡推导（逐条标〔并入〕）；
  **statement 未改动**。branes 版的旧推导 `branes.bps-bound-point-particle-d4--via-positivity-of-anticommutator`
  按 docs/STATUS_LEVELS.md「旧推导的去留」保留作历史记录（validate 会报 stale 警告，是预期的）。

  【★ 本卡也不断言任何弦论内容】〔并入 branes 版「不断言 (d)」〕App. B 全篇不含 α'、不含弦振幅；
  本卡是纯场论（`d = 4` 扩展超对称代数）的命题，任何弦论结论都不能只挂本卡。

  【红线（appB 抽取记录 §3.2）】〔并入 branes 版〕App. B 中**无** "triality" 一词、**无** SO(8) 意义的 **56**
  （p.448 出现的 56 是 `d = 4, N = 8` 的螺旋度 ∓½ 态数，与 SO(8) 无关）、**无**世界面 R 扇区零模 `ψ_0^μ`、
  **无**膜荷代数。本卡不涉及这四项，引用本卡时也不得据此断言它们。

  【本卡在 branes 区的角色 = 模板 + 正定性论证】〔并入 branes 版〕D 膜链上的引用点：
  `branes.d-brane-bps-half-susy` 借用的是本卡给出的**概念**（「BPS 态 = 被一半超荷湮灭的短表示」），
  原书背书是 ch.13 p. 141 逐字「BPS states, which are discussed in section B.2」（另见 p. 140 斜体
  「*it is a BPS state*」）。链条为：本卡 → susy.brane-charges-in-susy-algebra（(13.2.9)）→ branes.d-brane-bps-no-force。
  **不得**把 (B.2.39) 直接当作 D 膜张力–荷等式 `μ_p = e^{Φ₀}τ_p` 的依据（appB 抽取记录 Q3）。

  【下游】susy.brane-charges-in-susy-algebra（把 (B.2.36) 扩展到膜荷）、
  consistency.eleven-is-maximal-supersymmetric-dimension（用 `N = 8` ⇒ 32 超荷这一上界）。
