notes: |
  **本项目原创定义，非对已发表公式的字面转录。** 是 holography.torsion-index-divisor-operator
  （Q-重标：ρ 方向即电荷 m=Q²/2 被重标）的镜像算子，重标方向换成 σ（磁荷 n=P²/2）。

  **判据是槽位而非字母**：与 proof.md §0 的强调一致——"Which charge is divided is the only
  safe identifier"。AN 的字母顺序 (n=Q²/2 在前, m=P²/2 在后) 容易让人以为其 eq(2.13) 与
  DGM eq(3.28) 是同一算子（字母位置对齐），但检验「乘 s² 的是哪个物理量」后，AN 除的是
  磁荷，是本卡定义的 D'_I，不是 DGM 的 D_I。

  **BCP 1806.03330、CNR 2007.10302 未登记 literature/sources.bib**：本卡提到这两篇文献作为
  P-重标族的文献实现，但因本卡写入范围不含 literature/，未把它们登记为 bib key，故本卡
  sources 不直接引用其 key，只转引 proof.md 中对它们的逐字核实（reviewer L1 级页面图像核对）。
  **建议 lead 转派 researcher 登记 arXiv:1806.03330（Bossard–Cosnier-Horeau-Pioline）与
  arXiv:2007.10302（Cardoso–Nampuri–Rosselló）到 literature/sources.bib**，登记后可把 BCP
  补进本卡 sources 作为 D'_I 的第二条独立文献佐证。

  **BSS 曾被本项目预注册猜测为 P-重标族**（research/papers/torsion-dyon-shift-positivity/
  paper.md §9 line 350 称文献除子和公式"rescale P rather than Q"并点名 BSS 族），经本
  attempt 逐字核对 arXiv PDF 后**推翻**：BSS 实际把电荷 Q²/2 放进乘 s² 的槽位，是
  Q-重标的带号变体，见 holography.rescaling-bss-is-signed-q-rescaling。这条纠正涉及
  research/papers/**，本卡写入范围不含该目录，已作为交接事项写入本 attempt 的
  status.yaml notes「CROSS-TASK MESSAGES FOR THE LEAD」，此处不重复处理，只作为本卡命名
  与陈述准确性的依据引用。
