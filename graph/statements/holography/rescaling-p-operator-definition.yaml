id: holography.rescaling-p-operator-definition
kind: definition
status: rigorous
title: P-重标挠指标算子的定义：D'_I(m,n,ℓ) := Σ_{s|I} s·d_*(m,n/s²,ℓ/s)
statement: |
  沿用 holography.torsion-index-divisor-operator 的约定（T(m,n,ℓ)=[[m,ℓ/2],[ℓ/2,n]]，
  m=Q²/2 挂在 ρ 上、n=P²/2 挂在 σ 上、ℓ=Q·P 挂在 v 上；d_* 为单位挠免死指标）。
  定义**磁荷重标算子** 𝒱'_s F(ρ,σ,v) := F(ρ, s²σ, sv)（把 σ 方向按 s² 重标，是
  holography.torsion-index-divisor-operator 的 𝒱_s F(ρ,σ,v)=F(s²ρ,σ,sv)（ρ 方向重标）
  在 ρ↔σ 互换下的镜像算子），以及对应的挠指标生成函数 𝒢'_I := Σ_{s|I} s·𝒱'_s𝒢。
  对 (m,n,ℓ)∈ℤ³ 满足 I²|n、I|ℓ、m,n≥1、Δ=4mn−ℓ²>0，定义
    D'_I(m,n,ℓ) := Σ_{s|I} s·d_*(m, n/s², ℓ/s)  （**P-重标算子**；s²∤n 或 s∤ℓ 的项记 0）。
  I=1 时 D'_1 = d_*。

  **与文献的对齐（判据是「哪个变量乘 s²」，不是字母对齐）**：
  Alexandrov–Nampuri arXiv:2009.01172 eq(2.13) Ω_I(n,m,ℓ)=Σ_{d|I} d·Ω₁(n,m/d²,ℓ/d)，
  以其 eq(2.6) 固定 m=P²/2（磁荷）——被除的是磁荷槽位，与本卡的 D'_I 是同一算子
  （AN 的字母 n 挂电荷、m 挂磁荷，与本卡 m 挂电荷、n 挂磁荷相反；逐字比对见 sources）。
  Bossard–Cosnier-Horeau-Pioline arXiv:1806.03330 eq(5.80)（Gram 矩阵
  (Q²,QP/d;QP/d,P²/d²)）同样把磁荷 P² 除以 d²，是 D'_I 的另一独立文献实现（该文献本卡不
  直接引用其 bib key，因尚未登记 literature/sources.bib；转引自本项目 proof.md，见下方 notes）。

  **Banerjee–Sen–Srivastava arXiv:0802.1556 不属于这一族**：其 eq(1)+(2)+(4) 把 Q²/2 放在
  乘 s² 的 σ̌ 槽位（磁荷 P²/2 反而不被除），因此 BSS 实为
  holography.torsion-index-divisor-operator 所定义算子的一个带号变体（见
  holography.rescaling-bss-is-signed-q-rescaling），不是本卡定义的 D'_I。
uses:
  - holography.torsion-index-divisor-operator
