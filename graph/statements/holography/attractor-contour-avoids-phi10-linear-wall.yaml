tags: [bh-entropy, mock-modular, n4-string-theory, number-theory]
notes: |
  【论证，curator 亲自 Read proof.md §4 全文（4.1-4.5）核对】n2=0 时 Lemma 1
  给出的 (I)/(R) 方程组化简为：(I0) jℓ+2mn1−2nm1=0（Λ 无关，纯整数约束），
  (R0) n1σ1−m1ρ1+jv1+m2=0（m2 完全自由，只受此式约束）。**关键点**：n2=0 时
  能否找到 Ω∈C_* 落在此分支上，完全由 (I0) 单独决定——一旦 (I0) 在整数
  (m1,n1,j) 上无解，围道自动避开（不需要再讨论 (R0)/m2/Λ 大小）。三步初等
  数论论证证明 (I0)（配合判别式 4m1n1+j²=1）在 0<ℓ≤m≤n 下恒无整数解：
  引理 A（宇称）——ℓ 奇时 jℓ 奇但 2(mn1−nm1) 偶，矛盾，故 ℓ 奇直接排除；
  引理 B（j 的界）——ℓ 偶、ℓ>0 时，代数换元 u:=nm1+mn1, w:=mn1−nm1=−jℓ/2
  给出恒等式 u²=mn−(Δ/4)j²，结合 0<ℓ≤m≤n⟹9ℓ²<32mn 的初等不等式链，
  得 j²≤4mn/Δ<9，故（j 奇）j=±1 是唯一候选；引理 C（排除 j=±1）——对
  j=±1 的四种子情形逐一反解 (m1,n1)，全部落在开区间 (0,1/2] 或 [-1/2,0) 内
  的非整数值，矛盾。四种情形穷尽（ℓ 奇 / ℓ 偶且 j=±1 的 4 个子情形），
  (I0) 无整数解，故整个 n2=0 族（对一切 (m1,m2,j) 而非仅某个具体分支）
  在 Δ>0 的完整参数范围内都不可能与围道相交。proof.md §6 用 10 组 (n,m,ℓ)
  样本、7 个 Λ 值的网格搜索健全性检查（不构成独立证明，只是数值一致性
  检查）与本卡结论一致：ℓ>0 样本的 argmin 落在 j=±1 但 (m1,n1) 非整数插值点
  上，min|F|²>0 且随 Λ² 增长。无缺口。

  **本结果比原委托目标更强**：不需要"存在 Λ₀ 使 Λ>Λ₀"，对**一切** Λ>0 都成立
  ——因为障碍是纯数论层面的（(I0) 在整数上无解），与几何/解析大小完全无关。

  【与既有图节点的关系，仅报告不修正】同姐妹卡
  holography.attractor-contour-hits-phi10-zero-at-ell-zero 的 notes 已详细
  记录：holography.igusa-cusp-form-phi10（"单零点"）与
  holography.phi10-wall-crossing-poles（"判别式 4mn−l²=1，故极点为单零点"）
  两张已提交的卡，其零点重数断言（重数 1）与本卡引用的 Sen 2008 D.19/GN1996
  （重数 2）冲突。本卡同样刻意不依赖这两张卡（本卡论证完全不需要重数信息，
  只需要"(I0) 无整数解"这一集合论/数论事实），避免继承冲突断言。此外，
  这两张已有卡的零点轨迹描述（"{mρ+nσ+lv∈ℤ, 4mn−l²=1}"，即只含线性
  超平面）实际上只覆盖 D.19 的 n2=0 子族，**未提及** n2≠0 的二次分支
  ——这是除多重性外，curator 发现的第二处、范围完整性上的潜在遗漏，
  一并报告给 lead，供转 auditor 判断是否需要补充/规范化这两张卡。

