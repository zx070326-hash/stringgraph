id: holography.attractor-contour-avoids-phi10-linear-wall
kind: proposition
title: "0<ℓ≤m≤n 时吸引子围道对一切 Λ>0 完全避开 Φ₁₀ 的「线性壁」（n2=0）零点分支"
statement: |
  记号（同姐妹卡 holography.attractor-contour-hits-phi10-zero-at-ell-zero；
  Sen 2008 (D.19) 的整数参数化）：Div(Φ₁₀) 的每个分支对应一组
  (m1,n1,m2,n2,j)∈ℤ⁵、j 奇、4m1n1+4m2n2+j²=1，零点条件
    F := n2(σρ−v²) + jv + n1σ − m1ρ + m2 = 0。
  **「线性壁」分支** := 满足 n2=0 的所有分支（此时 F 关于 (ρ,σ,v) 是线性的）。
  吸引子围道 C_*(m,n,ℓ;Λ) := { Ω=(ρ,v;v,σ) : Re ρ,Re σ,Re v∈[0,1],
  Im ρ=2nΛ, Im σ=2mΛ, Im v=ℓΛ }（ε=+1 约定）。

  设整数 n≥m≥1、**0<ℓ≤m**、Δ:=4mn−ℓ²>0。则对**一切** Λ>0：C_*(m,n,ℓ;Λ) 与
  Div(Φ₁₀) 的**每一个 n2=0 分支**（即一切满足 n2=0、4m1n1+j²=1、j 奇的
  (m1,n1,m2,j)）都**不相交**。

  换言之：F=0（对某 n2=0 分支）与 Ω∈C_*(m,n,ℓ;Λ) 联立，在 0<ℓ≤m≤n、Δ>0 的
  条件下，对一切 Λ>0 都无解 (m1,n1,m2,j,ρ1,σ1,v1)（ρ1,σ1,v1∈[0,1]）。

  【本节点明确不断言】n2≠0 的「二次壁」分支（Div(Φ₁₀) 的其余部分）是否也被围道
  避开——这是姐妹研究（research/attempts/gap-102b-route-a/proof.md §5）明确
  留下的未闭合 [GAP-n2]，本节点边界严格限于 n2=0 的分支。
