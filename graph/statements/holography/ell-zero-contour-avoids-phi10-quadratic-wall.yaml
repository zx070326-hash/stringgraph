    note: "D.19 的五参数零点族；本卡的「n₂≠0 分支」即其中 n₂≠0 的子族。"
tags: [bh-entropy, mock-modular, n4-string-theory, number-theory]
notes: |
  【Re v 不设限的理由，curator 亲自核对两条独立论证】
  (1) Proposition 7 的顶点高度闭式 `Λ²(t*) = 1/(4n₂²Δ) − (j − 2n₂v₁)²/(16mnn₂²)` 里，
      v₁ 只出现在**被减去的平方项**中，故一致界 `Λ²(t*) ≤ 1/(4n₂²Δ) ≤ 1/(4Δ)` 对
      **一切实 v₁** 成立，不限于 [0,1]。
  (2) 独立地：(D.19) 的 n₂≠0 子族在 v ↦ v+1 下自我映射（curator 亲自验算：
      代入后 j' = j−2n₂ 仍奇、m₂' = m₂+j−n₂，判别式 4m₁n₁+4m₂'n₂+j'² = 4m₁n₁+4m₂n₂+j²
      = 1 不变），故「避开 Re v∈[0,1]」自动给出「避开 Re v∈[1/2,3/2]」。
  下游（holography.phi10-order-two-in-v-on-ell-zero-contour）需要的正是平移后的窗口
  Re v ∈ [1/2,3/2]，故本卡把 Re v 放开写。

  【承重上游 [GAP-identify]】本卡 statement 断言的是关于 **Div(Φ₁₀)** 的事，而计算
  做在 **(D.19) 的 F=0 族**上；两者之间隔着 holography.sen-d19-family-is-igusa-phi10-divisor
  （effective physical-argument）。这条边是显式接上的，不藏在 inferred 里；它也是本卡
  effective 状态被压到 physical-argument 的原因之一。

  【与姐妹卡的关系】姐妹卡 holography.attractor-contour-avoids-phi10-quadratic-wall
  的 statement 里有一段「ℓ=0 可外推」的说明（proof.md §5.7 全节没有一步除以 ℓ），
  但它同时逐字声明「本卡的主陈述范围仍写 0<ℓ≤m」。**那段说明不是被断言的命题**，
  因此不能当砖块用——这正是本卡存在的理由。本卡也不把姐妹卡接成依赖：ℓ=0 的结论
  不是 0<ℓ≤m 结论的逻辑后承，接上去会造成假的支撑关系。

  【查重】`uv run stringgraph search` 查 `wall` / `围道` / `ell` / `attractor`
  （2026-09-20）：holography.attractor-contour-avoids-phi10-quadratic-wall（0<ℓ≤m，
  见上条）、holography.attractor-contour-hits-phi10-zero-at-ell-zero（ℓ=0 但断言的是
  **命中**线性分支 v=0，互补不重叠）为仅有的相关命中，无同内容卡。

  【毕业记录】本节点由 research/attempts/ell-zero-wall-degeneracy/ 的 §6.1 毕业，按
  research/CLAUDE.md 生命周期第 4 步。proposition 禁止手填 status，有效状态由推导决定。
  【2026-09-20 晚更新】该 attempt 一度退回 `state: draft`，退回理由正是本卡所据 §6.1 的
  量词缺口 F-5；F-5 同日关闭后已回到 `state: verified`，详见 sources note。
  captain_confirmed 仍为 false。
