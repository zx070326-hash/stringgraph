id: holography.ell-zero-contour-avoids-phi10-quadratic-wall
kind: proposition
title: "ℓ=0 时吸引子围道对 Λ > 1/(4√(mn)) 完全避开 Φ₁₀ 的「二次壁」（n₂≠0）零点分支"
statement: |
  记号（与姐妹卡 holography.attractor-contour-avoids-phi10-quadratic-wall 逐字相同，
  取 Sen 2008 (D.19) 的整数参数化）：Div(Φ₁₀) 的每个分支对应一组
  (m₁,n₁,m₂,n₂,j) ∈ ℤ⁵、j 奇、4m₁n₁+4m₂n₂+j² = 1，零点条件
    F := n₂(σρ − v²) + jv + n₁σ − m₁ρ + m₂ = 0。
  **「二次壁」分支** := 满足 n₂ ≠ 0 的所有分支。吸引子围道（ε=+1 约定）
    C_*(m,n,ℓ;Λ) := { Ω = (ρ,v; v,σ) : Re ρ, Re σ ∈ [0,1], Re v ∈ ℝ,
                      Im ρ = 2nΛ, Im σ = 2mΛ, Im v = ℓΛ }。
  （本卡对 Re v 不设限：下游用到的是半周期平移后的 v-窗口 Re v ∈ [1/2,3/2]，
  而本卡的障碍对一切实 Re v 一致成立，见 notes。）

  设整数 n ≥ m ≥ 1、**ℓ = 0**（故 Δ := 4mn − ℓ² = 4mn > 0）。则取
    Λ₀ := 1/(4√(mn)) = 1/(2√Δ)，
  对一切 Λ > Λ₀：C_*(m,n,0;Λ) 与 Div(Φ₁₀) 的**每一个 n₂ ≠ 0 分支**都**不相交**。

  【为什么不能直接用姐妹卡】姐妹卡 holography.attractor-contour-avoids-phi10-quadratic-wall
  的主陈述对 **0 < ℓ ≤ m** 全称量化，**不包含 ℓ = 0**；本卡断言的是它在 ℓ=0 这个
  边界处的类比，必须单独立卡（graph/CLAUDE.md 2026-09-15 裁决的判据：被依赖的节点
  是否完整承载我需要的那句话——不承载，故立卡）。

  【本卡明确不断言】(i) n₂ = 0 的线性分支（见 holography.ell-zero-contour-avoids-phi10-linear-wall-off-origin
  与 holography.attractor-contour-hits-phi10-zero-at-ell-zero：其中 m₁=n₁=0 的子族
  **确实**命中围道）；(ii) 把 v 的虚部微扰到 ±εΛ ≠ 0 后的带内情形（Im v ≠ 0 时本卡
  的推导未重做，见 holography.dstar-well-defined-at-ell-zero 的处理）。
uses:
  - holography.igusa-cusp-form-phi10-v2
  - holography.sen-d19-family-is-igusa-phi10-divisor
uses_conventions: []
sources:
  - ref: stringgraph-research-2026
    loc: "research/attempts/ell-zero-wall-degeneracy/proof.md §6.1（引理 6.1：验证 gap-102b-route-a §5.7 的 Proposition 7 / Corollary 8 / Theorem 9 在 ℓ=0 处无退化）；所引机制本身在 research/attempts/gap-102b-route-a/proof.md §5.7"
    note: |
      本项目原创证明，非已发表文献，见 research/attempts/ell-zero-wall-degeneracy/proof.md §6.1
      与 research/attempts/gap-102b-route-a/proof.md §5.7。
      **审查状态（要害，务必读；2026-09-20 晚更新）**：被引的 Theorem 9 本身（0<ℓ≤m）
      已经 graph-reviewer agent n2rev（2026-09-20）对抗性审查裁定 verified、天花板 rigorous。
      把它搬到 ℓ=0 的那一步（§6.1）**已于 2026-09-20 晚由 graph-reviewer ell0s6rev 审查**
      ——本行原写「至今未经 graph-reviewer 审查」，已过时。审查结论分两半：
      **三步核对的数学判 VERIFIED**；但发现**量词覆盖缺口 F-5**——§6.1 逐字只对
      `n ≥ m ≥ 1` 陈述，而本卡 statement 设 `m, n ≥ 1`，故 **`m > n` 的情形一度无论证**。
      **F-5 已于同日关闭**：prover 放开量词（引理 6.1 现逐字对 `m, n ≥ 1` 陈述，
      证明重组为 5 步，另附 ρ↔σ 对称性旁证），graph-reviewer **ell0f5rev** 独立复审
      （**不**核 prover 自列的范围审计表，而是自己回 route-a 逐处查 `n≥m` 的出现、
      并从 §2 Lemma 1 的 (I) 原始定义重推 ℓ=0 的解，确认**分母 `n·n₂` 与 `m` 无关**），
      裁决 6/7 CLEAR，唯一 DEFECT 为形式性且已由 lead 补上。
      ell-zero-wall-degeneracy 现回到 `state: verified`；两个 attempt 的
      captain_confirmed 均为 false。
      **量词放开只增不减，本卡不需换代、断言未变。**
      推导 status 因此于本轮按 docs/STATUS_LEVELS.md 等级 4 例外条款升为 **rigorous**
      （两轮 reviewer-verified 写入推导 notes）；**本卡 effective 不变**，仍被
      holography.sen-d19-family-is-igusa-phi10-divisor 的 [GAP-identify] 封顶在
      physical-argument。
  - ref: sen-2008-precision-counting
