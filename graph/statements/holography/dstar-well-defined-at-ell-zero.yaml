      graph-reviewer **ell0f5rev** 独立复审（从 route-a Lemma 1 的原始定义重推 ℓ=0 的
      σ₁ 解，确认分母 `n·n₂` 不含 m）裁决 6/7 CLEAR，唯一 DEFECT 为形式性且已补；
      上游 attempt 现回到 **`state: verified`**。**本卡断言未变、不需换代**
      （量词放开只增不减）。详见推导
      holography.dstar-well-defined-at-ell-zero--via-vanishing-residue 的 gaps。
