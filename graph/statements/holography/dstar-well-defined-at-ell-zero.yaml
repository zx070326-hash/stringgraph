      ⚠ **曾退回 draft 的理由不是 §6 有误，而是量词缺口（F-5）——该缺口已于同日关闭**：
      proof.md §6.1 原逐字只证 `n ≥ m ≥ 1`，而本卡 statement 设 `m, n ≥ 1`，故
