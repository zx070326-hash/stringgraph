notes: |
  【先行工作——照 literature/notes/ell-zero-wall-residue-prior-art.md 第 189 行的建议措辞】
  结论（ℓ=0 时壁跨越跳变为零，壁透明）与 Denef–Moore 2007 壁跨越公式一致。机制性推导
  （从 Φ₁₀ 的 v-偶性与二阶零点通过留数演算得出 Res ∝ ℓ）在已检索文献中未找到
  （Sen 2007/2008、Cheng–Verlinde 2007、DGM 2008、Rosselló 2024、BSS 2023；检索盲区见
  literature/notes/ell-zero-wall-residue-prior-art.md）。本推导不依赖 Denef–Moore 的
  多中心 BPS 分析，仅用 Φ₁₀ 的解析性质，在方法论上独立。**不作「首次」类主张**——
  检索有明确盲区（Sen 2010 综述、Murthy–Pioline–Manschot 系列、纯数学 Siegel 模形式
  文献、KS 2008、DMZ 2012 技术附录等，见该文件「未覆盖」一节）。

  【物理读法（诠释，不是本卡的数学断言）】ℓ = Q·P = 0 的 dyon 落在边缘稳定壁上，
  壁跨越跳变 Δd ∝ ⟨Γ₁,Γ₂⟩ = Q·P 退化为零，即这堵墙对指标是「透明」的。相应的数学
  形式化记在 holography.dvv-wall-crossing-identification（physical-argument，
  Δd = (−1)^{Q·P+1}(Q·P)·d_{1/2}(Q²/2)·d_{1/2}(P²/2)）。**本卡不断言这条物理识别**。

  【与 holography.attractor-contour-hits-phi10-zero-at-ell-zero 的分工】那张卡断言
  「ℓ=0 时围道恒经过 Φ₁₀ 的零点，原始『围道避开零点』命题在此边界不成立」，并明确
  不处理 d_* 该如何定义（其 notes 逐字留了 [GAP-ℓ0]）。本卡正是补上那一步：
  围道穿过极点，但留数为零，故 d_*(m,n,0) 自动良定。两卡互补，不冲突。

  【为什么 (a) 也写进断言】(a) 不是背景说明而是承重的：没有它，读者会以为定义 D
  在 ℓ=0 处照常适用，从而看不出 (b) 的必要性。(a) 的内容由上述姐妹卡 + v-周期性给出。

  【查重】`uv run stringgraph search` 查 `ell` / `wall` / `residue` / `留数` / `围道` /
  `良定` / `transparent`（2026-09-20）：无同内容卡；相关命中为
  holography.attractor-contour-hits-phi10-zero-at-ell-zero（见上条）、
  holography.torsion-index-divisor-operator（定义）、
  holography.mock-jacobi-coefficient-positivity / holography.torsion-immortal-positivity
  （正性，本卡不涉及）、holography.dvv-wall-crossing-identification（物理识别）。

