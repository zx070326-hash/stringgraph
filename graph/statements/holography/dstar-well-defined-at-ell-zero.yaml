id: holography.dstar-well-defined-at-ell-zero
kind: proposition
title: "ℓ=0（Q·P=0）时 d_*(m,n,0) 自动良定：围道穿过二阶极点，但留数为零，微扰围道两侧给出同一值"
statement: |
  记号（Rosselló 2403.19630 / holography.torsion-index-divisor-operator 的定义 D，取 I=1）：
    𝒢(ρ,σ,v) := −1/Φ₁₀(ρ,σ, v+1/2)，
    C_*(m,n,ℓ;Λ) := { Ω=(ρ,v; v,σ) : Re ρ, Re σ, Re v ∈ [0,1],
                      Im ρ = 2nΛ, Im σ = 2mΛ, Im v = ℓΛ }（ε=+1 约定），
    d_*(m,n,ℓ) := ∫_{C_*(m,n,ℓ;Λ)} dρ dσ dv · 𝒢(ρ,σ,v) · e^{−2πi(mρ+nσ+ℓv)}。
  **约定声明（承重，勿略）**：本卡用的是定义 D 的 d_*；它与 Rosselló (2.23) 的 d_* 差
  一个整体负号，d_*^{定义D} = − d_*^{Rosselló}（半周期平移写在 𝒢 定义内并带整体负号 vs
  写在指数内）。本卡断言的是**良定性**，与整体符号无关，故对两套约定同时成立；
  但**正性**（Rosselló Cor 1.1 的 d_* > 0）说的是 d_*^{Rosselló}，不是本卡的 d_*。

  设整数 m, n ≥ 1，**ℓ = 0**（故 Δ = 4mn > 0），Λ₀ := 1/(4√(mn))。

  (a) **定义 D 的字面条件在 ℓ=0 处无法满足**：对一切 Λ > 0，围道 C_*(m,n,0;Λ) 上存在
      𝒢 的极点（v = 1/2，二阶），故定义 D 括号里的「Λ 充分大（使围道避开 𝒢_I 的全部极点）」
      在 ℓ=0 时对**任何** Λ 都不成立。ℓ=0 的 d_* 必须另行规定。

  (b) **微扰围道给出的规定是无歧义的**：记
        C_±(ε,Λ) := { Ω : Re ρ, Re σ, Re v ∈ [0,1], Im ρ = 2nΛ, Im σ = 2mΛ, Im v = ±εΛ }。
      则对每个 Λ > Λ₀ 存在 ε₀ = ε₀(m,n,Λ) > 0，使得对一切 0 < ε < ε₀：
      (b1) 被积函数在 C_+(ε,Λ) 与 C_−(ε,Λ) 上处处正则（两个积分都有定义）；
      (b2) ∫_{C_+(ε,Λ)} dρ dσ dv · 𝒢 · e^{−2πi(mρ+nσ)} = ∫_{C_−(ε,Λ)} dρ dσ dv · 𝒢 · e^{−2πi(mρ+nσ)}；
      (b3) 该公共值与 ε ∈ (0, ε₀) 无关。
      因此可以把 d_*(m,n,0) 无歧义地定义为这个公共值：**不需要主值规定，也不需要在
      「从哪一侧趋近壁」之间做选择**。

  (c) **机制**：围道**确实**穿过极点（(a)），但该二阶极点在 ℓ=0 处的留数为零
      （holography.phi10-shifted-pole-residue-proportional-to-ell：Res = (−1)^ℓ·2πiℓ/h₀，
      ℓ=0 时为 0），故两侧之差 = 0。**这不是「问题不存在」，而是「问题自动解决」。**

  【本卡明确不断言】
  (i) **Λ-无关性**：公共值是否与 Λ > Λ₀ 无关，本卡不断言（上游 attempt 的 claim.md
      写了「与 ε,Λ 无关」，但 ℓ=0 情形的 Λ-无关性在 proof.md 中未被证明；
      holography.mock-jacobi-coefficient-positivity 记录的 Λ-无关性论证适用于围道避开
      全部极点的情形，ℓ=0 不在其内）。
  (ii) d_*(m,n,0) 的**正性**（Rosselló Cor 1.1）。本卡只证该量有定义，使 Cor 1.1 在
      ℓ=0 处的断言**有意义**；正性本身见 holography.torsion-immortal-positivity /
      holography.mock-jacobi-coefficient-positivity。
  (iii) I ≥ 2 的挠指标 d_*^{(I)}（𝒢_I 有更多极点，本卡只处理 I=1）。
