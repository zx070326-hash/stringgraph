notes: |
  **本卡刻意把数学结论与物理前提分开陈列。**
  数学部分 (a)(b) 是纯数学定理（proof.md §6 的完整证明）；物理部分 (c) 额外依赖
  holography.dgm-torsion-divisor-sum（DGM eq 52 的正权除子和表示），是 physical-argument。
  因此本卡的 effective status 为 physical-argument：`uv run stringgraph why` 的瓶颈链
  应指向 dgm-torsion-divisor-sum。这正是 graph/CLAUDE.md 2026-09-15 裁决要求的形式——
  物理前提必须立成节点、正常沿图传播，不得塞进 `inferred` flag 蒙混。

  **(a)(b) 为何是纯数学**：
  (a) 𝒢_I = Σ_{s|I} s·𝒱_s𝒢 是有限和，由 attractor-contour-covariance 的 Cor 4.2 逐项积分
      （s|I ⟹ s²|I²|m 与 s|I|ℓ，Cor 4.2 前提满足）。
  (b) 每项 d_*(m/s²,n,ℓ/s) > 0 由 Rosselló Cor 1.1 保证（m/s²≥1、n≥1、Δ/s²>0，无 gcd 前提），
      权 s > 0 为正，故正和为正。
  两部分的纯数学证明不经过 mock 分解，故不受 [GAP 9.4]/[GAP 10.2b] 影响。

  **诚实边界（承 status.yaml verdict）**：本卡不是 Sen 全正性猜想的证明，
  只是在挠 I>1 上把物理依赖压缩到单条前提 (P′) = DGM eq(52)。
  DGM eq(51)/(52) 不相容是本项目原创发现，属对外声明，需船长确认后方可正式宣称；
  (a)(b) 的数学结论及其对 (P′) 的依赖不受此限制。

  **captain_confirmed: false** —— 见 research/attempts/torsion-immortal-positivity-hecke/status.yaml。

