id: holography.torsion-immortal-positivity
kind: proposition
title: 挠 I>1 免死 dyon 指标正性（Thm 6.1）：d_*^{(I)} = 正权除子和 > 0
statement: |
  设 I ≥ 1，(m,n,ℓ) ∈ ℤ³ 满足 I²|m、I|ℓ、m ≥ 1、n ≥ 1、Δ := 4mn−ℓ² > 0。
  沿用 holography.torsion-index-divisor-operator 的定义 D：
    𝒢_I := −Σ_{s|I} s / Φ₁₀(s²ρ, σ, sv + 1/2)，
    d_*^{(I)}(m,n,ℓ) := ∫_{C_*(m,n,ℓ;Λ)} dρdσdv · 𝒢_I(ρ,σ,v) · e^{−2πi(mρ+nσ+ℓv)}（Λ 充分大），
  并记 d_*(m′,n′,ℓ′) 为单位挠免死指标（holography.mock-jacobi-coefficient-positivity）。
  设 Ω_I(m,n,ℓ) 为挠 I 的单心（immortal）dyon 指标，其与 d_*^{(I)} 的等同为
  holography.dgm-torsion-divisor-sum（DGM eq 52）的物理内容。则：
  (a) **除子和恒等式**：d_*^{(I)}(m,n,ℓ) = Σ_{s|I} s · d_*(m/s², n, ℓ/s)；
  (b) **正性**：d_*^{(I)}(m,n,ℓ) > 0；
  (c) 在物理识别 Ω_I = d_*^{(I)} 之下，挠 I 的单心 dyon 指标 Ω_I(m,n,ℓ) > 0。
  I = 1 时退化为 Rosselló Cor 1.1（holography.mock-jacobi-coefficient-positivity (b)）。
