id: holography.rescaling-reflection-transfer
kind: proposition
title: 重标算子的反射转换（Thm A）：D'_I(m,n,ℓ) = D_I(n,m,ℓ)
statement: |
  沿用 holography.torsion-index-divisor-operator 的 D_I（Q-重标）与
  holography.rescaling-p-operator-definition 的 D'_I（P-重标）。对一切整数 I≥1 及满足
  m,n≥1、Δ=4mn−ℓ²>0 的 (m,n,ℓ)：
    D'_I(m,n,ℓ) = D_I(n,m,ℓ)。
  即：P-重标算子在 (m,n,ℓ) 处的取值，等于把电荷/磁荷互换后 Q-重标算子在 (n,m,ℓ) 处的取值。
  这是 Bossard–Cosnier-Horeau-Pioline arXiv:1806.03330 "in agreement with the prescription
  in [41, 72]"（[41,72] 即 BSS/DGM 一系）一句的精确数学形式：P-重标公式在 P-适配标架上的
  取值，与 Q-重标公式在对应的（电荷、磁荷互换的）Q-适配标架上的取值，是同一件事，
  由 S-对偶元 S=[[0,1],[−1,0]]：(Q,P)↦(P,−Q) 联系。
