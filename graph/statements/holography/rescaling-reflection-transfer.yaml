notes: |
  **证明骨架（proof.md §3）**：逐项比较。D'_I 第 s 项存在当且仅当 s²|n 且 s|ℓ，值为
  s·d_*(m,n/s²,ℓ/s)；D_I(n,m,ℓ) 的第 s 项由代换 (m,n,ℓ)→(n,m,ℓ) 得到，存在条件同为 s²|n
  且 s|ℓ，值为 s·d_*(n/s²,m,ℓ/s)。由 d_* 的 GL(2,ℤ) 类函数性质（取对换矩阵的特例）
  d_*(n/s²,m,ℓ/s) = d_*(m,n/s²,ℓ/s)，两和逐项相等，无剩余项。

  唯一用到的外部数学事实是 d_* 关于 (m,n) 互换的对称性，这是
  holography.dstar-sduality-invariant（一般 GL(2,ℤ) 类函数性质）在对换矩阵
  A=[[0,1],[1,0]]（det=−1，属 GL(2,ℤ)）处的特例，见对应推导节点。
