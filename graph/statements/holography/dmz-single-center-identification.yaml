id: holography.dmz-single-center-identification
kind: proposition
title: 识别③：DMZ 有限部 φ_F 等于单心（immortal）dyon 贡献
statement: |
  在 N=4 弦论（type II on K3×T²）中，对固定电荷 (Q,P)（判别式 d=Q²P²−(Q·P)²>0，
  gcd=1），DVV 生成函数 1/Φ₁₀ 作为指标 m 的亚纯 Jacobi 形式经 DMZ 典范分解后：
    1/Φ₁₀ = φ_F(τ,z) + φ_P(τ,z)，
  其中 φ_F 是 mock Jacobi 形式（有限部），φ_P 是 Appell-Lerch 极部。
  物理识别（Dabholkar-Murthy-Zagier 2012）：
  (a) φ_F 的傅里叶系数 d_F(m,n,l) 等于**单心（immortal）dyon**的指标——
      即在 immortal chamber 内稳定、不分裂为多中心束缚态的 1/4-BPS dyon 的螺旋超迹；
  (b) φ_P（Appell-Lerch 极部）的傅里叶系数对应**多中心（壁穿越易受影响的）**部分；
      其贡献随 chamber 变化，对应识别②中的壁穿越跳变；
  (c) DMZ 分解因此实现了"单心贡献"与"多中心贡献"在生成函数层面的**解析分离**，
      使 immortal dyon 指标 d_F(m,n,l) 成为 chamber 无关量。
uses:
  - holography.dmz-mock-jacobi-decomposition
  - holography.dvv-dyon-index-generating-function
  - holography.dvv-wall-crossing-identification
uses_conventions: []
sources:
