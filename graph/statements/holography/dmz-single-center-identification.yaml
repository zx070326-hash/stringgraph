    loc: "§1–§2（物理背景与识别），§6（单心/多中心分离的详细论证）"
notes: |
  **严格度：physical-argument（识别③）。**
  数学分解（holography.dmz-mock-jacobi-decomposition）是严格的。
  但"φ_F 的系数 = 单心 dyon 贡献"是物理识别：依赖 localization/supergravity 分析来
  论证在 immortal chamber 里极部 φ_P 的贡献恰好是多中心态，而 φ_F 的 mock 结构来源于
  对单心 dyon 做围道积分时非全纯补全的必要性。
  这一识别是 DMZ 2012 的中心物理论证，文献称之为"the finite part conjecture"（在 2012 年
  对一类情形尚属猜测，此后通过 Sen positivity 等旁证逐步加固）。
  识别③与识别①②合用构成完整的"1/4-BPS dyon 指标 = mock Jacobi 系数（单心部分）"论证链。
