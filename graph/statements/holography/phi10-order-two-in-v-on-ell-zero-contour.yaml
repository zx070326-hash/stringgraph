tags: [bh-entropy, mock-modular, n4-string-theory, siegel-modular-form]
notes: |
  【(b) 的关键一步不是「重数 2」，而是「该点上只过一条分支」】Div(Φ₁₀) = 2H₁ 说的是
  每个分支的重数为 2；若某点同时落在两个分支上，限制到横截直线的阶就是各分支重数之和
  （≥4），h₀ = 0。故 (b) 的承重输入是分支排除（本卡的两条 ell-zero-contour-avoids-* 依赖），
  重数只在最后一步用。

  【为什么 (a)(b) 合成一张卡】两者是同一个对象——单变量函数 u ↦ Φ₁₀(ρ,σ,u) 在该线段上的
  零点除子——的两个方面（支集与重数），由同一次分支排除一次性给出，不拆。

