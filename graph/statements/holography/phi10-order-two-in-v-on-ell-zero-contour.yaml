id: holography.phi10-order-two-in-v-on-ell-zero-contour
kind: proposition
title: "ℓ=0 吸引子围道上 Φ₁₀ 沿 v-方向的零点：平移窗口内只有 v=1/2 一个，且阶恰为 2（h₀ ≠ 0）"
statement: |
  记号同 holography.torsion-index-divisor-operator（定义 D）与
  holography.ell-zero-contour-avoids-phi10-quadratic-wall：Φ₁₀ 是 Igusa 权 10 亏格 2
  尖点形式，Ω = [[ρ,u],[u,σ]] ∈ ℍ₂；𝒢(ρ,σ,v) := −1/Φ₁₀(ρ,σ, v+1/2)，故 v 与平移坐标
  u 的关系是 u = v + 1/2。

  设整数 m, n ≥ 1，Λ > 1/(4√(mn))，并设 (ρ,σ) 取自 ℓ=0 吸引子围道的 (ρ,σ)-分量：
    ρ = ρ₁ + 2inΛ，σ = σ₁ + 2imΛ，ρ₁, σ₁ ∈ [0,1]。
  （此时对一切实 u 都有 Im ρ·Im σ − (Im u)² = 4mnΛ² > 0，故整条实 u-线落在 ℍ₂ 内，
  单变量函数 u ↦ Φ₁₀(ρ,σ,u) 在含实轴的开带上全纯。）

  **断言**：对**每一个**这样的 (ρ,σ)，
  (a) u ↦ Φ₁₀(ρ,σ,u) 在实线段 { u ∈ ℝ : 1/2 ≤ u ≤ 3/2 }（等价地 v ∈ [0,1]）上
      **恰有一个零点，即 u = 1（v = 1/2）**；
  (b) 该零点的**阶恰为 2**，等价地
        h₀(ρ,σ) := lim_{u→1} Φ₁₀(ρ,σ,u)/(u−1)² ≠ 0。
  于是 v ↦ 𝒢(ρ,σ,v) 在 v ∈ [0,1] 上只有 v = 1/2 这一个极点，且是二阶极点。

  【本卡存在的理由】(b) 正是 holography.phi10-shifted-pole-residue-proportional-to-ell
  的显式前提。它**不能**由 holography.igusa-cusp-form-phi10-v2 的 Div(Φ₁₀) = 2H₁ 直接
  得到：那只给出沿 H₁ **一般点**的重数为 2，而在 H₁ 与 Div(Φ₁₀) 其它分支的交点上，
  限制到 u-直线的零点阶会 > 2（h₀ = 0），留数公式失效。按 graph/CLAUDE.md 2026-09-15
  裁决（图外的实质承重命题必须立成节点，不得塞进 inferred 边或 notes），单独立卡。

  【本卡明确不断言】Im u ≠ 0 的情形（把围道 v-虚部微扰到 ±εΛ 后的带内零点分布）。
  那一步在 holography.dstar-well-defined-at-ell-zero 的推导里用紧致性单独处理。
