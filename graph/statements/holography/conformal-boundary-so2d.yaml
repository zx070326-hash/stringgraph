id: holography.conformal-boundary-so2d
kind: proposition
title: AdS_{d+1} 的共形边界是 d 维 Minkowski 空间的共形紧化，SO(2,d) 在体内是等距群、在边界上是共形群
statement: |
  设 d ≥ 2。取坐标 u, v, x^1, …, x^d，η_{ij} 为 d 维 Minkowski 度规（号差 −+…+）。

  (i)【边界的二次曲面模型】方程

        u v − Σ_{i,j} η_{ij} x^i x^j = 0                                    (1.1)

      加上整体标度等价 (u, v, x^i) ∼ (s u, s v, s x^i)（s ∈ R，s ≠ 0），
      给出 d 维 Minkowski 空间的一个紧化 M_d，SO(2,d) 在其上作用。
      该紧化在拓扑上是 (S^1 × S^{d−1})/Z_2，带闭类时曲线；通常改用其万有覆叠，
      拓扑上是 S^{d−1} × R。

  (ii)【体的二次曲面模型】同样的坐标，把 (1.1) 换成

        u v − Σ_{i,j} η_{ij} x^i x^j = 1                                    (1.2)

      并只对全体变量的整体变号取等价，给出 AdS_{d+1}；M_d 是 AdS_{d+1} 的边界。

  (iii)【对称性的两副面孔】SO(2,d) 作为通常的（等距）对称群作用在 AdS_{d+1} 上，
      而作为共形群作用在 M_d 上。

  (iv)【欧氏版本与「只有共形结构」】欧氏 AdS_{d+1} 取为开单位球 B_{d+1} ⊂ R^{d+1}，度规

        ds² = 4 Σ_{i=0}^{d} dy_i² / (1 − |y|²)²                             (2.1)

      （AdS 半径 = 1）；紧化 B̄_{d+1} 的边界是 S^d。取 B_{d+1} 上任一正函数 f，
      要求它在边界上有一阶零点（原文对 f 的这一刻画就在 §2.1 本处，印刷页 p.5 逐字：
      "pick a function f on B_{d+1} which is positive on B_{d+1} and has a first order zero on the
      boundary (for instance, one can take f = 1 − |y|²)"），令

        ds̃² = f² ds²                                                        (2.2)

      则 ds̃² 可延拓到 B̄_{d+1} 上并在 S^d 上诱导一个度规；f 的选择不唯一，
      f → e^w f  (2.3) 时 ds̃² → e^{2w} ds̃²  (2.4)。因此 S^d 上得到的**不是**度规，
      而只有一个共形结构，且该共形结构在 SO(1, d+1) 的作用下保持。
      等价的两个体度规写法：ds² = dy² + sinh²y dΩ²（(2.5)，边界在 y = ∞）；
      ds² = (1/x_0²) Σ_{i=0}^{d} (dx^i)²（(2.6)，边界在 x_0 = 0 加无穷远一点 P）。

  本陈述**不含** Witten p.4 的断言
  "indeed this is the only possible SO(2,4)-invariant relation between these two spaces"
  ——那是无证明断言，见 notes；也**不含**「因此对应是全息的」这一解释性结论。
uses_conventions: [conv.metric-mostly-plus, conv.ads-radius-unit]
sources:
  - ref: witten-1998-ads
    loc: |
      arXiv:hep-th/9802150v2：§1，印刷页 p.1（引言里 (iii) 的概述句）；
      印刷页 p.3（式 (1.1)(1.2)、标度等价、SO(2,d) 所保持的二次形式、仿射片论证、
      拓扑判定与脚注 1–2），续到 p.4（闭类时曲线与万有覆叠、以及 p.4 的唯一性断言）；
      §2.1，印刷页 p.4–5，式 (2.1)–(2.6)、f 的刻画与脚注 3（Penrose 共形紧化）。
      （页码一律是**原文印刷页码**，PDF 页 = 印刷页 + 1；本轮由 curator 按 arXiv v2 页图逐页复核，
      订正了原先把构造 (1.1)(1.2) 记作 p.1–2、§2.1 记作 p.5–6 的偏差——
      p.1 只有概述句，式 (1.1)(1.2) 与脚注 1–2 都在 p.3。）
    note: |
      (iii) 的逐字依据（印刷页 p.1）："the boundary M_d of AdS_{d+1} is in fact a copy of
      d-dimensional Minkowski space (with some points at infinity added); the symmetry group
      SO(2,d) of AdS_{d+1} acts on M_d as the conformal group."
      (iv) 的逐字依据（§2.1）："while AdS_{d+1} has (in its Euclidean version) a metric
      invariant under SO(1, d+1), the boundary S^d has only a conformal structure,
      which is preserved by the action of SO(1, d+1)."
      ✔ f 的刻画**就在 §2.1 本处**（印刷页 p.5，(2.2) 前一句逐字）："To get a metric which does
      extend over B̄_{d+1}, one can pick a function f on B_{d+1} which is positive on B_{d+1} and has
      a first order zero on the boundary (for instance, one can take f = 1 − |y|²), and replace ds²
      by" → (2.2)。即**存在性是原文给出的显式例子**，不是编者补的。
      （订正：本卡原先把这条刻画的出处记作 §2.5 p.19，说 §2.1 只有变换律——误。§2.5 印刷页 p.20
      确实另有一句同义的 "Pick any positive function f on B_{d+1} that has a simple zero on the
      boundary."，那里举的例子是 f = e^{−y}，用于**有质量**情形的 φ_0 定义；两处是同一个 f
      的两次刻画，但 §2.1 才是本卡所引的出处。reviewer-gkpw 2026-09-11 指出，curator 按页图复核。）
      欧氏化的自我定位（§2.1 逐字）："it will be convenient to formulate the present paper
      in a Euclidean language."
tags: [holography, ads-cft, geometry, conformal-boundary, symmetry]
notes: |
  from: witten-1998-ads#E-W1（另见该抽取记录 §0 约定段与 §5 建议节点 C）。

  【为什么不把「唯一性」写进陈述】Witten p.4 逐字："We can certainly identify the M_4 in
  question with the boundary of AdS_5; indeed this is the only possible SO(2,4)-invariant
  relation between these two spaces."——原文**没有给出对称性分类的论证**，这是一句断言。
  抽取记录 §5 建议节点 C 明写「若单独立卡，status 应为 conjecture 或标 inferred」。
  本卡的处理是把它排除在陈述之外，只留 (i)–(iv) 的几何内容，并在唯一推导的 gaps 里记账。
  若后续要把这条唯一性断言入图，应新建独立卡，不得改本卡的 statement。

  【本卡为什么是 physical-argument 而不是更高】(i)–(iv) 本身是可严格化的纯几何
  （二次曲面、Penrose 共形紧化、单位球模型、共形类的定义），但 Witten 给的是骨架式论证：
  (1.1)(1.2) 的紧化性质、拓扑判定 (S^1 × S^{d−1})/Z_2、"M_d 是 AdS_{d+1} 的边界" 都只是陈述，
  没有证明；f 的存在性与 ds̃² 可延拓到 B̄_{d+1} 这一步也没有验证。
  按 docs/STATUS_LEVELS.md「断言 + 骨架」档位裁决，取 physical-argument，
  把断言处逐条写进推导的 gaps，**不**降到 conjecture（结论真伪在数学上没有争议）。
  这是本方向最容易做严格化/Lean 形式化的一块（抽取记录 §5 的判断），补齐后可升级换代。

  【唯一有数学定理背书的部分不在本卡里】这里要分清**两篇不同的数学文献**
  （2026-09-11 订正，依 literature/extractions/math-sources.md §41，researcher 已 L1 核实）：
  - **Graham–Lee** = Witten 的 **[42]**，被引在 §2.2 印刷页 p.7：任何**充分接近标准共形结构**的
    S^d 上共形结构，都由 B_{d+1} 上一个唯一的（差一个微分同胚）满足负宇宙常数 Einstein 方程、
    在边界有二阶极点的度规按 (2.2) 得到。本项目**未取得正文**（已确认无开放获取全文，
    OpenAlex oa_status: closed；sources.bib 里 graham-lee-1991 仍是 L0、书目 L2），
    因此引用它时**不得写任何定理号**——常见的 "Theorem A / Theorem B" 无任何证据，
    且 Lee 本人的 memoir 引本文用的是 "[29, Lemma 2.2]"（math-sources.md §41.3.2）。
    ⚠ Witten 参考表把题名印错（漏掉 "conformal"），照抄会查不到。
  - **Fefferman–Graham** = Witten 的 **[44]**，被引在**另一处**（印刷页 p.18 与 p.19），
    点名的是该文的 **Theorem 2.1 与 Theorem 2.3**（分别在刊页 p.101 与 p.103）：
    ambient metric 与 Poincaré metric 的存在唯一性。**Theorems 2.1 and 2.3 属于 Fefferman–Graham，
    不属于 Graham–Lee**（math-sources.md §41.2.3 三重交叉核验）。本项目已 L1 读到全文页图，
    三条必须随引用一起写的限制是：(1) 那是**形式幂级数**级的存在唯一性，只在 [g] 实解析时断言收敛，
    **不能**用来支持「任意边界共形结构都有体度规」；(2) n 偶时存在**无解**的共形结构
    （障碍见同文 Proposition 3.5，刊页 p.107；n = 4 时即 Bach 张量），Witten 正是用这个奇偶二分
    解释共形反常只在偶 d 出现；(3) 原文第 V 节标题逐字是 "About the Proof of Theorem 2.1"，
    开头自陈只讨论 "some of the ingredients"，**完整证明不在文内**，Theorem 2.3 更没有独立证明节。
  这两支是 GKPW 字典里**唯一有真数学定理背书**的部分，但
  (a) 它们是**局部 / 形式幂级数**结果（Graham–Lee 只对接近标准共形结构者成立，Witten 印刷页 p.8
      逐字说这个限制 "is probably also necessary for most values of d"）；
  (b) 规范场版本 Witten 自称 "one expects" / "hopefully similar"，且脚注 4 用 Chern class
      给出显式反证，说明大场下**必然失败**；
  (c) 两者讲的都是「给定边界共形结构反解体 Einstein 度规」，与本卡 (i)–(iv) 的方向相反，
      本卡的论证没有用到它们。
  因此本轮**不为它们立卡**；sources.bib 已登记 key fefferman-graham-1985（researcher L1，
  可作 sources[].ref）与 graham-lee-1991（L0，只能在 notes 里以「Witten 转述」身份出现）。

  【记号红线】原文写 SO(2,d)/SO(2,4)（不是 SO(4,2)）；欧氏版的等距群写 SO(1, d+1)。
  Penrose 共形紧化只在脚注 3 里被点名，本卡不把它当作已入图的依赖。

  【版本】所有 loc 锚定 arXiv:hep-th/9802150v2 (6 Apr 1998)；
