notes: |
  **这是本 attempt 物理意义最直接的定理**：它不需要相信 P-重标文献（AN/BCP）本身正确，
  只需要 DGM 的 Q-重标物理前提 (H1) 加 S-对偶不变性 (H2)，就已经推出「标架依赖」——
  P-重标公式的存在与否，甚至不是必要的。

  **与 Thm B（holography.rescaling-frame-dependence-witness）的关系**：Thm B 是纯数学
  命题（D'_I 作为算子在同一格 L 的两个标架上取不同值，不涉及任何物理识别）；本卡 Thm D
  是它的物理读法——但物理读法额外需要 (H1)+(H2) 两条前提，且 Thm D 用的是**两个不同的
  格**（各自恰好是 Q-适配、P-适配）而非同一格 L 的两个标架，故不能从 Thm B 直接文本替换
  得到，需要引理（S-对偶把 P-适配化为 Q-适配）单独论证。

  **effective status 预期被压到 physical-argument**：本卡自身的逻辑推导（引理 + 定理）是
  纯数学演绎，rigorous；但它依赖 (H1)=holography.dgm-torsion-divisor-sum，该卡是
  physical-argument（DGM 依赖 4d-5d 提升、S-对偶等物理论证，非纯数学证明）。按
  propagate.py 的下界传播，本卡 effective 预期自动压到 physical-argument，这是诚实的、
  预期内的结果，与 holography.torsion-immortal-positivity 采用的「数学结论与物理前提
  分开陈列」模式一致——不需要额外自律，工具自动处理。

  **不把 banerjee-sen-srivastava-2008a 列为 depends_on**：BSS 0802.0544 §6.3 的三轨道
  论述是本定理的历史背景与定性佐证（proof.md 明确称其为 "consistent with, and
  quantifies, a result of 2008"），但 Theorem D 自身的证明只用到 (H1)+(H2)+Thm A+两个
  显式格的存在性，不引用 BSS 的论证步骤；因此该文献只作为 source 记录背景，不构成推导边。
