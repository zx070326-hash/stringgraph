id: holography.rescaling-immortal-index-not-frame-function
kind: proposition
title: 免死指标不是 (m,n,ℓ,I) 的函数（Thm D）：Q-适配与 P-适配标架给出不同物理指标
statement: |
  记 (H1) := holography.dgm-torsion-divisor-sum 的物理前提（挠 I 的单心/免死 dyon 指标，对
  拥有 Q-适配标架、不变量 (m,n,ℓ) 的 dyon，等于 D_I(m,n,ℓ)，D_I 见
  holography.torsion-index-divisor-operator）；(H2) := 指标沿吸引子围道在电荷基变换
  (Q,P)↦(aQ+bP,cQ+dP)（U∈SL(2,ℤ)）下不变，对 d_* 即 holography.dstar-sduality-invariant
  的 SL(2,ℤ) 特例。

  **引理**：在 (H1)+(H2) 之下，拥有 P-适配标架、不变量为 (m,n,ℓ) 的挠 I dyon，其指标等于
  holography.rescaling-p-operator-definition 的 D'_I(m,n,ℓ)。（对 (Q,P) 施加 S-对偶元
  S=[[0,1],[−1,0]]：(Q,P)↦(P,−Q) 化为 Q-适配情形，不变量变为 (n,m,−ℓ)，用 (H1) 得指标
  = D_I(n,m,−ℓ)，再用 holography.rescaling-reflection-transfer（Thm A）与 D_I 关于 ℓ 的
  偶性化简为 D'_I(m,n,ℓ)。）

  **定理**：在 (H1)+(H2) 之下，1/4-BPS 免死 dyon 指标**不是**不变量组 (m,n,ℓ,I) 的良定义
  函数：同一组 (m,n,ℓ,I) 上，是否为 Q-适配还是 P-适配会给出不同数值。显式地，在
  (m,n,ℓ,I)=(4,8,8,2) 处，电荷格 Λ 中同时存在挠 2 的 Q-适配子格与挠 2 的 P-适配子格（两个
  不同的秩 2 子格），二者的不变量都是 (4,8,8)，而指标分别为
    Q-适配：D_2(4,8,8) = d_*(4,8,8) + 2·d_*(1,8,4) = 7 999 541 469 408，
    P-适配：D'_2(4,8,8) = d_*(4,8,8) + 2·d_*(4,2,4) = 7 999 235 715 072，
  差 305 754 336。s=2 项对应的两个约化型 (1,4,0) 与 (2,2,0) 是判别式 −16 的两个不等价类
  （类数 h(−16)=2），这正是差异的来源。
