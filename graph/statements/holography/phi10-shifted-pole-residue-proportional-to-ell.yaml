notes: |
  【为什么写成条件命题】「u=1 处零点阶恰为 2」是承重前提，不是自动的：
  holography.igusa-cusp-form-phi10-v2 给出 Div(Φ₁₀) = 2H₁，即沿 H₁ 的**一般点**
  重数为 2；但在 H₁ 与 Div(Φ₁₀) 其它分支的交点上，限制到 u-直线的零点阶会 >2
  （即 h₀ = 0），留数公式失效。按 graph/CLAUDE.md 2026-09-15 裁决（不得把图外的
  实质命题藏进 inferred 边或 notes），本卡把该前提写进 statement 作为显式假设；
  在吸引子围道上兑现它的是另一张卡
  holography.phi10-order-two-in-v-on-ell-zero-contour。

  【本卡断言的是纯局部复分析事实】不涉及任何围道、不涉及 d_* 是否良定，也不涉及
  物理解释。ℓ=0 时 d_* 的良定性在 holography.dstar-well-defined-at-ell-zero。

  【先行工作与优先权——按 literature/notes/ell-zero-wall-residue-prior-art.md 的裁定措辞】
  结论层（⟨Γ₁,Γ₂⟩ = Q·P = 0 ⟹ 壁跨越跳变 Δd = 0）**已由 Denef–Moore 2007 的壁跨越
  公式确立，本项目不作任何优先权主张**。本卡记录的是**推导路径**：从 Φ₁₀ 的 v-偶性
  与二阶零点、用留数演算直接得出 Res ∝ ℓ。该机制性推导在已检索文献中未找到
  （Sen 2007/2008、Cheng–Verlinde 2007、DGM 2008、Rosselló 2024、BSS 2023；
  检索盲区见 literature/notes/ell-zero-wall-residue-prior-art.md）。两条路径在数学上
  独立（Denef–Moore 是多中心 BPS 物理论证，本路径是纯复分析），但**不得据此声称
  「首次」**——检索有明确盲区。

  【与 holography.phi10-wall-crossing-poles-v2 的关系——不是重复，是互补且可解其不自洽】
  那张卡的 (b) 用简单极点的留数写法 Res = f·g，与它自己 (a) 订正后的「二阶极点」
  字面冲突（physics-auditor 2026-09-20 发现，该卡 notes 已记录，留待回 DVV §4 /
  Sen 2007 §2 逐字核对后定 v3）。本卡给出的正是二阶极点下的留数：它带一个
  正比于 ℓ 的因子，而不是与 ℓ 无关的乘积——这与 holography.dvv-wall-crossing-identification
  的 Δd ∝ (−1)^{Q·P+1}(Q·P) 线性依赖同形。**本卡不改那两张卡**（curator 无权；
  已作为建议写进交给 lead 的报告）。

  【符号自洽性核对，curator 亲自重算】
  记 s := v − 1/2（= u − 1）。由偶性+周期性（引理 2.4：f 偶且周期 1 ⇒ f(k+s)=f(k−s)），
  Φ₁₀(ρ,σ,1+s) = s²·h(1+s) 且 h 只含 s 的偶次项，故 𝒢 = −(1/h₀)s^{−2} + O(1)，
  **不含 s^{−1} 项**；指数核 e^{−2πiℓv} = e^{−2πiℓ(s+1/2)} = (−1)^ℓ(1 − 2πiℓs + O(s²))。
  两者相乘的 s^{−1} 系数 = (−1)^ℓ·[(−1/h₀)·(−2πiℓ)] = (−1)^ℓ·2πiℓ/h₀。与订正后的
  proof.md §2.5 逐字一致。Rosselló 约定下重算（极点在 v=0，核为 (−1)^ℓ(1−2πiℓv)，
  Φ₁₀ = v²h）：v^{−1} 系数 = (−1)^ℓ·(−2πiℓ/h₀) = (−1)^{ℓ+1}·2πiℓ/h₀，与 §5.1 一致。

  【查重】`uv run stringgraph search` 查 `residue`/`留数`/`极点`/`wall`/`ell`/`Laurent`
