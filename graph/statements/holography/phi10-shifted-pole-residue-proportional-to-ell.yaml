id: holography.phi10-shifted-pole-residue-proportional-to-ell
kind: proposition
title: "半周期平移积分核在二阶极点 v=1/2 处的留数线性正比于 ℓ：Res = (−1)^ℓ·2πiℓ/h₀（条件命题，前提是零点阶恰为 2）"
statement: |
  记号（Rosselló 2403.19630 约定，同 holography.torsion-index-divisor-operator 的定义 D）：
  Φ₁₀ 是 Igusa 权 10 亏格 2 尖点形式，Ω = [[ρ, v], [v, σ]] ∈ ℍ₂，并记
    𝒢(ρ,σ,v) := −1/Φ₁₀(ρ,σ, v + 1/2)
  （定义 D 的 R6′ 约定：半周期平移写在 𝒢 的定义里，且带整体负号）。

  固定 ρ,σ ∈ ℍ。使 Ω = [[ρ,u],[u,σ]] ∈ ℍ₂ 的 u 的集合是含实轴的开带
    S(ρ,σ) := { u ∈ ℂ : |Im u| < √(Im ρ · Im σ) }，
  单变量函数 u ↦ Φ₁₀(ρ,σ,u) 在 S(ρ,σ) 上全纯。

  **前提（本卡不证明，须由别处供给）**：u = 1 是 u ↦ Φ₁₀(ρ,σ,u) 的零点，且其阶**恰为 2**。
  等价说法：令 h(ρ,σ,u) := Φ₁₀(ρ,σ,u)/(u−1)²（在 u=1 处全纯延拓），则
    h₀(ρ,σ) := h(ρ,σ,1) ≠ 0。

  **断言**：在上述前提下，对**每个整数 ℓ**，单变量函数
    v ↦ 𝒢(ρ,σ,v) · e^{−2πiℓv}
  在 v = 1/2 处有一个二阶极点，且其（关于 dv 的）留数为
    Res_{v=1/2} [ 𝒢(ρ,σ,v) · e^{−2πiℓv} ] = (−1)^ℓ · 2πi ℓ · (1 / h₀(ρ,σ))。
  特别地：该留数 **= 0 当且仅当 ℓ = 0**；ℓ ≠ 0 时它非零，并且线性正比于 ℓ。

  【同一留数在 Rosselló (2.23) 自身约定下的形式——约定换算，不是第二条命题】
  把半周期平移写在指数内（被积函数 e^{−2πiℓ(v+1/2)}/Φ₁₀(ρ,σ,v)，极点在 v = 0）时，
  同一个留数是 (−1)^{ℓ+1} · 2πi ℓ · (1/h₀)，与上式恰差一个整体负号；该负号就是 𝒢
  定义里的整体负号，对应 d_*^{定义D} = − d_*^{Rosselló}（见 notes）。两式中的 h₀ 是同
  一个函数值：由 Φ₁₀ 的 v-周期 1（holography.phi10-periodic-in-v），u=1 处与 u=0 处的
  h₀ 相等。
uses:
  - holography.igusa-cusp-form-phi10-v2
  - holography.phi10-even-in-v
  - holography.phi10-periodic-in-v
  - holography.torsion-index-divisor-operator
