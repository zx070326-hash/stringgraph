id: holography.torsion-index-divisor-operator
kind: definition
status: rigorous
title: 挠 I 免死指标的定义：𝒢_I 的吸引子围道系数（除子和算子）
statement: |
  沿用 Rosselló 2403.19630 的约定（半整 Gram 矩阵 T = [[m, ℓ/2],[ℓ/2, n]]，判别式 Δ = 4mn−ℓ²，
  吸引子围道 C_*(m,n,ℓ;Λ)），并记
    𝒢(ρ,σ,v) := −1/Φ₁₀(ρ,σ, v + 1/2)。
  对 I ≥ 1 定义重标算子族与挠指标生成函数
    A_s := diag(s,1)， 𝒱_s F := F ∘ (Ω ↦ A_s Ω A_sᵀ)， 即 (𝒱_s F)(ρ,σ,v) = F(s²ρ, σ, sv)；
    𝒢_I := Σ_{s|I} s · 𝒱_s 𝒢 = −Σ_{s|I} s / Φ₁₀(s²ρ, σ, sv + 1/2)。
  则**定义 D**：对 (m,n,ℓ) ∈ ℤ³ 满足 I²|m、I|ℓ、m,n ≥ 1、Δ = 4mn−ℓ² > 0，令
    d_*^{(I)}(m,n,ℓ) := ∫_{C_*(m,n,ℓ;Λ)} dρ dσ dv · 𝒢_I(ρ,σ,v) · e^{−2πi(mρ+nσ+ℓv)}，
  Λ 充分大（使围道避开 𝒢_I 的全部极点）；由 d_* 的 Λ-无关性（holography.mock-jacobi-coefficient-positivity）
  该值与充分大的 Λ 无关。
  I = 1 时 𝒢_1 = 𝒢，故 d_*^{(1)} = d_*，与 Rosselló 的定义一致。
  注：𝒢_I ≠ [𝒯_I(1/Φ₁₀)]|_{v↦v+1/2}——半周期平移 v ↦ v+1/2 与重标 v ↦ sv 对偶数 s 不交换，
  这是本定义与 DGM eq(51) 的差别所在（见 holography.dgm-torsion-divisor-sum）。
