notes: |
  【2026-09-20 Φ₁₀ 重数订正：本陈述刻意留在 v1，不重定向】
  本陈述依赖 holography.igusa-cusp-form-phi10（v1）而不是 v2 的理由：本定义只消费
  𝒢 := −1/Φ₁₀(ρ,σ,v+1/2) 的存在性与 Fourier 展开结构（定义重标算子与吸引子围道积分），
  完全不依赖零点重数的具体数值（重数=1 还是=2）。v1 卡关于 Fourier 结构的断言是正确的
  （订正只涉及重数那一句），故本陈述留在 v1 是逻辑正确的选择。
  详见 docs/reviews/phi10-multiplicity-normalization-2026-09-20.md §2（9 个可留 v1 的判据）。

  **纯数学定义，无物理输入。** 定义对象是 Φ₁₀（Siegel 尖点形式）、显式围道与显式算子 𝒯_I，
  与「挠 I 的单心黑洞指标」的等同**不在本定义内**，是物理命题
  holography.dgm-torsion-divisor-sum（physical-argument）。

  **本节点只立定义，不立命题。** d_*^{(I)} 的除子和恒等式
  d_*^{(I)}(m,n,ℓ) = Σ_{s|I} s·d_*(m/s²,n,ℓ/s) 与正性 d_*^{(I)} > 0 是命题，记在
  holography.torsion-immortal-positivity-thm6-1。

  **约定警告（记号要害）**：本节点沿用 Rosselló 的「指标挂在 ρ 上」约定（1/Φ₁₀ = Σ_m ψ_m(σ,v)p^m，p = e^{2πiρ}）。
  DMZ 1208.4074 把指标挂在 σ 上；DGM 的除子和重标 ρ→s²ρ、v→sv 而 σ 不动，作用在 (m,ℓ) 上而非 (n,ℓ) 上。
  任何约定混淆都会把除子和的作用位置搞反（proof.md §2 注 2.2）。

  **R6′ 符号约定**：𝒢 := −1/Φ₁₀(ρ,σ,v+1/2)。整体负号是符号核算结果（proof.md §1），同时乘在等式两边，
  不影响任何结论；它保证 𝒢 沿吸引子围道的 (m,n,ℓ) 系数恰为 d_*(m,n,ℓ) = (−1)^{ℓ+1}×(1/Φ₁₀ 的同名系数)。

