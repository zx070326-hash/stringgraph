id: holography.immortal-dyon-index-positive
kind: proposition
title: N=4 单心 dyon 指标正性（Sen 正性定理）
statement: |
  在 N=4 弦论（type II on K3×T²）中，设 d_F(m,n,l) 为经 DMZ 分解后 1/4-BPS 生成函数
  有限部 φ_F 的傅里叶系数，对应 immortal（单心）dyon 的螺旋超迹。
  则对所有满足以下条件的 (m,n,l)：
    d = 4mn − l² > 0，  gcd(m,n,l) = 1，
  有
    d_F(m,n,l) > 0。
  即：在 immortal chamber 中，所有允许的电荷构型的单心 1/4-BPS dyon 指标均为正整数。
uses:
  - holography.dmz-mock-jacobi-decomposition
uses_conventions: []
sources:
  - ref: rossello-2024
    loc: "Theorem 1 + Corollary 1.1（数学正性：全部 m,n≥1、Δ=4mn−ℓ²>0、gcd=1）；§1（immortal/单心指标的界定与 hair-mode 分解假设）"
  - ref: bringmann-murthy-2012
    loc: "主定理：mock Jacobi 形式指标 m=1,2 的情形（对这两个 m 覆盖全部 Δ>0，含小判别式）；圆法 + Kloosterman 和估计"
  - ref: dabholkar-murthy-zagier-2012
    loc: "§1–§2、§6（识别③：有限部 φ_F 的系数 = 单心 dyon 指标，'the finite part conjecture'）"
notes: |
  **本卡是物理命题，有效状态 physical-argument。**
  纯数学的系数正性已独立成卡：holography.mock-jacobi-coefficient-positivity（rigorous）。
  本卡比它多一步物理识别③（holography.dmz-single-center-identification，physical-argument），
  即"d_F(m,n,l) = immortal（单心）dyon 的螺旋超迹"；故本卡的推导
  holography.immortal-dyon-index-positive--via-bringmann-murthy-rossello 是 physical-argument。

  两篇数学文献的覆盖范围（task #17 核实订正，见 extractions/）：
  - Bringmann-Murthy 2012（rigorous）：mock Jacobi 形式**指标 m=1,2**（对这两个 m 覆盖全部
    Δ=4mn−ℓ²>0，含小判别式），方法为圆法 + Kloosterman 和估计。
    **订正**：原写"对充分大的判别式 d"不准确——BM 的分界线是指标 m，不是判别式大小。
  - Rosselló 2024（rigorous）：Theorem 1（代表元范围 n≥m、0≤ℓ≤m 的 (−1)^{ℓ+1} c_m^F(n,ℓ)>0，
    m≥3 由本文证明：§3 一般 m≥6、Appendix A 显式 m=3,4,5）+ Corollary 1.1（GL(2,ℤ) 不变性
    推广到全部 m,n≥1、Δ>0、gcd=1）。方法：S-对偶（GL(2,ℤ)）约化 + Rademacher 展开 +
    Kloosterman/Bessel 显式定界；**纯数学，无物理前提**（extractions/rossello-2024.md E4）。
    两篇合并关闭 Sen positivity 猜想在 N=4 旗舰情形（K3×T²）的全部情形。
  符号：Rosselló 的正性含因子 (−1)^{ℓ+1}；本卡正文沿用 DMZ/Sen 的指标记号 d_F，
  两者在单位挠约定下一致（细节见 mock-jacobi-coefficient-positivity）。

  历史：本卡原先只挂一条 depends_on 为 DMZ 分解定理、status: rigorous 的推导，
  等于把纯数学命题冒充为本卡的物理命题，造成有效状态虚高；task #20（2026-09-14）已按
  本 notes 早先的预告拆分并链入识别③，工具计算结果降为 physical-argument。
tags: [bh-entropy, mock-modular, n4-string-theory, cartography, sen-positivity]
