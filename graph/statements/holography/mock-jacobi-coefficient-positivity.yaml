id: holography.mock-jacobi-coefficient-positivity
kind: proposition
title: 1/Φ₁₀ 有限部 mock Jacobi 形式傅里叶系数的符号正性（Rosselló Thm 1 + Cor 1.1）
statement: |
  设 1/Φ₁₀ 按 σ 展开后、固定指标 m∈ℤ_{>0} 的那一层亚纯 Jacobi 形式经 DMZ 典范分解
  （holography.dmz-mock-jacobi-decomposition）得到有限部 φ_F = ψ_m^F（指标 m 的 mock
  Jacobi 形式），并记其傅里叶展开系数为 c_m^F(n,ℓ)：
    ψ_m^F(τ,z) = ∑_{n,ℓ} c_m^F(n,ℓ) q^n y^ℓ,   q = e^{2πiτ}, y = e^{2πiz}。
  则：
  (a) （代表元范围）对所有整数 m>0、n≥m、0≤ℓ≤m 有
        (−1)^{ℓ+1} c_m^F(n,ℓ) > 0。
  (b) （全范围）这些系数在由 Φ₁₀ 的 Sp(4,ℤ) 模性诱导的 GL(2,ℤ) 算术作用下只依赖三元组
      (m,n,ℓ) 的轨道，故由 (a) 推出：对所有 m,n,ℓ∈ℤ 满足
        m ≥ 1,  n ≥ 1,  Δ = 4mn − ℓ² > 0,  gcd(m,n,ℓ) = 1（Rosselló 记为算术不变量
        torsion I = 1；I>1 的三元组可归约到 I=1）
      有
        (−1)^{ℓ+1} c_m^F(n,ℓ) > 0，
      即带符号系数 d_*(m,n,ℓ) := (−1)^{ℓ+1} c_m^F(n,ℓ) 在整个 Δ>0、单位挠范围内严格为正。
  本陈述是关于 mock Jacobi 形式傅里叶系数符号的纯数学命题，不含任何解释性内容。
uses:
  - holography.dmz-mock-jacobi-decomposition
uses_conventions: []
sources:
  - ref: rossello-2024
    loc: "Theorem 1（m>0, n≥m, 0≤ℓ≤m: (−1)^{ℓ+1} c_m^F(n,ℓ)>0）；Corollary 1.1（GL(2,ℤ) 不变性推广到全部 m,n≥1、Δ=4mn−ℓ²>0，torsion I=1）"
    note: "指标 m≥3 由本文证明（§3 一般 m≥6，Appendix A 的 m=3,4,5 显式）；m=1,2 引 Bringmann-Murthy"
  - ref: bringmann-murthy-2012
    loc: "主定理：指标 m=1,2 的情形（对这两个 m 覆盖全部 Δ>0，含小判别式）；圆法 + Kloosterman 和估计"
    note: "定理编号未从原文独立核到（PDF 为压缩流），照实记为「主定理」，见 extractions/bringmann-murthy-2012.md E3"
notes: |
  **纯数学命题。** 本卡只断言 mock Jacobi 系数的符号，不断言任何物理解读；
  "c_m^F(n,ℓ) = immortal（单心）dyon 指标"的识别以及由此得到的"黑洞微观简并度为正"
  记在 holography.immortal-dyon-index-positive（其推导须链入识别③
  holography.dmz-single-center-identification，physical-argument）。

  覆盖范围（task #17 核实，见 extractions/）：
  - Bringmann-Murthy 2012：mock Jacobi 形式**指标 m=1,2**；对这两个 m 覆盖全部 Δ>0
    （含小判别式）。**不是**"充分大判别式"——后者是本项目早期节点里的错误措辞，已订正。
  - Rosselló 2024：补齐 m≥3（m=3,4,5 显式验证，m≥6 一般论证），故 Theorem 1 + Corollary 1.1
    合并覆盖全部 m,n≥1、Δ>0、gcd=1。
  符号约定：Rosselló 的正性带因子 (−1)^{ℓ+1}；本卡照抄该因子，不做符号吸收。
  d_* 的记号沿用 Rosselló Corollary 1.1。

  两处待 reviewer/auditor 复核的措辞（不影响 (a)，只涉及 (b) 的推广步）：
  1. 抽取记录把 Corollary 1.1 的推广步记作"**单心简并度**的 S-对偶（GL(2,ℤ)）不变性"。
     本卡把它读作系数层面的算术轨道不变性（源于 Φ₁₀ 的 Sp(4,ℤ) 模性 + DMZ 分解的典范性），
     以保持纯数学。task #17 的裁定（extractions/rossello-2024.md E4）明确"正性证明本身完全是
     纯数学，弦对偶未作为证明前提"，故按 rigorous 记；若原文 §1/§3 的推广步实际调用的是物理
     S-对偶而非 Siegel 模性，则 (b) 应另立一卡并降级，届时 (a) 仍为 rigorous。
  2. gcd(m,n,ℓ)=1 与 torsion I=1 在抽取记录中被当作同一条件（E1 写 gcd=1，E3 写 I=1）；
     两者在单位挠情形一致，本卡按 gcd=1 表述。
