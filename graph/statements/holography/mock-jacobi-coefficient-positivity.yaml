id: holography.mock-jacobi-coefficient-positivity
kind: proposition
title: 代表元范围内 mock Jacobi 系数符号正性（Thm 1）与全范围单心指标 d_∗>0（Cor 1.1）
statement: |
  设 1/Φ₁₀ 按 σ 展开后、固定指标 m∈ℤ_{>0} 的那一层亚纯 Jacobi 形式经 DMZ 典范分解
  （holography.dmz-mock-jacobi-decomposition）得到有限部 φ_F = ψ_m^F（指标 m 的 mock
  Jacobi 形式），记其傅里叶展开系数为 c_m^F(n,ℓ)：
    ψ_m^F(τ,z) = ∑_{n,ℓ} c_m^F(n,ℓ) q^n y^ℓ,   q = e^{2πiτ}, y = e^{2πiz}。
  另记**单心（免死）指标** d_∗(m,n,ℓ) 为沿吸引子围道 𝒞_∗ 的积分（Rosselló (2.22)–(2.23)）
    d_∗(m,n,ℓ) = ∫_{𝒞_∗} dρ dσ dv · e^{−2πi(mρ+nσ+ℓ(v+½))} / Φ₁₀(ρ,σ,v)，
  即 1/Φ₁₀ 在电荷依赖点（吸引子点）处的傅里叶系数。**d_∗ 一般不等于 (−1)^{ℓ+1} c_m^F(n,ℓ)**：
  后者只在下述代表元范围内与之相等，范围之外须减去多心留数（Rosselló §2.2 (2.34)–(2.35)）。
  则：
  (a) （代表元范围，Rosselló Thm 1）对所有整数 m>0、n≥m、0≤ℓ≤m 有
        (−1)^{ℓ+1} c_m^F(n,ℓ) > 0；
      在代表元范围内（ℓ≤m≤n ⇒ ℓ<2m 且 ℓ<2n）多心贡献为零，此时
        d_∗(m,n,ℓ) = (−1)^{ℓ+1} c_m^F(n,ℓ)。
  (b) （全范围，Rosselló Cor 1.1）对所有 m,n,ℓ∈ℤ 满足
        m ≥ 1,  n ≥ 1,  Δ = 4mn − ℓ² > 0,  gcd(m,n,ℓ) = 1（Rosselló 记为算术不变量
        torsion I = 1；I>1 的三元组可归约到 I=1）
      有
        d_∗(m,n,ℓ) > 0。
  **不得把 (b) 误读为"全范围 (−1)^{ℓ+1} c_m^F(n,ℓ) > 0"——该命题为假**：Rosselló §2.2
  给出 (m,n,ℓ)=(10,1,6)（Δ=4>0，满足 0≤ℓ<2m 但违反 ℓ<2n），此时
  c_10^F(1,6) = 1393564656，(−1)^{6+1} c_10^F(1,6) < 0；减去多心留数后才得
  d_∗(10,1,6) = 50064 > 0（等于代表元 d_∗(1,1,0) = (−1)c_1^F(1,0)）。
  本陈述是纯数学命题，不含任何解释性内容。
