    note: "定理编号未从原文独立核到（PDF 为压缩流），照实记为「主定理」；覆盖范围见 extractions/bringmann-murthy-2012.md E3"
notes: |
  **纯数学命题。** 本卡的两个结论都是关于模形式系数/围道积分的数学陈述，不含物理解读；
  "d_∗ = immortal（单心）dyon 简并度、c_m^F = 其生成函数系数"的识别记在
  holography.immortal-dyon-index-positive（其推导须链入识别③
  holography.dmz-single-center-identification，physical-argument）。

  **陈述对象的两分（task #20 修正 1，依据 extractions/rossello-2024.md R1–R4）**：
  - (a) 的对象是 mock Jacobi 系数 c_m^F，范围是代表元 n≥m、0≤ℓ≤m。
  - (b) 的对象是单心指标 d_∗（吸引子围道积分），范围是全部 Δ>0、gcd=1。
  两者在代表元范围重合，离开代表元范围必须分开——(10,1,6) 的反例已写进 statement 正文。
  本卡早先版本把 (b) 写成"全范围 (−1)^{ℓ+1}c_m^F>0"，与 Rosselló §2.2 (2.34)–(2.35) 直接矛盾，
  已在进 main 之前修正（本卡当时无任何节点依赖，属落地前改草稿，非换代）。

  覆盖范围（task #17 核实，见 extractions/）：
  - Bringmann-Murthy 2012：mock Jacobi 形式**指标 m=1,2**；对这两个 m 覆盖全部 Δ>0
    （含小判别式）。**不是**"充分大判别式"——后者是本项目早期节点里的错误措辞，已订正。
  - Rosselló 2024：补齐 m≥3（m=3,4,5 显式验证，m≥6 一般论证），故 Thm 1 + Cor 1.1
    合并覆盖全部 m,n≥1、Δ>0、gcd=1。
  - gcd(m,n,ℓ)=1 与 torsion I=1：抽取记录 E1 写 gcd=1、E3 写 I=1，本卡按 gcd=1 表述；
    I>1 的归约（Rosselló [52][53][54]）不在本卡范围内。

  **严格度分层（task #20 修正 2）**：
  - (a)：Rosselló §2–§3 + Appendix A 的完整证明（S-对偶约化 + Rademacher 展开 +
    Kloosterman/Bessel 显式定界），m=1,2 由 BM 2012 覆盖。rigorous。
  - (b) 的推广步：'d_∗ 在 GL(2,ℤ) 下不变' 在 Rosselló §2 是**断言**（"It follows from the
    definition of the contour 𝒞_∗ (2.22) that (2.23) is invariant under the duality group"），
    本文未分步重证；其数学根据是 Φ₁₀ 的 Sp(4,ℤ) 模性 + 吸引子围道协变（既有背景结果），
    SL(2,ℤ)→GL(2,ℤ) 的扩群依据是 Φ₁₀ 的**偶权**（原文自足理由："notice that the Igusa cusp
    form has even weight"，[59] 仅作 Siegel 模形式数学手册引用）。该不变性是数学结论，
    故 (b) 仍记 rigorous，但来源是"引用而非重证"，接线细节见推导节点。
  - 待办（留待 reviewer/lead 裁定，不在本卡内）：把 (b) 依赖的"正定二元二次型的
    Gauss/GL(2,ℤ) 约化"（代表域即 (3.1)）落成一张 math 卡，届时本推导应指向它。
