notes: |
  **查重**：`uv run stringgraph search "charge set"` / `"B_2"` 均无同内容命中（2026-09-20）。

  **设立本节点的理由**：research/attempts/gap-102b-multicenter-residue 的 graph-reviewer
  裁决（2026-09-20）要求"BSS 必须先立成图节点，不能只靠 sources 指向 extraction——
  因为 depends_on 必须指向图节点 id，否则 BSS 的 rigorous 状态无法沿边传播"。
  本节点按 graph/CLAUDE.md"一个节点一个命题"原则，只记录 B₂ 的定义本身，
  不含 B₂⊆B 的包含证明（后者为独立命题，见姐妹节点）。

  **记号约定冲突的处理**：按 literature/notes/mn-convention-adjudication.md verdict (c)，
  BSS 与 Rosselló/DMZ 的 m/n 指派真实不同，物理内容一致。本节点如实记录 BSS 自己的约定，
  并在 statement 正文显著标注与 Rosselló/DMZ 的差异（回译审计只读 statement 字段，
  适用范围限定必须进 statement）。
