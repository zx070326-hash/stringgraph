title: "BSS 电荷集 B₂ 定义（eq 5.65, N=1 CHL 模型）"
statement: |
  【记号约定】Type IIB on K3×S̃¹×S¹ 的 ℤ_N orbifold（CHL 模型），N=1 时退化为旗舰 N=4 情形。
  电荷不变量 (n,ℓ,m)（BSS 自己的记号，**不同于 Rosselló/DMZ 约定**——见下方约定差异说明）。

  【定义】（BSS Remark 5.5, eq 5.65，逐字）电荷集 B₂ 定义为满足以下条件的整数三元组 (n,ℓ,m)：
    m, n > 0,
    m ≥ n/N,
    0 ≤ |ℓ| ≤ 2n.
  N=1 时即：m, n > 0,  m ≥ n,  0 ≤ |ℓ| ≤ 2n。

  【与 Rosselló/DMZ 家族的约定差异】BSS 与 Rosselló/DMZ 使用**不同的 m/n 电荷指派约定**：
  - BSS（N=1 时）：m := Q²/2（电荷），n := P²/2（磁荷），ℓ := Q·P。
  - Rosselló/DMZ：m := P²/2（磁荷），n := Q²/2（电荷），ℓ := Q·P。
  **BSS 作者在 footnote 10（p.50）明确声明**："the roles of Q and P are interchanged
  compared to [9]"（[9]=DMZ 1208.4074）。这不是本项目的理解错误，而是原始文献之间真实
  存在的记号分歧。文献记号冲突裁决见 literature/notes/mn-convention-adjudication.md
  （2026-09-20, verdict (c)：两文献约定不同但均正确）。

  本定义是 BSS Appendix B §B.4 证明 B₂⊆B（电荷集 B 的充分子集）的出发点，
  也是 Theorem 5.4(b) 适用范围的具体刻画。
