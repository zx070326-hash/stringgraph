id: holography.rescaling-signed-invariance
kind: proposition
title: 带号重标算子的不变群（Thm E）：D̃_I 与 D_I 共享 Γ⁰(I)-不变性，符号不破坏不变性
statement: |
  沿用 holography.rescaling-signed-operator-definition 的 D̃_I（带号 Q-重标算子）与
  holography.rescaling-invariance-groups（Thm C）的记号。设 U=[[a,b],[c,d]]∈SL(2,ℤ) 满足
  I|b，(m,n,ℓ) 满足 I²|m、I|ℓ，(m′,n′,ℓ′) 为 T′=UTUᵀ（T=[[m,ℓ/2],[ℓ/2,n]]）读出的像。则对
  一切 s|I 使 s²|m、s|ℓ（等价地即 D̃_I 第 s 项非零的项）：
    ℓ′ − ℓ′/s ≡ ℓ − ℓ/s（mod 2）。
  因此符号因子逐项相等：(−1)^{ℓ′−ℓ′/s} = (−1)^{ℓ−ℓ/s}，从而对任意 GL(2,ℤ)-类函数 f，
    D̃_I[f](m′,n′,ℓ′) = D̃_I[f](m,n,ℓ)。
  特别地 D̃_I 在 Γ⁰(I) 下不变——与 holography.rescaling-invariance-groups 给出的 D_I 的不变
  群相同；**带符号并不破坏不变性**。
