notes: |
  **证明骨架（proof.md §8.2）**：由 (0.1) 式 ℓ′=2acm+(ad+bc)ℓ+2bdn，得
    ℓ′ ≡ (ad+bc)ℓ  (mod 2)。   ...(8.1)
  对第 s 项重标三元组 (m/s²,n,ℓ/s) 用同一式（矩阵 V_s=[[a,b/s],[cs,d]]，即
  holography.rescaling-invariance-groups 推导中出现的共轭矩阵）：
    ℓ′/s = 2(acm/s) + (ad+bc)(ℓ/s) + 2(bdn/s)，
  其中 acm/s=acs·(m/s²)∈ℤ（因 s²|m）、bdn/s=(b/s)·dn∈ℤ（因 s|I|b），故
    ℓ′/s ≡ (ad+bc)(ℓ/s)  (mod 2)。   ...(8.2)
  (8.1)−(8.2)：ℓ′−ℓ′/s ≡ (ad+bc)(ℓ−ℓ/s) mod 2。由 ad−bc=1 得 ad+bc=1+2bc 为奇数，故
    ℓ′−ℓ′/s ≡ ℓ−ℓ/s  (mod 2)。
  符号逐项相等；支持集匹配与数值匹配直接复用 holography.rescaling-invariance-groups（Thm C）
  证明中已建立的部分（该卡的步骤(2)(3)）。

  **机检踩过的坑，诚实记录（proof.md §8.2 脚注）**：本机检最初报告"数千个违例"，
  根因是 Python 的 `(-1) ** k`（k 为负整数）返回浮点数而非精确 ±1，导致该轮机检结论被
  反转；修复为 `(-1) ** (k % 2)`，commit `a504e31`。记在此处作为失败模式记录，供后续机检
  脚本参考。

  **与 DGM eq(51)/(52) 矛盾的关系（proof.md §8.2 末段 Reading）**：本卡证明符号约定与
  标架依赖问题**正交**——(3.28)-型与 (3.26)+(3.27)-型两种和都是 Γ⁰(I)-不变而非
  SL(2,ℤ)-不变，本项目另一条未决的 DGM eq(51)/(52) 符号矛盾既不能由本卡解决，也不影响
  本卡结论。
