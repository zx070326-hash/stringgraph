notes: |
  数学侧：Φ₁₀ 的存在性与唯一性（至标量）由 Siegel 模形式维数公式保证（Igusa 1962，
  Gritsenko-Nikulin 1995）。Borcherds 升举公式的严格证明见 Borcherds 1995 和
  Gritsenko-Nikulin 1995；这是严格数学定理，不依赖任何物理论证。
  Lean 可行性：需要 Siegel 模形式（Sp(4,ℤ) 表示）和 Borcherds 乘积，Mathlib 无此基础设施，
  近期不可形式化。在图中作为 rigorous 陈述卡即可（不入 formal/）。

  ---
  【重数订正与开放性说明，physics-auditor 2026-09-20，见
  docs/reviews/phi10-zero-multiplicity-defect-2026-09-20.md 与
  docs/reviews/phi10-multiplicity-normalization-2026-09-20.md】
  本卡是 holography.igusa-cusp-form-phi10 的 v2：唯一实质改动是把重数从
  "单零点"订正为"二重零点"（Div(Φ₁₀)=2H₁），依据见上方 sources。
  【未解决，明确留白】"Sp(4,ℤ)-轨道覆盖整个 Div(Φ₁₀)"这一描述沿用自旧卡与经典文献语言
  （GN1996 式的 Humbert 曲面构造），但 Sen 2008 (D.19) 给出的更一般五参数
  (m1,n1,m2,n2,j) 零点参数化中 n2≠0 的"二次壁"分支是否确实落在同一条
  {mρ+nσ+lv∈ℤ}-型线性代表元的 Sp(4,ℤ)-轨道内，本项目审计认为**证据不足以判定**
  （既非 GN1996 明确证实，也未被本项目自己已审查的
  research/attempts/gap-102b-route-a/ 证明）。本卡措辞维持"Sp(4,ℤ)-轨道"这一标准提法不变，
  但读者应知晓覆盖性本身是开放问题，非本卡断言的一部分。

  【本留白仍然成立，勿因 [GAP-n2] 闭合而误判其失效 —— lead 2026-09-20】
  上一版本的括注写"该 attempt 把 n2≠0 明确列为未闭合的 [GAP-n2]"。该括注**已过时**：
  gap-102b-route-a 的 [GAP-n2] 已于 2026-09-20 闭合（Theorem 9，经 graph-reviewer
  n2rev 裁定 VERIFIED，天花板 rigorous）。**但本留白的结论不受影响，因为两者问的不是
  同一个问题**：
  - Theorem 9 证明的是「**吸引子围道避开** n2≠0 零点分支」（Λ > Λ₀ = 1/(2√Δ) 时）。
  - 本留白问的是「n2≠0 分支是否**落在 H₁ 的 Sp(4,ℤ)-轨道内**」，即 Div(Φ₁₀)=2H₁
    这一描述对 (D.19) 的五参数分支是否**覆盖完全**。
  围道避开某个分支，与该分支属于哪条轨道，是彼此独立的两件事——前者是围道与零点集的
  相交性，后者是零点集自身的轨道分解。故 [GAP-n2] 的闭合**不构成**对本留白的解答，
  覆盖性至今仍无证据判定。（lead 本人一度按"[GAP-n2] 已闭合 ⟹ 本留白已失效"处理，
  读原文后发现是混淆，就地记录以免后人重蹈。）
