  - ref: sen-2008-precision-counting
    loc: "arXiv:0708.1270v4 Appendix C, (C.25)/(C.26)：Φ̂(ρ,σ,v)=−4π²v²g(ρ)g(σ)+O(v⁴)——
          v=0（Humbert 面 H₁）附近显式 v² 阶零点，独立物理 threshold-integral 推导，
          非引用 GN，仅作交叉验证（本项目 note 明确标注'非引用 GN'）。"
notes: |
  数学侧：Φ₁₀ 的存在性与唯一性（至标量）由 Siegel 模形式维数公式保证（Igusa 1962，
  Gritsenko-Nikulin 1995）。Borcherds 升举公式的严格证明见 Borcherds 1995 和
  Gritsenko-Nikulin 1995；这是严格数学定理，不依赖任何物理论证。
  Lean 可行性：需要 Siegel 模形式（Sp(4,ℤ) 表示）和 Borcherds 乘积，Mathlib 无此基础设施，
  近期不可形式化。在图中作为 rigorous 陈述卡即可（不入 formal/）。

  ---
  【重数订正与开放性说明，physics-auditor 2026-09-20，见
  docs/reviews/phi10-zero-multiplicity-defect-2026-09-20.md 与
  docs/reviews/phi10-multiplicity-normalization-2026-09-20.md】
  本卡是 holography.igusa-cusp-form-phi10 的 v2：唯一实质改动是把重数从
  "单零点"订正为"二重零点"（Div(Φ₁₀)=2H₁），依据见上方 sources。
  【未解决，明确留白】"Sp(4,ℤ)-轨道覆盖整个 Div(Φ₁₀)"这一描述沿用自旧卡与经典文献语言
  （GN1996 式的 Humbert 曲面构造），但 Sen 2008 (D.19) 给出的更一般五参数
  (m1,n1,m2,n2,j) 零点参数化中 n2≠0 的"二次壁"分支是否确实落在同一条
  {mρ+nσ+lv∈ℤ}-型线性代表元的 Sp(4,ℤ)-轨道内，本项目审计认为**证据不足以判定**
  （既非 GN1996 明确证实，也未被本项目自己已审查的
  research/attempts/gap-102b-route-a/ 证明）。本卡措辞维持"Sp(4,ℤ)-轨道"这一标准提法不变，
  但读者应知晓覆盖性本身是开放问题，非本卡断言的一部分。

  【本留白仍然成立，勿因 [GAP-n2] 闭合而误判其失效 —— lead 2026-09-20】
  上一版本的括注写"该 attempt 把 n2≠0 明确列为未闭合的 [GAP-n2]"。该括注**已过时**：
  gap-102b-route-a 的 [GAP-n2] 已于 2026-09-20 闭合（Theorem 9，经 graph-reviewer
  n2rev 裁定 VERIFIED，天花板 rigorous）。**但本留白的结论不受影响，因为两者问的不是
  同一个问题**：
  - Theorem 9 证明的是「**吸引子围道避开** n2≠0 零点分支」（Λ > Λ₀ = 1/(2√Δ) 时）。
  - 本留白问的是「n2≠0 分支是否**落在 H₁ 的 Sp(4,ℤ)-轨道内**」，即 Div(Φ₁₀)=2H₁
    这一描述对 (D.19) 的五参数分支是否**覆盖完全**。
  围道避开某个分支，与该分支属于哪条轨道，是彼此独立的两件事——前者是围道与零点集的
  相交性，后者是零点集自身的轨道分解。故 [GAP-n2] 的闭合**不构成**对本留白的解答，
  覆盖性至今仍无证据判定。（lead 本人一度按"[GAP-n2] 已闭合 ⟹ 本留白已失效"处理，
  读原文后发现是混淆，就地记录以免后人重蹈。）

  ---
  ⚠【本卡 statement 第 10 行的 `c(0)=24` 是错的，正确值 `c(0)=20` —— lead 2026-09-20 晚】
  完整分析见 `docs/reviews/phi10-borcherds-exponent-c0-defect-2026-09-20.md`。

  **要点**：statement 里那句「满足 c(k)=24 对 k=0」把 **χ_{K3}(τ,0)=24**（椭圆亏格在
  z=0 的值，即 Euler 示性数）误当成了 **c(0)**（它的 k=0 傅里叶系数）。两者关系是
  `χ_{K3}(τ,0) = c(0) + 2c(−1) = 20 + 4 = 24`，相差 `2c(−1)=4`。
  逐字正确值见 `literature/extractions/phi10-periodicity-and-product.md` 第 43 行
  （kawai-1997 eq.(4.32) 逐字）：`c(0) = 20, c(−1) = 2, c(N) = 0 if N < −1`。

  **为什么没有立即立 v3**（lead 判断，按 `docs/reviews/phi10-v1-retention-decisions-2026-09-20.md`
  确立的判据「该引用是否**实际消费**被订正的量」）：lead 对全图 grep 确认，
  **当前没有任何节点消费 c(0)**（其余 `c(0)` 命中全是 worldsheet 的鬼场算子）。
  故此刻立 v3 会给 28 个引用本卡的文件平白添上"依赖已换代卡"告警，而不修正任何结论。
  v3 留给**第一个真正需要 Borcherds 指数的人**去立，届时新卡指 v3、其余仍正确地留在 v2。

  ⚠ **在此之前，任何人要用本卡的 Borcherds 乘积算指数，必须用 c(0)=20，不要用本卡写的 24。**
  用 24 会得到 `24+2·2=28` 即 η^28（正确是 `20+2·2=24` 即 η²⁴），且错得不显眼——
  仍是 η 的幂，要到最后核模权时才露馅。

  【独立证实，2026-09-20 晚（researcher k3conv，合并提交 60408fb）】上面那条订正此前只有
  **一个**来源支撑（kawai-1997 eq.(4.32)，且经由 `phi10-periodicity-and-product.md` 的转录）。
  k3conv 直接从 arXiv 官方 PDF 用 **PyMuPDF**（未用 pdftotext）重取，得到两条独立支撑：
  - Kawai 1997 eq.(4.32) 逐字复核确认：`c(0) = 20, c(−1) = 2, c(N) = 0 if N < −1`；
  - **另一条独立路线**：GN1996 PDF p.11/p.12（含 200 dpi 渲染图目视）确认 φ_{0,1} 的
    (1.8) 展开中 `r^{±1}` 的系数是 **1**（本项目早前误读为 10），故 `f(0,0)=10, f(0,±1)=1`，
    经 `c = 2f` 给出 `c(0)=20, c(−1)=2`。这与 Kawai 是**不同论文、不同推导**，
    故此处的两份一致**不是回声**（按 lead 的交集判据：二者输入无交集）。
  同轮 k3conv 还证实 χ_{K3}(τ,0)=24 有两个独立来源（KYY 1994 eq.(5.4) 裸印 `χ = 24`；
  Kawai 1997 eq.(4.22) 的 `8 Σ_{ν=1}^{3}(ϑ_{ν+1}(z)/ϑ_{ν+1}(0))²` 在 z=0 给 8·3=24），
  **但两篇都没写 `∀τ` 量词**——该常数性要靠读者从 Jacobi 形式的权/指标自行读出。
  v3 仍**不在本轮立**（船长指令「这轮结束后停下」），留待第一个真正消费 Borcherds 指数的人。
