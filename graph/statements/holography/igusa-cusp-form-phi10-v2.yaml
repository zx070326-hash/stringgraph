  - ref: gritsenko-nikulin-1996
    loc: "p.7（环生成元列表，χ₁₀=Φ₁₀=Δ₅² 恒等式）+ 正文几何结果段（Div(Δ₅)=H₁，
          判别式1 Humbert 曲面 H₁={z₂=0}）；重数 2 由 Div(Φ₁₀)=Div(Δ₅²)=2·Div(Δ₅)=2H₁
          直接代数推出。见 literature/sources.bib gritsenko-nikulin-1996 条目 note，
