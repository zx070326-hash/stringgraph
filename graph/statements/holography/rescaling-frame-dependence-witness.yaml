id: holography.rescaling-frame-dependence-witness
kind: proposition
title: P-重标除子和的标架依赖性（Thm B）：同一格上两个满足算术前提的标架给出不同 D'_2
statement: |
  存在挠 I=2 的秩 2 子格 L⊆Λ 及其两个标架，两者的不变量都满足文献陈述 P-重标公式时
  要求的算术前提 I²|n、I|ℓ，但 holography.rescaling-p-operator-definition 的 D'_2 在两者上
  取不同值。显式地：同一格 L 的两个基给出的不变量 (m,n,ℓ)=(4,8,8) 与 (4,4,0)，均满足
  4|n、2|ℓ，而
    D'_2(4,8,8) = 7 999 235 715 072，
    D'_2(4,4,0) = 7 999 541 469 408，
  差 305 754 336（相对大小 ≈3.8×10⁻⁵）。两个标架的 s=1 项相等（因 (4,8,8)、(4,4,0) 是同一
  GL(2,ℤ)-等价类的代表元，d_* 为类函数），s=2 项不等（因 (4,2,4)→约化 (2,2,0) 与
  (4,1,0)→约化 (1,4,0) 是判别式 −16 的两个不等价类，类数 h(−16)=2）。

  **不是 d_* 特有的现象**：对任意 GL(2,ℤ)-类函数 f 替代 d_*，只要 f 能区分某 s|I,s>1 处
  (m/s²,ℓ/s,n) 与 (m,ℓ/s,n/s²) 的等价类，D_I[f] 与 D'_I[f] 就在同一 (m,n,ℓ,I) 处不一致；
  标架依赖是算子本身的性质，不是免死指标 d_* 的偶然性质。
