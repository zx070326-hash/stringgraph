notes: |
  **依赖链**：格 L 与两个标架的具体构造，来自
  holography.rescaling-adapted-frames-single-coset 机检段落所构造的同一显式格（proof.md
  §5 与 §6 复用同一格）。d_* 的四个具体数值由本项目既有的精确 Fourier 系数机
  （research/attempts/torsion-immortal-positivity-hecke/scripts/{coefficients.py,
  torsion_divisor_sum.py}，该 attempt 已 state: verified）只读复用、本轮重新运行而非信任
  缓存数值。

  **反证 Claim 2 预注册假设成立的方式**：paper.md Remark 6.3 对 Q-重标 D_I 给出了标架依赖
  的整数见证；本卡是它在 P-重标 D'_I 上的精确对偶（proof.md §6 末段：s=1 项 PART 2 也打印
  D_2(4,4,0)=7999541469408 与 D_2(8,4,8)=7999235715072，恰为本卡两个数值的互换，与 Thm A
  预言一致）。
