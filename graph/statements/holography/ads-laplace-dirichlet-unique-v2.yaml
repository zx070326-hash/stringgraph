id: holography.ads-laplace-dirichlet-unique-v2
kind: proposition
title: 欧氏 AdS_{d+1} 上无质量标量的边界值问题有唯一解（Witten §2.2 自称给出证明的那一条；v2：订正式号 (2.8) 并删去「两解之差平方可积」这一编者推断）
statement: |
  设 B_{d+1} ⊂ R^{d+1} 是带度规 ds² = 4 Σ_{i=0}^{d} dy_i² / (1 − |y|²)²（Witten (2.1)，
  AdS 半径 = 1）的欧氏 AdS_{d+1}，B̄_{d+1} 为其紧化，边界为 S^d。
  "无质量场方程" 在此一律指最朴素的 Laplace 方程

      D_i D^i φ = 0          （原文**无编号**；原文逐字把它称作 "the most naive Laplace equation"）

  ——原文同时注明：从某些观点看 AdS 空间里的「无质量」要给方程加一个常数项，但本文取朴素版本。

  则对边界 S^d 上任给的函数 φ(Ω)，B̄_{d+1} 上存在唯一的函数 φ，其边界值为 φ(Ω)
  且在 B_{d+1} 内满足该方程。

  【唯一性的根据（原文的说法）】B_{d+1} 上 Laplace 方程没有非零的平方可积解——原文逐字的理由是
  「若存在这样的解，它可以被加到任一给定解上，从而破坏唯一性」。而非零平方可积解不存在，
  是因为对这样一个解分部积分给

      0 = −∫_{B_{d+1}} d^{d+1}y √g φ D_i D^i φ = ∫_{B_{d+1}} d^{d+1}y √g |dφ|² ,   (2.7)

  故 dφ = 0，再由平方可积性得 φ = 0。

  【存在性的根据（分波展开）】在 (2.5) 的表示 ds² = dy² + sinh²y dΩ² 下，Laplace 方程读作

      ( − (1/(sinh y)^d) (d/dy) (sinh y)^d (d/dy) + L²/sinh²y ) φ = 0 ,    (2.8)

  其中 L² 是 Laplace 算子的角向部分（角动量平方）。写 φ = Σ φ_α(y) f_α(Ω)（f_α 是球谐），
  则对每个 α，方程在**大 y** 处化为

      (d/dy) e^{d y} (d/dy) φ_α = 0 ,                                    (2.9)

  其两个解在无穷远分别趋于常数与 e^{−d y}。两解的**某一个线性组合在 y = 0 附近光滑**，
  而该解在无穷远**有非零常数项**（否则就得到 Laplace 方程的一个平方可积解）。
  故每个分波都有唯一的、在无穷远取给定常数值的解；按适当系数叠加即得在无穷远取任意给定值
  φ(Ω) 的唯一解。

  原文自陈的适用范围（逐字）："the proof we have given is valid for any spherically symmetric
  metric with a double pole on the boundary"，并说去掉球对称假设 "with a little more effort" 亦可；
  §2.4 另给一个基于积分公式的存在性证明，但那个证明需要 B_{d+1} 上度规的显式形式。

  本陈述**不指定**函数空间、正则性与衰减条件，见对应推导的 gaps。
uses_conventions: [conv.ads-radius-unit]
sources:
  - ref: witten-1998-ads
    loc: |
      arXiv:hep-th/9802150v2, §2.2 "Massless Field Equations", 印刷页 p.6（全段连同
      式 (2.7)(2.8)(2.9) 都在这一页），续到 p.7（§2.4 的第二个证明的前瞻、引力与规范场情形）；
      坐标 (2.1)(2.5) 在 §2.1 印刷页 p.4–5。
      （页码是**原文印刷页码**，PDF 页 = 印刷页 + 1；本轮由 curator 按 arXiv v2 页图逐页复核。）
    note: |
      逐字起句："A basic fact about AdS_{d+1} is that given any function φ(Ω) on the boundary S^d,
      there is a unique extension of φ to a function on B̄_{d+1} that has the given boundary values
      and obeys the field equation."
      ⚠ **式号**：D_i D^i φ = 0 在原文**没有编号**（逐字 "by the massless field equation we will
      mean the most naive Laplace equation D_iD^iφ = 0"）。编号 **(2.8)** 属于**另一条**方程——
      (2.5) 表示下带 L²/sinh²y 项的那条。v1 卡 holography.ads-laplace-dirichlet-unique
      把 (2.8) 贴在 D_iD^iφ = 0 上，是式号错配，本卡订正。
      （reviewer-gkpw 2026-09-11 指出；curator 按 arXiv v2 页图复核确认，见印刷页 p.6
      "Now, in the representation (2.5) of B_{d+1}, the Laplace equation reads … (2.8)"。）
      ⚠ 原文式 (2.7) 右端积分测度**印作 d⁵y**，左端是 d^{d+1}y；按上下文应为 d^{d+1}y。
      v2 仍有此印刷错误，本卡按上下文写 d^{d+1}y，**不照抄 d⁵y**
      （extractions/witten-1998-ads.md E-W2）。
tags: [holography, ads-cft, boundary-value-problem, laplace]
notes: |
  from: witten-1998-ads#E-W2（另见 E-W3、E-W4）。

  【与 v1 的差别】本卡换代 holography.ads-laplace-dirichlet-unique（lead 裁决 2026-09-11，
  依 reviewer-gkpw 审查），陈述文本改了三处：
  1. **式号订正**：D_i D^i φ = 0 无编号；(2.8) 是 (2.5) 表示下含 L²/sinh²y 项的方程。
     v1 把 (2.8) 贴在 D_iD^iφ = 0 上。
  2. **补上枢纽步**：存在性论证的关键一句「某个线性组合在 y = 0 附近光滑，且该解在无穷远有非零常数项」
     原文有（印刷页 p.6），v1 的陈述把它漏掉了，于是「每个分波有唯一解」看起来像凭空跳出来。
  3. **删去编者推断**：v1 的推导里写「两个有相同边界值的解之差是平方可积解，必为零」。
     原文**没有**这一句；原文的逻辑方向是反的——「若存在非零平方可积解，它可以被加到任一解上，
     破坏唯一性」。这只说明「无平方可积解」是唯一性的**必要**条件。
     要补成充分条件，需要「两解之差平方可积」，而原文既没有证也没有说；
     更麻烦的是原文在**存在性**那一步又用「否则就得到一个平方可积解」来断定非零常数项，
     所以把同一事实再用于唯一性有逻辑循环的风险。该推断已移入 v2 推导的 gaps 并标明是编者所加。

  【为什么单独立卡（沿用 v1 的理由）】这是 Witten 全文里**唯一自称给出证明**的部分，也是 (2.11)
  那条 ansatz 的显式前提：E-W4 逐字要求体场满足 "the existence of a unique solution on B̄_{d+1}
  with any given boundary values"。把它单列，才能让 holography.gkpw-dictionary-witten 的推导有一条
  非 inferred 的实边，而不是把「适定性」混进字典的陈述文本里。

  【为什么不是 rigorous】Witten 的论证是物理学家式的：没有指定 φ 与 φ(Ω) 所在的函数空间、
  没有讨论分部积分的边界项、没有给分波叠加的收敛性，"平方可积" 相对哪个测度也未写明，
  而且唯一性那一步缺一个环节（见上面第 3 条）。按 docs/STATUS_LEVELS.md，rigorous 需要数学文献里
  被接受的完整证明，或**前提完整** + reviewer 独立复核的有限步初等计算；这里两条都不满足，
  故取 physical-argument。**reviewer-gkpw 2026-09-11 已复核本卡的来源与式号，但明确裁定不可升
  rigorous**（函数空间未定、论证不是有限步初等计算），故本卡**不**写 reviewer-verified。

  【与 Graham–Lee / Fefferman–Graham 的关系】本卡只管**无质量标量**（线性 Laplace 方程）。
  引力与规范场的对应适定性完全是另一回事：引力有 Graham–Lee（Witten 的 [42]，局部、
  只对接近标准共形结构成立，本项目未取得正文，引用不得写定理号）与 Fefferman–Graham
  （Witten 的 [44]，Theorem 2.1/2.3，形式幂级数级、n 偶有障碍，本项目已 L1 核实）；
  规范场 Witten 只说 "one expects" 且脚注 4 用 Chern class 证明大场下必然失败。
  详见 holography.conformal-boundary-so2d 的 notes 与
  holography.gkpw-dictionary-witten--via-witten-ansatz 的 gaps。

  【有质量情形不适用】有质量时 (2.34) 的解在无穷远像 e^{λ y}，**找不到**趋于常数的解，
  φ_0 要由 φ ∼ f^{−λ₊} φ_0（(2.36)）重新定义，而且 φ_0 是权重 λ₊ 的共形密度而非函数
  （E-W11、QW2）。本卡不覆盖那个情形。

  【版本】loc 锚定 arXiv:hep-th/9802150v2 (6 Apr 1998)。
