notes: |
  【论证，curator 亲自 Read proof.md §3 全文核对】直接代入：ℓ=0 时 Im v = ℓΛ = 0，
  故 v = v1（纯实部，与 Λ 无关）；取 v1=0（在实部闭方体 [0,1]³ 内的一点）即得
  F=v=0 对任意 Λ>0 精确成立。proof.md §6 用独立网格搜索脚本
  （scripts/verify_route_a.py）在 3 个 ℓ=0 样本 (n,m)=(2,2),(5,3),(10,1)、7 个
  Λ 值（1~100）下精确复现 min|F|²=0（argmin 落在 (ρ1,σ1,v1)=(0,0,0)），逐位与
  本卡解析结论一致。无缺口。

  【范围边界，明确不断言】本卡只断言"原始命题在 ℓ=0 处不成立"这一反例事实，不
  处理 ℓ=0 情形下 d_*(m,n,0) 的围道积分本身该如何重新定义（proof.md 明确留
  [GAP-ℓ0]，标注为"需要主值/留数规定，不在本尝试范围"，本卡同样不断言）。

  【与既有图节点 holography.igusa-cusp-form-phi10 / holography.phi10-wall-crossing-poles
  的关系——2026-09-20 已订正为一致，见下方追记】proof.md §1.3 与本卡引用的
  GN1996/Sen 2008 D.19 均给出 Div(Φ₁₀) 在 {v=0} 处的**重数为 2**（GN1996：
  Div(Φ₁₀)=2H₁；Sen (D.19) 原文的零点公式本身是 "Φ̃ ∼ (...)²"，平方形式）。本卡
  提交时，旧卡 holography.igusa-cusp-form-phi10 陈述"其唯一零点...为单零点"
  （重数 1），holography.phi10-wall-crossing-poles 也断言"判别式 4mn−l²=1，
  故极点为单零点"——与本卡引用的 GN1996/Sen 2008 在零点重数上直接冲突（1 vs 2）。
  本卡当时刻意不把这两张已有卡接成 depends_on/uses，以免继承这条冲突的多重性断言
  （本卡自身的论证完全不需要多重性信息，只需要"v=0 是一个零点"这一集合论事实）。

  【2026-09-20 追记，curator】physics-auditor 已裁决该冲突：重数确为 2（旧卡的
  "单零点"是错误表述），见
