id: holography.attractor-contour-hits-phi10-zero-at-ell-zero
kind: proposition
title: "ℓ=0 时吸引子围道对一切 Λ>0 恒经过 Φ₁₀ 的零点 v=0：原始「围道避开零点」命题在此边界不成立"
statement: |
  记号（Rosselló (R5) 型吸引子围道，ε=+1 约定，与 holography.attractor-contour-covariance
  的 C_* 同构）：对整数 m,n≥1、ℓ、Λ>0，
    C_*(m,n,ℓ;Λ) := { Ω=(ρ,v;v,σ) ∈ ℍ₂ : Re ρ,Re σ,Re v ∈ [0,1],
                       Im ρ = 2nΛ, Im σ = 2mΛ, Im v = ℓΛ }。

  设 m,n≥1，**ℓ = 0**（故 Δ := 4mn−ℓ² = 4mn > 0）。则对**每一个** Λ > 0，取
  ρ1,σ1 ∈ [0,1] 任意、v1 := 0，点 Ω := (ρ1+i·2nΛ, σ1+i·2mΛ, 0) ∈ C_*(m,n,0;Λ)，
  且该点在 Φ₁₀ 的零点除子上：取 Sen 2008 (D.19) 参数化中的分支
  (m1,n1,m2,n2,j) = (0,0,0,0,1)（满足判别式 4m1n1+4m2n2+j² = 1），对应
  F := n2(σρ−v²)+jv+n1σ−m1ρ+m2 = v，此时 F(Ω) = 0 − 0i = 0 精确成立（与 Λ、
  ρ1、σ1 无关，因为 Im v = ℓΛ = 0 时 v = v1 = 0 恒成立）——即整条超曲面 {v=0}
  （GN1996 意义下的 Humbert 曲面 H₁）与围道的交集非空，对**任意** Λ。

  **结论**：不存在 Λ₀ = Λ₀(m,n,0) 使得对一切 Λ > Λ₀，C_*(m,n,0;Λ) 与 Div(Φ₁₀) 不相交。
  即"存在 Λ₀ 使得充分大 Λ 时吸引子围道避开 Φ₁₀ 零点"这一（对 0≤ℓ≤m 全称量化的）
  命题，在 **ℓ=0** 这个边界处对**一切** m,n≥1 都不成立——障碍与 Λ 无关，是恒等式
  层面的，不是"Λ 不够大"的问题。
