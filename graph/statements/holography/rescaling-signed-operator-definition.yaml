    loc: "research/attempts/p-rescaling-frame-dependence/proof.md §0（记号，D̃_I 的定义式）与 §8（Proposition 8.1 之前引入该算子的段落）"
    note: "本项目原创证明，非已发表文献。见 research/attempts/p-rescaling-frame-dependence/proof.md。status.yaml state: verified（reviewer: rev-prescale, 2026-09-24），captain_confirmed: false。"
notes: |
  **本卡只立定义，不立命题**。D̃_I 在 Γ⁰(I) 下的不变性是命题，记在
  holography.rescaling-signed-invariance；D̃_I 与 Banerjee–Sen–Srivastava arXiv:0802.1556
  eq(7) 的等同是命题，记在 holography.rescaling-bss-is-signed-q-rescaling。

  权 s·(−1)^{ℓ−ℓ/s} 的具体正负号来自 BSS 的符号约定（见后两卡的推导），本卡只把算子本身
  抽象地定义出来，定义本身与任何特定文献脱钩——I=1 时退化为普通的 d_*，与
  holography.torsion-index-divisor-operator 在 I=1 处的行为一致。
