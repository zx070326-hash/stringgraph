id: holography.rescaling-signed-operator-definition
kind: definition
status: rigorous
title: 带号挠指标除子和算子的定义：D̃_I(m,n,ℓ) := Σ_{s|I} s(−1)^{ℓ−ℓ/s} d_*(m/s²,n,ℓ/s)
statement: |
  沿用 holography.torsion-index-divisor-operator 的记号（Q-重标：电荷槽位 m 被 s² 除）。
  定义**带号 Q-重标算子**：对 (m,n,ℓ)∈ℤ³ 满足 I²|m、I|ℓ、m,n≥1、Δ=4mn−ℓ²>0，
    D̃_I(m,n,ℓ) := Σ_{s|I} s·(−1)^{ℓ−ℓ/s}·d_*(m/s², n, ℓ/s)
  （s²∤m 或 s∤ℓ 的项记 0）；对任意 GL(2,ℤ)-类函数 f 替代 d_* 同样定义 D̃_I[f]。
  I=1 时 D̃_1 = D_1 = d_*（符号因子 (−1)^{ℓ−ℓ}=1 平凡）。
uses:
  - holography.torsion-index-divisor-operator
uses_conventions: []
sources:
