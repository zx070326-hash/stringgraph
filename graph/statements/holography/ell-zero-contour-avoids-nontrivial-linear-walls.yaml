id: holography.ell-zero-contour-avoids-nontrivial-linear-walls
kind: proposition
title: "ℓ=0 时吸引子围道对一切 Λ>0 避开 Φ₁₀ 的全部「非平凡线性壁」（n₂=0 且 (m₁,n₁)≠(0,0)）"
statement: |
  记号（与 holography.attractor-contour-avoids-phi10-linear-wall 逐字相同，取 Sen 2008
  (D.19) 的整数参数化）：Div(Φ₁₀) 的每个分支对应一组 (m₁,n₁,m₂,n₂,j) ∈ ℤ⁵、j 奇、
  4m₁n₁ + 4m₂n₂ + j² = 1，零点条件
    F := n₂(σρ − v²) + jv + n₁σ − m₁ρ + m₂ = 0；
  吸引子围道（ε=+1 约定）
    C_*(m,n,ℓ;Λ) := { Ω = (ρ,v; v,σ) : Re ρ, Re σ ∈ [0,1], Re v ∈ ℝ,
                      Im ρ = 2nΛ, Im σ = 2mΛ, Im v = ℓΛ }。
  定义**「非平凡线性壁」** := 满足 n₂ = 0 且 (m₁,n₁) ≠ (0,0) 的分支。
  （n₂=0 且 m₁=n₁=0 的剩余子族由判别式得 j=±1、m₂ ∈ ℤ 自由，零点条件退化为 v = ∓m₂，
  即超曲面族 {v ∈ ℤ}；那一族**确实**命中 ℓ=0 围道，见
  holography.attractor-contour-hits-phi10-zero-at-ell-zero，不在本卡断言范围内。）

  设整数 m, n ≥ 1、**ℓ = 0**。则对**一切** Λ > 0：C_*(m,n,0;Λ) 与 Div(Φ₁₀) 的
  **每一个非平凡线性壁分支**都**不相交**。

  障碍是纯数论的、与 Λ 的大小无关，也与 Re ρ, Re σ, Re v 的取值无关（故 Re v 放开到 ℝ，
  下游需要的半周期平移窗口 Re v ∈ [1/2,3/2] 一并覆盖）。

  【为什么不能直接用姐妹卡】holography.attractor-contour-avoids-phi10-linear-wall 对
  **0 < ℓ ≤ m** 全称量化，且断言的是**全部** n₂=0 分支不相交——这在 ℓ=0 处**是假的**
  （m₁=n₁=0 子族命中）。本卡是它在 ℓ=0 边界处的正确类比：范围收窄到非平凡子族，
  结论仍成立。必须单独立卡。
