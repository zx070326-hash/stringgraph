notes: |
  【论证只有四行，curator 亲自重做并得到比 proof.md §6.2 更短的版本】见推导 summary。
  要点：n₂=0、ℓ=0 时约束 (I)（= Im F = 0，Λ>0 故可约去 Λ）退化为 **m n₁ = n m₁**，
  与判别式 4m₁n₁ + j² = 1（j 奇）联立即得 m₁ = n₁ = 0。proof.md §6.2 把它拆成三个子族
  ((a) m₁=0,n₁≠0；(b) n₁=0,m₁≠0；(c) j²≥9）分别用 Im v ≠ 0 或符号矛盾排除，结论相同。

  【承重上游 [GAP-identify]】同姐妹卡：本卡 statement 说的是 **Div(Φ₁₀)** 的分支，
  而计算做在 **(D.19) 的 F=0 族**上，中间隔着
  holography.sen-d19-family-is-igusa-phi10-divisor（effective physical-argument）。
  该边显式接上，不藏在 inferred 里。

