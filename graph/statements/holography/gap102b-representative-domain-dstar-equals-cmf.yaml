notes: |
  **查重**：`uv run stringgraph search "d_*"` / `"c_m^F"` / `"representative"` 确认
  与既有 holography.mock-jacobi-coefficient-positivity 不重复（后者覆盖全范围 Δ>0、gcd=1，
  本节点只覆盖代表元范围 n≥m、0≤ℓ≤m，且显式依赖 BSS 证明）。

  **设立本节点的理由**：research/attempts/gap-102b-multicenter-residue 的 graph-reviewer
  裁决（2026-09-20, state: verified, status: rigorous）要求把该 attempt 的结论写回 graph/。
  按 research/CLAUDE.md "只有 verified（且最好 captain_confirmed: true）的尝试才允许
  graph-curator 按正常 add-statement 流程把结论写回 graph/"，本节点现在可以毕业进图。

  **与既有节点 holography.mock-jacobi-coefficient-positivity 的关系**：
  - 既有节点覆盖 (a) 代表元范围 mock Jacobi 系数 (−1)^{ℓ+1}c_m^F>0（Rosselló Thm 1）
    + (b) 全范围单心指标 d_*>0（Rosselló Cor 1.1），引 Bringmann-Murthy 2012（m=1,2）
    + Rosselló 2024（m≥3）。
  - 本节点覆盖代表元范围内 d_* = (−1)^{ℓ+1}c_m^F **等式**（BSS Thm 5.4(b) 经翻译），
    不含正性断言本身（正性由既有节点的 (a) 部分给出）。
  - 两节点互补：既有节点给 c_m^F>0（代表元）+ d_*>0（全范围），本节点给 d_*=c_m^F（代表元）。
    合并即得：代表元范围内 d_*>0（via 本节点等式 + 既有节点正性）。

  **剩余技术缺口（reviewer 已标注，可接受为 [GAP] 不阻塞毕业）**：
  BSS"Φ̃₁ exactly the inverse of Φ₁₀"是否严格到"权相同、零点除子相同"（用于 proof.md §4
  引理 3 的一维性论证），本项目依赖转述信任，未从 BSS 一般乘积公式 (5.2) 独立算出
  N=1 特化来做第一性原理确认。这是一个有界、具体、可机械验证的技术缺口，
  数值证据强（三方 +50064 吻合），不影响 proof.md §1-3 的任何独立结论。
