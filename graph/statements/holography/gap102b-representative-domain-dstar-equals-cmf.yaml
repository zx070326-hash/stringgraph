    note: |
      本节点记录的是 BSS 证明经记号翻译后在 Rosselló/DMZ 约定下的陈述。
      BSS 原文用 (n_B,ℓ_B,m_B) 其中 n_B=P²/2(磁)、m_B=Q²/2(电)；
      本节点用 (m,n,ℓ) 其中 m=P²/2(磁)、n=Q²/2(电)，即 n_B→m, m_B→n。
