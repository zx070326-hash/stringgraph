id: holography.bss-rossello-dstar-normalization-constant
kind: proposition
title: BSS-Rosselló d* 归一化常数与积分定向
statement: |
  记 BSS 定义的 Φ̃₁ 与 Igusa Φ₁₀ 的比值为 c := Φ̃₁/Φ₁₀（非零常数，存在性由
  权 10 Sp(4,ℤ) 尖点形式空间一维性保证）。记 E := Q²/2、M := P²/2、ℓ := Q·P，
  定义裸积分
    I := ∫ dρ dσ dv · e^{−2πi(Mρ + Eσ + ℓv)} / Φ₁₀(ρ,σ,v)
  其中围道由 BSS (5.14) 与 Rosselló (2.22) 共同指定（两者经坐标对应与虚部核对
  确认为同一围道）。

  由两文的 d* 定义式逐字对比（BSS (5.13) 与 Rosselló (2.23)）及 N=1 代入，
  可推出关系式
    d*_BSS = (−1)^{ℓ+1}·(1/c)·η·I = −η·(1/c)·d*_R
  其中 η := ±1 是三重围道积分微分次序的定向因子：
  - η = +1：若微分 dτ dσ_B dz（BSS 记号）与 dρ dσ_R dv（Rosselló 记号）按
    Fubini 迭代积分理解（次序无关）；
  - η = −1：若按定向 3-形式（楔积 dτ∧dσ_B∧dz vs dσ_R∧dρ∧dv，对换变号）理解。

  数值锚点 (M,E,ℓ)=(1,1,0)：两文各自报告 d*(1,1,0)=+50064（BSS eq (5.69) 与
  Rosselló Cor 1.1 配合本项目 coefficients.py 验证），代入上式得
    −η/c = 1  ⟹  c = −η
  即：
  - 若 η=+1（迭代积分），则 c=−1，Φ̃₁ = −Φ₁₀；
  - 若 η=−1（楔积定向），则 c=+1，Φ̃₁ = +Φ₁₀。

  但 BSS p.40 逐字原文称："for N=1, the CHL partition function Φ̃_k⁻¹ is
  exactly the inverse of the Igusa cusp form Φ₁₀"，其字面读法为 Φ̃₁ = Φ₁₀
  （即 c=+1）。两条独立路径给出矛盾结果：
  - 若信任迭代积分解释（η=+1）与数值锚点，得 c=−1，与 BSS 原文冲突；
  - 若信任 BSS 原文字面（c=+1）与数值锚点，得 η=−1（楔积定向）。

  本项目尚未判定 c 的取值，因两篇文献均未显式声明三重围道积分的定向约定
  （Fubini 迭代 vs 楔积）。
