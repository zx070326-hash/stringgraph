    loc: "eq (5.69)：数值 d*(10,14,5) = d*(1,0,1) = 50064（BSS 用 S-对偶联系两组；BSS 记号 (n_B,ℓ_B,m_B)=(1,0,1) 对应 Rosselló (m,n,ℓ)=(1,1,0)）"
  - ref: rossello-2024
