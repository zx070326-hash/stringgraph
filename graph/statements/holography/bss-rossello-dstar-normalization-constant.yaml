notes: |
  **完整推导（lead 2026-09-20 第 4 轮指示，逐字采用）**：

  记 E := Q²/2，M := P²/2（N=1），ℓ := Q·P，
  `I := ∫ dρ dσ dv · e^{−2πi(Mρ + Eσ + ℓv)} / Φ₁₀`。

  - Rosselló (2.23)：半周期平移写在指数内 ⇒ `d_*^R = (−1)^ℓ · I`。
  - BSS (5.13)（N=1）：`d*^BSS = (−1)^{ℓ+1} ∫ dτ dσ_B dz · e^{−2πi(Eτ + Mσ_B + ℓz)} / Φ̃₁`。
  - **字典**（由指数配对与围道虚部**双重**确定，互相印证）：`τ ↔ σ_R`、`σ_B ↔ ρ`、`z ↔ v`。
    验证：BSS (5.14) 给 `Im τ = 2M/ε`、`Im σ_B = 2E/ε`、`Im z = −ℓ/ε`；
    Rosselló (2.22) 逐字给 `ρ₂ = 2nΛ = 2EΛ`、`σ₂ = 2mΛ = 2MΛ`、`v₂ = −ℓΛ`。
    取 Λ = 1/ε，**三个虚部逐项完全吻合，连 v/z 虚部的负号都一致**；实部都是
    单位立方体（BSS 的 `0 ≤ Re σ < N` 在 N=1 即 [0,1)）。围道**没有**任何差异。
  - 于是两个积分是同一个积分，**只差三个微分的书写次序**：BSS 写 `dτ dσ_B dz = dσ_R dρ dv`，
    Rosselló 写 `dρ dσ_R dv`——差一次对换。
  - 令 η := +1（若三重积分按 Fubini 迭代积分理解，次序无关）或 η := −1
    （若按定向 3-形式 / 楔积理解，对换变号）。则
    `d*^BSS = (−1)^{ℓ+1}·(1/c)·η·I = −η·(1/c)·d_*^R`。
  - 数值锚点 (M,E,ℓ)=(1,1,0)：两边都是 +50064 ⇒ `−η/c = 1` ⇒ **c = −η**。
    - η=+1（迭代积分）⇒ c=−1，**与 BSS p.40 原文矛盾**。
    - η=−1（楔积定向）⇒ c=+1，**与 BSS p.40 原文一致**。

  **分歧点是具体的**：两篇文章都没有明写三重围道积分的微分书写次序是否带定向。
  注意 ℓ=0 时锚点对 v 虚部符号不敏感，所以上式与 ℓ≠0 的任何壁跨越问题无关，
  是干净的。

  **候选出口**（均未被本轮排除）：
  (a) BSS "exactly the inverse" 是松散措辞，不承诺整体正负号/归一化；
  (b) Rosselló（或本项目 coefficients.py）用的 Φ₁₀ 归一化与 BSS 差整体 −1；
  (c) 某个定义式的符号被本项目 extraction 读错；
  (d) 三重积分定向约定（Fubini vs 楔积）确为分歧点，η=−1 是正确解释。

  **与 ℓ=0 壁穿越的关系**：research/attempts/ell-zero-wall-degeneracy 证明了
  ℓ=0 时吸引子围道穿过 Φ₁₀ 的二阶零点（v=1/2），但留数 ∝ ℓ = 0 使 d* 自动良定。
  该证明不依赖 c 的具体值（只需 c≠0），故不受本卡未定性影响。
