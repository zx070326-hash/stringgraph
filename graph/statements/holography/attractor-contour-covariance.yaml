id: holography.attractor-contour-covariance
kind: proposition
title: 吸引子围道协变性（Thm 4.1）：重标 Ω↦A_sΩA_sᵀ 精确映射吸引子围道
statement: |
  沿用 research/attempts/torsion-immortal-positivity-hecke/proof.md §4 的约定：
    T = T(m,n,ℓ) := [[m, ℓ/2],[ℓ/2, n]]，adj(T) = [[n, −ℓ/2],[−ℓ/2, m]]；
    A_s := diag(s,1)，𝒱_s F := F ∘ (Ω ↦ A_s Ω A_sᵀ)；
    C_*(m,n,ℓ;Λ) := { Ω ∈ ℍ₂ : Re ρ, Re σ, Re v ∈ [0,1]，Im Ω = 2Λ·adj(T(m,n,ℓ)) }（Rosselló (R5′)）；
    𝔉[F; m,n,ℓ; Λ] := ∫_{C_*(m,n,ℓ;Λ)} F(Ω)·e^{−2πi(mρ+nσ+ℓv)} dρ dσ dv。
  设 F 在 ℍ₂ 上亚纯且对一切整对称矩阵 S 满足 F(Ω+S) = F(Ω)。
  设 (m,n,ℓ) 满足 m,n ≥ 1，Δ = 4mn−ℓ² > 0，s ≥ 1，Λ > 0。
  记 (m′,n′,ℓ′) := (m/s², n, ℓ/s)，Λ′ := s²Λ。设 C_*(m′,n′,ℓ′;Λ′) 避开 F 的极点。则：
  (a) 若 s²|m 且 s|ℓ（故 m′,ℓ′ ∈ ℤ）：
        𝔉[𝒱_s F; m,n,ℓ; Λ] = 𝔉[F; m′, n′, ℓ′; Λ′]。
  (b) 否则 𝔉[𝒱_s F; m,n,ℓ; Λ] = 0。
  取 F = 𝒢（holography.torsion-index-divisor-operator），有推论（Cor 4.2）：
    对 m,n≥1, Δ>0, s²|m, s|ℓ：𝔉[𝒱_s 𝒢; m,n,ℓ; Λ] = d_*(m/s², n, ℓ/s)。
