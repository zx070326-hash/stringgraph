notes: |
  **未被判定为已发表**：proof.md 明确写"I have not found it stated; it is implicit in
  Banerjee–Sen 0801.0149"。arXiv:0801.0149 已登记 literature/sources.bib（bib key
  banerjee-sen-2008-tduality），但 proof.md 本身未给出具体章节/公式号支持这一猜测，只是
  一句未经核实的推测；因此本卡**不**把它列为 sources.ref——按图/CLAUDE.md「每条边都要有
  来源」的门槛，"能在 sources.loc 指向的位置找到对应论证"要求具体定位，猜测性的"隐含"
  不满足这一门槛。本卡 status 定为 rigorous 是因为这是本 attempt 内部自足的原创证明，不
  依赖 0801.0149 的正确性，只是承认该结论可能已隐含在其中而未独立核实过。

  **证明核心（proof.md §5）**：Q₀=I·Q̃（Q̃∈Λ），Q₀∧P₀=I·(Q̃∧P₀)，故 I=gcd(Q₀∧P₀)=
  I·gcd(Q̃∧P₀)，得 gcd(Q̃∧P₀)=1，即 P₀ 在 Λ 中本原。Λ 幺模 ⟹ 存在 λ∈Λ 使 P₀·λ=1。
  Q=aQ₀+bP₀，Q₀∈IΛ，故 Q∈IΛ ⟺ bP₀∈IΛ；若 bP₀∈IΛ 则 b=b(P₀·λ)=(bP₀)·λ∈Iℤ；反之
  I|b ⟹ bP₀∈IΛ 显然。对偶陈述用 S-对偶元 S=[[0,1],[−1,0]]：(Q,P)↦(P,−Q) 把
  "Q-适配"↔"P-适配"、Γ⁰(I)↔Γ₀(I) 互换。

  **机检（scripts/lattice_frames_output.txt block L1）**：U⊕U⊂Λ 中显式格 L=ℤQ+ℤP，
  Q=4f₁+e₂+4f₂, P=2e₁+4f₁，torsion 2，P∈2Λ（P-适配）、Q∉2Λ（非 Q-适配）；标架
  (Q,P−Q)（对应 U=[[1,0],[−1,1]]，c=−1≢0 mod 2，故落在 Γ₀(2) 之外）既非 Q-适配也非
  P-适配，与 Prop 5.1 预言一致（只有 Γ₀(2) 陪集内的标架才 P-适配）。
