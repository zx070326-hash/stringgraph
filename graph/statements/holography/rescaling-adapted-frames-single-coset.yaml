id: holography.rescaling-adapted-frames-single-coset
kind: proposition
title: 标架的适配集合恰为一个陪集（Prop 5.1）：adapted frame ⟺ Γ⁰(I)/Γ₀(I) 陪集
statement: |
  设 Λ 为 II 型 K3×T² 电荷格（偶、自对偶、号差 (6,22)），L=ℤQ+ℤP⊆Λ 为秩 2 本原子格，
  挠 I:=gcd(Q∧P)（L 的不变量，与标架选取无关，Q∧P 是 L 不依赖于基取法的量）。称标架
  (Q,P) **Q-适配**若 Q∈IΛ，**P-适配**若 P∈IΛ。设 L 至少有一个 Q-适配标架 (Q₀,P₀)。则
  标架 (Q,P)=(aQ₀+bP₀, cQ₀+dP₀)（U=[[a,b],[c,d]]∈SL(2,ℤ)）是 Q-适配的**当且仅当** I|b；
  因此 L 的全体 Q-适配标架恰为陪集 Γ⁰(I)·(Q₀,P₀)。对偶地，若 L 至少有一个 P-适配标架，
  其全体 P-适配标架恰为一个 Γ₀(I)-陪集。

  **推论（两个已发表公式都是良定义的，只是丢了适配性标注）**：结合
  holography.rescaling-invariance-groups（Thm C），D_I 在 L 的一切 Q-适配标架上取同一值，
  D'_I 在 L 的一切 P-适配标架上取同一值；两个已发表公式都是良定义的函数
  (格 L, 适配类型)，唯一失败的一步是把适配性从记号中丢掉。
