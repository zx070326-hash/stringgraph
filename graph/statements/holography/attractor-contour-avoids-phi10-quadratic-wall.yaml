notes: |
  【论证，curator 亲自 Read proof.md §5.7 全文核对】本卡毕业 Theorem 9 及其
  承重依赖 Proposition 7 / Corollary 8。核心突破是 Prop 7 的相消机制（所有
  n1₀,m1₀,ρ1,σ1 依赖精确相消），使顶点高度公式化简为只依赖 (j,n2,v1) 的闭式：
  ```
  Λ²(t*) = 1/(4n2²Δ) − (j − 2n2v1)²/(16mnn2²)
  ```
  第二项是减去平方数（非负），故 `Λ²(t*) ≤ 1/(4n2²Δ) ≤ 1/(4Δ)`（Corollary 8），
  对**所有** n2≠0、所有 j、所有满足 (I) 约束的 (ρ1,σ1,v1)∈[0,1]³ **一致成立**。
  因此取 Λ₀ = 1/(2√Δ) 使 Λ₀² = 1/(4Δ)，当 Λ > Λ₀ 时 Λ² > 顶点最大值，(R) 式
  无实数 t 解，更无整数 t 解，n2≠0 分支无解（Theorem 9）。

  **论证路径**（proof.md §5.7，经 graph-reviewer n2rev 2026-09-20 对抗性审查）：
  - §5.7.1：移位 (n1,m1)→(n1+nt,m1+mt) 下 Λ²(t) 是开口向下抛物线（最高次系数
    精确等于 −mn/(n2²Δ)<0，对任意 n2≠0 恒负，SymPy 符号验证）。
  - §5.7.2：(I) 约束允许把 σ1 表示为 ρ1,v1,n1₀,m1₀,n2,j 的函数。
  - §5.7.3（关键）：直接对顶点值 g(t*) = C − B²/(4A) 做符号化简（不分离 B 和 C），
    代入 (I) 约束，SymPy `simplify` **自动发现所有 n1₀,m1₀,ρ1,σ1 依赖精确相消**，
    只留下 Prop 7 的闭式。独立验证脚本 `scripts/verify_correct_B.py`（SymPy 符号
    恒等式检查 + 100 组精确 Fraction 算术数值验证）全部通过。
  - §5.7.4：从 Prop 7 直接得 Cor 8（利用"第二项是减去平方数"而非逐项取绝对值，
    后者会破坏几何意义），再得 Thm 9 的显式 Λ₀。
  - 参数化完备性（reviewer 补上的承重点）：Sen (D.19) 的零点分支由整数五元组
    参数化；(I) 式在移位下不变，故任何满足 (I) 的整数对都落在某个 canonical 基点
    的轨道上；Prop 7 对**任意**基点成立且最终公式与基点无关，故一致覆盖全部分支。

  **本结果比姐妹卡弱一档**：姐妹卡（n2=0，线性壁）对**一切** Λ>0 都成立（纯数论
  障碍，与 Λ 大小无关）；本卡需要 Λ>Λ₀（解析障碍，但 Λ₀ 是显式可构造的）。
  两卡适用范围相同（0<ℓ≤m≤n，Δ>0），合并给出完整证明。

  **[GAP-identify] 的处理**（同姐妹卡，照既有做法）：姐妹卡 notes 已详细记录该
  GAP（Sen 的 Φ̃ 自身坐标 = 标准 Φ₁₀ 坐标的等同是合理推断但非文献逐字断言）；
  姐妹卡当时刻意不依赖 holography.igusa-cusp-form-phi10 / phi10-wall-crossing-poles
  两张旧卡（因重数冲突），后来 physics-auditor 已裁决并新建 v2 卡订正，本卡现在
  可以直接依赖 igusa-cusp-form-phi10-v2（"零点重数为 2"）。本卡在 `uses` 里连该
  v2 卡，在 statement 里显式写明 [GAP-identify] 的限定与 reviewer 的裁决（只影响
  诠释不影响代数性质），与姐妹卡保持一致做法。

  **与既有图节点的关系**（2026-09-20 已订正为一致）：holography.igusa-cusp-form-phi10-v2
  与 holography.phi10-wall-crossing-poles-v2 两张 v2 卡已订正零点重数为 2（旧卡
  "单零点"是错误表述），与本卡引用的 Sen 2008 D.19 / GN1996（重数 2）一致。
  v2 卡仍维持"Sp(4,ℤ)-轨道"措辞并在 notes 里注明 n2≠0 轨道覆盖性仍是开放问题，
  与本卡记录的 [GAP-identify] 一致。本卡依赖 igusa-cusp-form-phi10-v2（零点重数），
  不依赖 phi10-wall-crossing-poles-v2（那张卡只讲极点结构与留数，与本卡的零点
  避让无直接依赖）。完整取证与裁决见 docs/reviews/phi10-zero-multiplicity-defect-2026-09-20.md
  与 docs/reviews/phi10-multiplicity-normalization-2026-09-20.md。

