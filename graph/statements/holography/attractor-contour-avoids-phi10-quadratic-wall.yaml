id: holography.attractor-contour-avoids-phi10-quadratic-wall
kind: proposition
title: "0<ℓ≤m≤n 时吸引子围道对充分大 Λ 完全避开 Φ₁₀ 的「二次壁」（n2≠0）零点分支"
statement: |
  记号（同姐妹卡 holography.attractor-contour-avoids-phi10-linear-wall；
  Sen 2008 (D.19) 的整数参数化）：Div(Φ₁₀) 的每个分支对应一组
  (m1,n1,m2,n2,j)∈ℤ⁵、j 奇、4m1n1+4m2n2+j²=1，零点条件
    F := n2(σρ−v²) + jv + n1σ − m1ρ + m2 = 0。
  **「二次壁」分支** := 满足 n2≠0 的所有分支（此时 F 关于 (ρ,σ,v) 含二次项）。
  吸引子围道 C_*(m,n,ℓ;Λ) := { Ω=(ρ,v;v,σ) : Re ρ,Re σ,Re v∈[0,1],
  Im ρ=2nΛ, Im σ=2mΛ, Im v=ℓΛ }（ε=+1 约定）。

  设整数 n≥m≥1、**0<ℓ≤m**、Δ:=4mn−ℓ²>0。则**存在显式可构造的** Λ₀ = 1/(2√Δ)，
  使得 ∀Λ>Λ₀：C_*(m,n,ℓ;Λ) 与 Div(Φ₁₀) 的**每一个 n2≠0 分支**（即一切满足
  n2≠0、4m1n1+4m2n2+j²=1、j 奇的 (m1,n1,m2,n2,j)）都**不相交**。

  换言之：F=0（对某 n2≠0 分支）与 Ω∈C_*(m,n,ℓ;Λ) 联立，在 0<ℓ≤m≤n、Δ>0、
  Λ>Λ₀ 的条件下，对**一切** n2≠0、j 奇、整数 (m1,n1,m2) 都无解 (ρ1,σ1,v1)
  （ρ1,σ1,v1∈[0,1]）。

  **关键结果**：Λ₀ 是**显式公式** `1/(2√Δ)`，不依赖穷举或 n2,j 的上界——这比
  一般"存在性论证"更强。该闭式来自顶点高度的精确相消机制（Proposition 7，
  所有 n1₀,m1₀,ρ1,σ1 依赖精确相消，只留下 j,n2,v1 的封闭公式，进而得到一致界）。

  **上游开放前提 [GAP-identify]**：Sen 2008 的 Φ̃ 自身坐标 = 标准 Φ₁₀ 坐标，
  这一等同是合理推断而**非文献逐字断言**（research/attempts/gap-102b-route-a/
  proof.md §1 标注，经 GN1996 `Div(Φ₁₀)=2H₁` 交叉验证支持）。该 GAP **只影响
  "这是哪一份 Φ₁₀ 的零点"的诠释，不影响 (D.19) 本身的代数性质**（判别式、
  F 的定义），故本卡的代数推导不受影响（graph-reviewer n2rev 裁决，2026-09-20，
  见 research/attempts/gap-102b-route-a/status.yaml）。

  **与姐妹卡的关系**：本卡与 holography.attractor-contour-avoids-phi10-linear-wall
  （n2=0 分支，对**一切** Λ>0 成立）互补覆盖 Sen (D.19) 的全部分支。两卡合并
  给出 0<ℓ≤m≤n 时"围道避开 Div(Φ₁₀)"的完整证明。

  **ℓ=0 可外推**：proof.md §5.7 全节没有任何一步除以 ℓ，Proposition 7 的公式
  在 ℓ=0 处不退化（ℓ=0 ⟹ Δ=4mn>0），故 Theorem 9 搬到 ℓ=0 合法，Λ₀ 具体化为
  `1/(4√(mn))`。ℓ=0 的完整处理（含 n2=0 分支的零点命中但留数为零）属于另一个
  attempt（research/attempts/ell-zero-wall-degeneracy/），本卡的主陈述范围
  仍写 0<ℓ≤m 以与姐妹卡保持一致。
