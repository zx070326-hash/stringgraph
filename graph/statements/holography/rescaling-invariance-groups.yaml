id: holography.rescaling-invariance-groups
kind: proposition
title: 重标除子和的精确不变群（Thm C）：D_I 关于 Γ⁰(I) 不变，D'_I 关于 Γ₀(I) 不变
statement: |
  沿用 T(m,n,ℓ)=[[m,ℓ/2],[ℓ/2,n]]，U=[[a,b],[c,d]]∈SL(2,ℤ) 作用 T↦UTUᵀ 给出
  (m,n,ℓ)↦(m′,n′,ℓ′)（holography.rescaling-reflection-transfer 的记号），以及
  holography.torsion-index-divisor-operator 的 D_I（Q-重标）、
  holography.rescaling-p-operator-definition 的 D'_I（P-重标）。定义同余子群
  Γ⁰(I) := {U=[[a,b],[c,d]]∈SL(2,ℤ) : I|b}，Γ₀(I) := {U : I|c}。则：
    对一切 U∈Γ⁰(I)：D_I(m′,n′,ℓ′) = D_I(m,n,ℓ)。
    对一切 U∈Γ₀(I)：D'_I(m′,n′,ℓ′) = D'_I(m,n,ℓ)。
  该结论对任意 GL(2,ℤ)-类函数 f 替代 d_* 同样成立（记 D_I[f]、D'_I[f]）。

  **精确性（非平凡，Γ⁰(I) 不只是不变群的下界）**：在 I=2、(m,n,ℓ)=(4,8,0) 处，SL(2,ℤ) 关于
  Γ⁰(2) 的三个陪集给出三个互不相同的 D_2 取值
  （479643211429797888 / 479644528841797440 / 479643201102715656），
  故该点的稳定子恰为 Γ⁰(2)。（在其他点如 (4,4,0) 两个陪集可能数值偶合相等，proof.md
  指出这是 d_* 具体取值的偶然现象，不构成更大不变群的证据。）
