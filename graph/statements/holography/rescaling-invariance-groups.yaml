notes: |
  **不是新数学，是已知结果的电荷侧重新表述 + 精确性数值验证**（proof.md §4 自陈）。
  D_I 的 Γ⁰(I)-不变性即 DGM 0803.2692 eq(4.5)-(4.7)（本卡 sources 已逐字核对）；proof.md
  另指出 Cardoso–Nampuri–Rosselló arXiv:2007.10302 附录 A (A.9)-(A.11) 有同一计算的独立版本
  ("Demanding m_γ∈ℤ, n_γ∈t²ℤ, ℓ_γ∈tℤ implies that q is a multiple of t, and hence γ lies in
  the subgroup Γ⁰(t)")——**CNR 未登记 literature/sources.bib**（本卡写入范围不含
  literature/），故本卡不直接引用其 key，只在此转述 proof.md 的核对结果，建议 lead 转派
  researcher 登记后补入本卡 sources。
  D'_I 的 Γ₀(I)-不变性由 Thm A（holography.rescaling-reflection-transfer）代换
  (m,n,ℓ)↦(n,m,ℓ) 得到——该代换把 U 的 b,c 位置互换，把 Γ⁰(I) 条件变成 Γ₀(I) 条件。

  **精确性发现是本卡的新增内容**：(4,8,0), I=2 处三个陪集给出三个不同取值，证明 Γ⁰(2) 恰为
  稳定子而非只是不变群的下界；这一精确性验证proof.md 认为是本 attempt 的贡献，DGM/CNR
  原文只证明了不变性（下界方向），未讨论精确性。
