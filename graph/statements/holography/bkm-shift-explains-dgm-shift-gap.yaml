notes: |
  **与 holography.dgm-torsion-divisor-sum 的关系**：该既有卡陈述 DGM eq(52)/(3.28)（Ω_I 的
  除子和，本项目认为是物理正确的版本）,其 notes 中已非正式记录"疑似 eq(51)/(3.27) 漏了偶除子
  的半整平移"。本卡把这个"疑似"精确化为定理：半整平移 (d−1)/2 恰好是 DGM eq(51)/(3.27) 与
  从 eq(2.11)+(2.13) 纯代数推出的闭式之间**唯一的差别**，并给出了偶除子确实不同（而非碰巧
  相等）的严格理由（Borcherds 乘积在判别式 −1 处系数非零，见
  holography.bkm-phi10-odd-elliptic-coefficient-nonzero）。

  **不是对该差别存在性的唯一佐证**：另一 research attempt
  （torsion-immortal-positivity-hecke）已用显式整数见证（I=2，(m,n,ℓ)=(4,1,2)，差值
  101412 = 4·d_*(1,1,1)）独立确认了这一差别的存在性；本卡给出的是代数层面"差别来自何处"的
  解释，两者是独立互证的不同论证路径，互不依赖。

  **对外声明边界**：判定 DGM eq(51)/(52) 不相容是本项目原创发现，若要对外声明需船长确认
  （见 holography.dgm-torsion-divisor-sum notes 与
  research/attempts/bkm-shift-explanation/status.yaml）；本卡陈述的数学内容（半整平移的
  代数来源）本身不因此受限，但引用时应连带说明这一边界。

  **提醒（不在本卡范围内，供 lead 参考）**：holography.torsion-index-divisor-operator 定义的
  𝒢_I（重标 v↦sv 之后再整体平移 1/2，即 −Σ_s s/Φ₁₀(s²ρ,σ,sv+1/2)）与本卡的 Z_I（平移量
  (d−1)/2 依赖除子、d=1 时平移为 0）是两个不同的对象，不应混淆——该既有卡自己的 notes
  末段已提醒"𝒢_I ≠ [𝒯_I(1/Φ₁₀)]|_{v↦v+1/2}"，与本卡的区分一致，无冲突。
