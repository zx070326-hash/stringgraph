id: holography.bkm-shift-explains-dgm-shift-gap
kind: proposition
title: 推论 B1——半整平移是 DGM eq(51) 与 A-N eq(2.11)+(2.13) 闭式之间唯一的差别
statement: |
  沿用 holography.bkm-shift-closed-form 给出的闭式
    Z_I^{(4|4)}(τ,z,σ) = Σ_{d|I} d/Φ₁₀(τ, dz+(d−1)/2, d²σ)，
  与 DGM（Dabholkar–Gomes–Murthy 2008）原文给出的无平移除子和公式
    𝒵_I(ρ,σ,v) = Σ_{s|I} s/Φ₁₀(s²ρ,σ,sv)（DGM 官方 arXiv PDF eq(3.27)，ar5iv 自动编号 eq(51)）
  逐项比较：
  (a) **奇除子 d 上两式相等**：由 holography.phi10-periodic-in-v 的整周期性，
      (d−1)/2 ∈ ℤ 时 Φ₁₀(τ,dz+(d−1)/2,d²σ) = Φ₁₀(τ,dz,d²σ)，故半整平移闭式与 DGM 无平移式
      在奇除子项上给出同一值；
  (b) **偶除子 d 上两式一般不相等**：(d−1)/2 是半整数（非整数），不能被 Φ₁₀ 的整周期性吸收；
      由 holography.bkm-phi10-odd-elliptic-coefficient-nonzero（Φ₁₀ 的 Borcherds 乘积在判别式
      −1 处系数非零，故 Fourier–Laurent 展开在椭圆变量方向含非零奇数次幂项），半整平移一般
      改变 Φ₁₀ 的取值，故偶除子项上半整平移闭式与 DGM 无平移式一般不相等。
  结论：DGM eq(51)（无平移）与本项目从 A-N eq(2.11)+(2.13) 纯代数推出的半整平移闭式，
  两者之间唯一的差别恰是偶除子项上缺少的半整平移 (d−1)/2；奇除子项上两式因 Φ₁₀ 整周期性
  而等价。
