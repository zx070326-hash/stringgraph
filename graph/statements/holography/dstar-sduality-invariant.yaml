notes: |
  **本项目原创证明，非已发表文献。** 见 research/attempts/torsion-immortal-positivity-hecke/proof.md Prop 4.4。

  **证明核心（proof.md §4 Prop 4.4）**：
  令 Ω′ = AΩAᵀ，T′ = A^{−T}TA^{−1}。三步：
  (1) 相位：Tr(ΩT) = Tr(A^{−1}Ω′A^{−T}T) = Tr(Ω′T′)。
  (2) 围道：Im Ω′ = A(2Λ adj T)Aᵀ；由 det A = ±1 得 A adj(T)Aᵀ = adj(T′)（对 SL(2,ℤ) 用 det A=1；
      对 A = diag(1,−1) 直接算）；故 Im Ω′ = 2Λ adj(T′)，**Λ 不变**。
  (3) 实部与 Jacobi 行列式：Sym₂(ℝ)/Sym₂(ℤ) 在 Ω↦AΩAᵀ 下双射（det A = ±1 保证整格映整格），
      Jacobi 行列式 det(A)³ = ±1，被积函数周期性在新实部坐标下保持。
  这是关于 𝒢 任意的纯数学结论，无需 mock 模形式结构。

  **Note 4.5（关闭 Rosselló 引用疑虑）**：Rosselló 由 Thm 1 推 Cor 1.1 的桥梁句是
  "as a consequence of the S-duality invariance of the single centered degeneracies"。
  本节点的纯数学证明使 Cor 1.1 不再依赖物理 S-对偶，只依赖 Φ₁₀ 的 Sp(4,ℤ) 模性和围道定义。
  GAP 6.3 于 2026-09-15 关闭（逐字抽取确认 Cor 1.1 陈述不含 gcd 前提）。
