id: holography.dstar-sduality-invariant
kind: proposition
title: d_* 的 GL(2,ℤ) 不变性（Prop 4.4）：单心指标只依赖正定二元二次型的等价类
statement: |
  沿用吸引子围道约定（proof.md §4 Prop 4.4）：
    d_*(m,n,ℓ) := 𝔉[𝒢; T(m,n,ℓ); Λ]（吸引子围道积分，Λ 充分大）。
  设 A ∈ GL(2,ℤ)，T′ := A^{−T}·T(m,n,ℓ)·A^{−1}，令 (m′,n′,ℓ′) 由 T′ 读出。则：
    d_*(m′,n′,ℓ′) = d_*(m,n,ℓ)。
  即：d_* 只依赖 T = [[m, ℓ/2],[ℓ/2, n]] 的 GL(2,ℤ)-轨道，与轨道内的代表元选取无关。
  特别地（取 A = diag(1,−1)）：d_*(m,n,−ℓ) = d_*(m,n,ℓ)，即 d_* 关于 ℓ 为偶函数。
  对任意 m,n≥1, Δ=4mn−ℓ²>0 的整数三元组，其等价类在 GL(2,ℤ)-Gauss 约化下存在唯一
  满足 0≤ℓ≤m≤n 的代表元，故 d_* 在全域的正性 ⟺ 在约化域的正性（即 Rosselló Cor 1.1 的桥梁）。
