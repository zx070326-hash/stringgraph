id: holography.gkpw-dictionary
kind: proposition
title: GKPW 字典：体场的边界值是边界算子的源（按 GKP 与 Witten 两篇原文分写，不给教科书通式）
statement: |
  本卡按两篇 1998 年原始文献**分别**记录三条等式，不写教科书通式
  Z_CFT[φ_0] = Z_string[φ|_∂ = φ_0]——两篇原文都没有写出那个通式（见 notes）。

  ─────────────────────────────────────────────────────────────────────
  (W1) Witten hep-th/9802150v2 式 (2.11)（欧氏号差；边界是共形边界 S^d；AdS 半径 = 1）

  设 φ 是 AdS_{d+1} 上的无质量标量场，满足 D_i D^i φ = 0（或任何具有同一基本性质的方程：
  对任意给定边界值在 B̄_{d+1} 上存在唯一解）。令 φ_0 是 φ 到边界 S^d 的限制。
  假定在对应关系中 φ_0 通过耦合 ∫_{S^d} φ_0 O 与一个边界共形场 O 耦合。
  令 Z_S(φ_0) 是 B_{d+1} 上的超引力（或弦论）配分函数，边界条件为「在无穷远处 φ 趋于给定
  的 φ_0」；在经典超引力近似下

      Z_S(φ_0) = exp( − I_S(φ) ) ,                                        (2.10)

  其中 I_S 是经典超引力作用量，φ 是把 φ_0 按经典运动方程延拓到 B_{d+1} 的解。则

      ⟨ exp ∫_{S^d} φ_0 O ⟩_CFT = Z_S(φ_0) .                              (2.11)

  注意左边是**生成泛函**而不是配分函数；积分在共形边界 S^d 上而不是 R^d 上；
  边界条件里**没有**任何 z^{Δ−d} 重标度因子。

  ─────────────────────────────────────────────────────────────────────
  (W2) Witten 式 (2.12)（度规源版本，这才是原文里两边都写成 Z 的那条）

  记 Z_CFT(h) 为边界共形场论在带共形结构 h 的 S^d 上的配分函数（暂时压下一个 c-数反常），
  Z_S(h) 为对「在边界附近有二阶极点、并在边界上诱导出给定共形结构 h」的度规做积分所得的
  超引力（或弦论）配分函数；经典超引力近似下 Z_S(h) = exp(−I_S(g))，g 是满足该边界行为的
  Einstein 方程解。则

      Z_CFT(h) = Z_S(h) .                                                 (2.12)

  规范流版本（式 (2.13)）：若体理论有规范群 G，则 G 是边界理论的**整体**对称群，
  边界有流 J_a；令 Z_S(A_0) 是规范场在无穷远趋于 A_0 的超引力/弦论配分函数，则

      ⟨ exp ( ∫_{S^d} J_a A_0^a ) ⟩_CFT = Z_S(A_0) .                      (2.13)

  ─────────────────────────────────────────────────────────────────────
  (G) GKP hep-th/9802109v2 式 (12) 与 (23)（洛伦兹号差 (−,+,+,+)；边界取在**有限截断** z = R）

  记 W 为规范理论连通格林函数的生成泛函，S 为 AdS 空间上的超引力作用量，
  K 为 S 在给定边界条件下的极小值。则

      W[g_{μν}(x^λ)] = K[g_{μν}(x^λ)] = S[g_{μν}(x^λ, z)] ,               (12)
      W[φ(x^λ)]      = K[φ(x^λ)]      = S[φ(x^λ, z)] .                    (23)

  (12) 的边界条件是

      ds² = (R²/z²)( g_{μν} dx^μ dx^ν + dz² ) + O(1)   当 z → R ,          (13)

  且全部涨落在 z → ∞ 处为零。(23) 对应世界体耦合

      S_int = ∫ d⁴x φ(x^λ) O(x^λ) ,                                       (22)

  其中 φ(x^λ, z) 是运动方程的唯一解，满足 φ(x^λ, z) → φ(x^λ) 当 z → R；
  GKP **不用记号 φ_0**，边界值就写作少一个宗量的 φ(x^λ)。

  ─────────────────────────────────────────────────────────────────────
  三条等式两边的对象各不相同：(2.11) 是「标量源生成泛函 = 配分函数」，
  (2.12) 是「配分函数 = 配分函数」，(12)/(23) 是「连通生成泛函 = on-shell 作用量极小值」；
  边界也不同（共形边界 S^d vs 有限截断 z = R），号差也不同（欧氏 vs 洛伦兹）。
  本卡把它们并列记录而**不**合并成一条。
uses_conventions: [conv.ads-radius-unit, conv.metric-mostly-plus]
sources:
  - ref: witten-1998-ads
    loc: |
      arXiv:hep-th/9802150v2, §2.3 "Ansatz For The Effective Action", p.8–10，
      式 (2.10)(2.11)(2.12)(2.13)；φ_0 与耦合 ∫_{S^d} φ_0 O 的定义在 p.8。
    note: |
      ⚠ 式号红线：两边都写成 Z 的等式是 **(2.12)**（自变量是共形结构 h），不是 (2.11)。
      把 Z = Z 形式记成 (2.11) 是式号错配（extractions/witten-1998-ads.md E-W6、QW1）。
      ⚠ (2.11) 前一句原文印作 "in the case of of N = 4 supergravity in four dimensions"，
      按上下文（I_S ∼ N²、AdS_5×S^5）应指四维 N=4 super Yang-Mills 所对应的五维超引力，
      **勿沿用**（E-W5）。
      ⚠ (2.12) 前一句原文印作 "formulated on a four-sphere"，与全节的一般 d 的 S^d 不一致，
      本卡按上下文写 S^d（E-W6）。
  - ref: gubser-klebanov-polyakov-1998
    loc: |
      arXiv:hep-th/9802109v2, §2 开头 p.4，式 (12)(13)；§2.2 p.6，式 (22)(23)；
      主张句在 p.3 §1 末。
    note: |
      逐字前导句：(12) 前 "The basic idea is to identify the generating functional of connected
      Green's functions in the gauge theory with the minimum of the supergravity action, subject to
      some boundary conditions at z = R and z = ∞"；(23) 前 "Then the analogue of (12) is the claim
      that"。**全文（正文 pp.1–14）不出现 "conjecture" 一词，也没有任何配分函数（Z）陈述**
      （extractions/gubser-klebanov-polyakov-1998.md §1、E1、E4、Q3）。
tags: [holography, ads-cft, dictionary, generating-functional, conjecture]
notes: |
  from: witten-1998-ads#E-W4、E-W5、E-W6（另见 E-W13、E-W18、QW1–QW4）；
  gubser-klebanov-polyakov-1998#E1、E2、E3、E4（另见 E5、Q1–Q4、Q6）。

  【为什么不写教科书通式】常见写法 Z_CFT[φ_0] = Z_string[φ|_∂ = φ_0] 是把 (2.11)(2.12)(2.13)
  三式**归纳**的结果，Witten 原文没有写出这个通式；最接近通式的一句是 p.10 的
  "These examples hopefully make the general idea clear. …"（自带 "hopefully"，且只对**无质量**场，
  有质量场原文明说 "this we postpone"）。GKP 那边根本没有配分函数陈述。
  把通式写进陈述文本等于给两篇原文都没写的东西背书，故本卡逐条分写。

  【为什么一条陈述挂两条推导，而不是两张卡】有原文层面的背书：Witten p.4 逐字
  "After this work was substantially completed, I learned of independent work [36] in which a very
  similar understanding of the the [sic] CFT/AdS correspondence to what we describe in section 2 is
  developed"（[36] = GKP hep-th/9802109）。互引是**单向**的：Witten 引 GKP，
  GKP v2 的 25 条参考文献里没有 hep-th/9802150。
  两条推导的假设集不同（截断边界 vs 共形边界；洛伦兹 vs 欧氏；W = S_on-shell vs ⟨e^{∫φ_0O}⟩ = Z_S），
  不可互相替代；分开挂才能让 stringgraph why 给出正确的瓶颈链。

  【有效状态应为 conjecture，且两条推导对 Maldacena 对偶的依赖是非对称的】
  Witten 支**依赖** holography.ads5-cft4-duality-v2（原文自我定位就是「把 [13] 的猜想精确化」），
  GKP 支**不依赖**（原文只说 [14] "synthesized" 了两条路线，没有把 (12) 建立在 [14] 之上）。
  这个非对称结构是有意保留的：即使 Maldacena 对偶被推翻，GKP 那条推导仍独立地把
  「超引力 on-shell 作用量 ↔ 规范理论关联函数」立为一条可单独证伪的假设。
  两份抽取记录的 §5 都明确建议保留这个结构。

  【φ_0 在 Witten 篇里有两个不同含义】无质量时 φ_0 = φ|_∂（(2.11) 用的就是这个）；
  有质量时 (2.34) 没有趋于常数的解，φ_0 由 φ ∼ f^{−λ₊} φ_0（(2.36)）定义，
  并且是权重 λ₊ 的**共形密度**而非函数，依赖辅助函数 f 的选择。
  本卡的 (W1) 取无质量含义；有质量情形的重定义留给
  holography.dimension-mass-relation 的推导去承担（QW2、E-W11）。

  【记号差别】GKP 不用 φ_0；GKP 写 O(2,4)（不是 SO(2,4)）；GKP 的 (12)(23) 没有负号，
  与现代常写的 W = −S_on-shell（欧氏）差一个符号，且 GKP 是对 K 求二阶导直接得 ⟨OO⟩（(26)），
  不是 −∂²W（Q4）。号差约定 conv.metric-mostly-plus 只适用于 (G) 支：
  GKP 用 (−,+,+,+)；Witten §2 起改用欧氏语言（原文逐字 "it will be convenient to formulate
  the present paper in a Euclidean language"），本卡在 (W1)(W2) 里已显式写明「欧氏」。

  【规范群】GKP 在 D3 世界体处写 U(N)（p.2），在引 't Hooft 处写 SU(N)（p.1）；
  Witten 全篇 SU(N) 并在 §2.6 论证 U(N) 不对。本卡的陈述文本不提规范群，
  争议单独由 holography.gauge-group-su-n-from-kk-spectrum 承载。

  【版本】Witten 的 loc 锚定 arXiv:hep-th/9802150v2 (6 Apr 1998)，
  GKP 的 loc 锚定 arXiv:hep-th/9802109v2 (27 Mar 1998)；两篇的发表版式号均未核对。
