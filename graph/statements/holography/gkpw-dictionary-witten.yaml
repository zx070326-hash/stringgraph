id: holography.gkpw-dictionary-witten
kind: proposition
title: Witten 的 GKPW 字典：体场在共形边界的值是边界算子的源（(2.11)(2.12)(2.13)，欧氏、共形边界 S^d）
statement: |
  本卡只记 Witten hep-th/9802150v2 §2.3 的三条等式。GKP 的版本（式 (12)(23)，洛伦兹号差、
  边界取在有限截断 z = R）是**另一张卡** holography.gkpw-dictionary-gkp：两篇的等式两边对象不同、
  边界不同、号差不同，不是同一条命题。本卡也**不**写教科书通式
  Z_CFT[φ_0] = Z_string[φ|_∂ = φ_0]——Witten 原文没有写出那个通式（见 notes）。

  以下全部是**欧氏**号差；AdS_{d+1} = 开单位球 B_{d+1}，边界是共形边界 S^d；AdS 半径 = 1。

  ─────────────────────────────────────────────────────────────────────
  (W1) 式 (2.11)（标量源版本）

  设 φ 是 AdS_{d+1} 上的无质量标量场，满足 Laplace 方程 D_i D^i φ = 0（或任何具有同一基本性质
  的方程：对任意给定边界值在 B̄_{d+1} 上存在唯一解）。令 φ_0 是 φ 到边界 S^d 的限制。
  假定在对应关系中 φ_0 通过耦合 ∫_{S^d} φ_0 O 与一个边界共形场 O 耦合。
  令 Z_S(φ_0) 是 B_{d+1} 上的超引力（或弦论）配分函数，边界条件为「在无穷远处 φ 趋于给定
  的 φ_0」；在经典超引力近似下

      Z_S(φ_0) = exp( − I_S(φ) ) ,                                        (2.10)

  其中 I_S 是经典超引力作用量，φ 是把 φ_0 按经典运动方程延拓到 B_{d+1} 的解。则

      ⟨ exp ∫_{S^d} φ_0 O ⟩_CFT = Z_S(φ_0) .                              (2.11)

  注意左边是**生成泛函**而不是配分函数；积分在共形边界 S^d 上而不是 R^d 上；
  边界条件里**没有**任何 z^{Δ−d} 重标度因子。

  ─────────────────────────────────────────────────────────────────────
  (W2) 式 (2.12)（度规源版本，这才是原文里两边都写成 Z 的那条）

  记 Z_CFT(h) 为边界共形场论在带共形结构 h 的 S^d 上的配分函数（暂时压下一个 c-数反常），
  Z_S(h) 为对「在边界附近有二阶极点、并在边界上诱导出给定共形结构 h」的度规做积分所得的
  超引力（或弦论）配分函数；经典超引力近似下 Z_S(h) = exp(−I_S(g))，g 是满足该边界行为的
  Einstein 方程解。则

      Z_CFT(h) = Z_S(h) .                                                 (2.12)

  ─────────────────────────────────────────────────────────────────────
  (W3) 式 (2.13)（规范流版本）

  若体理论有规范群 G，则 G 是边界理论的**整体**对称群，边界有流 J_a；
  令 Z_S(A_0) 是规范场在无穷远趋于 A_0 的超引力/弦论配分函数，则

      ⟨ exp ( ∫_{S^d} J_a A_0^a ) ⟩_CFT = Z_S(A_0) .                      (2.13)

  ─────────────────────────────────────────────────────────────────────
  三条等式两边的对象并不相同：(2.11) 与 (2.13) 是「源的生成泛函 = 体配分函数」，
  (2.12) 是「配分函数 = 配分函数」。本卡把三条并列记录而不合并成一条通式。
uses_conventions: [conv.ads-radius-unit]
sources:
  - ref: witten-1998-ads
    loc: |
      arXiv:hep-th/9802150v2, §2.3 "Ansatz For The Effective Action"：小节自 p.8 起；
      φ_0 的定义与耦合 ∫_{S^d} φ_0 O 在 p.8；式 (2.10)(2.11) 在 p.9；式 (2.12)(2.13) 在 p.10。
      （页码是**原文印刷页码**，PDF 页 = 印刷页 + 1；本轮由 curator 按 arXiv v2 页图逐页复核。）
    note: |
      ⚠ 式号红线：两边都写成 Z 的等式是 **(2.12)**（自变量是共形结构 h），不是 (2.11)。
      把 Z = Z 形式记成 (2.11) 是式号错配（extractions/witten-1998-ads.md E-W6、QW1）。
      ⚠ (2.11) 前一句原文印作 "in the case of of N = 4 supergravity in four dimensions"，
      按上下文（I_S ∼ N²、AdS_5×S^5）应指四维 N=4 super Yang-Mills 所对应的五维超引力，
      **勿沿用**（E-W5）。
      ⚠ (2.12) 前一句原文印作 "formulated on a four-sphere"，与全节的一般 d 的 S^d 不一致，
      本卡按上下文写 S^d（E-W6）。
tags: [holography, ads-cft, dictionary, generating-functional, conjecture]
notes: |
  from: witten-1998-ads#E-W4、E-W5、E-W6（另见 E-W13、E-W18、QW1–QW4）。

  【本卡的来历】由 holography.gkpw-dictionary 拆分而来（lead 裁决 2026-09-11，依 reviewer-gkpw
  的审查）。原卡把 Witten 的 (2.11)(2.12)(2.13) 与 GKP 的 (12)(23) 写在**同一个 statement** 里，
  违反「一个节点一个命题」：两篇的等式两边对象不同（生成泛函 = Z vs 连通生成泛函 = on-shell
  作用量极小值）、边界不同（共形边界 S^d vs 有限截断 z = R）、号差不同（欧氏 vs 洛伦兹 (−,+,+,+)），
  而且在文献里是被**分别**提出与论证的。拆分后两卡各挂自己的唯一推导，
  约定声明也随之分开（本卡只用 conv.ads-radius-unit；GKP 卡只用 conv.metric-mostly-plus）。
  姊妹卡：holography.gkpw-dictionary-gkp。

  【为什么不写教科书通式】常见写法 Z_CFT[φ_0] = Z_string[φ|_∂ = φ_0] 是把 (2.11)(2.12)(2.13)
  三式**归纳**的结果，Witten 原文没有写出这个通式；最接近通式的一句是 p.10 的
  "These examples hopefully make the general idea clear. …"（自带 "hopefully"，且只对**无质量**场，
  有质量场原文明说 "this we postpone"）。把通式写进陈述文本等于给原文没写的东西背书。

  【φ_0 在本篇里有两个不同含义】无质量时 φ_0 = φ|_∂（(2.11) 用的就是这个）；
  有质量时 (2.34) 没有趋于常数的解，φ_0 由 φ ∼ f^{−λ₊} φ_0（(2.36)）定义，
  并且是权重 λ₊ 的**共形密度**而非函数，依赖辅助函数 f 的选择。
  本卡的 (W1) 取无质量含义；有质量情形的重定义留给
  holography.dimension-mass-relation 的推导去承担（QW2、E-W11）。

  【规范群】本篇全篇 SU(N)，并在 §2.6 论证 U(N) 不对；GKP 在 D3 世界体处写 U(N)。
  本卡的陈述文本不提规范群，争议单独由 holography.gauge-group-su-n-from-kk-spectrum 承载。

  【版本】loc 锚定 arXiv:hep-th/9802150v2 (6 Apr 1998)；ATMP 2 (1998) 253–291 发表版式号未核对。
