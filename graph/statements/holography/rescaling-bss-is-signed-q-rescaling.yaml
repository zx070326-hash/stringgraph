          这一步），确认无误。captain_confirmed: false。"
notes: |
  **记号对照（BSS (ρ̌,σ̌,v̌) ↔ 本图 (ρ,σ,v)）**：本图沿用 Rosselló 的「指标挂在 ρ 上」约定
  （见 holography.torsion-index-divisor-operator notes：1/Φ₁₀=Σψ_m(σ,v)p^m, p=e^{2πiρ}，
  即 ρ↔m=Q²/2）；BSS 把与 Q² 配对的槽位记作 σ̌（BSS eq 1-2），即 σ̌↔m。两套记号在"哪个
  希腊字母对应哪个不变量"上相反，但**物理内容一致**：两者都把 s² 打在与 Q² 配对的那个槽位
  上（本图记法下是 ρ 被 s² 重标，BSS 记法下是 σ̌ 被 s² 重标），这正是"Q-重标"这个判据的
  实质——**判据是哪个变量携带 s²，不是字母本身**。proof.md §8.1 已用 BSS 自己的记号完整
  推演，本卡直接沿用其记号陈述命题，避免额外一次记号转换引入错误；未新建
  `graph/conventions/` 节点是因为这只是两篇文献各自选择的希腊字母指派，不是可复用的
  物理归一化约定（如 α' 或规范场归一化）。

  **纠正本项目文献抽取中的一处误读（不在本卡写入范围，留给 lead 转派）**：
  `literature/extractions/dgm-eq51-eq52-third-party-crosscheck.md` §E1/E2 把 BSS (4) 中
  l=1, s̄=2 项的 "v̌+1/2" 读作半整平移的独立佐证；proof.md §8.1 指出这是误读——BSS (4) 的
  k,l 求和只是**周期化**（BSS 原文明言 "makes Φ̌ periodic under σ̌→σ̌+1/r², v̌→v̌+1/r"），
  BSS 自己在导出 (7) 时把这个周期化**完全消掉**，(7) 中不含任何残留半整平移。本卡 Prop 8.1
  的证明正是这一步的精确版本（Jacobian 抵消 + 积分区间归一）。该誊清需要改
  `literature/extractions/`，超出本 curator 的写入范围（`literature/**` 不在授权路径内），
  已记入最终报告供 lead 转派 researcher。

  **与 holography.rescaling-signed-invariance（Thm E）的关系**：本卡确立 BSS 落在带号侧，
  Thm E 确立带号算子仍保持 Γ⁰(I)-不变性——两卡合起来说明"BSS 公式本身是良定义的、且在其
  应有的不变群下自洽"，标架依赖问题（Thm B/D）与符号约定问题（本卡/Thm E）是两条独立的
  轴，proof.md §8.2 "Reading" 段明确指出两者正交。
