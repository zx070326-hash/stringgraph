id: holography.rescaling-bss-is-signed-q-rescaling
kind: proposition
title: BSS 0802.1556 eq(7) 恰为带号 Q-重标算子 D̃_r[f]（Prop 8.1）
statement: |
  Banerjee–Sen–Srivastava arXiv:0802.1556 (BSS) 把他们的黑洞简并度提议约化为
    d(Q,P) = (−1)^{Q·P+1} Σ_{s|r} g(s) s³ ∫dρ̌ ∫_{1/s²}dσ̌ ∫_{1/s}dv̌
             e^{−iπ(σ̌Q²+ρ̌P²+2v̌Q·P)} Φ₁₀(ρ̌, s²σ̌, sv̌)^{−1}，          （BSS eq 7）
  其中 g(s)=s（BSS eq 5），且 BSS 的 Fourier 展开约定（BSS eq 1）为
    1/Φ₁₀(ρ̌,σ̌,v̌) = Σ (−1)^{Q·P+1} f(Q²,P²,Q·P) e^{iπ(σ̌Q²+ρ̌P²+2v̌Q·P)}，
  即 σ̌ 与 Q² 配对、ρ̌ 与 P² 配对、v̌ 与 Q·P 配对：σ̌↔m=Q²/2，ρ̌↔n=P²/2，v̌↔ℓ=Q·P。
  **这是 Q-重标**：与 Q² 配对的槽位 σ̌ 携带 s²。

  记 f 为 BSS 的正号约定系数（即 1/Φ₁₀ 按 BSS 约定展开时的系数，f(m,n,ℓ) 与本图 d_* 的关系
  由展开式中的整体符号 (−1)^{ℓ+1} 给出：d_*(m,n,ℓ) = (−1)^{ℓ+1}·f(m,n,ℓ)，见
  holography.torsion-index-divisor-operator 的 R6′ 符号约定）。**命题**：
    (BSS eq 7) = Σ_{s|r} s·(−1)^{ℓ−ℓ/s}·f(m/s², n, ℓ/s) = D̃_r[f](m,n,ℓ)，
  即 holography.rescaling-signed-operator-definition 定义的带号 Q-重标算子在 f 上的取值。
  因此 **BSS 落在 DGM (3.26)+(3.27)（ar5iv 旧编号 eq50+eq51）一侧的符号约定上，而非裸的
  (3.28)（ar5iv 旧编号 eq52）一侧**——BSS 的配分函数天生带 holography.rescaling-signed-invariance
  （Thm E）所刻画的那个符号因子 (−1)^{ℓ−ℓ/s}，不是不带符号的 D_I。
uses:
  - holography.rescaling-signed-operator-definition
uses_conventions: []
