notes: |
  **诚实边界（不得越界，抄自 research/attempts/bkm-shift-explanation/status.yaml 2026-09-15 确认记录）**：
  captain_confirmed 确认的范围严格限定为「给定 A-N eq(2.11)+(2.13) ⇒ 本半整平移闭式」这一纯代数
  步；物理前提本身（A-N eq(2.11)+(2.13)，即 holography.bkm-torsion-generating-function-eq211 与
  holography.dgm-torsion-divisor-sum）是文献陈述，非本尝试所证，其自身严格度为
  physical-argument，会按状态传播规则压低本卡的 effective status
  （`tools/stringgraph/propagate.py` 自动处理，符合预期，不需人工干预）。

  **GAP-BKM（半整平移是否对应某 Borcherds–Kac–Moody 超代数的 ℤ/2ℤ 自同构）仍是开放问题，
  未被本卡触及。** proof.md §7/§9.9 对此有精确的猜测式表述（S1/S2 关于 Cartan 元素存在性的
  探索、S3 权重不匹配分析、明确未证的"猜想 9.5"），均属未证的探索性内容。本次毕业刻意不为
  这部分建节点——它们是通向一个仍开放问题的脚手架，不是已验证结论的一部分，勉强建卡只会
  制造"看似有进展"的错觉。

  **两条独立证明**：proof.md §2–§5（Lemma B.1 换元双射 + Lemma B.2 指数恒等式 + 命题 B 第
  1–5 步）与 §9（"裸生成函数的除子和是纯伸缩、A-N 的 (−1)^ℓ 符号约定本身等价于一次固定的
  1/2 平移、经伸缩共轭复合得到 (d−1)/2"）是两条独立推导路径，见本卡的两条 derivation。
  §9 已经 graph-reviewer 对抗审查（2026-09-18，六个攻击面，核心引理 9.1–9.4/定理 9 未被攻破，
  两处措辞已按审查意见降格，不影响定理本身的正确性）。

  **命题 B 核心恒等式不依赖 Φ₁₀ 周期性**：proof.md 明确指出 z_new=dz+(d−1)/2 这一换元关系
  本身对一切 d 无条件成立，不需要用到 holography.phi10-periodic-in-v；周期性只在推论 B1
  （见 holography.bkm-shift-explains-dgm-shift-gap）判断"奇 d 时半整平移是否被 Φ₁₀ 吸收"时
  才被用到。故本卡两条 derivation 均不把周期性列为依赖。
