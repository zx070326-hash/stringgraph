id: holography.bkm-shift-closed-form
kind: proposition
title: 命题 B——挠除子和生成函数的半整平移闭式 Z_I = Σ d/Φ₁₀(τ, dz+(d−1)/2, d²σ)
statement: |
  沿用 holography.bkm-torsion-generating-function-eq211 的生成函数定义与
  holography.dgm-torsion-divisor-sum 给出的除子和递推 Ω_I(m,n,ℓ) = Σ_{d|I} d·Ω_1(m/d²,n,ℓ/d)，
  对任意正整数 I，在使两侧生成函数（形式 q-展开）收敛的域内的一切 (τ,z,σ)：
    Z_I^{(4|4)}(τ,z,σ) = Σ_{d|I} d · Z_1^{(4|4)}(τ, dz+(d−1)/2, d²σ)
                        = Σ_{d|I} d / Φ₁₀(τ, dz+(d−1)/2, d²σ)。
  即：把挠除子和递推代入生成函数定义、逐项换元 (m,ℓ)=(d²m′,dℓ′)（对固定 d 是格点间的双射）后
  配对 Fourier 系数得到的唯一自洽解，在椭圆变量 z 方向带一个依赖除子 d 的半整平移 (d−1)/2
  （d 为偶数时该平移是非整数、模 1 等于 1/2；d 为奇数时该平移本身就是整数）。
