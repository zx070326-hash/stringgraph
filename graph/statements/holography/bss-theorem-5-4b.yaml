id: holography.bss-theorem-5-4b
kind: proposition
title: "BSS Theorem 5.4(b)：电荷集 B 上单心黑洞简并度等于 ψ_n^F 系数（N=1）"
statement: |
  【记号约定】Type IIB on K3×S̃¹×S¹ 的 ℤ_N orbifold（CHL 模型），N=1 时退化为旗舰 N=4 情形。
  **BSS 自己的记号约定**：(n,ℓ,m) 其中（N=1 时）m := Q²/2（电荷），n := P²/2（磁荷），
  ℓ := Q·P。**与 Rosselló/DMZ 约定不同**：后者取 m := P²/2（磁），n := Q²/2（电），
  二者互换——BSS 作者在 footnote 10（p.50）明确声明此差异。文献记号冲突裁决见
  literature/notes/mn-convention-adjudication.md（2026-09-20, verdict (c)：两约定均正确）。

  CHL 配分函数倒数 Φ̃_k⁻¹（N=1 时 Φ̃₁⁻¹ 恰为 Igusa 尖点形式 Φ₁₀ 的倒数）经
  Fourier–Jacobi 展开、再经 mock Jacobi 分解得有限部 ψ_n^F（权 −10、指标 n 的
  mock Jacobi 形式），记其傅里叶系数为本文的"c_n^F(m,ℓ)"（BSS 自己的记号；
  对应 Rosselló/DMZ 记号中的"c_m^F(n,ℓ)"——指标字母与参数位置均互换）。
  电荷集 B 由围道变形不等式 (5.49) 定义，B₂ 为其显式充分子集
  （holography.bss-charge-set-b2-definition，holography.bss-prop-b1-b2-inclusion 已证 B₂⊆B）。

  【定理】（BSS Theorem 5.4(b)，逐字）对 (n,ℓ,m) ∈ B（电荷集 B），
  单心黑洞简并度（吸引子围道积分）等于 mock Jacobi 形式 ψ_n^F 的傅里叶系数：
    d*(P²/2N, Q·P, NQ²/2) = (−1)^{Q·P+1} · c_n^F(m,ℓ)
  其中 n = P²/2N，m = NQ²/2，ℓ = Q·P（N=1 时 n = P²/2, m = Q²/2）。

  【证明方法】（BSS p.47-48，围道变形 + 留数 + 周期性，纯数学论证）
  用 Prop B.1/B.2（围道变形合法性）把吸引子围道 C 变形到 C′（τ→i∞ 方向）或 C″（σ→i∞），
  在 B 内变形不跨越 Φ̃_k⁻¹ 的极点；对 τ 做留数提取；用 ψ_n 的模不变性做 z 方向围道搬移；
  最后用有限部 h_ℓ 关于 ℓ mod 2m 的周期性（DMZ 分解的直接推论）写成 c_n^F(m,ℓ)。
  全程无物理输入，纯围道/留数/周期性论证。
