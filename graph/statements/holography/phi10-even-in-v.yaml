id: holography.phi10-even-in-v
kind: proposition
title: Φ₁₀ 在椭圆变量 v 下的偶性
statement: |
  Igusa 尖点形式 Φ₁₀(ρ, σ, v) 满足
    Φ₁₀(ρ, σ, −v) = Φ₁₀(ρ, σ, v)。
  这里 (ρ, σ, v) 是 Siegel 上半空间 Ω = [[ρ,v],[v,σ]] 的参数化（对应 Kawai 1997 的 (τ,σ,z)
  通过换名 τ↔ρ, z↔v, σ↔σ）。
uses:
  - holography.igusa-cusp-form-phi10-v2
uses_conventions: []
sources:
  - ref: kawai-1997
    loc: "§5, eq.(5.13) + §4, eq.(4.32)（Borcherds 乘积公式与 c(N) 的低阶值）"
notes: |
  本命题是 research/attempts/ell-zero-wall-degeneracy/ 的硬前置 [EXT-Even]。
  证明需要 Borcherds 乘积的显式结构（指标集与指数 c(4kl−r²)）加上 c(N)=0 对 N<−1
  的截断性质，从而把 k=l=0 块化简为 (1−y^{−1})²，其与前因子 pqy 的组合
  pq(y−2+y^{−1}) 在 y→1/y 下不变。见推导 phi10-even-in-v--via-borcherds-product。
  【变量换名】kawai-1997 用 (τ,z,σ)，本项目 holography 区用 (ρ,v,σ)，对应关系
  τ↔ρ、z↔v、σ↔σ（见 literature/extractions/phi10-periodicity-and-product.md 未解决疑问 2）。
author: curator
created: "2026-09-20"
tags: [bh-entropy, mock-modular]
