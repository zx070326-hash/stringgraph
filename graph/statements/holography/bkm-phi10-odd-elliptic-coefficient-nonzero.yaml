id: holography.bkm-phi10-odd-elliptic-coefficient-nonzero
kind: proposition
title: Φ₁₀ 的 Borcherds 乘积在判别式 −1 处系数非零（椭圆变量方向奇数次幂非平凡）
statement: |
  Igusa 尖点形式 Φ₁₀（holography.igusa-cusp-form-phi10）的 Borcherds 乘积展开
    Φ₁₀(Ω) = e^{2πi(ρ+σ+v)} ∏_{(m,n,l)>0} (1 − e^{2πi(mρ+nσ+lv)})^{c(4mn−l²)}
  中，三元组 (m,n,l)=(0,1,1)（判别式 4mn−l²=−1，l=1 为奇数）处的系数 c(−1) 非零。
  故乘积含非平凡因子 (1 − e^{2πi(nσ+lv)})^{c(−1)} = (1 − e^{2πi(σ+v)})^{c(−1)}（l=1 为奇）；
  即 Φ₁₀ 的 Fourier–Laurent 展开在椭圆变量 v 方向含奇数次幂的非零贡献，该贡献不会因
  v ↦ v+1/2 引入的相位因子 e^{iπl}（奇 l 时为 −1，偶 l 时为 +1）而与其余部分抵消掉。
