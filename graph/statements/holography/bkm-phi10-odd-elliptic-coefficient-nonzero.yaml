    note: "三元组 (k,l,r)=(0,1,1)（kawai 记号，对应本卡 (m,n,l)=(0,1,1)）判别式 4·0·1−1²=−1，c(−1)=2≠0"
  - ref: dabholkar-murthy-zagier-2012
    loc: "§4.3, eq.(85)：φ_{−2,1}(τ,z)=(y−2+y⁻¹)+O(q)；Table 1：C_{−2}(−1)=1≠0"
    note: "二重独立佐证；两套系数约定相差整体归一化因子，但判别式 −1 处非零这一结论一致"
