      publication_info）。⚠ 同页有一处排印错误 "The show this"（应为 "To show this"，页图字形清晰，判为原文排印）。
  - ref: witten-2012-superstring-perturbation
    loc: "arXiv:1209.5461v4, §7.5 末–§7.6.1, pp. 140–143，(7.18)–(7.27)：条件收敛（'convergent, but only conditionally so'）、'0/0'、𝒩^{−1} 上厄米度量的选择使 log ε → log ε + h、结果移动 (7.27)、'differ by reparametrizations of 𝒵'"
    note: |
      L1（抽取记录 **EW17**）。这是 witten-2013-overview §1 p. 1 所说的步骤 **(B)**
      （「a careful treatment of integrals that are only conditionally convergent in the infrared region」）
      在主论文里的落地。原文同处引 [73] = H. La and P. Nelson, "Unambiguous Fermionic-String Amplitudes,"
      PRL 63 (1989) 24（"Some of the issues have been treated in [73]"）——**本项目未登记也未读该文**。
  - ref: witten-2012-superstring-perturbation
    loc: "arXiv:1209.5461v4, §8.3「Vanishing Of Massless Tadpoles」, p. 174，(8.39)(8.40)：'At zero momentum, in a superconformal formalism, there is only one 𝒱_φ, so only one linear combination of the tadpoles of the dilaton and the trace of the metric is a potential obstruction …'"
    note: |
      L1（抽取记录 **EW19**）。**只取这一段的「哪一个 tadpole」**；同节 p. 175 的归纳论证（tadpole 为零）
      **不入本卡的陈述**，只在推导的 summary/gaps 里记录（EW18）。
  - ref: witten-2013-overview
    loc: "arXiv:1304.2832v4, §1, p. 2：'The models considered here, since they do have a dilaton tadpole at two-loop order, are not models in which superstring perturbation theory works to all orders, at least not in its usual form.'"
    note: |
      L1（抽取记录 **EW5**）。作为 (a) 的**反面实例**登记：SO(32) 杂化弦 on CY，超对称一圈自发破缺、
      两圈出现 dilaton tadpole，正是本卡 (a) 所说「微扰真空失稳」的模型。
      ⚠ 该文自己用 "dilaton tadpole" 一词；按主论文 §8.3 p. 174 的说明，在超共形形式下它指的是 (b) 那一个线性组合。
tags: [superstring, perturbation-theory, tadpole, dilaton, infrared, supermoduli, consistency, conditional-convergence]
notes: |
  【1. 与 consistency.superstring-perturbation-theory-via-super-riemann-surfaces 的关系】
  那张卡的第 (c) 条「预期的红外行为」正是靠本卡 (a)(c) + §8.3 的归纳论证建立的；
  故**那张卡的推导 depends_on 本卡**，本卡不依赖那张卡（避免环）。

  【2. ★ 建议拆出的下一张卡】
  §8.3 pp. 173–175 的归纳论证「假设 tadpole 为零且超对称在 ≤ g−1 圈不破缺，则 g 圈 tadpole
  ⟨𝒱_φ⟩_g = 0（(8.38)+(8.42)）；若超对称在 g 圈不自发破缺，归纳闭合」是一条**独立被推导的命题**，
  按「一个节点一个命题」应另建（建议 id：consistency.massless-tadpoles-vanish-by-genus-induction，
  physical-argument，gaps 必抄那个 "if"）。本轮未建，因为派工单只指定本卡；
  它的存在与否不影响本卡的陈述。

  【3. 与 Polchinski 的接口】polchinski-1998-v2 §12.2 pp. 102–103 的第二个 "if"（type I 闭弦交换的红外收敛，
  E20）与 §10.8 的 tadpole 抵消，是本卡 (a) 在开弦/无定向弦侧的 1998 年版本；
  1998 年的自承缺口见 consistency.superstring-perturbative-consistency-unproven-1998。

  【4. 约定】本卡引用的 (7.23)(7.27)(8.39) 都是结构式（因子化形式、移动量、顶点算符的场内容），
  不含度规号差或 α′ 归一化的选择，故 uses_conventions 为空。Witten §7.1 p. 125 写闭弦
  L_0 = (α′/4)P² + N，与 conv.alpha-prime-regge 一致，但本卡不用它。
