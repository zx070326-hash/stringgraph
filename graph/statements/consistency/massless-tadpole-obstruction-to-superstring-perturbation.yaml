id: consistency.massless-tadpole-obstruction-to-superstring-perturbation
kind: proposition
title: 无质量 tadpole 是超弦微扰论「最关键的问题」：在超共形形式下只有 dilaton 与度规迹的一个线性组合是潜在障碍；tadpole 为零时振幅只条件收敛，S 矩阵作为真空模空间 𝒵 上的函数良定义但其参数化不唯一
statement: |
  **设定（适用域，是陈述的一部分；全部为 Witten 1209.5461v4 §7.5 p. 140 的显式限定）**：
  RNS 超弦微扰论在超模空间/积分链上的表述
  （consistency.superstring-perturbation-theory-via-super-riemann-surfaces 的框架）；
  **只考虑闭的取向弦**；**只考虑无质量粒子的 S 矩阵**；
  **只考虑无质量粒子没有微扰质量重整化的弦紧化**。

  **命题**（三条，均为原文逐字断言的转述）：

  (a) **tadpole 是关键障碍**（§7.5 p. 140）：
      > "Ultimately, the most critical question for superstring perturbation theory is to make sure that the
      > vacuum state that one attempts to construct in perturbation theory is not destabilized by massless
      > tadpoles."
      即：若某亏格 g 的无质量 tadpole ⟨𝒱⟩_g 非零，微扰真空失稳，g 圈及以上的振幅没有意义。

  (b) **哪一个 tadpole**（§8.3 p. 174，(8.39)(8.40)）：在超共形形式下，零动量处**只有一个** NS 扇区
      标量顶点算符 𝒱_φ，因此
      > "only one linear combination of the tadpoles of the dilaton and the trace of the metric is a
      > potential obstruction to the validity of perturbation theory"，
      并且只有一个 𝒱_{ψ_α} 可用来证明这一个障碍为零。十维杂化弦的显式形式是
      𝒱_φ = c̃ c δ(γ) ∂̃X_I D X^I（(8.39)）。分开的 dilaton tadpole 与度规迹 tadpole 只在
      「更一般的形式（§2.4.4）」里才会分别出现——**本卡与来源都不用那种形式**。

  (c) **tadpole 为零时的收敛性与不唯一性**（§7.5 末–§7.6.1，pp. 140–143，(7.23)(7.24)(7.26)(7.27)）：
      设无质量 tadpole 为零（(7.24)：∫_{ℳ̂_r} 𝒢_{r,α} = 0，α = 1,…,s）。则
      · 计算 S 矩阵所需的超模空间积分**收敛，但只是条件收敛**：分离退化处
        𝒜_{g,sing} = Σ_α ∫ (d²q / q̄q) ∫_{ℳ̂_ℓ} 𝒢_{ℓ,α} ∫_{ℳ̂_r} 𝒢_{r,α}（(7.23)）
        在 q = 0 的对数发散被 0 乘掉（原文："rather like the 0/0 that one gets in field theory if the
        tadpole vanishes"）；
      · 但 q 不是一个复数而是线丛 𝒩^{−1} 的截面，该丛拓扑非平凡；改变 𝒩^{−1} 上的厄米度量
        等价于 log ε → log ε + h，极限 ε → 0 仍存在但其值移动
        𝒜_g → 𝒜_g − 4π Σ_α ∫_{ℳ̂_ℓ×ℳ̂_r} h 𝒢_{ℓ,α} 𝒢_{r,α}（(7.27)）；
      · 原文结论（p. 140–141 逐字）："Different infrared regulators lead to results for the S-matrix
        that differ by reparametrizations of 𝒵. … So the S-matrix is naturally determined, but the
        vertex operators that are used to evaluate it are not." 其中 𝒵 是微扰真空的模空间
        （至少含弦耦合 g_st = e^φ 这一个模），且
        "in general there is no reason to expect 𝒵 to have a natural parametrization in terms of fields
        such as φ."

  **本节点不断言**：
  (i) ★★ **无质量 tadpole 为零**。那是 §8.3 pp. 173–175 用时空超对称做的**对亏格的归纳论证**，
      而归纳闭合挂在一个来源不证的 "if"（超对称在 g 圈不自发破缺）上——见推导的 gaps；
      本卡只陈述「tadpole 是障碍」与「tadpole 为零时会怎样」。
  (ii) ★★ 「Witten 证明了 dilaton tadpole 为零」——按 (b)，在超共形形式下根本没有单独的 dilaton tadpole，
      只有那**一个线性组合**；任何把本卡引成「dilaton tadpole 为零」的写法都是误引。
  (iii) 开弦 / 无定向弦（圆盘与 ℝℙ² 的 R-R 与 NS-NS tadpole，§9.4）——那是另一条链
      （R-R tadpole 不抵消 ⇒ 反常，见 consistency.superstring-perturbative-consistency-unproven-1998 的 notes）。
  (iv) 振幅有唯一数值——(c) 的结论强度是「S 矩阵作为 𝒵 上的函数良定义」，比「数值唯一」弱。
  (v) 有质量重整化的模型、需要真空移动的模型（§1 p. 3 显式排除；处理它们的 off-shell 形式
      [19–24] 截至 v4 尚未用超黎曼面语言重述）。
