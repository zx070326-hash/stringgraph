    note: |
      L1（抽取记录 **literature/extractions/polchinski-1998-v2-ch12.md**，条目 -ch12#E16、-ch12#E17、
      -ch12#E19、-ch12#E20、-ch12#E21、-ch12#E22；⚠ 该文件的 E 编号独立于 polchinski-1998-v2.md）。
      ⚠ **本轮（§11 转图）没有逐页读第 12 章**：这条来源转录自 ch.12 的抽取记录，
      该记录标为 L1（抽取者逐页读了 pp. 84–135 的页图）。
  - ref: green-schwarz-1984
    loc: "全文（十维反常抵消的原始文献）"
    note: |
      本图 consistency 区的 GS 一支即出自此文；本卡只是把杂化弦接到那一支，不重复其内容。
      ⚠ GS 1984 本身**不**构造杂化弦（那是次年的 Gross–Harvey–Martinec–Rohm）：
      consistency.anomaly-cancellation-e8e8-effective-theory 的 statement 已声明
      「不断言存在以 E₈ × E₈ 为规范群的超弦理论」。**本卡正是补上那一步的桥。**
  - ref: polchinski-1998-v2
    loc: "§11.2, pp. 52–55（杂化弦的无质量谱：超引力多重态 + 伴随规范多重态）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E56、E57）。本卡第 (1) 条的谱依据。
tags: [heterotic, anomaly, green-schwarz, consistency, bridge, placeholder]
notes: |
  ★★【本卡是占位卡，建议在第 12 章正式入图时换代或被更精确的卡取代】
  它的目的只有一个：让「杂化弦」与本图已有的 GS 反常抵消一支之间不再是两座孤岛。
  真正该做的是把 Polchinski 第 12 章（已有 L1 抽取记录 polchinski-1998-v2-ch12.md）
  整节转成节点，那时本卡应 superseded_by 更精确的卡。

  ★【边的方向：反常**不是**规范群的决定者】抽取记录 -ch12#E19 逐字：
    'In the heterotic string, the gauge group was determined by the requirement of modular
     invariance. In the type I string it was determined by cancellation of tadpole divergences.'
  以及 -ch12#E21 逐字：
    'In constructing new string theories, **it is in principle not necessary to check the low
     energy anomaly**, since this is guaranteed to vanish if the string consistency requirements
     have been satisfied. In practice, it is very useful as a check …'
  ⇒ 在弦论侧，唯一性来自**模不变性**（杂化弦）与 **tadpole**（type I），
    反常抵消是**推论/检验**，不是前提。
  ⚠ 这与 worldsheet.ten-dimensional-superstring-theories 的前提 (P5) 的表述有张力：
    那张卡按 §10.6 原文把「时空反常」列为筛掉非 SO(32) 规范群的理由之一。
    两处都是 Polchinski 的原文（§10.6 vs §12.2），本图**不擅自调和**；
    已在本卡记下，建议由 auditor 或 lead 在里程碑层面裁定表述。

  【(4) 的两个 'if' 必须随本卡一起传播】抽取记录 -ch12#E20 要求：
  凡 `consistency.*-anomaly-free` 类节点 status 只能是 physical-argument，
  且 gaps 至少抄下这两个条件（'if the theory is modular-invariant'、'if this converges'）。
  本卡的推导已照办。

  【本图缺的 type I 版本】worldsheet.ten-dimensional-superstring-theories 的 (P5) 仍无节点。
  建 type I 版桥接卡需要 §12.2 的 type I 一支（'the "UV" limit is reinterpreted as the IR limit
  of a closed string exchange, and the anomaly then vanishes if this converges'），
  与 §10.8 的 tadpole 是同一件事。留给第 12 章入图那一轮。
