id: consistency.heterotic-anomaly-free-requires-gs
kind: proposition
title: 桥接卡（占位）：杂化弦十维时空规范/坐标反常的抵消由 Green–Schwarz 机制实现，且本书的弦论侧论证是条件式的、自称 formal
statement: |
  **本卡是一张桥接（占位）卡**，作用是把第 11 章的杂化弦与本图 consistency 区的
  Green–Schwarz 1984 一支接起来。它断言：

  **(1)** SO(32) 与 E₈ × E₈ 杂化弦的低能有效理论是十维 N = 1 超引力 + 超 Yang–Mills
      （规范群相应地为 SO(32) 或 E₈ × E₈，伴随维数均为 496）。
  **(2)** 该有效理论的单圈规范、引力与混合反常**不逐图为零**；它们的抵消由
      **Green–Schwarz 机制**实现：三形式场强按 Chern–Simons 项修改
      （consistency.h-field-strength-chern-simons），并加入局域反项
      （consistency.gs-counterterms-1984）。本图已有的两张结论卡是
      consistency.anomaly-cancellation-so32-effective-theory 与
      consistency.anomaly-cancellation-e8e8-effective-theory。
  **(3)** 修改后的 B₂ 规范变换在杂化弦里有**世界面来源**：它来自只作用于左移世界面费米子的
      规范变换的世界面反常（Polchinski §12.3, (12.3.32)–(12.3.36)）。
  **(4)** ⚠ **本书对「弦论侧反常消失」的论证是条件式的，并被作者自己标为 formal**。逐字：
      'One can prove the decoupling of null states **formally** in either field theory or string
       theory; the issue is whether terms from the UV limit invalidate the formal argument. …
       In the heterotic string the effective UV cutoff comes from the restriction of the
       integration to the fundamental region of moduli space. Surface terms from the boundary of
       the fundamental region cancel **if** the theory is modular-invariant.'

  **本命题不断言的内容**：
    (1) **不**断言杂化弦的规范群是被反常抵消定出的。恰恰相反（原书逐字，§12.2 p. 102）：
        'In the heterotic string, the gauge group was determined by the requirement of
         **modular invariance**. In the type I string it was determined by cancellation of
         **tadpole divergences**.' —— 见 notes 的【边的方向】。
    (2) 不断言 (1) 中「低能极限就是那个有效场论」这一步有本图的支撑（本图无低能有效作用量
        的推导节点）。
    (3) 不断言 §11.3 的其它杂化弦的反常性质（原书 §12.2 p. 101 逐字只说
        'in all cases the anomalies factorize'，断言、无证明、无引文）。
    (4) 不断言 GS 机制对 type I 的对应版本——本图**没有** type I 的同款桥接卡，
        worldsheet.ten-dimensional-superstring-theories 的前提 (P5) 因此仍然悬空。
