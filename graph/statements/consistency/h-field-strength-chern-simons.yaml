id: consistency.h-field-strength-chern-simons
kind: definition
status: rigorous
title: 带 Chern–Simons 修正的三形式场强 H = dB + ω⁰_{3Y} − ω⁰_{3L} 与 B 的规范/洛伦兹变换
statement: |
  在十维 N = 1 超引力 + 超 Yang–Mills 的场内容（zehnbein e^m_μ、二形式势 B、规范势 A、
  自旋联络 ω）上，按 Green–Schwarz 1984 定义三形式场强（conv.gauge-trace-normalization，楔号省略）：

  **(1) H 的定义**

      H = dB + ω⁰_{3Y} − ω⁰_{3L}                                      （SO(N) 或 USp(N)）      (4)
      H = dB + (1/30) ω⁰_{3Y₁} + (1/30) ω⁰_{3Y₂} − ω⁰_{3L}            （E₈ × E₈）             (4′)

  其中（consistency.descent-forms-gs-notation 的 n = 1 情形）

      ω⁰_{3Y} = tr(A F − ⅓ A³),   d ω⁰_{3Y} = tr F²
      ω⁰_{3L} = tr(ω R − ⅓ ω³),   d ω⁰_{3L} = tr R²

  ω 是切空间代数 SO(9,1) 的 10 × 10 自旋联络矩阵，R = dω + ω²。
  (4′) 里的 1/30：GS 逐字说，若 Yang–Mills Chern–Simons 项改用**伴随**表示的矩阵定义，
  则 SO(32) 情形下 (4) 的系数也会是 1/30。

  **(2) 规范与局域洛伦兹变换**（本卡把变换律一并定为定义的一部分）

      δA = dΛ + [A, Λ],        δω = dΘ + [ω, Θ]                                        (9a,b)
      δB = − tr(A dΛ) + tr(ω dΘ)                                       （SO(N)/USp(N)）  (9c)
      δB = − (1/30) tr₁(A₁ dΛ₁) − (1/30) tr₂(A₂ dΛ₂) + tr(ω dΘ)        （E₈ × E₈）       (9c′)

  即 **B 在两类变换下都非平凡地变换**；GS 逐字强调这一点是后面反常抵消的关键
  （"It is crucial that the potential B transforms under both kinds of transformations and that
  the field strength H is invariant."）。

  **(3) 归属（GS 自己的划界）**
  Yang–Mills Chern–Simons 项已出现在被修正的极小超引力 + 超 YM 拉氏量（GS 的 ref. [7]）里；
  **洛伦兹 Chern–Simons 项 −ω⁰_{3L} 是 GS 1984 新加的**，GS 逐字：「The last term in eq. (4) is a
  higher-derivative term arising in the low-energy expansion of the superstring and therefore does
  not appear in ref. [7].」

  **本卡不断言**：δH = 0（GS 由 (10) 断言，本图未建该命题节点，见 notes 第 3 条）；
  也不断言这套场内容构成一个自洽的量子理论——本卡只定义微分形式与变换律。
superseded_by: consistency.h-field-strength-definition
