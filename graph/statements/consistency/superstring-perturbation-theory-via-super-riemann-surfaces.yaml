id: consistency.superstring-perturbation-theory-via-super-riemann-surfaces
kind: proposition
title: 超弦微扰论的超黎曼面/超模空间表述（Witten 2012–2023）：在超模空间上完成全部分部积分并用超版 Deligne–Mumford 紧化作红外正规子，则多圈振幅规范不变（已知反常除外）、在预期时具有时空超对称、且具有预期的红外行为——作者自称为 "demonstration"，非 "proof"
statement: |
  **框架（是陈述的一部分）**：RNS 形式的超弦微扰论按如下方式表述：
  (F1) 亏格 g 的贡献是超黎曼面模空间 𝔐_g 上的一个积分（杂化弦：ℳ_L × ℳ_R 中实余维 p|0 的**积分链** Γ 上的
       积分，(3.61) Z_g = ∫_Γ 𝒟(𝒥,δ𝒥) F(𝒥,δ𝒥)），而**不是**先把奇模积掉、下降到普通黎曼面模空间后的积分；
       原文（§3.3.2 p. 36 逐字）："One might have hoped to define a natural moduli space of heterotic string
       worldsheets over which one would integrate … This appears to be too optimistic … The integration cycle Γ is
       what exists instead."
  (F2) **所有涉及分部积分的论证**（规范不变性、零态解耦、超对称 Ward 恒等式）都在超模空间上做
       （1304.2832 §1 步骤 (A)）；BRST 恰当态的插入化为边界积分 (7.1)
       ∫_Γ F_{{Q_B,𝒲₁},𝒱₂,…,𝒱_n} = −∫_{∂Γ} F_{𝒲₁,𝒱₂,…,𝒱_n}，
       并以去掉除子 𝒟 的小邻域为截断，「there is no anomaly if the right hand side of (7.1) vanishes in this limit」。
  (F3) 红外区用超对称版 Deligne–Mumford 紧化作自然正规子（1304.2832 §1 步骤 (B)）。
  (F4) **图像变换算符（PCO）是被导出的，不是被假设的**：取 delta 函数型引力微子波函数 χ^{(σ)θ} = δ_{p_σ}
       并积掉相应奇模，得 𝒴(p) = δ(β(p)) S_{zθ}(p)（(3.95)）与 ∏_{σ=1}^{2g−2} 𝒴(p_σ)（(3.97)）；
       原文对 PCO 的定位（§6.4.6 p. 109 逐字）："In this paper, we never make any fundamental statements in terms
       of positions of picture-changing operators (PCO's); we view the PCO's as a possible method of integration over
       odd moduli, but not a basic definition."
  (F5) **伪奇点（spurious singularities）被指认为非法规范固定**（§3.5 p. 42 逐字）："They are spurious because they
       result from an invalid gauge-fixing." 正确处方是：用开覆盖 {𝒰^{(ζ)}} 分片选取引力微子基 χ^{(σ;ζ)}，
       在每片上只提取不变量 F(𝒥,δ𝒥) 或 Ξ(x)，最后按 (3.61)/(3.71) 在 Γ̂ 上积分；
       **不**在每片上积掉奇模得到约化空间上的测度。

  **命题**（1209.5461v4 摘要与 §1 p. 2 的逐字目标，转述为三条）：在框架 (F1)–(F5) 下，
  (a) 多圈超弦振幅是规范不变的（BRST 恰当态解耦），**已知反常除外**（"apart from known anomalies"）；
  (b) 在预期时具有时空超对称（"satisfy space-time supersymmetry when expected"）；
  (c) 具有「与具有相同无质量粒子和低能相互作用的场论所预期的」红外行为（"have the expected infrared behavior"）。
  原文对此的自评（摘要逐字）："with the goal of giving a simpler and more direct **demonstration** that …"；
  §1 p. 2："**aiming to give** simpler and more direct demonstrations that …"；
  1304.2832 §1 p. 2："Once one understands these subtleties, one is **well-placed to demonstrate** that superstring
  perturbation theory works to all orders in those models in which tadpoles and supersymmetry-breaking effects do not
  arise."

  **适用域（作者在 §1 p. 3 与 §7.5 p. 140 显式划定，是陈述的一部分）**：
  只用「足以计算 S 矩阵的最简单一类顶点算符」（§2.4.1）；**不含**质量重整化；**不含**需要微扰真空移动以
  维持时空超对称的模型；**不含** Ramond–Ramond 场期望值非零的背景；**不与** pure spinor 形式接触；
  红外分析部分只考虑闭取向弦、无质量 S 矩阵、无质量粒子无微扰质量重整化的紧化。

  **本节点不断言**：
  (i) ★★ 「超弦微扰论到所有阶的一致性**已被证明**」。全文无 "we prove the consistency"，无结论章节；
      最强表述是 "well-placed to demonstrate"，且带适用域「in those models in which tadpoles and
      supersymmetry-breaking effects do not arise」。
  (ii) ★★ 1998 年的缺口（consistency.superstring-perturbative-consistency-unproven-1998）**已被填上**。
      两条具体技术缺口（PCO 的 ad hoc 性、高亏格歧义）在 (F4)(F5) 里被诊断并给出处方；
      但「a fully explicit proof of the perturbative consistency」在本系列里没有任何一处宣称完成。
  (iii) 无质量 tadpole 为零（§8.3 的归纳论证挂在未证的 "if" 上；见推导 gaps 与
      consistency.massless-tadpole-obstruction-to-superstring-perturbation）。
  (iv) 超模空间的（非）投影性作为**输入**——本框架不假设投影存在，Witten §3.3.2 只是引用
      math.supermoduli-space-not-projected 说明不能指望有全局投影（两卡之间**不建边**，见 notes）。
  (v) 2012 年 v1 的任何内容涉及 Donagi–Witten 或 Sen–Witten——本卡引的是 **v4（2023）**，见 sources note。
  (vi) 开弦/无定向弦的 R-R tadpole ⇒ 反常这条链在弦论里「completely clear」——作者自己保留
      （§9.4 p. 196："string theory is not well enough understood to make this statement completely clear"）。
