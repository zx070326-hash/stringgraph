tags: [superstring, perturbation-theory, super-riemann-surface, supermoduli, pco, spurious-singularity, brst, infrared, consistency, author-admitted-gap]
notes: |
  【1. ★ 与 math.supermoduli-space-not-projected **不建边**】
  本框架**本来就不假设**全纯投影存在（(F1) 直接在 𝔐_g / Γ 上积分）。Witten §3.3.2 引 [45] = Donagi–Witten
  只是说明「不能指望有全局投影，所以 (F1) 是必要的而非可选的」；这是**动机**，不是逻辑依赖。
  让本卡 depends_on 那张数学卡会把因果讲反（抽取记录 §5.1 边建议）。

  【2. ★ PCO 方法的后续：Sen–Witten 2015「vertical integration」（L2，仅摘要）】
  sen-witten-2015-pco（JHEP 09 (2015) 004, arXiv:1504.00609）摘要逐字：「the simplest version of the PCO procedure
  is valid only locally on the moduli space of Riemann surfaces」；「'vertical integration' was proposed as a
  relatively simple method to do this」；「This involves a hierarchical procedure with corrections of high order」。
  ⇒ (F5) 的分片处方在 PCO 语言里的系统化版本；PCO 方法**被补丁化而非废弃**。**本项目未读该文正文。**

  【3. 与 Polchinski 1998 的对照（抽取记录 QW1 的判定）】
  · polchinski-1998-v2 §12.5 p. 121「the picture-changing prescription is rather *ad hoc* and it would be satisfying
    to see it derived in some way」→ (F4) 正面回答：PCO 被导出为「delta 函数引力微子 + 积掉奇模」的特例。
  · 同页「this prescription has a subtle ambiguity at higher genus」→ (F5) 诊断：歧义 = 伪奇点 = 切片在 (3.79) 有
    非零解处非法；处方 = 分片 + 只提取不变量 + 在 Γ̂ 上积分。
  · §12.5 p. 126「parameterizations that did not precisely cover supermoduli space」→ (F1)(F2)：整个论证在超模空间
    上做，不下降。
  · **但** §12.5 p. 126「a fully explicit proof of the perturbative consistency of the theory seems to be lacking」
    在本系列里**没有被任何一处宣称已完成**——这就是本卡 status 为 physical-argument 且带六条 gaps 的原因。
  详见 consistency.superstring-perturbative-consistency-unproven-1998。

  【4. 抽取记录 §5.1 (P2) 建议的 id 是 consistency.superstring-perturbation-supermoduli-framework；
  lead 派工单改为本 id（-via-super-riemann-surfaces），内容一致。】

  【5. Witten 自陈沿用 Polchinski 的约定（§2.1 p. 4："section 5.3 of [32] (whose conventions we generally follow)"）】
  只说 "generally"、限于 §5.3 那一层，本项目未做逐式比对（抽取记录 QW5）；本卡不含需要约定的公式，
  故 uses_conventions 为空，也不给 conv.* 加兼容性注记。

  【6. 建议的后续卡（本轮未建）】
  · worldsheet.pco-prescription-derived-from-odd-moduli-integration（(F4) 单独成卡，physical-argument；
    抽取记录 §5.2 (P5)）；
  · worldsheet.reduction-to-ordinary-moduli-space-strategy-fails-high-genus（DW 的物理含义；§5.2 (P4)）；
  · consistency.massless-tadpoles-vanish-by-genus-induction（§8.3 的条件式归纳；见 tadpole 卡 notes 第 2 条）。
