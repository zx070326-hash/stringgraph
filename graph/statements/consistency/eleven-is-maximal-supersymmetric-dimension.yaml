id: consistency.eleven-is-maximal-supersymmetric-dimension
kind: proposition
title: d = 11 是超对称可以存在的最大时空维数（Polchinski §B.5；论证依赖"helicity > 2 believed impossible"，并有 (10,2) 号差漏洞）
statement: |
  **命题（原书 p.453 逐字）**：
  「In four dimensions the largest supersymmetry algebra, `N = 8`, contains 32 supercharges.
  This same limit holds in higher dimensions, since we could reduce to four by compactifying on tori.
  **Table B.1 then implies that `d = 11` is the maximum in which supersymmetry can exist,³
  since the spinor representations are too large for `d ≥ 12`.** Although this exceeds by one the
  critical dimension of superstring theory, we will start with this case.」

  拆开来说，论证是三段：
  (i) `d = 4` 的最大超对称代数是 `N = 8`，含 32 个超荷；
  (ii) 高维超对称理论可在环面上约化到 `d = 4`，超荷数不变，故 32 是任意维的上界；
  (iii) 由 Table B.1（math.clifford-majorana-weyl-mod-8）的 min. rep. 列，
       `d = 12` 的最小旋量实分量数已是 64 > 32，且随 `d` 增大只会更大 ⇒ `d ≤ 11`。

  **本命题的强度限定（是陈述的一部分，不是可选注记）**：
  (a) 第 (i) 步的依据是「螺旋度大于 2 的无质量粒子不存在」，而原书对此的措辞是
      **"believed to be impossible"**，不是定理。p.441 逐字：「Massless particles with helicities
      greater than 2 **are believed to be impossible** to couple to gravity, and have not arisen in
      string theory.」p.448 逐字：「Larger algebras would require helicities greater than 2, which
      **is believed to be impossible** (there are some uninteresting exceptions, such as free field
      theories). **String theory has several times turned up loopholes in such statements, but not yet here.**」
  (b) **号差漏洞**：脚注 3（p.453）逐字：「With *two* timelike dimensions a Majorana–Weyl spinor with
      32 components is allowed at `d = 12`, **but we will not try to figure out what this might mean**.」
      ⇒ 本命题只对**一个类时方向**的号差 `(d−1, 1)` 成立。
  (c) 第 (ii) 步的「环面约化不改变超荷数」在原书是一句话，无论证。

  **本命题不断言**：`d = 11` 超引力的存在性与唯一性（那是原书紧接的另一句「With two or fewer
  derivatives there is **a unique** supersymmetric action」，同样无证明、无引用，本图未建卡）。
uses_conventions: [conv.metric-mostly-plus]
sources:
