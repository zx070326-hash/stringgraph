    loc: "App. B §B.5 *d = 11 supergravity*, p.453（引文逐字，无式号）；脚注 3 同页；上界的来源 p.448（`N = 8` 多重态与「believed to be impossible」）与 p.441（helicity > 2 句）；Table B.1 p.434（`d = 12` 的 min. rep. = 64）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-appB.md#E24（主句与脚注 3）、#E20（`N = 8` 与 "believed"）、
