      ⚠ 全附录零文献引用：Nahm 1978（超引力维数上界的通常出处）在本书附录中**未被提及**（§3.2 第 7 条）。
tags: [supersymmetry, supergravity, maximal-dimension, d11, m-theory, polchinski-appendix-b]
notes: |
  【为什么放 consistency 而不是 susy】这是一条**排除性的一致性上界**（"超过 11 维不可能"），
  与 consistency 区其他"某某不允许"的卡同类。它的上游 math.clifford-majorana-weyl-mod-8 与
  susy.bps-bound-point-particle-d4 分别在 math 与 susy 区。

  【这条卡为什么重要】它是 M 理论叙事（`d = 11` 的特殊地位）在图上的第一个落点，
  而它的有效状态**只能是 physical-argument**，且缺口是"believed"级的。任何以
  「11 维是极大的」为前提的下游论证都会继承这两条限定。这正是本项目要显式化的东西。

  【未覆盖的更强来源】文献里通常把 32 超荷上界归给 Nahm 1978 的超代数分类；本项目**未取得该文献**
  （L0，未登记 literature/sources.bib）。若日后取得，应新建一条 `--via-nahm-classification` 推导
  （不改本卡陈述），届时本卡可能升到 rigorous。

  【与脚注 3 的关系】脚注 3 不是可以忽略的技术性备注：它给出的是一个**明确的反例方向**
  （(10,2) 号差下 `d = 12` 允许 32 分量 M–W 旋量），作者自己不处理。F 理论的 (10,2) 叙事与此相关，
  本图未建卡。
