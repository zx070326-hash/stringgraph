tags: [anomaly, green-schwarz-mechanism, e8, d10, effective-field-theory, phase2]
notes: |
  【1. ★ 论证结构与 SO(32) 不同】GS 对 E₈ × E₈ **没有独立验算混合反常**。逐字：
  「Given the cancellation of mixed anomalies in SO(32) the possibility of their cancellation in
  E₈ × E₈ **follows from eq. (19)**.」——即靠因子化恒等式（math.anomaly-twelve-form-factorization）
  从 SO(32) 那一支迁移过来。规范反常一路也是同样口气：
  「It follows from eq. (12c′) **by the same reasoning as before**」。
  因此本节点的推导以 consistency.anomaly-cancellation-so32-effective-theory 为依赖，
  这是原文的逻辑，不是本图的加工。

  【2. ★ 历史归属（抽取记录 E19）】E₈ × E₈ 这一半**不是 GS 独立发现的**：
  · 预印本 CALT-68-1182 题名是「…REQUIRE SO(32)」，致谢逐字承认早期版本
    「it was noted that the gravitational anomalies cancel for E₈ × E₈, but the cancellation of
    the other anomalies in that theory was overlooked」；
  · 关键群论输入（E₈ 无独立四阶、六阶 Casimir 不变量）来自 **G. Chapline 与 R. Slansky**；
  · **L. Dixon、J. Harvey、E. Witten** 与（独立地）**J. Thierry-Mieg** 也观察到
    E₈ × E₈ 的全部规范与混合反常可以抵消。
  这段归属同时记在 math.e8-adjoint-trace-identities 的 notes（被致谢的正是那条迹恒等式）。

  【3. E₈ × E₈ 的 S₂ 与 SO(32) 相同】(21) 不含规范场。
