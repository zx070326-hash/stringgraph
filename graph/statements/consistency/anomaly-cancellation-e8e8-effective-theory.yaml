id: consistency.anomaly-cancellation-e8e8-effective-theory
kind: proposition
title: E₈ × E₈：加入洛伦兹 Chern–Simons 项与 S′₁ + S₂ + S′₃ 后，十维有效场论的单圈反常全部抵消
statement: |
  在十维 N = 1 超引力 + 超 Yang–Mills 的**有效场论**中取规范群 **E₈ × E₈**
  （伴随表示维数 2 × 248 = 496）。若

    (i) 按 consistency.h-field-strength-chern-simons 的 (4′) 修改三形式场强
        （两个 E₈ 因子的 Yang–Mills Chern–Simons 项各带系数 1/30，并加入洛伦兹项 −ω⁰_{3L}），
    (ii) 把 consistency.gs-counterterms-1984 的 **S′₁ + S₂ + S′₃**（(18′)(21)(23′)）加到作用量上，

  则**单圈层次**上的纯规范反常、纯引力反常与混合反常**全部抵消**。

  原文逐字：「Thus, as before, the addition of S′₁ + S₂ + S′₃ to the action cancels all the one-loop
  anomalies for E₈ × E₈.」

  **本节点不断言**：
  (a) 唯一性/分类（同 consistency.anomaly-cancellation-so32-effective-theory 的 (a)）；
  (b) 存在一个以 E₈ × E₈ 为规范群的**超弦理论**——GS 逐字说这样的理论
      "has not yet been constructed / formulated"，只说 "it seems very likely to us that
      E₈ × E₈ is also possible for superstrings"；杂化弦是次年的 ghmr-1985，与本文无关；
  (c) 超对称性、超对称流反常、大规范变换反常（同 SO(32) 节点的 (b)(c)）。
