id: consistency.anomaly-cancellation-so32-effective-theory
kind: proposition
title: SO(32)：加入洛伦兹 Chern–Simons 项与 S₁ + S₂ + S₃ 后，十维有效场论的单圈反常全部抵消
statement: |
  在十维 N = 1 超引力 + 超 Yang–Mills 的**有效场论**中取规范群 **SO(32)**
  （伴随表示维数 496）。若

    (i) 按 consistency.h-field-strength-chern-simons 修改三形式场强，即在 GS 的 ref. [7]
        那个极小拉氏量之上把**洛伦兹 Chern–Simons 项 −ω⁰_{3L}** 加进 H（GS (4) 的最后一项）；
    (ii) 把 consistency.gs-counterterms-1984 的 **S₁ + S₂ + S₃**（(18)(21)(23)）加到作用量上，

  则**单圈层次**上的纯规范反常、纯引力反常与混合反常**全部抵消**。

  原文逐字：「In summary, modifying the action of ref. [7] by including the last term in eq. (4)
  and adding S₁ + S₂ + S₃ to the action gives complete cancellation of all anomalies at one-loop
  level for the gauge group SO(32).」

  **本节点不断言**（每一条都有原文依据，见 notes）：
  (a) 任何「只有 SO(32) 与 E₈ × E₈ 可以」的唯一性或分类结论——GS 全文没有这种断言，
      摘要只给充分条件（"cancel **if** the gauge group is SO(32) or E₈ × E₈"），
      正文并明写 "We only discuss SO(N), USp(N) and E₈ × E₈ explicitly"；
  (b) 加入这些反项后超对称性仍然成立——GS 逐字 "only adding these terms and no others destroys
      supersymmetry"，并"suspect"要恢复它得引入整个无穷级数；
  (c) 超对称流反常、"大"规范变换（不与恒等连通）的反常、涉及闭弦的各种图——原文明列为**未做**；
  (d) 关于弦论的任何事。GS 的弦论侧结果在同文只是 "summarized"，逐字
      "the details will be presented elsewhere"（见 notes 第 3 条）。
