sources:
  - ref: adams-dewolfe-taylor-2010
    loc: "arXiv:1006.1352**v2**，第三节「10D supergravity with abelian gauge group factors」，(15)(16)(17)(18)(19)；因子化与 GS 机制的复述见第二节 (7)(8)(9)(10)(11)(12)(13)"
    note: |
      L1。researcher 已逐页读毕 4 页 PDF（抽取记录 literature/extractions/gsw-1987-v2.md E14）。
      **本卡另由 curator 于 2026-09-11 取 arXiv e-print 源码 `universality_ten_v2.tex`
      （`https://arxiv.org/e-print/1006.1352v2`，作者投稿的 LaTeX 原件）逐段核对**，
      式号按源码中公式环境的出现顺序数得：
      (1) 作用量、(2) H₃ = dB₂ − ω₃^Y、(3) ω₃^Y、(4) B₂ → B₂ + Tr(ΛF)、(5) 下降关系、
      (6) δ log Z ~ ∫Î₁₀、(7) Î₁₂、(8) Y₄ 与 X₈、(9) H₃ = dB₂ − ω₃^Y + ω₃^R、(10) ΔS ~ ∫B₂ ∧ X₈、
      (11) B₂ → B₂ + Tr(ΛF) − tr(ΘR)、(12) Y₄ = d(ω₃^R − ω₃^Y)、(13) Y₄ = dH₃、(14) Dχ^a、
      (15) Y₄^{(496)} 与 X₈^{(496)}、(16) H₃ 的阿贝尔 CS 项、(17) δ_Λ B₂、(18) δ_Λ ∫B₂ ∧ X₈、
      **(19) Y₄ ≠ dH₃**。⇒ 抽取记录与 sources.bib 里「(19) 逐字 Y₄ ≠ dH₃」**得到独立确认**。
      ⚠ **同时发现一处转录误差（本卡按源码写，供 lead / researcher 修 literature/）**：
      (7) 的引力三项在源码里是**小写 tr**（tr R⁶、tr R⁴ tr R²、(tr R²)³），
      而 `literature/sources.bib` 的 adams-dewolfe-taylor-2010 note 与
      `extractions/gsw-1987-v2.md` E14 都写成了大写 Tr R⁶ 等。
      ADT 在 (7) 之后逐字定义「tr is the trace in the fundamental of SO(1,9)」，故**小写为准**。
      ⚠ 版本必须写死 v2：致谢逐字承认早期版本 (7)(8) 的系数有误。
  - ref: green-schwarz-1984
    loc: "PLB p.120（重印 611），(20)（纯引力十二形式，用于与 ADT (7) 的交叉核验）"
    note: |
      L1。**只作交叉核验**，不承载本卡的阿贝尔论证（GS 1984 里没有阿贝尔解）。
      核验结果见推导 notes：ADT (7) 乘以 −96 后与 GS (20) 在纯引力扇区**逐项相同**。
  - ref: polchinski-1998-v2
    loc: "§12.2, pp. 100–101：(12.2.27)(12.2.28a,b) 与 (12.2.29)；p. 101 脚注 1「They also hold for E₈ × U(1)²⁴⁸ and U(1)⁴⁹⁶, but no corresponding string theories are known.」"
    note: |
      **L1 原书**（抽取记录 literature/extractions/polchinski-1998-v2-ch12.md E14/E15）。
      ★ **ADT (7)(8) ≡ Polchinski (12.2.27)(12.2.28a,b)，逐项逐系数完全相同**（抽取记录 E15 已核实；
      ADT 自陈「following the presentation of Polchinski [11]」）。⇒ 本卡引用的反常多项式有第二处 L1 转录。
      ⚠ **两者在公式上不是独立证据**（同一排布，且系数都外包给 Alvarez-Gaumé–Witten）。
      ⚠ **记号不同**：Polchinski 的 tr = 切空间迹、Tr_a/Tr_v = 规范群伴随/矢量迹；
      Polchinski ↔ ADT 可逐符号对译（Tr_a ↔ Tr，tr ↔ tr），Polchinski ↔ GS **不能**。
      ★ **本条同时是本卡结论的一处旁证**：Polchinski 在脚注里对两个阿贝尔解补的话是
      「**but no corresponding string theories are known**」，且全书**不说**它们反常抵消——
      他的措辞恰好避开了 ADT 指出的坑。
