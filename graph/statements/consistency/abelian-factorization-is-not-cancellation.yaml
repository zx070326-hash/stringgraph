notes: |
  【0. ★ 陈述里两处指向 consistency.twelve-form-factorization-solutions 的交叉引用已改道（2026-09-11）】
  本卡的 statement 写于同日稍早，当时四解表由 `consistency.twelve-form-factorization-solutions` 一张卡承载。
  lead 依 literature/extractions/polchinski-1998-v2-ch12.md 裁决后，那张卡**已拆成两张并标 superseded_by**：
  · **consistency.d10-four-groups-satisfy-anomaly-conditions**（rigorous）——四个群满足两条反常条件（可机检）；
  · **consistency.d10-anomaly-conditions-completeness-claim**（conjecture）——「恰是这四个」的完备性主张。
  statement 文本按项目原则 1 不改；**阅读时请把那两处引用读作指向上面两张新卡**。
  新增红线：**不得写「恰有四个」**（Polchinski §12.2 p.101 脚注 1 的动词只是 "hold"，无唯一性主张）。

  【1. ★ 这条卡是记账红线的载体（docs/ROADMAP.md 2026-09-11）】
  在 ADT 2010 之前，文献习惯把「Î₁₂ 因子化」直接说成「anomaly-free」。ADT 证明这两件事在**阿贝尔情形分裂**：
  · (a) 因子化 Î₁₂ ∝ Y₄X₈ —— 四个 496 维解都满足；
  · (b) GS 抵消项真能写下来（要求 Y₄ = dH₃）—— 两个阿贝尔解做不到。
  图中任何引用四解表的地方只能写 (a)。

  【2. 与 Vafa 2005 的关系（本卡不越区建边）】Vafa 的 landscape/swampland 文（本图 swampland 区在审分支）
  逐字把「U(1)⁴⁹⁶ 与 U(1)²⁴⁸ × E₈ 就反常而言一致」当作前提，并逐字邀请两个方向的后续工作
  （「either to construct these or … to find what consistency condition goes wrong」）。
  **ADT 正是第二个方向的实现**，且其前提句被本卡推翻。
  ⚠ 但 ADT 的结论**比 Vafa 的猜想更强也更窄**：Vafa 猜「造不出来」，ADT 论证「GS 机制用不上」。
  两者不是同一条陈述；swampland 区若要挂边，必须在边上写清这一点。

  【3. 与 GSW 第 10 章的一致性】GSW Vol.2 p.148 逐字：「**Only in the abelian case, when the theory
  becomes free, can T vanish.**」——即在 GSW 自己的框架里，阿贝尔规范反常平凡地为零。
  这与 ADT「阿贝尔场不进六边形图」是同一件事，**两个独立来源相符**。
  真正的问题因此全在引力/混合反常与抵消项能否写下来，正是本卡 (2)。

  【4. 未建的相邻节点】
  · Bergshoeff–de Roo–de Wit 等（NPB 195 (1982) 97）的超对称要求（ADT (16) 的来源）：本项目未取得，
    未建节点，未登记 bib。这是本卡论证链上**最实质的外部输入**。
  · Chapline–Manton（PLB 120 (1983) 105）（非阿贝尔推广，ADT (2) 的来源）：同样未取得。
  · Fiol 2008（arXiv:0809.1525）在 ADT 之前给出这两个理论「可能不存在」的**另一类**证据
    （紧化后模空间体积、repulson 奇点、非阿贝尔 enhançon 不可用）。
    **与本卡的论证完全不同，不是同一条陈述**，本轮不建节点（正文 L0，只核实了 arXiv 元数据与摘要）。
