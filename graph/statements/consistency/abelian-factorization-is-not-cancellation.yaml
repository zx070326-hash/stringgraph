id: consistency.abelian-factorization-is-not-cancellation
kind: proposition
title: 阿贝尔因子使十二形式因子化却写不出 GS 抵消项：U(1)⁴⁹⁶ 与 E₈ × U(1)²⁴⁸ 的 Y₄ ≠ dH₃
statement: |
  **设定**：十维 N = 1 超引力 + 超 Yang–Mills 的**有效场论**，规范群取

      G = U(1)⁴⁹⁶   或   G = E₈ × U(1)²⁴⁸

  （两者的生成元数都是 n = 496）。反常十二形式按 Adams–DeWolfe–Taylor 的编排写成

      Î₁₂ = (1/1440)[ −Tr F⁶ + (1/48) Tr F⁴ Tr F² − (Tr F²)³/14400 ]
            + (n − 496)[ tr R⁶/725760 + tr R⁴ tr R²/552960 + (tr R²)³/1327104 ]
            + Y₄ X₈/768                                                          (ADT (7))

  其中 Tr 是伴随迹、tr 是 SO(1,9) 基本迹（conv.gauge-trace-normalization），
  Y₄ = tr R² − (1/30) Tr F²，X₈ 见 ADT (8)。

  **(1) 因子化成立。** 对上面两个群，第一个方括号**逐项**为零——U(1) 的伴随表示是单态，
  故一切含阿贝尔生成元的伴随迹为零；E₈ × U(1)²⁴⁸ 的 E₈ 一支满足与 E₈ × E₈ 情形同一条迹关系——
  且 n = 496 使第二个方括号为零。于是 Î₁₂ 取因子化形式 **Y₄ X₈**。对 U(1)⁴⁹⁶ 更简单：

      Y₄^{(496)} = tr R²,   X₈^{(496)} = tr R⁴ + (tr R²)²/4                       (ADT (15))

  **(2) 但 Green–Schwarz 抵消项写不下来。** 两件事同时成立：

  · **阿贝尔规范场不进六边形图**：规范微子与规范场的耦合是 Dχ^a = ∂χ^a − i f^{abc} A^b χ^c，
    U(1) 的结构常数全为零，故阿贝尔规范场与规范微子解耦，**没有阿贝尔反常可消**
    （这与 Î₁₂ 中一切阿贝尔伴随迹为零是同一件事）；

  · **超对称仍然强制阿贝尔 Chern–Simons 项**：按 Bergshoeff 等人的结果，每个 U(1)^{(i)} 都给 H₃
    贡献一项 ω₃^{(i)} = A^{(i)} ∧ dA^{(i)}，

        H₃ ≡ dB₂ − Σ_i ω₃^{(i)} + …                                              (ADT (16))

    于是 B₂ 的动能项只有在 B₂ 按 **δ_Λ B₂ = Σ_i Λ^{(i)} F^{(i)}**（ADT (17)）变换时才规范不变。

  两者合起来使抵消引力（与可能的非阿贝尔）反常所需的 GS 项在阿贝尔规范变换下不再不变：

      δ_Λ ∫ B₂ ∧ X₈ = ∫ Σ_i Λ^{(i)} F^{(i)} ∧ X₈  ≠ 0                             (ADT (18))

  而右端**没有对应的单圈反常可以抵消它**。等价的判据是 GS 机制赖以成立的关系 Y₄ = dH₃（ADT (13)）
  在这里失效：

      **Y₄ ≠ dH₃**                                                                (ADT (19))

  ——阿贝尔场从 Y₄ 中退出（它们不进六边形图），却被超对称留在 dH₃ 里。

  **(3) 二择一。** 因此（ADT 逐字）「Supersymmetry thus allows us to preserve either abelian gauge
  or local Lorentz invariance, but not both.」：保住阿贝尔规范不变性就必须丢掉 ∫B₂ ∧ X₈，
  从而留下未抵消的局域洛伦兹反常；保住洛伦兹不变性就破坏阿贝尔规范不变性。
  结论逐字：这两个理论「cannot be made anomaly-free by the Green–Schwarz mechanism」。

  **⇒ 记账后果（本卡存在的理由）**：「反常十二形式因子化」**不蕴含**「反常抵消」。
  凡引用 consistency.twelve-form-factorization-solutions 的四解表处，只能说这四个群使 Î₁₂ **因子化**。

  **本节点不断言**：
  (a) ADT 摘要那句更强的「**are not consistent quantum theories**」。从 (3) 到「不是一致量子理论」
      还需要「除 ∫B₂ ∧ X₈ 之外没有别的抵消办法」以及「(16) 是超对称的唯一选择」，
      ADT 没有证明这两步（见推导 gaps）。本卡只承载「GS 机制在此写不下来」。
  (b) 四解分类本身（见 consistency.twelve-form-factorization-solutions）。
  (c) 「十维超引力沼泽地为空 / 弦普适性」——ADT 摘要自带限定语「without **known** inconsistencies」，
      不是分类定理。
  (d) Bergshoeff 等人那条超对称要求本身：本项目未取得 Nucl. Phys. B195 (1982) 97（L0），
      本卡只转述 ADT 对它的引用。
  (e) 弦论侧的任何事（本卡全部在有效场论侧）。
