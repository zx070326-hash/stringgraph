tags: [anomaly, chern-simons, descent-equations, differential-forms, green-schwarz]
notes: |
  【为什么 status 取 physical-argument 而不是 rigorous】下降方程本身是标准的 Chern–Weil / BRST 下降
  内容，数学上是可以严格化的；但**本卡定义的对象不唯一**：ω⁰_{2n+1} 与 ω¹_{2n} 各只定到恰当形式，
  而 consistency.gs-counterterms-1984 里的 S₁ (18)、S₃ (23) 显式含 ω⁰_{7Y}、ω⁰_{7L}，
  取不同代表元会改变这些反项的具体表达式。也就是说：**本图目前掌握的定义不足以唯一确定下游对象**，
  而能补上这一点的唯一来源（zumino-wu-zee-1984）没有取到。按「不确定选低一级」取 physical-argument。

  升级路径：取得 Zumino–Wu–Zee 1984 或任何给出显式 ω⁰_{2n+1} 的来源（Bilal 2008 §12 的 Q₃/Q₅/Q₇
  是候选，但本项目只读了 §12 的部分内容且其符号约定与 GS 反号，见 conv.gauge-trace-normalization notes）。

  【与现代记号的对照】现代文献常把这两族写成 Q_{2n+1}(A, F) 与 Q¹_{2n}，
  并把整套关系叫「Stora–Zumino 下降方程」。GS 1984 不用这些名字。
