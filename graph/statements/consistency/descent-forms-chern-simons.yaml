id: consistency.descent-forms-chern-simons
kind: definition
status: physical-argument
title: 下降形式 ω⁰_{2n+1} 与 ω¹_{2n}（Chern–Simons 形式及其规范变分，只定到相差恰当形式）
statement: |
  在 conv.gauge-trace-normalization 的记号下（F = dA + A²，楔号省略，tr 是基本表示的迹），
  对 n ≥ 1 引入两族微分形式：

  · **ω⁰_{2n+1 Y}**（2n+1 形式），由

        d ω⁰_{2n+1 Y} = tr F^{n+1}                                    (GS (15))

    定义，**只定到相差一个恰当形式**（原文逐字：「where ω⁰_{2n+1 Y} is defined (up to an exact form) by」）。
    n = 1 的标准取法是 ω⁰_{3Y} = tr(A F − ⅓ A³)（GS (5)(6)），n = 3 给出 S₁ 里用到的 ω⁰_{7Y}。

  · **ω¹_{2n Y}**（2n 形式），由无穷小规范变换 δ 作用在上一族上给出：

        δ ω⁰_{2n+1 Y} = − d ω¹_{2n Y}                                  (GS (16))

    同样**只定到相差一个恰当形式**。反常本身写成 ∫ω¹_{2n} 的形式（例如 (17) 的 G）。

  · **洛伦兹一路**：把 (A, F) 换成自旋联络与曲率 (ω, R)、下标 Y 换成 L，记号与关系相同；
    ω⁰_{3L} = tr(ω R − ⅓ ω³)，dω⁰_{3L} = tr R²（GS (7)(8)），S₂/S₃ 里用到 ω⁰_{7L}、ω¹_{10L}。

  **本卡不含**：ω⁰_{2n+1} 与 ω¹_{2n} 的**显式表达式**（n ≥ 2）。GS 逐字把它们外包给 ref. [9]
  = Zumino–Wu–Zee（本项目未取得全文）。
uses_conventions:
