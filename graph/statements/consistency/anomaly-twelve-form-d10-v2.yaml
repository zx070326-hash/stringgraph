    loc: "§12.2, (12.2.28a,b) p. 101（Y₄ 与 X₈ 的显式定义）；(12.2.19a-c) p. 99（Tr_a 与 Tr_v 的关系）"
    note: |
      **L1**（抽取记录 literature/extractions/polchinski-1998-v2-ch12.md E12/E14）。
      列在这里只为一件事：**Polchinski 的 Tr_a 与本卡的 Tr 是同一个量**（伴随迹），
      且他同样省略楔号，故 conv.gauge-trace-normalization 可以跨两本文献使用。
      ⚠ 他的整体归一化含 (12.2.10) 的 −i/(2π)⁵，GS 侧则把整体常数 c 外包给 AGW；
      **两家的整体归一化本图未认同**（consistency.gravitational-anomaly-polynomial-d10 的
      notes 记了一条已机检的桥：GS (20) = −1/96 × Polchinski (12.2.27) 的引力部分）。
tags: [anomaly, twelve-form, d10, notation, supergravity, super-yang-mills, green-schwarz]
notes: |
  【0. ★ 本卡是 consistency.anomaly-twelve-form-d10 的换代（2026-09-11）】
  旧卡是一张 `definition`，却在 statement 里内嵌了**两条命题**：
  (i) 「外线多于六条的反常由六边形图唯一决定」；
  (ii) 「按 Zumino–Wu–Zee 的分析，反常与一个形式上的十二维规范不变十二形式相联系」。
  按「一个节点一个命题」，本轮拆成三张：
  · **本卡（v2）** ← 旧卡的记号部分（Ω_{4n} := Tr F^{2n}、"十二形式"指 Ω₁₂、下降记号）；
  · consistency.higher-point-anomalies-fixed-by-hexagon ← (i)；
  · consistency.anomaly-descent-to-twelve-form ← (ii)（**升维字典，本图无已核实来源**）。
  旧卡 `superseded_by` 指向本卡，statement 文本不动（CLAUDE.md 原则 1）。
  ⇒ 拆分的**实际收益**：旧卡的 notes 第 5、6 条记了两条来源缺口（唯一性无支撑、升维字典无来源），
  但它们只是散文；拆出独立节点后，这两条缺口成为图里**可被 `why` 追踪的瓶颈节点**。

  【1. 原文 (11) 的 tr/Tr】GS 的 (11) 在影印件上印作小写 `Ω_{4n} = tr F^{2n}`，
  但语义上必须是**伴随**迹（否则紧接的 (12a) 就是废话）。本图统一按语义写 **Tr**，
  这一判读登记在 conv.gauge-trace-normalization 的 notes 第 1 条与抽取记录 §3.1。
  转引本卡时不要把这当成原文字面。

  【2. 为什么 status 仍是 physical-argument 而不是 rigorous】即使剥掉两条命题，本卡定义的
  Ω₁₂ 仍是一个**形式上的**十二维对象（GS 逐字 "a formal expression in twelve dimensions"），
  且它 `uses` 只定到恰当形式、且其数学来源只在局部成立的 descent 卡。
  ⇒ 本卡自身也无法取 rigorous。若将来要一张真正 rigorous 的记号卡，应把 Ω_{4n} := Tr F^{2n}
  单独立成不 `uses` descent 的纯记号卡；本轮不做（会再生出一层几乎空的节点）。

  【3. 不叫 I₁₂】现代文献（bilal-2008、adams-dewolfe-taylor-2010、polchinski-1998-v2）
  把这个对象写作 Î₁₂ 或 I₁₂ 并打包成 B ∧ X₈；
  **GS 1984 既没有 I₁₂ 也没有 X₈ 这两个记号**，只有 Ω_{4n} 与三段分开的 S₁ + S₂ + S₃。
  本卡的标题保留 GS 记号，是为了让「后世打包写法」与「原文写法」在图里可分辨。
  与 Polchinski 侧 Î₁₂ 的桥见 consistency.d10-n1-anomaly-polynomial-factorized-form（formalized）。

  【4. n 的角色】n 只通过规范群维数进入反常多项式，这一点在
  consistency.gravitational-anomaly-polynomial-d10 里才真正用到（那里 n − 496 出现在系数里）。
