id: consistency.anomaly-twelve-form-d10-v2
kind: definition
status: physical-argument
title: GS 1984 记号下的十维反常十二形式：Ω_{4n} := Tr F^{2n}（纯记号卡，不含任何反常论断）
statement: |
  **场论设定（本卡把它当作给定，不断言超引力谱确实如此）**：十维 N = 1 超引力与超 Yang–Mills 的
  耦合理论。手征费米子含量为超引力部分的一个左手 spin-3/2 引力微子与一个右手 spin-1/2 场，
  加上物质部分的 n 个左手 spin-1/2 场（n = 规范群维数，因为无质量费米子在伴随表示）。

  **记号（本卡的全部内容）**。在 conv.gauge-trace-normalization 下（Tr 是**伴随**表示的迹，
  楔号省略），记

      **Ω_{4n} := Tr F^{2n}**    (n = 1, 2, 3)                                       (GS (11))

  即 Ω₄ = Tr F²、Ω₈ = Tr F⁴、Ω₁₂ = Tr F⁶（原文 (11) 印作小写 tr 的读图存疑见 notes 第 1 条）。
  **「（纯规范的）反常十二形式」在本图中就指 Ω₁₂ 这一层**——它是形式上的十二维规范不变多项式，
  与 D = 10 的六边形反常处在下降链的同一族。

  从 Ω₁₂ 回到十维的**记号**约定（consistency.descent-forms-gs-notation）：

      Ω₁₂  ⇝  ω⁰_{11}  ⇝  ω¹_{10}，  十维反常写成 ∫ ω¹_{10} 。

  **本卡不断言**（每一条都另有节点或明记为缺口）：
  (a) 「外线多于六条的反常由六边形图唯一决定，其形式可由 Wess–Zumino 相容条件定出」
      —— consistency.higher-point-anomalies-fixed-by-hexagon；
  (b) 「2n 维反常 ↔ 2n+2 维不变多项式」这条**升维字典**，以及由此把 ∫ω¹_{10} 认同为十维反常
      —— consistency.anomaly-descent-to-twelve-form；
  (c) 任何**数值总归一化**（GS 把常数 c 与各反常之间的相对归一化外包给 Alvarez-Gaumé–Witten）；
  (d) 引力部分与混合部分的十二形式（分别见 consistency.gravitational-anomaly-polynomial-d10
      与 consistency.anomaly-cancellation-so32-effective-theory 里引用的 (22)）；
  (e) 后世的 X₈ / ∫B ∧ X₈ 打包写法——**那不是 GS 1984 的记号**
      （见 consistency.gs-counterterms-1984 notes；X₈ 的一手教科书来源是 polchinski-1998-v2 (12.2.28b)）；
  (f) 「Ω_{4n} 用基本迹的表达式」——那是纯代数命题
      math.so-usp-adjoint-fundamental-trace-identities 与 math.e8-adjoint-trace-identities。
