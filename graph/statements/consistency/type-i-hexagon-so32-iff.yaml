sources:
  - ref: gsw-1987-v2
    loc: "§10.2.2, p. 165，(10.2.36)(10.2.37) 及其后逐字句「…which vanishes for the gauge group SO(32) and for no other group.」；候选集与 η 的定义见 §10.2.1, pp. 152–153, (10.2.1)(10.2.2)(10.2.3)；章首断言 p. 143；总结 §10.5, p. 172"
    note: |
      **L1 逐页读图**（Cambridge Core 25th Anniversary Edition 章级 PDF，第 10 章 pp. 141–174 读毕；
      抽取记录 literature/extractions/gsw-1987-v2.md E1/E5/E6/E11）。
      ⚠ **同页两处排印错误**：p. 165 正文两次写「as in (10.2.17) for SO(32)」与
      「The last term in (10.2.17), 15 trλ⁴trλ²」，但 (10.2.17) 是 Dirac 迹公式
      tr(Γ₁₁Γ_{μ₁}…Γ_{μ₁₀}) = 32 ε（p. 158，已 L1 读到），含那两项的是 **(10.1.12)**。
      抽取记录 §3.3 判为 GSW 排印错误。引用 p. 165 那段时必须带上这一点。
      ⚠ 本章**未声明时空度规号差**（抽取记录 §3.5，L0），故本卡不挂任何 conv.metric-*。
tags: [anomaly, hexagon, type-i, so32, chan-paton, string-one-loop, gauge-anomaly]
notes: |
  【0. ★ 陈述 (a) 与 notes 第 2 条里的交叉引用已改道（2026-09-11）】
  写本卡时四解表由 `consistency.twelve-form-factorization-solutions` 一张卡承载；
  lead 依 literature/extractions/polchinski-1998-v2-ch12.md 裁决后那张卡**已拆成两张并标 superseded_by**：
  **consistency.d10-four-groups-satisfy-anomaly-conditions**（rigorous）与
  **consistency.d10-anomaly-conditions-completeness-claim**（conjecture）。
  statement 文本按项目原则 1 不改，阅读时请把那处引用读作指向这两张新卡。

  【0b. ★ Polchinski §12.2 走的是低能场论路线，不是本卡的弦论侧计算】
  polchinski-1998-v2 (12.2.19c) 下方逐字写「The last of these identities implies that **precisely for SO(32)**
  the gauge anomaly Tr_a(F₂⁶) is equal to a product of lower traces and so can be canceled by the variations of
  S′ and S″. **This is the Green–Schwarz mechanism.**」——**这是低能场论的迹恒等式论证，
  不是 type I 单圈六边形的弦论计算**，与本卡不是同一条推导，故**只记在 notes，不加为 source**
  （抽取记录 polchinski-1998-v2-ch12.md §5.1 表末行的建议）。
  ⚠ 该处的「precisely for SO(32)」适用域**只是 SO(n) 族**（上文限定 "For SO(n)"），比本卡的
  Chan–Paton 候选集（SO(n)/USp(n)/U(n)）还窄。
  另注：Polchinski §12.2 同处逐字承认弦论侧的对应「not surprisingly the necessary interactions occur in these
  theories with the correct coefficients」——**没有并排比较系数**（抽取记录 E24）。

  【1. ★ 两个独立的「32」（本图的观察，不是原文断言）】
  · **(10.2.36) 里的 32**：GSW 逐字说它来自变量替换「from √z_r to z_r (i.e., from ν_r/2 to ν_r),
    which gives a factor of 32」——即 5 个积分变量各出一个 2，2⁵ = 32。
  · **同页低能解释里的 32**：GSW 逐字「The number of such diagrams is equal to the number of ways in
    which an **odd number of twists** can be distributed on the internal legs of a hexagon diagram,
    **which is 32**.」——即 Σ_{k 奇} C(6,k) = 2⁵ = 32（本图 math.hexagon-odd-twist-count）。
  两条路线落到同一个 2⁵，**GSW 没有解释它们为什么相等**。本卡把这条观察记在这里；
  推导只用第一条（变量替换），不依赖第二条。

  【2. ★ 与四解卡绝不可合并】consistency.d10-four-groups-satisfy-anomaly-conditions（与其完备性卡
  consistency.d10-anomaly-conditions-completeness-claim）是**低能场论侧**：
  候选集是全部 496 维李代数，结论是「满足两条反常条件 / 因子化」。本卡是**弦论侧**：
  候选集是 Chan–Paton 群，结论是「单迹反常为零」。适用域、候选集、结论词三样都不同。
  GSW 自己也把两者分开：本章 (10.1.12) 之后逐字「(These matters are discussed further in §13.5.3.)」。
  ⚠ 尤其注意：**本卡的「and for no other group」不是场论侧的完备性主张**。
  场论侧的完备性在本图是 conjecture（见上述完备性卡），而本卡的「no other」只在
  Chan–Paton 候选集 SO(n)/USp(n)/U(n) 内，且由整数方程 n + 32η = 0 直接解出。

  【3. ★ 本章相对 GS 1984 的两处实质补充】(a) 迹恒等式多了 U(n) 一支 (10.1.14) Tr t⁶ = n trλ⁶ + 15 trλ⁴trλ²
  （已补记在 math.so-usp-adjoint-fundamental-trace-identities 的 notes）；
  (b) GS (12c) 里凭空出现的整数 32 有了世界面来历（见本 notes 第 1 条）。

  【4. 「iff」的实际内容】GSW 直接断言「and for no other group」，**不作枚举**。
  把它化归为整数方程 n + 32η = 0（η ∈ {−1, 0, +1}，n 正整数）是本图做的一步，见推导 summary。

  【5. 与「非平面图」的关系】GSW 在同一节证明非平面图（群论因子 G_T，双迹）**对任意规范群无反常**，
  并指出低能极限下场论那边的 tr(λ₁…λ₄)tr(λ₅λ₆) 项要靠无质量闭弦（B_{μν}）交换来消——
  那正是第 13 章 GS 机制的弦论侧来源。本图尚未建这两张卡，建议后续补：
  `consistency.type-i-nonplanar-hexagon-anomaly-free` 与 `consistency.b-field-tree-anomaly`
  （抽取记录 §5.1 已列 loc）。
