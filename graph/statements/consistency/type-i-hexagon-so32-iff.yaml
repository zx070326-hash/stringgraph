id: consistency.type-i-hexagon-so32-iff
kind: proposition
title: type I 单圈纯规范六边形反常（单迹部分）为零 ⟺ Chan–Paton 规范群是 SO(32)
statement: |
  **设定（适用域，是陈述的一部分）**：**type I 超弦**，**单圈**，六个外态全部是**无质量在壳规范粒子**
  （GSW 逐字「the external states are massless on-shell gauge particles」）。
  Chan–Paton 矩阵 λ 取规范代数 **SO(n)、USp(n) 或 U(n)** 的**基本表示**
  （conv.gauge-trace-normalization；spectrum.chan-paton-gauge-group）。
  单圈六边形有三种拓扑，其群论因子分别是

      G_P = n · tr(λ₁λ₂…λ₆)        平面图（annulus；n 来自无粒子附着的那条边界上的单位矩阵迹）   (10.2.1)
      G_N = η · tr(λ₁λ₂…λ₆)        不可定向图（Möbius 带，只有一条边界，故无 n 因子）            (10.2.2)
      G_T = tr(λ₁λ₂λ₃λ₄) · tr(λ₅λ₆)  非平面图                                                  (10.2.3)

  其中 **η 是把奇数条线扭转所带的因子**，GSW 逐字：「−1 for SO(n), +1 for USp(n) and 0 for U(n)」。

  **命题**：带群论因子 tr(λ₁…λ₆) 的**单迹**总反常是

      W = W_P + W_N,      **W_N = η · (32/n) · W_P**                                          (10.2.36)(10.2.37)

  于是 W = (1 + 32η/n) · W_P，而它**为零当且仅当规范群是 SO(32)**。

  原文逐字（p. 165，(10.2.37) 之后）：
  「As a result the total anomaly with the group-theory factor tr(λ₁…λ₆) is given by W = W_P + W_N,
  **which vanishes for the gauge group SO(32) and for no other group.**」
  同书 p. 143（章首）：「A surprising result will emerge: **the anomaly cancels if and only if the gauge
  group is SO(32).**」；§10.5 总结 p. 172：「**The requirement that these anomalies cancel uniquely
  determines the gauge group to be SO(32).**」

  **本节点不断言**（每条都有原文依据，见 notes 与推导 gaps）：
  (a) ★ 「十维 N = 1 反常自由的规范群唯一是 SO(32)」。本卡的候选集只有 **Chan–Paton 群**
      SO(n)/USp(n)/U(n)。**E₈ × E₈ 与 E₈ × U(1)²⁴⁸、U(1)⁴⁹⁶ 根本不在候选集里**
      （E₈ 不是 Chan–Paton 群；U(n) 另被 GSW 以超对称理由提前排除，p. 152）。
      低能场论侧的四解表是**另一条陈述**：consistency.twelve-form-factorization-solutions。
  (b) 引力反常与混合反常在**弦论侧**抵消。GSW §10.3（pp. 167–168）对这两类反常**没有做任何弦论侧计算**，
      逐字只有「as is **suggested** by the low energy analysis of chapter 13」「**should** cancel」
      「It is **plausible**」「there **seems** to be」；章首 p. 143 更逐字自陈
      「**although the relevant calculations have not been performed**」。
  (c) 非平面图无反常（GSW §10.2.3, pp. 165–166，用「canceled propagator argument」）。
      那是独立的一条命题，本图尚未建卡；本卡只覆盖 tr(λ₁…λ₆) 单迹部分。
  (d) type IIB、杂化弦的任何事（GSW 同样只说低能分析「suggests」）。
  (e) SO(32) 单圈**发散**的抵消（§10.4）。作者对那一段自陈
      「**This argument for the finiteness of the SO(32) theory given above is not entirely rigorous.**」
  (f) 首发权。本章是教科书重述；原始计算是 Green–Schwarz, Nucl. Phys. **B255** (1985) 93–114，
      本项目未抽（bib key `green-schwarz-1985-hexagon`，reading-list P1）。
