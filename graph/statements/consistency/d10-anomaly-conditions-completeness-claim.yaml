id: consistency.d10-anomaly-conditions-completeness-claim
kind: proposition
title: 完备性主张：除 SO(32)、E₈ × E₈、E₈ × U(1)²⁴⁸、U(1)⁴⁹⁶ 外没有别的 496 维规范群满足反常条件（文献断言，无已核实证明）
statement: |
  沿用 consistency.d10-four-groups-satisfy-anomaly-conditions 的两条条件：

    (i)  Tr F⁶ = (1/48) · Tr F⁴ · Tr F² − (Tr F²)³/14400   （伴随迹）
    (ii) n := dim 𝔤 = 496

  **命题（文献断言，本图记为猜想）**：满足 (i)(ii) 的十维 N = 1 规范代数**只有**那四个，
  即不存在满足 (i)(ii) 的第五个 496 维李代数。

  **本卡的实际认识论内容**（这一段是陈述的一部分，不是注释）：
  本图**不**把上面这句当作已确立的定理，而是把它当作一条**在可读文献中被反复陈述、但无已核实证明、
  且各家覆盖范围互相冲突**的主张。四家表述如下：

  · **gsw-1987-v2 §13.5.3**（pp. 353–358，标题「Allowed gauge groups for N = 1 superstring theories」）：
    据两条独立二手证据，四解表的**原始陈述**在这一节。**该节正文本项目未取得（L0）**，
    因此「GSW 到底断言了多强的话」未知；两位转述者的读法明显不同。
  · **bilal-2008 §12.4.2**（pp. 102–103，L1）：列四个解并写
    「One can actually scan all 496-dimensional groups and show that there are no other possibilities」
    ——**无证明、无引用**。
  · **antonelli-2015**（L1）：§1.1 逐字承认在该文之前
    「Hints for this statement can be traced back in the literature, mostly following the original statement
    found in chapter 13 of [3], **but no proof has explicitly been carried out**」；
    该文自称补上（摘要「We prove…」，p.33「are the only groups where the anomaly is cancelled」），
    但**是单作者预印本，本项目未核实到期刊发表记录，也未复核其证明**。
  · **polchinski-1998-v2 §12.2 p. 101 脚注 1**（L1）：只说这两个阿贝尔群「also **hold**」（指两条 properties），
    **全书没有任何唯一性主张**——即最可靠的一手教科书来源在这一点上**保持沉默**。
  另有一条**冲突**表述：**schwarz-2012-history p.10**（L1，作者本人回忆）说 E₈ × E₈ 是
  「a second (and **the only other**) gauge group」，与四解表不相容（最可能的调和是他只算非阿贝尔/半单解，
  但他没这么限定）。**本图不裁决。**

  **本节点不断言**：
  (a) ★★ 这四个群「反常抵消」或「是一致理论」。两个阿贝尔解的 GS 抵消项写不下来
      （consistency.abelian-factorization-is-not-cancellation，ADT 2010，L1）。
  (b) 496 维李代数的完整分类。antonelli-2015 §2.1 逐字：「the set of Lie groups with 496 dimensions
      contains **many more** groups.」
  (c) 「这四个满足条件」——那是 consistency.d10-four-groups-satisfy-anomaly-conditions（可机检，本卡不重复）。
  (d) 条件 (i)(ii) 之外的反常条件对候选集的进一步限制。
uses_conventions:
  - conv.gauge-trace-normalization
sources:
  - ref: bilal-2008
    loc: "§12.4.2, pp. 102–103：四解列表 +「One can actually scan all 496-dimensional groups and show that there are no other possibilities」"
    note: |
      L1（researcher 2026-09-11 读 §12 全节 pp. 96–103）。
      **本项目可读来源中「没有别的」这一断言的唯一正面表述，且它本身只是一句「可以扫描」，无证明无引用。**
  - ref: antonelli-2015
    loc: "§1.1, p.3（「no proof has explicitly been carried out」+ 出处指认）；§2.1, p.7（「It is often said that four groups cancel the anomaly」+ 496 维群还有很多）；摘要与 p.33（自称已证）；§2.3–3.4 证明主体"
    note: |
      L1。**唯一自称给出证明的来源**，但是单作者预印本（UTRIP 本科生暑期报告，非期刊发表）。
      **2026-09-12 更新**：research agent 已完整复核 §2.3–3.4 证明主体（此前只读了 pp. 1–8、33–36）。
      结论：该文**候选集本身取得对**（覆盖紧致李代数的 Killing-Cartan 分类，非人为限定的子集），
      但**计算执行有实质性错误**：SU(3)/SU(4)/SU(5) 与 F₄/E₆ 的迹系数算错，F₄ 支所用方法本身无效，
      另有若干笔误（如 p.15 关于「G₂ 无反常」的符号写反）。因此本文不能作为该命题在 rigorous
      层级的来源，只能维持 physical-argument/anecdotal 层级引用（其候选集框架仍有参考价值，
      但具体系数与结论需重新核算，见 research/attempts/d10-anomaly-full-classification/）。
      且该文对「anomaly cancelled」用的是**因子化**义，
      与 adams-dewolfe-taylor-2010 的「抵消」不是同一件事（见 bib note 的三条使用限制）。
  - ref: gsw-1987-v2
    loc: "§13.5.3「Allowed gauge groups for N = 1 superstring theories」，pp. 353–358"
    note: |
      ★★ **内容 L1 OCR（2026-09-12 更新，此前 L0）**：researcher agent 用 Google Books
      `jscmd=SearchWithinVolume2` 逐段 OCR 拼出该节正文（无预览书籍的搜索片段检索技巧，
      详见其报告；未取得可引用的整页扫描，故仍不满足"逐页读图"的 L1 标准图逐页要求，
      标 L1 OCR 而非 L1）。
      **确认内容**：GSW 正文只给出 SO(n) 与 E₈ 两支的具体验证，随后断言"这两个是仅有的候选"，
      **但没有给出候选集之外排除的论证**——即完备性主张在原始出处本身就是**裸断言**，
      不是"证明存在但本项目没读到"。
      两条独立二手证据把四解表的出处指向这一节（antonelli-2015 §1.1；adams-dewolfe-taylor-2010 第一节），
      现已直接核实两者转述基本准确（GSW 确实只断言、不证明）。
      ⚠ **红线维持**：本图任何节点仍不得声称已取得 GSW 第 13 章的逐页扫描件或精确式号
      （OCR 片段拼接≠逐页读图，同记录 §3.1/§5.5 红线不解除，只降级措辞为"内容已知但非逐页核实"）。
  - ref: polchinski-1998-v2
    loc: "§12.2, p. 101 与脚注 1"
    note: |
      L1 原书。**列在这里是作为「最可靠的一手来源在完备性上保持沉默」的证据**：
      Polchinski 只说四个群的两条 properties 「hold」，**没有** "the only" / "no other" / "classification"
      （抽取记录 literature/extractions/polchinski-1998-v2-ch12.md E14 的动词裁定与 §5.5 红线）。
  - ref: schwarz-2012-history
    loc: "p.10：「E₈ × E₈ is a second (and the only other) gauge group for which the anomalies could cancel」"
    note: L1。**与四解表冲突的表述**，登记为矛盾，本图不裁决。
tags: [anomaly, classification, d10, so32, e8, abelian, unresolved-conflict, open-problem]
notes: |
  【1. ★ 为什么 status 是 conjecture 而不是 physical-argument】
  按 docs/STATUS_LEVELS.md 的「断言 + 骨架」裁决（lead 2026-09-11），来源给骨架而关键步骤只有断言的，
  标 physical-argument。**本卡不适用那一档**，理由是该裁决同时写明：
  `conjecture` 保留给「来源本身把它当猜想提出、或**结论真伪在文献中未定**的命题」。这里两条都命中：
  · antonelli-2015 逐字说这在该文之前是**未证**的（「no proof has explicitly been carried out」），
    即该文献线自己把它当作待证命题；
  · **各家覆盖范围互相冲突**（Schwarz「只有另一个」vs 四解表），且最可靠的一手来源（Polchinski）
    在这一点上不表态。⇒ 命题的**真值范围**在文献中未定，不只是「论证不完整」。
  ⚠ 若日后取得 GSW §13.5.3 正文并确认其中有分类论证，或复核了 antonelli-2015 的证明，
  应新建推导并相应上调；**不得**在没有新推导的情况下手改 status（docs/STATUS_LEVELS.md）。

  【2. ★★ 措辞红线（lead 2026-09-11 依 polchinski-1998-v2-ch12 抽取）】
  图中**不得**在别处写「（十维 N=1 反常自由/因子化的规范群）恰有四个」。要引用完备性，
  必须引用本卡并连同其 conjecture 状态一起引。可以无条件引用的是
  consistency.d10-four-groups-satisfy-anomaly-conditions（「这四个满足条件」）。

  【3. ★★ 与「抵消」的红线（docs/ROADMAP.md 2026-09-11）】
  即使完备性成立，也只能说「只有这四个使十二形式因子化」，**不能说「只有这四个反常抵消」**：
  两个阿贝尔解连 GS 抵消项都写不下来（consistency.abelian-factorization-is-not-cancellation）。

  【4. 本卡取代的旧卡】本分支早些时候（2026-09-11）建过
  consistency.twelve-form-factorization-solutions，把「四个群满足条件」与「恰是四个」写在同一条陈述里。
  经 lead 依 polchinski-1998-v2-ch12 抽取裁决后拆成本卡 +
  consistency.d10-four-groups-satisfy-anomaly-conditions，旧卡已标 superseded_by 指向本卡。

  【5. 闭合路径】① 人类在浏览器取 GSW §13.5.3 正文（6 页）；
  ② 复核 antonelli-2015 §2–§3 的分类论证（36 页，本项目只读了 pp. 1–8、33–36）；
  ③ 若两者都指向「只是断言」，则本卡可长期停在 conjecture，并把 Schwarz 的冲突表述按
  「他只算非阿贝尔半单解」裁决。

  【6. 2026-09-12 Phase-0 复核结论 + 原创证明轨道开工】①②已完成（见上方 sources 更新）：
  GSW 正文确认只断言不证明；antonelli-2015 证明主体已读完，候选集框架正确但计算有多处实质性错误
  （SU(3,4,5)/F₄/E₆ 系数、F₄ 方法本身无效），不能作为 rigorous 来源。
  **重新界定缺口**：候选集限定（"496 维反常自由候选必是紧致李代数"）本身不是缺口——
  这就是 Killing-Cartan 分类，经典定理，本卡不需要另证；真正缺口是**在这个经典候选集上
  正确执行有限排除计算**，目前没有一份公开来源把这件事做对。
  已按 `research/CLAUDE.md` 开工原创证明尝试 research/attempts/d10-anomaly-full-classification/
  （见 root CLAUDE.md「原创证明轨道」）：目标是给出候选集上每个单因子族（A–G 型 + 阿贝尔）
  迹恒等式排除的完整、正确、机器可核验证明，验证通过后按 add-statement 流程把结论写回本卡
  （届时本卡 status 可能从 conjecture 上调，需新推导，不得手改）。

  【7. 2026-09-12 原创证明毕业：effective status conjecture → rigorous】
  上面【6】预告的原创证明已完成并经 `graph-reviewer` 对抗性审查裁定 `verified`
  （research/attempts/d10-anomaly-full-classification/status.yaml）。按 research/CLAUDE.md
  生命周期第 4 条毕业，新增推导
  `consistency.d10-anomaly-conditions-completeness-claim--via-root-power-sums`
  （`kind: proof`，`status: rigorous`）。`uv run stringgraph status` 确认本卡
  effective status 由 conjecture 上调为 **rigorous**，由该推导承载；
  本卡自身没有 `status` 字段（`kind: proposition`），全程未手改，符合原则 2。
  · 旧推导 `--via-unproven-literature-assertion` **保留不动**：它记录的是文献态
    （谁断言过、谁承认无证明、谁的表述冲突），与自证态是两件事。
  · **rigorous 走的是例外通道**（docs/STATUS_LEVELS.md：前提完整 + 有限步初等计算 +
    reviewer 独立复核），**不是**「有发表的、数学界接受的完整证明」。该证明
    **未经期刊发表、未经同行评议**，且 `captain_confirmed: false`（船长尚未最终确认）。
  · ⚠ **【2】【3】两条措辞红线不因此解除**：仍然只能说「只有这四个使十二形式因子化」，
    **不能说「只有这四个反常抵消」**。
  · ⚠ **本卡标题与陈述正文里的「文献断言，无已核实证明」现在已经过时**，但按原则 1
    （陈述与标题不可变）**不就地修改**；要更新措辞须新建卡并在本卡写 `superseded_by`，
    那是 lead/auditor 的裁决，不由 curator 自行发起。现状已在此留痕。
  · ⚠ 正面方向「这四个确实满足条件」仍在
    consistency.d10-four-groups-satisfy-anomaly-conditions，其 effective 仍是
    `physical-argument`（被两张二手迹系数表卡压低）。**要把「恰有四个」当完整分类引用，
    必须同时升级那张卡**，不能只引本卡。
