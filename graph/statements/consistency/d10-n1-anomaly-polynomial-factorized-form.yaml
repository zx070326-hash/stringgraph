id: consistency.d10-n1-anomaly-polynomial-factorized-form
kind: proposition
title: Polchinski (12.2.27)+(12.2.28a,b) 的因子化形与 (12.2.11)+(12.2.12) 的逐项展开形是同一多项式（= ADT 2010 (7)+(8)）
statement: |
  **记号与前提（这一段是陈述的一部分，不是注释）。**
  把六个迹单项

      tr R₂²,  tr R₂⁴,  tr R₂⁶,  Tr_a F₂²,  Tr_a F₂⁴,  Tr_a F₂⁶

  当作**六个互相独立的标量**，把规范生成元总数 n 当作**第七个独立标量**，
  取值在一个特征零的域中（系数全是有理数）。
  ⚠ 这七个符号在真实的微分形式与具体李代数上**并不独立**；本命题不使用它们之间的任何关系，
  这正是它能被当作纯代数恒等式的原因。楔号一律省略（conv.gauge-trace-normalization）。

  按 Polchinski §12.2 逐字转录四个多项式：

      Î₈(n; F₂,R₂) = − Tr_a F₂⁶/1440
                     + Tr_a F₂⁴ tr R₂²/2304 − Tr_a F₂² tr R₂⁴/23040 − Tr_a F₂² (tr R₂²)²/18432
                     + n tr R₂⁶/725760 + n tr R₂⁴ tr R₂²/552960 + n (tr R₂²)³/1327104   (12.2.11)

      Î₅₆(R₂) = −495 tr R₂⁶/725760 + 225 tr R₂⁴ tr R₂²/552960 − 63 (tr R₂²)³/1327104     (12.2.12)

      Y₄ = tr R₂² − (1/30) Tr_a F₂²                                                       (12.2.28a)

      X₈ = tr R₂⁴ + (tr R₂²)²/4 − Tr_a F₂² tr R₂²/30 + Tr_a F₂⁴/3 − (Tr_a F₂²)²/900       (12.2.28b)

  **命题。** 对七个符号的一切取值，

      Î₅₆(R₂) − Î₈(1; R₂, 规范迹置零) + Î₈(n; F₂,R₂)
        = (1/1440)[ − Tr_a F₂⁶ + (1/48) Tr_a F₂² Tr_a F₂⁴ − (Tr_a F₂²)³/14400 ]
          + (n − 496)[ tr R₂⁶/725760 + tr R₂⁴ tr R₂²/552960 + (tr R₂²)³/1327104 ]
          + Y₄ X₈/768 .                                                                   (12.2.27)

  即：**(12.2.27)+(12.2.28a,b) 的因子化形，与 (12.2.11)+(12.2.12) 按 (12.2.27) 第一行
  Î_I = Î₅₆ − Î₈ + Î₈ 组装出的逐项展开形，是同一个多项式。**

  由于 Adams–DeWolfe–Taylor 2010 (7)(8) 与 (12.2.27)(12.2.28a,b) **逐项逐系数完全相同**
  （差别只是记号 Tr_a → Tr、F₂,R₂ → F,R，以及把 Tr_a F₂² Tr_a F₂⁴ 写成 Tr F⁴ Tr F²），
  同一条恒等式**同时**验证了 ADT (7)+(8) 对 (12.2.11)+(12.2.12) 的相容性。

  **中性费米子那一项的读法（本卡采用的转录约定）**：(12.2.27) 第一行里的 Î₈(R₂) 指中性费米子
  **8′**，本卡按「n = Tr(1) 是表示维数、中性场处在平凡表示 ⇒ n = 1」并令三个规范迹为零，
  代入 (12.2.11)。**Polchinski 没有写出这一步**（见 sources 的 note 与推导的 gaps）；
  它被他自己对 n 的定义所迫，也正是 (12.2.27) 里 n − 496 的记账来源（(n − 1) − 495 = n − 496）。

  **本卡不断言**：
  (a) 这些多项式**是**相应手征场的反常——那是 Alvarez-Gaumé–Witten 的指标定理计算，
      Polchinski 逐字「we will not repeat it here but just quote the result」；
  (b) 「十维反常 ↔ 形式上的十二形式」这条升维字典（见 consistency.anomaly-descent-to-twelve-form）；
  (c) 微分形式、楔积、以及 (12.2.10) 的 −i/(2π)⁵ 整体归一化；
  (d) 任何具体李代数的迹恒等式——因而**不断言任何规范群的反常抵消或因子化**；
  (e) 十维 N = 1 的手征场含量（gravitino 56、中性 8′、伴随 8 gaugino）确实如此，
      那是 §12.1 的超引力谱，本图未建卡。
uses_conventions:
  - conv.gauge-trace-normalization
