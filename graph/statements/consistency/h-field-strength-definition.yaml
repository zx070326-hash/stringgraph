id: consistency.h-field-strength-definition
kind: definition
status: rigorous
title: 带 Chern–Simons 修正的三形式场强 H = dB + ω⁰_{3Y} − ω⁰_{3L}（GS 1984 (4)(4′)）
statement: |
  在十维 N = 1 超引力 + 超 Yang–Mills 的场内容（zehnbein e^m_μ、二形式势 B、规范势 A、
  自旋联络 ω）上，按 Green–Schwarz 1984 定义三形式场强
  （conv.gauge-trace-normalization，楔号省略）：

      H = dB + ω⁰_{3Y} − ω⁰_{3L}                                      （SO(N) 或 USp(N)）      (4)
      H = dB + (1/30) ω⁰_{3Y₁} + (1/30) ω⁰_{3Y₂} − ω⁰_{3L}            （E₈ × E₈）             (4′)

  其中（consistency.descent-forms-gs-notation 的 n = 1 情形）

      ω⁰_{3Y} = tr(A F − ⅓ A³),   d ω⁰_{3Y} = tr F²
      ω⁰_{3L} = tr(ω R − ⅓ ω³),   d ω⁰_{3L} = tr R²

  ω 是切空间代数 SO(9,1) 的 10 × 10 自旋联络矩阵，R = dω + ω²。
  (4′) 里的 1/30：GS 逐字说，若 Yang–Mills Chern–Simons 项改用**伴随**表示的矩阵定义，
  则 SO(32) 情形下 (4) 的系数也会是 1/30。

  **归属（GS 自己的划界）**
  Yang–Mills Chern–Simons 项已出现在被修正的极小超引力 + 超 YM 拉氏量（GS 的 ref. [7]）里；
  **洛伦兹 Chern–Simons 项 −ω⁰_{3L} 是 GS 1984 新加的**，GS 逐字：「The last term in eq. (4) is a
  higher-derivative term arising in the low-energy expansion of the superstring and therefore does
  not appear in ref. [7].」

  **本卡不断言**：
  (a) B、A、ω 的规范/局域洛伦兹变换律——那是 consistency.b-field-gauge-lorentz-transformation
      （GS (9a,b,c)(9c′)）；
  (b) δH = 0——那是 consistency.h-field-gauge-lorentz-invariant（GS (10c)）；
  (c) 两个 Chern–Simons 项的**整体**符号有物理意义——见 notes 第 2 条，物理不变量是二者的**相对**符号；
  (d) 这套场内容构成一个自洽的量子理论。
uses:
  - consistency.descent-forms-gs-notation
uses_conventions:
  - conv.gauge-trace-normalization
sources:
  - ref: green-schwarz-1984
    loc: "PLB p.118（重印 609），(4)(4′)(5)(6)(7)(8) 与其后正文（含「The last term in eq. (4) is a higher-derivative term…」）"
    note: |
      L1 逐页读图，抽取记录 literature/extractions/green-schwarz-1984.md E4。
      ★ **本卡里两个 Chern–Simons 项符号的唯一来源是 (4)，且它只有配合 (9c) 才被固定**
      （见 consistency.b-field-gauge-lorentz-transformation）。
      **不得**把它溯源到 zumino-1983-les-houches 或 zumino-wu-zee-1984：
      Zumino 一侧**没有 B 场、没有 H、没有引力侧**（Les Houches 讲义 L1 全文 46 页通读确认），
      下降方程只约束 ω₃ 自身的定义与 δω₃ 的符号，**完全不约束 H = dB ± ω₃ 里的那个 ±**。
      那个 ± 由三样东西联合固定：(i) (9c) 的 δB 约定，(ii) 要求 δH = 0（(10c)），
      (iii) B 的整体符号约定（可自由重定义）。抽取记录 literature/extractions/zumino-wu-zee-1984.md Q-Z1/Q-Z2。
  - ref: polchinski-1998-v2
    loc: "§12.2, (12.2.22) p. 99 `H̃₃ = dB₂ − c ω_{3Y} − c′ ω_{3L}`（原文逐字「with c and c′ constants」）；(12.2.23) ω_{3L} = ω₁dω₁ + (2/3)ω₁³；(12.2.22) 下方行内 ω_{3Y} = A₁dA₁ − (2i/3)A₁³；p. 100 逐字「The gravitational Chern–Simons term was not included in the earlier low energy effective action because it is a higher derivative effect.」"
    note: |
      **L1**（抽取记录 literature/extractions/polchinski-1998-v2-ch12.md E16）。
      ★ **第三种、也是最"中立"的写法**：Polchinski **拒绝固定两个 CS 项的系数与符号**，
      写两个待定常数 c、c′。他的 (12.2.26)/(12.2.28a) 隐含 c ∝ −1/30、c′ ∝ +1（二者反号），
      **但这一步比对是抽取者复算，原书没有明写 c、c′ 的取值**（抽取记录 E16 第 3 点）。
      ⇒ 本卡**不**据此宣称 Polchinski 与 GS 的整体符号一致；这条来源只支持
      「相对符号相反」以及「引力 CS 项是高阶导数效应」这两点。
      ⚠ Polchinski 的 ω_{3Y} 带 −(2i/3)（生成元厄米），GS 的带 −⅓（生成元反厄米），
      是同一约定的两种写法（见 conv.gauge-trace-normalization sources 第二条的同型换算）。
  - ref: bilal-2008
    loc: "§12.4, (12.14) `H = dB − Q₃(A,F) + β̃ Q₃(ω,R)`（逐字「with β̃ to be fixed below」）；p.102 逐字「it is then enough to choose **β̃ = 1** in (12.14) and (12.15)」；(12.33) 上方 E₈×E₈ 情形「again with β̃ = 1」"
    note: |
      **L1（lead 于 2026-09-11 逐页核实 arXiv:0802.0634 v2 §12.4 pp.100–103，
      记录在 literature/extractions/green-schwarz-1984.md §9）。**
      列为**第二来源（对照用，不是本卡采用的写法）**：本卡按 GS 原文写 H = dB + ω⁰_{3Y} − ω⁰_{3L}。
      两家的换算关系见 notes 第 2 条（已闭合）。
  - ref: bergshoeff-1982
    loc: "全文（GS ref. [7]，被修正的极小 SUGRA + SYM 拉氏量）"
    note: |
      本项目未取得全文（L0）。只承载「归属」那一段里「ref. [7] 里有什么」这一条，
      而这条本身也是**GS 说的**，不是本图核对的。GS 在同处并列 Chapline–Manton, Phys. Lett. 120B (1983) 105。
tags: [anomaly, chern-simons, kalb-ramond, supergravity, green-schwarz, d10]
notes: |
  【0. ★ 本卡是 consistency.h-field-strength-chern-simons 的换代（2026-09-11）】
  旧卡把**两件事**写在一张定义卡里：H 的定义 (4)(4′) 与 B、A、ω 的变换律 (9a,b,c)(9c′)。
  按 CLAUDE.md 原则 1 与「一个节点一个命题」，本轮拆成三张：
  · **本卡** ← 旧卡 (1) 与 (3)；
  · consistency.b-field-gauge-lorentz-transformation ← 旧卡 (2)；
  · consistency.h-field-gauge-lorentz-invariant ← 旧卡 notes 第 3 条点名要补的 δH = 0 命题卡。
  旧卡 `superseded_by` 指向本卡（三张里唯一的"主继承者"），statement 文本不动。

  【1. status = rigorous 的含义与边界】本卡只做一件事：在给定场 (B, A, ω) 上写下一个三形式。
  这是精确的微分几何陈述，故 rigorous。它**不**承载「十维 N = 1 超引力 + 超 YM 作为量子
  理论存在且自洽」——那件事在本图里没有节点，也不该由定义卡偷偷带进来。
  下游的物理结论（反常抵消）由 consistency.anomaly-cancellation-* 承载，那里是 physical-argument。
  注意本卡 `uses` 了只定到恰当形式的 descent 卡（consistency.descent-forms-gs-notation，
  physical-argument），故其**有效**状态会被压到 physical-argument；这是有意的记账。
  ⚠ 另一条被继承的限定：descent 卡的数学内容（math.chern-simons-descent-equations）的唯一
  已核实来源**只在有限坐标邻域上**声明这些等式成立，而本卡把 (4) 写在整个十维时空上。
  这条**局部 vs 全局**的缺口在 GS 原文里没有对应表述。

  【2. ★ Chern–Simons 项的符号：与 Bilal 2008 的关系已闭合（2026-09-11）】
  GS (4) 是 **H = dB + ω⁰_{3Y} − ω⁰_{3L}**；bilal-2008 (12.14) 是 **H = dB − Q₃^{YM} + β̃ Q₃^{L}**，
  **两个 CS 项整体反号**。**β̃ = 1 已由 lead 逐页核实**（Bilal p.102 逐字）。
  ⇒ **两家由场重定义 (B, H) ↦ (−B, −H) 相联**：把该重定义作用在 GS (4) 上逐项得
  H = dB − ω⁰_{3Y} + ω⁰_{3L}，正是 β̃ = 1 时的 Bilal (12.14)。
  ⇒ **「谁对」是伪问题，两家一致**；**物理不变量是两个 CS 项的相对符号**（YM 与 L 相反）。
  ⇒ **polchinski-1998-v2 (12.2.22) 给出独立佐证**：一本主流教科书干脆用两个待定常数 c、c′，
  拒绝固定整体符号（抽取记录 E16 第 4 点）。
  ⚠ 但**混用两套写法仍会出错**：δB 的符号（(9c)）与 consistency.gs-counterterms-1984 里 B 的系数
  是绑在一起的，凡从现代文献（或从"常识"）抄 δB、抄反项符号进入本图的，必须先做整体符号换算。
  ★ **本卡采用 GS 原文的写法**，Bilal 与 Polchinski 只作对照来源。
  另：本卡 (4) 首项下标的读图确认过程见抽取记录 §3.3（判定为 ω⁰_{3Y}，依据是紧随其后的正文）。

  【2b. ★ 洛伦兹 Chern–Simons 项 −ω⁰_{3L} 的归属】那个负号
  **不在 Zumino**（Les Houches 讲义全文只做内部对称群，L1 通读确认）、
  **不在 alvarez-gaume-witten-1984**（AGW 全文没有下降方程）、
  **不在 GS ref. [7]**（GS 逐字见 statement 的「归属」段）
  ⇒ **它是 green-schwarz-1984 自己的约定选择**，与 (9c) 的 +tr(ω dΘ) 联合固定。
  抽取记录 literature/extractions/zumino-wu-zee-1984.md Q-Z2。

  【3. 玻色作用量 (1) 未建卡】GS (1) 的 S₀（含 φ^{-2}H² 项）仍未建节点。
  它在树图机制里被用到（B 传播子连接 B tr F⁴ 顶点与 H² 里的 ω⁰_{3Y} dB 顶点）。
  若后续要把那条树级机制写成节点，须先补 S₀ 的定义卡，来源同为 GS (1) + bergshoeff-1982。
