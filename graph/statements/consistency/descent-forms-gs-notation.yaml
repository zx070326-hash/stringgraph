id: consistency.descent-forms-gs-notation
kind: definition
status: physical-argument
title: Green–Schwarz 1984 标号下的下降形式 ω⁰_{2n+1 Y}、ω¹_{2n Y} 与洛伦兹一路 ω⁰_{2n+1 L}、ω¹_{2n L}
statement: |
  本卡把 math.chern-simons-descent-equations 特化到 green-schwarz-1984 的标号与迹约定
  （conv.gauge-trace-normalization；楔号省略），并补上 GS 使用而本图数学卡不涵盖的**引力/洛伦兹一路**。

  **(1) Yang–Mills 一路（GS 标号）**

      d ω⁰_{2n+1 Y} = tr F^{n+1}                                              (GS (15))
      δ ω⁰_{2n+1 Y} = − d ω¹_{2n Y}                                           (GS (16))

  两族形式**只定到相差一个恰当形式**（GS (15) 前逐字：「where ω⁰_{2n+1 Y} is defined (up to an exact
  form) by」）。n = 1 的标准取法由 GS 显式给出：

      ω⁰_{3Y} = tr(A F − ⅓ A³),      d ω⁰_{3Y} = tr F²                        (GS (5)(6))

  n = 3 给出 consistency.gs-counterterms-1984 里 S₁、S₃ 用到的 ω⁰_{7Y}；反常写成 ∫ω¹_{2n} 的形式
  （例如 GS (17) 的 G 里出现 ω¹_{2Y}、ω¹_{6Y}）。

  ★ **标号换算**：GS 的 n 与 math.chern-simons-descent-equations 的 n 差 1，

      **n_Zumino = n_GS + 1**

  即 GS 的 ω⁰_{3Y} = 数学卡 n = 2 的 ω⁰_3，GS 的 ω⁰_{7Y} = 数学卡 n = 4 的 ω⁰_7，
  GS 的 ω¹_{2n Y} = 数学卡的 ω¹_{2n}（下标不变）。**符号与系数在换标后逐项相同**，见 notes 第 1 条。

  **(2) 洛伦兹一路（GS 记号 L）**

  把 (A, F) 换成十维切空间代数 SO(9,1) 的 10 × 10 自旋联络与曲率 (ω, R)（R = dω + ω²）、下标 Y 换成 L，
  记号与关系相同：

      ω⁰_{3L} = tr(ω R − ⅓ ω³),      d ω⁰_{3L} = tr R²                        (GS (7)(8))

  S₂、S₃ 与引力反常一路用到 ω⁰_{7L}、ω¹_{10L}。

  ★ **本卡对 (2) 的证据分层（必须随本卡搬运）**：
    · **n = 1 的两式 (GS (7)(8)) 是 GS 原文逐字给出的**（L1）。
    · **一般 n 的洛伦兹侧（ω⁰_{7L}、ω¹_{10L} 等）在 GS 原文里只被使用、从未被定义**；本图把它们理解为
      「在 (1) 的一般公式里作代换 A → ω、F → R」。**GS 原文没有陈述这个代换**——这是本项目的推断。
    · **该代换在 Zumino 一侧没有任何支撑**：math.chern-simons-descent-equations 的主来源
      zumino-1983-les-houches 全文只处理内部对称群，**没有自旋联络 ω、没有 R、没有 tr R²、没有 ω⁰_{3L}**
      （L1 全文 46 页通读确认）。⇒ **凡涉及洛伦兹一路的边一律标 `inferred: true`，且不得列 zumino-* 为来源。**

  **本卡不含**

  (a) ω⁰_{2n+1}、ω¹_{2n} 的一般显式表达式（n ≥ 2）：GS 逐字把它们外包给 ref. [9]
      = zumino-wu-zee-1984（**本项目正文未取得**）。本图掌握的显式代表元来自
      math.chern-simons-descent-equations（Yang–Mills 侧，且只有该卡列出的几个特例）。
  (b) 任何绝对归一化（无 i、2π 因子）；GS 的常数 c 见 consistency.gs-counterterms-1984。
  (c) 「ω¹_{2n} 就是相容反常」这条识别——见 consistency.descent-omega1-is-consistent-anomaly。
  (d) 全局性：数学卡的唯一已核实来源逐字声明这类等式「really valid only locally」；
      **GS 直接在整个十维时空上使用它们，本图对此没有来源**（见 notes 第 3 条）。
