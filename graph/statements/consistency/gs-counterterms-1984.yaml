id: consistency.gs-counterterms-1984
kind: definition
status: physical-argument
title: Green–Schwarz 1984 的三段局域反项 S₁、S₂、S₃（及 E₈ × E₈ 版 S′₁、S′₃）
statement: |
  Green–Schwarz 1984 加到十维有效作用量上的局域反项，**原文分三段给出**
  （记号见 conv.gauge-trace-normalization、consistency.h-field-strength-chern-simons、
  consistency.descent-forms-chern-simons；楔号省略，积分是十维积分）。
  **c 是一个数值常数，GS 逐字说它「可以从 refs. [3, 9] 推出」，本文没有算出它。**

  **SO(32)**：

      S₁ = c ∫ ( B tr F⁴ + ⅔ ω⁰_{3Y} ω⁰_{7Y} )                                              (18)

      S₂ = − c ∫ ( (1/32) B (tr R²)² + ⅛ B tr R⁴ + (1/12) ω⁰_{3L} ω⁰_{7L} )                   (21)

      S₃ = c ∫ ( ⅛ B tr R² tr F²
                 + (1/48) ω⁰_{3L} ω⁰_{3Y} tr R²
                 − (1/24) ω⁰_{3Y} ω⁰_{3L} tr F²
                 − ⅔ ω⁰_{3L} ω⁰_{7Y}
                 + (1/12) ω⁰_{3Y} ω⁰_{7L} )                                                    (23)

  **E₈ × E₈**（S₂ 与 SO(32) 情形**相同**，因为它不含规范场）：

      S′₁ = (c/108000) ∫ { 30 B [ (tr₁F²)² + (tr₂F²)² − tr₁F² tr₂F² ]
                            − ω⁰_{3Y₁} ω⁰_{3Y₂} ( tr₁F² − tr₂F² ) }                            (18′)

      S′₃ = (c/7200) ∫ ( 30 B tr R² tr₁F²
                         + 5 ω⁰_{3L} ω⁰_{3Y₁} tr R²
                         + 20 ω⁰_{3Y₁} ω⁰_{7L}
                         + ω⁰_{3Y₁} ω⁰_{3L} tr₁F²
                         + ω⁰_{3L} ω⁰_{3Y₁} tr₂F² ) + (1 ↔ 2)                                  (23′)

  下标 1、2 指两个 E₈ 因子。

  **本卡不含**：
  (a) 这些反项**确实抵消反常**这一断言——那是 consistency.anomaly-cancellation-so32-effective-theory
      与 consistency.anomaly-cancellation-e8e8-effective-theory；
  (b) 常数 c 的值；
  (c) 后世的 ∫B ∧ X₈ 打包写法（见 notes 第 1 条）。
