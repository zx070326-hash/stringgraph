    note: |
      **L1 逐页读图**（抽取记录 literature/extractions/zumino-wu-zee-1984.md E14/E15）。
      = green-schwarz-1984 的 ref. [10] 的第一项，与 ref. [9]（= zumino-wu-zee-1984）同作者、同期、互引。
      ★ **只承载「c 的另一半在哪一节」这条归属，不承载任何数值**：
      (5.13) 是 **2n−2 维通式**、**不含引力侧**，且读图不可靠（(4π)^{n−1} 的底数与指数）
      + 原文自注「(up to a sign)」，抽取记录 §3.2 判定**不得作为定量来源入图**。见 notes 第 6 条。
