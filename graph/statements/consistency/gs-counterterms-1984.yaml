      注意 (23′) 最后两项的 ω 次序相反，见 notes 第 2 条。
  - ref: alvarez-gaume-witten-1984
    loc: "eq. (63)（GS ref. [3]；GS 把常数 c 与各反常之间的相对归一化都指向这里）；(114) 逐字「apart from a factor common to the three cases」"
    note: |
      **状态更正（2026-09-11）：本文全文已取得（L1，62 页逐页读图，
      literature/extractions/alvarez-gaume-witten-1984.md）**；旧 note 写的「未取得全文（L0）」已过时。
      ★ **更正后的结论比原先更强，不是更弱**：AGW **确实不含常数 c**——AGW 全文**从不固定整体归一**，
      (114) 逐字「apart from a factor common to the three cases」，只给**相对**归一（该抽取记录 Q-A1）。
      ⇒ 「c 未定」的原因由「本项目没读到」变成「**这篇文献里就没有这个数**」。
  - ref: zumino-1983-les-houches
