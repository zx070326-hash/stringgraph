id: consistency.descent-omega1-is-consistent-anomaly
kind: proposition
title: 下降链的 ω¹_{2n−2} 满足 Wess–Zumino 相容条件，是 2n−2 维非阿贝尔手征反常的一个解
statement: |
  记号与 math.chern-simons-descent-equations 相同（conv.gauge-trace-normalization；楔号省略）。

  **(1) 物理侧的设定**

  设 W[A] 是手征费米子在外规范场 A 中的有效作用量（**假定它经适当重整化后存在**）。设

      X_i(x) = − ∂_μ δ/δA^i_μ − (A_μ × δ/δA_μ)_i,      [X_i(x), X_j(y)] = f_{ij}^k X_k(x) δ(x − y)

  是规范变换的泛函生成元，反常定义为 G_i[A](x) := X_i(x) W[A]（G_i = 0 即对应流守恒）。
  由 W[A] 的**存在性**本身推出 **Wess–Zumino 相容条件**

      **X_i(x) G_j(y) − X_j(y) G_i(x) = f_{ij}^k G_k(x) δ(x − y).**

  引入反交换标量（Faddeev–Popov 鬼场）v_i(x)，记 v·G := Σ_i ∫dx v_i(x) G_i(x)，则相容条件等价于

      v·X (v·G) − ½ (v × v)·G = 0，  即   **δ (v·G) = 0**,
      其中 δA_μ = v·X A_μ,   δv_i = − ½ (v × v)_i,   δ² = 0.

  **(2) 与下降方程的认同（本卡的核心断言）**

  上式的 δ（BRS 算子）与 math.chern-simons-descent-equations (iii) 里沿群参数方向的 δ 是**同一个算子**：
  两者在 𝒜、v 上的作用律逐字相同，

      δ𝒜 = − dv − v𝒜 − 𝒜v ≡ − Dv,     δv = − v².

  在这一认同下，下降链的第二项 ω¹_{2n−2}（ω⁰_{2n−1}(𝒜 + v, ℱ) 按 v 展开的**一次幂**项）满足

      **δ ω¹_{2n−2} = − d ω²_{2n−3}**,

  故 δ ∫ ω¹_{2n−2} = 0（在可略去边界项的意义下）：**ω¹_{2n−2} 对 v 是线性的且满足相容条件**，
  因而给出 2n−2 维非阿贝尔手征规范反常的**一个**解。

  显式特例（未归一）：
      n = 2（2 维）:  ω¹_2 = Tr(v dA)
      n = 3（4 维）:  ω¹_4 = Tr(v d(A dA + ½ A³))

  **(3) 反常的定义（来源自陈，随卡搬运）**

  来源逐字把「反常」定义为：相容条件的**任一不是基本场 (φ, A_μ) 的局域泛函之变分**的解
  （「any solution of (4.4) which is not a variation of a local functional in the basic fields
  (φ, A_μ) we regard as anomaly」）。

  **本卡不含**

  (a) ★ **唯一性**。来源 p.29 逐字：「**The problem of finding the most general solution of the
      consistency condition will not be discussed here.**」⇒ 本卡只断言 ω¹ 是**一个**解，
      **不**断言它是最一般解，**不**断言相容条件在恰当形式外唯一确定反常。
      特别地，green-schwarz-1984 (11) 前那句「The anomalies corresponding to diagrams with more than
      six external lines are **uniquely determined** by the hexagon diagrams. Their form can be deduced
      by implementing the Wess–Zumino consistency conditions」**在 Zumino 一侧没有支撑**；
      唯一性（相容反常的上同调分类）属 manes-stora-zumino-1985 一线，本项目未取得该文。
  (b) ★ **绝对归一化**。来源 §5 给出的 (5.13) 是把 ω¹_{2n−2} 归一到指标定理的唯一式子，但
      (i) 读图不可靠（(4π)^{n−1} 的底数与指数），(ii) 原文在该式上方**手写插注「(up to a sign)」**。
      ⇒ 本卡的 ω¹ **未归一**。
  (c) **与一圈微扰论结果的定量一致**。来源自称 n = 3 时 (5.13) 配 (3.38) 「agrees with」它引自
      Adler / Bardeen / Becchi 的一圈结果 (2.9)，且 (3.38)「agrees with」(2.16)。
      **本项目两处都未复算**（需先固定形式↔散度字典与 λ 的厄米/反厄米换算）。
  (d) **ω¹ 确实不是局域泛函的变分**这一点（即按 (3) 的定义它确实是反常而非平凡项）：
      本图未验证，来源也未给一般证明。
  (e) **引力/洛伦兹反常**：来源全文只处理内部对称群。
  (f) **十维与 GS 机制**：本卡是任意 2n−2 维的一般陈述，不承载 d = 10 的任何系数。
