tags: [anomaly, wess-zumino-consistency, brs, descent-equations, chern-simons]
notes: |
  【1. 本卡为什么与 math.chern-simons-descent-equations 分开】前者是定理（纯微分几何），
  本卡是**物理识别**：把群参数方向的一形式 v 认同为 Faddeev–Popov 鬼场、把 δ 认同为 BRS 算子、
  把 ∫ω¹ 认同为有效作用量的规范变分。这一步依赖 W[A] 的存在（来源逐字「which we suppose to be
  obtained by appropriate renormalization」），不是微分几何内容。
  抽取记录 §5.2 的原话：「**不要**把这两条合成一张卡——前者是定理，后者是物理识别。
  这是本轮最重要的一条结构建议。」

  【2. 与 GS 1984 的关系】green-schwarz-1984 把十维反常写成 ∫ω¹_{10} 的形式并据此构造反项，
  用的正是本卡这条识别；但 GS 只引不复述（(11) 上一段逐字「Their form can be deduced by
  implementing the Wess–Zumino consistency conditions [8]」，「The analysis of ref. [9] relates the
  anomalies to a formal expression in twelve dimensions」）。
  ⇒ **GS 那一步依赖的唯一性，本卡明确不提供**（见「本卡不含 (a)」）。

  【3. 本卡与 consistency.anomaly-twelve-form-d10 的分工】那张卡是十维、GS 记号、含十二形式编码；
  本卡是任意 2n−2 维、Zumino 记号、只到「ω¹ 是相容条件的一个解」为止，**不含任何十维系数**。
  两卡都不承载唯一性。
