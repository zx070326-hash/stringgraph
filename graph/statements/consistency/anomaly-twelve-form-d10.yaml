id: consistency.anomaly-twelve-form-d10
kind: definition
status: physical-argument
title: 十维手征理论反常的十二形式编码：Ω_{4n} := Tr F^{2n}（GS 1984 的记号，非 B∧X₈ 写法）
statement: |
  **场论设定**：十维 N = 1 超引力与超 Yang–Mills 的耦合理论。手征费米子含量为
  超引力部分的一个左手 spin-3/2 引力微子与一个右手 spin-1/2 场，加上物质部分的
  n 个左手 spin-1/2 场（n = 规范群维数，因为无质量费米子在伴随表示）。

  **反常的十二形式编码**（GS 1984 §「Anomalies…」一段的做法）：
  · 十维中的反常来自有**六条或更多外线**、圈上跑手征场的图；
    外线多于六条的反常由六边形图**唯一决定**，其形式可由 Wess–Zumino 相容条件定出。
  · 按 Zumino–Wu–Zee 的分析，反常与一个形式上的**十二维规范不变十二形式**相联系。
    纯规范部分记

        **Ω_{4n} := Tr F^{2n}**    (n = 1, 2, 3)

    即 Ω₄ = Tr F²、Ω₈ = Tr F⁴、Ω₁₂ = Tr F⁶，其中 Tr 是**伴随**表示的迹
    （conv.gauge-trace-normalization；关于原文 (11) 印作小写 tr 的读图存疑见 notes 第 1 条）。
    「十二形式」指 Ω₁₂ 这一层——它是 D = 10 中六边形反常对应的那一层。
  · 由十二形式回到十维的反常，走 consistency.descent-forms-gs-notation 的下降方程：
    Ω_{12} ⇝ ω⁰_{11} ⇝ ω¹_{10}，反常写成 ∫ω¹_{10}。

  **本卡不含**：
  (a) 任何**数值总归一化**（GS 把常数 c 与各反常之间的相对归一化外包给 Alvarez-Gaumé–Witten）；
  (b) 引力部分与混合部分的十二形式（分别见 consistency.gravitational-anomaly-polynomial-d10
      与 consistency.anomaly-cancellation-so32-effective-theory 里引用的 (22)）；
  (c) 后世的 X₈ / ∫B ∧ X₈ 打包写法——**那不是 GS 1984 的记号**（见 consistency.gs-counterterms-1984 notes）；
  (d) 「Ω_{4n} 用基本迹的表达式」——那是纯代数命题
      math.so-usp-adjoint-fundamental-trace-identities 与 math.e8-adjoint-trace-identities，
      与本卡的物理内容分开记账。
superseded_by: consistency.anomaly-twelve-form-d10-v2
uses:
