id: spectrum.open-closed-four-point-relation-weak
kind: proposition
title: （弱形式，表达式有争议）闭弦四 tachyon 振幅分解为两个开弦四点振幅之积（α' → α'/4）乘三角因子
statement: |
  闭弦四 tachyon 树振幅（spectrum.virasoro-shapiro-amplitude）可以写成**两个开弦四 tachyon
  振幅之积**（每个开弦振幅的 Regge 斜率取 α'/4 而非 α'）乘上一个三角函数因子。
  这是 KLT（Kawai–Lewellen–Tye）型关系在树级四点的最简形式：**闭弦 ≈ 两个开弦**。

  ⚠⚠⚠ **本卡片是弱形式**：本图断言的只有「分解为两个开弦四点振幅之积（α' → α'/4）
  乘一个三角因子」这个结构。显式表达式（三角因子是哪一个、比例常数、是否取复共轭）
  有三处已登记的争议，**不入陈述**，只记在 notes。

  **本命题不断言什么**：不断言这是原书 (6.6.23) 的逐字形式；不断言一般 n 点的 KLT 关系；
  不给出「α'_closed = α'_open/4」的独立论证。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
sources:
  - ref: polchinski-1998-v1
    loc: "§6.6, p.195：eq. (6.6.23)（开/闭弦四点关系；第二个 A_o 带复共轭）；(6.6.21)（J(s,t,u,α') = −2 sin πα_c(t) I(s,t,4α') I(t,u,4α')）；(6.6.22)（一般复积分 = 2 sin[π(b+n₂)] B B）"
    note: |
      literature/extractions/polchinski-1998-v1.md#E108，**等级已由 §12.8（原书核实，2026-09-11）
      从「L1（[S] 的推导）/ 表达式 L0」升为「L1（结构，原书 p.195 逐字）/
      L1-读图存疑（数值前因子）」**。原书 p.195 逐字：
        A_c(s,t,u,α',g_c) = (πi g_c²α'/(4 g_o⁴)) sin[πα_c(t)]
                              A_o(s,t,¼α',g_o) A_o(t,u,¼α',g_o)^*   （(6.6.23)）
      其后一句「where the open string amplitudes include just one of the six cyclic permutations,
      with poles in the indicated channels」。
      **三条裁定（详见 notes）**：
      (1) **sin[πα_c(t)] 确实在原书 (6.6.23) 里**，[S] 的 [6.272] 漏掉了它——researcher 的复算正确；
          配套的 (6.6.21) 也确实含 sin πα_c(t)。
      (2) **第二个 A_o 确实带复共轭**——[S] 与原书的分歧**裁定为「原书有共轭」**，
          本卡片原来跟随 [S] 的「不带共轭」写法已被推翻。
      (3) ⚠ **数值前因子 πi g_c²α'/(4 g_o⁴) 是页图判读，标 L1-读图存疑**：
          量纲自洽（A_c ∼ g_c²、A_o·A_o ∼ g_o⁴），但 **「4」与 g_o 的幂次分辨率有限**，
          抽取记录要求「curator 引用前请重新读一次原书 p.195」。
          **本图的弱陈述不使用这个前因子，故不受该存疑影响。**
      旧记录的指示作为历史保留：「**这是本章最不确定的一条，三处问题都出在 [S] 身上**
      （笔记 p.339）」；「**curator 不得把 (6.6.23) 的显式表达式写进图节点，除非核对原书。**
      可先建一个只说『闭弦树级四点振幅分解为两个开弦四点振幅之积（α' → α'/4）乘一个三角因子』
      的弱陈述。」——该核对已于 2026-09-11 完成，但 **本轮按任务书只改 sources/notes，不换代**。
      见 **Q16**（结构与共轭已关闭；数值前因子仍开着）。
  - ref: schrans-2020
    loc: "§6.71 附近（笔记 p.339）：[6.270]（带 sin）与 [6.272]（不带 sin）两式（核对源）"
    note: |
      ⚠ **这是 [S] 自己两行之间的不一致**：[6.270] 写
      A_c = −(16πig_c²/α') sin(πα_c(t)) I(s,t;g_o;α'/4) I(t,u;g_o;α'/4)，
      [6.272] 却给出 A_c = (πig_c²α'/g_o⁴)A_o(s,t;α'/4,g_o)A_o(t,u;α'/4,g_o)，**不带 sin**。
      **原书核实裁定（2026-09-11，抽取记录 §12.8）**：原书 (6.6.23) **带 sin[πα_c(t)]**，
      故 [6.272] 漏掉了 sin；且原书的数值前因子是 πi g_c²α'/(**4** g_o⁴)，
      比 [6.272] 多一个 1/4（该 1/4 属 L1-读图存疑）；第二个 A_o 带复共轭。
tags: [spectrum, tree-level, klt, open-closed, four-point, weak-form, disputed, errata-dependent]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E108 建立，**按任务书与抽取记录的明确要求只建弱形式**。

  **显式形式（不入陈述；2026-09-11 按 reviewer-ch6 移到 notes，同日按 §12.8 原书核实重写）**：
  原书 p.195 逐字的 (6.6.23) 是
    A_c(s,t,u,α',g_c) = ( πi g_c² α' / (4 g_o⁴) ) · sin[ π α_c(t) ]
                          · A_o( s, t, ¼α', g_o ) · A_o( t, u, ¼α', g_o )^*   （共轭），
  其中开弦振幅只取六个循环置换中的一个（极点在指定通道）。
  → 与本卡片原先记的 researcher 复算形式相比：**sin 因子在原书里确实有**（researcher 对），
  **比例常数多一个 1/4**（原书 πig_c²α'/(4g_o⁴)，非 πig_c²α'/g_o⁴），
  **第二个 A_o 带复共轭**（[S] 错）。
  ⚠ 数值前因子的 **「4」与 g_o 幂次是页图判读（L1-读图存疑）**，引用前应重读原书 p.195。
  本卡片的陈述（弱形式）**不使用上式的系数、相位与共轭**，故不受影响。

  **⚠ 三条争议如实登记（本卡片的核心内容）**：

  1. **已裁定（2026-09-11，原书 p.195）：`sin(πα_c(t))` 在原书里确实有。**
     旧情形：[S] 的 [6.270] 带 sin，[6.272] 不带；
     抽取者（researcher）按 (α'/(4ig_o²))² = −α'²/(16g_o⁴) 复算，判定 [6.272] 漏掉了 sin。
     **§12.8 的原书逐字确认 researcher 对**：(6.6.23) 带 sin[πα_c(t)]，
     且配套的 (6.6.21) J = −2 sin πα_c(t) I(s,t,4α') I(t,u,4α') 也确实含 sin。
     ⚠ 但 researcher 复算的**比例常数 πig_c²α'/g_o⁴ 与原书的 πig_c²α'/(4g_o⁴) 差一个 1/4**，
     这一差异尚未裁定（原书侧的「4」本身是读图存疑项）。

  2. **已裁定（2026-09-11，原书 p.195）：第二个 A_o 确实带复共轭。** [S] 逐字：
     「**I am not sure why the second A_o is conjugated in Joe's book.** As I(x,y) is manifestly
     positive, this would just change a sign, which is not needed. It may be due to
     **his sign error just below (6.6.21)**.」
     即：**原书写的是共轭，[S] 认为不需要共轭**。本卡片原先的写法（不带共轭）**跟随 [S]**。
     **§12.8 逐字读到原书 (6.6.23) 的 A_o(t,u,¼α',g_o) 带上标星号，分歧裁定为「原书有共轭」。**
     → 本卡片 notes 里的显式形式已改成带共轭的原书形式；
     statement（弱形式）不涉共轭，因此**不需换代**。
     ⚠ **[S] 说「只是改一个符号，不需要」的理由仍未被证实或反驳**：
     §12.8 只确认了原书写什么，没有核对「(6.6.21) 下方是否真有符号错」。

  3. **第五处勘误/疑误依赖（部分缩小）**：[S] 提到「his sign error just below (6.6.21)」，
     但**没说这条在不在官方勘误表上**；**Polchinski 官方勘误表本项目仍未取得**（Q14）。
     但按抽取记录 **Q24（2026-09-11）**：§12.8 读的原书是 **Cambridge Books Online
     2005 平装数字化本（已含 2000 年 corrections）**，所以上文引的 (6.6.23) 逐字形式
     已经是**更正后的文本**。这意味着：若 [S] 指的符号错已在勘误表上，它已被修正；
     若没在，则 (6.6.23) 的共轭就是作者本意。**两者本图无法分辨，仍记在案。**

  **对下游的要求**：任何引用本卡片的节点只能用「结构」这一层（分解为两个开弦振幅之积、
  α' → α'/4、带一个三角因子），**不得**使用上式的系数或相位。

  **升级路径（须新建节点）——结构与共轭已备，数值前因子尚缺**：
  (6.6.23) 的结构（sin 与共轭）已于 2026-09-11 由抽取记录 §12.8 原书核实；
  但数值前因子 πig_c²α'/(4g_o⁴) 仍是 **L1-读图存疑**（「4」与 g_o 幂次）。
  故建议：先由 researcher 重读原书 p.195 确认前因子，**再**新建
  spectrum.open-closed-four-point-relation（完整形式）并给本卡写 superseded_by。
  本轮（curator-ch6-locs）按任务书**只改 sources/notes，不换代**；
  按 graph/CLAUDE.md 不得直接修改本卡的 statement。

  **一处参数记号张力值得下游注意（curator 观察，不入陈述）**：
  原书 (6.6.21) 写的是 I(s,t,**4α'**)，而 (6.6.23) 写的是 A_o(s,t,**¼α'**,g_o)；
  两处的第三个参数一个是 4α' 一个是 ¼α'，**看似互为倒数**。
  原书 p.195 上文的口径是「if one sets α' = 2 in the closed string and α' = ½ in the
  open string」，即开弦有效斜率是闭弦的 1/4，与 (6.6.23) 的 ¼α' 一致。
  **(6.6.21) 的 4α' 属于读图差异或原书在那一行的另一套参数约定，本图未裁定**；
  任何要直接引用 (6.6.21) 的下游节点必须先清这一点。本卡片不依赖 (6.6.21)。
