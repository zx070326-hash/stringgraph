notes: |
  由 curator 于 2026-09-11 从抽取记录 E108 建立，**按任务书与抽取记录的明确要求只建弱形式**。

  ⚠ **本卡片已于 2026-09-11 换代**（superseded_by: spectrum.open-closed-four-point-relation）。
  下面的「显式形式」曾按本卡片的弱陈述被排除在 statement 之外，现在它已经是**新卡片的正式陈述**；
  需要显式表达式的下游请直接引用新卡片，不要引用本卡片的 notes。

  **显式形式（不入本卡陈述；2026-09-11 按 reviewer-ch6 移到 notes，同日按 §12.8 原书核实重写）**：
  原书 p.195 逐字的 (6.6.23) 是
    A_c(s,t,u,α',g_c) = ( πi g_c² α' / (4 g_o⁴) ) · sin[ π α_c(t) ]
                          · A_o( s, t, ¼α', g_o ) · A_o( t, u, ¼α', g_o )^*   （共轭），
  其中开弦振幅只取六个循环置换中的一个（极点在指定通道）。
  → 与本卡片原先记的 researcher 复算形式相比：**sin 因子在原书里确实有**（researcher 对），
  **比例常数多一个 1/4**（原书 πig_c²α'/(4g_o⁴)，非 πig_c²α'/g_o⁴），
  **第二个 A_o 带复共轭**（[S] 错）。
  ⚠ 旧文「数值前因子的『4』与 g_o 幂次是页图判读（L1-读图存疑），引用前应重读原书 p.195」
  **已于 2026-09-11 由 §14.3 关闭**：p.195 两次独立渲染（单页 + 双页）字形一致，
  `g_o` 幂次是 4、`α'` 幂次是 1；且抽取者由 (6.6.4)+(6.6.8)+(6.4.23)+(6.6.22) 的复算
  独立复现了 1/4。**存疑撤销，升为 L1。**
  ⚠ 排版订正：原书**不是**写成单一分式 `πig_c²α'/(4g_o⁴)`，而是**分式 `πig_c²α'/g_o⁴`
  后跟一个独立的小分式 `¼`**；两种排版同值，「逐字形式」应按后者记。
  本卡片的陈述（弱形式）**不使用上式的系数、相位与共轭**，故不受影响。

  **⚠ 三条争议如实登记（本卡片的核心内容）**：

  1. **已裁定（2026-09-11，原书 p.195）：`sin(πα_c(t))` 在原书里确实有。**
     旧情形：[S] 的 [6.270] 带 sin，[6.272] 不带；
     抽取者（researcher）按 (α'/(4ig_o²))² = −α'²/(16g_o⁴) 复算，判定 [6.272] 漏掉了 sin。
     **§12.8 的原书逐字确认 researcher 对**：(6.6.23) 带 sin[πα_c(t)]，
     且配套的 (6.6.21) J = −2 sin πα_c(t) I(s,t,4α') I(t,u,4α') 也确实含 sin。
     ⚠ **2026-09-11（§14.3）已裁定**：researcher 复算的 πig_c²α'/g_o⁴ 与原书的
     πig_c²α'/(4g_o⁴) 之差，**是 researcher 漏读了原书同一行里那个独立的 `¼`**
     （该行共出现三个 ¼，另两个在 A_o 的参数里）。原书侧的「4」不再是读图存疑项：
     p.195 两次独立渲染一致，且抽取者的自洽性复算独立复现了 1/4。**旧文「尚未裁定」作废。**

  2. **已裁定（2026-09-11，原书 p.195）：第二个 A_o 确实带复共轭。** [S] 逐字：
     「**I am not sure why the second A_o is conjugated in Joe's book.** As I(x,y) is manifestly
     positive, this would just change a sign, which is not needed. It may be due to
     **his sign error just below (6.6.21)**.」
     即：**原书写的是共轭，[S] 认为不需要共轭**。本卡片原先的写法（不带共轭）**跟随 [S]**。
     **§12.8 逐字读到原书 (6.6.23) 的 A_o(t,u,¼α',g_o) 带上标星号，分歧裁定为「原书有共轭」。**
     → 本卡片 notes 里的显式形式已改成带共轭的原书形式；
     statement（弱形式）不涉共轭，因此**不需换代**。
     ⚠ **[S] 说「只是改一个符号，不需要」的理由仍未被证实或反驳**：
     §12.8 只确认了原书写什么，没有核对「(6.6.21) 下方是否真有符号错」。

  3. **第五处勘误/疑误依赖（部分缩小）**：[S] 提到「his sign error just below (6.6.21)」，
     但**没说这条在不在官方勘误表上**；**Polchinski 官方勘误表本项目仍未取得**（Q14）。
     但按抽取记录 **Q24（2026-09-11）**：§12.8 读的原书是 **Cambridge Books Online
     2005 平装数字化本（已含 2000 年 corrections）**，所以上文引的 (6.6.23) 逐字形式
     已经是**更正后的文本**。这意味着：若 [S] 指的符号错已在勘误表上，它已被修正；
     若没在，则 (6.6.23) 的共轭就是作者本意。**两者本图无法分辨，仍记在案。**

  **对下游的要求**：任何引用本卡片的节点只能用「结构」这一层（分解为两个开弦振幅之积、
  α' → α'/4、带一个三角因子），**不得**使用上式的系数或相位。

  **升级路径——已于 2026-09-11 走完（curator-ch6-sec14）**：
  (6.6.23) 的结构（sin 与共轭）由抽取记录 §12.8 原书核实；数值前因子 πig_c²α'/(4g_o⁴)
  由 **§14.3**（p.195 两次独立渲染 + 抽取者复算）从「L1-读图存疑」升为 **L1**，
  「4」与 g_o 幂次的存疑已撤销。
  **完整形式的新卡 spectrum.open-closed-four-point-relation 已建立，本卡已写 superseded_by 指向它。**
  推导 spectrum.open-closed-four-point-relation-weak--via-gamma-reflection 已 `git mv` 改名为
  spectrum.open-closed-four-point-relation--via-gamma-reflection 并改指新陈述，
  故**本卡片现在没有自己的推导**——这是 docs/STATUS_LEVELS.md「旧推导的去留」
  （lead 2026-09-11 裁决）规定的换代方式。本卡片保留作为历史记录，statement 文本不再改动。

  **一处参数记号张力——2026-09-11 已收敛（§14.3(b)）**：
  旧文（作废）：「(6.6.21) 的 4α' 属于读图差异或原书在那一行的另一套参数约定，**本图未裁定**」。
  **现在的结论**：原书 (6.6.21) 印的确实是 `4α'`（**两次独立渲染一致**，且与同页 (6.6.23)
  的 `¼α'` 字形在同一页同一字体下可区分）；但由 (6.6.5)+(6.6.22)+(6.4.20) 复算、
  同页「α' = 2 in the closed / α' = ½ in the open」一句、以及 (6.6.23) 自己用的 `¼α'`
  三条，**正确值必须是 `¼α'`**。⇒ **本图判定 (6.6.21) 的印刷文本不可直接引用。**
  本卡片与换代后的 spectrum.open-closed-four-point-relation 都不依赖 (6.6.21)。
  ⚠ **Q28（新，§14.4 E）开着**：这是原印误、还是官方勘误表已收录而 2005 数字化本漏改？
  **勘误表本项目仍未取得**（Q14），本图无法判定。
