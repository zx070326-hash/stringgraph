notes: |
  由 curator 于 2026-09-11 从抽取记录 E92 建立（Polchinski 第 6 章批次）。

  **⚠ 上游 ch5 节点尚未进入 main**：本卡片的前提「S-矩阵 = 规范固定的世界面路径积分 (5.3.9)」
  与「χ > 0 时 μ = 0」属第 5 章（抽取记录 E77/E80），由另一名 curator 抽取，本批次提交时
  还没有节点。按与 E49 相同的处理：前提写进 statement 作假设，推导 gaps 里注明
  **待 ch5 节点合入后补边**。

  **status 上限**：振幅与期望值是**路径积分定义**的对象，世界面路径积分测度（以及对拓扑求和）
  在本图与来源中都没有定义，故本卡片及其一切下游的 status 上限是 physical-argument。
  这条限制在本批次的每个 spectrum.* 节点重复出现，不再逐条解释。
