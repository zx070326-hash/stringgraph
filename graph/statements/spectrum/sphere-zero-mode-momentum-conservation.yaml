    note: |
      literature/extractions/polchinski-1998-v1.md#E92，等级 **L1**（schrans-2020 §6.10–§6.11，
      笔记 p.284–285，逐页读到并逐步复现）。
      ⚠ 抽取记录把零模积分写成「δ^d(X₀ Σk_i) = X₀^{−d} δ^d(Σk_i)」，其中 X₀ 是零模的归一化常数；
      本卡片按标准写法写成 ∫d^d x₀ e^{i x₀·Σk} = (2π)^d δ^d(Σk) 并把归一化常数并入 C^X_{S₂}，
      **这一改写是 curator 做的**，与来源等价但措辞不同。原书未核对。
