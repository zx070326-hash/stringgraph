id: spectrum.sphere-zero-mode-momentum-conservation
kind: proposition
title: X 的常数零模积分给出动量守恒 delta 函数 (2π)^d δ^d(Σ_i k_i)
statement: |
  设 d 个自由标量 X^μ 在球面 S₂ 上按 worldsheet.free-scalar-cft-action 的欧氏作用量做路径积分
  （靶空间取 d 个非紧方向，度规 mostly-plus），插入 n 个指数型顶点算子 e^{i k_i · X(σ_i)}。
  把 X^μ 按 Laplace 算子 ∇² 的本征函数完备系展开，**本征值为零的模只有常数模** x₀^μ
  （S₂ 紧且无边界）。则：

  **(1)** 常数零模不出现在作用量中（作用量只含导数），只出现在插入的指数里，其积分给出
    ∫ d^d x₀  exp( i x₀ · Σ_i k_i )  =  (2π)^d δ^d( Σ_i k_i )，
  即**空间平移不变性 ⇒ 总动量守恒**。零模的归一化常数（本征函数的归一化）贡献一个
  与动量无关的整体因子，按 (6.2.14) 吸收进前因子 C^X_{S₂}。

  **(2)** 因此 S₂ 上任何一组指数型顶点算子的期望值，只要 Σ_i k_i ≠ 0 就恒为零。

  **前提（本图暂无节点，写作假设）**：弦 S-矩阵由第 5 章的规范固定路径积分 (5.3.9) 定义，
  X 部门与鬼场部门分离；见 notes。

  **本命题不断言什么**：不给出非零模的行列式（那是 (6.2.6) 的内容）；
  不给出 C^X_{S₂} 的数值；不涉及顶点算子的重整化（见
  spectrum.vertex-operator-geodesic-renormalization）。
uses_conventions:
