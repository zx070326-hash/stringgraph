id: spectrum.amplitude-poles-from-vertex-operator-ope
kind: proposition
title: 两个顶点算子的 OPE 决定振幅的极点：只有 z 与 z̄ 幂次相等的项在角向积分后存活
statement: |
  在闭弦四 tachyon 振幅的积分（spectrum.closed-string-four-tachyon-integral）中，
  把两个 tachyon 顶点算子作 OPE（(6.6.24)，实为把 (2.2.13) 的指数展开）：
    :e^{i k₁·X(z₁,z̄₁)}: :e^{i k₄·X(z₄,z̄₄)}:
      = |z₁₄|^{α' k₁·k₄} : ( 1 + i z₁₄ k₁·∂X + i z̄₁₄ k₁·∂̄X
          − z₁₄ z̄₁₄ (k₁·∂X)(k₁·∂̄X) + … ) e^{i(k₁+k₄)·X(z₄,z̄₄)} :。
  对 z₁₄ 作极坐标积分（z₁₄ = r e^{iθ}）。则：

  **(1)** **只有 z₁₄ 与 z̄₁₄ 幂次相等的项在 θ 积分后不为零**（其余项被 ∫dθ e^{i(n−n̄)θ} = 0 杀死）。
  这正是**能级匹配**（closed-string level matching）在振幅中的体现。

  **(2)** 存活的每一项给出一个径向积分 ∫₀ dr r^{α'k₁·k₄ + 2N + 1}，其端点发散
  （按解析延拓）给出一个**极点**，位置对应中间态上壳。首项（N = 0）给
    1 / ( α' k₁·k₄ + 2 )，
  即 **−u = (k₁ + k₄)² = 4/α'**（u 通道闭弦 tachyon 上壳）；s、t 通道同理。
  更高的 N 给出更高激发态的极点塔。

  **(3)（对图的意义）** 这条把「**OPE 的奇异幂次结构**」与「**振幅的物理极点**」直接连起来，
  是第 2 章 OPE 与第 6 章振幅之间的桥。

  ⚠ **本命题依赖 OPE 的收敛性**（本图未证；lead 裁决 2026-09-10：凡靠围道变形 + OPE 的推导
  一律 physical-argument，gaps 写明）。
