notes: |
  由 curator 于 2026-09-11 从抽取记录 E109 建立。

  **与既有节点的关系**：worldsheet.operator-product-expansion 给出 OPE 本身，
  worldsheet.closed-string-level-matching 给出谱上的 N = Ñ 条件；
  本卡片的 (1) 是后者在振幅积分中的**表现**，两者是不同层面的陈述，故分开建卡。
  ⚠ 本卡片**没有**建到 closed-string-level-matching 的依赖边：来源用的是「θ 积分把不匹配的项杀死」
  这一直接计算，不引用谱的能级匹配；把两者等同是本图的观察，写在 notes 而非边上。

  **与因子化节点的关系**：spectrum.four-tachyon-factorization-disk-normalization 从**端点发散**
  读出极点，本卡片从 **OPE 的幂次**读出同一批极点——是同一现象的两种看法。
  两者独立建卡是因为它们的论证路线与来源位置都不同（(6.4.11)/(6.4.13) vs (6.6.24)/(6.6.25)）。
