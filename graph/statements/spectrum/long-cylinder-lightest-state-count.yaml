tags: [spectrum, one-loop, closed-channel, long-cylinder, dedekind-eta, q-expansion, superstring, bosonic-string, type-i]
notes: |
  ★★★【本卡为什么存在（curator，2026-09-11，small-backlog-13）】
  本图此前有**三条 inferred 边**把 (10.8.4)/(10.8.11) 里的 16 挂到
  worldsheet.type-ii-massless-spectrum 上，理由是抽取记录 #E66 备注里那句
  「16 是十维无质量态计数」。三条推导的 note 与 gaps **各自写了同一句正解**，逐字：
    「⇒ 正解：为 (7.4.4)/(10.8.4) 的『长柱极限里最轻态的计数』单建一条卡（本图无），
      届时本边改指它并去掉 inferred。」
  （出处：superstring-cylinder-amplitude-closed-channel-v2--via-open-string-trace-doubling
   的 depends_on 与 gaps 第三条；superstring-klein-bottle-amplitude-closed-channel--via-…
   的 depends_on (b) 与 gaps 第六条；superstring-mobius-strip-amplitude-closed-channel--via-…
   的 gaps 第七条。）
  **本卡就是那条卡**，但**内容比那句正解更弱也更诚实**：它断言的是**常数项的数值**，
  **不**断言那个数是「最轻态的计数」。理由见「不断言 (a)」：原书四处都只印数字；
  而且把它读成态计数与本书自己的记账冲突（576 / 64）。
  ⇒ 三条边改指本卡后**都成为非 inferred**：常数项 16 是 (10.8.4)/(10.8.11)/(10.8.18)
  三式里**逐字印出**的东西，不是本图补的识别。

  ⚠⚠【关于本卡 id 里的 "lightest-state-count"（必须一起读）】
  该 id 由 lead 在派工单里指定，沿用的是上述三条 gap 的措辞。**本卡的断言里没有任何「计数」**；
  id 中的这个词是**历史命名**，与卡面内容不符的那一半已由「不断言 (a)」显式排除。
  按 graph/CLAUDE.md「id 一旦提交不得更改」，本卡不改 id，此处留记录。
  ⇒ 建议 lead：引用本卡时按 title 读，不要按 id 读。

  【与 spectrum.cylinder-closed-channel-open-closed-duality 的分工（**重要，别读成重复卡**）】
  那张卡的断言 (3) 已含**同一条**玻色弦展开式 η(is/π)^{−24} = exp(2s) + 24 + O(exp(−2s))，
  并在括注里写了「常数 24 是无质量闭弦态（左右各 24 个横向模在对角上的 24 个组合）」。
  两张卡的分工是：
    · 那张卡 = 玻色圆柱的**通道对偶**（模变换 + 换元 + 通道解释），24 只是其中一步的读数；
    · 本卡 = 把**常数项本身**做成一个可被上游引用的对象，并把**超弦的三处 16** 一并纳入，
      同时把「该数 = 态计数」这层释义**显式排除**。
  ⚠ **两张卡不冲突**：那张卡括注里的说法是「**对角上的** 24 个组合」，比「无质量态的个数」窄，
  与本卡「不断言 (a)」指出的 576 并不矛盾（576 是全部无质量闭弦态，24 是对角子集）。
  本卡不对那个说法表态，只是不把它写进自己的断言。
  ⇒ 若日后 reviewer 认为那张卡的括注也该移出断言，那是**那张卡的换代**，不由本卡承担。
  （已列入交 lead 的报告。）

  【超弦一侧的 16 是怎么来的（**不进断言**，属推导层面的观察）】
  见推导 spectrum.long-cylinder-lightest-state-count--via-q-expansion 的 summary 第 2 步：
  **16 = 2 × 8** 来自 ∏(1 + q^{m−1/2})⁸ 与 ∏(1 − q^{m−1/2})⁸ 在 q^{1/2} 阶上的差（±8q^{1/2}），
  其中 8 是**横向世界面费米子的个数**。
  ⚠ 这是一条**组合来源**，不是「无质量态的个数」；把它当成后者正是「不断言 (a)」禁止的那一步。

  【本卡不覆盖的相邻事实】玻色 Möbius 带的闭弦通道常数项是 **−24**（与圆柱的 +24 反号），
  已在 spectrum.one-loop-mobius-amplitude-v2 的断言 (5) 里（那是本图对**玻色弦**做的补算，
  专门用来解释 (7.4.22) 的 ± 与 (7.4.24) 的 ∓ 的表观矛盾）。**本卡不重复它，也不与它合并**：
  那一条是带符号的、依附在那张玻色卡上的补算；本卡断言的是原书印出的数。
  ⚠ 对照：超弦 Möbius (10.8.18) 印出的是 **+16**（符号 ± 在前缀里，不在方括号里），
  与玻色弦那一支的记账方式不同，**不要互相套用**。

  ★★★【开放问题登记（curator theta-cards，2026-09-11；**只记在 notes，statement 不动**）】
  以下三条是 curator-13 在做 --via-q-expansion 的复算时发现的，本卡**不把任何一条写进断言**；
  同一条目已写入 docs/ROADMAP.md 的「待船长裁决」。

  **(O1) 同一个 16，两条互不相干的组合路径，原书不评论。**
    · **圆柱 (10.8.4) 与 Klein 瓶 (10.8.11)**：16 = **2 × 8**——
      η^{−8}[Z⁰₀⁴ − Z⁰₁⁴] 的常数项来自 ∏_{m≥1}(1 + q^{m−1/2})⁸ 与 ∏_{m≥1}(1 − q^{m−1/2})⁸
      在 q^{1/2} 阶上的系数 **+8 与 −8 相减**（x² 项的 28 逐项相消），其中 **8 = 横向世界面费米子的个数**。
    · **Möbius 带 (10.8.18)**：16 = **2⁴**——Z¹₀ = 2q^{1/12}∏(1+q^m)²（因子 2 是
      **R 扇区基态的二重简并**，来自 (10.7.6) 取 α = 1 时 m = 1 的因子 1 + q⁰ = 2），
      故 Z¹₀⁴ 带出 2⁴ = 16；四次幂来自「迹对**一对维数**取」。
    ⇒ **一个是「8 个费米子的一阶系数相减」，一个是「二重简并的四次幂」**，
      两条路径在组合上毫无关系，却给出同一个数。**原书对此不作任何评论，也从不说这两个 16 为什么相等。**
    ⚠ 本卡「不断言 (c)」（不断言本图各处的 16 同源）正是为这一点留的余地；
      推导 spectrum.long-cylinder-lightest-state-count--via-q-expansion 的 summary 第 2、3 步与 notes
      有逐步复算。

  **(O2) 抽取记录里那句「16 = 十维无质量态计数」的 gloss，朴素读法与本图别处的计数对不上。**
    该 gloss 在 polchinski-1998-v2-sec10-8.md **#E66 的「备注」栏**（抽取者转述，**不在「原文逐字」栏**）。
    朴素计数：D = 10 的 **NS–NS 无质量态是 8 ⊗ 8 = 64**，不是 16；
    玻色弦一侧同样对不上（D = 26 的无质量闭弦态是 24 × 24 = **576**，而 (7.4.4) 的常数项是 24）。
    ⇒ 本卡「不断言 (a)」据此把一切计数释义挡在断言之外。
    ⚠ **这不等于说该 gloss 是错的**：闭弦通道里真正被边界态 / cross-cap 态挑出的是**一个子集**，
      要断言任何计数解释，必须先精确写出那个子集是什么——那是一条**新的、独立的命题**，本图没有。

  **(O3) 这与 #E74 的 Q5「三个 2⁵ = 32」是同一类现象。**
    sec10-8.md **#E74 §Q5** 记的是：(10.8.4)/(10.8.11)/(10.8.18) 三处各自独立出处的 **2⁵ = 32**
    （前缀里的数），**原书从不解释它们为什么相等**。
    ⇒ (O1) 与它的结构相同（不同来路的数字巧合地相等，原书沉默），
      建议船长把两条**一并**裁决：是（a）承认这是本书的记账风格、图上只记不问，
