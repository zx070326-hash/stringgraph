  - ref: polchinski-1998-v2
    loc: "§10.8, p. 40（s ↔ t 的三拓扑换算逐字：'s is related to the usual modulus t for these surfaces by s = π/t, π/4t, and π/2t for the cylinder, Möbius strip, and Klein bottle respectively'）"
    note: |
