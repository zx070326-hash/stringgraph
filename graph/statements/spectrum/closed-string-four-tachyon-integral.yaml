id: spectrum.closed-string-four-tachyon-integral
kind: proposition
title: 闭弦四 tachyon 树振幅：SL(2,C) 固定 z₁=0、z₂=1、z₃=∞ 后剩一个复积分
statement: |
  在球面 S₂ 上取四个闭弦 tachyon 顶点算子。共形 Killing 群 PSL(2,C) 有 6 个实参数
  （worldsheet.sphere-conformal-killing-group），可固定**三个复坐标**；
  取 z₁ = 0、z₂ = 1、z₃ = ∞（合法性见 spectrum.sphere-tachyon-expectation-smooth-at-infinity），
  第四个坐标 z₄ 在整个复平面上积分。则

  **(1)（三点）** 闭弦三 tachyon 树振幅 (6.6.2) 与开弦情形结构相同：三个坐标全部被固定，
  振幅与坐标无关，只依赖动量与归一化常数。

  **(2)（四点）**
    S_{S₂} = i g_c⁴ C_{S₂} (2π)²⁶ δ²⁶(Σ_i k_i)
             ∫_C d²z₄  |z₄|^{−α'u/2 − 4} |1 − z₄|^{−α't/2 − 4}    （(6.6.4) 的化简形式）。

  **本命题不断言什么**：不给出 (6.6.2) 的显式前因子；不把 (2) 的积分算出
  （那是 spectrum.virasoro-shapiro-amplitude）；不定 C_{S₂} 的数值，也不涉及 α's = −4 处的极点
  （那是 spectrum.sphere-normalization-from-factorization）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
sources:
  - ref: polchinski-1998-v1
    loc: "§6.6, eq. (6.6.2)（三 tachyon）、(6.6.4)（四 tachyon），p.192–193"
    note: |
      literature/extractions/polchinski-1998-v1.md#E104 + **§14.2（原书核实 2026-09-11，
      pp.192–193 页图逐字）**。**等级由「L1（schrans-2020 逐页读到）」改为「L1（原书 p.192–193 页图）」。**

      **原书逐字（p.192–193）**：
        (6.6.1) 三闭弦快子 `= g_c³ e^{−2λ} ⟨∏_{i=1}^3 :c̃c e^{ik_i·X}(z_i,z̄_i):⟩_{S₂}`；
        (6.6.2) `S_{S₂}(k₁;k₂;k₃) = i g_c³ C_{S₂} (2π)²⁶δ²⁶(Σ_i k_i)`，`C_{S₂} = e^{−2λ}C^X_{S₂}C^g_{S₂}`；
        (6.6.3) 四闭弦快子的期望值形式；
        (6.6.4) `S_{S₂}(k₁;k₂;k₃;k₄) = i g_c⁴ C_{S₂} (2π)²⁶ δ²⁶(Σ_i k_i) J(s,t,u)`；
        (6.6.5) `J(s,t,u) = ∫_C d²z₄ |z₄|^{−α'u/2−4} |1−z₄|^{−α't/2−4}`。
      ⇒ **本卡片 (2) 的被积函数指数与原书 (6.6.5) 逐字一致**；
      **notes 里「(2) 中被积函数的指数照抄抽取记录的转述」这层保留可以去掉**（已在 notes 中标注）。
      ⇒ 本卡片 (1) 的结构性陈述与 (6.6.2) 一致；**(6.6.2) 的显式前因子 i g_c³C_{S₂}(2π)²⁶δ²⁶
      现在其实已经到手**，但本卡片 statement 明写「不给出 (6.6.2) 的显式前因子」，
      **按 graph/CLAUDE.md 不得就地改写**；要写出须新建节点。

      **(1) 的固定手续也已有原书依据**：p.192 逐字「the CKG PSL(2,C) (the Möbius group) can be
      used to fix the three vertex operators to arbitrary positions z_{1,2,3}」。

      **仍未关闭**：⚠ 「z₃ → ∞ 合法」这一步 [S] 只写「Just as for the open string case (6.4.5)
      the z₃ → ∞ does not cause a problem」，**不给论证**（抽取记录 Q17）；
      **§14.2 没有覆盖这一点**，Q17 仍开着。
      ⚠ [S] 对三点的评语逐字「This is just a duplication on the open string three tachyon amplitude,
      **so there is no point elaborating on it**」作为历史保留：二手源确实没写出 (6.6.2) 的细节，
      现在的依据是原书页图。
tags: [spectrum, tree-level, sphere, closed-string, tachyon, four-point, psl2c]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E104 建立。
  2026-09-11 按 reviewer-ch6 把原 (3)（α's = −4 极点 + C_{S₂} = 8π/(α'g_c²)）拆到
  spectrum.sphere-normalization-from-factorization；本卡未合并 main，直接改文本。

  **⚠ 上游 ch5 节点尚未进入 main**（主公式 (5.3.9)、FP 手续），处理同本批次其它节点。

  **(2) 中被积函数的指数**（−α'u/2 − 4 与 −α't/2 − 4）：
  ~~照抄抽取记录的转述~~ ——**2026-09-11（§14.2）已由原书 p.193 的 (6.6.5) 直接证实，
  这层保留取消**。它们与 spectrum.virasoro-shapiro-amplitude 里 [S]/[H] 给出的 Beta 参数
  自洽（见该卡片的一致性校验），现在还有原书页图直接支持。

  **符号提醒（抽取记录 E95 的记号陷阱）**：闭弦四 tachyon 振幅算的是**普通正规序** :e^{ik·X}:
  而不是重整化算符 [e^{ik·X}]_r，二者由「令共形因子 ω = 0」相联系；
  混用会差一个 exp(−(α'/4)Σ_i k_i² ω(z_i)) 因子。
