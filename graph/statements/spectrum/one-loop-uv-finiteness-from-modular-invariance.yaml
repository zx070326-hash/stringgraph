      to exactly one point in the region F₀ shown in figure 5.2 … except on the boundaries which are
      identified as shown in the figure」——「it can be shown」，无证明。
tags: [spectrum, one-loop, torus, uv-finiteness, modular-invariance, moduli, fundamental-domain]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E24 建立。

  **这是本章最重要的节点，也是最容易被夸大的节点。** 它说的是
  「**弦论的模积分区域里没有 τ₂ → 0 的区域**」，不是「弦论有限」。
  按抽取记录 Q2，原书把「无 UV 区」（τ₂ → 0）与「无快子时收敛」（τ₂ → ∞）写在相邻两段，
  **两者的证据强度完全不同**（前者是区域对比，后者是断言）；本图分别承载：
  前者是本卡，后者只作为 spectrum.one-loop-torus-amplitude 推导的 gap，**没有独立节点**
  （是否要建 conjecture 级的「无快子时收敛」节点，留给 lead/auditor 按 Q2 裁决）。
