notes: |
  ★★★【本卡为什么存在（curator，2026-09-11，batch28-supersede）】
  本卡是 **spectrum.long-cylinder-lightest-state-count 的换代卡**，执行 reviewer-batch28 记录在
  旧卡 notes 里的请求（逐字）：
    「reviewer 给出的正解：**换代**为只含超弦 (2)(3) 的 **spectrum.type-i-long-cylinder-constant-term**，
      三条振幅推导的边改指新卡，--via-q-expansion 用 `git mv` 改指并**删掉**对 duality 卡的边
      （其第 1 步只需 math.dedekind-eta-function），本卡写 superseded_by。」
  reviewer 判旧卡的两处问题（旧卡 notes 逐字）：
    (i) **一卡两命题**——玻色弦的 24（旧卡断言 (1)）已经是
        spectrum.cylinder-closed-channel-open-closed-duality 断言 (3) 的逐字内容，
        --via-q-expansion 对那张卡的边是**重复供给而非论证步**；
    (ii) **id 里的 "count" 名不副实**。
  旧卡当轮未执行的唯一原因是三条振幅推导在 **claim #399（batch27-fix）**名下；该分支已并入 main，
  本轮落地。

  【编号对照（读旧卡 / 旧 note 的指针时必看）】
    · 本卡断言 **(1)** = 旧卡断言 **(2)**（圆柱 (10.8.4) + Klein 瓶 (10.8.11)）；
    · 本卡断言 **(2)** = 旧卡断言 **(3)**（Möbius (10.8.18)，含三面公因子那一句）；
    · 本卡断言 **(3)** = 旧卡断言 **(4)** 限于超弦三处（旧卡还含玻色弦 (7.4.4) 的一处 24）；
    · 旧卡断言 **(1)**（玻色弦 η^{−24} = exp(2s) + 24 + O(exp(−2s))）**本卡没有**，
      它在 spectrum.cylinder-closed-channel-open-closed-duality 断言 (3)。
    · 「不断言」的**字母 (a)–(f) 未改**，三条振幅推导 note 里写的「新卡的『不断言 (a)』」仍然有效。

  ⚠⚠【关于旧卡 id 里的 "lightest-state-count"（历史记录，必须一起读）】
  旧卡 id 由 lead 在派工单里指定，沿用的是三条振幅推导 gap 的措辞，而**旧卡的断言里也没有任何
  「计数」**；旧卡 notes 已就此留过记录，逐字：「id 中的这个词是**历史命名**，与卡面内容不符的那一半
  已由『不断言 (a)』显式排除。按 graph/CLAUDE.md「id 一旦提交不得更改」，本卡不改 id，此处留记录。
  ⇒ 建议 lead：引用本卡时按 title 读，不要按 id 读。」
  **本卡的 id 就是那条建议的落地**：`type-i-long-cylinder-constant-term` 逐字说出本卡断言的东西
  （type I、长柱极限、展开的常数项），不含任何「计数」字样。
  ⇒ 引用本卡时 id 与 title 一致，不再需要那条警告；旧 id 只应出现在历史记录里。

  【与 spectrum.cylinder-closed-channel-open-closed-duality 的分工（**别读成重复卡**）】
  那张卡的断言 (3) 含**玻色弦**的展开式 η(is/π)^{−24} = exp(2s) + 24 + O(exp(−2s))，
  并在括注里写了「常数 24 是无质量闭弦态（左右各 24 个横向模在对角上的 24 个组合）」。
  换代后的分工**没有重叠**：
    · 那张卡 = 玻色圆柱的**通道对偶**（模变换 + 换元 + 通道解释），24 是其中一步的读数；
    · 本卡 = **只**把超弦三处的常数项 16 做成一个可被上游引用的对象，
      并把「该数 = 态计数」这层释义**显式排除**。
  ⇒ 玻色弦的 24 在本图只有**一个**断言点（那张卡），这正是本次换代消除的重复。
  ⚠ 那张卡括注里的计数说法（「**对角上的** 24 个组合」，比「无质量态的个数」窄）本卡不表态；
  若 reviewer 认为那个括注也该移出断言，那是**那张卡的换代**，不由本卡承担。

  【超弦一侧的 16 是怎么来的（**不进断言**，属推导层面的观察）】
  见推导 spectrum.type-i-long-cylinder-constant-term--via-q-expansion 的 summary：
  圆柱/Klein 那一支 **16 = 2 × 8** 来自 ∏(1 + q^{m−1/2})⁸ 与 ∏(1 − q^{m−1/2})⁸ 在 q^{1/2}
  阶上的差（±8q^{1/2}），其中 8 是**横向世界面费米子的个数**；Möbius 那一支 **16 = 2⁴** 来自
  R 扇区基态二重简并的四次幂。
  ⚠ 这些是**组合来源**，不是「无质量态的个数」；把它当成后者正是「不断言 (a)」禁止的那一步。

  【本卡不覆盖的相邻事实】玻色 Möbius 带的闭弦通道常数项是 **−24**（与玻色圆柱的 +24 反号），
  已在 spectrum.one-loop-mobius-amplitude-v2 的断言 (5) 里（那是本图对**玻色弦**做的补算，
  专门用来解释 (7.4.22) 的 ± 与 (7.4.24) 的 ∓ 的表观矛盾）。**本卡不重复它，也不与它合并。**
  ⚠ 对照：超弦 Möbius (10.8.18) 印出的是 **+16**（符号 ± 在前缀里，不在方括号里），
  与玻色弦那一支的记账方式不同，**不要互相套用**。

  ★★★【开放问题登记（curator theta-cards，2026-09-11；**只记在 notes，statement 不动**；
  本卡自旧卡逐条承接，内容未改）】
  以下三条是 curator-13 在做 --via-q-expansion 的复算时发现的，本卡**不把任何一条写进断言**；
  同一条目已写入 docs/ROADMAP.md 的「待船长裁决」（那里引的是旧卡 id）。

  **(O1) 同一个 16，两条互不相干的组合路径，原书不评论。**
    · **圆柱 (10.8.4) 与 Klein 瓶 (10.8.11)**：16 = **2 × 8**——
      η^{−8}[Z⁰₀⁴ − Z⁰₁⁴] 的常数项来自 ∏_{m≥1}(1 + q^{m−1/2})⁸ 与 ∏_{m≥1}(1 − q^{m−1/2})⁸
      在 q^{1/2} 阶上的系数 **+8 与 −8 相减**（x² 项的 28 逐项相消），其中 **8 = 横向世界面费米子的个数**。
    · **Möbius 带 (10.8.18)**：16 = **2⁴**——Z¹₀ = 2q^{1/12}∏(1+q^m)²（因子 2 是
      **R 扇区基态的二重简并**，来自 (10.7.6) 取 α = 1 时 m = 1 的因子 1 + q⁰ = 2），
      故 Z¹₀⁴ 带出 2⁴ = 16；四次幂来自「迹对**一对维数**取」。
    ⇒ **一个是「8 个费米子的一阶系数相减」，一个是「二重简并的四次幂」**，
      两条路径在组合上毫无关系，却给出同一个数。**原书对此不作任何评论，也从不说这两个 16 为什么相等。**
    ⚠ 本卡「不断言 (c)」（不断言本图各处的 16 同源，**包括本卡自己的两处**）正是为这一点留的余地；
      推导 --via-q-expansion 的 summary 与 notes 有逐步复算。

  **(O2) 抽取记录里那句「16 = 十维无质量态计数」的 gloss，朴素读法与本图别处的计数对不上。**
    该 gloss 在 polchinski-1998-v2-sec10-8.md **#E66 的「备注」栏**（抽取者转述，**不在「原文逐字」栏**）。
    朴素计数：D = 10 的 **NS–NS 无质量态是 8 ⊗ 8 = 64**，不是 16；
    玻色弦一侧同样对不上（D = 26 的无质量闭弦态是 24 × 24 = **576**，而 (7.4.4) 的常数项是 24）。
    ⇒ 本卡「不断言 (a)」据此把一切计数释义挡在断言之外。
    ⚠ **这不等于说该 gloss 是错的**：闭弦通道里真正被边界态 / cross-cap 态挑出的是**一个子集**，
      要断言任何计数解释，必须先精确写出那个子集是什么——那是一条**新的、独立的命题**，本图没有。

  **(O3) 这与 #E74 的 Q5「三个 2⁵ = 32」是同一类现象。**
    sec10-8.md **#E74 §Q5** 记的是：(10.8.4)/(10.8.11)/(10.8.18) 三处各自独立出处的 **2⁵ = 32**
    （前缀里的数），**原书从不解释它们为什么相等**。
    ⇒ (O1) 与它的结构相同（不同来路的数字巧合地相等，原书沉默），
      建议船长把两条**一并**裁决：是（a）承认这是本书的记账风格、图上只记不问，
      还是（b）立项去找一条统一的来源（典型候选：边界态 / cross-cap 态的归一化），
      找到后为「为什么三处的 16（与三处的 2⁵）相等」单建一张命题卡。
