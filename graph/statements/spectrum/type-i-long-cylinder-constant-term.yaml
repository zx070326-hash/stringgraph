id: spectrum.type-i-long-cylinder-constant-term
kind: proposition
title: type I 超弦长柱（闭弦通道）极限 s → ∞ 下被积函数的展开常数项：(10.8.4)/(10.8.11)/(10.8.18) 三处都是 16（**不**断言该数是无质量态的计数）
statement: |
  **设定（是陈述的一部分）**：考虑 type I 超弦（D = 10，Vol.2 §10.8）单圈真空振幅在
  **闭弦通道**变量 s 下的被积函数（s → ∞ 即「长柱极限」，对应开弦模 t → 0；三个无取向拓扑的
  s ↔ t 换算是 s = π/t（圆柱）、π/4t（Möbius 带）、π/2t（Klein 瓶），原书 §10.8 p.40 逐字）。
  η 按 math.dedekind-eta-function；费米迹记号 Z^α_β(τ) = Tr_α[q^H exp(πiβQ)] 按
  worldsheet.modular-invariance-requires-eight-transverse-fermions
  （§10.7 (10.7.7)–(10.7.8)，**这些迹是「对一对维数」取的**，故下面出现四次幂）。
  **本卡只谈方括号里那个函数的展开，不谈它前面的任何前缀、测度或积分。**

  **断言**：
    **(1) 圆柱 (10.8.4) 与 Klein 瓶 (10.8.11)**：两式第二行方括号里的函数同为
          η(is/π)^{−8}[ Z⁰₀(is/π)⁴ − Z⁰₁(is/π)⁴ ]，原书第三行把它写成
          **16** + O(exp(−2s))。
        即：**没有 exp(2s) 项，首项就是常数项，其值等于 16**。
    **(2) Möbius 带 (10.8.18)**：方括号里的函数是
          [ Z⁰₁(2is/π)⁴ Z¹₀(2is/π)⁴ ] / [ η(2is/π)⁸ Z⁰₀(2is/π)⁴ ]，
        原书把它写成 **16** + O(exp(−2s))。
        ⇒ 与 (1) 合起来：**三个面在长柱极限下共有同一个因子 [16 + O(exp(−2s))]**
          （抽取记录 §0.4(a) 把 K ≡ (V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(exp(−2s))]
           称作三者的「公因子」）。
    **(3) 这个数是原书印出的数**：16 印在 Vol.2 (10.8.4)、(10.8.11)、(10.8.18)（三处），
        全部 L1 页图逐字。

  **本命题不断言**（字母编号沿用换代前的旧卡 spectrum.long-cylinder-lightest-state-count，
  以保持三条振幅推导 note 里「新卡的『不断言 (a)』」等指针有效）：
    (a) ⚠⚠ **不断言 16 是无质量态的计数**（这是本卡存在的**首要理由**）。
        原书在上述三处**只印出数字**，不说它是什么的计数。原书说过的是关于**那一项**
        （不是关于那个数）的物理归属，(10.8.4) 之后逐字：'The divergence as s → ∞ is due to a
        **massless closed string tadpole**, which as noted must be an NS–NS state.'
        「**该项来自无质量闭弦态**」与「**该数等于无质量态的个数**」是两句不同的话，
        原书只说了前一句。本卡断言的是数值；前一句的内容属 tadpole 一侧
        （spectrum.cylinder-tadpole-divergence-is-infrared /
         worldsheet.type-i-tadpole-cancellation-so32-v2），不在本卡。
        ⚠ 后一句在**朴素读法下与本图别处的计数对不上**，这是把它挡在断言外的实质理由：
        D = 10 的 NS–NS 无质量态是 8 ⊗ 8 = **64**，**不是 16**；玻色弦一侧同样对不上
        （D = 26 的无质量闭弦态是 24 × 24 = **576**，而 (7.4.4) 的常数项是 24——抽取记录
         polchinski-1998-v1-ch7.md 已就环面 (7.3.15) 的 24² 与 (7.4.4) 的 24 发过
         「**是不同的数，别混**」的告警）。
        ⇒ 若日后要断言任何计数解释，必须先说清「在闭弦通道里被边界态/cross-cap 态挑出的
        那个子集」是什么——那是一条新的、独立的命题。
    (b) **不断言这个 16 与玻色弦 (7.4.4) 的 24 之间有任何普适公式**。原书从不把这两个数并列，
        也从不写成 D 的函数；抽取记录 sec10-8.md **#E74** 的对照表是**抽取者**做的，其裁决 (ii)
        逐字写明「Polchinski 从不写符号形式 2^{D/2}，也从不把两个数并列比较」。
        ⚠ **玻色弦的 24 本身也不在本卡**（它是
        spectrum.cylinder-closed-channel-open-closed-duality 断言 (3) 的逐字内容；
        换代前的旧卡把两者写在一起，正是 reviewer-batch28 判为「一卡两命题」的那一点）。
    (c) **不断言这个 16 与本图别处出现的 16 同源或相等**。别处的 16 至少有两个：
        worldsheet.superstring-relative-cohomology-dimension 的 notes 里由 ½·dim R(p,0) 得到的 16；
        §10.6 (10.6.19) 上方原书逐字 'The open string multiplets, **with 16 states**'
        （type I 开弦无质量多重态 8_v + 8）。**本图未建立任何等同。**
        ⚠ 连本卡断言 (1) 与 (2) 里的两个 16 **本卡也不断言同源**：它们的组合来路不同
        （2 × 8 对 2⁴，见 notes 的开放问题 (O1)），本卡只断言两处的**数值**都是 16。
    (d) **不断言任何前缀、测度、发散或 tadpole**。V₁₀/(8π(8π²α')⁵)、2¹⁰、±2n·2⁵、(n ∓ 32)²、
        C₁₀ 悖论全部不在本卡（见 worldsheet.superstring-*-amplitude-closed-channel 三张卡与
        worldsheet.type-i-tadpole-cancellation-so32-v2）。
    (e) ⚠ 断言 (1)(2) 里「超弦一侧没有 exp(2s) 项」是**照读原书印出的式子**，
        **不**断言它与 GSO 投影去掉快子之间的因果（那是 worldsheet.gso-removes-tachyon）。
        ⚠ 玻色弦那一侧确有 exp(2s) 项、原书用解析延拓 ∫₀^∞ ds exp(βs) ≡ −1/β 定义它
        （(7.4.5)），**那整件事不在本卡**（本卡只谈超弦）。
    (f) **不断言展开的高阶项**。原书三处都只写到 O(exp(−2s))，本卡照录；各面高阶项的具体系数
        不在本卡。
        ⚠ 一处容易读错的技术细节（本卡照录、不另作断言）：Möbius 那一支的宗量是 **2is/π**，
        故它的展开参数是 q = exp(−4s) 而不是 exp(−2s)；**它的修正出现在相对阶 q^{1/2}**，
        因而仍然是 O(exp(−2s))，与另外两面写法一致。
