id: spectrum.massless-open-pole-requires-chan-paton
kind: proposition
title: α's = 0 处的无质量极点在纯四 tachyon 振幅中相消，只有加 Chan–Paton 因子后才真实存在
statement: |
  取开弦四 tachyon 振幅中区间 (0,1) 的贡献 I(s,t)。在 α's → 0 附近其展开含一项
    I(s, t) = (u − t)/(2 s) + （在 s = 0 处解析的项）,
  形式上给出 **α' s = 0 处的极点**（(6.4.17)），看似对应中间态无质量矢量。则：

  **(1)** 把另一循环序（t ↔ u 交换）的贡献加进来后，该极点的留数**相消**：
  在**没有** Chan–Paton 因子的纯四 tachyon 开弦振幅里，**α' s = 0 处没有极点**。

  **(2)** 只有当各循环序配上互不相同的 Chan–Paton 迹（spectrum.chan-paton-factors）
  且这些迹不相消时，α' s = 0 的极点才真实存在——它对应中间态的**无质量规范玻色子**，
  其留数正比于结构常数型的组合。这正是 (6.5.14) 定出 Yang–Mills 耦合 g'_o 时所用的极点。

  ⚠ **本命题是一条警告**：不得由 (6.4.17) 单独断言「无质量矢量出现在 s 通道」。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
sources:
  - ref: polchinski-1998-v1
    loc: "§6.4, eqs. (6.4.16)–(6.4.18)，p.182（α's = 0 处的极点在 (6.4.17)）；相消的原书陈述在 p.183 第 1 段（无式号）；(6.5.6)/(6.5.9)（带 Chan–Paton 的四点与幺正性）p.184–189"
    note: |
      literature/extractions/polchinski-1998-v1.md#E98 + **§14.1（原书核实 2026-09-11，pp.182–183 页图逐字）**。
      **等级：L1（原书直读）。** 底层来源（历史）：schrans-2020 §6.36–§6.37（笔记 p.307，逐页读到）
      给出 I(s,t) = (u−t)/(2s) + 解析项，并指出把 t ↔ u 的贡献加进来后**该极点相消**。

      **原书逐字（p.182）**：
      (6.4.16) `I(s,t) = ∫_0^r dy [ y^{−α's−2} + (α't+2) y^{−α's−1} + … ]`；
      「The second term gives a pole at α's = 0」，
      (6.4.17) `I(s,t) = (u−t)/(2s) + terms analytic at α's = 0`；
      (6.4.18) `α's = −1, 0, 1, 2, …`。

      **原书逐字（p.183 第 1 段，无式号——本卡片 (1) 的直接依据）**：
      「These are precisely the positions of the open string states. … **Because the residue at s = 0 in
      (6.4.17) is odd in u − t, this pole actually cancels that from I(s,u), as do all poles at even multiples
      of 1/α'. This will not be true for the more general open string theories to be introduced in the next
      section.**」（next section = §6.5，Chan–Paton 因子，pp.184–192。）

      ⇒ **本卡片 (1) 的相消结论由「只有 schrans-2020 一个来源」升级为「原书 p.183 逐字」。**
      旧 note 里「⚠ 原书是否明确写出这一相消**未核实**」一句已作废，本轮删除。

      ⇒ **旧 note 里「(6.4.18) 的塔把 α's = 0 与 −1,1,2,… 并列……哪一边是原书本意，本图未裁定」
      现予关闭。** 裁定：p.183 第一句「These are precisely the positions of the **open string states**」
      表明 (6.4.18) 陈述的是**开弦谱（态）的位置**，不是「完整振幅在其中每一处都有极点」的断言；
      原书随即声明其中 1/α' 偶数倍的那些极点在纯四快子振幅里相消。两句不矛盾，
      **本卡片 (1) 的读法就是原书本意。**

      ⚠ **本卡片只覆盖 α's = 0 这一个点，而原书说的是一整族**（1/α' 的偶数倍，即 α's = 0, 2, 4, …）。
      更强的兄弟卡是 **spectrum.even-level-open-string-poles-cancel-between-orderings**（同批建立）。
      本卡片**不因此换代**——statement 文本没有一句被推翻，只是比原书说得弱。

      ⚠ **(2) 的后半句「留数正比于结构常数型的组合」仍未核实**：p.183 那一句只说
      「加了 Chan–Paton 之后不再相消」，**没有说留数正比于结构常数**；后者的来源仍是 (6.5.14) 一带，
      §14 未覆盖（§14.4 F.1 的 negative evidence：(6.5.14)/(6.5.15)/(6.5.16) 本轮未核）。

      **§12.8（原书核实，2026-09-11）作为历史保留**：§12.8 逐字确认了极点位置的式号是 (6.4.18)，
      内容为 α's = −1, 0, 1, 2, …，但**没有核对 (6.4.17)，也没有取得相消那一句**——
      这两处由 §14.1 补齐。§14.1 并顺带订正 §12.8 的一处措辞：**(6.4.16) 的积分上限逐字就是 `r`**
      （`∫_0^r dy`，r 是 y = 0 邻域的截断），§12.8「原书里没有 r」的印象是错的。
tags: [spectrum, tree-level, open-string, pole, massless, chan-paton, warning]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E98 的警告建立。

  **为什么单独建节点**：这是一处容易被下游误用的陷阱。若只看 (6.4.17)，
  很自然会写下「开弦谱里的无质量矢量在四 tachyon 振幅的 s 通道留下极点」——**这是错的**。
  把它显式化，可以让任何引用 (6.4.17) 的节点被迫面对相消。

  **与 Chan–Paton 的关系**：本卡片给出了 spectrum.chan-paton-factors 的一个**物理必要性论证**
  ——不是「可以加」而是「不加就没有规范玻色子极点」。不过来源没有把它表述成必要性论证，
  本卡片也不这样断言，只陈述两种情形下极点的有无。

  **⚠ 禁令（§14.1，2026-09-11：本轮明确排除的一个具体误解）**：
  **不得**把这里的相消机制写成「因子 (1 + α's) 抵消」，也不得写成任何「单项内部的因子相消」。
  原书的机制是**两个不同循环序之间**的相消——(6.4.17) 在 s = 0 处的留数 (u−t)/2
  **在 u − t 下是奇函数**，因而与 I(s,**u**)（t ↔ u 的那一序）在同一极点处的留数逐项抵消。
  任何引用本卡片的下游节点若写出「(1+α's) 抵消」式的说法，即为错误。

  **与更强的兄弟卡的关系（2026-09-11 追加）**：
  spectrum.even-level-open-string-poles-cancel-between-orderings 把原书那一句的全部内容
  （**所有 1/α' 偶数倍的极点都相消**）写成一条卡片，本卡片是它在 α's = 0 处的特例。
  两卡并存而非换代：本卡片额外带了 (2)（Chan–Paton 之后极点真实存在、对应无质量规范玻色子）
  这一层，兄弟卡不覆盖；而兄弟卡覆盖的整族极点本卡片不覆盖。
author: curator-polchinski-ch6
created: "2026-09-11"
