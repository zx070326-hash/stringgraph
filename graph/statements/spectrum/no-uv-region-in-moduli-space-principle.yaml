notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E26 建立。

  **为什么与 spectrum.one-loop-uv-finiteness-from-modular-invariance 分卡**（项目原则 1）：
  那一条是**环面**的具体陈述（有一条可检验的区域对比论证）；本条是**对一切弦振幅**的一般断言
  （只有一个例子 + 推迟到第 9 章）。合成一卡会让「一个例子」冒充「一般定理」，
  这正是本项目要避免的那种漂移。lead 派工单只点了前一个 id，本卡是 curator 加的拆分，
  已在报告里列明。

  **status 选择的依据**（docs/STATUS_LEVELS.md 的「断言 + 骨架」档，lead 2026-09-11 裁决）：
  作者把它当作**成立的**一般原则提出（不是当猜想提出），故按裁决标 **physical-argument** 而非
  conjecture，缺口逐条写在推导的 gaps 里。
