id: spectrum.no-uv-region-in-moduli-space-principle
kind: proposition
title: "「模空间没有 UV 区」这条一般原则（作者自称 principle；唯一算过的例子是环面真空振幅）"
statement: |
  原书在算完环面真空振幅后提出一条一般性断言，逐字：
    「The torus illustrates **a general principle, which holds for all string amplitudes: there is no
    UV region of moduli space that might give rise to high energy divergences. All limits are
    controlled by the lightest states, the long-distance physics.** For the torus with vertex
    operators the τ-integration is still cut off as above, but there are more limits to consider as
    vertex operators approach one another. The same general principle applies to these as well,
    **as we will develop further in chapter 9**.」

  即断言的内容是：**对一切弦振幅（任意亏格、任意数目的顶点算子），模空间里都没有会产生高能
  发散的 UV 区；一切极限都由最轻的态、即长距离物理控制。**

  ⚠ **证据基础必须写明**：
  (1) 原书自己的用词就是 "a general principle"，**不是定理**；
  (2) 本章唯一算过的例子是**环面真空振幅一例**
      （spectrum.one-loop-uv-finiteness-from-modular-invariance），而那一例本身只是「区域对比」；
  (3) 带顶点算子的情形（顶点算子互相靠近的极限）与全亏格情形**明确推迟到第 9 章**，本章一字不证；
  (4) **开弦一侧根本不是靠这个机制**：圆柱没有模群，t → 0 不被截断，而是靠**换通道重解释**
      （spectrum.cylinder-closed-channel-open-closed-duality）。原书自己也指出这个差别，逐字：
      「It is curious that the mechanism that removes the UV divergence is different in the closed and
      open string cases.」

  **本卡不断言什么**：不断言任何具体振幅的收敛性；不断言第 9 章确实兑现了这条原则
  （本图未抽取第 9 章）；不涉及超弦。
