id: spectrum.four-tachyon-factorization-disk-normalization
kind: proposition
title: 四点振幅的端点发散 = 中间态极点；因子化定出 C_{D₂} = 1/(α' g_o²)
statement: |
  取 spectrum.open-string-four-tachyon-amplitude 的四 tachyon 开弦振幅。则：

  **(1)（端点发散 ⇒ 极点）** 积分变量趋于端点（y → 0）时被积函数发散，
  按 Beta 函数的亚纯延拓（math.euler-beta-integral）表现为 **1/(α' s + 1) 型单极点**，
  即极点位于 **s = −1/α'**。这恰是**中间态开弦 tachyon 上壳**的位置
  （α' m² = −1，配 conv.metric-mostly-plus 的 m² = −s 通道不变量）。

  **(2)（因子化）** 该极点的**留数**等于两个三点振幅经中间态传播子相接的结果：
    S₄ 在 s → −1/α' 附近 ≈ [ S₃(k₁,k₂,−k) × (中间态传播子) × S₃(k, k₃,k₄) ]，
  这就是**因子化**（(6.4.13)）：四弦振幅在极点处分解为两个三弦振幅之积，
  中间态跑遍所有动量。

  **(3)（归一化）** 比较 (2) 两侧的系数定出圆盘的归一化常数
    **C_{D₂} = 1 / (α' g_o²)**   （(6.4.14)）。

  **本命题不断言什么**：不断言四点振幅在**所有**极点处都因子化（只用了 s 通道 tachyon 极点）；
  不涉及 α' s = 0 处的无质量极点（那条另有陷阱，见
  spectrum.massless-open-pole-requires-chan-paton）；不断言幺正性。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
sources:
  - ref: polchinski-1998-v1
    loc: "§6.4, eq. (6.4.11)（中间 tachyon 处的发散）、(6.4.13)（因子化）、(6.4.14)（C_{D₂} = 1/(α'g_o²)），p.179–183"
    note: |
      literature/extractions/polchinski-1998-v1.md#E98，等级 **L1**（schrans-2020 §6.30–§6.37，
      笔记 p.300–307，逐页读到）。
      抽取记录逐字引 [S] 对 (6.4.13) 的评语：「an example of **factorisation**: the four-string
      amplitude is a combination of two three-string amplitudes with an intermediate state of all
      possible momenta」（其后关于 BCFW 的类比是 **[S] 自己的联想，不是 Polchinski 的说法**，
      本图不采用）。
tags: [spectrum, tree-level, disk, open-string, factorization, pole, normalization, unitarity]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E98 建立。

  **为什么这条重要**：它是本章里「弦振幅的极点 = 物理态」这一原则第一次被兑现，
  也是弦耦合常数归一化（C_{D₂}、随后 C_{S₂}、g'_o、κ）的整条链子的起点。

  **⚠ 「中间态传播子」在本图中没有定义**：因子化的右端要用到中间弦态的传播子与态和，
  这需要弦场论或算符形式的定义，本书在此处是用场论类比写出的。
  本卡片按来源陈述该关系，但不把它当作已定义的等式，见推导 gaps。
author: curator-polchinski-ch6
