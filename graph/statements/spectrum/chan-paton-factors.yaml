notes: |
  由 curator 于 2026-09-11 从抽取记录 E102 建立。

  **为什么 status = physical-argument**：这是**定义卡**，但它定义的对象是「开弦态的额外标记」，
  其合法性（不破坏世界面共形不变性、与因子化相容）在来源中是靠**振幅的幺正性检验**支撑的，
  不是靠一个已定义的数学结构。按 docs/STATUS_LEVELS.md，定义卡若依赖未定义对象取
  physical-argument。这也与「振幅是路径积分定义的对象」这条本批次的上限一致。

  **⚠ 表达式核实等级低于本批次多数节点**：(6.5.1)/(6.5.4) 只到 **L2**（目录条目级）。
  本卡片写出的表达式按抽取记录的转述，**未见任何来源逐字抄出**。
  这与 (6.3.2)/(6.3.4)/(6.6.10) 那几条（有 schrans-2020 + headrick-2008 双源逐字）形成对比。
