id: spectrum.chan-paton-factors
kind: definition
status: physical-argument
title: Chan–Paton 因子：开弦端点的指标与厄米矩阵 λ^a
statement: |
  给开弦的两个端点各附一个离散指标 i, j ∈ {1,…,n}（**Chan–Paton 指标**）。
  态基记作 |N; k; i j⟩（N 为振子激发、k 为动量），一般态写成
    |N; k; a⟩ = Σ_{i,j} |N; k; i j⟩ λ^a_{ij}   （(6.5.1)），
  其中 λ^a 是 n×n 矩阵（**Chan–Paton 波函数**），a 标记基。

  **(1)（厄米性）** λ^a 必须取**厄米**矩阵：Chan–Paton 指标携带可观测的量子数，
  相应算符的本征值须为实。取 {λ^a} 为 n×n 厄米矩阵空间的一组基（共 n² 个）。

  **(2)（迹结构）** 世界面上开弦端点的指标沿边界相接（i 与相邻弦的 j 相同并求和），
  于是每个**循环序**的 n 点振幅带一个迹因子；四点情形
    tr( λ^{a₁} λ^{a₂} λ^{a₃} λ^{a₄} )   （(6.5.4)）。

  **(3)（不改变世界面动力学）** Chan–Paton 指标不参与世界面场论：
  它们不出现在作用量里，只在态的标记与振幅的迹因子中出现。
  因此谱的质量与 Chan–Paton 无关，只有简并度变为 n² 倍。

  **本卡片不断言什么**：不断言规范群是什么（取向弦给 U(n)、无取向弦给 SO(n) 或 USp(n)，
  见 spectrum.chan-paton-gauge-group）；不给出耦合常数关系（见
  spectrum.chan-paton-yang-mills-coupling）；不涉及 D 膜解释（属 branes area，本图 Phase 3）。
