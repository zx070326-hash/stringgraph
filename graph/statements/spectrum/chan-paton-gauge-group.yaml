  - conv.worldsheet-coordinate-length
sources:
  - ref: polchinski-1998-v1
    loc: "§6.5, eq. (6.5.21)（世界面宇称）、(6.5.23)、(6.5.25)–(6.5.27)、(6.5.30)、(6.5.31)，p.190–191"
    note: |
      literature/extractions/polchinski-1998-v1.md#E103，等级 **L1（[S] §6.59 正文读过，笔记 p.326）
      / 式号与表达式的对应只到目录级**（抽取记录 §7 明记这一点）。
      抽取记录的转述：「Ω_γ|N;k;ij⟩ = (−1)^{1+α'm}s^{a'}|N;k;ij⟩（(6.5.31) 附近）。
      投影出 Ω = 1 的无取向弦要求：对 α'm 为偶（含自旋 1 的态）需 M(λ^a)^T M = s^{a'}λ^a = −λ^a。
      ⚠ 抽取记录写的 α'm 是笔误：能级与 α'm² = N − 1 一一对应，相因子应为 (−1)^{1+α'm²}
      （reviewer-ch6 2026-09-11 订正；本卡 statement 已按 m² 写）。
      结果：**取向开弦的 CP 因子给 U(n) 规范对称；无取向开弦按投影方式给 SO(n) 或 Sp(n/2)（n 偶）**。」
      ⚠ 上式中 Ω 的作用写成对 |N;k;ij⟩ **本身**的本征值（而非映到 |N;k;ji⟩）是抽取记录的措辞；
      本卡片按标准做法写成带转置的形式并注明，**这是 curator 的改写**。
  - ref: schrans-2020
    loc: "§6.59（笔记 p.326）（核对源）"
tags: [spectrum, open-string, chan-paton, gauge-group, unoriented, orientifold, worldsheet-parity]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E103 建立。

  **⚠ 记号说明（USp vs Sp）**：抽取记录（转述 Polchinski）写「**Sp(n/2)**（n 偶）」，
  即用「Sp(k)」表示 2k×2k 的紧致辛群；现代多数文献写 **USp(n)** 或 Sp(n/2) 视约定而定，
  两者指同一个群，只是秩的记法不同。本卡片写 **USp(n)**（n 为 Chan–Paton 指标个数）
  并在此注明与来源记号的对应：**USp(n) = Polchinski 的 Sp(n/2)**。
  下游若比较文献务必先对齐这个记号。

  **⚠ 与 E80 主公式的关系**：抽取记录 E103 备注指出无取向弦对应主公式 (5.3.9) 里的
  **1/n_R 因子**（除以离散对称群的阶）。那属第 5 章，本批次提交时无节点，
  推导 gaps 里注明**待 ch5 节点合入后补边**。

  **来源等级**：本卡片是本批次中来源最弱的几条之一——[S] 的正文读过（L1），
  但式号与表达式的对应只到目录级，headrick-2008 在这一节**没有覆盖**。
