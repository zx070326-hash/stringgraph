id: spectrum.chan-paton-gauge-group
kind: proposition
title: Chan–Paton 规范群：取向开弦给 U(n)，无取向开弦按 Ω 投影给 SO(n) 或 USp(n)
statement: |
  给开弦附上 Chan–Paton 指标（spectrum.chan-paton-factors）。则开弦谱中的无质量矢量态
  按 λ^a 的自由度组织成规范玻色子，其规范群为：

  **(1)（取向开弦）** 不作无取向投影时，λ^a 跑遍全部 n×n 厄米矩阵（n² 个），
  规范群是 **U(n)**。

  **(2)（无取向开弦）** 世界面宇称 Ω（worldsheet.worldsheet-parity）作用在带 CP 的态上，
  除翻转世界面定向（因而**转置** Chan–Paton 矩阵）外还带一个依赖能级的相因子：
    Ω |N; k; ij⟩  ∝  (−1)^{1+α'm²} · （由 M 决定的共轭）· |N; k; ji⟩，
  形式上写作 λ^a ↦ M (λ^a)^T M^{−1} 乘上述相因子（(6.5.31) 附近）。
  投影到 Ω = +1 的子空间后，对**含无质量矢量（α'm² = 0，即上式相因子为 −1）的能级**，
  存活条件是
    M (λ^a)^T M^{−1} = − λ^a。
  于是规范群由 M 的类型决定：
    - M 对称（可取 M = 1）：λ^a 为反对称的厄米矩阵，即 λ^a = iA、A 实反对称
      （SO(n) 的厄米生成元是纯虚反对称矩阵，不是实反对称矩阵）⇒ **SO(n)**；
    - M 反对称（n 必为偶）：⇒ **USp(n)**（Polchinski 记作 Sp(n/2)，见 notes 的记号说明）。

  ⚠ **关键点：SO/USp 的二选一由无取向投影（M 的选取）决定，不是自由选择规范群。**

  **本命题不断言什么**：不论证 M 的可能形式为何只有对称与反对称两类
  （那需要 Ω² = 1 的约束分析，来源有而本图未抽取）；不给出各能级的完整投影结果；
  不涉及 orientifold 的现代表述（属 branes area）。
uses_conventions:
