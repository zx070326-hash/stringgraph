id: spectrum.sphere-n-tachyon-expectation-value
kind: proposition
title: 球面上 n 个 tachyon 顶点算子的期望值 = i C^X_{S₂}(2π)^d δ^d(Σk) ∏_{i<j}|z_ij|^{α'k_i·k_j}
statement: |
  设 d 个自由标量在 S₂ 上按 worldsheet.free-scalar-cft-action 的欧氏作用量做路径积分，
  插入 n 个按 spectrum.vertex-operator-geodesic-renormalization 重整化的指数型（tachyon）
  顶点算子 [e^{i k_i · X(σ_i)}]_r，坐标用 z 片写作 z_i。则
    ⟨ ∏_{i=1..n} [ e^{i k_i · X(σ_i)} ]_r ⟩_{S₂}
      =  i C^X_{S₂} (2π)^d δ^d( Σ_i k_i )  ∏_{i<j} | z_ij |^{α' k_i · k_j},
    z_ij ≡ z_i − z_j,
  其中 C^X_{S₂} 是与动量、坐标无关的归一化常数（数值不由本命题定出）。

  关键结构：**共形因子 ω（度规的 Weyl 部分）与 Green 函数的非普适部分 f(z_i, z̄_i) 全部相消**，
  只剩普适的 |z_ij| 幂次；相消的机制是动量守恒 Σ_i k_i = 0（外加 tachyon 的质量壳条件），
  见 spectrum.tachyon-expectation-conformal-factor-cancellation。

  **本命题不断言什么**：不是 S-矩阵元（还要乘鬼场期望值、e^{−λχ}、并对未固定坐标积分）；
  不给出 C^X_{S₂}；不涉及 D₂、RP₂ 上的对应表达式（(6.2.33)、(6.2.38)，本图未建，见 notes）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
