    note: 抽取记录 #E92，L1。本式的两个输入。
tags: [spectrum, tree-level, sphere, tachyon, closed-string, correlator, path-integral]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E93 建立。

  **⚠ 上游 ch5 节点尚未进入 main**：「S-矩阵 = 规范固定路径积分 (5.3.9)」属第 5 章
  （抽取记录 E80），本批次提交时无节点。本卡片只陈述 X 部门的**期望值**（不是 S-矩阵），
  故这一缺失不影响陈述本身；但把它接成振幅时需要那条边，**待 ch5 节点合入后补**。

  **D₂ 与 RP₂ 的对应表达式本批次不建节点**：(6.2.32)/(6.2.33)（D₂ 的 Green 函数与 tachyon 期望值）
  只到 L2（抽取者只读到目录条目）；(6.2.38)（RP₂ 的 Green 函数）被 [S] 指为**原书有误**且
  该更正**不在**官方勘误表上（抽取记录 E95、Q14）。在原书与勘误表都取不到的情况下建节点
  会把未经证实的第三方更正固化进图，故跳过，列入报告的「未做条目」。
  ⚠ 因此本图目前**没有**开弦（D₂）版本的 X 部门期望值节点：
  spectrum.open-string-three-tachyon-amplitude 与 spectrum.open-string-four-tachyon-amplitude
  的推导直接引 (6.4.2)/(6.4.5)，并在 gaps 里记下这一缺环。
