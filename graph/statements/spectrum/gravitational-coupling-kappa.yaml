id: spectrum.gravitational-coupling-kappa
kind: proposition
title: 闭弦耦合关系 g_c = α' g'_c / 2 与引力耦合 κ = π α' g'_c
statement: |
  在 S₂ 上（μ = 0、κ_CKV = 6，故六个 c 插入、无 b 插入、χ = 2、Euler 因子 e^{−2λ}）
  计算「一个无质量闭弦（极化张量 e_{μν}）+ 两个 tachyon」的树振幅 (6.6.14)，
  并与场论树图比较（用 tachyon 的低能有效作用量 (6.6.16) 与 Einstein 框架下正则归一化的引力子）。则
    **g_c = α' g'_c / 2**   （(6.6.15) 附近），
    **κ = π α' g'_c**，
  其中 g_c 是闭弦顶点算子的归一化、g'_c 是无质量闭弦（引力子）的耦合、
  κ 是引力耦合（κ² = 8πG_N 型的归一化）。

  ⚠ **极化张量的迹陷阱**（headrick-2008 逐字）：上述弦计算中所用的无质量闭弦极化张量 e
  的**迹代表 dilaton，不是（Einstein 框架下）引力子的迹**——后者总可以被规范掉。
  比较场论时不得把 tr e 当作引力子自由度。

  **本命题不断言什么**：不给出 (6.6.14) 的显式表达式；不给出 tachyon 有效作用量 (6.6.16)、
  三个无质量闭弦振幅 (6.6.19)/(6.6.21) 的表达式（那些只到 L2）；
  不断言弦论低能极限就是 Einstein 引力（只做了这一个耦合的比较）。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
sources:
  - ref: headrick-2008
    loc: "Problem 6.11(b)(c)（PDF p.49–51）：g_c = α'g'_c/2（式 (70)，「Comparison with (64) shows that」）与 κ = πα'g'_c（式 (76)，「Comparison with the amplitude (6.6.14) shows that」）；迹陷阱在 p.51"
    note: |
      literature/extractions/polchinski-1998-v1.md#E107，等级 **L1**。
      抽取记录逐字：「**这两个数值关系有 [H] 的独立背书**」；迹陷阱逐字：
      「The trace of the massless closed string polarization tensor e used in the string calculations
      of parts (a) and (b) above **represents the dilaton, not the trace of the (Einstein frame)
      graviton, which can always be gauged away**.」
      ⚠ 按 lead 裁决（2026-09-10）：Headrick 习题解答在「对某个显式计算是唯一成文来源」时
      可作为推导 source，但 **reviewer 须复核计算**。
  - ref: polchinski-1998-v1
    loc: "§6.6, p.194–195：eq. (6.6.14)（一个无质量闭弦 + 两个闭弦 tachyon 的振幅 = −(πiα'/2)g'_c e_{1μν}k^μ_{23}k^ν_{23}(2π)²⁶δ²⁶(Σ_i k_i)）、(6.6.15)（g'_c = 2g_c/α'）、(6.6.16)（tachyon 时空作用量）、(6.6.17)（G̃_{μν} = η_{μν} − 2κ e_{μν}e^{ik·x}，Einstein 度规）、(6.6.18)（κ = πα'g'_c = 2πg_c）；三个无质量闭弦的振幅是 (6.6.19)/(6.6.20)"
    note: |
      抽取记录 #E107（schrans-2020 §6.67，笔记 p.333）
      + **§12.8（原书核实，2026-09-11，p.194–195）**。
      **本条 source 的等级由 L1（式号）/ L2（表达式）升为 L1（原书 §6.6 落实表）**，
      §12.8 的 §6.6 落实表逐项给出：
      | 内容 | 式号 |
      | 一个无质量闭弦 + 两个闭弦 tachyon 的振幅 = −(πiα'/2)g'_c e_{1μν}k^μ_{23}k^ν_{23}(2π)²⁶δ²⁶(Σk_i) | (6.6.14) |
      | **g'_c = 2g_c/α'** | **(6.6.15)** |
      | 闭弦 tachyon 的时空作用量 S_T = −½∫d²⁶x(−G)^{1/2}e^{−2Φ̃}(G^{μν}∂_μT∂_νT − (4/α')T²) | (6.6.16) |
      | G̃_{μν} = η_{μν} − 2κe_{μν}e^{ik·x}（**Einstein 度规**） | (6.6.17) |
      | **κ = πα'g'_c = 2πg_c** | **(6.6.18)** |
      | 三个无质量闭弦的振幅 | (6.6.19)/(6.6.20) |
      → **本卡片 statement 的两条关系都得到原书印证**：
      (a) statement 的 g_c = α'g'_c/2 与 (6.6.15) 的 g'_c = 2g_c/α' **是同一式的两种写法**
          （§12.8 也如此标注：「✓（旧记录写 g_c = α'g'_c/2，等价）」）；
      (b) statement 的 κ = πα'g'_c 与 (6.6.18) **逐字一致**，
          且原书**多给了一步 κ = 2πg_c**（把 (6.6.15) 代进去的结果），本卡片 statement 里没有这一半。
      ⚠ **两处 loc 订正**：
      1. **旧 loc 把「三个无质量闭弦」记在 (6.6.19)、(6.6.21) 上，(6.6.21) 是错的。**
         按 §12.8，(6.6.21) 是 J(s,t,u,α') = −2 sin πα_c(t) I(s,t,4α') I(t,u,4α')
         （四点开/闭弦积分关系，见 spectrum.open-closed-four-point-relation-weak）；
         三个无质量闭弦的振幅是 **(6.6.19)/(6.6.20)**。
      2. 旧 note 说「(6.6.19)/(6.6.21) 只到目录级（L2）」——(6.6.19)/(6.6.20) 现已在 §12.8 的
         落实表里（**式号 L1**），但 **§12.8 仍未抄出它们的表达式**，故本卡片仍不写其表达式。
      ⚠ **原书本身在此处的自承缺口（§12.8 引 p.197，L1，不入陈述）**：
      「**We will not work out these numerical factors here, but will obtain them in an indirect way
      in chapter 8.**」——即圆盘/RP₂ 上单个闭弦顶点算子的数值因子留到第 8 章，
      这正是 §8.7 那条 g_o²/g_c 链的动机。
tags: [spectrum, tree-level, closed-string, graviton, gravitational-coupling, kappa, effective-field-theory, dilaton]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E107 建立。

  **这条在图里的位置**：它是「闭弦谱里的无质量对称张量 = 引力子」这一断言在**耦合层面**的兑现，
  也是弦长度尺度 α' 与 Newton 常数之间关系的来源。
  本图**没有**「闭弦无质量态含引力子」的陈述节点（那属第 3 章的顶点算子分类，
  抽取记录未覆盖），故本卡片把它作为**前提**写在 statement 的措辞里而不建边。

  **⚠ 迹陷阱值得下游注意**：任何把 e_{μν} 与场论中的 h_{μν} 直接等同的节点都会踩这个坑。
  本卡片把 [H] 的逐字警告写进 statement，使它随节点传播。
  **原书核实的一个佐证（2026-09-11，§12.8）**：原书 (6.6.17) 写的是
  G̃_{μν} = η_{μν} − 2κ e_{μν} e^{ik·x}，且 §12.8 明标它是 **Einstein 度规**（带波浪号 G̃）。
  这与 [H] 的警告（e 的迹是 dilaton，不是 Einstein 框架引力子的迹）指向同一件事：
  **e_{μν} 与 Einstein 框架度规扰动之间隔着一次 Weyl 重标度**，不可直接等同。

  **⚠ 本卡片未纳入的一半（2026-09-11 记录）**：原书 (6.6.18) 是 **κ = πα'g'_c = 2πg_c**，
  比本卡片 statement 的 κ = πα'g'_c 多给了 **κ = 2πg_c** 这一步（把 (6.6.15) 代入即得）。
  按 graph/CLAUDE.md 不得改陈述文本，故这半条**留在 notes**；
  若下游需要 κ 与 g_c 的直接关系，应新建节点或由本卡片 + (6.6.15) 自行合成。
