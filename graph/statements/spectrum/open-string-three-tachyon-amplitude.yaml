notes: |
  由 curator 于 2026-09-11 从抽取记录 E97 建立。

  **⚠ 本卡片依赖两处未核实**：(a) 勘误依赖（见 sources）；(b) [S] 的转录笔误订正。
  两者都记录在案。结论 (2)(3)「振幅与 y 无关」本身有独立支撑（2α'k_i·k_j = −1 是初等运动学，
  见 spectrum.mandelstam-invariants-sum-rule 的同类计算），不因这两处而悬空。

  **⚠ 上游 ch5 节点尚未进入 main**：「S-矩阵 = 规范固定路径积分 (5.3.9)」与「FP 手续给出 c 鬼插入」
  属第 5 章，本批次提交时无节点。推导 gaps 里注明**待 ch5 节点合入后补边**。

  **「+ (k₂ ↔ k₃)」项的来源**是边界三点的两种循环序；抽取记录 E90 在这一点上存在
  文献歧义（[S] 的逐字句子与转述相反），见 worldsheet.disk-conformal-killing-group 的 notes。
  本卡片里这一项的存在**反过来是那处歧义的书内旁证**。
