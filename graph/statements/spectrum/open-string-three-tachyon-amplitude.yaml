id: spectrum.open-string-three-tachyon-amplitude
kind: proposition
title: 开弦三 tachyon 树振幅与三个固定位置无关（PSL(2,R) 把三点函数完全定死）
statement: |
  在圆盘 D₂（上半平面）上取三个开弦 tachyon 顶点算子 g_o [e^{i k_i · X(y_i)}]（边界正规序，
  (3.6.25)），插在边界实轴的 y₁, y₂, y₃ 处；按 worldsheet.disk-conformal-killing-group，
  这三个位置由 PSL(2,R) 固定，Faddeev–Popov 手续给出三个 c 鬼插入
  （worldsheet.bc-ghost-disk-three-c-correlator），Euler 项给 e^{−λχ}（χ(D₂) = 1）。则：

  **(1)** 振幅的形式为
    S_{D₂}(k₁; k₂; k₃)
      = i g_o³ C_{D₂} (2π)²⁶ δ²⁶(Σ_i k_i)
        |y₁₂|^{1+2α' k₁·k₂} |y₁₃|^{1+2α' k₁·k₃} |y₂₃|^{1+2α' k₂·k₃}
        + ( k₂ ↔ k₃ ),
  第二项来自边界上三点的**另一个循环序**（worldsheet.disk-conformal-killing-group (2)）。

  **(2)** 由开弦 tachyon 的质量壳条件 k_i² = 1/α' 与动量守恒 Σ_i k_i = 0 得
    2α' k_i · k_j = −1   (i ≠ j)，
  故 (1) 中三个指数 1 + 2α'k_i·k_j **全为零**：振幅与三个位置 y₁, y₂, y₃ **完全无关**，
  等于一个常数乘 δ²⁶(Σk_i)。

  **(3)** (2) 正是 PSL(2,R) 不变性的直接体现：三点函数被共形对称完全定死，
  与「固定哪三个点」无关——这是本书里第一处出现该现象。

  **本命题不断言什么**：不给出 (6.4.4) 的显式前因子（两种循环序合并后的常数，本图未核实）；
  不定 C_{D₂}（那由四点因子化定出，见 spectrum.four-tachyon-factorization-disk-normalization）。
