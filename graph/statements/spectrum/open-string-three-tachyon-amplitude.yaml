      correction on Joe's errata page**」——即他认为印刷版 (6.4.2) 有误，用的是勘误表更正版。
      **Polchinski 官方勘误表本项目未能取得**（KITP 三条 URL 全部 404），故「印刷版有误」这一事实
      只有 schrans-2020 一个来源，本图无法核对更正内容。
      ⚠ **[S] 的一处转录笔误已订正**：他的 [6.98]/[6.100] 把第二个因子写成 |y₁₂|^{1+2α'k₁·k₃}，
      按对称性**应为 |y₁₃|**；抽取记录已按 |y₁₃| 修正，本卡片沿用该修正
      （**这是抽取者的修正，不是 [S] 的原文**）。
