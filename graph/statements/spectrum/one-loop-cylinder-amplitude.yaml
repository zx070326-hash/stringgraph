id: spectrum.one-loop-cylinder-amplitude
kind: proposition
title: "圆柱（annulus）真空振幅：Z_{C₂} = ∫₀^∞(dt/2t)Tr'_o[e^{−2πtL₀}]，26 维给 iV₂₆n²∫₀^∞(dt/2t)(8π²α't)^{−13}η(it)^{−24}"
statement: |
  圆柱 C₂ 是 0 ≤ Re w ≤ π、w ≅ w + 2πit 的世界面：宽 π、长 2πt 的带子把两端接起来。
  它有**一个模 t，跑遍 0 < t < ∞，且没有模群**（原书逐字：「Unlike the torus there is no
  modular group, the long-cylinder limit t → 0 being quite different from the long-strip limit
  t → ∞」），一个 CKV（平行边界的平移）。其真空振幅为

  (1)（**算符形式**）
        Z_{C₂} = ∫₀^∞ (dt / 2t) Tr'_o[ exp(−2πt L₀) ] ,
      迹取遍**整个开弦 CFT**，但**去掉鬼场零模**（这就是撇号 ' 的含义）。

  (2)（**一般平坦情形**）
        Z_{C₂} = i V_d ∫₀^∞ (dt/2t)(8π²α't)^{−d/2} Σ_{i∈H_o^⊥} exp[−2πt(h_i − 1)] ,
      H_o^⊥ 是开弦的横向 Hilbert 空间。

  (3)（**26 维平坦时空、n 个 Chan–Paton 自由度**）
        Z_{C₂} = i V₂₆ n² ∫₀^∞ (dt/2t) (8π²α't)^{−13} η(it)^{−24} 。
      n² 来自圆柱的**两条边界各挂一个 Chan–Paton 指标**（spectrum.chan-paton-factors）；
      η^{−24} 是 24 个横向模的**一侧**贡献（开弦只有一套振子，与环面的 −48 对照）。

  ⚠ **无取向理论里 (1)–(3) 各多一个因子 ½**（来自投影算符 ½(1+Ω)，原书在 (7.4.14) 下方
  逐字说明「there is an extra ½ in both the torus and cylinder amplitudes in the unoriented
  theory」）。本卡的表达式是**取向**理论的；tadpole 相消的计数用的是带 ½ 的版本，见
  spectrum.bosonic-unoriented-tadpole-cancellation-so8192。

  ⚠ **t → ∞ 端发散，来自开弦快子**（原书逐字：「As in the closed string there is a divergence,
  but only from the open string tachyon」）。t → 0 端的行为**不能**像环面那样靠模群截断
  （本卡第一段的「没有模群」），见 spectrum.cylinder-closed-channel-open-closed-duality。

  **本卡不断言什么**：不断言 t → 0 端的重解释（那是通道对偶那张卡）；
  不给出带开弦顶点算子的单圈散射振幅（原书说「Including tachyon vertex operators is
  straightforward」但未做）；不断言边界态 |B⟩ 表示（(7.4.11)–(7.4.13)，其归一化原书自承未定）。
