      ⚠ **原书自陈走的是「猜」那条路**（p.223 逐字）：「This can be obtained either by working out
      the path integral measure in terms of the ghost zero modes, as we did for the torus, **or by
      guessing (correctly) that we should again sum the point-particle result (7.3.9) over the open
      string spectrum**.」——第一条路（鬼场零模测度）只提及，**未做**。
tags: [spectrum, one-loop, cylinder, annulus, open-string, chan-paton, vacuum-amplitude]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E29 建立。
  **四曲面各一卡**（见 spectrum.one-loop-torus-amplitude 的 notes）。

  「没有模群」这一句不是修辞：它是 §7.4 全部发散讨论的前提（抽取记录 #E3 备注）。
  正因为没有模群，t → 0 的区域**不能**被基本域切掉，于是场论式的 UV 发散「看起来还在」；
  第 7 章解决它的办法不是截断，而是**换通道解释**（长闭弦），见
  spectrum.cylinder-closed-channel-open-closed-duality 与 spectrum.open-string-requires-closed-string。
