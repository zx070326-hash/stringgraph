id: spectrum.covariant-external-legs-on-shell
kind: proposition
title: "协变振幅外线的 on-shell 条件就是光锥质量壳：开弦 L_0 = 1 ⟺ α'k² = 1 − N ⟺ α'm² = N − 1；闭弦 (L_0, L̃_0) = (1,1) ⟺ α'k²/4 = 1 − N ⟺ α'm² = 4(N − 1)"
statement: |
  【设定】D = 26 个自由玻色子 X^μ 的世界面 CFT；约定 conv.metric-mostly-plus（m² = −k²）、
  conv.alpha-prime-regge、conv.intercept-sign-a（本图截距 a = −A，Polchinski 的 A = −1 即 a = 1）、
  conv.virasoro-standard、conv.worldsheet-complex-coords。
  「协变振幅」指 worldsheet.string-s-matrix 的主公式 (5.3.9)：每条外线是一个顶点算子插入
  V_j(k, σ)，其对应态按 worldsheet.state-operator-isomorphism 记为 |V⟩ ∈ F；
  设 |V⟩ 落在时空动量 k、level N 的扇区（level 分级同 worldsheet.bosonic-fock-space）。

  (1) **开弦外线（边界插入）。**
      「V 是**权 1 的主场**」 ⟺ 「L_n|V⟩ = 0 ∀ n > 0（主场性）**且** L_0|V⟩ = |V⟩」。
      其中**后一半**（L_0 条件）在动量 k、level N 的扇区上等价于
        α' k² + N = 1,  即  **α' k² = 1 − N**,
      因为在该扇区上 L_0 就是标量 α'k² + N 的乘法
      （worldsheet.open-string-l0-equals-level-plus-mass）。
      配 m² = −k² 即
        **α' m² = N − 1**。
      特别地 N = 0（tachyon，V = :e^{ik·X}:，边界权 h = α'k²）给 α'k² = 1，α'm² = −1；
      N = 1（V = e·∂X e^{ik·X}）给 α'k² = 0，α'm² = 0。

  (2) **闭弦外线（体内插入）。**
      「V 是**权 (1,1) 的主场**」 ⟺ 「L_n|V⟩ = L̃_n|V⟩ = 0 ∀ n > 0 **且** L_0|V⟩ = L̃_0|V⟩ = |V⟩」。
      L_0 条件的那一半在动量 k、左右 level (N, Ñ) 的扇区上等价于
        α' k²/4 + N = 1  与  α' k²/4 + Ñ = 1,
      即 **α' k²/4 = 1 − N** 与 **N = Ñ**（后者是 (L_0 − L̃_0)|V⟩ = 0，即
      worldsheet.closed-string-level-matching 的协变写法；闭弦零模归一化
      α^μ_0 = (α'/2)^{1/2} k^μ 见 worldsheet.closed-string-mode-expansion，
      故闭弦的 (1/2) α_0·α_0 = α' k²/4）。配 m² = −k² 得
        **α' m² = 4 (N − 1)**。
      特别地 N = Ñ = 0（tachyon，体内权 (α'k²/4, α'k²/4)）给 α'k² = 4，α'm² = −4。

  (3) **与光锥谱逐能级一致（本命题的桥内容）。**
      (1)、(2) 给出的允许动量集合分别与
        worldsheet.open-string-mass-shell（a = 1 时 α'm² = N − a = N − 1）、
        worldsheet.closed-string-mass-formula（a = ã = 1 且 level matching 时 α'm² = 4(N − 1)）
      **逐能级重合**；且在 D = 26、a = 1 时两侧的态空间本身也同构，
        H_OCQ ≅ H_light-cone
      （Polchinski (4.1.20)，证明在 §4.4 (4.4.21)；本图由 worldsheet.no-ghost-theorem-v4
      的**同构半**承载：逐动量塔上 H_phys/H_0 ≅ 24 个横向振子的 Fock 空间）。
      结论：**在 D = 26、a = 1 的玻色弦中，把光锥量子化算出的质量谱直接用作协变振幅外线的
      on-shell 条件是合法的**——(1)(2) 保证「允许动量」的集合相同，
      H_OCQ ≅ H_light-cone 保证每个允许动量上的**态的个数**也相同。

  【本命题**不**断言什么】——六条边界，每条对应一处别的节点或一处已知缺口：
  (a) **不**断言 (5.3.9) 的路径积分有定义、收敛，或对拓扑的求和收敛
      （worldsheet.string-s-matrix 自身已声明不断言这些）。
  (b) **不**断言「权 1 / 权 (1,1) ⟹ 积分后的顶点算子共形（Weyl）不变 ⟹ 振幅良定义」这一步是严格的。
      原书把它作为 §3.6 的条件引用（p.125 逐字「This agrees with the condition from section 3.6
      that the integrated vertex operator be conformally invariant」），本图**没有** §3.6 那条条件的节点。
      本命题只把「外线是权 1 / (1,1) 主场」当作**外线的定义性要求**接受下来，
      断言的是它的 L_0 一半与光锥质量壳等价。
  (c) **不**断言零模态（null states）在振幅中解耦，也不断言振幅只依赖 H_OCQ = H_phys/H_null 的等价类。
      本图无该命题的节点。
  (d) **不**断言 (D, a) ≠ (26, 1) 时的任何内容：H_OCQ ≅ H_light-cone 只在 (26, 1) 成立
      （D > 26、a = 1 时的反例见 worldsheet.negative-norm-physical-state-above-26）。
  (e) **不**给出激发态顶点算子的显式形式，只断言其对应态的 L_0 本征值所满足的条件。
  (f) **不**断言外线动量必须实，也不断言解析延拓到壳外的合法性；振幅中出现的 Mandelstam
      变量按 spectrum.mandelstam-invariants-sum-rule 处理，那里的 m_i² 由本命题供给。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.intercept-sign-a
