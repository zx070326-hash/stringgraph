sources:
  - ref: polchinski-1998-v1
    loc: "§4.1, p.125 散文（紧接 (4.1.22)/(4.1.23)），逐字：「The condition (4.1.22) requires the weight of the matter state to be 1… the vertex operator must then be a weight 1 or (1,1) tensor. This agrees with the condition from section 3.6 that the integrated vertex operator be conformally invariant, which gives another understanding of the condition A = −1.」"
    note: |
      这是本卡 (1)(2) 的**直接来源**：外线顶点算子是权 1 / (1,1) 张量，且原书自己把它与
      A = −1（本图 a = 1）的截距条件对应起来。
      抽取记录 literature/extractions/polchinski-1998-v1.md（researcher 第六轮 §4.1 原书核实段，
      「p.125 另一句（旧记录没有，对顶点算子链有用）」），证据等级 L1（页图逐字）。
  - ref: polchinski-1998-v1
    loc: "§4.1, eq. (4.1.11a)：L^m_0 = α'p² + α_{−1}·α_1 + …；eq. (4.1.16)：m² = (1+A)/α'（level 1 的协变质量壳）"
    note: |
      (4.1.11a) 是本卡 (1) 里 L_0 = α'k² + N 的原书形式；(4.1.16) 是把 L_0 条件解出来的
      **level 1 实例**：α'm² = 1 + A = 1 − a，取 a = 1 得无质量。
      式号经 researcher 第六轮逐字核实（同一抽取记录段的表格：「(4.1.11a,b) ✓」「(4.1.16) ✓」）。
  - ref: polchinski-1998-v1
    loc: "§4.1, p.124, eq. (4.1.20)：H_OCQ = H_light-cone（A = −1 且 D = 26；原书注明「as will be shown in section 4.4」）"
    note: |
      本卡第 (3) 条的同构半。式号经 researcher 第六轮核实（逐字：「The OCQ at A = −1 and D = 26
      is in fact the same as light-cone quantization at all mass levels, H_OCQ = H_light-cone (4.1.20),
      as will be shown in section 4.4. It is only in this case that consistent interactions are known.」）。
  - ref: polchinski-1998-v1
    loc: "§4.4, eq. (4.4.21)：H_OCQ = H_BRST = H_light-cone（三者同构），配 (4.4.19)/(4.4.20)（上同调代表元与内积正定）"
    note: |
      (4.1.20) 的证明所在。⚠ 该证明用「下三角矩阵的一般性质」得 Ker(S+U) ≅ Ker S；
      在无穷维 Fock 空间上 (4.4.19) 的级数是否终止/收敛，抽取记录明记**需要论证**。
      这是本卡推导标 physical-argument 的理由之一。
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.36)（开弦光锥质量壳）；§1.4, eq. (1.4.8)（闭弦光锥质量公式）、(1.4.11)（level matching）"
    note: |
      第 (3) 条比较的光锥一侧；本图分别由 worldsheet.open-string-mass-shell 与
      worldsheet.closed-string-mass-formula、worldsheet.closed-string-level-matching 承载。
tags: [spectrum, vertex-operator, on-shell, mass-shell, ocq, light-cone, bridge, bosonic-string]
notes: |
  **本卡的用途（为什么建它）**：spectrum 区（Polchinski 第 6 章）的一批推导都要把
  「光锥量子化算出的 α'm² = N − 1 / 4(N−1)」当作**协变振幅外线**的 on-shell 条件用，
  而 §6 与 §1 互不引用，此前只能标 `inferred: true`。ROADMAP 把这条缺环记为待建
  （「光锥质量壳 → 协变振幅外线 on-shell」，reviewer-ch6 提出）。本卡承载这一步。

  **它承载的到底是哪一步**：不是「协变振幅外线必须是权 1 主场」（那是外线的**定义性要求**，
  见【不断言】(b)），而是**「权 1 主场的 L_0 条件 ⟺ 光锥质量壳」**这一等价，
  外加「两边的态空间在 (26, 1) 同构」。凡是只用到「某个 α'k² 值 = 某个能级的上壳条件」的下游推导，
  都可以把 inferred 边改挂本卡而撤掉 inferred；凡是还额外用到「振幅外线必须上壳」这一**框架**
  假设的，本卡不承载该框架，那部分保留 inferred 并在 note 里指向本卡。

  **可能的拆分（留给 reviewer 裁决）**：(1) 与 (2) 是两条命题（开弦、闭弦），
  它们在原书 p.125 的同一句里被一并断言（「a weight 1 or (1,1) tensor」）、
  推导也逐字相同（只差零模归一化 α_0 = (2α')^{1/2} k vs (α'/2)^{1/2} k），故本图暂合为一卡。
  若日后开闭弦分别出现独立推导，应拆成两卡并把本卡标 superseded_by。

  **记号**：Polchinski 的 A 与本图的 a 差一个符号（conv.intercept-sign-a：a = −A）。
  原书 (4.1.16) 写 m² = (1+A)/α'，本图写 α'm² = N − a 在 N = 1 上的实例 α'm² = 1 − a，
  两式在 a = −A 下逐字相同。
