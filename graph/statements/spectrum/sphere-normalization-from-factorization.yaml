notes: |
  由 curator 于 2026-09-11 按 reviewer-ch6 的建议从 spectrum.closed-string-four-tachyon-integral
  的原 (3) 拆出（该卡未合并 main，直接改文本；本卡是被 worldsheet.bc-ghost-sphere-cc-correlator
  陈述文本引用的那个 id）。

  **为什么拆**：「写出积分」与「从极点定归一化」是两个命题，后者额外依赖因子化（中间态传播子）
  与闭弦 tachyon 质量壳，不应拖累前者。它与开弦的
  spectrum.four-tachyon-factorization-disk-normalization 是同一手法在两种曲面上的版本。

  **⚠ 「中间态传播子」在本图中没有定义**：与开弦情形同一缺口，见推导 gaps。
