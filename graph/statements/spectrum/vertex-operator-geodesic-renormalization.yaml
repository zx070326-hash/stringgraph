tags: [spectrum, tree-level, vertex-operator, renormalization, normal-ordering, green-function]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E92 建立。

  **为什么 status = physical-argument（而不是 rigorous）**：本卡片是**定义卡**，但它定义的对象
  （泛函微分算符作用在路径积分插入上）依赖未定义的路径积分测度；按 docs/STATUS_LEVELS.md
  「definition 的 status 表示该定义卡本身的地位……physical-argument = 依赖路径积分等未定义对象」，
  取 physical-argument。它会把依赖它的一切振幅节点压到同一水平——这是有意的。

  **「G'_r 在重合点有限」这一句**：它是该方案的设计目的，本卡片把它写在 statement 里作为方案的
  **直接效果**而不是独立命题（其内容就是「减除核 = 短距离奇异部分」的同义反复）。
  若日后需要把它作为命题使用（例如论证 n 点函数的有限性），应另建 proposition 卡并给推导。

  **与既有节点的关系**：worldsheet.conformal-normal-ordering 处理的是**平面上**自由标量的正规序
  （减除 −(α'/2)ln|z|²）；本卡片是它在**弯曲世界面**上的推广（用测地距离代替 |z|），
  两者在平坦度规下相差一个共形因子 ω 的项——这正是
  spectrum.tachyon-expectation-conformal-factor-cancellation 处理的那个 ω。
  抽取记录 E95 另记一处**记号陷阱**：闭弦四 tachyon 振幅算的是普通正规序 :e^{ik·X}: 而不是
  [e^{ik·X}]_r，二者由「令 ω = 0」相联系，混用会差一个 exp(−(α'/4)Σ_i k_i² ω(z_i)) 因子。
