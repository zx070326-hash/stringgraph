id: spectrum.vertex-operator-geodesic-renormalization
kind: definition
status: physical-argument
title: 顶点算子的测地距离重整化 [F]_r 与重整化 Green 函数 G'_r = G' + (α'/2) ln d²
statement: |
  弯曲世界面上的顶点算子需要减除自缩并才有定义。本卡片固定所采用的减除方案（Polchinski §3.6）：
  对 X 的泛函 F，定义**重整化算符**
    [ F ]_r  =  exp( (1/2) ∫ d²σ d²σ2  Δ(σ, σ2)  δ/δX^μ(σ) · δ/δX_μ(σ2) )  F,
  其中减除核取**测地距离**的对数
    Δ(σ, σ2)  =  (α'/2) ln d²(σ, σ2),
  d(σ,σ2) 是世界面度规下两点的测地距离（这是 (3.6.5)/(3.6.9) 的方案；
  这里用 σ2 记第二个积分变量，原书写作带撇的 σ'）。

  **效果**：在期望值中，凡出现两点函数 G'(σ_i, σ_j) 的地方一律被换成
    G'_r(σ_i, σ_j)  =  G'(σ_i, σ_j) + (α'/2) ln d²(σ_i, σ_j)，
  它在 σ_j → σ_i 时**有限**（G' 的对数短距离奇异性被减除核逐字抵消）。
  边界上的算子另有**边界正规序**版本（(6.2.34)/(6.2.35)），本卡片不写出。

  **本卡片不断言什么**：不断言该方案唯一（不同减除核相差顶点算子的有限重定义）；
  不断言重整化后的算子仍是共形主场（那需要单独论证，见 notes）；
  不给出边界正规序的显式表达式。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.alpha-prime-regge
