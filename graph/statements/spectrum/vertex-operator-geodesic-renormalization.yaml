      笔记 p.284–285，逐页读到并逐步复现）。抽取记录明记这是「任务书要求的『正规化』在本章的
      第一个落点：振幅的有限性来自顶点算子的重整化（自收缩减除），不是来自任何整体正规化方案」。
      ⚠ §3.6 的 (3.6.5)/(3.6.9) 本身**本图没有节点**，抽取记录也未单独抽取，本卡片按 E92 的转述写。
