id: spectrum.virasoro-shapiro-amplitude
kind: proposition
title: Virasoro–Shapiro 振幅：闭弦四 tachyon 树振幅 = (8πi g_c²/α')(2π)²⁶δ²⁶(Σk)·C(−α_c(u), −α_c(t))
statement: |
  闭弦四 tachyon 树振幅（spectrum.closed-string-four-tachyon-integral 的复积分）等于
    **S_{S₂} = (8π i g_c² / α') (2π)²⁶ δ²⁶( Σ_i k_i ) · C( −α_c(u), −α_c(t) )**   （(6.6.10)），
  其中
    **α_c(x) = α' x / 4 + 1**   （闭弦领头 Regge 轨迹），
    **C(x, y) = 2π B(x, y, 1 − x − y)**,
    **B(x, y, z) = Γ(x)Γ(y)Γ(z) / ( Γ(x+y) Γ(x+z) Γ(y+z) )**。
  等价写法（headrick-2008 的形式）：
    S_{S₂} = i (2π)²⁶ δ²⁶(Σk_i) (16π² g_c²/α') · Γ(a)Γ(b)Γ(c) / ( Γ(a+b)Γ(a+c)Γ(b+c) )，
    a = −1 − α's/4,  b = −1 − α't/4,  c = −1 − α'u/4。
  两式等价：a = −α_c(s)、b = −α_c(t)、c = −α_c(u)，且由 α'(s+t+u) = −16 得
  α_c(s) + α_c(t) + α_c(u) = **−1**，故 c = 1 − a − b；整体因子 2π × (8πi g_c²/α') = 16π² i g_c²/α'。

  **本命题不断言什么**：不断言这是原书 (6.6.10) 的逐字排版形式（见 notes）；
  不给出极点留数的物理解释；不与开弦振幅作对比（那在 spectrum.open-closed-four-point-relation-weak）。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
sources:
  - ref: polchinski-1998-v1
    loc: "§6.6, eq. (6.6.10)，p.193"
    note: |
      literature/extractions/polchinski-1998-v1.md#E105，等级 **L1，且是本章表达式层面最硬的一条**：
      **两个独立二手源给出两种写法，经抽取者验证等价**。
      - schrans-2020 §6.64（笔记 p.329–331）：完整算出
        I(a,b) = ∫d²z|z|^{−2a}|1−z|^{−2b} = 2πB(1−a, 1−b, a+b−1)（[6.226]），
        代入得 [6.228]，并写下 α_c(x) = α'x/4 + 1 与 C(x,y) = 2πB(x,y,1−x−y)（[6.229]），
        末句「This gives us (6.6.10)」。
      - headrick-2008 Problem 6.11(b)（PDF p.50）逐字给出 Γ 商形式与 a,b,c 的定义。
      **⇒ 2026-09-11 升 L1：§14.2（原书核实，p.193 页图逐字）。**
      原书 (6.6.10) 逐字：
        `S_{S₂}(k₁;k₂;k₃;k₄) = (8π i g_c²/α') (2π)²⁶ δ²⁶(Σ_i k_i) C(−α_c(t), −α_c(u))`，
      「where `α_c(x) = 1 + α'x/4` and
        `C(a,b) = ∫_C d²z |z|^{2a−2}|1−z|^{2b−2} = 2π Γ(a)Γ(b)Γ(c)/(Γ(a+b)Γ(a+c)Γ(b+c)), a+b+c = 1`」（(6.6.11)）。
      **逐项对账**：前因子 `(8πi g_c²/α')(2π)²⁶δ²⁶(Σ_i k_i)` 与本卡片**逐字相同**；
      `α_c(x) = 1 + α'x/4` 与本卡片的 `α'x/4 + 1` 是**同一式**（仅项序）；
      配套的 `C_{S₂} = 8π/(α'g_c²)`（(6.6.8)）与 spectrum.sphere-normalization-from-factorization 一致。
      **旧 note 的「⚠ 2026-09-11 的原书核实没有覆盖本条（negative evidence）」整段已作废，本轮删除**
      ——那段说的是 §12.8 的 §6.6 落实表从 (6.6.13) 起、(6.6.10) 不在其中；§14.2 补上了 p.193 这一页。
      **loc 本身无需改**：`§6.6, eq. (6.6.10)，p.193` 经页图确认完全正确（p.193 = 该 PDF 第 28 页）。

      **⚠ 差异 1（参数顺序）**：**原书写 `C(−α_c(t), −α_c(u))`（先 t 后 u），本卡片写
      `C(−α_c(u), −α_c(t))`（先 u 后 t）。** 因 (6.6.11) 的 `C(a,b)` 在 a、b、c 三者中全对称
      （分子 `Γ(a)Γ(b)Γ(c)`、分母 `Γ(a+b)Γ(a+c)Γ(b+c)` 全对称，且 c 由 `a+b+c = 1` 定），
      **两者取值相同，故不换代**。但本卡片 statement 里那句免责——「不断言这是原书 (6.6.10) 的
      逐字排版形式」——的**确切所指，现在就是这个顺序差异**（以及差异 2 的记号差异）。

      **⚠ 差异 2（记号归属）**：**三参数记号 `B(x,y,z) = Γ(x)Γ(y)Γ(z)/(Γ(x+y)Γ(x+z)Γ(y+z))`
      是 schrans-2020 的记号，原书没有这个符号。** 原书 (6.6.11) 直接把 `C(a,b)` 写成 Γ 商，
      并由 `a + b + c = 1` 定义 c。本卡片 statement 里的 `B(x,y,z)` 与 `C(x,y) = 2πB(x,y,1−x−y)`
      因此是 **[S] 的写法，不是原书的写法**——这不影响取值，但引用时不得说成「原书的 B」。

      **⚠ 作者自承缺口（§14.2(c)）**：原书 p.193 逐字「the amplitude for four closed string tachyons
      can be expressed in terms of gamma functions (**exercise 6.10**)」
      ——**(6.6.5) → (6.6.10) 的计算在原书里是习题，正文不给推导**。
      故 polchinski-1998-v1 这条来源**只支持结果，不支持推导**；推导本身的唯一来源仍是
      schrans-2020 §6.64。见 spectrum.virasoro-shapiro-amplitude--via-complex-beta-integral 的 gaps。
      ⚠ 抽取记录**没有核对 exercise 6.10 本身**（章末 pp.203–205 一带，§14.4 F.2 的 negative evidence）。

      **两个二手源作为历史保留**：[S] §6.64 与 [H] Problem 6.11(b) 各自给出等价式并经抽取者验证等价，
      **两者都没有抄出原书排版**——这一点现在由 §14.2 补齐。
  - ref: headrick-2008
    loc: "Problem 6.11(b)（PDF p.50）：Γ 商写法，逐字"
    note: 第二独立源（L1）。
  - ref: schrans-2020
    loc: "§6.64（笔记 p.329–331）：复积分 I(a,b) 的完整计算与 C(x,y) 的定义（核对源）"
tags: [spectrum, tree-level, sphere, closed-string, tachyon, virasoro-shapiro, four-point, beta-function]
notes: |
  由 curator 于 2026-09-11 从抽取记录 E105 建立。

  **与 Veneziano 的对比（记账层面）**：抽取记录明写「**E105（Virasoro–Shapiro）是本章表达式层面
  最可靠的一条**（[S]+[H] 两个独立写法经抽取者验证等价），可以先行建节点；
  **E99（Veneziano）反而最弱**（没有任何源抄出 (6.4.23) 的完整表达式）」。
  这正是本图给 Virasoro–Shapiro 建**完整形式**、给 Veneziano 只建**弱形式**的原因。
  ⚠ 这条不对称是「文献核实状况」的反映，不是「哪条结果更可靠」的判断。

  **⚠ 上段的不对称已于 2026-09-11 消失（curator-ch6-sec14）**：
  §12.8 + §14.1 取得原书 p.183 的 (6.4.23)，开弦侧已建完整卡 spectrum.veneziano-amplitude；
  §14.2 取得原书 p.193 的 (6.6.10)，本卡片升 L1。**两侧现在都是原书页图直读的完整形式。**
  上段保留作为记账历史，不再反映本图的核实状况。

  **⚠ 一处开闭不对称（抽取者的观察，§14.2(d)，明确标为「不得作为原书陈述入库」）**：
  闭弦侧 (6.6.6) 的极点塔 `α's, α't, α'u = −4, 0, 4, 8, …` 原书紧跟一句
  「which are the masses-squared of the closed string states」，**没有任何「某些极点相消」的说明**，
  而且 p.194 明确**使用**了 s = 0 的极点（「Expanding the Virasoro–Shapiro amplitude (6.6.10)
  on the s = 0 pole and using unitarity determines g'_c = 2g_c/α'」，(6.6.15)）；
  开弦侧 p.183 却说 α's = 0 的极点在循环序之间相消
  （spectrum.even-level-open-string-poles-cancel-between-orderings）。
  **原书没有把这两处并排讨论**，本图也不据此作任何推论，只记在案。

  **⚠ 一处二手源内部矛盾已订正**：[S] 的 [6.236] 写「we have again used
  α_c(s)+α_c(t)+α_c(u) = 1」，而由他自己的脚注 8（α'(s+t+u) = −16）与 α_c 的定义得
  该和 = −4 + 3 = **−1**。本卡片采 **−1**（与 spectrum.mandelstam-invariants-sum-rule 一致）。
  抽取记录 E106 明记「**别照抄这句**」。这不影响 (6.6.12) 的幂次结论。
