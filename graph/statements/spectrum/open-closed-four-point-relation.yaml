id: spectrum.open-closed-four-point-relation
kind: proposition
title: 开/闭弦四点关系（完整形式，(6.6.23)）：A_c = [πi g_c²α'/(4g_o⁴)]·sin[πα_c(t)]·A_o(s,t,¼α',g_o)·A_o(t,u,¼α',g_o)*
statement: |
  闭弦四 tachyon 树振幅与开弦四 tachyon 树振幅之间成立
    **A_c(s, t, u, α', g_c)
      = ( π i g_c² α' / g_o⁴ ) · ¼ · sin[ π α_c(t) ]
        · A_o( s, t, ¼α', g_o ) · A_o( t, u, ¼α', g_o )^*  （上标星号 = 复共轭）**   （(6.6.23)），
  即整体比例常数为 **π i g_c² α' / (4 g_o⁴)**，其中
    **α_c(x) = 1 + α' x / 4**（闭弦领头 Regge 轨迹，(6.6.10) 一带），
  **第二个 A_o 取复共轭**（原书写法），而
  **两个 A_o 各自只包含六个循环置换中的一个**——原书 (6.6.22) 之后逐字：
  「where the open string amplitudes include just one of the six cyclic permutations,
  with poles in the indicated channels」。
  两个开弦振幅的 Regge 斜率取 **¼α'**（闭弦斜率的四分之一），而非 α'。

  这是 KLT（Kawai–Lewellen–Tye）型关系在树级四点的最简形式：**闭弦 = 两个开弦**。

  ⚠ **排版说明（属陈述的一部分）**：原书把系数排成**两个相邻的分式**——大分式
  `πig_c²α'` 在上、`g_o⁴` 在下，**紧跟一个独立的小分式 `¼`**；合并后即 `πig_c²α'/(4g_o⁴)`。
  两种排版同值，「逐字形式」应按前者记。

  ⚠ **不得同时引用 (6.6.21)**：原书 (6.6.21) 印的第三参数是 `4α'`，本图判定为**误印**
  （见 notes）；本命题**不依赖** (6.6.21)。

  **本命题不断言什么**：
  - **不断言 A_c 与 A_o 的定义式**（原书对二者的定义本图未逐字取得，见 sources note）；
    特别地，不断言 (2π)²⁶δ²⁶(Σk) 是否已从 A 中剥去。
  - 不断言整体符号/相位在别的共轭约定下不变；
  - 不断言一般 n 点的 KLT 关系；
  - **不给出「α'_open = α'_closed/4」的独立论证**——原书同页那句
    「if one sets α' = 2 in the closed string and α' = ½ in the open」**只针对张量结构**
    （(6.6.19) vs (6.5.15)、以及 (6.6.14)），原书没有把它等同于本式的参数替换规则。
uses_conventions:
  - conv.metric-mostly-plus
  - conv.alpha-prime-regge
  - conv.worldsheet-euclidean
sources:
  - ref: polchinski-1998-v1
    loc: "§6.6, eq. (6.6.23)，p.195；同页 (6.6.22) 之后一句给出「只取六个循环置换中的一个」"
    note: |
      literature/extractions/polchinski-1998-v1.md **§12.8**（首次页图：结构、sin、共轭）
      + **§14.3**（2026-09-11 第八轮，p.195 **两次独立渲染**：单页 + 双页，两次读出的字形一致）。
      **等级：L1（原书 p.195 页图逐字）。**

      **原书 (6.6.23) 逐字**：
        `A_c(s,t,u,α',g_c) = ( π i g_c² α' / g_o⁴ ) · ¼ · sin[π α_c(t)] A_o(s,t,¼α',g_o) A_o(t,u,¼α',g_o)^*`

      **三条判定（§14.3(a)）**：
      (1) **系数里的 `4` 确实在**（无论排版怎么归并）；§12.8 读出的 `πig_c²α'/(4g_o⁴)` 数值上正确。
      (2) **researcher 早先复算的 `πig_c²α'/g_o⁴` 缺一个 1/4，裁定为漏读了那个独立的 `¼`**
          ——同一行里出现三个 `¼`（另两个在 A_o 的参数里），极易漏。**旧卡 notes 里
          「这一差异尚未裁定」一句由此关闭。**
      (3) **`g_o` 的幂次是 4、`α'` 的幂次是 1**，两次渲染均清晰；
          §12.8 标的「L1-读图存疑（数值前因子）」**已撤销，升为 L1**。

      **第二条独立支持（抽取者的复算，标为推断，不作为原书内容）**：
      由 (6.6.4)+(6.6.8) 得 `A_c = (8πig_c²/α')J`；由 (6.4.23) 的「单个循环序」得
      `A_o(s,t,α'_o,g_o) = (2ig_o²/α')I(s,t,α'_o)`，取 `α'_o = ¼α'` 得 `A_o = (8ig_o²/α')I`；
      代入 `J = −2 sin[πα_c(t)] I(s,t,¼α') I(t,u,¼α')` 后，**`g_o⁴`、`α'¹`、以及 `1/4` 三者全部复现**。
      ⇒ **1/4 有两条独立支持：页图 + 复算。**
      ⚠ 但该复算**假定 A_c、A_o 是剥去 (2π)²⁶δ²⁶(Σk) 之后的振幅**——
      **原书对 A_c/A_o 的定义式本图未逐字取得**，故本卡片 statement 不断言这一点。
      ⚠ 复算原文亦声明「整体符号/相位随 A 的定义与共轭约定而变，本轮不裁定」。

      版本凭据（§14.0）：Cambridge Books Online 2005 平装数字化本（已含 2000 年 corrections），
      ch.6 = pp.166–205。
  - ref: schrans-2020
    loc: "§6.71 附近（笔记 p.339）：[6.270]（带 sin）/ [6.272]（不带 sin），核对源"
    note: |
      ⚠ **[S] 在这一处有两项与原书不符，均已裁定**：
      (1) [6.272] **漏掉 sin[πα_c(t)]**（他自己的 [6.270] 带 sin，两行自相矛盾）——原书带 sin；
      (2) [6.272] 的比例常数 `πig_c²α'/g_o⁴` **少一个 1/4**——原书是 `πig_c²α'/(4g_o⁴)`。
      ⚠ **一处分歧仍在案（未被证实或反驳）**：[S] 逐字「**I am not sure why the second A_o is
      conjugated in Joe's book.** As I(x,y) is manifestly positive, this would just change a sign,
      which is not needed. It may be due to **his sign error just below (6.6.21)**.」
      → **原书写共轭，本卡片跟随原书**；[S]「不需要共轭」的理由本图既未证实也未反驳
      （本项目没有核对「(6.6.21) 下方是否真有符号错」）。
tags: [spectrum, tree-level, klt, open-closed, four-point, sphere, disk, errata-dependent]
notes: |
  由 curator 于 2026-09-11 按抽取记录 §14.4 D.4 的建议新建（分支 agent/curator/ch6-sec14），
  是 spectrum.open-closed-four-point-relation-weak 的换代卡（弱卡已写 superseded_by 指向本卡）。
  弱卡只断言「分解为两个开弦振幅之积（α' → α'/4）乘一个三角因子」这个结构，
  本卡片写出完整表达式；换代的前提（数值前因子的读图存疑撤销）由 §14.3 满足。

  **⚠ 必带 note（§14.4 D.4 (iii)）——(6.6.21) 的印刷文本不可引用**：
  原书 p.195 印的是
    `J(s,t,u,α') = −2 sin π α_c(t) I(s,t,**4α'**) I(t,u,**4α'**)`   （(6.6.21)）
  （**两次独立渲染均读出普通字号的 `4`，无分数线**；而同一页 (6.6.23) 的两处印成 `¼α'`，
  小号叠分式，两种字形在同一页同一字体下可区分）。
  **本图判定 `4α'` 与原书自身的其余部分不自洽，数学上必须是 `¼α'`**，依据三条：
  (a) 由 (6.6.5) + (6.6.22) + (6.4.20) 复算：把 (6.6.5) 的指数写成
      `z^{a−1}z̄^{a−1}(1−z)^{b−1}(1−z̄)^{b−1}` 得 `a = −α_c(u)`、`b = −α_c(t)`；
      代入 (6.6.22)（`m_i = n_i = 0`）得
      `J = −2 sin[πα_c(t)]·B(−α_c(t),−α_c(u))·B(−α_c(s),−α_c(t))`；
      再由 (6.4.20) `I(s,t,α'_o) = B(−α_o(s),−α_o(t))`、`α_o(x) = 1+α'_o x`，
      要让 `α_o = α_c = 1+α'x/4` 必须取 **`α'_o = α'/4`**。
  (b) **同页上文原书自陈**：「if one sets α' = 2 in the closed string and α' = ½ in the open」
      ——开弦有效斜率是闭弦的 1/4。
  (c) (6.6.23) 用的就是 `¼α'`。
  ⇒ **(6.6.21) 的印刷文本不得直接引用**；本卡片不依赖它。
  ⚠ **诚实标注**：「印的是 4α'」是**读图结论**（两次渲染一致 + 同页字形对比），**不是 PDF 文本层**；
  「正确的是 ¼α'」是**抽取者的复算（推断）**，但有上述 (b)(c) 两条**原书内部**佐证。

  **⚠ Q28 开着（§14.4 E）**：(6.6.21) 的 `4α'` 是原印误，还是官方勘误表已收录而 2005 数字化本漏改？
  **本图无法判定**——**Polchinski 官方勘误表本项目仍未取得**（Q14，本轮 WebSearch 配额用尽未能检索）。
  若日后取得勘误表或 PDF 文本层/另一印次，应回来关闭 Q28。

  **⚠ 共轭的分歧仍在案（§14.4 D.4 (i)）**：原书写第二个 A_o 带复共轭，本卡片跟随原书；
  [S] 认为不需要共轭（理由：I(x,y) 显然为正，共轭只改一个符号），并猜测这与原书
  「(6.6.21) 下方的符号错」有关。**本项目没有核对 (6.6.21) 下方是否真有符号错**，
  故 [S] 的理由既未证实也未反驳。注意 §12.8/§14.3 读的原书已是**含 2000 年 corrections 的版本**，
  所以若 [S] 指的符号错在勘误表上则已被修正、若不在则共轭就是作者本意——**两者本图无法分辨**。

  **⚠ 开弦振幅只取一个循环置换（§14.4 D.4 (ii)）**：这是原书 (6.6.22) 之后的逐字限定，
  已写进 statement。因此本式右端的 A_o **不是** spectrum.veneziano-amplitude 的三项之和，
  而是其中一项（连同相应前因子）。引用时不要混淆。

  **本轮未核（negative evidence，§14.4 F）**：(6.6.24)/(6.6.25) 的完整内容（只见到 (6.6.24) 首行）；
  exercise 6.10 本身；figure 6.3(b)/(c)；(6.5.14)/(6.5.15)/(6.5.16)。
