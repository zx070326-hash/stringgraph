      amplitude (7.4.15) from the string path integral」）⇒ **正文本身没有做**。
tags: [spectrum, one-loop, klein-bottle, unoriented, cross-cap, vacuum-amplitude, dedekind-eta]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E36 建立。
  **四曲面各一卡**（见 spectrum.one-loop-torus-amplitude 的 notes）。

  **(1) 的 ⚠ 里那句「取向理论的环面与圆柱在无取向理论里也各多一个 ½」是本章计数的关键**：
  spectrum.one-loop-torus-amplitude 与 spectrum.one-loop-cylinder-amplitude 两卡给的是**取向**
  理论的表达式，做 tadpole 相加时必须补这个 ½（抽取记录 §0.4 的独立复算正是这么做的）。

  **2²⁶ 的来历**：(3) 的整体因子 2²⁶ 与 Möbius 带的 2¹³ 同源（26 = 2×13），
  它们相加正是 (7.4.24) 里 (2¹³ ∓ n)² 的展开。⚠ 但「2^{D/2} 是某种普适计数」这个说法
  **原书没有写**（抽取记录 Q4），不得当作原文陈述使用。
