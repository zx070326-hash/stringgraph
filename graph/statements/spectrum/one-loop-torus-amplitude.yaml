sources:
  - ref: polchinski-1998-v1
    loc: "§7.3, eqs. (7.3.5)(7.3.6), p.217（(1) 与 (2)）；一般 CFT 的 (7.3.8a)(7.3.8b), p.217（(3)）；测度与 CKG 的处理见 (7.3.1)–(7.3.4), p.216–217；τ₂ → ∞ 的发散见 (7.3.15)(7.3.16), p.219"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E17–#E21、#E25，
      等级 **L1（原书页图逐字；(7.3.6) 一页经单页重渲染复核）**。
      原文对本式的自评逐字（p.217）：「This vacuum amplitude is quite interesting and **will be our
      main focus**. Not only does it reveal the essential difference between the ultraviolet behaviors
      of string theory and field theory, but it has an important physical interpretation of its own.」
      原文关于指数的逐字：「Note the exponent −48, from the 24 left- and right-moving oscillators.
      The contribution of the ghosts cancels two sets of oscillators, leaving only the contribution of
      the transverse modes.」
tags: [spectrum, one-loop, torus, vacuum-amplitude, dedekind-eta, moduli, ghosts]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E19/#E20/#E21 建立。
  **本章的主角节点**，也是四张单圈曲面卡里唯一的闭、可定向面那张。

  **四曲面各一卡，不合成一卡**（lead 指示 + 项目原则 1）：环面 (7.3.6)、圆柱 (7.4.1)、
  Klein 瓶 (7.4.15)、Möbius 带 (7.4.22) 的依赖与下游用法都不同（环面靠模不变性截断，
  另三个靠 Ω 投影与 cross-cap 几何，且它们的 t → 0 发散要靠开闭弦通道重解释）。
  ⚠ **式号对应（lead 派工单里 Möbius 与 Klein 的式号写反了，此处按 L1 抽取纠正）**：
  (7.4.15) 是 **Klein 瓶**，(7.4.22) 是 **Möbius 带**；见抽取记录 #E36/#E37。

  **习题 7.12 的独立判据（本图未建卡）**：原书习题要求验证「环面真空振幅只在 D = 26、D' = 24 时
  模不变」，并引 Shapiro (1972)。⚠ 那是**习题**，且 Shapiro (1972) 在 literature/sources.bib
  **未登记**，故不作为 worldsheet.critical-dimension-* 的第五条路线建卡，只在此指路
  （抽取记录 §5-B4）。
