sources:
  - ref: polchinski-1998-v1
    loc: "§7.4「The Möbius strip」, eqs. (7.4.20)(7.4.21)(7.4.22)(7.4.23), p.228；cross-cap 表示与 s = π/4t 见 p.228 末–229 首；几何见 §7.1, eqs. (7.1.11)(7.1.12), p.208"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E5、#E37，
      等级 **L1（原书页图逐字）**。
      ⚠ **式号提醒**：**(7.4.22) 是 Möbius 带**、(7.4.15) 是 Klein 瓶
      （lead 派工单把两者写反了，此处按 L1 抽取纠正）。
      ⚠ 记号：原书写 **Sp(k)**，且明说「in our notation Sp(k) corresponds to n = 2k Chan–Paton
      states」；本图既有节点 spectrum.chan-paton-gauge-group 用的是 **USp(n)** 记法，
      两者的换算是 USp(n) = Sp(n/2)，见 notes。
      ⚠⚠ **(5) 不在这个 loc 之内**：抽取记录 #E37 逐条列出了 (7.4.20)–(7.4.23) 与 p.229 首段，
      其中**没有**这条 s → ∞ 展开。(5) 的来源见下一条 source。
  - ref: polchinski-1998-v1
    loc: "§7.4, eq. (7.4.23) 与 (7.4.24) 之间的未写步骤, p.228–229（原书跳过；本条是本图的补算）"
    note: |
      **(5) 不是原书文字，是本图的复算**：reviewer-ch7 于 2026-09-11 独立算出
      ϑ₀₀(0,2is/π)^{−12}η(2is/π)^{−12} = e^{2s} − 24 + O(e^{−2s})，curator 于同日复核
      （ϑ₀₀(0,τ) = ∏(1−q^m)(1+q^{m−1/2})²、η(τ) = q^{1/24}∏(1−q^m)，q = e^{2πiτ}，τ = 2is/π）。
      原书从 (7.4.23) 直接跳到 (7.4.24) 的合并结果，**中间这一步没有写**；
      抽取记录 §0.4 的独立复算也只用了「Möbius 给交叉项 ∓2·2¹³n」这个**结果**，
      没有展开出 −24。故本条按「本图补算」登记，不冒充原书逐字。
tags: [spectrum, one-loop, mobius-strip, unoriented, cross-cap, chan-paton, theta-function]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E37 建立。
  **四曲面各一卡**（见 spectrum.one-loop-torus-amplitude 的 notes）。

  **记号换算（必须显式）**：本卡沿用原书的 Sp(k) 记法（k = n/2）；本图既有的
  spectrum.chan-paton-gauge-group 写作 USp(n)（n 为 Chan–Paton 指标数，n 偶）。
  两者指同一群：**USp(n) = Sp(n/2)**。凡把本卡与那张卡连边的推导都要带这句换算。

  **下游**：(3) 的 ± 号、(4) 的 2¹³、(5) 的 −24 共同给出 (7.4.24) 里 (2¹³ ∓ n)² 的交叉项
  ∓2·2¹³n，见 spectrum.bosonic-unoriented-tadpole-cancellation-so8192。

  **2026-09-11 增补 (5)（reviewer-v1-ch7 CONFIRMED 的必修项）**：原先本卡只有 (3) 的
  「+ ↔ SO(n)」，而下游 tadpole 卡的 (7.4.24) 写「− ↔ SO(n)」，两处的 ± 约定相反却无任何说明，
  读者无法判断哪一处写错。(5) 把翻转的来源（闭弦通道展开的无质量系数 −24）显式登记，
  使两处都是对的且可核。**(5) 是本图补算，不是原书内容**，见 sources 第二条。
