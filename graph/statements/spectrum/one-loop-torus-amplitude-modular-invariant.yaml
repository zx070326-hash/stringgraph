    loc: "§7.3, eq. (7.3.7) 及其上下文, p.217"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E20，等级 **L1（原书页图逐字）**。
      原文逐字：「The amplitude has the important property of **modular invariance**. The product
      τ₂|η(τ)|⁴ is invariant by eq. (7.2.44), and **it is easy to check** that dτdτ̄/τ₂² (7.3.7)
      is modular-invariant as well.」
      ⇒ **两半分别是「归约到一条未证断言」与「留给读者」。**
  - ref: polchinski-1998-v1
    loc: "§7.2, p.210（τ → τ+1 的不变性「obviously」，τ → −1/τ 归约到 (7.2.44)，并称由此「generating the full modular group」）"
    note: |
      抽取记录 #E9。原书在这里用到「模群由 S 与 T 生成」这一结论而不证
      （本图有 worldsheet.modular-group-generated-by-s-and-t）。
tags: [spectrum, one-loop, torus, modular-invariance, dedekind-eta, measure]
notes: |
  由 curator 于 2026-09-11 从抽取记录 polchinski-1998-v1-ch7.md#E20 建立。

  **statement 里的配平是 curator 补的算术**：原书只写「τ₂|η|⁴ is invariant」与
  「dτdτ̄/τ₂² is modular-invariant」两句，**没有写出这两个不变式如何配成 (7.3.6) 的被积函数**。
  幂次是 **−12**（= −48/4），配平可机械核对，
  不改变任何断言，但如果 reviewer 复核后愿意留 `reviewer-verified` 记录，
  可作为把本卡推导升格的材料之一（另一半仍卡在 (7.2.44b)）。

  **下游**：spectrum.one-loop-uv-finiteness-from-modular-invariance 与
  worldsheet.modular-truncation-breaks-brst-decoupling 都以「F₀ 是正确的积分区域」为前提，
  而这个前提由本卡 + worldsheet.modular-fundamental-domain 共同承担。
