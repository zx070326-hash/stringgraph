id: spectrum.one-loop-torus-amplitude-modular-invariant
kind: proposition
title: "环面真空振幅的被积函数与测度分别模不变：τ₂|η(τ)|⁴ 不变、dτdτ̄/τ₂² 不变"
statement: |
  在 spectrum.one-loop-torus-amplitude 的 (7.3.6) 中，把被积表达式（含测度）拆成
    (dτ dτ̄ / 4τ₂)(4π²α'τ₂)^{−13}|η(τ)|^{−48}
      = (1/4)(4π²α')^{−13} · ( dτ dτ̄ / τ₂² ) · [ τ₂ |η(τ)|⁴ ]^{−12} ,
  即「模不变的测度」×「模不变的标量」的幂×常数（τ₂ 的幂次核对：τ₂^{−2}·τ₂^{−12} = τ₂^{−14}
  = τ₂^{−1}·τ₂^{−13} ✓）。则

  (1) **τ₂ |η(τ)|⁴ 在模群下不变**（由 math.dedekind-eta-modular-transformation 的推论）；
  (2) **测度 dτ dτ̄ / τ₂² 在模群下不变**；
  (3) 于是 (7.3.6) 的整个被积表达式（含测度）在模群下不变，
      故「在基本域 F₀ 上积分」这件事是良定义的：换一个基本域不改变结果。

  ⚠ **原书对 (2) 的论证是「it is easy to check」，没有做**；对 (1) 则整体归约到 (7.2.44)，
  而 (7.2.44) 在原书零证明（见 math.dedekind-eta-modular-transformation）。

  **本卡不断言什么**：不断言积分收敛（模不变性与收敛性无关）；
  不断言「模不变性 ⇒ D = 26」（原书把该方向留作习题 7.12 并引 Shapiro (1972)，本图未建卡）；
  不涉及带顶点算子时的模协变性（原书 §7.2 说「the expectation value with vertex operators is
  modular-covariant, taking into account the Weyl transformations of the operators」，
  并把验证留作习题 7.1）。
uses_conventions:
  - conv.worldsheet-euclidean
  - conv.worldsheet-complex-coords
  - conv.alpha-prime-regge
sources:
