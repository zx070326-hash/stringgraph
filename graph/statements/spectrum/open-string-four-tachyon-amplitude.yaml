notes: |
  由 curator 于 2026-09-11 从抽取记录 E98 建立。

  **⚠ 上游 ch5 节点尚未进入 main**（主公式 (5.3.9)、FP 手续），处理同本批次其它节点。

  **发散的处理方式值得记录**（任务书「正规化」在本章的第三个落点）：抽取记录 E98 逐字引 [S] §6.34：
  「In order to avoid any divergences, we first **replace the upper integration boundary 1 by r**,
  work in the region where the integrand is convergent and then **take the limit of r → 1**」
  ——即**解析延拓**，不是任何别的正规化方案。积分只在 Re(−α's−1) > 0 等条件下收敛，
  其余参数值由 Beta 函数的亚纯延拓定义（math.euler-beta-integral），
  端点发散则被解读为中间态极点（spectrum.four-tachyon-factorization-disk-normalization）。
