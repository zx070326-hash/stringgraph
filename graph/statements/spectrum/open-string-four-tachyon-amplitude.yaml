id: spectrum.open-string-four-tachyon-amplitude
kind: proposition
title: 开弦四 tachyon 树振幅：第四个坐标沿边界积分，给出 Beta 型积分 I(s,t)
statement: |
  在 D₂（上半平面）上取四个开弦 tachyon 顶点算子插在边界实轴上。PSL(2,R) 只能固定三个位置
  （worldsheet.disk-conformal-killing-group），**第四个位置 y 不能被固定，必须沿边界积分**。
  于是振幅形如
    S_{D₂}(k₁;…;k₄)
      = i g_o⁴ C_{D₂} (2π)²⁶ δ²⁶(Σ_i k_i) × [ 各循环序的积分之和 ]，
  其中每个循环序的积分在固定 y₁ = 0、y₂ = 1、y₃ → ∞ 后化为一维实积分。
  用 Mandelstam 变量（spectrum.mandelstam-invariants-sum-rule）写出时，
  区间 (0,1) 上的那一段是 Euler Beta 型积分
    I(s, t) = ∫₀¹ dy  y^{−α' s − 2} (1 − y)^{−α' t − 2},
  即 I(s,t) = B(−α(s), −α(t))，α(x) ≡ 1 + α' x 是开弦的领头 Regge 轨迹
  （math.euler-beta-integral、worldsheet.leading-regge-trajectory）。
  三个区间 (−∞,0)、(0,1)、(1,∞) 给出 s、t、u 三种通道的贡献。

  ⚠ **本卡片对表达式的核实程度**：「第四点须积分」「用 Mandelstam 变量改写」「结果是 Beta 型积分」
  三点有来源（(6.4.5)、(6.4.7)–(6.4.9)）；**上式中被积函数的具体幂次与整体前因子是 curator 由
  Veneziano 弱形式（[S] 的 [6.143]）反推的**，原书 (6.4.5) 的显式写法未核实，见 gaps。

  **本命题不断言什么**：不给出三段积分合并后的完整表达式（那是
  spectrum.veneziano-amplitude-weak，且只建弱形式）；不定 C_{D₂}。
