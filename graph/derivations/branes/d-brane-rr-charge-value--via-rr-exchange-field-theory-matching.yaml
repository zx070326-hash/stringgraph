id: branes.d-brane-rr-charge-value--via-rr-exchange-field-theory-matching
target: branes.d-brane-rr-charge-value
kind: physical-argument
status: physical-argument
depends_on:
  - id: branes.d-brane-tension
    note: 供给 τ_p² = (π/κ²)(4π²α')^{3−p}（(13.3.4)）；(13.3.7) 的第二个等号 μ_p² = e^{2Φ₀}τ_p² 由此与 κ = e^{Φ₀}κ₁₀ 得到。
  - id: branes.d-brane-bps-no-force
    note: 供给 𝒜_R–R = −𝒜_NS–NS（(13.3.2)）：弦论侧 R–R 交换振幅的大小完全由它给出。
  - id: branes.d-brane-rr-coupling
    note: 供给耦合形式 ∫ C_{p+1}（(13.2.7)）——(13.3.5) 的第二项；没有它 μ_p 无定义。
sources:
  - ref: polchinski-1998-v2
    loc: "§13.3, pp. 146–147：(13.3.5)（作用量、传播子 2κ₁₀²i/k²）→ (13.3.6)（场论 R–R 交换 −2κ₁₀²iμ_p²G_{9−p}(y)）→ 与 (13.3.2)+(13.3.1) 对照 → (13.3.7)"
    note: 抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E17（L1）。
summary: |
  (1) 场论侧：R–R 势的动能项 −(1/4κ₁₀²)∫|F_{p+2}|² 正则归一后传播子为 2κ₁₀²i/k²；
      两张荷为 μ_p 的膜交换 C_{p+1} 的振幅为 −2κ₁₀²iμ_p²G_{9−p}(y)（(13.3.6)，符号与 NS–NS 相反：排斥）。
  (2) 弦论侧：𝒜_R–R = −𝒜_NS–NS = −iV_{p+1}·2π(4π²α')^{3−p}G_{9−p}(y)（(13.3.2)、(13.3.1) 末行）。
  (3) 对照：μ_p² = (π/κ₁₀²)(4π²α')^{3−p}。与 (13.3.4) τ_p² = (π/κ²)(4π²α')^{3−p} 比较，
      κ² = e^{2Φ₀}κ₁₀² ⇒ μ_p² = e^{2Φ₀}τ_p² ≡ T_p²（(13.3.7)）。
gaps:
  - "**继承 branes.d-brane-bps-no-force 的核心缺口**：(13.3.2) 是超对称断言不是计算；故 μ_p 的值在弦论侧没有被独立算出，只是 τ_p 经 (13.3.2) 的转写。"
  - "**继承 branes.d-brane-tension 的缺口**：(13.3.1) 是 (10.8.4) 的修改版（§10.8 卡已在图上：worldsheet.type-i-tadpole-cancellation-so32-v2，2026-09-11 由 d-brane-tension 一侧挂边；原 gap 里「未合」的说法已过时）；前缀 π 幂次未定（Q3）。"
  - "**κ = e^{Φ₀}κ₁₀ 的对应**依赖低能有效作用量中 κ^{−2} ∝ e^{−2Φ} 的写法（§12.1），本图无十维超引力作用量节点；本推导按 conv.string-coupling-tension-ratio 记录的原书说法直接使用。"
  - "**|F_{p+2}|² 的归一化**（(13.3.5) 中 (−G)^{1/2}|F|² 的 1/(p+2)! 因子等）原书未展开，本图按 (13.3.5) 原样引用。"
author: curator-polchinski-v2-ch13
created: "2026-09-11"
