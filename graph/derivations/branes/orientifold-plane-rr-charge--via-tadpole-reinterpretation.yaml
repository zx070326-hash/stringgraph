id: branes.orientifold-plane-rr-charge--via-tadpole-reinterpretation
target: branes.orientifold-plane-rr-charge
kind: physical-argument
status: physical-argument
depends_on:
  - id: branes.d-brane-rr-coupling
    note: 供给「每张 D 膜发出 R–R 场线」（D 膜是 R–R 势的源）；原书 p. 142「field lines emerging from each D-brane」。
  - id: branes.d-brane-bps-half-susy
    note: |
      供给「整套 D 膜仍是 BPS 态」；原书 p. 142「the full set of D-branes is still a BPS state,
      being T-dual to the type I theory」。
  - id: susy.brane-charges-in-susy-algebra
    note: |
      供给「BPS 态的总质量与总荷线性 ⇒ 所有 D 膜荷同号」：原书 p. 142「the total mass is linear in the total
      charge for a BPS state」。这是含膜荷的代数 (13.2.9) 的饱和态性质；App. B 的 (B.2.39) 只对点粒子荷，
      不能直接用于 D 膜（appB 抽取记录 Q3）。⚠ (13.2.9) 原书自承「still not complete」。
      〔2026-09-11 去重：本边原指 `branes.brane-charges-in-susy-algebra`，该卡与本边现指的卡是并行重复建卡，
      lead 裁决保留 susy 版，故改指；note 内容与 inferred 状态（非 inferred）未变。〕
  - id: duality.t-duality-of-unoriented-theory
    note: |
      供给「Ω 在对偶坐标上 = 宇称 × 时空反射」⇒ 固定面（orientifold 面）与「体内有取向」；
      原书 p. 138 把超弦版外包给第 8 章（「by the same arguments as for the bosonic string in chapter 8」）。
      ⚠ 玻色弦卡；「2^k 张固定面」的计数在那张卡里没有写成命题。
  - id: branes.t-duality-changes-brane-dimension
    note: 供给「在 k 个方向上 T 对偶 ⇒ D9 → D(9−k)」；玻色弦卡，同上外包。
  - id: worldsheet.type-i-tadpole-cancellation-so32-v2
    note: |
      供给 (1)(3) 的全部输入：type I 非 SO(32) 时的单圈发散 = R–R 10-形式场方程的不一致，
      以及「圆盘 tadpole 由无取向 cross-cap 相消」。三处逐字，方向一致（§10.8 → 本章）：
      · p. 141：「The existence of the 10-form was deduced in section 10.8, from the study of type I
        divergences.」
      · p. 142：「The divergence of the type I theory for groups other than SO(32) arose from the R–R
        10-form field equation.」与「We know that the disk tadpole is canceled by the unoriented cross-cap.」
      · p. 147：「We deduced from the cancellation of divergences that the charge of the orientifold
        plane should have a factor of −(2^{4−k})」。
      ★ 故**不标 inferred**，且本卡有效状态必须不高于该卡。本章**不重算任何 tadpole**。
sources:
  - ref: polchinski-1998-v2
    loc: "§13.2, pp. 142–143（无式号，逐字见 statement）；§13.2 开篇 p. 138（16 张 D8 膜、外包给第 8 章）；§13.3, p. 147（「We deduced from the cancellation of divergences」）"
    note: 抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E3/#E12/#E18（L1）。
summary: |
  (1) type I 的单圈发散（非 SO(32) 群）来自 R–R 10-形式场方程（§10.8）；T 对偶到 D 膜图像后
      它仍是 R–R 场方程的不一致：D 膜发出的 R–R 场线正交于非紧方向，必须终止于某处。
  (2) 所有 D 膜荷同号：整套 D 膜是 type I 的 T 对偶像、是 BPS 态，BPS 态的总质量与总荷线性。
  (3) 已知（§10.8）圆盘 tadpole 由无取向 cross-cap 相消；T 对偶时空中体内弦论有取向，
      cross-cap 只能局域在 orientifold 面附近 ⇒ O 面是 R–R 荷的汇。
  (4) 记账：k 个方向对偶后有 2^k 张 O 面、仍是 16 张 D 膜，总荷为零 ⇒ 每张 O 面荷 = −2^{4−k} × 一张 D 膜荷。
      （复算：2^k·(−2^{4−k}) = −16 = −(D 膜总荷)。）
gaps:
  - "★ **本推导的输入是 §10.8 的 tadpole 相消**：已建非 inferred 边 worldsheet.type-i-tadpole-cancellation-so32-v2（2026-09-11 由 v1 改指 v2，v2 只订正了 (10.8.19) 前缀里 α' 的幂次，物理内容不变；三处逐字见该条 depends_on 的 note；2026-09-11 随 ch10 分支接上），本卡有效状态因此不高于该卡。⚠ 残留缺口：该卡自身**不断言 tadpole 的整体符号**（原书逐字「it should be n ∓ 32」），而本推导 (4) 的记账是**带符号的**（O 面荷 = −2^{4−k} × D 膜荷）；那个负号在原书来自「汇」的物理图像与总荷为零的要求，不来自 §10.8 的计算。"
  - "**本章不重算任何 tadpole**：这是纯物理演绎（「Thus we deduce」），唯一可能的独立路线（D 膜–O 面之间的力）原书明写推给读者（p. 147）。"
  - "**「仍是 16 张 D 膜」的计数**：原书 p. 138 只说「16 D8-branes between two orientifold hyperplanes」并外包给第 8 章；「16 = 32/2（CP 指标配镜像）」的记账原书不写，且与 p. 141「each Chan–Paton degree of freedom … as a 9-brane」（蕴含 32）并存不调和（Q1 未裁）。本推导按原书数字 16 记账，不解释其来源。"
  - "**「BPS 态的总质量与总荷线性」只有 (13.2.9) 层面的支撑**，而 (13.2.9) 原书自承「still not complete」；App. B (B.2.39) 只对点粒子荷（现已抽，L1）。"
  - "**「体内弦论有取向 ⇒ cross-cap 局域在 O 面附近」**是定性论断，原书未给 cross-cap 在 T 对偶时空中的显式定位。"
  - "**上游三张 T 对偶卡均为玻色弦**（Vol.1 第 8 章）；超弦版原书外包（p. 138）。"
  - "**禁止的边**：不与 consistency.type-i-hexagon-so32-iff 建边（本章无 anomaly/hexagon）。"
