kind: physical-argument
status: physical-argument
depends_on:
  - id: branes.d-brane-from-t-duality
    note: |
      供给 Dp 膜这一对象，以及「Dirichlet 方向没有动量积分」这一记账——原书 p. 146 逐字
      「Modify this expression by **removing the factors for the momentum integrations in the
      Dirichlet directions**」，这正是 (10.8.4) → (13.3.1) 的第一步改写，也是前缀里
      (8π²α't)^{(9−p)/2} 这个 p 依赖幂次的来源（10 − (p+1) = 9−p 个 Dirichlet 方向）。
      ⚠ 该卡是**玻色**弦的 D 膜定义卡；超弦版原书外包给第 8 章。
  - id: branes.stretched-open-string-mass
    note: |
      供给 (10.8.4) → (13.3.1) 的第二步改写——原书 p. 146 逐字「and introducing a term for the
      **tension of a string stretched over a separation y^μ**」，即被积函数里的
      exp(−t y²/2πα')：张在两膜之间的开弦有经典质量 m = y/(2πα')，单圈迹里给出
      exp(−2πt α' m²) = exp(−t y²/2πα')。
      ⇒ 本边是 y 依赖（从而是 G_{9−p}(y) 的 y^{2−d} 长程行为）的唯一来源。
  - id: worldsheet.superstring-cylinder-amplitude-closed-channel
    note: |
      供给本式的**母式 (10.8.4) 本身**（2026-09-11 新建卡）。
      **非 inferred**：原书 p.146 逐字 'The exchange of light NS–NS closed strings was isolated
      in **eq. (10.8.4)**. Modify this expression by …'——(10.8.4) 是被点名引用的那一式。
      ★ **这条边取代了旧记账**：本推导原先只能把母式挂到整张
      worldsheet.type-i-tadpole-cancellation-so32-v2 上（见下一条边），并在 gaps 里记
      "图上无 (10.8.4) 的单独节点"。该缺口自本边起合上。
      ⚠⚠ **四处修改必须一起带上**（新卡的"不断言 (d)"逐条列出）：(10.8.4) 是 **type I** 的
      圆柱振幅，含 n²（两条边界的 Chan–Paton 指标）与一个来自 **Ω 投影**的 ½；
      (13.3.1) 把它改成 (i) Chan–Paton 权重 **2**、(ii) **去掉** Ω 的 ½（原书逐字
      'there is no factor of ½ from the orientation projection because the physics is locally
      oriented'）、(iii) 去掉 Dirichlet 方向的动量积分、(iv) 加 exp(−t y²/2πα')。
      ⇒ **(13.3.1) 不是 (10.8.4) 的特例，而是同一类计算换一套边界条件与投影**；
      (iii)(iv) 由上面两条边承担，(i)(ii) 由本边的这段 note 记账。
      ★ 附带收益：本边**不经过** §10.8 最弱的一环（C₁₀ 悖论那段 'One can guess the resolution
      of this as follows' + 一个本书不给的 'more detailed analysis'，抽取记录 sec10-8.md #E67），
      而挂整张 SO(32) 卡时是经过的。
sources:
  - ref: polchinski-1998-v2
    loc: "§13.3, p. 146：「We can calculate these forces explicitly from the usual cylinder vacuum amplitude. The exchange of light NS–NS closed strings was isolated in eq. (10.8.4). Modify this expression by removing the factors for the momentum integrations in the Dirichlet directions and introducing a term for the tension of a string stretched over a separation y^μ:」→ **(13.3.1)** 两行；同页逐字「The Chan–Paton weight is 2 here, from the two orientations of the open string, and there is no factor of ½ from the orientation projection because the physics is locally oriented.」"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E16（L1，原书页图）。
      ★ 完整前缀与被积测度以同文件 **§7.3** 为准（researcher 2026-09-11 独立 L1 页图 +
      三重幂次复算）；§7.1 同时订正了 E16 逐字块漏抄的 "is independent of"（那句话属
      branes.d-brane-bps-no-force-v2，与本卡无关）。
  - ref: polchinski-1998-v2
    loc: "§10.8（(10.8.4)：type I 圆柱真空振幅中轻 NS–NS 闭弦交换被 isolate 出来的那一式）"
    note: |
      ⚠ 图上**没有** (10.8.4) 的独立陈述卡；它只出现在 worldsheet.type-i-tadpole-cancellation-so32-v2
      的推导里。本条来源对应的依赖边就挂在那张卡上（见 depends_on 第三条），
      这是"母式无节点"这一缺口的现有记账方式（见 gaps）。
summary: |
  (1) **母式**：§10.8 的 (10.8.4) 已把 type I 圆柱真空振幅里轻 NS–NS 闭弦交换的部分 isolate 出来
      （长柱 t → 0 / s → ∞ 极限保留最轻的闭弦态，给出闭弦树级交换的形式）。
      ★ 2026-09-11 起该式在图上有独立卡
      **worldsheet.superstring-cylinder-amplitude-closed-channel**，本推导 depends_on 它（非 inferred）。
      ⚠ 它是 **type I** 的式子：含 n²（两条边界的 Chan–Paton 指标）与一个来自 **Ω 投影**的 ½。
  (2) **四步改写**（前两步原书 p. 146 逐字给出，后两步是同页的两句限定）：
      (a) 去掉 Dirichlet 方向的动量积分因子——两膜的位置被钉住，横向 9−p 个方向没有连续动量，
          这把幂次改成 (8π²α't)^{(9−p)/2}；
      (b) 加入拉伸开弦的张力项 exp(−t y²/2πα')——张在相距 y 的两膜之间的开弦经典质量
          m = y/(2πα')，单圈迹里给出这个 Boltzmann 因子（branes.stretched-open-string-mass）；
      (c) Chan–Paton 权重由 **n² 换成 2**（开弦的两种取向）；
      (d) **去掉** Ω 投影的 ½（体内物理局域有取向），得
        𝒜_NS–NS ≈ [i V_{p+1}·4×16 / (8π(8π²α')⁵)] ∫₀^∞ (π dt/t²)(8π²α't)^{(9−p)/2} exp(−t y²/2πα').
  (3) **把积分做出来**：记 d = 9−p、a = y²/2πα'，
        ∫₀^∞ (π dt/t²)(8π²α't)^{d/2} e^{−at} = π(8π²α')^{d/2} Γ(d/2−1) a^{1−d/2}
                                            = π(8π²α')^{d/2} (2πα')^{d/2−1} Γ(d/2−1) y^{2−d}，
      乘上前因子 iV_{p+1}·8/(π(8π²α')⁵)（= 4×16/8π 整理后）得
        iV_{p+1}·2^{2d−13} π^{3d/2−11} α'^{d−6} Γ(d/2−1) y^{2−d}，
      而第二行 iV_{p+1}·2π(4π²α')^{d−6} G_d(y) 代入 G_d = 2^{−2}π^{−d/2}Γ(d/2−1)y^{2−d} 给出
      **同一个表达式**——2、π、α' 三者幂次同时闭合（抽取记录 §7.3(b)）。⇒ (13.3.1) 的两行自洽。
  (4) 长程含义：G_{9−p}(y) ∝ y^{2−(9−p)} = y^{p−7} 正是 9−p 个横向维数里无质量场交换的
      静势行为，即引力子 + dilaton 的**吸引**（原书 p. 146「attraction due to the graviton and
      dilaton」）。本卡到此为止，**不**碰 R–R 侧。

  【为什么标 physical-argument 而不是 rigorous】三条：
  (1) 母式 (10.8.4) 本身是路径积分 / 单圈迹的形式计算，其上游是 §10.8 的超弦振幅链；
  (2) 原书写的是「≈」：从完整圆柱振幅取"轻闭弦交换部分"这一步没有被控制（无误差估计，
      也没说明重闭弦的贡献在什么范围内可忽略）；
  (3) 两步改写（去掉动量积分、加张力项）是按物理图像做的替换，原书不给推导。
  ⚠ 本推导里**唯一**严格的一环是第 (3) 步的积分与幂次比对（有限步初等计算，已复算闭合），
  但它只保证 (13.3.1) 两行之间自洽，不提升第 (1)(2) 步的强度。故整体 physical-argument。
