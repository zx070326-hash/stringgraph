  - "**(13.3.12) 在原书误印，本推导的磁通式是重建的**：印刷 p. 148 印作 μ_{6−p}/2κ₁₀²（researcher 2026-09-11 核页图，转录无误）；本推导 (2) 写的 2κ₁₀²μ_{6−p} 由书内自洽性（(13.3.5)+(13.3.11)+(13.3.13)）与 hep-th/9510017 (12)–(15) 两条独立证据确定，**不是**书页上的字面读数。目标卡片因此不引 (13.3.12)。〔2026-09-11 更新〕hep-th/9510017 已登记为 `polchinski-1995-dbranes` 并加为本推导的**直接 source**（loc: p.5 的 (12)–(15)，含逐字 'from the action (12) one finds total flux Φ = μ_p/α_p'），不再是转引；该条的换算校验 A/B 见那条 source 的 note。"
  - "**(13.3.5) 的动能项归一化 ⇒ ∫∗F = 2κ₁₀²μ 这一步原书不写**：本推导按标准场论记账补出（(13.3.6) 的传播子 2κ₁₀²i/k² 与之同源），图上无十维超引力场方程节点。"
  - "**Dirac 弦不可观测**这一原理在图上无节点（math/ 区无 Dirac 量子化条件的卡）；本推导按原书骨架记录。"
  - "**Poincaré 对偶与 (p+2)-球面环绕 (6−p)-膜**的拓扑论证原书只以 fig. 13.3 与一句话给出。"
  - "**重建式中的因子 2κ₁₀²** 由 (13.3.5) 的动能项归一化决定（−(1/4κ₁₀²)∫|F|² ⇒ 场方程 (1/2κ₁₀²)d∗F = μδ ⇒ ∫∗F = 2κ₁₀²μ），原书未把这一步写出；书页 (13.3.12) 字面印的是 μ_{6−p}/2κ₁₀²，本图按第 2 条判定为误印，**不**按字面引用。"
  - "**p = 3（自对偶）情形**原书未单独讨论；(13.3.13) 在 p = 3 时读作 μ_3² = πn/κ₁₀²，是否需要额外的自对偶修正本推导不断言。"
  - "**继承 branes.d-brane-rr-coupling 的缺口**：Dp 与 D(6−p) 互为电–磁对偶依赖 (13.2.8)，而 R–R 场方程本身在图上无十维超引力节点。"
