id: branes.rr-charge-quantization-v2--via-dirac-string-invisibility
target: branes.rr-charge-quantization-v2
kind: physical-argument
status: physical-argument
depends_on:
  - id: branes.d-brane-rr-coupling
    note: |
      供给「Dp 膜是 F_{p+2} 的电源、D(6−p) 膜是其磁源（(13.2.8)），磁源处 Bianchi 恒等式失效、须引入 Dirac 弦」
      ——(13.3.12) 的设定。原书 p. 148 逐字「the p-brane and (6−p)-brane are sources for F_{p+2} and F_{8−p} respectively」。
  - id: branes.d-brane-rr-charge-value
    note: 供给 μ_p 按 (13.3.5) 的归一化（动能项 −(1/4κ₁₀²)∫|F|²），这决定了 (13.3.12) 中的 2κ₁₀² 与 (13.3.13) 中的 π/κ₁₀²。
sources:
  - ref: polchinski-1998-v2
    loc: "§13.3「Dirac quantization condition」, pp. 147–149：(13.3.8)–(13.3.11)（四维复习）→ 推广到 p 膜与 (6−p) 膜 → (13.3.12) → (13.3.13)；fig. 13.3"
    note: 抽取记录 literature/extractions/polchinski-1998-v2-ch13.md#E19（L1）。
  - ref: polchinski-1995-dbranes
    loc: "p.5（arXiv **v3** 页码；式号按 v3 写死）：**(12)** `S = (α_p/2)∫F*_{p+2}F_{p+2} + iμ_p∫_branes A_{p+1}`，其后逐字「For later convenience we have not chosen a normalization for `A_{p+1}`, so two constants `α_p` and `μ_p` appear.」；**(13)** `μ_p²/α_p = 2π(4π²α')^{3−p}`；**(14)** 前逐字「Integrate the field strength `*F_{p+2}` on an `(8−p)`-sphere surrounding a `p`-brane; **from the action (12) one finds total flux `Φ = μ_p/α_p`.**」；**(15)** `μ_pμ_{6−p}/α_p = 2πn`，其前逐字「In order that the Dirac string be invisible to a `(6−p)`-brane, we need `μ_{6−p}Φ = 2πn` for integer `n`.」；其后逐字「The charges (13) of the D-branes satisfy this with **minimum quantum `n = 1`**.」；脚注 7 逐字「It follows from `F_{p+2} = *F_{8−p}` that `α_p = α_{6−p}`.」"
    note: |
      L1（arXiv v3 页图 pp.4–8，抽取记录 literature/extractions/polchinski-1998-v2-ch13.md **§6.4**）。
      ★★ **本条是本推导两处「重建」的书外独立证据**，2026-09-11 由转引改为直接 source
      （`polchinski-1995-dbranes` 已在 literature/sources.bib 登记）。
      **(a) 论证骨架逐字同型**：1995 论文的 Dirac 条件推法与本推导 summary (2) 完全一致——
      先算围绕 p 膜的 (8−p)-球面通量 Φ = μ_p/α_p（(14)），再要求 Dirac 弦对 (6−p) 膜不可见
      μ_{6−p}Φ = 2πn（(15)）。⇒ 本推导 summary (2) 里「Dp 膜世界体绕高维 Dirac 弦的相位」那一步
      虽未从书页抄出，但其**论证形式**在这里有一手依据（gaps 第一条的缺口因此收窄，
      但不消失：书上那两行的字面写法仍未核）。
      **(b) 因子方向的独立判定**：取书的归一化 α_p = 1/(2κ₁₀²)，
        · 代入 (13) 得 μ_p² = (π/κ₁₀²)(4π²α')^{3−p} = 书 (13.3.7) 逐字相同 ✓
        · 代入 (15) 得 μ_pμ_{6−p} = πn/κ₁₀² = 书 (13.3.13) 逐字相同 ✓
      故 1995 论文的 Φ = μ_p/α_p = **2κ₁₀²μ_p**，即**通量 = 荷乘 2κ₁₀²**（乘，不是除），
      搬到书的记号即 ∫_{S_{p+2}}F_{p+2} = 2κ₁₀²μ_{6−p}——与本推导 summary (2) 写的形式一致，
      与书 (13.3.12) 印的 μ_{6−p}/2κ₁₀² **相反**。⇒ 「(13.3.12) 是分数线倒置的排印错误」这一判定
      现在有**两条互相独立的证据**：书内自洽性（(13.3.5)+(13.3.11)+(13.3.13)）与本条（书外）。
      **(c) n = 1**：1995 论文逐字说 D 膜的荷「satisfy this with minimum quantum n = 1」；
      目标卡片 v2 断言的 (13.3.13) 只写 μ_pμ_{6−p} = πn/κ₁₀²，**不**断言 n = 1，本条也不用来加强它。
      ⚠ **引用本文的荷归一化时必须带上作者自承的未解矛盾**（p.6 逐字）：
      「This is twice the value found in ref. [13] … **We have not succeeded in reconciling these
      calculations**, but strongly expect that the RR charge is that required by string duality.」
      ⇒ 本条来源自身的强度上限是 physical-argument，不抬高本推导的 status。
      ⚠ 读的是 **arXiv v3**（PDF 内嵌链接自陈 hep-th/9510017v3）；期刊发表版（PRL 75, 4724–4727）
      未核对，页码与 DOI 是 L2。pp.1–3 与 pp.9–11 未读。
summary: |
  (1) 四维复习：磁荷 μ_m 由 ∫_{S_2}F_2 = μ_m 定义；电荷 μ_e 的粒子沿闭路 P 获得相位
      exp(iμ_e∮_P A_1) = exp(iμ_e∫_D F_2)，D 是以 P 为边界的曲面；把 P 收缩到 Dirac 弦附近，
      exp(iμ_e∫_{S_2}F_2) = exp(iμ_eμ_m)；Dirac 弦不可观测 ⇒ μ_eμ_m = 2πn（(13.3.11)）。
  (2) 推广：Dp 膜与 D(6−p) 膜分别是 F_{p+2} 与 F_{8−p} 的源，它们的世界体在十维中 Poincaré 对偶：
      围绕 D(6−p) 膜的 (p+2)-球面上 ∫_{S_{p+2}}F_{p+2} = **2κ₁₀² μ_{6−p}**（(13.3.12)，因子 2κ₁₀²
      来自 (13.3.5) 的动能项归一化：场方程 (1/2κ₁₀²)d∗F = μδ ⇒ ∫∗F = 2κ₁₀²μ）。
      对 Dp 膜施加同一条「Dirac 弦不可观测」的要求，即 exp(iμ_p∫_{S_{p+2}}F_{p+2}) = 1，
      得 2κ₁₀²μ_pμ_{6−p} = 2πn，即 μ_pμ_{6−p} = πn/κ₁₀²（(13.3.13)）✓。
      ⚠ 抽取记录只给出 (13.3.12) → (13.3.13) 这一步的结果；Dp 膜世界体绕高维 Dirac 弦的相位
      exp(iμ_p∫F_{p+2}) 的具体写法是本 curator 按四维论证的类推补的，原书页图上的中间行未抄出。
      ⚠⚠ **原书 (13.3.12) 在此处误印为 μ_{6−p}/2κ₁₀²**（researcher 已核印刷 p. 148，转录无误，
      2005 corrected 版仍如此）：那样代入只给 μ_pμ_{6−p} = 4πnκ₁₀²，与 (13.3.13) 矛盾；κ₁₀² 必须在分子。
      正确形式 2κ₁₀²μ_{6−p} 另有 Polchinski hep-th/9510017 (12)–(15) 的独立证实（Φ = μ_p/α_p，
      α_p = 1/(2κ₁₀²)；抽取记录 -ch13.md §6.4）。目标卡片 v2 按 lead 裁决**不引 (13.3.12)**，
      本推导在 (2) 里写出的磁通式是本图按 (13.3.5)+(13.3.11)+(13.3.13) 自洽性重建的中间步骤。
gaps:
