    note: |
      抽取记录 polchinski-1998-v1#E152（L1，Schrans §8.107–§8.112，笔记 p.521–526）。
      ⚠ 中间那一步用的是 ∂_σX' = −i∂_τX（由 (8.6.15) 的 ∂_σX = −i∂_τX' 换 X ↔ X' 得），
      **不是** ∂_σX' = −i∂_τX'；本图自行补出这一行，来源没有逐字写。
summary: |
  (8.6.15) 给 ∂_σ X = −i ∂_τ X'；同一步换 X ↔ X'（X = X_L + X_R、X' = X_L − X_R，
  并在**柱面坐标** z = e^{−iw}、w = σ¹ + iσ² 下取 ∂_σ = −i(∂ − ∂̄)、∂_τ = ∂ + ∂̄
  ——**不是** conv.worldsheet-complex-coords 的平面坐标 z = σ¹ + iσ²，见
  duality.dual-coordinate-v2）给 **∂_σ X' = −i ∂_τ X**。沿 σ¹ ∈ [0, π] 积分：
    **X'(π) − X'(0) = ∫_0^π dσ¹ ∂_σ X' = −i ∫_0^π dσ¹ ∂_τ X = −2π α' v_d**,
  因为 X 满足 Neumann 条件、其 ∂_τ 的零模就是紧化方向的运动学动量 v_d
  （振子项在 σ¹ ∈ [0, π] 上积掉，(8.6.9)）。
  无 Wilson 线时 v_d = ℓ/R 给 X'(π) − X'(0) = −2πα'ℓ/R = −2πℓR'；
  带 Wilson 线时 v_d = (2πℓ + θ_i − θ_j)/(2πR)（上游命题）给
  X'(π) − X'(0) = −α'(2πℓ + θ_i − θ_j)/R = −(2πℓ − θ_j + θ_i)R'。
  由于两端点的差只依赖 (i, j) 与 ℓ，可一致地把端点 i 的位置取为 X'(0) = θ_i R'
  （整体常数任选），即 Wilson 线本征值 = 膜的位置。
  代入模式展开并用 Dirichlet 条件得 (8.6.19) 的只含 sin 的形式。
gaps:
  - "「∂_σX' = −i∂_τX，其 σ¹ 积分只剩动量零模 2πα'v_d」这一行由本图从 (8.6.15) 与开弦 Neumann 模式展开自行补出；来源（(8.6.9) 附近）给的是结果而非这一行推演。"
  - "⚠ 勘误依赖：(8.6.19) 最后一项的符号按 Polchinski 勘误表更正（Schrans 明记），本项目尚未取得勘误表（抽取记录 Q24）。"
  - "⚠ 上游 compact.wilson-line-shifts-open-string-momenta 的电荷指派 (+1, −1) 在来源中未被理解（Schrans Open Questions 第 7 条）；本条的 θ_i − θ_j 结构完全依赖它。"
  - "「可一致地把端点 i 的位置取为 θ_i R'」用到全部开弦的端点落在同一组超平面上（交叉对称性论证，见 branes.d-brane-from-t-duality 的 source note），本图没有节点承载该论证。"
