summary: |
  μ_p = (π/κ₁₀²)^{1/2}(4π²α')^{(3−p)/2}，μ_{6−p} = (π/κ₁₀²)^{1/2}(4π²α')^{(3−(6−p))/2} = (π/κ₁₀²)^{1/2}(4π²α')^{(p−3)/2}。
  相乘：μ_pμ_{6−p} = (π/κ₁₀²)(4π²α')^{(3−p)/2 + (p−3)/2} = π/κ₁₀²。
  与 (13.3.13) πn/κ₁₀² 比较得 n = 1。
  （取 μ_p > 0 的平方根。(13.3.13) 右端是 πn/κ₁₀² 而非 2πn/κ₁₀²，因为 (13.3.12) 带因子 2κ₁₀²
  ——exp(iμ_p·2κ₁₀²μ_{6−p}) = 1 给 2κ₁₀²μ_pμ_{6−p} = 2πn；这一记账在上游卡
  branes.rr-charge-quantization-v2 完成，本推导只做代入。）
gaps:
