  - "**有效状态受上游压制**：两条依赖本身都是 physical-argument（μ_p 来自超对称断言 (13.3.2)，Dirac 条件来自弦不可观测的物理论证）。故本卡的 effective 是 **physical-argument**，与本推导自身已升到 rigorous 无关。⚠ **2026-09-11 订正**：本条原写「整条超弦链自 2026-09-11 起被 worldsheet.critical-dimension-superstring-brst-v2（BRST 幂零 ⟹ c^m = 15，本卷无来源，status = conjecture）压到 conjecture」。当日稍后的 lead 裁决（superstring-flat）把 worldsheet.critical-dimension-superstring--via-two-routes 的 (I) ⟹ 半改指与来源同范围的平坦卡 worldsheet.superstring-brst-nilpotency-requires-d10-flat（physical-argument），并撤掉指向一般形式那张 conjecture 卡的边，超弦链因此回到 physical-argument。**一般形式卡本身仍是 conjecture，只是不再在本链上**。"
  - "**平方根的符号**：原书取 μ_p > 0；D 膜与反 D 膜（μ_p < 0）的情形 n = −1，原书未讨论。"
