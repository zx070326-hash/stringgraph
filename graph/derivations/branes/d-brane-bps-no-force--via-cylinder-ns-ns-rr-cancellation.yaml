id: branes.d-brane-bps-no-force--via-cylinder-ns-ns-rr-cancellation
target: branes.d-brane-bps-no-force
kind: physical-argument
status: physical-argument
depends_on:
  - id: branes.d-brane-bps-half-susy
    note: |
      供给「两张平行 Dp 膜共同保留的超对称 (13.2.5) 与单张相同、系统仍是 BPS 态」；
      原书 p. 146 逐字「For parallel Dp-branes, the unbroken supersymmetry (13.2.5) is the same as for
      a single Dp-brane.」以及「Due to supersymmetric cancellation in the trace」——(13.3.2) 的全部依据。
  - id: branes.d-brane-rr-coupling
    note: |
      供给「R–R 交换是排斥的、来自膜所带的 R–R 荷」这一解释（p. 146「repulsion due to the R–R tensor」）；
      没有它，𝒜_R–R 只是圆柱振幅的一个部门，无「排斥力」的读法。
  - id: branes.d-brane-from-t-duality
    note: 供给 Dp 膜对象与 Dirichlet 方向无动量积分的记账（(13.3.1) 由 (10.8.4) 修改的第一步）。⚠ 玻色弦定义卡。
  - id: worldsheet.type-i-tadpole-cancellation-so32-v2
    note: |
      供给 (2) 的 NS–NS 侧出发点：该卡的推导覆盖 §10.8 的圆柱振幅 (10.8.4)，本章 (13.3.1) 明写是它的
      修改版（去掉 Dirichlet 方向的动量积分、加入拉伸弦张力项 exp(−t y²/2πα')）。
      **技术性（公式级）**依赖，故不标 inferred（抽取记录 Q5 末段把这条边交 curator 判断，判为要建）。
      ⚠ 只用圆柱振幅这一件，**不用** (n ∓ 32)² / SO(32) 结论；本卡讲的是 type II 的两张平行 D 膜，
      与 type I 的无取向投影无关（原书 p. 146 逐字「there is no factor of ½ from the orientation
      projection because the physics is locally oriented」）。
  - id: susy.brane-charges-in-susy-algebra
    inferred: true
    note: |
      ⚠ **inferred，术语锚定边**。供给「同号 R–R 荷的 BPS 物体」这句话里**荷进入超代数**的那一半：
      (13.2.9c) 的 `Σ_p (τ_p/p!) Q^R_{M_1…M_p}(β^{M_1}⋯β^{M_p})` 是 D 膜荷出现在超代数里的地方。
      **但 §13.3 的论证没有用它**：(13.3.2) 的依据是原书逐字「Due to supersymmetric cancellation in
      the trace」，即开弦谱的玻色–费米配对，不是代数中心荷的饱和。⇒ 本边不承重。
      ⚠ 该卡原书自承「the algebra (13.2.9) is **still not complete**: the *magnetic NS–NS charge* is missing」，
      本卡继承该缺口。
      〔2026-09-11 去重并入，两种判断并存〕本条边原有两份：并行建卡把同一依赖写成
      `branes.brane-charges-in-susy-algebra` 并判为**承重、非 inferred**，理由是它供给
      「BPS 态的能量只由荷与间距决定」这一步，原书 **p. 146 逐字「The multi-object state is still
      supersymmetric and so its energy is determined only by its charge and the separations.」**
      （并指出这条质量–荷关系来自含膜荷的 (13.2.9)，**不是** App. B 的点粒子界 (B.2.39) 能直接给的，appB 抽取记录 Q3）。
      按 lead 裁决（inferred 冲突取 `inferred: true`）保留 inferred 并同时记两种理由：
      那句话确实出现在 §13.3 的正文里，但 (13.3.2) 这一步原书给的依据是「Due to supersymmetric cancellation
      in the trace」（开弦谱的玻色–费米配对），不是从 (13.2.9) 的中心荷饱和推出的。
      ⇒ 「能量只由荷与间距决定」在本推导里是**旁白/一致性检查**，不是被引用的引理。
      【★ 2026-09-11 auditor 裁决（physics-auditor，分支 agent/auditor/rulings-3）：**维持 `inferred: true`**，
      理由如下，取代上面"两种判断并存"的临时状态】
      (1) 原文复核（Cambridge Core 原书 PDF p.146，逐页读图，非转述）：§13.3 开篇逐字
          "There is no force between static BPS objects of like charge. The multi-object state is still
          supersymmetric and so its energy is determined only by its charge and **is independent of** the
          separations. For parallel Dp-branes, the unbroken supersymmetry (13.2.5) is the same as for a single
          Dp-brane." ⚠ branes 版与本 note 上文引作 "determined only by its charge and the separations"，
          **漏掉了 "is independent of"**；原句的意思恰是"能量与间距无关"，即无力性本身的另一种说法，
          不是一条独立的"质量–荷关系"引理。抽取记录 E16 同款误引，已另行通知 researcher/lead。
      (2) 承重判据是「删掉这条依赖，推导的哪一步会断」。本推导的结论是 (13.3.2) 𝒜_R–R = −𝒜_NS–NS；
          原书给它的唯一依据是紧接其前的 "Due to supersymmetric cancellation in the trace"——圆柱振幅是
          开弦单圈迹，两膜系统保留 (13.2.5) 的超对称 ⇒ 开弦谱玻色–费米配对 ⇒ 迹相消。这一步的输入是
          **保留的超对称**（branes.d-brane-bps-half-susy 那条边供给），不是超代数里的中心荷项 (13.2.9c)。
          原书 §13.3 从 (13.3.1) 到 (13.3.7) 没有一处引用 (13.2.9)。删掉本边，summary (1)–(5) 一步不断。
      (3) 那句"energy … independent of the separations"是本命题**结论**的文字预告（同段首句 "There is no
          force" 的同义反复），随后一句才开始论证（"The vanishing of the force comes about from …"）。把结论
          的预告句当作承重前提，会把"BPS ⇒ 无力"这条一般规则偷运进来，而目标卡"不断言 (3)"已按 (13.4.23)
          后的作者自承反例明确拒绝了这条一般规则。
      (4) 该卡本身在图上的方向是 susy.brane-charges-in-susy-algebra **依赖** branes.d-brane-bps-half-susy
          （(13.2.10) 用 β^⊥），它把"膜荷进入超代数"这一结构挂在本推导名下，恰当的读法是术语锚定：
          本卡说的 "BPS objects of like charge" 里，"charge" 在代数中的位置由该卡给出。
      ⇒ 裁定：本边**不承重**，`inferred: true` 维持；branes 版"承重"理由所依据的那句引文经原书复核
         **不支持**其读法。若日后有人为「BPS 态能量只由荷决定（膜荷版）」单建卡，本推导也不应依赖它。
  - id: susy.bps-bound-point-particle-d4
    inferred: true
    note: |
      ⚠ **inferred，术语锚定边**。供给「BPS 物体」一词的代数含义（中心荷饱和 ⇒ 短表示）。
      ★ 但**必须**同时读它的适用域：App. B 的 BPS 界 (B.2.39) **只对点粒子可携带的荷成立**
      （p.448 逐字 caveat），**不覆盖膜**。⇒ 本卡的"无力"结论**不是** App. B BPS 界的推论，
      而是 §13.3 圆柱振幅中 NS–NS 与 R–R 相消的结果。
