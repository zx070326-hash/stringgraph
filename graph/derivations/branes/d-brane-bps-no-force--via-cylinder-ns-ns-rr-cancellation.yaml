summary: |
  (1) 两张平行 Dp 膜相距 y 的圆柱真空振幅 = 开弦单圈 = 闭弦树级交换。长柱极限下只剩轻闭弦：
      NS–NS 部门给引力子 + dilaton 交换，R–R 部门给 (p+1)-形式势交换。
  (2) NS–NS 侧：从 (10.8.4) 出发去掉 Dirichlet 方向的动量积分、加入拉伸弦张力项 exp(−t y²/2πα')，得
        𝒜_NS–NS ≈ [i V_{p+1}·4×16 / (8π(8π²α')⁵)] ∫_0^∞ (π dt/t²)(8π²α't)^{(9−p)/2} exp(−t y²/2πα')
                = i V_{p+1}·2π(4π²α')^{3−p} G_{9−p}(y),                                 (13.3.1)
      末行就是引力 + dilaton 的吸引势（前缀与测度按抽取记录 §7.3 的定案形式，见 gaps）。
  (3) R–R 侧：**由超对称在迹中的相消**（两膜系统保留 (13.2.5)，开弦谱玻色–费米配对）断言
      𝒜_R–R = −𝒜_NS–NS（(13.3.2)），总力为零。
  (4) 一致性：场论侧引力子 + dilaton 交换 2iκ²τ_p²G（(13.3.3)）与 R–R 交换 −2iκ₁₀²μ_p²G（(13.3.6)）
      对照，正是 branes.d-brane-tension 与 branes.d-brane-rr-charge-value 的来源。
  (5) 适用域：反平行时 R–R 项变号、同为吸引；相对运动破坏超对称；任意夹角构型中原书自承存在
      「超对称未破缺但势非零」的例外——故本命题只对平行同号静态构型断言。
gaps:
  - "**(13.3.2) 是断言不是计算**：原书逐字「Due to supersymmetric cancellation in the trace」；R–R 侧的圆柱振幅没有被显式算出。这是本推导最弱的一环。"
  - "**「能量只由荷与间距决定」依赖含膜荷的代数 (13.2.9)，而 (13.2.9) 原书自承「still not complete」**（缺磁 NS–NS 荷）；App. B 的 BPS 界 (B.2.39) 只对点粒子荷，不能整体挂在本推导上（appB 抽取记录 Q3）。"
  - "**(13.3.1) 是 (10.8.4) 的修改版**：已建非 inferred 边 worldsheet.type-i-tadpole-cancellation-so32-v2（2026-09-11 由 v1 改指 v2，v2 只订正了 (10.8.19) 前缀里 α' 的幂次，物理内容不变；2026-09-11 随 ch10 分支接上）。⚠ 残留缺口：图上无 (10.8.4) 的单独节点；且本推导最弱的一环 (13.3.2)（R–R 侧由超对称断言）**不**经由这条边获得任何支撑。"
  - "**(13.3.1) 的完整前缀：抽取记录 Q3 已关闭（2026-09-11，依 §7.3）**，summary (2) 现按定案形式写出：分母 8π(8π²α')⁵（α' 一次方，页图直接读到），**被积测度是 (π dt/t²)**——旧转录漏的正是这个 π，它就是 Q3「π 幂次差一次」的成因。依据：researcher 独立 L1 页图（印刷 p.146 = PDF p.11）+ 把第一行积出来与末行逐位比对，2、π、α' 三者幂次同时闭合。⚠ 残留：读数与旧轮判读冲突，真正根据是复算不是像素。⚠ 这条缺口的关闭**不**改善本推导最弱的一环 (13.3.2)（R–R 侧仍是超对称断言）。"
  - "**「超对称未破缺 ⇒ 圈振幅为零」有作者自承反例**（(13.4.23) 后，Q8）：原书只给现象（16 个相位只覆盖 8 个），不给机制。本卡因此不断言一般规则；若日后建「BPS ⇒ 无力」的一般卡，须先为该例外建卡。"
  - "**场论对照 (13.3.3) 引 Vol.1 (8.7.25)**，本图无该节点（二手源）。"
  - "**「体内物理局域有取向 ⇒ 无 ½、Chan–Paton 权重 2」**依赖 E4（T 对偶后体内是 type II），本图无节点。"
  - "**★ BPS 界整体不得挂 App. B**（2026-09-11 新增）：App. B §B.2 的 (B.2.39) `m ≥ q_i` 只覆盖**点粒子可携带的荷**（p.448 逐字「if we include only charges that can be carried by point particles … The same caveat applies to the higher-dimensional algebras」）。膜荷进入超代数是 §13.2 (13.2.9)，而原书自承那条代数「still not complete」。⇒ 本推导对 susy.* 两卡的两条边都是**术语锚定**，不是承重步骤；本卡的无力结论完全由 §13.3 的圆柱振幅论证承担，而该论证的关键一步 (13.3.2) 本身只是断言（见第一条 gap）。"
