summary: |
  (1) 模板（App. B）：点粒子超对称代数的中心项是与 δ_{αβ} 成比例的守恒荷 Z^{AB}；静止系正定性给 m ≥ q_i。
  (2) 广延物体的荷不是标量而是带世界体指标的张量：F 弦荷 Q^NS_M（1-形式，与 B_{MN} 耦合）、
      Dp 膜荷 Q^R_{M_1…M_p}（与 C_{p+1} 耦合，(13.2.7)）。Lorentz 协变地把它们放进 {Q, Q̄}、{Q̃, Q̃̄}
      （NS–NS 荷以 ±(2πα')^{−1}Q^NS_M Γ^M 进入左右两侧）与 {Q, Q̃̄}（R–R 荷以 τ_p Q^R β^{M_1}⋯β^{M_p}/p! 进入
      左右混合项），得 (13.2.9a,b,c)；IIA/IIB 的 p 奇偶性由 R–R 势的种类决定。
  (3) 归一化：所有荷按每单位世界体归一为 1，故弦张力 (2πα')^{−1} 与膜张力 τ_p 显式出现。
  (4) 一致性：对一张 Dp 膜，β^{μ_1}⋯β^{μ_p} = β^⊥Γ^0（(13.2.10)，相差整体符号），
      使 (13.2.9c) 的中心项恰与单张膜保留的组合 Q + β^⊥Q̃（(13.2.5)）相容。
  (5) 原书自承：磁 NS–NS 荷（NS5 膜）缺失，「still not complete」。
gaps:
