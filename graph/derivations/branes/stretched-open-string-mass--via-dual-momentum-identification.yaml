id: branes.stretched-open-string-mass--via-dual-momentum-identification
target: branes.stretched-open-string-mass
kind: physical-argument
status: physical-argument
depends_on:
  - id: branes.wilson-line-eigenvalues-are-brane-positions
  - id: compact.wilson-line-shifts-open-string-momenta
  - id: branes.d-brane-from-t-duality
sources:
  - ref: polchinski-1998-v1
    loc: "§8.6, eq. (8.6.20)，p.268"
    note: 抽取记录 polchinski-1998-v1#E152（L1，Schrans §8.107–§8.112）。
summary: |
  对偶前的谱是 m² = v_d² + (N−1)/α'，其中 v_d 是紧化方向的运动学动量。
  由 (8.6.17) 两端点的对偶坐标差 ΔX' 与 v_d 的关系是 ΔX' = 2πα' v_d
  （对偶方向的「长度」= 动量乘 2πα'）。代入即得 m² = (ΔX'/2πα')² + (N−1)/α'。
gaps:
  - "ΔX' = 2πα' v_d 这一步来自 (8.6.15) 的积分（见 branes.wilson-line-eigenvalues-are-brane-positions 的推导），继承其全部缺口，包括 (8.6.19) 的勘误依赖。"
  - "上游电荷指派 (+1, −1) 在来源中未被理解（Schrans Open Questions 第 7 条）。"
  - "「张力 × 长度」的解释是物理读法，不是本推导算出的量；本图没有节点把开弦张力 1/(2πα') 与这条质量公式接起来。"
author: curator-polchinski-ch8
created: "2026-09-11"
