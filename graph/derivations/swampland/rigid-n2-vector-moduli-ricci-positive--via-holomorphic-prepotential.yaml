  - "[17] de Wit–Van Proeyen NPB 245, 89 (1984) 本项目未抽取；Kähler 势的形式外包给它"
  - "本图无特殊 Kähler 几何 / 全局 N=2 的定义节点，depends_on 为空"
  - "原文末句的猜想编号误植（印作 conjecture 2，应为 3），本项目判定（#Q2）"
