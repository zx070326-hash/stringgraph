kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.primary-field
    inferred: true
    note: >-
      原文用到"J(z) 是 (1,0) 主场，故可构造 (1,1) 顶点算子 J(z)∂̄X_μ e^{ikX}"这一步。
      本图的 worldsheet.primary-field 是 Polchinski 的主场定义，原文没有引它；接边是本项目的补齐。
  - id: worldsheet.operator-product-expansion
    inferred: true
    note: >-
      原文的完备性论证用"该算子与理论中所有算子的 OPE 局域"这一条件。原文不引 OPE 的任何来源，
      接到本图的 OPE 定义卡是本项目的补齐。
  - id: worldsheet.state-operator-isomorphism
    inferred: true
    note: >-
      原文由"算子 O(z) 在 CFT 中"过渡到"对应的态在谱中"（逐字 "We thus see that the state
      corresponding to O(z) exists in the spectrum of CFT"），用的就是态-算子对应。原文未引来源。
  - id: conv.extremality-normalization
sources:
  - ref: arkani-hamed-2006
    loc: "arXiv:hep-th/0601001v2, §4.1 Gauge symmetries vs. global symmetries, eqs. (26)–(27), p.14–p.15"
summary: |
  论证链（原文自称是"all global symmetries in this theory are gauged"这一熟知论证的直接推广）：
  1. 左移来的整荷 U(1) 对应世界面流 J(z)，是 (1,0) 主场；由它构造 (1,1) 顶点算子
     J(z)∂̄X_μ e^{ikX}（k² = 0），"prove that the corresponding symmetry is a gauge symmetry"；
  2. 把 level k 的流玻色化：J(z) ~ √k ∂φ(z)（(26)）；
  3. 算子 O(z) = :e^{i√k φ(z)}:（(27)）"is always in the CFT"，理由是它与理论中所有算子的 OPE
     局域，而"the completeness of the CFT spectrum (i.e. … as follows from modular invariance)
     forces us to have O(z) as an allowed operator"；另一种理解是它对应 U(1) 中一个单位的谱流；
  4. O(z) 对应的态是左移态，故 N_L = 0，由杂化弦谱得 M² = ½Q_L² − 1，而渐近的激发弦对应
     M² = ½Q_L² 的极端黑洞，故该态**亚极端**。
gaps:
  - "★ '模不变性 ⇒ 算子内容最大化（谱完备）'在原文里**只有一个括号，无引用、无证明**（arkani-hamed-2006#U7）；本图也没有模不变性/谱完备性节点（cft 区未建立）"
  - "玻色化 J(z) ~ √k ∂φ(z) 的成立条件（流代数 level、紧化格）原文不讨论"
  - "第 4 步用的杂化弦谱公式与 §4 的 (24) 同源，继承其归一化（M_Pl = 1、α' = 4）与外包给 Sen 1995 的黑洞侧缺口"
  - "三条 worldsheet 依赖全部标 inferred：原文没有引任何 CFT 教科书，接边是本项目的补齐"
  - "只覆盖**微扰杂化**弦紧化；I 型 / II 型 / M 理论背景不在内"
notes: |
  from: arkani-hamed-2006#E23。
  这是 swampland 区与 worldsheet 区之间目前唯一的技术性连线。
