summary: |
  一行蕴含：设最轻带电粒子的质荷比为 (M_min/q_{M_min})，而 (M/q)_min 是全谱质荷比的最小值，
  按定义 (M/q)_min ≤ (M_min/q_{M_min})。故 (II)（最轻带电粒子满足 ≤ 1）蕴含 (III)（最小质荷比
  态满足 ≤ 1）。

  原文只写 "clearly implies"，**没有写出这一步**；原文在同处给出的相关注记是"最小 (M/Q) 的态精确
  稳定，as follows trivially from the triangle inequality"（那是关于稳定性的，不是蕴含关系的证明）。
