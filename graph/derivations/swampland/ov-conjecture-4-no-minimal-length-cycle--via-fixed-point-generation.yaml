id: swampland.ov-conjecture-4-no-minimal-length-cycle--via-fixed-point-generation
target: swampland.ov-conjecture-4-no-minimal-length-cycle
kind: conjecture-support
status: conjecture
depends_on:
  - id: swampland.applicability-domain
    inferred: false
  - id: conv.moduli-metric-planck-units
sources:
  - ref: ooguri-vafa-2006
    loc: "arXiv:hep-th/0605264v1, §2, Conjecture 4 的第一条动机, p.4；§3.1 Example ii), p.7（SL(2,Z) 由 S 与 ST 生成，各有不动点）；§3.1 Example iv), p.8（K3 的 Γ 由世界面 CFT 对称性生成，引 [9,10]）"
summary: |
  不动点论证：若 M = T/Γ（T 可缩的 Teichmüller 空间），则 Γ 是对偶群；若 g ∈ Γ 固定 p ∈ T，
  则 g 在 p 处是规范对称性。原文观察"It seems to be the case that Γ's that appear in string
  theory are generated by group elements which have fixed points"，于是任一 h ∈ Γ 可写成有不动点
  元素之积，对应路径逐段可缩，故 π₁(M) 平凡、M 单连通，从而不存在最小长度的非平凡 1-cycle。

  检验：IIB 的 τ 空间中 SL(2,Z) 由 S 与 ST 生成，二者在基本域内分别有不动点 τ = i 与
  τ = exp(2πi/3)，故该模空间单连通；K3 情形的 Γ "is known to be generated by symmetry of the
  worldsheet CFT's [9,10]"。CY 情形原文讨论了一个 π₁ = π₁(C*) ≠ 0 的微妙例子（两个大复结构极限），
  并指出绕行圈的长度在趋于极限时趋零，"Therefore the conjecture 4 is still valid in this case"。
gaps:
  - "核心假设只到 'It seems to be the case that Γ's that appear in string theory are generated by group elements which have fixed points'——原文不给证明也不给一般判据"
  - "论证只覆盖 M = T/Γ 且 T 可缩的情形；原文对不属于这一形式的模空间没有说法"
  - "K3 的 Γ 由世界面 CFT 对称性生成引 [9] Vafa 1989 与 [10] Aspinwall–Morrison，本项目未抽取"
  - "CY 的 C* 例子引 [13] Rodland，未抽取；'如何在无穷远处定义 π₁' 原文自陈 subtlety"
notes: |
  from: ooguri-vafa-2006#E12、#E16、#E18、#E19。
  本条结论比第二条动机强（给出 M 单连通），故与 --via-no-global-charges 分列两条推导。
