  - "向量多重态的曲率符号不必为负，仅渐近为负；本条陈述已限定在'无穷远点附近'"
  - "4d N=1 例子**无法检验**本条：原文逐字 'it is difficult to test the conjecture 3 about the curvature of M'（#E20）"
  - "更强的截面曲率版本被原文自己否定（弦论中有正截面曲率的点）（#E11）"
