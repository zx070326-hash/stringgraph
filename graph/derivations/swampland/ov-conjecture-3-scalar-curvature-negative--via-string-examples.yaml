summary: |
  §3.1 给出的三类支撑：
  - Example ii) IIB dilaton-axion：度规 (3.1) 有**常负曲率**，且商掉 SL(2,Z) 后曲率积分与体积
    积分都有限。
  - Example iv) 16 超荷的陪集空间："These spaces have negative curvatures, satisfying the
    conjecture 3."
  - Example v)（CY 三折）：向量多重态模空间的曲率**不必为负**，但标量曲率在无穷远奇点处渐近为负；
    原文用 [12] Lu–Sun 的结果把 Einstein 作用量写成 ∫_M √g R ~ ∫ c₁ ∧ k^{n-1}，并称
    "One can show that infinite distance singularities always give strictly negative contributions
    to the integral"（脚注致谢 Z. Lu 协助该估计）；单 Kähler 模的 CY 在大体积极限总给常负曲率。
    超多重态一支由局部 N=2 超对称给出负标量曲率（本图
    swampland.hypermultiplet-moduli-negative-curvature，源自 Bagger–Witten 1983）。
gaps:
  - "★ 原文在 §3.1 Example v 有**两处**把 'conjecture 3' 印作 'conjecture 2'（曲率语境），本项目判为误植（ooguri-vafa-2006#Q2）"
  - "曲率积分估计外包给 [12] Lu–Sun (CMP 261, 297 (2006))，本项目未抽取；原文只说 'One can show that'"
