summary: |
  论证是 Sen 的「生成解 + 取极限」两步，**第一步不展示、第二步是可复核的代数极限**：

  1. **生成解**：无质量场的四维有效作用量 (2.3) 有 O(6,22) 对称性 (2.6)–(2.7)；限于**时间无关**
     位形时对称性扩大到 O(7,23)（(2.14)–(2.20)，作者措辞 "It can be verified that"，并引 [11,1]）。
     把 Kerr 解 (2.23)（不带荷）当作种子，用陪集
     (O(6,1) × O(22,1))/(O(6) × O(22))（(2.25)，**28 维**）中的 Ω̄ = Ω̄₂Ω̄₁ (2.26)–(2.28) 作用，
     得到 28 参数（α, β, n⃗, p⃗ 与 m, a）的带电转动解 (2.29)–(2.37)。
     ⚠ 这一步 Sen 自称 "straightforward algebraic exercise"，**结果直接给出，不展示过程**。
  2. **读出守恒量**：(2.38)–(2.41) 给 M、J、Q^{(a)}、μ^{(a)}；(2.42) 把 Q⃗ 投成 22 维 Q⃗_L 与
     6 维 Q⃗_R。⚠ 引出句是 "One can easily verify"，**同样无推导**；**归一化就藏在这一步**
     （M 按 g^E_tt → −(1 − 2M/ρ) 读、Q 按 F^{(a)}_{ρt} → Q^{(a)}/ρ² 读，两条都是抽取者复算）。
  3. **取 a = 0 的极端极限**：a = 0 时 (2.52)(2.53) 的度规在 ρ = 2m 有视界、ρ = 0 有奇点；
     极端极限定义为 `m → 0` 且保持 (2.38) 的 M 固定（原文逐字）。此时 `cosh α`、`cosh β` 必须
     同步发散才能保住 M，于是按 α、β 谁更快发散分成三种情形 (2.54)(2.58)(2.62)，
     代入 (2.38)(2.40) 即得 (2.55)(2.59)(2.63) 的 (M, Q⃗_L, Q⃗_R)，再消去 m₀ 得
     (2.56)(2.60)(2.64) 的三条关系。

  **第 3 步是纯代数、可完全复核**（抽取者已逐式复算：由 (2.55) 得 Q⃗_L² = (m₀²/2)cosh²β、
  M² = (m₀²/4)cosh²β = ½Q⃗_L² ✔；Case II、III 同理 ✔）。
  **status 由第 1、2 步封顶在 physical-argument**：解与守恒量都是断言 + "exercise"/"easily verify"，
  按 docs/STATUS_LEVELS.md 的「断言 + 骨架」档位记 physical-argument 并把断言处写进 gaps。
gaps:
  - |
    ★ **解 (2.29)–(2.37) 的构造过程不展示**：Sen 逐字 "It is now a **straightforward algebraic
    exercise** to apply the transformation generated by Ω̄ … The result is,"。
    本项目**未独立复算**该 O(7,23) 变换（抽取记录 U4）；本图也**没有对应的解卡**。
    要升 rigorous 必须 reviewer 独立复算整条解。
  - |
    ★ **守恒量 (2.38)–(2.41) 只有 "One can easily verify"**，无推导。
    而**归一化恰恰藏在这一步**：M 按 `g^E_tt → −(1 − 2M/ρ)`（即 G_N = 1）、Q 按
    `F^{(a)}_{ρt} → Q^{(a)}/ρ²` 读出——**这两条读数规则原文一个字都没写**，是抽取者由
    (2.30)+(2.37) 与 §3 (3.6)–(3.8) 复算的（`[抽取者复算]`，抽取记录 §1.2、Q4）。
    ⇒ 本卡前提 (P3) 属 inferred；按 docs/STATUS_LEVELS.md 的 lead 裁决，该复算是四行代数，
    **reviewer 独立复核后这一条可关闭**，但 inferred 标记必须保留。
  - |
    ★★ **Sen ↔ AMNV 的电荷归一化桥在两篇原文中均不存在。**
    Sen **不声明 α'、G_N、M_Pl 中的任何一个**，其 Q 是连续参数 (2.40)、从不与格点归一化挂钩；
    AMNV 自称 `M_Pl = 1`（不给 M_Pl 的定义是 1/G_N 还是 1/(8πG_N)）与 `α' = 4`，其 Q 受 (21) 的
    28 维偶自对偶格条件约束。**两篇都不给换算**（抽取记录 §1.3、Q1；arkani-hamed-2006 的 Q2）。
    ⇒ **这不是 Sen 的缺口，也不是 AMNV 的缺口，而是两篇拼接处的缺口**；凡把本卡接到
    swampland.heterotic-t6-substates-below-extremality-v2 的边必须 `inferred: true`。
  - |
    **Bogomol'nyi 界不在本推导内**：Sen p.11 那句 `M² ≥ Q⃗_R²/2` 外包给 [24][25]、本文不证，
    已单独建卡 swampland.heterotic-t6-bps-bound。本卡只给 (2.56)(2.60)(2.64) 三条**代数关系**，
    不含「Case II/III 饱和界、Case I 不饱和」的分类。
  - |
    **只覆盖 a = 0**。a ≠ 0 的极端极限 `a → m` 另有 (2.51)（A → 8π|J|、κ → 0），
    且 Sen p.11 明说那时 `M²` 恒大于 `Q⃗_R²/2`；本卡不涉及。
  - |
    **Kerr 种子解外包**：(2.23) 引 [13] = A. Sen, Phys. Rev. Lett. **69** (1992) 1006，
    **本项目 bib 未登记、正文未取得**。
  - |
    **O(7,23) 只是时间无关位形的对称性**，且其存在 Sen 引 [11, 1]（"It can be verified that"），
    本项目未核实；(2.7) 之后 Sen 自己指出：固定电荷格 Λ 后只有离散子群 O(6,22;Z) 是完整弦论的对称性
    ——即**生成解用的连续变换不是完整弦论的对称性**，只是低能有效理论的。这一点 Sen 未展开。
