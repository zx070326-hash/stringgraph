summary: |
  论证是一个格论比较（M_Pl = 1，α' = 4）：
  1. 电荷落在 28 维偶自对偶格上，Q_L² − Q_R² ∈ 2Z（AMNV (21)）；
  2. **非转动**极端黑洞（Sen 1995，(P1) a = 0、(P2) m → 0 保 M 固定）：
     Q_R² > Q_L² 时 BPS，M² = ½Q_R²（AMNV (22) = Sen (2.60)）；
     Q_L² > Q_R² 时非 BPS 但极端，M² = ½Q_L²（AMNV (23) = Sen (2.56)）；
  3. 微扰杂化弦谱：M² = ½Q_R² + N_R = ½Q_L² + N_L − 1（AMNV (24)，−1 来自左移玻色弦快子）；
  4. 由于格上存在 Q_L² − Q_R² = 2 的电荷矢量，取 N_L = 0 即得一个质量为
     M² = ½Q_R² = ½Q_L² − 1（AMNV (25)）的态，比同电荷的极端黑洞轻。

  原文措辞是 AMNV 全文最强的正面措辞："the string spectrum also guarantees that … we are
  guaranteed to find a state with a mass/charge ratio smaller than for extremal BH's"。

  **相对 v1 推导的实质改动**：第 2 步的两个前提由 Sen 的一手正文补回（AMNV 两个都没写），
  并把「Sen 的 (M, Q_L, Q_R)」与「AMNV 的 (M, Q_L, Q_R)」之间那座**在两篇原文中都不存在的
  归一化桥**从"未记录"升级为一条显式的 inferred 边 + convention_map + gaps。
gaps:
  - |
    ★★ **Sen ↔ AMNV 的电荷归一化桥在两篇原文中均不存在**（本推导的首要缺口）。
    Sen hep-th/9411187 **全文不出现 α'、M_Pl、Newton 常数、弦耦合**（21 页逐页核实的否定结论），
    其作用量 (2.3) 的整体常数 C 作者自述 "arbitrary … can be absorbed into the dilaton"；
    M 与 Q 只能按 `g^E_tt → −(1 − 2M/ρ)`、`F^{(a)}_{ρt} → Q^{(a)}/ρ²` 从渐近行为读出，
    **这两条读数规则原文一个字都没写**（`[抽取者复算]`）。
    AMNV 侧自称 `M_Pl = 1`、`α' = 4`，但**不声明 M_Pl 的定义**（1/G_N 还是 1/(8πG_N)），
    其 Q 受 (21) 的偶自对偶格条件约束。**两篇都不给换算。**
    ⇒ 质量侧至多能在补两个原文都没有的约定后对上；**电荷侧完全无法闭合**
    （Sen 的 Q 是连续参数，从不与格点归一化挂钩）。
    ⇒ **这不是 Sen 的缺口，也不是 AMNV 的缺口，而是两篇拼接处的缺口**
    （抽取记录 §1.3、Q1；arkani-hamed-2006 的 Q2）。
  - |
    ★ **AMNV 丢掉了 Sen 的两个前提**（本卡 v2 补回，但补回这一步本身依赖 Sen 的一手正文，
    AMNV 侧无任何对应文字）：(P1) `a = 0`（非转动）、(P2) `m → 0` 且保持 (2.38) 的 M 固定。
    且 Sen p.11 逐字："the extremal black holes carrying **non-zero angular momentum do not
    correspond to supersymmetric solutions**"，并指出 `J ≠ 0` 时 `M²` 恒大于 `Q⃗_R²/2`
    （即便在极端极限 `a → m` 下）。
    ⇒ **AMNV §4 的论证若被读成对一般（含转动）极端黑洞成立，则是错的**；本卡限定在 J = 0。
  - |
    ★ **AMNV 的两式不覆盖 Q_L² = Q_R²**：(22)(23) 用严格不等号 `Q_R² − Q_L² > 0` /
    `Q_L² − Q_R² > 0` 划分，恰好把边界情形排除。该情形是 Sen 的 **Case III (2.64)**
    `M² = ½Q⃗_L² = ½Q⃗_R²`，且 Sen p.11 说它**也**饱和 Bogomol'nyi 界。**AMNV 从未引用 Case III。**
  - |
    **「BPS」这一判定本身不在本推导内**：AMNV (22) 称之为 BPS，其依据是 Bogomol'nyi 界
    `M² ≥ Q⃗_R²/2`。该界在 Sen 文中**只是引用**（p.11，外包给 [24][25]，本文不证），
    本图已单列为 swampland.heterotic-t6-bps-bound（其 gaps 记明四篇被引文献本项目一篇未读）。
    本推导**不依赖**它——(25) 的论证只用 (21)(23)(24) 的算术——故不建边；
    但凡有人要用「(22) 是 BPS 饱和」作论据，必须接那张卡。
  - |
    **极端黑洞解 (2.29)–(2.37) 本身 Sen 只说 "straightforward algebraic exercise"、不展示**，
    守恒量 (2.38)–(2.41) 的引出句是 "One can easily verify"。
    本项目未独立复算（抽取记录 U4）。⇒ 黑洞侧的 status 上限是 physical-argument。
  - |
    **杂化弦谱 (24) 的推导（含 −1 的来源）AMNV 原文不给，只给结果**；本图无对应的杂化弦谱节点。
    ⚠ **(24) 不得挂 sen-1995-bh-torus**：Sen 全文没有杂化弦质量公式（抽取记录 E11 备注 1）。
  - |
    **电荷格条件 (21) `Q_L² − Q_R² ∈ 2Z` 只有 AMNV 一个来源**。
    ⚠ **不得挂 sen-1995-bh-torus**：Sen 只在 p.4 (2.7) 之后提了一句「the 28 dimensional lattice
    Λ of electric charges」并引 Narain [7]，**无量子化条件、无偶自对偶**（抽取记录 §1.1）。
  - |
    **α' = 4 与本图 canonical 的 conv.alpha-prime-regge 不是同一归一化**；此处未建换算，
    凡把本卡接到用 conv.alpha-prime-regge 的节点上必须写 convention_map。
  - |
    **[抽取者复算]**：由 (24) 取 N_L = 0、Q_L² − Q_R² = 2 得 N_R = 0 且 M² = ½Q_L² − 1，
    与 (25) 一致——该复算 AMNV 原文未显式写出（arkani-hamed-2006#E22 备注 1），属 inferred。
  - |
    **只覆盖 SO(32) 杂化弦 on T⁶ 的一般模空间点**；对其他背景无说法
    （另一条独立证据见 swampland.heterotic-spectral-flow-substates）。
