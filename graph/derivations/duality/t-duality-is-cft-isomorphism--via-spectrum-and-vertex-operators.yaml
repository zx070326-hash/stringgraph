    loc: "§8.3, eq. (8.3.28)（X' 的定义），p.247–248；「the same theory」与「same OPEs and energy momentum tensor」在 p.248 正文（无式号）"
    note: |
      抽取记录 polchinski-1998-v1#E133，**L1（原书直读）**。
      **Q20 已于 2026-09-11 关闭（§12.10 表 A）**：(8.3.28) 是定义式；
      「the same theory」与其理由「same OPEs and energy momentum tensor」都在原书；
