summary: |
  三步（按 Schrans 复述的结构）：
  (i) 在 X_R 中作 ᾱ_m → −ᾱ_m、x_R → −x_R，即换用 X' = X_L − X_R。
      这不改变振子对易关系，是振子代数的自同构；唯一的实际效果是 p_R → −p_R。
  (ii) 由 (8.3.27)，p_R 反号恰好可以由 n ↔ w、R → α'/R 实现。
  (iii) 于是半径 R 的 X 理论与半径 α'/R 的 X' 理论的态、质量、约束一一对应，
       且能动张量与顶点算子的 OPE 在该对应下相同。
gaps:
  - "⚠ **原书措辞未核实（抽取记录 Q20）**：无法确认 Polchinski 是否明说两个理论是「同一个 CFT」/「exactly equivalent」，还是只陈述了谱/振幅相同；「非微扰」一词是否出自原书亦未确认。本推导只承载谱与算子层面已复现的部分。"
  - "「相同的 OPE 与相同的能动张量 ⇒ 两个世界面 CFT 同构」这一步在来源中没有展开：没有给出态空间之间的同构映射，也没有验证全部关联函数。CFT 同构的定义本身在本图中没有节点。"
  - "带绕数顶点算子之间需要 cocycle 因子才互相对易（(8.2.22)/(8.2.23)，抽取记录 #E124）；对偶映射如何作用在 cocycle 上，来源没有讨论。"
  - "只覆盖单个紧化自由玻色子；一般背景下的对偶（Buscher 规则）在原书正文没有，只在习题 8.3 里，且不含 dilaton 的移动。"
  - "OPE 的收敛性与围道变形的合法性（lead 裁决 2026-09-10 的通用缺口）在此处同样未证明。"
notes: |
  旁证（**不作 source**，按 lead 裁决 2026-09-10 个人笔记/习题解答不得承载论证）：
  Headrick 习题解答 Problem 8.3 从世界面规范化路线得到 Buscher 规则，
  与本条在 G_{25,25} → α'²/G_{25,25}（即 R → α'/R）这一点上一致，
  但那是习题级、路径积分层面、且不含 dilaton 的移动。
