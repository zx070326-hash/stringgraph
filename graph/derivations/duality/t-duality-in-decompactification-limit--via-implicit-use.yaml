id: duality.t-duality-in-decompactification-limit--via-implicit-use
target: duality.t-duality-in-decompactification-limit
kind: conjecture-support
status: conjecture
depends_on:
  - id: duality.t-duality-is-cft-isomorphism
    note: |
      有限半径处的对偶陈述；本节点断言的正是把它外推到 R → 0 / R → ∞ 的极限，
      而该外推在来源中没有论证。
sources:
  - ref: polchinski-1998-v1
    loc: "§8.7（p.268 起）"
    note: |
      抽取记录 polchinski-1998-v1#E154/Q27。⚠ **原书没有陈述也没有论证这一步**；
      它是被隐含使用的。伴读者在脚注 12 里把它作为疑问提出。
summary: |
  **本推导没有论证**。支持这条断言的全部证据是**事后一致性**：
  在 R → 0 极限下得到的 D 膜图像（Dirichlet 边界条件、膜上的规范理论、
  由闭弦交换给出的膜间长程力与由此定出的张力）内部自洽，
  且与后来独立发展的 D 膜物理相容。这属于「有非平凡检验但无证明」，故标 conjecture。
gaps:
  - "⚠ **原书对这一极限没有任何论证，也没有把它写成前提**（抽取记录 Q27）。"
  - "duality.t-duality-is-cft-isomorphism 的论证依赖有限非零 R：模式展开、离散的 (n, w) 谱、格求和都在 R 有限时才成立。R → 0 时绕数态塔变连续，论证的每一步都需要重做。"
  - "本项目未登记任何讨论该极限的文献。"
