summary: |
  取 holography.rescaling-adapted-frames-single-coset 机检段落中的格 L 与标架 (Q,P)、
  (Q,P−Q)，不变量分别为 (4,8,8)、(4,4,0)。计算 D'_2 的两项：
    s=1 项：d_*(4,8,8) 与 d_*(4,4,0)，两者约化到同一判别式 −16 类 (4,4,0)，由
    holography.dstar-sduality-invariant 相等，均为 7 999 169 992 704。
    s=2 项：d_*(4,2,4) 与 d_*(4,1,0)，分别约化到 (2,2,0)、(1,4,0)——判别式 −16 的两个
    不等价类（h(−16)=2），数值不同：32 861 184 与 185 738 352。
  求和：D'_2(4,8,8) = 7999169992704 + 2·32861184 = 7999235715072；
  D'_2(4,4,0) = 7999169992704 + 2·185738352 = 7999541469408。四个 d_* 值均由本项目既有的
  精确 Fourier 系数机（torsion-immortal-positivity-hecke/scripts）重新计算得到，非信任
  缓存数字；差值 305754336 与 paper.md Remark 6.3 的 Q-重标见证互为转置（PART 2 同时打印
  D_2(4,4,0)=7999541469408、D_2(8,4,8)=7999235715072）。
  PART 4 额外用总 1/4-BPS 指标（而非单独 d_*）重复计算得到同样两个整数，确认标架依赖不是
  d_* 定义方式的特有产物。
