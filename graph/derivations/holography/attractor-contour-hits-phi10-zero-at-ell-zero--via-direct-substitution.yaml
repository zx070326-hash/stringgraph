summary: |
  proof.md §2 Lemma 1 给出 F 的 Re/Im 精确（非渐近）分解：Im F = Λ·h(ρ1,σ1,v1)，
  Re F = −n2ΔΛ²+g(ρ1,σ1,v1)。取分支 (0,0,0,0,1) 即 F=v，直接展开
  v = v1 + i·ℓΛ；ℓ=0 时 Im v ≡ 0，故 v=v1 与 Λ 完全无关。取 v1=0（[0,1] 闭
  区间内一点）给出 F=0 精确成立，对任意 ρ1,σ1∈[0,1]、任意 Λ>0。既然存在
  Λ 不影响的恒等式解，"存在 Λ₀ 使充分大 Λ 时围道避开零点"这一命题在 ℓ=0
  处对一切 m,n≥1 都失败。无缺口——这是一步直接代入，不需要任何图内已有
  节点作为砖块。
