summary: |
  固定符合 statement 条件的 (ρ,σ)（ℓ=0 围道的 (ρ,σ)-分量，Λ > 1/(4√(mn))）。

  **步骤 1（线段上的零点集）**。设 u ∈ ℝ 且 Φ₁₀(ρ,σ,u) = 0，即点 Ω=(ρ,u;u,σ) ∈ Div(Φ₁₀)。
  由穷尽性（holography.sen-d19-family-is-igusa-phi10-divisor），该点落在某个 (D.19) 分支上。
  该点属于 ℓ=0 吸引子围道（Im u = 0、Im ρ=2nΛ、Im σ=2mΛ、Re u ∈ ℝ），于是：
  n₂≠0 的分支被 holography.ell-zero-contour-avoids-phi10-quadratic-wall 排除；
  n₂=0 且 (m₁,n₁)≠(0,0) 的分支被 holography.ell-zero-contour-avoids-nontrivial-linear-walls 排除。
  只剩 n₂=0、m₁=n₁=0、j=±1、m₂∈ℤ 的族，其零点条件 F = jv + m₂ = 0 给出 **u ∈ ℤ**。
  与线段 [1/2, 3/2] 相交只有 u = 1。

  **步骤 2（u=1 确实是零点）**。holography.attractor-contour-hits-phi10-zero-at-ell-zero
  给出这些 (ρ,σ) 处 Φ₁₀(ρ,σ,0) = 0；由 v-周期 1（holography.phi10-periodic-in-v）
  得 Φ₁₀(ρ,σ,1) = 0。与步骤 1 合起来即 statement (a)：线段上恰有一个零点 u=1。

  **步骤 3（阶恰为 2）**。记 p := (ρ,σ,1) ∈ ℍ₂。步骤 1 已证：除 {u=1} 这一个分支外，
  Div(Φ₁₀) 的任何分支都不经过 p（若经过，p 就是该分支上的一个实 u 点，已被排除）。
  由 holography.igusa-cusp-form-phi10-v2 的 Div(Φ₁₀) = 2H₁，每个分支的重数为 2，
  故在 p 的某个邻域内 Div(Φ₁₀) 作为除子等于 2·{u=1}，从而
    Φ₁₀(ρ,σ,u) = (u−1)²·g(ρ,σ,u)，g 在 p 附近全纯且 g(p) ≠ 0。
  取 u-直线（它与超曲面 {u=1} 横截，因为该超曲面恰由 u=1 定义）得
    h₀(ρ,σ) = g(p) ≠ 0，
  即单变量零点阶恰为 2，这就是 statement (b)。于是 𝒢 = −1/Φ₁₀(ρ,σ,v+1/2) 在 v∈[0,1] 上
  只有 v=1/2 一个极点且为二阶。

  **接口说明**：步骤 3 的结论正是
  holography.phi10-shifted-pole-residue-proportional-to-ell 的显式前提，两卡由此对接。
