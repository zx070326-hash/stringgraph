summary: |
  Witten 给出的论证（式号依 arXiv v2）：

  1. **为什么要紧化**：SO(2,d) 不作用在裸的 d 维 Minkowski 空间上；作用在其上的紧化是
     二次曲面 (1.1) uv − Σ η_{ij} x^i x^j = 0 加整体标度等价 (u,v,x^i) ∼ (su,sv,sx^i)。
  2. **体的同一族坐标**：把 (1.1) 换成 (1.2) uv − Σ η_{ij}x^i x^j = 1，并只对全体变量的
     整体变号取等价，得到 AdS_{d+1}；M_d 就是它的边界。这样构造使 SO(2,d) 同时作用在两者上。
  3. **对称性的两副面孔**：SO(2,d) 在 AdS_{d+1} 上是通常（等距）对称群，在 M_d 上是共形群。
     原文由此得出「有两种方式得到带 SO(2,d) 对称的物理理论」这一观察。
  4. **拓扑**：(1.1) 的紧化拓扑上是 (S^1 × S^{d−1})/Z_2 且有闭类时曲线，
     故通常改用万有覆叠 S^{d−1} × R。
  5. **欧氏版本与共形结构**：欧氏 AdS_{d+1} = 开单位球 B_{d+1}，度规 (2.1)；
     取在边界有单零点的正函数 f，ds̃² = f² ds²（(2.2)）延拓到 B̄_{d+1} 后在 S^d 上诱导度规；
     由 f → e^w f（(2.3)）得 ds̃² → e^{2w}ds̃²（(2.4)），故 S^d 上只有共形结构、没有度规，
     且该共形结构在 SO(1,d+1) 下保持。脚注 3 指出这就是 Penrose 引入共形无穷远的基本想法。
     另给两个等价写法：(2.5) ds² = dy² + sinh²y dΩ²（边界在 y = ∞）与
     (2.6) 上半空间 ds² = (1/x_0²)Σ(dx^i)²（边界在 x_0 = 0 加无穷远一点 P）。

  这些内容本身是可严格化的纯几何，但 Witten 给的是**骨架**：关键的几步（(1.1) 确实是
  Minkowski 空间的紧化、M_d 确实是 AdS_{d+1} 的边界、拓扑判定、f 的存在性与 ds̃² 的可延拓性）
  都只是陈述而没有验证。按 docs/STATUS_LEVELS.md 的「断言 + 骨架」裁决取 physical-argument，
  逐条断言写进 gaps；不取 conjecture（结论在数学上没有争议）。
gaps:
  - >-
    **depends_on 为空**：本图目前没有 Penrose 共形紧化、二次曲面模型、双曲空间几何这类
    数学基础节点可挂。宁可留空并在此记账，也不挂与内容无关的占位依赖
    （先例：holography.n4sym-contains-iib-sugra-states--via-decoupling-limit）。
    补齐这些 math/ 卡后应改为显式边——这也是把本卡升级到 rigorous / formalized 的前置条件。
  - >-
    (i) 的仿射片同构：原文**有骨架级论证**（印刷页 p.3 正文逐字 "To show that (1.1) describes a
    compactification of Minkowski space, one notes that generically v ≠ 0, in which case one may use
    the scaling relation to set v = 1, after which one uses the equation to solve for u. This leaves
    the standard Minkowski space coordinates x^i, which parametrize the portion of the quadric with
    v ≠ 0."），并指出紧化与 Minkowski 空间之差正是 v = 0 的「无穷远点」。
    **缺的不是论证而是验证**：没有核对这个坐标映射是双射 / 同胚（乃至是否保 Minkowski 度规的共形类），
    也没有给 v = 0 那一片的局部坐标。
  - >-
    SO(2,d) 作用的良定义性：原文**给出了被保持的二次形式**（p.3 逐字 "(1.1) defines a manifold
    that admits the action of a group SO(2,d) that preserves the quadratic form −du dv + Σ_{i,j}
    dx^i dx^j (whose signature is − − + + … +)"），所以这一步不是凭空断言。
    缺的是：没有验证该作用与标度等价相容（即下降到商空间上）、也没有验证作用的传递性或光滑性。
  - >-
    拓扑判定 (S^1 × S^{d−1})/Z_2：原文**有推导，在印刷页 p.3 脚注 1**——逐字 "After setting
    u = a + b, v = a − b, and renaming the variables in a fairly obvious way, the equation becomes
    a_1² + a_2² = Σ_{j=1}^{d} y_j². Scaling by only positive s, one can in a unique way map to the
    locus a_1² + a_2² = Σ_j y_j² = 1, which is a copy of S^1 × S^{d−1}; scaling out also the
    transformation with s = −1 gives (S^1 × S^{d−1})/Z_2."，并在正文括注里给出 Z_2 的作用
    （第一因子转 π、第二因子乘 −1）。**所以「拓扑判定没有证明」是错的**；
    缺的只是「in a unique way map to the locus」这一步的同胚性验证。
    与此并列的「有闭类时曲线」则**仍是纯断言**：原文没有写出 M_d 上的因果结构或任何显式闭类时曲线。
  - >-
    "M_d 是 AdS_{d+1} 的边界"：原文**有骨架级论证**（印刷页 p.3 末逐字 "If u, v, x^i go to infinity
    while preserving (1.2), then in the limit, after dividing the coordinates by a positive constant
    factor, one gets a solution of (1.1). This is why the conformal compactification M_d of Minkowski
    space is the boundary of AdS_{d+1}."，并在**脚注 2** 里解释为什么必须在 (1.2) 上取整体变号等价：
    "Because the constant factor here is positive, we must identify the variables in (1.2) under an
    overall sign change, to get a manifold whose boundary is M_d."）。
    缺的是：「在何种紧化 / 何种拓扑下 M_d 是边界」没有指定，也没有把 (1.2) 的闭包做成带边流形。
  - >-
    "SO(2,d) 在 M_d 上作为共形群作用" 是断言：原文没有写出共形因子，
    也没有说明这个共形作用与 (iv) 的共形结构（欧氏侧的 SO(1,d+1)）如何对应。
  - >-
    (iv) 中 f 的**存在性原文已给显式例子**（印刷页 p.5 逐字 "one can pick a function f on B_{d+1}
    which is positive on B_{d+1} and has a first order zero on the boundary (for instance, one can
    take f = 1 − |y|²)"），所以那一条不是缺口。仍是断言的是紧接的一句
    "Then ds̃² restricts to a metric on S^d"：ds̃² = f²ds² 可光滑延拓到 B̄_{d+1}、且限制到 S^d
    是非退化度规，原文没有验证（对 f = 1 − |y|² 这是一个两行计算，但原文没做）；
    「与 f 的选择无关只差共形变换」也只给了 (2.3)(2.4) 的变换律，没有证明任何两个合法 f 之比
    都是 e^w 形式。
  - >-
    **本推导不覆盖 p.4 的唯一性断言**："indeed this is the only possible SO(2,4)-invariant
    relation between these two spaces"——原文没有给对称性分类的论证。
    该断言被有意排除在目标陈述之外（见目标卡 notes）；若要入图须新建独立卡，
    status 至多 conjecture 或标 inferred。
  - >-
    Graham–Lee（Witten 的 [42]，被引在印刷页 p.7）与 Fefferman–Graham（Witten 的 [44]，
    被引在印刷页 p.18/p.19，点名 **Theorem 2.1 与 2.3**——这两条属于 Fefferman–Graham，
    **不属于** Graham–Lee）是本方向唯一有数学定理背书的部分，但它们讲的是
    「给定边界共形结构反解体 Einstein 度规」，与本卡 (i)–(iv) 的方向相反，本推导没有用到它们。
    登记状态（math-sources.md §41）：Fefferman–Graham 已 L1 读到全文页图，但结论只是**形式幂级数**
    级的存在唯一性且 n 偶有真实障碍；Graham–Lee 正文确认取不到（L0），引用它**不得写定理号**。
notes: |
  from: witten-1998-ads#E-W1（另见 §0 约定段、E-W3、抽取记录 §5 建议节点 C）。

  【记号】原文写 SO(2,d) / SO(2,4)（不是 SO(4,2)），欧氏侧写 SO(1, d+1)；
  Lorentz 号差 η_{ij} 为 −+…+（(1.1) 后逐字）。

  【2026-09-11 订正】本推导的 gaps 原先把四处写成「断言，没有证明」，经 reviewer-gkpw 按页图复核，
  其中三处原文实有骨架级论证（仿射片 p.3 正文、拓扑 p.3 脚注 1、M_d 是边界 p.3 末 + 脚注 2），
  f 的存在性原文更是给了显式例子 f = 1 − |y|²（p.5）。gaps 已逐条改为如实描述
  「原文给到哪一步、缺的是哪一步」。status 仍取 physical-argument：剩下的缺口
  （同胚性验证、闭类时曲线、共形因子、ds̃² 的延拓与非退化、f 无关性）足以挡住 rigorous。

  【这是最容易严格化的一块】抽取记录 §5 的判断：这部分是纯几何、可严格化
  （二次曲面、Penrose 共形紧化、单位球模型、共形类），"远比 Graham–Lee 容易"，
  是本方向最现实的 Lean 形式化候选。严格化的路线是先补齐上面 gaps 里的 math/ 卡，
  再新建一条 rigorous 的推导挂到同一目标（或换代出一张前提完整的新卡）。

