  解析来源。结论层（Q·P=0 ⟹ Δd=0）已由 Denef–Moore 2007 确立，本项目**不作优先权主张**；
  详见目标卡 notes 第一段（措辞取自 literature/notes/ell-zero-wall-residue-prior-art.md）。
