summary: |
  设 m,n ≥ 1，ℓ = 0，Λ > Λ₀ = 1/(4√(mn))。被积函数是
  𝒢(ρ,σ,v)·e^{−2πi(mρ+nσ)}（ℓ=0 时指数核不含 v）。

  **(a) 定义 D 在 ℓ=0 不可用**。holography.attractor-contour-hits-phi10-zero-at-ell-zero
  给出：对一切 Λ>0，Φ₁₀ 在围道 (ρ,σ)-分量与 v=0 处为零；由 v-周期 1 同样在 u=1 处为零，
  即 𝒢 在 v = 1/2 ∈ [0,1] 有极点。故「取 Λ 充分大使围道避开全部极点」对任何 Λ 都办不到。

  **步骤 1（微扰围道无极点；带内只有 v=1/2 一个极点）**——本步骤的紧致性论证由
  curator 补写，proof.md §4.1 只写了「极点在实轴上，ε 充分小即可避开」。
  把被积函数的极点集写成 Φ₁₀ 的零点集在半周期平移下的原像：v 是极点 ⟺ u := v+1/2 使
  (ρ, u; u, σ) ∈ Div(Φ₁₀)。记
    K_t := { (ρ,u;u,σ) : Re ρ,Re σ∈[0,1], Re u∈[1/2,3/2], Im ρ=2nΛ, Im σ=2mΛ, Im u=tΛ }，
  K₀ 紧致。由 holography.sen-d19-family-is-igusa-phi10-divisor（穷尽性）与两张
  holography.ell-zero-contour-avoids-*（它们的 Re v 已放开到 ℝ，覆盖窗口 [1/2,3/2]）：
  K₀ 与 Z' := Div(Φ₁₀) 中除 {u∈ℤ} 外全部分支之并 不相交。Div(Φ₁₀) 是 ℍ₂ 的闭解析子集，
  其不可约分支族局部有限，故任何子族之并（特别是 Z'）是闭集；于是 δ := dist(K₀, Z') > 0。
  取 ε₀ > 0 使 ε₀Λ < δ 且 ε₀ < 2√(mn)（后者保证 Im ρ·Im σ −(Im u)² = 4mnΛ² − ε²Λ² > 0，
  即 K_t ⊂ ℍ₂）。则对 |t| ≤ ε₀：K_t ∩ Z' = ∅；又 {u∈ℤ} 要求 Im u = 0，故 t ≠ 0 时
  K_t ∩ Div(Φ₁₀) = ∅。**结论**：0<ε<ε₀ 时 C_±(ε,Λ) 上被积函数处处正则（(b1)），
  且闭带 |Im u| ≤ εΛ 内的极点只有 u=1，即 v=1/2。

  **步骤 2（对 v 的矩形围道）**。固定 (ρ,σ)。被积函数关于 v 以 1 为周期
  （𝒢 由 holography.phi10-periodic-in-v；ℓ=0 时指数核与 v 无关），故矩形
  {Re v∈[0,1], Im v∈[−εΛ, +εΛ]} 的两条竖直边积分相消，
    ∫_{C_−,v} − ∫_{C_+,v} = ± 2πi · Res_{v=1/2}[𝒢·e^{−2πi(mρ+nσ)}]（定向不影响下文）。

  **步骤 3（留数为零）**。由 holography.phi10-order-two-in-v-on-ell-zero-contour，
  该 (ρ,σ) 处 h₀(ρ,σ) ≠ 0（零点阶恰为 2），于是
  holography.phi10-shifted-pole-residue-proportional-to-ell 的前提成立，给出
    Res = (−1)^ℓ·2πiℓ/h₀ |_{ℓ=0} = 0。

  **步骤 4（合起来）**。步骤 2+3 给出：对每个固定 (ρ,σ)，内层 v-积分在两侧相同。
  被积函数在紧集上连续，把这个逐点相等的差沿 (ρ,σ)（紧致二维环面）积分即得 (b2)。
  同理，同侧两个 0<ε<ε'<ε₀ 之间的带内无极点（步骤 1），两者积分相等，即 (b3)。
  故公共值良定，d_*(m,n,0) 可无歧义地取为该值，不需要主值规定。∎

  **符号说明**：以上全部用定义 D 的 𝒢（含整体负号）。d_*^{定义D} = −d_*^{Rosselló}
  （proof.md §5.1，curator 亲自复核该换算），良定性与整体符号无关，故两套约定同时成立。
