  **本推导与 proof.md §4.1 的一处写法差异**：proof.md 把两侧之差写成
  `2πi × ∫∫dρdσ · Res`，需要先交换积分次序；本推导改为「先对每个固定 (ρ,σ) 做内层
  v-积分，逐点相等后再对 (ρ,σ) 积分」，避免了 Fubini 的额外可积性讨论。结论相同。

  **与壁跨越的关系（诠释，不在断言内）**：同一个留数在 ℓ≠0 时非零并线性正比于 ℓ，
