id: holography.ads-laplace-dirichlet-unique-v2--via-partial-wave-expansion
target: holography.ads-laplace-dirichlet-unique-v2
kind: physical-argument
status: physical-argument
depends_on:
  - id: holography.conformal-boundary-so2d
    inferred: false
    note: >-
      非 inferred：本推导用的球模型 B_{d+1} 与度规 (2.1)、以及等价写法
      ds² = dy² + sinh²y dΩ²（(2.5)，分波用的就是这一套坐标——原文印刷页 p.6 逐字
      "Now, in the representation (2.5) of B_{d+1}, the Laplace equation reads"），
      都由同文 §2.1 的 (2.1)–(2.6) 给出；「边界是 S^d」这一说法也来自那里。
sources:
  - ref: witten-1998-ads
    loc: |
      arXiv:hep-th/9802150v2, §2.2 "Massless Field Equations", 印刷页 p.6（全段连同
      式 (2.7)(2.8)(2.9) 都在这一页），续到 p.7（§2.4 的第二个证明的前瞻）；
      §2.1 的坐标 (2.1)(2.5) 在印刷页 p.4–5。
      （页码是**原文印刷页码**，PDF 页 = 印刷页 + 1；本轮由 curator 按 arXiv v2 页图逐页复核。）
    note: |
      ⚠ (2.7) 右端测度原文印作 d⁵y，左端是 d^{d+1}y；按上下文应为 d^{d+1}y，arXiv v2 未改。
      ⚠ 式号：D_i D^i φ = 0 在原文**无编号**；**(2.8)** 是 (2.5) 表示下含 L²/sinh²y 项的方程。
summary: |
  Witten §2.2 的论证，分唯一性与存在性两段：

  **唯一性**：设 φ 是 B_{d+1} 上 Laplace 方程（D_i D^i φ = 0，原文此式**无编号**）的平方可积解。
  分部积分给

      0 = − ∫_{B_{d+1}} d^{d+1}y √g φ D_i D^i φ = ∫_{B_{d+1}} d^{d+1}y √g |dφ|²    (2.7)

  故 dφ = 0，即 φ 为常数；再由平方可积性得 φ = 0。
  原文把这条事实与唯一性相连的逐字说法是：若存在非零平方可积解，
  "it could be added to any given solution, spoiling uniqueness"——即这是唯一性的**必要**条件。
  （由此补成充分条件所需的「两个同边界值解之差平方可积」原文没有，见 gaps。）

  **存在性**：原文印刷页 p.6 逐字 "Now, in the representation (2.5) of B_{d+1}, the Laplace
  equation reads"，给出带角向项的方程

      ( − (1/(sinh y)^d)(d/dy)(sinh y)^d(d/dy) + L²/sinh²y ) φ = 0            (2.8)

  （L² 是 Laplace 算子的角向部分）。写 φ = Σ φ_α(y) f_α(Ω)（f_α 是 S^d 球谐），
  则每个 α 的方程在**大 y** 处化为

      (d/dy) e^{dy} (d/dy) φ_α = 0                                           (2.9)

  两个解分别趋于常数与 e^{−dy}。**枢纽步（原文逐字）**："One linear combination of the two
  solutions is smooth near y = 0; this solution has a non-zero constant term at infinity (or one
  would get a square-integrable solution of the Laplace equation)."
  ——即：内部正则性挑出唯一一个线性组合，而它在无穷远的常数项非零（否则就违反上面那条
  「无平方可积解」的事实），于是该分波可以被重标度到任意给定的常数边界值。
  因此每个分波都有唯一的、在无穷远取给定常数值的解；按适当系数把各分波叠加，
  得到在无穷远取任意给定值 φ(Ω) 的唯一解。

  原文自陈的适用范围（逐字）："the proof we have given is valid for any spherically symmetric
  metric with a double pole on the boundary. (With a little more effort, one can make the proof
  without assuming spherical symmetry.)"；§2.4 另给一个基于积分公式（体–边界传播子）的
  存在性证明，但那个证明需要 B_{d+1} 上度规的显式形式。

  这是 Witten 全文里**唯一自称给出证明**的部分。取 status: physical-argument 而非 rigorous，
  理由见 gaps：函数空间、边界项、收敛性都没有指定。
gaps:
  - >-
    **唯一性论证缺一个环节（编者记账）**：原文只证「没有非零平方可积解」，
    并逐字说这是必要的（否则 "it could be added to any given solution, spoiling uniqueness"）。
    要由此得到唯一性，还需「两个有相同边界值的解之差是平方可积的」，
    **这一句原文没有写，也没有证**（v1 推导曾把它当作原文内容写进 summary，本 v2 改为记在此处）。
    它不是平凡的：解在 y → ∞ 趋于常数（非零），而边界值相同只保证差的极限为零，
    衰减快到平方可积还要另证，且「平方可积」相对哪个测度原文未写
    （(2.1) 的体积元在 |y| → 1 处发散）。
    ⚠ 还有逻辑循环的风险：原文在**存在性**那一步又用「否则就得到一个平方可积解」来断定
    非零常数项，即同一事实被用在两个方向上；要严格化必须把这两处的依赖关系理清。
  - >-
    函数空间未指定：φ(Ω) 属于哪个空间（连续？L²？光滑？）、解 φ 在什么意义下「有边界值」、
    「平方可积」相对哪个测度，原文都没有写。
  - >-
    分部积分 (2.7) 的边界项没有讨论：B_{d+1} 是带边（共形边界）的，
    要让边界项消失需要对 φ 在 y → ∞ 的衰减做假设，原文只说「平方可积」。
  - >-
    分波叠加的收敛性没有讨论：「adding these up with suitable coefficients」是断言，
    系数的存在性与级数收敛性均未验证。
  - >-
    枢纽步里的「某个线性组合在 y = 0 附近光滑」本身是断言：原文没有给 y = 0
    （球心，(2.5) 坐标的正则奇点）处的正则性分析，也没有说明为什么这样的线性组合恰好唯一。
  - >-
    (2.9) 是大 y 的**渐近**方程：原文的说法是 (2.8) 分波后 "the equation for any φ_α looks for
    large y like" (2.9)，即角向项 L²/sinh²y 与 e^{dy} 相比在大 y 被丢掉，
    但从渐近解到整体解的延拓（内部正则性、光滑匹配、误差控制）没有验证。
  - >-
    原文式 (2.7) 的测度印作 d⁵y（应为 d^{d+1}y），arXiv v2 未改；本图不沿用该印刷错误。
  - >-
    **只覆盖无质量标量**。有质量时 (2.34) 根本没有趋于常数的解，φ_0 要由 φ ∼ f^{−λ₊}φ_0
    （(2.36)）重新定义且是共形密度；引力与规范场情形完全另论（Graham–Lee 只给局部结果，
    规范场版 Witten 自称 "one expects" 且脚注 4 用 Chern class 证明大场下必然失败）。
  - >-
    §2.4 的第二个存在性证明（积分公式）本推导未收：它需要度规的显式形式，
    且与 (2.11) 的两点函数计算纠缠在一起，属于另一条论证线。
