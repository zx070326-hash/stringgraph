  (5) loc 改用**原文印刷页码**并逐页复核：§2.2 整段在印刷页 p.6。
  v1 推导保留不动（docs/STATUS_LEVELS.md「旧推导的去留」裁决）。

  【为什么仍不是 rigorous，也不写 reviewer-verified】reviewer-gkpw 2026-09-11 复核了本推导的
  来源、页码与式号，但明确裁定**不可升 rigorous**：函数空间未定，论证也不是有限步初等计算
  （分波叠加的收敛性、正则性延拓都是分析问题）。按 docs/STATUS_LEVELS.md 的 rigorous 例外裁决，
  只有「前提完整 + 有限步初等计算 + reviewer 独立复核」三条同时满足才写 reviewer-verified，
  故本推导**不**写该记录。

  【为什么 kind 不是 proof】graph/schema/derivation.schema.json 要求 kind: proof 时
  status 必须是 formalized 或 rigorous。本推导按 docs/STATUS_LEVELS.md 只能到
  physical-argument（前提不完整、来源不是数学文献、未经 reviewer 独立复核），
  故 kind 取 physical-argument。原文自称 "proof" 这件事记在这里，不体现在 kind 上。

  【升级路线】本条是整个 GKPW 链上最接近可严格化的命题之一：
  补上函数空间与衰减条件后，唯一性那半段是标准的能量（Dirichlet 积分）论证。
  但要真正补全，必须先解决 gaps 第一条——把「无平方可积解」与「两解之差平方可积」
  这两件事的依赖关系理清，否则严格化会在同一处循环。
  升级时应再新建一张前提完整的卡（写明 Sobolev 空间、加权测度与边界迹的意义），
  而不是改本卡的 statement。

