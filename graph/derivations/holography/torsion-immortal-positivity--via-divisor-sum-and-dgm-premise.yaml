    note: "Cor 4.2：𝔉[𝒱_s𝒢; m,n,ℓ; Λ] = d_*(m/s²,n,ℓ/s)（当 s²|m, s|ℓ）。这是 (a) 的全部数学内容——𝒢_I = Σ_{s|I}s·𝒱_s𝒢 是有限和，逐项用 Cor 4.2 积分。s|I ⟹ s²|I²|m 与 s|I|ℓ，前提满足"
