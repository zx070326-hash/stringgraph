summary: |
  **(a) 除子和恒等式（纯数学）**：𝒢_I = Σ_{s|I} s·𝒱_s𝒢 是有限和，积分线性，逐项用
  attractor-contour-covariance 的 Cor 4.2。可用性检查：s|I ⟹ s²|I²|m（故 s²|m ✓）
  且 s|I|ℓ（故 s|ℓ ✓），Cor 4.2 前提满足。每项给出 d_*(m/s²,n,ℓ/s)。求和得 (a)。

  **(b) 正性（纯数学）**：对每个 s|I，重标三元组 (m/s², n, ℓ/s) 满足
  m/s² ≥ 1（s²|m 且 m≥1）、n ≥ 1、Δ/s² = (4mn−ℓ²)/s² > 0。由 Rosselló Cor 1.1
  （无 gcd 前提）得 d_*(m/s²,n,ℓ/s) > 0。权 s > 0 为正，有限个正数之和为正，得 (b)。
  注 6.2：重标后三元组的 gcd 一般 > 1（例 I=2,(16,2,8)→s=2 项 (4,2,4) gcd=2），
  故 Cor 1.1 无 gcd 前提是 (b) 成立的关键。

  **(c) 物理陈述（依赖物理前提）**：在 DGM eq(52)（Ω_I = Σ_{s|I} s·Ω₁(m/s²,n,ℓ/s)，
  即 Ω_I = d_*^{(I)}）之下，(a)(b) 的纯数学结论即读作挠 I 单心 dyon 指标 Ω_I > 0。

  **数学部分不经过 mock 分解**，故 [GAP 9.4]（U_s 与 DMZ 分解交换）与 [GAP 10.2b]
  （n≥m ⟹ mock 系数=免死指标）都不影响本推导。
gaps:
  - "(c) 依赖物理前提 (P′)=DGM eq(52)；该前提本身无纯数学证明（proof.md §8 表明它不可能是 Hecke 恒等式，只能是一个定义/物理输入）"
  - "数值佐证（proof.md §12）：219 个挠电荷点上 eq(52) 读法恒正，13 个点两读法给出不同整数；数值不构成证明"
