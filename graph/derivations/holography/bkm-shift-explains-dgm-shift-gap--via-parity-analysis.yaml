summary: |
  奇 d 情形（Lemma B.3(a)）：(d−1)/2 ∈ ℤ，直接用 Φ₁₀ 的整周期性逐次叠加整数周期即得
  Φ₁₀(τ,dz+(d−1)/2,d²σ) = Φ₁₀(τ,dz,d²σ)，故该项与 DGM 无平移式相等。
  偶 d 情形（Lemma B.3(b)，反证）：假设半整平移在 Φ₁₀ 上无效果（即 Φ₁₀ 关于 v 有额外的
  1/2-周期），则由 Borcherds 乘积展开，Φ₁₀ 在判别式 −1 处的 Fourier–Laurent 系数应当在
  v ↦ v+1/2 下不变；但该系数对应的乘积因子在 v ↦ v+1/2 下取相位 e^{iπ}=−1（奇数次幂），
  与"不变"矛盾，故半整平移在偶 d 情形一般非平凡，该项与 DGM 无平移式一般不相等。
  两种情形合并即为推论 B1 的完整陈述。
