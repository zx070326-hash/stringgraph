     对 DMZ 分解定理的依赖经由 mock-jacobi-coefficient-positivity 与识别③间接保留，
     不再直接列出（避免重复边）。
  2. 覆盖范围措辞订正：Bringmann–Murthy 2012 覆盖的是**指标 m=1,2**（对这两个 m 覆盖全部
     Δ>0，含小判别式），**不是**"充分大判别式"；Rosselló 2024 补齐 m≥3。
