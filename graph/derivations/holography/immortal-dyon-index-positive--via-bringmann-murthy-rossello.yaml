summary: |
  本节点的目标陈述是**物理命题**：它把 d_F(m,n,l) 直接称为 immortal（单心）dyon 的螺旋超迹，
  并断言该指标为正。论证分两块，严格程度由较弱的一块决定：

  1. **数学部分（rigorous，不在本推导内证明）**：mock Jacobi 系数的符号正性
     (−1)^{ℓ+1} c_m^F(n,ℓ) > 0（全部 m,n≥1、Δ=4mn−ℓ²>0、gcd(m,n,l)=1）由
     holography.mock-jacobi-coefficient-positivity 提供（Rosselló 2024 Theorem 1 +
     Corollary 1.1，指标 m=1,2 归 Bringmann–Murthy 2012；方法为 GL(2,ℤ) 约化 +
     Rademacher 展开 + Kloosterman/Bessel 显式定界，纯解析数论）。

  2. **物理一步（physical-argument，本推导补的就是这一步）**：要把上述系数读作"单心 dyon 指标"，
     必须用识别③（holography.dmz-single-center-identification）——即 DMZ 2012 论证在 immortal
     chamber 内极部 φ_P 的系数对应多中心态、有限部 φ_F 的系数对应单心态。该识别依赖
     localization/supergravity 分析与 hair-mode 分解的存在性假设（Rosselló §1 明写
     "We assume that such frame exists"），文献称之为 the finite part conjecture，
     不是数学推论。

  故 **effective = physical-argument**：数学侧已完全关闭，剩下的唯一缺口是识别③。
  （本推导原先只链 DMZ 分解定理并标 rigorous，等于把比目标弱的纯数学命题冒充为目标命题，
  造成 status 虚高；task #20 拆分修正：纯数学部分独立成卡，本推导只承担物理识别一步。）
notes: |
