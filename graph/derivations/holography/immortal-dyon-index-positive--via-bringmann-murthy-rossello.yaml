    inferred: false
    note: "提供纯数学结论：单心指标 d_∗(m,n,ℓ)>0 对全部 m,n≥1、Δ=4mn−ℓ²>0、gcd=1 成立（Rosselló Cor 1.1，d_∗ 为吸引子围道积分；在代表元范围 n≥m、0≤ℓ≤m 内 d_∗=(−1)^{ℓ+1}c_m^F，见 Thm 1；m=1,2 归 Bringmann-Murthy）。**离开代表元范围 (−1)^{ℓ+1}c_m^F 可为负（反例 (10,1,6)），全范围为正的对象是 d_∗**"
  - id: holography.dmz-single-center-identification
