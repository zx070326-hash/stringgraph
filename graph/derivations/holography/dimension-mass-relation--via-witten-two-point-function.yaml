id: holography.dimension-mass-relation--via-witten-two-point-function
target: holography.dimension-mass-relation
kind: physical-argument
status: physical-argument
depends_on:
  - id: holography.gkpw-dictionary
    inferred: false
    note: >-
      非 inferred：读出维数的那一步用的就是字典。原文把 I(φ) 算成 (2.42)
      I(φ) = (c'(d+λ₊)/2) ∫ dx dx' φ_0(x)φ_0(x')/|x−x'|^{2(λ₊+d)}，
      然后逐字说 "This is the expected two point function of a conformal field O of dimension
      λ₊ + d."——即把 exp(−I) 当作 ⟨exp∫φ_0 O⟩ 的鞍点，正是 (2.10)+(2.11)。
  - id: holography.conformal-boundary-so2d
    inferred: false
    note: >-
      非 inferred：λ₊ 的定义与 φ_0 的共形权重都用到 §2.1 的 (2.2)(2.3)(2.4)——
      (2.36) 里的辅助函数 f 就是 (2.2) 的那个 f，φ_0 → e^{wλ₊}φ_0 的变换律
