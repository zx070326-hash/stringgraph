sources:
  - ref: witten-1998-ads
    loc: |
      arXiv:hep-th/9802150v2：§2.5 "The Massive Case" p.19–20，式 (2.33)(2.34)(2.35)(2.36)；
      §2.5 "Computation Of Two Point Function" p.21，式 (2.37)(2.38)(2.41)(2.42)(2.43)(2.44)；
      §2.6 p.25 式 (2.48) 重复结论；p-形式版 (2.45) 在 p.22；BF 界 (2.47) 在 p.24。
summary: |
  Witten §2.5 的推导链（式号依 arXiv v2，AdS 半径 = 1）：

  1. 有质量标量的作用量与运动方程：I(φ) = ½∫dμ(|dφ|² + m²φ²)（(2.33)）；
     在 ds² = dy² + sinh²y dΩ² 坐标下分波后得
     (−(1/(sinh y)^d)(d/dy)(sinh y)^d(d/dy) + L²/sinh²y + m²)φ = 0（(2.34)）。
  2. 大 y 渐近：L² 项无关紧要，两个独立解像 e^{λy}，其中

         λ(λ + d) = m²                                    (2.35)

     原文限定 m² 落在该二次方程有实根的区间；记较大根 λ₊（λ₊ ≥ −d/2）与较小根 λ₋（λ₋ ≤ −d/2）。
     在内部光滑延拓的那个线性组合在无穷远像 e^{λ₊ y}。
  3. 因此**找不到**在无穷远趋于常数的解，φ_0 必须重新定义：取在边界有单零点的正函数 f，
     解取成 φ ∼ f^{−λ₊} φ_0（(2.36)）；由 f → e^w f 得 φ_0 → e^{wλ₊}φ_0，
     故 φ_0 是长度维数 λ₊（质量维数 −λ₊）的**共形密度**，不是函数。
  4. 上半空间坐标下解体–边界传播子：(−x_0^{d+1}(d/dx_0)x_0^{−d+1}(d/dx_0) + m²)K = 0（(2.37)），
     在 x_0 = 0 处消失的解是 K(x_0) = x_0^{d+λ₊}；平移+反演得
     K = x_0^{d+λ₊}/(x_0² + |x|²)^{d+λ₊}（(2.38)），于是
     φ(x) = c' ∫dx' [x_0^{d+λ₊}/(x_0²+|x−x'|²)^{d+λ₊}] φ_0(x')（(2.41)）。
  5. 代回作用量得

         I(φ) = (c'(d+λ₊)/2) ∫ dx dx' φ_0(x)φ_0(x') / |x−x'|^{2(λ₊+d)}      (2.42)

     原文逐字："This is the expected two point function of a conformal field O of dimension λ₊ + d."
  6. 结论（(2.43)(2.44)）：Δ = d + λ₊，是 Δ(Δ − d) = m² 的**较大根**，
     即 Δ = ½(d + √(d² + 4m²))。§2.6 (2.48) 重复。

  整条链是可复算的物理推导（渐近分析 + 积分变换 + 代回作用量），
  但其**物理含义**依赖 (2.11) 的 ansatz：把 exp(−I) 读成生成泛函、把 (2.42) 的幂次读成算子维数，
  两步都由字典给出。故 status: physical-argument，而有效状态会被字典压到 conjecture。
gaps:
  - >-
    (2.42) 的推导跳过了正规化：把 (2.41) 代回 (2.33) 时体积分在边界附近发散，
    原文在无质量情形（§2.4）承认要靠重整化与共形反常处理，有质量情形没有重做这件事。
    (2.42) 里的常数 c' 与整体归一化原文也未定。
  - >-
    φ_0 依赖辅助函数 f 的选择，且是共形密度不是函数（(2.36)）；
    "φ_0 = φ 到边界的限制" 这一简单说法只对无质量（Δ = d）成立。
    同一符号在同一篇文章里换了含义（抽取记录 QW2）。
  - >-
    "取较大根" 是原文的规定而非推导结论：原文的理由是「在内部光滑延拓的那个解在无穷远像
    e^{λ₊y}」，这依赖 §2.5 对 (2.34) 内部正则解的选取，原文未给完整论证。
  - >-
    m² 的取值范围被限制在 (2.35) 有实根处，原文逐字 "For reasons that will be explained later,
    m² is limited to the region in which this quadratic equation has real roots."
    对应的下界 m² ≥ −d²/4（即 BF 界，(2.47) Δ ≥ d/2）原文自称推导 "quick and nonrigorous"，
    严格版外包给 [24–26]（Breitenlohner–Freedman 等），本项目未登记也未核实这些文献。
  - >-
    **不入图的第二条推导**：§3.3 用态–算子对应给出 "Δ = ω" 的第二条论证，但 v2 p.35 印的是
    ω = ½(d + √(d² − 4m²))（**减号**），与 (2.44) 的加号不可能同时成立，
    而正文紧接着断言 "we see that Δ = ω, as expected"。脚注 9 指出 [24] 的参数 α 是本文的 −m²，
    疑为转写符号错误。该矛盾使 §3.3 不能作为独立推导入图（详见目标卡 notes）。
    §3.3 中 "Δ 生成元 = AdS 能量算子" 一步原文用的也是 "we can assert"。
  - >-
    p-形式与非标量情形 (2.45) 出自同一节，但本推导只论证标量情形。
notes: |
  from: witten-1998-ads#E-W11、E-W12（另见 E-W17、QW2、QW6、QW7）。

  【约定】AdS 半径 = 1（conv.ads-radius-unit）。恢复显式 R 后 (2.43) 读作 Δ(Δ−d) = (mR)²。
  与 GKP (45) 在 d = 4 时代数等价（见姊妹推导 --via-gkp-bessel-asymptotics）。

  【为什么不把 conformal-boundary-so2d 的边标成 inferred】(2.36) 的 f 与 (2.2) 的 f
  是同一个对象，原文 §2.5 p.20 明写 "If we transform f → e^w f, the metric will transform by
  ds̃² → e^{2w} ds̃²"——直接引用 §2.1 的结构，故是显式依赖。

  【版本】loc 锚定 arXiv:hep-th/9802150v2 (6 Apr 1998)。
