id: holography.bss-phi-tilde-equals-minus-igusa-phi10--via-one-dimensional-space-and-numerical-anchor
target: holography.bss-phi-tilde-equals-minus-igusa-phi10
kind: conjecture-support
status: conjecture
depends_on:
  - id: holography.igusa-cusp-form-phi10-v2
    note: |
      Φ₁₀ 是权 10 Sp(4,ℤ) 尖点形式，由 Igusa 1962 建立。
      权 10 Sp(4,ℤ) 尖点形式空间一维性（Igusa 经典结果）保证
      任何两个该空间的非零元素最多相差一个全局常数。
sources:
  - ref: bhand-sen-singh-2023
    loc: "p.40 正文：'for N=1, the CHL partition function Φ̃_k⁻¹ is exactly the inverse of the Igusa cusp form Φ₁₀'（声明两者互逆，即 Φ̃₁/Φ₁₀ 为常数）"
  - ref: bhand-sen-singh-2023
    loc: "eq (5.13) 与 eq (5.69)：d*(10,14,5)=50064（BSS 体系）"
  - ref: rossello-2024
    loc: "Appendix C eq (C.2)：c_1^F(1,0)=−50064（Rosselló 体系，(m,n,ℓ)=(1,1,0)）"
    note: "数值锚点：两体系在 (1,1,0) 处 d* 符号一致（+50064），配合两篇 d* 定义式的符号差 (−1)^ℓ=1（ℓ=0），反推 Φ̃₁/Φ₁₀=−1"
summary: |
  论证路径：权 10 Sp(4,ℤ) 尖点形式空间一维性（Igusa）⇒ Φ̃₁ 与 Φ₁₀ 最多相差全局常数 c；
  数值验证 (m,n,ℓ)=(1,1,0) 处两体系吸引子系数一致（均为 +50064）⇒ c=−1。

  **标记为 conjecture 的理由**：
  - Φ̃₁ 作为权 10 Siegel 尖点形式的模性（变换律、全纯性、尖点性）依赖 BSS 对 CHL
    配分函数构造的转述（BSS eq (5.2) 无穷乘积表示），本项目未从该乘积表示独立验证
    其收敛性、Sp(4,ℤ) 变换性与零点阶数。
  - 若采信 BSS 对 Φ̃₁ 模性的转述，则 c 为全局常数这一结论 rigorous（一维性是经典结果）；
    c=−1 的数值确定可机械复核，但依赖 BSS 与 Rosselló 两体系 d* 定义式的符号差公式
    （holography.gap102b-representative-domain-dstar-equals-cmf--via-bss-notation-translation
    summary 步骤 5 推导，已在图中）。
  - 保守标记为 conjecture：待 Φ̃₁ 模性独立验证或相关推导进一步审查后可升级。
