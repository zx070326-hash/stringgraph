summary: |
  三步：(1) V_s := W_sUW_s^{−1} = [[a,b/s],[cs,d]]，因 s|I|b 使 b/s∈ℤ，det V_s=ad−bc=1，
  故 V_s∈SL(2,ℤ)。(2) 由 T′_s = W_s U T Uᵀ W_sᵀ = V_s T_s V_sᵀ（T_s := W_s T W_sᵀ 是第 s 项
  的 Gram 矩阵），S_s(m,n,ℓ)（"s²|m 且 s|ℓ"，T_s 整性条件）与 S_s(m′,n′,ℓ′) 等价（V_s 整格
  自同构，对 U^{−1} 同样满足 I|(上右元) 重复论证得逆向）。(3) 支持集匹配时，
  holography.dstar-sduality-invariant 给出 d_*(T′_s)=d_*(T_s)。逐项相等后对 s|I 求和
  （权 s 不变）得 D_I(m′,n′,ℓ′)=D_I(m,n,ℓ)。D'_I 的 Γ₀(I) 部分由
  holography.rescaling-reflection-transfer 代换 (m,n,ℓ)↦(n,m,ℓ) 得到（该代换把 U 变为
  [[d,c],[b,a]]，交换 b,c，从而把「I|b」条件变成「I|c」条件）。

  精确性（PART 5）为独立机检结果，不改变上述证明结构，只确认 Γ⁰(2) 不是可再扩大的不变群
  下界：显式给出 (4,8,0) 处三个陪集的三个不同 D_2 数值。
