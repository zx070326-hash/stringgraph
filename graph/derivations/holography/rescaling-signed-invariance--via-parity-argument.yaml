summary: |
  两步同余式：由半整 Gram 矩阵变换公式 (0.1) ℓ′=2acm+(ad+bc)ℓ+2bdn 直接得
  ℓ′≡(ad+bc)ℓ (mod 2)（式 8.1）；对第 s 项重标三元组 (m/s²,n,ℓ/s) 应用同一式（矩阵
  V_s=[[a,b/s],[cs,d]]，s|I|b 使 b/s∈ℤ）得 ℓ′/s≡(ad+bc)(ℓ/s) (mod 2)（式 8.2，用到
  acm/s=acs·(m/s²)∈ℤ 与 bdn/s=(b/s)dn∈ℤ 两个整性事实）。两式相减，
  ℓ′−ℓ′/s≡(ad+bc)(ℓ−ℓ/s) mod 2；由 U∈SL(2,ℤ) 即 ad−bc=1，得 ad+bc=1+2bc 为奇数，
  故 ℓ′−ℓ′/s≡ℓ−ℓ/s (mod 2)。符号因子 (−1)^{ℓ−ℓ/s} 逐项相等；支持集与数值的匹配直接
  引用 holography.rescaling-invariance-groups 证明中的步骤 (2)(3)（对 D_I 已建立，本推导
  不重复证明，只额外核实符号）。综合得 D̃_I[f] 在 Γ⁰(I) 下逐项不变。

  机检（PART 6）：I=2 时 24304 个满足 I|b 的实例、I=3 时 4700 个实例，符号匹配 0 违例；
  直接对 I∈{2,3,4,6}, m,n<30, |ℓ|≤20 核对同余式本身，0 不符。
