summary: |
  **引理 7.1**：对 (Q,P) 施加 S=[[0,1],[−1,0]]：(Q,P)↦(P,−Q)。像标架的 Q′=P∈IΛ，即
  Q-适配，不变量 (m′,n′,ℓ′)=(n,m,−ℓ)。由 (H2) 指标不变；由 (H1) 指标等于
  D_I(n,m,−ℓ)=Σ_{s|I} s·d_*(n/s²,m,−ℓ/s)。逐项用 d_* 关于 ℓ 的偶性（dstar-sduality-invariant
  在 A=diag(1,−1) 处）化为 s·d_*(n/s²,m,ℓ/s)，再用 Thm A 的证明同款代换
  d_*(n/s²,m,ℓ/s)=d_*(m,n/s²,ℓ/s)（对换矩阵特例），得 Σ_{s|I} s·d_*(m,n/s²,ℓ/s)=D'_I(m,n,ℓ)。

  **定理**：取 scripts/lattice_frames_output.txt block L2 中 U⊕U⊂Λ 里显式构造的两个不同
  秩 2 子格：
    Q-适配格：Q=2e₁+2f₁∈2Λ, P=4e₁+e₂+8f₂；挠 2，不变量 (4,8,8)。
    P-适配格：Q=4f₁+e₂+4f₂, P=2e₁+4f₁∈2Λ；挠 2，不变量 (4,8,8)。
  两格的不变量恰好相同（4,8,8），但一个 Q-适配一个 P-适配。由 (H1) 与引理 7.1 分别得
  指标 D_2(4,8,8)=d_*(4,8,8)+2d_*(1,8,4)=7999541469408（s=2 项约化到 (1,4,0)）与
  D'_2(4,8,8)=d_*(4,8,8)+2d_*(4,2,4)=7999235715072（s=2 项约化到 (2,2,0)），(1,4,0) 与
  (2,2,0) 是判别式 −16 的两个不等价类（h(−16)=2），故两指标不同，差 305754336。四个 d_*
  数值与 holography.rescaling-frame-dependence-witness 使用的完全一致（本质是同一对
  GL(2,ℤ)-等价类，只是这里用于两个不同的格而非同一格的两个标架）。
