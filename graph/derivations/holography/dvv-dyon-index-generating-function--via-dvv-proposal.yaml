summary: |
  【2026-09-20 Φ₁₀ 重数订正：本边刻意留在 v1，不重定向】
  本推导依赖 holography.igusa-cusp-form-phi10（v1）而不是 v2 的理由：DVV 识别①只消费
  1/Φ₁₀ 的 Fourier 展开存在性（将傅里叶系数识别为 dyon 螺旋超迹），完全不依赖零点重数的
  具体数值（重数=1 还是=2）。v1 卡关于 Fourier 展开的断言是正确的（订正只涉及重数那一句），
  故本边留在 v1 是逻辑正确的选择。
  详见 docs/reviews/phi10-multiplicity-normalization-2026-09-20.md §2（9 个可留 v1 的判据）。

  DVV 通过以下论证支撑识别①：
  1. 计算 1/Φ₁₀ 的低次傅里叶系数 d(m,n,l)，与已知的 1/4-BPS 态直接计数吻合；
  2. 用 4d-5d 提升（type II on K3×T² ↔ type II on K3×T³）和超对称非重整化论证，
     将生成函数的形式约束到 Sp(4,ℤ) 模形式；
  3. 通过对偶论证（S-对偶、T-对偶）推断生成函数整体必为 1/Φ₁₀。
  原文措辞"我们提议"（we propose）和"猜想"，承认这是猜想级别而非证明。
