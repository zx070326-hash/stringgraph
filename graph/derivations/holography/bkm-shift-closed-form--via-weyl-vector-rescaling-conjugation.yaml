    note: |
      本项目原创证明，非已发表文献。2026-09-18 由另一 theorem-prover 任务
      （weyl-shift-diagnostic）独立完成后并入本文件。经 graph-reviewer 对抗审查
      （2026-09-18，六个攻击面）：核心 Lemma 9.1–9.4 与定理 9 未被攻破（攻击面 1–3、6 未攻破；
