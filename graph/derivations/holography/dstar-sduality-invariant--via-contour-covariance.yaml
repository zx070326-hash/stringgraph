summary: |
  **证明（proof.md §4 Prop 4.4）**：令 Ω′ = AΩAᵀ，T′ = A^{−T}TA^{−1}。
  (1) **相位**：Tr(ΩT) = Tr(Ω′T′)（纯线性代数等式）。
  (2) **围道**：Im Ω′ = A(2Λ adj T)Aᵀ。用 adj(X^{−1}) = adj(X)^{−1} 和 adj(AB) = adj(B)adj(A)：
      adj(T′) = adj(A^{−T}TA^{−1}) = adj(A^{−1})adj(T)adj(A^{−T}) = det(A)^{−2}·A adj(T)Aᵀ。
      对 det A = ±1 有 det(A)^{−2} = 1，故 A adj(T)Aᵀ = adj(T′)，**Λ 不变**。
  (3) **实部与 Jacobi 行列式**：Ω↦AΩAᵀ 是 Sym₂(ℝ)/Sym₂(ℤ) 上的线性双射（det A = ±1 保整格），
      Jacobi 行列式 det(A)³ = ±1。𝒢 的周期性在新坐标下保持（Tr(ST′)∈ℤ 对整对称 S）。
      积分区域折叠后值不变。
  **ℓ→−ℓ**：A=diag(1,−1)（det=−1），步骤(2)仍成立；S_A𝒢=𝒢 由 Φ₁₀ 偶权保证。
  整个证明纯数学，无物理输入，reviewer-verified。

  **Note 4.5 的意义**：本证明替换了 Rosselló §3.1"引 S-对偶不变性（物理动机）"的桥梁，
  将 Cor 1.1 的推广步完全落实在 Φ₁₀ 的 Sp(4,ℤ) 模性 + 围道定义上。
  GAP 6.3 于 2026-09-15 关闭（逐字确认 Cor 1.1 陈述不含 gcd=1 前提）。
