summary: |
  逐项比较 D'_I(m,n,ℓ) 与 D_I(n,m,ℓ) 的 Dirichlet 级数展开：两者的第 s 项存在条件相同
  （s²|n 且 s|ℓ），且两个求和号内的值 s·d_*(m,n/s²,ℓ/s) 与 s·d_*(n/s²,m,ℓ/s) 由
  holography.dstar-sduality-invariant 的 m↔n 对称特例（对换矩阵）逐项相等。因此两个有限和
  在同一指标集上逐项相等，级数本身相等。证明只用到接口边给出的定义与 d_* 的类函数性质，
  不需要任何 mock 模形式的分解结构。
