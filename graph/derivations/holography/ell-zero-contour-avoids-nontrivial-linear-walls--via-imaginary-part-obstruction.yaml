summary: |
  **约束 (I)（必要条件）**。设点 Ω ∈ C_*(m,n,0;Λ) 落在某个 n₂=0 分支上，即
  F = jv + n₁σ − m₁ρ + m₂ = 0。代入 ρ = ρ₁+2inΛ、σ = σ₁+2imΛ、v = v₁（ℓ=0 ⟹ Im v = 0）：
    Im F = 2mn₁Λ − 2nm₁Λ = 2Λ(mn₁ − nm₁)。
  F = 0 蕴含 Im F = 0，而 Λ > 0，故必有
    **(I₀)  m n₁ = n m₁。**
  （这正是 route-a Lemma 1 的 (I) 在 n₂=0、ℓ=0 处的退化形式：h = jℓ + 2(mn₁−nm₁) = 2(mn₁−nm₁)。
  curator 亲自重算 Im F，与 Lemma 1 逐字一致。注意 (I₀) 不含 ρ₁, σ₁, v₁，故结论对
  **一切实** Re ρ, Re σ, Re v 与一切 Λ>0 成立。）

  **与判别式联立（三行穷尽）**。n₂=0 时判别式退化为 4m₁n₁ + j² = 1，j 奇。
  - **m₁, n₁ 都非零**：由 (I₀) 得 n₁/m₁ = n/m > 0（m,n ≥ 1），故 m₁, n₁ **同号**，
    从而 m₁n₁ ≥ 1，于是 j² = 1 − 4m₁n₁ ≤ −3 < 0——不可能。
  - **恰好一个为零**：若 m₁ = 0、n₁ ≠ 0，(I₀) 给 m n₁ = 0，因 m ≥ 1 得 n₁ = 0，矛盾；
    若 n₁ = 0、m₁ ≠ 0 同理由 n ≥ 1 得 m₁ = 0，矛盾。
  - 故满足 (I₀) 与判别式的只剩 **m₁ = n₁ = 0**（此时 j² = 1，m₂ 自由，分支为 {v ∈ ℤ}），
    而它按定义不属于「非平凡线性壁」。

  **结论**：每个非平凡线性壁分支（n₂=0 且 (m₁,n₁)≠(0,0)）都不含 C_*(m,n,0;Λ) 的点，
  对一切 Λ>0。最后把结论从 (D.19) 族搬到 Div(Φ₁₀)，用
  holography.sen-d19-family-is-igusa-phi10-divisor（承重，显式接线）。

  **与 proof.md §6.2 的关系**：proof.md 把同一件事拆成三个子族——(a) m₁=0,n₁≠0 与
  (b) n₁=0,m₁≠0 用「零点处 Im v = ∓2mn₁Λ 或 2nm₁Λ ≠ 0，而围道要求 Im v = 0」排除；
  (c) j²≥9 用「判别式要求 m₁n₁<0（异号）而 (I) 要求同号」排除。两条路线结论一致；
  上面的版本是 curator 亲自重做后的合并写法（把 (a)(b) 也归到 (I₀)，并把 (c) 的符号
  矛盾推广到**全部** m₁n₁≠0 的情形，因而不必单独讨论 j²≥9）。proof.md §6.2 的
  子族 (a)(b) 用 Im v 计算独立复核了同一结论。
