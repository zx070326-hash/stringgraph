  **适用的是 docs/STATUS_LEVELS.md 等级 4 的例外条款**（lead 裁决 2026-09-10）：本推导的
  陈述前提已完整写在目标卡 statement 里，论证是有限步初等计算（解一条线性约束、一条
  二次式的顶点、两级不等式），且已有 reviewer 独立复核。故可标 rigorous 而不要求
  「发表的数学文献」。

  **两位 reviewer 各自独立做了什么**（区分开，避免把「两份一致」误读成独立佐证）：
  - ell0s6rev：用**自己写的** sympy 脚本从 g(t) 定义重推 route-a Proposition 7 的顶点
    高度闭式（不 import route-a 的脚本），并查出 F-5 与 F-4。
  - ell0f5rev：从 route-a §2 Lemma 1 的 (I) **原始定义**重推 ℓ=0 的 σ₁ 解、
    手验 (P7)→(★) 的每个不等号、手验 ρ↔σ 的 Sp(4,ℤ) 条件与判别式不变性。
    它**明确声明**自己没有重推 (P7) 本身是怎么从 g(t) 消出来的（那一步它转信 ell0s6rev
    与 n2rev）。**即：(P7) 的独立复算只有一次（ell0s6rev），不是两次。**

  **ell0f5rev 补充报告里自报的「转述信任、未亲自重做」清单（2026-09-20 晚，如实记入）**：
  (a) route-a Proposition 7 的原始推导（转信 n2rev 的 VERIFIED）；
  (b) Sen 2008 (D.19) 的 PDF 逐字（转信 route-a §1.3 的抽取，未回 arXiv:0708.1270v4 原文）；
  (c) [EXT-Div] / [EXT-Even] 两张图卡的 depends_on 链（只确认「使用方式与卡的声明一致」）；
  (d) proof.md §6.2 的复数代入与虚部提取（**故它不构成 §6.2 的第二次独立验证**，
      §6.2 的独立复算仍只有 ell0s6rev 一次 + curator 落地时的 Im F 重算）；
  (e) prover 在 §6.1 第 4 步内联的 sympy 脚本——**读了逻辑但未实际执行**；
  (f) route-a 全文中 `n≥m` 四处使用位置是否在 Theorem 9 引用链上（转信 prover 的引用图）。
  **对 (a)+(f) 的覆盖补充**：这两条合起来就是 F-5 关闭的核心断言「Theorem 9 不用 n≥m」。
  它并非只靠 prover 自述——**ell0s6rev 从 g(t) 定义独立重推 (P7) 的闭式时全程未用 n≥m**，
  这是对同一断言的一次实质独立检验。但两位 reviewer 都没有自己 grep route-a 画引用图，
  这一条仍是**单点信任 prover 的引用图**，如实记在此处。

  **【本推导的不等式写法比上游 proof.md 更正确 —— lead 2026-09-20 晚记】**
  上面 summary 步骤 2 写的是
    `Λ²(t*) ≤ 1/(4n₂²Δ) ≤ 1/(4Δ) = 1/(16mn)`（因 n₂² ≥ 1），
  **两个 ≤ 都在，是对的**。而上游 `proof.md:438` 逐字写成
    `Λ²(t*) ≤ 1/(16mnn₂²) = 1/(4Δ)`，
  那个 `=` **只在 |n₂|=1 时成立**（ell0s6rev 的 F-4）。即本推导落地时 curator 已经
  （有意或无意地）写对了这一步，上游的形式错误**没有传进图里**。已派 prover 回填
  proof.md。记在此处是为了留痕：不要在同步上下游时反过来把图里正确的式子「改回」去。
  【2026-09-20 晚：回填已落地，`proof.md` 那一步现为两级不等式
  `≤ 1/(16mnn₂²) ≤ 1/(16mn) = 1/(4Δ)`，并注明中间一步用 `n₂²≥1`、末尾等号用 ℓ=0 时
  Δ=4mn。**上下游现在一致，且一致到图这一侧的写法上**；本段的警告依然有效。】

  **curator 亲自核对了什么**：Read 了 research/attempts/ell-zero-wall-degeneracy/proof.md
  §6 全文与 research/attempts/gap-102b-route-a 的两张已毕业卡（linear/quadratic wall）
  及其推导；亲自重算了 Im F = Λ·h（步骤 1）与 (D.19) 的 v↦v+1 不变性（Re v 放开的理由
  (ii)）。未重跑 SymPy 脚本，未独立重推 Proposition 7 的顶点闭式（转述信任，见 gaps；
  **ell0s6rev 已于 2026-09-20 晚独立重推该闭式并对上**）。

  **为什么不把姐妹卡 holography.attractor-contour-avoids-phi10-quadratic-wall 接成依赖**：
  它的 statement 对 0<ℓ≤m 全称量化，ℓ=0 的结论不是它的逻辑后承；接上去会制造一条
  假的支撑关系。它 statement 里那段「ℓ=0 可外推」的说明同时声明了「本卡主陈述范围
  仍写 0<ℓ≤m」，故不是被断言的命题。两卡是平行的姐妹，不是上下游。
