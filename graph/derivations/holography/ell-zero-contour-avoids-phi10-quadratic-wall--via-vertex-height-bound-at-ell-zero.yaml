summary: |
  把 gap-102b-route-a 的 Theorem 9 搬到 ℓ=0，逐处核对无退化。三步（proof.md §6.1）：

  **1. 约束 (I) 在 ℓ=0 不退化**。route-a Lemma 1 由 Im F = 0 给出
    h(ρ₁,σ₁,v₁) := n₂(2nσ₁ + 2mρ₁ − 2ℓv₁) + jℓ + 2(mn₁ − nm₁) = 0。
  ℓ=0 时化为 n₂(2nσ₁+2mρ₁) + 2(mn₁−nm₁) = 0，仍是 (ρ₁,σ₁) 的线性约束，可解出 σ₁；
  全程没有除以 ℓ 的步骤。（curator 亲自重算 Im F：ρ=ρ₁+2inΛ、σ=σ₁+2imΛ、v=v₁+iℓΛ 代入
  F = n₂(σρ−v²)+jv+n₁σ−m₁ρ+m₂ 得 Im F = Λ·h，与 route-a Lemma 1 逐字一致。）

  **2. 顶点高度闭式在 ℓ=0 不退化**。route-a Proposition 7：
    Λ²(t*) = 1/(4n₂²Δ) − (j − 2n₂v₁)²/(16mnn₂²)。
  ℓ=0 ⟹ Δ = 4mn > 0，两项分母皆有限非零，公式不退化；第二项是减去平方数，故
    Λ²(t*) ≤ 1/(4n₂²Δ) ≤ 1/(4Δ) = 1/(16mn)（因 n₂² ≥ 1），
  该界对一切 n₂≠0、一切奇 j、一切实 v₁ 与满足 (I) 的 (ρ₁,σ₁) 一致成立。

  **3. 闭合**。若 Λ² > 1/(4Δ)，则 route-a 的 (R) 式 n₂ΔΛ² = g(t) 的抛物线顶点低于要求值，
  对任意实 t（更无整数 t）无解，n₂≠0 分支无解。取 Λ₀ = 1/(2√Δ)，ℓ=0 时即 1/(4√(mn))。

  **Re v 放开到 ℝ 的两条独立理由**（curator 补，见目标卡 notes）：(i) Prop 7 的闭式中
  v₁ 只出现在被减去的平方项里，一致界与 v₁ 无关；(ii) (D.19) 的 n₂≠0 子族在 v↦v+1 下
  自我映射（j'=j−2n₂ 仍奇，m₂'=m₂+j−n₂，判别式不变——curator 亲自验算），故 Re v∈[0,1]
  的结论自动搬到 Re v∈[1/2,3/2]。

  **最后一步（承重，显式接线）**：以上都在 (D.19) 的 F=0 族上做；要把结论说成
  「Div(Φ₁₀) 的 n₂≠0 分支」，需要该族穷尽 Div(Φ₁₀)，即
  holography.sen-d19-family-is-igusa-phi10-divisor（physical-argument）。
gaps:
  - "⚠ **【承重，2026-09-20 晚新增】§6.1 的量词比本推导的结论窄（F-5 覆盖缺口）**。
    graph-reviewer ell0s6rev 审 §6.1 时发现：proof.md §6.1（引理 6.1）逐字只对
    **`n ≥ m ≥ 1`** 陈述并证明，而本推导与目标卡都设 **`m, n ≥ 1`**。
    **按字面，`m > n` 的情形 n₂≠0 分支的排除目前没有论证**，本推导上面的三步在该区域
    悬空。ell0s6rev 判定这是**可修的形式缺口而非实质错误**，并独立验证了两条修法：
    (a) 直接放开——它用独立 sympy 脚本从 g(t) 定义重推 route-a Proposition 7 的顶点高度
    闭式 `Λ²(t*) = 1/(4n₂²Δ) − (j−2n₂v₁)²/(16mnn₂²)`，对一般 ℓ 恒等成立，`A = −mn/n₂`
    与 `B` 全部对上，**全程未使用 `n ≥ m`**（`n≥m` 只进过 route-a §5.4 的 (M) 式，
    而 Theorem 9 不走那条路）；(b) WLOG 对称性——`Ω=[[ρ,v],[v,σ]] ↦ [[σ,v],[v,ρ]]` 保 Φ₁₀，
    (D.19) 的 F 变为同族中 `(m₁,n₁)↦(−n₁,−m₁)` 的成员，判别式不变，ℓ=0 围道恰映到
    (m,n) 互换后的围道。已派 theorem-prover 放开 §6.1 的量词。
    **修复落地前本推导对 `m > n` 的支撑不完整；落地后此条删除，且不需要给任何卡换代**
    （量词放开只增不减，不改变任何卡的断言）。"
