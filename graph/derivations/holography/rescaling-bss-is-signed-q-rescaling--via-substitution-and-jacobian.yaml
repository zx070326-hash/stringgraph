summary: |
  在 BSS (7) 的第 s 项中代换 σ̃ = s²σ̌、ṽ = s v̌。Jacobian dσ̌ dv̌ = s^{−3} dσ̃ dṽ，恰好抵消
  显式因子 s³，积分区间 1/s²、1/s 变为整周期 [0,1)。指数项变为
    −iπ(σ̃·Q²/s² + ρ̌P² + 2ṽ·(Q·P)/s)，
  即第 s 项此时正在从 1/Φ₁₀ 中提取 (Q²/(2s²), P²/2, (Q·P)/s) = (m/s², n, ℓ/s) 处的 Fourier
  系数。由 BSS eq (1) 该系数携带符号 (−1)^{ℓ/s+1}。乘上外层整体前因子 (−1)^{ℓ+1} 与
  g(s)=s，第 s 项的总权重为
    s·(−1)^{ℓ+1}(−1)^{ℓ/s+1} = s·(−1)^{ℓ+ℓ/s} = s·(−1)^{ℓ−ℓ/s}
  （最后一步用 ℓ+ℓ/s 与 ℓ−ℓ/s 同奇偶，因两者相差 2ℓ/s 为偶数）。对 s|r 求和得
    (BSS 7) = Σ_{s|r} s·(−1)^{ℓ−ℓ/s}·f(m/s²,n,ℓ/s) = D̃_r[f](m,n,ℓ)。
