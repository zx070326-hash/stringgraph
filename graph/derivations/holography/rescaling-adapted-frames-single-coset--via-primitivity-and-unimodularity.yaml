summary: |
  纯格论证明，不依赖图内任何其他节点作为砖块（只用到 Λ 是偶自对偶格这一固定物理设定，
  与姐妹卡 holography.dstar-sduality-invariant / holography.torsion-index-divisor-operator
  一样把它当作既定背景，不单独立卡）：
  (1) Q₀∧P₀ 分解出因子 I 后，gcd(Q̃∧P₀)=1，故 P₀ 在 Λ 中本原。
  (2) Λ 幺模 ⟹ 存在 λ∈Λ 使 P₀·λ=1（本原向量的对偶配对存在性，幺模格的标准事实）。
  (3) Q=aQ₀+bP₀ 且 Q₀∈IΛ，故 Q∈IΛ ⟺ bP₀∈IΛ ⟺（用 λ 配对）b∈Iℤ。
  (4) 对偶部分用 S-对偶元 S=[[0,1],[−1,0]] 把 Q-适配 ↔ P-适配、Γ⁰(I) ↔ Γ₀(I) 互换（S 是
  电荷格自同构，把 (Q,P) 映到 (P,−Q)，保持 L 与其挠 I 不变）。
  机检独立确认：scripts/lattice_frames_output.txt 中显式构造 U⊕U 的格 L，验证"P-适配当且
  仅当所在陪集为 Γ₀(2)"的正反两方向都对具体数值成立。
