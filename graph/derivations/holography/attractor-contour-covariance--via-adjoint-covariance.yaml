summary: |
  证明的关键是伴随矩阵的 GL(2) 协变性（Lemma 3.1(b)）：

  **Lemma 3.1(b)（伴随矩阵协变性）**：设 A_s = diag(s,1)，T′ = A_s^{−1}T A_s^{−T} = T(m/s²,n,ℓ/s)。则
    A_s · adj(T) · A_sᵀ = s² · adj(T′)。
  证明：对可逆 2×2 矩阵 adj(X)=det(X)·X^{−1}，直接计算或代入即得。

  **Thm 4.1 主证明**：
  作变量替换 (ρ′,σ′,v′) = (s²ρ, σ, sv)（即 Ψ_s）：
  - 虚部：Im Ω′ = A_s(2Λ adj T)A_sᵀ = 2Λ·s²·adj(T′) = 2Λ′·adj(T(m′,n′,ℓ′))，
    故像精确落在 C_*(m′,n′,ℓ′;Λ′) 的虚部切片上（Λ′ = s²Λ）。
  - 相位：mρ+nσ+ℓv = m′ρ′+n′σ′+ℓ′v′（纯线性等式，无需整性）。
  - Jacobi 行列式：dρ′dσ′dv′ = s³ dρdσdv。
  - (a) 整性情形 s²|m, s|ℓ：m′,ℓ′∈ℤ，积分区域可在各方向折叠给 s³ 因子，与 s^{−3} 相消。
  - (b) 非整性情形：𝒱_sF 有额外周期 1/s²（ρ方向）和 1/s（v方向），相应 Fourier 系数为零。
    极点回避：对任意实正定 T′（不需要整值），Im(Ψ_sΩ)=2s²Λ adj(T′) ≻ 0 并随 Λ→∞ 均匀趋无穷；
    Φ₁₀ 极点上虚部受约束，故存在 Λ₀ 使大 Λ 时切片无极点。

  **Cor 4.2**：取 F=𝒢（满足周期性假设，由 Φ₁₀ 的 Fourier 结构保证），
  合法性由 d_* 的 Λ-无关性（(R9)）保证（Λ′=s²Λ 充分大）。

  整个证明只用伴随矩阵恒等式和围道变量替换，无需 mock 模形式结构。
