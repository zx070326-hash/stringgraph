sources:
  - ref: sen-2008-precision-counting
    loc: "arXiv:0708.1270v4 Appendix D, eq. (D.19)（p.168）；附录 D 全文 pp.164-169"
    note: |
      Sen 附录 D 从 N=4 dyon 配分函数出发推出 (D.19)。**原文未逐字断言**他的 Φ̃
