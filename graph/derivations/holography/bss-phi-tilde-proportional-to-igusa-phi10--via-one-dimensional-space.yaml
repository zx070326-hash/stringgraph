summary: |
  Igusa 维数公式保证 S₁₀(Sp(4,ℤ))（权 10 Sp(4,ℤ) 尖点形式空间）维数为 1。
  在 statement 前提"Φ̃₁ ∈ S₁₀(Sp(4,ℤ))"下，Φ̃₁ 与 Φ₁₀ 均为该一维空间元素，
  故至多差非零常数 c。

  **前提的 status**：Φ̃₁ ∈ S₁₀(Sp(4,ℤ)) 依赖 BSS eq (5.2) 无穷乘积的模性验证
  （Sp(4,ℤ) 变换律、全纯性、尖点性），BSS 援引 CHL 配分函数构造为已知，
  本项目尚未回溯 Chaudhuri–Hockney–Lykken 1995 或 David–Jatkar–Sen 2006 原始文献。
  本推导的 status 按一维性本身（Igusa 维数公式，rigorous 数学定理）定为 rigorous，
  但 target 的 effective status 会因前提未独立验证而被压低（若前提本身建成图节点且
  status < rigorous）。
