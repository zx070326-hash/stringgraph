    loc: "footnote 10（p.50）：BSS 明确声明'the roles of Q and P are interchanged compared to [9]'（[9]=DMZ 1208.4074），即 BSS 用 m_B=Q²/2(电)、n_B=P²/2(磁)，而 DMZ 用 m=P²/2(磁)、n=Q²/2(电)"
    note: "记号翻译的文献依据：BSS 作者自己声明的电荷约定差异"
