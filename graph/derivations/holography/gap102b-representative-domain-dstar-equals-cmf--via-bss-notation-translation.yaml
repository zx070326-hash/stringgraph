id: holography.gap102b-representative-domain-dstar-equals-cmf--via-bss-notation-translation
target: holography.gap102b-representative-domain-dstar-equals-cmf
kind: proof
status: rigorous
depends_on:
  - id: holography.bss-theorem-5-4b
    note: |
      BSS Thm 5.4(b) 在 BSS 自己的记号约定下（m=Q²/2 电、n=P²/2 磁）已建立
      d*(P²/2, Q·P, Q²/2) = (−1)^{Q·P+1} c_n^F(m,ℓ)（N=1 时）的关系。
      本推导执行记号翻译把该关系改写到 Rosselló/DMZ 约定（m=P²/2 磁、n=Q²/2 电）下。
sources:
  - ref: bhand-sen-singh-2023
    loc: "footnote 10（p.50）：BSS 明确声明'the roles of Q and P are interchanged compared to [9]'（[9]=DMZ 1208.4074），即 BSS 用 m_B=Q²/2(电)、n_B=P²/2(磁)，而 DMZ 用 m=P²/2(磁)、n=Q²/2(电)"
    note: "记号翻译的文献依据：BSS 作者自己声明的电荷约定差异"
summary: |
  执行 BSS Thm 5.4(b) 从 BSS 记号到 Rosselló/DMZ 记号的翻译，得到代表元范围内的等式
  d_*(m,n,ℓ) = (−1)^{ℓ+1} c_m^F(n,ℓ)（Rosselló 约定：m=P²/2 磁、n=Q²/2 电、ℓ=Q·P）。

  **翻译路径包含符号核算**（proof.md §1 引理 1 + §3 引理 2 + §4 引理 3）：
  1. BSS 自己声明（footnote 10，p.50）其约定与 DMZ 的 Q↔P 互换：
     BSS 取 (n_B,ℓ_B,m_B) 其中 n_B=P²/2(磁)、m_B=Q²/2(电)、ℓ_B=Q·P；
     Rosselló/DMZ 取 (m,n,ℓ) 其中 m=P²/2(磁)、n=Q²/2(电)、ℓ=Q·P。
  2. 变量对应（按傅里叶相位中 mρ+nσ+ℓv 的系数一一对应）：
     n_B → m（磁荷）、m_B → n（电荷）、ℓ_B → ℓ（Q·P 两约定相同）。
  3. BSS 代表元范围内包含关系（**不是等价**，与 research/.../status.yaml reviewer 裁决第 1 条一致）：
     目标域 n≥m≥1, 0≤ℓ≤m（Rosselló 记号）──映射 n_B→m, m_B→n, ℓ_B→ℓ──译为 m_B≥n_B≥1, 0≤ℓ_B≤n_B（BSS 记号），
     而 B₂ = {m_B≥n_B, 0≤|ℓ_B|≤2n_B}，故 0≤ℓ_B≤n_B≤2n_B ⟹ 目标域 ⊆ B₂ ⊆ B。
  4. BSS 系数记号 c_n^F(m,ℓ)（指标 n、参数 m,ℓ）翻译为 Rosselló 记号 c_m^F(n,ℓ)
     （指标 m、参数 n,ℓ）——指标字母与参数位置同时互换。
  5. **符号核算**：BSS 的 d*_BSS 定义 (5.13) 内置因子 (−1)^{Q·P+1}，Rosselló 的 d_* 定义 (2.23)
     半周期移位在指数内（e^{−2πi·ℓ(v+1/2)}），两者是**不同泛函**；数值验证显示（coefficients.py，
     m=1..4、n≤8、代表元域）c_m^F（Rosselló）符号按 ℓ 奇偶交替（ℓ 偶负、ℓ 奇正），故满足
     c^F_BSS = (−1)^{ℓ+1} · c^F_Rosselló（**ℓ-依赖符号，非全局常数**）。
     字母替换 + 符号记账后得目标等式。
