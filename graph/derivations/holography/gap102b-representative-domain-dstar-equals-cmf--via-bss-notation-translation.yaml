id: holography.gap102b-representative-domain-dstar-equals-cmf--via-bss-notation-translation
target: holography.gap102b-representative-domain-dstar-equals-cmf
kind: proof
status: rigorous
depends_on:
  - id: holography.bss-theorem-5-4b
    note: |
      BSS Thm 5.4(b) 在 BSS 自己的记号约定下（n_B=P²/2 磁、m_B=Q²/2 电）已建立
      d*(n_B, ℓ_B, m_B) = c_n^F(m,ℓ)（N=1 时）的关系。
      本推导执行记号翻译并计算两篇文献 d* 定义式的符号差。
  - id: holography.bss-rossello-dstar-normalization-constant
    note: |
      归一化常数 c := Φ̃₁/Φ₁₀ 的判定（含定向因子 η），本推导采用 c=−η 关系式
      中 η=+1 的分支（迭代积分解释）以完成记号翻译。该分支与 BSS p.40 原文存在
      字面矛盾，本项目尚未裁决（见该节点 notes）。
sources:
