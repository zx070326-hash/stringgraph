summary: |
  四步 Laurent 展开。固定 ρ,σ ∈ ℍ，令 u := v + 1/2、s := u − 1。

  **步骤 1（u=1 是零点）**：holography.igusa-cusp-form-phi10-v2 给出 Div(Φ₁₀) = 2H₁ ∋ {u=0}，
  故 Φ₁₀(ρ,σ,0) = 0；由 v-周期 1（holography.phi10-periodic-in-v）得 Φ₁₀(ρ,σ,1) = 0。

  **步骤 2（关于 u=1 的偶性）**：设 f(u) := Φ₁₀(ρ,σ,u)。f 偶（holography.phi10-even-in-v）
  且周期 1，故对任意整数 k 与任意 s，f(k+s) = f(s) = f(−s) = f(k−s)，即 f 关于每个整数点
  都偶（proof.md 引理 2.4；此处给出的是比 proof.md 更短的两行证明，curator 自行推出，
  结论相同）。取 k=1：f(1+s) 是 s 的偶函数，其 Taylor 展开只含 s 的偶次幂。

  **步骤 3（Laurent 展开不含 s^{−1} 项）**：由步骤 1、2，
    Φ₁₀(ρ,σ,1+s) = s²·h(ρ,σ,1+s)，h(ρ,σ,1+s) = h₀ + h₂s² + O(s⁴)（只含偶次项），
  其中按 statement 的前提 h₀ := h(ρ,σ,1) ≠ 0（即零点阶恰为 2）。于是在 s ≠ 0 的邻域内
    𝒢 = −1/[s²h] = −(1/h₀)·s^{−2}·[1 − (h₂/h₀)s² + O(s⁴)] = −(1/h₀)s^{−2} + (h₂/h₀²) + O(s²)，
  **没有 s^{−1} 项**——这一步正是偶性承重的地方：若 h 含 s 的一次项 h₁，𝒢 会多出
  (h₁/h₀²)s^{−1}，给出一个与 ℓ **无关**的留数贡献，ℓ=0 的结论就不成立。

  **步骤 4（指数核的一阶项造出 s^{−1}）**：v = s + 1/2，故
    e^{−2πiℓv} = e^{−πiℓ}·e^{−2πiℓs} = (−1)^ℓ·[1 − 2πiℓ·s + O(s²)]（ℓ ∈ ℤ）。
  与步骤 3 相乘，s^{−1} 的系数 = (−1)^ℓ·[(−1/h₀)·(−2πiℓ)] = (−1)^ℓ·2πiℓ/h₀。因 e^{−2πiℓv}
  处处非零，极点阶仍恰为 2。故
    Res_{v=1/2}[𝒢·e^{−2πiℓv}] = (−1)^ℓ·2πiℓ·(1/h₀(ρ,σ))。
  由 h₀ ≠ 0 与 2πi ≠ 0，该留数为零 ⟺ ℓ = 0。

  **约定换算（statement 末段）**：在 Rosselló (2.23) 自身约定下（平移写在指数内，
  极点在 v=0，核 = e^{−2πiℓ(v+1/2)} = (−1)^ℓ(1−2πiℓv+O(v²))，Φ₁₀ = v²h），
  v^{−1} 系数 = (1/h₀)·(−1)^ℓ·(−2πiℓ) = (−1)^{ℓ+1}·2πiℓ/h₀，恰比上式多一个负号，
  与 proof.md §5.1 推出的 d_*^{定义D} = −d_*^{Rosselló} 独立吻合；两处 h₀ 由周期性相等。
