summary: |
  §4.1：n2=0 时 Lemma 1 的 (I)/(R) 化简为纯整数约束 (I0): jℓ+2mn1−2nm1=0（Λ
  无关）与自由变量约束 (R0)。§4.2 引理 A：宇称论证排除 ℓ 奇。§4.3 引理 B：
  换元 u:=nm1+mn1, w:=mn1−nm1=−jℓ/2 代入判别式得恒等式 u²=mn−(Δ/4)j²，配合
  0<ℓ≤m≤n 的初等不等式链 9ℓ²<32mn 得 j²<9，j 奇 ⟹ j=±1。§4.4 引理 C：j=±1
  的四种子情形逐一反解 (m1,n1)，全部得非整数值，矛盾。§4.5：四种情形穷尽，
  (I0) 在 0<ℓ≤m≤n、Δ>0 下无整数解，n2=0 分支整族与围道不相交，对一切 Λ>0。
  无缺口——纯初等数论论证，不需要任何图内已有节点作为砖块。
