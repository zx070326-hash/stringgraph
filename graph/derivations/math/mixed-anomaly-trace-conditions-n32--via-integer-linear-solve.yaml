summary: |
  **(1)** 两式相减：(N + 8l) − (N + 2l) = 24 − 30，即 6l = −6，故 l = −1；
  代回 N + 2(−1) = 30 得 N = 32。两步都是等价变形，故解存在且唯一：(N, l) = (32, −1)。
  验算：32 + 8(−1) = 24 ✓，32 + 2(−1) = 30 ✓。

  **(2) SO(N)（l = −1）**：两条件分别是 N − 8 = 24 与 N − 2 = 30，各自都给 N = 32。
  这就是 GS 所谓「两次独立确认」：混合反常的两个不同结构（(22) 中 tr R² tr F⁴ 一路与
  tr F² tr R⁴ 一路）各给一条件，而它们在 l = −1 上相容。

  **(2) USp(N)（l = +1）**：N + 8 = 24 给 N = 16，N + 2 = 30 给 N = 28，
  16 ≠ 28，故无解。**这一步 GS 原文没有写**（见 gaps）。
gaps:
