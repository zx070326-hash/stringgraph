summary: |
  两条 `omega`，全部在 formal/StringFormal/Math/GreenSchwarzAlgebra.lean 内完成，只 import Mathlib。

  · **(1)**：`N + 8l = 24 ∧ N + 2l = 30 → N = 32 ∧ l = −1`。内核走的是线性整数算术
    （纸上版本：两式相减得 6l = −6，回代得 N = 32）。结论本身就是存在性与唯一性。
  · **(2) USp 支**：l = +1 时两条件成为 `N + 8 = 24` 与 `N + 2 = 30`，即 N = 16 与 N = 28，
    矛盾；Lean 里写成 `¬ ∃ N, …`。

  与 `--via-integer-linear-solve` 的分工：那条是纸上论证（reviewer 已复核，rigorous），
  本条把同样的算术交给内核。两条 depends_on 相同，**有效状态也相同**。
gaps:
  - |
    **(2) SO 支的「各自单独都给出 N = 32」不在 Lean 内**：
    `mixed_anomaly_trace_conditions_n32` 同时使用两条假设，没有「只用 N − 8 = 24」或
    「只用 N − 2 = 30」的单条件版本。而 GS 那句 "two independent confirmations" 的算术内容
    恰恰是**每条单独就够**。补上只需两行 `omega`，本轮 Lean 侧没有做。
  - |
    **「l = −1 ⇔ so(N)、l = +1 ⇔ usp(N)」这条字典不在 Lean 内**，由
    math.so-usp-adjoint-fundamental-trace-identities（physical-argument）承载；
    它是本推导有效状态的瓶颈。
  - |
    **「这两条方程为什么是混合反常抵消的条件」完全不在本推导内**（目标卡自己也这么写）。
    GS 逐字把相对归一化外包给 alvarez-gaume-witten-1984 eq. (63)，本项目未取得该文。
