summary: |
  三步，全部是微分分次代数里的有限步计算。

  **第一步（闭性）。** 由 F = dA + A² 得 dF = dA·A − A·dA = FA − AF，即 Bianchi 恒等式
  DF ≡ dF + [A, F] = 0。于是
      d Tr Fⁿ = n Tr((dF) F^{n−1}) = n Tr((DF) F^{n−1}) = 0，
  中间一步是「加零」：Tr([A, F] F^{n−1}) = 0 由迹的循环性（带分次符号）与 F 为偶次形式给出。
  来源把 n = 2 的情形写成 (2.17)(2.18)、一般 n 写成 (2.27)。

  **第二步（transgression）。** 沿一参数族 A_t = tA 作变分：δF = D(δA)，故
      δ Tr F_t² = 2 Tr(D(δA_t) F_t) = 2 d Tr(δA_t F_t)，
  对 t ∈ [0,1] 积分（t = 0 端 F_0 = 0 给零）得
      Tr F² = d [ 2 Tr ∫₀¹ dt A F_t ] = d Tr(A F − ⅓ A³)，
  即 (2.24)(2.25)(2.26)。同一步对 Tr Fⁿ 重跑（把 F_t 的 n−1 次幂放进去）给出
      ω⁰_{2n−1} = n Tr ∫₀¹ dt A F_t^{n−1},   Tr Fⁿ = dω⁰_{2n−1}   ((2.28)(2.29))。
  这就是 Chern–Weil transgression：Tr Fⁿ 是闭的且其类不依赖 A，把 A 沿直线同伦到 0 得到的
  「同伦不变量」正是 ω⁰_{2n−1}。

  **第三步（下降方程）。** 把 x 方向与群参数方向的外微分并成 Δ = d + δ（Δ² = 0），
  取 𝒜 = g⁻¹Ag + g⁻¹dg、v = g⁻¹δg，则 ℱ = d𝒜 + 𝒜² 同时等于 Δ(𝒜 + v) + (𝒜 + v)²（(3.28)），
  即 (𝒜 + v, ℱ) 相对 Δ 与 (𝒜, ℱ) 相对 d 是同一套代数关系。把第二步的恒等式在这两套记号下各写一遍并相减，
  得 Δ ω⁰_{2n−1}(𝒜 + v, ℱ) = d ω⁰_{2n−1}(𝒜, ℱ)（(3.29)）。
  两边按 v 的幂次分解（(3.31)），逐次幂比较系数，v 的 p+1 次项给出
      δ ω^p_{2n−1−p} + d ω^{p+1}_{2n−2−p} = 0,
  最高次给出 δ ω^{2n−1}_0 = 0，即 (3.32)。
  n = 2、n = 3 的 ω¹ 显式形式 (3.37)(3.38) 由 (3.33)–(3.36) 的分部积分得到。
