notes: |
  【1. ★ status 为什么取 rigorous，以及它到底断言了什么】
  断言的是：**目标卡 (i)(ii)(iii) 是纯微分几何（Chern–Weil transgression + 代数下降）的标准结果，
  在数学界有已发表且被接受的完整证明**（docs/STATUS_LEVELS.md 第 4 级的主判据）。
  **不**断言的是：本图已逐页核实那份数学证明。本图核实到的是
  zumino-1983-les-houches 的逐步推导（L1），它对第一、二步给了完整两行到十行的计算并逐字自称
  「and have thus verified that」，对第三步则有一处「as easily verified / This implies that」的跳步。
  ⇒ 若把 rigorous 的门槛定为「已核实的数学文献」，本推导应降为 physical-argument；
  gaps 第 3、4 条就是给 auditor 的裁决材料。**本推导没有引用 docs/STATUS_LEVELS.md 的
  「有限步初等计算 + reviewer 复核」例外条款**（未经 reviewer 复核）。

  【2. 与 Lean 的关系】来源 p.17 末给了一条**对形式化极其有利的逐字许可**：
  「in defining the operators d, ℓ and k and in studying their properties (from formula (2.36) on)
  we have treated A and F as **purely algebraic objects** from which one can form polynomials.
  **No special relations** (such as particular commutation relations) have been used and the polynomials
  were not restricted by any symmetry or invariance property.」
  ⇒ 目标卡 (0)(a) 的代数版本可以在自由分次微分代数上形式化，**不需要流形**。
  抽取记录 §5.5 给了三个 Lean 候选（Tr Fⁿ 闭性、kd + dk = 1、附录的组合恒等式 (A.18)），
  本推导不预设其中任何一条已完成。

  【3. 本推导不覆盖的来源内容】有限规范变换下 ω⁰ 的变换律（来源 (3.5)(3.16)(3.17)）、
  α_{2n−2} 的显式公式（(3.11)(3.13)(3.14)，附录 (A.16)(A.18)）在本图**没有节点**。
