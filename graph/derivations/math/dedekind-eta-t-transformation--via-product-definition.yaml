summary: |
  两步，全部在 math.dedekind-eta-function 的定义之内：

  **(1) 乘积部分不变。** q(τ+1) = exp(2πi(τ+1)) = exp(2πiτ)·exp(2πi) = q(τ)。
  故 ∏_{n≥1}(1 − q^n) 逐因子不变，且收敛性论证（定义卡里已给：|q| = e^{−2πτ₂} < 1，
  在 H 的紧子集上绝对一致收敛）对 τ 与 τ+1 是同一个（Im(τ+1) = Im τ）。

  **(2) 前因子出一个相位。** 按定义卡的分支约定 q^{1/24} ≡ exp(πiτ/12)，
  q(τ+1)^{1/24} = exp(πi(τ+1)/12) = exp(iπ/12)·exp(πiτ/12) = exp(iπ/12)·q(τ)^{1/24}。

  相乘得 η(τ+1) = exp(iπ/12) η(τ)。推论（|η| 不变、τ₂ 不变 ⇒ τ₂|η|⁴ 在 T 下不变）
  是一行代入。
