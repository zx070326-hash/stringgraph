depends_on:
  - id: worldsheet.modular-group-psl2z
    inferred: false
    note: |
      提供群与 S、T 的矩阵：Lean 侧的 `ModularGroup.S`、`ModularGroup.T`（Mathlib）逐字就是
      该定义卡写的 S = ((0,−1),(1,0))、T = ((1,1),(0,1))，`SL(2, ℤ)` 就是该卡的 SL(2,Z)，
      PSL 就是该卡的 SL(2,Z)/{±I}（见 gaps 首条）。目标卡 statement 明写「PSL(2,Z) = SL(2,Z)/{±I}
      （worldsheet.modular-group-psl2z）」，故这是 statement 的字面依赖，**非 inferred**。
      ⚠ 该定义卡里「S : τ ↦ −1/τ、T : τ ↦ τ+1」这一层（H 上的作用）本推导**完全不用**：
      `ModularGroupGenerators.lean` 的 docstring 逐字写 "Nothing here is about the action on `ℍ`"。
      目标卡「不断言」(d) 已把它排除，两边一致。
      ⚠ 该定义卡已于 2026-09-11 接桥层 `StringFormal.Bridge.psl2z_smul_eq` 升为 formalized，
      故本推导 own=formalized 不被它按 min 规则压低。
  - id: math.sl2z-center-is-pm-one
    inferred: false
    note: |
      **供给「Lean 的 PSL = 卡面的 SL(2,Z)/{±I}」这一步**，即 gaps 首条点名的那组桥层声明：
      `StringFormal.Bridge.center_eq_pm_one : (Subgroup.center SL(2, ℤ) : Set SL(2, ℤ)) = {1, -1}`
      （集合层，c15b0db），以及 2026-09-11 新增的子群层与外延性两条
      `StringFormal.Bridge.psl2z_eq_quotient_pm_one : Subgroup.center SL(2, ℤ) = Subgroup.closure {(-1 : SL(2, ℤ))}`
      与 `StringFormal.Bridge.pslMk_eq_iff (g h) : pslMk g = pslMk h ↔ g = h ∨ g = -h`（930b265）。
      没有它们，Mathlib 的 `Matrix.ProjectiveSpecialLinearGroup = SL(2,ℤ) ⧸ Z(SL(2,ℤ))`
      未必等于目标卡正文写的那个商；本文件自己只证了 `−1 ∈ Z(SL(2,ℤ))`（`neg_one_mem_center`），
      那**不够**。
      **非 inferred**：这一步在本推导 gaps 首条里逐字点名了这些 Lean 声明，
      并在 sources 指向的桥层文件里可以直接读到；它是可指认的、而非诠释出来的依赖。
      ⚠⚠ **但它不在 `psl_S_sq` 的机检证明链上**（gaps 首条逐字：「`center_eq_pm_one`（及其
      子群形式）不在 `psl_S_sq` 的证明链上——`psl_S_sq` 里的 `PSL(2, ℤ)` 从一开始就是
      Mathlib 的那个对象」）。本边供给的是**陈述层面的群识别**，不是证明步骤——这一点
      既没有因为它有了自己的卡而改变，也没有因为 2026-09-11 补上了
      `psl2z_eq_quotient_pm_one` / `pslMk_eq_iff` 而改变：新声明使「两个商相等」本身成为机检事实，
      但它仍然不出现在 `psl_S_sq` 的证明里。
      ⚠ 2026-09-11（curator small-backlog-9）新增：该事实此前在图上**没有节点**，
      本轮从 worldsheet.modular-group-psl2z 拆出；指向定义卡的那条边保留。
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/ModularGroupGenerators.lean :: StringFormal.ModularGroupGen.psl_S_sq；同文件 sl_S_sq, sl_ST_cube, neg_one_mem_center, psl, psl_neg_one, psl_ST_cube"
    note: |
      本仓库，formalizer 分支 `agent/formalizer/eta-modular`；Lean 4 + Mathlib **v4.33.1**。
      本推导只用该文件的「关系」一半；同文件的 `sl_closure_S_T` / `psl_closure_S_T`（生成性）
