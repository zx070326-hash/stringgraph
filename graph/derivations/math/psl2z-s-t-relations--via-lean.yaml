  - ref: polchinski-1998-v1
    loc: "§5.1, eq. (5.1.12), p.148（物理侧转述）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E70，L1。
      本条**不承载本推导的任何步骤**；「(5.1.12) 是否含这两条关系」这一文献问题本推导不解决
      （见 gaps 末条）。
summary: |
  机器检查的证明，`formal/StringFormal/Math/ModularGroupGenerators.lean`。两步：

  **(1) SL 层：两行矩阵乘法。** `sl_S_sq : S² = −1` 与 `sl_ST_cube : (S*T)³ = −1`，
  两条都是 `ext i j <;> fin_cases i <;> fin_cases j <;> rfl`——即 2×2 整数矩阵的逐项定义相等。
  （`-1 : SL(2,ℤ)` 的 `Neg` 实例由全局 `Fact (Even (Fintype.card (Fin 2)))` 提供。）

  **(2) 过到 PSL。** `psl := QuotientGroup.mk' (Subgroup.center SL(2,ℤ))`；
  `neg_one_mem_center` 由 `Subgroup.mem_center_iff` 一行（−1 与一切 g 交换），
  `psl_neg_one : psl (−1) = 1` 由 `QuotientGroup.eq_one_iff`。于是
  `psl_S_sq` 与 `psl_ST_cube` 各由 `← map_pow` / `← map_mul` 把 (1) 的等式推到商上，
  右端的 −1 死掉，得 = 1。∎
gaps:
  - |
    **（记账，不是缺口）Lean 的 PSL 取法**：Mathlib 的 `Matrix.ProjectiveSpecialLinearGroup`
    是 `SL(2,ℤ) ⧸ Z(SL(2,ℤ))`，本文件（`ModularGroupGenerators.lean`）自己只证
    `−1 ∈ Z(SL(2,ℤ))`（`neg_one_mem_center`），没有证 `Z(SL(2,ℤ)) = {±1}`。
    ★ **2026-09-11（curator lean-wire-12）改写：「群的识别 SL/Z(SL) = SL/{±I}」已经机检。**
    桥层现有三级：
      · 集合层 `StringFormal.Bridge.center_eq_pm_one :
        (Subgroup.center SL(2, ℤ) : Set SL(2, ℤ)) = {1, -1}`（提交 c15b0db，合并 845b9b9）；
      · **子群层** `StringFormal.Bridge.psl2z_eq_quotient_pm_one :
        Subgroup.center SL(2, ℤ) = Subgroup.closure {(-1 : SL(2, ℤ))}` 及其 zpowers 写法
        `StringFormal.Bridge.center_eq_zpowers_neg_one`——即**被商掉的那个子群**本身相等
        （提交 3a36c36，合并 930b265）；
      · **商的外延性** `StringFormal.Bridge.pslMk_eq_iff (g h : SL(2, ℤ)) :
        pslMk g = pslMk h ↔ g = h ∨ g = -h`——Mathlib 的商恰好把 {g, −g} 粘起来，
        陈述里一个字都不提中心。
    这正是本 gap 旧版要求的「由 formalizer 把商群相等那一行外延性写出来」，已兑现
    ⇒ **不再需要人读两条声明作比对**。
    **余下的不是证明步骤，而是陈述搬运**：`center_eq_pm_one`（及其子群形式）**不在
    `psl_S_sq` 的证明链上**——`psl_S_sq` 里的 `PSL(2, ℤ)` 从一开始就是 Mathlib 的那个对象，
    它的证明（`← map_pow` 把 SL 层的 S² = −1 推到商上）用不到中心长什么样。
    桥层那三条的用途是让本图确认「卡面文字 `SL(2,Z)/{±I}` 指的就是这个 Lean 对象」；
    这种文字↔对象的对应由 sources 与 depends_on 承担，按其性质不会变成一条机检蕴涵，
    故本条永久保留为**记账**，不再作为待办。
    该事实的卡是 math.sl2z-center-is-pm-one（own=formalized），本推导有一条 depends_on 边指它。
  - |
    **不含表现（presentation）**。目标卡「不断言」(b) 与 Lean 一致：`psl_S_sq`、`psl_ST_cube`
    只说这两条关系成立，不说它们生成全部关系。那需要基本域上的乒乓引理，Mathlib v4.33.1 没有。
  - |
    **不含阶的下界**。目标卡「不断言」(c)：本推导没有证 π(S) ≠ 1 或 (π(S)π(T))^k ≠ 1 (k=1,2)，
    故「S、T 的阶恰为 2、3」不在本推导内。
  - |
    **文献问题不因本推导关闭**：「S² = 1、(ST)³ = 1 是否写在 Polchinski (5.1.12) 里」
    在抽取记录里仍标为未核实（#E70）。Lean 证的是数学事实，与「原书说了什么」无关。
