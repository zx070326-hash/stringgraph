summary: |
  把 n 个旁观 NS 穿孔装在运动的亏格 h 分量上（即把 n 个点固定在底曲线 C 上作为 p_1,...,p_n，
  第 n+1 个点随测试族运动作为粘接点）。四步论证：(1) DW 一点障碍族 X_η 的约化基必须排除这 n 个
  固定穿孔点（它们不在测试族的纤维内，而是在底曲线上），故约化基是 C° := C∖{p_1,...,p_n}；
  (2) C° 是仿射曲线（从紧曲线 C 移除 n≥1 个点）；(3) Serre 消没定理：仿射曲线上任何凝聚层 F
  的 H^i(C°,F)=0 对一切 i≥1；(4) 主障碍类 ω₂(X_η) 取值于 H^1(C°,F^obs)，其中 F^obs =
  Hom(Λ²T_-X_η, T_+X_η) 是凝聚层（T_± 是 DW 构造给出的局部自由层），故 H^1(C°,F^obs)=0，
  从而障碍类映射 J: H^1(C,L^{-1}(-Σp_i)) → H^1(C°,F^obs) 恒等于零（对一切 η，J(η)=0）。
  该测试路线给不出任何信息。推论 N′：同一个仿射性障碍也杀死 FKP 非分离粘接 (7.9) 作为载体
  （两个被粘 NS 穿孔在同一条曲线上，其中一个运动、一个固定，测试基仍是 C∖{q}）。推论 N″：
  Ramond 穿孔若装在运动分量上会破坏 L^⊗2≅ω_C 识别（需要变成 L^⊗2≅ω_C(R)），使 L 不再是
  无扭转 theta 特征，DW 构造本身失效。
gaps:
  - |
    本推导只用标准 Serre 消没定理（仿射曲线上凝聚层的 H^i=0, i≥1）与 DW 一点障碍族的构造
    （T_± 是向量丛，外幂与 Hom 对局部自由封闭），不涉及任何外部依赖节点，故 depends_on: []。
    Serre 消没本身是标准教材定理（Hartshorne III.3.7），未单独立卡。
  - |
    2026-09-18 订正记录（对抗审查）标记的初稿错误："参数空间 H^1(C,L^{-1}(-Σp_i)) 为零"是
    **错的**（该空间维数为 2h-2+n > 2h-2），正确的是"**取值空间** H^1(C°,F^obs) 为零"。
    这一订正使论证更强（η 比 CN 还多，却一个都测不到），已写入本卡 statement 的"不断言"段落。
  - |
    本 attempt 未产生 formal/ 下的无 sorry Lean 证明；status 诚实定为 rigorous，不写 formal: 字段。
