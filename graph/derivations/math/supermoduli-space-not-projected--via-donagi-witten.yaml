sources:
  - ref: donagi-witten-2013
    loc: "arXiv:1304.7798v2：摘要（'We prove that …'）；§1 pp. 4–7（动机、术语、Theorem 1.1/1.2/1.3、Remark 1.4/1.5/1.6）；证明所在章节按目录为 §4（𝔐_{g,1}）、§5（𝔐_g）与附录 A（亏格 5 的例子）——**本项目未读这些章节**"
    note: |
      **L1 只到摘要 + 目录 + §1 + §2 首页**（researcher 2026-09-11，抽取记录
      literature/extractions/witten-2012-superstring-perturbation.md EW21/EW22）。
      文献自称的严格程度：摘要逐字 **"We prove that for genus g ≥ 5, the moduli space of super Riemann surfaces
      is not projected"**，正文给三条编号定理。
      发表版 Proc. Symp. Pure Math. 90 (2015) 19–72（AMS 会议文集，同行评议）：INSPIRE recid 1231519 与
      witten-2012-superstring-perturbation ref [45] 两源相符，未与出版方直证。
  - ref: witten-2012-superstring-perturbation
    loc: "arXiv:1209.5461v4, §3.3.2, p. 35：'There has been no reason to believe that the moduli space of super Riemann surfaces has this property, and recently it has been shown that this is not the case in general [45].'"
    note: |
      L1（抽取记录 EW7）。作为**独立于作者之一的第三方转述**登记（Witten 是 DW 的共同作者，
      故这条只算「同一作者群的自引」，不构成独立复核）。其价值在于给出 [45] 的发表信息，并逐字承认低亏格可投影。
summary: |
  本条不重写证明，只记账「这是数学文献里被完整证明、且已在同行评议文集发表的定理，本图把它当作数学输入接进来」
  ——与 math.riemann-roch-theorem--via-eynard、math.laplace-fundamental-solution-2d--via-lieb-loss 同类。

  **档位依据**（docs/STATUS_LEVELS.md 第 4 级「有发表的、数学界接受的完整证明；来源必须是数学文献或
  数学物理文献」）：
  · 作者措辞是 "We prove"，正文给出三条编号定理，且明确划出未解决的情形（偶 g + 奇自旋 + n ≥ 1），
    即作者自己对适用域做了精确记账；
  · 发表在 Proc. Symp. Pure Math. 90 (2015)（AMS），属数学文献；
  · 论证对象是代数几何标准对象（超流形的分裂障碍类，即后续文章所称的 super Atiyah class），
    不涉及路径积分或形式操作。

  **本图对证明的了解程度**（这一点决定了下面第一条 gap）：只读了 §1 的定理陈述与三条 Remark，
  以及 §2 首页。证明在 §4（𝔐_{g,1}）、§5（𝔐_g）与附录 A（亏格 5 的显式例子），**一字未读**。
  按目录与后续文章 arXiv:1404.6257 的摘要（L2），证明路线是计算分裂障碍的第一障碍类
  （super Atiyah class 的一个分量）在 𝔐_g / 𝔐_{g,n} 上不为零。**这句路线描述是 L2 转述，不得当作定理内容引用。**

  `depends_on: []` 是**有意的**：本节点是图的一个数学输入叶子，论证在所引来源内部自足；
  不是「未加论证的断言」。
gaps:
  - |
    **本项目未读证明**（§2.2 起、§3、§4、§5、附录 A 全部未读，抽取记录 §3.2 列为红线）。
    本条的 rigorous 档位依据是**来源强度**（同行评议文集发表的数学定理 + 作者 "We prove"），
    不是本图自己的复核。⇒ 图中**不得**引用本文除 Theorem 1.1/1.2/1.3 与 Remark 1.4/1.5/1.6 之外的
    任何编号引理、命题或式号（同记录 §5.5 红线）。
  - |
    **读图存疑一处**：Theorem 1.3 的双侧界 "g ≥ 2 and g−1 ≥ n ≥ 1"（抽取记录 §3.3）。
    三条定理里只有它带双侧不等式，页图小字号，researcher 自列为「建议重核」。
    若重核后方向有误，目标卡的该条需换代（新建 -v2，不得就地改 statement）。
  - |
    **g = 3, 4 未覆盖**：原文 "(We suspect that this result may hold for g ≥ 3.)" 是猜测，不是定理。
    g = 2 未被否定，且低亏格确有全纯投影（Witten §3.3.2 p. 35）。
  - |
    **偶 g + 奇自旋结构 + n ≥ 1 原文明说未解决**；Theorem 1.3 的 n 上界「probably not optimal」（Remark 1.5），
    且 n ≫ g 时 "very likely kills the obstructions to splitness" —— 这两句都是作者的推测，本图不承载。
  - |
    **不覆盖 Deligne–Mumford 紧化**（Remark 1.4）。物理上真正需要的红外行为分析恰好在紧化上做
    （Witten §6–§7），故本定理**不能**直接搬到「紧化后的超模空间」上。
  - |
    **对象是 moduli stack**（Remark 1.6：「the phrase 'moduli space' is oversimplified … 𝔐_g is really the
    moduli *stack*」）。本图没有叠的定义卡，目标卡把它写在术语一段里；若日后需要精确的范畴论表述，
    须另建数学定义卡。
  - |
    发表信息（PSPM 90 (2015) 19–72）有两个相符来源（INSPIRE + Witten 自引），但**均未与 AMS 直证**。
notes: |
  **kind: proof / status: rigorous 的合规性**：schema 要求 kind=proof 时 status ∈ {formalized, rigorous}。
