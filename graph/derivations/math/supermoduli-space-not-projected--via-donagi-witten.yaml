  （那条同样标 proof/rigorous 且 depends_on 为空，并在 gaps 里写明本项目未逐行复核）。

  **不写 reviewer-verified**：这不是 docs/STATUS_LEVELS.md 的「rigorous 例外」（有限步初等计算）那一档，
  而是第 4 级的正常用法（已发表的数学定理）。

  **★ 下游使用红线**：本卡**不得**被任何「超弦微扰论不成立 / PCO 方法失效」类的推导引用为支持。
  DW p. 4 逐字："The validity of superstring perturbation theory does not depend on a projection"。
  可以引用本卡的是「化约到普通模空间的策略在高亏格无类比」这类关于**策略**的陈述
  （抽取记录 §5.2 建议过一张 worldsheet.reduction-to-ordinary-moduli-space-strategy-fails-high-genus，
  本轮未建，因为它的「策略」层是物理陈述而非数学定理，需要与 Witten §3.3.2/§3.3.1 一起写）。
