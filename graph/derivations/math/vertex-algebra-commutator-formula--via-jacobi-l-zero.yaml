      初等代入写出来（见 summary）。
  - ref: bakalov-kac-2004
    loc: "eq. (2.19) → (2.20) → (2.21), p. 3"
    note: |
      **旁证，不承载论证。** 同一逻辑在 Bakalov–Kac 处走的是留数路线：(2.19) 取
      `F(z,w) = (z−w)^n δ(u−z)` 得 (2.20)，再取 n = 0 得**场版**对易子公式 (2.21)。
      ⚠ 他们**没有**写出模式版，故本推导的结论只引 G–N (2.38)（§38.4 的禁令）。
summary: |
  **一步初等代入，全程形式级数。**

  在 math.vertex-algebra-borcherds-identity 的模式版 (B)（G–N (2.36)）
    Σ_{i ≥ 0} (−1)^i C(l, i) ( ψ_{l+m−i}(φ_{n+i} ξ) − (−1)^l φ_{l+n−i}(ψ_{m+i} ξ) )
      = Σ_{i ≥ 0} C(m, i) (ψ_{l+i} φ)_{m+n−i} ξ,     ∀ ψ, φ, ξ ∈ ℱ, ∀ l, m, n ∈ Z
  中取 **l = 0**。

  左端：C(0, i) = δ_{i,0}（按 C(m,i) = m(m−1)⋯(m−i+1)/i! 的约定，C(0,0) = 1 且 C(0,i) = 0 对 i ≥ 1），
  且 (−1)^l = 1，故只剩 i = 0 一项：
    ψ_m(φ_n ξ) − φ_n(ψ_m ξ) = [ψ_m, φ_n] ξ。

  右端：l = 0 使 ψ_{l+i} = ψ_i，故右端为
    Σ_{i ≥ 0} C(m, i) (ψ_i φ)_{m+n−i} ξ。

  ξ ∈ ℱ 任意，于是在 End(ℱ) 中
    [ψ_m, φ_n] = Σ_{i ≥ 0} C(m, i) (ψ_i φ)_{m+n−i}，   ∀ m, n ∈ Z，
  即目标陈述。右端的有限性由正规性公理给出（ψ_i φ = 0 当 i 充分大），
  **无需任何收敛性论证**；G–N 自己也把 (2.38) 直接列为 (2.36) 的 l = 0 特例。
gaps:
  - |
    **(2.36) 与 (2.30) 的等价（形式变量版 ⟺ 模式版）不在本推导内。**
    本推导直接从模式版 (2.36) 出发；G–N 把两种写法都列出但不写展开过程。
    这条缺口登记在 math.vertex-algebra-borcherds-identity 的边界条款 (b)。
  - |
    **场版 (Bakalov–Kac (2.21)) 与模式版的换算不在本推导内。** 两者由取 Res_u 相联，
    但没有来源把这一步写出来；本推导刻意不走那条路，以免引入无来源的一步。
  - |
    **玻色型限制。** G–N 的 ℱ 不带 Z_2-分次，(2.38) 里没有 (−1)^{p(ψ)p(φ)} 因子。
    含费米型场（bc 鬼场）的顶点超代数版本本推导不覆盖；下游若要在含鬼场的空间上用本公式，
    须另找来源（Bakalov–Kac Definition 2.1 带宇称，但其对易子公式仍是场版）。
  - |
    **Lean 侧未起步。** Mathlib 的 Mathlib/Algebra/Vertex/ 目前只有 VertexOperator 骨架，
    Locality 仍在 TODO 段（math.formal-distribution-locality notes，2026-09-11）。**本推导不得标 formalized。**
