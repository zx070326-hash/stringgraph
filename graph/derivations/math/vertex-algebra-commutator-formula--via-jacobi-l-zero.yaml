id: math.vertex-algebra-commutator-formula--via-jacobi-l-zero
target: math.vertex-algebra-commutator-formula
kind: proof
status: rigorous
depends_on:
  - id: math.vertex-algebra-borcherds-identity
    note: |
      本推导的唯一实质输入：顶点代数的 Jacobi / Borcherds 恒等式，模式版 (B)（= G–N (2.36)），
      连同正规性公理（保证两端求和有限）。
      **这条边不是 inferred**：G–N 在刊 p. 580 于 (2.36) 与 (2.37)/(2.38) 之间逐字写
      「In what follows we will frequently make use of two important formulas which are the special
      cases m = 0 and l = 0, respectively, of Eq. (2.36)」——即「Jacobi 恒等式 ⇒ 对易子公式」
      这一步在来源处有明文（literature/extractions/math-sources.md §38.4）。
sources:
  - ref: gebert-nicolai-1995
    loc: "§2.1 'Vertex algebras', p. 580, eq. (2.36)（Jacobi identity）→ eq. (2.38)（Commutator formula），以及两者之间的引出句"
    note: |
      **L1（researcher 2026-09-11 逐页读期刊排版 PDF，pure.mpg.de/rest/items/item_153125_1/component/file_153124/content，
      PDF 页 = 刊页 − 570；逐字文本见 literature/extractions/math-sources.md §37.3(b)）。**
