  是**有限步、纯形式的初等代数**，且**来源自己就把这一步的结论写成编号公式 (2.38)**。
  故 **rigorous**（不属于 docs/STATUS_LEVELS.md 的「reviewer 复核例外」情形——本推导不是
  自行补出的计算，而是有编号来源直接断言的结果，本 summary 只是把来源留白的一行代入补齐）。

