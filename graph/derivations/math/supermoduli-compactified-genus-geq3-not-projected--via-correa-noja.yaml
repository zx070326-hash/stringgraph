  记账已发表数学论证。本文§8证明骨架对item(3)的论证明确不引用Theorem 3.5（item 1）、Theorem 4.3
  （item 2）或FKP arXiv:2408.11136；只用§2一般引理（障碍消没⇒可投影的逆否；障碍类函子性比较）+
  §5–§6本文自建的Donagi–Witten一点障碍族回顾与椭圆尾NS粘接构造 + §7的Riemann–Roch存在性引理，
  是一条完全自足的独立证明路径。刻意不挂任何依赖边，以准确反映"item(3)不依赖FKP，也不依赖item(1)/(2)"
  这一原文明示的事实（任务红线：最容易犯的错误是把FKP依赖边错挂在item(3)上）。
