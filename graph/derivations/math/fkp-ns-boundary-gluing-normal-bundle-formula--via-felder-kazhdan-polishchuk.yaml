summary: |
  记账 FKP-A 已发表结果。Theorem C 的证明路径是 §9.1 建立 eq.(9.6)（组合 eq.(7.6)、Lemma 9.1 的
  局部同构、Lemma 8.7 的典范平凡化）给出 N_B ≅ Ψ_1^{-1}⊗Ψ_2^{-1}，再由 §9.2 Theorem 9.2 证明该
  同构与典范态射 SM 相容，两者组装成 Theorem C。本推导只记账"定理陈述成立"这一事实本身（已发表、
  编号、无弱化措辞），不重新独立核验 Theorem 9.2 相容性证明（Lemma 9.3–9.6，pp.63–68）的每一步
  代数——那部分不影响本节点的靶空间量词范围这一核心信息（无穿孔），故不影响 rigorous 档位判断。
gaps:
