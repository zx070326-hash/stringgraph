  - "**h^{1,1} + h^{2,1} ≤ 502 完全无出处**：KS 摘要、KS 正文、那四篇摘要里都没有这个数。**不得写入本图**"
  - "'最大值被取到'这一点由 'the extremal case h^{1,1}=491' / 'the maximal polytope with Hodge numbers h^{1,1} = 491' 两句支持，但本项目未核实取到该值的那个多面体"
  - "光滑性/构造细节（多面体到光滑 CY3 超曲面的解消选择）本项目完全未核实；不同解消可给不同 h^{1,1}，KS 摘要说的是 'smooth Calabi-Yau threefolds that are hypersurfaces in toric varieties'，本卡照抄这个刻画而未追究其精确含义"
notes: |
  from: literature/extractions/math-sources.md §46.5。

  【为什么不是 rigorous】这是一条**有限枚举/数据库**事实，原则上可判定，但本项目的证据是四条
  二手摘要，谁都没有读原始数据或复算。本图的状态阶梯里没有"计算机验证的枚举"这一档；
  按"不确定选低一级"取 physical-argument。**这不是对 491 的怀疑**，而是溯源深度的记账。

  【升级路径（2026-09-11 更新）】arXiv:2008.01730 已**登记**为 `demirtas-2020`（L2，摘要），
  但**正文仍未读**——下一步就是读它的正文（标题就叫 "Bounding the Kreuzer-Skarke Landscape"，
  是最有希望的一枪），或直接查 Kreuzer 的 CY 数据库；并登记 2309.13145 与 2405.08871
  （"maximum/maximal" 字样的唯一出处）。
  ⚠ 顺带的否定结论：`demirtas-2020` 的**摘要全文逐字检索不含 "502"**，故 Q46.1
  （h^{1,1}+h^{2,1} ≤ 502 的一手出处）**仍未解决**，下一枪必须是正文而不是摘要。

  【★ 本推导没有出边，不会把任何东西抬高】特别是**不与 math.cy3-cohomology-bounded 建边**：
  KS 超曲面只是 CY3 的一个子族，一般情形的有限性截至 2026-06 仍开放。
