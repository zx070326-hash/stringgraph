summary: |
  论证形式是**穷举分类的数据库读数**，不是证明：

  1. Kreuzer–Skarke 完全分类了四维反射多面体（473,800,776 个），由它们给出环面簇中的光滑
     Calabi–Yau 三折超曲面，共 30,108 个不同的 Hodge 数对（本文摘要，L2 逐字）。
  2. 该 Hodge 数表中 h^{1,1} 的最大值是 **491** —— 这一步**不出自 Kreuzer–Skarke 本文**，
     而出自四篇后世论文的摘要，其中两篇明确用 "maximum"/"maximal" 字样。
     四篇中 **2008.01730 已于 2026-09-11 登记为 `demirtas-2020`**（L2，摘要全文经 arXiv API
     逐字核对），其余三篇仍未登记（L3）。

  故本推导实质上是"四个独立小组读同一个数据库读出同一个极值"。
