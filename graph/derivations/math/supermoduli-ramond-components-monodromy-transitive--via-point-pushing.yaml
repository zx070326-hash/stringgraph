summary: |
  推导路线（proof.md §2-§3）：
  1. 引理2.1：广义自旋曲线模叠 S_{g;n,2r} = 平方映射 sq: Pic^{g-1+r}→Pic^{2g-2+2r} 沿
     [ω_C(R)] 的纤维积，是 M_{g,m} 上次数 2^{2g} 的有限平展覆叠（m=n+2r≥1 时相对 Picard
     函子由截面可表）。
  2. 注2.2：对象自同构群里 ±1∈Aut(L) 不可见于粗化叠，故 S_{g;n,2r}→𝒮 是 μ2-gerbe，
     不改变底层拓扑空间；π_0(S_{g;n,2r})=π_0(𝒮)。
  3. 引理2.3：Teichmüller 空间 Θ_{g,m} 可缩、M_{g,m} 连通 ⇒ π_0(𝒮) = Θ_R(C)/Γ_{g,m}
     （映射类群在纤维 J[2]-torsor 上的单值轨道集）。
  4. 引理3.1：复环面上"乘2"映射沿一个同调类为 [α] 的闭路的单值是平移 [α] mod 2。
  5. 引理3.2：Abel-Jacobi 映射把 π_1(C∖punctures) 上的 Hurewicz 同态送到 H_1(C;ℤ)，满。
  6. 定理3.3：把单个 Ramond 穿孔 ρ_1 沿闭路 α 点推一圈，因为靶除子 ω_C(R) 随 ρ_1 移动，
     该点推元素在 sq 覆叠上的单值恰是步骤4的平移 [α] mod2；由步骤5，α 取遍 π_1 生成元时
     [α] mod2 取遍 J[2] 全部，故仅这一个 Ramond 穿孔的点推子群已经在 Θ_R(C) 上传递。
  7. 推论3.4：单值传递 ⇒ 步骤3的商集是单点 ⇒ π_0(S_{g;n,2r}) 单点，即 S_{g;n,2r} 连通。
  8. 注3.5（反向自洽性检验）：把机制套到 r=0（无 Ramond 穿孔）时，靶除子 ω_C(P) 不随任何
     NS 穿孔移动，点推单值恒为平凡元，机制不产生额外单值——与经典 r=0 两分量结果不矛盾，
     确认本推导没有"过度证明"带出错误的 r=0 连通性。
