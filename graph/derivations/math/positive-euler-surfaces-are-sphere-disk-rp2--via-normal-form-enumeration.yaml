summary: |
  **两个输入（来源逐字给出）**：

  (I) **参数范围**（Definition 6.5）：每个紧带边曲面同胚于一个规范胞腔复形，
      要么是 type (I)（可定向）参数 p ≥ 0, q ≥ 0，要么是 type (II)（不可定向）参数 p ≥ 1, q ≥ 0；
      其中 q = contour 数。
  (II) **χ 公式**（p. 89–90 的无编号行间式）：
       type (I)：χ = 2 − 2p − q；   type (II)：χ = 2 − p − q。

  **本图补的一步（两行算术，来源里不存在）**：把 χ > 0 代进 (II) 并在 (I) 的范围内求解——

  - type (I)：2 − 2p − q > 0，p ≥ 0, q ≥ 0 ⟹ 2p + q ≤ 1 ⟹ (p,q) = (0,0) 或 (0,1)；
    (0,0) ⟹ χ = 2 ⟹ **球面**（p. 89–90 的身份认定）；
    (0,1) ⟹ χ = 1 ⟹ **闭圆盘**（p. 102 的身份认定）。
  - type (II)：2 − p − q > 0，p ≥ 1, q ≥ 0 ⟹ p + q ≤ 1 ⟹ (p,q) = (1,0)；
    ⟹ χ = 1 ⟹ **实射影平面**（p. 90 与 p. 102 的身份认定）。

  最后由 math.classification-of-compact-surfaces（Theorem 6.2）知这三者两两不同胚
  （(可定向, 0, 2)、(可定向, 1, 1)、(不可定向, 0, 1) 三组不变量互不相同），且穷尽了 χ > 0 的情形。

  **落选者对照**：莫比乌斯带 (II) 中 (p,q) = (1,1) 给 χ = 0；环面 (I) 中 (1,0) 给 χ = 0；
  Klein 瓶 (II) 中 (2,0) 给 χ = 0。**没有任何曲面的 χ 落在 1 与 2 之间或大于 2**。
gaps:
  - |
    **⚠ 本推导的关键一步在任何来源里都不存在**：Gallier–Xu 全书**不讨论 χ > 0**，
    也没有任何形式的「χ > 0 ⇒ 恰好三种」陈述（researcher 逐页核实，math-sources.md §39.0 表 (A) 第三行）。
    上面的不等式求解是**本图完成的两行初等算术**。来源只提供两个输入：Definition 6.5 的参数范围
    与 pp. 89–90 的 χ 公式。
  - |
    **未标 rigorous 的理由（docs/STATUS_LEVELS.md 第 4 级的「例外」条款）**：本推导正好符合
    「前提已完整写出 + 有限步初等计算」的形状，**但该条款要求 reviewer 已独立复核并在 notes 里
    写 `reviewer-verified: <agent>, <date>`**。本卡建立时**尚无复核记录**，
    按「缺此记录的一律 physical-argument」取 physical-argument。见 notes 的升级路径。
  - |
    **继承上游的两条缺口**（见 math.classification-of-compact-surfaces--via-normal-forms 的 gaps）：
    (a) 三角化存在性（Radó）的证明在 Gallier–Xu Appendix E，本图未读；
    (b) 来源对 "surface" 是否已含连通性未核实，本卡把连通性写成显式前提。
  - |
    **χ 公式无编号**：pp. 89–90 的两条 χ(K) 公式是**行间式**，图里只能引页码。
    **严禁**把它们写成任何定理号。
  - |
    **type (II) 的 p 数的是交叉帽个数**，与常见物理写法「χ = 2 − 2g − b − c」的四参数记法不同
    （原书用一个属数 g 覆盖两种情形）。若下游节点仍在用四参数写法，须先做记号对照。
