  - "**没有第二条独立来源**：Chenevier–Lannes 对这一条只说 «Il est bien connu que …»（p. 1），不证不引，⇒ 不得引作来源。Serre / Milnor–Husemöller 本该是那条独立来源，但两书正文未取到（math-sources.md Q47.1、Q47.6）。"
