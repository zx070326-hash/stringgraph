id: math.e8-adjoint-trace-identities--via-casimir-structure
target: math.e8-adjoint-trace-identities
kind: physical-argument
status: physical-argument
depends_on:
  - id: conv.gauge-trace-normalization
    note: 固定 tr = Tr（E₈ 的最低维表示即伴随表示）与 F 为偶次形式。约定不参与状态传播。
sources:
  - ref: green-schwarz-1984
    loc: "PLB p.119（重印 610），(12a′)(12b′)(12c′)；致谢段（PLB p.122 / 重印 613）"
    note: |
      **论证形态：直接断言。** GS 给出三条等式，无证明、无出处；
      致谢里把群论输入归给 G. Chapline 与 R. Slansky 的**私人交流**
      （逐字：「E₈ has no independent fourth- and sixth-order Casimir invariants」），
      即文献里根本没有一份可引的证明。抽取记录 E8/E19。
  - ref: antonelli-2015
    loc: "Appendix B, p.35（与 GS (12′) 逐字一致，注明取自 GSW Vol. 2）"
    note: |
      转引 GSW Vol. 2（本项目未核实，bib 尚无 gsw-1987-v2 条目），不是独立证明。
  - ref: bilal-2008
    loc: "§12, (12.28)–(12.29)"
    note: |
      重标度约定下的同一组关系；换算已复算（见目标节点 sources 第三条），
      但该文同样不给证明。
  - ref: van-ritbergen-1998
    loc: "App. A.5「Indices and trace identities for E₈」, eqs. (176)(177)，PDF p. 35"
    note: |
      **2026-09-11 补登（curator，抽取记录 math-sources §44.5）**：独立、免费、带编号的第二来源。
      (176) Tr F⁴ = 36 (1/60 Tr F²)²，(177) Tr F⁶ = 30 (1/60 Tr F²)³，「in the representation (248)」；
      化简 36/3600 = 1/100、30/216000 = 1/7200，**与 GS (12b′)(12c′) 逐位相等**，归一化相同（都是 248 维伴随迹）。
      vRSV 的推导方法（§5.11 经 D₈ 子代数展开特征标，见 (86)）本推导没有复述，
      所以这条来源在本推导里只作**数值确认**；系数的可核算推导见 --via-root-power-sums。
summary: |
  **来源的论证形态：直接断言 + 一句群论理由。** 三条等式的内容等价于
  「e₈ 的不变量环在 4 阶与 6 阶没有独立生成元，故 Tr F⁴、Tr F⁶ 必须正比于 (Tr F²)²、(Tr F²)³」，
  剩下的只是定出两个系数 1/100 与 1/7200。GS 把前半句归给 Chapline–Slansky 的私人交流，
  后半句（系数）根本没说来历。

  **本图能独立说的部分**：给定「Tr F⁴ = a (Tr F²)²、Tr F⁶ = b (Tr F²)³ 对某两个有理数 a, b 成立」
  这一结构性事实，两个系数各由一次取值确定（例如取 F 落在某个 su(2) 子代数里算指标），
  但**这一步本推导没有做，本推导的来源也没有做**（2026-09-11 补注：现已由
  math.e8-adjoint-trace-identities--via-root-power-sums 用根幂和做出，见 gaps 第 2 条；
  本段保留为 2026-09-11 之前本图的论证状态记录）。

  **一致性检查（本图做的）**：本节点的 (1/100, 1/7200) 与 bilal-2008 在重标度
  tr_B F² = Tr F²/30 下的 (9, 75/20) 等价：
    9 (Tr F²/30)² = (9/900)(Tr F²)² = (1/100)(Tr F²)²，
    (75/20)(Tr F²/30)³ = (3.75/27000)(Tr F²)³ = (1/7200)(Tr F²)³。
  两个独立来源在换算后逐项一致。
gaps:
  - "「e₈ 无独立四阶、六阶 Casimir 不变量」这条结构性事实在本推导的**所有**来源里都没有证明：GS 归给私人交流，Antonelli 转引 GSW Vol. 2（未核实），Bilal 不给，vRSV 只给结果。（2026-09-11 补注：承载该事实的次数表现已登记——humphreys-1990-reflection §3.7 Table 1, p. 59，E₈ → 2, 8, 12, 14, 18, 20, 24, 30，L1；但本推导没有用它，也暂无以它为来源的卡。）"
  - "**系数 1/100 与 1/7200 的来历：本推导自身不给，已由 --via-root-power-sums 关闭。** 该推导对 Humphreys §2.10 的 240 根做幂和（math.e8-root-system-power-sums，Lean 已核 P₄ = P₂²/100、P₆ = P₂³/7200 对一切 x ∈ ℚ⁸），并有 vRSV (176)(177) 独立数值确认。本推导保留为 GS 原文论证形态的记录。"
  - "升级路径（2026-09-11 更新）：本推导自身不会升级——它记录的是 GS「直接断言」的论证形态。目标卡的升级走 --via-root-power-sums：待 math.adjoint-weights-are-roots-and-zero 与 math.chevalley-restriction-theorem 两座桥的来源核实到 L1（researcher Q39 与 GTM 9 §8），那条推导可升 rigorous。"
notes: |
  同 math.so-usp-adjoint-fundamental-trace-identities--via-adjoint-decomposition 的说明：
  physical-argument 记的是**本图掌握的论证强度**，不是对结论的怀疑。

  【2026-09-19 own status 评估（curator，e8-own-status 审计）】
  本推导的 depends_on 只有一条约定边（conv.gauge-trace-normalization，不参与状态传播），没有任何
  命题依赖——它不是「被弱依赖压低」的情况，因为根本没有可传播的依赖可压。own status 完全由本推导
  **自己的组装步骤**决定，而那一步就是：直接引用 green-schwarz-1984 的三条断言，**无证明**；GS 自己
  把群论输入（「E₈ 没有独立的四阶、六阶 Casimir 不变量」）归给 Chapline–Slansky 的**私人交流**
  （文献里没有可引的证明文本）；antonelli-2015 只是转引 GSW Vol.2（本项目未核实）；bilal-2008、
  van-ritbergen-1998 给同一组数但同样不给证明。summary 里已自陈「本图能独立说的部分……这一步本推导
  没有做，本推导的来源也没有做」。这不是「有限初等计算、松弛全在依赖里」的情形——本推导自身的组装
  步骤（=从来源里抄一句无证明的断言）就是全部内容，本身就是 physical-argument 的标准判据
  （docs/STATUS_LEVELS.md：「路径积分操作、非严格渐近、形式操作、『标准推导』」一类；这里连推导都没有，
  只有断言，比标准判据更弱但同一等级，没有更低的非猜想等级可用）。
  **own status 维持 physical-argument，不变。** 没有任何来源支持把这条推导的组装步骤本身升级；
  升级路径已经存在，就是 --via-root-power-sums（本图另一条独立推导，把「结构性事实 + 系数」拆开
  分别用 math.e8-root-system-power-sums 的 Lean 幂和与两座桥补上），工具已经在两条推导中自动取
  更强的那条（目前两条 own 都是 physical-argument，取更强等价的规则详见 STATUS_LEVELS.md「同级并列时
  的打破规则」）。
