    loc: "Remark 1.5, eqs. (1.30)–(1.32), p. 7；前提的超设定 Remark 1.4, eq. (1.16), p. 6；所用工具 Theorem 1.2 (Decomposition theorem), eqs. (1.25)(1.26)，与 (1.24)（∂_w^j δ(z,w)/j! 的模展开）"
    note: |
      **L1（researcher 2026-09-11，math-sources.md §51.2 (a)(d)(e)；arXiv:1512.00821v2）**。Remark 1.5 的证明就是
      正文那三句：Decomposition theorem 给 (1.30)，(1.31) 定义系数，「Using (1.24) and comparing the coefficients
      of z^m w^n on both sides of (1.30), we find (1.32)」。Theorem 1.2 在该讲义 §1.2 带证明（§51.2 (e)），
      即 Schottenloher Proposition 10.6 的对应物（Schottenloher 正文明写 "due to Kac"）。
      ⚠ 讲义是学生记稿（记稿人见 bib note）、非同行评议；版本写死 v2。
summary: |
  设 a(z), b(z) ∈ 𝔤[[z, z^{−1}]] 是齐次局域对，𝔤 李超代数，N 为局域阶。

  (1) **delta 分解**（Theorem 1.2 用于两变量局域形式分布 f(z,w) = [a(z), b(w)]）：
        [a(z), b(w)] = Σ_{j=0}^{N−1} (a(w)_(j)b(w)) ∂_w^j δ(z,w)/j!,   (1.30)
      系数唯一，且 a(w)_(j)b(w) = Res_z (z−w)^j [a(z), b(w)]（(1.31)）。
      ⚠ 分解定理作用在**一个**两变量形式分布上，与 f 的系数来自对易子还是反对易子无关——
      超括号只进入 f 的定义，不进入分解定理。

  (2) **展开 delta 的导数**（(1.24)）：∂_w^j δ(z,w)/j! = Σ_{m ∈ Z} C(m, j) z^{−m−1} w^{m−j}。

  (3) **比较 z^m w^n 的系数**：左端 [a(z), b(w)] 的 z^{−m−1}w^{−n−1} 系数是 [a_(m), b_(n)]（超括号逐系数）；
      右端由 (1)(2)，把 a(w)_(j)b(w) = Σ_k (a_(j)b)_(k) w^{−k−1} 与 (2) 相乘，取 w^{−n−1} 系数得
      k = m + n − j，故
        [a_(m), b_(n)] = Σ_{j=0}^{N−1} C(m, j) (a_(j)b)_(m+n−j)。   (1.32)

  (4) **奇–奇特例**：p(a) = p(b) = 1̄ 时按 Remark 1.4 的 Koszul–Quillen 规则，左端 [a_(m), b_(n)] = a_(m)b_(n) + b_(n)a_(m)
      = {a_(m), b_(n)}；(1.32) 的形状不变。p(a)p(b) = 0 时退化为玻色型公式。

  每一步都在 𝔤[[z^{±1}, w^{±1}]] 内完成，不用收敛性、径向排序或围道。
gaps:
