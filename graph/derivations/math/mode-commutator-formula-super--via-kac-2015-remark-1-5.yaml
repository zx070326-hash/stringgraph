depends_on:
  - id: math.formal-distribution-locality
    note: |
      提供形式分布 a(z) = Σ a_(n) z^{−n−1}、两变量形式分布、Laurent 多项式乘形式分布、局域性定义
      (z − w)^N [a(z), b(w)] = 0 以及形式 delta 函数 δ(z − w) 及其 (z − w)δ = 0——即 Remark 1.5 的前提
      「local pair」所需的全部记号。Kac 自己的定义是 Definition 1.3(a) (1.11)，与该卡（Schottenloher Def. 10.7）
      逐字同一条件。
      ⚠ 该卡写在含幺结合代数 R 上、括号是通常对易子；本推导按 Kac Remark 1.4 (1.16) 把括号换成李超代数的
      超括号 [x, y] = xy − (−1)^{p(x)p(y)}yx。定义本身（存在 N 使 (z−w)^N 乘上去为零）对括号是什么不敏感，
      故这不是新前提，只是把该卡的「[·,·]」按目标卡设定读成超括号；记在此处以免审计判「漏符号」。
sources:
