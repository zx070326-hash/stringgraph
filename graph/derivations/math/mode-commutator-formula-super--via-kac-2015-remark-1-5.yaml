    **来源是学生记录的讲义（arXiv:1512.00821v2），非同行评议**（math-sources.md §51.2 首段、§51.5 建议 1 的 ⚠）：
    证明完整、自足（Theorem 1.2 + (1.24) + 系数比较），故 status 按「自身论证的严格程度」记 rigorous，
    **不因出版形态降级**；但记录在案：若 reviewer 要求同行评议来源，目前**没有**可替代的超版带编号来源——
    schottenloher-2008 无超版（作者自陈 p.212）、bakalov-kac-2004 §2 非超、gebert-nicolai-1995 (2.38) 非超、
    kac-1998 §4.8 编号只到 L2（Q51.1）。
  - |
    **奇–奇 ⇒ 反对易子这一步原文未单独写出**：Remark 1.4 给出 Koszul–Quillen 规则与超括号定义，(1.32) 之下不再
    展开 {·,·} 的特例；summary (4) 是本图按规则代入，属有限步定义代入，不是新论证（§51.2 (b) 末的判定：
    「来源直接蕴含，不必标 inferred，但要在 note 里写明」）。
  - |
    **本推导不覆盖世界面场满足前提这件事**：把本命题用到 b(z), c(z) 或 ψ^μ(z) 上需要先证它们两两超局域
    （math-sources.md Q51.3：本项目无来源）。目标卡刻意写成一般李超代数的定理，故这不是推导与目标之间的缺口，
    是目标卡覆盖面的划界；弦论实例化留给使用方另建卡（仿 worldsheet.ope-pole-mode-commutator-dictionary）。
  - |
    **Kac 讲义 pp. 10–17、§4 未读**（Q51.2），Theorem 1.2 的证明页 researcher 读过（pp. 6–9 含 §1.2），
    但 §2.3「Bakalov's formula and Dong's lemma」与 Schottenloher Lemma 10.11 的对照未做；对本推导无影响。
notes: |
  由 curator-small-backlog-5 于 2026-09-11 建立。id 里的 "kac-2015" 取 arXiv 编号年份（1512.00821），
  bib key 是 kac-2017-lectures（v2 日期 2017-01-30）——同一文献。

  **本推导承载的是「形式分布版」**，与围道版 worldsheet.ope-anticommutator-dictionary-fermionic--via-contour-deformation
  是不同对象：那条把 [A_m, B_n} 写成径向排序乘积的两条围道之差再变形到绕 w 的小围道，本条从头到尾是形式级数的
  系数比较。两者之间差的「径向排序围道 = 形式分布残数」这一解析步骤在本图中没有任何一张卡证明
  （玻色型也是如此，见 worldsheet.ope-commutator-dictionary 的 notes）。

  **为什么 status 是 rigorous**：自身论证是有限步形式代数（分解定理 + 一个已知展开 + 系数比较），来源带完整证明；
  有效状态由工具算，唯一依赖 math.formal-distribution-locality 是 rigorous 定义卡。
  「讲义非同行评议」记在 gaps 第一条而不压 status（lead 派工裁定）。
