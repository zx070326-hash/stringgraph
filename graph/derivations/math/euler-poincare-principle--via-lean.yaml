  **与 --via-rank-nullity 的关系**：那条是纸面证明（rigorous，reviewer-batch26 签名），
  本条是同一论证的机器检查版本。两条并列而不是替换——纸面那条承载文献归属
  （FGZ Prop 1.3 / LZ p.317 / Hatcher Thm 2.44）与「两条文献来源都不印证明」这一记账事实，
  本条承载机检证据。目标卡的有效状态由工具在两条之间取最高者。

  **索引设计的坑（给后来者）**：不能写 `d n : C n →ₗ[K] C (n+1)` 再取 `range (d (n-1))`——
  那是 `Submodule K (C (n-1+1))`，`n-1+1 = n` 在 ℤ 上不是 defeq，且转运发生在依赖位置，
  `rw` 连类型正确的 motive 都造不出来。双索引 `d m n` 使 `cocycles`/`coboundaries` 同为
  `Submodule K (C n)`，全程无 cast。`coboundaries (n+1) = range (d n (n+1))` 那一步
  `simp only [h]` / `rw [h]` 都会失败，正确写法是
  `congrArg (fun m : ℤ => LinearMap.range (d m (n+1))) h`（该函数值域不依赖 m）。
  详见 `formal/TODO.md` 的 `euler-poincare` 条与文件头。
