summary: |
  记账已发表数学论证的一条逻辑推断步骤：给定"真实测度在超椭圆轨迹处有极点"（引用 Witten 2015 既有
  结果作为前提）与"CDvG Ansatz 处处全纯"（本文自己的直接观察），逻辑上得出"CDvG Ansatz 不能是真实
  测度公式"。这是一个完整、初等的条件性推断（若前提成立，结论必然成立），本身不涉及计算错误指控。
  depends_on 留空，因为前提（Witten 2015 极点存在性结果）尚未被本项目登记为图节点（见 gaps）。
