summary: |
  两情形各一行代数。

  **(b) E₈**（先做，更短）：
    RHS = (1/48) · x · [ x²/100 − (1/300) x² ]
        = (1/48) · x³ · (3 − 1)/300
        = (1/48)(1/150) x³
        = (1/7200) x³ = Ω₁₂ ✓

  **(a) SO(32)**：Ω₄ = 30x，故 (1/300) Ω₄² = (1/300)(900 x²) = 3 x²，
    正好抵掉 Ω₈ 里的 3x²：
    RHS = (1/48) · (30x) · [ (24y + 3x²) − 3x² ]
        = (1/48) · 30 · 24 · x y
        = (720/48) x y
        = 15 x y = Ω₁₂ ✓

  注意 SO(32) 这一支之所以成立，关键是**两件事同时发生**：
  N + 32l = 0（tr F⁶ 项消失，见 math.tr-f6-coefficient-vanishing）与
  (1/300)(N + 2l)² = 3（(tr F²)² 项对消）。后者即 (N + 2l)² = 900，配上 N + 2l = 30。

  展开形式：Ω₁₂ = (1/48) Ω₄ Ω₈ − (1/14400) Ω₄³（由 (1/48)(1/300) = 1/14400）。
