id: math.euler-beta-integral--via-gamma-product
target: math.euler-beta-integral
kind: physical-argument
status: physical-argument
depends_on: []
sources:
  - ref: polchinski-1998-v1
    loc: "§6.4, eq. (6.4.21)/(6.4.22)，p.183"
    note: |
      抽取记录 #E99，L1（schrans-2020 §6.39–§6.41，笔记 p.308–309）。
      来源只**给出**这两式并称推导 straightforward（[S] §6.39 全文：「This is straightforward.」），
      **没有证明** Beta 积分本身；下面的证明是标准教材论证，由 curator 写出。
summary: |
  标准证明（Γ 的积分表示 + Fubini + 极坐标型换元）：

  对 Re a, Re b > 0，
    Γ(a)Γ(b) = ∫₀^∞ ds s^{a−1} e^{−s} ∫₀^∞ dr r^{b−1} e^{−r}
             = ∫₀^∞∫₀^∞ ds dr  s^{a−1} r^{b−1} e^{−(s+r)}。
  换元 s = x t、r = x(1 − t)（x ∈ (0,∞)、t ∈ (0,1)，Jacobian = x）：
    = ∫₀^∞ dx ∫₀¹ dt  x  (xt)^{a−1} (x(1−t))^{b−1} e^{−x}
    = [∫₀^∞ dx x^{a+b−1} e^{−x}] · [∫₀¹ dt t^{a−1}(1−t)^{b−1}]
    = Γ(a+b) · B(a,b)。
  被积函数在 Re a, Re b > 0 时绝对可积，Fubini 与换元合法，故 B(a,b) = Γ(a)Γ(b)/Γ(a+b)。

  **极点结构**：Γ 在 0, −1, −2, … 有单极点，留数 Res_{z=−n} Γ(z) = (−1)^n/n!，其余处全纯且无零点，
  故 1/Γ(a+b) 是整函数，B(a,b) 的奇点只能来自 Γ(a)、Γ(b)，位置与留数如陈述所写。
