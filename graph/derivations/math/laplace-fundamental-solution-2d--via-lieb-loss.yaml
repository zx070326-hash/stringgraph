    note: |
      **L1，逐页核实**（researcher, 2026-09-10；literature/extractions/math-sources.md §2.2–§2.3）。
      文献自称的严格程度：标题 THEOREM + 完整 PROOF，是标准研究生教材（AMS GSM 14）里
