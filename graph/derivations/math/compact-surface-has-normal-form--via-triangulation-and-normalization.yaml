summary: |
  来源的证明链（Gallier–Xu Ch. 6），三步，全部在同一本书内：

  (1) **三角化存在性（Radó）**：每个紧曲面 / 紧带边曲面可三角化。原书 p.96 逐字承认
      「the proof is far from trivial」并把 Thomassen 的证明放在 **Appendix E**（正文不证）。
  (2) **三角化 ⇒ 胞腔复形**：三角化的 2-复形本身就是胞腔复形；反向的细分由 **Proposition 6.1**（p. 86）
      给出（逐字「Every cell complex, K, can be refined to a triangulated 2-complex.」），
      使「胞腔复形」与「三角化曲面」这两套语言等价。**Proposition 6.2**（p. 88）保证两套语言下的
      可定向性一致（Def 6.4 ↔ Def 4.6；无独立证明，回指 Prop 5.8），这是 type (I)/(II) ↔
      可定向/不可定向 这一对应的隐含桥。
  (3) **化归到规范形（Lemma 6.1，p. 92，逐字「Every cell complex, K, is equivalent to some canonical
      cell complex.」）**：每个胞腔复形经有限次剪切—粘合（cut-and-paste）等价于
      **Definition 6.5** 的某个规范胞腔复形，即 type (I) `a₁b₁a₁⁻¹b₁⁻¹ ⋯ c₁h₁c₁⁻¹ ⋯`（p ≥ 0, q ≥ 0）
      或 type (II) `a₁a₁ ⋯ c₁h₁c₁⁻¹ ⋯`（p ≥ 1, q ≥ 0），且序列 c_i h_i c_i⁻¹ 恰给出 q 个 contour。

  (1)+(2)+(3) 合起来即本条陈述：**任何紧连通带边曲面都落在 Definition 6.5 的参数表里**。

  **本推导不含**「同参数 ⟹ 同胚」那一半（Theorem 6.1/6.2），那是
  math.classification-of-compact-surfaces 的内容；本条只证存在方向。

  **status = rigorous 的依据**（docs/STATUS_LEVELS.md 第 4 级）：来源是 Springer 出版的数学专著，
  给出完整证明（(1) 在附录、(2)(3) 在正文），结论是代数拓扑的标准结果。
  ⚠ 本条**不**引用「有限步初等计算 + reviewer 复核」的例外条款——它是有出版证明的定理，走主判据。
