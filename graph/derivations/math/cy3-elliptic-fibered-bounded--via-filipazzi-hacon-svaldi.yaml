summary: |
  本推导的全部内容是**引用一篇已发表的代数几何论文的主定理**：

  Filipazzi–Hacon–Svaldi, "Boundedness of elliptic Calabi–Yau threefolds",
  J. Eur. Math. Soc. 27 (2025) 3583–3650，摘要首句逐字
  "We show that elliptic Calabi--Yau threefolds form a bounded family."

  独立佐证：Anderson–Gray–Nally–Taylor (arXiv:2606.08427v1) §I 把"椭圆与亏格一纤维化 CY3 的
  拓扑类型数目有限"归给包含该文在内的四条参考文献。

  ⚠ 本推导**不**采用该摘要的第二个结论（minimal terminal threefolds of Kodaira …），
  那一条带两个作者自陈"必需"的额外假设。
