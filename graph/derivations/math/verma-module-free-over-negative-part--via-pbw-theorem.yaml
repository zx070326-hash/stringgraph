target: math.verma-module-free-over-negative-part
kind: proof
status: rigorous
depends_on:
  - id: math.pbw-theorem
    inferred: false
    note: |
      **适用范围已由 lakos-2024-pbw 背书，本边于 2026-09-11 由 `inferred: true` 改为 `false`
      （curator，落地 math-sources.md §33.7(b)）。**
      本推导第 (2) 步对 L = vir 与 L = vir₋ 各用一次 PBW，两者都是**无限维**李代数。
      背书来源：**lakos-2024-pbw, Proposition 6.1（arXiv:1812.04896v2, p. 16）**，前提逐字为
      「K 是幺交换环、𝔤 是带相容李环结构的 K-模」且只要求 **𝔤 为自由 K-模**，
      **全文无任何有限维假设**，全局形式 (i) 的基索引集任意（L1 全文读毕，math-sources.md §33.2）。
      vir 与 vir₋ 都是特征零域上的可数维李代数，落在该假设内（域上的模皆自由），
      且都有现成的可数全序基（{L_n}_{n∈Z} ∪ {C}；{L_{-1} < L_{-2} < …}），
      故「全序基存在」这一前提在本用例中是显然的，**不需要选择公理**。
      本图侧对应的推导节点是 **math.pbw-theorem--via-lakos**（与 --via-humphreys 并列的第二条独立推导）。
      humphreys-1972 仍作为教科书证明的来源保留在目标上游，其有限维半单语境**不再是本边的瓶颈**——
      瓶颈从来不是「Humphreys 怎么说」，而是「本图有没有一条来源背书无限维」，现在有了。
      **原 inferred 理由与原撤销条件（Q15：核 Humphreys §17.1 对 L 的假设声明）**见
      math-sources.md §15.5 与 §33.7(b)；Q15 现已降级为**可选**，它只影响 humphreys-1972
      这一条 source 自身的自洽性，不再卡住任何一条边。
      ⚠ 与之无关、仍然有效的限制：PBW 在**任意**交换环上有反例（lakos-2024-pbw p. 2 逐字，
      引 Širšov、Cartier、Cohn），故日后放宽基环只能放宽到循环模直和 / PID 或 Dedekind 环 / ℚ ⊂ K。
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      本推导的对象就是该节点定义的 V(c,h) = U(vir)/J(c,h)，并用到它的三条结论：
      (i) 最高权关系与 |c,h⟩ 由 1 的陪集给出，(ii) V(c,h) 由 |c,h⟩ 在 U(vir) 下生成，
      (iii) V_N 的定义与 L_0 在其上作用为 h + N。
      来源 virasoro-lean-2025 的 Lemma 12.3 用的是**同一构造**（M_λ := 𝒰(𝔤)/I_λ，I_λ 由
      H − λ(H)1 与 X ∈ 𝔤₊ 生成的左理想），Virasoro 情形见其 Definition 12.4，故不是跨书认同。
  - id: worldsheet.virasoro-algebra-v2
    inferred: false
    note: |
      PBW 的输入是 vir 的三角分解 vir = vir₋ ⊕ vir₀ ⊕ vir₊ 与 vir₋ 作为 F-模自由（基 {L_{-n} : n ≥ 1}），
      两者都直接来自该节点的陈述（括号关系 + 「{L_n} ∪ {C} 张成、Vir(R) ≅ W(R) × R」）。
      归一化同为 conv.virasoro-standard；中心项的具体系数与本推导无关
      （vir₋ 内部 [L_{-m}, L_{-n}] 没有中心项，因为 (-m) + (-n) ≠ 0）。
      来源 virasoro-lean-2025 Definition 12.4 给的三角分解 𝔳𝔦𝔯_± = span{ℒ_n | ±n > 0}、
      𝔳𝔦𝔯₀ = span{ℒ₀, C} 与本节点写法逐字一致。
  - id: worldsheet.verma-level-spanned-by-partitions
    inferred: true
    note: |
      **记账用的边，不提升本推导的状态**（2026-09-11 合并 worldsheet.verma-module-pbw-basis 时补挂，
      原先挂在被删的 worldsheet.verma-module-pbw-basis--via-pbw 上）。
      该卡 formalized（formal/StringFormal/Virasoro/VermaPBW.lean ::
      StringFormal.Virasoro.finrank_levelSpan_le_card_partition），给出 PBW 的 **straightening 一半**：
      有序单项式**张成** V(c,h)，故 dim_K V_N ≤ p(N)。它正是本推导 summary (2) 第二次用 PBW 时
      「有序单项式张成 U(vir₋)」那一步在 Lean 里已被机器检查的部分，也是 summary (3) 计数的上界一半。
      **剩下的「线性无关」一半（dim_K V_N ≥ p(N)，即 (1)(2) 与 (4)）不在 Lean 里**，
      它来自 math.pbw-theorem，Mathlib v4.33.1 没有 PBW。
      加这条边的意义是在图上记账「PBW 里哪一半已被机器检查」；该卡与本推导的目标之间无循环
      （它只依赖 worldsheet.verma-module-v2 与 worldsheet.virasoro-algebra-v2）。
sources:
  - ref: virasoro-lean-2025
    loc: "§12, p. 11 正文（无编号）；定义见 Definition 12.2 与 Lemma 12.3，Virasoro 情形见 Definition 12.4"
    note: |
      **L1（researcher 2026-09-11 逐页读 PDF p.10–14，math-sources.md §16.3）**。
      来源对本命题给的**全部**论证就是那一句「From the Poincaré–Birkhoff–Witt (PBW) theorem,
      it can be seen that a basis of 𝒱_{c,h} is …」——即它把结论归为 PBW 的直接推论而**不写证明**。
      本推导的 summary 把那三步补全（诱导模识别 → PBW → 计数）。见 gaps 第一条。
summary: |
  标准论证，三步。全部在 F-代数范畴内做，不涉及任何拓扑或收敛。

  (1) **诱导模的识别**。令 b := vir₀ ⊕ vir₊ = span_F{L_n : n ≥ 0} ⊕ F·C，
      χ_{c,h} : b → F 由 L_0 ↦ h、C ↦ c、L_n ↦ 0 (n > 0) 给出。χ_{c,h} 是李代数同态
      （b 的导代数落在 span{L_n : n > 0} 里），故延拓成代数同态 U(b) → F，
      记其核为 m_{c,h} ⊂ U(b)。worldsheet.verma-module-v2 的左理想 J(c,h) 恰是 U(vir)·m_{c,h}，
      因此
        V(c,h) = U(vir)/J(c,h) ≅ U(vir) ⊗_{U(b)} F_{c,h}。

  (2) **PBW（两次）**。三角分解给 F-模直和 vir = vir₋ ⊕ b。
      对子代数 b ⊆ vir 用 math.pbw-theorem（及其「U(L) 作为 U(子代数)-模自由」的推论）得
      U(vir) 作为**右** U(b)-模自由，自由基由只含 vir₋ 字母的有序单项式给出；张量掉 U(b) 后
        V(c,h) ≅ U(vir₋) ⊗_F F_{c,h} ≅ U(vir₋)   （作为左 U(vir₋)-模），
      同构把 1 送到 |c,h⟩。这就是目标 (1)：自由、秩 1、以 |c,h⟩ 为自由基。
      再对 vir₋ 本身用一次 math.pbw-theorem，取全序基 L_{-1} < L_{-2} < …，得 U(vir₋) 的 F-基
      由有序单项式给出；作用到 |c,h⟩ 上，按来源的写法（最大下标在最左）即
        L_{-n_m} L_{-n_{m-1}} … L_{-n_1} |c,h⟩,   1 ≤ n_1 ≤ … ≤ n_m,
      这是目标 (2)。

  (3) **计数**。由 worldsheet.virasoro-algebra-v2 的括号，L_0 在上述基元上的本征值是 h + Σ_i n_i
      （对 [L_0, L_{-n}] = n L_{-n} 逐个因子递推）。故 V_N 中的基元恰对应满足 n_1 + … + n_m = N、
      1 ≤ n_1 ≤ … ≤ n_m 的序列，即 N 的整数分拆，个数 p(N)，给出目标 (3)。
      N = 0 只有空积一项，故 dim_F V_0 = 1、|c,h⟩ ≠ 0，给出目标 (4)。

  这条论证对**所有** (c,h) 一致成立：PBW 不看 (c,h) 取什么值。不可约性才看，那是
  worldsheet.kac-determinant 的事。
gaps:
  - "**来源不给证明**。virasoro-lean-2025 §12 p.11 对本命题给的全部论证是一句
     「From the PBW theorem, it can be seen that a basis of 𝒱_{c,h} is …」。summary 的三步是本图补写的
     （标准的诱导模论证，任何李代数表示论教材都有，但**本图没有一份逐字来源把这三步写出来**）。
     status 仍取 rigorous，理由：唯一的非平凡输入是 PBW，它有独立的来源节点（math.pbw-theorem）；
     其余是有限步初等代数（张量积的基变换 + 分拆计数）。若 reviewer 认为这已越过
     docs/STATUS_LEVELS.md 的门槛，应降到 physical-argument 并在此登记裁决。"
  - "**没有带编号的一手来源（Q17）**。本命题在文献里通常不是编号命题（要么写进定义，要么作为
     PBW 的即时推论一笔带过），见目标节点 notes。下一轮最值得抓的三个来源：Iohara–Koga (2011)、
     Moody–Pianzola (1995)、Feigin–Fuks (1984)；本轮三者都拿不到公开全文，故未登记进 sources.bib。"
  - "**上游的适用范围（Q15）——已结案，2026-09-11**：到 math.pbw-theorem 的边原先标 `inferred: true`，
     理由是 Humphreys 的语境是有限维半单而这里的 vir、vir₋ 是无限维。现已改 `inferred: false`：
     **lakos-2024-pbw, Prop. 6.1（K 幺交换环、𝔤 自由 K-模、全文无有限维假设、索引集任意；L1 全文读毕）**
     背书了本用例的适用范围，图上对应 `math.pbw-theorem--via-lakos`。见该边的 note 与 math-sources.md §33.7(b)。
     残留的（更弱的）限制是基环：PBW 在任意交换环上有反例，本图把 math.pbw-theorem 限定在域上，安全。"
  - "**未形式化，且缺口是精确的一条上游定理**：Mathlib **没有** PBW（读取日期 2026-09-11）。
     两条 L1 证据：(i) `Mathlib/Algebra/Lie/UniversalEnveloping` 的全部 17 个声明只围绕构造与泛性质
     （Rel、ringCon、UniversalEnvelopingAlgebra、mkAlgHom、ι、lift、lift_unique、hom_ext 等），
     **没有滤过、没有与对称代数的同构，连 TODO 段都没有**；(ii) Kytölä 逐字自陈
     「Mathlib does not currently have the PBW theorem」，并称补上它是 \"a major undertaking\"。
     他的 VirasoroProject 已形式化 Verma 模的理想商构造（vermaIdeal / VermaModule /
     VermaModule.hwVec / VermaModule.universalMap / IsVermaModule），**唯独缺显式 PBW 基**。
     本图侧：worldsheet.verma-level-spanned-by-partitions（straightening 一半，dim V_N ≤ p(N)）
     已形式化，**线性无关那一半没有**。换成本节点的编号：**(3) 的上半（dim_F V_N ≤ p(N)）已形式化；
     (1)、(2)、(3) 的等号与 (4) 都需要线性无关。**
     ⇒ 本推导上限 rigorous，**不得标 formalized，直到 Mathlib 有 PBW 为止**。
     复查时同时看 `Mathlib/Algebra/Lie/UniversalEnveloping.lean` 与 Mathlib 的 1000.yaml 跟踪表；
     若届时 Mathlib 有了 PBW，本条与 math.pbw-theorem 的同名记录须一并重估。
     （本条的后半段来自 2026-09-11 被删的 worldsheet.verma-module-pbw-basis--via-pbw。）"
  - "**「V(c,h) ≠ 0」（目标 (4)）在形式化侧是空缺**（并自被删的 worldsheet.verma-module-pbw-basis--via-pbw）。
     在线性无关那一半做出来之前，formal/StringFormal/Virasoro/Verma.lean 中的一切结论都可能是空洞真
     （V(c,h) = 0 时全部平凡成立），且没有便宜替代品——任意 (c,h) 的非零最高权模本身就是要构造的东西，
     只有 (c,h) = (0,0) 时平凡模现成可用。这正是把非零性放进本节点而不是 worldsheet.verma-module-v2 的原因。"
  - "**straightening 的形式化细节（formalizer 更正，2026-09-11；并自被删推导）**：formal/TODO.md 原先写的
     「对（词长, 逆序数）双重归纳」**不成立**——Leibniz 律第二项 L_b (L_a X) 经内层整理后长度不减
     （内层 straightening 可产生比原尾巴更长的词），双重归纳的度量不单调。
     VermaPBW.lean 实际用的有效度量是 wordWeight = Σ_i i·l_i（表头不贡献），它在负模态词上 ≤ 0，
     换序步与对易子步都使它**严格增大**（故 wordMeasure = (−wordWeight).toNat 严格下降）；
     且 `straighten` 的结论**必须带 wordMeasure 不增**这一上界，否则嵌套整理无法被归纳假设覆盖。
     这条记的是 straightening 在形式化时暴露的问题，**不影响本推导 rigorous 的结论**——
     文献侧的 PBW 证明不走这条归纳。"
  - "**基环**。目标节点限定在特征零的域 F 上，只为使用「维数」与「分拆计数」的语言。
     自由性 (1) 对任意交换环 R（vir₋ 作为 R-模自由）都成立，worldsheet.verma-module-v2 的构造本就对
     任意 ℚ-代数成立。若日后需要一般 R 上的版本，应新建节点而不是改本节点的陈述。"
