  **下标排序的对照（并自被删推导）**：本节点按来源写基元
    L_{-n_m} L_{-n_{m-1}} … L_{-n_1} |c,h⟩,  1 ≤ n_1 ≤ … ≤ n_m；
  被合并的那张卡与图中若干下游写作
    L_{-n_1} L_{-n_2} … L_{-n_k} |c,h⟩,      n_1 ≥ n_2 ≥ … ≥ n_k ≥ 1。
  **这是同一组基元**：只是把下标序列反过来标号（k = m，后者的 n_i = 本节点的 n_{m+1-i}），
