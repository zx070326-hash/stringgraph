    **除子 ↔ 线丛字典未在图里落地**：`l(2K) = dim H⁰(K^{⊗2})` 与 `l(−K) = dim H⁰(K^{−1})`
    用的是「取定 (ω) = K 的非零亚纯 1-形式 ω，f ↦ f·ω^{⊗2}（resp. f ↦ f·ω^{−1}）给出同构」这一标准构造。
    本图**没有**为它单建节点，也未在任一来源里逐字核到该同构的编号。
    ⇒ 若 reviewer 认为这一步不算「初等计算」的一部分，应先补一张
    `math.divisor-line-bundle-sections-dictionary` 卡再谈升级。
