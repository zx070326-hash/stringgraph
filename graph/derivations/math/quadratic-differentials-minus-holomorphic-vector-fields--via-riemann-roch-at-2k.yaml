id: math.quadratic-differentials-minus-holomorphic-vector-fields--via-riemann-roch-at-2k
target: math.quadratic-differentials-minus-holomorphic-vector-fields
kind: physical-argument
status: physical-argument
depends_on:
  - id: math.riemann-roch-theorem
    note: |
      提供 l(D) − l(K − D) = deg D + 1 − g，对**任意**除子 D 成立——本推导取 D = 2K。
      「任意 D」这一点很关键：正因为不需要 D 有效或 deg D 大，g = 0 与 g = 1 才不用分情形。
  - id: math.canonical-divisor-degree
    note: |
      提供 deg K = 2g − 2，从而 deg(2K) = 4g − 4；这是把 Riemann–Roch 右端算成数字的唯一输入。
sources:
  - ref: eynard-2018-lectures
    loc: "Ch. 4, §1, Theorem 1.2 (Riemann-Roch), eq. (1-10), p. 72（arXiv:1805.06405v1）；配套定义 Definition 1.2 (1-5)(1-6), p. 71"
    note: |
      ⚠ **本推导的代入计算不在来源里**：math-sources.md §42.2 逐字自我声明这是抽取者的推算。
      来源只承载被代入的那条定理。Eynard ↔ 本图记号字典：r(−D) = l(D)，i(D) = l(K − D)，𝔤 = g。
  - ref: farkas-kra-1992
    loc: "§III.5 (Applications of the Riemann–Roch Theorem), pp. 79–90, 2nd ed."
    note: |
      教材里 dim H⁰(K²) = 3g − 3（g ≥ 2）就在这一节，作为 Riemann–Roch 的应用出现；
      **正文未取得、编号未知**，本条只作「这类计算是标准做法」的旁证。
summary: |
  对除子 D = 2K 用一次 Riemann–Roch（Hartshorne 形式，l 为向量空间维数）：

    l(2K) − l(K − 2K) = deg(2K) + 1 − g
    l(2K) − l(−K)     = (4g − 4) + 1 − g       （用 deg K = 2g − 2 ⇒ deg 2K = 4g − 4）
                      = 3g − 3 。

  再用除子 ↔ 线丛的标准字典
    l(2K) = dim_C H⁰(X, O(2K)) = dim_C H⁰(X, K^{⊗2})   （全纯二次微分），
    l(−K) = dim_C H⁰(X, O(−K)) = dim_C H⁰(X, K^{−1})   （全纯向量场 = 全纯切丛的截面），
  即得

    dim_C H⁰(X, K²) − dim_C H⁰(X, K^{−1}) = 3g − 3 = −(3/2) χ ,   χ = 2 − 2g 。

  **三点值得强调的后果**：
  1. **对一切 g 成立，无需分 g = 0 / 1 / ≥ 2 讨论**，也不需要用球面标定任何常数
     （对比 worldsheet.riemann-roch-kappa-minus-mu--via-ghost-number-anomaly 的 gap 第 1 条）。
  2. 两个检验值是自动推论：g = 0 给 −3，g = 1 给 0。
  3. 单个维数**不**由本推导给出：那要另加「deg D < 0 ⇒ l(D) = 0」。
