  - |
    [GAP: 最后一个箭头的命名] Lemma 7.9 显示式里 j_*ω⊕j'_*ω'→ω_Z 这个箭头 FKP-A 未命名。本证明
    取它为典范的无留数（trace）包含——proof.md §11 论证这是唯一自然候选，且与 §5.2 的局部茎计算
    自洽（该包含单但不满，余长一，且这个"不满"恰是 ω_Z(R^Z)^- 的茎结构所要求的）。是一个有充分
    理由但仍属**解释性**的选择，不是 FKP-A 逐字给出的。
