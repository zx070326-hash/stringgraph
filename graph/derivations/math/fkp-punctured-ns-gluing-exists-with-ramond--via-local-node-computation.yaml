summary: |
  证明分两步。(1) 恒同化（proof.md §4）：在偶底 S 上把粘接超概形 Z 的结构层拆成
  O_Z = O_{Z_0} ⊕ (j_*L ⊕ j'_*L')（Lemma 4.1，来自 FKP-A 自己的粘接构造，§7.5），并用有限态射的
  Hom 伴随（Lemma 4.2，自证）把条件 (2.4) 对 Z 翻译成一条具体的层同构问题——"主命题"：
  Φ_Z: F → Hom(F, ω_{Z_0}(D)) 是同构，其中 F=j_*L⊕j'_*L'，D 为粘接后的 Ramond 除子（Lemma 4.3
  给出 ω_Z(R^Z)^- 的显式形式；§4.4 证明 Φ_Z 就是 δ_Z^- 本身，块对角，无交叉项）。
  (2) 局部性论证（proof.md §5）：是否为同构是 Z_0 上局部问题，取开覆盖 {V, Z_0∖{z}}，V 是不含
  Ramond 除子支集的节点邻域（由 Definition 2.4 的"不相交"要求保证存在）。节点之外，Φ_Z 限制为
  两支上各自的 (2.5)，逐字就是假设本身。V 上，扭转层 O_{Z_0}(D) 被重言截面典范平凡化，问题退化
  为 FKP-A 自己未给出证明的"It is well known that…"，proof.md 在局部模型
  A=k[[u,v]]/(uv)=k[[u]]×_k k[[v]] 上显式算完：Ann_A(v)=(u)、对偶化层 A·η（[S1]，Rosenlicht/Serre
  标准事实）、分支包含 du↦uη，把 Hom_A(A_1,Aη) 经"取值于 1"识别为 (u)η，映射 1↦αuη 在 α 为单位
  （(2.5) 在 P 处的完备性=同构 的直接推论）时是自由秩一模间的同构。§6 核对 Definition 2.4 的其余
  条件（光滑轨迹与穿孔存在性、CM 条件、稳定性），逐条确认与 R 无关，唯一用到"不相交"的第二处是
  §6.2 的 R_i⊂U∖P。§7 把两步组装为 Theorem 7.1，其"特别地"给出 (7.8)/(7.9) 良定义。
