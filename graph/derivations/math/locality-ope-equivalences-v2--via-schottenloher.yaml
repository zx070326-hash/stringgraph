sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Theorem 10.10, p. 178（陈述与证明）；Proposition 10.6, pp. 175–176（(z−w)^N f = 0 ⇒ f 唯一地写成 Σ_{j<N} c^j(w) D_w^j δ(z−w)，且 c^n(w) = Res_z (z−w)^n f，对 N 归纳的完整证明）；Lemma 10.4–10.5, p. 174（delta 函数恒等式）；(10.1)、D^jδ 的展开式与 i_{z,w} / i_{w,z} 的两条级数, p. 177 \"Analytic Aspects\" 段；模指标记号段 A_{(n)} = A_{−n−1} = Res_z A(z) z^n 与 A(z)_− := Σ_{n≥0} A_{(n)}z^{−n−1}、A(z)_+ := Σ_{n<0} A_{(n)}z^{−n−1}, p. 177（紧接 Remark 10.8）；**Definition 10.9, p. 178：:A(z)B(w): := A(z)_+ B(w) + B(w) A(z)_−，并给出 A(z)B(w) = +[A(z)_−,B(w)] + :A(z)B(w): 与 B(w)A(z) = −[A(z)_+,B(w)] + :A(z)B(w):**"
    note: |
      **L1（researcher 2026-09-11 逐页读图两轮，math-sources.md §11.1–§11.3 与 §11A）**。文献自称的严格程度：
      标题 Theorem，正文给证明，出处是 Springer LNP 759 的数学教材（作者是 LMU 数学系），
      不是物理书里的形式操作。整章停在形式级数层面，证明中不出现任何收敛性论证，
      因而也不需要任何收敛性假设——这正是它能标 rigorous 的原因。
      第三轮已把 p. 177 记号段与 Definition 10.9 逐字转录，`loc` 照抄其公式；
      **注意 ± 的方向与物理惯例相反**（见 gaps 第二条）。
      Definition 10.9 之后紧跟一句「With this new notation the result of Proposition 10.6 can be restated
      as follows.」——即 Definition 10.9 是 Theorem 10.10 第 4 条得以成立的**记号前提**，两者在书上连着。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, Definition 5.9 式 (5.27)：[A_m, B_k] = Σ_{l=0}^{N−1} (m choose l) C^l_{m+k−l}"
    note: |
      **不是本推导的证明来源**，只作第 5 条求和下限的独立旁证（gaps 第一条的依据 (iii)）。
      Gui 的等价性走的是复解析局域性（前提比本推导强），本推导整篇停在形式级数层面。
      ⚠ 版本陷阱：该讲义编号随版次变动，`loc` 必须带日期版号。
summary: |
  全部在 R[[z^{±1}, w^{±1}]] 内做形式代数：
  (1 ⇒ 2) 取 f = [A(z), B(w)]，由 (z-w)^N f = 0 与 Proposition 10.6，f 唯一地写成
      Σ_{j=0}^{N-1} C^j(w) D^j δ(z-w)，且 C^j(w) = Res_z (z-w)^j [A(z), B(w)]。
  (2 ⇒ 1) Lemma 10.5：(z-w)^N 零化每个 D^j δ(z-w)（j < N），故零化其 R[[w^{±1}]]-线性组合。
  (2 ⇔ 3) 用 (10.1) D^j δ(z-w) = i_{z,w}(z-w)^{-(j+1)} - i_{w,z}(z-w)^{-(j+1)}，
      并按 z 的幂次正负把 [A(z), B(w)] 拆成 [A(z)_-, B(w)] + [A(z)_+, B(w)]
      （**按来源的 ± 方向**：A(z)_- = Σ_{n ≥ 0} A_{(n)} z^{-n-1} 是 z 的**负**幂部分，
      A(z)_+ = Σ_{n < 0} A_{(n)} z^{-n-1} 是 z 的**非负**幂部分）：
      i_{z,w}(z-w)^{-(j+1)} 只含 z 的负幂、i_{w,z}(z-w)^{-(j+1)} 只含 z 的非负幂，逐幂比较即得第 3 条的两式；反向相加即回到第 2 条。
  (3 ⇔ 4) 由 Definition 10.9 的正规序积 :A(z)B(w): = A(z)_+ B(w) + B(w) A(z)_-（**来源的 ± 方向**），
      直接得 A(z)B(w) - :A(z)B(w): = [A(z)_-, B(w)]，B(w)A(z) - :A(z)B(w): = -[A(z)_+, B(w)]
      （这两式在书上就写在 Definition 10.9 之下），
      故第 3 条与第 4 条只是同一对等式的移项。
  (2 ⇔ 5) 把 δ(z-w) = Σ_k z^{-k-1} w^k 代入第 2 条并取 z^{-m-1} w^{-n-1} 的系数：
      D^j δ(z-w) 的 z^{-m-1} 系数为 (m choose j) w^{m-j}，与 C^j(w) = Σ_k C^j_{(k)} w^{-k-1} 相乘后
      取 w^{-n-1} 系数得 (m choose j) C^j_{(m+n-j)}，求和即第 5 条；反向逐系数还原即第 2 条。
      等价地用 p. 177 的两条记号（A_{(m)} = Res_z A(z) z^m 与 Res_z z^m D^j_w δ(z-w) = (m choose j) w^{m-j}）：
        [A_{(m)}, B_{(n)}] = Res_z Res_w z^m w^n [A(z), B(w)]
                           = Res_z Res_w z^m w^n Σ_{j=0}^{N-1} C^j(w) D^j_w δ(z-w)
                           = Σ_{j=0}^{N-1} (m choose j) Res_w C^j(w) w^{m+n-j}
                           = Σ_{j=0}^{N-1} (m choose j) C^j_{(m+n-j)}。
      **注意求和下限：(m choose 0) = 1 ≠ 0，故 j = 0 项一般不为零，下限必须是 j = 0**——
      这独立地重证了 gaps 第一条的判定（印本的 j = 1 是排印错误）。
  五条中的 C^j 因 Proposition 10.6 的唯一性而是同一组。
gaps:
  - "**★ 已结案（原 Q10），仅留痕**：Theorem 10.10 第 5 条的求和下限**印本印作 j = 1**
     （researcher 两次不同缩放各读一遍，判读一致），**本图判为排印错误，按 j = 0 写**。
     四条独立依据：(i) 同一条定理第 2–4 条都是 Σ_{j=0}^{N−1}，用**同一批** C^j 与**同一个** N，
     若第 5 条从 j = 1 起则它严格弱于第 2–4 条，「五条等价」不成立；
     (ii) Proposition 10.6 (p. 175) 产出的正是 c^0, …, c^{N−1}，丢掉 j = 0 项等于丢掉它给的一个系数；
     (iii) 独立文献 gui-2023-lectures (2026-07-15 版) Definition 5.9 式 (5.27) 的下限是 l = 0；
     (iv) 本章这一带有系统性的交叉引用排印错误——p. 179 一处、p. 180 两处共**三处**把「10.10」印成「10.5」。
     另有反例：Virasoro 情形书上 p.179–180 给 C⁰(w) = ∂_wT(w) ≠ 0，从 j = 1 起会整个丢掉这一项。
     ⚠ **不要用 p. 179 的 Heisenberg 例子去验证**：该例恰好 C⁰ = 0，对 j = 0 与 j = 1 **没有区分力**。
     本推导 summary 的 (2 ⇔ 5) 一步自身就重新推出了下限必须是 j = 0。
     详见 literature/extractions/math-sources.md §11A.3 与目标节点 notes 的「Q10 结案记录」。
     **这是本推导与被引页面唯一不逐字一致之处，按项目原则 2 永久留痕。**"
  - "**★ 已结案（原「记号的 L0 部分」），仅留痕**：Definition 10.9（:A(z)B(w):）与 p. 177 的
     A(z)_± 拆分已于 2026-09-11 第三轮逐字转录（math-sources.md §11A.1–§11A.2）——
     **来源的 `-` 是模指标 n ≥ 0 的那一半（z 的负幂），`+` 是 n < 0 的那一半，与物理惯例相反**。
     summary 的 (2 ⇔ 3)、(3 ⇔ 4) 两步按来源方向写。作为算符表达式的 :A(z)B(w): 与旧写法不变，
     等价性本身不受影响。
     **本推导原名 math.locality-ope-equivalences--via-schottenloher、原指 math.locality-ope-equivalences（v1）**；
     v1 的记号段是「按通行定义补写」的相反方向且自相矛盾，按项目原则 1 不得就地改写，
     故 2026-09-11 由 lead 裁决：v1 恢复原文并 superseded_by v2，本推导改名改指 v2，v1 不留推导。
     下游 worldsheet.string-cft-is-a-vertex-algebra-v2 与 worldsheet.ope-pole-mode-commutator-dictionary
     的陈述文本仍沿用 v1 的 ± 标签，其结论不受影响（见目标节点 notes 的「下游一致性核查」）。"
  - "p.179 一处、p.180 两处共**三处**正文写「4 in Lemma 10.5」「our Theorem 10.5」「property 5 in Lemma 10.5」，
