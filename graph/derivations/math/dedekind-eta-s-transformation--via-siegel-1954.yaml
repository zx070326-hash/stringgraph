summary: |
  **Siegel 1954 的留数定理证明**（原文 1 页，本图按 math-sources.md §48.3 的逐字转录复述）。

  (1) 取对数：由乘积定义，
        (1/12)πiτ − log η(τ) = −Σ_{l≥1} log(1−q^l) = Σ_{k,l≥1} (1/k) q^{kl} = Σ_{k≥1} (1/k)(q^{−k}−1)^{−1} 。
      于是 η(−1/τ) = η(τ)√(τ/i) 等价于（原文 "it suffices to prove that"）
        πi(τ+τ^{−1})/12 + ½ log(τ/i) = Σ_{k≥1} (1/k)( 1/(e^{−2πikτ}−1) − 1/(e^{2πik/τ}−1) ) 。

  (2) 围道积分：令 f(z) = cot z · cot(z/τ)，ν = (n+½)π（n = 0, 1, …）。
      亚纯函数 z^{−1} f(νz) 在 z = ±πk/ν 与 z = ±πkτ/ν（k ≥ 1）有单极点，留数分别为
      (1/πk)cot(πk/τ) 与 (1/πk)cot(πkτ)；在 z = 0 有三阶极点，留数 −⅓(τ+τ^{−1})。
      取顶点 1, τ, −1, −τ 的菱形围道 C，留数定理给
        πi(τ+τ^{−1})/12 + ∫_C f(νz) dz/(8z) = ½ i Σ_{k=1}^{n} (1/k)(cot πkτ + cot πk/τ)
          = Σ_{k=1}^{n} (1/k)( 1/(e^{−2πikτ}−1) − 1/(e^{2πik/τ}−1) ) 。

  (3) 取极限 n → ∞：f(νz) 在 C 上一致有界，且在四条边上（除顶点外）的极限值为 1, −1, 1, −1，故
        lim_{n→∞} ∫_C f(νz) dz/z = ( ∫_1^τ − ∫_τ^{−1} + ∫_{−1}^{−τ} − ∫_{−τ}^{1} ) dz/z = 4 log(τ/i) ，
      乘 1/8 得 ½ log(τ/i)，与 (1) 的待证式吻合，证毕。

  **抽取者的两处系数复算**（math-sources.md §48.3，均通过）：z = 0 三阶极点贡献
  2πi·(1/8)·(−⅓)(τ+τ^{−1}) = −πi(τ+τ^{−1})/12，坐实 dz/(8z) 里的 8；单极点贡献
  2πi·(1/8)·2·(1/πk)(cot πkτ + cot πk/τ) = (i/2)(1/k)(…)，且 (i/2)(cot πkτ + cot πk/τ)
  = 1/(e^{−2πikτ}−1) − 1/(e^{2πik/τ}−1) 由 cot θ = i(e^{2iθ}+1)/(e^{2iθ}−1) 逐项成立。

  **status = rigorous 的依据**（docs/STATUS_LEVELS.md 第 4 级**主判据**）：来源是发表在数学期刊
  （Mathematika）上的完整数学证明，结论是数学界接受的标准事实（原文自陈 "established in many
  different ways"）。**不引用**「有限步初等计算 + reviewer 复核」的例外条款。
gaps:
  - |
    **平方根分支与 Im τ > 0 在来源里是隐含的、不是明写的**（math-sources.md §48.2 / Q48.3）：
    目标卡 statement 写「(−iτ)^{1/2} 取主分支」「τ ∈ H」，而 Siegel 原文只写 √(τ/i)、只以
    |q| < 1 蕴含 Im τ > 0。按 curator 读法，(3) 里 log(τ/i) 由沿直线段的 ∫dz/z 定出，
    Re(τ/i) = Im τ > 0 时即主值对数，故分支实际被证明本身定死为主分支——
    **这是 curator 的解读，不是原文措辞**。若 Lean 化，这两条前提要自己补进陈述。
  - |
    **收敛与交换次序未逐字论证**：(1) 中 Σ log(1−q^l) 的二重级数重排、(3) 中「一致有界 +
    边上极限值」推出积分极限交换（有界收敛）在原文各只有一句话。这些是标准分析事实，
    不影响 rigorous 定级，但若形式化须逐条补齐。
  - |
    **本图未核 Apostol GTM 41 的定理号**（math-sources.md §48.5, Q48.1）：
    「Apostol, Theorem 3.1」在本项目零证据，**不得写进任何卡**；第二数学来源待 researcher 结清。
