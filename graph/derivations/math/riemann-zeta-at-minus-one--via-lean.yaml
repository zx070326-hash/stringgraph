summary: |
  机器检查。目标卡的整条陈述就是 Lean 声明 `riemannZeta_neg_one : riemannZeta (-1) = -1/12`
  的逐字翻译（ζ 即 Mathlib 的 `riemannZeta : ℂ → ℂ`，其在 Re s>1 上是 Σ n^{-s}、经亚纯延拓
  到 ℂ\{1} 的标准定义——Mathlib 侧这条定义本身未被本图复述，只承诺其在同一次 lake build
  里通过审计）。证明是 Mathlib 通式 `riemannZeta_neg_nat_eq_bernoulli` 在 k=1 处的特化 +
  `bernoulli_two` 数值代入，全程无 sorry。
