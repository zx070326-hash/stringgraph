depends_on:
  - id: math.dedekind-eta-function
    inferred: false
    note: |
      **本推导的 η 就是这张定义卡的 η，逐字核对过**（2026-09-11，formalizer 读 Mathlib 源码 L1，
      curator 复核）：Lean 侧的对象是 Mathlib 的
        `ModularForm.eta (z : ℂ) : ℂ := 𝕢 24 z * ∏' n, (1 - ModularForm.eta_q n z)`，
        `Function.Periodic.qParam h z = Complex.exp (2 * π * I * z / h)`，
        `ModularForm.eta_q n z = (𝕢 1 z) ^ (n + 1)`，
      即 𝕢 1 z = exp(2πiz) = q（本卡的 q），𝕢 24 z = exp(2πiz/24) = exp(πiz/12)（本卡的 q^{1/24}
      **以及它指定的那个单值分支**），∏' n:ℕ (1 − q^{n+1}) = ∏_{n≥1}(1 − q^n)（指标平移，
      Lean 一律从 0 数起）。⇒ 与定义卡 statement 的 q、q^{1/24}、乘积三项**逐字一致**，
      没有约定转换，故本推导**不需要** convention_map。
      定义卡里另外两条断言（H 的紧子集上一致收敛 ⇒ 全纯；无零点）在 Mathlib 里也有
      （`multipliableLocallyUniformlyOn_eta`、`differentiableAt_eta_of_mem_upperHalfPlaneSet`、
      `eta_ne_zero`），但本推导只用到「η = 那个乘积」这一条。
      ⚠ Mathlib 的 `ModularForm.eta` 在 **全 ℂ** 上有定义（ℍ 外是垃圾值）；本定理的假设
      `0 < z.im` 把讨论限回 H，与定义卡的定义域一致。
      ⚠⚠ **（已解除，2026-09-11）这条边曾是本推导有效状态的瓶颈**：定义卡 own status 当时是
      rigorous，按 docs/STATUS_LEVELS.md 的 min 规则，本推导 own=formalized 但 effective=rigorous。
      notes 末尾「给 lead 的一条」提的两条出路里的第一条已落地：formalizer 建了桥层
      `formal/StringFormal/Math/MathlibBridges.lean`，定义卡挂上
      `StringFormal.Bridge.dedekindEta_eq_exp_mul_tprod` 并升为 formalized（curator lean-wire-10）
      ⇒ 本边不再压低任何东西，本推导 effective = formalized。
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/DedekindEtaS.lean :: StringFormal.DedekindEta.eta_neg_inv；支撑链 csqrt_neg_I → csqrt_neg_I_mul → eta_neg_inv → {eta_S, eta_modular_S_smul}；推论链 csqrt_sq(private) → norm_eta_neg_inv_sq → norm_eta_neg_inv_pow_four → {im_mul_norm_eta_pow_four_S_invariant, im_mul_norm_eta_pow_four_modular_S_smul}"
    note: |
      本仓库，形式化侧提交 **77e171c**（"formal: prove Dedekind eta S-transformation in string
      normalisation (eta-s)"）+ **1b29b83**（"formal: add modular-action forms of the eta
      S-transformation"），合并提交 **4d9e721**（"Merge branch 'agent/formalizer/eta-s'"）；
      Lean 4 + Mathlib **v4.33.1**。目标声明全文（与目标卡 statement 逐字对应）：

          theorem eta_neg_inv {z : ℂ} (hz : 0 < z.im) :
              ModularForm.eta (-z⁻¹) = (-I * z) ^ ((1 : ℂ) / 2) * ModularForm.eta z

      指数 `((1:ℂ)/2)` 是 **ℂ 的 cpow 主分支**（formalizer 用 `pp.numericTypes` 复核过类型，
      不是自然数幂也不是实数幂）；这正是目标卡「(−iτ)^{1/2} 取主分支」那一句。
      前提只有 `0 < z.im`（= τ ∈ H），**无其它假设**。
      伴随声明：`eta_S`（`τ : ℍ` 版）、`eta_modular_S_smul`（`η(S • τ) = (−iτ)^{1/2} η(τ)`，
      **原写「为将来接生成定理备的形状」，2026-09-11 起已兑现**：它与
      `im_mul_norm_eta_pow_four_modular_S_smul` 被 math.eta-modular-invariant-combination--via-lean
      的 `Subgroup.closure_induction` 在 `x = ModularGroup.S` 分支逐字调用）、
      `im_mul_norm_eta_pow_four_S_invariant`（目标卡「推论」的 S 半）。
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/DedekindEtaS.lean 文件头 docstring（\"What is actually proved here, and where the content comes from\"）"
    note: |
      **诚实归属：数学内容几乎全部是 Mathlib 的，不是本项目的。** 文件头逐字自述
      「The mathematical content is **entirely Mathlib's**」。实际输入是 Mathlib v4.33.1 的
        `ModularForm.eta_comp_eq_csqrt_I_inv`
        （`Mathlib/NumberTheory/ModularForms/Discriminant.lean`，2026 新增文件，作者 Birkbeck）：
        `upperHalfPlaneSet.EqOn (η ∘ (-1 / ·)) ((Complex.sqrt I)⁻¹ • (Complex.sqrt * η))`，
      即 η(−1/z) = (√i)⁻¹ √z · η(z)，其中 `Complex.sqrt w = w ^ (2⁻¹ : ℂ)`
      （`Mathlib/Analysis/RCLike/Sqrt.lean`，主分支）。Mathlib 那边的证明路线是
      `logDeriv_eta_comp_div_eq` → `logDeriv_eta_comp_eq_logDeriv_csqrt_eta`（用 `E2_slash_action S`）
      → `logDeriv_eqOn_iff` 定出常数 → 在 z = I 处定常数 = (√i)⁻¹。
      ⚠ **本图不为 Mathlib 的这条定理建节点，也不审计它的证明**：证据标准由
      `lake build` + 无 sorry + 公理集合承载（stringformal-2026 条目的规定），
      而 Mathlib 的这条定理在同一次构建里被检查。
      ⇒ 本项目自己加的唯一新数学是 `csqrt_neg_I_mul`（归一化那一步），见 summary。
summary: |
  机器检查的证明，全部在 formal/StringFormal/Math/DedekindEtaS.lean（90 行）内完成，
  数学输入是 Mathlib 的 `ModularForm.eta_comp_eq_csqrt_I_inv`。三步：

  **(1) Mathlib 给出的是另一种归一化。** Mathlib 证的是
     η(−1/z) = (√i)⁻¹ · √z · η(z)（`Complex.sqrt w = w^{1/2}` 主分支），
  而弦论文献（Polchinski (7.2.44b)）与本目标卡写的是 η(−1/τ) = (−iτ)^{1/2} η(τ)。
  两式差在自守因子的写法：(√i)⁻¹√z ↔ (−iz)^{1/2}。

  **(2) 归一化的那一步（本项目唯一的新数学，`csqrt_neg_I_mul`）。** 在 H 上主平方根对 −i 是可乘的：
     √(−i z) = (√i)⁻¹ √z    （0 < Im z）。
  证法：`Complex.log_mul` 要求 arg(−i) + arg z ∈ (−π, π]；由 `Complex.arg_neg_I` 得 arg(−i) = −π/2，
  由 `arg_nonneg_iff`（Im z ≥ 0 ⇒ arg z ≥ 0）与 `arg_le_pi`（arg z ≤ π）得
  −π/2 ≤ arg(−i) + arg z ≤ π/2 ⊂ (−π, π]，故主对数可加：log(−iz) = log(−i) + log z。
  两边除 2 取 exp，并用 `csqrt_neg_I`（√(−i)·√i = exp(−πi/4)·exp(πi/4) = 1 ⇒ √(−i) = (√i)⁻¹）即得。
  ⚠ 注意**不需要** arg z > 0 的严格性：`log_mul` 的下端由 arg z ≥ 0 就够，所以 Im z > 0
  这条假设只在「z ≠ 0」与「arg z ≥ 0」两处被用到。

  **(3) 代入。** `eta_neg_inv` = Mathlib 的 `eta_comp_eq_csqrt_I_inv`（在 `hz : z ∈ ℍₒ` 处取值，
  `simp only` 化掉 `Function.comp`/`Pi.smul_apply` 的包装）+ (2) 的重写
  （`one_div` / `← Complex.sqrt` 把 `(-I*z)^((1:ℂ)/2)` 认成 `Complex.sqrt (-I*z)`）。

  **推论（目标卡 statement 的第二段）**：`csqrt_sq`（主平方根平方回原值，对 w ≠ 0）给
  ‖√(−iz)‖² = ‖−iz‖ = ‖z‖，于是 `norm_eta_neg_inv_sq`：|η(−1/τ)|² = |τ||η(τ)|²，
  平方得 `norm_eta_neg_inv_pow_four`：|η(−1/τ)|⁴ = |τ|²|η(τ)|⁴；再用
  Im(−1/z) = Im z/‖z‖²（`Complex.inv_im` + `normSq_eq_norm_sq`）得
  `im_mul_norm_eta_pow_four_S_invariant`：Im(−1/τ)·|η(−1/τ)|⁴ = Im τ·|η(τ)|⁴，
  即 τ₂|η|⁴ 在 **S** 下不变。模群作用形 `eta_modular_S_smul` /
  `im_mul_norm_eta_pow_four_modular_S_smul` 由 `UpperHalfPlane.modular_S_smul` 改写而得。
