        check-axioms --decl StringFormal.DedekindEta.eta_neg_inv --decl ... （本文件 9 个公开声明）

  输出：**9 declarations checked: 9 ok, 0 non-standard, 0 missing; 0 errors**，
  每条的公理集合都只有 `propext Classical.choice Quot.sound`：
  `csqrt_neg_I`、`csqrt_neg_I_mul`、`eta_neg_inv`、`eta_S`、`eta_modular_S_smul`、
  `norm_eta_neg_inv_sq`、`norm_eta_neg_inv_pow_four`、
  `im_mul_norm_eta_pow_four_S_invariant`、`im_mul_norm_eta_pow_four_modular_S_smul`。
  ⚠ **该构建树上的 `DedekindEtaS.lean` 与本分支（= main）的那一份逐字相同**
  （去掉行尾 CR 后 sha256 = e3e8d36dcec9210b02b7de176e80ffdf056328bbc1fe3899f771c0b34d5bb848，两边一致）。
  ⚠ **主仓库工作树 D:\physics\string 的 `formal/.lake` 是 2026-09-11 11:45 的旧构建，
  不含 `DedekindEtaS.olean`**（也不含 `IIBAnomalyUnique.olean`），所以那里跑不了本次检查；
  lead 合并前按根 CLAUDE.md 重跑一次 `lake build` + `check-axioms` 即可覆盖。

  **Q48.3（math-sources.md §48.7）在本推导这一侧已结清**：那条问题问的是「Siegel 原文不声明
  平方根分支、不显式写 Im τ > 0，若 Lean 化这两条要自己补进陈述，补进去就不再是『Siegel 证的那条』」。
  Lean 侧确实两条都显式写着（假设 `0 < z.im`；指数是 ℂ 的 cpow 主分支），
  所以 `eta_neg_inv` 与目标卡 statement 逐字对应，而与 Siegel 原文的字面陈述之间隔着
  §48.2 记的那两处补全——这正是本卡挂**两条独立推导**而不是一条的原因。

  **给 lead 的一条（记账，不是论证）**：目标卡 effective 之所以停在 rigorous，只因为
  math.dedekind-eta-function 这张**定义卡**是 rigorous。它的四条断言（乘积定义、q^{1/24} 分支、
  H 上全纯、无零点）在 Mathlib v4.33.1 里逐条都有（`ModularForm.eta`、
  `multipliableLocallyUniformlyOn_eta`、`differentiableAt_eta_of_mem_upperHalfPlaneSet`、
  `eta_ne_zero`），所以它**本可以**是 formalized。挡住的是本图的两条约定：
  (i) 现有 67 条 `lean_decl` 全部指向 `StringFormal.*`，无指向 Mathlib 的先例；
  (ii) `validate` 要求 `formal.lean_file` 是 `formal/` 下真实存在的文件。
  两条出路（都不在本次派工范围内，curator 不擅自做）：让 formalizer 在
  `StringFormal/Math/` 里加一层薄薄的重述（定义别名 + 三条性质的重新导出），
  或由 lead 裁定允许 `lean_decl` 指向 Mathlib 并放宽 `lean_file`。
