summary: |
  **纯自然数算术证明，不依赖任何图上其它节点**（`depends_on` 为空数组是刻意的，不是遗漏——
  本卡 statement 的【明确不断言】(d) 已声明这是 Pascal 递推的直接实例，证明不需要任何
  外部引理）。

  **第 1 步**：把 D 写成 D = m + 2（hD : 2 ≤ D 保证 m := D − 2 : N 良定义）。

  **第 2 步**：Pascal 恒等式 `Nat.choose_succ_succ (m+1) 1 : C(m+2,2) = C(m+1,1) + C(m+1,2)`
  （Mathlib 内置），代入 `Nat.choose_one_right : C(m+1,1) = m+1` 化简右端第一项。

  **第 3 步**：用 D = m+2 把 D−1 = m+1、D−2 = m 代回目标等式两边，`omega` 收尾整理三个
  自然数减法与加法。

  证明体（逐字）：
  ```
  obtain ⟨m, rfl⟩ : ∃ m, D = m + 2 := ⟨D - 2, by omega⟩
  have hpascal : Nat.choose (m + 2) 2 = Nat.choose (m + 1) 1 + Nat.choose (m + 1) 2 :=
    Nat.choose_succ_succ (m + 1) 1
  rw [Nat.choose_one_right] at hpascal
  have h1 : m + 2 - 1 = m + 1 := by omega
  have h2 : m + 2 - 2 = m := by omega
  rw [h1, h2, hpascal]
  omega
  ```

  **结论**：目标卡的核心断言（差恒等式）与本推导 lean_decl 逐字一致，且证明**不引用任何
  弦论对象或本图其它节点**，故 `depends_on` 为空，目标卡 effective = formalized
  （own status 即为 formalized，无依赖可压低）。
