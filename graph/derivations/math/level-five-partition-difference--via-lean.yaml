  - "curator/lead 未自行运行 lake build 与 check-axioms；结论基于直接读源码，合并前应由 lead 验证。"
  - "本恒等式是 N=5 特例；N ≥ 6 的对应恒等式与 κ_N 的一般行为需要 Euler 五边形数生成函数论证，本推导不涉及、不预示（目标卡明确不断言 (b)）。"
