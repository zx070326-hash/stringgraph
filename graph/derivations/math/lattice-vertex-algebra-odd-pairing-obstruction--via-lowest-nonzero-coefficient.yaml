summary: |
  **设定沿用 statement 卡（= proof.md 设定 6.6 + 定义 6.7）。** 固定 γ, δ ∈ L，反设存在满足
  (6.3) 的一对 (Ψ, {A^{(γ)}_K})。

  **第一步：等变同构的一般形状（沿用 proof.md §2.2–§2.3 的论证，指标集从 Z 推广到 L）。**
  proof.md §2.2 的引理 2.1–2.3、§2.3 的引理 2.5 是在物理专用设定（层指标 j ∈ Z，塔
  T(p;k_0) = ⊕_{j∈Z}F(p+jk_0)）下证明的：任何满足 (Φ1)(Φ3) 的分层等变同构 Ψ 必形如
  Ψ(e^λ⊗w) = c_λ·Φ_0(w)，某族标量 c ∈ (ℂ^×)^{层指标集}、某个与层无关的线性同构 Φ_0 : U → (单层)。
  **逐条核实这组引理的证明确实与层指标集的代数结构无关**（本推导独立核实，不只是转录 proof.md
  的断言）：引理 2.1（真空唯一性）与引理 2.2（生成性）只涉及单个 Fock 空间 F 或 U 本身，
  完全不提层指标；引理 2.3（Φ_0 的存在唯一性）的构造与归纳只用到 PBW 次数，同样与层指标无关；
  引理 2.5 的证明逐层进行——对每个固定层指标 j，用引理 2.1 把 Ψ_j(1) 钉成 c_j·1——这个论证对
  "j 取值于 Z" 或 "λ 取值于任意偶格 L" 没有任何区别（既不用 Z 的后继结构，也不用 Z 的良序或
  生成元有限性，纯粹逐层独立）。**故该结论对本命题的层指标集 L 逐字成立**：存在
  c ∈ (ℂ^×)^L 使 Ψ(e^λ⊗w) = c_λ·Φ_0(w) 对一切 λ∈L、w∈U。

  **第二步：VOA 侧最低非零系数（内联重写 proof.md 第 1091–1093 行三行，不外部引用 §5.1）。**
  由 (3.14) 取 v = 1（V_(𝔥,L) 的真空）：
  ```
  Y_W(e^γ⊗1,x)(e^δ⊗1_U) = ε(γ,δ) e^{γ+δ} ⊗ x^{⟨γ,δ⟩} E^-(−γ,x) Y_U(Δ̄(δ,x)1, x) Δ̄(γ,−x) 1_U .
  ```
  逐因子处理三项：
  - `Δ̄(δ,x)·1 = 1`：按定义 Δ̄(δ,x) = (−x)^{δ(0)} E^+(−δ,−x)。**两条独立的 L1 事实**：
    (a) Li–Wang (3.10)/(3.12) 段后逐字 "and α(0) = 0 on M(1)"——把 α 代成 δ，即 δ(0) 在
    顶点代数自身 M(1) 上作用为零，故 (−x)^{δ(0)} = (−x)^0 = 1；
    (b) E^+(−δ,−x) = exp(Σ_{n≥1} ((−δ)(n)/n)(−x)^{−n}) 只含湮灭模 (−δ)(n)（n≥1），
    这直接从 (3.2) 的定义式读出（求和号里只出现正标号 n≥1 的模）；湮灭模按 Heisenberg 代数的
    定义湮灭 M(1) 的真空 1（这正是"真空"在 Heisenberg 模里的定义：h(n)·1 = 0 对 n≥1），
    故指数里的求和逐项作用为 0，e^0 = 1，即 E^+(−δ,−x)·1 = 1。
    合起来 (−x)^0 · 1 = 1，即 Δ̄(δ,x)·1 = 1。
  - `Y_U(1,x) = id_U`：模的真空公理，见 gaps 的 `[GAP-vac]`。
  - `Δ̄(γ,−x)·1_U = x^{γ(0)}E^+(−γ,x)·1_U = x^{ν_γ}·1_U`：把 Δ̄(γ,y)=(−y)^{γ(0)}E^+(−γ,−y)
    在 y=−x 处求值给 (−(−x))^{γ(0)}=x^{γ(0)}、E^+(−γ,−(−x))=E^+(−γ,x)；γ(0) 在 U=M(1,p̃)
    上作用为标量 ⟨γ,p̃⟩=ν_γ（Condition C_L 保证 ν_γ∈Z）；E^+(−γ,x) 只含湮灭模，湮灭 U 的真空 1_U
    （同上一条的论证，换成 U 上的真空），故 E^+(−γ,x)·1_U = 1_U。
  代入得
  ```
  Y_W(e^γ⊗1,x)(e^δ⊗1_U) = ε(γ,δ) e^{γ+δ} ⊗ x^{⟨γ,δ⟩+ν_γ} E^-(−γ,x) 1_U .
  ```
  `E^-(−γ,x)` 只含 x 的非负幂且常数项为 1（同理从 (3.2) 读出：E^- 的指数只含正标号求和、
  在 x=0 处退化为 1），故右端的最低非零 x-幂是 x^{K_*}，K_* := ⟨γ,δ⟩+ν_γ，其系数为
  ε(γ,δ)·e^{γ+δ}⊗1_U ≠ 0（ε 取值于 ℂ^×）；一切 K < K_* 的系数为 0。

  **第三步：经 Ψ 搬到 T 上，两侧最低非零指标必须相同（显式反证，不留作省略的断言）。**
  由第一步，Ψ(e^δ⊗1_U) = c_δ|0;δ⟩、Ψ(e^{γ+δ}⊗1_U) = c_{γ+δ}|0;γ+δ⟩（c_δ, c_{γ+δ} ∈ ℂ^×）。
  于是在 c_δ|0;δ⟩ 上，
  ```
  Ψ([x^K]Y_W(e^γ⊗1,x))Ψ^{-1}(c_δ|0;δ⟩) = 0                        (K < K_*),
                                        = ε(γ,δ)c_{γ+δ}|0;γ+δ⟩     (K = K_*).
  ```
  另一侧由 (6.3) 与定义 6.7（无 cocycle 归一化），同一算子族在 c_δ|0;δ⟩ 上对一切 K < K_γ(δ)
  为 0，在 K = K_γ(δ) 处取值 c_δ|0;γ+δ⟩ ≠ 0。**下面证明 K_* = K_γ(δ) 是被逼出来的，不是
  隐藏假设**（proof.md 第 1109 行原文只写结论，这里补上重算审查要求的显式反证）：
  - 若 K_* < K_γ(δ)：在 K = K_* 处，左端（= VOA 侧经 Ψ 搬运的结果）给出
    ε(γ,δ)c_{γ+δ}|0;γ+δ⟩ ≠ 0（ε(γ,δ)∈ℂ^×、c_{γ+δ}∈ℂ^×、|0;γ+δ⟩≠0），
    但右端（= 物理侧定义 6.7 的族）在 K_* < K_γ(δ) 处按定义为 0。矛盾。
  - 若 K_* > K_γ(δ)：在 K = K_γ(δ) 处，左端按第二步的结论为 0（因 K_γ(δ) < K_*），
    但右端按定义 6.7 给出 c_δ|0;γ+δ⟩ ≠ 0。矛盾。
  故只能 K_* = K_γ(δ)，从而两个"最低非零指标处的取值"可以合法比较，给出
  ```
  K_*(γ,δ) = K_γ(δ)   且   ε(γ,δ) c_{γ+δ} = c_δ .                     (6.4)
  ```
  （c_δ ≠ 0，故 (6.4) 第二式两端非零，除法在下一步合法。）

  **第四步：(6.4) 强迫 c 为常值。** 在 (6.4) 第二式取 δ = 0：由 (3.6) ε(γ,0) = 1，
  得 c_γ = c_0 对一切 γ ∈ L。

  **第五步：c 常值强迫 ε ≡ 1，与 (3.8) 矛盾。** 代回 (6.4) 第二式：
  ε(γ,δ) = c_δ/c_{γ+δ} = c_0/c_0 = 1 对一切 γ,δ ∈ L（第一、二步固定的是任意但确定的一对，
  故此处得到的是对一切 γ,δ 的全称结论，可以合法代入定理假设里**存在**的那对 γ*,δ*）。
  但 (3.8) 要求 ε(γ,δ)ε(δ,γ)^{-1} = (−1)^{⟨γ,δ⟩}；代入 ε≡1 得 1 = (−1)^{⟨γ,δ⟩} 对一切
  γ,δ∈L，特别对 γ=γ*, δ=δ* 给出 1 = (−1)^{⟨γ*,δ*⟩}，即 ⟨γ*,δ*⟩ 为偶。这与假设「⟨γ*,δ*⟩
  为奇」矛盾。故不存在满足 (6.3) 的 (Ψ, {A^{(γ)}_K}) 对。∎

  **锐利性（注 6.10）。** 上述论证只用到「存在一对 γ*,δ* 使 ⟨γ*,δ*⟩ 为奇」，未用到 L 的秩：
  秩 1 偶格上 ⟨mk,nk⟩ = mn⟨k,k⟩ ∈ 2Z 恒偶，定理对秩 1 恒真但空洞；秩 ≥ 2 上奇配对可有可无。
  故触发本定理的条件是「⟨·,·⟩|_L 是否处处取偶值」，不是「秩 1 vs 秩 ≥ 2」。
gaps:
  - "[GAP-vac]（对应第二步『Y_U(1,x)=id_U』）：这是模的真空公理，属于「W 是 V_(𝔥,L)-模」这一结构的标准定义组成部分（类比顶点代数自身的真空公理 Y(1,x)=id_V），不是一条被独立证明的定理。本图的 math.vertex-algebra-borcherds-identity 目前只逐字承载顶点代数**自身**的真空公理（其陈述文本只列 regularity + Borcherds/Jacobi 恒等式的 (A)(B)(C) 三种写法，未把 G-N 定义表里的真空公理 (2.24) 写成陈述内容），没有逐字承载**模**版本的真空公理 Y_W(1,x)=id_W。本推导按标准定义直接使用它，暴露路径是第二步对 Y_U(1,x)=id_U 的直接引用（对应 proof.md 第 1092 行的裸用，**不是**经由『引理 5.1 第 3 项』——第 3 项只用 δ(0)=0 on M(1)，不碰真空公理；[GAP-vac] 对应的是引理 5.1 第 4 项。这一归因订正见 docs/reviews/theorem-6-8-recomputation-audit-2026-09-19.md §4）。这是记账缺口，不是数学缺口：若 curator 后续要补一张『顶点代数模的真空公理』定义卡（或在 math.vertex-algebra-borcherds-identity 的 notes 里逐字登记模版本），此缺口即可闭合，不影响本推导的正确性。"
  - "『W = V_(𝔥,L)(U) 对一般偶格 L 是 V_(𝔥,L)-模，Y_W 由 (3.14) 给出』（Li–Wang Theorem 3.6 后半 + Definition 3.5 Condition C_L）在本图现状下没有独立节点承载：math.lattice-vertex-algebra 明确声明自己不承载『不可约模的构造与分类』（该卡『本命题不断言』第 5 条），而唯一承载模构造的节点 worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower 只覆盖秩 1 类光特例（L = Zk_0），不覆盖本推导需要的一般偶格 L。本推导把这一事实写进 target 卡的**设定**而非结论（第一、二步都在『W 是模』这一前提下工作），直接引用 li-wang-2008 Theorem 3.6 全文（含后半）与 Definition 3.5，不经由任何 depends_on 边——这样做是为了不over-claim math.lattice-vertex-algebra 或 free-boson-vertex-algebra-with-lightlike-momentum-tower 覆盖了它们明确未覆盖的内容。建议：若后续需要更高频引用这条一般-L 模构造，值得补一张独立卡（见本推导作者最终报告）。"
  - "第一步『引理 2.1–2.5 的证明逐字适用于任何层指标集』这一泛化，是本卡作者（curator）在 proof.md 断言的基础上独立重读四条引理的证明后确认的（见 summary 第一步的逐条核实），但这条泛化本身不是一条被单独审查过的『定理』——recomputation audit（2026-09-19）的覆盖率表把它列为第 7 条，评级 B（『结构性论证，无可算的公式内容，故未被本轮重算覆盖』），即审查者认可其结构但未把它当算术步骤逐位核对（因为它确实没有算术内容可核）。"
