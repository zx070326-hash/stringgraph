summary: |
  标准教材论证的骨架（curator 复述，来源内容未核实）：

  (1) 𝔥 是环面子代数 ⇒ ad 𝔥 由两两交换的可对角化算子组成 ⇒ 可同时对角化，
      𝔤 = ⨁_{λ ∈ 𝔥*} 𝔤_λ，𝔤_λ := {X : [H, X] = λ(H) X ∀ H}。取 Φ := {λ ≠ 0 : 𝔤_λ ≠ 0}。
  (2) 𝔥 极大环面 ⇒ 𝔤₀ = C_𝔤(𝔥) = 𝔥（教材里用 Killing 型非退化与 Jordan 分解证 C_𝔤(𝔥) 是交换的、
      由半单元素组成、故等于 𝔥）。
  (3) 对每个 α ∈ Φ，𝔤_α ⊕ 𝔤_{−α} ⊕ [𝔤_α, 𝔤_{−α}] 含一个 𝔰𝔩₂ 三元组；用 𝔰𝔩₂ 的有限维表示论
      （权 0 与权 2 只能各出现一次）得 dim 𝔤_α = 1 且 2α ∉ Φ。这给出目标卡 (1)。
  (4) (2) 是 (1) 的直接读数：ad 的权 = {α ∈ Φ}（各一维）∪ {0}（𝔥 那一块，维数 = rank）；
      维数相加得 dim 𝔤 = |Φ| + rank 𝔤。
  (5) (3) 是线性代数：ad H 在 (1) 的基下是对角阵 diag(α(H) (α ∈ Φ), 0, …, 0)，
      (ad H)^k 的迹 = 特征值 k 次幂之和 = Σ_α α(H)^k + rank·0^k，k ≥ 1 时末项为零。
  (6) E₈ 实例：|Φ(E₈)| = 240（math.e8-root-system）与 rank 8 代入。

  没有任何非严格的步骤；status 之所以是 physical-argument，**只因来源内容在本项目 L0**。
