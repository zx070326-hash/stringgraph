summary: |
  标准教材论证（各步与 kirillov-2008 preliminary version 的带编号定理逐条对应，见 sources）：

  (1) 𝔥 是环面子代数 ⇒ ad 𝔥 由两两交换的可对角化算子组成 ⇒ 可同时对角化，
      𝔤 = ⨁_{λ ∈ 𝔥*} 𝔤_λ，𝔤_λ := {X : [H, X] = λ(H) X ∀ H}。取 Φ := {λ ≠ 0 : 𝔤_λ ≠ 0}。
      （= Theorem 7.7(1)；连同 (2) 给出 Theorem 7.16(1) 的 (7.1)(7.2)。）
  (2) 𝔥 极大环面 ⇒ 𝔤₀ = C_𝔤(𝔥) = 𝔥（教材里用 Killing 型非退化与 Jordan 分解证 C_𝔤(𝔥) 是交换的、
      由半单元素组成、故等于 𝔥）。（= Definition 7.8 + Theorem 7.11；Humphreys §8.2 p.36 的 Proposition。）
  (3) 对每个 α ∈ Φ，𝔤_α ⊕ 𝔤_{−α} ⊕ [𝔤_α, 𝔤_{−α}] 含一个 𝔰𝔩₂ 三元组；用 𝔰𝔩₂ 的有限维表示论
      （权 0 与权 2 只能各出现一次）得 dim 𝔤_α = 1 且 2α ∉ Φ。这给出目标卡 (1)。
      （= Lemma 7.19/7.20 + Theorem 7.21(2)(5)；后半另见 Humphreys Proposition 8.4(b) p.39。）
  (4) (2) 是 (1) 的直接读数：ad 的权 = {α ∈ Φ}（各一维）∪ {0}（𝔥 那一块，维数 = rank）；
      维数相加得 dim 𝔤 = |Φ| + rank 𝔤。（rank = dim 𝔥 见 Corollary 7.14，限制见 gaps 第 2 条。）
  (5) (3) 是线性代数：ad H 在 (1) 的基下是对角阵 diag(α(H) (α ∈ Φ), 0, …, 0)，
      (ad H)^k 的迹 = 特征值 k 次幂之和 = Σ_α α(H)^k + rank·0^k，k ≥ 1 时末项为零。
      **这一步两条来源都没有写**——不是缺口，是它在 (1) 给出对角化之后只是「对角算子取迹」一步初等
      线性代数（抽取记录 §57.4）。
  (6) E₈ 实例：|Φ(E₈)| = 240（math.e8-root-system，已挂 depends_on）与 rank 8 代入。

  没有任何非严格的步骤。2026-09-11 立卡时 status 是 physical-argument，**理由只是来源在本项目 L0**；
  该理由已于 2026-09-13 消失（两条独立来源，见 sources），故升为 proof / rigorous。
gaps:
  - |
    **Humphreys 侧「dim L_α = 1」的部分字母未核实**。§8.4 的 Proposition 8.4 里，(b)(c)(d)(e)(f)
    都已逐字确认，但 `dim L_α = 1` 的字面文本与它的部分字母本轮四次查询全部 0 命中（抽取记录 §57.3.3）。
    **这不影响本推导的状态**——该句由 kirillov-2008 Theorem 7.21(2) 独立承担（L1 页图，带证明）——
    只是「两条来源都覆盖 (3) 全部」这句话现在只对 2α ∉ Φ 那半成立。
  - |
    **rank 良定义这一点在主来源里是无证明引用**。kirillov-2008 的 Corollary 7.14
    （rank 𝔤 = dim 𝔥）倚赖 Theorem 7.13（任两个 Cartan 子代数共轭），而原书对 7.13 逐字写
    「we quote without proof … proof of which can be found in [21], [11]」。
    目标卡 (3) 的迹公式**不需要**它（只需固定一个 𝔥）；(2) 里写「重数 = rank 𝔤」时用到。
    要把这一点也做实，需另找 Cartan 子代数共轭定理的带编号来源。
  - |
    **E₈ 实例的根系识别仍无节点**：depends_on 的那条边只搬运 math.e8-root-system 的 240 个向量，
    而「𝔢₈ 相对 𝔥 的根集合是 E₈ 型根系、故与该显式列表同构」这一识别（需要 Dynkin 分类 + 同型根系
    唯一性）本图无卡，math.e8-root-system 自己也明写不断言 (b)。
    与 math.e8-adjoint-trace-identities--via-root-power-sums 的 gaps 第 2 条是同一条缺口，
    两处措辞保持一致。
  - |
    **未形式化**。Mathlib 侧是否已有根空间分解（§52.4 点出的
    `Mathlib/Algebra/Lie/Weights/Cartan.lean :: cartan_sup_iSup_rootSpace_eq_top`）本轮未查
    （抽取记录 §57.7 的 Q57.4）。即使有，`dim 𝔤_α = 1` 需要 𝔰𝔩₂ 表示论，大概率不在，
    故本卡预计停在 rigorous。
