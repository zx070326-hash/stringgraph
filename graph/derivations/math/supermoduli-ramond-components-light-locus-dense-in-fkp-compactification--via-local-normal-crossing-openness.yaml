summary: |
  证明路线（proof.md §5 引理5.1）：
  1. 取任一边界点 [X_0]∈S̄_{g;n,2r}，设其有 k 个节点（k=0 时平凡）。
  2. 由 FKP Prop 7.8(ii)，存在 [X_0] 的平展邻域 u:B→S̄ 与光滑态射 t=(t_1,...,t_k):B→𝔸^k，
     使边界轨迹的拉回恰为 {t_1⋯t_k=0}。
  3. 光滑态射平坦、有限表示 ⇒ 开映射；故 B 中任一开集 U 的像 t(U) 是含 0 的开集，
     必含全部坐标非零的点，即 U 与"光滑轨迹"相交。
  4. u 本身平展 ⇒ 开；复合两步开映射性质 ⇒ [X_0] 的任意开邻域都与光滑轨迹相交。
  5. [X_0] 任意 ⇒ 光滑轨迹在 S̄ 中稠密。
  6. 步骤1-5 中 Prop 7.8(ii) 原文陈述的对象是超叠 𝔖̄，故直接得到的是稠密性陈述对
     𝔖⊂𝔖̄ 成立；超叠与其玻色截断底层拓扑空间相同（奇向幂零元不改变拓扑），
     再用 (X6)（论文引理 5.1：(𝔖̄_{g;n,2r})_bos ≅ S̄_{g;n,2r} 的具体同构，而不只是
     "拓扑不变于幂零元"这条通用弱事实）把该陈述转移到玻色截断层面 S⊂S̄。
gaps:
  - |
    本引理只给出"稠密"这一拓扑性质，不给出 S̄ 纯维数或不可约性——proof.md §5 附注明确指出
    另一条可能的替代论证（用维数计数 dim ∂M̄=3g-4+m）需要额外的纯维数前提，本引理未走那条路。
  - |
    [GAP-REP]（低）：本引理隐含使用"光滑态射是平坦、开映射"、"平展态射是开映射"两条标准
    代数几何事实，未独立定位教科书出处。
  - |
    proof.md §9.1 承重清单第 3 条自评：本引理把 FKP Prop 7.8 的"超叠上的平展邻域"论证
    用在了底层拓扑空间上，reviewer 认为该步骤成立（t_i 是偶函数，故下降到玻色截断），
    但列为"自认为最脆弱三处"之一，供后续复核参考。
