summary: |
  **W–W 给的是一条完整的、自足的证明**（这正是本推导可以标 rigorous 的理由），骨架逐字如下：

  **第 1 步（§21.3，构造并比较零点）**。令
    f(z_W) = ∏_{n≥1}(1 − q_W^{2n−1}e^{2iz_W}) ∏_{n≥1}(1 − q_W^{2n−1}e^{−2iz_W}) 。
  W–W 逐字：「each of the two products converges absolutely and uniformly in any bounded domain of
  values of z, **by § 3·341**, on account of the absolute convergence of Σ q^{2n−1}; hence f(z) is
  analytic throughout the finite part of the z-plane, and so it is an integral function.」
  接着验证 f 与 ϑ₄ **零点相同**、**准周期因子相同**（后者引 §21.11 example 3）。

  **第 2 步（§21.3，Liouville 型定理）**。于是 ϑ₄(z_W)/f(z_W) 是无零点无极点的双周期函数，
  由 **§20.12** 它是常数 G：
    **ϑ₄(z_W) = G ∏_{n≥1}(1 − 2q_W^{2n−1} cos 2z_W + q_W^{4n−2})** 。
  由 z_W → z_W + ½π 得同节的
    **ϑ₃(z_W) = G ∏_{n≥1}(1 + 2q_W^{2n−1} cos 2z_W + q_W^{4n−2})** 。

  **第 3 步（§21.42，定出 G）**。W–W 逐字：「G is an analytic function of q … and from the product for
  ϑ₃(z), we see that G → 1 as q → 0. Hence the plus sign must always be taken; and so we have
  established the result **G = ∏_{n=1}^{∞}(1 − q^{2n})**.」
  ⚠ 该节的论证用到 §21.41（ϑ₁′(0) = ϑ₂ϑ₃ϑ₄），W–W 对后者的脚注逐字：
  「Several proofs of this important proposition have been given, **but none are simple.**」
  ——**证明链比表面上长**，但每一环都在 W–W 书内、都有出处（见 gaps 第二条）。

  **第 4 步（本推导做的唯一一件事：换记号）**。把第 2、3 步的 ϑ₃ 式按 convention_map 翻译：
    · 1 + 2q_W^{2n−1}cos 2z_W + q_W^{4n−2} = (1 + q_W^{2n−1}e^{2iz_W})(1 + q_W^{2n−1}e^{−2iz_W})
      = (1 + q^{n−1/2} z_本图)(1 + q^{n−1/2} z_本图^{−1})  ［用 q_W^{2n−1} = q^{n−1/2}、e^{2iz_W} = z_本图］；
    · G = ∏_{n≥1}(1 − q_W^{2n}) = ∏_{n≥1}(1 − q^n) ；
    · 左端 ϑ₃(z_W) = 1 + 2Σ_{n≥1} q_W^{n²} cos 2n z_W = Σ_{n∈Z} q_W^{n²} e^{2inz_W}
      = Σ_{n∈Z} exp(πin²τ + 2πinv) = **目标卡左端**（= math.jacobi-theta-functions 的 ϑ₀₀）。
  合起来**逐字**就是目标卡的断言：
    Σ_{n∈Z} exp(πin²τ + 2πinv) = ∏_{m≥1}(1−q^m)(1+z q^{m−1/2})(1+z^{−1}q^{m−1/2}) 。✓
  **收敛性**（目标卡断言的第二段）由第 1 步 W–W 引的 §3.341 与 G 的乘积同时给出。

  **为什么是 rigorous（按 docs/STATUS_LEVELS.md 第 4 级主判据）**
  「有发表的、数学界接受的完整证明；来源必须是数学文献或数学物理文献」——
  W–W 是数学文献，§21.3+§21.42 给的是完整证明（Liouville 型定理 + 解析延拓定常数），
  本推导只在第 4 步做了一次**有限步的记号翻译**。
  ⚠ **不得标 formalized**：Mathlib 是否有三重乘积**本项目未核实**（math-sources.md **Q56.2** 明列为未查）。
gaps:
