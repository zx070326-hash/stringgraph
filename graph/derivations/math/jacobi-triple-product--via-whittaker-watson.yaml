     convention_map 的 **z_W = πv** 与 **q = q_W²**（即 q_W^{2n−1} = q^{m−1/2}）
     由两书各自的定义式对照得出（W–W 的准周期是 π, πτ 且 q_W = e^{πiτ}；Polchinski 的是 1, τ 且 q = e^{2πiτ}），
     **W–W 不写 Polchinski 的约定，Polchinski 也不引 W–W**。
     出处是 researcher 的对照表 math-sources.md §56.2(e)，其中逐字警告：
     『**q 的定义差一次方这件事，在零宗量恒等式里不影响等式成立**（两边同一个 q），
       但**在抄乘积公式时会咬人**（W–W 的 q^{2n−1} ↔ Polchinski 的 q^{m−1/2}）。』
     ⚠ 本推导的第 4 步**正是「抄乘积公式」的那一步**，即恰好落在该警告指的地方。
     ⇒ 这一步是两行可手验的代换，但**未经 reviewer 独立复核**；若要把本推导的翻译步也做成
