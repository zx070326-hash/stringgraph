depends_on:
  - id: math.jacobi-theta-functions
    note: |
      供给**恒等式左端的那个对象**（ϑ₀₀ 的级数）与 q、z、q^s ≡ exp(2πisτ) 的分支约定。
      **非 inferred**：W–W §21.3 的证明对象 ϑ₄(z)/ϑ₃(z) 正是本卡定义的 ϑ₀₁/ϑ₀₀
      （对照由 Polchinski (7.2.37a–d) 逐字给出：ϑ₀₀ = ϑ₃、ϑ₀₁ = ϑ₄），
      而 W–W 的级数定义 ϑ₃(z) = 1 + 2Σ_{n≥1} q_W^{n²} cos 2nz 在下面的 convention_map 下
      **逐项等于**该定义卡的 ϑ₀₀(v,τ)。
      ⚠ 该定义卡自身 status = rigorous 且无依赖，故不压低本推导。
    convention_map: |
      **Whittaker–Watson（1920 第三版）↔ Polchinski / 本图的字典（引 W–W 时必须带，否则式子对不上）**：
        · **宗量**：W–W 用 z，准周期 π、πτ；本图用 v，准周期 1、τ ⇒ **z = πv**（故 e^{2iz} = e^{2πiv} = 本图的 z 变量）。
          ⚠ **同一个字母 z 在两套记号里含义不同**：W–W 的 z 是宗量，本图的 z = exp(2πiv)。下文一律写 z_W / z_本图。
        · **展开参数**：W–W 的 **q_W = exp(πiτ)**；本图的 **q = exp(2πiτ)** ⇒ **q = q_W²**，
          即 **q_W^{2n} = q^n、q_W^{2n−1} = q^{n−1/2}**。这一条是最容易咬人的一处。
        · **四个函数**：W–W 的 ϑ₁, ϑ₂, ϑ₃, ϑ₄ ↔ 本图的 −ϑ₁₁, ϑ₁₀, ϑ₀₀, ϑ₀₁
          （对照式是 Polchinski (7.2.37a–d)，L1 逐字）。
        · **零宗量省略**：W–W 写 ϑ₂, ϑ₃, ϑ₄（不带宗量）表示 ϑ₂(0), ϑ₃(0), ϑ₄(0)（W–W 书 p.464 逐字）。
      **字典来源**：literature/extractions/math-sources.md **§56.2(e)** 的对照表（researcher，2026-09-11，L1 页图）。
