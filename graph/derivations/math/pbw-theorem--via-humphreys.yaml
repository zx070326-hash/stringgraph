summary: |
  Humphreys §17.3–§17.4 的标准论证，与任何代数教科书一致：

  (1) **构造与滤过**。U(L) = T(L)/I，其中 T(L) 是张量代数、I 是由 x⊗y − y⊗x − [x,y] 生成的双边理想。
      张量长度给出 T(L) 的分次，取像即得 U(L) 的滤过 F_m U(L)，并有典范满同态
      S(L) = T(L)/(x⊗y − y⊗x) ⟶ gr U(L)（因为 [x,y] 的长度比 x⊗y 低一阶，在 gr 中被压掉）。

  (2) **定理（难的一半）**：上述满同态是**单**的，即 S(L) ≅ gr U(L)。
      证明方法是在 S(L) 上构造 L 的一个作用（把 T(L) 的作用逐层定义并验证 I 的生成元作用为零），
      得到 U(L)-模结构，由此把 gr U(L) 的一个潜在的额外关系拉回到 S(L) 中的零关系。
      这一步就是 PBW 的实质内容，是目标节点的 (2)。

  (3) **推论（有序单项式基）**：取 X 的全序，S(L) 有单项式基 {x_1^{a_1}…（按序）}；
      由 (2) 逐层提升到 U(L)，得到目标节点 (1) 的有序单项式基。
      取 n = 1 一层即得 ι 单射，是目标节点的 (3)。

  论证是纯代数的、有限步的，不涉及任何拓扑、收敛或选取超出「全序基存在」的东西
  （对无限维 L，全序基的存在性来自基的存在性 + 良序定理；本图的用例 Vir_- 有现成的可数全序基
  {L_{-1} < L_{-2} < …}，不需要选择公理）。
gaps:
  - "**印本未取得**。Humphreys GTM 9 的正文本项目没有拿到（Springer 书页 303 重定向到登录墙）。
     §17.3 的**位置**（p.91 起）与**编号**（Corollary C, p.92）靠两条独立证据互证
     （ardizzoni-2010 的逐字引用 + Google Books 检索，控制实验通过）；§17.3 的**内容**靠
     swanson-2015-pbw 的 L1 转述。因此本推导对来源的核实等级是 L3/L4，不是 L1。
     这不影响 status（PBW 是被数学界完全接受的教科书定理，不存在「证明是否成立」的疑问），
     只影响**可核对性**：回译审计时无法逐字比对原页。"
  - "**编号字母未裁决（Q14）**：ardizzoni-2010 说是 Corollary C，而 swanson-2015-pbw 的呈现顺序
     暗示它排在第 4 条。本图按硬性禁令只写 `Corollary C, p. 92`，不写其它字母。见目标节点 notes。"
  - "**§17.1 对 L 的假设未核实（Q15）**：Humphreys 全书语境是有限维半单李代数。本推导按
     ardizzoni-2010 与 swanson-2015-pbw 的措辞（任意李代数 + 全序基 / possibly infinite dimensional）
     陈述目标节点，这一步**超出了已核实的原书语境**。凡把本节点用到无限维李代数上的下游边
     必须标 `inferred: true`。"
  - "**基环限制**。目标节点按域 F 陈述。PBW 对「L 作为基环 R-模自由」的更一般情形也成立
     （这正是本图 Vir_-（自由 R-模）用得上的形式），但本推导引的来源是域上的版本；
     一般基环版本若日后需要，应新建节点并另找来源，不要偷偷放宽目标节点的假设。"
  - "**未形式化**：Mathlib 没有 PBW（读取日期 2026-09-11，见目标节点 notes 的两条 L1 证据）。
     因此本推导以及一切经过它的路径**上限是 rigorous**。"
notes: |
  **depends_on 为空是有意的**：PBW 的输入只有张量代数/对称代数/泛包络代数的构造，
  本图目前没有把这些基础构造做成节点，也不打算为它们建节点（它们是 Mathlib 已有的东西，
  见 `Mathlib/Algebra/Lie/UniversalEnveloping`）。把它们伪造成依赖只会制造没有内容的边。
  本节点是本图在李代数一侧的一个**叶子公理式输入**，其可信度完全由 sources 承载。

  **status 的选择**：rigorous，不是 formalized。理由见 gaps 最后一条（Mathlib 无 PBW）。
  本推导**不**援引 docs/STATUS_LEVELS.md 的 rigorous 例外条款（那是给「有限步初等计算 +
  reviewer 复核」用的）；它靠的是教科书里已发表的完整证明。
