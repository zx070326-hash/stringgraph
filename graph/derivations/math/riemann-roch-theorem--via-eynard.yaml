summary: |
  本条不重写证明，只记账「这是数学文献里有完整证明的定理，本图把它当作数学输入接进来」。

  Eynard Ch. 4 的证明路线（researcher 读到的结构，p. 72–76）：
  (1) Definition 1.2 (1-5)(1-6) 定义 ℒ(D)、r(D)、Ω(D)、i(D)；
  (2) Theorem 1.1 (1-7)：r(D)、i(D) 只依赖除子的线性等价类 [D]；
  (3) Proposition 5.1（Riemann 不等式，p. 75）：r(−D) ≥ deg D − 𝔤 + 1；
  (4) §5.2（p. 75–76）的 Theorem 5.2/5.3 与 Proposition 5.2/5.3 把不等式补成等式，
      亏损项恰为 i(D)，得 (1-10) r(−D) = deg D + 1 − 𝔤 + i(D)。

  与目标卡（Hartshorne 形式）的字典：r(−D) = l(D)，i(D) = l(K − D)，𝔤 = g，
  于是 (1-10) 就是 l(D) − l(K − D) = deg D + 1 − g。

  `depends_on: []` 是**有意的**：本节点是图的一个数学输入叶子（同
  math.laplace-fundamental-solution-2d），不是「未加论证的断言」——论证在所引来源内部自足。
gaps:
  - |
    **本项目未逐行复核该证明**：researcher 读的是 p. 71–77、84–89（含定理陈述、定义、
    Riemann 不等式与 §5.2 的证明所在页），但没有逐步验算。
    本条的 `rigorous` 档位依据是**来源强度**（数学讲义/教科书里被完整证明的定理，
    符合 docs/STATUS_LEVELS.md 第 4 级「有发表的、数学界接受的完整证明」），
    不是本图自己的复核。
  - |
    **两条次级来源的编号可核对性弱于主来源**：hartshorne-1977 的 `Theorem IV.1.3` 是 L3
    （只读到引用方），farkas-kra-1992 只能定位到 `§III.4`。
    若将来要把本卡的 loc 收紧到单一编号，**只有 eynard-2018-lectures 那条是可复核的**。
  - |
    **不覆盖推广**：不可定向曲面、带边曲面、高维（Hirzebruch–Riemann–Roch）、
    以及 Atiyah–Singer 指标定理形式的 P₁ 版本，都不在本条论证范围内。
    弦论侧真正需要不可定向情形（Klein 瓶、RP₂），那一块本图**完全没有来源**
    （math-sources.md Q34）。
