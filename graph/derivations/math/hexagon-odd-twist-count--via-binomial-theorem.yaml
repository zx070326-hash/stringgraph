  Lean 化（`decide` 或 `Finset` 引理）之后可另加一条 `--via-lean` 的 formalized 推导。
  **请 reviewer 复核**：本推导的两行代数 + n = 6 的显式相加（6 + 20 + 6 = 32）。

  【本推导没有依赖，是有意的】结论是纯二项式恒等式，不需要图内任何节点；
