summary: |
  核心是 Lemma 4.1（分支对偶引理）：对节点曲线 Z_0 的一个分支 C（闭浸入 j: C↪Z_0），
  j^!ω_{Z_0}≅ω_C 且此同构下迹映射即分支的典范含入——这是"两个相反扭转的抵消"
  （j^*ω_{Z_0}=ω_C(p_0) 与 Hom(O_C,O_{Z_0})=O_C(-p_0) 相消），在 k[[x,y]]/(xy) 上直接验证
  Ann(y)=(x)η 得到。Prop. 4.3 把此引理应用于 Z_0=C∪_{p~p'}C'，通过 Hom-伴随把粘接条件
  δ_Z^- 是同构的问题化为两个分支上独立的问题，每个分支上恰是 [FKP-A] (2.5) 本身（对 L 与 L'），
  与穿孔数 R,R' 无关——因为 Ramond 点 r_i,r'_j 与节点 p_0 不交，j^*O_{Z_0}(D)=O_C(Σr_i) 只见到
  自己分支上的 Ramond 点。Cor. 4.4 用 S̄_{g;m,n} 表出所陈述族的泛性质（[FKP-A] Theorem A）把
  构造的族对应到唯一态射，得到 (7.8)/(7.9) 的存在性。
gaps:
