summary: |
  证明分三步：(1) 把 [FKP-A] §2.2 (2.2)-(2.3)（对带 Ramond 穿孔的光滑超曲线成立，逐字 L1 核对）
  改写为 U 上的正合列 0→ω²_{U/S}(R)→Ω_{U/S}→ω_{U/S}(R)→0，用 𝒟≃ω^{-1}_{X/S}(-R) 代入；
  (2) 应用 j_* 并用射影公式（R 与节点不交，故 O_X(R) 是 X 上的线丛且 j^*O_X(R)=O_U(R)）把外项
  转成 ω²_{X/S}(R)、ω_{X/S}(R)；满射性归约到 [FKP-A] Lemma 7.1 证明本身在节点处的局部论证（该
  局部论证不涉及扭转，故对 (7.1-R) 同样成立）；(3) 用 R 与全部节点、全部 NS 穿孔不交，构造典范
  平凡化截面 s_R，证明 (7.1-R) 在 V=X∖R 上等同于印刷版 (7.1)。
