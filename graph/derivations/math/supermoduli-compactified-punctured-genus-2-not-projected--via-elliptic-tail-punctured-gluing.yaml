summary: |
  取 a=0（亏格 h=g=2 的运动分量、有理固定尾）分支：固定尾带 n+1 个 NS 标记点（1 个用于粘接）、
  2r 个 Ramond 标记点，稳定性 (P2) 在 a=0 时退化为 n+2r≥2；沿 NS 粘接映射构造测试态射
  F_{η,ξ}: X_η → \overline{\mathfrak S}_{2;n,2r}；引理 4.4/命题 4.5/推论 4.7 的通用构造对 dim
  W（尾巴的辅助参数空间维数）不敏感，故 a=0 分支与 a=1 分支（g≥3 姐妹卡）共用同一套引理，只是
  取值不同；定理 M 四步组装给出 ω₂≠0。宇称加细：有理固定尾的自旋结构在 FKP-A 的稳定自旋曲线框架下
  唯一（O(-1)），其宇称由 Mumford 意义下的局部常值性确定为偶，故测试曲线只落在
  \overline{\mathfrak S}{}^+_{2;n,0} 分量（命题 4.8）。
