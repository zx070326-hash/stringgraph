id: math.clifford-majorana-weyl-mod-8--via-explicit-gamma-construction
target: math.clifford-majorana-weyl-mod-8
kind: physical-argument
status: physical-argument
depends_on: []
sources:
  - ref: polchinski-1998-v2
    loc: "App. B §B.1, pp.430–434：(B.1.1)（Clifford 代数）→ (B.1.2a,b)(B.1.3a,b)(B.1.4)(B.1.5)（升降算子与 `s` 基，维数 2^{k+1}）→ (B.1.6)(B.1.7a,b)（显式迭代表示）→ (B.1.8)(B.1.9)(B.1.10)（Σ^{μν} 与 S_a）→ (B.1.11)–(B.1.15)（手征矩阵、Weyl 分解、奇维、4 = 2 + 2′、32 = 16 + 16′）→ (B.1.16)–(B.1.19)（B_1、B_2 与共轭性质）→ (B.1.20)(B.1.21)（Majorana 条件与 B*B 的符号）→ p.433 结论句 → Table B.1 p.434"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v2-appB.md#E3–#E9，证据等级 L1（原书页图）。
      原书自称的强度逐字：「It follows that」「one obtains」（构造）；「shows that … it is unique up to a
      change of basis」（唯一性）；「Using the reality and anticommutation properties of the Γ-matrices
      **one finds**」（(B.1.21) 的计算未展开）；「All these results are summarized in the table B.1」。
summary: |
  (1) **构造**：把偶维 `d = 2k+2` 的 `Γ^μ` 重组成 `k+1` 对反对易升降算子 `Γ^{0±} = ½(±Γ^0 + Γ^1)`、
      `Γ^{a±} = ½(Γ^{2a} ± iΓ^{2a+1})`，由 (B.1.3) `{Γ^{a+}, Γ^{b−}} = δ^{ab}`、`(Γ^{a±})² = 0`。
      反复作用 `Γ^{a−}` 得被全部湮灭的 `ζ`，再以 `Γ^{a+}` 每个至多作用一次，得 `2^{k+1}` 维表示，
      基 `ζ^{(s)}`，`s = (s_0, …, s_k)`，`s_a = ±½`（(B.1.5)）。`S_a = Γ^{a+}Γ^{a−} − ½` 的半整数本征值
      表明这是旋量表示（(B.1.10)）。(B.1.6)(B.1.7) 给出该表示的显式 2×2 张量积迭代构造。
  (2) **Weyl 分解**：`Γ = i^{−k}Γ^0…Γ^{d−1}` 满足 `Γ² = 1`、`{Γ, Γ^μ} = 0`、`[Γ, Σ^{μν}] = 0`（(B.1.12)），
      故本征值 ±1 的两个 `2^k` 维子空间各自是洛伦兹代数的表示，原书断言二者不等价。
      奇维 `d = 2k+3` 添 `Γ^d = ±Γ`，因 `Σ^{μd}` 与 `Γ` 反对易而不可约，维数仍 `2^{k+1}`。
  (3) **B 矩阵**：`Γ^{μ*}` 与 `−Γ^{μ*}` 满足同一 Clifford 代数，由（断言的）唯一性必与 `Γ^μ` 相似；
      写成 (B.1.17) 后，满足 `BΣ^{μν}B^{−1} = −Σ^{μν*}` 的只有 `B_1`、`B_2` 两个（(B.1.18)）。
  (4) **Majorana 条件**：`ζ* = Bζ` 取共轭得 `ζ = B*Bζ`，故相容 iff `B*B = 1`；(B.1.21) 的两个符号
      `(−1)^{k(k+1)/2}`、`(−1)^{k(k−1)/2}` 给出 `k` mod 4 的判据。(B.1.19) 给出 Weyl 表示自共轭
      （`k` 偶）还是互共轭（`k` 奇），叠加后得 M–W 只在 `k ≡ 0 (mod 4)`，即 `d ≡ 2 (mod 8)`。
      奇维只有 `B_1` 与 `Γ^d = ±Γ` 的共轭相容。合并偶奇两支得 `d ≡ 0,1,2,3,4 (mod 8)`。
  (5) **min. rep. 列**：实参数数 = 2 × Dirac 维数，可加 Weyl 则 ÷2，可加 Majorana 则 ÷2；
      周期性来自 (B.1.21) 只依赖 `k` mod 4，Dirac 维数则每 8 维乘 16。
  (6) 汇总为 Table B.1。
gaps:
  - "**Γ 矩阵不可约表示的唯一性只有一句断言**：p.432 逐字「The above construction of the irreducible representation of the Γ matrices **shows that** in even dimensions d = 2k+2 it is **unique up to a change of basis**」——没有证明，没有引用。第 (3) 步（B 的存在与只有两个）整个建立在它之上。"
  - "**两个 Weyl 表示「不等价」是断言**：p.432 逐字「form a second, **inequivalent**, Weyl representation」，未给论证。"
  - "**B、C 的基无关性外包给习题**：p.435 逐字「Additional properties of the matrices B and C are developed in **exercise B.1**」，而习题 B.1 要求的正是「show that the properties (B.1.18), (B.1.19), (B.1.21), (B.1.26), and (B.1.28) are independent of such a change of basis」。⇒ Table B.1 的内容是否真的与基无关，原书未证。"
  - "**(B.1.21) 的计算未展开**：原书逐字「Using the reality and anticommutation properties of the Γ-matrices **one finds**」。抽取者按 (B.1.16) 的定义独立复算符号与表的三列一致（抽取记录 §0.3b），但这是自洽性核对，不是原书论证的补全。"
  - "**多类时方向的推广无证明**：p.438 逐字「For more than one timelike dimension, the analog of table B.1 or B.2 depends on the *difference* of the number of spacelike and timelike dimensions.」——本推导不覆盖（与 consistency.eleven-is-maximal-supersymmetric-dimension 的脚注 3 漏洞同源）。"
  - "**无任何文献引用、无编号定理/引理/证明环境**（抽取记录 §3.2 第 7 条）。数学文献（ABS 1964 / Lawson–Michelsohn）本项目尚未取得，故无法据此升级到 rigorous。"
notes: |
  本推导**无 depends_on**：它从 Clifford 代数 (B.1.1) 这一条定义出发，全部是自足的矩阵代数操作，
  图上没有更上游的节点（`conv.clifford-normalization` 尚未建卡，归一化写在陈述正文里）。
  validate 会就此报一条 "derivation has no dependencies" 的 warning，是预期的。
