summary: |
  五步等式链（proof.md §8.1）：(1) Prop. 3.5 把 O(Δ) 在 S̄_{g;m,n} 上写成
  Ber Rπ_*(j_*Ω_U)⊗Ber^{-1}Rπ_*(Ω_X)；(2) 用 Ber Rπ_* 与 base change 的相容性（(S2)）限制到
  X_B=X×_{S̄}B；(3) 用 Prop. 6.2（本证明的核心新计算：把 (7.1-R) 分别限制到 X_B 与 X̃，各自算出
  两行 Berezinian 乘法性等式，用 Cor. 5.2 处理 Q∩R=∅ 与 D_i∩R=∅ 两次典范平凡化，比较两行得到
  Ber Rπ_*(j_*Ω_U|_{X_B})≅Ber Rπ̃_*(Ω_X̃(D1+D2))⊗Ψ1^{-1}Ψ2^{-1}）与 Prop. 6.1(iii)（
  Ber Rπ_*Ω_{X_B/B}≅Ber Rπ̃_*Ω_X̃，K 的四个 Jordan-Hölder 因子的 Berezinian 乘积典范平凡）代入；
  (4) 用 Prop. 7.1（D_1+D_2 的贡献典范平凡，靠 Lemma 8.7 给出的 Ψ_i^{-1}⊗Ψ_i≅O_B 抵消，对旁观
  穿孔与 R 不敏感因为 D_i 与它们不交）消去 Ω_X̃(D1+D2) 项，得到 ι^*O(Δ)≅Ψ1^{-1}⊗Ψ2^{-1}。第一
  个同构 ι^*O(Δ_NS)≅ι^*O(Δ) 是独立的 Prop. 9.1：ι(B) 上每条曲线只有一个节点、且该节点是 NS 型
  （粘接构造使奇部分层在两支上各秩 1），故 Δ_R 与 ι(B) 不交，典范截面给出平凡化。
