depends_on:
  - id: math.dedekind-eta-s-transformation
    inferred: false
    note: |
      提供 S 生成元上的那一步：Lean 里 `DedekindEta.im_mul_norm_eta_pow_four_modular_S_smul`
      （`(S • τ).im * ‖η(S • τ)‖⁴ = τ.im * ‖η(τ)‖⁴`，`StringFormal/Math/DedekindEtaS.lean`，
      即该卡 --via-lean 登记的推论之一）。本推导的 `Subgroup.closure_induction` 的 `mem` 分支
      在 `x = ModularGroup.S` 时**逐字**调用它。字面依赖，非 inferred。
      ⚠ 目标卡用的是**模长的组合** τ₂|η|⁴，不是 η 本身；S 卡的主句 η(−1/τ) = (−iτ)^{1/2}η(τ)
      经由 `norm_eta_neg_inv_pow_four` + Im(−1/τ) = τ₂/|τ|² 才变成这个形状，两步都在 S 卡侧。
  - id: math.dedekind-eta-t-transformation
    inferred: false
    note: |
      提供 T 生成元上的那一步：`DedekindEta.im_mul_norm_eta_pow_four_modular_T_smul`
      （`StringFormal/Math/DedekindEtaT.lean`），同样被 `mem` 分支在 `x = ModularGroup.T` 时逐字调用。
      字面依赖，非 inferred。
  - id: worldsheet.modular-group-generated-by-s-and-t-v2
    inferred: false
    note: |
      提供把两个生成元推到整群的那一步：Lean 里用的是
      `ModularGroupGen.sl_closure_S_T : Subgroup.closure {ModularGroup.S, ModularGroup.T} = ⊤`
      （`StringFormal/Math/ModularGroupGenerators.lean`，该卡 --via-lean 的 sources 已登记；
      它本身是 Mathlib `SpecialLinearGroup.SL2Z_generators` 的再导出）。
      本推导第一步就是 `rw [ModularGroupGen.sl_closure_S_T]; exact Subgroup.mem_top g`
      把「任意 g」变成「g ∈ closure {S,T}」，然后对该成员关系归纳。字面依赖，非 inferred。
      ⚠ **用的是 SL 版而不是 PSL 版**：该卡正文的主句说的是 PSL(2,Z) 由 S、T 生成
      （正文另有一句「等价地在 SL(2,Z) 层：⟨S, T⟩ = SL(2,Z)」，且该卡 sources 把
      `sl_closure_S_T` 逐条登记），Lean 这边用的是 `sl_closure_S_T`（SL 层）。
      本推导实际调用的是 SL 版；目标卡的量词也写在 SL(2,Z) 上，两边一致。
      ⚠⚠ **「等价」不是自动的**（reviewer-batch21, PLAUSIBLE 2）：SL ⇒ PSL 方向只需把
      `closure {S,T} = ⊤` 沿满同态 `psl` 推下去（`MonoidHom.map_closure`，Lean 里就是这么做的）；
      **PSL ⇒ SL 方向还需要 `−1 ∈ closure {S, T}`**，而这一条正是由关系卡的
      `sl_S_sq : S ^ 2 = (-1 : SL(2, ℤ))` 供给（S² 是 S 的字，故 −1 在 closure 里；
      再配 `Subgroup.closure` 与商的对应定理才得 ⟨S,T⟩ = SL(2,ℤ)）。
      ⇒ 若只把上游卡读成 PSL 层的主句，本推导用的 SL 版就不是「免费的」。
      本图的处理是：上游卡 worldsheet.modular-group-generated-by-s-and-t-v2 的 statement
      **两层都写**（PSL 主句 + SL 等价句），且 Lean 里 SL 版 `sl_closure_S_T` 是原始事实、
      PSL 版由它导出 ⇒ 本推导取 SL 版不经过任何未机检的步骤。
      需要 `−1 ∈ closure {S,T}` 那条纸上论证的读者，见 math.psl2z-s-t-relations 的 `sl_S_sq`。
      ⚠⚠⚠ **2026-09-11 改指 v2**：上游卡已拆成「生成性」（v2，本边）与「两条关系」
      （math.psl2z-s-t-relations）。本推导只用生成性，故改指 v2，**不加**关系卡的边。
  - id: worldsheet.modular-group-psl2z
    inferred: false
    note: |
      提供群与作用本身：Lean 里 `SL(2, ℤ)` 在 `UpperHalfPlane` 上的 `•`（Mathlib 的
      `UpperHalfPlane.instSMul`，即 τ ↦ (aτ+b)/(cτ+d)），以及 `ModularGroup.S`、`ModularGroup.T`
      与该定义卡写的两个矩阵逐字相同。目标卡 statement 明写「SL(2,Z) 按 g·τ = (aτ+b)/(cτ+d)
      作用在 H 上（worldsheet.modular-group-psl2z）」，故这条边是 statement 的字面依赖。
      ⚠⚠ 该卡与 math.dedekind-eta-function 当时都是 **rigorous 的定义卡**，
      按 min 规则把本推导从 own=formalized 压到 effective=rigorous，见 gaps 末条。
      **2026-09-11（curator lean-wire-10）更正**：两张定义卡已接到桥层
      `formal/StringFormal/Math/MathlibBridges.lean`（`StringFormal.Bridge.psl2z_smul_eq`、
      `StringFormal.Bridge.dedekindEta_eq_exp_mul_tprod`）并升为 formalized，
      本推导 effective 因此升到 formalized。
  - id: math.mobius-action-preserves-upper-half-plane
    inferred: false
    note: |
      **供给目标卡 (2)「解出的形式」那一步所需的 Im(g·τ) ≠ 0**，即新卡正文的第 (2) 条
      「作用保持 H：Im(γ·τ) > 0」。Lean 里可逐行指认：`DedekindEtaModular.lean` 的

          theorem norm_eta_pow_four_modular (g : SL(2, ℤ)) (τ : UpperHalfPlane) :
              ‖η(g • τ)‖ ^ 4 = τ.im / (g • τ).im * ‖η τ‖ ^ 4 := by
            have hpos : (g • τ).im ≠ 0 := ne_of_gt (g • τ).im_pos
            …（field_simp / linarith）

      第一行 `(g • τ).im_pos` 就是本卡 (2) 的取出形式（ℍ = {z : ℂ // 0 < z.im}）。
      **非 inferred**：除以 Im(g·τ) 这一步在证明体里逐字出现，缺了正性就不成立。
      ⚠ **本推导不用新卡的 (1)**（Im(γ·τ) = Im τ/|cτ+d|² 这条等式）：全群的不变性走的是
      `Subgroup.closure_induction`，两个生成元上的等式由 S 卡、T 卡供给，
      中间不出现 |cτ+d|。⇒ 本边只承担 (2)，不承担 (1)。
      ⚠ 2026-09-11（curator small-backlog-9）新增：该事实此前只写在定义卡
      worldsheet.modular-group-psl2z 正文的「该作用保持 H」一句里，本轮拆成独立命题卡；
      指向定义卡的那条边**保留**，它供给群与 Möbius 作用本身、以及 `ModularGroup.S`/`T`
      与卡面两个矩阵的逐字相同。
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/DedekindEtaModular.lean :: StringFormal.DedekindEta.im_mul_norm_eta_pow_four_modular_invariant；支撑链 im_mul_norm_eta_pow_four_modular_forall → {im_mul_norm_eta_pow_four_modular_invariant, im_mul_norm_eta_pow_four_isInvariant}，推论链 im_mul_norm_eta_pow_four_pow_modular → im_pow_mul_norm_eta_pow_modular → im_pow_twelve_mul_norm_eta_pow_48_modular，另有 norm_eta_pow_four_modular"
    note: |
      本仓库，formalizer 分支 `agent/formalizer/eta-modular`（新文件，与
      `ModularGroupGenerators.lean` 同批合入 main）；Lean 4 + Mathlib **v4.33.1**。
      本文件 import 的只有本项目的三个文件（`DedekindEtaS`、`DedekindEtaT`、
      `ModularGroupGenerators`），没有新的 Mathlib 输入——**全部数学输入都经由这三个上游节点**，
      这也是本推导 depends_on 恰好是那三张卡（外加定义卡）的原因。
      目标声明全文：

          theorem im_mul_norm_eta_pow_four_modular_invariant (g : SL(2, ℤ)) (τ : UpperHalfPlane) :
              (g • τ).im * ‖ModularForm.eta ((g • τ : UpperHalfPlane) : ℂ)‖ ^ 4
                = τ.im * ‖ModularForm.eta (τ : ℂ)‖ ^ 4
summary: |
  机器检查的证明，`formal/StringFormal/Math/DedekindEtaModular.lean`。
  全部内容是一次对 `Subgroup.closure` 的归纳，四个分支：

  **(0) 把「任意 g」变成「g 属于 S、T 生成的子群」**：
  `rw [ModularGroupGen.sl_closure_S_T]; exact Subgroup.mem_top g`（生成定理，见 depends_on）。

  **(1) 量词位置**：归纳要对 `∀ τ, …` 这个**带全称量词的命题**做（`..._modular_forall`），
  因为 `inv` 分支要在**另一个点** `g⁻¹ • τ` 上用归纳假设。这是本文件唯一的技术要点。

  **(2) 四个分支**：
    · `mem`：`x = S` 时用 `im_mul_norm_eta_pow_four_modular_S_smul`，
      `x = T` 时用 `im_mul_norm_eta_pow_four_modular_T_smul`（`Set.mem_insert_iff` 拆开二元集）；
    · `one`：`one_smul`；
    · `mul`：`mul_smul` 后接连用两次归纳假设（`ihx (y • τ)` 与 `ihy τ`）；
    · `inv`：在 `x⁻¹ • τ` 处用归纳假设，`smul_inv_smul` 消掉，再取 `.symm`。

  **(3) 推论**：`norm_eta_pow_four_modular` 由 `field_simp` + `linarith`（用 `(g•τ).im ≠ 0`）；
  `im_mul_norm_eta_pow_four_pow_modular` 是两边同取 n 次幂（`rw` 一步）；
  `im_pow_mul_norm_eta_pow_modular` 把 `(a·b)^n` 展成 `a^n · b^{4n}`（`mul_pow` + `pow_mul`）；
  `im_pow_twelve_mul_norm_eta_pow_48_modular` 是 n = 12 的特化。
gaps:
  - |
    **测度不变性不在本推导内。** 目标卡「不断言」(a) 已写明：d²τ/τ₂² 的模不变性
    是关于 SL(2,Z) 在 H 上作用的另一条事实，`DedekindEtaModular.lean` 仍然 η-only，
    本推导不碰测度——**这一半没变**。
    ★ **但「它至今没有任何形式化」这句已过时（2026-09-11，curator lean-wire-11）**：
    测度那一半现由 `formal/StringFormal/Math/TorusMeasure.lean` 形式化
    （`TorusMeasure.measure_smul_eq`、`measure_density_modular_invariant`），
    图卡 spectrum.torus-measure-modular-invariant 已升为 **formalized**。
    （`DedekindEtaModular.lean` 的 docstring 原写 "is **not** formalised here"，
    同日改为指向 `TorusMeasure.lean`；"here" 这个限定依然正确。）
    ⇒ spectrum.one-loop-torus-amplitude-modular-invariant-v2 的两个数学输入
    （τ₂|η|⁴ 与测度）现在**都是 formalized**；该卡的瓶颈已转移到
    spectrum.one-loop-torus-amplitude（(7.3.6) 本身，physical-argument）。
  - |
    **一般 g 下 η 本身的变换（乘子系统）不在本推导内**，Mathlib 也没有。
    本推导只控制模长的特定组合 τ₂|η|⁴；任何需要 η 的相位（例如 c − c̃ ∈ 24Z 这类论证）
    的下游都**不能**引本卡。
  - |
    **n = 12 是输入。** (3) 对一切 n ∈ N 成立，n = 12 只是特化；
    「12 = (D−2)/2」「D = 26」不在本推导也不在目标卡内。
  - |
    **（2026-09-11 已解除）有效状态曾被两张 rigorous 定义卡压住**：math.dedekind-eta-function
    （经 S、T 两卡传入）与 worldsheet.modular-group-psl2z，故本推导 own=formalized 而
    effective=rigorous。两张卡同日接到桥层 `StringFormal.Bridge`
    （`dedekindEta_eq_exp_mul_tprod` / `psl2z_smul_eq`，提交 674946a + c15b0db，合并 845b9b9）
    并升为 formalized ⇒ 本推导与目标卡的 effective 现均为 **formalized**。
    这一直是记账缺口，不是论证缺口。
    ⚠ 上面第一、二、三条 gaps（测度不变性、一般 g 下 η 的乘子系统、n = 12 是输入）**未变**。
