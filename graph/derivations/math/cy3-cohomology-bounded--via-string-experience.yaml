id: math.cy3-cohomology-bounded--via-string-experience
target: math.cy3-cohomology-bounded
kind: conjecture-support
status: conjecture
depends_on: []
sources:
  - ref: vafa-2005
    loc: "arXiv:hep-th/0509212v2, §3, p.5（本文无编号公式）"
summary: |
  唯一的"证据"是弦论中的经验：原文逐字 "In all the examples we know in string theory, the
  dimension of cohomology of the manifold is finite. For example, we do not know of a sequence of
  Calabi-Yau threefolds for which the dimension of cohomologies can get unboundedly large."
  紧接着是明确的否定自陈："It is not known if this is actually a true mathematical fact, but
  experience with various examples in string theory gives one a strong feeling that this is going
  to be finite."
gaps:
  - "**这是一个未解决的数学问题**，来源自己就是这么说的（vafa-2005#E12）"
  - "没有任何数学文献支撑；本条的唯一来源是一篇纲领性物理短文里的一句话"
  - "★ **2026-09-11 结案（原 vafa-2005#U6）**：一般 CY3 拓扑类型有限性**截至 2026-06 仍开放**——Anderson–Gray–Nally–Taylor, arXiv:2606.08427v1 §I 逐字 'it is not yet known whether the number of distinct topological types of Calabi-Yau threefolds is finite or infinite'。**故本推导的 status 维持 conjecture。**"
  - "★ 已解决的只是**子族**：椭圆纤维化 CY3 有界（math.cy3-elliptic-fibered-bounded，FHS = JEMS 27 (2025) 3583–3650）；Kreuzer–Skarke 超曲面的 h^{1,1} ≤ 491（math.cy3-hypersurface-h11-max-kreuzer-skarke）。**这两条与本推导之间故意不建边**——子类定理不得给全类升格"
  - "推导无依赖：这不是自洽的证明，而是'经验感觉'的记录"
notes: |
  from: vafa-2005#E12、#U6；2026-09-11 按 literature/extractions/math-sources.md §46 更新。
  这是 swampland 一线中少见的、原则上可判定的数学问题。
  **#U6（2005 年后的进展）已结案**：一般情形仍开放，子族情形已解决，详见目标陈述卡的 notes。

