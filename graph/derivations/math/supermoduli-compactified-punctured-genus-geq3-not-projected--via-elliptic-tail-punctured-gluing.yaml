summary: |
  取亏格 h=g−1≥2 的运动分量 C（带无效偶 theta 特征 L）与亏格 a=1 的常值自旋椭圆尾（带 n+1 个 NS
  标记点、2r 个 Ramond 标记点），沿 FKP-A 式 (7.8) 粘接映射的带穿孔推广构造测试态射
  F_{η,ξ}: X_η → \overline{\mathfrak S}_{g;n,2r}；引理 4.4 计算法丛（关键技巧：不计算尾巴那条
  ψ-线的具体形式，只用"它是一条线"这一事实，从而绕开 Example 8.9 在 Ramond 情形不直接适用的问题，
  详见 gaps）；命题 4.5 用正合列拼接把尾巴贡献与运动分量的障碍类联系起来；推论 4.7 用
  h≥2 ⟺ h^1(C,L^{-1})=2h-2≥2 给出 Riemann–Roch 存在性；定理 M 四步组装得到 ω₂≠0；命题 4.8
  用尾巴自旋结构的宇称给出 r=0 时的分量加细。a=1 分支（本节点）与 a=0 分支（g=2 姐妹卡）共同
  覆盖claim.md §3 的合并框式结论；本节点只取 a=1 分支给出的 g≥3 部分（a≥2 严格劣于 a=1，
  proof.md §5.3）。
gaps:
  - |
    proof.md §4 引理 4.4(c) 步"不去算尾巴那条 psi-线"的合法性、命题 4.5 正合列拼接在带穿孔情形
    是否成立（[GAP-IMM]）、§6.4 对"忘却穿孔态射平凡化"质疑的反驳，是本证明自认为最脆弱的三点；
    2026-09-18 对抗审查（graph-reviewer）三点全部 CLEAR，且给出了比原稿更强的理由（详见
    status.yaml"2026-09-18 对抗审查结果"）。本卡的 rigorous 档位依据该轮独立复核，非仅自评。
  - |
    [GAP-FKP-RAMOND]（**已于 2026-09-24 解除**）：原记为——FKP-A Lemma 7.9 证明正文把广义自旋结构
    写成 L≅Hom(L,ω_C)，漏 Ramond 扭转 ω_C(R)；判断为无害省略（粘接是 NS 节点处的局部操作），未
    独立重写该局部计算；只影响 r≥1 的情形（间接依赖）。该判断现已被独立证明坐实：
    `math.fkp-punctured-ns-gluing-exists-with-ramond` 带两条独立推导（本项目 attempt
    `fkp-79-ramond-twist` 的节点局部计算路线、`fkp-96-punctured` 的分支对偶引理路线），两者都
    在带 R 扭转的一般情形下重做了该局部计算，结论为粘接态射 (7.8)/(7.9) 确实良定义。省略确为无害。
    保留本条为历史记录；不再是本卡的开放缺口。
  - |
    [GAP-COMP]（低，已写入本卡 statement 的量词范围限制）：r>0 时 \overline{\mathfrak S}_{g;n,2r}
    的连通分量分类未知，故 r≥1 时本卡只断言整个叠非投影，不指认分量——这不是证明的缺陷，是诚实
    反映当前数学知识的边界。
  - |
