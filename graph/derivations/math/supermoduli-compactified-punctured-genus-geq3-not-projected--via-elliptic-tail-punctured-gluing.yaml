summary: |
  取亏格 h=g−1≥2 的运动分量 C（带无效偶 theta 特征 L）与亏格 a=1 的常值自旋椭圆尾（带 n+1 个 NS
  标记点、2r 个 Ramond 标记点），沿 FKP-A 式 (7.8) 粘接映射的带穿孔推广构造测试态射
  F_{η,ξ}: X_η → \overline{\mathfrak S}_{g;n,2r}；引理 4.4 计算法丛（关键技巧：不计算尾巴那条
  ψ-线的具体形式，只用"它是一条线"这一事实，从而绕开 Example 8.9 在 Ramond 情形不直接适用的问题，
  详见 gaps）；命题 4.5 用正合列拼接把尾巴贡献与运动分量的障碍类联系起来；推论 4.7 用
  h≥2 ⟺ h^1(C,L^{-1})=2h-2≥2 给出 Riemann–Roch 存在性；定理 M 四步组装得到 ω₂≠0；命题 4.8
  用尾巴自旋结构的宇称给出 r=0 时的分量加细。a=1 分支（本节点）与 a=0 分支（g=2 姐妹卡）共同
  覆盖claim.md §3 的合并框式结论；本节点只取 a=1 分支给出的 g≥3 部分（a≥2 严格劣于 a=1，
  proof.md §5.3）。
