summary: |
  机器检查的证明，`formal/StringFormal/Math/MathlibBridges.lean`，两支：

  **(⊆)** 设 A ∈ Z(SL(2,ℤ))。Mathlib 的 `Matrix.SpecialLinearGroup.mem_center_iff` 给出
  存在 r 使 A = r • I 且 r^(Fintype.card (Fin 2)) = 1，即 r² = 1；
  `Fintype.card_fin` 把指数化成 2，`Int.eq_one_or_neg_one_of_mul_eq_one` 在 **ℤ** 上
  从 r·r = 1 得 r = 1 或 r = −1，分别给 A = I、A = −I（`Subtype.ext` + `simp` 收尾）。

  **(⊇)** A = I 时由 `Subgroup.one_mem`；A = −I 时由 `neg_one_mem_center`，后者是
  `Subgroup.mem_center_iff` 加一行 `mul_neg, neg_mul, mul_one, one_mul`
  （−I 与一切 g 交换）。∎

  ⇒ 两个包含关系都在证明体里，`ext A` 之后逐支给出，与目标卡正文的括注一致。
gaps:
