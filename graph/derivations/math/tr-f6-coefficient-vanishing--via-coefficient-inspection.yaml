summary: |
  **SO(N)（l = −1）**：系数 = N + 32(−1) = N − 32。它是 N 的一次多项式，
  故 N − 32 = 0 ⟺ N = 32。GS 只写了 ⇐ 方向（"absent if … SO(32)"），⇒ 方向是一次方程的平凡解。

  **USp(N)（l = +1）**：系数 = N + 32。对一切 N ≥ 1 有 N + 32 ≥ 33 > 0，故恒不为零。
  （USp(N) 还要求 N 为偶数，但这里用不上。）

  **本推导刻意不说的一句**：GS 在同一处断言「(12c) 第一项对应的反常不能由添加局域相互作用抵消」。
  那是物理判断，不是代数，挂在 consistency.anomaly-cancellation-so32-effective-theory 上；
  本节点只管系数何时为零。
