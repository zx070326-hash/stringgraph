  且 reviewer 已独立复核并签名（见 notes 首行 `reviewer-verified: reviewer-batch26, 2026-09-11`）。
  ★ **承重墙是上面这条自证 + 签名，不是文献**：researcher 2026-09-11 的页图确认
  **FGZ 根本没有印出 Proposition 1.3 的证明**（§9.11.1 读数 3），LZ 以 'We recall' 引入也不证。
  两条文献 source 只承担「陈述、编号、量词与归属」。教科书侧印全证明的是 hatcher-2002 Theorem 2.44
  （pp.146–147），但那是有限 CW 复形的整系数版，只作同型旁证。
