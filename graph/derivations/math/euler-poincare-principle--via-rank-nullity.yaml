summary: |
  设 (C^•, d) 满足目标卡 (1) 的前提。对每个 n，秩–零化度定理给
    dim C^n = dim Z^n + dim B^{n+1}      （Z^n = ker d_n，B^{n+1} = im d_n），
  而按定义
    dim H^n = dim Z^n − dim B^n          （B^n ⊆ Z^n，因 d² = 0）。
  于是
    Σ_n (−1)^n dim C^n = Σ_n (−1)^n dim Z^n + Σ_n (−1)^n dim B^{n+1}
                       = Σ_n (−1)^n dim Z^n − Σ_n (−1)^n dim B^n        （指标平移 n+1 ↦ n 带出一个负号）
                       = Σ_n (−1)^n dim H^n。
  所有和都是有限和（只有有限多个 n 使 C^n ≠ 0，且 Z^n、B^n、H^n 的维数都以 dim C^n 为界），
  故各步的重排合法。这证明 (1)。「特别地」一支是 (1) 在 H^n = 0（n ≠ 0）时的直接读数。

  (2)：d 保持分次，故 Z^n、B^n、H^n 都按 λ 分解（ker 与 im 逐分量取），H^n(C) = ⊕_λ H^n(C_λ)；
  对每个 λ 用 (1)，再对 λ 形式求和即得形式特征标的等式。对固定的 λ 与 n，
  dim C^n_λ 有限，形式和逐系数有定义，不涉及收敛。

