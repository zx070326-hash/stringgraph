summary: |
  来源的证明路线（Gallier–Xu Ch. 6）：

  (1) 每个紧曲面（含带边）可三角化（Radó；本书 Appendix E 给 Thomassen 的证明），
      于是化为紧二维多面体的问题；
  (2) 每个（三角化的）胞腔复形经有限次剪切—粘合等价于 **Definition 6.5** 的
      **规范胞腔复形**：type (I) `a₁b₁a₁⁻¹b₁⁻¹ ⋯ a_p b_p a_p⁻¹ b_p⁻¹ c₁h₁c₁⁻¹ ⋯ c_q h_q c_q⁻¹`
      （p ≥ 0, q ≥ 0，可定向）或 type (II) `a₁a₁ ⋯ a_p a_p c₁h₁c₁⁻¹ ⋯ c_q h_q c_q⁻¹`
      （p ≥ 1, q ≥ 0，不可定向）；序列 c_i h_i c_i⁻¹ 恰给出 q 个 contour（**Lemma 6.1**，p. 92，
      逐字「Every cell complex, K, is equivalent to some canonical cell complex.」，证明 pp. 92–95 六个 Step）；
      三角化 2-复形与胞腔复形两套语言的互换靠 **Proposition 6.1**（p. 86），可定向性的两种定义
      （Def 4.6 曲面 / Def 6.4 胞腔复形）等价靠 **Proposition 6.2**（p. 88，无独立证明，回指 Prop 5.8）；
  (3) 规范形式由「type (I)/(II)」+ q + χ 唯一确定（p. 90 无编号论证），两个规范复形同胚当且仅当这三项相同；
      配 Theorem 5.2（同伦不变的 χ）与「等价保持可定向性、contour 数、χ」得三角化版 **Theorem 6.1**（p. 96，证明完整逐字）；
  (4) 配 (1) 得紧曲面版 **Theorem 6.2**（p. 97），即本条陈述——书内对 6.2 本身不另证（「For the record, we state」）。

  **status = rigorous 的依据**（docs/STATUS_LEVELS.md 第 4 级）：来源是 Springer 出版的
  数学专著，给出完整证明，结论是代数拓扑的标准结果。所有已知缺口都在同一本书内闭合，
  见 gaps。
gaps:
  - |
    **三角化存在性（Radó）不在正文**：Theorem 6.1 → Theorem 6.2 这一步用到「每个曲面 /
    带边曲面可三角化」，原书 p.96 逐字自陈「this is indeed true, but the proof is far from
    trivial. … We will present Carsten Thomassen's proof … in **Appendix E**」。
    **该证明在同一本书内**，故不是外部缺口；但本图**未读 Appendix E**，
    因此「Theorem 6.2 的证明链是否完整」在本项目内只到「作者声明完整 + 指明位置」这一级。
  - |
    **连通性未核实**：Theorem 6.2 的逐字文本不含 "connected"，来源第 1 章对 "surface"
    的定义（是否已含连通）**本图未取到**。若定义不含连通性，本条陈述在字面上会出错
    （两个不连通曲面可以有相同的 (可定向性, contour 数, χ) 而不同胚，例如两个不交球面
    与一个 χ = 4 的连通曲面——后者不存在，但更一般的反例容易构造）。
    下游使用时一律限定在**连通**曲面上（Massey §10 的标题就写了 connected）。
  - |
    **第二来源 Massey 的正文未获取**，带边分类定理的编号是 L0。图里只能写章节页码。
  - |
    **不含 χ 的计算公式**。χ = 2 − 2p − q（type I）/ χ = 2 − p − q（type II）在原书
    p.89–90 是**无编号行间式**，本推导不承载它；用到它的是
    math.positive-euler-surfaces-are-sphere-disk-rp2--via-normal-form-enumeration。
