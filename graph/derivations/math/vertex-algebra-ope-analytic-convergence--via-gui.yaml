summary: |
  (1) 由 Definition 7.2 第 2 条，(z_1 - z_2)^N f_{v,v′} 在 C^× × C^× 上全纯，故对固定 z_2 ∈ C^×，
      z_1 ↦ f_{v,v′}(z_1, z_2) 在 z_1 = z_2 处至多有 N 阶极点，在 0 < |z_1 - z_2| < |z_2| 的穿孔圆盘上全纯。
  (2) Definition 7.10：用围道积分 (7.14) 定义 ⟨v′, (A_k B)(z_2) v⟩ = ∮_{C(z_2)} (z_1-z_2)^k f_{v,v′} dz_1/(2πi)；
      由 (1)，被积函数在 C(z_2) 所围区域内除 z_1 = z_2 外全纯，积分与圆周选取无关（Cauchy）。
  (3) Lemma 7.11：k ≥ N 时 (z_1 - z_2)^k f_{v,v′} 在 z_1 = z_2 无极点，被积函数全纯，围道积分为零，故 A_k B = 0。
  (4) Proposition 7.12：(7.14) 正是 z_1 ↦ f_{v,v′}(z_1, z_2) 在 z_1 = z_2 处的 Laurent 系数
      （(z_1-z_2)^{-k-1} 项的系数即 ∮ (z_1-z_2)^k f dz_1/(2πi)），于是 (7.15) 是该 Laurent 展开。
      收敛性：只需对每个 r > 0 在 {0 < |z_1 - z_2| < r, r ≤ |z_2|} 上证 a.l.u. 收敛；
      这由 Lemma 7.13（多变量全纯函数在「乘积型」区域上 Laurent 展开的 a.l.u. 收敛）得到；
      对 r 取遍正数即覆盖 Ω_0 = {0 < |z_1 - z_2| < |z_2|}。
gaps:
