     「由 Lemma 7.13 得到」是照抄 Gui 的一句话，本图未复核该引理。它是标准的多复变结果（环形域上全纯函数的
     Laurent 展开在紧集上绝对一致收敛），故不影响 status，但登记为未转录。"
  - "Gui 全书的常设假定（V 为 N-分次、L_0 可对角化；§5.5 的 CFT-type 假设 dim V(n) < ∞ 与 V(0) = C1）
     是否为 Proposition 7.12 所必需，本图未核实；本推导把它们视为 Definition 7.2 背景对象的一部分，
     由依赖节点 math.vertex-algebra-complex-analytic-locality 承担。"
  - "**前提在弦论中未被验证**：Definition 7.2 对玻色弦世界面 CFT（D 分量洛伦兹号差自由玻色子 ⊗ bc 鬼场）是否成立，
     本图为 open（worldsheet.string-cft-is-a-vertex-algebra）。本推导本身不因此降级——它是关于任意满足 Def 7.2
     的一对场的定理——但凡想把它用到弦论上的边都会被那条 open 节点压住。"
notes: |
  **为什么这一条能标 rigorous 而 worldsheet.ope-commutator-dictionary--via-contour-deformation 不能**：
  两者用的都是「围道积分取 Laurent 系数」，差别只在前提——这里先有全纯函数 f_{v,v′}（Def 7.2 给的），
  围道积分与逐项积分因此合法；Polchinski 那边没有任何关于 R{A(z)B(w)} 是全纯函数的前提，
  用 Fig. 2.3 的图示代替了论证。**瓶颈不在围道技术，在前提。**
