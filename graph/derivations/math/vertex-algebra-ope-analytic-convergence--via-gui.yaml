      **L1（researcher 2026-09-11 逐页读作者主页 PDF；math-sources.md §8.5）**。Lemma 7.11 的证明逐字：
      「When k ⩾ N, (z_1 − z_2)^k f_{v,v′} has no poles at z_1 = z_2. So the RHS of (7.14) vanishes.」
