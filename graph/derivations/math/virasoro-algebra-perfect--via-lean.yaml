summary: |
  机器检查的证明，全部在 formal/StringFormal/Virasoro/WittPerfect.lean 的
  `StringFormal.Virasoro.VirasoroAlgebra` 命名空间，变量为 `(R : Type*) [CommRing R] [Algebra ℚ R]`。
  「完美」在 Lean 里写成 `LieAlgebra.derivedSeries R L 1 = ⊤`（等价地 ⁅(⊤ : LieIdeal R L), ⊤⁆ = ⊤，
  二者定义相等；Mathlib v4.33.1 没有 `IsPerfect` 谓词）。

  **准备**：`lie_mem_derivedSeries_one (x y) : ⁅x, y⁆ ∈ derivedSeries R (VirasoroAlgebra R) 1`
  —— 把「任一括号属于括号之集的张成」经 `LieAlgebra.coe_derivedSeries_one_eq` 与 `derivedSeries _ _ 1` 对上。

  **陈述 (1)（非零模的一致见证）** = `two_smul_lgen_eq {n : ℤ} (hn : n ≠ 0)`：
    (2 : R) • L n = ⁅L (n+2), L (-2)⁆ − ⁅L (n+1), L (-1)⁆。
  两次 `lie_lgen_lgen` 展开，指标相加用 `show n + 2 + (-2) = n from by ring` 等；
  两个括号的模指标和都是 n ≠ 0，故 `simp only [if_neg hn, zero_smul, add_zero]` 抹掉中心项；
  `← sub_smul` 合并后 `push_cast; ring` 算出系数 (n+4) − (n+2) = 2。
  **注**：与文献（feldvoss-siciliano-2025）走的 [d₀, d_n] = n d_n 不同——那个见证要除以 n。
  这里的见证与 n 无关，只需 2 可逆，与 `WittAlgebra.two_smul_lgen_eq` 同形。

  **陈述 (2)（零模）** = `two_smul_lgen_zero_eq : (2 : R) • L 0 = ⁅L 1, L (-1)⁆`。
  中心项 `centralTerm R 1 = inv12 R * ((1³ − 1 : ℤ) : R) = 0`（`norm_num`），故不出现 C。

  **陈述 (3)（中心元的见证）** = `cgen_eq : C = (2 : R) • ⁅L 2, L (-2)⁆ − (4 : R) • ⁅L 1, L (-1)⁆`。
  两个关键常数：`centralTerm R 1 = 0`，以及 `(2 : R) * centralTerm R 2 = 1`
  （由 (2³ − 2) = 6 与 `twelve_mul_inv12`：2·(inv12·6) = 12·inv12 = 1）。
  展开后 (i) 与 (ii) 的 L_0 部分按 2·(2 − (−2)) = 4·(1 − (−1)) 相消（`push_cast; ring`），
  剩下的中心部分恰是 C（`abel`）。**这是本推导唯一不与 Witt 情形共享的一步。**

  **陈述 (4)（完美性）** = `derivedSeries_one_eq_top`，包装为 `isPerfect`（本卡 lean_decl）。
  三步：
    · `lgen_mem_derivedSeries_one (n : ℤ)`：先由 (1)(2) 得 (2 : R) • L n ∈ derivedSeries _ _ 1
      （对 n = 0 与 n ≠ 0 分情况，`sub_mem` 处理两个括号之差），
      再用 `invertibleTwo R`（ℚ-代数里 2 的逆是 `algebraMap ℚ R (1/2)`，取出后 `smul_smul` 消掉 2）
      得 L n 本身在里面；
    · `cgen_mem_derivedSeries_one`：`rw [cgen_eq]` 后同样由 `sub_mem` + `SMulMemClass.smul_mem` 得 C 在里面；
    · 收尾：`← span_lgen_cgen_eq_top R` 把 ⊤ 换成 {C} ∪ {L n} 的张成，`Submodule.span_le`
      后 `rintro x (rfl | ⟨n, rfl⟩)` 逐个交给上面两条。
  `isPerfect` 的证明项就是 `derivedSeries_one_eq_top R`。
gaps:
  - |
    (i) **不涉及任何上同调，也不涉及万有性**。H¹(Vir, k) = 0、H²(Vir, k) = 0 与
    「Vir 是 W 的万有中心扩张」留在 math.virasoro-universal-central-extension 的 (2)(3)，
    本图与任何已知 Lean 项目都**没有**形式化它们（researcher 2026-09-11 核实 Kytölä 的
    VirasoroProject 文件清单：只有 WittAlgebraCohomology.lean，无 Virasoro 上同调 / 完美性文件）。
    特别地，本推导**不**提供「完美 ⟺ H¹(−, k) = 0」这条字典。
  - |
    (ii) **基环的锐利性未回答**。Witt 侧有充要条件（`WittAlgebra.derivedSeries_one_eq_top_iff`：
    ⟺ 2 ∈ R^×，附 ℤ 与 ZMod 2 两个反例）；Virasoro 侧**没有**对应结果，
    因为本图与 Lean 侧的 `VirasoroAlgebra R` 定义就要求 `[Algebra ℚ R]`（括号里的 (m³−m)/12）。
    「12 不可逆时 Vir 是否完美」在当前形式化里连提问的对象都没有。
    目标陈述的边界 (c) 已声明这一点。
  - |
    (iii) **「特征零的域上完美」没有单独的具名引理**。域 k（char 0）是 ℚ-代数的特例，
    故由本推导的结论一步即得，但 Lean 里没有把它单列为定理，也没有像 Witt 侧那样给正特征反例。
    这不影响本卡陈述（本卡就是按 ℚ-代数陈述的），此处登记以便与
    math.witt-algebra-derived-algebra 的 gap (i) 对照。
  - |
    (iv) **`lake build` 未由 curator 重跑**。本推导 status: formalized 的证据是 WittPerfect.lean
    的文件头自述、formal/TODO.md 的勾选与 20cc08f 已由 lead 合并进 main
    （合并流程要求 `lake build` + `check-axioms`）。curator 侧只做了 grep 级核对
    （`isPerfect`、`cgen_eq`、`two_smul_lgen_eq`、`two_smul_lgen_zero_eq` 的签名与证明体，
    2026-09-11 逐行读过 WittPerfect.lean 的 `VirasoroAlgebra` 命名空间）。
