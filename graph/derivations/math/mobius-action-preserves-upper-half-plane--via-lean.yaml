summary: |
  机器检查的证明，两行（`formal/StringFormal/Math/MathlibBridges.lean`）：

      theorem psl2z_im_smul_eq (g : SL(2, ℤ)) (τ : ℍ) :
          (g • τ).im = τ.im / ‖(g 1 0 : ℂ) * (τ : ℂ) + (g 1 1 : ℂ)‖ ^ 2 := by
        rw [ModularGroup.im_smul_eq_div_normSq, Complex.normSq_eq_norm_sq]
        simp [ModularGroup.denom_apply]

  **(1) 目标卡的 (1)** = 该等式本身：Mathlib 的 `im_smul_eq_div_normSq` 给
  `(g • τ).im = τ.im / Complex.normSq (denom g τ)`；`Complex.normSq_eq_norm_sq` 把 `normSq`
  换成 `‖·‖²`；`ModularGroup.denom_apply` 把 `denom g τ` 展成 `(g 1 0) τ + (g 1 1)` = cτ + d。
  ⇒ 与卡面 Im(γ·τ) = Im τ/|cτ+d|² 逐字相同。

  **(2) 目标卡的 (2)（作用保持 H）由声明的类型承担**：`g • τ` 的类型是
  `ℍ = UpperHalfPlane = {z : ℂ // 0 < z.im}`。这条定理能通过类型检查，就意味着
  Lean 里存在 `MulAction SL(2,ℝ) ℍ` 实例、而该实例的构造已证正性；取出正性的一步是
  `UpperHalfPlane.im_pos (g • τ)`。见 gaps 第一条。
gaps:
  - |
    **目标卡 (2)「作用保持 H」没有独立的桥层重述定理。** 它在 Lean 里不是一条命名定理，
    而是由 `psl2z_im_smul_eq` 中 `g • τ : ℍ` 这一**类型**承担（ℍ 是子类型 `{z : ℂ // 0 < z.im}`，
    Mathlib 构造 `MulAction SL(2,ℝ) ℍ` 时已证正性；取出它的一步是 `UpperHalfPlane.im_pos`）。
    这是机检内容（类型检查通不过就没有这条定理），但**不是一条可被 `check-axioms` 单独点名的声明**。
    ⇒ 提请 reviewer 裁定：若认为「卡面子句必须逐条对应一条具名声明」，
    正确修法是请 formalizer 在桥层补一行 `psl2z_im_pos (g) (τ) : 0 < (g • τ).im`，
    而**不是**把本卡降级或改正文。本推导据现有口径标 formalized。
  - |
    **不含 cτ + d ≠ 0。** 目标卡「不断言」(a) 已排除；Lean 侧因 `x / 0 = 0` 而不需要它，
    Mathlib 的 `UpperHalfPlane.denom_ne_zero`（及本仓库 `TorusMeasure.denom_ne_zero'`）
    可供需要的下游直接引用，但不在本推导内。
  - |
    **Mathlib 的证明本图未审计。** 内容（`im_smul_eq_div_normSq` 与 ℍ 上作用的构造）在 Mathlib；
    我们承诺的只是「它在同一次 lake build 里通过、且目标声明的公理集合只有标准三条」。
  - |
    ★ **（2026-09-11 已核，结论是 negative）物理文献一手出处**：原写「Polchinski §5.1 印刷 p.148
    是否写出 Im 的变换式未核」，researcher 第十三轮读了印刷 pp.145–151 的页图（L1），
    结论是**原书全节不印此式**（连记号 τ₂ 都要到第 7 章才引入），见
    literature/extractions/polchinski-1998-v1.md §20 与目标卡 sources 第三条。
    ⇒ 缺口的性质变了：不再是「未核」，而是**本卡的 (1) 在本项目内只有 Mathlib 一个来源**。
    若要一条独立的人类可读来源，须去标准数论教材（researcher §20.5 列了三个候选，均未查）。
    这不影响本推导的 formalized——数学正确性由 Lean 承担。
