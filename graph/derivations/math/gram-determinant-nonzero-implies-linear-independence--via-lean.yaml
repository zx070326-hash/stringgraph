          theorem linearIndependent_of_gram_det_ne_zero [NoZeroDivisors R]
              (B : M →ₗ[R] M →ₗ[R] R) (v : ι → M)
              (hdet : (gramMatrix B v).det ≠ 0) : LinearIndependent R v

      在变量 `{R M ι : Type*} [CommRing R] [AddCommGroup M] [Module R M] [Fintype ι]
      [DecidableEq ι]` 之下。**没有** `[Field R]`、序、有限维、对称性假设。
