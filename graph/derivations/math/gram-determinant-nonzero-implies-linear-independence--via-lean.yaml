summary: |
  纯线性代数，两步，逐字照 Lean 的两条声明：

  **第 1 步（目标 (1)）`vecMul_gramMatrix_eq_zero`。** 设 Σ_i g_i • v_i = 0。对每个 j：

      0 = B(0, v_j) = B(Σ_i g_i • v_i, v_j) = Σ_i g_i · B(v_i, v_j) = (g ᵥ* Gram(B,v))_j 。

  Lean 里就是 `map_sum` + `LinearMap.map_smul` + `LinearMap.sum_apply` 之后
  `simpa [Matrix.vecMul, dotProduct]`。**只用 B 对第一个变量线性**，
  不用对称性、不用 R 无零因子，也不用 ι 有限之外的任何有限性。

  **第 2 步（目标 (2)）`linearIndependent_of_gram_det_ne_zero`。**
  由 `Fintype.linearIndependent_iff`，要证的是「∀ g，Σ_i g_i • v_i = 0 ⇒ ∀ i, g_i = 0」。
  取定这样的 g，第 1 步给 g ᵥ* Gram(B,v) = 0；由 Mathlib 的
  `Matrix.eq_zero_of_vecMul_eq_zero`（前提：det ≠ 0，基环 `[NoZeroDivisors R]`）得 g = 0，
  再 `congrFun` 取分量。∎

  **两处值得记下的边界**（已写进目标的【不断言】）：
  · 第 2 步是把 det ≠ 0 用作「Gram 矩阵的左零化子为零」，这在**整环**上成立；
    有零因子时该推理失效（行列式非零的矩阵可以有非零左零化子）。
  · 整个论证**不**可逆：det = 0 时第 1 步什么也不给（它只是必要条件的来源），
    故不能由 det = 0 推出存在非零的 g。目标 notes 里给了 Virasoro 侧的显式反例
    （c = 1, h = 1/4：det = 0 而向量独立，退化的是型）。
notes: |
