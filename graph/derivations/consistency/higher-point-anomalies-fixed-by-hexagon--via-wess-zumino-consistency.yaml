    loc: "PLB p.119（重印 610），(11) 上一段（逐字见目标卡 sources）"
    note: |
      L1（抽取记录 literature/extractions/green-schwarz-1984.md E6）。
      **这是本图对目标卡三条断言的唯一来源，且 GS 三条都不证**：
