  - id: consistency.descent-omega1-is-consistent-anomaly
    inferred: true
    note: |
      提供「ω¹_{2n} 满足 Wess–Zumino 相容条件」这一**较弱**的结论（L1，zumino-1983-les-houches）。
      ⚠ 标 inferred: true：目标卡断言的是更强的**认同**——ω¹_{2n} 就是那个反常。
      从「是相容条件的一个解」到「是那个反常」还差解的唯一性与归一化的定值，
      **这条边支撑不了那一步**（见 gaps 第一条）。
  - id: conv.gauge-trace-normalization
    note: 记号（迹的表示、楔号省略）。本推导不涉及任何数值系数。
