  【1. ★ 为什么 depends_on 里只有一条约定，没有挂 math.* 的李论卡】
  本证明**不从图里进口任何命题**（proof.md §1「Imported from the stringgraph corpus. None of
  the steps below *requires* a graph node.」）。三处看起来该挂边的地方，逐条说明：
  · **math.adjoint-weights-are-roots-and-zero**（effective `physical-argument`）承载的正是
    `Tr H^k = Σ_α α(H)^k`。本证明**不引用该卡**，而在 §3 Lemma 2 里从极大环面定理
    （Bröcker–tom Dieck Ch. IV Thm 1.6）与根空间分解（Bourbaki Ch. VI）自证。
    ⚠ 这不是为了绕开状态压制：那张卡自己的 notes 逐字写明「没有任何非严格的步骤；
    status 之所以是 physical-argument，**只因来源内容在本项目 L0**」——即那是**来源取得**问题，
    不是数学强度问题，而本证明给出的是已取得出处的独立论证。
  · **math.tr-f6-coefficient-vanishing**（`rigorous`）与本证明 §6.2–§6.4 的 so(N)/usp(N) 排除重叠，
    但 proof.md §1 逐字声明本处推导独立于它，两者结论一致。挂边会虚报一条不存在的依赖。
  · **math.chevalley-restriction-theorem**、**math.e8-root-system(-power-sums)** 同理：内容重叠，
    但本证明的对应步骤是自证或直接从根表算出。
  经典进口 (K) Killing–Cartan 分类、(T) 极大环面定理、(R) 根空间分解按
  math.pbw-theorem--via-humphreys 与 math.adjoint-weights-...--via-root-space-decomposition
  的同一条纪律当**黑箱**处理（本图不为这些基础构造建节点），出处写在 proof.md §1。
  **这是本推导最值得被挑战的一处判断**，故在此完整留痕。

  【2. ★ 本推导与「四个群满足条件」那张卡的分工】
  目标卡只断言**唯一性方向**（「没有第五个」）。正面方向（这四个确实满足 (i)(ii)）在
  consistency.d10-four-groups-satisfy-anomaly-conditions，其 effective 是 `physical-argument`
  （被 math.so-usp-adjoint-fundamental-trace-identities 与 math.e8-adjoint-trace-identities
  两张二手系数表卡压低）。本推导**有意不挂那条边**：§7 的 r = 2 情形只用 Lemma 4 的
  **正方向**（每个因子必满足 (P) ⇒ 必是 e₈），不需要逆方向；逆方向在 proof.md 里也另有自证，
  但那是另一条命题，不属于本卡。两条命题逻辑独立，故唯一性可以是 rigorous 而正面方向
  暂停在 physical-argument，这不是矛盾。
  ⚠ **推论**：若日后有人想把「恰有四个」当成一条 rigorous 的完整分类引用，必须**同时**
  升级那张卡（路径是给它补一条同样从根系自证的推导），不能只引本卡。

  【3. ★★ 红线不因本推导解除】
  目标卡 notes【2】【3】两条措辞红线**继续有效**：即使完备性现在有了 rigorous 推导，
  也只能说「只有这四个使十二形式因子化」，**不能说「只有这四个反常抵消」**——
  两个阿贝尔解连 GS 抵消项都写不下来（consistency.abelian-factorization-is-not-cancellation）。

  【4. 与旧推导并存】
  consistency.d10-anomaly-conditions-completeness-claim--via-unproven-literature-assertion
  保留不动：它记录的是**文献态**（谁断言过、谁承认无证明、谁的表述冲突），与本推导记录的
  **本项目自证态**是两件事，都有保存价值。effective status 取两者较高者。
