    **条件化**陈述「给定 66 个型各自的根系，恰好 so(32) 与 e₈ 满足 (i)」，那部分是纯计算。
  - |
    **例外代数的根表来自 Bourbaki Planches I–IX 的显式坐标**（proof.md §9 第一条）。
    §6.1–§6.4 的闭式使 A/B/C/D 四族在任意秩都可手算排除，故经典部分不依赖脚本；
