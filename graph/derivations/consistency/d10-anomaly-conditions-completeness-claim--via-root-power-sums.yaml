summary: |
  证明满足条件 (i)(ii) 的紧致李代数**恰有**那四个，即目标卡所要的「没有第五个」。四步：

  **1. 阿贝尔方向平凡（§2, Lemma 1）。** u(1) 因子在**伴随**表示里 ad = 0，故 `Tr F^k`
  完全看不见中心。写 `𝔤 = 𝔤' ⊕ u(1)^m`，(i) ⟺ (i) 在半单部分 𝔤' 上成立，而 (ii) 把
  `m = 496 − dim 𝔤'` 定死。这正是 u(1)⁴⁹⁶ 与 e₈ ⊕ u(1)²⁴⁸ 成为解的原因——**平凡满足，不是真抵消**。

  **2. 化为根系幂和（§3, Lemma 2）。** 由极大环面定理与根空间分解，
  `Tr H^k = Σ_{α∈Φ} α(H)^k`；再由「实形式在复化中 Zariski 稠密」两次把 𝔱 上的多项式恒等式
  推到全代数。于是 (i) 变成根数据的显式多项式恒等式 (i′)，**所有迹系数直接从根系算出，
  不引用任何二手迹恒等式系数表**（这是刻意的：antonelli-2015 的系数表有实质错误，见 §8）。

  **3. 至多两个单因子（§4, Lemma 3 / Lemma 4 / Cor 4.1）。** 在 Sym(𝔱_ℝ*) 的**多重次数分级**下
  取 (2,2,2) 分量：`S₆` 与 `S₄S₂` 的每一项支撑在至多两个 slot 上故贡献为零，而 `S₂³` 的该分量
  是 `6 A_i A_j A_k`；Sym(𝔱_ℝ*) 是整环且每个 `A_l ≠ 0`（`Σ_α α(h)²` 是实数平方和，为零与单性矛盾），
  故 `r ≤ 2`（Lemma 3）。`r = 2` 时逐次数比较把 (i) 拆成每个因子都要满足更强条件
  `(P): S₄ = S₂²/100`（Lemma 4）。再由 (ii) 得每个单因子 `dim ≤ 496`，按 Killing–Cartan
  分类**恰好 66 个**紧致单李代数（Cor 4.1：秩上界 21/15/15/16 + 低秩重合排除，21+14+13+13+5 = 66）。

  **4. 有限穷举与组装（§5–§7）。** 66 个候选在精确有理数下逐个判定：满足 (i) 的只有
  `so(32)` 与 `e₈`，满足 (P) 的只有 `e₈`。§6 另给 A/B/C/D 四族在任意秩的**闭式**与例外型的
  单点 witness，使每条排除都可手算复核，不依赖脚本。配分后 r = 0/1/2 三种情形恰好给出
  `u(1)⁴⁹⁶`、`so(32)`、`e₈ ⊕ u(1)²⁴⁸`、`e₈ ⊕ e₈`，**恰四解**。∎
