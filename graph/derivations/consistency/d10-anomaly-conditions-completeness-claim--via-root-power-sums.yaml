    故只能说本处数值是独立导出并内部交叉验证的，**不能**指名该文哪几个数错在哪。
  - |
    **未经期刊发表、未经同行评议、未经船长确认**。`rigorous` 档位走的是
    docs/STATUS_LEVELS.md 的**例外**通道（前提完整 + 有限步初等计算 + reviewer 独立复核），
    不是「有发表的、数学界接受的完整证明」那条正路。
