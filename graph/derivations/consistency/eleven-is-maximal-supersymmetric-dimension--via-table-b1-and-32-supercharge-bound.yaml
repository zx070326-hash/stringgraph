id: consistency.eleven-is-maximal-supersymmetric-dimension--via-table-b1-and-32-supercharge-bound
target: consistency.eleven-is-maximal-supersymmetric-dimension
kind: physical-argument
status: physical-argument
depends_on:
  - id: math.clifford-majorana-weyl-mod-8
    note: |
      供给 Table B.1 的 min. rep. 列：`d = 12` 的最小旋量有 64 个实分量，`d ≥ 12` 只会更大。
      原书逐字点名这一步：「**Table B.1 then implies** that `d = 11` is the maximum in which
