      本推导只补「没有第五个」这一半——**而那一半在本项目可读来源里没有证明**。
  - id: math.tr-f6-coefficient-vanishing
    inferred: true
    note: |
      **inferred 的理由**：该卡给出的是**在 SO(N)/USp(N) 族内**的完备性
      （系数 N + 32l = 0 ⟺ l = −1 且 N = 32；USp 恒不为零），
      即目标命题在**一个子族**上的严格版本。把它当作全局完备性的**部分证据**是本图的判断，
      来源没有这样组织论证：bilal-2008 说「scan all 496-dimensional groups」但不写扫描，
      antonelli-2015 的分类论证本项目未复核。
  - id: conv.gauge-trace-normalization
