  - "「形式上的十二维表达式」与十维反常之间的对应本身只在 zumino-wu-zee-1984 里，见 consistency.anomaly-twelve-form-d10。**状态更正（2026-09-11）**：ZWZ **正文仍未取得**（L2，仅 INSPIRE 逐字摘要；本项目已穷尽当前可用路线，抽取记录 §0.4）。同作者同期的伴随讲义 zumino-1983-les-houches **全文已取得（L1）**，但它只提供**下降链**那一半，**没有升维到 2n+2 维不变多项式**这套写法。⇒ 这条「反常 ↔ 十二形式」的字典在本图里**仍无任何已核实来源**。"
