summary: |
  **论证形态：引用他人计算的结果。** 反常多项式的系数来自 Alvarez-Gaumé–Witten 对
  D = 4k + 2 维手征场（spin-1/2、spin-3/2、自对偶张量）引力反常的指标定理计算。
  GS 做的只有两件事：
  (1) 把 D = 10、N = 1 超引力的费米子含量（一个左手 spin-3/2 引力微子 + 一个右手 spin-1/2 场）
      与 n 个左手 spin-1/2 物质费米子代进去；
  (2) 把结果按 (tr R²)³、tr R² tr R⁴、tr R⁶ 三个不变量整理，使 n 的依赖以 n − 496 的形式出现。
  本图对 (1)(2) 都没有独立核算。

  **本图做过的唯一检查**（数值一致性，非证明）：与 bilal-2008 (12.21) 逐项比较，三项之比
  都是 3/4，故两者只差整体归一。详表见目标节点 notes（抽取记录 §5.5 = 候选 A5，
  三个 ℚ 上的等式，`norm_num` 可形式化，本轮未建 math 节点）。
