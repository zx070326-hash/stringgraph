kind: proof
status: formalized
depends_on:
  - id: conv.gauge-trace-normalization
    note: |
      本卡只用到该约定的**引力一路**：tr R^{2k} 里的 tr 是切空间 10 × 10 矩阵的迹，楔号省略。
      （IIB 没有规范场，Tr/tr 的规范侧区分在此不出现。）
      系数 495、225、63、992、448、128 与三个公分母 725760、552960、1327104 全部写死在
