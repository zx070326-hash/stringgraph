id: consistency.twelve-form-factorization-solutions--via-textbook-assertion
target: consistency.twelve-form-factorization-solutions
kind: physical-argument
status: physical-argument
depends_on:
  - id: consistency.gravitational-anomaly-requires-496-fermions
    inferred: false
    note: |
      给出条件 (i)：tr R⁶ 结构的系数正比于 n − 496，故任何候选群必须有 n = 496。
      这条边在来源处可查：adams-dewolfe-taylor-2010 逐字「n = 496 for both, killing the middle term」；
      bilal-2008 §12.4.2 与 antonelli-2015 §2.1 都以「496 维群」为候选集的定义。
  - id: math.tr-f6-coefficient-vanishing
    inferred: false
    note: |
      给出条件 (ii) 在 SO(N)/USp(N) 一支上的解：Ω₁₂ 中 tr F⁶ 的系数 N + 32l 为零 ⟺ l = −1 且 N = 32
      ⟺ SO(32)；USp 恒不为零。**这是四解里 SO(32) 的全部代数内容，也是排除其余经典群的依据。**
  - id: math.anomaly-twelve-form-factorization
    inferred: false
    note: |
      给出「六阶单迹项为零之后 Î₁₂ 确实取 Y₄X₈ 形式」在 SO(32) 与 E₈ 两支上的验算
      （GS (19)）。ADT (7) 第一个方括号为零与本节点的恒等式**逐项等价**（展开式核对见
      consistency.abelian-factorization-is-not-cancellation--via-adt-supersymmetry-obstruction notes 第 2 条）。
  - id: math.e8-adjoint-trace-identities
    inferred: false
    note: |
      E₈ 一支的输入：Tr F⁴ = (1/100)(Tr F²)²、Tr F⁶ = (1/7200)(Tr F²)³，即 E₈ 没有独立的四阶与六阶
      Casimir 不变量。E₈ × E₈ 与 E₈ × U(1)²⁴⁸ 两个解都靠它。
      ⚠ **从「单个 E₈ 满足恒等式」到「E₈ × E₈ 的迹（两因子之和）仍满足」需要一步可加性验算**，
      本图与 green-schwarz-1984 都没有单建节点；GS 逐字说 E₈ × E₈ 一路是
      「by the same reasoning as before」（见 consistency.anomaly-cancellation-e8e8-effective-theory notes 1）。
      这一步记在 gaps。
  - id: conv.gauge-trace-normalization
    note: 固定 tr / Tr 的语义与 F 的形式次数，使 (ii) 的表达式有确定含义。
sources:
  - ref: gsw-1987-v2
    loc: "§13.5.3「Allowed gauge groups for N = 1 superstring theories」，pp. 353–358"
    note: |
      ★ **内容 L0：正文未取到**（位置为目录级 L1）。本推导**不引用该节的任何式号或措辞**，
      只把它登记为两条独立二手证据共同指认的原始出处。见目标卡 sources 的同名条目。
  - ref: bilal-2008
    loc: "§12.4.2, pp. 102–103：四个解的列表 +「One can actually scan all 496-dimensional groups and show that there are no other possibilities」"
    note: L1。**该句是「恰是四个」在本项目可读来源中唯一的正面表述，且无证明、无引用。**
  - ref: antonelli-2015
    loc: "§1.1, p.3；§2.1, p.7；p.33"
    note: |
      L1。提供三样东西：(a) 四解表；(b) 出处指认（GSW ch.13）；
      (c) 逐字承认在该文之前「no proof has explicitly been carried out」。
      该文自称给出了证明，本项目**未复核**。
  - ref: adams-dewolfe-taylor-2010
    loc: "arXiv:1006.1352v2，第三节开头：「These theories both contain n = 496 generators, and the first term in large parentheses in (7) vanishes for both, so they again have anomaly polynomials which take the factorized form Y₄X₈」"
    note: L1（curator 另取 arXiv e-print LaTeX 源码核对）。**独立验算了阿贝尔两解的因子化。**
summary: |
  本推导把「四解表」在本图中的**实际证据结构**摊开，而不是把它当成一条定理。

  **A. 四个群确实各自满足 (i)(ii)——这一半在本图有支撑：**
  · **SO(32)**：n = dim SO(32) = 496 ✓；(ii) 由 math.tr-f6-coefficient-vanishing（N + 32l = 32 − 32 = 0）
    与 math.anomaly-twelve-form-factorization (a) 给出。
  · **E₈ × E₈**：n = 2 × 248 = 496 ✓；(ii) 由 math.e8-adjoint-trace-identities +
    math.anomaly-twelve-form-factorization (b) 给出（两因子的可加性一步见 gaps）。
  · **U(1)⁴⁹⁶** 与 **E₈ × U(1)²⁴⁸**：n = 496 ✓；(ii) 由「U(1) 的伴随表示是单态 ⇒ 一切阿贝尔伴随迹为零」
    给出——ADT 第三节逐字验算了这两条，故这一半是 **L1**，不依赖未取到的 GSW ch.13。

  **B. 「恰是四个」（no others）——这一半在本图没有支撑：**
  · 原始断言据说在 GSW §13.5.3，**该节正文本项目未取到（L0）**；
  · bilal-2008 §12.4.2 写「one can actually scan all 496-dimensional groups and show that there are no
    other possibilities」，**无证明、无引用**；
  · antonelli-2015 §1.1 逐字说在该文之前「**no proof has explicitly been carried out**」，
    该文自称补上，但是单作者预印本且本项目未复核；
  · schwarz-2012-history p.10 说 E₈ × E₈ 是「the only other」，与四解表冲突（未裁决）。

  **⇒ 档位理由**：A 半有可查的代数支撑（部分甚至是初等可复核的），B 半是**教科书级断言**，
  其论证骨架（「扫描所有 496 维群」）的关键步骤只有断言。按 docs/STATUS_LEVELS.md 的
  「断言 + 骨架」裁决（lead 2026-09-11），这类节点标 **physical-argument** 并把断言处逐条写进 gaps，
  **不**标 conjecture（结论真伪在文献中并无争议，有争议的是覆盖范围与是否有证明）。
gaps:
  - "★★ 「恰是四个 / no others」这一方向**在本项目可读的来源里没有任何证明**：GSW §13.5.3 正文未取到（L0）；bilal-2008 §12.4.2 的『one can actually scan…』无证明无引用；antonelli-2015 自称是第一个给出证明的（单作者预印本，本项目未复核）。"
  - "★ GSW §13.5.3 的**原文措辞未取到**（Cambridge Core 章级 PDF 12 MB > 工具 10 MB 上限），因此『GSW 到底断言了多强的话』仍是未知：Antonelli 与 ADT 两位转述者的读法明显不同（『已知这四个反常抵消』vs『满足部分相同条件、看起来可能一致』）。"
  - "schwarz-2012-history p.10『E₈ × E₈ is a second (and the only other) gauge group』与四解表冲突，本图不裁决（记在目标卡 notes 第 2 条）。"
  - "E₈ × E₈ 一支需要『单个 E₈ 的迹恒等式 ⇒ 两个 E₈ 因子之和仍使六阶单迹组合为零』的可加性验算，本图与 green-schwarz-1984 都没有单建节点（GS 逐字只说 by the same reasoning as before）。"
  - "本图**未独立验算**『其余 496 维李代数都不满足 (ii)』，也没有 496 维李代数的枚举节点（dim E₈ = 248 在 Mathlib 中缺失，见 consistency.gravitational-anomaly-requires-496-fermions notes 1）。"
  - "条件 (ii) 只覆盖六阶单迹项。混合反常另有两条方程（math.mixed-anomaly-trace-conditions-n32），本推导不检查它们对四个解是否都成立——**只在 SO(32) 上验过**。"
notes: |
  【★ 措辞红线】本卡与本推导全程只说「因子化」。按 consistency.abelian-factorization-is-not-cancellation
  （ADT 2010，L1），阿贝尔两解**并没有**反常抵消。凡在别处引用四解表，请一并引用那张卡。

  【升级路径】拿到 GSW §13.5.3 正文（需人类在浏览器点一次，URL 见 extractions/gsw-1987-v2.md §0.4）后：
  · 若该节确有分类论证 ⇒ 可新建一条 `--via-gsw-classification` 推导并撤销 gaps 前两条；
  · 若该节只是断言 ⇒ 本推导的 gaps 得到确认，且三方冲突可按「GSW 只是断言」裁决。
  另一条独立路径是复核 antonelli-2015 §2–§3 的证明（36 页，本项目只读了 pp. 1–8 与 33–36）。
