summary: |
  原文的论证结构（按 1209.5461v4 的章节顺序，只列本项目已读到的环节）：

  1. **测度在超模空间上**（§2.1 → §3.3.1）：从玻色弦「路径积分给出模空间上的测度」（Polchinski §5.3）出发，
     用同样的方式让超弦路径积分给出超模空间 𝔐_g 上的（超）测度 F(𝒥,δ𝒥)；杂化弦上它是 ℳ_L × ℳ_R 上的
     全纯 p|q 形式，在实余维 p|0 的积分链 Γ（加厚为 Γ̂）上积分，(3.61)。原文两次用 "roughly speaking"。
  2. **为什么不能下降到普通模空间**（§3.3.2 + §3.5）：一般没有全局全纯投影（引 DW，见目标卡 notes 第 1 条）；
     即使局部取切片，切片在 (3.79) 有非零解处非法 ⇒ 伪奇点。处方：分片选切片、只提取不变量、在 Γ̂ 上积分。
  3. **PCO 作为一种积分奇模的方法被导出**（§3.6）：(3.87)→(3.88) 积掉 (η_σ, dη_σ) 得 δ(∫χβ)·∫χS；取
     χ = δ_{p_σ} 得 (3.95) 𝒴(p) 与 (3.97) ∏𝒴(p_σ)。伴随两条硬限制：(3.99) 伪奇点判据；PCO 重合时无极限（p. 47）。
  4. **规范不变性 = 超模空间上的分部积分**（§7.1）：BRST 恰当态的插入化为 (7.1) 的边界积分；去掉除子 𝒟 的
     邻域作截断，极限下右边为零则无反常。这是目标卡 (a) 的论证骨架；「已知反常」（开弦/无定向弦的 R-R
     tadpole ⇒ 反常，§9.4）就是右边不为零的情形。
  5. **红外行为与超对称**（§7.5–§7.6.1 + §8.3）：tadpole 是关键障碍、tadpole 为零时条件收敛且只差 𝒵 的重参数化
     （依赖卡）；在超对称紧化中，用 (8.38) 𝒱_φ = Σ_α Q_α(𝒱_{ψ_α}) 与 (8.42) ∫_Γ dF = ∫_{∂Γ} F 对亏格归纳：
     假设 tadpole 为零且超对称在 ≤ g−1 圈不破缺，则 (8.42) 的边界贡献只剩 g_ℓ = 0, g_r = g 的退化，
     它就是 ⟨𝒱_φ⟩_g，故为零；**归纳闭合需要「超对称在 g 圈不自发破缺」这个来源不证的条件**。
     这是目标卡 (b)(c) 的论证骨架。

  **档位**：全链是超模空间上的路径积分与形式操作（测度的存在性、Stokes 定理在带奇点的超链上、
  截断与取极限、退化的领头阶），作者自称 "demonstration"，且每一步都有作者自陈的保留语
  （"roughly speaking" / "not completely canonical" / "a little too schematic" / "It is not entirely clear" /
  "If (as in most cases)"）。按 docs/STATUS_LEVELS.md 取 physical-argument。
  **不取 conjecture**：结论真伪在文献中没有争议，缺的是严格性，那是 gaps 的轴而不是 status 的轴
  （lead 2026-09-11「断言 + 骨架」裁决）。
gaps:
  - "★★ **自称强度**：摘要与 §1 用 'demonstration' / 'aiming to give … demonstrations'，1304.2832 §1 用 'one is well-placed to demonstrate'，**不是 'proof'**；且摘要三处限定 'apart from known anomalies' / 'when expected' / 'expected'。全文无 'we prove the consistency'，无结论章节。"
  - "★★ **适用域被显式收窄**（§1 p. 3）：只用最简单一类顶点算符（§2.4.1）；不含质量重整化；不含需要真空移动的模型；不含 R-R 背景；不与 pure spinor 形式接触。处理前两项的 off-shell 形式 [19–24]（Sen 2014–2017）用的是 PCO 语言，原文逐字「It would certainly be possible to restate the results of those papers in the super Riemann surface language … However, this has not yet been done」（截至 v4，2023）。"
  - "★★ **归纳论证是条件式的**（§8.3 p. 175 逐字）：'If (as in most cases) general arguments show that spacetime supersymmetry is not spontaneously broken at g-loop order, then the inductive step is complete'。这个 \"if\" 本文不证；1304.2832 整篇研究的正是它失效的模型（SO(32) 杂化弦 on CY，超对称一圈自发破缺、两圈 dilaton tadpole）。与 polchinski-1998-v2 §12.2 pp. 102–103 的两个 \"if\" 结构同型（抽取记录 QW3）。"
  - "★ **开弦/无定向弦侧保留**（§9.4 p. 196 逐字）：'One expects the same in string theory, though string theory is not well enough understood to make this statement completely clear.' 且「R-R tadpole ⇒ 反常」的结论出处引 [82] = green-schwarz-1984 与 [84] = Cai–Polchinski 1988，本文不重做 GS 那一步。"
  - "★ **高亏格 PCO 分布错误是否一定给错答案，作者明说不确定**（§6.4.6 pp. 109–110 逐字）：'It is not entirely clear if this remains true in higher genus; the spurious singularities may cause trouble.'（亏格 0 时任意分布仍给正确树级 S 矩阵，§4.4，未读。）"
  - "★ **来源状态**：主论文 arXiv:1209.5461 与 Overview arXiv:1304.2832 **至今无期刊发表版**（INSPIRE recid 1188034 / 1227826 均无 publication_info，2026-09-11 查）；本推导读的是 v4（2023），其中对 DW [45] 与 Sen–Witten [49] 的引用不在 2012 年的 v1 里。"
  - "**本项目未读的环节**：§2.2–2.6 与 §3.1–3.2（超测度的构造，即 summary 第 1 步的实体）、§4–§5（顶点算符）、§6.1–6.3（Deligne–Mumford 紧化与 Feynman iε）、§8.2.3（超对称 Ward 恒等式，即 (8.38) 的来历）。summary 第 1、5 步对这些内容只能按已读章节的回指转述。"
  - "**depends_on 的两条边都不承载论证主体**：tadpole 卡只覆盖第 5 步的一半，(5.3.9) 那条是 inferred 的模板关系。规范不变性（第 4 步）所需的「BRST 恰当插入 = 模空间上的全微分」在本图**尚无节点**（玻色弦版 worldsheet.brst-variation-is-moduli-space-boundary-term 正在 curator-polchinski-v1-ch7 分支建，未合）；超版 Deligne–Mumford 紧化、超对称 Ward 恒等式 (8.38) 亦无节点。补齐后应改为显式边。"
notes: |
  **为什么 id 取 --via-supermoduli-integration**：整条论证的核心就是 1304.2832 §1 的步骤 (A)——
  「在超模空间上做全部分部积分」；(B)（红外正规子）由依赖卡承载。

  **不写 reviewer-verified**：没有有限步初等计算可复核。

  **与 1998 年状态的对照**见目标卡 notes 第 3 条；本推导**不**把 consistency.superstring-perturbative-consistency-unproven-1998
  列为依赖（那张卡 effective = open，且它是历史陈述而非前提）。

  **版本提醒**：若日后有人取 v1（2012-09-25）重读，summary 第 2 步「引 DW」与 gaps 第 2 条「[19–24]」两处在 v1 里不存在，
  届时应新建一条 --via-v1 推导或在本条 notes 追加版本差异，**不得**就地改 summary 冒充 2012 年的状态。
