summary: |
  **(A) 纯 Yang–Mills 反常。** 由 (12c′)（E₈ 的迹恒等式）代替 (12c)，"by the same reasoning as
  before" 得到相容反常
      G′ = (c/108000) ∫ [ ω¹_{2Y₁} (tr₁F²)² + ω¹_{2Y₂} (tr₂F²)² ]                  (17′)
  它由反项
      S′₁ = (c/108000) ∫ { 30 B [ (tr₁F²)² + (tr₂F²)² − tr₁F² tr₂F² ]
                            − ω⁰_{3Y₁} ω⁰_{3Y₂} (tr₁F² − tr₂F²) }                   (18′)
  抵消。注意 E₈ 一路根本没有单迹六阶项可言：(12c′) 说 Ω₁₂ 整个正比于 (tr F²)³，
  这正是 Chapline–Slansky 指出的「E₈ 无独立四阶、六阶 Casimir」的后果。

  **(B) 纯引力反常。** 与 SO(32) 完全相同：n = 496（E₈ × E₈ 的维数 2 × 248 = 496），
  剩余两项由**同一个** S₂ (21) 抵消（S₂ 不含规范场）。

  **(C) 混合反常。** ★ **GS 没有独立算**。逐字「Given the cancellation of mixed anomalies in
  SO(32) the possibility of their cancellation in E₈ × E₈ follows from eq. (19).」
  论证的骨架是：混合反常的结构只通过 Ω₄、Ω₈、Ω₁₂ 的组合进入，而 (19) 说
  Ω₁₂ = (1/48)Ω₄[Ω₈ − (1/300)Ω₄²] **对两个群同时成立**；既然 SO(32) 一侧已经配平，
  同样的组合在 E₈ × E₈ 一侧也配平，只需重新分配系数。显式结果是
      S′₃ = (c/7200) ∫ ( 30 B tr R² tr₁F² + 5 ω⁰_{3L} ω⁰_{3Y₁} tr R² + 20 ω⁰_{3Y₁} ω⁰_{7L}
                         + ω⁰_{3Y₁} ω⁰_{3L} tr₁F² + ω⁰_{3L} ω⁰_{3Y₁} tr₂F² ) + (1 ↔ 2)   (23′)

  **合并**：S′₁ + S₂ + S′₃ 抵消 E₈ × E₈ 的全部单圈反常。
gaps:
  - "★ **(C) 完全没有独立验算**：GS 只说「follows from eq. (19)」，中间步骤（混合反常如何只通过 Ω₄, Ω₈, Ω₁₂ 的那一个组合进入）**原文没有写出**，本图也没有补。这是本节点比 SO(32) 节点更弱的地方。"
  - "本推导 summary 里 (C) 的「论证骨架」两句是 curator 的重构，不是原文措辞；原文只有那一句话。若 reviewer 认为重构不当，应删到只剩引文。"
  - "继承 consistency.anomaly-cancellation-so32-effective-theory 的全部 gaps。**其中数值系数那条已在 2026-09-11 重述**：alvarez-gaume-witten-1984 全文已取得（L1）而**它并不含常数 c**（(114) 逐字「apart from a factor common to the three cases」，只给相对归一）；zumino-1983-les-houches §5 给的是 2n−2 维通式 (5.13)、不含引力侧、原文手写「(up to a sign)」；ZWZ 正文未取得（L2）。⇒ **c 是 GS 自己合成的一步，三篇原始文献里都不以一个数出现，GS 未给中间步骤，本图未复算。**"
  - "★ **同样继承 SO(32) 一支新增的三条 Zumino 侧缺口（2026-09-11）**：(a) **局部性**——下降方程的唯一已核实来源（zumino-1983-les-houches, p.16 末）逐字限定它们「really valid only locally, in some finite neighborhood in x-space」，而 S′₁、S₂、S′₃ 是整个十维时空上的积分；(b) **相容条件之解的唯一性无支撑**——同一来源 p.29 逐字「The problem of finding the most general solution of the consistency condition will not be discussed here.」，唯一性属 manes-stora-zumino-1985 一线，本项目未取得；(c) **k² = 0 未证**（同一来源逐字「We leave the proof as an exercise to the reader.」，对本推导不构成实际依赖）。"
  - "★ **洛伦兹一路的 ω⁰_{7L}、ω¹_{10L} 是本图的推断**：(23′) 显式含 ω⁰_{7L}，但 GS 原文只显式定义 n = 1 的洛伦兹侧 (7)(8)，一般 n 的 A → ω, F → R 代换原文未陈述，且 Zumino 一侧全文不含引力。见 consistency.descent-forms-gs-notation statement (2) 的证据分层。"
  - "E₈ 迹恒等式本身在所有来源里都没有证明（见 math.e8-adjoint-trace-identities--via-casimir-structure 的 gaps）。"
  - "(18′) 的 108000 与 (23′) 的 7200 这些数字，GS 未说明来历。"
notes: |
  【为什么这条推导以 SO(32) 节点为依赖】因为 GS 的论证就是这么走的（见 depends_on 第一条的逐字引文）。
  图里这条边把「E₈ × E₈ 一支的可信度不高于 SO(32) 一支」这件事记了账：任何压低 SO(32) 节点的
  缺口都会自动压低这里。

  【归属提醒】E₈ × E₈ 这一半的关键输入来自 Chapline–Slansky（私人交流），
  独立观察者还有 Dixon–Harvey–Witten 与 Thierry-Mieg；GS 的预印本版本遗漏了这一半。
  详见目标节点 notes 第 2 条与抽取记录 E19。
