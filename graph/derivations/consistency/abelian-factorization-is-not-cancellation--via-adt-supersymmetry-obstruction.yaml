notes: |
  【1. ★ 交叉核验：ADT (7) 与 GS (20) 在纯引力扇区逐项一致（curator 2026-09-11 复算）】
  把 ADT (7) 的引力部分（(n − 496) 方括号 + Y₄X₈/768 中的纯引力部分
  tr R²·(tr R⁴ + (tr R²)²/4)/768）整体乘以 **−96**：

  | 项 | −96 × ADT (7) | GS (20) | 一致 |
  |---|---|---|---|
  | tr R⁶ | −(n−496)/7560 | −(n−496)/7560 | ✓ |
  | tr R² tr R⁴ | −(n−496)/5760 − 1/8 | −[1/8 + (n−496)/5760] | ✓ |
  | (tr R²)³ | −(n−496)/13824 − 1/32 | −[1/32 + (n−496)/13824] | ✓ |

  三项**全部逐项相同**（有理数精确相等，已用有理算术验算）。
  这同时核实了两件事：(a) ADT (7) 与 GS (20) 只差整体归一 −96；
  (b) GS (20) 中那两个**与 n 无关**的项（−1/32、−1/8）在 ADT 的写法里正是 Y₄X₈/768 的纯引力部分——
  即「n = 496 后剩下的两项由反项抵消」（GS 的说法）与「剩下 Y₄X₈ 交给 GS 项」（ADT 的说法）
  是同一件事的两种记账。**这是 GS 1984 与 ADT 2010 之间此前未登记的一条独立核验。**
  ⚠ 这不构成对 Alvarez-Gaumé–Witten 系数的核实——两者同源（ADT 自陈引 AGW）。

  【2. 第二处核验：ADT (7) 第一个方括号 = GS (19)】
  ADT「第一个方括号为零」⟺ Tr F⁶ = (1/48)Tr F⁴Tr F² − (1/14400)(Tr F²)³
  ⟺ math.anomaly-twelve-form-factorization 的 Ω₁₂ = (1/48)Ω₄[Ω₈ − (1/300)Ω₄²]（展开式）。
  符号与系数逐项一致，**两个独立来源相符**（抽取记录 gsw-1987-v2.md E14 备注 1 已指出，此处复核确认）。

  【3. 版本红线】(7)(8) 的系数**只在 v2 之后正确**：ADT 致谢逐字感谢 Yuji Tachikawa 指出早期版本
  这两式系数有误。本推导引用的一切式号与系数均按 arXiv:1006.1352**v2**。
