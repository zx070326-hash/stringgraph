summary: |
  ADT 的论证分三步，全部在十维有效场论侧。

  **第一步（因子化）。** 把 Î₁₂ 写成 (7)。对 G = U(1)⁴⁹⁶ 与 G = E₈ × U(1)²⁴⁸：
  U(1) 的伴随表示是单态，故一切含阿贝尔生成元的伴随迹 Tr 为零，(7) 的第一个方括号
  「for U(1)⁴⁹⁶ it is simply zero term by term」，对 E₈ × U(1)²⁴⁸ 则阿贝尔生成元全部退出、
  E₈ 一支满足与 E₈ × E₈ 同一条关系；又两者都有 n = 496，第二个方括号为零。
  于是 Î₁₂ = Y₄X₈/768，形式上与 SO(32)、E₈ × E₈ 一样「可以用 GS 机制」。

  **第二步（阿贝尔没有反常可消）。** 规范微子与规范场的耦合只通过结构常数
  （(14) Dχ^a = ∂χ^a − i f^{abc}A^b χ^c）。U(1) 的 f^{abc} = 0 ⇒ 阿贝尔规范场与规范微子解耦，
  **根本不进六边形图**，故反常多项式与阿贝尔场强无关——这与第一步中阿贝尔伴随迹为零是同一件事。
  相应地 Y₄、X₈ 里的阿贝尔迹全部消失，对 U(1)⁴⁹⁶ 剩下 (15) Y₄ = tr R²、X₈ = tr R⁴ + (tr R²)²/4。

  **第三步（但超对称仍强制阿贝尔 CS 项，于是 GS 项破坏阿贝尔规范不变性）。**
  按 Bergshoeff 等人的结果，每个 U(1)^{(i)} 都给 H₃ 贡献 ω₃^{(i)} = A^{(i)} ∧ dA^{(i)}（(16)）。
  H₃ 的动能项规范不变要求 B₂ 移动：(17) δ_Λ B₂ = Σ_i Λ^{(i)}F^{(i)}。
  但抵消引力反常又必须保留 GS 项 ∫B₂ ∧ X₈，其阿贝尔变分
  (18) δ_Λ∫B₂ ∧ X₈ = ∫Σ_i Λ^{(i)}F^{(i)} ∧ X₈ 无处可消（第二步说没有阿贝尔反常）。
  等价的判据是 (19) **Y₄ ≠ dH₃**：GS 机制成立的关键关系 (13) Y₄ = dH₃ 在这里失效，
  因为阿贝尔场退出 Y₄（不进六边形）却被超对称留在 dH₃ 里；
  ADT 逐字说这在反常多项式里表现为「tree-level contributions of the form F²R⁴ … which do not
  correspond to any one-loop anomalies」。
  结论：保阿贝尔规范不变性与保局域洛伦兹不变性二者不可得兼。

  **档位理由**：全程是反常多项式 + 下降关系 + 反项规范变分的标准场论操作，
  系数外包给指标定理计算，超对称约束外包给未取得的文献；ADT 自己在关键处用的动词是 "we argue"。
  按 docs/STATUS_LEVELS.md，这是典型的 physical-argument，不是 rigorous。
