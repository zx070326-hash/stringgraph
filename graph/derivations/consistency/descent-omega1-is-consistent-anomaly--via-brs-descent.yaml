    loc: "(4.1)–(4.4)（X_i、其代数、G_i = X_i W[A]、相容条件）；(4.6)(4.7)（鬼场写法）；(4.8)–(4.11)（δA、δv、δ(v·G) = 0、δ² = 0）；(4.13)–(4.15)；p.28「It should be clear that (4.8), (4.9) are nothing but the BRS-transformations and (4.10) the Slavnov identity for the special case of currents.」；p.29「Hence the δ defined in (4.14), (4.15) and the d in (4.17) fulfill the algebra (3.25) (3.26) and will be identified with those operators.」；(4.17)(4.18) 与结论句「We see that ω¹_{2n−2} is linear in v and satisfies the consistency condition.」；引导句「What remains to be shown is thus only that (4.17) can be identified with …」"
