summary: |
  GS 的论证按三类反常分三段，最后合起来。

  **(A) 纯 Yang–Mills 反常。**
  1. 由 (12c)，Ω₁₂ = (N + 32l) tr F⁶ + 15 tr F² tr F⁴。第一项（单迹六阶）对应的反常
     **不能**由局域反项抵消，但取 SO(32)（N = 32, l = −1）时它的系数为零
     （math.tr-f6-coefficient-vanishing）。
  2. 剩下的 tr F² tr F⁴ 项是可分解的：(14) 给 tr F² tr F⁴ = d(ω⁰_{3Y} tr F⁴) = d(ω⁰_{7Y} tr F²)。
     由下降方程 (15)(16)，对应的相容反常是
        G = c ∫ ( ⅓ ω¹_{2Y} tr F⁴ + ⅔ ω¹_{6Y} tr F² )                     (17)
     两项之比由 Bose 对称性唯一确定；常数 c 由 refs. [3,9] 定（本文不算）。
  3. 加入反项 S₁ = c ∫ ( B tr F⁴ + ⅔ ω⁰_{3Y} ω⁰_{7Y} )                     (18)。
     因为 (9c) 给 δB = −tr(A dΛ) + tr(ω dΘ)，B 的非平凡 Λ 变换使 δS₁ 与 G 对消。
     GS 逐字：「This amounts to a complete cancellation of the Yang–Mills anomaly for the gauge
     group SO(32).」
  4. 机制的树图图像（GS fig. 1）：B tr F⁴ 顶点经 B 传播子接到 (1) 的 H² 项里的 ω⁰_{3Y} dB 顶点，
     给出六规范场树振幅的反常片，与 (18) 第二项一起抵消六边形反常。

  **(B) 纯引力反常。**
  5. (20) 的 tr R⁶ 项要求 n = 496（consistency.gravitational-anomaly-requires-496-fermions）；
     SO(32) 的伴随维数正是 496。
  6. 取 n = 496 后 (20) 仍剩 −(1/32)(tr R²)³ − ⅛ tr R² tr R⁴，由
        S₂ = −c ∫ ( (1/32) B (tr R²)² + ⅛ B tr R⁴ + (1/12) ω⁰_{3L} ω⁰_{7L} )      (21)
     抵消，机制与 (A) 相同，只是换成 (9c) 里 B 的 **Θ**（局域洛伦兹）变换那一项。
     GS 由此得出他强调的对称结论：「not only does the cancellation of the Yang–Mills anomaly
     require coupling to the supergravity multiplet, but also the cancellation of the gravitational
     anomalies requires the contributions of Yang–Mills supermultiplets.」

  **(C) 混合反常。**
  7. 上面两批反项本身还会贡献混合反常（例如 (18) 里 B 的洛伦兹变换）。SO(32) 的混合反常十二形式是
        − tr R² [ tr F⁴ + ⅛ (tr F²)² ] + tr F² [ ⅛ tr R⁴ + (5/32)(tr R²)² ]        (22)
     （相对归一化取自 AGW eq. (63)；GS 明说 (14)(20)(22) 三者是按正确的相对归一化给出的）。
  8. 它由
        S₃ = c ∫ ( ⅛ B tr R² tr F² + (1/48) ω⁰_{3L} ω⁰_{3Y} tr R² − (1/24) ω⁰_{3Y} ω⁰_{3L} tr F²
                   − ⅔ ω⁰_{3L} ω⁰_{7Y} + (1/12) ω⁰_{3Y} ω⁰_{7L} )                   (23)
     抵消，而抵消**要求** N + 8l = 24 与 N + 2l = 30（即 (12b)(12a) 的两个系数取定值），
     两式在 l = −1 时都给 N = 32（math.mixed-anomaly-trace-conditions-n32）。
     GS 称此为对 SO(32) 的「两次独立确认」。

  **合并**：修改 H（加 −ω⁰_{3L}）并加入 S₁ + S₂ + S₃，则单圈的规范、引力、混合反常全部抵消。
