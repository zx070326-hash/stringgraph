  - "有效场论截断本身：GS 逐字承认「any truncation of the complete string theory is probably not fully consistent」。"
  - "(A)4 的树图机制要用到 GS (1) 的 S₀（H² 项），本图未建该定义卡。"
notes: |
  【本推导的 status 为何是 physical-argument】这是标准的物理学家式反常计算：形式的十二维多项式、
  下降方程、圈图与树图的反常片对消，没有任何一步在本图里被严格化，且核心数值输入来自未取得的文献。
  按 docs/STATUS_LEVELS.md 第 3 级。

  【与 math.* 三条算术节点的分工】图里刻意把「N = 32 从哪来」拆成三条纯代数节点
  （tr F⁶ 系数、混合反常两方程、因子化恒等式），使得**即使物理层长期停在 physical-argument，
  代数层仍可独立升到 rigorous / formalized**。这是 Phase 2 Lean 岛的设计意图。
