summary: |
  GS 的论证按三类反常分三段，最后合起来。

  **(A) 纯 Yang–Mills 反常。**
  1. 由 (12c)，Ω₁₂ = (N + 32l) tr F⁶ + 15 tr F² tr F⁴。第一项（单迹六阶）对应的反常
     **不能**由局域反项抵消，但取 SO(32)（N = 32, l = −1）时它的系数为零
     （math.tr-f6-coefficient-vanishing）。
  2. 剩下的 tr F² tr F⁴ 项是可分解的：(14) 给 tr F² tr F⁴ = d(ω⁰_{3Y} tr F⁴) = d(ω⁰_{7Y} tr F²)。
     由下降方程 (15)(16)，对应的相容反常是
        G = c ∫ ( ⅓ ω¹_{2Y} tr F⁴ + ⅔ ω¹_{6Y} tr F² )                     (17)
     两项之比由 Bose 对称性唯一确定；常数 c 由 refs. [3,9] 定（本文不算）。
  3. 加入反项 S₁ = c ∫ ( B tr F⁴ + ⅔ ω⁰_{3Y} ω⁰_{7Y} )                     (18)。
     因为 (9c) 给 δB = −tr(A dΛ) + tr(ω dΘ)，B 的非平凡 Λ 变换使 δS₁ 与 G 对消。
     GS 逐字：「This amounts to a complete cancellation of the Yang–Mills anomaly for the gauge
     group SO(32).」
  4. 机制的树图图像（GS fig. 1）：B tr F⁴ 顶点经 B 传播子接到 (1) 的 H² 项里的 ω⁰_{3Y} dB 顶点，
     给出六规范场树振幅的反常片，与 (18) 第二项一起抵消六边形反常。

  **(B) 纯引力反常。**
  5. (20) 的 tr R⁶ 项要求 n = 496（consistency.gravitational-anomaly-requires-496-fermions）；
     SO(32) 的伴随维数正是 496。
  6. 取 n = 496 后 (20) 仍剩 −(1/32)(tr R²)³ − ⅛ tr R² tr R⁴，由
        S₂ = −c ∫ ( (1/32) B (tr R²)² + ⅛ B tr R⁴ + (1/12) ω⁰_{3L} ω⁰_{7L} )      (21)
     抵消，机制与 (A) 相同，只是换成 (9c) 里 B 的 **Θ**（局域洛伦兹）变换那一项。
     GS 由此得出他强调的对称结论：「not only does the cancellation of the Yang–Mills anomaly
     require coupling to the supergravity multiplet, but also the cancellation of the gravitational
     anomalies requires the contributions of Yang–Mills supermultiplets.」

  **(C) 混合反常。**
  7. 上面两批反项本身还会贡献混合反常（例如 (18) 里 B 的洛伦兹变换）。SO(32) 的混合反常十二形式是
        − tr R² [ tr F⁴ + ⅛ (tr F²)² ] + tr F² [ ⅛ tr R⁴ + (5/32)(tr R²)² ]        (22)
     （相对归一化取自 AGW eq. (63)；GS 明说 (14)(20)(22) 三者是按正确的相对归一化给出的）。
  8. 它由
        S₃ = c ∫ ( ⅛ B tr R² tr F² + (1/48) ω⁰_{3L} ω⁰_{3Y} tr R² − (1/24) ω⁰_{3Y} ω⁰_{3L} tr F²
                   − ⅔ ω⁰_{3L} ω⁰_{7Y} + (1/12) ω⁰_{3Y} ω⁰_{7L} )                   (23)
     抵消，而抵消**要求** N + 8l = 24 与 N + 2l = 30（即 (12b)(12a) 的两个系数取定值），
     两式在 l = −1 时都给 N = 32（math.mixed-anomaly-trace-conditions-n32）。
     GS 称此为对 SO(32) 的「两次独立确认」。

  **合并**：修改 H（加 −ω⁰_{3L}）并加入 S₁ + S₂ + S₃，则单圈的规范、引力、混合反常全部抵消。
gaps:
  - "★ **数值系数层整体外包**：(17) 的常数 c 与 (14)(20)(22) 的相对归一化，GS 逐字指向 alvarez-gaume-witten-1984 eq. (63)。**状态更正（2026-09-11）：该文全文已取得（L1），而它并不含常数 c**——见下面单列的那条 gap。凡本推导中出现的具体数（⅓, ⅔, 1/32, ⅛, 1/12, 1/48, 1/24, 5/32）都不可追溯到本图掌握的来源（抽取记录 Q2/Q3）。"
  - "★ 「单迹六阶项的反常不能由局域反项抵消，可分解项可以」这条判据，GS 全文无证明；本图无独立来源。(A)1 与 (B)5 两处都靠它。"
  - "(22) 只给结果，无中间步骤：GS 未展示混合反常十二形式是怎么算出来的。"
  - "δS₁ 与 G 的对消、δS₂/δS₃ 的对消，GS 都只给结论不给计算；本图未复算任何一处。"
  - "ω⁰_{7Y}、ω⁰_{7L} 只定到相差恰当形式（consistency.descent-forms-gs-notation），故 S₁、S₃ 的显式值依赖代表元选取。"
  - "★ **局部性（2026-09-11 新发现，此前从未被记录）**：本推导用到的下降方程，其唯一已核实的一手来源（zumino-1983-les-houches, p.16 末）逐字限定「Equations such as (2.24) and (2.26) are **really valid only locally, in some finite neighborhood in x-space**. It is however well known that they can be given a global meaning by using a connection on a principal fibre bundle, rather than a vector potential on the base (x-space).」而本推导里的 S₁、S₂、S₃ 与 G 都是**整个十维时空上的积分**。**green-schwarz-1984 全文没有这句话**，GS 直接在整个十维时空上写 (4)–(8)(14)–(16)。全局化所需的主丛表述本图无来源、未做。"
  - "★ **相容条件之解的唯一性无支撑（2026-09-11 新发现）**：(A)2 步「两项之比由 Bose 对称性唯一确定」与 consistency.anomaly-twelve-form-d10 里 GS 逐字的「The anomalies … are **uniquely determined** by the hexagon diagrams. Their form can be deduced by implementing the Wess–Zumino consistency conditions [8]」都依赖唯一性。但 zumino-1983-les-houches p.29 逐字：「**The problem of finding the most general solution of the consistency condition will not be discussed here.**」⇒ **Zumino 一侧不提供唯一性**。真正的唯一性（相容反常的上同调分类）属 manes-stora-zumino-1985 (CMP 102 (1985) 157) 一线，**本项目正文一字未取到**。GS 的 ref. [8] = wess-zumino-1971 本图也未取得。"
  - "**k² = 0 未证（2026-09-11 新发现）**：下降方程装置里的同伦算子 k（zumino-1983-les-houches (2.44)，满足 kd + dk = 1）的 k² = 0 在该文逐字被留作「We leave the proof as an exercise to the reader.」。**说明**：本推导实际用到的是 kd + dk = 1 与下降链本身，不使用 k² = 0；记录在此是为了不让下游误以为那套装置在来源处已闭合。"
  - "★ **常数 c 在三篇原始文献里都不以一个数的形式存在（2026-09-11 定案，替代原「AGW 未取得」的记法）**：alvarez-gaume-witten-1984 全文已取得（L1）且**确实没有 c**——(114) 逐字「apart from a factor common to the three cases」，只给相对归一；zumino-1983-les-houches §5 给的是 **2n−2 维通式 (5.13)**，**不含引力侧**，且原文在该式上方**手写插注「(up to a sign)」**、读图不可靠；ZWZ 正文未取得（L2）。⇒ **c 是 GS 自己合成的一步（AGW 相对归一 + Zumino 绝对归一），GS 未给中间步骤，本图未复算。**即使将来取到 ZWZ 正文，c 大概率仍不会以一个数出现（抽取记录 Q-Z3）。"
  - "有效场论截断本身：GS 逐字承认「any truncation of the complete string theory is probably not fully consistent」。"
  - "(A)4 的树图机制要用到 GS (1) 的 S₀（H² 项），本图未建该定义卡。"
notes: |
  【本推导的 status 为何是 physical-argument】这是标准的物理学家式反常计算：形式的十二维多项式、
  下降方程、圈图与树图的反常片对消，没有任何一步在本图里被严格化，且核心数值输入来自未取得的文献。
  按 docs/STATUS_LEVELS.md 第 3 级。

  【与 math.* 三条算术节点的分工】图里刻意把「N = 32 从哪来」拆成三条纯代数节点
  （tr F⁶ 系数、混合反常两方程、因子化恒等式），使得**即使物理层长期停在 physical-argument，
  代数层仍可独立升到 rigorous / formalized**。这是 Phase 2 Lean 岛的设计意图。
