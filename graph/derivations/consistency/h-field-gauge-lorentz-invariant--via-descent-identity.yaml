    note: 提供 H = dB + ω⁰_{3Y} − ω⁰_{3L}（(4)）与 E₈ × E₈ 的 (4′)。
  - id: consistency.b-field-gauge-lorentz-transformation
    note: 提供 δA、δω（(9a,b)）与 δB（(9c)(9c′)）。**本卡的全部内容就是这两张卡相容**。
  - id: consistency.descent-forms-gs-notation
    inferred: true
    note: |
      本推导要用的是 n = 1 的下降关系 δω⁰_{3Y} = − d ω¹_{2Y}（GS (16) 在 n = 1 的特例），
      并把 ω¹_{2Y} 取成 −tr(Λ dA)——**GS 原文没有写出 ω¹_{2Y} 的显式表达式，也没有写出
