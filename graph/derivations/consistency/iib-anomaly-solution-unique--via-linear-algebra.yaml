summary: |
  **本推导是一次有限步的整数线性代数复算**，三部分各自独立且都可机检：

  **(i) 显式线性关系 `2 r₁ + 3 r₂ − 5 r₃ = 0`**，逐分量验：
      第 1 分量：`2(−495) + 3(225) − 5(−63) = −990 + 675 + 315 = 0`
      第 2 分量：`2(1) + 3(1) − 5(1) = 2 + 3 − 5 = 0`
      第 3 分量：`2(992) + 3(−448) − 5(128) = 1984 − 1344 − 640 = 0`

  **(ii) `rank_ℚ A = 2`**，两步：
      **≤ 2**：由 (i)，三行线性相关（系数 `(2, 3, −5) ≠ 0`）⇒ `rank ≤ 2`，于是 `det A = 0`；
      **≥ 2**：`r₂` 与 `r₃` 线性无关——`r₂ − r₃ = (288, 0, −576) ≠ 0`，
        且二者不成比例（若 `r₂ = λ r₃`，由第 2 分量 `1 = λ·1` 得 `λ = 1`，
        但第 1 分量 `225 ≠ −63`，矛盾）。

  **(iii) `ker_ℚ A = span_ℚ{(2, −2, 1)}`，`ker_ℤ A = ℤ·(2, −2, 1)`**：
      由 (ii)，`dim ker_ℚ = 3 − 2 = 1`；而 `(2, −2, 1)` 在核里，逐行验：
        `r₁·(2,−2,1) = −990 − 2 + 992 = 0`
        `r₂·(2,−2,1) =  450 − 2 − 448 = 0`
        `r₃·(2,−2,1) = −126 − 2 + 128 = 0`
      ⇒ 它张成核。又 `gcd(2, 2, 1) = 1` ⇒ `(2, −2, 1)` 本原 ⇒ 整数核恰是它的整数倍。
      ⚠ **(iii) 本身由 depends_on 的 consistency.iib-gravitational-anomaly-cancels 供给**
      （那条已 formalized）；这里写出验算只是为了让三部分在同一处可读，**不是重新论证**。

  ⇒ **结论**：使三条纯引力反常条件同时成立的整数组恰为 `(2c, −2c, c)`，`c ∈ ℤ`。
  `c = 1` 即 IIB 超引力的手征含量，且**没有别的解**。

