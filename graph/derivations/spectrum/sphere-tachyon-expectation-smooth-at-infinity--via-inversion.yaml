      抽取记录与 [H] 都直接写 α'k_i² = 4，与本图约定一致。
sources:
  - ref: headrick-2008
    loc: "Problem 6.1（PDF p.40）：换片计算与「smooth at u_i = 0」的结论，逐字"
    note: |
      抽取记录 #E94，L1。**按 lead 裁决（2026-09-10），Headrick 习题解答在「对某个显式计算是
      唯一成文来源」时可作为推导 source，但 reviewer 须复核计算。** 本条即此情形，
