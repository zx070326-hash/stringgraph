  - id: worldsheet.closed-string-mass-formula
    inferred: true
    note: |
      标 inferred：提供闭弦 tachyon 的质量壳条件（本图记为 α'm² = −4，配 mostly-plus 的
      m² = −k² 即 α'k² = 4）。该节点是**光锥量子化**下的闭弦质量公式，来源（§1.4）
      与本推导的来源（§6.2 / [H] Problem 6.1）没有互相引用；把光锥谱的质量壳条件搬到
