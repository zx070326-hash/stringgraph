    note: 抽取记录 #E94，L1（(6.2.31) 是被改写的对象）。
summary: |
  逐字复算（[H] Problem 6.1 的三行）：

  z_ij = z_i − z_j = 1/u_i − 1/u_j = (u_j − u_i)/(u_i u_j)，故 |z_ij| = |u_ij| / (|u_i||u_j|)。
  于是
    ∏_{i<j}|z_ij|^{α'k_i·k_j} = ∏_{i<j}|u_ij|^{α'k_i·k_j} · ∏_i |u_i|^{−α' k_i·(Σ_{j≠i} k_j)}。
  用动量守恒 Σ_{j≠i} k_j = −k_i，指数变成 +α' k_i²，即
    ∏_{i<j}|z_ij|^{α'k_i·k_j} = ∏_{i<j}|u_ij|^{α'k_i·k_j} ∏_i |u_i|^{α'k_i²}。
  闭弦 tachyon 的质量壳条件 α'k_i² = 4 给出 ∏_i|u_i|⁴：在 u_i = 0 处是四次零点而非奇点，
  期望值光滑。故把某个 z_i 送到 ∞（u_i → 0）不产生发散，这一步合法。
gaps:
  - "**这一论证的来源是习题解答而非正文**（抽取记录 Q17 明记）：原书正文是否论证了
     「顶点算子可以放到 z = ∞」未核实，可能只留给习题 6.1。按 lead 裁决，
     **reviewer 须复核上面的换片代数**；复核后请在此写 reviewer-verified 记录。"
  - "**质量壳条件的搬运未被节点承载**（见第三条依赖的 inferred 说明）：
     从光锥谱的 α'm² = −4 到协变振幅外线的 α'k² = 4，本图没有节点。"
  - "**只覆盖 tachyon**：带 ∂X 的顶点算子换片时有额外幂次，本推导不涉及。"
  - "**路径积分测度未定义**（本批次共有的限制）：本推导只做代数改写，但被改写的对象
     (6.2.17)/(6.2.31) 本身是路径积分定义的。"
  - "**(6.2.31) 与 (6.2.17) 的关系未核实**：抽取记录把 (6.2.31) 描述为「由全纯性 + 极点结构 +
     动量守恒唯一确定的顶点算子期望值」，[H] 直接对它做换片。两式在原书中的确切关系
     （是否 (6.2.31) 就是含 ∂X 因子的推广）本图未核对。"
notes: |
  本推导是「用共形 Killing 群固定三点、其中一点取 ∞」这一操作在本图中的**唯一**支撑。
  凡使用该操作的节点（spectrum.closed-string-four-tachyon-integral、
  spectrum.open-string-four-tachyon-amplitude）都应依赖本条或在 gaps 里回指它。
