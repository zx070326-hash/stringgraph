    note: 提供欧氏作用量 S = (1/4πα')∫d²σ g^{1/2} g^{ab}∂_a X·∂_b X，「作用量只含导数」这一关键性质由它给出。
  - id: worldsheet.tree-level-worldsheet-topologies
    note: 提供 S₂ 的复坐标描述；「S₂ 紧且无边界 ⇒ ∇² 的零模只有常数」这一点用到它。
  - id: worldsheet.string-s-matrix
    note: |
      **2026-09-11 补边**（ch.5 已合入 main，原 gap 「待合入后补 depends_on 边」由此关闭）：
      提供本推导所处的框架——(5.3.9) 中对物质场 φ 的路径积分因子 ∫[dφ]e^{−S_m}∏_i ĝ^{1/2}V_{j_i}，
      即「本节算的是 S-矩阵里 X 部门的那一个因子」以及 X 与 bc 部门相乘分离的写法。
      不标 inferred：抽取记录 #E91（§6.2 的泛函积分与零模）在「文献列出的依赖」里直接写了 **E80**，
      即文献自己把 §6.2 挂在 (5.3.9) 之下。
      ⚠ 但这条依赖**不是逻辑上强制的**：原书 p.150「A note to the reader」逐字说树级测度
      可以由 (6.4.4) 下方的捷径独立得到、读者可跳过 §5.3 的 FP 各节
      （抽取记录 §5 的「A note to the reader」逐字段）。故日后可为树级链条另挂一条不经 (5.3.9) 的推导。
  - id: worldsheet.gauge-fixed-measure-moduli-and-positions
    inferred: true
    note: |
      **2026-09-11 补边**：提供「规范固定后剩余积分变量 = μ 个模 + 2n − κ 个顶点算子坐标」
      （(5.3.2)，抽取记录 E77），即 S₂ 上 μ = 0、κ = 6 时「三个坐标被固定、其余要积分」的记账，
      本推导的期望值正是在这套记账下的被积函数。
      标 inferred：§6.2 的来源（[S] §6.10–§6.11）不在原地回指 (5.3.2)，
