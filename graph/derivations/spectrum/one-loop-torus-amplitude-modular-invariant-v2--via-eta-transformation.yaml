summary: |
  **(1) τ₂|η|⁴ 的不变性：引用上游。** math.eta-modular-invariant-combination 对一切
  g ∈ SL(2,Z) 给出 Im(g·τ)|η(g·τ)|⁴ = Im τ|η(τ)|⁴，并给出 n 次幂版本；取 n = 12 即本卡
  配平里的 [τ₂|η(τ)|⁴]^{−12}。本推导不重做这一步。

  **(2) 测度的不变性：引用上游。** spectrum.torus-measure-modular-invariant 给出
  dτ'dτ̄'/(τ₂')² = dτ dτ̄/τ₂²。本推导不重做这一步（v1 在这里内联了两行验算，现已随卡搬走）。

  **(3) 合并（本推导唯一自己做的一步）。** 把 (7.3.6) 的被积表达式（含测度）改写成
    (dτ dτ̄ / 4τ₂)(4π²α'τ₂)^{−13}|η(τ)|^{−48}
      = (1/4)(4π²α')^{−13} · (dτ dτ̄ / τ₂²) · [τ₂|η(τ)|⁴]^{−12} ,
  幂次核对：τ₂ 侧 τ₂^{−2}·τ₂^{−12} = τ₂^{−14} = τ₂^{−1}·τ₂^{−13} ✓；|η| 侧 (|η|⁴)^{−12} = |η|^{−48} ✓；
  常数侧 (1/4)(4π²α')^{−13} 与 (1/4)(4π²α')^{−13} ✓。右端是「常数 × 模不变测度 × 模不变标量的幂」，
  三个因子逐个不变（常数与 τ 无关）⇒ 整体不变。
  由此在任一基本域上积分给出同一个数，特别地 F₀ 上的积分良定义。
gaps:
  - "**配平这一步原书完全不写**：原书只写两个因子各自不变，**没有**把 (7.3.6) 的被积表达式分解成
     「常数 × dτdτ̄/τ₂² × [τ₂|η|⁴]^{−12}」。summary (3) 的分解与幂次核对是本图补的算术；
     可机械核对，但**没有 reviewer 复核记录**，故按 docs/STATUS_LEVELS.md 不走 rigorous 例外条款。"
  - "**「逐个因子不变 ⇒ 乘积不变」在测度层面需要一句话**：dτdτ̄ 是 2-形式而 [τ₂|η|⁴]^{−12} 是函数，
     两者在同一点取值后相乘，故乘积的变换就是两者变换的乘积。这一步平凡但原书与本推导都未逐字写出。"
  - "**只验证了不变性，没有验证「F₀ 上积分 = 模空间上积分」**：后者还需要 F₀ 确实是基本域
     （worldsheet.modular-fundamental-domain，其边界认同在原书未严格处理；抽取记录 Q1 另记
     (5.1.15) 闭区域与 (7.3.14) 开区域不一致）。"
  - "**带顶点算子的模协变性未验证**：原书把它留作习题 7.1（抽取记录 #E7）。"
  - "**上游 spectrum.torus-measure-modular-invariant 仍是 physical-argument**（原书 'it is easy to check'，
     且本图无 reviewer 复核记录）⇒ 本推导的有效状态被它与自身共同封在 physical-argument。
     上游 math.eta-modular-invariant-combination 虽 own=formalized，但其 effective 被两张 rigorous
     定义卡压到 rigorous，**不是**本链的瓶颈。"
