    note: |
      提供 (7.4.3)/(7.4.4)：把 t → 0 的行为写成闭弦通道的展开 exp(2s) + 24 + O(exp(−2s))，
      两个危险项就是这里的前两项。
  - id: spectrum.one-loop-cylinder-amplitude
