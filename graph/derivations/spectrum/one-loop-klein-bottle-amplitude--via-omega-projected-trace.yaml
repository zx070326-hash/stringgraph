  的无质量项相加，得公共因子 i·24·V₂₆/(4π(8π²α')¹³) 与 (2¹³ ∓ n)²，与 (7.4.24) 逐字读数一致。
  这条核验同时验证了三式系数的彼此自洽（抽取者已做，本图在 tadpole 卡里引用）。
