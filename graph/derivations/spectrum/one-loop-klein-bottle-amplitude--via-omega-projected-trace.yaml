summary: |
  **(1) 算符表达式。** 无取向理论对闭弦谱作 ½(1+Ω) 投影；Klein 瓶就是迹里带 Ω 的那一项，
  相对（取向）环面多一个 ½，故测度是 dt/4t。零模与振子的分解与环面同型，给 (7.4.14)。

  **(2) 迹的计算。** Ω 交换左右动，故只有「左右处于同一状态」的态有对角元，且这些态 Ω = +1。
  于是迹**有效地只对一侧**求和（形式上与开弦谱相同），但因左右贡献相等而**权重加倍**：
  q^{h+h̃} 在对角元上变成 q^{2h}，即 η 的自变量由 it 变成 2it。得 (7.4.15)。

  **(3) 几何与长圆柱形式。** 换一个基本区（0 ≤ σ¹ ≤ π，0 ≤ σ² ≤ 4πt），两条边各自
  「平移半长 + 沿边反射」认同 = cross-cap，故 K₂ = 圆柱 + 两个 cross-cap（图 7.2(a)）。
  取 s = π/2t 并用 η 的模变换，得 (7.4.19)：i(2²⁶V₂₆)/(4π(8π²α')¹³)∫ds η(is/π)^{−24}。
  由于 t 的范围与圆柱相同，**t → 0 的发散与圆柱同型**，解释为闭弦极点（RP₂ tadpole）。
gaps:
  - "**正文没有从路径积分导出 (7.4.15)**：原书把这件事整体留作 exercise 7.13。
     本推导的 (1) 因此是「相对环面的规则修改」，不是独立推导。"
  - "**「只有左右同态有对角元且 Ω = +1」未逐项验证**：原书一句「note that the only diagonal
     elements of Ω are those for which the right- and left-movers are in the same state, and these
     states contribute with Ω = +1」，没有对鬼场部门与零模部门分别检查。"
  - "**cross-cap 态 |C⟩ 原书没给**（留作 exercise 7.15），故 (3) 的算符侧表述在本图无来源。"
  - "**(3) 依赖 η 的 S 变换**，而它在来源中零证明（math.dedekind-eta-modular-transformation）。"
  - "**整体符号与归一化**：本章 bc 部门的整体符号是人为设定的
     （worldsheet.bc-ghost-torus-partition-function 的 ⚠），Klein 瓶继承该约定。"
