id: spectrum.long-cylinder-lightest-state-count--via-q-expansion
target: spectrum.long-cylinder-lightest-state-count
kind: physical-argument
status: physical-argument
depends_on:
  - id: math.dedekind-eta-function
    note: |
      供给 η(τ) = q^{1/24}∏_{n≥1}(1 − q^n)（q = exp(2πiτ)，q^{1/24} 取该卡定死的单值分支），
      即断言 (1) 的全部输入，以及断言 (2)(3) 里 η^{−8}、η^{−12} 的展开。
      **非 inferred**：(7.4.4) 的**第一个等号**逐字就是把 η^{−24} 写成
      exp(2s)∏[1−exp(−2ns)]^{−24}，即原书在该处直接用了这个乘积式。
      ⚠ **换算（宗量与 q 的对应，本推导逐条用到）**：
        · 圆柱/Klein 瓶（(7.4.4)/(10.8.4)/(10.8.11)）宗量 τ = **is/π** ⇒ q = exp(2πi·is/π) = **exp(−2s)**；
        · Möbius 带（(10.8.18)）宗量 τ = **2is/π** ⇒ q = **exp(−4s)**，故 q^{1/2} = exp(−2s)。
      ★ 该卡 status = formalized（Lean 桥 StringFormal.Bridge.dedekindEta_eq_exp_mul_tprod），
      是本推导唯一一条不拖低状态的边。
  - id: spectrum.cylinder-closed-channel-open-closed-duality
    note: |
      供给**断言 (1) 本身**：那张卡的断言 (3) 逐字就是
      η(is/π)^{−24} = exp(2s)∏[1−exp(−2ns)]^{−24} = exp(2s) + 24 + O(exp(−2s))，
      以及换元 s = π/t 与「s 是把圆柱看成长闭弦世界线时的长度」这一读法。
      **非 inferred**：同一式 (7.4.4)，同一页（Vol.1 p. 224）。
      ⚠ **本边只借那张卡断言 (3) 的等式**，**不借**它括注里的释义
      「常数 24 是无质量闭弦态（左右各 24 个横向模在对角上的 24 个组合）」
      ——目标卡「不断言 (a)」把一切计数释义挡在断言外，见目标卡 notes 的分工段。
  - id: worldsheet.modular-invariance-requires-eight-transverse-fermions
    note: |
      供给费米迹的**记号与对象**：Z^α_β(τ) = Tr_α[q^H exp(πiβQ)] = ϑ[α/2, β/2](0,τ)/η(τ)
      （§10.7 (10.7.7a–c)）与四个迹 Z⁰₀ / Z⁰₁ / Z¹₀ / Z¹₁ 的含义（(10.7.8a–d)），
      以及「**这些迹是对一对维数取的**」这条归一化——它是断言 (2)(3) 里出现四次幂的原因
      （8 个横向费米子 = 4 对）。
      **非 inferred**：§10.8 通篇用的就是 §10.7 的这套记号，(10.8.4)/(10.8.11)/(10.8.18)
      三式里的 Z^α_β 逐字同一。
      ⚠ **只借记号，不借那张卡的结论**（「横向费米子个数是 8 的倍数」）。
      ⚠⚠ **那张卡不供给乘积展开式**：本推导第 2、3 步用的 (10.7.6)
      Tr_α(q^H) = q^{(3α²−1)/24}∏_{m≥1}[1+q^{m−(1−α)/2}][1+q^{m−(1+α)/2}]
      **在本图没有节点**（那张卡的 statement 只到 Z^α_β = ϑ/η 为止），
      ϑ 函数的三重乘积公式同样无节点（math.dedekind-eta-function 的「不断言」已写明
      「本图未建 θ 函数卡」）。⇒ 见 gaps 第一条，**这是本推导标 physical-argument 的首要理由**。
sources:
  - ref: polchinski-1998-v1
