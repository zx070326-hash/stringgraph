  - ref: polchinski-1998-v2
    loc: "§10.7, eq. **(10.7.6)**, p. 32（一般周期的迹 Tr_α(q^H) = q^{(3α²−1)/24}∏_{m=1}^∞[1+q^{m−(1−α)/2}][1+q^{m−(1+α)/2}]）与 **(10.7.7a–c)**、**(10.7.8a–d)**, pp. 32–33"
    note: |
      L1，抽取记录 literature/extractions/polchinski-1998-v2.md **#E47**。
      ⚠⚠ **本图无 (10.7.6) 的节点**（见 gaps 第一条）；本推导第 2、3 步直接从原书导入这一式。
  - ref: polchinski-1998-v2
    loc: "§10.8, eqs. **(10.8.4)**、**(10.8.11)**、**(10.8.18)** 各自的第二行与第三行, pp. 38/41/42（原书在这三处**直接写等号**把方括号里的函数换成 [16 + O(exp(−2s))]，不给展开步骤）"
    note: |
      L1，抽取记录 literature/extractions/polchinski-1998-v2-sec10-8.md **#E66**/**#E69**/**#E71**。
      ★★ **这是本推导存在的理由**：原书三处都只写结果，**展开这一步在原书里没有过程**。
      ⚠ 对照：抽取记录 §0.4(b) 复算过的是**前缀**（α' 的幂次），**不是**方括号里的展开；
      Möbius 那一支连前缀都只由 §0.4(a) 的系数相加间接验证
      （superstring-mobius-strip-amplitude-closed-channel--via-open-string-trace-with-omega
      的 gaps 第四条逐字：「⇒ 待做：复算 [Z⁰₁(2is/π)⁴Z¹₀(2is/π)⁴]/[η(2is/π)⁸Z⁰₀(2is/π)⁴] 的
      s → ∞ 展开，验证常数项确为 16（含符号）」）。**本推导第 3 步做的就是那件待做的事。**
summary: |
  把三处方括号里的函数按 q 展开，逐项核对原书印出的常数。全部计算都是有限步的幂级数乘除。

  **第 1 步（玻色弦，断言 (1)；原书在 (7.4.4) 处已写出两步，这里只是复算）**
  取 τ = is/π ⇒ q = exp(2πiτ) = **exp(−2s)**。由 η = q^{1/24}∏(1−q^n)：
    η(is/π)^{−24} = q^{−1} ∏_{n≥1}(1 − q^n)^{−24} = exp(2s) ∏_{n≥1}[1 − exp(−2ns)]^{−24}。
  展开 ∏(1−q^n)^{−24} = (1−q)^{−24}(1−q²)^{−24}⋯ = 1 + **24** q + O(q²)
  （q 的一阶只有 n = 1 的因子贡献，系数就是指数 24）。
    ⇒ η(is/π)^{−24} = exp(2s)[1 + 24 e^{−2s} + O(e^{−4s})] = exp(2s) + **24** + O(exp(−2s))。✓
  ★ **24 的组合来源**：它是指数 24 本身，即 D = 26 的**横向玻色振子个数**。

  **第 2 步（超弦：圆柱 (10.8.4) 与 Klein 瓶 (10.8.11)，断言 (2)；原书不给过程）**
  同样 τ = is/π ⇒ q = **exp(−2s)**。由 (10.7.6) 取 α = 0（NS，一对维数）：
    Z⁰₀ = q^{−1/24} ∏_{m≥1}(1 + q^{m−1/2})² ,   Z⁰₁ = q^{−1/24} ∏_{m≥1}(1 − q^{m−1/2})²
  （Z⁰₁ 的插入 exp(πiF) 把每个半整数模的贡献翻号；等价地由 Z^α_β = ϑ[α/2,β/2]/η 与 ϑ 的
   三重乘积公式得同一式）。四次幂（= 8 个横向费米子）：
    Z⁰₀⁴ − Z⁰₁⁴ = q^{−1/6} [ ∏(1 + q^{m−1/2})⁸ − ∏(1 − q^{m−1/2})⁸ ]。
  记 x = q^{1/2}。∏_{m≥1}(1 ± x^{2m−1}) = 1 ± x + O(x³)（相异奇数部分的分拆母函数），故
    ∏(1 + q^{m−1/2})⁸ = 1 + **8**x + 28x² + O(x³) ,  ∏(1 − q^{m−1/2})⁸ = 1 − **8**x + 28x² + O(x³)，
  两者之差 = **16** x + O(x³) = 16 q^{1/2} + O(q^{3/2})（x² 项的 28 **逐项相消**）。
  又 η(is/π)^{−8} = q^{−1/3} ∏(1 − q^n)^{−8} = q^{−1/3}[1 + O(q)]。相乘，q 的幂次
  −1/3 − 1/6 + 1/2 = **0** 恰好抵消：
    η^{−8}[Z⁰₀⁴ − Z⁰₁⁴] = **16** + O(q) = **16** + O(exp(−2s))。✓ 与原书印出的一致。
  ★ **16 的组合来源：16 = 2 × 8**——两个乘积在 x 一阶的系数 ±8 相减，8 是**横向世界面
  费米子的个数**。⚠ 这是一条组合来源，**不是**「无质量态的个数」（目标卡「不断言 (a)」）。

  **第 3 步（超弦：Möbius 带 (10.8.18)，断言 (3)；原书不给过程，本图此前也未做）**
  这里宗量是 **2is/π** ⇒ q = **exp(−4s)**，故 q^{1/2} = exp(−2s)。
  由 (10.7.6) 取 α = 1（R，一对维数）：
    Z¹₀ = q^{1/12} ∏_{m≥1}(1 + q^m)(1 + q^{m−1}) = **2** q^{1/12} ∏_{m≥1}(1 + q^m)²
  （m = 1 的因子 (1 + q⁰) = 2 就是 R 扇区基态的二重简并）。于是
    Z¹₀⁴ = **16** q^{1/3} ∏(1 + q^m)⁸ = 16 q^{1/3}[1 + O(q)] ,
    Z⁰₁⁴ = q^{−1/6}[1 − 8q^{1/2} + O(q)] ,  Z⁰₀⁴ = q^{−1/6}[1 + 8q^{1/2} + O(q)] ,
    η(2is/π)⁸ = q^{1/3}[1 + O(q)]。
  代入：
    [Z⁰₁⁴ Z¹₀⁴] / [η⁸ Z⁰₀⁴]
      = ( q^{−1/6}·16 q^{1/3} ) / ( q^{1/3}·q^{−1/6} ) · [1 − 8q^{1/2} + O(q)]/[1 + 8q^{1/2} + O(q)]
      = **16** · [1 − 16 q^{1/2} + O(q)]
      = **16** + O(q^{1/2}) = **16** + O(exp(−2s))。✓ 与原书印出的一致。
  ★ 这里的 **16 来自 R 扇区基态简并的四次幂 2⁴ = 16**，与第 2 步那个 16（= 2 × 8）
  **是两条不同的组合路径给出的同一个数**；原书对此不作任何评论，本图**不断言**两者同源
  （目标卡「不断言 (c)」的同款保留）。

  **为什么标 physical-argument（三条，按弱到强排）**
  (1) ★ **本推导第 2、3 步用的乘积展开式在本图没有节点**：(10.7.6) 与 ϑ 的三重乘积公式
      都只是从原书/标准文献导入的（见 gaps 第一条）。这是主因。
  (2) **上游对象本身在路径积分层面**：Z^α_β 是世界面费米子的单圈迹，
      worldsheet.modular-invariance-requires-eight-transverse-fermions 自身是 physical-argument
      （其推导封顶理由是原书 §10.7 开头逐字的 'We make the guess, correctly it will turn out'）；
      spectrum.cylinder-closed-channel-open-closed-duality 同样是 physical-argument。
      ⇒ 即使本推导标 rigorous，目标卡的 effective 也会被这两条边压回 physical-argument。
  (3) **本推导未经 reviewer 独立复核**。按 docs/STATUS_LEVELS.md 的 rigorous 例外裁决
      （2026-09-10），有限步初等计算要标 rigorous 必须有 `reviewer-verified: <agent>, <date>`；
      本推导没有。⇒ **升级路径很短**：若 reviewer 复核上面三步（都是可手算的幂级数运算）
      并在 notes 里留下该记录，本推导可升到 rigorous；但由 (2)，目标卡的 effective 不会随之上升，
      除非上游两张卡也升级。
gaps:
  - "**乘积展开式在本图没有节点（本推导的主缺口）**：第 2、3 步用的
     **(10.7.6)** Tr_α(q^H) = q^{(3α²−1)/24}∏_{m≥1}[1+q^{m−(1−α)/2}][1+q^{m−(1+α)/2}]
     是从原书 §10.7 p.32 直接导入的；本图的
     worldsheet.modular-invariance-requires-eight-transverse-fermions 只写到
     Z^α_β = Tr_α[q^H exp(πiβQ)] = ϑ[α/2,β/2](0,τ)/η(τ) 为止，**不含乘积式**。
     等价路线（由 ϑ 的**三重乘积公式**展开）同样无节点：math.dedekind-eta-function 的
     「本卡不断言什么」逐字写着「**本图未建 θ 函数卡**」。
     ⇒ 待建（两条都是纯数学、且是 Mathlib 有望覆盖的对象）：
       · math.jacobi-theta-triple-product（ϑ₀₀/ϑ₀₁/ϑ₁₀ 的乘积公式）；
       · worldsheet.free-fermion-sector-trace-product（(10.7.6)，一般周期自由费米子的迹）。
     在那之前，本推导第 2、3 步的起点是**从原书导入的公式**，不是图内可追溯的对象。"
  - "**q^{1/2} 这个分数幂的分支本推导未单独处理**：第 2、3 步里 x = q^{1/2}（NS 扇区的半整数模）
     与 q^{1/12}、q^{−1/6} 等分数幂都按 τ 在上半平面上的单值分支取
     （math.dedekind-eta-function 对 q^{1/24} 做了同样的约定并写明了理由）。
     本推导沿用该约定但**没有逐个重述**；三处宗量都是**纯虚**的（is/π、2is/π，s > 0），
     故 q ∈ (0,1) 是正实数，分数幂取正实根，实际上没有分支歧义。⇒ 这条是形式上的保留，不是实质缺口。"
  - "**第 2 步里 Z⁰₁ 的符号约定按 (10.7.7c)/(10.7.8b) 的裸费米数取**：即
     Z⁰₁ = Tr_NS[exp(πiF)q^H] 在 NS 基态上取 **+1**，而 (10.7.9) 里第二项的负号是**显式写出来的**
     （抽取记录 polchinski-1998-v2.md#E47 逐字：'the minus sign in the second term is from the
     **ghost contribution** to exp(πiF)'）。本推导用的是这个约定，与 (10.8.4)/(10.8.11) 方括号里
     [Z⁰₀⁴ − Z⁰₁⁴] 的写法自洽（复算给出 +16，与原书印出的 +16 同号）。
     ⚠ 若有人改用「exp(πiF) 含鬼场贡献」的另一套约定，Z⁰₁ 要整体翻号，展开式随之改变；
     本推导**不**覆盖那套约定。"
  - "**本推导只验证常数项，不验证高阶项**：三步都只算到足以定出常数项的阶，
     O(exp(−2s)) 里的系数未算（目标卡「不断言 (f)」）。"
  - "**本推导不碰任何前缀**：V₁₀/(8π(8π²α')⁵)、2¹⁰、±2n·2⁵ 都在三张振幅卡上，
     其 α' 幂次的裁决见 sec10-8.md §0.4(b) 与 §6。本推导只处理方括号里的函数。"
notes: |
  ★★★【本推导同时关闭了 Möbius 卡的一条待做项（curator，2026-09-11，small-backlog-13）】
  worldsheet.superstring-mobius-strip-amplitude-closed-channel--via-open-string-trace-with-omega
  的 gaps 第四条逐字写着：
    「⇒ 待做：复算 [Z⁰₁(2is/π)⁴Z¹₀(2is/π)⁴]/[η(2is/π)⁸Z⁰₀(2is/π)⁴] 的 s → ∞ 展开，
      验证常数项确为 16（含符号）。」
  **本推导第 3 步做的就是这件事**，结果与原书印出的 +16 一致（符号也一致）。
  ⚠ 但那条 gap 里还有一句「超弦这里不出现同款表观矛盾 … 这条自洽性是由系数相加读出的，
  不是逐项验证的」——**那说的是 (10.8.18) 的 ± 与 (10.8.19) 的 ∓ 之间的关系，本推导不涉及**，
  故那条 gap 只关闭「常数项 = 16」这一半。

  ★【三个 16 的组合来源不同，这是本推导最值得记住的一条】
    · 圆柱 / Klein 瓶：16 = **2 × 8**（两个半整数模乘积在 q^{1/2} 阶上的系数 ±8 相减，
      8 = 横向世界面费米子个数）；
    · Möbius 带：16 = **2⁴**（R 扇区基态二重简并的四次幂，四次幂来自「迹对一对维数取」）。
  **原书对这两条路径都不作评论，也从不说这两个 16 为什么相等。**
  ⇒ 目标卡「不断言 (c)」把「本图的各个 16 同源」挡在断言外，正是为这一点留的余地。
  （这与抽取记录 #E74 §Q5 记的「三个各自独立出处的 2⁵ = 32 没有任何书解释为什么相等」
   是同一类现象，可一并交给 lead 作为开放问题。）

  【为什么本推导把玻色与超弦放在同一条推导里】目标卡把两者写成一条命题（lead 派工单的要求），
  理由是它们在图上的用途相同：给三条此前挂在 worldsheet.type-ii-massless-spectrum 上的
  inferred 边一个正确的落点。⚠ **如果 reviewer 认为「一个节点一个命题」要求把 24 与 16 拆开**，
  拆法是现成的：断言 (1) 已完全由 spectrum.cylinder-closed-channel-open-closed-duality 承载，
  目标卡可换代为只含 (2)(3) 的超弦版。**已列入交 lead 的报告。**

  按抽取记录 polchinski-1998-v1-ch7.md **#E30**/**#E31**（(7.4.4)–(7.4.6)）、
  polchinski-1998-v2.md **#E47**（(10.7.6)–(10.7.9)）、
  polchinski-1998-v2-sec10-8.md **#E66**/**#E69**/**#E71**（三处 [16 + O(exp(−2s))]）建立。
  curator，2026-09-11。
