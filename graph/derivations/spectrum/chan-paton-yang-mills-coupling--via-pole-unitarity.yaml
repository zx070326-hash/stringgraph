  - id: spectrum.massless-open-pole-requires-chan-paton
    note: |
      提供本推导的出发点：α's = 0 的极点只在配上不相消的 Chan–Paton 迹时才存在，
      其留数正比于 tr(λ^{a₁}[λ^{a₂}, …])。没有这一条，就没有可比较的规范玻色子极点。
  - id: spectrum.four-tachyon-factorization-disk-normalization
    note: 提供 C_{D₂} = 1/(α'g_o²)（[H] Problem 6.7 明写「using (6.4.14)」）与因子化的比较手法。
  - id: spectrum.open-string-four-tachyon-amplitude
    note: 提供带 Chan–Paton 的四点振幅 (6.5.6) 所依据的积分表达式。
  - id: worldsheet.state-operator-isomorphism
    inferred: true
    note: |
      标 inferred：承载 (1) 末句「态-算子对应给出同一归一化」。
      [H] 逐字说「The state-operator mapping gives the same normalization」，
      但没有给出该映射的形式，也没有回指本图 state-operator-isomorphism 的来源（§2.8）。
      这条边是本图补出的指认。⚠ 按抽取记录 Q18，这是态-算子对应在本章的**第二类**用法
      （定顶点算子归一化），与第三类（Hilbert 空间形式）强度不同，不得混挂。
