summary: |
  **(1) 留数比较（[H] Problem 6.7 的路线）。** 带 Chan–Paton 的四 tachyon 振幅 (6.5.6)
  在 α's = 0 处的极点留数（用 (6.4.17) 的展开与 (6.4.20) 的 Beta 表示，配 (6.4.14) 的 C_{D₂}）
  与「两个 tachyon–tachyon–规范玻色子三点振幅 (6.5.10)/(6.5.12) 经无质量矢量传播子相接」
  的结果相比较。完备性关系 (6.5.9)（对中间态极化求和）用在中间态求和上。
  两侧系数相等给出 **g'_o = g_o/√(2α')**，即 (6.5.14)。

  **(2) 三点振幅的形式。** 同一比较给出
  S_{D₂} = −i g'_o (2π)²⁶δ²⁶(Σk)(e₁·k₂₃) tr(λ^{a₁}[λ^{a₂},λ^{a₃}])，
  其中的对易子结构直接说明中间态按伴随表示组织，f^{abc} = tr([λ^a,λ^b]λ^c)。

  **(3) 低能极限。** 把 (2) 与四规范玻色子振幅在 α' → 0 展开，领头项与 Yang–Mills 的
  三点/四点树图逐项对应（[H] Problem 6.9(b)：「this single string theory diagram reproduces,
  at momenta small compared to the string scale, the sum of the field theory Feynman diagrams」）。
  本推导只作定性记录，不写有效作用量的表达式（那些式号只到 L2）。
gaps:
  - "**主要来源是习题解答**：按 lead 裁决，headrick-2008 在此作为唯一成文来源使用，
     **reviewer 须复核 (1)(2) 的系数比较**；复核后请在此写 reviewer-verified 记录。"
  - "**「中间态传播子 + 极化求和」在本图没有定义**：与
     spectrum.four-tachyon-factorization-disk-normalization 同一缺口——因子化的右端用的是
     场论类比，不是本图已定义的对象。(6.5.9) 的完备性关系本图也没有节点。"
  - "**(3) 的表达式未核实**：(6.5.15)/(6.5.16)/(6.5.18) 只到 L2；[H] 那句结论是他自己的措辞。
     本推导只作定性陈述。"
  - "**态-算子对应的那一句只有 [H] 背书**（见第五条依赖的 inferred 说明）：
     他说「state-operator mapping gives the same normalization」但没写出映射；
     本图无法核实这一步的细节。"
  - "**路径积分测度未定义**（本批次共有）。**上游 ch5 节点已于 2026-09-11 进入 main**：
     本推导不直接用 (5.3.9)，它对 (5.3.9) 的依赖经上游的开弦振幅节点
     （spectrum.open-string-three-tachyon-amplitude / spectrum.open-string-four-tachyon-amplitude）传递，
     那两条推导的 depends_on 尚未补上该边（TODO：curator 下一轮）。"
  - "**幺正性本身没有节点**：本推导所说的「幺正性定出耦合」，实际做的是**要求**因子化成立
     并据此定归一化，不是从一条已建立的幺正性陈述出发。"
