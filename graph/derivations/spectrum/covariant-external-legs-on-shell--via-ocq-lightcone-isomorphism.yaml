summary: |
  记外线顶点算子为 V，其对应态为 |V⟩（worldsheet.state-operator-isomorphism），
  |V⟩ 落在动量 k、level N 的扇区。

  **(1) 开弦：权 1 ⟹ α'k² = 1 − N。**
  按态-算子同构，「V 是权 1 的主场」等价于「L_n|V⟩ = 0 (n > 0) 且 L_0|V⟩ = |V⟩」，
  即 |V⟩ 是 OCQ 物理态且截距取 a = 1（worldsheet.old-covariant-physical-states 的
  (L_0 − a)|ψ⟩ = 0 在 a = 1 上）。这正是原书 p.125 那句的内容：
  「(4.1.22) 要求物质态的权为 1 ⟹ 顶点算子是权 1（或 (1,1)）张量」，
  且原书自己把它与 A = −1 挂钩（conv.intercept-sign-a：A = −1 ⟺ a = 1）。
  在动量 k、level N 的扇区上 L_0 是标量 α'k² + N 的乘法
  （worldsheet.open-string-l0-equals-level-plus-mass，原书 (4.1.11a)），于是
    α'k² + N = 1 ⟺ α'k² = 1 − N，
  配 conv.metric-mostly-plus 的 m² = −k² 得 **α'm² = N − 1**。
  N = 1 的实例由 worldsheet.physical-states-level-one 逐字给出（= 原书 (4.1.16)）；
  N = 0 的实例由 worldsheet.exponential-vertex-operator-weight 独立核对（边界权 h = α'k² = 1）。

  **(2) 闭弦：权 (1,1) ⟹ α'k²/4 = 1 − N 与 N = Ñ。**
  同一步骤走两遍（全纯、反全纯各一份）。唯一的差别是零模归一化：闭弦
  α^μ_0 = ᾱ^μ_0 = (α'/2)^{1/2} k^μ（worldsheet.closed-string-mode-expansion），
  故 (1/2)α_0·α_0 = α'k²/4，L_0 = α'k²/4 + N、L̃_0 = α'k²/4 + Ñ。
  两条条件 L_0|V⟩ = L̃_0|V⟩ = |V⟩ 相**减**给 N = Ñ（协变形式的 level matching），
  相**加**（或任取一条）给 α'k²/4 = 1 − N，即 **α'm² = 4(N − 1)**。
  N = 0 由 worldsheet.exponential-vertex-operator-weight 核对（体内权 (α'k²/4, α'k²/4) = (1,1)）。

  **(3) 与光锥谱比较：允许动量集合相同。**
  光锥一侧 worldsheet.open-string-mass-shell 给 α'm² = N − a，取 a = 1 与 (1) 逐字相同；
  worldsheet.closed-string-mass-formula 在 a = ã = 1 且 level matching（worldsheet.closed-string-level-matching）
  下给 α'm² = 4(N − 1)，与 (2) 逐字相同。注意两侧的 N 指的都是横向/全部振子的能级，
  在 (4) 的同构下互相对应。

  **(4) 与光锥谱比较：每个允许动量上的态也相同。**
  仅有 (3) 还不够——(3) 只说「质量值的集合相同」，不说「简并度相同」。
  补上这一半的是 H_OCQ ≅ H_light-cone（原书 (4.1.20)，证明在 §4.4 (4.4.21)）；
  本图由 worldsheet.no-ghost-theorem-v4 的同构半承载：D = 26、a = 1 时逐动量塔上
  H_phys/H_0 与 24 个横向 DDF 振子的 Fock 空间等距同构，而后者就是光锥谱的态空间。

  **结论。** 在 (D, a) = (26, 1) 时，「协变振幅外线上壳」与「光锥质量壳」是同一组条件，
  故下游（第 6 章）的振幅推导可以直接引用光锥谱的质量值。
gaps:
  - "**「权 1 ⟹ 积分后的顶点算子共形不变 ⟹ 振幅良定义」这一步本图无节点**：
     原书把它作为 §3.6 的条件引用（p.125 逐字「This agrees with the condition from section 3.6
     that the integrated vertex operator be conformally invariant」），本推导**把外线的权条件
     当作定义性要求接受下来**，不证明它。这是本推导标 physical-argument 的首要理由。"
  - "**(4.1.20) 的证明（§4.4）不严格**：原书用「lower triangular matrices 的一般性质」
     从 Ker(S+U) 过到 Ker S，而 (4.4.19) 的级数 (1 − S^{−1}U + S^{−1}US^{−1}U − …)|ψ_0⟩
     在无穷维 Fock 空间上是否终止/收敛，抽取记录明记**需要论证**，原书未给。
     本推导只用其结论（经 worldsheet.no-ghost-theorem-v4，该节点另有 Goddard–Thorn 的严格来源），
     但「原书路线」这一支继承该缺口。"
  - "**闭弦一侧的同构本图无节点**：worldsheet.no-ghost-theorem-v4 是**单组振子**（开弦）的
     Goddard–Thorn 版本。闭弦的 H_OCQ ≅ H_light-cone 在本推导第 (4) 步里是按
     「左右两份 + level matching」**类比**得到的，没有节点承载。
     ⚠ 这是本推导闭弦分支最实质的缺口，建议 lead 记入待建清单
     （候选：`worldsheet.no-ghost-theorem-closed` 或把 v4 推广到两组振子）。"
  - "**「每个物理态都有一个权 1 的顶点算子」的满射性未论证**：本推导只断言 L_0 本征值的条件，
     不给激发态顶点算子的显式形式。满射性来自态-算子同构，而后者在本图中是
     **路径积分构造**而非被证明的定理（见 worldsheet.state-operator-isomorphism 的 notes）。"
  - "**零模态（null states）在振幅中的解耦未论证**：原书的物理空间是商 H_OCQ = H_phys/H_null
     ((4.1.10))，但「振幅只依赖商的等价类」本图与本推导都不断言。
     若不解耦，本卡的『态的个数相同』（第 (4) 步）在振幅层面的意义要打折扣。"
  - "**路径积分测度未定义**（与 spectrum 区其它节点共有）：(5.3.9) 与态-算子同构都建立在
     未定义的路径积分上。"
notes: |
  **下游改挂 inferred 边的判据（本卡建立时由 curator 写下，供 reviewer 检查）**：
  spectrum 区原有一批边指向 worldsheet.open-string-mass-shell / worldsheet.closed-string-mass-formula
  并标 `inferred: true`，理由都是「§6 与 §1 不互相引用；把光锥谱的质量壳用作协变振幅外线条件本图无节点」。
  本卡建立后：
  - 若下游只用到「某个 α'k² 的数值就是某能级的上壳条件」（tachyon 的 α'k² = 1 / 4、
    无质量能级的 α'k² = 0 等），该边**改挂本卡**并**撤销 inferred**——本卡就是该步的来源。
  - 若下游还额外用到本卡【不断言】里的内容（例如「中间态」的上壳、极点留数的幺正性解释），
    那部分**不由本卡承载**，相应说明留在该推导的 gaps 里。
  - 与光锥谱本身的边（open-string-mass-shell / closed-string-mass-formula）在下游可以撤掉，
    因为本卡已把它作为自己的依赖显式接住。

  **本推导不使用无鬼定理的半正定性 (1a)**，只用同构 (1b)。这一点对下游有意义：
  依赖本卡的振幅推导不因此继承「内积正定」的断言。
