    note: 提供待算的复积分 ∫_C d²z |z|^{−α'u/2−4}|1−z|^{−α't/2−4} 与前因子 g_c⁴C_{S₂}（C_{S₂} 作符号）。
  - id: spectrum.sphere-normalization-from-factorization
    note: 提供 C_{S₂} = 8π/(α'g_c²)（(6.6.8)），使前因子合成 8πg_c²/α'。
