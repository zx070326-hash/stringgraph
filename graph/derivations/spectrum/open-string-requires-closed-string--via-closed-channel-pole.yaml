status: physical-argument
depends_on:
  - id: spectrum.cylinder-tadpole-divergence-is-infrared
    note: |
      提供 k^μ = 0 时的 1/0 型发散及其「两个 tadpole 夹一个闭弦传播子」的机制；
      本卡做的事就是把它推广到 k^μ ≠ 0，从而把发散变成极点。
  - id: spectrum.cylinder-closed-channel-open-closed-duality
    note: 提供大 s 渐近展开，(7.4.10) 的 exp(−α'k²s/2) 就是给这个展开加的动量因子。
  - id: spectrum.amplitude-poles-from-vertex-operator-ope
    inferred: true
    note: |
      **inferred: true**。「振幅在 k² = m² 处的极点 ⟺ 存在该中间态」这一判据在本图的落点
      是树级那张卡（第 6 章，由 OPE 读出极点）。原书在 §7.4 这里**不引任何式号**，
      只说「a resonance corresponding to propagation over long spacetime distances」。
      单圈的通道分解与树级的 OPE 极点不是同一个论证，故标 inferred。
sources:
