    note: 抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E34，L1（原书页图逐字）。
summary: |
  给圆柱两端加开弦顶点算子后，从一条边界流向另一条的时空动量 k^μ 一般不为零。
  长圆柱（s → ∞）的渐近里因此多出 exp(−α'k²s/2)（(7.4.10)），
  于是 ∫^∞ ds 的无质量项从 ∫ds·1（发散）变成 ∫ds exp(−α'k²s/2) ∝ 1/k²——
  一个位于 k² = 0 的极点。极点意味着中间态是**在壳的无质量闭弦**，
  即开弦散射可以经由闭弦中间态发生。故开弦理论的谱里必须有闭弦。
gaps:
  - "**原书没有写出带顶点算子的单圈振幅**：只给了大 s 渐近多出的因子 (7.4.10)。
     完整的单圈开弦散射振幅（含顶点算子位置积分）在本章从未写出。"
  - "**「极点 ⇒ 存在中间态」的判据在本处无出处**（见 inferred 边的说明）。"
  - "**继承 spectrum.cylinder-tadpole-divergence-is-infrared 的悬空一步**：
     圆盘 tadpole 非零（§6.6）在本图没有节点。"
  - "**「as claimed in chapter 3」的那条断言未核对**（抽取记录 §3.1），
     故本卡与第 3 章之间没有图内的边。"
notes: |
