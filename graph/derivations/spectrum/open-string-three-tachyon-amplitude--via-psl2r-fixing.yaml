summary: |
  **(1) 组装。** 按第 5 章的规范固定路径积分（本图暂无节点，见 gaps），D₂ 上的三点振幅 =
  e^{−λχ} × ⟨三个 c 鬼⟩_{D₂} × ⟨三个重整化 tachyon 顶点算子⟩_{D₂}，坐标由 PSL(2,R) 固定。
  X 部门给出 δ²⁶(Σk) ∏_{i<j}|y_ij|^{2α'k_i·k_j}（开弦边界上的传播子是体内的两倍，故指数是
  2α'k_i·k_j 而非 α'k_i·k_j）；鬼场部门给出 y₁₂y₁₃y₂₃。两者相乘即 (6.4.2) 中
  |y_ij|^{1+2α'k_i·k_j} 的形式，前面配 i g_o³ C_{D₂}(2π)²⁶。
  边界三点的第二个循环序给出 (k₂ ↔ k₃) 项。

  **(2) 指数为零。** 动量守恒 Σ_i k_i = 0 给 2k_i·k_j = (k_i + k_j)² − k_i² − k_j² = k_l² − k_i² − k_j²
  （l 是第三条腿），代入 k² = 1/α' 得 2α'k_i·k_j = 1 − 1 − 1 = −1，故 1 + 2α'k_i·k_j = 0。
  三个因子全为 1，振幅与 y_i 无关。

  **(3) 读法。** 三点函数被 PSL(2,R) 完全定死：能被共形对称固定的自由度恰好等于顶点算子的个数，
  没有剩余积分，结果只依赖动量。
