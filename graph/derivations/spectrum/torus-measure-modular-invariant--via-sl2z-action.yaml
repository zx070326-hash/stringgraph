summary: |
  设 τ' = (aτ + b)/(cτ + d)，a,b,c,d ∈ Z，ad − bc = 1，τ ∈ H。

  (1) **全纯微分的变换**：dτ'/dτ = [a(cτ+d) − c(aτ+b)]/(cτ+d)² = (ad − bc)/(cτ+d)² = 1/(cτ+d)²，
      故 dτ' = dτ/(cτ+d)²，取复共轭得 dτ̄' = dτ̄/(c̄τ̄+d̄)² = dτ̄/(cτ̄+d)²（a,b,c,d 为实整数）。
      ⇒ dτ' dτ̄' = dτ dτ̄ / |cτ + d|⁴。

  (2) **虚部的变换**：τ₂' = Im τ' = τ₂ / |cτ + d|²（worldsheet.modular-group-psl2z），
      故 (τ₂')² = τ₂² / |cτ + d|⁴。

  (3) **相除**：dτ' dτ̄' / (τ₂')² = [dτ dτ̄ / |cτ+d|⁴] · [|cτ+d|⁴ / τ₂²] = dτ dτ̄ / τ₂²。∎

  三步都是有限步初等计算，且 |cτ + d| ≠ 0（τ ∈ H 而 (c,d) ≠ (0,0)，否则 ad − bc = 0）。
  常数归一化（d²τ = 2dτ₁dτ₂ 还是 dτ₁dτ₂）在比值中相消，故结论与该约定无关。
