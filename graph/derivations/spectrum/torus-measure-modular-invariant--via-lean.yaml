    note: |
      **供给 summary A 第四步所重述的那条恒等式**：`im_smul_mul_normSq (g) (τ) :
      (g • τ).im * Complex.normSq ((g 1 0) * τ + (g 1 1)) = τ.im`，即清分母形式的
      Im(γ·τ) = Im τ/|cτ+d|²；A 的第五步 `measure_density_modular_invariant` 同样以
