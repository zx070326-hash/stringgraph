    note: 提供 λ^a 厄米、n² 个自由度与迹结构；(1) 的 U(n) 直接是「n×n 厄米矩阵空间」的对称群。
  - id: worldsheet.worldsheet-parity
    note: |
      提供 Ω 的定义（σ ↦ ℓ − σ）、Ω² = 1、以及它在振子模上的作用 Ω α_n^i Ω^{−1} = (−1)^n α_n^i
      ——正是后者给出 (−1)^{1+α'm} 里的能级依赖相因子。
  - id: spectrum.covariant-external-legs-on-shell
    note: |
      提供 α'm² = N − 1（该节点第 (1) 条：协变开弦态的 L_0 = 1 ⟺ α'k² = 1 − N ⟺ α'm² = N − 1），
      用来把「相因子 (−1)^{1+α'm²}」在无质量能级（N = 1，α'm² = 0）上取值。
      **2026-09-11 改挂（curator-onshell-bridge）**：原先是指向 worldsheet.open-string-mass-shell
