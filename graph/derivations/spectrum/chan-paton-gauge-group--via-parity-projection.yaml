      §6.5 的态 |N; k; ij⟩ 就是这个语境，**故 inferred 撤销**。
    convention_map: conv.metric-mostly-plus 下 m² = −k²；conv.intercept-sign-a 下 a = −A = 1，故 α'm² = N − 1。
  - id: worldsheet.string-s-matrix
    inferred: true
    note: |
      **2026-09-11 补边**（ch.5 已合入 main，原 gap「待合入后补边」由此关闭）：
      提供 (5.3.9) 里的 **1/n_R 因子**与「对无取向曲面求和」的写法，
      即「无取向弦」在振幅层面的定义——正是它让「对 Ω = +1 投影」成为正确的操作。
      标 inferred，且**不是本推导第 (1)–(3) 步的计算输入**：本推导整个在态空间层面做投影，
      1/n_R 只提供框架。抽取记录 E103 的「文献列出的依赖」含 E80，但 §6.5 的正文不在原地回指 (5.3.9)。
sources:
  - ref: polchinski-1998-v1
    loc: "§6.5, eq. (6.5.21)/(6.5.23)/(6.5.25)–(6.5.27)/(6.5.30)/(6.5.31)，p.190–191"
    note: |
      抽取记录 #E103，L1（schrans-2020 §6.59 正文，笔记 p.326）；
      ⚠ 式号与表达式的对应只到目录级（抽取记录 §7）。headrick-2008 不覆盖本节。
summary: |
  **(1) 取向情形。** 不投影时，n² 个厄米 λ^a 张成 u(n)，无质量矢量态按伴随表示组织，
  规范群 U(n)。（这里用的是「无质量矢量的 Chan–Paton 自由度 = 规范群的李代数」这一识别，
  其依据是 α's = 0 处极点的留数正比于结构常数——见
  spectrum.massless-open-pole-requires-chan-paton 与 spectrum.chan-paton-yang-mills-coupling。）

  **(2) 无取向投影。** Ω 翻转世界面定向，把开弦的两个端点对调，
  故在 Chan–Paton 指标上作用为**转置**（可再复合一个固定矩阵 M：λ ↦ M λ^T M^{−1}），
  同时在振子部分给出依赖能级的相因子。用 Ω α_n Ω^{−1} = (−1)^n α_n 与 α'm² = N − 1，
  该相因子在能级 N 上是 (−1)^{N} 乘一个整体符号，写成来源的形式即 (−1)^{1+α'm²} 型。
  在无质量矢量所在的能级上它取 −1。

  **(3) 存活条件与群。** 要求 Ω = +1，得 M(λ^a)^T M^{−1} = −λ^a。
  - M 可取为单位阵（M 对称）时，条件即 (λ^a)^T = −λ^a，配厄米性得 λ^a 为纯虚反对称，
    即 so(n) 的李代数 ⇒ **SO(n)**；
  - M 反对称（须 n 偶，M² = −1 型）时，条件挑出 usp(n) ⇒ **USp(n)**（= 来源的 Sp(n/2)）。
  故 SO/USp 的二选一由无取向投影中 M 的选取决定。
gaps:
  - "**M 的可能形式没有被论证**：为什么 M 只能取对称或反对称（由 Ω² = 1 与结合性约束推出）
     在本推导与本图中都没有写出；来源（(6.5.25)–(6.5.27) 附近）有这一分析，
     但抽取记录只到目录级，**未读到表达式**。这是本推导最实质的缺口。"
  - "**Ω 在 Chan–Paton 指标上的作用形式是 curator 的改写**：抽取记录把 Ω 的作用写成对
     |N;k;ij⟩ 的本征值方程（不含转置），本推导按标准做法写成带转置的映射并注明。
     **须有原书者核对 (6.5.31) 的原文形式。**"
  - "**「无质量矢量的 CP 自由度 = 规范群」这一识别未在本推导中论证**，只在
     spectrum.chan-paton-yang-mills-coupling 里通过极点留数间接支撑。"
  - "**（2026-09-11 已关闭）** 原 gap：无取向弦对应主公式 (5.3.9) 里的 1/n_R 因子而该节点未进 main。
     worldsheet.string-s-matrix 已在 main，边已补（inferred，只承载框架不承载计算）。
     **残余**：「1/n_R 的除法 ⟺ 态空间上取 Ω = +1 的投影」这一等价性本图无节点。"
  - "**来源等级偏低**：本节没有 headrick-2008 的独立背书，[S] 的式号↔表达式对应只到目录级。"
  - "**（2026-09-11 已关闭）** 原 gap：「路径积分与谱的接口——把『光锥谱的能级』用作
     『协变振幅外线』的质量壳条件，本图无节点」。节点 spectrum.covariant-external-legs-on-shell
     已建立，第三条依赖已改挂并撤销 inferred。
     **残余**：该桥节点是 physical-argument，且不承载「振幅只依赖 H_OCQ = H_phys/H_null 的
     等价类」（其【不断言】(c)）——本推导在态空间上做 Ω 投影时默认了这一点。"
notes: |
  记号：本推导写 USp(n)，来源写 Sp(n/2)，两者同一个群，见目标陈述 notes 的记号说明。
