status: rigorous
depends_on:
  - id: spectrum.covariant-external-legs-on-shell
    note: |
      **2026-09-11 改挂（curator-onshell-bridge）**：原先是两条指向
      worldsheet.open-string-mass-shell / worldsheet.closed-string-mass-formula 的 `inferred` 边，
      理由是「把光锥谱的质量壳条件用作协变振幅外线的条件，本图无节点」。
      该节点现已建立（ROADMAP 待建项落地），它逐字承载这一步：
      协变外线的 L_0 = 1 ⟺ α'k² = 1 − N ⟺ α'm² = N − 1（开弦，N = 0 给 α'm² = −1）；
      (L_0, L̃_0) = (1,1) ⟺ α'k²/4 = 1 − N ⟺ α'm² = 4(N−1)（闭弦，N = 0 给 α'm² = −4），
      并把它与光锥谱的比较接到 Polchinski (4.1.20)/(4.4.21) 的 H_OCQ ≅ H_light-cone 上。
      **故 inferred 撤销**：本推导用到的全部质量壳内容（四条外线是 tachyon，α'k² = 1 / 4）
      都在该节点的陈述里，且该节点自带来源。
      与光锥谱的边（open-string-mass-shell / closed-string-mass-formula）不再从这里直接引出，
      它们是该节点的依赖。
    convention_map: conv.metric-mostly-plus 下 m² = −k²，故开弦 α'm² = −1 ⟺ α'k² = 1，闭弦 α'm² = −4 ⟺ α'k² = 4；conv.intercept-sign-a 下 a = −A = 1。
sources:
  - ref: polchinski-1998-v1
    loc: "§6.4, eq. (6.4.7)，p.179–183；闭弦情形见 §6.6（[S] §6.66 脚注 8：α'(s+t+u) = −16）"
    note: 抽取记录 #E98/#E106，L1（schrans-2020 §6.30–§6.37、§6.66）。
summary: |
  展开定义并用 Σ_i k_i = 0：
    s + t + u = − [ (k₁+k₂)² + (k₁+k₃)² + (k₁+k₄)² ]
              = − [ 3k₁² + k₂² + k₃² + k₄² + 2 k₁·(k₂ + k₃ + k₄) ]。
  由 k₂ + k₃ + k₄ = −k₁ 得 2k₁·(k₂+k₃+k₄) = −2k₁²，于是
    s + t + u = − [ k₁² + k₂² + k₃² + k₄² ] = − Σ_i k_i² = Σ_i m_i²
  （末步用 conv.metric-mostly-plus 的 m² = −k²）。
  代入 α'k_i² = 1（开弦 tachyon）得 −4/α'；代入 α'k_i² = 4（闭弦 tachyon）得 −16/α'。
gaps:
  - "**（2026-09-11 已关闭）** 原 gap：「质量壳条件的搬运未被节点承载——从光锥量子化的谱到
     协变振幅外线的 on-shell 条件，本图没有节点」。该节点
     spectrum.covariant-external-legs-on-shell 已建立，边已改挂并撤销 inferred。
     **残余**：该桥节点自身是 physical-argument，且它明确**不**承载
     「权 1 ⟹ 积分顶点算子共形不变 ⟹ 振幅良定义」与「零模态解耦」两步（见其【不断言】(b)(c)）。
     本推导继承这两处缺口。"
  - "**「全部取入射约定」这一符号约定未核对原书**：若某些腿取出射，s、t、u 的定义相差符号，
     结论形式不变但表达式的读法要改。"
