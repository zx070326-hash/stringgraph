depends_on:
  - id: worldsheet.string-s-matrix
    note: |
      提供 (5.3.9)：模积分 ∫_F d^μt、每个模一个 (1/4π)(b,∂_{t^k}ĝ) 插入、每个被固定的顶点算子
      一个 c 插入。原书 §7.3 第一句逐字「We now apply to the torus the general result (5.3.9)」。
  - id: worldsheet.torus-two-moduli-two-ckv
    note: |
      提供 μ = κ = 2：两个模（τ 的实部与虚部）⇒ 两个 b 插入；两个 CKV（平移）⇒ 原本要固定
