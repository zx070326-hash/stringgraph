summary: |
  **(1) 落到环面。** (5.3.9) 在 μ = κ = 2 的环面上写成 (7.3.1)：½∫_{F₀}dτdτ̄ ⟨BB̃ c̃c V₁ ∏∫V_i⟩，
  其中 B = (1/4π)(b,∂_τ g)。

  **(2) 算 b 插入。** 用 (7.2.13) δτ = −2iτ₂ε 得 ∂_τ g_{w̄w̄} = i/(2τ₂)，故
  B = (i/4πτ₂)∫d²w b_{ww}(w)；因鬼场期望值与位置无关（(7.2.27)），w 积分直接做掉，得 B → 2πi b_{ww}(0)。
  （用到 d²w = 2dσ¹dσ² 与 g_{ww̄} = ½，原书在 (7.3.2) 下方专门提醒。）

  **(3) 除掉 CKG。** 环面平移群体积有限（= 环面面积 (2π)²τ₂ 的相应因子），故不必固定顶点算子：
  把固定的那个顶点算子也改成积分，同时除以 CKG 体积（(7.3.3)）。得 (7.3.4)，
  「所有顶点算子地位相同」。原书逐字：「It is easy to do this by hand here.」

  **(4) 去掉顶点算子。** (7.3.4) 在 n = 0 时仍然有意义，即 (7.3.5) = 陈述 (1)。
  原书说 (7.3.4) 也可以「directly」导出而不必先固定一个顶点算子，**但没给那个直接导法**。

  **(5) 代入 26 维平坦时空。** ⟨bb̃c̃c⟩_{T²} = |η|⁴，X 部门给 iV₂₆(4π²α'τ₂)^{−13}|η|^{−52}，
  相乘得 (7.3.6)。一般 CFT 情形（d ≥ 2 个非紧平坦方向）鬼场仍抵消两套玻色振子，得 (7.3.8)。
gaps:
  - "**F₀ 与 ½ 整体外包给 §5.1**：本章一字不证。且 (5.1.15)（闭区域）与 (7.3.14)（开区域）
     的写法不一致，原书未说明（抽取记录 Q1）。"
  - "**τ₂ → ∞ 端发散**：(7.3.15) 给 iV₂₆∫^∞(dτ₂/2τ₂)(4π²α'τ₂)^{−13}[exp(4πτ₂) + 24² + …]，
     首项（快子）发散。原书说这可以由正质量平方解析延拓来定义，**但延拓后的能量密度是复的**
     （逐字：「there is still a pathology — the continued energy density is complex」）。
     ⚠ 并注意 24² 是无质量态的简并度 24×24，不是 2⁴（抽取记录 #E25 的警告）。"
  - "**「无快子时收敛」是断言**：原书 (7.3.16) 下逐字「in the absence of tachyons it will converge」，
     **没有证明**。真正要比较的是态密度的增长（worldsheet.high-weight-density-from-central-charge，
     ∼ exp[π(c+c̃)/(12ℓ)]）与压制因子 exp(−πα'm²τ₂)，原书对此**完全没有讨论**（抽取记录 Q2）。"
  - "**路径积分测度未定义**（继承自 worldsheet.string-s-matrix）；k⁰ 转动给出的 i 是定义而非计算
     （继承自 worldsheet.free-scalar-torus-partition-function）。"
  - "**求和与模积分能否交换**在 (3) 的一般 CFT 形式里没有讨论（抽取记录 Q2）。"
  - "**(7.3.4) 的「直接导法」缺失**：原书断言不必经过「先固定一个顶点算子」也能得到 (7.3.4)，
     未给出该导法。本图的 (1) 因此只有一条路线。"
