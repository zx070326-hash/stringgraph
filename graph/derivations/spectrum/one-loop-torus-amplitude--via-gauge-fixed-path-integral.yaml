  - id: spectrum.covariant-external-legs-on-shell
    inferred: true
    note: |
      **inferred: true**。(3) 里 Σ_{i∈H^⊥} q^{h_i−1}q̄^{h̃_i−1} 的 −1 是 (L₀,L̃₀) = (1,1) 的质量壳
