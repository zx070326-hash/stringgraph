summary: |
  **(1) 弦侧。** S₂ 上取一个无质量闭弦顶点算子（极化 e_{μν}）与两个 tachyon，
  三个坐标全部被 PSL(2,C) 固定（κ_CKV = 6，六个 c 插入），
  Euler 因子 e^{−2λ}，X 部门给 δ²⁶(Σk) 与动量的多项式/幂次组合，
  合起来是 (6.6.14)，前因子含 g_c³（或 g_c²g'_c，视顶点算子归一化）与 C_{S₂}。

  **(2) 场论侧。** 用 tachyon 的低能有效作用量 (6.6.16)（一个标量场，质量 α'm² = −4）
  与 Einstein 框架下正则归一化的引力子，写出「引力子—tachyon—tachyon」顶点，
  其耦合是 κ 乘动量的组合。

  **(3) 比较。** 两侧的同一个运动学结构（e_{μν}k^μk^ν 型）比较系数，
  [H] 分别得到 g_c = α'g'_c/2（其式 (70)）与 **κ = πα'g'_c**（其式 (76)）。

  ⚠ 比较时必须用 [H] 的迹提醒：e 的迹是 dilaton，不是引力子的迹。
gaps:
