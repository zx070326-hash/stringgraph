     （见目标陈述 notes）。第 3 章的顶点算子分类未被抽取。"
  - "**场论侧的 Einstein 框架、正则归一化、dilaton 的处理都没有节点**：
     κ 的定义（κ² = 8πG_N 还是别的归一化）在本图中没有约定节点，
     故 κ 的**数值**关系依赖来源的未写明约定。这是本条最实质的记账缺口。"
  - "**(6.6.19)/(6.6.21)（三个无质量闭弦）只到 L2**，本推导不使用它们。"
  - "**路径积分测度未定义**、**上游 ch5 节点尚未进入 main**（本批次共有）。"
