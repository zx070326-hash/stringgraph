    · Möbius 带：16 = **2⁴**（R 扇区基态二重简并的四次幂，四次幂来自「迹对一对维数取」）。
  **原书对这两条路径都不作评论，也从不说这两个 16 为什么相等。**
  ⇒ 目标卡「不断言 (c)」把「本图的各个 16 同源」挡在断言外，正是为这一点留的余地。
  （这与抽取记录 #E74 §Q5 记的「三个各自独立出处的 2⁵ = 32 没有任何书解释为什么相等」
   是同一类现象，已登记在目标卡 notes 的开放问题 (O1)–(O3) 与 docs/ROADMAP.md。）

