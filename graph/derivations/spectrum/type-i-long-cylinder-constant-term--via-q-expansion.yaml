summary: |
  把三处方括号里的函数按 q 展开，逐项核对原书印出的常数 16。全部计算都是有限步的幂级数乘除。

  **第 1 步（圆柱 (10.8.4) 与 Klein 瓶 (10.8.11)，断言 (1)；原书不给过程）**
  取 τ = is/π ⇒ q = exp(2πiτ) = **exp(−2s)**。由 (10.7.6) 取 α = 0（NS，一对维数）：
    Z⁰₀ = q^{−1/24} ∏_{m≥1}(1 + q^{m−1/2})² ,   Z⁰₁ = q^{−1/24} ∏_{m≥1}(1 − q^{m−1/2})²
  （Z⁰₁ 的插入 exp(πiF) 把每个半整数模的贡献翻号；等价地由 Z^α_β = ϑ[α/2,β/2]/η 与 ϑ 的
   三重乘积公式得同一式）。四次幂（= 8 个横向费米子）：
    Z⁰₀⁴ − Z⁰₁⁴ = q^{−1/6} [ ∏(1 + q^{m−1/2})⁸ − ∏(1 − q^{m−1/2})⁸ ]。
  记 x = q^{1/2}。∏_{m≥1}(1 ± x^{2m−1}) = 1 ± x + O(x³)（相异奇数部分的分拆母函数），故
    ∏(1 + q^{m−1/2})⁸ = 1 + **8**x + 28x² + O(x³) ,  ∏(1 − q^{m−1/2})⁸ = 1 − **8**x + 28x² + O(x³)，
  两者之差 = **16** x + O(x³) = 16 q^{1/2} + O(q^{3/2})（x² 项的 28 **逐项相消**）。
  又 η(is/π)^{−8} = q^{−1/3} ∏(1 − q^n)^{−8} = q^{−1/3}[1 + O(q)]。相乘，q 的幂次
  −1/3 − 1/6 + 1/2 = **0** 恰好抵消：
    η^{−8}[Z⁰₀⁴ − Z⁰₁⁴] = **16** + O(q) = **16** + O(exp(−2s))。✓ 与原书印出的一致。
  ★ **16 的组合来源：16 = 2 × 8**——两个乘积在 x 一阶的系数 ±8 相减，8 是**横向世界面
  费米子的个数**。⚠ 这是一条组合来源，**不是**「无质量态的个数」（目标卡「不断言 (a)」）。

  **第 2 步（Möbius 带 (10.8.18)，断言 (2)；原书不给过程，本图此前也未做）**
  这里宗量是 **2is/π** ⇒ q = **exp(−4s)**，故 q^{1/2} = exp(−2s)。
  由 (10.7.6) 取 α = 1（R，一对维数）：
    Z¹₀ = q^{1/12} ∏_{m≥1}(1 + q^m)(1 + q^{m−1}) = **2** q^{1/12} ∏_{m≥1}(1 + q^m)²
  （m = 1 的因子 (1 + q⁰) = 2 就是 R 扇区基态的二重简并）。于是
    Z¹₀⁴ = **16** q^{1/3} ∏(1 + q^m)⁸ = 16 q^{1/3}[1 + O(q)] ,
    Z⁰₁⁴ = q^{−1/6}[1 − 8q^{1/2} + O(q)] ,  Z⁰₀⁴ = q^{−1/6}[1 + 8q^{1/2} + O(q)] ,
    η(2is/π)⁸ = q^{1/3}[1 + O(q)]。
  代入：
    [Z⁰₁⁴ Z¹₀⁴] / [η⁸ Z⁰₀⁴]
      = ( q^{−1/6}·16 q^{1/3} ) / ( q^{1/3}·q^{−1/6} ) · [1 − 8q^{1/2} + O(q)]/[1 + 8q^{1/2} + O(q)]
      = **16** · [1 − 16 q^{1/2} + O(q)]
      = **16** + O(q^{1/2}) = **16** + O(exp(−2s))。✓ 与原书印出的一致。
  ★ 这里的 **16 来自 R 扇区基态简并的四次幂 2⁴ = 16**，与第 1 步那个 16（= 2 × 8）
  **是两条不同的组合路径给出的同一个数**；原书对此不作任何评论，本图**不断言**两者同源
  （目标卡「不断言 (c)」的同款保留）。

  **（换代前的第 1 步——玻色弦 (7.4.4) 的 24——已不在本推导里）**
  旧目标卡 spectrum.long-cylinder-lightest-state-count 的断言 (1) 是
  η(is/π)^{−24} = exp(2s) + 24 + O(exp(−2s))，原书在 (7.4.4) 处**自己写出了两步**；
  reviewer-batch28 判定那一条与 spectrum.cylinder-closed-channel-open-closed-duality 断言 (3)
  逐字重复，故换代后的目标卡只含超弦三处的 16，本推导相应地**删掉了对 duality 卡的边**
  （那条边当时供给的就是「断言 (1) 本身」，是重复供给而非论证步）。
  ⇒ 现在本推导的输入只有 η 的乘积式（加从原书导入的 (10.7.6)），与 §10.8 的三式。

  **为什么标 rigorous，以及为什么目标卡的 effective 仍然更低**
  (1) **status = rigorous 走的是 docs/STATUS_LEVELS.md 的 rigorous 例外条款**（2026-09-10 裁决）：
      上面两步是前提已完整写出的有限步初等幂级数运算，且 **reviewer 已独立复核**
      （见 notes 第一行的 `reviewer-verified` 记录）。
  (2) ★ **但本推导两步用的乘积展开式在本图没有节点**：(10.7.6) 与 ϑ 的乘积公式（ϑ₀₁/ϑ₁₀ 那两支）
      都只是从原书/标准文献导入的（见 gaps 第一条）——这是本推导最实质的限度，
      它不改 status（前提写在推导内、例外条款允许），但读者必须与 status 一起读。
  (3) **目标卡的 effective 低于 rigorous**：上游 worldsheet.modular-invariance-requires-eight-
      transverse-fermions 自身是 physical-argument（其推导封顶理由是原书 §10.7 开头逐字的
      'We make the guess, correctly it will turn out'）⇒ 目标卡的有效状态被那条边压在
      physical-argument，**与本推导的 own status 无关**。
