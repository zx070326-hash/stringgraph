summary: |
  直接机器检查的证明，全部在 formal/StringFormal/Math/MobiusJacobian.lean B 节内完成。

  1. **定义**：对任意交换环 K 上的模 M 与双线性型 B，`mandelstamS B k = −B(k₀+k₁, k₀+k₁)` 等
     （Lean 0 起数：k 0 = k₁）。负号是 conv.metric-mostly-plus。
  2. **主定理**（`mandelstam_sum`，目标陈述的 s + t + u = Σm_i²）：前提 B 对称、Σ_i k_i = 0、
     B(k_i,k_i) = −m_i²。由 k₁+k₂+k₃ = −k₀ 得 Σ_{j≠0} B(k₀,k_j) = −B(k₀,k₀)，展开三个平方项后
     `linear_combination` 收尾。**不需要**非退化、号差、域，甚至不需要 2 可逆。
  3. **开弦四 tachyon**（`mandelstam_sum_four_tachyons`）：加前提 α'm_i² = −1，
     `linear_combination` 四条得 α'(s+t+u) = −4。
  4. **对角度规的具体版本**（`mandelstam_sum_diagonal_metric`）：`minkowskiForm η` =
     `Matrix.toBilin' (diagonal η)`，`minkowskiForm_apply` 把它展开成 Σ_μ η_μ x_μ y_μ；
     取 η = (−1, 1, …, 1) 即物理的 mostly-plus 陈述，由第 2 步实例化。

  Lean 里**不出现**的物理内容（须由图承载）：B 是 Minkowski 型、m_i 是外线态的质量、
  质量壳条件来自谱（见 --via-momentum-conservation 的 inferred 边与 gaps）。
gaps:
