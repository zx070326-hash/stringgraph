    一行代入（与 `mandelstam_sum_four_tachyons` 的证明逐字同型，只把 −1 换成 −4），
    formalizer 只写了开弦特化。建议 formalizer 补 `mandelstam_sum_four_closed_tachyons`
    后把本条 gap 删去；在此之前，本卡陈述的第三句（闭弦 −16/α'）由 --via-momentum-conservation
    （rigorous，reviewer-ch6 复核）承载。
  - |
    **质量壳条件的搬运不在 Lean 内**：m_i 在 Lean 里只是满足 B(k_i,k_i) = −m_i² 的标量，
    「它等于光锥谱的质量」这一识别由图的 inferred 边承载（lead 已记 ROADMAP 待建
    「光锥质量壳 → 协变振幅外线 on-shell」）。
