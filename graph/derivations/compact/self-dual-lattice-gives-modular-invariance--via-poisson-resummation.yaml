  - id: math.dedekind-eta-s-transformation
    note: |
      提供 (7.2.44b)：η(−1/τ) = (−iτ)^{1/2}η(τ)。本推导里 |η|^{−2k} 那个振子因子在 τ → −1/τ 下
      产生的 |τ|^{−k} 必须与格求和的 (−iτ)^{k/2}(iτ̄)^{k/2} 相消，没有这条变换就写不出
      (8.4.21) 的不变性。**本图现在有这个节点了**（第 7 章分支建，2026-09-11 由合卡拆出 S 半），
      本条 2026-09-11 补边。
      ⚠ S 卡在来源中**零证明零引用**，故这条边把本推导的强度钉死在 physical-argument 上——
      这是如实记账，不是降级。
  - id: compact.narain-lattice-is-even
    note: |
      提供 T 变换（τ → τ + 1）那一半的不变性；本推导只处理 S 变换（τ → −1/τ），
      两者合起来才是「模不变」。
