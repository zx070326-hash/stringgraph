id: compact.self-dual-lattice-gives-modular-invariance--via-poisson-resummation
target: compact.self-dual-lattice-gives-modular-invariance
kind: physical-argument
status: physical-argument
depends_on:
  - id: compact.narain-lattice
  - id: compact.narain-lattice-is-even
    note: |
      提供 T 变换（τ → τ + 1）那一半的不变性；本推导只处理 S 变换（τ → −1/τ），
      两者合起来才是「模不变」。
sources:
  - ref: polchinski-1998-v1
    loc: "§8.4, eq. (8.4.21)–(8.4.24) 前半句，p.251–252；用到 (7.2.44b)（η 的 S 变换）"
    note: |
      抽取记录 polchinski-1998-v1#E139（L1，Schrans §8.64–§8.67，笔记 p.475–477，
      完整复现了这半句）。
summary: |
  把 Z_Γ 的格求和用 (8.4.22) 的 delta 函数恒等式换成对偶格上的求和，
  再做 Gauss 积分（Poisson 重求和的高维版本），得到 Z_Γ(τ) = V_Γ^{−1} Z_{Γ*}(−1/τ)。
  若 Γ* = Γ，则该式给 V_Γ = V_Γ^{−1}，故 V_Γ = 1，于是 Z_Γ(τ) = Z_Γ(−1/τ)。
gaps:
  - "格求和与 Gauss 积分的交换、Poisson 重求和的收敛性在来源中未讨论（这是 §8.2 一维情形 (8.2.10)–(8.2.11) 同型的形式操作）。"
  - "η 函数的 S 变换 (7.2.44b) 在本图中没有节点；|η|^{−2k} 因子在 τ → −1/τ 下的变化必须与格求和的 (−iτ) 因子相消，来源没有在本处逐项验证。"
  - "配分函数本身由世界面路径积分定义，本图没有承载它的节点（第 7 章未覆盖）。"
  - "从 V_Γ² = 1 推 V_Γ = 1 用到 V_Γ > 0；这是显然的但来源未写。"
author: curator-polchinski-ch8
created: "2026-09-11"
