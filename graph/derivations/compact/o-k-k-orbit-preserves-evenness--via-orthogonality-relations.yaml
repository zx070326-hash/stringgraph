summary: |
  Λ^T η Λ = η 说的正是 Λ 保持双线性型 ℓ∘ℓ' = ℓ^T η ℓ'，故
  (Λℓ)∘(Λℓ) = ℓ^T Λ^T η Λ ℓ = ℓ^T η ℓ = ℓ∘ℓ ∈ 2Z，即 ΛΓ 仍是偶格。
  Schrans 的复现是把 Λ 按左右分块、由 Λ^TηΛ = η 得三个分块关系再逐项代入化简，
  结果相同。
