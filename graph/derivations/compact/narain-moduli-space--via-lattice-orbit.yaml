id: compact.narain-moduli-space--via-lattice-orbit
target: compact.narain-moduli-space
kind: physical-argument
status: physical-argument
depends_on:
  - id: compact.narain-lattice
  - id: compact.narain-lattice-is-even
  - id: compact.self-dual-lattice-gives-modular-invariance
  - id: compact.modular-invariance-requires-self-dual-lattice
    note: |
      提供「只有偶自对偶格才给模不变理论」这一必要方向；没有它，本节点只描述
      偶自对偶格给出的那些理论，而不是全部模不变紧化。**该上游在来源中无论证。**
  - id: compact.o-k-k-orbit-preserves-evenness
  - id: compact.o-k-k-orbit-preserves-self-duality
    note: |
      「全部偶自对偶格构成 O(k,k;R) 的单一轨道」的支点。
      ⚠ 2026-09-11 更正：原先写「该上游在来源中无论证」，已撤销
      ——原书给了论证（∘ 积在 O(k,k;R) 下不变，抽取记录 §12.10 表 A 的 Q22）。
      它只给「保持」，不给「传递」，后者仍是本推导的缺口。
sources:
  - ref: polchinski-1998-v1
    loc: "§8.4, eq. (8.4.28)（未模掉离散群）与 **(8.4.31)**（Narain 模空间），p.253"
    note: |
      抽取记录 polchinski-1998-v1#E142，**式号已按原书核实（L1，§12.10 表 B 第 20 条）**：
      模空间是 (8.4.31)，不是旧 loc 的 (8.4.30)（后者是等价关系 (8.4.30a,b)）。
summary: |
  偶自对偶格的集合被 O(k,k;R) 保持且（按原书）由单一轨道穷尽，故可用 O(k,k;R)
  参数化全部这样的格。左右各自的转动 O(k;R) × O(k;R) 不改变 ℓ_L²、ℓ_R²，
  因而不改变谱与理论，应当模掉。最后，把同一个格送回自身的离散变换 O(k,k;Z)
  给出的是同一个格、同一个理论，也应模掉。剩下的商空间即 Narain 模空间。
gaps:
  - "⚠ 「全部偶自对偶格构成单一 O(k,k;R) 轨道」中的**传递性**在来源中没有论证：(8.4.25) 只说 ΛΓ 仍是偶自对偶格，不说反过来任意两个偶自对偶格都被某个 Λ 联系。这是本推导最实质的缺口，本图没有节点承载它。"
  - "⚠ **旧 gap 已部分撤销**：原先写上游 compact.o-k-k-orbit-preserves-self-duality「没有任何来源给出论证」。按原书核实（§12.10 表 A 的 Q22）原书给了论证（∘ 积不变性），该说法作废；剩下的缺口是上一条的传递性。"
  - "⚠ 分类的必要方向依赖 compact.modular-invariance-requires-self-dual-lattice（原书只写 'a little thought shows'）。"
  - "「被 O(k;R)×O(k;R) 联系的格给出相同的理论」这一步只在谱的层面被论证（ℓ_L²、ℓ_R² 不变）；关联函数层面未验证。"
  - "⚠ **旧 gap 已撤销**：原先写「式号 (8.4.28)/(8.4.30) 有源内冲突，采 Schrans 目录值」。按原书核实模空间是 (8.4.31)（§12.10 表 B 第 20 条），源内冲突问题消失。"
author: curator-polchinski-ch8
