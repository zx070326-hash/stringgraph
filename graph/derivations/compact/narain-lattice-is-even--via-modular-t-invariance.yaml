summary: |
  环面配分函数含因子 q^{L_0} q̄^{L̄_0}；τ → τ + 1 把它乘以 e^{2πi(L_0 − L̄_0)}，
  故模不变要求 L_0 − L̄_0 ∈ Z。紧化方向对 L_0 − L̄_0 的贡献是
  (α'/4)(p_L² − p_R²) = (1/2)(ℓ_L² − ℓ_R²) = (1/2) ℓ∘ℓ，
  振子与鬼场部分的贡献已是整数，故 ℓ∘ℓ ∈ 2Z。
gaps:
  - "「环面配分函数在模变换下不变」是一致性**要求**（世界面上模参数 τ 的等价类才是物理的），
     不是本图中被证明的定理。
     ⓘ **2026-09-11 更新**：(7.2.29) 本身现在有节点了（worldsheet.modular-invariance-integer-spin，
     已接边），故本条 gap 原来的后半句「本图尚无 (7.2.29) 的节点」已撤销；
     「模不变性是要求而非定理」这一半仍然成立，且它正是那张卡自己的 notes 所声明的。"
  - "配分函数的路径积分定义、以及 τ → τ+1 作用在它上面的方式，来源在第 7 章，本图未覆盖。"
  - "「振子部分对 L_0 − L̄_0 的贡献是整数」用到 N、Ñ 的整数谱，在紧化情形没有重新论证。"
notes: |
  **2026-09-11 补边（reviewer-v1-ch7 建议，curator-v1-ch7 落地）**：本推导对 (7.2.29) 的依赖
  原先只写在 gaps 里（「本图尚无 (7.2.29) 的节点」），现已接到
  worldsheet.modular-invariance-integer-spin 上。方向是本卡**依赖**那张卡。
  两张卡都是 physical-argument，接边不改变本卡的有效状态。
