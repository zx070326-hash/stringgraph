  - id: worldsheet.modular-invariance-integer-spin
    note: |
      提供 (7.2.29)：T 不变性 ⇒ h − h̃ − (c − c̃)/24 ∈ Z，且在 c = c̃ 时化为 h − h̃ ∈ Z，
      即本推导第一句「τ → τ+1 把 q^{L_0}q̄^{L̄_0} 乘以 e^{2πi(L_0−L̄_0)}，故模不变要求
      L_0 − L̄_0 ∈ Z」。**本图现在有这个节点了**（第 7 章分支建的），2026-09-11 补边。
      ⚠ 那张卡的 (1) 有一条已知的过强量词（净 (−1)^F 加权简并为零的层看不见），
      见它的 notes；**在玻色弦紧化这个用例里该缺口是空的**（无世界面费米子，(−1)^F ≡ +1，
      简并度全为正），故不影响本推导。
      ⚠ 那张卡的 c − c̃ ∈ 24Z 前提在此自动满足：D = 26 玻色闭弦有 c = c̃。
