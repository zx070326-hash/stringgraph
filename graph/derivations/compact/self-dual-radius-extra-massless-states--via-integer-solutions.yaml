      抽取记录 polchinski-1998-v1#E128（L1，Schrans §8.30–§8.31，笔记 p.453–454 与表 8.2）。
summary: |
  在 R = √α' 处 k_L = (n+w)/√α'、k_R = (n−w)/√α'。把它们代入两支无质量条件
  0 = (4/α')(N − 1) + k_L²、0 = (4/α')(Ñ − 1) + k_R²，
  乘以 α' 得 4 = (n+w)² + 4N 与 4 = (n−w)² + 4Ñ。
  由 N, Ñ ≥ 0 得 (n ± w)² ∈ {0, 4}，即 n ± w ∈ {0, ±2}；
  逐一枚举四种组合并回解 (n, w) 即得表中的 (a)–(d)。
gaps:
  - "整数解的枚举本身是初等算术，但没有 reviewer 独立复核记录，按 docs/STATUS_LEVELS.md 不走 rigorous 例外。"
  - "上游质量公式与 level matching 都是 physical-argument（截距 a = ã = 1、协变/光锥形式的等同），故本条的有效状态被压到 physical-argument。"
  - "「这些态只在 R = √α' 处无质量」需要 R 附近的质量随 R 变化不为零，本节点未陈述；对应式是 (8.3.20)（抽取记录 #E130），本图未建卡。"
