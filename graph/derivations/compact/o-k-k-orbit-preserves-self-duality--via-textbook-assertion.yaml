summary: |
  **本推导没有可复述的论证。** 原书把「偶自对偶格在 O(k,k;R) 下不变」作为一句断言
  （(8.4.25)）给出；伴读者只复现出「偶」那一半，对「自对偶」明说不会做，
  且本项目未取得原书正文以确认原书是否给了论证。
  本节点存在的目的是把这个缺口显式记账，使依赖它的 compact.narain-moduli-space
  在报告中显示出真实的证据强度。
gaps:
  - "⚠ **没有任何来源给出这一半的论证**：Schrans 明说不会，Headrick 未涉及，原书正文未获取（抽取记录 Q22）。"
  - "抽取记录里的数学旁注（(ΛΓ)* = (Λ^T)^{−1}Γ* 与 (Λ^T)^{−1} = ηΛη^{−1}）被明确标注为抽取者旁注、不得入库，故本图不采用它作为论证。"
