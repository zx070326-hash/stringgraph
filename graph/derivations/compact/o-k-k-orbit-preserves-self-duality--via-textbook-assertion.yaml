     给了骨架）。id 不得更改；若要正名应新建 `--via-inner-product-invariance`。
  2. ∘ 积不变性这一步是一行线性代数、前提完整，若 reviewer 独立复核并留
     `reviewer-verified` 记录，可按 docs/STATUS_LEVELS.md 的 rigorous 例外升
     proof / rigorous。本轮 lead 明确指示「档位不动」，故维持 physical-argument。
