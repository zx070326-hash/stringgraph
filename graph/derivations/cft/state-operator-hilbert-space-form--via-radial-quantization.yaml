summary: |
  **(1) 径向量子化的图像。** 把 S₂ 沿单位圆切开：内盘的路径积分（含 z = 0 处的插入 A_j）
  给出圆上的波泛函 Ψ_{A_j}[φ_b]；外盘（含 u = 0 处的插入 A_i）给出 Ψ_{A_i}[φ_b^Ω]，
  其中 Ω 记两片圆参数的反向（u 片的 σ 与 z 片的 2π − σ）。
  把两半沿圆缝合 = 对 φ_b 积分，得 (6.7.9)。

  **(2) 配对。** 由 (1) 定义 G_{ij} = ⟨⟨i|j⟩⟩；它就是两点函数在两个算子分别放在 0 与 ∞ 时的值。
  cft.tensor-two-and-three-point-functions 的选择定则给出 G 的块对角结构。

  **(3) 三点 ↔ OPE。** 把三点函数中的两个算子作 OPE 展开成单个算子的级数（系数 c^ℓ_{kj}），
  再与第三个算子取配对 G_{iℓ}，得 c_{ikj} = Σ_ℓ c^ℓ_{kj}G_{iℓ}。
  即：**结构常数是 OPE 系数用 G 升指标的结果**。

  **(4) 四点。** 在两对算子之间插入完备态基 Σ_m |m⟩ G^{mn} ⟨n|，
  把四点函数写成两组 OPE 系数与 G 的求和（(6.7.18)）。
gaps:
  - "**⚠ 三条未证前提（本卡片的核心缺口，抽取记录明确要求登记）**：
     (a) **OPE 收敛**——lead 裁决 2026-09-10 的标准缺口（researcher Q3）；
     (b) **完备基假设**——态空间可数完备、插入完备关系合法，本图与来源都没有论证；
     (c) **径向序 = 时间序**——[S] 脚注 10 逐字说这是从 QFT「recall」来的，
         路径积分自动含时序而 Hilbert 空间侧需显式时序；**本书没有证明它对世界面 CFT 成立**。"
  - "**⚠ [S] 明说看不懂的两处**：(i) [6.320] 里的 Λ 因子他不知道怎么消掉；
     (ii) §6.82 里「Joe 用 Σ_n G^{mn} 把 c_{nℓj} 升成 c^m_{ℓj}，但还有一个 z₂^{h₂}，
     我不确定这具体怎么运作」。**这两处指向原书论证有跳跃**，本推导的 (3)(4) 相应地
     只给结构而不给中间步骤。"
  - "**「把 S₂ 沿圆切开、两半的路径积分缝合」这一操作未定义**：需要路径积分在带边区域上的定义
     与缝合公理（TQFT/因子化同调的语言），本图与来源都没有。"
  - "**G 的正定性/非退化性没有论证**：(4) 用了 G^{mn}（G 的逆），默认 G 非退化。"
  - "**只有二手源**（L1）；(6.7.10)/(6.7.16) 连目录条目都没有。"
notes: |
  抽取记录 E112 的结论逐字：「**curator：这一节整体建议标 physical-argument**」——本推导遵此。
  这也是本批次中「缺口最明确、最不该被当作已论证」的一条：
  它把 OPE 系数与关联函数打通，是共形自举的技术基础，但三条前提一条都没有节点。
