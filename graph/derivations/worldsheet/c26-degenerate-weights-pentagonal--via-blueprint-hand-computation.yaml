summary: |
  (1) c=26 代入一般 Kac 权公式 h_{p,q}(c)（来源见 depends_on 对
      worldsheet.kac-determinant-v2 的 note）：
      h_{p,q}(26) = [25 − (3p+2q)²]/24。取 p=1、q=s 得单参数族
      h_{1,s}(26) = [25−(3+2s)²]/24 = [25−4s²−12s−9]/24 = −(4s²+12s−16)/24
      = −4(s²+3s−4)/24 = −(s+4)(s−1)/6，与 blueprint 表格逐字一致（§B′.9 已独立
      记录的同一公式）。
  (2) 反对角片上第 M 层种子取权 h=1−s（s:=N−M，质壳截距 a₀=1 处的标准写法）。
      令 1−s = h_{p,q}(26)，移项得 (3p+2q)² = 24s+1；因此"V(26,1−s) 在层 s
      有奇异向量"（存在 p,q≥1、pq=s 使 h_{p,q}(26)=1−s）等价于"24s+1 是完全
      平方"，再等价于"s 是广义五边形数"（s=k(3k∓1)/2 ⟺ 24s+1=(6k∓1)²，
      标准数论刻画，本推导直接引用不重证）。
  (3) 令 m:=3p+2q（m²=24s+1=(6k∓1)²，故 m=6k∓1 型，m 与 k 反号奇偶性一致：
      k 奇 ⟹ m≡±1 (mod 6) 型对应奇数 m 的某个子集，k 偶同理——blueprint 表格
      按 (3p−2q)² 而非 m 本身分类）。blueprint 给出 8 个具体 s 值（1,2,5,7,12,
      15,22,26）的退化指标对 (p,q)，逐一算出 (3p−2q)²：s=1,2,12,15（k 奇）给
      (3p−2q)²=1；s=5,7,22,26（k 偶）给 (3p−2q)²∈{25,49}（对应奇异向量分别落在
      层 s−1、s−2）。curator 复核了全部 8 行的数值（pq=s 且 (3p+2q)²=24s+1 的
      解、以及对应的 (3p−2q)² 取值），结果与 blueprint 表格逐项一致。
  (4) 把 k 奇/偶两类分别接到 Euler 恒等式 1−φ(q)=q+q²−q⁵−q⁷+q¹²+q¹⁵−⋯ 的
      "+"/"−" 两种符号：k 奇（新奇异向量存在）对应 "+q^s" 项，k 偶（该层无新
      奇异向量，退化指标对落在更低两层）对应 "−q^s" 项。这是描述性对应，
      不是形式化推导的一部分（见 depends_on 对 math.euler-partition-generating-function
      的 inferred note：该恒等式本身，即五边形数定理，本图无专门节点承载）。
  (5) §B‴.14 附 N=1..7 的数值表（目标 p_{25}(N)−p_{24}(N) 与三角性上限
      p_{25}(N−1) 的缺口，恰等于 𝒟₂ 族的净贡献），以及 s≤80 内五边形数集合
      {1,2,5,7,12,15,22,26,35,40,51,57,70,77} 与"24s+1 为完全平方"的集合逐项
      相同的程序复算，作为 (2)(3) 的交叉验证——**这一步 curator 未重新运行
      任何程序，只是核对了文档里列出的最终数值列表本身在内部是自洽的
      （即文档给出的两个集合确实相等，逐项核对了 14 个元素）**。
