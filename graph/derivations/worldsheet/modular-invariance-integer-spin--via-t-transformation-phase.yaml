id: worldsheet.modular-invariance-integer-spin--via-t-transformation-phase
target: worldsheet.modular-invariance-integer-spin
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.torus-partition-function-general-cft
    note: |
      提供 Z(τ) = Σ_i q^{h_i−c/24}q̄^{h̃_i−c̃/24}(−1)^{F_i} 这个逐态展开——本推导完全在这个
      展开式上做，不需要任何别的输入。原书 (7.2.29) 的上一式就是 (7.2.28)。
sources:
  - ref: polchinski-1998-v1
    loc: "§7.2, eq. (7.2.29) 及其上方一段, p.213"
    note: 抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E13，L1（原书页图逐字）。
summary: |
  在 τ ↦ τ + 1 下 q^{h−c/24}q̄^{h̃−c̃/24} = exp[2πiτ(h−c/24) − 2πiτ̄(h̃−c̃/24)] 逐项乘上相位
    exp{ 2πi [ (h_i − h̃_i) − (c − c̃)/24 ] } 。
  要求 Z(τ+1) = Z(τ) 对（上半平面上的）所有 τ 成立，且各项互不相消，
  即得每项相位为 1，也就是陈述的 (1)。
  取单位算子（h = h̃ = 0）得 (c − c̃)/24 ∈ Z，即 (2)；回代进 (1) 得一般算子的 h_i − h̃_i ∈ Z，即 (3)。
gaps:
  - "**「各项互不相消 ⇒ 逐项相位为 1」这一步原书未写**。严格化需要：谱按 (h_i, h̃_i) 分层后，
     不同层的 q^{h}q̄^{h̃} 作为 τ 的函数线性无关（对固定 τ₂ 变动 τ₁ 可分离），以及和式在所需区域
     绝对收敛以允许逐层比较。原书一句 requires 带过。"
  - "**假定单位算子在谱中且 h = h̃ = 0**：这是「CFT 有唯一真空且它是 SL(2) 不变的」的标准假设，
     原书在此处不声明。非酉/非紧的 CFT 里可能有权更低的算子（见
     worldsheet.high-weight-density-from-central-charge 的同页脚注）。"
  - "**只用了 T 生成元**：本卡与 S : τ ↦ −1/τ 无关，故它**不是**「完整模不变性」的全部内容。
     把本卡说成「模不变性的谱约束」时必须带上这个限定。"
  - "**收敛性未讨论**（继承自 worldsheet.torus-partition-function-general-cft）。"
notes: |
  由 curator 于 2026-09-11 建立。

  **为什么不是 rigorous**：按 docs/STATUS_LEVELS.md 的 rigorous 例外条款，
  「前提已完整写出 + 有限步初等计算 + reviewer 已独立复核」三条要同时满足。
  本推导的前两条接近满足（相位计算是两行），但第一条实际上**不满足**：
  「逐项比较」需要上面 gaps 第 1 条的分离性论证，而原书没有给，本图也没有独立来源；
  且**没有 reviewer-verified 记录**。故按「不确定选低一级」取 physical-argument。
  ⓘ 这是本章最接近 rigorous 的一条；若 reviewer 愿意复核 gaps 第 1 条并留
  `reviewer-verified:` 记录，可提请升级。
