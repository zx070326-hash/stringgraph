id: worldsheet.transverse-oscillator-commutators--via-canonical-quantization
target: worldsheet.transverse-oscillator-commutators
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.open-string-mode-expansion
  - id: worldsheet.light-cone-canonical-commutators
  - id: worldsheet.light-cone-gauge-lagrangian
    note: |
      只用它给出共轭动量 Π^i 与横向拉氏量的形式（(1.3.11) → (1.3.18)）；
      这一步在同一节内，来源支撑充分。这条依赖使本推导的有效状态被拉到
      physical-argument，这是刻意的：Π^i 的形式确实继承了经典规范固定的论证。
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.18)、(1.3.24b) → (1.3.25b)"
    note: |
      抽取记录 polchinski-1998-v1#E14，式号 [已核实]（Headrick 习题 1.7 引用四个式号）；
      逐字推导步骤未核对原书。
summary: |
  把模式展开代入等时对易关系。X^i 与 Π^i ∝ ∂_τ X^i 都按 {cos(nπσ/ℓ)}_{n≥0} 展开，
  这组函数在 [0, ℓ] 上正交完备，且 δ(σ-σ') = (1/ℓ) + (2/ℓ) Σ_{n≥1} cos(nπσ/ℓ)cos(nπσ'/ℓ)。
  逐模比较系数：零模给 [x^i, p^j] = i δ^{ij}；n ≠ 0 的模给
  [α_m^i, α_n^j] = m δ^{ij} δ_{m+n,0}（因子 m 来自展开式中的 1/n 与 Π ∝ ∂_τ X 的 -inπc/ℓ）。
  归一化 a_n = α_n/√n 把它变成标准玻色对易关系。
gaps:
  - "涉及无穷模式求和的重排与 δ 函数的模式表示，按形式操作处理；作为算符恒等式在合适的稠定域上成立需要泛函分析细节，文献不给。"
  - "共轭动量 Π^i 的具体形式来自光锥规范固定后的拉氏量 (1.3.11)，那一步是 physical-argument（见依赖 worldsheet.light-cone-gauge-lagrangian），故本推导的有效状态不高于 physical-argument。"
  - "本推导只处理横向模。α^-_n 由约束解出后的对易关系（含正规序）不在此处，见 worldsheet.light-cone-normal-ordering-constant 与 worldsheet.critical-dimension-light-cone。"
author: curator-polchinski-ch1
