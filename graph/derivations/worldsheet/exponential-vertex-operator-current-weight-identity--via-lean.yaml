summary: |
  机器检查的证明，走**刚性**（不是对易子计算）。

  **为什么不能走对易子。** 目标左端 Σ_J (b·α_{−J}) V^{(b)}_{L−J} 是**乘积**不是李括号，
  所以 `Fock.lie_*` 系列（含 `lie_Lop_vertexOsc`、`lie_mode_vertexOsc`）全都用不上；
  文件头第 1 条还独立复核了"由 ⁅L_0, V⁆ + 同点乘积 (5a) 推出本卡"这条路**走不通**
  （L_0 按 Leibniz 只见两因子权之和，L = 0 时退化成 0 = 0）。
  因此必须引入新对象 `Fock.dotMode`（电流的洛朗模）。

  **第一块（目标 (1)，局部有限性）。** 上端直接是
  `vertexOsc_apply_eq_zero_of_levelBound_lt`（levelBound P + (L − J) < 0 ⟹ V^{(b)}_{L−J}P = 0）。
  下端需要**先把电流换到右边**：`dotMode_vertexOsc_comm`（收缩向量与顶点动量正交，
  此处两者都是 b，故用掉 `hbb`）把 (b·α_{−J}) 移过 V^{(b)}_{L−J}，
  再用 `dotMode_apply_eq_zero_of_modeBound_lt`（modeBound P < −J 时为零）。
  两端合成窗口 `currentIdx L P = Finset.Icc (-(modeBound P)) (L + levelBound P)`
  （`dotMode_vertexOsc_apply_eq_zero_of_notMem`），于是 `lsumLocFin` 可用，
  得到算子 `Fock.vertexCurrent`（`hη`、`hbb` 是定义的参数）。

  **第二块（真空值，`vertexCurrent_apply_one`）。** 在 {0} ∪ Ioc 0 (max L 0) 上求和：
  · J = 0 项：`dotMode_zero` 给 (b·a) • Φ_L；
  · J ≥ 1 的尾：`vertexOsc_apply_one` 把 V^{(b)}_{L−J}(1) 写成 Φ_{L−J}，
    整条尾正好是欧拉型递推 `sum_mode_creaExp_eq_smul`，给 L • Φ_L；
  · J < 0 的湮灭尾不出现（`annihilation_creaExp` 给出 (b·b) Φ = 0，这里 b·b = 0）。
  合计 (L + b·a) • Φ_L，与右端在真空上相同。
  ⇒ **这解释了常数为什么是 L + b·a**：b·a 全部来自 J = 0 那一项，即零模。

  **第三块（组装，刚性）。** `vertexCurrent_X_mul` 证明左端满足产生模态递推，
  它比 `vertexOsc_X_mul` 多一项 k b^μ V_{L+k}（来源 `dotMode_X_mul`：
  ⁅b·α_{−J}, α^μ_{−k}⁆ = k b^μ δ_{J,−k}）；而右端 (L + b·a) V_L 的前缀 L 在递推里
  也恰好多出**同一项**。两者相消，故两边满足同一条递推；配上第二块的真空值，
  由 `eq_zero_of_vertex_recursion` 得两边之差为零（`sub_eq_zero`）。

  **假设核对**：恰好 `hη : ∀ μ, η μ * η μ = 1` 与 `hbb : dotVec η b b = 0` 两条。
  **没有** DDF 归一化 `dotVec η b a = 1`（那只在塔上形式里出现，见目标 notes），
  没有对 L 的限制，没有 a 的任何条件。
gaps:
  - |
    (i) **「b·b ≠ 0 时恒等式带反常项」未被证明**。目标【不断言】(a) 与
    【b·b = 0 用在哪三处】(i)：那只是 Lean 文件头 "Mathematical remarks" 第 2 条的注记
    （逐字引在目标 sources 的 note 里），**不是定理**；Lean 侧没有 b²/z 型缩并的形式级数。
    可核对的部分是 (ii)(iii)：`hbb` 在本文件里确实只经"电流与顶点算子对易"这一条进入
    （`dotMode_vertexOsc_comm`），以及由它给出的窗口下端。
  - |
    (ii) **欧拉递推在图上没有自己的卡**，本推导对
    worldsheet.exponential-vertex-operator-mode-weight-identity-v2 的那条边因此标 inferred，
    且**不得**被读成"本卡依赖 [L_m, V]"（目标【不断言】(b)）。已在 depends_on 里提请 lead 拆卡。
  - |
    (iii) **塔上形式不在本推导的目标里**。m Σ_J (k_0·α_{−J}) V^{(m)}_{K−J} = K V^{(m)}_K
    （Lean `towerCurrentVertex_eq`）额外需要 2α' k_0·p = 1，按"一个节点一个命题"
    不写进目标卡；它作为 worldsheet.tower-vertex-weighted-mode-sum--via-lean 的一步出现。
  - |
    (iv) **本推导不支持 worldsheet.ddf-transverse-oscillator-algebra-v2 的任何部分**，
    它只是 (5b) 的原子输入；(5b) 本身见 worldsheet.tower-vertex-weighted-mode-sum。
  - |
    (v) **一般交换 ℚ-代数，无实结构、无幺正性、无解析结构、无零模算符**（零模只是参数 a）。
    ℚ-代数是必需的：真空值那一步的欧拉递推要除以 M。
