    inferred: false
    note: |
      提供**代数** Fock 空间 F = R[X_{μ,l}]、产生/湮灭算子 α^μ_{∓l}（l ≥ 1）的显式实现
      （α^μ_{−l} = 乘 X_{(μ,l)}、α^μ_l = (l η^{μμ})∂/∂X_{(μ,l)}）与 level / modeBound 记账。
      本推导的电流 (b·α_{−J}) = Σ_μ η_μ b^μ α^μ_{−J} 逐项就是这些算子的线性组合
