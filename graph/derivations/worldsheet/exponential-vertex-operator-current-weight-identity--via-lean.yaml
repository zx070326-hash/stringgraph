      ⚠ 该卡明确**不含零模** α^μ_0，故 J = 0 的那一项另挂下一条边。
      ⚠ 该卡是 formalized 定义卡，故这条边不压低本推导的有效状态。
  - id: worldsheet.virasoro-generators-free-boson
    inferred: false
    note: |
      **只为零模 α^μ_0 = a^μ 这一条**。本推导需要 J = 0 时 (b·α_0) = (b·a)·id
      （Lean `Fock.mode_zero` / `Fock.dotMode_zero`），而 worldsheet.bosonic-fock-space
      的缺口 (i) 明确说该卡不含 α^μ_0。图上写下"α^μ_0 在整个 F 上就是标量 (2α')^{1/2}k^μ 乘法"
      的地方是这张卡：其 statement 给出 α^μ_0|0;k⟩ = √(2α') k^μ|0;k⟩，notes 里逐字论证
      「[α^μ_0, α^ν_n] = 0 对**一切** n …… **α^μ_0 在整个 F 上就是标量 √(2α') k^μ 乘法**」。
      Lean 侧 `Fock.mode`（含 j = 0）也正是定义在该卡的 lean_file `Sugawara.lean` 里。
      ⚠ 本推导**不使用** L_m 本身，也不使用 Virasoro 括号或中心荷；只用零模的标量值。
      ⚠ 该卡是 formalized 定义卡，故这条边不压低本推导的有效状态。
  - id: worldsheet.exponential-vertex-operator-mode-weight-identity-v2
    inferred: true
    note: |
      **inferred: true，且是"零件级"依赖——请勿读成"本卡是 [L_m, V] 的推论"。**
      本推导**不调用**那张卡断言的命题（`Fock.lie_Lop_vertexOsc`）；目标卡【不断言】(b) 明说
      两者逻辑独立，Lean 文件头 "Mathematical remarks" 第 1 条也逐字记下 L_0-Leibniz 那条路
      **走不通**（「gives `T_L + U_L = L S_L` with two unknowns, and degenerates to `0 = 0` at
      `L = 0`」）。
      本推导用的是那张卡的 Lean 文件家族（`VertexWeight.lean`）里的一个**零件**：
      欧拉型递推 `Fock.sum_mode_creaExp_eq_smul`（等价形式 `Fock.creaExp_euler`），
      即 M·Φ_M = Σ_{l=1}^{M} (b·α_{−l}) Φ_{M−l}，本推导用它算真空值
      （`vertexCurrent_apply_one` 的 htail 分支逐字 `rw [← sum_mode_creaExp_eq_smul …]`）。
      该欧拉递推在图上**没有自己的卡**。
      ⇒ 这条边指向的是"承载那个 Lean 零件的卡"，不是那张卡的命题内容，故标 inferred。
      ⚠ 正确的修法（提请 lead）：把欧拉递推 `creaExp_euler` 单立一张 formalized 卡
      （「相干态系数的欧拉型递推」，它同时是 orthogonal-momentum-vertex-operators-commute、
      本卡、(5a) 三处的共同零件），本推导改挂到它，这条 inferred 边即可撤销。
      ⚠ 那张卡是 formalized，故这条边不压低本推导的有效状态。
