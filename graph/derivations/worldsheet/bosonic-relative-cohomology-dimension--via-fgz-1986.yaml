summary: |
  **FGZ 的论证（四步，前三步是 FGZ 明写的推论链，第 3 步的代数是本图补的一行）**：

  1. **一般命题**：对**任意**属于 𝒪₀ 的厄米 ℒ⁻-自由 ℒ-模 V，Proposition 2.4 给出
     dim H^m_∞(ℒ, ℒ₀; V) = 0 (m ≠ 0)，且 **dim H⁰ = Eq. [2.3] 中常数项（"the coefficient of 1"）
     的系数**。Prop 2.4 自身 = Theorem 1.12（消灭）+ Proposition 1.3（Euler–Poincaré），
     原文逐字 "This implies the following"，不另给证明。
     ⇒ 消灭那一半正是本推导第一条依赖边所指的卡（Theorem 2.7(i)）。

  2. **验证假设**：V = V(E,p) 的 ℒ⁻-自由性由 **Proposition 2.6(i)** 给出（前提 号差 (D−1,1)、
     D ≥ 2、**p ≠ 0**），厄米性由同页 π(L_m)* = π(L_{−m}) 给出。
     ⇒ **p ≠ 0 只在这一步进入**（researcher §9.9.2）。

  3. **算 Eq. [2.3] 的常数项**（这一行 FGZ 不印，是把上面两条逐字相乘的直接代数）：
       Eq. [2.3] 左端 = q^{−1} φ²(q) · ch_q V(E,p)
                      = q^{−1} φ²(q) · q^{p·p/2} φ(q)^{−D}
                      = q^{p·p/2 − 1} φ(q)^{2−D}.
     代 (H3) 的 **D = 26** 得 q^{p·p/2 − 1} φ(q)^{−24}。取 q⁰ 项的系数即取
     φ(q)^{−24} 中 q^{1 − p·p/2} 的系数，按 (H5) 的定义就是 **p_{(24)}(1 − p·p/2)**。
     ⇒ **24 = D − 2 这个下标完全由 D = 26 决定**（目标卡"不断言 (c)"的补注）。
     ⇒ **分段的第二支也在这一步出来**：若 1 − p·p/2 不是非负整数，则 q^{1−p·p/2} 这一项
     根本不在形式幂级数 φ(q)^{−24} = Σ_{n≥0} p_{(24)}(n) q^n 的支撑集里，系数为 **0**。

  4. **结论**：dim H⁰_∞(ℒ, ℒ₀, V(E,p)) = p_{(24)}(1 − p·p/2)（1 − p·p/2 为非负整数时），
     否则为 0，即 Theorem 2.7(ii)。

  **这一步不做**：正定性与"H⁰ ≅ 横向空间"是 **Theorem 2.8**；显式代表元的构造用
  Proposition 2.6 的**第二部分**（经 Kac 行列式）。两者都不在本推导里（目标卡"不断言 (b)(g)(h)"）。

  ⚠⚠ **【FGZ 自列的四条输入不是四条互相独立的输入】**（researcher 第二轮 §9.9.4）
  Prop 2.4 = Thm 1.12 + Prop 1.3，故 "Thm 2.7 → Thm 1.12" 与 "Thm 2.7 → Prop 2.4 → Thm 1.12"
  是**同一条论证的两次记账**。本推导按此**只挂两条边**（消灭卡 + 自由性卡），
  而不把 Thm 1.12 / Prop 1.3 / Prop 2.4 分别当成三条独立输入——它们在本图都没有卡，
  且其中两条已经由消灭卡承载。

  【为什么标 rigorous】四条，与
  worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 **同一口径**：
  (1) 结论是**带编号的定理**（Theorem 2.7(ii)），陈述已逐字核实（L1 页图）；
  (2) **证明链是 FGZ 自己列出的**（"the vanishing theorem (Theorem 1.12), the Euler–Poincaré
      principle (Proposition 1.3), Proposition 2.4, and the first part of Proposition 2.6
      imply the following"），每一环都有编号，无"一点思考就知道"式的断言；
  (3) 论证全在有定义的对象里（形式幂级数的系数比较、分次模的特征标、半无限上同调），
      **不涉及路径积分、不涉及收敛性问题**——φ(q)^{−D} 一律作形式幂级数处理；
  (4) 期刊是 PNAS（Communicated by I. M. Singer），作者三人是数学家，这是数学文献。
  ⚠ **限制**：FGZ 的措辞是 "imply the following"，即本文**不给 Theorem 2.7 的独立证明**，
  rigorous 是按"已核实的编号定理 + 该文明写的输入"给的，不是按逐行复核给的（见 gaps）。
  ⚠ 第 3 步的那行代数是**本图补的**，但它是两条逐字公式的直接相乘 + 取系数，
  属 docs/STATUS_LEVELS.md 说的"有限步初等计算"，不构成降级理由；且它不改变结论，
  只解释 24 从哪来。
