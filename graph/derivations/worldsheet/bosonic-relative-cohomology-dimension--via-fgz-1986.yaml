      供给 Euler–Poincaré 那一步**必须**的前提：H^i_∞ = 0 对 i ≠ 0（Theorem 2.7(i)）。
      没有它，形式 Euler 特征标 Σ_i (−1)^i dim H^i 只给一个交错和，**不等于** dim H⁰。
      **非 inferred，两条理由**：
      (1) FGZ 在 Theorem 2.7 正上方逐字把 "**the vanishing theorem (Theorem 1.12)**" 列为输入，
          而 (i) 就是 Thm 1.12 特化到 V(E,p) 的结果（同一段的 Proposition 2.4 也把"消灭"
          与"维数"写在**同一条**命题里，逐字见 sources）；
      (2) 目标卡与本边所指的卡是**同一个编号定理的两条**（2.7(ii) 与 2.7(i)），
          FGZ 自己在定理后一句用 "Theorem 2.7 implies that the cohomology groups are trivial
          except for a one-dimensional H⁰_∞ …" 把两条一起读。
      ⚠ **本边把目标卡的 (H1)–(H4) 与 p ≠ 0 一并继承**：本推导不重复论证那些前提，
      只在目标卡里把它们逐条写出。
      ★ **不构成循环**：(i) 的证明（Prop 2.6(i) → Thm 1.12）**不用**维数公式；
      方向是 2.6 → 1.12 → 2.7(i) → 2.7(ii)，与图上的边同向。
      ★ 本边同时把目标卡需要的**对象接口**（ℒ = Virasoro、相对半无限上同调、本图 BRST 侧的
