notes: |
  【本推导与消灭卡推导的分工】
  worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 的 summary 第 4 步逐字写着
  「**（不属本卡）**维数由 Proposition 1.3（Euler–Poincaré）与 Proposition 2.4 定出，
  得 Theorem 2.7(ii) 的 p_{(24)}(1 − p·p/2)。本推导**不走这一步**。」
  ⇒ **本推导就是那一步**。两条推导合起来覆盖 Theorem 2.7 的 (i)(ii)，不重叠。
  那条推导的 gaps 第二条（"Proposition 2.4 的前提本图未核实 … 若日后要把 (ii) 建卡，
  必须先核它"）**已由 researcher 第二轮 §9.9 关闭**（Prop 2.4 的三条假设：厄米、ℒ⁻-自由、
  属 𝒪₀），本推导据此建立。
  ⚠ 那张消灭卡的 statement 与 notes 里仍有"Prop 2.4 的歧义留给 reviewer / 下一轮 researcher"
  的旧文字。按 graph/CLAUDE.md 的换代纪律，**不就地改**已提交卡的正文；本条记在此处，
  待那张卡下次实质换代时同步。

  【为什么只有两条依赖边】
  FGZ 自列四条输入（Thm 1.12、Prop 1.3、Prop 2.4、Prop 2.6 的第一部分），但
  (a) Prop 2.4 = Thm 1.12 + Prop 1.3（§9.9.4），三者在图上都没有卡；
  (b) Thm 1.12 那一半已由消灭卡承载，本推导经第一条边继承；
  (c) Prop 2.6(i) 有卡，即第二条边。
  ⇒ 两条边，不重复记账。对象接口边（Virasoro 代数、BRST 量子化、幂零性）同样经消灭卡继承，
  本推导不重挂——这与 docs/STATUS_LEVELS.md「接口边」那节的精神一致：
