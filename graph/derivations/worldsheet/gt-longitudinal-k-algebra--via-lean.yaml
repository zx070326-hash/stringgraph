summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/Longitudinal.lean 内完成，
  是本仓库既有 DDF 引理在偏振 ε := b 处的特化（蓝图 §A.1 的观察）：

  0. **定义**：`kOp η a b m := towerModeVec η a b b m`，即 K_m = Σ_μ η_μ b^μ α^μ_m。
  1. **(1) [L_m, K_n] = −n K_{m+n}**：`lie_towerLop_kOp hη m n` 逐字就是
     `lie_towerLop_towerModeVec η a b b hη m n`。**只用 hη**。
  2. **(2) [K_m, K_n] = 0**：`lie_kOp_kOp hη hbb m n`——`lie_towerModeVec_towerModeVec` 给出
     `(if m + n = 0 then m * dotVec η b b else 0) • id`，`hbb` 把它化为零。
  3. **(3) K_0 = id**：`kOp_zero_eq_id hbb hba`——在每个 `single j P` 上，K_0 作用为标量
     `dotVec η b (towerMomentum a b j)`，由 `dotVec_towerMomentum_right_of_isotropic hbb` 等于
     `dotVec η b a`，再由 `hba` 等于 1；`Finsupp.lhom_ext` 延拓到整条塔。
  4. **(4) K_m† = K_{−m}**：`towerPairing_kOp_left m v w` 逐字就是
     `Fock.towerPairing_towerModeVec_left η a b b m v w`。**无假设**。
  5. **(5) [K_m, A^ε_n] = 0**：`lie_kOp_ddfOp hη hbb hεb m n`——先证 K_m 与每个单项
     α^ε_j V^{(n)}_j 对易（`kOp_mul_ddfSummand`：`kOp_mul_towerVertex` 用 `hbb`，
     `kOp_mul_towerModeVec` 用 `hεb`），再取窗口 `ddfWindow n x ∪ ddfWindow n (kOp η a b m x)`
     用 `ddfOp_apply` 把 A^ε_n 在 x 与 K_m x 上都展成同一有限和，逐项比对。
     **没有望远镜求和、没有边界项**（与 [L_m, A^ε_n] = 0 的证明不同）。

  【Lean 比目标卡更一般的地方（目标卡是特例，故 formalized 成立）】
  · `kOp` 对**任意** b 有定义，(N)(S) 只是 (2)(3)(5) 的定理假设；
  · (5) 对一切 m, n ∈ Z 含 n = 0；
  · 系数环是任意交换 Q-代数（(1)(5) 需 `[Algebra ℚ R]`，(2)(3)(4) 连这个都不需要）。
  【Lean 给出而目标卡不断言的】`towerKerK`、`ddfCharacterization`（定义）与三条「DDF 算子保持
  K 条件」的引理（`ddfOp_mem_towerKerK` 等）——它们是 `ddf-spans` 的基础设施，见目标卡 notes。
