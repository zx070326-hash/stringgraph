summary: |
  两步组装（section KernelFive）：
  (1) 通用核界（§B⁗.3 (c)，`finrank_ker_descPair_add_le`，N=5 实例）给
      dim ker T₅ + p_D(5) ≤ p_D(4) + p_D(3) + p_{D−1}(5)——**D-无关、rung-无关**，秩-零化度
      加 dim V_{j,M}=p_D(M) 精确与 b̃-free 覆盖上界拼成；
  (2) κ₅=1 计数（math.level-five-partition-difference 的 levelFive_count_identity_full，D−1 形）
      给 p_{D−1}(5) + p_D(4) + p_D(3) = p_D(5) + 1，即右端 = p_D(5) + 1。
  两者经 `omega` 得整片版 dim ker T₅ ≤ 1（目标卡整片断言）；种子版由
  `finrank_ker_seedPair_le`（Q×Q 上核 ⊆ 整片核）经 `le_trans` 得到。
  **D=26 从不出现**（该定理 docstring 逐字）；与 N=4 的对照是 κ₄=0 给横截（ker=0）、
  κ₅=1 给重叠至多一维（ker≤1）。
gaps:
  - "**通用核界内部计数引理不建 depends_on 边**：finrank_ker_descPair_add_le 依赖的 finrank_towerBigrade（dim V=p_D）、finrank_conjFreeSliceAt_le（b̃-free 上界）、towerBigrade_le_conjFreeSliceAt_sup_range_descPair（覆盖）都是 DescendantKernel.lean 内部引理，不对应图上既有节点；本推导把它们当作自身证明内容的一部分。"
  - "**只证上界 ≤ 1，不证下界 = 1**：ker T₅ 恰为一维（+1 确被实现）由 U(Vir⁻) syzygy 给出，仍停留在 worldsheet.ocq-null-state-two-families notes【2026-09-14 §B⁗.8】的 ⟨手算⟩ 层面，本推导不覆盖（目标卡明确不断言 (c)）。"
  - "**只做 N=5 这一个 level**：≤ 1 是 κ₅=1 专属；N≥6 的 κ_N 一般不再是 1（Euler 五边形数），本推导不覆盖（目标卡明确不断言 (d)）。"
