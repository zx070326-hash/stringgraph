    inferred: false
    note: |
      **被断言伴随关系的那个对象（振子半）**：该定义卡的 formal.lean_decl
      `StringFormal.NoGhost.Fock.vertexOsc`，以及它写下的两半拆分
        V^{(b)}_J = Σ_{p+q=J} E₋(b)_p E₊(b)_q，
        E₋(b;z) = exp(Σ_{l≥1}(b·α_{−l}/l) z^l)，E₊(b;z) = exp(−Σ_{l≥1}(b·α_l/l) z^{−l})，
      「E₋ 是乘以一个显式 Fock 元素（`creaExp`）、E₊ 是变量平移（`vertexSub`）」。
      本推导的 Fock 层结论 `Fock.pairing_vertexOsc_left` 正是关于这个对象的定理，
      其证明逐字沿着该卡的两半拆分走（先 `pairing_creaExp_left`、再 `pairing_vertexAnn_left`，
      最后在 `vertexOsc_apply` 的有限窗口求和上对项求和）。
      ⚠ 该卡是 formalized 定义卡，故这条边不压低本推导的有效状态。
  - id: worldsheet.fock-indefinite-form
    inferred: false
    note: |
      **逐层的双线性型本身与第 1 步的核心输入**：陈述 (1)(b)「产生与湮灭互为伴随」
      (α^μ_{−n})† = α^μ_n。Lean 侧本推导第 1 步的两条（`Fock.pairing_creaExp_left`、
      `Fock.pairing_vertexAnn_left`）都是把它逐因子用在指数的一半上；
      该卡 formal.lean_decl `Fock.pairing_unique` 所在文件 Fock.lean 的
      `Fock.pairing_mode_left` 把它延拓到**一切整数模指标含 m = 0**，本推导用的是延拓版本。
      **不**使用该卡的 (4)（不定性）。
      ⚠ 该卡 effective = formalized，故这条边不压低本推导的有效状态。
  - id: worldsheet.momentum-tower-fock-space
    inferred: false
    note: |
      **承载断言的空间与型**。目标 (1) 的等式跨两层（V^{(n)}_J：第 N 层 → 第 N+n 层），
      只在塔上、且只在「层间正交」这条约定下有意义。该卡的 formal.lean_decl
      `StringFormal.NoGhost.Fock.towerPairing` 就是本推导中的 ⟨·,·⟩_T；
      本推导还直接用到该卡的 (1)（移位算子 S_n = `towerShift n`）与
      (4)（S_n^† = S_{−n} = `towerPairing_towerShift_left`），后者正是目标 (2)(b)。
      ⚠ **层间正交在 Lean 里是 `towerPairing` 的定义及其展开 `towerPairing_single_single_of_ne`，
      不是被证明的物理事实**（不是 ⟨p|p′⟩ ∝ δ^D(p−p′) 的推导）；本推导借到的是
      「这套约定自洽」，见 gaps 第 2 条。该卡是 formalized 定义卡，不压低本推导状态。
  - id: worldsheet.ddf-operators-v6
    inferred: true
    note: |
      **inferred: true。** 本推导用到 `towerVertex` 这个**定义**（塔上顶点算子的 z^K 洛朗系数，
      含把洛朗指标移 −n 的单值因子记账：`towerVertex η b n K w j = vertexOsc η (n·b) (K−n) (w (j−n))`）。
      图上唯一写下这个定义的地方是该卡的【顶点算子的模】一段，但该卡的 `formal.lean_decl`
      指向 `ddfOp`（DDF 算子），**不是** `towerVertex`；后者在该卡里只是定义 A^ε_n 时顺带引入的记号。
      ⇒ 这条边指向的是「该卡文本里的一段记号约定」，不是该卡 formal 声明的内容，故标 inferred。
      ⚠ 正确的修法（已由 worldsheet.isotropic-tower-vertex-operators-commute--via-lean 的 gaps (iv)
      提请 lead，本推导重复提请）：把 `towerVertex` 拆成一张 formalized 定义卡。
      ⚠ 该卡是 formalized 定义卡，故这条边不压低本推导的有效状态。
