summary: |
  机器检查的证明。与姊妹推导 --via-radial-conjugation（径向共轭 z ↦ 1/z̄ + 指数算符两半重排序）
  是**两条独立路线**：本推导不使用径向共轭，也**没有重排序这一步**（见下面第 2 步）。

  **第 0 步（对象与型）。** Fock 空间是多项式环 `Fock D R = MvPolynomial (Osc D) R`
  （worldsheet.bosonic-fock-space 的代数模型），型是 `Fock.pairing η`（R-**双线性**，非半双线性；
  唯一的标准假设是 `hη : ∀ μ, η μ * η μ = 1`）。塔是 `TowerFock D R = ℤ →₀ Fock D R`，
  塔上的型是各层配对的**单位权求和** `Fock.towerPairing η`。
  正规序指数的振子部分按 worldsheet.exponential-vertex-operator-modes 拆成两半：
  E₋(b) = `creaExp`（乘以一个显式多项式）、E₊(b) = `vertexAnn`（由 `vertexSub` 变量平移给出），
  V(b)_K = `vertexOsc η b K` = Σ_{L} E₋(b)_{−L+K...} ∘ E₊(b)_L 的有限窗口求和（`vertexOsc_apply`）。

  **第 1 步（两半各自的伴随）。**
    · `Fock.pairing_creaExp_left`：⟨E₋(b)_j · v, w⟩ = ⟨v, E₊(−b)_{−j} w⟩，即 **Φ_j(b)† = Ψ_j(−b)**；
    · `Fock.pairing_vertexAnn_left`：镜像的 **Ψ_L(b)† = Φ_L(−b)**。
  两条都由单振子的 (α^μ_m)† = α^μ_{−m}（worldsheet.fock-indefinite-form 的内容，
  Lean 侧 `Fock.pairing_mode_left`）逐因子推出。
  **动量为什么翻号**：E₋(z) = exp(+Σ_{m>0}(b·α_{−m}/m) z^m) 与 E₊(z) = exp(−Σ_{l>0}(b·α_l/l) z^{−l})
  的指数带**相反**的整体符号，故映射 α^μ_m ↦ α^μ_{−m} 把 E₋(b) 送到 E₊(−b) 而**不是** E₊(b)。
  这不是约定问题：`Fock.add_self_eq_zero_of_pairing_vertexOsc_same_momentum` 证明了
  若「同动量」版本 ⟨V(b)_K v, w⟩ = ⟨v, V(b)_{−K} w⟩ 对某一个 b 成立，则 2b = 0
  （见证：v = |0⟩、w = α^μ_{−1}|0⟩、K = 1，左端 = b^μ、右端 = −b^μ）。

  **第 2 步（合成，单层）：`Fock.pairing_vertexOsc_left`，⟨V(b)_K v, w⟩ = ⟨v, V(−b)_{−K} w⟩，对一切 b。**
  这是本推导相对姊妹推导的关键差别，值得写明：
  **「同点 E₊E₋ 重排序」这一步根本不存在。** V(b)_K 是**正规序**的乘积 E₋(b)E₊(b)；
  它的伴随按反序取为 E₊(b)† E₋(b)† = E₋(−b) E₊(−b)，**本身已经是正规序**——产生因子自动落在左边，
  不需要把 E₊ 换到 E₋ 右边，因此**不会产生任何 c-数自缩并因子**，也就**不需要 b·b = 0**。
  Lean 证明的技术内容只是把两边写成同一个有限和：左端用 `vertexOsc_apply η b K v`
  展成 Σ_{L ∈ s}，逐项用第 1 步的两条；右端用 `vertexOsc_apply η (−b) (−K) w` 展开并把
  求和指标沿 L ↦ K + L 重标（`Finset.sum_image`，单射性由 `omega`），两边逐项相同。
  窗口 s 取 `vertexIdx b v ∪ (vertexIdx (−b) w).image (· − K)`，
  有限性由 worldsheet.exponential-vertex-operator-modes 的局部有限性给出。
  `Fock.pairing_vertexOsc_left_of_dotVec_zero` 把目标卡写的 b·b = 0 版本列为一行平凡特例。

  **第 3 步（塔上，目标 (1)）：`Fock.towerPairing_towerVertex_left`，(V^{(n)}_K)† = V^{(−n)}_{−K}。**
  由 `Finsupp.lhom_ext` 逐层化归到 rung 基 `Finsupp.single i P`，再用 `towerVertex_apply`
  把塔上的作用写成「层标签移 n + 逐层作用 `vertexOsc η (n·b) (K−n)`」，于是本条分成两个独立的半：
    · **零模半**：层标签 i ↦ i + n 与 i ↦ i − n 的配对由 `towerPairing_single_left` /
      `towerPairing_single_single_of_ne`（层间正交）挑出唯一非零配置，这正是目标 (2)(b) 的
      S_n^† = S_{−n}（`towerPairing_towerShift_left`）；
    · **振子半**：`vertexMomentum b (−n) = −vertexMomentum b n`（一行 `push_cast; ring`）
      把 Fock 层的 b ↦ −b **吸收成塔上的 n ↦ −n**，然后调用第 2 步。
      洛朗指标的记账是 `(−K) − (−n) = −(K − n)`，即第 2 步里的 K ↦ −K 在移位后仍是纯反射。
  这就是为什么在塔上看不到 Fock 层的动量翻号：−(n b) = (−n) b。

  **k_0² = 0 在本推导中做什么（与目标卡 statement 的读法）。** **伴随关系本身不用类光**：
  第 2、3 步全程只有 `hη`，没有 `dotVec η b b = 0`，也没有归一化 `dotVec η b a = 1`。
  类光性与 (★) 的作用只剩**一条**：保证单值性指数 2α' n k_0·(p + N k_0) = n 与层指标 N 无关，
  从而「V^{(n)}_K 的洛朗指标是整数、且位移 K ↦ K − n 与层无关」这句话有意义——
  而这一点在 Lean 里已经**烘进 `towerVertex` 的定义**（位移写死为 −n），不是本推导的假设。
  故目标 (1) 的「设 k_0² = 0」是一条**未被使用的前提**（Lean 版本更强），
  目标边界 (e)（k_0² ≠ 0 时结论不成立）**没有**被本推导支持，也没有被它否定：见 gaps 第 1 条。

  **目标 (2)(b)** 就是第 3 步的零模半（`towerPairing_towerShift_left`），已机器验证。
  **目标 (2)(a)**（n = 0）作为伴随等式是第 3 步取 n = 0 的实例，已覆盖；
  但它给出的**理由**（「V^{(0)}_J = δ_{J,0}·id，两侧退化为 δ_{J,0}⟨v,w⟩」）**没有**在 Lean 中证明：
  `vertexOsc η 0 K = δ_{K,0}·id` 这条引理不存在，见 gaps 第 3 条。
gaps:
  - |
    **目标边界 (e)「k_0² ≠ 0 时伴随关系不再成立」未被支持，且按本推导的内容它多半是错的。**
    目标 statement 的边界 (e) 写「k_0² ≠ 0 时正规序指数的两半重排序会留下一个 z 的非零次幂
    （∝ z^{2α' n² k_0²}），伴随关系不再是纯粹的指标反射」。本推导表明**那一步重排序并不发生**：
    伴随把 E₋(b)E₊(b) 送成 E₋(−b)E₊(−b)，本身就正规序。Lean 的
    `Fock.pairing_vertexOsc_left` 对**任意** b 成立，塔上的 `towerPairing_towerVertex_left`
    同样不需要 `dotVec η b b = 0`。
    ⇒ 边界 (e) 现在的地位是：**一条本图未证、且与已机器验证的结论表面冲突的注记**。
    两者可以并存的唯一读法是「k_0² ≠ 0 时 V^{(n)}_K 的洛朗指标不再是整数、塔的记账失效」，
    即 (e) 实际在说**定义**失效而非伴随失效——但目标 statement 的措辞说的是重排序因子。
    ⚠ **不能就地改陈述文本**（项目原则 1）。curator 已在本轮报告中提请 lead/auditor：
    若确认，应新建 worldsheet.vertex-operator-adjoint-v2，把 (1) 改成「对一切 b（不必类光）」
    并把 (e) 改写为「k_0² ≠ 0 时失效的是洛朗指标的整数性，不是伴随关系」。
    在此之前，本推导证明的是目标 (1) 的**一个更强命题**，故仍然是对目标 (1) 的合法证明。
  - |
    **层间正交是约定，不是结论。** 目标 (1) 的等式跨两层，其成立依赖
    worldsheet.momentum-tower-fock-space (2) 规定的「N ≠ M 时跨层配对为零」。
    Lean 侧这是 `towerPairing` 的**定义**（各层 `Fock.pairing` 的单位权求和）及其展开
    `towerPairing_single_single_of_ne`，**不是** ⟨p|p′⟩ ∝ δ^D(p−p′) 的推导；
    本图没有节点承载连续动量本征态与 δ 归一化。形式化关闭的是「从这条约定出发的推理」，
    不是这条约定本身。
  - |
    **目标 (2)(a) 的理由未形式化。** n = 0 的伴随等式已被覆盖（第 3 步取 n = 0），
    但目标写的理由「V^{(0)}_J = δ_{J,0}·id」在 Lean 中没有对应引理
    （`vertexOsc` 在 b = 0 处的退化未证；2026-09-12 curator 在
    formal/StringFormal/NoGhost/*.lean 全文 grep `vertexOsc_zero` 零命中）。
  - |
    **R-双线性，不是 Hermitian 半双线性。** 继承目标边界 (a)：Lean 侧全程不做复共轭，
    「†」是双线性型的转置。物理上的协变 Fock 空间是复空间、带 Hermitian 形式，
    其上的 † 还含一次复共轭；两者在实极化下一致，**复情形本图与 Lean 侧均未做**
    （VertexAdjoint.lean 文件头 "Remaining gaps" 第 1 条逐字：
    "Still `R`-bilinear, not Hermitian; no positivity, no completion, no zero modes beyond the tower."）。
    这条对无鬼定理尤其要紧：无鬼定理断言的是 Hermitian 形式的半正定性。
  - |
    **没有正定性、没有完化、没有塔以外的零模。** 同上文件头逐字：本文件里
    **没有任何东西说 DDF 态有正模**；那需要本推导的伴随关系**加上** DDF 对易关系
    （worldsheet.ddf-transverse-oscillator-algebra-v2 / worldsheet.transverse-ddf-fock-gram-matrix）
    合起来，而那个装配不在这里。
  - |
    **围道积分写法与模态和写法的等价仍未形式化。** 目标 statement 把 V^{(n)}_J 说成
    :e^{i n k_0·X(z)}: 的洛朗系数；Lean 侧只有代数模型里的 `vertexOsc` / `towerVertex`，
    「:e^{i n k_0·X(z)}: 作为形式级数/算子值分布」这个对象不存在。
    该字典在图上的承载是 worldsheet.ddf-contour-equals-mode-sum（physical-argument）。
  - |
    **`towerVertex` 在图上没有自己的定义卡**（本推导对 worldsheet.ddf-operators-v6 的边因此标
    inferred）。与 worldsheet.isotropic-tower-vertex-operators-commute--via-lean 的 gaps (iv)
    是同一条，重复提请 lead 补卡。
notes: |
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
  （lake build 通过、目标声明无 sorry、公理仅 propext / Classical.choice / Quot.sound）。
  合并前应由 lead 跑 `uv run stringgraph check-axioms`。

  **【本推导与姊妹推导 --via-radial-conjugation 的关系】** 两条并存，工具取高者
  （docs/STATUS_LEVELS.md「一个节点若有多条推导，取最强的那条」）。姊妹推导保留为
  **物理论证的历史记录**：它记下了文献里这一步是怎么被跳过的，以及按径向量子化的标准叙述
  应该怎么展开。本推导表明那套叙述里**有一步是多余的**——「同点 E₊E₋ 重排序」——
  姊妹推导的 gaps 与本卡 notes 已相应标注【已消解 2026-09-12】。
  两条路线的**机器不同**：姊妹推导走 z ↦ 1/z̄ 的解析共轭 + 重排序 c-数；
  本推导走代数 Fock 空间上的逐因子伴随 + 有限窗口求和，不出现任何解析对象。

  **【本推导证明的比目标卡多三处】**（故目标卡是 Lean 的特例，formalized 成立）：
  (1) **不需要 k_0² = 0**（`pairing_vertexOsc_left` 对任意 b）——见 gaps 第 1 条；
  (2) **不需要归一化 2α' k_0·p = 1**（`hba` 从不出现）；
  (3) **对一切 n, K ∈ Z 含 n = 0**，且 ε / 横向标架完全不涉及（那是 DDF 层的事）。
  目标卡把 (1)(2) 写进前提，因此是更弱的命题。

  **【一条被机器证伪的写法】** 图上此前没有节点写「(V^{(n)}_J)† = V^{(n)}_{−J}」（同动量），
  目标卡写的一直是 V^{(−n)}_{−J}，**是对的**。
  `Fock.add_self_eq_zero_of_pairing_vertexOsc_same_momentum` 把这件事变成定理：
  同动量版本在任何 2 可逆（或只要 b ≠ −b）的系数环上都不成立。
  这条审计引理不对应任何图节点，只在本 notes 与目标卡 notes 中登记。

  **本推导 author 是 curator（接线），Lean 证明的作者是 formalizer**（见 sources 第一条的提交号）。
