      Q^μ 与 P^μ = i dQ^μ/dz 的模展开，a^μ_0 = p^μ）。
      **不承载本推导的论证**：该文不写模态和，也不讨论两种写法的等价。
      L1 逐字（literature/extractions/gsw-1987-v1.md §2 E1）。
  - ref: gsw-1987-v1
    loc: "§2.3.3, p.102–112（式号未核实）"
    note: |
      **不承载论证**。教科书同样只给围道写法。式号 L0。
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/DDFOperator.lean :: StringFormal.NoGhost.ddfOp / ddfSummand；formal/StringFormal/NoGhost/DDF.lean :: StringFormal.NoGhost.towerVertex / towerModeVec"
