id: worldsheet.descendant-weight-grading--via-virasoro-commutators
target: worldsheet.descendant-weight-grading
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.virasoro-algebra-v2
sources:
  - ref: polchinski-1998-v1
    loc: "§2.9, eq. (2.9.14)，p.72（式号经 schrans-2020 核实）"
    note: |
      来源在幺正 CFT 的语境里陈述该式；本推导只取其中的代数内容
      （L_0 本征值的分级），该部分与幺正性无关。
summary: |
  由 Virasoro 对易关系 [L_m, L_n] = (m-n) L_{m+n} + (c/12) m(m^2-1) δ_{m+n,0} 取 m = 0：
  中心项含因子 m(m^2-1)，在 m = 0 处为零，故 [L_0, L_{-k}] = k L_{-k}（对一切 k ∈ Z）。
  于是对 n 归纳，把 L_0 逐个交换到右端：
    L_0 L_{-k_1}…L_{-k_n} v
      = ( Σ_i k_i ) L_{-k_1}…L_{-k_n} v + L_{-k_1}…L_{-k_n} L_0 v
      = ( h + Σ_i k_i ) L_{-k_1}…L_{-k_n} v，
  最后一步用 L_0 v = h v。每个 k_i ≥ 1 故 Σ k_i ≥ n ≥ 1，权严格增加。
  分级结论随之：v 生成的模由这些单项式张成，各自是 L_0 的本征向量。
gaps:
  - "本推导**不**断言最高权模是不可约的、也不断言这些单项式线性无关（Verma 模的 PBW 基底
     与分级维数 p(N) 是另一回事，见 math.verma-module-free-over-negative-part——2026-09-11 起它取代
     worldsheet.verma-module-pbw-basis）；只断言它们是 L_0 的本征向量、
     本征值为 h + Σ k_i。"
  - "本推导**不**断言「每个态要么是最高权态、要么是某个最高权态的 descendant」——
     那个分解需要幺正性或完全可约性，不在本节点范围内。"
