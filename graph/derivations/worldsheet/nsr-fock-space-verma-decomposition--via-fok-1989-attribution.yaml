summary: |
  **本推导没有论证，只有一条归属，而且这条归属经核实是可疑的。** 完整内容是：

  1. FOK 1989 在 NS 扇区（p.111）断言「It was proven by Brower and Friedman [11] that this
     representation is fully reducible … infinite direct sum of Verma modules」，并据此逐 Verma
     模计算 BRST 上同调（其附录 A 的消灭定理 (A.14) 只对 Verma 模 M 陈述）。
  2. FOK 在 R 扇区（p.115）把同一归属降级为「Brower and Friedman **claim** to have proven …
     although they **do not write down the explicit spectrum generating algebra**」。
  3. **被归属的文献本身不支持它**（2026-09-11 researcher 核实）：
     Brower–Friedman 1973 的**摘要不含 "reducible"/"Verma"/"direct sum"**，
     且**标题与摘要都是 NS-only，完全没有 Ramond**；该文自称的成果是
     「NS 无鬼定理 + 谱生成代数 (A_n, B_s) + 正定范数共振态存在」。
  4. **这条主张在整个引用网络里只有一个出处**：35 篇引用方中只有 Figueroa-O'Farrill 本人
     1989 年的另一篇出现该措辞（逐字相同），**不是两条独立证言**；两条非 FOK 系的引用方
     （hep-th/9901116、hep-th/0011078）只把 Brower–Friedman 归到「NS 的 DDF/SGA 构造 + 无鬼定理」。
  5. **有反方向的明证**：LZ 1989 §2, eqs. (35)-(38), p. 320 的 Remark 用超 Virasoro（c = 10）的
     Kac 行列式说 `V(p,κ)` "**in general** not a direct sum of Verma modules"。
     **该反例的条件已核实**：`p·p < 0`，且 `p·p/2 + n` 命中使 `M(h, 10)` 可约的负半整数
     （`p ≠ 0` 由 LZ p.303 的全局假设给出）；⚠ **原文不给 Kac 行列式层数**，是定性推论。
     ⇒ **FOK（只声明 `p ≠ 0`）的适用范围真包含 LZ 的反例区 `p·p < 0`。**

  ⇒ **status: conjecture。** 理由不是"论证不完整"（那种情形按 docs/STATUS_LEVELS.md 的 lead 裁决
  应记 physical-argument + gaps），而是**结论真伪在文献中未定**：同一命题有一方明确主张成立、
  另一方用 Kac 行列式给出反方向的明证，且本项目**无法核对**被归属文献的正文。
  这正是 STATUS_LEVELS 里 conjecture 一栏「结论真伪在文献中未定」的情形。
gaps:
  - |
    ★★ **已核（researcher 2026-09-11 读 lian-zuckerman-1989 pp.319–321 页图）：LZ 的反例
    不取具体的 p，其条件是 `p·p < 0`**，且 `p·p/2 + n` 命中使 Verma 模 `M(h, 10)` 可约的
    负半整数；`p ≠ 0` 由 LZ **p.303 的全局假设**保证。位置 **§2, eqs. (35)-(38), p. 320**。
    ⚠ **LZ 原文不给 Kac 行列式的层数**，用的是超 Virasoro（c = 10）Kac 行列式的**定性推论**
    ——他论证"存在这样的 (p, n)"，**不写出显式的反例向量或层**。
    ⇒ **作用域差异因此明确**：**FOK 只声明 `p ≠ 0`、不限定 `p·p` 的符号**，
    **LZ 的反例落在 `p·p < 0` 的那一片**，即 **FOK 声称成立的范围真包含 LZ 说不成立的范围**。
    ⇒ 此前那条"若 FOK 只用一般动量则可并存"的调和**已被削弱**：调和需要 FOK 一侧补一个
    他从未写过的限定。
  - |
    ★★ **待 lead / auditor 裁决：本卡够不够格降为 `refuted`。**
    本卡的量词是"对设定中的 p（`p ≠ 0`）"；若 LZ 的反例条件可满足，则本卡陈述为假。
    **但 docs/STATUS_LEVELS.md 要求 `refuted` 有"被接受的反例" + 一条 `kind: refutation` 的推导**，
    而 LZ **不给层数、不写显式反例**（定性推论）。
    ⇒ 本轮按根 CLAUDE.md 原则 2 维持 `conjecture`。若裁决为够格，应新增
    `worldsheet.nsr-fock-space-verma-decomposition--via-lian-zuckerman-kac-determinant`
    （kind: refutation），并把 --via-figueroa-ofarrill-kimura-1989 的 gaps 第一条升级为
    "其前提已被反驳"。
  - |
    ★★ **被归属文献的正文本项目未取得（L0）。** Brower–Friedman 1973 共 5 页（PRD 7, 535–539）。
    已尝试入口逐条留痕在 literature/sources.bib 的 note 里（Crossref ✅、INSPIRE 摘要 ✅、
    INSPIRE 的 report_numbers/documents/urls **三字段全 ABSENT** ⇒ CDS-OAI 与 KEK 路线在入口处
    即被排除、OSTI purl **404**、Semantic Scholar openAccessPdf **CLOSED**、APS 全域 403）。
    **剩余唯一现实路线：WebSearch 找 .edu 课程页扫描件，或人工从 APS 下载。**
    ⇒ 在取得正文前，本卡无法脱离 conjecture。
  - |
    ★ **至少在 R 扇区，FOK 的归属大概率是误归。** 依据：被归属文献的**标题与摘要 NS-only**，
    且 FOK 自己在 R 扇区把措辞降为 "claim"。最简单的自洽解释是**该文根本没有处理 R 扇区**
    （⚠ 这一步是抽取者的推断，不是原文陈述）。
    ⇒ 本卡的 R 扇区部分比 NS 扇区部分更弱。
  - |
    **「完全可约」与「Verma 模的无穷直和」在 FOK 那里是被当作同一句话说出来的**，
    但严格讲后者强于前者（还要求每个不可约成分同构于一个 Verma 模）。
    FOK 不区分这两者，本卡照录其措辞；若日后取得 Brower–Friedman 正文，这一处需要重新分辨。
  - |
    **本推导不涉及 `Vir_κ^-`-自由性**：那是较弱的性质，**两方都同意**
    （LZ Corollary 2.19(iii)，LZ 的无鬼定理只用它）。本卡说的是比它强的完全可约性。
