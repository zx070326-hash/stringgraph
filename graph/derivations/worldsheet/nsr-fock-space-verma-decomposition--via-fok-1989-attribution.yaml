  FOK 那条的 effective 被压到 conjecture，LZ 那条不受影响。

  【★ 为什么不建 refutation 推导】LZ 反例的条件**已核实**为 `p·p < 0` 且命中 `M(h, 10)` 的
  可约点（§2, eqs. (35)-(38), p. 320），且该区间**落在 FOK 声称成立的范围 `p ≠ 0` 之内**
  ——就命题的真假而言这已是不利证据。**但 LZ 不给 Kac 行列式层数、不写出显式反例**，
  是定性推论，按 docs/STATUS_LEVELS.md「`refuted` 需要被接受的反例」尚不够格。
  ⇒ 按根 CLAUDE.md 原则 2「不确定时选低的那级」，本轮只记 conjecture，不记 refuted；
