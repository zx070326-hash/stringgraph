summary: |
  本推导是**物理学一手文献**对超弦无鬼定理的证明，两篇按扇区互补：
    **NS 扇区** → ohta-1986（摘要 L2；'is sufficient to demonstrate the no-ghost theorem'）
                  + ito-morozumi-nojiri-uehara-1986 p.947 的一段评论；
    **R 扇区**  → ito-morozumi-nojiri-uehara-1986 §4 Proposition I/II + (4.21)（L1，有证明）。
  两篇都是 kato-ogawa-1983 玻色弦证明的 RNS 搬运（IMNU 五处逐字自称 'the same method in Ref. 1)'）。

  IMNU 的证明结构（式号皆 L1）：
  1. **零模分离**：(3.4) Q_B^R = η₀L^R + η̄₀M^R + ζ₀F + ζ̄₀K + √(κ/π)Q̃_B^R − (1/√π)η̄₀ζ₀²；
     限制到 (3.26) 的 |−⟩ × |0⟩_ζ 分量（即 b₀ = β₀ = 0）后，物理态条件化为
     (3.24) F|phys⟩ = 0 与 (3.25) Q̃_B^R|phys⟩ = 0（L^R = √π F² 故 L₀ 条件自动满足）。
  2. **内积**：引入度规算符 (3.19) G^R = η₀ × δ(ζ₀)，使态有"通常的模"。
  3. **光锥参考系**：(4.3)–(4.5) 取 p^i = 0、p⁺ 固定非零、零矢 k 使 k·p = 1 ⇒ **要求 p⁺ ≠ 0**。
  4. **形式参数 β 重标度**：(4.9)（标注 '¹⁾' = KO），使 (4.10) Q̃_B^R(β) = Q_I + βQ_II + β²Q_III，
     其中 Q_I（(4.11)）'has the same quadratic form as the asymptotic form of BRS charges in
     ordinary gauge theories'；(4.13) 给 (Q_I)² = (Q_III)² = 0 等。
  5. **Proposition I（Kugo–Ojima quartet）**：(4.17) Q_I^R|φ⟩ = 0 ⇒ |φ⟩ = P^(0)|φ⟩ + Q_I^R|ρ⟩，
     P^(0) 是到横向模 A^i_n†、B^i_n† 生成子空间的投影；证明用 (A.3) P^(n) = {Q_I^R, R^(n)} 递推。
  6. **Proposition II（按 β 阶归纳）**：(4.19) |φ(β)⟩ = P(β)|φ(β)⟩ + Q̃_B^R(β)|J(β)⟩，
     P(β) 是横向算子 Ã^i_n†(β)、B̃^i_n†(β)（(A.7)，引 Brower–Friedman）生成的横向扇区投影；
     (A.10) [Q̃_B^R(β), Ã^i_n(β)] = 0；归纳 (A.13)–(A.19)。
  7. **正半定**：置 β = 1，(4.21) ⟨φ|φ⟩ = ⟨φ|P|φ⟩ ≥ 0，末不等号引横向态空间的正定性。

  ⇒ 目标卡断言 (2)（R 扇区，见证 IMNU (3.14) 的 C[γ₀] 型零模表示）由 IMNU 支撑；
     断言 (1)（NS）由 ohta-1986 摘要（L2）+ IMNU p.947 评论支撑。

  【status: physical-argument 的理由（四条，任一足以封顶）】
  (1) **形式参数 β 展开**：(4.16) 逐字 'we have assumed that |φ(β)⟩ can be expanded in β'
      ——这是一条**未证明的假设**，且 β 展开的收敛性/终止性未讨论；
  (2) **正半定 ≠ 正定**：IMNU 证的是物理态子空间上 ≥ 0，目标卡要的是相对上同调上的正定，
      差一步取商（见 gaps）；
  (3) **NS 扇区没有显式证明**：IMNU 只有评论；Ohta 正文未取得（只有摘要 L2）；
  (4) 横向态空间的正定性外包给 Brower–Friedman（**已登记，但正文未取得、只到摘要级 L0/L1**；
      其摘要不含任何可引用的正定性细节）。
  ⚠ 本推导**不因为"结论公认"而升级**（根 CLAUDE.md 原则 2）。要 rigorous 看
  --via-lian-zuckerman-1989。
gaps:
  - |
    ★ **正半定 vs 正定：差一步取商，IMNU 没写。** IMNU (4.21) 证的是
    ⟨φ|φ⟩ = ⟨φ|P|φ⟩ ≥ 0（**正半定**，在满足 (3.24)(3.25) 的物理态子空间上）；
    目标卡断言的是相对**上同调**（已商掉 Q̃_B-恰当态）上的内积**正定**。
    由 (4.19) 的分解 |φ⟩ = P|φ⟩ + Q̃_B|J⟩ 取商即得正定（模掉 Im Q̃_B 后只剩 P|φ⟩），
    **但 IMNU 既不写商空间也不用上同调语言**。Kohriki–Kunitomo–Murata 2010 对 KO 的转述
    同样只说 'positive semidefinite norm'（§1 p.2 逐字）。
    ⇒ 本步是 curator 的补充，不在来源里。
  - |
    ★ **NS 扇区的证据链最弱**：IMNU p.947 只有一段评论（'We get the similar propositions,
    and then we can complete the proof.'）；ohta-1986 **正文未取得**，只有摘要（L2），
    且摘要**不分扇区**。⇒ 目标卡断言 (1) 目前在本推导里的可追溯性是
    「一段评论 + 一句摘要」。要补必须取得 ohta-1986 正文（UTTG-30-85，或 PRD 33 6 期），
    或登记 Terao–Uehara, Phys. Lett. 168B (1986) 70（LZ [15]，本项目 bib 未登记）。
  - |
    ★ **Ohta 的 R 扇区证据缺失，有 L1 反证。** IMNU p.952 Note added 逐字 'he did not present
    the proof of the no-ghost theorem in the Ramond sector'。故 ohta-1986 这条 source
    **只能读作 NS 扇区**；发表版（PRD 33, 1681–1691）是否补上 R 扇区为 **L0**。
    ⇒ 若日后取得 Ohta 正文并发现补上了，本推导的 gaps 应改写；
    若发现没补，则 R 扇区的物理侧一手来源**只有** IMNU 一篇。
  - |
    **形式参数 β 展开是未证明的假设**：(4.16) 逐字 'we have assumed that |φ(β)⟩ can be
    expanded in β'。β 是 (4.9) 引入的重标度参数（κ → κ/β²、p₀⁻ → β²p₀⁻、x₀⁺ → x₀⁺/β²），
    展开的收敛性、以及 β = 1 处的合法性（(4.21) 直接置 β = 1）都未论证。
    这与玻色弦一侧 worldsheet.no-ghost-theorem-brst--via-polchinski-4-4 的"下三角矩阵一般性质"
    是同一类缺口（Polchinski 的 S^{−1} 级数 ↔ IMNU 的 β 幂级数）。
  - |
    **横向态空间的正定性外包，且被引文献本项目未登记**：(4.21) 末句逐字 'where the last
    inequality follows from the positive definiteness of the transverse state space.²¹⁾'，
    [21] = **Brower–Friedman, Phys. Rev. D 7 (1973) 535**；横向算子 (A.7) 也引 [21]。
    **2026-09-11 更新（reviewer-batch17b 指出原文字已过期）**：该文**已登记到
    literature/sources.bib，抽取记录 extractions/brower-friedman-1973.md 也已存在**；
    但**正文仍未取得（L0）**，摘要 L1 逐字、元数据 L1（Crossref/INSPIRE），
    **read_depth 保持 abstract，不得升**。
    该摘要**只承载**「Brower 的（α₀=1）无鬼定理被推广到 NS 模型」+「构造了谱生成代数 (A_n, B_s)，
    方法是 systematic use of the gauges G_r」+「正定范数共振态存在」，
    **不含横向态空间正定性的任何可引用细节**。⇒ **本条缺口未关闭**：IMNU (4.21) 的末不等号
    目前仍只能追到一篇正文未读的 1973 年论文的摘要。
    ⚠ 同一篇文献还是 figueroa-ofarrill-kimura-1989 与 lian-zuckerman-1989 之间那处**真矛盾**的
    裁决对象；该矛盾已单独建卡 **worldsheet.nsr-fock-space-verma-decomposition**（争议卡）。
    ⚠ **但那条争议与本推导无关**：IMNU 引 [21] 是为了**横向态空间的正定性**，
    **不是**为了 Verma 模分解，故**本推导不依赖那张争议卡**。
    ⇒ 剩余文献任务：取得 Brower–Friedman 正文（5 页，剩余唯一路线是 WebSearch 找 .edu 扫描件
    或人工从 APS 下载）；另可登记 Schwarz, Nucl. Phys. **46** (1972) 61 作为 NS 无鬼定理的
    第二条独立物理来源（Schwarz 自述，L3，本项目未登记）。
  - |
    **p⁺ ≠ 0（d ≥ 2）是结构性限制，且与目标卡的 (H2) p ≠ 0 不是同一条件。**
    IMNU (4.3)–(4.5) 的光锥参考系要求 p⁺ 固定非零；Dedushenko 2015 §1 p.2 逐字把这条路线
    标为 'requires d ≥ 2 as it uses the existence of two free bosons X⁺ and X⁻'。
    在 D = 10 的闵氏空间里 p ≠ 0 ⇒ 存在洛伦兹系使 p⁺ ≠ 0（初等观察，不出自来源），
    故两者在本卡设定下等价；但**该等价未在任何来源中成文**，与玻色弦一侧
    worldsheet.no-ghost-theorem-brst--via-fgz 的同名 gap 是同一条。
  - |
    **δ(ζ₀) 型度规下 Q̃_B^R 是否厄米，IMNU 未讨论**（抽取记录 §4 Q3）。
    这与 figueroa-ofarrill-kimura-1989 对 Henneaux 表示的批评是同一问题：p.116 逐字
    'Changing the hermiticity properties of γ₀ and β₀ changes the hermiticity properties of
    the BRST operator: it is no longer hermitian. This means that it is no longer guaranteed
    that the cohomology space inherits a well-defined … inner product.'
    ⇒ IMNU (3.19) 的 G^R = η₀ × δ(ζ₀) 是否给出上同调上良定义的内积，**本图未核实**。
    （FOK 用 Schrödinger 表示补救；IMNU 与 Ohta 都不做这一步。）
  - |
    **零模表示的对应关系是推断，不是文献陈述**：IMNU (3.14)（ζ̄₀|0⟩_ζ = 0、ζ₀ 生成）
    与 FOK 的 Henneaux 表示 C[γ₀] 是同一选择、并换算为 Dedushenko (5) 的 R 扇区 −½ picture
    ——**这两步换算都是 researcher 的推断**（literature/extractions/
    ito-morozumi-nojiri-uehara-1986.md E3 备注、henneaux-1987.md §3 第 1 条），
    三篇之间**没有互引**（IMNU 不引 Henneaux/FGZ；FOK 不引 IMNU/Ohta/KO）。
  - |
    **IMNU 与 Polchinski 的量子化方案不同**：IMNU (2.1) 从二维超引力耦合的标量超多重态出发、
    规范 (2.7)；Ohta 的方案据 IMNU Note added 逐字 'the quantization method of the lagrangian
    is a little different'。Polchinski §10.5 则**不从规范不变作用量出发**
    （worldsheet.ocq-superstring-physical-states 的方法论限定）。
    ⇒ 三者的 Q_B 是否逐字同一个算符，本图未核实；本推导的 depends_on 边是"同一算符的不同构造"
    的对接。
  - |
    **GSO 未覆盖**：IMNU §5 p.948 只有一句预告（逐字 'In that case we must restrict the ground
    states of both the NS and the R sectors with the generalized G-parity and chirality
    operators¹⁰⁾ according to Ref. 22).'，[10] = Terao–Uehara、[22] = GSO），无计算。
    与目标卡"本命题不断言 (e)"一致。
notes: |
  【本推导在图上的角色】它是**物理学一手来源**这一层，与
    --via-lian-zuckerman-1989（数学侧，rigorous）、
    --via-figueroa-ofarrill-kimura-1989（数学侧，physical-argument，因一处真矛盾）
  并列。三条推导彼此独立：
    - IMNU/Ohta 不引 FGZ、不引 Henneaux（IMNU 参考文献 [1] KO、[19] Terao–Uehara、
      [20] Kugo–Ojima、[21] Brower–Friedman、[22] GSO、[23] Ohta）；
    - FOK 引 Henneaux、FGZ、Brower–Friedman，**不引** Ohta/KO/IMNU/LZ；
    - LZ 引 KO [11]、Ohta [13]、Terao–Uehara [15]，**不引** Henneaux，与 FOK 独立。
  ⇒ 抽取记录的一条观察值得记在图上：**两个数学组各只看到一半物理文献**
  （literature/extractions/henneaux-1987.md §4 Q5）。

  【为什么不把本推导挂到 worldsheet.no-ghost-theorem-superstring（Polchinski 卡）上】
  那张卡的断言 (2)(3)(4) 用的是 Polchinski 的 H^⊥ 定义与 exp(πiF)；Ohta/IMNU 既不建立
  与 OCQ 的同构（IMNU 的物理态条件本身就是协变条件，不另证等价），也不讨论 GSO 后的谱。
  本推导能支撑的恰是**正定性**这一条，即本目标卡。

