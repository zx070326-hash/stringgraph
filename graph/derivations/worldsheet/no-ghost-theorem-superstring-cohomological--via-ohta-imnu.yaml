id: worldsheet.no-ghost-theorem-superstring-cohomological--via-ohta-imnu
target: worldsheet.no-ghost-theorem-superstring-cohomological
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.superstring-brst-charge
    note: |
      供给 Q_B。IMNU 一侧的对应物是**零模分解** (3.2)（NS）与 (3.4)（R）：
        Q_B^NS = η₀ L^NS + η̄₀ M^NS + √(κ/π) Q̃_B^NS,
        Q_B^R  = η₀ L^R + η̄₀ M^R + ζ₀ F + ζ̄₀ K + √(κ/π) Q̃_B^R − (1/√π) η̄₀ ζ₀²,
      其中 η₀ ~ c₀、η̄₀ ~ b₀、ζ₀ ~ γ₀、ζ̄₀ ~ β₀，末项 η̄₀ζ₀² ~ b₀γ₀²。
      与 lian-zuckerman-1989 **Proposition 1.7(x)(xi)** 逐项同型
      （LZ 把该计算归给 ohta-1986：证明逐字 '(x) and (xi) Calculations are done in [13].'）。
      ⚠ IMNU 的作用量与规范固定与 Polchinski 不同（IMNU (2.1) 是二维超引力耦合的标量超多重态，
      规范 (2.7) e^a_m = η^a_m, ψ_m = 0），故本边是**同一算符的两种构造**的对接，不是逐字同一。
  - id: worldsheet.superstring-brst-additional-conditions
    note: |
      供给相对复形。IMNU 一侧逐条对应且**有显式式号**：
        NS：(3.22) L^NS|phys⟩ = 0、(3.23) Q̃_B^NS|phys⟩ = 0；
        R： (3.24) F|phys⟩ = 0、(3.25) Q̃_B^R|phys⟩ = 0，并注 'the condition L^R|phys⟩ = 0 is
            automatically satisfied under condition (3.24) because L^R = √π F².'
        两扇区共同的限制 (3.26)：|Φ⟩^NS_− = |Φ⟩ × |−⟩、|Φ⟩^R_{−,0} = |Φ⟩ × |−⟩ × |0⟩_ζ，
            即 b₀|phys⟩ = 0（两扇区）与 β₀|phys⟩ = 0（R）。
      IMNU 紧随逐字：'These conditions are deduced from the usual physical state condition,
      Q_B|phys⟩ = 0, when we restrict the Fock spaces as (3.26)'。
      ⇒ **Polchinski (10.5.25)(10.5.26) 那两条只有"the logic being the same"的条件，
      在 IMNU 这里有显式式号与推导句。** 这是本推导对目标卡的一处实质贡献。
  - id: worldsheet.superstring-brst-nilpotent-at-c15
    note: |
      供给 Q_B² = 0（上同调有定义的前提）。
      ★ IMNU (3.8)–(3.10) 给出**显式系数公式**（本图现有来源里唯一的一处）：
        (Q_B^NS)² = (1/π)Σ_{n≥1}[((D−10)/8)n³ + ((16α₀^NS − D + 2)/8)n] η_n†η_n
                  + (1/π)Σ_{r≥1/2}[((D−10)/2)r² + (16α₀^NS − D + 2)/8] ζ_r†ζ_r,
        (Q_B^R)²  = (1/π)Σ_{n≥1}[((D−10)/8)n³ + 2α₀^R n] η_n†η_n
                  + (1/π)Σ_{n≥1}[((D−10)/2)n² + 2α₀^R] ζ_n†ζ_n + (1/π)α₀^R ζ₀²,
      (3.10) 逐字 'Thus the nilpotency of the BRS charges, which means the vanishing of the
      conformal anomaly, **demands D = 10 and α₀^NS = 1/2 for the NS model, D = 10 and
      α₀^R = 0 for the R model.**'，紧随 'These conditions are **necessary** to prove the
      no-ghost theorem in the next section.'
      ⚠ IMNU 自称的方向是 ⟹（"demands"）；但各系数独立为零使 ⟺ 从公式可读出。
      注 R 扇区末项 α₀^R ζ₀² 含 βγ 零模——α₀^R = 0 同时消掉它。
      ⚠ 2026-09-11（reviewer-v2-ch10b）：本边原指双向卡
      worldsheet.critical-dimension-superstring-brst（已换代）。本推导只需要 Q_B² = 0，
      故改指单向弱卡（c^m = 15 ⟹ Q_B² = 0）；⟹ 方向的卡是 conjecture，不经过本边。
  - id: worldsheet.superconformal-ghost-modes
    note: |
