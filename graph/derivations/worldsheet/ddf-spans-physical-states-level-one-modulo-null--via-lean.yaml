summary: |
  机器检查的证明，Assembly.lean §SpuriousToNull + §LevelOne。两步：

  **第 1 步（伪态 → 零态的通用引理，`mem_ddfSpan_sup_null_of_mem_ddfSpan_sup_spurious`）。**
  设 x 物理，x = d + s，d ∈ ddfSpan，s ∈ S ⊆ H_spur。d 物理（`ddfSpan_le_towerPhysSubmodule`，需 (N)(S)），
  故 s = (d + s) − d 物理；伪态 ∩ 物理态 ⊆ 零态（`towerSpurious_inf_towerPhys_le_towerNull`）
  给 s ∈ H_null。于是 x ∈ ddfSpan ⊔ H_null。只用到 ddfSpan ≤ H_phys 与 spurious ⊓ phys ≤ null。

  **第 2 步（套到 N = 1，`ddfSpans_bigrade_neg_one_one`）。**
  设 x ∈ H_phys ⊓ T_{−1,1}。`towerPhys_bigrade_one_le_ddfSpan_sup_spurious`（需 (T′)(C)）给
  x ∈ ddfSpan ⊔ span{L_{−1}|0;k−k_0⟩}；`towerLop_neg_mem_towerSpuriousSubmodule` 给
  span{L_{−1}|0;k−k_0⟩} ≤ H_spur；第 1 步收尾。∎

  **四条依赖全部 formalized**，故目标卡 effective = formalized。
