summary: |
  原书的论证是一句话：把 Vol.1 §4.4 的玻色弦 BRST 无鬼定理证明照搬。
  该论证的结构（本图 worldsheet.no-ghost-theorem-brst--via-polchinski-4-4 已记）是：
    1. 引入 light-cone number 分次（用 α^±_m，需 k^+ ≠ 0）；
    2. 按该分次把 Q_B 分解为 Q_1 + Q_0 + Q_{−1}，其中 Q_1² = 0；
    3. 构造 R 使 S = {Q_1, R} 是数算符；S ≠ 0 的态是 Q_1-恰当的（四重态机制），
       故 coh(Q_1) = ker S = 横向激发张成的空间；
    4. U = {Q_B, R} − S 严格下三角，推出 coh(Q_B) ≅ coh(Q_1) = H^⊥；
    5. H^⊥ 上诱导内积正定。
  超弦版本需要把第 1–3 步中的「鬼场激发」扩充为同时计 b、c、β、γ 与 ψ^{0,1}。

  ⚠⚠ **本推导不主张上述扩充已被验证。** 原书不做，本图也不做。
  下面 gaps 的前三条是抽取记录 Q4 列出的三处结构差异，逐条说明「照搬」掩盖了什么。

  【status 的理由】三条，任何一条都足以封顶在 physical-argument：
  (1) 原书**不给证明、不引文献**，只有一句 'direct imitation'；
  (2) 模板本身（Vol.1 §4.4）在本图也只是 physical-argument；
  (3) 三处结构差异未被讨论（见 gaps）。
  **本推导明确不标 rigorous**，尽管玻色弦一侧的部分节点有严格来源（FGZ 等）。
gaps:
  - "**结构差异 (i)：βγ 的不等价真空 / picture。** βγ 是对易鬼场，其 Fock 空间与 bc 不同：单位算子态 |1⟩ ≠ |0⟩_NS，且 |1⟩ 上的 Fock 空间里没有具 |0⟩_NS 性质的态（worldsheet.superconformal-ghost-unit-operator-vacuum，原书 (10.4.6)–(10.4.7)）。Vol.1 §4.4 的分次论证是在一个固定鬼场真空上做的，超弦版必须先固定真空。**原书完全不讨论。** 原书全章也不出现 'picture' 一词，而他用的顶点算子是 −1 与 −1/2 picture（(10.4.22)/(10.4.25)）。"
  - "**结构差异 (ii)：R 扇区的 β_0 零模。** R 扇区必须额外强加 β_0|ψ⟩ = G_0|ψ⟩ = 0（(10.5.26)），原书对此只说 'the logic being the same as for (10.5.25)'。相对复形因此比玻色弦的更小，而「Q_B 保持这个更小的复形、且上同调不依赖该约化」在本图与来源中都没有论证（玻色弦一侧的对应命题是 worldsheet.brst-preserves-relative-complex，超弦版未建）。"
  - "**结构差异 (iii)：βγ 的占据数无上界。** Vol.1 §4.4 的 S = {Q_1, R} 同时计鬼场激发与光锥振子激发，论证依赖 S 是数算符且分次有限。超弦版的 S 还必须计 β、γ 与 ψ^{0,1}，而 βγ 是对易场，其模式可以被激发任意多次（原书 §10.4 逐字：'the modes of a commuting field can be excited any number of times'）。这直接影响分次论证中「S ≠ 0 的态是恰当的」与下三角论证的收敛性。**原书完全不讨论。**"
  - "**模板自身的 gap 继承**：Vol.1 §4.4 的论证是 Fock 空间上的形式代数操作，滤子/分级论证在无穷维空间上的收敛性与完备化未处理（worldsheet.no-ghost-theorem-brst--via-polchinski-4-4 的自评）。"
  - "**动量条件在超弦一侧只字未提**：玻色弦的对应命题限 k^+ ≠ 0（light-cone number 分次需要它），原书在超弦一侧不提任何动量条件。目标卡片因此既不宣称覆盖全部动量，也不写 k^+ ≠ 0——这是照实记账，不是遗漏。"
  - "**原书唯一的正面证据是低能级手算**（'The reader can again work out the first few levels by hand'，exercise 10.14）。低能级一致不是定理证明。"
  - "**独立严格来源尚未取得**：候选 ohta-1986、henneaux-1987 等已登记 literature/reading-list.md（P1），但**均只到标题/摘要级，未抽取**。取得后应新建一条独立推导（可望达到 rigorous），而不是修改本推导。"
  - "**【2026-09-11 更新，接在上一条之后】独立严格来源已取得，但没有挂到本推导，也没有挂到本推导的目标卡。**
