  - id: worldsheet.no-ghost-theorem-brst
    inferred: true
    note: |
      ★ **这是本推导的核心依赖，也是唯一被标 inferred 的一条，理由必须读完。**
      Vol.2 §10.5 末逐字说 'The proof is a direct imitation of the bosonic argument of
      chapter 4.'，即把玻色弦的 BRST 无鬼定理（本图这张卡，来源 Vol.1 §4.4）当作模板。
      **标 inferred 的理由**：原书**没有**在超弦情形复述或改写那个论证的任何一步，
      也没有说明超弦特有的三处结构差异是否影响它（见 gaps 的前三条）。
      因此「玻色弦的论证可以搬过来」是本图按原书那句话记下的**推断**，
