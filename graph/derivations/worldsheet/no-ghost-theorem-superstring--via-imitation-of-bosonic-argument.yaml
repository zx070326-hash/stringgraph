  - id: worldsheet.superconformal-ghost-unit-operator-vacuum
    note: |
      不供给论证，供给**反例式的警示**：βγ 有不等价真空（|1⟩ ≠ |0⟩_NS，
      且 |1⟩ 上的 Fock 空间里没有 |0⟩_NS）。玻色弦的 §4.4 论证是在一个固定的鬼场真空上
      做分次的；超弦版本必须先说清用哪个真空，而原书不说。挂这条边是为了让该缺口
      在图上可见（gaps 第一条引用它）。
