notes: |
  本推导按抽取记录 polchinski-1998-v2.md E39 与 Q4 建立。
  Q4 的原话：「Polchinski 完全没有讨论这三点是否影响论证。全章无脚注、无引文。」
  故本推导的 gaps 前三条逐条对应 Q4 的 (i)(ii)(iii)。

  ⚠ **给日后 reviewer / auditor 的提示**：本推导的 status 是本轮最容易被质疑的一处。
  可能的质疑方向有两个，方向相反：
    (a) 「太高」——认为「一句 direct imitation + 三处未讨论的结构差异」连 physical-argument
        都不够，应降到 conjecture。curator 的理由是：论证模板是明确的、低能级有验证、
        且文献中确有独立的严格处理（只是本图尚未取得），故不降到 conjecture。
    (b) 「太低」——认为超弦无鬼定理是公认结果，应给 rigorous。这条不成立：
        本图的 status 记的是**该节点自身论证**的严格程度，不是公认程度
        （根 CLAUDE.md 原则 2）。要 rigorous 必须先取得 Ohta / Henneaux 等来源并另立推导。
