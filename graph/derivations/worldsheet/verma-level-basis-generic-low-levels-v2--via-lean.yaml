summary: |
  本推导是**图侧接线**：目标 (1)–(4) 各由 GenericIndependence.lean 中一条无 sorry 的定理承载。
  链条按六步：

  **第 1 步（一般引理）。** `linearIndependent_of_gram_det_ne_zero`：整环上、任意双线性型 B，
  若 det[B(v_i,v_j)] ≠ 0 则 v 线性无关（图侧为
  math.gram-determinant-nonzero-implies-linear-independence）。

  **第 2 步（把已算出的 Kac 行列式装成 Gram 矩阵）。** `descFamily2/3/4 : Fin p(N) → V(c,h)`
  把 p(N) 个标准降算符向量打包成族（`![desc2, desc11]`、`![desc3, desc21, desc111]`、
  `![desc4, desc31, desc22, desc211, desc1111]`），再证
  `IsContravariant.gram_det_descFamily{2,3,4}`：这些族的 Gram 行列式**等于**
  worldsheet.kac-determinant-level-{two,three,four} 已算出的 det₂、det₃、det₄。
  N = 2 用 `Matrix.det_fin_two`，N = 3 用 `Matrix.det_fin_three` + `linear_combination`，
  N = 4 先用 `gramMatrix_descFamily4`（`fin_cases i <;> fin_cases j`）摆成 15 元的显式 5×5 矩阵，
  再引 `gram_level_four_det`。

  **第 3 步（目标 (1)）。** 第 1 步 + 第 2 步：`IsContravariant.linearIndependent_descFamily{2,3,4}`，
  前提为 `hB`（逆变）、`hB1`（归一化）、`hdet`（对应 det_N 的多项式 ≠ 0），
  类型类 `[CommRing R] [Algebra ℚ R] [NoZeroDivisors R]`。三条证明体各一行。

  **第 4 步（目标 (2)，N = 2）。**
  `composition_two_blocks`：2 的任一合成的 blocks 是 [2] 或 [1,1]（对列表长度做 `match`，
  长度 ≥ 3 时由每块 ≥ 1 与和为 2 用 `omega` 排除）。由它得
  **`levelSpan_two_eq_span_descFamily2` : V₂ = span{desc2, desc11}**——
  **无条件**，不需要 B、不需要 PBW、不需要 straightening。

  **第 5 步（目标 (2)，N = 3, 4：整序 + 有序词枚举）。**
  `levelSpan_three_eq_span_descFamily3`、`levelSpan_four_eq_span_descFamily4`。
  `≥` 半边：`descFamily{3,4}_mem_levelSpan` → `span_descFamily{3,4}_le_levelSpan`。
  `≤` 半边：`rw [levelSpan_eq_ordSpan, ordSpan_eq_span, Submodule.span_le]` 把 V_N 换成
  总模态 −N 的**有序词**的张成（worldsheet.verma-level-spanned-by-partitions 的 (3)，
  VermaPBW.lean 的 `levelSpan_eq_ordSpan`——这是承重边），再由
  `ordWord_sum_three : IsOrdWord l → l.sum = −3 → l = [−3] ∨ l = [−2,−1] ∨ l = [−1,−1,−1]`
  与 `ordWord_sum_four`（五支）逐支落回 `descFamily{3,4} i`。
  两条枚举引理对表长 `match`（≤ 3 / ≤ 4，再长一支 `exfalso`），各支用「各项 < 0、非降、和给定」
  交给 `omega`；不碰 Virasoro 关系，不碰 `Nat.Partition`。
  **`Nat.Partition` 计数缺口仍在 Mathlib**（`Fintype.card (Nat.Partition N)` 无引理、
  `decide` 化不开 `Fintype.ofSurjective` 实例），**但已绕开**：`levelSpan_eq_ordSpan` 把张成集
  裁到有序词，枚举是初等算术；p(3) = 3、p(4) = 5 作为分拆函数的值从未被用到。

  **第 6 步（目标 (3)：dim V_N = p(N)，N = 2, 3, 4）。** 特征零域上，
  `IsContravariant.finrank_levelSpan_{two,three,four}`：`rw [levelSpan_N_eq_span_descFamilyN]`
  （第 4/5 步）后 `finrank_span_eq_card` 于第 3 步的线性无关族，得 dim V_N = 2、3、5。
  配套 `levelSpan_moduleFinite`（用 Verma.lean 的 `levelSpan_fg`）。
  `three_le_finrank_levelSpan_three`、`five_le_finrank_levelSpan_four` 保留为 `≥` 半边推论
  （v1 的 (5)）。**上界不经过** `finrank_levelSpan_le_card_partition`。

  **第 7 步（目标 (4)：酉区域）。** `kac_level_two_pos`（h > 0、c > 1 ⇒ det₂ > 0；
  该不等式本身登记在 worldsheet.kac-determinant-level-two 的 notes）使第 3、6 步在 N = 2 的
  `hdet` 前提自动满足，得 `linearIndependent_descFamily2_of_pos` 与 `finrank_levelSpan_two_of_pos`
  （假设只有 `[Field K] [LinearOrder K] [IsStrictOrderedRing K]`、`0 < h`、`1 < c`）。
gaps:
  - |
    **(i) 这不是 PBW 的线性无关性一半（最要紧的一条）。** 目标是**条件的、泛型的**替代：
    它假设归一化逆变型 B 存在（⟺ V(c,h) ≠ 0，worldsheet.shapovalov-form-existence 的 (4)，
    而那是真正 PBW 的推论），并且只在 det_N(c,h) ≠ 0 处有结论。
    ⇒ math.verma-module-free-over-negative-part **不**因本推导升级；
    formal/TODO.md 的 `pbw-verma` (b) 仍未完成。不要把本卡当作 PBW 已形式化的证据。
  - |
    **(ii) Kac 零点处完全没有结论，且判据不可反用。** det_N(c,h) = 0 时本推导什么也不给；
    特别地**不能**推出向量线性相关（math.gram-determinant-nonzero-implies-linear-independence
    的【不断言】(a)）。c = 1、h = 1/4 是已形式化的见证：level-2 Gram 矩阵四元全为 3/2、det₂ = 0，
    而 (L₋₂ − L₋₁²)v 与整个 V₂ 正交——退化的是型，不是向量的独立性。
  - |
    **(iii) `Nat.Partition` 的计数缺口仍在 Mathlib，但已绕开。** Mathlib v4.33.1 没有
    `Fintype.card (Nat.Partition 3) = 3`、`= 5` 一类引理，`decide` 也化不开
    `Fintype.ofSurjective` 实例。本推导**不需要它**：`levelSpan_eq_ordSpan` 把张成集裁到有序词，
    `ordWord_sum_three` / `ordWord_sum_four` 的枚举是初等算术（第 5 步）。
    代价是「dim V_N = p(N)」在 Lean 里写成具体数字 2、3、5，而不是 `Fintype.card (Nat.Partition N)`；
    两者的对接（目标【不断言】(g)）仍是 Mathlib 侧的空白。N ≥ 5 的枚举同法可做（N = 5 是 7 支），
    不是瓶颈。
  - |
    **(iv) N ≥ 5 未覆盖——天花板只剩 Gram 行列式。** 只有 N ≤ 4 的 Gram 行列式被算出
    （`ShapovalovLevelFive.lean` 不存在）；一般 N 需要
    worldsheet.kac-determinant-v2（rigorous、未形式化），本推导不使用它。
  - |
    **(v) 「型」是双线性型，不是 Hermitian 形式，也不谈正定。** 目标 (4) 只说 det₂ > 0
    使前提自动满足，**不**说 V₂ 上的型正定或 V(c,h) 酉；
    酉性还需要全部 level 的 Gram 矩阵半正定（本图与 Lean 侧都没有）。
