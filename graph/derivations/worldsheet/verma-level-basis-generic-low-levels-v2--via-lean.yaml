id: worldsheet.verma-level-basis-generic-low-levels-v2--via-lean
target: worldsheet.verma-level-basis-generic-low-levels-v2
kind: proof
status: formalized
depends_on:
  - id: math.gram-determinant-nonzero-implies-linear-independence
    inferred: false
    note: |
      **目标 (1) 的全部逻辑内容**。该卡 (2)（整环上 det Gram ≠ 0 ⇒ 线性无关）在 Lean 里就是
      `StringFormal.linearIndependent_of_gram_det_ne_zero`，
      三条 `IsContravariant.linearIndependent_descFamily{2,3,4}` 的证明体都是
      「`linearIndependent_of_gram_det_ne_zero B _ (by rw [gram_det_descFamily_N]; exact hdet)`」，
      一行不多。目标的【不断言】(b)（Kac 零点处判据不给信息）也逐字来自该卡的【不断言】(a)。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
      ⚠ 该卡要求基环**无零因子**，这正是目标陈述里 `[NoZeroDivisors R]` 的来源；
      目标 (2) 不用该卡，故也不需要这条假设（陈述已分别写明）。
  - id: worldsheet.kac-determinant-level-two
    inferred: false
    note: |
      **供给 N = 2 的 Gram 行列式 det₂ = 2h(16h² + 2h(c−5) + c)**，即目标 (1) 在 N = 2 的
      「Gram 行列式 = Kac 多项式」那一步：Lean 侧 `IsContravariant.gram_det_descFamily2`
      就是该卡 formal.lean_decl `IsContravariant.gram_level_two_det` 的重述
      （把三个 Gram 元按 `Matrix.det_fin_two` 装进 `gramMatrix`）。
      该卡的 (2) 三个 Gram 元（含由 worldsheet.shapovalov-form-uniqueness 得到的对称性）
      是该行列式的输入。目标 (4) 用的 det₂ > 0 也记在该卡 notes。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
  - id: worldsheet.kac-determinant-level-three
    inferred: false
    note: |
      **供给 N = 3 的 Gram 行列式 det₃ = 48h²(16h²+2h(c−5)+c)(3h²+h(c−7)+c+2)**。
      Lean 侧 `IsContravariant.gram_det_descFamily3` 由该卡的
      `IsContravariant.gram_level_three_det` 经 `Matrix.det_fin_three` + `linear_combination` 重述。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
      ⚠ 本推导**不**使用该卡的「在 Lean 内部等于 Kac 乘积形」那一半（h_{p,q} 的因子分解）：
      目标 (1) 只需要多项式非零这一前提，与它写成和式还是积式无关。
  - id: worldsheet.kac-determinant-level-four
    inferred: false
    note: |
      **供给 N = 4 的 Gram 行列式 det₄（五个因子，见目标陈述）**。
      Lean 侧 `gramMatrix_descFamily4` 把 `gramMatrix B (descFamily4 ...)` 展成 15 个独立元的
      5×5 显式矩阵（`fin_cases` 逐元），再由该卡的 `IsContravariant.gram_level_four_det` 取行列式，
      得 `IsContravariant.gram_det_descFamily4`。这是本推导里唯一需要显式矩阵重排的一层。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
      ⚠ 同上：不使用该卡的 Kac 乘积形那一半。
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      **承载被断言的对象**：V(c,h)（`VermaModule R c h`）、最高权向量 v（`hwv`）、
      level 分量 V_N（`levelSpan R c h N`，由 `levelWord` 生成）、以及目标 (3) 需要的
      有限性 `levelSpan_fg`（本推导经 `levelSpan_moduleFinite : Module.Finite K (levelSpan K c h N)`
      使用它，`Module.finrank` 才有非平凡值）与域上的 level 分解。
      目标里的 L₋₂v、L₋₁²v、… 就是该卡的 `wordAct` / `levelWord` 的实例
      （Lean 侧具名为 Shapovalov*.lean 的 `desc2`、`desc11`、`desc3`、… ，
      登记在 worldsheet.kac-determinant-level-{two,three,four} 的 source 里）。
      ⚠ 该卡是 status: formalized 的定义卡，不压低本推导状态。
  - id: worldsheet.shapovalov-form-uniqueness
    inferred: false
    note: |
      **「逆变型」这个概念本身，以及 Gram 矩阵对称性**。目标假设「B 逆变且 B(v,v) = 1」
      用的是该卡给出的逆变性定义（Lean 侧 `IsContravariant B : B (L_n x) y = B x (L_{-n} y)`）；
      三个 level 的 Gram 矩阵在装配时用到该卡 (2) 的**自动对称性**
      （Lean 侧 `IsContravariant.comm`，例如 level-2 的 ⟨a,b⟩ = ⟨b,a⟩）。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
      ⚠ 该卡是**无条件**的（不依赖 PBW、不依赖 V(c,h) ≠ 0），故这条边不引入任何未决前提。
  - id: worldsheet.shapovalov-form-existence
    inferred: true
    note: |
      **记账边：目标把 B 当给定，这条边说明「B 从哪来」以及代价**。该卡的 (4)：特征零域上
      归一化逆变型存在 ⟺ v ≠ 0 ⟺ V(c,h) ≠ 0，而后者是真正 PBW 的推论
      （math.verma-module-free-over-negative-part 的 (4)，rigorous、未形式化）。
      这正是目标【不断言】(a) 第一条「本卡不是 PBW (b)」的精确内容：
      **本推导的严格程度（formalized）说的是「给定 B 时那步蕴含」，
      不是「对每个 (c,h) 都真的有一组基」**。
      Lean 证明体不调用 `exists_isContravariant_iff_hwv_ne_zero`（只在 docstring 出现），
      按原则 5 标 inferred（reviewer-batch19 / lead，2026-09-11）。
      ⚠ 该卡 effective = formalized（其 --via-lean 推导），故这条边不压低本推导状态；
      未决的东西不在这条边上，而在「V(c,h) ≠ 0 是否已知」这件事上——
      它不是本目标的前件之一（本目标的前件是 B 本身），故按项目记账不构成本推导的上限。
      ⚠ 若日后有人要把本卡读成「无条件断言 V_N 有基」，必须先把
      math.verma-module-free-over-negative-part 这条边补上，那时状态会被它封顶（rigorous）。
  - id: worldsheet.verma-level-spanned-by-partitions
    inferred: false
    note: |
      **承重边（v2 起）：目标 (2) 在 N = 3, 4 的上界真的经过该卡的 (3)。**
      `levelSpan_three_eq_span_descFamily3` 与 `levelSpan_four_eq_span_descFamily4` 的证明体
      第一行就是 `rw [levelSpan_eq_ordSpan, ordSpan_eq_span, Submodule.span_le]`——
      `levelSpan_eq_ordSpan` 正是该卡 (3)「V_N 由总模态 N 的有序词张成」的 Lean 声明
      （该卡 source loc 列出的那条），`ordSpan_eq_span` 是它的定义展开。
      随后 `ordWord_sum_three` / `ordWord_sum_four` 枚举有序词，落回 `descFamily{3,4}`。
      ⇒ 目标 (3) 的 dim V₃ = 3、dim V₄ = 5 的**上界**由这条边供给（经 (2) 的显式列表），
      **不是**由该卡 (4) 的 `finrank_levelSpan_le_card_partition` 供给：
      后者写成 `Fintype.card (Nat.Partition N)`，本推导从未调用它（目标【不断言】(g)）。
      ⚠ N = 2 的 (2)（`levelSpan_two_eq_span_descFamily2`）**不**经过该卡：它只用
      `composition_two_blocks` 枚举 2 的合成，不需要 straightening。
      ⚠ v1 时这条边是 inferred 的记账边（Lean 证明体当时不调用该卡任何声明，
      reviewer-batch19 / lead 2026-09-11 改标 inferred）；pbw-n34 之后它成为承重边，故改回
      inferred: false。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
