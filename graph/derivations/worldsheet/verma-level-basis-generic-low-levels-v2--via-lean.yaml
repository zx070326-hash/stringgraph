  ——v2 起后一条已改回 inferred: false，理由见上；前一条裁定仍适用。

  **status: formalized 的依据**：目标 (1)(2)(3)(4) 各有无 sorry 的 Lean 定理逐字承载
  （对应表在目标卡的 source note），八条 depends_on 的 effective 全部是 formalized，
  故 effective = formalized。**本推导不含手写补充论证**；凡 Lean 未做的（PBW、Kac 零点、
  N ≥ 5、`Nat.Partition` 计数对接、酉性）都写进了 gaps 与目标的【不断言】。

  **为什么 depends_on 有八条而其中一条不承重**：
  worldsheet.shapovalov-form-existence 是**记账边**（说明前件 B 的来源与代价），
