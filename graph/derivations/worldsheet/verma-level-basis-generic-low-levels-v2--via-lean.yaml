  【2026-09-11 reviewer-batch19 / lead（v1 时的裁定，保留）】两条「记账边」（shapovalov-form-existence、
  verma-level-spanned-by-partitions）改标 inferred: true：Lean 证明体不调用
  exists_isContravariant_iff_hwv_ne_zero / finrank_levelSpan_le_card_partition（只在 docstring 出现），
