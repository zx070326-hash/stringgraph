id: worldsheet.free-boson-vertex-algebra-conformal-vector--via-sugawara-identification
target: worldsheet.free-boson-vertex-algebra-conformal-vector
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower
    note: |
      供给顶点代数 V = ℂ[Z k] ⊗ M(1) 本身（该卡 (2)）与 V-模 T(p; k_0) = ⊕_j F(p + j k_0) 的逐层识别
      e^{jk} ⊗ M(1, p̃) ↔ F(p + j k_0)（该卡 (3)(iii)）。本推导第 (1)(3) 步在这两条上工作。
      该卡 (N4) 明写不断言 ω 的存在——本推导正是补那一条。
  - id: math.vertex-algebra-borcherds-identity
    note: |
      供给模式约定 𝒴(ψ, z) = Σ ψ_n z^{−n−1}（G–N (2.31)）、平移算子 T 与真空 𝟙，
      以及 G–N 公理表里共形向量条 (2.26)–(2.29) 的**形式**（L_(n) = ω_{n+1}、Virasoro、L_(−1) = T、L_(0) 分次）。
      该卡自己**不**断言任何顶点代数有共形向量（其「不断言」(c)），本推导只用它固定记号与要验证的公理形式。
  - id: worldsheet.virasoro-generators-free-boson
    note: |
      被识别的对象：Fock 空间上直接定义的 L_n = ½ Σ_m :α_{n−m}·α_m:（产生–湮灭正规序，α_0 = (2α')^{1/2} p）。
      本推导第 (3) 步断言模作用 𝒴_W(ω, z) 的模式逐层等于它。**非 inferred**：目标陈述 (2) 逐字比对的就是这张卡的定义式。
  - id: worldsheet.momentum-tower-fock-space
    note: 供给塔的逐层零模装法 α^μ_0 = (2α')^{1/2}(p + j k_0)^μ · id（该卡 (1)），第 (3) 步的零模项用它。
  - id: worldsheet.bosonic-fock-space
    note: 供给振子代数 [α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0} 与 Fock 空间 F(D, ℂ)，即 M(1) 的物理写法；第 (2) 步的对易子计算在它上面做。
sources:
