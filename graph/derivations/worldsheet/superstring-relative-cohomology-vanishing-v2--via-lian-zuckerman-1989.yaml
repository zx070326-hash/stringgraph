id: worldsheet.superstring-relative-cohomology-vanishing-v2--via-lian-zuckerman-1989
target: worldsheet.superstring-relative-cohomology-vanishing-v2
kind: proof
status: rigorous
depends_on:
  - id: math.super-virasoro-algebra
    convention_map: |
      本图的中心荷归一化是 c/12：[L_m,L_n] = (m−n)L_{m+n} + (c/12)(m³−m)δ、
      {G_r,G_s} = 2L_{r+s} + (c/12)(4r²−1)δ。
      **LZ 用 c/8 与 c/2**（p.302 逐字）：[L_m,L_n] = (m−n)L_{m+n} + (c/8)(m³ − 2κm)δ_{m+n}、
      {G_{m+κ}, G_{n−κ}} = 2L_{m+n} + (c/2)(m² + 2κm)δ_{m+n}。换算两条：
        (1) **中心荷**：c_本图 = (3/2)·c_LZ ⇒ LZ 的 c_LZ = D = 10 ↔ 本图 c^m = 15；
            LZ 的鬼表示 ρ(c) = −10（Proposition 1.2）↔ 本图 c^g = −15。
        (2) **R 扇区 (κ = 0) 的 L₀ 零点**：LZ 的 {G₀,G₀} = 2L₀（无中心项），本图是
            2L₀ − c/12 ⇒ **L₀^LZ = L₀^本图 − c/24**。这与 LZ Definition 2.16 要求
            π(L₀)v = κv（NS 取 ½、R 取 0）的截距记法一致。
            NS 扇区 (κ = ½) 两侧的 [L,L] 中心项同 ∝ (m³ − m)，无额外平移。
      ⚠ 本定理的断言（哪些次数上上同调为零）**不受这两条换算影响**：它们只改 c 与 L₀ 的
      标定，不改复形的分次。但 (H1) 的 "c^m = 15 ⟺ LZ 的 D = 10" 这一步必须经过 (1)。
  - id: worldsheet.superstring-brst-charge
    note: |
      供给本图一侧的 Q_B 与两条定义性关系 {Q_B, b_n} = L_n、[Q_B, β_r] = G_r，
      即"本卡说的相对 BRST 上同调是本图哪个算符的上同调"。
      LZ 一侧的对应物是 **Definition 1.6** 的显式模式和（p.307，记号引 GSW [19]）、
      **Proposition 1.7(i)**（逐字 'All the operator sums above are well-defined on C'）
      与 **Proposition 2.1**（逐字 '[13] {Q, b₀} = K, [Q, β₀] = D_R.'，其中
      K = π(L₀) + ρ(L₀)、D_R = π(G₀) + ρ(G₀)），两侧逐项同型。
      ⚠ 本边是本推导有效状态被封顶在 physical-argument 的**主要原因**：该定义卡自身
      status 为 physical-argument（其上游是 OPE / 路径积分链）。**这不降低本推导自身的
      rigorous**——LZ 在自己的框架里把 Q 定义为一个良定义算子，不依赖路径积分。
  - id: worldsheet.superstring-brst-additional-conditions
    note: |
      供给相对复形 (H3) 的定义（NS：b₀ = L₀ = 0；R：另加 β₀ = G₀ = 0）。
      与 LZ **Definition 2.2** 逐条对应：B^r(p,κ) = Ker b₀（κ=½）/ Ker b₀ ∩ Ker β₀（κ=0）；
      F^n = B^{n−κ} ∩ Ker K；C^n_rel = F^n（κ=½）/ F^n ∩ Ker D_R（κ=0）。
      本定理断言的对象就是这个复形的上同调，故本边是本推导最核心的一条对象对接边。
  - id: worldsheet.superstring-brst-nilpotent-at-c15
    note: |
      供给 Q_B² = 0（上同调有定义的前提）。LZ 一侧的对应陈述是 **Proposition 1.7(ii)**
      逐字 'Q² = 0 iff D = 10.'
      ⚠ **LZ 自己不证 (ii)**：证明逐字 '(ii) is done in [13, 15].'（[13] = ohta-1986，
      [15] = Terao–Uehara, Phys. Lett. 168B (1986) 70）。故这条前提在 LZ 一侧也是外包的；
      显式系数公式见 ito-morozumi-nojiri-uehara-1986 (3.8)–(3.10)。
      本推导只需要 ⟸ 方向（c^m = 15 ⟹ Q_B² = 0），故指向单向弱卡；双向卡的 ⟹ 方向
      在本图是 conjecture，不经过本边。
  - id: worldsheet.superconformal-ghost-central-charge
    note: |
      供给 c^g = −15，即 (H1) 的"总中心荷为零 ⟺ c^m = 15"。
      LZ 一侧是 **Proposition 1.2** ρ(c) = −10·Id（LZ 归一化，换算见上面的 convention_map）。
  - id: worldsheet.superconformal-ghost-modes
    note: |
      供给 bc 与 βγ 的模式、对易/反对易关系与基态。LZ 一侧是 p.303 (1)–(4)
      （[γ_{m+κ}, β_{n−κ}] = δ_{m+n}、{c_m, b_n} = δ_{m+n}）与 Bose-sea charge q_B 的定义
      （p.303–304，引 Friedan–Martinec–Shenker，并注 'q_B here differs from that in [6]
      by a constant'）。
      ★ 本边同时承载断言 (1)(2) 里"表示的选择"：LZ p.306 (7) 选 T_{1/2}（κ=½）与
      **T₀ ⊕ T₁**（κ=0），理由逐字 'Fortunately, for each sector κ = ½, 0, there is a
      unique such space in which deg is bounded above'——**deg 有上界正是 Proposition 3.2
      的有限过滤能建立的前提**，故这条表示选择在本推导里不是装饰，是证明的技术输入。
  - id: worldsheet.superconformal-ghost-unit-operator-vacuum
    note: |
      供给 (H5)：βγ 的真空选择不唯一（本图一侧的证词是 |1⟩ ≠ |0⟩_NS 且 |1⟩ 上的 Fock 空间
      里没有 |0⟩_NS）。LZ 一侧是 p.304 逐字 'Representations corresponding to distinct
      charges are inequivalent.' ⇒ 断言 (2) 必须写成存在量词。
  - id: worldsheet.rns-super-virasoro-generators
    note: |
      供给物质部门 L^m_n、G^m_r 的显式模式表达式（本图一侧）。LZ 一侧是 Proposition 1.1
      与物质 Fock 空间 V(p,κ) = R(p,κ) ⊗ U(κ)，其中 U(κ) = C[α^μ_{−n}, d^μ_{−n+κ}]|p⟩、
      R(p,½) = C、R(p,0) 是 Spin(D−1,1) 旋量表示（p.303）。
      ★ 本边同时供给证明链里**唯一用到 p ≠ 0 的地方**的对象：Corollary 2.19(iii)
      "V(p,κ) 是自由 Vir_κ^- 模"，其反面（p = 0）就是 Proposition 5.5 的失效机制。
  - id: worldsheet.fock-indefinite-form
    inferred: true
    note: |
      供给"物质 Fock 空间上的双线性型因 η^{00} = −1 而不定"这一背景——本图把 RNS 物质
      Fock 空间作为**带不定型的**表示空间的记账入口。
      **标 inferred，理由与
      worldsheet.no-ghost-theorem-superstring-cohomological--via-lian-zuckerman-1989 同**：
      该卡是**玻色**弦的 Fock 形式（只有 α^μ_n），LZ 的 V(p,κ) 还含 d^μ_{−n+κ} 与 R 扇区的
      旋量因子 R(p,0)（其上的形式由 p·d₀ 定义，LZ Definition 1.3(ii)）；由玻色版到 RNS 版的
      推广在本图与 LZ 都没有作为一条独立陈述写出。
      ⚠ 附带说明（本推导特有）：本定理的证明**不用**任何厄米形式（见 gaps 与目标卡
      "本命题不断言 (a)"），故本边在本推导里只是"复形是哪个空间"的记账，比在正定性那张卡的
      同名边更弱。有效状态不受影响：该卡的有效状态已是 physical-argument。
