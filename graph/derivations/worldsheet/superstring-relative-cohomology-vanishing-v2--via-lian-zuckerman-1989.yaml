  - ref: lian-zuckerman-1989
    loc: "**Proposition 5.5**, p.333（p = 0 的例外情形），逐字：'For p = 0, the vanishing theorem does not hold because the Fock space V(p,κ) is not Vir_κ^- -free'；显式列出 H^n_rel(0,κ)（κ=0：n = 0, ±1；κ=½：n = ±½, ±3/2）与 H^n(0,κ)"
    note: |
      L1。本条给出 (H2) 的**必要性**：p ≠ 0 不是为方便加的，去掉它结论就假。
