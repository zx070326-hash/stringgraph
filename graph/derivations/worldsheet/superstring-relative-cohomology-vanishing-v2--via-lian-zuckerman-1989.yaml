summary: |
  LZ 1989 把 RNS 弦的 BRST 复形认作**超 Virasoro 代数的半无限上同调复形**，消灭定理
  （Theorem 2.4，证明为 §3 的 Corollary 3.4）的证明是"**有限过滤 + 长正合列 + Poincaré
  对偶**"三步：

  1. **复形与分次**：复形是 p.306 (8) 的 C(p,κ) = R(p,κ) ⊗ U(κ) ⊗ Λ_∞ ⊗ T，**鬼数**为 U + κ
     的本征值（取值在 Z + κ）；零模空间 T 按 p.306 (7) 选为使能量分次 **deg 有上界**的那一个
     （κ=½ 取 T_{1/2}、κ=0 取 T₀ ⊕ T₁）。相对复形按 Definition 2.2 取 Ker b₀ ∩ Ker K
     （NS）、再交 Ker β₀ ∩ Ker D_R（R），其上标 n 是 **F^n = B^{n−κ} ∩ Ker K 的"相对次数"
     （= 鬼数 + κ ∈ Z，两扇区都整数）**——目标卡 v2 的 (H4) 订正的正是这一点，
     本推导第 2–4 步里的 m、n 一律按相对次数读。
     由 Proposition 2.1 的 {Q, b₀} = K、[Q, β₀] = D_R 知 Q 保持之。
  2. **Poincaré 对偶（Lemma 3.1）**：H^m_rel ≅ (H^{−m}_rel)*。⇒ 只需证 **m < 0 时消灭**，
     正次数由对偶自动跟上。这是"集中在**一个**次数"而非"集中在非负次数"的来源。
  3. **有限过滤（Proposition 3.2）+ 伴随分次（Proposition 3.3）**：deg 有上界使相对复形上
     存在有限过滤，其伴随分次复形的上同调可直接算，结果是 H^m = 0 对 m < 0。这一步用
     **Theorem 3.3.1**（超李代数同调的正合序列，§3 的 (40)，自述是经典李代数同调定理的
     推广）与 **Corollary 2.19(iii)**（V(p,κ) 是**自由** Vir_κ^- 模）。
  4. **合并（Corollary 3.4）**：过滤的谱序列/正合列把伴随分次的消灭抬到相对复形本身，
     得 m < 0 的消灭；与第 2 步的对偶合并即 H^n_rel = 0 除 n = 0。

  **p ≠ 0 进入哪一步**：只进第 3 步的 Corollary 2.19(iii)。Proposition 5.5 逐字给出反面
  （'For p = 0, the vanishing theorem does not hold because the Fock space V(p,κ) is not
  Vir_κ^- -free'），故 (H2) 是**本质前提**而非便利假设——这与 p.305 Remark 的半空间假设
  {p^D > 0}（只定 R 扇区厄米型的整体符号、本定理不用）形成对照。

  【为什么标 rigorous】四条：
  (1) 结论是**带编号的定理**（Theorem 2.4）且有**独立编号的完整证明**（§3 全节，
      Corollary 3.4），不是断言加骨架；
  (2) 论证全在有定义的模范畴里：过滤有限（Prop 3.2）、deg 有上界（p.306 的表示选择）、
      算子和逐项有限（Prop 1.7(i)）；**不涉及路径积分、不涉及厄米形式**，
      是本图超弦区最接近纯代数的一条论证；
  (3) 作者自评这是全文唯一非平凡的数学结果（p.335），即论文的审稿分量正落在此处；
  (4) 期刊是 Communications in Mathematical Physics。
  与 worldsheet.no-ghost-theorem-brst--via-fgz 的记账口径一致。

  【有效状态为什么仍是 physical-argument】依赖里的 worldsheet.superstring-brst-charge、
  worldsheet.superstring-brst-additional-conditions 等定义卡自身是 physical-argument
  （上游是 OPE / 路径积分链），按 docs/STATUS_LEVELS.md 的 min 规则封顶。
  **这不是 LZ 的论证有缺口**，而是本图把"LZ 的对象 = Polchinski 的对象"这一步经由那些卡
  记账的后果。要抬高 effective 必须先把超弦 BRST 设定写成数学上自足的定义卡（Lean 岛候选）。
