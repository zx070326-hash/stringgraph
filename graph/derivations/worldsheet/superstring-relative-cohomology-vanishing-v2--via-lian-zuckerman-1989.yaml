notes: |
  ★★【本推导为何改指 v2（curator，2026-09-11，依 reviewer-batch22 + lead 裁决）】
  目标卡由 worldsheet.superstring-relative-cohomology-vanishing 换代到 -v2，唯一实质改动是
  (H4)：旧卡写「n 是鬼数」，而 LZ 的鬼数取值在 Z + κ（NS 半整数），Theorem 2.4 的
  "unless n = 0" 用的是 Definition 2.2 的**相对次数** n = 鬼数 + κ ∈ Z。
