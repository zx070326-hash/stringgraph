    loc: "p.306 (7)（零模表示：κ=½ 取 T_{1/2}、**κ=0 取 T₀ ⊕ T₁**，逐字 'Fortunately, for each sector κ = ½, 0, there is a unique such space in which deg is bounded above'）、p.306 (8)（复形 C(p,κ) 的显式张量积形式）、p.304（逐字 'Representations corresponding to distinct charges are inequivalent.'）、p.308（逐字 'From now on, we will take D = 10'）、p.303（逐字 'p will always be assumed non-zero until Sect. 5'）"
    note: |
      L1。前提的逐字定位 + 断言 (2) 的存在量词见证（T₀ ⊕ T₁）。
      ⚠ **p.305 Remark 的半空间假设 {p^D > 0} 不在本推导的前提链里**：auditor 2026-09-11
