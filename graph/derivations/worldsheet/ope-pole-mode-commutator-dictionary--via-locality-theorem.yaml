status: rigorous
depends_on:
  - id: math.locality-ope-equivalences-v2
    note: |
      **2026-09-11 改挂**：原先挂 math.locality-ope-equivalences（v1），该卡的记号段与来源的 ± 方向相反
      且自相矛盾，已 superseded_by v2（逐字转录版），推导亦随之改名改指；见 v2 的 notes「本卡为什么是 v2」。
      Schottenloher Theorem 10.10 第 4 条（物理写法的 OPE，奇异部分 Σ_j C^j(w)/(z−w)^{j+1}）⟺ 第 5 条
      （模式对易子 [A_(m), B_(n)] = Σ_j (m choose j) C^j_(m+n−j)）**逐字**就是目标节点的 (1)(2)(3)，
      差别只在目标节点把模指标换成物理侧的 A_m（见 summary (1)）。
  - id: math.formal-distribution-locality
    note: |
      Theorem 10.10 的前提（第 1 条）；也是把弦论的场当作 End(V)[[z^{±1}]] 中的形式分布并谈论其局域性所需的定义。
      目标节点的记号段（A(z) = Σ A_(n) z^{−n−1}、局域阶 N）直接取自本节点。
  - id: worldsheet.string-cft-is-a-vertex-algebra-v2
    note: |
      把 Theorem 10.10 用到弦论上，必须先知道 A、B ∈ E（∂X、T^X、T^g、T 等玻色型场）两两满足形式局域性——
      这正是该节点的 (i)。目标节点的陈述文本以「设 (V, E) 如 worldsheet.string-cft-is-a-vertex-algebra-v2 所述」
      开头，故这是一条**陈述层面的**依赖，不是可绕开的技术引理。
      **该节点无推导（open）**，因此本推导的有效状态被压到 open。这是刻意的：图上由此显示
      「严格路线存在，卡在弦 CFT 的场是否两两局域」。
sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Theorem 10.10 (第 4 条 ⟺ 第 5 条), p. 178；系数分布的存在唯一性与 c^n(w) = Res_z (z−w)^n f(z,w) 见 Proposition 10.6, p. 175；p. 179 物理记号翻译段（A(z)B(w) ∼ Σ_{j=0}^{N−1} C^j(w)/(z−w)^{j+1}，「with the implicit assumption of |z| > |w| in order to justify 1/(z−w)^{j+1} = i_{z,w} 1/(z−w)^{j+1}」）；(10.2) p. 180：T(z)T(w) ∼ (c/2)/(z−w)⁴ + 2T(w)/(z−w)² + ∂_w T(w)/(z−w) 给出 Virasoro 关系的例子"
    note: |
      **L1（researcher 2026-09-11，math-sources.md §11.3–§11.4 与 §11A）**。注意 p.179 一处、p.180 两处
      共**三处**正文写「4 in Lemma 10.5」「our Theorem 10.5」「property 5 in Lemma 10.5」，
      几乎肯定都应为 Theorem 10.10（Q12），本推导按 10.10 引用。
      第 5 条求和下限的印本 j = 1 已判为排印错误（原 Q10，已结案），本推导按 j = 0，见 gaps。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, §7.7 p. 73–74：从复解析局域性经 OPE 推出 Lie 括号版（箭头图 Complex analytic –7.11→ OPE –7.12→ Lie algebraic），逐字「in the same way as deriving the algebraic Jacobi identity from the complex analytic one using residue theorem」"
    note: |
      只用来说明「留数路线」在数学侧也存在且严格；本推导的主线走形式侧（Schottenloher），不依赖 Gui 的解析前提。
      「三版等价」在 Gui 书中没有编号定理，故 loc 只写小节。
summary: |
  设 (V, E) 满足 worldsheet.string-cft-is-a-vertex-algebra-v2 的 (i)：E 中任意 A(z), B(z) 作为
  End(V)[[z^{±1}]] 中的形式分布互为局域，局域阶 N。取 A, B 均为玻色型（偶）场，故 (i) 中的括号是通常对易子，
  Schottenloher Ch.10 的玻色型陈述可直接引用。
  (1) 记号换算：物理侧按 A(z) = Σ_m A_m z^{-m-h_A}（h_A 为选定的整数移位）展开，形式分布侧按
      A(z) = Σ_n A_{(n)} z^{-n-1} 展开；二者只是模指标的重标 A_{(n)} = A_{n-h_A+1}，即 A_m = A_{(m+h_A-1)}。
      目标节点的 [A_m, B_n] 就是 [A_{(m+h_A-1)}, B_{(n+h_B-1)}]。
  (2) 由 math.locality-ope-equivalences-v2（Theorem 10.10, 1 ⇒ 4，系数由 Proposition 10.6 唯一确定）：
        A(z)B(w) = Σ_{j=0}^{N-1} i_{z,w} (z-w)^{-(j+1)} C^j(w) + :A(z)B(w):,
        B(w)A(z) = Σ_{j=0}^{N-1} i_{w,z} (z-w)^{-(j+1)} C^j(w) + :A(z)B(w):,
      其中 C^j(w) = Res_z (z-w)^j [A(z),B(w)]。这就是目标节点的 (1)；「|z| > |w|」在这里的含义**只是**选定
      i_{z,w} 这种形式展开（p.179）。
  (3) 由 Theorem 10.10（4 ⇒ 5）：同一组 C^j 给出
        [A_{(M)}, B_{(N')}] = Σ_{j=0}^{N-1} binom(M, j) C^j_{(M+N'-j)}。
      代入 (1) 的重标 M = m+h_A-1、N' = n+h_B-1，并把 C^j 的模按移位 h_{C^j} = h_A+h_B-j-1 重标
      （即 (C^j)_p = (C^j)_{(p+h_A+h_B-j-2)}），右端的模指标 M+N'-j = m+n+h_A+h_B-2-j 恰好化为 (C^j)_{m+n}，
      于是
        [A_m, B_n] = Σ_{j=0}^{N-1} binom(m + h_A - 1, j) (C^j)_{m+n},
      即目标节点的 (2)。目标节点的 (3)（双向）就是 Theorem 10.10 中 4 ⟺ 5 这一对蕴含本身。
  (4) 例（p.180 (10.2)）：A = B = T，h = 2，N = 4，C^3 = (c/2)·1、C^2 = 0、C^1 = 2T、C^0 = ∂T，
      代入 (3) 得 [L_m, L_n] = (m-n) L_{m+n} + (c/12) m(m²-1) δ_{m+n,0}，与 conv.virasoro-standard 一致。
  以上每一步都在 End(V)[[z^{±1}, w^{±1}]] 内完成，**不使用**任何收敛性、径向排序或围道变形——
  目标节点的陈述文本也已相应地不含这些内容。代价是前提 (i) 必须另行建立。
gaps:
  - "**唯一的实质缺口在前提**：worldsheet.string-cft-is-a-vertex-algebra-v2 无推导（open），
     本推导的有效状态因此为 open，目标节点亦然。要让本路线生效，需要为该节点补一条推导
     （或先建只含形式局域性 (i) 的弱节点并改挂，见该节点 notes 的指引）。"
  - "**模指标重标 (1) 与 C^j 的移位 (3) 是本图的补白**：Schottenloher 用 A_(n)（z^{-n-1}），Polchinski 用带权偏移的
     A_m（z^{-m-h_A}）；两者的换算在两本书里都没有并列写出。这一步本身是有限步初等代数（改写求和指标），
     但**它出现在目标节点的陈述文本里**，读者须知道它无逐字来源。"
  - "**只覆盖玻色型（偶）场**。b、c 本身及任何奇场需要 Theorem 10.10 的超代数版本（对易子换反对易子、
     二项式系数不变），Schottenloher Ch.10 的陈述是玻色型，超代数版本的编号本轮未核实。
     目标节点已把范围限定为玻色型，故这**不是**本推导与目标之间的缺口，而是**目标节点覆盖面的限制**：
     bc 部门的极点-对易子字典在本图中仍只有物理路线
     （worldsheet.ope-commutator-dictionary--via-contour-deformation）。"
  - "**★ 已结案（原 Q10），仅留痕**：Theorem 10.10 第 5 条的求和下限**印本印作 j = 1**，
     **本图判为排印错误，按 j = 0 写**（四条依据 + 反例见
     math.locality-ope-equivalences-v2--via-schottenloher 的 gaps 第一条与
     literature/extractions/math-sources.md §11A.3）。
     **本推导对这条结案有直接的自证**：summary (4) 的 Virasoro 例子里 C⁰ = ∂T ≠ 0，
     若下限真是 j = 1 就会整个丢掉 [L_m, L_n] 中来自 ∂T 的 (m−n)L_{m+n} 项，
     算不出 Virasoro 代数。**这正是判定排印错误的反例本身。**
     ⚠ 反过来，**不要用 Schottenloher p. 179 的 Heisenberg 例子去验证下限**：该例 C⁰ = 0，
     j = 0 与 j = 1 给出相同答案，对两者没有区分力。"
notes: |
  **本推导取代 worldsheet.ope-commutator-dictionary--via-locality-theorem**（同一提交里删除，
  reviewer-batch3 必修第 3 条，curator 2026-09-11）。改动的实质只有一条：**换目标**。
  旧推导挂在 worldsheet.ope-commutator-dictionary（围道语言、含解析延拓层、含费米型场）上，
  而它自己的 gaps 承认「本推导给出的是同一字典的形式分布版本，『R{A(z)B(w)} 作为全纯函数、
  两种排序互为解析延拓』这一层本推导不覆盖」——即证的比目标弱。
  现在目标换成 worldsheet.ope-pole-mode-commutator-dictionary（形式分布版、玻色型），
  推导与目标严格对齐，原 gaps 中「不覆盖解析延拓」那一条随之消失（新目标不含该层）。
  按 graph/CLAUDE.md 的 `<statement-id>--via-<method>` 命名规则，换目标必须换 id，故旧文件删除、本文件新建；
  旧 id 未被任何里程碑或其它节点的 depends_on 引用。

  **为什么 status 写 rigorous**：本推导自身的论证（Theorem 10.10 的两个蕴含 + Proposition 10.6 的唯一性
  + 模指标重标 + 一个例子）是有限步形式代数，来源是数学教材中带证明的定理。status 是「自身论证的严格程度」，
  有效状态由工具算——这正是把 open 的前提显式列进 depends_on 而不是藏进 gaps 的意义。

  ⚠ **正规序 ± 标签的登记（2026-09-11，curator）**：目标节点 worldsheet.ope-pole-mode-commutator-dictionary
  的「记号」段写 `:A(z)B(w): := A(z)_- B(w) + B(w) A(z)_+` 并引「math.locality-ope-equivalences 的『记号』段」，
  用的是 v1（现已 superseded）的 ± 惯例，**与 Schottenloher Definition 10.9 的逐字方向相反**
  （来源的 `-` 是模指标 n ≥ 0 的那一半）。目标节点同句的散文「产生-湮灭正规序积」与来源一致，
  **它挑出的算符是同一个**（模指标为负的那一半写在左边），且目标节点的 (1)(2)(3) 只用到
  「同一个 :AB: 同时出现在 A(z)B(w) 与 B(w)A(z) 两式中」，与 ± 标签无关，**结论不受影响**。
  按项目原则 1 目标节点的陈述文本不改，事实登记于此与 math.locality-ope-equivalences-v2 的
  「下游一致性核查」。本推导的 summary 按 v2（来源）方向理解 ±。

  **与围道那条推导的关系**：worldsheet.ope-commutator-dictionary--via-contour-deformation
  （physical-argument）挂在旧的围道语言节点上，不受本次改动影响；两个陈述节点之间差的正是
  「径向排序围道 = 形式分布残数」这一解析步骤与费米推广，已记在
  worldsheet.ope-commutator-dictionary 的 notes 里。
