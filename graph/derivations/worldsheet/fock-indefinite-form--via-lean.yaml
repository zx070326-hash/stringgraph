summary: |
  直接机器检查的证明，全部在 formal/StringFormal/NoGhost/Fock.lean 内完成。路线：

  1. 先**构造**候选型。把 `Fock D R = MvPolynomial (Osc D) R` 的单项式基
     `MvPolynomial.basisMonomials` 上的线性泛函 `d ↦ monomialNorm η d • lcoeff R d` 用
     `Basis.constr` 延拓，得到 `pairing η`。这一步顺带给出陈述 (2) 的对角公式
     `pairing_monomial_monomial`（基上直接读出）与对称性 `pairing_flip` / `pairing_comm`。

  2. 证**伴随关系**（`pairing_creation_left`）：产生算符在单项式上是 `d ↦ d + δ_v`，
     核心是归一化常数的递推
       monomialNorm η (d + δ_v) = monomialNorm η d · (n η^{μμ} · (d(v) + 1))，
     而湮灭算符 α^μ_n = n η^{μμ} ∂/∂X_v 作用在系数上恰好补出因子 (d(v) + 1)。
     `pairing_creation_right` 由对称性得到。

  3. 证**唯一性**（`pairing_unique`，即陈述 (1)）：设 B 满足 (a)(b)。先对 Q 用
     `MvPolynomial.induction_on` 证 B 1 Q = pairing η 1 Q（归纳步用 (b) 的右伴随把
     乘 X_v 搬到左边变成湮灭算符作用在真空 1 上，`annihilation_one` 给零）；
     再对 P 归纳，归纳步用 (b) 的左伴随。两次归纳都只用到 (a)(b)，故 B = pairing η。

  4. 陈述 (3)（level 正交）：`pairing_apply` 把 ⟨P,Q⟩ 写成沿 P 的支撑的对角和；
     若 P 在 level M、Q 在 level N 且 M ≠ N，则每一项里 coeff d P 与 coeff d Q 不能同时非零。

  5. 陈述 (4)（不定性）：`pairing_X_X` 给 ⟨X_u, X_v⟩ = δ_{uv} · n η^{μμ}；代入
     `minkowski D R = fun μ => if μ = 0 then -1 else 1` 得 `pairing_X_X_minkowski_timelike`
     （= −n）与 `pairing_X_X_minkowski_spacelike`（= +n）。

  6. 陈述 (4) 末句（不定性本身，FockSigned.lean，2026-09-11 补）：在基环上加
     `[PartialOrder R] [IsStrictOrderedRing R]` 后，由 n ≥ 1 得 −n < 0（`pairing_timelike_neg`，
     需 D ≥ 1 使 μ = 0 存在）与 0 < n（`pairing_spacelike_pos`，需 D ≥ 2 使 μ = 1 存在），
     打包为 `pairing_indefinite`：∃ P Q, ⟨P,P⟩ < 0 ∧ 0 < ⟨Q,Q⟩。
     `pairing_indefinite_field` 是它在 `[Field K] [LinearOrder K] [IsStrictOrderedRing K]` 下的特化，
     逐字对应陈述「R 是有序域」的措辞。
gaps:
  - |
    (iii) **只支持对角 η**。Lean 里 η 是 `Fin D → R`（对角元），不是一般对称双线性型。
    对角性是「单项式基即正交基」（陈述 (2)）的前提；一般 η^{μν} 需要先做一次基变换，未做。
    在 ℝ 上这不损失一般性（可对角化），但形式化侧确实没有覆盖非对角输入。
  - |
    (iv) **实对称双线性型，不是半双线性型**。形式化的是 R-双线性型（R 任意交换环）。
    物理上的复 Fock 空间带的是 Hermitian 半双线性型；两者在单项式的实张成上一致，
    但**复情形没有证**。特别地「(α^μ_n)† = α^μ_{−n}」在本节点里是双线性型意义下的伴随，
    不是 Hilbert 空间意义下的 Hermitian 伴随。
  - |
    (v) **【已关闭，2026-09-11】** 原文：陈述 (4) 末句「−n < 0 < n 故该型不定」在 Lean 中
    未单列为定理（Fock.lean 在任意 `CommRing R` 上工作，没有序结构，只给出两个值 −n 与 +n）。
    现由 formal/StringFormal/NoGhost/FockSigned.lean 的
    `StringFormal.NoGhost.Fock.pairing_indefinite`（及 `pairing_indefinite_field`）机器检查，
    见 sources 第二条与 summary 第 6 步。保留此条以存档；本推导的 formalized 状态自此
    覆盖陈述 (1)–(4) 的**全部**句子。
  - |
    (vi) 本推导继承 worldsheet.bosonic-fock-space 的缺口 (i)（无零模/动量）与 (ii)（未完化）。
    因此本节点**不是**「弦的协变 Hilbert 空间上的 Minkowski 内积」这条陈述，
    只是它的振子部分、代数版本。
