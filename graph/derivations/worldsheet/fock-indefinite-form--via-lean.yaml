  若后续 `scripts/check_axioms.lean` 做出来，应在此补一行自动检查结果。

  文献侧（Polchinski / GSW）并没有与本推导对应的论证：他们直接规定内积并计算矩阵元，
  不证唯一性。故本推导的 sources 主项是本仓库，两条文献只挂在陈述节点上作为物理对照。

  【gap (v) 的关闭：序假设比陈述写的弱】（curator 2026-09-11，依据 FockSigned.lean 文件头与
  formal/TODO.md fock-indefinite-over-ordered-ring 一项）
  - 陈述 (4) 末句写的是「R 是有序域（如 ℝ）且 D ≥ 2」。Lean 证明**只需有序环**：
    `[CommRing R] [PartialOrder R] [IsStrictOrderedRing R]`——不需要除法，也不需要全序。
    有序域版 `pairing_indefinite_field` 只是特化，用来逐字对应陈述措辞。
  - 维数假设按结论分开：鬼态（负模态）只需 **D ≥ 1**（类时方向 μ = 0 存在），
    正模态需 **D ≥ 2**（类空方向 μ = 1 存在）；「不定」两者都要，故 D ≥ 2。
    两个假设都是必要的：D = 0 时空间是 R、型为 ⟨a,b⟩ = ab；D = 1 时型在全空间上半负定。
  - 附带结论 `exists_mem_levelSubmodule_pairing_self_neg`：**每个** level n ≥ 1 都有负模态态，
    鬼不集中在某一片。这一条陈述节点没有写，是形式化侧的加强。
  - Mathlib v4.33.1 **已无 `LinearOrderedField` 类**；「有序域」现写作
    `[Field K] [LinearOrder K] [IsStrictOrderedRing K]`。陈述节点用自然语言写「有序域」，
    不受此影响。
  - FockSigned.lean 继承 Fock.lean 的全部缺口（本推导 gaps (iii)(iv)(vi)）。
