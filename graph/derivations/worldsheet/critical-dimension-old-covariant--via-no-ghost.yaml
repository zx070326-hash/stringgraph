id: worldsheet.critical-dimension-old-covariant--via-no-ghost
target: worldsheet.critical-dimension-old-covariant
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.no-ghost-theorem-v2
sources:
  - ref: goddard-thorn-1972
    loc: "Theorem 1 的等号情形（D = 26, a = 1）及其推论（定理编号未核实）"
  - ref: gsw-1987-v1
    loc: "§2.3.2–2.3.3"
    note: GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写。
summary: |
  无鬼定理（worldsheet.no-ghost-theorem-v2）第 (1) 条在 D = 26、a = 1 时断言 H_phys 上内积半正定，
  且 H_phys 模零模态与 24 个横向振子的 Fock 空间等距同构，这正是本陈述的 (a)(b)(c)
  （(b) 的"诱导内积正定"即等距同构的直接推论）。第 (2) 条 D > 26 的负模构造给出反向部分。
  本推导只是把无鬼定理的等号情形改写为"临界维数判据"的形式，不含新的物理输入。
  注意 v2 把断言限制在动量满足 k·k_0 ≠ 0 的扇区（DDF 构造所需），本陈述未写该限制。
gaps:
  - "D < 26 的表述需按 worldsheet.no-ghost-theorem-v2 的措辞规范化（ms.no-ghost-theorem 审计 B2/B3）：本陈述末句写\"H_0 的维数不足以把 H_phys 约化到横向 Fock 空间\"、结论句写\"零模态完全退耦，物理谱在洛伦兹协变的意义下幺正\"，其中\"退耦\"无可操作定义，\"维数不足\"不精确。规范写法是\"H_phys/H_0 与 24 个横向振子的 Fock 空间之间不存在等距同构\"。按审计的精确计算，D ≤ 25 且 a ≤ 1 时半正定成立，故该句在 a = 1 时并不假，问题只在措辞；陈述不可变，此处登记，不新建后继节点。"
  - "本陈述末句关于 D < 26 的断言不由依赖节点支撑：worldsheet.no-ghost-theorem-v2 按审计 B1 只覆盖 (D = 26, a = 1) 与 (D > 26, a = 1)，删去了旧节点那条为假的 \"D ≤ 26 且 a ≤ 1 ⇒ 半正定\"（正确区域是 (D ≤ 25 且 a ≤ 1) 或 (D = 26 且 a = 1)）。D ≤ 25 的无鬼性通常归于 Brower 1972 / Thorn，尚未建节点；建节点后应把它加为本推导的第二条依赖。"
  - "本陈述倒数第二句 \"D > 26 时 (a) 失效\" 未写 a 的取值；依赖节点 worldsheet.no-ghost-theorem-v2 的第 (2) 条只覆盖 a = 1。本推导按 a = 1 理解该句。"
author: curator-critdim
created: "2026-09-10"
