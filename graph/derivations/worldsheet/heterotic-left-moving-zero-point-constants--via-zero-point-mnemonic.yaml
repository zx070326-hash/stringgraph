id: worldsheet.heterotic-left-moving-zero-point-constants--via-zero-point-mnemonic
target: worldsheet.heterotic-left-moving-zero-point-constants
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.heterotic-so32-projections
    note: 供给左移部门的内容（8 个横向 X^i 与 32 个 λ^A）与两种周期条件（(11.2.9) 的 ±）。
  - id: worldsheet.rns-matter-normal-ordering-constants
    note: |
      供给零点能助记法本身（每周期玻色子 −1/24、周期费米子 +1/24、反周期费米子 −1/48）
      及其在横向计数下的用法。(11.2.14) 逐项写出的三个数就是这条助记法。
  - id: worldsheet.zeta-regularized-sum-of-integers
    inferred: true
    note: |
      **inferred 的理由**：原书在 §11.2 只用助记法，**不做**任何 ζ 正规化计算，
      也不在此处引用 Vol.1 的推导。本图连这条边只是为了让「−1/24 从哪来」在图上可见，
      且它只覆盖玻色子一半（费米子的 +1/24 / −1/48 本图无节点）。
sources:
  - ref: polchinski-1998-v2
    loc: "§11.2, eq. (11.2.14), p. 52（逐字算式：NS 型 −8/24 − 32/48 = −1；R 型 −8/24 + 32/24 = +1）"
    note: L1（抽取记录 polchinski-1998-v2.md E56）。原书把算式逐项写出，没有别的论证。
summary: |
  把零点能助记法逐项用在左移部门：
    8 个横向玻色子 X^i（周期）：8 × (−1/24) = −1/3；
    32 个 λ^A 反周期（NS 型）：32 × (−1/48) = −2/3  ⇒ 合计 −1；
    32 个 λ^A 周期（R 型）  ：32 × (+1/24) = +4/3  ⇒ 合计 +1。
  这正是 (11.2.14) 的两条逐字算式。
gaps:
  - "**助记法本身在本图无严格支撑**：它出自 Vol.1 §2.9 末（本轮未读页图）。本图只有玻色子一半的 ζ 正规化节点（worldsheet.zeta-regularized-sum-of-integers），费米子的 +1/24 与 −1/48 完全没有节点。"
  - "**「横向计数」这一步没有独立论证**：数 8 个 X^i 而不是 10 个 X^μ，隐含了光锥式的记账（与 (10.5.4)/(10.5.5) 同体例）。原书在 §11.2 不解释为什么可以这样数；在协变量子化里对应的是鬼场常数的贡献。"
  - "**ζ 正规化那条边是 inferred**：原书此处不做也不引用该计算。"
author: curator
created: "2026-09-11"
