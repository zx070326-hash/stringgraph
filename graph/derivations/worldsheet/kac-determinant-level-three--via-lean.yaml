  - ref: schottenloher-2008
    loc: "Ch. 6 §6.3, Theorem 6.12, p. 98"
    note: |
      **不承载本推导的论证**。只用于目标卡 notes 里那段「Lean 的四条对称函数假设在 R = C 上
