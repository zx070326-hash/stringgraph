depends_on:
  - id: worldsheet.shapovalov-form-uniqueness
    inferred: false
    note: |
      提供两件事：
      (a) 「归一化逆变型」这一概念本身（目标陈述的前提，Lean 侧 `IsContravariant` + `hB1`）；
      (b) **对称性**——`gram_level_three_entries` 用三次 `hB.comm` 把 ⟨u₂₁,u₃⟩、⟨u₁₁₁,u₃⟩、
          ⟨u₁₁₁,u₂₁⟩ 换成各自的转置，而 `IsContravariant.comm` 正是该卡 (2)
          （经 `flip_eq`，即该卡的唯一性论证）。**这不是记号约定，是被用到的定理**。
      另外该卡 (3) 的 level 正交在同文件给出两个实例 `gram_level_one_three`、
      `gram_level_two_three`，它们不进目标陈述，只作旁证。
      字面依赖：ShapovalovLevelThree.lean import Shapovalov.lean。
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      提供 V(c,h)、|c,h⟩ 与最高权关系 `lie_lgen_hwv_of_pos` / `lie_lgen_zero_hwv` /
      `lie_cgen_hwv`——level-3 的每个 Gram 元都是「把上升模态 L₁/L₂/L₃ 推过去打到 |c,h⟩ 上」，
      靠的就是这三条。另用到 `levelSpan` / `levelWord`（`desc3/desc21/desc111_mem_levelSpan`
      的陈述，以及目标【不断言】(a) 里「3 的合成有四个」那句的定义依据；Lean 侧
      `desc21_mem_levelSpan` 用 `Composition` 的 blocks `[2, 1]` 并以 `rfl` 闭合，
      故 `levelWord` 对词 [2,1] 的约定就是 L₋₂L₋₁v）。
      **刻意未用**该卡不断言的 PBW / dim V_N = p(N) / V(c,h) ≠ 0；这正是目标【不断言】(a)。
  - id: worldsheet.virasoro-algebra-v2
    inferred: false
    note: |
      Gram 元的每一步都在用 Virasoro 括号的**具体系数**，包括两处中心项：
      `lie_lgen_three_neg_three : ⁅L 3, L (−3)⁆ = 6·L 0 + centralTerm R 3 · C`
      配 `centralTerm_three : centralTerm R 3 = 2`（即 ⟨u₃,u₃⟩ = 6h + **2c** 里的 2），
      以及 level-2 已有的 `centralTerm R 2 = 1/2`（进入 ⟨u₂₁,u₂₁⟩ = 8h² + **ch** + 8h）。
      还用到 `lie_lgen_three_neg_two : ⁅L 3, L(−2)⁆ = 5·L 1`、
      `lie_lgen_three_neg_one : ⁅L 3, L(−1)⁆ = 4·L 2`，以及 `lie_lgen_lgen` 的一般形式。
      ⇒ 目标 (1)(2) 的全部数值系数**完全来自**该卡的括号与中心项归一化；
      换一套归一化（conv.virasoro-standard 之外）数字就会变。同为 conv.virasoro-standard。
  - id: worldsheet.kac-determinant-level-two
    inferred: false
    note: |
      字面依赖：ShapovalovLevelThree.lean 直接 import Shapovalov.lean，目标 (1) 的
      ⟨u₂₁,u₂₁⟩ 与 ⟨u₁₁₁,u₁₁₁⟩ 的计算**复用**该卡的引理
      `lie_lgen_one_desc1`、`lie_lgen_zero_desc1`、`lie_lgen_two_desc1`、`lie_lgen_two_desc11`、
      `lie_lgen_one_desc11` 与 `two_mul_centralTerm_two`，以及定义 `desc1` / `desc11`
      （u₂₁ = ⁅L₋₂, desc1⁆、u₁₁₁ = ⁅L₋₁, desc11⁆ 是按它们定义的）。
      内容上的衔接：目标 (2) 的中间因子 16h² + 2h(c−5) + c 就是该卡 (3) 除以 2h。
      ⚠ 该卡是 formalized，故这条边**不**压低目标的有效状态。
