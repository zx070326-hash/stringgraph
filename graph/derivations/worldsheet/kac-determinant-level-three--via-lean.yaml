  - ref: stringformal-2026
    loc: "formal/StringFormal/Virasoro/ShapovalovLevelThree.lean :: StringFormal.Virasoro.IsContravariant.gram_level_three_det（目标 (2)，本推导的 formal.lean_decl 对应物）与 StringFormal.Virasoro.IsContravariant.gram_level_three_det_eq_kac（目标 (3)）；六个 Gram 元 IsContravariant.{gram_level_three_33, gram_level_three_3_21, gram_level_three_3_111, gram_level_three_21_21, gram_level_three_21_111, gram_level_three_111_111} 与合并形式 gram_level_three_entries；辅助 StringFormal.Virasoro.{desc3, desc21, desc111, centralTerm_three, lie_lgen_three_neg_three, lie_lgen_three_neg_two, lie_lgen_three_neg_one, lie_lgen_three_desc1, lie_lgen_three_desc11, lie_lgen_zero_desc11, lie_lgen_three_desc3, lie_lgen_three_desc21, lie_lgen_three_desc111, lie_lgen_two_desc21, lie_lgen_two_desc111, lie_lgen_one_desc111, kac_factor_rs_two, kac_factor_rs_three, kac_level_three_at_c_one}；上游调用 StringFormal.Virasoro.{desc1, desc11, lie_lgen_one_desc1, lie_lgen_zero_desc1, lie_lgen_two_desc1, lie_lgen_two_desc11, lie_lgen_one_desc11, two_mul_centralTerm_two, lie_lgen_hwv_of_pos, lie_lgen_zero_hwv, lie_cgen_hwv, levelWord, levelSpan, IsContravariant.comm, IsContravariant.eq_zero_of_level_ne} 与 VirasoroAlgebra.{lie_lgen_lgen, centralTerm}"
    note: |
