summary: |
  全程是振子模代数的直接计算，对象都在代数动量塔上，逐向量有限，不涉及围道、OPE 或收敛性。
  记 K_n = α^b_n = Σ_μ η_μ b^μ α^μ_n（目标卡【定义】）。

  1. **[L_m, K_n] = −n K_{m+n}**（目标卡 (1)）。
     由 L_m 的 Sugawara 定义与振子代数得 [L_m, α^μ_n] = −n α^μ_{m+n}（对每个 μ，用到 η_μ² = 1
     把缩并的 η_{μν} 与对易子的 η^{μν} 对上；这是 worldsheet.virasoro-generators-free-boson 的
     标准推论，Lean 侧 `lie_towerLop_towerMode`）。对 μ 作线性组合即得。
     **不用 (N)(S)**。

  2. **[K_m, K_n] = 0**（目标卡 (2)）。
     [α^b_m, α^b_n] = Σ_{μ,ν} η_μ η_ν b^μ b^ν · m η^{μν} δ_{m+n,0} = m η(b,b) δ_{m+n,0}·id
     （再次用 η_μ² = 1 收缩）。由 (N) η(b,b) = 0 得零。**这是 (N) 在本推导唯一进入之处。**

  3. **K_0 = id**（目标卡 (3)）。
     K_0 逐层是标量 η(b, α_0|_N/(2α')^{1/2}) = η(b, a + N b) = η(b,a) + N η(b,b)。
     由 (S) η(b,a) = 1 与 (N) η(b,b) = 0，每层都是 1，故 K_0 = id。
     ⇒ 归一化 (S) 一次取定即对整条塔成立，这正是 worldsheet.ddf-operators-v6 把 (N)(S) 作为
     DDF 数据的理由；Goddard 2008 §5 p.11 的 'k·p = 1' 在 α' = 1/2 下就是它。

  4. **K_m† = K_{−m}**（目标卡 (4)）。
     ⟨α^b_m v, w⟩_T = Σ_μ η_μ b^μ ⟨α^μ_m v, w⟩_T = Σ_μ η_μ b^μ ⟨v, α^μ_{−m} w⟩_T = ⟨v, α^b_{−m} w⟩_T，
     用到逐层 (α^μ_n)† = α^μ_{−n}（含 n = 0 的标量情形）与层间正交
     （K_m 不移动层）。**不用任何条件**。

  5. **[K_m, A^ε_n] = 0**（目标卡 (5)）。
     A^ε_n = Σ_j α^ε_j V^{(n)}_j 逐向量是有限和；对固定 x 取一个对 x 与 K_m x 都够大的公共窗口，
     把 K_m 移进求和，逐项
       [K_m, α^ε_j V^{(n)}_j] = [K_m, α^ε_j] V^{(n)}_j + α^ε_j [K_m, V^{(n)}_j]。
     第一项：[α^b_m, α^ε_j] = m η(b,ε) δ_{m+j,0} = 0，由横向性 (T)。
     第二项：[α^μ_m, V^{(n)}_j] = n b^μ V^{(n)}_{j−m}（α 与指数顶点算子的标准对易子，
     来自 α(z) 与 :e^{i n k_0·X(w)}: 的单极），线性组合得 [α^b_m, V^{(n)}_j] = n η(b,b) V^{(n)}_{j−m} = 0，
     由 (N)。两项皆零，故 [K_m, A^ε_n] = 0。

  【为什么是 physical-argument 而不是 rigorous】三条：
  (a) 文献侧只有结论没有证明：Goddard 2008 (6.3) 一句带过，GT 1972 正文未获取；
      (3)(4)(5) 在文献中连显示公式都没有，是本图补的。
  (b) 第 5 步用到的 [α^μ_m, V^{(n)}_j] = n b^μ V^{(n)}_{j−m} **在本图没有承载节点**
      （worldsheet.exponential-vertex-operator-modes 的「不断言 (b)」明写它只在 Lean 侧有）；
      第 1 步的 [L_m, α^μ_n] = −n α^μ_{m+n} 同样没有单独的卡。
  (c) 按 docs/STATUS_LEVELS.md 的例外条款，有限步初等计算可标 rigorous，但须 reviewer 复核并写
      `reviewer-verified`；本推导尚无。
  ⇒ 升级路径：**最便宜的是等 Lean 的 `towerK` 落地后另挂 --via-lean（formalized）**，
  届时本推导退为文献侧记录；其次是 reviewer 复核本 summary 五步并登记 `reviewer-verified`。
