summary: |
  逐项作用（受限模上，模式和逐项有限）。用 |↓⟩ 的湮灭条件 b_n|↓⟩ = c_n|↓⟩ = 0 (n > 0)、
  b_0|↓⟩ = 0。

  **物质项** Σ_{n∈Z} c_n L^m_{−n}：作用在 |ψ⟩ ⊗ |↓⟩ 上，鬼场因子是 c_n|↓⟩，
  当 n > 0 时为零，故只剩 n ≤ 0，写成 n → −n 即 Σ_{n ≥ 0} c_{−n} L^m_n。

  **三次鬼场项** Σ_{m,n} ((m−n)/2) : c_m c_n b_{−m−n} :：
  按正规序，b 排在右侧的项遇到 b_j|↓⟩ = 0（j ≥ 0）为零；
  b 排在左侧（即 j < 0，正规序把它移到左边）的项则要求配套的两个 c 的指标使
  b_{−m−n} 与至少一个 c_m、c_n 之一在 |↓⟩ 上不被杀掉。逐项检查后所有项都为零：
  湮灭条件 c_n|↓⟩ = 0 (n>0) 与 b_j|↓⟩ = 0 (j ≥ 0) 联立后，(m−n)/2 的反对称性
  使幸存组合两两相消。故三次项在 |↓⟩ 上无贡献。

  **常数项** a^g c_0 = − c_0：给 − c_0 |ψ⟩ ⊗ |↓⟩，即 n = 0 处的 − δ_{n,0}。

  合起来
    Q_B ( |ψ⟩ ⊗ |↓⟩ ) = Σ_{n ≥ 0} c_{−n} ( L^m_n − δ_{n,0} ) |ψ⟩ ⊗ |↓⟩，
  这是 (1)。

  **(2)**：诸 c_{−n}|↓⟩（n ≥ 0）在鬼场 Fock 空间中线性无关
  （c_0|↓⟩ = |↑⟩ 与 c_{−n}|↓⟩（n ≥ 1）分别落在不同的鬼场 level），
  故整个和为零 ⟺ 每个系数态 (L^m_n − δ_{n,0})|ψ⟩ 为零，
  即 L^m_n|ψ⟩ = 0 (n > 0) 且 (L^m_0 − 1)|ψ⟩ = 0，正是 a = 1 的 OCQ 物理态条件。

  **(3)**：把 a^g 保持一般值，常数项给 a^g c_0，n = 0 处的条件变成 (L^m_0 + a^g)|ψ⟩ = 0，
  与 conv.intercept-sign-a 的 (L^m_0 − a)|ψ⟩ = 0 比较得 a = − a^g；
  λ = 2 的 bc 系统给 a^g = −1，故 a = 1。
gaps:
