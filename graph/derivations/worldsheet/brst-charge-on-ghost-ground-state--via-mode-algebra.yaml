  - "本命题的原书式号未核实：唯一逐字来源是第三方笔记 schrans-2020 的自编号 [4.226]。"
  - "三次鬼场项的论证依赖「: … : 以 |↓⟩ 为参照」这一约定。Polchinski (4.3.7) 的正规序参照本图未核对原书；若原书取 SL(2,R) 真空 |0⟩ 为参照，两者相差的正是被单独写出的常数 a^g c_0，结论不变，但这一等价本图未逐项核实。"
