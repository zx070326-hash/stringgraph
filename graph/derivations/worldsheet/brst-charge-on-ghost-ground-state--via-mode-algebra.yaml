summary: |
  逐项作用（受限模上，模式和逐项有限）。

  **正规序参照**：Q_B 的三次鬼场项 Σ_{k,n} ((k−n)/2) : c_k c_n b_{−k−n} : 里的 : … :
  取以 |↓⟩ 为参照的正规序，即
    湮灭子 = { b_j : j ≥ 0 } ∪ { c_j : j ≥ 1 }，   产生子 = { b_j : j ≤ −1 } ∪ { c_j : j ≤ 0 }。
  注意 **c_0 是产生子**（c_0|↓⟩ = |↑⟩ ≠ 0）而 **b_0 是湮灭子**（b_0|↓⟩ = 0）；
  与之配套的常数正是末项 a^g c_0 = −c_0。

  **物质项** Σ_{n∈Z} c_n L^m_{−n}：作用在 |ψ⟩ ⊗ |↓⟩ 上，鬼场因子是 c_n|↓⟩，
  当 n > 0 时为零，故只剩 n ≤ 0，写成 n → −n 即 Σ_{n ≥ 0} c_{−n} L^m_n。

  **三次鬼场项**：正规序把所有湮灭子排在右边，故一个正规序单项作用在 |↓⟩ 上非零，
  **当且仅当它的三个因子全是产生子**（只要有一个湮灭子，它站在最右边，直接杀掉 |↓⟩）。
  对 : c_k c_n b_{−k−n} : 这要求同时
    c_k 是产生子 ⇒ k ≤ 0,
    c_n 是产生子 ⇒ n ≤ 0,
    b_{−k−n} 是产生子 ⇒ −k − n ≤ −1 ⇒ k + n ≥ 1。
  前两条给 k + n ≤ 0，与第三条矛盾。故**没有一项存活**，三次鬼场项在 |ψ⟩ ⊗ |↓⟩ 上恒为零。
  （这一步与系数 (k−n)/2 无关，也不需要任何相消论证。）

  **常数项** a^g c_0 = − c_0：给 − c_0 |ψ⟩ ⊗ |↓⟩，即 n = 0 处的 − δ_{n,0}。

  合起来
    Q_B ( |ψ⟩ ⊗ |↓⟩ ) = Σ_{n ≥ 0} c_{−n} ( L^m_n − δ_{n,0} ) |ψ⟩ ⊗ |↓⟩，
  这是 (1)。

  **(2)**：诸 c_{−n}|↓⟩（n ≥ 0）在鬼场 Fock 空间中线性无关
  （c_0|↓⟩ = |↑⟩ 与 c_{−n}|↓⟩（n ≥ 1）分别落在不同的鬼场 level），
  故整个和为零 ⟺ 每个系数态 (L^m_n − δ_{n,0})|ψ⟩ 为零，
  即 L^m_n|ψ⟩ = 0 (n > 0) 且 (L^m_0 − 1)|ψ⟩ = 0，正是 a = 1 的 OCQ 物理态条件。

  （目标陈述原有的第 (3) 条"a = −a^g，λ = 2 给 a = 1"已于 2026-09-11 移入该陈述的 notes：
  它是对 (1)(2) 的解读而非独立断言，a^g = −1 已写死在 worldsheet.brst-quantization 里。
  本推导因此**不再**依赖 worldsheet.bc-ghost-normal-ordering-constant。）
