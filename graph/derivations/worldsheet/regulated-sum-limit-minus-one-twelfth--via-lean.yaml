  - |
    **只给出极限，不给出收敛速度**：Lean 未把这条极限升级成 `Asymptotics.IsBigO`
    形式的 O(u²) 陈述；这正是本卡与母卡 worldsheet.regulated-sum-laurent-expansion 的
    区别所在，也是为什么本卡要单独存在（见母卡笔记）。
