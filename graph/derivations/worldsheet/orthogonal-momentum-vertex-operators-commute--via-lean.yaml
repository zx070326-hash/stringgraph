    loc: "formal/StringFormal/NoGhost/VertexCommute.lean :: StringFormal.NoGhost.Fock.vertexOsc_comm_of_dotVec_zero（目标断言）与 StringFormal.NoGhost.Fock.lie_vertexOsc_vertexOsc_of_dotVec_zero（括号形式）；链条 StringFormal.NoGhost.Fock.{vertexSub_creaExp_of_dotVec_zero, vertexAnn_creaExp_mul_of_dotVec_zero, vertexAnn_creaExp_of_dotVec_zero, vertexOsc_apply_creaExp_of_dotVec_zero, vertexOsc_creaExp_mul_of_dotVec_zero, eq_zero_of_vertex_recursion₂}；上游零件 StringFormal.NoGhost.Fock.{creaExp, creaExp_euler, vertexSub, vertexAnn, vertexOsc, vertexOsc_X_mul, vertexOsc_apply_one, eq_zero_of_vertex_recursion, dotVec_comm}"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry；17 条声明，formalizer 自述 2026-09-11 用
