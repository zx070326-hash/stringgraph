     自由性的输入。⇒ 本推导已补一条**非 inferred** 的边指 worldsheet.kac-determinant-v2。
     ⚠ **连带后果（对下游）**：`fgz-1986, Theorem 2.7` 的 rigorous 判定也必须把 Kac 行列式算作
