     ⚠ 证明梗概里的 [2.4] 给了 T 的显式构造（重数 **p_{(D−2)}(k)**，注意与 V(E',p') 的
     **p_{(D−1)}(k)** 下标不同），本推导不用它。
  - |
    **号差 (D−1,1) 与 D ≥ 2 这两条前提在本图没有独立卡承载**：本推导把它们写在目标卡的 (H1) 里
     并靠 conv.metric-mostly-plus + worldsheet.fock-indefinite-form（inferred 边）记账。
     **〔2026-09-12 已核，auditor 页图裁决，rulings §2.2〕** 本条原写「梗概里 'This implies
     isomorphisms for **D > 2**' 与语句的 D ≥ 2 **两处不一致，本图未核实哪个是笔误**，建议
     auditor 复核」——**已复核：两处读数均清晰，不是排印错误，两处各指其物**：
       · **`D > 2` 是梗概里那两条显式同构式的前提**，不是命题的前提：`V(E',p')` 的 Verma 分解
         用的是「M(h,c) 对 h > 0, c > 1 不可约」，而 E' 号差 (D−1,0) 给 c = D − 1，
         故 `c > 1 ⟺ D > 2`；D = 2 时 c = 1，M(h,1) 在 h = n²/4 处可约，梗概引的那句 Kac
         事实不覆盖它（**auditor 推理，非原文**）。
       · **`D ≥ 2`（语句）对 D = 2 也成立，路线由梗概末尾的括注给出**：'(in fact for any
         r ≥ 2 **or s ≥ 1**)'——号差 (1,1) 有 s = 1 ≥ 1；因子 `V(E'',p'') ≅ M(p''·p''/2, 1)`
         只用「h < 0, c = 1 不可约」，对任何 D ≥ 2 都成立。
     ⇒ **本疑点关闭；目标卡 (H1) 的 D ≥ 2 不改。**
     ⚠ **但 gaps 第一条 (a) 不随之关闭**：由「一个张量因子是自由 U(ℒ⁻)-模」推出「张量积在对角
     作用下自由」是标准的 Hopf 代数张量恒等式（H ⊗ M ≅ H ⊗ M_triv），**FGZ 没印这一步**，
     本轮只指出它**不依赖 D > 2**，**没有**替 FGZ 补证。
