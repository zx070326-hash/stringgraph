id: worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986
target: worldsheet.fock-module-free-over-negative-virasoro
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.virasoro-algebra-v2
    note: |
      供给 ℒ = Virasoro 代数这个对象，以及 ℒ⁻ = span{L_n : n < 0} 这个子代数（本卡断言里
      "自由模"所对的那个环 U(ℒ⁻)）。
      ⚠ **归一化相容性**：本图 conv.virasoro-standard 用 (c/12)(m³ − m)；FGZ p.8445 左栏逐字
      "[π(L_m), π(L_n)] = (m − n)π(L_{m+n}) + (D/12)(m³ − m)δ_{m+n}·Id. Thus π(c) = D·Id"
      ——**同一归一化**，故本边**不需要 convention_map**（与
      worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 的同名边一致）。
      ⚠ 本卡断言不涉及中心荷的取值，归一化只影响 (H2) 里 π(c) = D 这句话的读法。
  - id: worldsheet.bosonic-fock-space
    note: |
      供给 (H2) 的模空间本身：由 α^μ_{−n}（n ≥ 1）作用在真空上生成的 Fock 空间与其 level 分级。
      FGZ 一侧是 p.8445 左栏逐字 "The graded ℒ-module V(E, p) will be called a **Fock module**"，
      其分次 deg α^{μ₁}_{m₁} … |p⟩ = (Σ m_i) − p·p/2 与本图的 level 分级差一个 −p·p/2 的平移
      （**平移不影响自由性**，只影响特征标的整体因子 q^{p·p/2}）。
  - id: worldsheet.fock-space-virasoro-representation
    note: |
      供给"Fock 空间上确有 ℒ 的作用、且中心元作用为 D·id"这一条，即本卡 (H2) 里
      "V(E,p) 是 ℒ-模" 的图内对应物（该卡逐字断言 ρ : Vir_R → End_R(F)、ρ(C) = D·id_F 保李括号）。
      ⚠ 该卡在**任意交换 ℚ-代数** R 上陈述并已形式化，FGZ 在 C 上工作；本边只取"作用存在且中心荷
      = D"这一层，不主张两者的基环相同。
  - id: worldsheet.kac-determinant-v2
    note: |
      ★★【2026-09-11 新增，researcher 第三/四轮页图】供给 **Proposition 2.6 证明梗概的核心输入**：
      **Kac 行列式公式**。FGZ p.8445 右栏（Prop 2.6 之后）逐字：
      'Then by **Kac's determinant formula (10, 11)** we know that the Verma modules M(h, c) are
      irreducible and unitary for h > 0, c > 1 and are irreducible and nonunitary for h < 0, c = 1.'
      由此得两条同构 V(E', p') ≅ ⊔_{k≥0} p_{(D−1)}(k) M(p'·p'/2 + k, D − 1)、
      V(E'', p'') ≅ M(p''·p''/2, 1)，然后逐字
      '**We conclude from the above that V(E, p), p ≠ 0, is a free ℒ⁻-module** (in fact for any
      r ≥ 2 or s ≥ 1).'
      **本边非 inferred**：Kac 行列式是 FGZ **原文明写**的输入（带 refs 编号），
      且本图这张卡的 sources 里恰有 FGZ 所引的两条——**feigin-fuchs-1982** 与 **kac-1980-icm**，
      即 FGZ 的 **ref 11** 与 **ref 10**（FGZ p.8446 参考表逐字，brst-cohomology-sources.md §10.1）。
      ⇒ 图上这条边所指的卡与 FGZ 所引的文献**是同一批**，不是本图另找的替代来源。
      ⚠⚠ **编号陷阱（§10.1 专门警告）**：**FGZ 的 refs 10/11 ≠ LZ 的 [9]/[10]**。
      FGZ ref 10 = Kac 的 ICM Helsinki 1978（本 bib `kac-1980-icm`）、ref 11 = Feigin–Fuks 1982；
      而 LZ 的 [9] = Kac LNP 94 (1979)、[10] = Kac–Wakimoto。**FGZ 全表 14 条里没有 Kac–Wakimoto、
      没有 LNP 94、没有 Meurman–Rocha-Caridi。** 转述前必须分清是谁的编号。
      ⚠ **本边只承载玻色 Virasoro 的 Kac 行列式**；超弦侧（LZ）用的是 **超** Virasoro 版
      （Meurman–Rocha-Caridi），本图**没有**那张卡，见
      worldsheet.rns-fock-module-free-over-negative-super-virasoro--via-lian-zuckerman-1989 的 gaps。
      ⚠ **本推导不断言 FGZ 用的 Kac 公式与本卡陈述的公式逐字同一**：FGZ 只用它的**定性推论**
      （某些 (h, c) 上 Verma 模不可约），不用行列式的显式形式；本卡 (v2) 断言的是完整的
      det M_N 公式。⇒ 本边是"取该公式的一条推论"，不是"整卡搬运"。
  - id: worldsheet.fock-indefinite-form
    inferred: true
    note: |
      供给 (H1) 的号差侧背景：E 带号差 (D−1,1)（本图 conv.metric-mostly-plus），
      以及 η^{00} = −1 使 Fock 双线性型不定这一事实。
      **标 inferred，两条理由**（与 worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986
      的同名边同口径）：
      (1) FGZ 只写 V(E,p) 是**厄米** ℒ-模（p.8445 逐字 "π(L_m)* = π(L_{−m})"），**没有**把该形式
          与本图这张卡由 ⟨0|0⟩ = 1 与 (α^μ_n)† = α^μ_{−n} 唯一确定的那个形式的同一性写成陈述；
      (2) 本卡的断言（ℒ⁻-自由性）**根本不用**任何形式——FGZ 的厄米性是喂给 **Theorem 1.12** 的
          另一半假设，落在下游的 worldsheet.bosonic-relative-cohomology-vanishing 上，不在本卡。
      ⇒ 本边只承担"号差 (D−1,1) 的 Fock 空间是同一个对象"的记账。
      有效状态不受影响：该卡自身是 formalized。
sources:
  - ref: fgz-1986
    loc: "**Proposition 2.6(i)**, p.8445，逐字：'PROPOSITION 2.6. Let E have signature (D − 1, 1), D ≥ 2 and p ≠ 0. Then (i) V(E, p) is a free ℒ^--module …'"
    note: |
      L1 页图逐字（literature/extractions/brst-cohomology-sources.md §9.2 第 5 行、§9.9.5 复核无误）。
      **本推导的全部内容就是这一条编号命题**：三个量词（号差 (D−1,1)、D ≥ 2、p ≠ 0）都写在语句里，
      不需要从正文里另行集齐——这与同文的 Theorem 2.7（量词散布在正文四处）形成对照。
  - ref: fgz-1986
    loc: "**Proposition 2.4**, p.8445 左栏，逐字：'… when V is a Hermitian ℒ⁻-free ℒ-module in 𝒪₀.'；其紧邻上文逐字 'Let us consider a general ℒ⁻-free, Hermitian ℒ-module V. Then by Theorem 1.12 all nonzero degree cohomology groups vanish.'"
    note: |
      L1（§9.9.1 / §9.9.3）。**本条不支撑本推导的断言**，只定位本卡在 FGZ 论证里的角色：
      ℒ⁻-自由性是 FGZ 一般命题的**假设**，Prop 2.6(i) 是"Fock 模满足这个假设"的验证。
      ⚠ §9.9.2 逐字：「『i ≠ 0 消灭』这条结论并不需要 p ≠ 0——p ≠ 0 只在验证 V(E,p) 确为
      ℒ⁻-free（Prop 2.6(i)）时才被用到」。⇒ **p ≠ 0 的正确记账位置是本卡，不是消灭定理那张卡。**
  - ref: fgz-1986
    loc: "**Proposition 2.6 之后的证明梗概**, p.8445 右栏，逐字：'The subspace T is called the **transversal space** and can be constructed explicitly using the spectrum-generating algebra (9). Here we will indicate another proof of the proposition based on a more detailed study of the structure of V(E, p). We note first that if E = E' ⊕ E'' is an orthogonal decomposition of E into two nondegenerate subspaces and p = p' + p'' is the corresponding decomposition of p, then we have a canonical isomorphism of the Hermitian ℒ-modules. V(E, p) ≅ V(E', p') ⊗ V(E'', p''). We choose the decomposition such that E' and E'' have signatures (D − 1, 0) and (0, 1), respectively, and p' ≠ 0, p'' ≠ 0. **Then by Kac's determinant formula (10, 11) we know that the Verma modules M(h, c) are irreducible and unitary for h > 0, c > 1 and are irreducible and nonunitary for h < 0, c = 1.** This implies isomorphisms for D > 2  V(E', p') ≅ ⊔_{k≥0} p_{(D−1)}(k) M(p'·p'/2 + k, D − 1),  V(E'', p'') ≅ M(p''·p''/2, 1).  **We conclude from the above that V(E, p), p ≠ 0, is a free ℒ⁻-module (in fact for any r ≥ 2 or s ≥ 1).** We choose T to be  T = ⊕_{k≥0} p_{(D−2)}(k) M(p'·p'/2 + k, D − 1)^{ℒ⁺} ⊗ M(p''·p''/2, 1)^{ℒ⁺}.  [2.4]'；**refs 10, 11**（p.8446 参考表逐字）：'10. Kac, V. (1978) Proceedings of the International Congress of Mathematicians (ASF, Helsinki, Finland), Vol. 1, pp. 299–304.'、'11. Feigin, B. & Fuks, D. (1982) Funkt. Anal. Prilozheniya 16, 47–63 (English translation: Functional Analysis and Its Application 16, 114–126).'"
    note: |
      ★★★【2026-09-11 新增，researcher 第三轮 §9.10.3 + 第四轮 §10.1/§10.2，L1 页图】
      **本条推翻本推导原先的两条 gap**（"Prop 2.6 不带印出的证明"、"自由性的证明思路本图完全
      没有记录"）：**FGZ 确实给出了证明梗概**，且梗概的**核心输入是 Kac 行列式**。
      四条读数：
      (1) **Prop 2.6(i)（自由性）与 (ii)（横向空间 T）共用同一段证明**，Kac 行列式同时喂给两者。
          ⇒ 抽取记录 §9.7 末行"若图里 Kac 行列式那条链未建，需在 note 里写明"的适用范围要**扩大**：
          它不只影响 2.6(ii)，而是**影响 Theorem 2.7 本身**（2.7 明写依赖 2.6 的第一部分）。
      (2) **refs 10/11 = Kac ICM Helsinki 1978 + Feigin–Fuks 1982**（第四轮页图逐字），
          **不是** Kac LNP 94 / Kac–Wakimoto（那是 LZ 的 [9]/[10]）。本图 worldsheet.kac-determinant-v2
          的 sources 恰含这两条，故本推导的 Kac 边**非 inferred**。
      (3) **FGZ 自陈自由性比洛伦兹号差更一般**：括注逐字 "(in fact for any **r ≥ 2 or s ≥ 1**)"
          （r = 正号数、s = 负号数）。⇒ 目标卡 (H1) 写死号差 (D−1,1) 是照 Prop 2.6 的**语句**，
          而正文这句给了更宽的成立范围，**是原文自陈、非推断**。见 gaps。
      (4) **[2.4] 是 T 的显式构造式**，重数是 **p_{(D−2)}(k)**，而 V(E',p') 的重数是 **p_{(D−1)}(k)**
          ——**两个下标不同，别抄混**（§9.10.3 读数 4）。本推导不用 [2.4]。
      ⚠ **〔2026-09-12 已裁定，auditor 页图，rulings §2.3〕原刊漏负号**：Prop 2.6(ii) 的特征标
      **印作** ch_q T = q^{p·p/2} φ(q)^{D−2}（8× 放大后 `D` 前确无负号；同页
      ch_q V(E,p) = q^{p·p/2} φ(q)^{**−D**} 的负号清晰可见，排除扫描丢字），
      **正确的是 ch_q T = q^{p·p/2} φ(q)^{−(D−2)}**。三条彼此独立的内证：
        (1) φ(q)^{D−2}（D ≥ 3）的展开有负系数，不可能是分次向量空间的特征标；
        (2) 由梗概里的 [2.4] 直接算：不可约 Verma 模的 ℒ⁺-不变子空间是一维的最高权向量，
            故 ch_q T = Σ_k p_{(D−2)}(k) q^{p·p/2+k} = q^{p·p/2} φ(q)^{−(D−2)}；
        (3) Thm 2.7(ii) 的 dim H⁰ = p_{(24)}(1 − p·p/2) 是 φ^{−24} 的系数，
            与 Euler 特征标 q^{−1}φ²·q^{p·p/2}φ^{−D} = q^{p·p/2−1}φ^{−(D−2)} 一致。
      **引用纪律**：`sources.loc` 里的逐字引文**保留原刊的 `φ(q)^{D−2}`**（本文件上一条 source
      的 loc 即如此），凡写进 `statement` 的一律用 `φ(q)^{−(D−2)}`。
      本推导仍**不把该特征标写进任何断言**（(ii) 不是本推导的目标）。
      本条原写「转录疑点（§9.10.5，引用前须复核）…很可能丢了一个负号」，已由本裁定取代。
      ⚠ **negative evidence（§10.4）**：FGZ p.8446 全页不出现 "Kac determinant" 字样，
      该引用点只在 p.8445 的 Prop 2.6 证明里。
  - ref: fgz-1986
    loc: "§1.1–§1.3（半无限上同调的一般框架：Prop 1.1/1.2、Thm 1.6 Poincaré 对偶、Thm 1.8/1.9 Kähler 恒等式、Prop 1.10/1.11 谱序列滤过、**Thm 1.12** 消灭定理）；§2.2（Fock 模的定义、分次与特征标，p.8445 左栏）"
    note: |
      L1（§1.1 的章节结构、§1.4 的编号表）。列出只为说明 Prop 2.6 所在的上下文与记号来源；
      **本推导不经过 §1 的任何定理**（那些是下游消灭定理用的）。
summary: |
  本推导没有独立的论证步骤：目标卡的断言**逐字就是** fgz-1986 Proposition 2.6 的第一部分，
  三个量词（号差 (D−1,1)、D ≥ 2、p ≠ 0）也逐字写在该命题的语句里。本推导做的事只有三件：
  (1) 把 FGZ 的 V(E,p) 与本图的 Fock 空间/Virasoro 作用对上（见前三条 depends_on 的 note：
      生成元同为 α^μ_{−n}、作用同为 Sugawara L_m、中心荷同为 D，归一化同为 (c/12)(m³−m)，
      分次差一个与自由性无关的常数平移 −p·p/2）；
  (2) 把 FGZ 的 ℒ⁻ 与本图 worldsheet.virasoro-algebra-v2 的负模子代数对上；
  (3) **〔2026-09-11 新增〕** 把 FGZ 证明梗概里明写引用的 **Kac 行列式**（refs 10/11 =
      Kac ICM 1978 + Feigin–Fuks 1982）与本图 worldsheet.kac-determinant-v2 对上——
      那张卡的 sources 恰是同一批文献，故该边**非 inferred**。

  【为什么标 rigorous】三条：
  (1) 结论是**带编号的命题**（Proposition 2.6(i)），陈述已逐字核实（L1 页图），
      且量词**全部在语句内**，不存在"前提链散布在正文"的风险；
  (2) 断言全在有定义的模范畴里（泛包络代数上的自由模），不涉及路径积分、不涉及收敛性；
  (3) 期刊是 PNAS（Communicated by I. M. Singer），作者三人是数学家，这是数学文献。
  与 worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 和
  worldsheet.no-ghost-theorem-brst--via-fgz 的记账口径**逐条一致**。
  ⚠⚠ **限制（2026-09-11 订正）**：fgz-1986 是 PNAS 公告体裁（5 页、约 25 条编号陈述），
  但 **Proposition 2.6 确实带一段印出的证明梗概**（第三轮页图 §9.10.3，逐字见 sources 第三条）：
  正交分解 E = E' ⊕ E'' → V(E,p) ≅ V(E',p') ⊗ V(E'',p'') → **Kac 行列式**定出两个因子的
  不可约分解 → 结论自由性，并自陈 "(in fact for any r ≥ 2 or s ≥ 1)"。
  ⇒ 本推导旧版写的"Prop 2.6 不带印出的证明"**是错的**，已在 gaps 第一条订正；
  rigorous 仍按"已核实的编号命题 + 数学期刊 + 该文印出的证明梗概"给，**不是**按逐行复核给的
  （梗概里两步推理未印出，见 gaps）。
  ⚠ **由此本推导多一条上游边**：worldsheet.kac-determinant-v2（非 inferred，FGZ refs 10/11 =
  Kac ICM 1978 + Feigin–Fuks 1982，正是该卡的两条 sources）。
