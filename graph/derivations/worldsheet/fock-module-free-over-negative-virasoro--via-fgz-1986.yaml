     无 LNP 94、无 Meurman–Rocha-Caridi（§10.1/§10.2）。
  - |
    **FGZ 自陈的成立范围比目标卡 (H1) 宽，本图未跟进**：Prop 2.6 的**语句**写号差 (D−1,1) 与
