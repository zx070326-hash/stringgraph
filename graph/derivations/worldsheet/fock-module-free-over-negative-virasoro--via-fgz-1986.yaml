id: worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986
target: worldsheet.fock-module-free-over-negative-virasoro
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.virasoro-algebra-v2
    note: |
      供给 ℒ = Virasoro 代数这个对象，以及 ℒ⁻ = span{L_n : n < 0} 这个子代数（本卡断言里
      "自由模"所对的那个环 U(ℒ⁻)）。
      ⚠ **归一化相容性**：本图 conv.virasoro-standard 用 (c/12)(m³ − m)；FGZ p.8445 左栏逐字
      "[π(L_m), π(L_n)] = (m − n)π(L_{m+n}) + (D/12)(m³ − m)δ_{m+n}·Id. Thus π(c) = D·Id"
      ——**同一归一化**，故本边**不需要 convention_map**（与
      worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 的同名边一致）。
      ⚠ 本卡断言不涉及中心荷的取值，归一化只影响 (H2) 里 π(c) = D 这句话的读法。
  - id: worldsheet.bosonic-fock-space
    note: |
      供给 (H2) 的模空间本身：由 α^μ_{−n}（n ≥ 1）作用在真空上生成的 Fock 空间与其 level 分级。
      FGZ 一侧是 p.8445 左栏逐字 "The graded ℒ-module V(E, p) will be called a **Fock module**"，
      其分次 deg α^{μ₁}_{m₁} … |p⟩ = (Σ m_i) − p·p/2 与本图的 level 分级差一个 −p·p/2 的平移
      （**平移不影响自由性**，只影响特征标的整体因子 q^{p·p/2}）。
  - id: worldsheet.fock-space-virasoro-representation
    note: |
      供给"Fock 空间上确有 ℒ 的作用、且中心元作用为 D·id"这一条，即本卡 (H2) 里
      "V(E,p) 是 ℒ-模" 的图内对应物（该卡逐字断言 ρ : Vir_R → End_R(F)、ρ(C) = D·id_F 保李括号）。
      ⚠ 该卡在**任意交换 ℚ-代数** R 上陈述并已形式化，FGZ 在 C 上工作；本边只取"作用存在且中心荷
      = D"这一层，不主张两者的基环相同。
  - id: worldsheet.fock-indefinite-form
    inferred: true
    note: |
      供给 (H1) 的号差侧背景：E 带号差 (D−1,1)（本图 conv.metric-mostly-plus），
      以及 η^{00} = −1 使 Fock 双线性型不定这一事实。
      **标 inferred，两条理由**（与 worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986
      的同名边同口径）：
      (1) FGZ 只写 V(E,p) 是**厄米** ℒ-模（p.8445 逐字 "π(L_m)* = π(L_{−m})"），**没有**把该形式
          与本图这张卡由 ⟨0|0⟩ = 1 与 (α^μ_n)† = α^μ_{−n} 唯一确定的那个形式的同一性写成陈述；
      (2) 本卡的断言（ℒ⁻-自由性）**根本不用**任何形式——FGZ 的厄米性是喂给 **Theorem 1.12** 的
          另一半假设，落在下游的 worldsheet.bosonic-relative-cohomology-vanishing 上，不在本卡。
      ⇒ 本边只承担"号差 (D−1,1) 的 Fock 空间是同一个对象"的记账。
      有效状态不受影响：该卡自身是 formalized。
sources:
  - ref: fgz-1986
    loc: "**Proposition 2.6(i)**, p.8445，逐字：'PROPOSITION 2.6. Let E have signature (D − 1, 1), D ≥ 2 and p ≠ 0. Then (i) V(E, p) is a free ℒ^--module …'"
    note: |
      L1 页图逐字（literature/extractions/brst-cohomology-sources.md §9.2 第 5 行、§9.9.5 复核无误）。
      **本推导的全部内容就是这一条编号命题**：三个量词（号差 (D−1,1)、D ≥ 2、p ≠ 0）都写在语句里，
      不需要从正文里另行集齐——这与同文的 Theorem 2.7（量词散布在正文四处）形成对照。
  - ref: fgz-1986
    loc: "**Proposition 2.4**, p.8445 左栏，逐字：'… when V is a Hermitian ℒ⁻-free ℒ-module in 𝒪₀.'；其紧邻上文逐字 'Let us consider a general ℒ⁻-free, Hermitian ℒ-module V. Then by Theorem 1.12 all nonzero degree cohomology groups vanish.'"
    note: |
      L1（§9.9.1 / §9.9.3）。**本条不支撑本推导的断言**，只定位本卡在 FGZ 论证里的角色：
      ℒ⁻-自由性是 FGZ 一般命题的**假设**，Prop 2.6(i) 是"Fock 模满足这个假设"的验证。
      ⚠ §9.9.2 逐字：「『i ≠ 0 消灭』这条结论并不需要 p ≠ 0——p ≠ 0 只在验证 V(E,p) 确为
      ℒ⁻-free（Prop 2.6(i)）时才被用到」。⇒ **p ≠ 0 的正确记账位置是本卡，不是消灭定理那张卡。**
  - ref: fgz-1986
    loc: "§1.1–§1.3（半无限上同调的一般框架：Prop 1.1/1.2、Thm 1.6 Poincaré 对偶、Thm 1.8/1.9 Kähler 恒等式、Prop 1.10/1.11 谱序列滤过、**Thm 1.12** 消灭定理）；§2.2（Fock 模的定义、分次与特征标，p.8445 左栏）"
    note: |
      L1（§1.1 的章节结构、§1.4 的编号表）。列出只为说明 Prop 2.6 所在的上下文与记号来源；
      **本推导不经过 §1 的任何定理**（那些是下游消灭定理用的）。
summary: |
  本推导没有独立的论证步骤：目标卡的断言**逐字就是** fgz-1986 Proposition 2.6 的第一部分，
  三个量词（号差 (D−1,1)、D ≥ 2、p ≠ 0）也逐字写在该命题的语句里。本推导做的事只有两件：
  (1) 把 FGZ 的 V(E,p) 与本图的 Fock 空间/Virasoro 作用对上（见 depends_on 三条边的 note：
      生成元同为 α^μ_{−n}、作用同为 Sugawara L_m、中心荷同为 D，归一化同为 (c/12)(m³−m)，
      分次差一个与自由性无关的常数平移 −p·p/2）；
  (2) 把 FGZ 的 ℒ⁻ 与本图 worldsheet.virasoro-algebra-v2 的负模子代数对上。

  【为什么标 rigorous】三条：
  (1) 结论是**带编号的命题**（Proposition 2.6(i)），陈述已逐字核实（L1 页图），
      且量词**全部在语句内**，不存在"前提链散布在正文"的风险；
  (2) 断言全在有定义的模范畴里（泛包络代数上的自由模），不涉及路径积分、不涉及收敛性；
  (3) 期刊是 PNAS（Communicated by I. M. Singer），作者三人是数学家，这是数学文献。
  与 worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 和
  worldsheet.no-ghost-theorem-brst--via-fgz 的记账口径**逐条一致**。
  ⚠⚠ **限制（与那两条推导同型，但在本条上更直接）**：fgz-1986 是 PNAS 公告体裁（5 页、
  约 25 条编号陈述），**Proposition 2.6 不带印出的证明**；rigorous 是按"已核实的编号命题 +
  数学期刊"给的，不是按逐行复核给的。见 gaps 第一条。
gaps:
  - "**Proposition 2.6 在 fgz-1986 里没有印出的证明。** 该文是 PNAS 公告（5 页、约 25 条编号陈述），
     Prop 2.6 只给陈述。本推导的 rigorous 依据的是 (a) 逐字核实的命题陈述、(b) 它是数学期刊上
     署名的编号命题、(c) 下游 Theorem 2.7 明写以它为输入。**未做**的是：找到 FGZ 的后续长文并
     逐行复核该命题的证明（researcher 两轮均未定位到该长文，见 literature/extractions/
     brst-cohomology-sources.md §7 访问日志）。
     ⚠ 这是本卡与超弦版 worldsheet.rns-fock-module-free-over-negative-super-virasoro 的一处
     **实质差别**：那一侧的 LZ Corollary 2.19(iii) 有印出的证明链（经 Proposition 2.18）。
     关闭方式：定位 FGZ 的长文（或 Frenkel–Garland–Zuckerman 后续著作）并逐行复核。"
  - "**自由性的证明思路本图完全没有记录。** 既然 FGZ 不印证明，本图也就不知道它是怎么证的
     （标准做法是用 Kac 行列式或 Feigin–Fuchs 型论证说明 Fock 模上没有奇异向量障碍，但**这是补白，
     不是来源**）。⇒ 本卡短期内**不可形式化**，也不宜作为 Lean 岛的候选。"
  - "**FGZ 只说 free，不说秩。** 本卡断言 (b) 已声明不断言秩；但下游若要做特征标计数
     （如 Theorem 2.7(ii) 的 p_{(24)}(1 − p·p/2)），需要的是「自由 + 生成元空间的特征标」，
     那一步要 Prop 2.6(ii) 的 T 或 Euler 特征标 [2.3]，**不在本卡内**。"
  - "**号差 (D−1,1) 与 D ≥ 2 这两条前提在本图没有独立卡承载**：本推导把它们写在目标卡的 (H1) 里
     并靠 conv.metric-mostly-plus + worldsheet.fock-indefinite-form（inferred 边）记账。
     FGZ 没有说明 D ≥ 2 在证明里用在哪一步（D = 1 时 E 只有一个方向，Fock 模退化），
     **本图未核实**。"
notes: |
  【本推导在图上的作用】
  它把 worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 上那条指向
  **math.verma-module-free-over-negative-part** 的 `inferred` 边替换掉：那条边的 note 与 gaps
  都逐字写明"由 Verma 模自由性到 Fock 模自由性没有成文的一步，正解是单建一卡"，本卡即该正解。
  改指后那条边**不再是 inferred**（FGZ 在 Theorem 2.7 正上方逐字把 "the first part of
  Proposition 2.6" 列为输入）。
  ⚠ **FGZ 的 Remark 必须随边保留**："V(E,p) 一般**不是** Verma 模直和"——这既是旧边为什么必须
  标 inferred 的理由，也是本卡不能被 Verma 卡顶替的理由。

  【与超弦版的分工】
  FGZ 1986 Proposition 2.6(i)  ↔  LZ 1989 Corollary 2.19(iii)
  （worldsheet.rns-fock-module-free-over-negative-super-virasoro）。
  两篇**互不引用**（LZ p.335 Note added in proof 称收到 FOK 预印本、工作独立），
  论证工具也不同（LZ 经 Proposition 2.18，用**超** Virasoro 的 Kac 行列式 [22] = Meurman–Rocha
  与 M_κ(h', 9) 的幺正性；FGZ 未印出证明）。⇒ 两卡互不依赖，各挂各的推导，gaps 不可互相搬运。

  【不构成循环】
  本推导的依赖全在"Virasoro 代数 + Fock 空间 + 其上的表示"这一层，
  **不经过任何 BRST / 上同调 / 消灭定理节点**；下游的
  worldsheet.bosonic-relative-cohomology-vanishing 依赖本卡，方向单向。
