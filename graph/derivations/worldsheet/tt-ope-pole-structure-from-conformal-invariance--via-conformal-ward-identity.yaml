    worldsheet.schwarzian-transformation-of-t--via-ope（由 (2.4.25) 的极点结构反读变换律，是本推导的逆向）、
    worldsheet.rns-superconformal-ope--via-wick-contractions（用「二阶极点 = 2、一阶极点 = ∂T」核对 T_BT_B 的结构）。
