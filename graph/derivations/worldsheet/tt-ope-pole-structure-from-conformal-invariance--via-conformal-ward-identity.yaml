    note: 式号与页码经抽取记录 §12.4(e) 表（L1）核实；(2.4.12) 处原书逐字「the operators 𝒜^{(n)} are determined by the conformal transformation of 𝒜」。
summary: |
  设 T(z)T(0) 的奇异部分为 Σ_{n≥1} z^{−n} A_n(0)，A_n 是权 4 − n 的全纯局域算子。
  按 Ward 恒等式，T 生成的共形变换 δz = εv(z) 作用在 T(0) 上给
    ε^{−1} δT(0) ∝ Res_{z→0} v(z) T(z)T(0)
                 = v(0) A_1 + ∂v(0) A_2 + ½∂²v(0) A_3 + (1/6)∂³v(0) A_4 + (1/24)∂⁴v(0) A_5 + … ，
  其中把 v(z) 在 0 处 Taylor 展开、逐项取留数。v 是任意全纯函数，其各阶导数在一点的值
  彼此独立，故上式与前提 (2.4.24)
    ε^{−1} δT = −(c/12)∂³v − 2∂v T − v∂T
  逐项比对（整体符号与 i 因子按 worldsheet.ward-identity 的约定吸收）得：
    v   项：A_1 = ∂T            → (i) 一阶极点是 ∂T；
    ∂v  项：A_2 = 2T            → (i) 二阶极点系数 2 = h_T；
    ∂²v 项：(2.4.24) 中无此项  → A_3 = 0，即 (ii) 三阶极点缺席；
    ∂³v 项：(1/6)A_4 = c/12     → A_4 = c/2，且是 c-数，即 (iii)；
    ∂^{k}v，k ≥ 4：(2.4.24) 中无 → A_{k+1} = 0，即 (iv) 无高于四阶的极点。
  合起来即 T(z)T(0) ∼ c/(2z⁴) + (2/z²)T(0) + (1/z)∂T(0)，唯一自由参数是 c。

  **(ii) 的独立交叉核对（本图补白）**：即使不预设 (2.4.24) 里没有 ∂²v 项，
  玻色对称 T(z)T(w) = T(w)T(z) 也强制 A_3 = 0：把右端在 w 处重新展开，
    Σ_n (z−w)^{−n} A_n(w) = Σ_n (−1)^n (z−w)^{−n} [A_n(w) + (z−w)∂A_n(w) + …] ，
  比较 (z−w)^{−3} 阶得 A_3 = −A_3 + ∂A_4，即 2A_3 = ∂A_4；A_4 = c/2 为常数 ⇒ A_3 = 0。
  这就是 v1 卡「三阶极点因 T 的对称性而缺席」的含义：它是 (iii) + 玻色对称的推论，
  与「(2.4.24) 无 ∂²v 项」互相印证。
gaps:
  - "**前提 (2.4.24) 的一般性在来源中只是给出、未在此处论证**：原书 p.48 把它作为一般 CFT 中 T 的
     变换律写下（c 为常数的论证在脚注 5：∂_a c = 0 + 「与位置无关的算子必为 c-数」），
     但「反常项为何只有 ∂³v 一项、为何不含算子」的一般性论证抽取记录未转录。
     本推导据此把 (2.4.24) 记为目标卡的**前提**而非结论。标准的补全论证是权计数 + 幺正性 +
     真空唯一性（见目标卡 notes 末段），需要额外前提，本图未立卡。"
  - "**围道积分与 OPE 逐项交换、Ward 恒等式的围道形式**：合法性依赖 OPE 在环域内收敛
     （worldsheet.operator-product-expansion 所断言但未被证明的有限收敛半径），
     以及 worldsheet.ward-identity 本身是路径积分论证（其有效状态为 physical-argument）。
     这是本推导封顶在 physical-argument 的主因（lead 裁决 1，2026-09-10）。"
  - "**原书不展示 (2.4.24) → (2.4.25) 的代入步骤**：summary 的逐项比对是本图对原书一句话跳步的复述
     （docs/STATUS_LEVELS.md「断言 + 骨架」档位），未经 reviewer 独立复核；
     Ward 恒等式的整体符号与 i 因子按 worldsheet.ward-identity 的未定约定处理，本推导只用逐项对应的结构。"
  - "**「一般两算符 OPE 由共形对称性完全决定」的一般原理**在原书 §2.4 (2.4.20) 下方只断言、推迟到
     Vol.2 第 15 章；本推导不依赖该一般原理（只对 𝒜 = T 做了显式计算），故不挂边，但目标卡的
     title 措辞「由共形不变性完全确定」与该原理同源，读者须知一般版本本处无证明。"
notes: |
  由 curator-small-backlog-3 于 2026-09-11 建立，配合 worldsheet.tt-ope-central-charge（v1）
