  （合并 7e7c513）的 QuotientForm.lean 给出 `Fock.pairing_add_null`（加零态不改内积）与
  `Fock.quotientPairing` + `Fock.quotientPairing_mk`（商上诱导形式良定义），
  故本推导 status 由 rigorous 升回 formalized，原 gaps (i) 已标为关闭。

  【升回后仍需记在案的两条限定（curator）】
    · `Fock.pairing_add_null` 的假设里 **χ, χ' ∈ H_0 与「ψ+χ ∈ H_phys」都是必需的，不是装饰**：
      消掉 ⟨χ, χ'⟩ 这一交叉项用的是 `nullSubmodule_le_physSubmodule`（零态本身是物理态），
      QuotientForm.lean 文件头逐字写着「Without that inclusion the cross term ⟨χ, χ'⟩ would not
      obviously vanish」。图上这条包含是 H_0 = H_phys ⊓ H_phys^⊥ 定义的直接推论
      （由 worldsheet.old-covariant-physical-states 提供），不是独立命题，故本次未加新边。
    · **商形式的非退化性未证**。Lean 侧只有显然的那一半
      `Fock.quotientPairing_mk_eq_zero_of_mem_nullSubmodule`（代表元属 H_0 ⟹ 该类整行为零）；
      反方向「∀ q', ⟨q,q'⟩ = 0 ⟹ q = 0」按 `nullSubmodule` 的定义应当成立，但
      QuotientForm.lean 文件头 Gaps 第 1 条明确记为**未形式化**（"routine but not done"），
      正定性（无鬼定理本体）更没有。目标陈述 (2) 只要求商上的形式**良定义**、不要求非退化，
      故这不影响本推导对陈述的覆盖；但下游若要用「H_phys/H_0 上的型非退化」，
      本图与 Lean 侧都还没有依据。
      另：陈述 (2) 末句写的是「厄米形式」，Lean 侧只有 R-双线性型，见 gaps (iii)。
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
  （lake build 通过、目标声明无 sorry、公理仅 propext / Classical.choice / Quot.sound）。
  自动化公理检查脚本（formal/TODO.md 的 scripts/check_axioms.lean）仍未做。

