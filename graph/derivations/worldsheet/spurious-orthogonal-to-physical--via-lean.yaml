    ⟨ψ + χ | ψ' + χ'⟩ = ⟨ψ | ψ'⟩（χ, χ' ∈ N）以及『Fock 内积在 H_phys/N 上诱导良定义的形式』
    未被打包成声明……本推导不能声称它已被机器检查」。
    formalizer 在提交 d1ec0fa（合并 7e7c513）新建 formal/StringFormal/NoGhost/QuotientForm.lean，
    把这两句都打包成了具名声明：`Fock.pairing_add_null`、
    `Fock.pairing_eq_of_sub_mem_nullSubmodule`、`Fock.quotientPairing` 与计算规则
    `Fock.quotientPairing_mk`（另有 `Fock.quotientPairing_mk_eq_zero_of_mem_nullSubmodule`
    与 `Fock.quotientPairing_comm`）。逐条对照见新增的第二条 sources 与 summary 末段。
    残留两点**不属于本条缺口**：陈述 (2) 末句的「厄米形式」在 Lean 侧仍只是 R-双线性型
    （见下面 gaps (iii)）；商形式的**非退化性** Lean 未证，而陈述 (2) 只要求「良定义」、
    不要求非退化（记账见 notes 末段）。
  - |
    (ii) **Lean 的 spuriousSubmodule 不带质量壳条件**（见上）。方向对本推导有利
    （证的更强），但意味着带质量壳的定义卡 worldsheet.ocq-spurious-states-v2
    （及其前身 worldsheet.ocq-spurious-states）与 Lean 的对象不重合，该卡因此没有填
    `formal.lean_decl`。**2026-09-11 拆卡后**：与 Lean 逐字重合的那一半已单列为
    worldsheet.spurious-subspace（definition，formalized）与
    worldsheet.spurious-subspace-orthogonal-to-physical（proposition，formalized）；
    本推导改为经后者取用 Lean 结论，再限制到质量壳。目标陈述本身仍带质量壳，故本条缺口
    对**本**推导仍在（限制那一步不在 Lean 里），只是不再阻塞下游：
    需要无壳版本的下游（worldsheet.physical-states-level-one--via-lean）现直接引新卡。
    **2026-09-11 下午补记：本条已失效。** SpuriousShell.lean 既给了带质量壳的子模
    `Fock.spuriousShell`，也给了「限制」这一步的具名引理：
    `Fock.spuriousShell_le_spuriousSubmodule`（S(k) ⊆ S）与
    `Fock.spuriousShell_le_orthComplement`（S(k) ⊥ H_phys，即目标陈述 (1)），
    以及 `Fock.nullStates_le_nullSubmodule`（目标陈述 (2) 前半）。
    本推导的 depends_on 与 summary 本次**未重接**（仍走无壳卡再限制），因为那条路径与 summary
    逐字一致；若 reviewer 希望直接调用 `spuriousShell_le_orthComplement`，正确做法是新建一条
    `--via-lean-onshell` 推导，而不是改本条的 summary。
  - |
    (iii) **双线性型而非 Hermitian 形式**（继承 worldsheet.virasoro-generators-adjoint--via-lean
    的 gaps (i)、worldsheet.fock-indefinite-form--via-lean 的 gaps (iv)）。
    "零范数"是 R-双线性型意义下的 ⟨χ,χ⟩ = 0；复 Fock 空间上的 Hermitian 版本未形式化。
  - |
    (iv) **不给反包含 H_0 ⊆ N**。PhysicalStates.lean 文件头 "Mathematical gaps" 第 2 条明确
    记为未证；那是无鬼定理难的那一半。目标陈述本身也不断言它。
  - |
    (v) **逐动量扇区、代数版、对角 η、R 为交换 ℚ-代数**：继承
    worldsheet.bosonic-fock-space 的缺口 (i)(ii)(iii)。没有位置算符 x^μ，没有对 k 的直积分，
    故"固定动量扇区 F(k)"在 Lean 侧是全局参数而非分解指标。
notes: |
