id: worldsheet.spurious-orthogonal-to-physical--via-lean
target: worldsheet.spurious-orthogonal-to-physical
kind: proof
status: formalized
depends_on:
  - id: worldsheet.ocq-spurious-states
    inferred: false
    note: |
      提供伪态空间 S 本身。Lean 对应物是
      `Fock.spuriousSubmodule η a := ⨆ n : ℤ, ⨆ _ : 0 < n, LinearMap.range (Lop η a (-n))`。
      **与该定义卡不完全一致**：Lean 的子模不含质量壳条件 (L_0 − a)|χ⟩ = 0，
      故严格更大（S = spuriousSubmodule ⊓ ker(L_0 − a)）。因为本推导要证的是"伪态 ⊥ 物理态"，
      在更大的空间上成立蕴含在 S 上成立，所以这个差异使 Lean 侧**更强**，不构成缺口——
      但它使该定义卡本身不能填 `formal.lean_decl`，详见那里的 notes。
  - id: worldsheet.old-covariant-physical-states
    inferred: false
    note: |
      提供 H_phys 与其根基 H_0：Lean 里 `Fock.physSubmodule η a a₀` 与
      `Fock.nullSubmodule η a a₀ = physSubmodule ⊓ orthComplement η physSubmodule`，
      即该定义卡的 formal.lean_decl 所指的对象。字面依赖（同文件定义）。
  - id: worldsheet.virasoro-generators-adjoint
    inferred: false
    note: |
      提供本推导的**唯一实质输入** L_{−n}^† = L_n（`Fock.pairing_Lop_left`：
      ⟨L_m ψ, φ⟩ = ⟨ψ, L_{−m} φ⟩）。`spuriousSubmodule_le_orthComplement` 的证明就是
      它加上物理态条件 L_n φ = 0 (n ≥ 1) 的一行组合。字面依赖（同文件，逐条调用）。
  - id: worldsheet.fock-indefinite-form
    inferred: false
    note: |
      提供双线性型 `Fock.pairing` 本身（正交补 `orthComplement`、H_0 的定义、
      以及"零态零范数"`Fock.pairing_self_eq_zero_of_mem_nullSubmodule` 都以它为底）。
      本推导只用该节点陈述 (1)（型的存在唯一与伴随关系），不用 (2)(3)(4)。
