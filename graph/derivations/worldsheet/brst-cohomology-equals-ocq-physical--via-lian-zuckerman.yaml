sources:
  - ref: lian-zuckerman-1991
    loc: "Theorem 3.5(i), p.570（逐字：'There is a canonical isometry V(D,p)^{G₊}[−h]/rad ≅ H⁰_∞(G, G₀; V(D,p) ⊗ L(26−D, 1−h))'）"
    note: |
      本推导的主来源。L1（全文 34 页逐页读毕，Theorem 3.5 所在页单页重读复核，
      literature/extractions/primary-sources-round2.md §1.5、§1.6）。
      本节点只用 **D = 26、h = 1** 的特例：此时补充模是 L(26−26, 1−1) = L(0, 0)，
      即平凡一维模，(i) 退化为 V(26,p)^{𝒢₊}[−1]/rad ≅ H⁰_∞(𝒢, 𝒢₀; V(26,p))，
      与 fgz-1986 Theorem 2.8 的第一个同构是同一条陈述。
      LZ 写的是 **isometry（等距）**，与 FGZ 的 "unitary isomorphism" 同义，
      直接给出目标陈述要求的"保厄米形式"。
      Theorem 3.5(i) 的证明逐字只有一句「(i) is simply a direct application of Theorem 2.25」，
      故实质来源是 Theorem 2.25 + Lemma 2.22（primary-sources-round2.md §11.2；见 sources 第二条）。
      **不要照抄 LZ 紧随 Theorem 3.5(ii) 的括注「The number h is called the "Regge slope"
      in the physics literature」**——那是术语错误，h 是截距不是斜率（judgment 见
      worldsheet.no-ghost-theorem-subcritical 的 notes 第 1 条）。
  - ref: lian-zuckerman-1991
    loc: "Theorem 2.13（约化公式 H*_∞(𝒢,𝒢₀; W ⊗ M(−β̄−λ)) ≅ H*(𝒢₊, W)[λ]）, p.562；Proposition 2.12（有限滤过）；Corollary 2.17, p.563（H⁰(𝒢₊, W) ≅ W^{𝒢₊}）；Lemma 2.18, p.564（H⁰(A/B) ≅ H⁰(A)/i*H⁰(B)，i* 由包含 i: B ↪ A 诱导；B ⊆ rad A 时是等距）；Corollary 2.20, p.564（其半无限版本）；Lemma 2.21（cf. [FGZ, Theorem 1.12]）；Lemma 2.22, p.565（证明中 Eq. (2) 逐字给出典范等距 ω ↦ [ω ⊗ 1] ↦ [ω ⊗ v_{−β̄−λ} ⊗ 1 ⊗ 1]）；Lemma 2.23（Poincaré 对偶）；Theorem 2.25, p.566（证明末句「Now by Lemma 2.22, Eqs. (1), (2) give the desired result」）；Corollary 2.26（Vanishing Theorem）, p.567（证明逐字「L(0) = C.」）"
    note: |
      本推导论证链的一般理论输入，编号均已核实（L1）。Theorem 2.25 是把 Theorem 2.13 里的
      Verma 模 M(·) 换成不可约商 L(·) 之后的版本，结论逐字含「等距」与「H^n_∞ = 0 (n ≠ 0)」。
      **三条转录疑点必须随引用一起传递**（primary-sources-round2.md §1.5、§10.6、§11.4）：
      (a) Theorem 2.25 的假设行在扫描件里渲染为「W ∈ 𝒪 be hermitian, 𝒢-free」，按 Lemma 2.21/2.22
          的平行渲染（同一组假设下两处均带下标 **𝒢₋-free**，且 Theorem 2.25 证明首句就是
          「First apply Lemma 2.21」）判定应为 **𝒢₋-free**，**高度确信**；该行本身在扫描里仍看不出
          下标，仍欢迎持可选中文本者复核；
      (b) Corollary 2.26 第二行渲染为「= 0 for n = 0」，按上下文应为 **n ≠ 0**；同一份扫描里
          Lemma 2.22 的对应两行渲染正常（「= 0 for n ≠ 0」/「≅ … for n = 0」），故这**更可能是
          原刊排印错误而非 OCR 缺陷**，引用 Corollary 2.26 时须带此注；
      (c) Corollary 2.28 的公式指数与 [·]_{q⁰} 括号归属在扫描下不清晰（本推导不引用该公式本体）。
      另一处小的交叉引用存疑：Corollary 2.20 的证明渲染为引「Remark 2.13(iii)」，按内容应指
      Remark 2.19(iii)（U ⊆ rad V ⇒ C_∞(𝒢,𝒢₀;U) ⊆ rad C_∞(𝒢,𝒢₀;V)）；未单页复核（§11.4 末）。
      编号陷阱：LZ 自己的 Introduction (p.549) 把 Vanishing Theorem 误写成 "Corollary 2.19"
      （p.564 处实为 Remark 2.19），**不要引用 "LZ 1991 Corollary 2.19"**。
  - ref: lian-zuckerman-1991
    loc: "Proposition 3.1, p.569（(i) π(L_m)、π(z) = D·Id；(ii) hermitian、⟨v_p,v_p⟩ = 1、α^{μ†}_n = α^μ_{−n}；(iv) dim V(D,p)[λ] < ∞；(v) V(D,p) 是 𝒢₋-free）；(3.1)–(3.3) 的 Fock 模定义与对 p 的四条假设；Proposition 3.3(iii), p.570（'(∧_∞𝒢, η) is a 𝒢-module if β̄ = −26z′ − L′₀'）；Remark 3.2(ii)（M(c,h)/L(c,h) 记号）"
    note: |
      L1。Proposition 3.1 验证 Theorem 2.25 的全部假设，LZ 自己把这些性质归给 "[GSW, FGZ]"，
      不作为本文新结果。Proposition 3.3(iii) 的 **"if"（不是 "iff"）** 经单页重读复核，是 26
      在本文出现的唯一位置且属鬼系统一侧——故本推导与 --via-fgz 一样，把 c = 26 当作构造相对
      复形的**假设**，不推导它；本推导因此**不**依赖 worldsheet.critical-dimension-brst。
      对 p 的四条假设（⟨p,1⟩ = 1；⟨p,x⟩ ≠ 0 对某 x ∉ C1；⟨p,α^μ_0⟩ ∈ R；D ≥ 2）在本节点的
      D = 26 特例下与目标陈述的 k ≠ 0 的关系见 gaps。
  - ref: fgz-1986
    loc: "Theorem 2.8 第一个同构（P/rad P ≅ H^0_∞(ℒ, ℒ_0, V(R^{25,1}, p))，p ≠ 0）；Theorem 1.12（消灭定理）"
    note: |
      **不是本推导的论证来源，只作同源关系登记**：LZ 的 Lemma 2.21 自注「(cf. [FGZ, Theorem 1.12])」，
      即两条路线的消灭定理同源；但 LZ 的整体论证走的是他自己的约化公式（Theorem 2.13）路线，
      不是 FGZ 证明梗概的展开。FGZ 那条独立推导见
      worldsheet.brst-cohomology-equals-ocq-physical--via-fgz。
summary: |
  这是目标陈述的**第二条独立推导**，与 worldsheet.brst-cohomology-equals-ocq-physical--via-fgz
  论证同源但不是同一份证明：FGZ 1986 是 PNAS 公告体裁（5 页，只给证明梗概），
  LZ 1991 是 Commun. Math. Phys. 长文（34 页，逐条编号的完整证明），且 LZ 走的是**他自己的
  约化公式路线**（Theorem 2.13），只在消灭定理一步与 FGZ 同源（Lemma 2.21 自注 cf. FGZ Thm 1.12）。

  论证链（全部在 Virasoro 代数 𝒢 相对于 𝒢₀ = CL₀ + Cz 的半无限上同调框架内，范畴 𝒪 与
  全局假设 A1–A5 下；编号均已核实）：

  (1) Proposition 2.12 给出相对复形的有限滤过；**Theorem 2.13（约化公式）**把带 Verma 模系数的
      相对半无限上同调算成 Lie 代数上同调：
        H*_∞(𝒢, 𝒢₀; W ⊗ M(−β̄ − λ)) ≅ H*(𝒢₊, W)[λ]。
      这是 LZ 路线与 FGZ 路线的分岔点：FGZ 直接对物质模用消灭定理，LZ 先把系数里的
      Verma 模剥掉。
  (2) Lemma 2.21（cf. [FGZ, Theorem 1.12]）：W 是 hermitian 且 𝒢₋-free 时 H^n_∞ 集中在 n = 0；
      Lemma 2.23 的 Poincaré 对偶把上同调与同调两侧接起来。
  (3) **Theorem 2.25**：把 (1) 中的 Verma 模 M(·) 换成不可约商 L(·)，得到
        H^0_∞(𝒢, 𝒢₀; W ⊗ L(−β̄ − λ)) ≅ W^{𝒢₊}[λ] / rad，
      并且该典范同构是**等距**（保厄米形式）。Corollary 2.26 是相应的消灭定理。
  (4) 自由玻色子实例（§3）：取 W = V(D,p)。Proposition 3.1 逐条验证 Theorem 2.25 的假设
      （∈ 𝒪₀、hermitian、逐权有限维、𝒢₋-free），并给出 π(z) = D·Id；
      Proposition 3.3(iii) 给出鬼一侧 β̄ = −26z′ − L′₀，故补充模的中心荷必须是 26 − D、
      最高权 1 − h。代入 (3) 即得 **Theorem 3.5(i)**：
        V(D,p)^{𝒢₊}[−h] / rad  ≅  H⁰_∞(𝒢, 𝒢₀; V(D,p) ⊗ L(26 − D, 1 − h))，等距。
  (5) 特例化到本节点：取 **D = 26、h = 1**。补充模 L(26 − 26, 1 − 1) = L(0, 0) 是平凡一维模，
      张量掉之后 (4) 读作
        V(26,p)^{𝒢₊}[−1] / rad  ≅  H⁰_∞(𝒢, 𝒢₀; V(26,p))，等距。
      按 depends_on 上两条 inferred 边给出的字典（LZ 的 V(D,p)^{𝒢₊}[−h]/rad = 本项目
      H_phys(k)/H_0(k)；LZ 的相对复形 = 本项目 b₀ = L₀ = 0 的 BRST 相对复形），
      这正是目标陈述的断言 H_phys(k)/H_0(k) ≅ H^{gh=1}_rel(k)，且"等距"给出目标陈述要求的
      "保厄米形式的线性双射（酉同构）"。

  【为什么标 rigorous】按 docs/STATUS_LEVELS.md 第 4 级：发表在 Commun. Math. Phys. 135 (1991)
  547–580 的数学论文中的编号定理，有期刊长文级别的完整证明（受限模、分级、滤过、消解、
  Poincaré 对偶），不含路径积分或形式重排；编号与逐字措辞已由 researcher 全文 34 页逐页核实、
  关键页单页重读复核。
  本推导**不**依赖 worldsheet.critical-dimension-brst：LZ 与 FGZ 一样把总中心荷 26 当作相对
  复形的定义条件（Proposition 3.3(iii) 的 "if"），不推导它；故本推导的 rigorous 不受
  critical-dimension-brst--via-nilpotency 为 physical-argument 的影响。
gaps:
  - "【已关闭，2026-09-11，primary-sources-round2.md §11】原 gap：「LZ Theorem 3.5(i) 只说存在典范等距，没有逐字写出该等距由包含映射诱导；待 researcher 复核 LZ p.566–567」。复核结果：LZ **确实**逐字给出了典范等距的构造，且它就是包含型映射——Lemma 2.22（p.565）证明中的 Eq. (2) 逐字写 ω ↦ [ω ⊗ 1] ↦ [ω ⊗ v_{−β̄−λ} ⊗ 1 ⊗ 1]，其中 ω ∈ W^{𝒢₊}[λ] 是被 𝒢₊ 湮灭、权 λ 的物质向量（Corollary 2.17 证明：H⁰(𝒢₊, W) ≅ W^{𝒢₊}），v_{−β̄−λ} 是补充 Verma 模的最高权向量（Lemma 2.14 证明），1⊗1 是半无限形式的典范生成元即鬼真空（Remark 2.19(i) 定义 ⟨1⊗1,1⊗1⟩ = 1；Proposition 3.3(iii)(iv) 给它 −L₀ 本征值 1，即 L₀ = −1 = a^g）。Theorem 2.25 的证明末句「Now by Lemma 2.22, Eqs. (1), (2) give the desired result」把该映射对 rad 取商（其中 Eq. (1) 的 i* 按 Lemma 2.18 逐字是包含映射 i: B ↪ A 诱导的）；Theorem 3.5(i) 的证明逐字只有一句「(i) is simply a direct application of Theorem 2.25」。本节点的 D = 26、h = 1 特例下补充模 L(0,0) = C（Corollary 2.26 证明逐字「L(0) = C.」），映射退化为 ω ↦ [ω ⊗ 鬼真空]，与 fgz-1986 Theorem 2.8 的 ι 逐点相同。**残留的两点仍是推断（不是 LZ 原句）**：(a)「该映射的核恰为 rad」LZ 没有单独陈述，由「Lemma 2.22 是等距」+ Theorem 2.25 证明 Eq. (2)（i*H⁰(W⊗rad M) = rad H⁰(W⊗M)）一行合成；(b)「LZ 的 1⊗1 = 本项目 |↓⟩」仍属 worldsheet.brst-quantization 那条 inferred 边的字典，但现在有 L₀ 本征值 −1 这个可核对数值支持。"
  - "【2026-09-11 新增，primary-sources-round2.md §11.4 第 4 条】LZ §2.3 开头（p.563 末）逐字设定常设假设「From now on we will only consider weights λ ∈ 𝒢₀′ that satisfy the reality condition σλ = −λ」（σ 是 Proposition 3.3(ii) 的反线性自同构，σ(L_n) = −L_{−n}、σ(z) = −z），Theorem 2.25 / Corollary 2.26 / Theorem 3.5 全部在此假设下。本节点的 D = 26、h = 1（h 实）特例是否自动满足该条件，LZ 未验，本项目也**未核实**。"
  - "两条 inferred 边（worldsheet.brst-quantization、worldsheet.old-covariant-physical-states）是本推导可追溯性上的软处：LZ 的定理本体逐字可靠，把它翻译到本项目对象上的字典不逐字可靠（LZ 全文无 'old covariant' 字样；相对复形 ↔ b₀ = L₀ = 0 的对应未写成编号命题）。同一组字典在 worldsheet.no-ghost-theorem-subcritical--via-lian-zuckerman 里也标 inferred。"
  - "次数归一化：LZ 用 H⁰_∞（半无限上同调次数 0），目标陈述用鬼数归一化 gh(|↓⟩) = 1，两者相差常数平移 1。该平移由本项目 worldsheet.brst-quantization 的 gh(c_n) = +1 约定推出，LZ 未给出鬼数与半无限次数的字典（与 --via-fgz 的同名 gap 相同）。"
  - "动量条件：LZ 的假设是 (P1) ⟨p,1⟩ = 1、(P2) ⟨p,x⟩ ≠ 0 对某 x ∉ C1、(P3) ⟨p,α^μ_0⟩ ∈ R、(P4) D ≥ 2；目标陈述写的是 k ≠ 0（沿用 FGZ 的 p ≠ 0）。【(P2) ⇔ k ≠ 0 已对照，2026-09-11，按 reviewer-batch2 / ms.no-ghost-theorem 第四轮审计 C3】LZ p.569 的 Heisenberg 代数由 {α^μ_n : n ∈ Z} ∪ {1} 生成，零模 α^μ_0 与 1 张成交换子代数，p 是其上的线性泛函，x·v_p = ⟨p,x⟩v_p（LZ (3.3)）。(P2) 中 x ∉ C1 的 x 读作 α^μ_0 的（非零）线性组合，则 ⟨p,x⟩ ≠ 0 对某个这样的 x 成立 ⇔ (⟨p,α^μ_0⟩)_μ ≠ 0 ⇔ p ≠ 0 作为 D 维向量 ⇔ 目标陈述的 k ≠ 0。**这一对照是本项目的初等观察，不是 LZ 的原句**；且它依赖上述读法——若把 x 放开到含 1 分量（x = a·1 + Σ b_μ α^μ_0），(P2) 在 (P1) 下对任何 p 都平凡成立（取 a ≠ 0），故 LZ 的本意只能是前一种读法。(P1) 的归一化对应本项目 Fock 真空 |0;k⟩ 的 ⟨0;k|0;k⟩ = 1 与「1 作用为恒等」，本节点未单独登记。(P3) 对应 k 为实向量；本节点的 D = 26 使 (P4) 自动满足。"
  - "度规号差：LZ (3.1) 的 g^{μν} 号差在 primary-sources-round2.md 中没有逐字登记。本推导按 conv.metric-mostly-plus 读作洛伦兹 (1, 25)，依据是 D = 26 分支与 FGZ 的 V(R^{25,1}, p) 吻合，以及 (P3) 的实性假设；这是推断而非原文措辞（与 subcritical 推导的同名 gap 相同）。"
  - "扫描件转录疑点三条（Theorem 2.25 的 '𝒢-free' vs '𝒢₋-free'；Corollary 2.26 第二行 'n = 0' vs 'n ≠ 0'；Corollary 2.28 的公式指数与括号归属）尚待持可选中文本 PDF 者复核（primary-sources-round2.md §10.6）。前两条直接落在本推导 summary 的第 (2)(3) 步转述上；三条都不影响 Theorem 3.5(i) 本身的逐字条件。"
  - "LZ 的不可约最高权模 L(c,h) 在本图中尚无独立节点。本推导只用 L(0,0)（平凡一维模），故未挂 worldsheet.verma-module-v2 / math.verma-module-free-over-negative-part（2026-09-11 起它取代 worldsheet.verma-module-pbw-basis）依赖；若日后建 worldsheet.irreducible-highest-weight-module，应把「L(0,0) 是平凡一维模」这一步显式化（它是 (5) 的关键，Kac 表中 c = 0、h = 0 的不可约模确实是一维平凡模，但本推导没有为这一步给出 loc）。"
  - "本推导与 --via-fgz 的独立性是**部分**的：LZ Lemma 2.21 自注 cf. [FGZ, Theorem 1.12]，消灭定理一步同源；独立的是约化公式（Theorem 2.13）与 Theorem 2.25 这条主干，以及证明的完整程度。图上并列两条推导反映的是「两份可独立核对的文本」，不是「两条完全无关的数学路线」。"
