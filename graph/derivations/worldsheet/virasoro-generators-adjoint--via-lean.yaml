summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/PhysicalStates.lean 的
  `Adjoint` 与 `AdjointLop` 两节。三步：

  1. **模的伴随，对一切 j ∈ Z**（`pairing_mode_left`）：
     ⟨α^μ_j v, w⟩ = ⟨v, α^μ_{−j} w⟩。按 j 的三分律分情形：
     j < 0 时 α^μ_j 是产生算符（`mode_of_neg`）、α^μ_{−j} 是湮灭算符（`mode_of_pos`），
     直接就是 worldsheet.fock-indefinite-form 的 `pairing_creation_left`；
     j > 0 对称；**j = 0 时两边都是标量 a^μ 的乘法**（`mode_zero_apply`），
     由双线性性平凡成立。这一步把 fock-indefinite-form 陈述 (1)(b) 的 n ≥ 1
     延拓到全部整数指标，是本推导的第一块砖。

  2. **正规序双线性的伴随**（`pairing_nordPair_left`）：
     ⟨:α_i·α_j: v, w⟩ = ⟨v, :α_{−i}·α_{−j}: w⟩。`Fock.nordPair` 按 i ≤ j 与否
     决定两个模的书写顺序；两种情形都是把第 1 步用两次，
     注意 :α_i·α_j: 的伴随把顺序也翻转一次，恰好与 (−i) ≤ (−j) 的判定翻转对上。

  3. **Sugawara 求和的指标反射**（`pairing_Lop_left`）：
     取有限指标区间 [−B, B]，B = max(modeBound v, modeBound w) + |m|，
     私有引理 `nordPair_apply_eq_zero_of_notMem_Icc` 证明区间外每一项作用在 v（resp. w）上都是零，
     于是 `Lop_apply` 允许把 L_m v 与 L_{−m} w 都写成**同一个** [−B, B] 上的有限和：
       L_m v = ½ Σ_{j ∈ [−B,B]} :α_{m−j}·α_j: v,   L_{−m} w = ½ Σ_{j ∈ [−B,B]} :α_{−m−j}·α_j: w。
     把 ⟨·,·⟩ 的双线性性推进求和号，再用 `Finset.sum_equiv (Equiv.neg ℤ)` 把左边的求和指标
     j 换成 −j（区间 [−B,B] 关于 j ↦ −j 对称，这正是取对称区间的原因），
     逐项由第 2 步得
       ⟨:α_{m−j}·α_j: v, w⟩ = ⟨v, :α_{−(m−j)}·α_{−j}: w⟩ = ⟨v, :α_{−m−(−j)}·α_{−j}: w⟩，
     即左和的第 j 项等于右和的第 (−j) 项。两个有限和逐项对应相等，故整体相等。
     `pairing_Lop_right` 由 `pairing_Lop_left` 加 `neg_neg` 一行得到。

  全过程不使用 hη : ∀ μ, η μ * η μ = 1——这是本命题假设弱于同岛其余结果的原因：
  中心项计算（`lie_Lop_Lop`）需要把两个 η 缩掉，本推导不需要。
gaps:
  - |
    (i) **双线性型，不是半双线性型**（继承 worldsheet.fock-indefinite-form--via-lean 的 gaps (iv)）。
    Lean 里 `Fock.pairing` 是 R-双线性的，「†」= 转置。物理上的复 Fock 空间带 Hermitian 形式，
    其上的 L_m^† 还含一次复共轭；两者在实极化（实系数、实极化矢量）上一致，
    **复情形未证**。这条 gap 对本节点尤其要紧：无鬼定理谈的是 Hermitian 形式的半正定性。
  - |
    (ii) **只支持对角 η**（继承 worldsheet.bosonic-fock-space 缺口 (iii)）。
    η 在 Lean 里是 `Fin D → R`（对角元）。一般对称 η^{μν} 需先作基变换，未做。
    与陈述里强调的「不需要 η² = 1」不冲突：不需要的是**归一化**，对角性仍然要。
  - |
    (iii) **零模是标量参数，没有 x^μ、没有对 k 的直积分**（继承 Sugawara.lean 的缺口）。
    本推导给出的是**逐动量扇区**上的伴随关系。完整弦 Fock 空间上的相应陈述未形式化。
  - |
    (iv) **代数版，未取完化**（继承 worldsheet.bosonic-fock-space 缺口 (ii)）；
    且 R 必须是交换 ℚ-代数（`Fock.Lop` 用到 ½）。
  - |
    (v) **不覆盖 CFT 侧的 L_m**。见目标陈述的边界 (c)：由全纯 T 的 Laurent 模定义的 L_m
    与本推导中的 Sugawara L_m 未被证明等同，Lean 侧没有 T、没有 OPE、没有围道积分。
