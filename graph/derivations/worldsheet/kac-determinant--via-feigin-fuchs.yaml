    note: |
      **2026-09-11 拆卡换代（第一次）**：本边原指旧卡 worldsheet.verma-module，改指
      worldsheet.verma-module-pbw-basis（它 depends_on verma-module-v2，构造与分级仍在链上）。
      理由：Kac 行列式是逆变（Shapovalov）形式在 level N 的 **PBW 基**下的 Gram 行列式，
      其 p(N) × p(N) 的规模与「行列式」这一说法本身都需要归入 PBW 基的那一半
      （有序单项式构成基、dim V_N = p(N)），只有构造与分级写不出这条公式。
      **2026-09-11 合并换代（第二次）**：worldsheet.verma-module-pbw-basis 已 superseded_by
      **math.verma-module-free-over-negative-part**（两卡内容逐条重叠，后者来源更好：virasoro-lean-2025
      §12 p.11 的 L1 逐字转录 vs. 前者三条未核实到命题级的 sources），其推导已删除，本边随之改指。
      两卡的 (1)(2)(3) ↔ (1)(2)(3)(4) 一一对应；唯一的记法差别是基元下标的标号顺序
      （前者 n_1 ≥ … ≥ n_k，后者 1 ≤ n_1 ≤ … ≤ n_m），**同一组基元**，见新目标推导的 notes。
  - id: worldsheet.virasoro-algebra-v2
