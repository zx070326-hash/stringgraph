depends_on:
  - id: spectrum.one-loop-mobius-amplitude-v2
    convention_map: |
      **记号换算（原书 vs 本图）**：原书（Vol.1 §7.4 与 Vol.2 §10.8）写 **Sp(k)**，
      并逐字说明 'in our notation Sp(k) corresponds to n = 2k Chan–Paton states'；
      本图 spectrum.chan-paton-gauge-group 写 **USp(n)**（n 为 Chan–Paton 指标数）。
      两者指同一群：**USp(n) = Sp(n/2)**。本推导与目标卡一律用 **n**（Chan–Paton 指标数）记账。
    note: |
      供给**母结构**：玻色弦 Möbius 带真空振幅 Vol.1 (7.4.22)（算符形式与 26 维显式形式）、
      (7.4.21) 的 ϑ₀₀η 组合、(7.4.23) 的闭弦通道形式（±2n·2¹³V₂₆/(4π(8π²α')¹³)、s = π/4t），
      以及 **Chan–Paton 的 ±n 计数**（SO(n)：½n(n+1) 对称态 Ω = +1、½n(n−1) 反对称态 Ω = −1，
      净贡献 **n**；Sp(k)：简并反转，给 **−n**）。
      **非 inferred**：原书 §10.8 p.42 逐字 '**We have used (7.4.22) in D = 10.**'
      ⇒ 这是原书**明写**的依赖，不是本图补的；(10.8.18) 的 ± 号也正是由这条计数继承下来的。
      ⚠ **三处必须换算**：
        (i) 维数 26 → 10：(8π²α't)^{−13} → (8π²α't)^{−5}、V₂₆ → V₁₀、2¹³ → 2⁵；
        (ii) 测度 dt/**4**t → dt/**8**t：那张卡的 4t 已含无取向投影的 ½，本卡多出的那个 ½
             来自 **GSO** 投影（原书 p.38 明写）；
        (iii) 玻色因子 ϑ₀₀(0,2it)^{−12}η(2it)^{−12} → **η(2it)^{−8} Z⁰₀(2it)^{−4}**
              （8 个横向玻色子 ⇒ [ϑ₀₀η]^{−4}，而 Z⁰₀ = ϑ₀₀/η）。
              ⚠ **这一步的核对是抽取者做的**（#E71 逐字：「分母 η(2it)⁸Z⁰₀(2it)⁴ 正是 Vol.1
              (7.4.21) 的 ϑ₀₀η 组合在 D = 10 下的形式 … 与『We have used (7.4.22) in D = 10』自洽」），
              **原书只说 'rewriting the bosonic part slightly'，不写这个对应**。见 gaps 第三条。
      ⚠ 本边**不借**那张卡的断言 (5)（闭弦通道无质量系数 −24，本图对**玻色弦**的补算）；
      超弦这一侧本图**未做**对应的展开，见 gaps 第四条。
  - id: spectrum.chan-paton-factors
    note: |
      供给 **n** 这个计数本身：Möbius 带只有**一条边界**，故迹里只挂一个 Chan–Paton 因子，
      给出 ±n（而圆柱有两条边界给 n²）。
      **非 inferred**：这是 Vol.1 (7.4.22) 里 ±n 的来源，经上面那条边继承到十维。
      ⚠ 本书记号下 **Sp(k) 对应 n = 2k**（抽取记录 §1 的记号表）。
      ⚠ 本边只供 n 这个计数，**不**供 SO(n)/Sp(k) 两种投影的候选集（那是下一条边），
      也**不**供「n = 32」（那是 tadpole 卡）。
