summary: |
  **原书的四步（每一步都逐字可核）**：

  1. **写下迹里插入的算符**：无取向 + GSO 的联合投影算符是 **(10.8.15) 的四项形式**
     (1+Ω+Ω²+Ω³)/4（因开超弦上 **Ω² = exp(πiF)**，(10.8.14)），
     展开后本步只需两个迹：含 **Ω** 与含 **Ω exp(πiF)** 的，统一写成 R = Ω exp(πiβF)。
     测度取 dt/**8**t（GSO 与 Ω 各一个 ½）；玻色部门取 Vol.1 (7.4.22) 换到十维（原书逐字）；
     Chan–Paton 给 **±n**（一条边界 ⇒ 一个 CP 迹；SO(n) 给 +n、Sp(k) 给 −n，Vol.1 (7.4.22) 的计数）。
  2. **由周期性读出扇区归属**：(10.8.16) 给 ψ^μ(w + 4πit) = ψ^μ(w − 2π)，于是
