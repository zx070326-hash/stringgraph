      `TowerFock D R` 上），本边供给的是「伪态是哪个公式」这一识别，不是同一个对象的复用。
      ⚠ Lean docstring 里写的图节点名是 `worldsheet.ocq-spurious-states`（v1，已 superseded by v2）；
      与塔版逐字对应的那一半是**无壳**卡 worldsheet.spurious-subspace（v2 把带壳条件的那一半
