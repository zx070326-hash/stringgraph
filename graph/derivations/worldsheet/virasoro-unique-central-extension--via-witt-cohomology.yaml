summary: |
  论证的骨架（教科书标准路线，本图不重述细节）：

  (1) 一维中心扩张 0 → k → g → W(k) → 0 与 H^2(W(k), k)（平凡系数）的元素一一对应：
      取截面 s : W → g，令 γ(X, Y) := [s X, s Y] − s[X, Y] ∈ k，Jacobi 恒等式给出 2-上循环
      条件；换截面改变 γ 一个 2-上边缘；扩张分裂 ⟺ [γ] = 0。

  (2) 在基 {ℓ_n} 上计算 H^2(W(k), k)：先用上边缘把 γ 归一化成只有 γ(ℓ_m, ℓ_{−m}) 非零
      （即 γ(ℓ_m, ℓ_n) ∝ δ_{m+n,0}），再由 (ℓ_m, ℓ_n, ℓ_{−m−n}) 三元组的上循环条件解出
      γ(ℓ_m, ℓ_{−m}) 必为 a m + b (m^3 − m) 的形式；a m 那一支是上边缘（可由重定义
      ℓ_0 的提升吸收），剩下 b (m^3 − m) 一支给出一维空间。归一化 b = 1/12 即 γ。

  (3) 于是 dim H^2 = 1，[γ] ≠ 0，非零类构成 k^× 轨道；重标度中心元把 λγ 的扩张
      同构到 γ 的扩张，后者按定义就是 Vir(k)（worldsheet.virasoro-algebra-v2）。

  本图采用的**可核对**依据不是上面的手算，而是 virasoro-lean-2025 Theorem 6.2
  （H^2 一维，机器验证）加上同一项目对 [γ] ≠ 0 的证明。
