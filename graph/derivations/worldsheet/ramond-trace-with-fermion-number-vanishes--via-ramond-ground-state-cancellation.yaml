depends_on:
  - id: worldsheet.modular-invariance-requires-eight-transverse-fermions
    note: |
      供给**被断言为零的那个对象**：Z^α_β(τ) = Tr_α[q^H exp(πiβQ)] 的定义与四个迹的标号
      （§10.7 (10.7.7a–c)、(10.7.8a–d)），特别是 **(10.7.8d) Z¹₁ = Tr_R[exp(πiF)q^H]**，
      以及「这些迹是**对一对维数**取的」这条归一化——后者是「**两个** R 扇区基态」这个数字
      能读通的前提（一对维数上的 R 基态是二重简并）。
      **非 inferred**：那张卡的 statement 逐字含 Z^α_β 的三种写法与 (10.7.9) 的组合；
      原书 p.34 那句用的正是同一套记号，就印在同节。
      ⚠⚠ **只借记号与对象，绝不借论证方向，且绝不得反向**：按目标卡 statement 引的 p.35 逐字，
      原书**要求**模不变性的建立 '*without* using the vanishing of Z^1_1 or the abstruse
      identity (10.7.16) — as we have required'。⇒ 那张卡**不得**依赖本推导的目标卡。
      （同款纪律见 worldsheet.superstring-total-fermionic-partition-function-vanishes--via-spacetime-supersymmetry-jacobi
       对同一张卡的 depends_on note。）
  - id: worldsheet.rns-fermion-number-operator
    note: |
      供给**迹里插入的那个算符** exp(πiF)（§10.2 (10.2.19)–(10.2.24)），
      包括它与全部 ψ^μ **反对易**这条性质，以及它在 R 基态上的作用
      (10.2.24b) exp(πiF)|s⟩_R = |s'⟩_R Γ_{s's}。
      **非 inferred**：Z¹₁ 的定义式 (10.7.8d) 里的 exp(πiF) 就是该卡定义的算符，
      原书 §10.7 在 (10.7.7c) 之后逐字写明 'The charge `Q` modulo 2 is the fermion number `F`
      that appears in the GSO projection.'（researcher 复核 §5.2(a) 逐字）。
      ⚠ 该卡 own status = physical-argument（其鬼场部分经 βγ 玻色化），
      ⇒ **本推导的有效状态由它封顶**，与本推导自身的 physical-argument 同级，不额外降级。
  - id: worldsheet.rns-ramond-zero-modes-clifford
    inferred: true
    note: |
      供给 summary 第 2 步（**本图补的标准论证**）里的对象：R 扇区有费米零模 ψ^μ_0，
      它们实现 Clifford 代数 {ψ^μ_0, ψ^ν_0} = η^{μν}，R 基态构成其表示（故有简并）。
      **标 inferred，两条理由**：
        (i) 原书在 p.34 那句里**只说** 'cancellation between **the two R sector ground states**'
            ——它**直接给出「两个」这个数**，既不推导、也不回指 (10.2.17)/(10.2.18) 的 Clifford 构造；
        (ii) 那张卡讲的是**十维**的 ψ^μ_0（μ = 0…9）与「R 基态是时空旋量」，
            而这里要的是**一对维数**上的 2 重简并；二者是同一构造的不同截断，
            但**原书在此处不写这个截断**。
      ⇒ 本边承担的是 summary 第 2 步（零模配对）的对象供给，而那一步**本身就是本图补的**
        （原书不写，见 gaps 第一条）。
  - id: math.jacobi-theta-functions
    inferred: true
    note: |
      供给 summary **第 3 步（另一条路线，本图的读法，不是原书的）**里的对象 ϑ₁₁(0,τ)。
      **标 inferred，这是 researcher 的硬裁定**（polchinski-1998-v2.md §5.3 要点 2 逐字）：
        『原书给的理由是「两个 R 扇区基态之间相消」（`cancellation between the two R sector
          ground states`），**不是** Vol.1 (7.2.42) 的 `ϑ₁₁(0,τ) = 0`。§10.7 全节**没有**把
          `Z^1_1 = 0` 与 `ϑ₁₁(0,τ) = 0` 联系起来（虽然经 (10.7.7c) 两者等价）。
          ⇒ 若 curator 想把 `ramond-trace-with-fermion-number-vanishes` 接到
          `math.jacobi-theta-11-vanishes`，**那条边是 `inferred: true`**，Polchinski Vol.2 没写。』
      ⚠ 还有第二层：**本图连 (7.2.42) 的节点都还没有**（θ 定义卡的「不断言 (c)」明写排除），
      故第 3 步连对象都只到「ϑ₁₁ 的定义」为止，恒等式本身是从原书 (7.2.42) 导入的。
      ⇒ 见 gaps 第二条。
