summary: |
  **第 1 步（原书实际写下的全部内容）**。§10.7 p.34，(10.7.14) 下方，无式号，逐字：
  '**Note that `Z^1_1` actually vanishes due to cancellation between the two R sector ground
  states**, but we have assigned a formal transformation law for a reason to be explained below.'
  ⇒ **原书给的是一条带理由的断言**（理由 = 两个 R 扇区基态之间相消），**但不展开**：
  不写这两个基态在 exp(πiF) 下的本征值、不写激发态层面为何逐级相消、不引文献。
  **目标卡的断言与它引的理由逐字取自这里。**

  **第 2 步（本图补的标准论证；原书不写——这是本推导的主要内容，也是它的主要缺口）**。
  按「这些迹是对**一对维数**取的」这条归一化（(10.7.8) 之后逐字），R 扇区在一对维数上有
  两个费米零模 ψ⁰_0、ψ¹_0（worldsheet.rns-ramond-zero-modes-clifford：{ψ^μ_0, ψ^ν_0} = η^{μν}），
  它们**不改变 H**（零模），而 exp(πiF) 与全部 ψ^μ **反对易**
  （worldsheet.rns-fermion-number-operator 的定义）。于是 R 基态空间是这两个零模生成的
  二维 Clifford 模，两个基态被零模互相映射且 exp(πiF) 本征值相反（±1），
  **在 Tr_R[exp(πiF) q^H] 里逐级成对相消** ⇒ 每个 q^H 本征值上的贡献为零 ⇒ Z¹₁ ≡ 0。
  ⚠⚠ **上面这段在原书里一个字都没有**。它是「the two R sector ground states 如何相消」的标准
  补全，本推导把它写出来是为了让缺口**可指认**，不是为了声称原书证过它。⇒ gaps 第一条。

  **第 3 步（另一条路线，同样不是原书的路线；只作记账）**。由 (10.7.7c)
  Z^α_β(τ) = ϑ[α/2;β/2](0,τ)/η(τ) 取 α = β = 1 得 Z¹₁(τ) = ϑ₁₁(0,τ)/η(τ)，
  再由 Vol.1 **(7.2.42) ϑ₁₁(0,τ) = 0** 与 η ≠ 0（math.dedekind-eta-nonvanishing，formalized）
  同样得 Z¹₁ = 0。
  ⚠⚠ **§10.7 全节不把这两者联系起来**（researcher §5.3 要点 2 的硬裁定），
  且 **(7.2.42) 在原书同样零证明**，本图也**还没有它的节点**。
  ⇒ 第 3 步**不承担本推导的任何论证**，只是把「另一条路线存在且原书不走」记在案；
    对应的两条 depends_on 边（math.jacobi-theta-functions）按裁定标 **inferred**。

  **为什么标 physical-argument（三条）**
  (1) ★ **原书给理由但不展开**（researcher 的判词逐字：「原书零证明 … ⇒ 节点 own status
      封顶 `physical-argument`」）；本推导第 2 步的补全是**本图写的**，不是文献的。
  (2) **上游 worldsheet.rns-fermion-number-operator 自身是 physical-argument**
      （其鬼场部分的 F 经 βγ 玻色化定义），即使第 2 步被复核，有效状态也停在这一级。
  (3) **整个对象是自由世界面费米子的单圈迹**，属形式计算。
  ⇒ 即使日后建出 math.theta-11-vanishes-at-origin（rigorous）并补第二条推导，
    那条推导对目标卡的边**仍要标 inferred**（原书不走那条路线），(2) 也仍在。
gaps:
  - "**「两个 R 基态如何相消」的计数在原书与本图都没有（本推导的主缺口）**：
     原书 p.34 只说 'cancellation between the two R sector ground states'，
     **不写**两个基态在 exp(πiF) 下的本征值（±1）、不写激发态层面的逐级配平、不引文献
     （researcher §5.3 要点 3 逐字：『没有给出 R 基态相消的计数（`Tr_R[exp(πiF)]` 对 16 个
      R 基态的 `±` 配平），也不引文献』）。
     summary 第 2 步是**本图补的**标准论证，**未经 reviewer 独立复核**，
     且它依赖的 worldsheet.rns-ramond-zero-modes-clifford 那条边按上面的理由标 inferred。
     ⇒ **升级路径**：(i) reviewer 复核第 2 步并留 `reviewer-verified` 记录；
       (ii) 更彻底的做法是建一张『一对维数上 R 扇区的 exp(πiF) 谱』的卡
       （二重简并 + 本征值 ±1），把第 2 步变成图内可追溯的对象。"
  - "**ϑ 路线在本图缺两个环节**：summary 第 3 步要的
     (7.2.42) ϑ₁₁(0,τ) = 0 **本图无节点**（math.jacobi-theta-functions 的「不断言 (c)」明写排除，
     其 notes 建议补建 `math.theta-11-vanishes-at-origin`，由 θ 定义卡两行可证、可标 rigorous）；
     而 (10.7.7c) 的识别挂在 worldsheet.modular-invariance-requires-eight-transverse-fermions 上，
     本身是自由场迹的形式计算（physical-argument）。
     ⚠ **即使两者都补齐，这条路线对目标卡的边仍必须标 inferred**——原书不走它
     （researcher §5.3 要点 2）。"
  - "**「即便 Z¹₁ = 0 也不得把它扔掉」这条限定不在本推导的论证里，只在目标卡的断言里**：
     原书 p.34 同句明说仍为 Z¹₁ 保留形式变换律，p.35 兑现理由（插入顶点算子后 α = β = 1
     的路径积分不再为零）。**本推导不论证这条限定**，只把它随目标卡带走。
     ⚠ 对图的硬约束由此而来：**worldsheet.modular-invariance-requires-eight-transverse-fermions
     不得依赖目标卡**（否则与原书要求相反）。"
  - "**本推导不碰任何下游**：Z_ψ^± = 0、Z_{T₂} = 0、逐拓扑 NS–NS / R–R 相消全部在
     worldsheet.superstring-total-fermionic-partition-function-vanishes 一带；
     目标卡只是那条链上的一件输入（另一件是 math.jacobi-abstruse-identity）。"
