  ★★【本推导更正了图里此前的一处记载】
  worldsheet.superstring-total-fermionic-partition-function-vanishes--via-spacetime-supersymmetry-jacobi
  的 gaps 与 sources 里三处写着「**Z¹₁ = 0 的理由原书在此处也不写**（标准理由是 R 扇区带 (−1)^F
  的迹上有费米零模，本图无节点）」。
  **取到 p.34 页图后这句只对了一半**：原书**写了**理由（'cancellation between the two R sector
  ground states'），只是**不展开**；而且原书给的理由**不是**「(−1)^F 的迹上有费米零模」这个
  常见说法，更**不是** ϑ₁₁(0,τ) = 0。
  ⇒ 本批次已在那条推导里把这一处更新（并把边改指目标卡）。

  【researcher 建议的「两条卡互指」已落地】§5.5(c) 逐字：「建议 curator 让两条卡互相 `see_also`」。
  本图 schema 无 see_also 字段 ⇒ 目标卡 notes 与
  worldsheet.superstring-total-fermionic-partition-function-vanishes 的断言 (3)（§10.8 脚注 7）
  以 notes 互指。两处说的是同一个方法论模式：**真空振幅里的相消不够，插入顶点算子后必须逐项成立。**
