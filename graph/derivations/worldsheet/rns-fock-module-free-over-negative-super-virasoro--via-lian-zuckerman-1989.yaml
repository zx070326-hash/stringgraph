id: worldsheet.rns-fock-module-free-over-negative-super-virasoro--via-lian-zuckerman-1989
target: worldsheet.rns-fock-module-free-over-negative-super-virasoro
kind: proof
status: rigorous
depends_on:
  - id: math.super-virasoro-algebra
    convention_map: |
      本图的中心荷归一化是 c/12：[L_m,L_n] = (m−n)L_{m+n} + (c/12)(m³−m)δ、
      {G_r,G_s} = 2L_{r+s} + (c/12)(4r²−1)δ。
      **LZ 用 c/8 与 c/2**（p.302 逐字）：[L_m,L_n] = (m−n)L_{m+n} + (c/8)(m³ − 2κm)δ_{m+n}、
      {G_{m+κ}, G_{n−κ}} = 2L_{m+n} + (c/2)(m² + 2κm)δ_{m+n}。换算两条：
        (1) **中心荷**：c_本图 = (3/2)·c_LZ ⇒ LZ 的 c_LZ = D = 10 ↔ 本图 c^m = 15；
        (2) **R 扇区 (κ = 0) 的 L₀ 零点**：LZ 的 {G₀,G₀} = 2L₀（无中心项），本图是 2L₀ − c/12
            ⇒ L₀^LZ = L₀^本图 − c/24。NS 扇区 (κ = ½) 无额外平移。
      ⚠ **本卡的断言不受这两条换算影响**：U(Vir_κ⁻) 里根本不出现中心元与 L₀ 的标定，
      自由性是纯粹的模论性质。换算只用于把 (H1) 的 "D = 10" 读成本图的 c^m = 15。
    note: |
      供给 Vir_κ 与其负模子超代数 Vir_κ⁻ = span{L_{−n} (n ≥ 1), G_{−r} (r > 0, r ∈ Z+κ)}，
      即本卡断言里"自由模"所对的那个环 U(Vir_κ⁻)。
  - id: worldsheet.rns-super-virasoro-generators
    note: |
      供给 (H2) 的模：RNS **物质**部门的 Fock 空间与其上的 L^m_n、G^m_r 作用。
      LZ 一侧是 Proposition 1.1 与 p.303 的 V(p,κ) = R(p,κ) ⊗ U(κ)，
      U(κ) = C[α^μ_{−n}, d^μ_{−n+κ}]|p⟩，R(p,½) = C、R(p,0) 是 Spin(D−1,1) 旋量表示。
      两侧逐项同型（LZ 的 d^μ_{−n+κ} ↔ 本图的 ψ^μ_{−r}）。
      ⚠ **本边是本推导有效状态被封顶在 physical-argument 的唯一原因**：该定义卡自身 status
      为 rigorous 但其 effective 是 physical-argument（上游是 OPE / 模式展开 / 路径积分链）。
      **这不降低本推导自身的 rigorous**——LZ 在自己的框架里把 V(p,κ) 定义为一个具体的模，
      不依赖路径积分。要抬高 effective 必须先把 RNS 物质部门写成数学上自足的定义卡。
      ⚠ 与玻色侧的对照：worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986 的同位边
      指的是已形式化的 worldsheet.fock-space-virasoro-representation，故那一侧 effective 是
      rigorous。**这正是本图把两侧拆成两卡的理由之一**（见两张目标卡的 notes）。
sources:
  - ref: lian-zuckerman-1989
    loc: "**Corollary 2.19(iii)**, p.320（researcher 第三轮页图定为 p.320，E7 旧记的 p.321 是相邻页），逐字：'(iii) V(p,κ) is a free Vir_κ^--module.'；其证明**全文只有两句**，逐字：'(iii) Equations **(24), (25)** imply that V(p,κ) is a direct sum of tensor products of free modules over Vir_κ^-. One can easily check that each of the tensor products is also Vir_κ^--free.'"
    note: |
      L1（E7 第一轮 + **§9.4** 第三轮页图逐字复核）。
      ★★★【2026-09-11 订正，researcher §9.4】**Corollary 2.19(iii) 的证明不经 Proposition 2.18
      的「陈述」**，只经其**证明体内**的两条显式方程 (24)(25)。原文对比（§9.4 的表）：
        - (i)  引 **Proposition 2.18（陈述）** + (39)(40)；
        - (ii) 引 **Definition 2.17** + **Proposition 2.18（陈述）** + (27)(28)(31)；
        - **(iii) 只引 (24)、(25)** —— 'Proposition 2.18' 这四个字在 (iii) 里**不出现**。
      ⇒ 本推导旧版写「证明经 Proposition 2.18」**措辞不准**，已改为「经 Prop 2.18 证明中的
      (24)(25)，非其陈述」。
      ⚠ **(24)(25) 的位置**：印在期刊 **p.319 顶端**，位于 Prop 2.18 证明体内（该证明起于 p.318
      'Proof. Using the so-called spectrum generating algebra…'，止于 p.319 末 (34) 之后的 □）；
      引出它们的句子逐字是 'Thus (i) to (iv) imply that we can express these spaces in terms of
      irreducible modules:'，其中 (i)–(iv) 是**该证明内部的编号步骤**，不是 Prop 2.18 陈述的分条。
      ⇒ 若日后为 Prop 2.18 建卡（只承载其陈述），**本卡到那张卡的边在原文里不存在**；
      正确的上游是「V(p,κ) 的不可约分解 (24)(25)」，若无独立节点，引用须写
      `loc: §2, eqs. (24)–(25), p. 319（在 Prop 2.18 的证明内）` 并标 `inferred: true`。
      ⚠ **本推导不把 (24)(25) 写进任何断言**：researcher 把 ⊔ 的指标集（(1/2)Z₊ vs Z₊）与
      p'·p'/2 / p''·p''/2 的**撇号归属**列为「需复核」（1989 CMP 扫描件下标字号极小）。
  - ref: lian-zuckerman-1989
    loc: "**Proposition 2.18**, p.318（陈述）与其证明首段，逐字：'Proof. Using the so-called spectrum generating algebra, physicists [1, 2] have constructed these spaces. However, we will prove their existence the way FGZ did in the bosonic case. It has been shown [7, 9, 10] that the Verma module of M_κ(h,c) over Vir_κ is non-unitary for h < 0, c = 1 and unitary for h > 0, c = 9. By Kac's determinant [22] formula, for h'' < 0 and h' > 0, M_κ(h'',1), M_κ(h',9) have no (non-zero) proper Z₂-graded submodule. …'；**(24)(25)**, p.319（在该证明体内）"
    note: |
      L1，**§9.3/§9.4**（researcher 第三轮页图）。本条定位本卡的**真正上游**：
      (24)(25) 由该段的两组文献输入给出——
      **[7, 9, 10]**（幺正性：Friedan–Qiu–Shenker / Kac LNP 94 / Kac–Wakimoto）与
      **[22] = meurman-rocha-caridi-1986**（**超 Virasoro（NS/R）的 Kac 行列式**）。
      ⇒ **V(p,κ) 的 Vir_κ⁻-自由性最终建立在超 Virasoro 的 Kac 行列式之上**，不是一条组合恒等式。
      ⚠ **本推导不对 meurman-rocha-caridi-1986 拉图上的边**：本图**没有**超 Virasoro Kac 行列式
      的卡，且本轮**故意不建**（见 gaps 第一条）。
      ⚠ **编号陷阱**：LZ 的 [9]/[10] = Kac LNP 94 / Kac–Wakimoto，而 **FGZ 的 refs 10/11**
      = Kac ICM Helsinki 1978 / Feigin–Fuks 1982 —— **两篇的编号完全不同**
      （brst-cohomology-sources.md §10.1 专门警告）。
  - ref: meurman-rocha-caridi-1986
    loc: "**Sect. 3, eqs. (7)–(9), p. 274**（NS / R 两族最高权模的 Kac 行列式公式，**原文无定理号**）；证明见 **Proposition 4.10** 与 **Proposition 4.13**"
    note: |
      L1（researcher 2026-09-11 登记；元数据三源一致：Crossref DOI 10.1007/BF01209395、
      Project Euclid `cmp/1104116024`、INSPIRE recid 237833）。
      ★ 这是 **lian-zuckerman-1989 的 [22]**，即本推导上游的超 Virasoro Kac 行列式。
      ⚠⚠ **引用纪律（本条只能这样写）**：该公式在 MRC 原文里**没有定理号**，
      只能按 `Sect. 3, eqs. (7)–(9), p. 274` 定位，证明在 Prop 4.10 / Prop 4.13。
      ⚠⚠ **(9) 式的 ± 与指标条件待 auditor 页图复核**，故本图**不把公式写进任何 statement**，
      也**不为它建卡**（见 gaps 第一条）。本条只承载「上游文献已登记、定位已确定」这件事。
  - ref: lian-zuckerman-1989
    loc: "**p.320 Remark**，逐字：'V(p,κ) is in general not a direct sum of Verma modules of Vir_κ **even though it is Vir_κ^- -free**.'"
    note: |
      L1。作为 Corollary 2.19(iii) 的旁证（同一性质在另一处被逐字复述），
      同时**把自由性与 Verma 直和显式分开**——这正是目标卡"本命题不断言 (a)"的依据，
      也是本卡与争议卡 worldsheet.nsr-fock-space-verma-decomposition 不得互相依赖的理由。
  - ref: lian-zuckerman-1989
    loc: "**Proposition 5.5**, p.333，逐字：'For p = 0, the vanishing theorem does not hold because the Fock space V(p,κ) is not Vir_κ^- -free'；p.303 逐字 'p will always be assumed non-zero until Sect. 5'；p.308 逐字 'From now on, we will take D = 10'"
    note: |
      L1。(H1)(H3) 的逐字定位 + (H3) 的**必要性**（p = 0 时断言为假，不是未讨论）。
      ⚠ 注意 Proposition 5.5 的措辞把因果写清楚了：**自由性失效 ⇒ 消灭定理失效**，
      方向与图上的边同向（本卡 → 消灭定理卡）。
summary: |
  本推导没有独立的论证步骤：目标卡的断言**逐字就是** lian-zuckerman-1989 Corollary 2.19(iii)，
  三条量词（D = 10、p ≠ 0、两个扇区 κ = ½/0）分别由 p.308、p.303 与推论本身给出。
  本推导做的只有对象对接与归一化换算两件事（见 depends_on 两条边）。

  **LZ 一侧的证明链**（本图只转录，不复核；**2026-09-11 按 researcher 第三轮 §9.4 订正措辞**）：
  Corollary 2.19(iii) 的证明**全文只有两句**，逐字 'Equations **(24), (25)** imply that V(p,κ)
  is a direct sum of tensor products of free modules over Vir_κ^-. One can easily check that each
  of the tensor products is also Vir_κ^--free.'
  ⇒ **它经的是 Proposition 2.18 证明中的 (24)(25)（印在 p.319，在证明体内），不是 Prop 2.18 的陈述**
  ——'Proposition 2.18' 这四个字在 (iii) 的证明里不出现（而同一推论的 (i)(ii) 都明写引它）。
  再往上，(24)(25) 由 Prop 2.18 证明首段的两组文献输入给出：**[7, 9, 10]** 的幺正性与
  **[22] = meurman-rocha-caridi-1986** 的**超 Virasoro（NS/R）Kac 行列式**。
  Prop 2.18 自述**不走谱生成代数（DDF）那条路**，而「照 FGZ 在玻色情形的做法」用表示论证明。
  ⇒ **本卡的自由性最终建立在超 Virasoro 的 Kac 行列式之上**，与玻色侧
  worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986（经**玻色** Kac 行列式）
  **结构同源**；差别是玻色侧本图有卡可接线，超弦侧没有（见 gaps）。
  ⚠ 'One can easily check that each of the tensor products is also Vir_κ^--free' 这句是
  **一行代数的断言**（自由模的张量积在子代数上仍自由），按 docs/STATUS_LEVELS.md 的裁决属
  「有限步初等计算」，不触发降级；但本图**未独立复核**，记在 gaps。

  【为什么标 rigorous】四条：
  (1) 结论是**带编号的推论**（Corollary 2.19(iii)），陈述已逐字核实（L1 页图）；
  (2) 它在原文里有**印出的证明链**（经 Proposition 2.18，pp.317–320），不是"imply the following"
      式的一笔带过——这是本条与玻色侧 --via-fgz-1986 的**实质差别**；
  (3) 论证全在有定义的模范畴里（泛包络代数上的自由模、Kac 行列式、幺正模），
      不涉及路径积分、不涉及收敛性；
  (4) 期刊是 Communications in Mathematical Physics。
  与 worldsheet.superstring-relative-cohomology-vanishing-v2--via-lian-zuckerman-1989 的记账口径一致。

  【有效状态为什么仍是 physical-argument】依赖里的 worldsheet.rns-super-virasoro-generators
  的 effective 是 physical-argument（上游是 OPE / 模式展开链），按 docs/STATUS_LEVELS.md 的 min
  规则封顶。**这不是 LZ 的论证有缺口**，而是本图把"LZ 的 V(p,κ) = 本图的 RNS 物质 Fock 空间"
  这一步经由那张定义卡记账的后果。
gaps:
  - |
    **上游的超 Virasoro Kac 行列式已登记文献但图上无卡（本轮故意不建）**：
     (a) **[22] = meurman-rocha-caridi-1986**（CMP 107 (1986) 263–294, 'Highest weight
         representations of the Neveu-Schwarz and Ramond algebras'）——
         **〔2026-09-11 更新〕bib 已登记（L1，元数据三源一致）**，旧 gap 写的「连 bib 都未登记」
         已过期。**但图上仍没有超 Virasoro Kac 行列式的卡，且本轮不建**：该公式在 MRC 原文里
         **没有定理号**（只能定位到 `Sect. 3, eqs. (7)–(9), p. 274`，证明在 Prop 4.10 / 4.13），
         且 **(9) 式的 ± 与指标条件待 auditor 页图复核**，写进 statement 会立刻踩转录风险。
         ⇒ **状态：待建**（先请 auditor 复核 (9) 式，再建卡并把本推导接上去）。
         ⚠ 本图现有的 worldsheet.kac-determinant-v2 是**玻色** Virasoro 版，**不得**用来顶替。
     (b) **M_κ(h', 9) / M_κ(h'', 1) 的幺正性**（LZ [7, 9, 10] = Friedan–Qiu–Shenker /
         Kac LNP 94 / Kac–Wakimoto）——本图无对应卡。
     (c) **(24)(25) 本身未复核**：researcher 把 ⊔ 的指标集（(1/2)Z₊ vs Z₊）与 p'/p'' 的**撇号归属**
         列为需复核；本推导与目标卡都**不抄这两条公式**。
     (d) **收尾那句 'One can easily check…'（自由模的张量积仍自由）本图未独立复核。**
     ⇒ 本推导的 rigorous 是按「已核实的编号推论 + 其原文印出的两句证明 + 可定位的上游文献」给的，
     不是按逐行复核给的。关闭方式：auditor 复核 MRC (9) 式 → 建超 Virasoro Kac 行列式卡 →
     本推导接线；并逐行复核 LZ pp.318–320。
  - "**扇区的对称性未复核**：Corollary 2.19(iii) 一句话同时覆盖 κ = ½ 与 κ = 0，
     但 R 扇区（κ = 0）的 V(p,0) 多一个旋量因子 R(p,0)，其上的结构与 NS 不同。
     LZ 是否对两个扇区分别论证、还是一笔带过，**本图未核实**（抽取记录 E7 只转录了结论）。"
  - "**'自由模'的秩与生成元空间未记录**：LZ 只说 free，不说秩；下游若要做特征标计数
     （Corollary 2.15(i) / 2.19(i) 的维数公式），用的是 Proposition 2.18 的特征标等式，
     不是本卡。本卡不承担那一步。"
notes: |
  【本推导在图上的作用】
  它是 worldsheet.superstring-relative-cohomology-vanishing-v2--via-lian-zuckerman-1989 的
  **一条实输入**：LZ 的消灭定理证明（§3：Prop 3.2 有限过滤 → Prop 3.3 伴随分次 → Thm 3.3.1
  正合序列 + **Corollary 2.19(iii)** → Cor 3.4）显式用到本卡。
  本卡建立后，那条推导已挂一条**非 inferred** 的边指向本卡，其 gaps 第一条 (a)
  （「Corollary 2.19(iii) 未上图」）随之只剩「超 Virasoro Kac 行列式未上图」这一半。
  ★【2026-09-11 追加，reviewer-batch24】同一条边已补挂到另外两条推导上：
  worldsheet.no-ghost-theorem-superstring-cohomological-v2--via-lian-zuckerman-1989 与
  worldsheet.brst-cohomology-equals-ocq-physical-superstring-v2--via-lian-zuckerman-1989
  （它们的 gaps 原先都写「Corollary 2.19(iii) 本图没有卡」，属记账过期）。

  【与玻色侧的结构对照（2026-09-11 新认识）】
  worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986（FGZ Prop 2.6(i)）与本推导
  **不是「有证明 vs 无证明」的对比**——researcher 第三轮页图显示 FGZ 也印了证明梗概，
  且**两侧的核心工具同为 Kac 行列式**（玻色版 FGZ refs 10/11 = Kac ICM 1978 + Feigin–Fuks 1982；
  超版 LZ [22] = meurman-rocha-caridi-1986）。真正的差别有两条：
  (1) **图上的可接线性**：玻色版有 worldsheet.kac-determinant-v2 可接（已接，非 inferred），
      超版没有卡（本轮不建，见 gaps 第一条）；
  (2) **证明的详尽度**：LZ 把不可约分解写成显式的 (24)(25)，FGZ 只写两条同构式。
  ⇒ 两卡仍**互不依赖**（两篇互不引用），但「Kac 行列式是共同上游」这句可以跨卡说。

  【不构成循环】
  本推导的依赖只有超 Virasoro 代数与 RNS 物质部门两张对象卡，
  **不经过任何 BRST / 鬼场 / 上同调节点**；下游的消灭定理卡依赖本卡，方向单向。
  ⚠ 特别地：本卡**不依赖** worldsheet.nsr-fock-space-verma-decomposition（争议卡），
  也不被它依赖——"自由"与"Verma 直和"是 LZ 用 "even though" 显式分开的两件事。

  【与玻色版推导的分工】
  worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986（FGZ Prop 2.6(i)）与本推导
  **互不依赖**：两篇文献互不引用，LZ 只说方法"照 FGZ 在玻色情形的做法"，结论是在超版上另证的。
  两条推导的 gaps 因此不可互相搬运：玻色侧缺的是"命题无印出的证明"，本侧缺的是
  "证明链的两个表示论输入未上图"。
