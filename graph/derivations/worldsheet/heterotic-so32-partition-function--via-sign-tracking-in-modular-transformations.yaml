  - id: worldsheet.modular-invariance-requires-eight-transverse-fermions
    note: |
      供给 Z^α_β 的定义、模变换公式，以及 type II 的 Z_ψ^± 里两个相对负号的**来源**
      （超共形鬼场的 F；时空统计）。原书 §11.2 的三条理由句句指向这张卡的内容。
  - id: worldsheet.heterotic-string-construction
    note: 供给「左移一侧没有超共形鬼场、λ^A 是时空标量」这两条事实（理由 (ii)(iii) 的前提）。
