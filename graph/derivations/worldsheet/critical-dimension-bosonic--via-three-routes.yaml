id: worldsheet.critical-dimension-bosonic--via-three-routes
target: worldsheet.critical-dimension-bosonic
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.critical-dimension-light-cone
  - id: worldsheet.critical-dimension-old-covariant
  - id: worldsheet.critical-dimension-brst
  - id: worldsheet.open-string-intercept
    note: |
      汇总陈述含 a = 1，但路线 (iii)（BRST 幂零）只给出 c^m = 26，不含截距。
      故 a = 1 必须显式从本节点取得，否则合取不成立。
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3（光锥）、§4.1（OCQ 零态与截距）、§4.3（BRST 幂零）、§4.4（无鬼定理的 BRST 版本）"
  - ref: gsw-1987-v1
    loc: "§2.2（OCQ 谱与截距）、§2.3（光锥洛伦兹代数与无鬼定理）"
summary: |
  worldsheet.critical-dimension-bosonic 现在是汇总命题：它的陈述 (i)(ii)(iii) 是
  三个独立节点的合取，外加截距 a = 1——
    (i)   worldsheet.critical-dimension-light-cone（光锥洛伦兹代数闭合 ⇒ D=26 且 a=1）
    (ii)  worldsheet.critical-dimension-old-covariant（零模态退耦、谱幺正 ⇒ D=26 且 a=1）
    (iii) worldsheet.critical-dimension-brst（Q_B^2 = 0 ⟺ c^m = 26；**只给 D，不给 a**）
    (+)   worldsheet.open-string-intercept（a = 1，与 D 无关地成立）
  路线 (iii) 单独不足以支撑汇总陈述中的 a = 1，这是 reviewer 指出的缺口；
  补上 open-string-intercept 后合取才完整。
  本推导只做合取，不含新的物理输入，故其自身状态为 rigorous；
  但有效状态由最弱的一条决定，即光锥路线与截距节点的 physical-argument。
gaps:
  - "本推导不主张三条路线互相蕴含。三者只是各自挑出同一组 (D, a) = (26, 1)；它们之间的严格等价（例如 BRST 相对上同调与旧协变 H_phys/H_0 的同构，Kato–Ogawa / FGZ）是独立命题，尚未建节点。"
  - "汇总节点的陈述把开弦截距 a 与闭弦情形混在一起表述；细化时应按开/闭弦分别陈述。(i) 与 open-string-intercept 明确写开弦，(ii)(iii) 与开闭弦无关。"
  - "路线 (iii) 的 c^m = 26 与路线 (i)(ii) 的 D = 26 之间需要 c^m = D（D 个自由玻色子的中心荷）这一步；该步写在 worldsheet.critical-dimension-brst 陈述末句，未单列节点。"
author: curator-critdim
created: "2026-09-10"
