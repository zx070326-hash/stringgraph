    note: 供给闭弦一侧的两个理论（IIA、IIB）与 type 0（后者有快子，被「无快子」条件排除）。
  - id: worldsheet.gso-removes-tachyon
    note: 供给「IIA/IIB 无快子、type 0 有快子」，即「无快子」这一筛选条件的内容。
  - id: worldsheet.type-i-unoriented-closed-spectrum
    note: 供给无取向闭弦理论 (10.6.18)（type I 的闭弦部门）及其「单独不一致」的预告。
  - id: worldsheet.type-i-open-string-gauge-multiplet
    note: 供给开弦部门的两种可能（I / Ĩ）与 Chan–Paton 规范群。
  - id: worldsheet.type-i-tadpole-cancellation-so32
    note: |
      供给 (P4)：R–R 与 NS–NS tadpole 各自为零 ⟹ SO(32)。
      这是本推导中「除 SO(32) 外都不一致」的唯一在图支撑。
  - id: worldsheet.type-ii-spacetime-supersymmetry
    note: |
      供给论证第 (a) 步用到的事实：取向闭超弦（IIA/IIB）有**两个**引力微子
      （d = 10, N = 2 超对称），而开弦多重态只有 16 个态、是 N = 1 的表示。
      ⚠ 那张卡自身带原书的赤裸断言（'(and they are)'），是 physical-argument。
  - id: worldsheet.type-ii-massless-spectrum
    note: 供给 IIA/IIB 的谱（其中的 56/56′ 即引力微子），第 (a)(b) 步的表示计数要用。
