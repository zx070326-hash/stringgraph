summary: |
  按原书 §10.6 末的论证链：
  (1) 闭弦一侧：三条一致性条件的解给 IIA、IIB（无快子）与 type 0（有快子）；
      加「无快子」条件筛掉 type 0，剩 IIA、IIB。
  (2) 加开弦：开弦无质量多重态有 16 个态，是 d = 10, N = 1 超对称的表示，不是 N = 2 的；
      而 IIA/IIB 有两个引力微子（N = 2）。故开弦**不能**耦合到取向闭超弦，
      只能耦合到无取向的 (10.6.18)；从而开弦本身也必须无取向。
      （世界面级的理由见脚注 5：只有两个零引力微子顶点算子的一个线性组合退耦，
       必须做世界面宇称投影消掉另一个。）
  (3) 由 (10.6.18) 的手征性，开弦无质量态必须是 8_v + 8，得到 type I 的内容 (10.6.19)。
  (4) 一致性筛选：§10.8 的 tadpole 给 SO(32)（(P4)）；第 12 章的时空反常同样只留 SO(32)（(P5)）。
  (5) 结论：在 (P1)–(P5) 下恰有三个——IIA、IIB、type I SO(32)。

  【status 的理由（三条）】
  (1) **作者自己对完备性给出警告**（§11.1 末，E53）：'one should be cautious in assuming that
      all string theories have been found'，并对「已找全」只用 'suggesting' 与 'seem to be'；
  (2) (P5)（时空反常）在本图**完全没有节点**，第 12 章未读；
  (3) 上游全部 physical-argument，其中 tadpole 那一支的关键步骤（C_10）原书自称是「猜」。
gaps:
  - "**(P5) 时空规范/坐标反常的抵消在本图完全没有节点**：原书推给第 12 章（本轮未读）。本推导对 (P5) 只作前提声明。→ 与本图 consistency 区的 Green–Schwarz 1984 一支接边后可补上（那是同一物理内容的原始文献路线），但两者**尚未接边**。"
  - "**作者本人对分类完备性的警告（§11.1 末）**：本推导的结论只在第 10 章的构造假设下成立。原书明确列出两个例外（Green–Schwarz 形式的超弦、拓扑弦），并对「已找全」只用 'suggesting'、'seem to be'。任何把本卡读成「十维弦论的完备分类」的用法都与来源不符。"
  - "**「16 个态是 N = 1 而非 N = 2 的表示」这一步依赖十维超对称表示论**，本图无节点（依赖 worldsheet.type-ii-spacetime-supersymmetry，而那张卡自身带原书的赤裸断言）。脚注 5 给的世界面级理由（零引力微子顶点算子的边界项）本图也无节点。"
  - "**tadpole 那一支的 gap 继承**：C_10 的引入是「猜」的、tadpole 符号未由计算定出、本图无 Vol.1 §7.4 的单圈振幅节点。"
  - "**杂化弦不在本卡范围**：第 11 章的两个杂化弦（SO(32) 与 E8×E8）同样是十维、无快子、无反常的，但不在第 10 章的构造内。本轮不入图（任务书明确排除 §11 的 E50–E63）。因此本卡的「三个」**不是**通常说的「五个超弦理论」。"
