id: worldsheet.bc-ghost-normal-ordering-constant--via-state-operator
target: worldsheet.bc-ghost-normal-ordering-constant
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.bc-ghost-cft
  - id: worldsheet.bc-ghost-ground-state-ghost-number
  - id: worldsheet.state-operator-isomorphism
  - id: worldsheet.conformal-normal-ordering
  - id: worldsheet.energy-momentum-laurent-modes
sources:
  - ref: polchinski-1998-v1
    loc: "§2.7, eq. (2.7.21)（a^g），p.61；§2.5, eq. (2.5.4)（b、c 的权 λ、1-λ），p.50"
    note: |
      式号经 schrans-2020 目录核实；**数值 a^g = -1 未经第三方核对源确认**，
      本推导给出的是从 h(c) = 1 - λ 出发的独立重算（reviewer-verified，见 notes）。
summary: |
  由 worldsheet.bc-ghost-cft，λ = 2 的 bc 系统里 c 是权 h(c) = 1 - λ = -1 的全纯场，
  模展开 c(z) = Σ_n c_n z^{-n+1} 即 c_n 把 L_0 本征值升高 -n（[L^g_0, c_n] = -n c_n）。
  由 worldsheet.state-operator-isomorphism，鬼场基态 |↓⟩ 对应算子 c(0)，即 |↓⟩ = c_1|0⟩，
  其中 |0⟩ 是 SL(2,C) 不变真空（对应单位算子，L^g_0|0⟩ = 0）。
  于是 L^g_0 |↓⟩ = [L^g_0, c_1] |0⟩ = -c_1|0⟩ = -|↓⟩，即 a^g = -1。
  这与 worldsheet.brst-quantization 中 BRST 荷的 a^g c_0 项和总 L_0 的移位所需的取值一致。
gaps:
  - "整条论证以 worldsheet.state-operator-isomorphism 为前提（来源中是路径积分构造而非定理），
     故封顶在 physical-argument。"
  - "本图未核实 Polchinski (2.7.21) 的**数值**：核对源 schrans-2020 只给条目标题不给值。
     采用 a^g = -1 的依据是本推导的重算加上 §4.3 用法的自洽性，不是原书逐字核实。"
  - "|↓⟩ = c_1|0⟩ 这一等同来自 worldsheet.brst-quantization 的既有定义卡与
     worldsheet.bc-ghost-ground-state-ghost-number 的 (i)，本图未从 §2.7 原文逐字核实该式。"
notes: |
  reviewer-verified: reviewer-ch23, 2026-09-10（裁定 a^g = -1，理由即本 summary：
  |↓⟩ = c_1|0⟩ 对应 c(0)，权 1 - λ = -1，[L_0, c_1] = -c_1）。
  该核实只支撑数值的正确性，不改变本推导因依赖态-算子同构而封顶 physical-argument 的事实。
author: curator-polchinski-ch2-3
created: "2026-09-10"
