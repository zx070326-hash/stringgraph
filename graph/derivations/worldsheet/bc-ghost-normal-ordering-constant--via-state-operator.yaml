sources:
  - ref: polchinski-1998-v1
    loc: "§2.9「Zero-point energies」小节，p.72–73（态-算子映射路线；p.72 逐字「the weight of |↓⟩ is −1 in agreement with the earlier result (2.7.21) for λ = 2」）+ exercises 2.13, 2.14；§2.5, eq. (2.5.5)（b、c 的权 λ、1−λ）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——⚠ **loc 实质改指，且撤销
      「数值 a^g = -1 未经核对源确认」**】

      旧 loc 写 §2.7 (2.7.21) + §2.5 (2.5.4)，两处都不准：
      1. **(2.7.21) 走的是 Virasoro 代数路线**（原书逐字「can be determined **as in eq. (2.7.8)**」），
         不是态-算子路线；本图已为它新建 --via-virasoro-algebra。
         本推导（|↓⟩ ↔ c(0)，权 1−λ）对应的是原书 p.72–73 的**第三条**路线。
      2. **b、c 的权是 (2.5.5)，不是 (2.5.4)**（后者是作用量 S = (1/2π)∫d²z b ∂̄c）。

      **数值 a^g = −1 现为 L1**（原书四处逐字，见目标节点 sources 的 note (a)–(d)），
      本推导的重算不再是该值的唯一依据，而只是一条独立路线的记账。
      其中 p.72 那句「the weight of |↓⟩ is −1 in agreement with the earlier result (2.7.21)
      for λ = 2」**正是本推导 summary 所走的那一步在原书里的落点**。
      见 literature/extractions/polchinski-1998-v1.md §12.1（E42/E43/Q11）与 §12.4（E15）。
summary: |
  由 worldsheet.bc-ghost-cft，λ = 2 的 bc 系统里 c 是权 h(c) = 1 - λ = -1 的全纯场，
  模展开 c(z) = Σ_n c_n z^{-n+1} 即 c_n 把 L_0 本征值升高 -n（[L^g_0, c_n] = -n c_n）。
  由 worldsheet.state-operator-isomorphism，鬼场基态 |↓⟩ 对应算子 c(0)，即 |↓⟩ = c_1|0⟩，
  其中 |0⟩ 是 SL(2,C) 不变真空（对应单位算子，L^g_0|0⟩ = 0）。
  于是 L^g_0 |↓⟩ = [L^g_0, c_1] |0⟩ = -c_1|0⟩ = -|↓⟩，即 a^g = -1。
  这与 worldsheet.brst-quantization 中 BRST 荷的 a^g c_0 项和总 L_0 的移位所需的取值一致。
gaps:
  - "整条论证以 worldsheet.state-operator-isomorphism 为前提（来源中是路径积分构造而非定理），
     故封顶在 physical-argument。"
  - "本图未核实 Polchinski (2.7.21) 的**数值**：核对源 schrans-2020 只给条目标题不给值。
     采用 a^g = -1 的依据是本推导的重算加上 §4.3 用法的自洽性，不是原书逐字核实。
     **【2026-09-11 关闭】** 原书页图给出四处逐字确认（(2.7.20)/(2.7.21) 取 λ=2、(4.1.22)、
     p.72、p.73 的 2/24 − 26/24 = −1），本条缺口不再成立。"
  - "|↓⟩ = c_1|0⟩ 这一等同来自 worldsheet.brst-quantization 的既有定义卡与
     worldsheet.bc-ghost-ground-state-ghost-number 的 (i)，本图未从 §2.7 原文逐字核实该式。
     **【2026-09-11 部分关闭】** 原书 (2.7.18a,b,c) 给出两个简并基态 |↓⟩、|↑⟩ 的定义（L1），
     p.72 逐字确认「the weight of |↓⟩ is −1」；但 **|↓⟩ = c_1|0⟩ 这个具体写法**
     在本轮核实的页面里没有逐字出现，本条的剩余部分仍成立。"
  - "**正规序卡的费米符号规则未经文献核实**（2026-09-11 换代后的残留）。本推导现依赖
     worldsheet.conformal-normal-ordering-v2，它覆盖费米型场；但 v2 里的 (−1)^{σ(P)}
     规则是本图按两点函数的反对称性补出的措辞，抽取记录中没有覆盖它的条目
     （原书正文在付费墙后）。对本推导的实际影响很小——summary 只用到
     [L^g_0, c_1] = −c_1 这一条模式代数，不显式做 Wick 缩并——但边上的这个弱点要记账。"
