  - id: worldsheet.fock-indefinite-form
    inferred: true
    note: |
      供给"Fock 形式不定"这一前提（正定性因此才是待证命题）。
      **标 inferred**：该卡是玻色弦的 Fock 形式；FOK 的正定内积是由**自伴对合 𝒞**
