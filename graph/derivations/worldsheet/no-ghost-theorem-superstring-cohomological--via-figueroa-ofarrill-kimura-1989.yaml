id: worldsheet.no-ghost-theorem-superstring-cohomological--via-figueroa-ofarrill-kimura-1989
target: worldsheet.no-ghost-theorem-superstring-cohomological
kind: physical-argument
status: physical-argument
depends_on:
  - id: math.super-virasoro-algebra
    note: |
      供给超 Virasoro 括号。**约定与本图一致**：FOK (3.1)–(3.3) 逐字
      [l_m, l_n] = (m−n)l_{m+n} + (c/12)m(m²−1)δ_{m,−n}、
      {g_r, g_s} = 2l_{r+s} + (c/3)(r² − ¼)δ_{r,−s}、[l_n, g_r] = (n/2 − r)g_{r+n}，
      即 **c/12 归一化**（与 lian-zuckerman-1989 的 c/8 不同，故本推导不需要
      --via-lian-zuckerman-1989 那条 convention_map 的第 (1) 项）。
      注：FOK 的 {g,g} 中心项写作 (c/3)(r² − ¼) = (c/12)(4r² − 1)，与本图逐项相同。
  - id: worldsheet.superstring-brst-charge
    note: |
      供给本图一侧的 Q_B。FOK 一侧的对应物是 (4.20) 型分解
      Q = c₀L₀ − 2b₀T − γ₀²b₀ + Q̂（Schrödinger 表示）与 (5.10) 的 𝒯 = −2(T + ½γ₀²)。
      ⚠ 与 --via-lian-zuckerman-1989 同：本边使本推导的**有效状态**被封顶在
      physical-argument；但本推导自身的 status 之所以也是 physical-argument，
      是另外的理由（见 summary 与 gaps 第一条），两者不要混为一谈。
  - id: worldsheet.superstring-brst-additional-conditions
    note: |
      供给相对复形的定义。FOK 一侧**分扇区不同**，这一点必须照实记：
        NS：(3.5) 逐字 {ω | L₀ω = b₀ω = 0}——**只相对 L₀ 与 b₀**；
        R（Henneaux 表示）：(4.5) C_∞(R, R₀; M) = {ω | F₀ω = b₀ω = β₀ω = 0}，
            即再相对 β₀ 与零模 supercharge F₀（R₀ = L₀ ⊕ F₀）；
        R（Schrödinger 表示）：β₀ = x· **没有本征值**，**不能**施加 β₀ω = 0，
            只能相对 L₀（FOK p.115）。
      ⇒ 本图该卡（b₀ = L₀ = 0，R 另加 β₀ = G₀ = 0）对应的是 FOK 的 **Henneaux 表示**那一路；
      Schrödinger 表示那一路在本图**没有对应的相对复形卡**（见 gaps）。
  - id: worldsheet.superstring-brst-nilpotent-at-c15
    note: |
      供给 Q_B² = 0。
      ⚠ **在 FOK 这里 D = 10 是假设，不是结论**：p.111 / p.115 把物质 SCFT 取为
      'with the opposite central charge (in the critical dimension)'，鬼中心荷 c ↦ −15。
      与 fgz-1986 对玻色弦的处理同型（π(c) = 26 是假设）。
      ⚠ 2026-09-11（reviewer-v2-ch10b）：本边原指双向卡
      worldsheet.critical-dimension-superstring-brst（已换代）。本推导只需要 Q_B² = 0，
      故改指单向弱卡（c^m = 15 ⟹ Q_B² = 0）；⟹ 方向的卡是 conjecture，不经过本边。
  - id: worldsheet.superconformal-ghost-central-charge
    note: 供给 c^g = −15；FOK p.111、p.115 逐字取鬼 Fock 空间中心荷 c ↦ −15 Id。
  - id: worldsheet.superconformal-ghost-modes
    note: |
      供给 bc 与 βγ 的模式与基态。
      ⚠ **FOK 的鬼振子不是本图的自然振子**，须记一条换算警示：p.111 附近逐字
      'Our ghost oscillators are not the natural ones but are unitarily related to them'，
      其模展开写作 b(σ) = b₀ + Σ√m(b_m e^{imσ} + b_{−m}e^{−imσ}) 等（带 √m 因子）。
      该酉变换的显式形式本图未核对（见 gaps）。
  - id: worldsheet.superconformal-ghost-unit-operator-vacuum
    note: |
      供给"βγ 有不等价真空"这一事实，即目标卡 (H4) 与断言 (2) 的存在量词所以必要的理由。
      FOK §4 是文献里对这一点最直接的处理：p.106 逐字
      'In fact there has not appeared in the literature a unique treatment of these zero modes
      and thus we treat them in **two different ways**. The cohomologies turn out to be isomorphic
      although one of them does not admit a grading by ghost number.'
  - id: worldsheet.rns-super-virasoro-generators
