sources:
  - ref: figueroa-ofarrill-kimura-1989
    loc: "§6「The \"no-ghost\" theorem」, pp.123–128。判据：(6.1) Tr_{H₀} 𝒞 ≤ dim H₀（饱和 ⟺ 正定）、(6.5) 化为 Tr_{C_∞} q^L 𝒞 ≤ Tr_{C_∞} q^L (−1)^𝒢。**NS**：(6.14) Tr_{C_∞}(−1)^𝒢 q^L = Π(1−qⁿ)^{−8} × Π(1+q^r)^8 与 (6.15) Tr_{C_∞} 𝒞 q^L 同值 ⇒ 逐字 'hence proving the \"no-ghost\" theorem for the Neveu-Schwarz sector'。**R（Henneaux 表示）**：(6.19) = (6.20) = Π((1+qⁿ)/(1−qⁿ))^8 ⇒ 逐字 'hence proving the \"no-ghost\" theorem'。**R（Schrödinger 表示）**：p.128 一段（Q 厄米 ⇒ 上同调内积良定义；取 Tψ = 0 的代表元，归一化零模空间内积使 ‖ψ ⊗ 1‖ = ‖ψ‖，再由 Henneaux 表示的结果得正定）"
    note: |
      L1（全文 28 页逐页读图，literature/extractions/figueroa-ofarrill-kimura-1989.md E5）。
      ⚠⚠ **本文没有编号定理**（§2 的三条 'Theorem/Theorem′/Theorem″' 是引用的谱序列标准结果，
      无编号）；一切结果按公式号定位，**不要编定理号**。
      方法自述（p.123 逐字）：'we prove the "no-ghost" theorem for the NSR string along the lines
      suggested in [4]. This method was used to prove the similar result for the bosonic string in
      [1] and [3].'（[1] = fgz-1986，[3] = Spiegelglas，[4] = 作者自己的预印本 ITP-SB-88-34）。
      ⚠ 脚注 11 逐字：'As it stands this next equation is ill-defined since H₀ is infinite
      dimensional. These quantities are to be understood as **weighted traces**.'
  - ref: figueroa-ofarrill-kimura-1989
    loc: "§3 消灭定理（NS）：(3.18) H^m_∞(NS, L₀; H) ≅ H^{−m}_∞(NS, L₀; H)、(3.19) H^{m≠0}_∞(NS, L₀; H) = 0；证明经相对子复形 (3.5)、半整数过滤 (3.8)–(3.9)、谱序列 E₁ = Künneth (3.16)(3.17)、附录 A 的 H^b_∞(NS_−; M) = 0 (b ≠ 0)。§4 消灭定理（R，Henneaux 表示）：(4.17) H^{m≠0}_∞(R, R₀; H) = 0；证明用双复形 (4.10)–(4.13)、纵向上同调平凡（{F₀, K} = 1，引 Henneaux [12]，脚注 9 限 p ≠ 0）、两条谱序列合并 (4.14)(4.16)"
    note: |
      L1。这是本推导的上游关键步骤（与 lian-zuckerman-1989 Theorem 2.4 对应，两篇独立）。
      ⚠ Poincaré 对偶 (3.18) 与判据 (6.1) 都**外包**给作者自己的预印本
      [4] = ITP-SB-88-34 (revised)，本项目**未取得其发表版**（Dedushenko [19] 引 FOK 的
      Phys. Lett. B 219 (1989) 273 'Some results on the BRST cohomology of the NSR string'，
      可能即其发表版，L4）。
  - ref: figueroa-ofarrill-kimura-1989
    loc: "§4「The Henneaux Representation」, p.116：𝒦 = C[γ₀]，γ₀ 生成、β₀ 湮灭，β₀ 与 γ₀ 互为伴随；缺点逐字 'Changing the hermiticity properties of γ₀ and β₀ changes the hermiticity properties of the BRST operator: it is no longer hermitian. This means that it is no longer guaranteed that the cohomology space inherits a well-defined (i.e. independent of the representative) inner product.'。p.115 Schrödinger 表示：𝒦 = L²(R, dx)、β₀ = x·、γ₀ = i d/dx；p.120 该表示下鬼数算符 ½((a†)² − a²) 无本征值 ⇒ 上同调无鬼数分次。(5.1)：H_∞(R, L₀; H) ≅ H_∞(R, R₀; H)，p.120 逐字限定 'the isomorphism is only an isomorphism of ungraded vector spaces'"
    note: |
      L1。★ 这是**目标卡断言 (2) 的存在量词由哪个实例见证**的定位：本推导的见证是
      **Henneaux 表示 C[γ₀]**（与 ito-morozumi-nojiri-uehara-1986 (3.14) 同一选择，
      与 lian-zuckerman-1989 的 T₀ ⊕ T₁ **不同**）。
      FOK 的做法是先在 Henneaux 表示证无鬼（(6.19)(6.20)），再转到 Schrödinger 表示（p.128），
      因为 Henneaux 表示下 Q 非厄米、上同调内积不自动良定义。
  - ref: figueroa-ofarrill-kimura-1989
    loc: "附录 B：正定内积由自伴对合 𝒞 定义，⟨ψ,φ⟩_𝒞 = ⟨ψ, 𝒞φ⟩ (B.1)，(B.2)–(B.10) 给 𝒞c_n𝒞 = b_n 等；p.132 逐字 'To show that the new inner product defined by (B.1) is indeed positive-definite is completely straightforward and is left as an exercise for the reader.' 与 'following Henneaux [12], we can treat them as annihilation and creation operators, in which case β₀ and γ₀ are mutual adjoints. It is interesting to remark that in this case there is no self-adjoint involution 𝒞 which yields this adjointness property'"
    note: |
      L1。⚠ **两条作者自承的缺口，直接决定本推导的 status**（见 gaps 第三条）：
      (a) (B.1) 的正定性「left as an exercise」；
      (b) Henneaux 表示下**不存在**给出该伴随性质的自伴对合 𝒞——而 §6 的判据 (6.1) 正是用
          Tr 𝒞 写的。
  - ref: brower-friedman-1973
    loc: "abstract（正文本项目未取得，L0；read_depth 保持 abstract，不得升）"
    note: |
      ⚠⚠ **本条是 FOK 归属的对象，不支持 FOK 所需的那条前提。**
      **摘要逐字全文**（L1，INSPIRE 出版方摘要）："The no-ghost theorem of Brower for the
      conventional dual model (intercept `α₀=1`) is extended to the Neveu-Schwarz model, and its
      spectrum-generating algebra is constructed. These conformally invariant generators
      (`A_n`, `B_s`) are obtained by a systematic use of the gauges `G_r`. As a consequence it is
      demonstrated that particular dual models having resonances with positive-definite norms and
      masses are possible."
      ⇒ **摘要只承载两件事：NS 扇区的无鬼定理 + 谱生成代数 (A_n, B_s)。**
      **没有 "reducible"、没有 "Verma"、没有 "direct sum"、没有 "Fock space"、没有
      "representation"；标题与摘要都是 NS-only，完全没有 Ramond。**
      ⇒ (a) 图里**不得**把本条作为「完全可约性 / Verma 模直和」的来源；
         (b) **FOK p.115 把一条 R 扇区的完全可约性归给本条，在本条的标题/摘要里没有任何支撑**；
         (c) 「Verma 模直和」这个说法在整个引用网络（35 篇引用方）里**只有 Figueroa-O'Farrill
             本人一个出处**，不是两条独立证言。
      详见 worldsheet.nsr-fock-space-verma-decomposition 与
      literature/extractions/brower-friedman-1973.md §2–§3。
  - ref: henneaux-1987
    loc: "全文；摘要（L2）。摘要逐字：'The infinite degeneracy due to the commuting ghost zero mode is shown to be spurious by extending to the BRST context an argument originally due to Corrigan and Goddard.'"
    note: |
      **正文未取得（L0）**，loc 只能写「全文；摘要（L2）」。
      本条支撑的是本推导 R 扇区证明链里的一步：FOK p.118 逐字
      'This space, however, turns out to be trivial [12]. In fact, one can⁹ define an operator K
      such that {F₀, K} = 1. Therefore the vertical cohomology is zero except in dimension zero
      where it is isomorphic to C^{F₀}.'；脚注 9 逐字 'Strictly speaking, this is only possible
      for states whose center of mass momentum is **different from zero**' ⇒ 这正是目标卡 (H2)
      p ≠ 0 在 R 扇区的技术来源。又 p.119 逐字 'Since the cohomology of F₀ is trivial, as proven
      in [12], so is the cohomology of F₀ + K.'
      ⚠ Henneaux 摘要**只说 cohomology computed，不含 "no-ghost" 字样**；是否证明内积正定 L0。
      ⇒ 本条**不**支撑目标卡的断言，只支撑这一个引理。
      LZ Theorem 2.7（{D_R, ε} = 1）是同一机制的数学版，两篇互不引用。
summary: |
  FOK 1989 与 lian-zuckerman-1989 **独立**地给出了 RNS 弦无鬼定理的数学证明（两篇互不引用，
  LZ p.335 Note added in proof 逐字 'we received preprints from J. Figueroa-O'Farrill and
  T. Kimura, whose work appears to be similar to ours'）。FOK 的路线与 LZ 不同：

  1. **相对复形与消灭定理**：NS 取 (3.5) 的 {ω | L₀ω = b₀ω = 0}，用半整数过滤 (3.8)–(3.9)
     与 Künneth 型 E₁ (3.16)(3.17) 的谱序列，加附录 A 的超李代数同调消灭 (A.14)，
     经 Poincaré 对偶 (3.18) 得 (3.19) H^{m≠0} = 0。
     R 扇区在 **Henneaux 表示** C[γ₀] 下取 (4.5) 的 {ω | F₀ω = b₀ω = β₀ω = 0}，
     用横向 Q、纵向 F₀ 的双复形 (4.10)–(4.13)；纵向上同调平凡（{F₀, K} = 1，引 Henneaux，
     **只在 p ≠ 0**），两条谱序列合并得 (4.17) H^{m≠0} = 0。
  2. **正定性判据**（§6，路线自述"沿 [4] 的建议，与 [1][3] 对玻色弦所用同法"）：
     引入自伴对合 𝒞（附录 B (B.1)）把不定形式换成正定形式；判据 (6.1)
     Tr_{H₀} 𝒞 ≤ dim H₀，**等号成立 ⟺ 上同调上的内积正定**；(6.5) 把它化为复形上的
     加权迹恒等式 Tr_{C_∞} q^L 𝒞 ≤ Tr_{C_∞} q^L (−1)^𝒢。
  3. **逐扇区验算迹恒等式**：NS 得 (6.14) = (6.15) = Π(1−qⁿ)^{−8}·Π(1+q^r)^8；
     R（Henneaux 表示）得 (6.19) = (6.20) = Π((1+qⁿ)/(1−qⁿ))^8。两处都饱和 ⇒ 正定。
  4. **换到 Schrödinger 表示**（p.128）：因 Henneaux 表示下 Q 非厄米，FOK 再论证在
     Schrödinger 表示（Q 厄米、上同调内积良定义）下取 Tψ = 0 的代表元并归一化零模空间内积，
     由第 3 步的结果得正定。
  ⇒ 目标卡断言 (1)（NS）与 (2)（R，见证 Henneaux 表示 C[γ₀]）得证。

  【★ 为什么 status 是 physical-argument 而不是 rigorous——一条**真矛盾**，不是风格问题】
  FOK 的 NS 与 R 两处消灭定理都建立在**物质表示完全可约（Verma 模的无穷直和）**之上：
  p.111 逐字 'It was proven by Brower and Friedman [11] that this representation is **fully
  reducible** … infinite direct sum of Verma modules'，并据此逐 Verma 模算上同调
  （附录 A 的 (A.14) 就是对 **Verma 模** M 陈述的）。
  而 lian-zuckerman-1989 p.320 Remark **明确给出反例**：逐字
  'V(p,κ) is in general **not** a direct sum of Verma modules of Vir_κ even though it is
  Vir_κ^- -free.'，并用（超 Virasoro 的）**Kac 行列式**在 NS 扇区证明之。
  两篇对同一事实的陈述**直接矛盾**；**LZ 不需要它**（用自由性 Corollary 2.19(iii) 即可），
  **FOK 需要它**（附录 A 的定理只对 Verma 模证）。
  ⇒ 按 docs/STATUS_LEVELS.md「不确定时选低的那级」，本推导记 **physical-argument**，
  并把矛盾建成独立节点 **worldsheet.nsr-fock-space-verma-decomposition**（争议卡，status
  由其推导计算为 conjecture）作为本推导的一条非 inferred depends_on 边
  ——⇒ **本推导的 effective 因此是 conjecture**，而 --via-lian-zuckerman-1989 不受影响。
  ⚠ 这**不是**说 FOK 的结论错：结论与 LZ 一致，且 LZ 独立地严格证明了它；
  只是**FOK 这条路线的可追溯性目前断在一处两篇互相矛盾的引用上**。
  另有三条作者自承缺口（附录 A 定理无已发表证明、(B.1) 正定性 left as an exercise、
  判据与对偶外包给未见发表版的预印本 [4]），任何一条都足以不给 rigorous。
gaps:
  - |
    ★★ **与 lian-zuckerman-1989 的一处真矛盾（本推导不标 rigorous 的首要理由）**：
    FOK p.111 逐字 'It was proven by Brower and Friedman [11] that this representation is
    fully reducible … infinite direct sum of Verma modules'；R 扇区 p.115 措辞更弱，逐字
    'Brower and Friedman **claim** to have proven full reducibility of this representation,
    although they do not write down the explicit spectrum generating algebra'。
    而 lian-zuckerman-1989 p.320 Remark 逐字 'V(p,κ) is in general **not** a direct sum of
    Verma modules of Vir_κ even though it is Vir_κ^- -free.'（用 Kac 行列式在 NS 扇区明证）。
    **FOK 的证明需要完全可约性**（附录 A 的 (A.14) 只对 Verma 模 M 陈述），**LZ 不需要**。
    **2026-09-11 更新（reviewer-batch17b 指出原文字已过期）**：
    **brower-friedman-1973 已登记到 literature/sources.bib，抽取记录 extractions/brower-friedman-1973.md
    也已存在**（摘要 L1 逐字 + 元数据 L1；**正文仍未取得，L0，read_depth 保持 abstract**）。
    核实结果对 FOK 不利：该文**摘要不含 "reducible"/"Verma"/"direct sum"**，
    **标题与摘要都是 NS-only、完全没有 Ramond**，且「Verma 模直和」这一说法在 35 篇引用方中
