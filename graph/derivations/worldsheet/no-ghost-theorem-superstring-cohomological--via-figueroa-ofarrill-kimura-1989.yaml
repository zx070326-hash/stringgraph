    ⇒ **剩下的裁决前提有两条，都未满足**：(i) 取得 Brower–Friedman 正文（5 页，剩余唯一路线是
    WebSearch 找 .edu 扫描件或人工从 APS 下载）；(ii) 核对 LZ p.320 Remark 的反例取在哪个动量 p
    （LZ 的措辞是 "**in general** not"，未排除"一般 p 下成立"的调和）。
    **在裁决前本推导不得升为 rigorous。**
  - |
    **附录 A 的超李代数同调消灭定理没有已发表的证明**（作者自承）：p.106 逐字
    'We have never seen a published proof of this theorem, although Fuks [2] hints that it is a
    straightforward generalization'；(A.14) 只对所需特例补证，脚注 12 逐字
    'this theorem holds for any superalgebra with values in a free module but we shall omit the
    general proof'。本图无对应卡。
  - |
    **正定性判据与 Poincaré 对偶外包给未见发表版的预印本**：(6.1) 与 (3.18) 都引作者自己的
    [4] = ITP-SB-88-34 (revised)。Dedushenko 2015 [19] 引 FOK 的
    Phys. Lett. B 219 (1989) 273 'Some results on the BRST cohomology of the NSR string'，
    可能即其发表版（**L4，未核**）。另 (B.1) 的正定性 p.132 逐字
    'is completely straightforward and is left as an exercise for the reader'。
  - |
    **判据用的对合 𝒞 与 Henneaux 表示不相容（作者自己指出）**：p.132 逐字
    'in this case there is **no** self-adjoint involution 𝒞 which yields this adjointness
    property'。而 §6 的 R 扇区验算 (6.19)(6.20) 恰是在 Henneaux 表示下用 Tr 𝒞 做的。
    两处如何相容，FOK 未展开；本图未核实。这是本推导第 3→4 步之间的一处实质缺口。
  - |
    **FOK 的鬼振子与本图的不是同一组**：p.111 附近逐字 'Our ghost oscillators are not the
    natural ones but are **unitarily related** to them'（模展开带 √m 因子）。
    该酉变换的显式形式、以及它是否影响迹恒等式 (6.14)–(6.20) 的取值，本图未核对。
  - |
    **Schrödinger 表示那一路在本图没有相对复形卡**：该表示下 β₀ = x· 没有本征值，
    **不能**施加 β₀ω = 0（FOK p.115），故其相对复形只相对 L₀，与本图
    worldsheet.superstring-brst-additional-conditions（R 扇区要求 β₀ = G₀ = 0）不同；
    且该表示下鬼数算符 ½((a†)² − a²) 无本征值，**上同调没有鬼数分次**（p.120）
    ⇒ conv.superstring-ghost-number-zero 在该表示下无意义。
    本推导因此只用 Henneaux 表示那一路作为目标卡断言 (2) 的见证。
  - |
    **两种表示的相对上同调只作为无分次向量空间同构**：(5.1) H_∞(R, L₀; H) ≅ H_∞(R, R₀; H)，
    p.120 逐字 'the isomorphism is only an isomorphism of **ungraded** vector spaces'。
    且 FOK 的两种表示与 lian-zuckerman-1989 的 T₀ ⊕ T₁ 之间的关系，**两篇都没写**，本图未核实。
    ⇒ 这条与 --via-lian-zuckerman-1989 的同名 gap 是同一个未决问题的两侧。
  - |
    **D = 10 在 FOK 是假设不是结论**（p.111、p.115：物质 SCFT 取 'with the opposite central
    charge (in the critical dimension)'），与 fgz-1986 对玻色弦的处理同型。
    故 worldsheet.critical-dimension-superstring-brst 那条边供给的是 FOK 的**前提**，
    不是 FOK 证明的一部分。
  - |
    **零动量一律排除**：脚注 3（NS）、脚注 6（R）逐字 'the vanishing theorem as it stands does
    not apply to the case where the center of mass momentum is zero. In this case the cohomology
    is again easy to compute explicitly'；脚注 9（{F₀,K} = 1 只对 p ≠ 0）。
    与目标卡 (H2) 一致，但 FOK **没有**像 lian-zuckerman-1989 Proposition 5.5 那样把
    p = 0 的结果显式列出。
  - |
    **GSO 投影后的无鬼是习题**：p.128 逐字 'we remark that the GSO projected NSR string is also
    free of ghosts. … We leave the details of this calculation as an exercise.'
    ⇒ 目标卡"本命题不断言 (e)"在 FOK 一侧同样未覆盖；严格化的候选来源是
    lian-zuckerman-1989 Proposition 4.3。
  - |
    **FOK 的玻色弦附带结果不要误引**：(6.8) 附近作者自陈那部分是 'essentially the "no-ghost"
    theorem for the bosonic string … away from the critical dimension'，但同时自评
    'has no cohomological significance'（此处 D = 10 算的是 8 个横向）。
    ⇒ **不得**把 figueroa-ofarrill-kimura-1989 挂到本图玻色弦一侧的任何无鬼节点上。
notes: |
  【本推导与 --via-lian-zuckerman-1989 的独立性】
  两篇互不引用：FOK 参考文献只有 14 条（引 Henneaux [12]、Spiegelglas [3]、FGZ [1]、
  Brower–Friedman [11]），**不引 Ohta、Kato–Ogawa、IMNU、Lian–Zuckerman**；
  LZ p.335 Note added in proof 称收到 FOK 预印本、工作独立。
  ⇒ 两条推导并列不是重复记账。

  【三处 βγ 差异：FOK 与 LZ 的处理对照】（researcher 汇总表见
  literature/extractions/henneaux-1987.md §5.2；本表是该表的图内副本）
  | 差异 | lian-zuckerman-1989 | figueroa-ofarrill-kimura-1989 |
  |---|---|---|
  | (i) βγ 不等价真空 / picture | p.304 'Representations corresponding to distinct charges are inequivalent.'；p.306 (7) 只选一个（κ=½ 取 T_{1/2}、κ=0 取 T₀ ⊕ T₁），理由是唯一使 deg 有上界 | §4 p.115–116 **两种表示都做**（Schrödinger L²(R,dx) 与 Henneaux C[γ₀]）；(5.1) 证两者相对上同调作为**无分次**空间同构；§6 与 p.128 两种表示都证无鬼 |
  | (ii) R 扇区 β₀ 零模 | Definition 2.2 的相对复形 = Ker b₀ ∩ Ker β₀ ∩ Ker K ∩ Ker D_R；**Theorem 2.7**（p≠0 时 (F, D_R) 上同调为零）；Definition 2.11 用 ⟨u,v⟩_rel = √−1⟨u, v̂⟩ 解决朴素内积在 Ker β₀ 上恒零 | §4 (4.10)–(4.17) 双复形 + 谱序列，{F₀, K} = 1（**引 Henneaux [12]**）；(4.20)–(4.28) 在 Schrödinger 表示下 Q = c₀L₀ − 2b₀T − γ₀²b₀ + Q̂ |
  | (iii) βγ 占据数无上界 | p.306 'A space in which deg … is bounded neither above nor below will give rise to various difficulties. Fortunately … there is a unique such space in which deg is bounded above'；Prop 3.2 有限过滤 | p.112 固定 Verma 模、固定 L₀ 本征值的相对子复形 'is finite dimensional'；p.113 过滤有界 |
  ⇒ **两篇对 Polchinski 完全不讨论的这三点都有显式处理**，且处理方式不同——
  这是本图把两篇并列为独立推导的实质内容，不只是"多一条来源"。

  【物理侧的对应关系】本推导（FOK，用 Henneaux 表示 C[γ₀]）与
  --via-ohta-imnu 里 IMNU (3.14) 的零模表示（ζ̄₀ ~ β₀ 湮灭、ζ₀ ~ γ₀ 生成）是**同一选择**；
  换算为 Dedushenko 2015 (5) 的 **R 扇区 −½ picture**（那一步换算是 researcher 的推断，
  见 literature/extractions/henneaux-1987.md §3 第 1 条）。

