id: worldsheet.weyl-anomaly-central-charge-constant--via-wess-zumino
target: worldsheet.weyl-anomaly-central-charge-constant
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.weyl-anomaly-trace
sources:
  - ref: polchinski-1998-v1
    loc: "§3.4, eq. (3.4.27)、(3.4.29)–(3.4.31)，p.96–97（式号经 schrans-2020 核实，内容经其 §3.30/§3.31 复现）"
  - ref: schrans-2020
    loc: "§3.30、§3.31（逐步复现 2a_1 = a_4 与 ∂^a C(σ) = 0）"
    note: 第三方笔记，非原书；用于确认这两步的内容。
summary: |
  写下 δ_W ln Z[g] 的最一般局域形式：体项 ∫√g δω (a_1 R + a_2 ∇^2 + …) 加边界项，
  共五个系数 a_1, …, a_5（(3.4.27)）。
  Weyl 变换构成一个**阿贝尔**群，故 δ_{W(ω_1)} δ_{W(ω_2)} ln Z 关于 ω_1 ↔ ω_2 对称。
  把两次变分显式展开（用 δ_W R = -2 δω R - 2 ∇^2 δω 之类的几何变分公式），
  反对称部分必须为零，逐项比较给出 2a_1 = a_4（(3.4.30)）。
  若允许 a_1 依赖世界面位置，记 a_1 = -C(σ)/12，则反对称部分中出现正比于 ∂^a C 的项，
  它无法被其它系数抵消，故 ∂^a C(σ) = 0（(3.4.31)），即中心荷为常数。
gaps:
  - "整条论证以 worldsheet.weyl-anomaly-trace 给出的 ⟨T^a_a⟩ 的局域形式为出发点，
     继承其全部缺口（测度的 Weyl 变分、局域性与量纲分析的隐含假设）。"
  - "『δ_W ln Z 的最一般局域形式只有这五项』本身是局域性 + 量纲分析的结果，未被独立论证；
     边界项的完整性尤其未核实。"
  - "Wess–Zumino 相容性作为一致性条件是可靠的（Weyl 群阿贝尔是定义性的），
     但把它施加在一个未定义的泛函 ln Z[g] 上，使整步仍是形式操作。"
author: curator-polchinski-ch2-3
created: "2026-09-10"
