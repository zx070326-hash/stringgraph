summary: |
  形式化证明，直接读 Lean。设 x ∈ V_N，对 `x ∈ Submodule.span R (Set.range (levelWord R c h N))`
  作 `Submodule.span_induction`：

  · **生成元支**：x = levelWord N cmp = L_{−b_1} … L_{−b_j}|c,h⟩（cmp 是 N 的合成）。
    则 L_{−k} x 就是把字母 −k 接到词的最前面，即 levelWord (N+k) (consComposition hk cmp)，
    而 consComposition hk cmp 是 N + k 的合成（blocks = k :: cmp.blocks）。
    故 L_{−k} x 本身就是 V_{N+k} 的一个生成元，落在张成里。
  · **零支 / 加法支 / 数乘支**：`lie_zero`、`lie_add`、`lie_smul` 加子模的封闭性。

  (2) 由 (1) 重标下标（k := (−n).toNat，`omega`）得到。

  **为什么这条引理这么便宜、又为什么它不平凡**：便宜是因为 V_N 按词张成定义，接一个字母
  仍是同类词；不平凡是因为图上原先没有任何节点断言「负模态严格提高 level」，
  而 Shapovalov 侧「level-0 坐标泛函杀掉一切 L_n v (n < 0)」这一步正是靠它——
  没有它，f_0 是不是 Shapovalov 泛函就无从谈起。
gaps:
  - |
    (i) **反方向未做**：正模态 L_k（k ≥ 1）把 V_N 送到哪里（预期 V_{N−k}，N < k 时为 0）
    在 Lean 与本图中**都没有**。它需要把 L_k 推过负模态词，沿途产生
    [L_k, L_{−b}] = (k+b) L_{k−b} + 中心项，是一次真正的重排归纳，不是本引理的镜像。
    目标卡的【不断言】(a) 已登记这一条。
  - |
    (ii) **本推导不提供 V_N 之间的独立性**，因此单靠它读不出「level 分解」。
    ⊕_N V_N 在 Lean 里只在 `[Field K] [CharZero K]` 上（`isInternal_levelSpan`），
    或者在 PBW 基假设下（见 worldsheet.shapovalov-form-unconditional-existence 的 (H)）。
