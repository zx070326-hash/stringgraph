      引出句逐字「…noting that they really did behave like annihilation and creation operators,
      satisfying the appropriate commutation relations [43, 44],」——**是陈述，无证明**。
      **★ 归属信息（本条 note 的要点）**：Goddard 本人把 (5.5) 归给
