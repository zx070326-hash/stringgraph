    ⚠ **本推导比那条多用的那条结构（上闭链 ε 的双乘性、(3.1) 里 ε(mk,nk) = 1）也已覆盖**：
    新卡 (1) 论证秩 1 类光格上 ε ≡ 1 满足 Li–Wang (3.6)–(3.8)。
    **但「此特例下扭群代数退化为普通群代数」仍是本项目推断**（新卡推导的 gaps 第 1 条），
    该推断即使有误也不改变结论（Li–Wang 只要求**存在**这样的 ε，而 ε ≡ 1 的验证是三行代数）。
    ⇒ 本推导的有效状态不再被这条边压到 open；**剩下的唯一上限是下面第 6 条**（末句比较）。
  - |
    **(3.1) 的母式 (2.120) 未核实（L0）。** G–N 在 (3.1) 前逐字写「Using (2.120) we can immediately write down
    the commutator of physical states…」，而 researcher 本轮读的是 pp. 571–572, 579–583, 593–600，
    **(2.120) 所在页未读**。本推导引用的 (3.1) 本身是逐字转录（L1），但它在 G–N 内部的推导链有一环我们没看过。
    这不改变「CMP 论文里有完整证明」这一事实（故 status 仍 rigorous），但**可追溯性上留一个洞**：
    下一轮 researcher 若重开该 PDF，请顺手读 §2.4/§2.5 一带把 (2.120) 逐字补上。
  - |
    **【已解决，2026-09-11（同上）】图中没有「顶点代数 Jacobi / Borcherds 恒等式」卡。**
    **已建** math.vertex-algebra-borcherds-identity（definition，rigorous）与
    math.vertex-algebra-commutator-formula（proposition，rigorous，--via-jacobi-l-zero），
    两条 G–N 推导的相应边已一并改挂并撤销 inferred。
    遗留（登记在新卡内）：(2.30) ⟺ (2.36) 的逐步换算、场版 (2.21) ⟺ 模式版的换算，来源均留白。
  - |
    **G–N ↔ 本图的归一化字典是本项目的推断，无逐字来源，且本推导对它敏感。**
    与对易关系那条推导不同，这里右端是 m δ^{ij}（不是 0），字典写错会直接改变结论：
    格点向量 ↔ (2α')^{1/2}×动量、k(0) = k·α_0 ↔ 2α' k_0·p、r·k = 1 ↔ (★)、
    ξ(z) ↔ 归一化后的 ∂X^i(z)、Res_z ↔ ∮dz/2πi。
    三家来源都在 α' = 1/2 或格点单位下工作，**一般 α' 的形式仍无文献来源**
    （与 worldsheet.ddf-operators-v5 notes 的自我登记一致）。
    ⚠ 特别是「本图的 A^i_n = ∮(dz/2πi) ∂X^i e^{i n k_0·X} 与 G–N 的 A^ξ_m 之间没有额外的归一化常数」
    这一点**是推断而非核实**：若本图的 ∂X^i 归一化与 ξ(z) 相差常数 c，右端会变成 c² m δ^{ij}。
  - |
    **ε·p = 0（偏振与态动量正交）：核查结论是「不是本命题的缺口」，但推理是本项目的。**
    G–N §3.2 (p. 599) 逐字要求 ξ_i「orthogonal to **both r and k**」，比本图的 ε·k_0 = 0 多一条
    （literature/extractions/gsw-1987-v1.md Q5 未裁决）。核查：
    (3.1) 的推导逐字只用 **ξ·k = η·k = k·k = 0**，r 不出现；ξ·r = 0 出现在 §3.2 是为**无鬼定理**
    挑一组张成 span{r,k} 正交补的标架。又 G–N (3.1) 逐字把横向空间写成**商**
    {ξ : ξ·k = 0, ξ ≡ ξ mod ℝk}（维数 d − 2），而 k(−1)e^{mk} ∝ L_(−1)e^{mk} 的零模为零
    （Res_z 𝒴(L_(−1)χ, z) = Res_z ∂_z 𝒴(χ, z) = 0），故 **A^{ξ+ck}_m = A^ξ_m（m ≠ 0）**：
    总可以把代表元换成 ξ' = ξ − ((ξ·r)/(k·r)) k，它满足 ξ'·r = 0，且 ξ'·η' = ξ·η（因 ξ·k = η·k = 0），
    **δ^{ij} 不受影响**。⇒ ε·p = 0 是代表元的选取，不是额外前提。
    「WLOG」这句话 G–N 没写，本条推理是本项目的，故登记在 gaps 而不写进 summary。
  - |
    **第二个上限：目标陈述末句的「与横向振子代数逐字同型」把本推导拉到
    worldsheet.transverse-oscillator-commutators（physical-argument）之下。**
    主对易关系 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0} 本身不需要那张卡。
    若日后把比较句拆成独立节点（如 worldsheet.ddf-algebra-isomorphic-to-transverse-oscillators），
    本推导即可去掉该边，届时只剩桥接边一个上限。
  - |
    **Lean 侧完全未起步，且本路线与围道路线要的 Lean 基建不同。**
    VertexOperator.lean 文件头 "Mathematical gaps" 第 2 条逐字「**No operator products.** `V(b, z) V(b', w)`
    and hence `[A^i_m, A^j_n]` are untouched.」——那是**围道路线**需要的算子乘积。
    本路线需要的是顶点代数公理与零模同态 (2.62)，Mathlib 的 Mathlib/Algebra/Vertex/ 目前只有骨架、
    Locality 仍在 TODO 段。**本推导不得标 formalized。**
  - |
    本推导**不覆盖** (A^i_n)† = A^i_{−n}（图中已另立 worldsheet.ddf-operators-adjoint 一线，由他人维护），
    也不覆盖 A^i_n 的良定义性（worldsheet.ddf-transversality-gives-local-finiteness；
    在顶点代数框架里它由正规性公理 (2.32) 直接给出，见 notes）。
    k_0·p = 0 的扇区（含 p = 0）不在覆盖范围内。
notes: |
  【本推导的来历，2026-09-11（四），curator】按 literature/extractions/gsw-1987-v1.md §9(3) 的建议登记。
  researcher 的核心发现：G–N 对这条对易关系走的**不是**图里 --via-conformal-weight 写的
  「两个顶点算子 OPE + 围道形变」，而是「物理态的李括号 (3.1) + 零模字典 (2.62)」——
  **这是第三条独立路线**（第一条 GSW/GT 的围道，第二条 tomassini-2008 Theorem 2.4 的修改版 DDF）。
  两条推导并存，工具自动取有效状态高者（docs/STATUS_LEVELS.md）。

  **status 定级理由（status = 自身论证的严格程度）**：论证是 CMP 论文 §3.1 内的形式级数推导，
  每一环都有编号且 (3.1)/(3.2)/(3.4)/(2.62) 已 L1 逐字核实，没有任何解析操作，故 **rigorous**。
  **有效状态（2026-09-11 更新，curator，分支 agent/curator/lattice-va）**：
  本节点建立时是 **open**（桥接边缺自由玻色子顶点代数卡）。该卡已建
  （worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower，rigorous），三条边改挂并撤销 inferred，
  于是 open 这个上限消失。**但目标陈述末句的比较仍把本推导压到 physical-argument**
  （worldsheet.transverse-oscillator-commutators，见 gaps 第 6 条）——
  这是本推导现在**唯一**的上限，也是拆卡建议 (1) 要解决的东西。
  **status 与 effective 分离是本图的设计意图**：自身论证的严格程度从未变过。

  **★ 本推导对回译审计的价值**：目标陈述里那句「注意右端**没有**中心项以外的贡献，
  也没有 k_0 或 p 的残余依赖：这正是归一化 2α' k_0·p = 1 与类光条件 k_0² = 0 的作用」
  ——在本推导里有了**确切的对应位置**：G–N (3.4) 右端的算子 k(0) = k·α_0 就是那个「残余依赖」，
  它只在 k·r = 1（即 (★)）时才等于 1。此前 --via-conformal-weight 的 gaps 第 1 条逐字承认
  这一记账「未与任何原文核对」，现在核对上了。

  **建议（交 lead / auditor，本节点不动手）**：
  (1) 目标陈述末句「与 worldsheet.transverse-oscillator-commutators 逐字同型」是**第二个命题**，
      与主对易关系捆在一张卡上，使任何推导都被那张 physical-argument 的卡压住。
      建议按「一个节点一个命题」拆出 worldsheet.ddf-algebra-isomorphic-to-transverse-oscillators。
      按项目原则 1，这要新建节点 + 旧节点 superseded_by，**不是就地改文本**，故不在本任务范围内。
  (2) worldsheet.ddf-transversality-gives-local-finiteness 的 notes 里
      「文献……于是『和是否有限』这个问题根本不出现」一句，对 GSW/GT 成立，
      **对顶点代数文献不成立**：G–N 摘要逐字「to admit **non-summable operators**」，
      §3.1 p. 595 讨论级数在 ℱ 上不可代数加和。但**失效机制不同**（G–N 讲的是纵向 log 级数、
      机制是动量条件 s·k = r·k；该节点讲的是横向 ε·k_0 ≠ 0），**不可互引为来源**。
      建议由持有该节点的人按 extractions/gsw-1987-v1.md §9(4) 改 notes。本节点不碰它。

