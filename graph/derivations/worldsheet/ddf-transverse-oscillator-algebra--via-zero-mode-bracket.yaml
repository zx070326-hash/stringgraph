summary: |
  **零模李括号路线：不用两个顶点算子的 OPE、不用围道形变，全程形式级数。**
  这是对 --via-conformal-weight 的一条独立替代（那条走「O^i_m(z) O^j_n(w) 的 OPE 单极点留数 + 围道形变」，
  上限是 worldsheet.ope-commutator-dictionary）。论证逐字取自 Gebert–Nicolai (CMP 172 (1995) 571–622) §3.1。

  第 1 步（零模字典）。顶点代数的 commutator formula (2.38)
  `[ψ_m, φ_n] = Σ_{i≥0} C(m,i)(ψ_i φ)_{m+n−i}`（Jacobi 公理 (2.36) 在 l = 0 的特例）
  取 m = n = 0：C(0, i) = δ_{i0}，右端只剩一项，得 **(2.62)**
    [ψ_0, φ_0] = ( [ψ, φ] )_0,    其中 [ψ, φ] := ψ_0 φ 是物理态空间上的李括号。
  即：**取零模是李代数同态**。这一步把「算子的对易子」化归为「态的李括号」，是本路线的全部技术内容。

  第 2 步（两个横向物理态的李括号 (3.1)）。取 ψ = ξ(−1)e^{mk}、φ = η(−1)e^{nk}（权 1 物理态），G–N 得
    (3.1)  [ξ(−1)e^{mk}, η(−1)e^{nk}] = ε(mk, nk) (ξ·η) m k(−1) e^{(m+n)k} = m (ξ·η) δ_{m+n,0} k(−1),
  用到的输入逐字只有三条内积条件 **ξ·k = η·k = k·k = 0**，加上两条结构性事实：
    · 上闭链 ε 取为**双乘性**，故 ε(mk, nk) = (−1)^{½ m n k²} = 1（k² = 0）；
    · **k(−1)e^{nk} = (1/n) L_(−1)(e^{nk}) ≡ 0 对 n ≠ 0**（L_(−1) 是顶点代数的平移算子），
      这就是右端出现 δ_{m+n,0} 的原因——m + n ≠ 0 的项整个消失，
      **不是**像围道路线那样靠「全导数的围道积分为零」。

  第 3 步（第 1 步作用于第 2 步）。A^ξ_m := (ξ(−1)e^{mk})_0（(3.2)，零模），于是由 (2.62)
    (3.4)  [A^ξ_m, A^η_n] = m (ξ·η) δ_{m+n,0} (k(−1))_0 = m (ξ·η) δ_{m+n,0} **k(0)**,
  其中 k(0) = k·α_0 **仍是算子**，G–N 刻意把它保留在右端。

  第 4 步（归一化与偏振，右端化为 m δ^{ij}）。
    · **k(0)**：在动量 r 的态上 k(0) = k·r；G–N 逐字要求为给定 r 选类光 k = k(r) 使 **k·r = 1**，
      此时 A^ξ_m「realize **precisely** the algebra of d − 2 transversal oscillators」。
      按 convention_map，k·r = 1 就是本图的 (★) 2α' k_0·p = 1；由 k_0² = 0，(★) 沿整条动量塔不变
      （worldsheet.ddf-operators-v5 说明 (b)），故 **k(0) ≡ 1 在整条塔上**，右端才成为纯 c-数。
    · **ξ·η**：取 §3.2 (p. 599) 的 d − 2 个正交归一 ξ_i，记 A^i_m := A^{ξ_i}_m，则 ξ_i·ξ_j = δ^{ij}
      （与 goddard-2008 (5.1) 后逐字的 ε^i·ε^j = δ^{ij} 一致）。
  合起来即目标陈述
    [A^i_m, A^j_n] = m δ^{ij} δ_{m+n, 0},   i, j = 2..D−1,  m, n ∈ Z \ {0}。
  末句「与 worldsheet.transverse-oscillator-commutators 逐字同型」由该节点承担（见 depends_on）。

  **本路线与围道路线的分工对照**（同一结论，两套完全不同的机制）：
    · 右端为何无 α'/k_0·p 残余：围道路线靠第 2、3 步的幂次记账（该推导 gaps 第 1 条自陈未与原文核对）；
      本路线靠 (3.4) 显式保留的 k(0) 与归一化 k·r = 1，**有逐字来源**。
    · δ_{m+n,0} 从何而来：围道路线靠「m + n ≠ 0 时留数是全导数」；本路线靠 L_(−1)e^{nk} 项在李代数中消失。
    · 良定义性：围道路线不出现该问题，代数路线由**正规性公理 (2.32)** 保证（G–N §2.1, p. 579）。
gaps:
