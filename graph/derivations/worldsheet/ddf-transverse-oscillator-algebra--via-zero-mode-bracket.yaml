id: worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket
target: worldsheet.ddf-transverse-oscillator-algebra
kind: proof
status: rigorous
depends_on:
  - id: math.formal-distribution-locality
    note: |
      形式级数框架：模式展开 𝒴(ψ, z) = Σ_n ψ_n z^{-n-1} 与 Res。**本推导不用两个顶点算子的 OPE、
      不用径向排序、不用围道形变**，这正是它区别于 --via-conformal-weight 的地方：
      那里要先算 O^i_m(z) O^j_n(w) 的 OPE 再取留数，这里只用零模之间的李括号字典。
  - id: math.vertex-algebra-commutator-formula
    note: |
      本推导的第二环是 G–N (2.62) `[ψ_0, φ_0] = ([ψ, φ])_0`（零模映射是李代数同态）。
      它是本卡断言的 commutator formula (2.38) `[ψ_m, φ_n] = Σ_{i≥0} C(m,i)(ψ_i φ)_{m+n-i}`
      在 **m = n = 0** 的特例（C(0,i) = δ_{i0}，故右端只剩 (ψ_0 φ)_0）。
      **这条边不是 inferred**：本卡逐字承载的就是 G–N 自己的 (2.38)，与 (2.62) 同出一篇同一节，
      从 (2.38) 取 m = n = 0 是一步初等代入。
      【改挂记录，2026-09-11（curator，分支 agent/curator/lattice-va）】此前本条边指向
      math.locality-ope-equivalences-v2（Schottenloher Thm 10.10 第 5 条，形式分布版）并标 inferred，
      理由是「(2.38) 就是那张卡的第 5 条」这一识别属本项目推断。新卡建立后该识别不再需要。
  - id: math.vertex-algebra-borcherds-identity
    note: |
      (2.62)/(2.38) 的公理出处：Jacobi / Borcherds 恒等式 (2.36)（模式版）与 (2.30)（形式变量版）。
      本卡的陈述同时列出本推导另外要用的两条公理性结构：**平移算子 T**
      （G–N 写作 L_(−1)，(3.1) 里 k(−1)e^{nk} = (1/n)L_(−1)e^{nk} 用的就是它）与**真空**。
      **这条边不是 inferred**：本卡逐字登记的就是 G–N (2.36)/(2.30)。
      【改挂记录，2026-09-11（同上）】此前指向 math.vertex-algebra-associativity
      （Frenkel–Ben-Zvi Thm 3.2.1，是 (2.36) 在 m = 0 的特例，**严格弱于**本推导用到的那条）并标 inferred，
      缺卡登记在原 gaps 第 3 条；新卡已补上该缺卡。
  - id: worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower
    note: |
      **桥接边（本轮接好的那一条）。** 与
      worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 的同名边理由完全相同：
      G–N 工作在**格点顶点代数** V_Λ（偶格、洛伦兹号差、带双乘性上闭链 ε）里，**不含 bc 鬼场**。
      本卡正是所需的那张：「D 个自由玻色子（洛伦兹 η、含类光 k_0）的 Heisenberg 顶点代数与格 Z k_0
      给出顶点代数 V_(𝔥, Z k_0)，动量塔 ⊕_j F(p + j k_0) 是它的（不可约）模」，
      来源 Li–Wang Theorem 3.6 + Theorem 3.10 + (3.17)。**非 inferred。**
      ⚠ **上闭链那一点在本推导里是实质的**：G–N (3.1) 逐字用到 ε(mk, nk) = 1；
      本卡 (1) 论证了在秩 1 类光格上 ε ≡ 1 满足 (3.6)–(3.8)，与之相容
      （但「扭群代数在此退化为普通群代数」仍是本项目推断，见本卡推导的 gaps 第 1 条）。
      【改挂记录，2026-09-11（同上）】此前 inferred 到 worldsheet.string-cft-is-a-vertex-algebra-v2
      （effective = open），那是原 gaps 第 1 条登记的缺卡。
  - id: worldsheet.ddf-operators-v6
    convention_map: |
      G–N ↔ 本图的字典（**本项目推断**，见 gaps 第 4 条；**本推导对它比对易关系那条推导更敏感，
      因为这里右端不是 0 而是 m δ^{ij}**）：
      格点向量 ↔ α_0-归一化的动量（r ↔ (2α')^{1/2} p，k ↔ (2α')^{1/2} k_0），
      故 G–N 的常设假设 r·k = 1 ↔ 本图 (★) 2α' k_0·p = 1，
      而 (3.4) 右端的算子 **k(0) = k·α_0 ↔ 2α' k_0·p = 1**（这正是「右端为什么不带 α' 或 k_0·p 的残余因子」
      的确切记账位置）。偏振 ξ 不是动量，其归一化由 ξ·η = δ^{ij} 单独固定，与 α' 无关。
      𝒴(e^{mk}, z) ↔ :e^{i m k_0·X(z)}:，ξ(z) ↔ 归一化后的 ∂X^i(z)，Res_z ↔ ∮dz/2πi。
    note: |
      被断言的对象。G–N (3.2) 把 A^ξ_m 定义为**零模** (ξ(−1)e^{mk})_0；类光条件 k_0² = 0（G–N: k·k = 0）
      与横向条件 ε·k_0 = 0（G–N: ξ·k = η·k = 0）正是 (3.1) 逐字用到的三条内积条件
      （「since ξ·k = η·k = k·k = 0」）。
  - id: worldsheet.momentum-tower-fock-space
    note: |
      目标陈述的量词定义域（扇区 {p : k_0·p ≠ 0} 的动量塔）。本推导里塔还有第二个作用：
      (3.4) 右端的 **k(0) 是算子**，只有在塔的每一层上取值 1 时才退化为纯 c-数 m δ^{ij}；
      而 k_0·(p + N k_0) = k_0·p（k_0² = 0）保证 (★) 沿整条塔成立
      （worldsheet.ddf-operators-v5 说明 (b)），故 k(0) 在整条塔上恒为 1。
      这条边不是 inferred：塔是目标陈述的定义域。
  - id: worldsheet.old-covariant-physical-states
    note: |
      G–N (3.1) 是**物理态之间的李括号**：ξ(−1)e^{mk} 与 η(−1)e^{nk} 都取自 G–N 的物理态空间
      ℛ_(1)（(2.55) 中 Δ = 1，即 L_(n)ψ = δ_{n0}ψ ∀n ≥ 0），这与本卡的旧协变条件
      (L_0 − a)|ψ⟩ = 0 ∧ L_m|ψ⟩ = 0 (m > 0) 在 **a = 1** 时逐字相同。
      本推导用到「被取零模的那两个态是权 1 的物理态」这一前提。
  - id: worldsheet.transverse-oscillator-commutators
    inferred: true
    note: |
      目标陈述的末句断言 DDF 代数「与世界面横向振子 α^i_n 的代数逐字同型」，
      要判断「同型」就得知道 α^i_n 的代数，故这条边承载的是**比较那一句**，不是主对易关系。
      与 --via-conformal-weight 的同名边同理（那里也标 inferred）。
      ⚠ **本卡 effective = physical-argument，因此它是本推导在桥接边之外的第二个上限**：
      即使日后补上顶点代数卡，只要目标陈述里保留这句比较，本推导也只能到 physical-argument。
      要真正解锁，应把比较句拆成独立节点（建议见 notes）。
