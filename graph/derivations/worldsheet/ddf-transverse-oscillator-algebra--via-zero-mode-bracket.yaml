    **【已解决，2026-09-11（curator，分支 agent/curator/lattice-va）】**
    原文：「图中缺『D 个自由玻色子（洛伦兹不定号差、含类光方向）的 Heisenberg 顶点代数
    ⊗ C[Z k_0]（含双乘性上闭链 ε），动量塔为其模』这张卡……故本推导有效状态为 open。」
    **该卡已建**：worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower
    （--via-li-wang-isotropic，rigorous），上游 math.lattice-vertex-algebra（Li–Wang Thm 3.6）。
    桥接边已改指该卡并撤销 inferred，与
