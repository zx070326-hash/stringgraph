      **非 inferred**：目标假设 (H2)（⟨A^i_n v, w⟩ = ⟨v, A^i_{−n} w⟩）在 DDF 设定下由该节点的
      第 (1) 条供给。目标陈述把 (H2) 写成**假设**，故本推导的算术不依赖它成立；
