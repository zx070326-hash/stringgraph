    loc: "formal/StringFormal/NoGhost/Fock.lean :: StringFormal.NoGhost.Fock.{pairing_monomial_monomial, pairing_creation_left, pairing_creation_right, pairing_eq_zero_of_level_ne}"
    note: |
      **同型的机器验证对照**（不是本推导的形式化）。协变振子 α^μ_n 在单个 Fock 空间上的
      同一段递推已在 Lean 中无 sorry 走通：`pairing_monomial_monomial` 就是本推导第 3 步的结论
      ⟨X^d, X^e⟩ = δ_{d,e} ∏ (n η^{μμ})^{d(μ,n)} d(μ,n)!，把 η^{μμ} 取横向的 +1 即得目标 (1)。
      这条 source 的作用是**为本推导的算术提供一份已被机器检查过的同型样板**：
      本推导的归纳（对创生算符个数 |d| 归纳、把湮灭算符对易穿过创生算符串）与该文件的证明逐步同构。
      **但目标对象不同**：Lean 里的单项式是 α^μ_{−n} 的、在单个 Fock 空间上；
      目标是 A^i_{−n} 的、在动量塔上，而 A^i_n 与塔上的双线性型在 Lean 中都还不存在
