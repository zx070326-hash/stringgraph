    note: |
      **非 inferred**：目标假设 (H1)（[A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}）在 DDF 设定下由该节点供给。
      理由与上一条完全相同（(H1) 在目标陈述里是假设，这条边只承担「前件在 DDF 设定下由谁兑现」
