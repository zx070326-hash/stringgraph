id: worldsheet.fermion-bosonization-two-dimensions--via-ope-matching
target: worldsheet.fermion-bosonization-two-dimensions
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.exponential-scalar-sphere-correlator
    inferred: false
    note: |
      供给玻色侧的全部动力学输入：e^{±iH} 的 OPE（(10.3.6)）与球面期望值 (10.3.7)。
      原书正是先建立 (10.3.5)–(10.3.7)，再与费米侧对照（(10.3.8)–(10.3.10)），
      故此边在 (10.3.7)–(10.3.10) 处直接可见。
  - id: worldsheet.rns-mode-expansions
    inferred: true
    note: |
      **inferred**：费米侧的对象（全纯 Majorana–Weyl 费米子 ψ^μ 及其模式）在本图由 RNS
      的模式展开卡承载，但原书 §10.3 讲玻色化时**不引用**模式展开，只用 (10.1.7) 的 OPE。
      本边记的是"费米侧的场是哪一个"这一读法，在 (10.3.8)–(10.3.10) 处找不到对应论证。
      ⚠ 另有一处不匹配：§10.3 只用两个**类空**方向的 ψ¹, ψ²（η^{μν} = δ^{μν}），
      而 RNS 卡讲的是十维全部 ψ^μ（含类时的 ψ⁰，η^{00} = −1）。
      类时方向的玻色化在原书 §10.3 不做（(10.3.28) 才把十维分成五对，见
      worldsheet.spin-field-vertex-operators）。
  - id: worldsheet.energy-momentum-tensor-free-scalar
    inferred: true
    note: |
      **inferred**：断言 (2) 的 T_B^ψ ≅ T_B^H 需要玻色侧 T_B^H 的表达式。
      原书 §10.3 在 (10.3.13) 处直接写 T_B^H 而不给其定义式；
      本图用自由标量能动张量卡承载它，需 convention_map（α' = 2、单标量、全纯一半）。
      在 (10.3.13) 处找不到这条对应关系的论证，故标 inferred。
    convention_map: |
      上游用 conv.alpha-prime-regge：T(z) = −(1/α') :∂X^μ ∂X_μ:。
      本卡用 conv.nonembedding-scalar-normalization：α' = 2、单个全纯标量，
      故 T_B^H = −(1/2) :∂H ∂H:（与 H H ∼ −ln z 相容，给 c = 1）。
sources:
  - ref: polchinski-1998-v2
    loc: "§10.3, eq. (10.3.6a,b,c)、(10.3.8)、(10.3.9a,b,c)、(10.3.10)、(10.3.13)、(10.3.14)、(10.3.15)、(10.3.17)–(10.3.19), pp. 11–13"
    note: |
      L1 一手（抽取记录 polchinski-1998-v2.md E25）。
      **这就是原书的全部论证**：把两侧的 OPE 逐条对照，同形即宣布等价。
  - ref: polchinski-1998-v1
    loc: "(6.7.23)（CBH）、(8.2.21)；§7.2（theta 函数）；第 9 章（sewing）"
    note: |
      式号出自 Vol.2 §10.3 的明写引用（L1，E25「文献列出的依赖」栏）。
      Vol.1 侧本图**均无节点、内容均未核实**，故这四处只作为来源登记，
      不作为 depends_on 边（否则会造出无法解析的 id）。见 gaps。
summary: |
  原书的论证结构（"OPE 逐条同形 ⇒ 理论等价"）：
    (1) 玻色侧：由 H H ∼ −ln z（(10.3.5)）经 Wick 缩并算出 e^{±iH} 的三条 OPE（(10.3.6a,b,c)），
        并由 OPE + 无穷远光滑性定出球面上一切指数算子的期望值（(10.3.7)，
        = worldsheet.exponential-scalar-sphere-correlator）。
    (2) 费米侧：把两个 Majorana–Weyl 费米子复化为 ψ, ψ̄（(10.3.8)），
        由 ψ^μψ^ν ∼ η^{μν}/z 算出三条 OPE（(10.3.9a,b,c)）。
    (3) **对照**：(10.3.9) 与 (10.3.6) 逐条同形 ⇒ 宣布 ψ ≅ e^{iH}, ψ̄ ≅ e^{−iH}（(10.3.10)）。
        原书进一步说这个等价"可以扩展到全部局域算子"——理由是可以用 OPE 在一侧为另一侧的
        任意局域算子造出对应物。
    (4) 交叉核对之一：能动张量与费米子数流的等同（(10.3.13)）。
    (5) 交叉核对之二：算符层面的 ° e^{iH} °（(10.3.14)）由 CBH 公式确实**反对易**（(10.3.15)）。
    (6) 交叉核对之三：两侧配分函数相等（(10.3.17) = (10.3.18)），原书说这"必然"相等
        （因为算子可以互造），并指出它等价于 theta 函数的乘积式 = 求和式（Vol.1 §7.2）。
  **本推导取 physical-argument 的理由**：第 (3) 步的推理"OPE 同形 ⇒ 理论等价"在原书是
  **断言**，没有给出"等价"的数学陈述（态空间同构？算子代数同构？关联函数相等？），
  也没有证明；(5)(6) 的支撑式号全在 Vol.1 且本图无节点。
  按 docs/STATUS_LEVELS.md 的「断言 + 骨架」档位，这是 physical-argument 而不是 conjecture
  （结论本身在数学侧是定理级的，见 target 的 notes）。
gaps:
  - "**「OPE 同形 ⇒ 等价」是断言**：原书不给「等价」的数学含义（`≅` 只有 Notation 页的 'equivalent to'），也不证明。这是本推导的核心 gap。"
  - "**手征玻色子未定义**：H(z) 被当成纯全纯标量使用，原书不讨论其零模/自对偶格/路径积分定义；继承自 worldsheet.exponential-scalar-sphere-correlator。"
  - "**反对易性（断言 (3)）的支撑在 Vol.1 且未核实**：(10.3.15) 依赖 Vol.1 (6.7.23)（CBH）与 (8.2.21)。这两条式号只经 Vol.2 的明写引用得到，本图无节点，Vol.1 侧内容未核对。"
  - "**配分函数相等（断言 (4)）的支撑在 Vol.1 §7.2 且无节点**：原书说它 'follows from the equality of the product and sum expressions for theta functions'。本图没有 theta 函数节点，这一步在图上无支撑。"
  - "**推广到一般黎曼面（断言 (5)）无支撑**：原书援引第 9 章的 sewing 构造，并附条件 'provided that we make equivalent projections on the spectra'。本图无 sewing 节点；该条件的确切含义原书也未展开。"
  - "**多种费米子并存时本推导不完整**：原书 §10.3 脚注 2 明说 'The precise operator definition has a subtlety when there are several species of fermion … A cocycle is needed'。修补在 (10.4.26)–(10.4.28)，见 worldsheet.vertex-operator-cocycle。本推导只覆盖单个复费米子/单个 H。"
  - "**类时方向未覆盖**：§10.3 用的是两个类空 ψ¹, ψ²。十维的 ψ⁰ 有 η^{00} = −1，(10.3.28) 才处理五对的分法。"
