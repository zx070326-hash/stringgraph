summary: |
  径向量子化中算子乘积按 |z| 的大小径向排序。模的对易子
    [A_m, B_n] = A_m B_n - B_n A_m
  对应两个 z-围道：一个在 |z| > |w|（对应 A 在左），一个在 |z| < |w|（对应 A 在右）。
  两者相减，在 z 平面上把两条同心围道拼成一条绕 z = w 的小闭围道（Fig. 2.3）。
  在该小围道上代入 A(z)B(w) 的 OPE，只有极点项有留数，逐阶取留数即得模的对易关系。
  对 A = B = T 且 OPE 为 c/(2(z-w)^4) + 2T(w)/(z-w)^2 + ∂T(w)/(z-w)，
  这一手续给出 Virasoro 代数（worldsheet.virasoro-algebra 的关系式），
  四阶极点的留数正是中心项 (c/12)m(m^2-1)δ_{m+n,0}。
gaps:
  - "**OPE 级数收敛与围道变形的合法性在来源中未证明**（lead 裁决 1，2026-09-10）。
     具体地：把两条同心围道之差换成绕 z = w 的小围道，要求 R{A(z)B(w)} 在两围道之间的
     环域上（除 z = w）全纯，等价于 OPE 在该环域收敛并可逐项积分。Polchinski 以 Fig. 2.3
     的图示代替论证。"
  - "径向排序算子 R 与 Hilbert 空间上的算子乘积的对应关系未被独立建立，
     本推导以 worldsheet.state-operator-isomorphism 作为 inferred 依赖。"
  - "对无穷多模的和（如 T 的 Laurent 级数）与围道积分交换次序的合法性未讨论。"
