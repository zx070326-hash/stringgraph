  - id: worldsheet.state-operator-isomorphism
    inferred: true
    note: |
      径向排序与「模作用在态上」的意义（径向量子化）在书中是在 §2.6–§2.8 之间逐步建立的，
      §2.6 处并不显式引用态-算子同构。本图把它列为依赖，是因为「R 排序的乘积定义算子在
      Hilbert 空间上的作用」这一步在本图中只有 worldsheet.state-operator-isomorphism 提供支撑。
      标 inferred: true。
