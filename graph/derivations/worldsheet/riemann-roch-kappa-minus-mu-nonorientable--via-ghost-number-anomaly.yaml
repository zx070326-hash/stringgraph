summary: |
  **与 worldsheet.riemann-roch-kappa-minus-mu-v2--via-ghost-number-anomaly 逐步相同**，
  只是目标是不可定向支；原书 §5.3 的论证一步也不用定向性、也不用任何具体曲面，故整条照搬：

  (1) **(5.3.19)**：全纯 bc 系鬼流的守恒反常 ∇_a j^a = ((1−2λ)/4) R，系数「derived in exercise 3.6」。
  (2) **(5.3.20)**：「by the same argument」（Noether）
        δ([dφ]e^{−S}) / ([dφ]e^{−S}) = (iε/2π) ∫ d²σ g^{1/2} ∇_a j^a → −iε (2λ−1)/2 · χ ，
      用 χ = (1/4π)∫ g^{1/2} R；路径积分非零 ⇒ c 插入数减 b 插入数 = 3χ/2，
      **3/2 = (2·2−1)/2 由 λ = 2 代入得出**。
  (3) **(5.3.21)**：零模计数给同一差值 ½(κ − μ)（½ 因只取全纯理论，反全纯部门贡献相等）。
      相等 ⇒ **κ − μ = 3χ**。原书接着给一般 n 的 (5.3.22)（「one finds in the same way」）。

  **为什么这条论证与定向性无关（本推导的净内容）**：逐项检查上式用到的每个对象——
  ∇_a j^a 与 R 都是标量（反常是局域的、由 TJ 的 OPE 定出，不引入定向）；
  测度 d²σ ĝ^{1/2} 是密度，不是需要定向的 2-形式；
  (P₁δσ)_{ab} = 0 与 (P₁^Tδ'g)_a = 0 都是张量方程；
  鬼数 = c 插入数 − b 插入数是纯计数；**常数 3 来自局域反常系数，不来自任何具体曲面**。
  ⇒ 不可定向面上每一步逐字成立。
gaps:
  - |
    **★ 「同一局域反常系数对不可定向面给同一常数」原书未逐字论证**（本推导相对 v2 的
    **唯一**新缺口，2026-09-11 改写）：常数 3 由 (5.3.19) 的系数在 λ = 2 代出，该系数由 TJ 的
    OPE 在任一点的邻域定出、与整体拓扑无关——原书把这一点体现在「(5.2.9) 不带 oriented 限定」
    这一写法上，但**没有一句话专门论证不可定向情形**。
    ⚠ 本卡**没有任何不可定向的检验点**：RP₂ 的 κ = 3 在本图里就是用本关系代出来的（循环，
    不能当检验），Klein 瓶本图无节点。对比 v2 有球面与环面两个检验点。
  - |
    **(a) 反常系数外包给 exercise 3.6**：(5.3.19) 的系数在正文零推导，且 [S] 称该习题在官方勘误表
    里有符号错、勘误表本项目未取得（见 worldsheet.ghost-number-current-weyl-anomaly）。
    这条缺口**直接压在结论系数上**。
  - |
    **(b) (5.3.20) 的「by the same argument」没有写出论证**：把反常当作可插进任意关联函数的
    算子方程，需要论证反常的局域性与与插入的对易性，来源里只有断言。
    ⚠ 本推导恰恰把「局域性」当作跨定向性的根据（gaps 第一条），故这条缺口在本卡上比在 v2 上更吃重。
  - |
    **(c) (5.3.22) 的一般 n 情形零推导**（「one finds in the same way」）。本卡只用 n = 1。
  - |
    **不可定向曲面上 κ / μ 的定义未被本图审查**：worldsheet.conformal-killing-equation 与
    worldsheet.moduli-condition-traceless-transverse 都写在一般二维 Riemann 流形上，
    定义式是张量方程（实际无碍），但**来源与本图都没有讨论「不可定向时这两个定义是否需要修改」**
    （例如 ker P₁^T 在不可定向面上与「全纯二次微分」的对应关系需经定向双覆盖重述）。
    ⚠ 这一条与 worldsheet.rp2-conformal-killing-group--via-sphere-involution 的同名 gap 是同一件事。
  - |
    **路径积分层面的形式操作**：δ_{g#} 作用在 ∫[dφ]e^{−S} 上、测度的鬼数变换等，均无数学定义。
  - |
    **数学路线对本卡无效**：math.quadratic-differentials-minus-holomorphic-vector-fields
    的 Riemann–Roch 计算设在黎曼面（=可定向）上，不能给本卡提供第二条推导
    （要走定向双覆盖 + 对合不变子空间，本图无来源，math-sources.md Q34）。
notes: |
  **建立理由（2026-09-11，curator-batch10-14-fix）**：见目标卡 notes。
  本推导是 worldsheet.riemann-roch-kappa-minus-mu-v2--via-ghost-number-anomaly 的**平行副本**
  （依赖集相同、summary 前半逐字相同），差别只有三处：
  (1) 目标是不可定向支；
  (2) summary 末段新增「为什么这条论证与定向性无关」的逐项检查；
  (3) gaps 第一条把「常数对不可定向面的通用性未逐字论证」列为本卡特有的缺口。

  **★ 2026-09-11 订正（curator-small-backlog-4，依 researcher polchinski-1998-v1.md §16「E82 复核」，
  印刷 pp.158–159 页图 L1）**，与 v2 同名推导同步：
  - **删边** worldsheet.sphere-conformal-killing-group：原书 §5.3 的论证不经球面（pp.158–159
    无 sphere / χ = 2 / κ = 6 / μ = 0，无「定常数」动作），常数 3 由 λ = 2 代入算出。
    该边的撤销条件（读到 p.159 页图并确认就地用球面）已核实为**不成立**，故删。
  - 旧 gap 第一条「标定例子是可定向的」与第二条「μ(S₂) = 0 在图上是断言」**一并撤销**：
    不存在标定，就不存在「用可定向例子标不可定向常数」的问题；剩下的是「局域系数通用于不可定向面」
    这一步无逐字论证（新 gaps 第一条）。
  - summary 的「比例常数…用球面标定」改写为原书三步，并补回 (5.3.21) 左端的 ½。
  - physical-argument 的理由改为 gaps (a)(b)(c)。

  **不要**把本卡与 v2 合并回一张「可定向或不可定向」的卡（那正是 v1 被换代的原因）：
  合并会让数学路线的 rigorous 上限被误加到不可定向支上。
