  - id: worldsheet.bc-ghost-number-anomaly-sphere
    inferred: true
    note: |
      **只作独立佐证，不是本推导的输入**（2026-09-11 改写，依 researcher E82 复核
      polchinski-1998-v1.md §16）：该节点用同一条鬼流非张量变换律 (2.5.17)|_{λ=2}
      在球面两片上算围道积分之差，得每个手征部门 3、合计 6，即 κ − μ = 6 = 3·χ(S₂)。
      **常数 3 在本推导里由 λ = 2 代入 (5.3.20) 得出，球面只是 (5.3.22)（n = 1，χ = 2）
      的一个实例**，不承担任何标定功能。
      标 inferred：原书 §5.3 在 pp.158–159 不回指 §6.3，这条对照是本图补的；
      该节点带勘误依赖（[S] 称印刷版 (6.3.6) 有误）。
      ⚠ 球面可定向，故对本卡（不可定向支）它连「范围内的检验点」都不是，只是同一反常系数的旁证。
