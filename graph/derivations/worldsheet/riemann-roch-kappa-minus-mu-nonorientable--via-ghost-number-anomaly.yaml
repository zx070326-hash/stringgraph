      ★ **该系数是承重的**（2026-09-11 订正）：结论里的常数 3 就是把 λ = 2 代进 (5.3.20) 的
      (2λ−1)/2 得到的 3/2 再乘以两个手征部门，**不是**用球面标定的；上游对该系数的保留
