      【2026-09-11 换代时新增的一条边（curator）】summary「第一级」一段里的
      (L_0 − a) L_{−1}|0;k⟩ = (α'k² + 1 − a) L_{−1}|0;k⟩ 这一步，正是该节点
      「L_0 在 level N 分量上是标量 α'k² + N 的乘法」在 N = 1 处的特例
      （Lean 侧 `Fock.sub_intercept_apply_of_mem_levelSubmodule` 一行调用
      `Fock.Lop_zero_apply_of_mem_levelSubmodule`）。
      来源侧同一步是 Polchinski (4.1.16)（已在本推导 sources 的 §4.1 区间内），
      故非 inferred。该节点 effective = formalized，此边不改变本推导的状态。
