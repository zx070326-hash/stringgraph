  - id: worldsheet.virasoro-algebra-v2
  - id: worldsheet.bc-ghost-central-charge
    inferred: true
    note: |
      本推导的目标陈述把鬼场中心荷**写死为 c^g = -26**（「{Q_B,Q_B} = Σ ((c^m - 26)/12)(m^3-m) c_{-m}c_m」
      里的那个 26 就是 -c^g），而 -26 不是本推导算出来的：它来自权 λ = 2 的 bc 系统的中心荷公式
      c^{bc} = -3(2λ-1)^2 + 1，即 worldsheet.bc-ghost-central-charge。
      标 inferred 的理由：本推导的来源位置（Polchinski §4.3，Q_B^2 的模式计算）**不**在原地论证
      c^g = -26，而是引用 §2.5 的 eq. (2.5.12)（式号经 schrans-2020 目录核实为
      `2.31 p 51: Eq. (2.5.12) The Ghost Central Charge`）。本图未核实 §4.3 是否显式回指 §2.5，
      故按项目规则（「每条边都要有来源，找不到就标 inferred」）标 inferred。
      另一条来源 fgz-1986 Proposition 2.1(i)（ρ(c) = -26 Id）**只**覆盖 λ = 2 这一情形，
      已同时挂在 bc-ghost-central-charge 上。
      有效状态不受影响：bc-ghost-central-charge 的有效状态是 physical-argument，
      与本推导自身的 physical-argument 相同。
      **本条边在 2026-09-11 的 v2 换代中保留**：v2 只删掉目标陈述的末句（c^m = D 那一步），
