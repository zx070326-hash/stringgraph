sources:
  - ref: polchinski-1998-v1
    loc: "§4.3：BRST 流 j_B = (4.3.3)、Q_B = (4.3.5)、{Q_B, b_m} = L^m_m + L^g_m = (4.3.6)、Q_B 的模式展开 (4.3.7)（末项 a^B(c_0 + c̃_0)，紧接一句 a^B = a^g = −1，依据 (4.3.8)）；**结论式 (4.3.9)**「{Q_B, Q_B} = 0 only if c^m = 26」；(4.3.10) 是 j_B j_B 的 OPE，其单极点给「when c^m = 26」的一半；最短推导用 Jacobi 恒等式，是**习题 4.3**（式号与内容 2026-09-11 经原书核实，抽取记录 polchinski-1998-v1.md §12.3）"
    note: |
      **【2026-09-11 原书核实订正】**本条此前写「约 eq. (4.3.2)–(4.3.6)，公式号为近似定位」——
      现落实：陈述式是 **(4.3.9)**，(4.3.2) 其实是规范固定项、(4.3.4) 是三条 OPE。
      原书对 (4.3.10) 的措辞逐字：「This requires a bit of calculation, being careful about minus
      signs from anticommutation. The single pole implies that {Q_B,Q_B} = 0 **when** c^m = 26.」
      即原书自己给出的是 ⟸ 方向的形式计算与 (4.3.9) 的 **only if** 断言。
      这仍是教科书式的形式模式计算：未声明受限模限制，未论证无穷模式和重排的合法性，
      也未写出 ⟹ 方向所需的线性无关（忠实性）前提；原书另在 p.133 对**一般**约束代数的幂零性
      逐字写「We have neglected central charge terms; these need to be checked by hand」。
  - ref: kato-ogawa-1983
    loc: "全文；摘要（L2）"
    note: |
      「Q_B^2 = 0 ⟹ D = 26 且 a = 1」的原始来源。**INSPIRE 记录 177600 的摘要，逐字**
      （primary-sources-round2.md §6，L2，分段以符合引用长度限制，段间无删节）：
        "Covariant canonical quantization of the bosonic string is performed, based on the BRS
         invariance principle." /
        "Defining a physical state by a modified form of Kugo-Ojima's subsidiary condition
         Q_B |phys⟩ = 0 ( Q_B = BRS charge), we prove a no-ghost theorem in a simple manner." /
        "There an interesting relation between critical dimension and BRS symmetry is noticed;
         namely, the conditions D = 26 and α_0 = 1 for the space-time dimension D and the
         zero-intercept α_0 of leading trajectory are required by the nilpotency Q_B² = 0 of
         the BRS charge." /
        "In addition, ghost number fractionization is observed in this system."
      **方向已由此确定为「⟹」**（"are **required by** the nilpotency"），反方向摘要中无陈述。
      摘要把 D = 26 与 α_0 = 1 一并归给 BRS 幂零性，与本项目「一个节点一个命题」的拆分不同
      （本推导只定 c^m = 26；连由 c^m = 26 到 D = 26 的换算也不在目标陈述内）。
      正文未获取（ScienceDirect 403），定理编号未核实。
      报告号 KUNS 637（INSPIRE，L2；检索后端 L4 对该归属有异议，未裁决）可作为找扫描件的钥匙。
      见 literature/extractions/primary-sources-round2.md §6 与 brst-cohomology-sources.md §6。
      ★★ **【2026-09-11 researcher 第七轮：三条本轮新增的 L3 与两条元数据订正】**
      见 literature/extractions/kato-ogawa-1983.md（§0.3 元数据、§2 E1、§4 Q1/Q5）。
      **(a) KUNS 637 归属的 L4 异议已关闭**：INSPIRE `raw_affiliation` 逐字
      「Department of Physics, Kyoto University, Kyoto 606, Japan」（两位作者同），
      INIS 单位字段同为「Kyoto Univ. (Japan). Dept. of Physics」⇒ KUNS（京都大学物理系
      预印本系列）归属成立。上一段末「检索后端 L4 对该归属有异议，未裁决」作废。
      另补 `preprint_date 1982-04`、`KEKSCAN 2000-33-955`、INIS issue 3 / 1983-02-28。
      **(b) ⟹ 方向得到一条同学派 L1 佐证**：Itō–Morozumi–Nojiri–Uehara 1986（PTP 75, 934）
      §1 p.934 逐字「They showed that a condition of nilpotency of the BRS charge **determines**
      the values of the critical dimension and the leading zero-intercept α₀ **simultaneously**.」
      **(c) ⟸ 方向仍然没有任何指向 KO 的 L1/L2 来源，且出现一条方向相反的现代转述**：
      Dedushenko 2015 §1 p.2 逐字「BRST quantization of the bosonic string theory was introduced
      in [1], where it was shown that **the string at the critical dimension (or when the total
      central charge vanishes) admits a BRST charge Q_B satisfying Q_B² = 0.**」——
      这是 ⟸ 方向的转述，但它是**二手**（[1] = KO），不能替 KO 正文作证。
      ⇒ 本卡「当且仅当」的 ⟸ 半边的可追溯性**不变**：只有 Polchinski §4.3 的形式计算
      （(4.3.10) 的 "when"）与更弱的独立节点 worldsheet.brst-nilpotent-at-c26。
      **(d) 一条旁证（推测，不得当依据）**：KO 同学派对 NSR 弦的同型论文 IMNU
      给出了 Q_B² 的**显式系数公式** (3.8)–(3.9)（L1），从其中各系数独立为零
      「⟺」一眼可见；若 KO 对玻色弦也给出同型显式公式（**未核实**），则 ⟺ 在 KO 正文里
      也是可见的，只是摘要没写。
      ⚠ **(e) 不得把 lian-zuckerman-1989 Proposition 1.7(ii)「Q² = 0 iff D = 10」当本卡的 iff 来源**：
      那是 **RNS 超弦**（super-Virasoro，c/8 归一化，ĉ = 10），且 LZ 自己**不证** (ii)
      （证明逐字「(ii) is done in [13, 15]」，[13] = ohta-1986、[15] = Terao–Uehara PLB 168B）。
      超弦一侧的对应节点是 worldsheet.critical-dimension-superstring-brst。
  - ref: fgz-1986
    loc: "Proposition 2.1(i)（鬼场表示中心荷 = -26；文中 c = 26 是假设而非结论）"
    note: |
      核实结果（全文五页逐页读毕，见 literature/extractions/brst-cohomology-sources.md §1.2）：
      FGZ **不**证明 Q^2 = 0 ⟺ c = 26。文中 Proposition 1.2 只有一句「d^2 = 0」，是一般分次李
      代数的陈述，前提 H^2(g) = 0、γ = 0 写在正文里，命题里既不出现 26 也不出现中心荷。
      26 出现在 Proposition 2.1(i)「ρ(c) = -26 Id」，那是**鬼场表示的中心荷**；
      紧接的正文写「from this point on we will assume that π(c) = 26 Id_V」——
      即 c^m = 26 在 FGZ 里是**假设**，不是结论。故本条只支持「鬼场中心荷 = -26」这一步。
summary: |
  {Q_B, Q_B} 的计算是模式代数中的形式代数计算：用 {b_k, c_n} = δ_{k+n,0} 与物质 Virasoro
  [L^m_k, L^m_n] = (k-n) L^m_{k+n} + (c^m/12) k(k^2-1) δ_{k+n,0} 展开，
  三次鬼场项与物质项的交叉贡献相消，只剩正比于总中心荷的项
  {Q_B, Q_B} = Σ_{m∈Z} ((c^m - 26)/12)(m^3 - m) c_{-m} c_m。
  由 c_{-m} c_m 的线性无关性得 Q_B^2 = 0 ⟺ c^m = 26。
  等价地：Q_B^2 = 0 ⟺ 总 Virasoro L_n = L^m_n + L^g_n + a^g δ_{n,0} 无中心扩张。
  （记号：c^m 是物质中心荷，c_n 是鬼场模式；沿用 worldsheet.brst-quantization-v2 的上标约定。）

  【状态说明】本推导（在旧 id worldsheet.critical-dimension-brst--via-nilpotency 下）原标 rigorous，
  依据是「FGZ 1986 与 Lian–Zuckerman 1989 把它当定理处理」。
  2026-09-10 的来源核实（literature/extractions/brst-cohomology-sources.md）推翻了这两条依据：
    - FGZ 1986 里**没有**「Q^2 = 0 ⟺ c = 26」型的编号陈述；c = 26 是该文的假设
      （§2.1「we will assume that π(c) = 26 Id_V」），Proposition 2.1(i) 只算出鬼场表示的中心荷 -26。
    - Lian–Zuckerman 1989 是 *BRST cohomology of the super-Virasoro algebras*，处理 RNS 超弦
      （临界值 ĉ = 10，即 c = 15），与玻色弦 c = 26 无关，原引用属**误引**，已删除。
  剩下的两条来源里，Polchinski §4.3 是教科书式形式模式计算，Kato–Ogawa 1983 是物理文献且正文未获取。
  按 docs/STATUS_LEVELS.md「不确定时选低的那级」，本推导降为 physical-argument。
  这不是说该计算有错——它在受限模上确实是有限代数计算——而是说**目前没有任何已核实的数学来源**
  可以支撑 rigorous 级别的可追溯性。

  【2026-09-10 第二轮核实：状态不变，但唯一的升级候选已排除】
  当时留下的首选升级候选 lian-zuckerman-1991（一般 Virasoro 的 BRST 上同调，CMP 135, 547–580）
  已全文核实（primary-sources-round2.md §1.4，L1，34 页逐页读毕），结论是**否定**的：
  该文同样**没有**「Q² = 0 ⟺ c = 26」型陈述——Proposition 1.11(i) 的 d² = 0 无条件成立且不含 26，
  26 只在 Proposition 3.3(iii) 以**单向**的 "if" 出现且属鬼系统一侧。
  与此同时，Kato–Ogawa 摘要的**方向已核实为「⟹」**（"are required by the nilpotency"），
  反方向无来源。两项都不改变本推导的 physical-argument 状态。
gaps:
  - "升级为 rigorous 仍**没有**可用来源。原先列为首选候选的 Lian–Zuckerman, *BRST cohomology and highest weight vectors I*, Commun. Math. Phys. 135 (1991) 547–580（bib key lian-zuckerman-1991）**已全文核实并排除**（primary-sources-round2.md §1.4，L1，34 页逐页读毕）：该文**没有**「Q² = 0 ⟺ c = 26」型编号陈述。Proposition 1.11(i) 的 d² = 0 对任意 V ∈ 𝒪 **无条件**成立，既不含中心荷条件也不含 26；26 在全文出现的**唯一**位置是 Proposition 3.3(iii)，且是**单向**的「(∧_∞𝒢, η) is a 𝒢-module **if** β̄ = −26z′ − L′₀」（该页做过单页重读复核，排印确为 if 不是 iff），并且那是**鬼系统一侧**的量。与 fgz-1986 同型：两篇数学侧文献都为 c = 26 **构造**相对复形，不**推导** c = 26。剩下的次选仍是 kato-ogawa-1983 正文（需绕过 ScienceDirect 403）；再次选是 thorn-1987（Nucl. Phys. B286, 61，摘要称含 BRST 荷 Q 的上同调计算，正文未获取）。"
  - "受限模假设已提升到陈述里，故不再是本推导的隐含缺口；但没有任何一条现有来源在受限模范畴中显式陈述并证明该幂零性判据，无穷模式和重排的合法性只在本项目的节点内部论证过。"
  - "kato-ogawa-1983 的定理编号仍未核实（正文未获取）；但**方向已核实为「⟹」**（primary-sources-round2.md §6，INSPIRE 逐字摘要）：原文写「the conditions D = 26 and α_0 = 1 for the space-time dimension D and the zero-intercept α_0 of leading trajectory are **required by** the nilpotency Q_B² = 0 of the BRS charge」，即 Q_B² = 0 ⟹ (D = 26 且 α_0 = 1)（必要性）。**反方向（c^m = 26 ⟹ Q_B² = 0）在该摘要中没有陈述**，目前只有 Polchinski §4.3 的形式计算支撑；而目标陈述写的是「当且仅当」。注：反方向本身另有一个更弱但独立的节点 worldsheet.brst-nilpotent-at-c26（FGZ Proposition 1.2）。"
  - "本推导给出的是幂零条件，不涉及 BRST 上同调与旧协变物理态空间的同构；后者见 worldsheet.brst-cohomology-equals-ocq-physical。"
  - "本推导只定出 c^m = 26，**既不定出 D = 26，也不定出开弦截距 a = 1**。由 c^m = 26 到 D = 26 需要 c^m = D（worldsheet.free-boson-central-charge-d），该步自 2026-09-11 的换代起不再属于本推导的目标陈述，而由汇总卡片 worldsheet.critical-dimension-bosonic-v2 的推导 --via-four-routes 显式供边；a = 1 由 worldsheet.open-string-intercept-v2 独立给出。注意 Kato–Ogawa 摘要把 D = 26 与 a = 1 一并归给 BRS 幂零性，与本项目「一个节点一个命题」的拆分不一致。"
  - "**「当且仅当」为什么不拆成两条推导（2026-09-11 curator 裁决，记账用）。**
     researcher 第七轮的建议是：既然 kato-ogawa-1983 摘要只覆盖 ⟹（逐字 required by），而 ⟸
     没有任何指向 KO 的 L1/L2 来源，就把本推导拆成 `Q²=0 ⟹ c^m=26`（挂 KO + Polchinski）与
     `c^m=26 ⟹ Q²=0`（只挂 Polchinski）两条。**本轮不拆**，理由三条：
     (1) 两个方向在来源里出自**同一个**形式计算（Polchinski §4.3 的 {Q_B,Q_B} 显式模式和：
         (4.3.9) 给 only if，(4.3.10) 的单极点给 when），拆开会把一段计算记成两段；
     (2) ⟸ 方向已另有一个更弱、来源更清楚的独立节点 worldsheet.brst-nilpotent-at-c26
         （fgz-1986 Proposition 1.2），图上已能分别记账；
     (3) 拆推导不改目标陈述的「当且仅当」，而真正的记账问题在陈述一侧——要分别记账须换代
         v3 拆陈述，那需要 lead 排期（已列入报告）。
     ⇒ **本条 gap 就是这个未拆的记录**：本推导对 ⟹ 的文献可追溯性（KO 摘要 L2 + IMNU 的
     「determines … simultaneously」L3）严格强于对 ⟸ 的（仅 Polchinski 的形式计算）。
     ⚠ 另记两条防误引：**lian-zuckerman-1989 Prop 1.7(ii) 的「iff D = 10」是 RNS 超弦，
     不是玻色弦**，且 LZ 自己把 (ii) 的证明外包给 ohta-1986 与 Terao–Uehara PLB 168B；
     **Dedushenko 2015 §1 p.2 对 KO 的转述是 ⟸ 方向**（「the string at the critical dimension …
     admits a BRST charge Q_B satisfying Q_B² = 0」），是二手转述，不能替 KO 正文作证。"
