id: worldsheet.central-charge-is-a-c-number--via-schwinger-term-section-3-4
target: worldsheet.central-charge-is-a-c-number
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.weyl-anomaly-central-charge-constant
    note: |
      提供 Wess–Zumino 相容性的结论：把 Weyl 反常的体项系数 a₁ 推广为局域函数 −C(σ)/12 后，
      两次 Weyl 变分的对称性强制 ∂^a C(σ) = 0（原书 (3.4.27)、(3.4.30)、(3.4.31) 及其后散文，p.96–97）。
      ⚠ 那张卡的 statement 把 ∂^a C = 0 写成「(3.4.31)」；按抽取记录 §12.2 的细化，(3.4.31) 本身是 ansatz
      T^a_a(σ) = −(𝒞(σ)/12)R(σ)，结论「𝒞 只能是数常数 c」是紧随其后的散文（p.97，无式号）。内容不受影响。
  - id: worldsheet.weyl-anomaly-trace
    note: |
      提供 Weyl 反常系数与 (2.4.24) 里的 𝒞 的认同：原书 (3.4.13) 处逐字「we use first the conformal
      transformation (2.4.24)」得 δ_W T_zz = −(c/6)∂²_z δω（(3.4.14)），再由 (3.4.15) c = −12a₁、
      T^a_a = −(c/12)R。即 §3.4 里被 Wess–Zumino 相容性钉成常数的 C(σ)，**就是** (2.4.24) 的反常系数 𝒞。
      没有这条认同，上一条边给出的只是「Weyl 反常系数是常数」，不是目标卡说的「(2.4.24) 的 𝒞 是常数」。
sources:
  - ref: polchinski-1998-v1
    loc: "§3.4, eq. (3.4.31), p.96–97（ansatz T^a_a(σ) = −(𝒞(σ)/12)R(σ)：「假设中心荷可以是局域算子」）与其后 p.97 散文（结论「𝒞(σ) 只能是数常数 c」，无式号）；(3.4.13)–(3.4.15), p.93（δ_W T_zz = −(c/6)∂²δω，c = −12a₁，T^a_a = −(c/12)R——把 Weyl 反常系数与 (2.4.24) 的 c 认同，(3.4.13) 处逐字「we use first the conformal transformation (2.4.24)」）"
    note: |
      【L1 式号，polchinski-1998-v1.md §12.2 表「E51/E52 §3.4 全部式号落实」（researcher 第六轮，原书页图）】
      (3.4.31) 的内容与地位（ansatz 而非结论）是该表的「⚠ 细化」条目；(3.4.13) 明写引用 (2.4.24) 是该表登记的
      「§2→§3 的一条明写依赖边」。Wess–Zumino 两次变分的式子是 (3.4.30)，结论 a₄ = 2a₁ 是紧接其后的散文。
      ⚠ 本推导 id 里的 "schwinger-term" 是 lead 派工指定的标签；内容是 Wess–Zumino 相容性
      （两次 Weyl 变分的对易性），原书 §3.4 不使用 "Schwinger term" 一词。
summary: |
  (1) 把 Weyl 反常写成允许局域系数的 ansatz T^a_a(σ) = −(𝒞(σ)/12)R(σ)（(3.4.31)）。
  (2) Weyl 变换互相对易，故 δ_{W(ω₁)}δ_{W(ω₂)} ln Z 关于 ω₁ ↔ ω₂ 对称（Wess–Zumino 相容性，(3.4.30)）；
      把 (1) 代入，反对称部分出现正比于 ∂^a 𝒞 的项，无法被其它项抵消，故 ∂^a 𝒞(σ) = 0，
      原书随后（p.97 散文）说 𝒞 只能是数常数 c——这一步由 worldsheet.weyl-anomaly-central-charge-constant 承载。
  (3) 认同：§3.4 的 c 就是 (2.4.24) 的 c——原书在 (3.4.13) 明写用 (2.4.24) 的共形变换算出 δ_W T_zz = −(c/6)∂²δω，
      再由 (3.4.15) c = −12a₁。故 (2) 钉住的常数正是目标卡里 (2.4.24) 的反常系数 𝒞。
  (2)+(3) 给目标卡的 (a)；「数常数」的结论 (b) 在这条路线里是 p.97 散文的断言。
gaps:
  - |
    **继承 worldsheet.weyl-anomaly-central-charge-constant--via-wess-zumino 的全部缺口**：
    ⟨T^a_a⟩ 的局域形式来自局域性 + 量纲分析（未独立论证）；Wess–Zumino 相容性施加在未定义的泛函 ln Z[g] 上，
    整步是形式操作。
  - |
    **「𝒞 与位置无关 ⇒ 𝒞 是数（而非与位置无关的算子）」在这条路线里只是 p.97 的散文断言**：
    §3.4 不重复脚注 5 的局域性论证，也不给别的理由。严格说，Wess–Zumino 路线证到的是目标卡的 (a)；
    (b) 要么回借 --via-locality-footnote-5，要么当作 §3.4 的断言。这是本推导比另一条弱的地方。
  - |
    **认同步骤 (3) 依赖 weyl-anomaly-trace 的单圈计算**（(3.4.13)–(3.4.15)），该推导自身的 −c/12 系数
    本图未独立核实；但本推导只用「§3.4 的 c 与 (2.4.24) 的 c 是同一个符号所指」这一事实，
    不用系数的具体值。
notes: |
  由 curator-small-backlog-5 于 2026-09-11 建立，作为目标卡的**第二条独立推导**
  （researcher §17.5 建议 2 逐字：「与 §3.4 (3.4.31) 的 WZ 相容性论证是两条独立 derivation，挂同一张卡」）。

  **为什么不直接把 worldsheet.weyl-anomaly-central-charge-constant 当作目标卡**：那张卡的结论对象是
  Weyl 反常的系数 C(σ)，目标卡的结论对象是 (2.4.24) 的 𝒞；两者的认同需要 (3.4.13)–(3.4.15)，
  是一条实质的边（本推导的第二条 depends_on），不是同义反复。原书自己也是两处分开写的（§2.4 与 §3.4）。

  **id 标签说明**：lead 派工指定 `--via-schwinger-term-section-3-4`；内容是 §3.4 的 Wess–Zumino 相容性，
  原书不用 "Schwinger term" 这个词。
