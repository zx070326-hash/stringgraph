      **非 inferred**：该结果已单列节点（Polchinski §1.3，A 的定义式 **(1.3.31)**、ζ 正规化 (1.3.32)、
      结果 **(1.3.35)** `A = (2−D)/24`，式号 2026-09-11 经原书核实落实），已列入本推导 sources 的
      §1.3 条目，故这条边有来源支撑。
    convention_map: |
