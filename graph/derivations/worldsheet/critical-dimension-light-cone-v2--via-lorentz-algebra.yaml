    note: GSW 用 mostly-minus 号差与 α' = 1/2 归一化；Δ_n 的形式不受影响，整体因子已按 conv.alpha-prime-regge 转写。
  - ref: polchinski-1998-v1
    loc: "§1.3：正规序常数 A 的定义与 ζ 正规化 eq. **(1.3.31)–(1.3.35)**、质量壳 **(1.3.36)**、level 1 质量 (1.3.39)、结论式 **(1.3.40)**, p.23（逐字 `A = −1 , D = 26`；式号与内容均已核实，抽取记录 polchinski-1998-v1.md §12.5 / E18 / Q2）"
