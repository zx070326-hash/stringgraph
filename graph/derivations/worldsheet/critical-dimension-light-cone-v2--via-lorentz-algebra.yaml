      因此：
        · 本边**不是**目标陈述的前提，删掉它不会削弱 summary 第一段的论证，也不改变目标陈述的内容；
        · 保留它是因为 summary 第二段确实断言了「ζ 值配 a = 1 同样给 D = 26」，那句话需要这条边；
        · 下游**不得**据本边推断「(I) 路线共享 ζ 正规化处方」——ms.critical-dimension-bosonic 的
