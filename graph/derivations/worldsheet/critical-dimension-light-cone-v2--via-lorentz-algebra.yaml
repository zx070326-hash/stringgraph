      这条边**只服务于 summary 第二段**（Polchinski §1.3 正文的那条形状：先把 ζ 正规化值
      a = (D−2)/24 代进去，则 Δ_n 退化为 n(26−D)/12，闭合 ⟺ D = 26，而 a = 1 成为随之而来的
      推论）。**目标陈述与本推导的主论证不用它**：目标卡把正规序常数 a 当作 Δ_n 中的**待定参数**，
