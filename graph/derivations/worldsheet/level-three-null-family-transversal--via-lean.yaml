summary: |
  三步纯振子代数论证（详见目标卡 statement 的【机制】段与 sources.loc 的逐步复述）：
  (1) 用 A_ε(3) 系数消去 φ 贡献，得 A_ε(2)φ 与 A_ε(1)e 的一条线性关系；
  (2) 反对称化 A_ε(2)A_δ(1) − A_δ(2)A_ε(1) 作用两次并用模的对易性消去 φ，
      得 (ε·p_j)(δ·e) = (δ·p_j)(ε·e)；
  (3) 取 ε := p_j 用 p_j·p_j ≠ 0 与 hη 逐分量得 e = 0；代回原方程用
      towerLop_neg_one_injective 得 φ = 0。
gaps:
