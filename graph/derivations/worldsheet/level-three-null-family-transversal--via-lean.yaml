    （目标卡【本卡明确不断言】(c) 已声明范围只到 level-3 反对角片专属的具体系数）；
    level-4 起需要新的系数组合，估计 ~350-450 行 Lean，是 formal/TODO.md
    `noghost-pr8` (a) 的内容，未来工作。
notes: |
