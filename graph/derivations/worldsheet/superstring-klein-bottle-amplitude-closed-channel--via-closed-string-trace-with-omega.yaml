notes: |
  ★★【本推导把 tadpole 推导里 Klein 那一支的悬空合上（curator，2026-09-11，klein-mobius）】
  在此之前 (10.8.7)–(10.8.11) 只活在
  worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences 的 summary 第 (2) 步
  （逐字只有一行「Klein 瓶 K₂：Z_{K₂,0} ∝ 2^10，Z_{K₂,1} = −Z_{K₂,0}」），
  且那条推导的 gaps 明记「Klein 瓶 (10.8.7)–(10.8.11) 与 Möbius 带 (10.8.12)–(10.8.18)
  两支仍无节点 … 在图上仍悬空」。本卡建立后，那条推导加一条**非 inferred** 边指向本卡的目标，
  该 gap 的 Klein 半关闭。

  【与圆柱那一支的一处实质差别（不要互相套用）】
  · 圆柱：按**迹里是否出现 exp(πiF)** 分 NS–NS / R–R（#E65）；
  · Klein 瓶：按**在 σ² → σ² + 4πt 下是否反周期**分，对应权重 Ω exp(πiF) 或 Ω exp(πiF̃)（#E69）；
  · Möbius 带：**迹的 R 扇区**对应 R–R 交换、NS 扇区对应 NS–NS 交换（#E71，
    抽取记录特别标注「**注意这与圆柱相反**」）。
  三条判据各不相同，转卡时必须分别照录。

  【本卡的 2¹⁰ 是 §0.4(a) 交叉核验的三个输入之一】抽取记录把圆柱的 −n²、本卡的 −2¹⁰、
  Möbius 的 ±2n·2⁵ 相加得 −(n ∓ 32)²（2¹⁰ = 32²），从而独立验证了 (10.8.2)/(10.8.11)/(10.8.18)/(10.8.19)
  四式的系数彼此自洽。⚠ 但那次核验**不**验证两个整体符号（见 gaps 第一条），
  也**不**验证 (10.8.19) 里 ∓ 的整体符号（原书自承 'This calculation does not determine the sign'）。

