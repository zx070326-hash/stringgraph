summary: |
  **原书的四步（每一步都逐字可核）**：

  1. **写下投影算符与迹的插入**：Klein 瓶上 GSO 投影是 (10.8.7)
     [(1+exp(πiF))/2]·[(1+exp(πiF̃))/2]，无取向投影再给一个 ½；测度取 dt/**8**t
     （GSO 与 Ω 各一个 ½，原书 p.38 明写）。在迹里插入 R = Ω exp(πiβF + πiβ̃F̃)。
     玻色部门直接取 Vol.1 (7.4.15) 换到十维（原书逐字）。
  2. **由边界条件读出扇区归属**：(10.8.8a,b) 给出 ψ、ψ̃ 在 σ² 方向平移 2πt 时被 Ω 交换并带相位，
     迭代一次得 (10.8.9) ψ(w+4πit) = exp[πi(β+β̃)]ψ(w)。于是**在 σ² → σ² + 4πt 下反周期**
     的扇区（即权重 Ω exp(πiF) 或 Ω exp(πiF̃) 的两项，**两者相等**）给出 **NS–NS 交换**。
     ★ 这个**识别**与圆柱那一支（按迹里是否出现 exp(πiF) 分）是**不同的判据**，
     本卡与圆柱卡因此不能互相套用。
  3. **算两个分迹**：只有 ψ 与 ψ̃ 激发相同的态对含 Ω 的迹有贡献（脚注 8），
     得 (10.8.10a) 的 q^{−1/3}∏(1+q^{2m−1})⁸ = Z⁰₀(2it)⁴ 与
     (10.8.10b) 的 −16q^{2/3}∏(1+q^{2m})⁸ = −Z¹₀(2it)⁴，q = exp(−2πt)。
     ⚠ **两个整体符号不是这里算出来的**：+ 由引力子定、− 由 (10.6.17) 定（脚注 8 逐字）。
  4. **换通道并取长柱极限**：合成 (10.8.11) 第一行；用模变换并令 **s = π/2t** 得第二行；
     s → ∞ 展开得第三行 **i(2¹⁰V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(e^{−2s})]**。
     ⚠ **原书在这一步直接写等号**，不重述 (10.8.3)、不写换元过程（见 gaps 第二条）；
     前缀 (8π²α')⁵ 的闭合已由抽取者独立复算（§0.4(b)）。

  **为什么标 physical-argument（三条，按弱到强排）**：
  (1) **两个迹的整体符号靠物理输入**（引力子 + (10.6.17) 的论证），不是本处计算的产物
      ——抽取记录把这一条单独标出为「『实话实说』原则下必须记的一处」；
  (2) **第 4 步的模变换链原书不写**，本图也未展开；且所用的 (10.8.3) 第二式带 **naive** 限定
      （§10.7 (10.7.14)：纯左移费米子的路径积分相位没有 diff 不变的定义）；
  (3) 整个对象是单圈路径积分 / 迹的形式计算，上游（玻色 Klein 瓶振幅本身在 Vol.1 正文里
      就没有推导，被留作习题 7.13；Ω 与 GSO 的投影）都在路径积分层面。
  ⚠ 本推导里**最硬**的一环是第 4 步前缀的复算（有限步初等计算，抽取记录 §0.4(b) 已闭合并与
  Vol.1 (7.4.19) 对照），但它只保证 (10.8.11) 三行彼此自洽，**不提升**第 1–3 步。
  故整体 physical-argument，与圆柱卡
  worldsheet.superstring-cylinder-amplitude-closed-channel-v2--via-open-string-trace-doubling 口径一致。
