id: worldsheet.ddf-transverse-oscillator-algebra-v2--via-lean
target: worldsheet.ddf-transverse-oscillator-algebra-v2
kind: proof
status: formalized
depends_on:
  - id: worldsheet.ddf-operators-v6
    inferred: false
    note: |
      **被断言对易关系的那两个算子本身**：该卡的 formal.lean_decl
      `StringFormal.NoGhost.ddfOp` 就是本推导里的 A^ε_m 与 A^δ_n，
      模态和 A^ε_n = Σ_j (ε·α_j) V^{(n)}_j 是它的定义式，横向性 ε·k_0 = 0
      （`hεb : dotVec η ε b = 0`）是它的**定义参数**。
      本推导用 `ddfOp_apply`（「任意够大的窗口都算得对」）把两个算子各展成有限和。
      ⚠ 该卡是 formalized 定义卡，这条边不压低本推导状态。
      ⚠ **量词对照**：Lean 的 `ddfOp` 对一切 n ∈ ℤ（含 0）有定义，本目标卡写的是
      m, n ∈ Z\{0}；本推导证的是更强的 ∀ m,n ∈ ℤ，特例化到 m,n ≠ 0 即目标。
      按该卡【Lean 比本卡更一般的三处】(2) 的要求，**不**把本目标卡的量词自动放宽。
  - id: worldsheet.ddf-transversality-gives-local-finiteness-v2
    inferred: false
    note: |
      **使两个模态和都是有限和**，从而二重和可以逐项重排。Lean 侧本推导直接调用该卡的
      formal.lean_decl `StringFormal.NoGhost.ddfSummand_apply_eq_zero_of_notMem_window`，
      并用它三次：(i) 内层算子在 x 上的窗口；(ii) 外层算子在**每个**内层结果
      α^δ_l V^{(n)}_l x 上的窗口（取 `Finset.biUnion`，见 summary 第 3 段）；
      (iii) 把两种乘积顺序放到**同一个**指标集 U 上。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
  - id: worldsheet.isotropic-tower-vertex-operators-commute
    inferred: false
    note: |
      **本推导中 k_0² = 0 的第一处承重**：把反序乘积里的 V^{(n)}_l V^{(m)}_j 换成
      V^{(m)}_j V^{(n)}_l，两种顺序才能逐项相减。Lean 侧逐字调用该卡的 formal.lean_decl
      `StringFormal.NoGhost.towerVertex_comm_of_isotropic`。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
      ⚠ 该卡自己记载：k_0² ≠ 0 时结论**假**（单值因子 (w/z)^{mn k_0²} ≠ 1），
      故这条边不可去。
  - id: worldsheet.momentum-tower-fock-space
    inferred: false
    note: |
      **承载断言的空间**。A^ε_m 与 A^δ_n 各自跨层（+m、+n），只有在塔
      T(p;k_0) = ⊕_N F(p+N k_0) 上两者的复合才有意义；该卡的 formal.lean_decl 给出
      `TowerFock D R` 与逐层作用的 α^μ_p（`towerMode`）。
      本推导**不**用该卡的双线性型（层间正交那条约定）——对易关系是纯算子等式，
      与配对无关。⚠ 该卡是 formalized 定义卡，不压低本推导状态。
  - id: worldsheet.bosonic-fock-space
    inferred: false
    note: |
      **中心项的来源**：振子代数 [α^μ_m, α^ν_p] = m η^{μν} δ_{m+p,0}。
      本推导把它逐层提升到塔上（Lean 侧新证的 `lie_towerMode_towerMode`），
      再对偏振指标收缩两次得 `lie_towerModeVec_towerModeVec`：
      [α^ε_j, α^δ_l] = j (ε·δ) δ_{j+l,0}。
      ⚠ Lean 侧被调用的具体声明是 `StringFormal.NoGhost.Fock.lie_mode_mode`
      （**含零模、对一切 m,p ∈ ℤ** 的版本），它登记在
      worldsheet.virasoro-generators-free-boson 的 stringformal-2026 source 里，
      而本卡登记的是产生/湮灭分块版 `lie_annihilation_creation` 等。两条边都列上。
      ⚠ 该卡是 formalized 定义卡，不压低本推导状态。
  - id: worldsheet.virasoro-generators-free-boson
    inferred: false
    note: |
      只为上一条边里的 `Fock.lie_mode_mode` 提供图上的落点（该声明列在这张卡的
      stringformal-2026 source 中，不在 worldsheet.bosonic-fock-space 里）。
      本推导**不**使用 L_m 本身，也不使用中心荷 c = D。
      若 curator 认为「全模态振子代数」应当单列成卡，这条边应改指那张新卡。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/NoGhost/DDFAlgebra.lean :: StringFormal.NoGhost.lie_ddfOp_ddfOp；辅助 StringFormal.NoGhost.{lie_towerMode_towerMode, lie_towerModeVec_towerModeVec, ddfOp_mul_ddfOp_apply}；三块输入 VertexCommute.lean :: towerVertex_comm_of_isotropic、VertexProduct.lean :: sum_towerVertex_towerVertex_of_isotropic、VertexWeightedSum.lean :: sum_weighted_towerVertex_towerVertex；算子与窗口 DDFOperator.lean :: {ddfOp, ddfOp_apply, ddfSummand, ddfWindow, ddfSummand_apply_eq_zero_of_notMem_window, towerModeVec, towerModeVec_mul_towerVertex_of_transverse}"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，`lake build` 全量通过，无 sorry；
      四条声明 `lake env lean --run scripts/check_axioms.lean --all` 全 `ok`
