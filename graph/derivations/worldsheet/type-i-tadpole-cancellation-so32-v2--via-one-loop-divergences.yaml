summary: |
  按三个拓扑分别算长柱极限的发散，再相加：
  (1) 柱面 C₂：Z_{C₂} = Z_{C₂,0} + Z_{C₂,1}（NS–NS 与 R–R 交换）；
      模变换后 Z_{C₂,0} ∝ n² ∫ds[16 + …]，发散来自 s → ∞ 的无质量闭弦 tadpole；
      Z_{C₂,1} 有等值反号的发散。
      ★ **这一步自 2026-09-11 起由独立卡承担**：
      worldsheet.superstring-cylinder-amplitude-closed-channel-v2（(10.8.1)–(10.8.4) 全部，
      含前缀与 [16 + O(e^{−2s})]）。本推导 depends_on 它（非 inferred），不再自己重算。
  (2) Klein 瓶 K₂：Z_{K₂,0} ∝ 2^10，Z_{K₂,1} = −Z_{K₂,0}。
      ★ **这一步自 2026-09-11 起由独立卡承担**：
      worldsheet.superstring-klein-bottle-amplitude-closed-channel（(10.8.7)–(10.8.11) 全部，
      含系数 2¹⁰、前缀与 [16 + O(e^{−2s})]）。本推导 depends_on 它（非 inferred），不再自己重算。
      ⚠ 那张卡只断言 **NS–NS** 侧 Z_{K₂,0}；这里用到的 Z_{K₂,1} = −Z_{K₂,0} 属 §10.7 的超对称
      论证，**不在那张卡的断言里**（见 gaps）。
  (3) Möbius 带 M₂：Z_{M₂,1} ∝ ±2n·2^5（上号 SO(n)）。
      ★ **这一步自 2026-09-11 起由独立卡承担**：
      worldsheet.superstring-mobius-strip-amplitude-closed-channel（(10.8.16)–(10.8.18) 全部，
      含 ±2n·2⁵、'the upper sign is for SO(n)' 与前缀）。本推导 depends_on 它（非 inferred），
      不再自己重算。
      ⚠ 那张卡直接给的就是 **R–R** 侧（原书在 Möbius 处只算 R–R），与 (1)(2) 两支不对称。
  (4) 相加 R–R 部分：n² ∓ 2·32·n + 32² = (n ∓ 32)²，即 (10.8.19)。
      三个拓扑的公因子是 V_10/(8π(8π²α')⁵)·∫ds[16 + O(e^{−2s})]（α' 的幂次见目标卡片
      notes 的【v2 改了什么】：页图上的 (8π²α'²)⁵ 是误读）。
      故 R–R tadpole 为零 ⟺ n = 32 且取正交投影 ⟺ 规范群 SO(32)。
  (5) 为什么这是真正的不一致：发散对应 10-形式势 C_10 的 tadpole，
      C_10 无动能项 ⟹ 传播子 1/0 ⟹ 发散 μ_10²/0；C_10 的运动方程就是 μ_10 = 0，
      **不能**用背景场的修正吸收。
  (6) 脚注 7：不能只要求每个拓扑的 NS–NS + R–R 之和为零（超对称已保证这一点），
      必须要求两者**各自**在拓扑求和后为零。

  【status 的理由（四条）】
  (1) C_10 那一步原书自称是「猜」，所谓的 'more detailed analysis' 不给；
  (2) tadpole 的整体符号未由计算定出（原书自承 'This calculation does not determine the sign'）；
  (3) 三个面各自的计算虽已各有卡（2026-09-11 起），但**那三张卡自身都是 physical-argument**：
      圆柱是「直接写下」的拼装、Klein 瓶两个迹的整体符号靠物理输入（脚注 8）、
      三张卡的换通道步骤原书都不写（只有圆柱与 Klein 瓶的前缀被抽取者复算过）；
      ⚠ 本条替换了旧版的「本图没有 Vol.1 §7.4 的单圈振幅节点，计算链大部分在图上悬空」
      ——那句话已随三张卡的建立作废（见 gaps 里相应那条的更新）；
  (4) 整个计算是路径积分/模变换层面的形式操作。
