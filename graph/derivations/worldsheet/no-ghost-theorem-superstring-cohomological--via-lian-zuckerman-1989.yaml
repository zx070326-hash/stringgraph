     本推导用 LZ p.306 (7) 的 T₀ ⊕ T₁ 见证；FOK 1989 与 IMNU 1986 用的是 C[γ₀]（单个
     Bose-sea charge，FOK 称 'Henneaux 表示'）。**LZ 的 T₀ ⊕ T₁ 与 C[γ₀] 给出的相对上同调
     是否同构，本图未核实**：FOK (5.1) 只证了它自己的两种表示（Schrödinger 与 Henneaux）
     同构，且逐字限定 'the isomorphism is only an isomorphism of **ungraded** vector spaces'。
     ⇒ 若日后要把断言 (2) 从存在量词升为「对一切可接受表示」，本推导不够。"
  - "**消灭定理（Theorem 2.4）在本图没有独立陈述卡。** 它是本推导的核心步骤、也是 LZ 自评
