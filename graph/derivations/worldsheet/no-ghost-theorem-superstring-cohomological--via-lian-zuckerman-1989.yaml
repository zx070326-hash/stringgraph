notes: |
  【本推导与 --via-figueroa-ofarrill-kimura-1989 是**独立**的两条】
  两篇互不引用：LZ p.335 **Note added in proof** 逐字 'After the completion of this work, we
  received preprints from J. Figueroa-O'Farrill and T. Kimura, whose work appears to be similar
  to ours.'；FOK 的参考文献里没有 Lian–Zuckerman（只有 14 条，引 Henneaux [12]、
  Spiegelglas [3]、FGZ [1]、Brower–Friedman [11]）。
  ⇒ 两条推导在图上并列**不是重复记账**，是两个独立证明。

  【两篇的方法差别（也是本图取 LZ 作 rigorous、FOK 作 physical-argument 的根据之一）】
    - LZ 用 **V(p,κ) 的 Vir_κ^- 自由性**（Corollary 2.19(iii)），并在 p.320 Remark 明确指出
      **V(p,κ) 一般不是 Verma 模的直和**（用 Kac 行列式给出 NS 扇区反例）；
    - FOK 却把"Brower–Friedman 证明了完全可约性 ⇒ Verma 模的无穷直和"当作出发点，
      并以此逐 Verma 模算上同调。**两篇在这一点上直接矛盾**，详见
      --via-figueroa-ofarrill-kimura-1989 的 gaps 第一条。

  【与本图玻色弦一侧的对应】
    LZ 1989 : 超弦  ::  fgz-1986 / lian-zuckerman-1991 : 玻色弦。
    Theorem 2.4  ↔ FGZ Theorem 2.7(i)（消灭定理）
    Corollary 2.15(ii) ↔ FGZ Theorem 2.8 的"正定"部分
    Theorem 2.20 ↔ FGZ Theorem 2.8 的两个酉同构
      （本图：worldsheet.brst-cohomology-equals-ocq-physical-superstring）

  按 researcher 第七轮抽取记录 literature/extractions/lian-zuckerman-1989.md
  （E3/E4/E5/E6/E7/E8、§4 Q1–Q4、§5）建立。curator，2026-09-11。
