  - "**Proposition 1.7(ii)（Q² = 0 iff D = 10）的证明在 LZ 是外包的**：逐字 '(ii) is done in
     [13, 15].'（[13] = ohta-1986，正文本图未取得；[15] = Terao–Uehara, Phys. Lett. 168B
     (1986) 70，**本图连 bib 都未登记**）。故「上同调有定义」这一前提的可追溯性止于
     ito-morozumi-nojiri-uehara-1986 (3.8)–(3.10) 的显式系数公式（L1，但那是物理侧的形式计算）。"
  - "**LZ 的动量假设：半空间 {p^D > 0}，非本质前提（已裁决，auditor 2026-09-11）**。
     p.305 Remark 逐字 'For convenience, we will assume that p is always in the future half
     R^{D−1,1}_+ of R^{D−1,1}, i.e. R^{D−1,1}_+ = {p ∈ R^{D−1,1}: p^D > 0}.'——⚠ 那是**半空间**，
