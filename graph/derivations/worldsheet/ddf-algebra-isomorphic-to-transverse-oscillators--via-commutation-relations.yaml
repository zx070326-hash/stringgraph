  「承载的是**比较那一句**，不是主对易关系」——本推导就是那条边搬家后的正式落点，
  且在这里它**不再是 inferred**：比较就是论证内容。

  **status 定级理由（status = 自身论证的严格程度）**：论证是一步有限的线性代数，
  但 docs/STATUS_LEVELS.md 的 rigorous 例外条款要求「前提已完整写出」且
  **reviewer 已独立复核并在本 notes 记 `reviewer-verified: <agent>, <date>`**。
  两条都不满足：本推导**无 reviewer-verified 记录**，且前提之一（两侧生成元线性无关）
  在文献与本图中都没有承载（gaps 第 1 条）。故 **physical-argument**。
  ⚠ 即使日后补齐线性无关并由 reviewer 复核而升到 rigorous，目标的 **effective 仍是
  physical-argument**：依赖 worldsheet.transverse-oscillator-commutators 自身就是
  physical-argument。本命题是关于光锥横向振子代数的断言，这个上限是**本质的**，
  不是记账问题——这也正是把它与对易关系拆开的理由：
  v2（对易关系）因此得以走 G–N 的 rigorous 路线，不再被这条光锥链拖住。

  **reviewer 若要复核升级，需要检查的清单**：
  (1) 两侧生成元线性无关（gaps 第 1 条，建议先立卡）；
  (2) 两侧归一化的对接（gaps 第 3 条）——特别是本图 ∂X^i 与 G–N 的 ξ(z) 之间无额外常数这一推断；
  (3) 第 2 步「只需在生成元对上验证」的理由（双线性 + 1 为中心元）是否写全；
  (4) 目标陈述的范围限定 (i)(ii)(iii) 是否确实排除了表示层面的一切断言。

  **不碰的东西**：不改 worldsheet.transverse-oscillator-commutators 及其推导（另有持有人）、
