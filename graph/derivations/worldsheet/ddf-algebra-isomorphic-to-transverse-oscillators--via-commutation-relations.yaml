summary: |
  **一步线性代数：两套生成元的对易关系逐字相同，故生成元对应的线性映射是李代数同构。**

  第 1 步（两侧各自是李代数）。
    · 左侧：由 worldsheet.ddf-transverse-oscillator-algebra-v2，
      [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}，右端是恒等算子的 c-数倍（在扇区 {p : k_0·p ≠ 0} 的
      整条动量塔上为常数——这正是归一化 2α' k_0·p = 1 与 k_0² = 0 的作用，见该命题末段）。
      故 𝔞_DDF := span{A^i_n} ⊕ C·1 在对易子下封闭，是一份以 1 为中心元的李代数。
    · 右侧：由 worldsheet.transverse-oscillator-commutators，
      [α^i_m, α^j_n] = m δ^{ij} δ_{m+n,0}，同理 𝔞_⊥ := span{α^i_n} ⊕ C·1 是李代数。
    两侧的指标集合逐字相同：i, j = 2..D-1（共 D−2 个横向方向），m, n ∈ Z \ {0}。

  第 2 步（定义 Φ 并验证保括号）。令 Φ(A^i_n) := α^i_n、Φ(1) := 1 并线性扩张。
  李括号是双线性的、1 是两侧的中心元，故只需在生成元对上验证：
    Φ([A^i_m, A^j_n]) = Φ(m δ^{ij} δ_{m+n,0} · 1) = m δ^{ij} δ_{m+n,0} · 1 = [α^i_m, α^j_n]
                      = [Φ(A^i_m), Φ(A^j_n)]。
  **结构系数逐字相同**（同一个 m δ^{ij} δ_{m+n,0}，不是"相差一个归一化常数"），这是 Φ 存在的全部内容。

  第 3 步（双射）。Φ 在生成元上一一对应、在中心元上是恒等，故只要**两侧的生成元各自线性无关**，
  Φ 就是线性同构，从而是李代数同构。两侧的线性无关性在文献里都没人写，本图也没有节点承载：
  见 gaps 第 1 条（这是本推导不标 rigorous 的两个理由之一）。

  结论即目标陈述：𝔞_DDF ≅ 𝔞_⊥ 是同一份 (D−2) 重横向自由玻色（Heisenberg）振子代数的两个实现。
  文献侧的对应措辞：G–N p. 594「realize **precisely** the algebra of d − 2 transversal oscillators」、
  Goddard 2008 p. 11「**behave like** annihilation and creation operators」、
  GSW §2.3.3「即一个 D-2 维横向自由振子代数」。

  **本推导到此为止。** 表示层面（横向 DDF Fock 空间 H^⊥(k) 与光锥横向 Fock 空间的**等距**同构）
  不在覆盖范围：那还需要 (A^i_n)† = A^i_{−n}（worldsheet.ddf-operators-adjoint）与真空归一化，
  Gram 矩阵记账在 worldsheet.transverse-ddf-fock-gram-matrix。见 gaps 第 4 条。
gaps:
  - |
    **两侧生成元的线性无关性没有来源、也没有节点。** 第 3 步需要它（否则 Φ 只是满射的李代数同态，
    不是同构）。两侧各自的情况：
    · 右侧（α^i_n）：标准结论，由横向 Fock 空间上的正定内积即得
      （worldsheet.transverse-oscillator-commutators 的 statement 已写「内积正定」），但"正定 ⟹ 生成元线性无关"
      这一步本图没有写出来。
    · 左侧（A^i_n）：可由 H^⊥(k) 上 Gram 矩阵非退化得到
      （worldsheet.transverse-ddf-fock-gram-matrix 的对角元 ∏ n^{d} d! ≠ 0），
      但那张卡是**条件命题**，其假设 (H1) 正是 worldsheet.ddf-transverse-oscillator-algebra-v2、
      (H2) 是 worldsheet.ddf-operators-adjoint（physical-argument）。
      把它加为本推导的依赖会把一条**只需代数**的论证挂到伴随关系那条更弱的链上，
      且文献侧（G–N / Goddard / GSW）三处都不讨论线性无关，故此处**登记为 gap 而不加边**。
      若 reviewer 要求按 docs/STATUS_LEVELS.md 的 rigorous 例外升级本推导，这一条必须先补成节点。
  - |
    **三处文献来源都只给「措辞性识别」，没有一处写出同构映射或验证它。**
    G–N p. 594 的「realize precisely the algebra of d − 2 transversal oscillators」是 (3.4) 之后的
    正文句子，**无编号**；goddard-2008 的「behave like annihilation and creation operators」是
    无证明的历史叙述（且作者把 (5.5) 归给正文未获取的 Brower–Goddard [43]/[44]）；
    GSW §2.3.3 的「即一个 D-2 维横向自由振子代数」式号与正文均 L0。
    按 docs/STATUS_LEVELS.md「断言 + 骨架」档位，这类来源给 **physical-argument**，不给 conjecture：
    结论本身在文献中无争议，缺的是论证的完整性。
  - |
    **两侧的「m δ^{ij}」数值相同依赖两套归一化，而两套归一化的对接在本图里不是逐字的。**
    左侧：一般 α' 下的 (★) 2α' k_0·p = 1 与 ∂X^i 的归一化——G–N ↔ 本图的字典是**本项目推断**
    （worldsheet.ddf-transverse-oscillator-algebra-v2--via-zero-mode-bracket 的 gaps 第 4 条逐字：
    「若本图的 ∂X^i 归一化与 ξ(z) 相差常数 c，右端会变成 c² m δ^{ij}」）。
    右侧：开弦模式展开的归一化，受 conv.worldsheet-coordinate-length 与 conv.alpha-prime-regge 约束。
    三家文献（GSW、Goddard、G–N）都在 α' = 1/2 或格点单位下工作。
    **若两侧的归一化各差一个常数，Φ 仍是同构，但不再是"生成元对生成元"的那一个**
    （要插入重标定因子）；本推导断言的是前者，故这条 gap 是实质的。
  - |
    **不覆盖表示层面。** 本推导只给李代数同构，**不**给 H^⊥(k) 与光锥横向 Fock 空间之间的
    等距同构（那需要伴随关系 + 真空归一化，见 worldsheet.ddf-operators-adjoint 与
    worldsheet.transverse-ddf-fock-gram-matrix），也不给两个空间之间任何具体的映射。
    worldsheet.no-ghost-theorem-v4 第 (1b) 条的「等距同构」不靠本推导（v4 的 H^⊥(k) 是用 DDF
    振子定义的，陈述从不声称它与光锥 Fock 空间同构）；这一点已写进
    worldsheet.no-ghost-theorem-v4--via-goddard-thorn 的 depends_on note。
  - |
    **不覆盖零模、纵向方向与厄米结构**：n = 0（α^i_0 = (2α')^{1/2} p^i 与 x^i）不在两侧的生成元集合里；
    纵向/Virasoro 方向不在范围内；Φ 与任一侧的 † 或双线性型的相容性**不被断言**。
  - |
    **Lean 侧完全未起步，且比 worldsheet.ddf-transverse-oscillator-algebra-v2 更远。**
    `formal/StringFormal/NoGhost/VertexOperator.lean` 文件头 "Mathematical gaps" 第 2 条逐字
    「No operator products. `V(b, z) V(b', w)` and hence `[A^i_m, A^j_n]` are untouched.」；
    此外还要有光锥横向振子代数的 Lean 对应物以及两者之间的同构。本推导**不得**标 formalized。
