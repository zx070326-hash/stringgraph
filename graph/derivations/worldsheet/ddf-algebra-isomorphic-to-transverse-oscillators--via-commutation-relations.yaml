    note: |
      **被比较的左侧。** [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0} 连同它的全部前提
      （横向偏振正交归一 ε^i·ε^j = δ^{ij}、类光 k_0² = 0、归一化 2α' k_0·p = 1、扇区 k_0·p ≠ 0）
