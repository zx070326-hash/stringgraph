  - "**(10.5.15) 那一步的 gamma 矩阵代数计算依赖附录 B 的表示与 S_a 的对角化基**：本图只有 worldsheet.rns-ramond-zero-modes-clifford（Clifford 关系），没有该表示的构造。"
  - "**「D − 2 = 8 个类空极化」用到 D = 10 与无质量小群 SO(D−2) 的表示论**：后者在本图无节点（玻色弦一侧的同一缺口见 worldsheet.critical-dimension-light-cone 的 gaps）。"
  - "**上游正规序常数的 gap 全部继承**（助记法无节点、βγ 规则无成文来源、原书列为习题）。"
