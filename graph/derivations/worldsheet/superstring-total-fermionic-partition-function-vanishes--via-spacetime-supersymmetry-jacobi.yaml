id: worldsheet.superstring-total-fermionic-partition-function-vanishes--via-spacetime-supersymmetry-jacobi
target: worldsheet.superstring-total-fermionic-partition-function-vanishes
kind: physical-argument
status: physical-argument
depends_on:
