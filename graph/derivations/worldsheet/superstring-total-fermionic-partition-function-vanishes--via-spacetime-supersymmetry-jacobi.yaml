    inferred: true
    note: |
      供给**本推导第 1 步的第一条输入**：Jacobi 的 "abstruse identity"。
      原书 §10.7 p.35 逐字把它列为 Z_{T₂} 消没的两条理由之一（见上一条 note 引的整句），
