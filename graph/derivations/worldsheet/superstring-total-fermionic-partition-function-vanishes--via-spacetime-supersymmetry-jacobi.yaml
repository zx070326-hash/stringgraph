summary: |
  **原书实际做的事（两句话，都可逐字核对）**

  1. **§10.8 只引用，不证**：p. 38 逐字 'We know from the previous section that the total
     fermionic partition function vanishes **by supersymmetry**, so that Z_{C₂,1} = −Z_{C₂,0};'。
     同一条结论在 p. 41 用到 Klein 瓶（'and Z_{K₂,1} = −Z_{K₂,0}.'），
     在 p. 42 被概括为「for each world-sheet topology the NS–NS divergence is the negative of
     the R–R divergence」。
  2. **§10.7 提供的技术内容是两条 θ 函数事实**：Jacobi 的 abstruse identity (10.7.16)
     Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴ = 0，以及 Z¹₁ = 0。代入 (10.7.9)：
       Z_ψ^± = ½[ (Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴) ∓ Z¹₁⁴ ] = ½[ 0 ∓ 0 ] = **0**。
     **这一步本身是两行代入**，难的全在那两条被引用的事实上。

  **从 Z_ψ^± = 0 到逐拓扑相消的那一步**：三个面的振幅在费米部门上用的是同一组 Z^α_β 的组合，
  按 β = 0 / 1（即迹里有没有 exp(πiF)）拆成 NS–NS 与 R–R 两项；总和为零即两项互为相反数。
  ⚠ **原书不把这一步写出来**——它直接从「总配分函数为零」跳到 'so that Z_{C₂,1} = −Z_{C₂,0}'。
  三个面的扇区判据还**各不相同**（圆柱按迹里有无 exp(πiF)；Klein 瓶按在 σ² → σ² + 4πt 下
  是否反周期；Möbius 按迹的 R / NS 扇区，且**与圆柱相反**），
  故「拆成两项后总和为零 ⇒ 两项反号」在每个面上都要各自成立，**原书只对圆柱与 Klein 瓶写出结果**。

  **为什么标 physical-argument（四条，按弱到强排）**
  (1) ★ **原书给的理由是一句无指向的归因**：'by supersymmetry'，无式号、无论证
      （目标卡「不断言 (a)」）。而 §10.7 实际写下的是两条 θ 函数事实——
      **本书从不把这两种说法打通**。
  (2) ★ **那两条 θ 函数事实此前在本图都没有节点**：(10.7.16) 被原书称作 'abstruse identity'
      而不给证明不给文献；Z¹₁ = 0 的理由原书在 p.34 只给一句不展开。⇒ 见 gaps 第一条。
      **【2026-09-11 更新】两张卡已建出并已接边**（math.jacobi-abstruse-identity，own = **rigorous**，
      Whittaker–Watson §21.2 Corollary 带完整证明；worldsheet.ramond-trace-with-fermion-number-vanishes，
      own = physical-argument）。⇒ 本条作为「压低本推导的理由」**已失效**，
      但本推导的 status **不变**——因为 (1)(3)(4) 三条都还在，这正是下面那句预言的情形。
  (3) **「总和为零 ⇒ 逐项反号」这一步原书跳过**（见上），且三个面的扇区判据互不相同。
  (4) 整个对象是单圈路径积分 / 迹的形式计算，上游三张振幅卡与 §10.7 那张卡
      **全部是 physical-argument**（§10.7 那张卡的封顶理由是原书逐字的
      'We make the guess, correctly it will turn out'）。
  ⇒ 即使把 (10.7.16) 建成一张 rigorous 的数学卡，(1)(3)(4) 仍在，本推导不会自动升级。
