      （它的「不断言 (a)」明确把迹记号形式排除在外）。
      ⇒ 换算还需 η ≠ 0（math.dedekind-eta-nonvanishing，formalized）与 (10.7.7c) 的识别
        （挂在 worldsheet.modular-invariance-requires-eight-transverse-fermions 上，physical-argument）。
      ⇒ **去 inferred 的正解**：建 worldsheet.jacobi-abstruse-identity-trace-form（(10.7.16)），
        见 math.jacobi-abstruse-identity 的 notes「待建的相邻卡」。
      ★ 该依赖卡 own = effective = **rigorous**（Whittaker–Watson §21.2 Corollary，带完整证明），
        故它**不**压低本推导；本推导的 physical-argument 完全来自物理侧的三条理由（见 summary）。
