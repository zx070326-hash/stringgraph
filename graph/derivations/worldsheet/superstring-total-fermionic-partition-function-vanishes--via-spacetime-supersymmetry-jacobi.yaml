      **标 inferred，两条理由**：
        (i) 原书在该处**不给式号、不给论证**，也不指明是哪一条超对称陈述；
        (ii) 本图这张卡说的是「NS–R 扇区的无质量态是引力微子，其规范等价关系是**局域时空超对称**
             的标志；IIA/IIB 各有两个引力微子」——**不是**「费米配分函数为零」。
             由前者到后者的那一步（时空超对称 ⇒ 玻色/费米态逐级配平 ⇒ 迹相消）
             **原书不写、本图也没有节点**。
      ⚠ 本边承担的是**原书自己给出的理由**（不是「原书语境」），故按 docs/STATUS_LEVELS.md
      「接口边」一节的口径它应当存在；但它的内容是一句无指向的归因，故 inferred。
      ⚠⚠ **对象错配的第三层**（目标卡「不断言 (g)」已登记）：type I 是 d = 10, N = 1，
      本图这张卡讲的是 type II 的 N = 2，而 (10.7.9) 的 Z_ψ^± 又是
      「from one side of the type II string」的迹。**三者的关系原书在 §10.8 不厘清**。
      ⇒ 正解：建一张「时空超对称 ⇒ 每个质量级上玻色态数 = 费米态数 ⇒ 带 (−1)^F 的迹为零」的卡，
      届时本边改指它。
