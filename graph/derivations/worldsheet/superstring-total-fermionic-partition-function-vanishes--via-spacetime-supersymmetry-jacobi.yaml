summary: |
  **原书实际做的事（两句话，都可逐字核对）**

  1. **§10.8 只引用，不证**：p. 38 逐字 'We know from the previous section that the total
     fermionic partition function vanishes **by supersymmetry**, so that Z_{C₂,1} = −Z_{C₂,0};'。
     同一条结论在 p. 41 用到 Klein 瓶（'and Z_{K₂,1} = −Z_{K₂,0}.'），
     在 p. 42 被概括为「for each world-sheet topology the NS–NS divergence is the negative of
     the R–R divergence」。
  2. **§10.7 提供的技术内容是两条 θ 函数事实**：Jacobi 的 abstruse identity (10.7.16)
     Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴ = 0，以及 Z¹₁ = 0。代入 (10.7.9)：
       Z_ψ^± = ½[ (Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴) ∓ Z¹₁⁴ ] = ½[ 0 ∓ 0 ] = **0**。
     **这一步本身是两行代入**，难的全在那两条被引用的事实上。

  **从 Z_ψ^± = 0 到逐拓扑相消的那一步**：三个面的振幅在费米部门上用的是同一组 Z^α_β 的组合，
  按 β = 0 / 1（即迹里有没有 exp(πiF)）拆成 NS–NS 与 R–R 两项；总和为零即两项互为相反数。
  ⚠ **原书不把这一步写出来**——它直接从「总配分函数为零」跳到 'so that Z_{C₂,1} = −Z_{C₂,0}'。
  三个面的扇区判据还**各不相同**（圆柱按迹里有无 exp(πiF)；Klein 瓶按在 σ² → σ² + 4πt 下
  是否反周期；Möbius 按迹的 R / NS 扇区，且**与圆柱相反**），
  故「拆成两项后总和为零 ⇒ 两项反号」在每个面上都要各自成立，**原书只对圆柱与 Klein 瓶写出结果**。

  **为什么标 physical-argument（四条，按弱到强排）**
  (1) ★ **原书给的理由是一句无指向的归因**：'by supersymmetry'，无式号、无论证
      （目标卡「不断言 (a)」）。而 §10.7 实际写下的是两条 θ 函数事实——
      **本书从不把这两种说法打通**。
  (2) ★ **那两条 θ 函数事实在本图都没有节点**：(10.7.16) 被原书称作 'abstruse identity'
      而不给证明不给文献；Z¹₁ = 0 的理由原书在此处也不写。⇒ 见 gaps 第一条。
  (3) **「总和为零 ⇒ 逐项反号」这一步原书跳过**（见上），且三个面的扇区判据互不相同。
  (4) 整个对象是单圈路径积分 / 迹的形式计算，上游三张振幅卡与 §10.7 那张卡
      **全部是 physical-argument**（§10.7 那张卡的封顶理由是原书逐字的
      'We make the guess, correctly it will turn out'）。
  ⇒ 即使把 (10.7.16) 建成一张 rigorous 的数学卡，(1)(3)(4) 仍在，本推导不会自动升级。
gaps:
  - "**本推导真正用到的两条事实在本图都没有节点（主缺口）**：
     · **(10.7.16)** Jacobi 的 'abstruse identity' Z⁰₀(τ)⁴ − Z⁰₁(τ)⁴ − Z¹₀(τ)⁴ = 0
       ——原书给出式子与名字，**不给证明、不给文献引用**（§10.8/§10.7 全章体例如此）；
     · **Z¹₁ = 0** ——原书在 §10.7 用到它（抽取记录 #E47 备注第 3 点逐字：
       『type II 的 Z_{T₂} = 0 依赖 Jacobi 恒等式 (10.7.16) **与 Z¹₁ = 0**』），
       但**不写理由**（标准理由是 R 扇区带 (−1)^F 的迹上有费米零模）。
     本图的 worldsheet.modular-invariance-requires-eight-transverse-fermions 在 notes 里
     **明文把两者排除在外**，逐字：『(10.7.15) 的 type 0 对角模不变量、**(10.7.16) 的 Jacobi
     「abstruse identity」**Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴ = 0、以及 type II 的 Z_{T₂} = 0，本轮不建节点。』
     ⇒ **待建（两条都是纯数学/自由场论，可做成较硬的卡）**：
       · math.jacobi-abstruse-identity（ϑ₀₀⁴ − ϑ₀₁⁴ − ϑ₁₀⁴ = 0，θ 函数的经典恒等式；
         注意本图连 θ 函数卡都还没有，见 math.dedekind-eta-function 的『不断言』）；
       · worldsheet.ramond-trace-with-fermion-number-vanishes（Z¹₁ = 0）。
     在那之前，本推导第 1 步的两个输入都是**从原书导入的**。"
  - "**『由超对称』这条归因在图上没有落点**：depends_on 里那条指向
     worldsheet.type-ii-spacetime-supersymmetry 的边**标 inferred**，因为那张卡讲的是
     引力微子与局域时空超对称，**不是**配分函数为零；由前者到后者需要
     『时空超对称 ⇒ 每个质量级上玻色态数 = 费米态数 ⇒ 带 (−1)^F 的迹逐级相消』这一串，
     **原书不写、本图无节点**。
     ⚠ 还有一层**对象错配**（目标卡「不断言 (g)」）：type I 是 N = 1，那张卡讲的是 type II 的
     N = 2，而 (10.7.9) 的 Z_ψ^± 是『from one side of the type II string』的迹。
     ⇒ 待建：worldsheet.spacetime-susy-implies-boson-fermion-degeneracy。"
  - "**Z_{K₂,1} 与 Z_{M₂,0/1} 在本图没有独立定义**：
     · Z_{K₂,1} 由『K₂ 振幅按 NS–NS / R–R 分成两项』隐式定义，原书只在
       'and Z_{K₂,1} = −Z_{K₂,0}.' 这一句里用到它；Klein 瓶卡只定义并计算了 Z_{K₂,0}。
     · Möbius 一侧原书**直接算 R–R 项** Z_{M₂,1}（逐字 'It is slightly easier to focus on the
       R–R exchange'），**从不写** Z_{M₂,0}，也从不写 Z_{M₂,1} = −Z_{M₂,0}。
     ⇒ 目标卡「不断言 (c)」照此把 Möbius 排除在具体化之外；断言 (2) 第三条只照录原书
     p.42 那句一般说法。"
  - "**『总和为零 ⇒ 逐项反号』这一步原书跳过**：原书直接从『总费米配分函数为零』写到
     'so that Z_{C₂,1} = −Z_{C₂,0}'。要把这一步补严，需要说明三个面上
     『按 β = 0 / 1 的拆分』与『Z_ψ^± 的四项组合』如何逐项对应——而**三个面的扇区判据互不相同**
     （圆柱按迹里有无 exp(πiF)；Klein 瓶按 σ² → σ² + 4πt 下的周期性；Möbius 按迹的 R / NS 扇区，
     抽取记录 #E71 特别标注『**注意这与圆柱相反**』）。本推导**未展开**这一步。"
  - "**本推导不碰任何一侧的值，也不碰 tadpole**：Z_{C₂,0}、Z_{K₂,0}、Z_{M₂,1} 的值在三张振幅卡上；
     (n ∓ 32)²、SO(32)、C₁₀ 悖论在 worldsheet.type-i-tadpole-cancellation-so32-v2。
     ⇒ 本推导**不经过**该节最弱的 C₁₀ 环（抽取记录 #E67 的判断）。"
notes: |
  ★★★【本推导关闭了 tadpole 推导里那条「第 (4) 步没有图内支撑」的 gap（curator，2026-09-11，
  small-backlog-13）】worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences
  的 gaps 最后一条逐字：
    「⇒ **本推导第 (4) 步在这一处没有图内支撑**：接来的两张卡只给 NS–NS 侧，
      翻到 R–R 侧靠的是本推导直接引原书。⚠ 这不是新引入的缺口 …
      → 待建：worldsheet.superstring-vacuum-amplitude-vanishes-by-supersymmetry
      （§10.7 的总费米配分函数为零），届时本推导加一条非 inferred 边。」
  目标卡就是那张卡（id 按 lead 派工单改为 …-total-fermionic-partition-function-vanishes），
  tadpole 推导已加一条**非 inferred** 边指向它。

  ⚠⚠【本推导最该被记住的一条】**原书对这条结论给的是一句归因，不是一条论证。**
  'by supersymmetry' 后面没有式号；§10.7 里能找到的只有 (10.7.16) 与 Z¹₁ = 0 两条 θ 函数事实，
  而**本书从不把「超对称」与这两条事实的关系写出来**。
  ⇒ 目标卡断言 (1) **同时照录两种说法并声明不断言其中任何一个蕴含另一个**（「不断言 (a)」），
  本推导的 status 也据此封在 physical-argument。
  ⚠ 反方向的告诫同样重要（§10.7 逐字）：模不变性的要求必须在
  '*without* using the vanishing of Z¹₁ or the abstruse identity (10.7.16)' 的意义下成立
  ——**不得**在本卡与 worldsheet.modular-invariance-requires-eight-transverse-fermions 之间
  建立论证方向上的依赖（本推导对那张卡的边**只取记号**，note 已写明）。

  【升级路径（给 lead 与后续 researcher）】本推导有两条互相独立的可做项，做完能实质提高强度：
    1. **建 math.jacobi-abstruse-identity**（ϑ₀₀⁴ − ϑ₀₁⁴ − ϑ₁₀⁴ = 0）与 **Z¹₁ = 0** 两张卡
       ——前者是经典 θ 函数恒等式，Mathlib 方向上也许有望；注意本图目前**连 θ 函数卡都没有**
       （math.dedekind-eta-function 的「不断言」逐字：「本图未建 θ 函数卡」）。
    2. **建「时空超对称 ⇒ 玻色/费米态逐级配平 ⇒ 带 (−1)^F 的迹为零」的卡**，
       把那条 inferred 的归因边落实。
  ⚠ 两条都做完，本推导仍受 gaps 第四条（「总和为零 ⇒ 逐项反号」原书跳过）与上游三张
  physical-argument 振幅卡的限制，**不会自动升到 rigorous**。

  按抽取记录 literature/extractions/polchinski-1998-v2-sec10-8.md **#E66**（p.38 那句逐字）、
  **#E68**（脚注 7）、**#E69**（Klein 瓶那句）、**#E72**（p.42 收尾段）、
  polchinski-1998-v2.md **#E47**（(10.7.9)/(10.7.16)/Z¹₁ 与那条反方向告诫）建立。
  curator，2026-09-11。
