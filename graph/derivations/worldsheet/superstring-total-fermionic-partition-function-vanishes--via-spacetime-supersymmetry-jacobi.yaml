      ⇒ **不得**用模不变性去论证本卡，也不得用本卡去论证模不变性（目标卡「不断言 (a)」）。
      ⚠ 那张卡自己的 notes 逐字写明 **(10.7.16) 与 Z¹₁ = 0「本轮不建节点」**
