      **本推导的原子输入，命题级依赖，且被用两次。**
      第一次在动量 m k_0、指标 j 上（引入电流：j V^{(m)}_j ↦ m Σ_J (k_0·α_{−J}) V^{(m)}_{j−J}），
      第二次在动量 (m+n) k_0、指标 K = 0 上（消掉电流，右端系数为 0，即"全导数"）。
      Lean 侧本推导先把那张卡的单 Fock 形式 `Fock.vertexCurrent_eq` 逐层搬到塔上
