      【顶点算子的模】一段，但该卡的 `formal.lean_decl` 指向 `ddfOp`，**不是** `towerVertex`。
      ⇒ 这条边指向的是"该卡文本里的一段记号约定"，不是该卡 formal 声明的内容，故标 inferred。
      ⚠ 正确的修法（提请 lead；这是第四次提请，前三次见
      worldsheet.isotropic-tower-vertex-operators-commute--via-lean gaps (iv)、
      worldsheet.vertex-operator-adjoint--via-lean、
      worldsheet.isotropic-tower-vertex-operator-fusion--via-lean gaps (iii)）：
      把 `towerVertex` 拆成一张 formalized 定义卡。
      ⚠ 该卡是 formalized 定义卡，故这条边不压低本推导的有效状态。
