      再用它两次。所以本推导只有**一个**数学输入卡，另外两条是定义卡。
      ⚠ 该卡是 formalized，故这条边不压低本推导的有效状态。
  - id: worldsheet.isotropic-tower-vertex-operator-fusion
    inferred: false
    note: |
      **证明中间那一步：融合两个指数**，命题级依赖。
      在把电流提到 j-求和外面之后，剩下的 Σ_j V^{(m)}_{j−J} V^{(n)}_{−j} 正是那张卡的
      有限和形式（Lean 逐字调用
      `sum_towerVertex_towerVertex_of_isotropic η b hbb m n (0 - J) x …`，
      指标经 `Finset.sum_image` 的 j ↦ −j 重标后对上），得 V^{(m+n)}_{−J}。
      ⚠ **方向很重要**：那张卡是本推导的**一步**，本卡**不是**那张卡的推论——
      目标【为什么这不是同点乘积 (5a) 的推论】一段与目标 notes 里"两位 formalizer 独立证伪"
      的记录说的就是这件事。不要把这条边反向读。
      ⚠ 该卡是 formalized，故这条边不压低本推导的有效状态。
  - id: worldsheet.momentum-tower-fock-space
    inferred: false
    note: |
      提供塔 T(p;k_0) = ⊕_{N∈Z} F(p + N k_0)（Lean `TowerFock D R = ℤ →₀ Fock D R`）、
      层移位 e^{i n k_0·x}（`towerShift`）、逐层算子装配（`towerDiag`、`towerMode`）与
      **逐层的零模** α^μ_0|_N = (2α')^{1/2}(p + N k_0)^μ（该卡陈述里那一行）。
      最后一条是本推导 m + n = 0 分支的关键：`towerCurrent_zero_of_normalized` 要求
      k_0·α_0 = 1 在**每一层**成立，而这由该卡的逐层零模加上
      `dotVec_towerMomentum_right_of_isotropic`（k_0² = 0 ⟹ k_0·p 沿塔不变）保证。
      逐层化归用 `Finsupp.lhom_ext` / `sum_single_eq`，即该卡"代数（外部）直和、
      只有限多层非零"这一条；towerLevelBound / towerModeBound 的逐层比较用 `Finset.le_sup`。
      ⚠ 该卡是 formalized 定义卡，故这条边不压低本推导的有效状态。
  - id: worldsheet.ddf-operators-v6
    inferred: true
    note: |
      **inferred: true。** 本推导用到 `towerVertex` 这个**定义**（塔上顶点算子的 z^K 洛朗系数，
