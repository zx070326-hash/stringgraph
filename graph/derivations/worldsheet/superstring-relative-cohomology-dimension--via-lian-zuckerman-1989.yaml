    |---|---|---|
    | 目标 | Corollary 2.15(i) | Theorem 2.7(ii) |
    | 消灭那一步 | Theorem 2.4（**独立编号定理**，§3 全章证明） | Theorem 2.7(i)（与 (ii) 同一定理的两条） |
    | 维数那一步 | Euler–Poincaré + **Proposition 2.14(ii)**（char 公式） | Euler–Poincaré + **Proposition 2.4**（"Eq. [2.3] 常数项"） |
    | 自由性边 | **inferred**（Cor 2.15 的证明不提它） | **非 inferred**（FGZ 把 Prop 2.6(i) 明写为 Thm 2.7 的输入） |
    | 右端能否数值化 | **否**（p^{(8)}_κ 与 dim R(p,0) 都未核） | **是**（p_{(D)}(n) 的定义已逐字取得） |
    | 分段 | 语句无分段 | 有"非非负整数 ⇒ 0"那一支 |
  ⇒ 最后两行是两卡**不可互相搬运**的地方；前四行说明两条链在骨架上确实平行
  （LZ 自述 'we will prove their existence the way FGZ did in the bosonic case'）。

  【本推导为什么不给 Theorem 2.20 的"维数相等"】
  LZ 的 Corollary 2.19(i) 给出 dim(T ∩ 𝒫) 的公式，右端与本卡**逐字相同**；
  Theorem 2.20 的证明末句逐字 'Using **Corollary 2.15(i)** and **Corollary 2.19(i)**, we have
  the desired result.'（§9.5 复核无误）。⇒ **"两边维数相等"是 Theorem 2.20 那张卡的内容**
  （worldsheet.brst-cohomology-equals-ocq-physical-superstring-v2），本推导只给 H⁰_rel 这一边。
  ⚠ 本推导**不**对 Cor 2.19(i) 拉边：那会把 Theorem 2.20 的论证提前搬进本卡。

  按 researcher 2026-09-11 第三轮抽取记录 literature/extractions/lian-zuckerman-1989.md **§9**
  （§9.1 Cor 2.15 逐字复核、§9.2 证明链逐字与三条 negative evidence、§9.3 Prop 2.18 逐字、
  §9.4 Cor 2.19 逐字与 (iii) 的真实证明链、§9.5 Thm 2.20 证明末句）与 **E5/E6/E7**（第一轮）建立。
  curator，2026-09-11。
