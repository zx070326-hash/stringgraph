summary: |
  **LZ 的论证（三步，全部逐字可核，见 sources 第二条）**：

  1. **Euler–Poincaré（特征标版）**：
       Σ_{n∈Z} (−1)^n dim H^n_rel(p,κ) = Σ_{n∈Z} (−1)^n dim C^n_rel(p,κ)。
     这是同调代数的标准原理（LZ 逐字 "We recall the Euler–Poincaré Principle for
     characteristics"），把上同调的分次维数交错和换成复形的。
  2. **用消灭定理把左端塌成一项**：由 **Theorem 2.4**（H^n_rel = 0 除 n = 0），
     左端 = **dim H⁰_rel(p,κ)**；右端按定义就是 **char C_rel(p,κ)**。
     ⇒ **这一步是本推导继承全部前提（尤其 p ≠ 0）的地方。**
  3. **代入特征标公式**：由 **Proposition 2.14(ii)**，
       char C_rel(p,κ) = ½(2κ+1) · dim R(p,κ) · p^{(8)}_κ(κ − p·p/2)，
     即目标卡的断言。原文逐字 "Hence (i) follows from **Proposition 2.14 (ii)**."

  **这一步不做**：正定性走的是同一套骨架但用 Euler–Poincaré 的**号差版**与 Prop 2.14(ii) 的
  char = **sign** 那一半，是 Corollary 2.15(**ii**)，在本图是
  worldsheet.no-ghost-theorem-superstring-cohomological-v2（目标卡"不断言 (a)"）。

  ⚠ **Proposition 2.14(i)（Q* = Q）不是本推导的输入**（§9.2 的 negative evidence）：
  Corollary 2.15 的证明两部分都只引 2.14(**ii**)，句末 "also" 是作者自己点明的。
  ⟨,⟩_rel 下 Q 的自伴性是 "sign H^n 有定义" 的背景条件，但**原文没把它列为依赖**，
  本推导据此不拉那条边；日后若补，**必须标 inferred**。

  ⚠ **自由性（Corollary 2.19(iii)）在本推导里是间接的**：它喂给的是 **Theorem 2.4 的 §3 证明**
  （LZ §9.5 逐字），不是喂给 Corollary 2.15。本推导对它拉的是一条 **inferred 记账边**，
  作用是让"p ≠ 0 用在哪一步"在图上可查。

  【为什么标 rigorous】四条：
  (1) 结论是**带编号的推论**（Corollary 2.15(i)），陈述与**完整证明**都已逐字核实（L1 页图，
      §9.1/§9.2 是第三轮独立复核，与第一轮 E6 一致无更正）；
  (2) 证明的三条输入都是原文明写的编号结果（Theorem 2.4、Euler–Poincaré 原理、
      Proposition 2.14(ii)），**无"一点思考就知道"式的断言**，不触发 docs/STATUS_LEVELS.md
      的"断言 + 骨架 ⇒ physical-argument"条款；
  (3) 论证全在有定义的复形与分次模范畴里（分次维数、形式特征标、交错和），
      **不涉路径积分、不涉收敛性**——特征标一律作形式幂级数处理；
  (4) 期刊是 Communications in Mathematical Physics。
  与 worldsheet.superstring-relative-cohomology-vanishing-v2--via-lian-zuckerman-1989 和
  worldsheet.bosonic-relative-cohomology-dimension--via-fgz-1986 的记账口径一致。
  ⚠ **限制**：本推导的 rigorous 是对 **Corollary 2.15(i) 这三行**给的；
  它依赖的 **Proposition 2.14(ii)** 与 **Theorem 2.4** 的证明本图并未逐行复核，
  且前者在图上连节点都没有（见 gaps 第一条）。

  【有效状态为什么仍会被封顶】经第一条边继承的接口卡
  （worldsheet.superstring-brst-charge、worldsheet.superstring-brst-additional-conditions 等）
  自身是 physical-argument（上游是 OPE / 路径积分链），按 docs/STATUS_LEVELS.md 的 min 规则封顶。
  **这不是 LZ 的论证有缺口**，而是本图把"LZ 的对象 = Polchinski 的对象"这一步经那些卡记账的后果。
gaps:
  - "**Proposition 2.14(ii)（char C_rel = ½(2κ+1) dim R(p,κ) p^{(8)}_κ(κ − p·p/2) = sign C_rel）
     在本图没有卡**，其证明（pp.312–317，含分情形计算与 Lemma 2.14.5）本图也**未逐字核实**。
     ⇒ **目标卡断言的整个右端落在一条未上图的命题上**，这是本推导最实质的记账缺口。
     与超弦侧另一处同型：worldsheet.superstring-gso-covariant-equivalent--via-lian-zuckerman-1989
     的 gaps 第二条（Proposition 4.2 无卡，dim H⁰ 的数值全落在它上面）。
     关闭方式：取 pp.312–317 的页图，为 Prop 2.14(ii) 单建卡。"
  - "**Euler–Poincaré 原理在本图无节点**（reviewer-batch23 已在别处记过同一条）：
     本推导第 1 步逐字 'We recall the Euler–Poincaré Principle for characteristics'，
     `search` 无命中。**玻色侧 worldsheet.bosonic-relative-cohomology-dimension--via-fgz-1986
     第 1 步（经 FGZ Proposition 1.3）与 worldsheet.superstring-gso-covariant-equivalent--via-lian-zuckerman-1989
     都隐含使用同一条原理。** ⇒ 这是**跨三条推导的同一条缺口**，值得单建一张数学卡后一并接线。"
  - "**计数记号 p^{(8)}_κ(·) 的定义本图未逐字取得（L0）**。目标卡 (H6) 已声明只照抄记号。
     合理猜测 p^{(8)}_κ(n) = [q^n] φ_κ(q)^{−8}（旁证：Proposition 2.18 的
     ch_q T(p,κ) = dim R(p,κ) q^{p·p/2} φ_κ(q)^{−8}），与 FGZ 的 p_{(D)}(n) = [q^n] φ(q)^{−D}
     同型，8 = D − 2 是横向数；**但 φ_κ(q) 本身的定义本图也没有**（NS/R 两扇区的费米因子）。
     ⇒ 直接后果：本卡给出的是一个**符号表达式**，不是可数值化的维数；
     任何把它算成具体数的下游断言都超出本推导。"
  - "**dim R(p,0) 的数值本图未核**。LZ 只说 R(p,0) 是 Spin(D−1,1) 的旋量表示（p.303）。
     D = 10 的 Dirac 旋量维数 32 ⇒ ½·dim R(p,0) = 16，与 auditor 2026-09-11 转录的
     p.314 'Case 1（p·p = 0）sign C_rel(p,0) = 16' 一致——**但这是本图的算术核对，不是 LZ 的字**，
     目标卡「不断言 (e)」照此写。关闭方式：取 p.303 与 p.314 的页图逐字。"
  - "**维数公式对 R 扇区零模表示的依赖未被检验**：本推导的整条链（Definition 2.11 的 ⟨,⟩_rel、
     Prop 2.14(ii) 的 char/sign）都建立在 p.306 (7) 的 **T₀ ⊕ T₁** 选择上。
     换成 FOK / Henneaux 的 C[γ₀]（单个 Bose-sea charge）时右端是否不变，本图**未核实**；
     FOK (5.1) 只证了它自己两种表示的同构，且逐字限定 'only an isomorphism of **ungraded**
     vector spaces'——而本卡断言的恰是**分次**信息（相对次数 0 的维数）。
     ⇒ 目标卡「不断言 (d)」。"
  - "**Theorem 2.4 的证明本推导未逐行复核**（经第一条边继承）：那条推导自己的 gaps 记着
     两条表示论输入（Corollary 2.19(iii) 已上图；**Theorem 3.3.1** 的正合序列仍无卡），
     以及 pp.321–323 的过滤论证细节未逐字转录。本推导继承这些缺口，不重复记。"
  - "**p = 0 时的维数本图未建卡**：LZ §5 给出 p = 0 的相对与绝对上同调（Proposition 5.5 显式列出
     H^n_rel(0,κ)：κ=0 落在 n = 0, ±1；κ=½ 落在 n = ±½, ±3/2）。目标卡「不断言 (f)」。
     ⇒ 这是超弦侧**强于**玻色侧的一处：FGZ 的 p = 0 本图只核到 Proposition 2.8/2.9 的
     「例外情形」这一层。若日后建 p = 0 的卡，超弦侧的材料已够。"
  - "**半空间 {p^D > 0} 这条全局前提不在本推导的前提链里**：auditor 2026-09-11 逐条核对过
     Theorem 2.4 / Corollary 3.4 的前提只写 p ≠ 0，且证明不涉任何厄米形式；
     而 Corollary 2.15(**i**)（本推导）算的是 **char**（分次维数），与 ⟨,⟩_R 的**取向无关**
     （auditor 裁决 (c) 逐字：'Corollary 2.15(i) 与 2.19(i) 的维数公式是特征标计算
     （p.313–314 (4)(5)(6)、p.319 (33)），与符号无关'）。
     ⇒ **本推导比正定性那一侧更不需要这条前提**；目标卡设定里因此不列它。"
