    note: L1 逐字，见目标陈述 sources 第二条。
  - ref: lian-zuckerman-1991
    loc: "Theorem 2.13（约化公式 H*_∞(𝒢,𝒢₀; W ⊗ M(−β̄−λ)) ≅ H*(𝒢₊, W)[λ]）, p.562；Theorem 2.25, p.566（W hermitian、𝒢₋-free、dim W[α] < ∞ ⇒ H^n_∞ = 0 (n≠0) 且 H^0_∞ ≅ W^{𝒢₊}[λ]/rad，且是等距）；Corollary 2.26（Vanishing Theorem）, p.567；Corollary 2.27（维数与 signature 的 Euler–Poincaré 公式）, p.567；Corollary 2.28（作者自命名 \"No-ghost Theorem\"）, p.568"
    note: |
