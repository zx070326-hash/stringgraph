    note: |
      **不作为本推导的依据**，仅登记归属：LZ 把 D 维玻色 Fock 空间无鬼定理归给 [GT, T1, LZ, FGZ]，
      其中 [T1] 是本文（Kac 行列式路线，"in a more general setting than the original proofs"）。
