          必须重新对照原页**（本推导不引用该公式本体，只引用其名称与 iff 结构）。
      另有编号陷阱：LZ 自己的 Introduction (p.549) 把 Vanishing Theorem 误写成
      "Corollary 2.19"（p.564 处实为 Remark 2.19），**不要引用 "LZ 1991 Corollary 2.19"**。
  - ref: lian-zuckerman-1991
