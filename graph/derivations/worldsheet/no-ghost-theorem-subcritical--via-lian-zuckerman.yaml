summary: |
  论证是 LZ 1991 §2 的一般理论 + §3 的自由玻色子实例，全部在 Virasoro 代数的相对半无限
  （BRST）上同调框架内进行，不含路径积分或形式重排。

  (1) 一般理论（§2，均在范畴 𝒪 与全局假设 A1–A5 下）：
      Theorem 2.1 给出 ℒ-free 消解；Definition 2.2 / Proposition 2.3 给出约化复形与 d̄₀² = 0；
      Proposition 2.12 给出有限滤过；**Theorem 2.13**（约化公式）把带 Verma 模系数的相对上同调
      算成 H*(𝒢₊, W)[λ]；Lemma 2.21（cf. FGZ Theorem 1.12）给出「W hermitian 且 𝒢₋-free ⇒
      H^n_∞ = 0 (n ≠ 0)」；Lemma 2.23 给 Poincaré 对偶；**Theorem 2.25** 把 Verma 模换成不可约商
      L(·)，得到 H^0_∞(𝒢,𝒢₀; W ⊗ L(−β̄−λ)) ≅ W^{𝒢₊}[λ]/rad 且该同构是**等距**；
      Corollary 2.26 是消灭定理，Corollary 2.27 给 Euler–Poincaré 型的维数与 signature 公式，
      Corollary 2.28 是作者自命名的 "No-ghost Theorem"（幺正性 ⟺ 特征标与 signature 特征标的
      常数项相等）。

  (2) 自由玻色子实例（§3）：取 W = V(D,p)。Proposition 3.1 验证 Theorem 2.25 的全部假设——
      V(D,p) ∈ 𝒪₀、hermitian、逐权有限维、且 **𝒢₋-free**（这一条是关键，(v)）；
      π(z) = D·Id。Proposition 3.3(iii) 给出鬼系统一侧 β̄ = −26z′ − L′₀，故补充模的中心荷
      必须是 26 − D，最高权是 1 − h。代入 Theorem 2.25 即得目标陈述的 (i)（等距）。

  (3) 判据（Theorem 3.5(ii)）：由 (i) 的等距，左端正定 ⟺ 右端正定；再由 Corollary 2.27/2.28 的
      特征标–signature 判据，右端对一切 p 正定 ⟺ ch_q L(26−D, 1−h) = sign_q L(26−D, 1−h)
      ⟺ Verma 模 M(26−D, 1−h) 半正定（LZ 证明末句逐字）。最后一步（Verma 模半正定的
      (c,h) 区域）落到 Virasoro 最高权模的幺正/半正定性判定，即 Kac 行列式的符号分析，
      给出 D = 26, h = 1 或 26 > D ≥ 2, h ≤ 1。

  【为什么标 rigorous】按 docs/STATUS_LEVELS.md 第 4 级：这是发表在 Commun. Math. Phys.
  135 (1991) 547–580 的数学论文中的**编号定理**，有完整的期刊长文级证明（不是公告体裁），
  论证在半无限上同调的模范畴中进行（受限模、分级、滤过、消解），定理编号与逐字措辞已由
  researcher 全文 34 页逐页核实并对关键页做过单页重读复核（primary-sources-round2.md §1.6）。
  本推导**不**依赖 worldsheet.critical-dimension-brst：LZ 与 FGZ 一样把总中心荷 26 当作
  相对复形的定义条件，不推导它；故本推导的 rigorous 不受
  critical-dimension-brst--via-nilpotency 为 physical-argument 的影响。
gaps:
  - "【最实质的一条】LZ 证明末句到两分支条件之间的最后一步（'the Verma module M(26−D, 1−h) is positive semi-definite. The latter is equivalent to precisely the conditions on (D, h)'）在抽取记录的 L1 逐字里**没有附引文**；把它接到 Kac 行列式 / Kac–Kazhdan 1979 的定位（LZ Lemma 3.17、Remark 3.15）只有转述级证据（primary-sources-round2.md §8、§9.3；bib key kac-kazhdan-1979 的 note）。故 worldsheet.kac-determinant 这条边标 inferred。待复核 LZ p.571–579。"
  - "【2026-09-11 新增，primary-sources-round2.md §11.4 第 4 条】LZ §2.3 开头（p.563 末）逐字设定常设假设「From now on we will only consider weights λ ∈ 𝒢₀′ that satisfy the reality condition σλ = −λ」（σ 是 Proposition 3.3(ii) 的反线性自同构，σ(L_n) = −L_{−n}、σ(z) = −z），Theorem 2.25 / Corollary 2.26 / Theorem 3.5 全部在此假设下。本推导两分支所用的权（Theorem 3.5 中 V(D,p)[−h] 的权，h 实、π(z) = D 实）是否自动满足该条件，LZ 未验，本项目也**未核实**；引用 Theorem 3.5 覆盖 ms.no-ghost-theorem 审计 B1 时应把它与 (P1)–(P4) 一并列出。"
  - "【2026-09-11 关闭下方「(P2) 与 v3 排除的 k₀·k = 0 扇区是否是同一个排除，未做对照」一句；按 reviewer-batch2 / ms.no-ghost-theorem 第四轮审计 C3】LZ p.569 的 Heisenberg 代数由 {α^μ_n} ∪ {1} 生成，p 是零模交换子代数上的线性泛函（x·v_p = ⟨p,x⟩v_p，LZ (3.3)）；(P2) 的 x ∉ C1 读作 α^μ_0 的非零线性组合，则 (P2) ⇔ (⟨p,α^μ_0⟩)_μ ≠ 0 ⇔ p ≠ 0。故 (P2) 排除的恰是 p = 0，与 v4 (2) 的 p ≠ 0 是**同一个排除**；v4 (1) 另排除 k₀·p = 0，比 LZ 宽，那不是 (P2) 的对应物。**该对照是本项目的初等观察，不是 LZ 原句**，且依赖上述读法（若 x 可含 1 分量，(P2) 在 (P1) 下对任意 p 平凡成立，故 LZ 本意只能是前者）。下方那句按「gap 文本只追加不改写」保留原样。"
  - "度规号差：LZ (3.1) 的 g^{μν} 号差在 primary-sources-round2.md 中**没有逐字登记**。本节点按 conv.metric-mostly-plus 读作洛伦兹 (1, D−1)，依据是两条推断（g 正定会使判据平凡；D = 26 分支与 FGZ 的 V(R^{25,1}, p) 吻合），不是原文措辞。若 g 实为 mostly-minus，陈述中 h ∈ (p·p)/2 + Z₊ 的符号与 N = h − p·p/2 的换算需相应翻转。相关的 curator 观察（**不是** LZ 的说法）：worldsheet.fock-indefinite-form (4) 指出该型取到正负两种值需要 D ≥ 2，这与 LZ 的下界 (P4) 数值巧合；LZ 未说明 D ≥ 2 的理由，本项目不据此裁定该下界的来由。"
  - "「LZ 的 V(D,p)^{𝒢₊}[−h]/rad = 本项目 H_phys(p)/H_0(p)」是抽取者的对照解读，LZ 全文无 'old covariant' 字样，故 depends_on 上 worldsheet.old-covariant-physical-states 标 inferred。同理「LZ 的相对复形 = 本项目 b₀ = L₀ = 0 的 BRST 相对复形」也是解读（primary-sources-round2.md §1.4 明示须标 inferred），故 worldsheet.brst-quantization 亦标 inferred。这两条是本推导可追溯性上最软的地方：定理本体逐字可靠，把它翻译到本项目对象上的字典不逐字可靠。"
  - "LZ 的设定与本项目 worldsheet.no-ghost-theorem-v3 的设定在**证明侧**不同：26 > D ≥ 2 分支必须补一个 c = 26 − D 的不可约 Vir 模 L(26−D, 1−h) 才能做 BRST（总中心荷 26）。断言侧不受影响（左端只用 D 个自由玻色子，见目标陈述范围 (b)），但这意味着本推导**不是** v3 的 DDF 论证的推广，形式化时是两条独立路线。D = 26、h = 1 时补充模退化为 L(0,0)（平凡一维），两条路线在临界点重合。"
  - "LZ 的 D ≥ 2 下界（陈述的 (P4)）与对 p 的三条假设 (P1)–(P3) 在 ms.no-ghost-theorem 审计 B1 算出的区域里**没有**对应物；引用本节点覆盖 B1 时必须补上这四条，否则是过度断言。(P2) 与 v3 排除的 k₀·k = 0 扇区是否是同一个排除，未做对照。"
  - "LZ 的不可约最高权模 L(c,h) 在本图中尚无独立节点（worldsheet.verma-module-v2 与 worldsheet.verma-module-pbw-basis 只到 Verma 模 M(c,h)，且后者的 PBW 基与 dim V_N = p(N) 尚未形式化）。建议新建 worldsheet.irreducible-highest-weight-module；在此之前本推导借 verma-module-pbw-basis 承载这条依赖。"
  - "本推导只承接 Theorem 3.5 的 (i)(ii)。LZ §2 的一般理论（Theorem 2.13 约化公式、Theorem 2.25、Corollary 2.26 消灭定理、Corollary 2.28）本身可以各建节点，本项目暂不拆；目前它们只以 sources 的 loc 形式登记。"
  - "扫描件转录疑点三条（Theorem 2.25 的 '𝒢-free' vs '𝒢₋-free'；Corollary 2.26 第二行 'n = 0' vs 'n ≠ 0'；Corollary 2.28 的公式指数与 [·]_{q⁰} 括号归属）尚待持可选中文本 PDF 者复核（primary-sources-round2.md §10.6）。三条都不影响 Theorem 3.5 本身的逐字条件，但影响本推导 summary 第 (1) 步的转述。"
  - "【2026-09-10 追加】本推导 gaps 与 summary 中对 worldsheet.no-ghost-theorem-v3 的引用，一律可读作对其后继 **worldsheet.no-ghost-theorem-v4** 的引用：v3→v4 只改两处表述（动量限定提到全局前言；第 (2) 条显式写 p ≠ 0）与 DDF 参考方向的参数化（射线 → 去心直线），见 ms.no-ghost-theorem 第三轮审计 B1/A1。唯一需要重读的一点：v4 的第 (2) 条现在也带对 p 的存在量词，故它与本节点断言 (ii) 反方向给出的「存在某个 p 不正定」在量词结构上一致（差别只剩 LZ 还要求 (P1)–(P3)）；本节点陈述里说 v3 的 (2)「不带存在某个 p 的限定」对 v3 仍正确，对 v4 不再适用。"
  - "从文献到形式化的差距：需要把 (3) 的最后一步（Verma 模 M(c,h) 半正定的 (c,h) 区域）写成可形式化的命题，它等价于 Kac 行列式在该区域非负——本项目 worldsheet.kac-determinant 尚未形式化，worldsheet.verma-module-pbw-basis 也缺 PBW（Mathlib v4.33.1 无 PBW；已形式化的只有构造与分级那一半，即 worldsheet.verma-module-v2）。故本节点短期内不可形式化。"
