id: worldsheet.no-ghost-theorem-subcritical--via-lian-zuckerman
target: worldsheet.no-ghost-theorem-subcritical
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.virasoro-algebra-v2
    note: |
      LZ 的 𝒢 就是 Virasoro 代数（含中心元 z），Fock 模上的表示由 Proposition 3.1(i) 给出
      π(L_m) = (1/2) Σ_n :α_{m-n}·α_n:、π(z) = D·Id。归一化与 conv.virasoro-standard 一致
      （LZ 的中心荷取值 D 对应自由玻色子每个方向贡献 1）。
  - id: worldsheet.verma-module-pbw-basis
    note: |
      非 inferred：LZ Theorem 3.5 证明末句（p.571）逐字把判据归结为「the Verma module
      M(26−D, 1−h) is positive semi-definite」；Remark 3.2(ii) 定义 M(c,h) 为最高权
      cz′ + hL′₀ 的 Verma 模、L(c,h) 为其不可约商。本项目的 worldsheet.verma-module-v2
      与之逐条相同（最高权向量、L_n|h⟩ = 0 (n>0)、L₀|h⟩ = h|h⟩、按 L₀ 分级）。
      **约定差异**：本项目记 V(c,h)，LZ 记 M(c,h)；本项目节点的 V(c,h) 与 LZ 的 M(c,h)
      是同一对象，LZ 的 L(c,h) 在本项目图中尚无独立节点（见 gaps）。
      **2026-09-11 拆卡换代**：本边原指旧卡 worldsheet.verma-module，现改指
      worldsheet.verma-module-pbw-basis（它 depends_on verma-module-v2，故构造与分级仍在链上）。
      理由：LZ 用到的不只是构造，还有半正定性判据所依赖的 PBW 基与特征标
      （Proposition 3.4 的 ch_q V(D,p)、Theorem 3.5 证明末句的 ch_q L 与 sign_q L 比较），
      即拆分后归入 pbw-basis 的那一半；本推导的 gaps 也已逐字点名 PBW 与 dim V_N = p(N)。
  - id: worldsheet.bosonic-fock-space
    note: |
      非 inferred：LZ (3.2) 逐字把物质模定义为 V(D,p) = sym ⊕_{μ=1}^{D} ⊕_{n=1}^{∞} C α^μ_{-n}，
      即产生算符（**不含零模** n = 0）张成的自由模上的对称代数，与本节点的
      F(D,R) = R[X_{(μ,n)} : n ≥ 1] 逐条相同；LZ (3.1) 的
      [α^μ_m, α^ν_n] = m g^{μν} δ_{m,-n} 1 与本节点在对角 η 下的振子代数相同。
      **两处对应关系**：(a) LZ 的动量 p 通过 x·v_p = ⟨p,x⟩ v_p 作用在真空上（零模作为标量），
      本节点把动量当作外部标签（其 notes 缺口 (i)），二者一致；
      (b) 指标范围 LZ 写 μ = 1..D，本节点写 μ = 0..D−1，只是编号差异。
  - id: worldsheet.fock-indefinite-form
    note: |
      非 inferred：LZ Proposition 3.1(ii) 逐条给出本节点 (1) 的两条刻画——
      「hermitian，⟨v_p, v_p⟩ = 1，α^{μ†}_n = α^μ_{-n}，π(L_n)† = π(L_{-n})」；
      本节点 (4) 的不定性正是目标陈述里「厄米形式在 V(D,p) 上不定」那一句。
      **约定差异**：本节点是 R-双线性型（Lean 侧），LZ 是复共轭线性的厄米形式；
      在实系数、单项式正交基上二者的 Gram 矩阵相同，本推导只用到 Gram 矩阵与符号。
      本节点 (4) 要求 D ≥ 2 才能同时取到正负值——这与 LZ 的下界 (P4) D ≥ 2 一致；
      **但「LZ 的 D ≥ 2 就是为此」是 curator 的观察，LZ 未给出该下界的理由**，见 gaps。
  - id: worldsheet.kac-determinant
    inferred: true
    note: |
      LZ 证明末句只写到「iff the Verma module M(26−D, 1−h) is positive semi-definite.
      The latter is equivalent to precisely the conditions on (D, h), as given above.」——
      **最后这一步（Verma 模半正定 ⟺ 两分支条件）在抽取记录的逐字引文里没有给出引文**。
      literature/sources.bib 的 kac-kazhdan-1979 条与 primary-sources-round2.md §8/§9.3
      转述说该步用的是 Kac–Kazhdan 行列式公式（定位到 LZ Lemma 3.17、Remark 3.15），
      但那是转述（无 L1 逐字），且 primary-sources-round2.md §1.6 列举 Theorem 3.5 所依赖的
      全部模假设时**没有**列出 Lemma 3.17。
      另有一层不确定：本项目 worldsheet.kac-determinant 的一手来源是 kac-1979 / feigin-fuchs-1982
      的 Kac 行列式公式，而 LZ 引的是 Kac–Kazhdan 1979（[KK]，bib key kac-kazhdan-1979，
      内容未核实），二者相关但不是同一篇。
      故按项目规则 5 标 inferred：这条边是「该步骤在数学上必须经过 Kac 行列式/Kac–Kazhdan
      的半正定区域分析」的推断，不是在指定 loc 处能读到的引用。待 researcher 复核 LZ p.571–579
      的 Lemma 3.17 / Remark 3.15 后可改为非 inferred 并补 loc。
  - id: worldsheet.brst-quantization
    inferred: true
    note: |
      LZ 的相对复形 C*_∞(𝒢, 𝒜; V)（Definition 1.10、1.12(i)，𝒜 = 𝒢₀ = CL₀ + Cz，p.556）
      与本节点定义的 H^0_∞ 对应本项目 worldsheet.brst-quantization 里 b₀|ψ⟩ = 0、L₀|ψ⟩ = 0
      的相对 BRST 复形。**LZ 正文没有把这一对应写成编号命题**：
      primary-sources-round2.md §1.4 明确标注「由 Definition 1.6 的 ⟨β̄,x⟩ 项与
      Proposition 3.3(iii) 的 β̄ 得 η(z) = −26，故 θ(z)ω = 0 等价于 π(z) = 26……
      上面这段推导是我的解读，curator 若采用须标 inferred: true」。照办。
      注意 LZ 侧的总中心荷 26 是由 V(D,p) ⊗ L(26−D, 1−h) 凑出的（π(z) = D + (26−D) = 26），
      不是本项目 brst-quantization 默认的「物质 = D 个自由玻色子且 c^m = D」；
      brst-quantization 作为定义允许一般 c^m 的物质 CFT，故可用作依赖，但这一差异见 gaps。
  - id: worldsheet.old-covariant-physical-states
    inferred: true
