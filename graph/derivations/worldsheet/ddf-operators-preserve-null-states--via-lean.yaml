id: worldsheet.ddf-operators-preserve-null-states--via-lean
target: worldsheet.ddf-operators-preserve-null-states
kind: proof
status: formalized
depends_on:
  - id: worldsheet.ddf-operators-preserve-physical-states
    inferred: false
    note: |
      **第一块输入**：A^ε_n(H_phys(a₀)) ⊆ H_phys(a₀)，对同一 a₀，Lean
      `ddfOp_mem_towerPhysSubmodule`（DDFOperatorAll.lean）。本推导对它**调用两次**：
      一次取 n（给出 A^ε_n Χ 物理），一次取 −n（给出 A^ε_{−n}Ψ 物理，供第二块输入使用）。
  - id: worldsheet.ddf-operators-adjoint-v2
    inferred: false
    note: |
      **第二块输入**：(A^ε_n)† = A^ε_{−n} 关于塔上双线性型 ⟨·,·⟩_T，Lean
      `Fock.towerPairing_ddfOp_left`（VertexAdjoint.lean）。把 ⟨A^ε_n Χ, Ψ⟩_T 改写成
      ⟨Χ, A^ε_{−n}Ψ⟩_T，正是本推导把「保持物理」升级为「保持零态」的唯一实质步骤。
  - id: worldsheet.tower-physical-quotient-form
    inferred: false
    note: |
      **零态的定义本身**：H_null(a₀) = H_phys(a₀) ∩ H_phys(a₀)^⊥，Lean
      `mem_towerNullSubmodule`（TowerNull.lean，本卡展开/重组两次，⊢ 方向与 hΧ 方向各一次）；
      正交半用到该卡记录的 `towerNullSubmodule_le_towerPhysSubmodule`
      风格的展开（`rw [mem_towerNullSubmodule] at hΧ ⊢`）。
