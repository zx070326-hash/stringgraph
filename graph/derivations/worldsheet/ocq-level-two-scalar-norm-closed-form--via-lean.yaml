summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/LevelTwo.lean 内完成。路线：

  1. **三块基与 level 齐次性**。`traceState η = Σ_μ η^{μμ} X_{(μ,1)}²`（= α_{−1}·α_{−1}|k⟩）、
     `secondState η a = Σ_μ η^{μμ}a^μ X_{(μ,2)}`（= α_0·α_{−2}|k⟩）、
     `polSqState η a = polState η a * polState η a`（= (α_0·α_{−1})²|k⟩），
     三者都在 `levelSubmodule D R 2` 中，故 `levelTwoScalar η a c₂ c₃ ∈ F_2`。
     由此第 (2) 条的 n ≥ 3 部分是 `Lop_apply_eq_zero_of_level_lt` 的一步特化。

  2. **模算符在三块上的作用**（`mode_one_apply_*`、`mode_two_apply_*`）。
     α^μ_1 与 α^μ_2 在这三块上的值由 `Fock.mode` 的定义（湮灭部分是带 n η^{μμ} 的偏导）
     逐项算出；这是把物理侧「α_1 与两个 α_{−1} 各缩并一次给 2u」等口算翻成的机器计算。

  3. **Gram 矩阵**（`pairing_*_*`，九个配对值）。用 `pairing_creation_left` 把产生算符搬到
     另一边、再用 `pairing_monomial_monomial` 读出对角元，得到
     ⟨A,A⟩ = 2D、⟨A,B⟩ = 2s、⟨B,B⟩ = 2s²、⟨C,C⟩ = 2s、⟨A,C⟩ = ⟨B,C⟩ = 0
     （A = traceState、B = polSqState、C = secondState，s = `zeroModeSq η a` = α_0·α_0）。
     展开即第 (1) 条 `pairing_levelTwoScalar_self`：⟨ψ₂,ψ₂⟩ = 2D + 2s c₂² + 2s²c₃² + 4s c₃。
     **本步不用任何物理态条件**，故第 (1) 条对任意 c₂, c₃ 成立。

  4. **Virasoro 条件**（第 (2) 条）。`Lop_one_apply_levelTwoScalar`、
     `Lop_two_apply_levelTwoScalar` 把 L_1、L_2 在 ψ₂ 上的值化为
     (2 + 2c₂ + 2c₃s)·polState 与 (D + 2c₂s + c₃s)·1。
     配上 `mem_physSubmodule_iff_of_mem_levelSubmodule`（其 L_0 部分调用
     worldsheet.open-string-l0-equals-level-plus-mass）得 `levelTwoScalar_mem_physSubmodule`。

  5. **系数被钉死**（第 (3) 条）。把质量壳 s = 2a − 4 代入 (V1)(V2) 后消元：
     `four_mul_sub_nine_mul_coeff_two` 给 (4a − 9)c₂ = −(D − 1)，
     `four_mul_sub_nine_mul_coeff_three` 给 (4a − 9)·s·c₃ = D − 4a + 8。
     两者都是 `linear_combination` 的两行；**不做除法**，故不需要 4a ≠ 9。

  6. **闭式**（第 (4) 条，`pairing_levelTwoScalar_physical`）。把第 (1) 条的表达式乘上
     (4a − 9)²，再用第 (5) 步的两个等式作 `linear_combination` 消去 c₂、c₃，得
       (4a − 9)²⟨ψ₂,ψ₂⟩ = 2(D − 1)[16a² + (2D − 74)a + 84 − 3D]。
     这是**环上的恒等式**：没有除法，前提只有 s = 2a − 4 与 (V1)(V2)。

  7. **非空性与 a = 1**（第 (5)(6) 条）。`exists_levelTwoScalar_mem_physSubmodule` 在域上
     取 c₂ = −(D−1)/(4a−9)、c₃ = (D−4a+8)/((2a−4)(4a−9))，`field_simp` 验证 (V1)(V2)；
     `pairing_levelTwoScalar_intercept_one` 与 `levelTwoScalar_intercept_one_mem_physSubmodule`
     是它在 a = 1、s = −2、c₂ = (D−1)/5、c₃ = (D+4)/10 处的特化，给
     ⟨ψ₂,ψ₂⟩ = −2(D−26)(D−1)/25。
gaps:
  - |
    (i) **只是一族显式试探态，不是「level 2 的标量物理态」**。Lean 没有证明 ψ₂ 张成 level 2
    物理态的 SO(D−1) 不变部分，也没证解空间一维（原卡 worldsheet.ocq-level-two-scalar-norm
    第 (1) 条）。formal/TODO.md 的 `negative-norm-above-26` 条目对此有同样的登记。
    对下游的「鬼」用途这一条无关紧要（一个负模态就够），但对「level 2 标量模」这个读法要紧。
  - |
    (ii) **判别式的分类讨论未形式化**（**2026-09-11 缩小**）。
    ~~第 (4) 条只说判别式是 4(D−1)(D−25)，这句本身在 Lean 里也只出现在文档注释中，不是定理~~
    ——**已关闭**：formalizer（small-2，合并提交 6853ad8）在同一文件补了
    `Fock.levelTwo_norm_discriminant {R} [CommRing R] (D : ℕ) (a₀ : R) :
    64*(16a₀² + (2D−74)a₀ + 84 − 3D) = (32a₀ + 2D−74)² − 4(D−1)(D−25)`，
    `ring` 一行，**任意交换环**（不需要 ℚ-代数，对 a₀、D 无假设）。⇒ 第 (4) 条末句逐字有定理。
    **仍未形式化的是符号分析与分类**：
      · 「1 ≤ D ≤ 25 ⇒ 方括号对一切 a₀ 非负；D > 25 ⇒ 存在 a₀ 使其为负」需要**有序域**上的判断
        （配方后 = (32a₀+2D−74)²/64 − (D−1)(D−25)/16），LevelTwo.lean 的 docstring 逐字写
        "That sign analysis is *not* proved here; only the algebraic identity is."；
      · D ≤ 24 / D = 25 / D ≥ 26 的三分，以及 D = 26 时 2(8a−3)(a−1) 在 3/8 < a < 1 上为负，
        都在原卡 --via-level-two-gram 那一侧（rigorous），本推导不覆盖。
    ⚠ 注意这两条不是同一件事：恒等式是代数（已机检），符号分析是序（未机检）。
  - |
    (iii) **第 (5) 条只证存在、不证唯一**。`exists_levelTwoScalar_mem_physSubmodule` 把解代回去
    验证；由第 (3) 条两式作除法得唯一性这一步在 Lean 中未单列（一行域上除法）。
  - |
    (iv) **不给 D ≤ 26 的非负性**。那是无鬼定理本身。
  - |
    (v) **继承整个形式化岛的缺口**：逐动量扇区（无位置算符 x^μ、无对 k 的直积分）、代数版
    （无完化）、对角 η、R-双线性型而非 Hermitian 半双线性型
    （见 worldsheet.fock-indefinite-form--via-lean 的 gaps (iii)(iv)(vi)）。
  - |
    (vi) **公理检查未逐字登记**。formal/TODO.md 的 `negative-norm-above-26` 条目里没有像该文件
    其余条目那样写「无 sorry，公理只有标准三条」；curator 只做了 grep（`sorry` 零命中），
    **未重跑 `lake build`，也未跑 `uv run stringgraph check-axioms`**。
    按 literature/sources.bib 的 stringformal-2026 证据标准，这一条应由 formalizer 或 lead
    在合并 formal 分支时补跑并登记。
notes: |
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
  （lake build 通过、目标声明无 sorry、公理仅 propext / Classical.choice / Quot.sound）。
  本推导依据的是 formal/ 的自述与 formal/TODO.md 的登记，以及 c32f026 已由 lead 合并进 main；
  公理一项的登记缺失见 gaps (vi)。

  【与 worldsheet.ocq-level-two-scalar-norm--via-level-two-gram 的关系】那是同一物理计算的
  **手算版**（rigorous，reviewer-ch4 已复核），本推导是**机器版**，两者互为独立核算：
  手算走「基 → 作用结果 → Gram → 通分」，Lean 走「MvPolynomial 上的显式多项式 →
  `pairing_creation_left` → `linear_combination`」，中间量逐项吻合。
  这不是同一条推导的两个副本：原卡多断言解空间一维与判别式分类，本卡不断言它们，
  故两卡是不同的陈述，各自挂各自的推导。

  【Lean 侧的两处比图侧更强/更弱】
  - 更强：第 (4) 条在**任意交换 ℚ-代数**上成立（不需要域、不需要 4a ≠ 9、不需要 s ≠ 0），
    因为分母已清；原卡写成 ⟨ψ₂,ψ₂⟩ = (D−1)[…]·2/(4a−9)² 时必须先设 4a ≠ 9。
  - 更弱：第 (1)(2) 条要求 η^{μμ}η_{μμ} = 1（`hη`），mostly-plus 满足；原卡的手算同样默认这一点。

  【gaps (ii) 的最小补法（2026-09-11，curator，lean-wire-7）→ **已落地**】当时提请 formalizer
  在 LevelTwo.lean 补一行环上恒等式 64·(16a₀² + (2D−74)a₀ + 84 − 3D) = (32a₀ + 2D−74)² − 4(D−1)(D−25)；
  formalizer（small-2，合并提交 6853ad8）已补为 `Fock.levelTwo_norm_discriminant`，
  且比提议的更一般（任意交换环，而非 ℚ-代数）。gaps (ii) 已相应改写：代数那半关闭，
  有序域上的符号分析那半保留。**本条记录保留**，因为它是「图侧提出的最小 Lean 缺口
  被 formalizer 当日补上」的一次完整往返，对校准「图-形式化」接口有用。
