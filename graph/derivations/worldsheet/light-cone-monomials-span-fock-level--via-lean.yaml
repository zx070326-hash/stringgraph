summary: |
  证明分两个包含方向：

  **`lcSpan_le_levelSubmodule`（容易的一半，`≥`）**：光锥单项式 `lcMonomial F d` 展开定义就是
  `lcCrea` 的乘积，而 `lcCrea η w n = Σ_μ η_μ w^μ X_{(μ,n)}` 是普通生成元 `X` 的 R-线性组合，
  乘出来（多重线性 + `Fock.levelSubmodule` 是齐次多项式子模）仍落在同一个 `levelSubmodule`。
  不需要 `hD`。

  **`levelSubmodule_le_lcSpan`（困难的一半，`≤`，目标卡断言的实质内容）**：用
  `span_range_frameVec_eq_top hD F` 把方向表 `frameVec F` 张成整个 `Fin D → R`，
  于是每个普通生成元方向都能写成方向表的 R-线性组合；把这个分解代入任意 level-N
  齐次单项式（普通基下），逐项换基后仍是 level-N（换基是线性的，不改变次数），
  展开后落在 `lcSpan F N` 里。

  两半合起来给 `levelSubmodule_eq_lcSpan`，`levelSubmodule_eq_span_lcMonomial` 只是把
  张成的生成集合从「像集合」换写成「对子类型取值域」，`rfl` 完成。

  **为什么标 formalized**：目标卡的全部断言（张成等式）由这一条无 sorry 的 Lean 定理
  逐字给出，命名字典见目标卡 sources；唯一依赖（DDF 光锥标架对象）effective 也是
  formalized。
