      Corollary 10.2：由此得到中心荷 **c = 1** 的 Virasoro 表示。
      完整证明在 Appendix A.2（Lemma A.6–A.12）。
      该定理已在 Lean 中机器验证，声明名 `sugawaraRepresentation_of_representation_heisenbergAlgebra`。
