      **本推导的主数学来源**（Kytölä, arXiv:2510.21741，开放获取，researcher 于 2026-09-10 全文 16 页逐页核实）。
      Theorem 10.1：在假设 (H)（Heisenberg 关系 (16)：J_k∘J_l − J_l∘J_k = k δ_{k,−l} id_V）
      与 (T)（局部截断 (17)：对每个 v ∈ V 存在 K_v 使 l ≥ K_v 时 J_l v = 0）下，
      算子 (19) L_n v = ½ Σ_{k∈Z} :J_{n−k}J_k: v 满足
