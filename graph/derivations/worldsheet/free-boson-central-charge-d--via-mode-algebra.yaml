    loc: "Lecture 2 的 oscillator/Fock 表示部分（Heisenberg 代数的 Fock 表示上的 Virasoro 作用），**Lecture 编号与定理编号未核实**"
    note: |
      按 lead 裁决 2（2026-09-10）登记为本推导的数学来源。**编号未核实**：
      抽取者/curator 手上没有该书，无法确认「Lecture 2」是否正确，也无定理编号。
