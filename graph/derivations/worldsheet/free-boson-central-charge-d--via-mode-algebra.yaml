summary: |
  纯代数计算，全部在 worldsheet.virasoro-generators-free-boson 定义的 Fock 空间 F 上进行，
  不用算子乘积展开、不用围道积分：
  (1) 先算 [L_m, α^μ_n] = -n α^μ_{m+n}。这一步是有限计算：L_m 中只有两项与 α^μ_n 不对易，
      用 [α^μ_p, α^ν_q] = p η^{μν} δ_{p+q,0} 展开即得。
  (2) 由 (1) 得 [L_m, L_n] = (m-n) L_{m+n} 对 m + n ≠ 0 成立——此时和式中不出现
      需要重排的项，正规序不产生额外常数。
  (3) 对 n = -m（m > 0），把 [L_m, L_{-m}] 中出现的 α_{k}·α_{-k} 重排成正规序，
      每次重排给出 c-数 η^{μν}η_{μν} = D；求和范围有限，为 k = 1,…,m-1，得中心项
        (1/2) D Σ_{k=1}^{m-1} k(m-k) = (D/12) m(m^2 - 1)。
      故 [L_m, L_{-m}] = 2m L_0 + (D/12) m(m^2-1)。
  (4) 与 conv.virasoro-standard 的归一化比较，读出 c = D。
  每一步都只涉及 Fock 空间上的有限和，因为作用在任一 v ∈ F 上时只有有限多项非零
  （worldsheet.virasoro-generators-free-boson 的良定义性论证）。

  与来源的对应：virasoro-lean-2025 的 Theorem 10.1 正是 D = 1 的情形（单个 Heisenberg 族），
  其假设 (H)、(T) 分别对应本图的 [α_p, α_q] = p δ_{p+q,0}（单分量）与 Fock 空间上的局部截断；
  结论 (m³−m)/12 即 c = 1。本推导把它推广到 D 个互相对易的拷贝（步骤 (3) 中的 η^{μν}η_{μν} = D）。
gaps:
  - "**来源只给 c = 1**（单个 Heisenberg 代数，virasoro-lean-2025 Thm 10.1 / Cor 10.2）。
     c = D 由 D 个互相对易的拷贝相加得到，**这一步是本项目的初等推理，不在来源里**；
     且来源全程不含洛伦兹不定内积（Kytölä 不引入号差），而不定内积正是无鬼定理的全部难点。
     本推导只断言代数关系，不涉及内积，故这一缺口不影响本条的正确性，
     但下游任何用到正定性的结论都不能引本条为据。"
  - "本推导给出的是**振子代数的 Fock 表示上**的陈述，与「二维自由标量场论的中心荷」之间
     还差一步物理解释（即该 Fock 空间就是自由标量 CFT 的态空间）；
     那一步经 worldsheet.state-operator-isomorphism，属 --via-ope 路线的内容。
     换言之：本条使 c = D 作为**代数命题**成立，但「c = D 是自由标量 CFT 的中心荷」
     这一物理陈述仍封顶在 physical-argument。"
  - "计算在 mostly-plus 号差下做，η^{μν}η_{μν} = D 与号差无关，但 Fock 空间的内积不定
     （X^0 方向），本推导不涉及内积，故不受影响。"
  - "kac-raina-1987 与 schottenloher-2008 的编号仍未核实，两者在本推导中只作背景引用，
     不承载论证；不得据它们升级或降级本条的状态。"
