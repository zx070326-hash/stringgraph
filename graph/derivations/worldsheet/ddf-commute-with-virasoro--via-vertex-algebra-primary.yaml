      不是文献某处的论证依赖。
  - id: worldsheet.old-covariant-physical-states
    note: 目标陈述末段推论（DDF 算子把物理态映为物理态）所用的物理态条件；本推导的推论一段与 --via-conformal-weight 相同。
  - id: worldsheet.virasoro-algebra-v2
    note: L_m 之间的 Virasoro 关系；推论中把 L_0 条件沿塔搬运时用到。
sources:
  - ref: gebert-nicolai-1995
    loc: "§2.1 'Vertex algebras', p. 580, eq. (2.36) (Jacobi identity, 公理), (2.37)/(2.38) (associativity / commutator formula, 逐字为 (2.36) 的 m = 0 与 l = 0 特例), (2.41); p. 579, eq. (2.32) (regularity 公理); p. 582, eq. (2.55)–(2.57); §3.1 'DDF vertex operators', p. 593, eq. (3.2)–(3.3) (A^ξ_m := (ξ(−1)e^{mk})_0), p. 594, eq. (3.5)"
    note: |
      **L1（researcher 2026-09-11 逐页读期刊排版 PDF，途径 pure.mpg.de/rest/items/item_153125_1/component/file_153124/content；
      arxiv.org/pdf/hep-th/9406175 本轮 404）。逐字文本见 literature/extractions/gsw-1987-v1.md §4（E14–E17）与 sources.bib。**
      本推导的**全部论证**取自本条：(2.57) 逐字
      `[L_(n), ψ_m] = {(Δ − 1)(n + 1) − m} ψ_{m+n}   ∀ m, n ∈ ℤ`，引出句逐字
      「We immediately infer from (2.41) that, for ψ ∈ ℛ_(Δ)」；(3.5) 逐字
      `[L_(n), A^ξ_m] = 0   ∀ n, m ∈ ℤ`，引出句逐字「Moreover, **it is clear from (2.57)** that these operators
      commute with the Virasoro algebra」。作者自陈的严格程度是「immediately infer / clear from」，
      即**从已导出的恒等式直接读出**，不是 "one can show" 式的物理论证；整节 §2.1 是公理化论述。
      ⚠ **模式约定陷阱**：(2.31) `𝒴(ψ,z) = Σ ψ_n z^{-n-1}` 与 (2.47) 的按权移位展开
      `Σ ψ_(n) z^{-n-Δ}` 是两套，由 (2.48) `ψ_n = ψ_(n+1-Δ)` 换算；**(2.57) 里的 ψ_m 是 (2.31) 型**。
      本推导只在 Δ = 1 处使用，而 Δ = 1 时两套重合，故不会差移位。
  - ref: goddard-2008
    loc: "§5 'Spectrum Generating Algebra', p. 11, eq. (5.4)（arXiv:0802.3249v1）"
    note: |
      **旁证，不承载论证。** 逐字 `[L_m, A^i_n] = 0.`，引出句逐字「The DDF operators, A^i_n, are well-defined
      on states of momentum p, such that k · p = 1 and they can be used to generate physical states because
      **they commute with the Virasoro algebra**,」。**对 m 无限制**，量词与 G–N (3.5) 及目标陈述一致。
      **本文是历史综述，(5.4) 是带编号的显示公式但无证明、无「we prove」**，故只升可追溯性。
      号差 (−,+,+,+)（§1, p.1, (1.1) 后逐字），与 conv.metric-mostly-plus 一致，**无需换算**；
      归一化逐字 k·p = 1（α' = 1/2 下即本图 (★)）。
      注：旧节点把本文记为「不给编号」，那对**无鬼定理本身**成立（§6, p.15, (6.4) 确无编号），
      对本对易关系不成立。
summary: |
  **顶点代数路线：不用围道形变、不用径向排序、不用收敛性，全程形式级数。**
  这是对 --via-conformal-weight 的一条独立替代，绕开该推导 status 的上限
  worldsheet.ope-commutator-dictionary。论证逐字取自 Gebert–Nicolai (CMP 172 (1995) 571–622)。

  第 0 步（框架与模式约定）。在顶点代数 (ℱ, 𝒴, |0⟩, ω) 中按 (2.31) 展开 𝒴(ψ, z) = Σ_{n∈Z} ψ_n z^{-n-1}，
  L_(n) := ω_{n+1}（公理 (2.35)）。求和的有限性由**正规性公理 (2.32)**（ψ_n φ = 0 对充分大的 n）保证，
  故下面每一步的级数都是有限和，无需任何收敛性论证。

  第 1 步（Jacobi 公理 ⇒ 对易子公式）。顶点代数的 Jacobi 恒等式 (2.36)
    Σ_{i≥0} (−1)^i C(l,i) ( ψ_{l+m−i}(φ_{n+i}ξ) − (−1)^l φ_{l+n−i}(ψ_{m+i}ξ) )
      = Σ_{i≥0} C(m,i) (ψ_{l+i}φ)_{m+n−i} ξ,   ∀ ψ, φ, ξ ∈ ℱ, ∀ l, m, n ∈ Z
  取 l = 0 给出 **commutator formula (2.38)**
    [ψ_m, φ_n] = Σ_{i≥0} C(m, i) (ψ_i φ)_{m+n−i}
  （G–N 正文逐字：(2.37)、(2.38) 分别是 (2.36) 的 m = 0 与 l = 0 特例）。
  这一条与 math.locality-ope-equivalences-v2 第 5 条是同一公式。

  第 2 步（ψ = ω ⇒ (2.41)）。在 Jacobi 恒等式中取 ψ = ω 并作 Res_{z_0}[Res_{z_1}[z_1^n · (Jacobi)]]（G–N 逐字），得
    (2.41)  [L_(n), 𝒴(φ, z)] = Σ_{i≥−1} C(n+1, i+1) 𝒴(L_(i) φ, z) z^{n−i},   ∀ n ∈ Z, ∀ φ ∈ ℱ。
  右端的和由正规性公理截断为有限和。

  第 3 步（primary ⇒ (2.56)/(2.57)）。设 ψ ∈ ℛ_(Δ) 是权 Δ 的（共形）primary，即 (2.55)
    (L_(n) − δ_{n0} Δ) ψ = 0   ∀ n ≥ 0。
  代入 (2.41)：i ≥ 1 的项全部因 L_(i)ψ = 0 而消失，只剩 i = 0（L_(0)ψ = Δψ）与 i = −1（L_(−1)ψ，平移），于是
    (2.56)  [L_(n), 𝒴(ψ, z)] = z^n { z d/dz + (n+1)Δ } 𝒴(ψ, z)   ∀ n ∈ Z,
  逐模态即
    (2.57)  [L_(n), ψ_m] = { (Δ − 1)(n + 1) − m } ψ_{m+n}   ∀ m, n ∈ Z。

  第 4 步（Δ = 1、m = 0 ⇒ (3.5)）。横向 DDF 算子按 (3.2) **定义为零模**
    A^ξ_m := (ξ(−1) e^{mk})_0 = Res_z[ 𝒴(ξ(−1)e^{mk}, z) ] = Res_z[ ξ(z) 𝒴(e^{mk}, z) ]
  （末式无需正规序，G–N 逐字理由是 ξ·k = 0）。态 ξ(−1)e^{mk} 的权为 1 + ½(mk)² = **1**（用 k·k = 0），
  且在 ξ·k = 0 下满足 (2.55)，即它是**权 1 的 primary**。在 (2.57) 中取 Δ = 1 与模指标 m = 0：
  右端系数 {(1 − 1)(n + 1) − 0} = 0，故
    (3.5)  [L_(n), A^ξ_m] = 0   ∀ n, m ∈ Z。
  **注意两个 m 不是同一个**：(2.57) 的 m 是**模指标**（这里取 0），(3.5) 的 m 是**动量指标**
  （藏在 e^{mk} 里，任意）。这正是「零模」这一措辞在本路线中的关键作用。

  第 5 步（翻回本图的对象）。按 depends_on 中 worldsheet.ddf-operators-v5 的 convention_map，
  G–N 的 (ξ, k, r, A^ξ_m, L_(n)) 逐项对应本图的 (ε^i, k_0, p, A^i_n, L_m)，
  于是 (3.5) 即目标陈述 [L_m, A^i_n] = 0 对所有 m ∈ Z、所有 n ∈ Z \ {0}
  （G–N 的量词更宽，含 n = 0；目标只取 n ≠ 0，是其特例）。

  推论（物理态 → 物理态），与 --via-conformal-weight 逐字相同、不依赖本路线的任何新内容：
  若 L_m|ψ⟩ = 0 ∀ m > 0，则 L_m A^i_n|ψ⟩ = A^i_n L_m|ψ⟩ = 0；L_0 一条连同质量壳记账
  α'(p + n k_0)² = α' p² + n（由 k_0² = 0 与 (★)）读，两处变化相消。
gaps:
  - |
    **★ 本推导有效状态的唯一压制点：图中缺一张「D 个自由玻色子（洛伦兹不定号差、含类光方向）
    ⊗ C[Z k_0] 构成顶点代数、动量塔是其模」的卡。**
    G–N 工作在**格点顶点代数** V_Λ 里（Λ 偶格；E₁₀ 情形洛伦兹号差；另用自对偶根格的有理扩张作辅助），
    **不含 bc 鬼场、不用路径积分**，所以本推导**不需要** worldsheet.string-cft-is-a-vertex-algebra-v2
    里的鬼场部分，也不需要它的复解析局域性 (ii)。
    需要的是「Heisenberg 顶点代数 ⊗ 类光方向的格点部分」这一块——它在数学文献里是标准的严格构造
    （FLM / Borcherds 一系），**但本图没有卡，researcher 本轮也没有为它取到带编号的来源**。
    按项目原则 5，把桥接边 inferred 到图中最接近的卡（string-cft-is-a-vertex-algebra-v2，effective = open），
    于是**本推导的有效状态是 open，而不是 rigorous**。
    ⇒ **补上那张卡（并给它一条来自 FLM/Borcherds 或 Lepowsky–Li 的带编号推导）是把本条升到 rigorous 的
    唯一待办**；补上之后本推导的其余依赖全是 rigorous / formalized（见 depends_on）。
  - |
    **连续动量 vs 格点动量：本推导的第二条真实接缝。**
    目标陈述的定义域是扇区 {p : k_0·p ≠ 0} 上的动量塔，p **连续取值**；G–N 的 ℱ 只含格点动量 e^{r}, r ∈ Λ。
    好消息是本推导实际只用到塔内部的配对：k_0·k_0 = 0 与 2α' k_0·p = 1（即 G–N 的 k·k = 0, k·r = 1），
    **都是整数值**，而 p·p 从不进入 (3.5) 的推导；所以「把塔看成 π_D ⊗ C[Z k_0] 的模」并不需要 p² 是（偶）整数。
    但这一观察是**本项目的推断**，G–N 没有为连续动量作任何陈述（他们反而说需要格的有理扩张），
    因此它属于上一条缺卡的内容，不能单独当作已论证。
  - |
    **图中没有「顶点代数 Jacobi 恒等式 / Borcherds 恒等式」卡。**
    本推导第 1、2 步的出发点 (2.36) 是顶点代数**公理**，图里最接近的 math.vertex-algebra-associativity
    只是它 m = 0 的特例（G–N (2.37)），故那条边标 inferred。建议后续 researcher 取
    Frenkel–Ben-Zvi / Kac (4.8.1) 的 Borcherds 恒等式带编号措辞，新建 math.vertex-algebra-jacobi-identity
    并把本推导改挂过去（本推导的 summary 与 status 届时不需要改）。
  - |
    **G–N ↔ 本图的归一化字典是本项目的推断，无逐字来源。**
    见 worldsheet.ddf-operators-v5 那条边的 convention_map：格点向量 ↔ (2α')^{1/2}×动量、
    ξ(z) ↔ 归一化后的 ∂X^i(z)、Res_z ↔ ∮dz/2πi、r·k = 1 ↔ (★)。三家来源都在 α' = 1/2 或格点单位下工作，
    **一般 α' 的形式仍无文献来源**（与 worldsheet.ddf-operators-v5 notes 的自我登记一致）。
    好在本推导的结论 [L_m, A^i_n] = 0 右端是 0，**对归一化不敏感**——字典出错也不会改变结论，
    这一点与 worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket 不同（那里右端是 m δ^{ij}）。
  - |
    **ε·p = 0（偏振与态动量正交）：核查结论是「不是本命题的缺口」，但推理是本项目的。**
    G–N §3.2 末 (p. 599) 逐字要求 d − 2 个 orthonormal ξ_i「orthogonal to **both r and k**」，
    比本图的 ε·k_0 = 0 多一条（literature/extractions/gsw-1987-v1.md Q5 未裁决）。
    本推导的核查：(3.5) 的证明**只用到** ξ·k = 0 与 k·k = 0（使 ξ(−1)e^{mk} 是权 1 primary），
    r 根本不进入 (2.55)/(2.57)；G–N 自己在 (3.1) 处也逐字只写「since ξ·k = η·k = k·k = 0」。
    ξ·r = 0 出现在 §3.2 是为了给**无鬼定理**挑一组张成 span{r,k} 之正交补的标架。
    又：G–N (3.1) 逐字说横向空间是**商** {ξ : ξ·k = 0, ξ ≡ ξ mod ℝk}，且 k(−1)e^{nk} = (1/n)L_(−1)e^{nk}，
    而 Res_z 𝒴(L_(−1)χ, z) = Res_z ∂_z 𝒴(χ, z) = 0，故 A^{ξ+ck}_m = A^ξ_m（m ≠ 0）：
    总可以把代表元换成满足 ξ·r = 0 的那个（c = −(ξ·r)/(k·r)），且 ξ·ξ 不变（因 ξ·k = 0）。
    **⇒ ε·p = 0 是代表元的选取，不是额外前提。** 但「WLOG」这句话 G–N 没写，本条推理是本项目的，
    因此登记在 gaps 而不是写进 summary。
  - |
    **量词：本推导用的是塔版 ∀ m ∈ Z，不是 tomassini-2008 的固定纤维版。**
    tomassini-2008 Theorem 2.4 的 (2.38) 给的是 `[L_m, A^i_n] = 0, m ≠ 0` 加 `[L_0, A^i_n] = −n A^i_n`，
    因为他的 DDF 是**修改版**、保持单个纤维 𝒦_p 不变、不移动动量（Remark 2 逐字 "fundamentally different"）。
    本推导与目标陈述走的是 Goddard / G–N 那一支（塔上、∀m）。**本推导刻意不引 tomassini-2008**
    （literature/extractions/gsw-1987-v1.md Q3 的推荐做法），以免回译审计把量词判为抄错。
  - |
    **Lean 侧：本路线尚未起步，且与 --via-conformal-weight 的 Lean 路线不是同一条。**
    formalizer 正在做的 VertexWeight.lean 走的是「e^{i k_0·X} 权为 0」的基例（相干态/围道路线）。
    本路线要形式化的是顶点代数公理 ⇒ (2.41) ⇒ (2.57)，Mathlib 侧 Mathlib/Algebra/Vertex/ 只有
    VertexOperator 的骨架、Locality 仍写在 TODO 段（math.formal-distribution-locality notes，2026-09-11）。
    **本推导不得标 formalized。**
  - |
    k_0·p = 0 的扇区（含 p = 0）不在覆盖范围内：那里 A^i_n 本身没有定义（worldsheet.ddf-operators-v5 的 (★)）。
notes: |
  【本推导的来历，2026-09-11（四），curator】researcher 在 literature/extractions/gsw-1987-v1.md §4 与 §9(2)
  给出的建议：现有 --via-conformal-weight 的 gaps 第 3 条逐字说「第 3 步的围道形变依赖
  worldsheet.ope-commutator-dictionary（physical-argument）……**这是本推导 status 的直接上限**」。
  G–N (2.57) 提供了一条**不经过围道形变**的路线，本节点把它登记下来。
  **两条推导并存，工具自动取有效状态高者**（docs/STATUS_LEVELS.md）。

  **status 定级理由（status = 本节点自身论证的严格程度，不是有效状态）**：
  自身论证是 CMP 论文 §2.1 公理体系内的形式级数推导，逐环节都有编号且已 L1 核实
  ((2.36) → (2.38)/(2.41) → (2.56)/(2.57) → (3.5))，作者自陈「We immediately infer」「it is clear from (2.57)」，
  没有任何解析操作，故 **rigorous**。
  **但有效状态是 open**：桥接边（图中缺「自由玻色子顶点代数」卡，inferred 到
  worldsheet.string-cft-is-a-vertex-algebra-v2）把它压下去了。见 gaps 第 1 条。
  这不是定级矛盾，而正是本图 status / effective 分离的设计意图：
  **「论证本身是严格的」与「本图已把它的前提接好」是两件事，这里第二件还没做。**

  **本路线相对 --via-conformal-weight 的三条结构性优势**（供 formalizer 与 reviewer 参考）：
  (1) 不用 worldsheet.ope-commutator-dictionary（围道形变，physical-argument），
      也不用 worldsheet.free-scalar-propagator / worldsheet.conformal-normal-ordering-v2（两条都 physical-argument）；
  (2) 不用 worldsheet.normal-ordering-modes-agree 那条「Sugawara L_m = T 的 Laurent 模」接缝
      （--via-conformal-weight 的 gaps 第 4 条），因为顶点代数里 L_(n) 由公理 (2.35) 直接从 ω 给出；
  (3) A^i_n 的良定义性（worldsheet.ddf-transversality-gives-local-finiteness）在本路线里
      **由正规性公理 (2.32) 直接保证**（G–N §2.1，p. 579；extractions/gsw-1987-v1.md E18 备注），
      不需要单独论证「ε·k_0 = 0 ⟹ 模态上界」。
  代价只有一条：需要先把「弦论的自由玻色 Fock 空间确实是（模）顶点代数」这张卡建起来，
  而这正是 gaps 第 1 条。**换言之，本路线把三条 physical-argument 的接缝换成了一条 open 的接缝。**

  **不碰的东西**：本节点不改 --via-conformal-weight（另一 agent 持有），不改 worldsheet.ddf-operators-v5，
  不改 worldsheet.no-ghost-theorem-v4--via-goddard-thorn。
