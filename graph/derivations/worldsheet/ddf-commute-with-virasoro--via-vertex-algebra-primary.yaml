    「把塔看成 π_D ⊗ C[Z k_0] 的模并不需要 p² 是（偶）整数」是本项目的推断。
    **Li–Wang (3.17) 正面给出了带编号出处**：L° = { λ ∈ 𝔥 : ⟨α, λ⟩ ∈ Z ∀α ∈ L }，
    在 L = Z k 时只对 ⟨k, λ⟩ 提整性要求，**λ 本身不必落在格里，⟨λ,λ⟩ 不必是偶整数**
    ⇒ p 的横向与纵向分量可连续取值，只有 2α'(k_0·p) 被整性约束（本图 ddf-operators-v5 说明 (c) 同一条件）。
    这一层现由 worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower (3)(iv) 承载。
