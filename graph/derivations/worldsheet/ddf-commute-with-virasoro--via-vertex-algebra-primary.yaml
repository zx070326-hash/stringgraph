      G–N 的 Heisenberg 场 ξ(z) = Σ_n ξ(n) z^{-n-1} 对应归一化后的 ∂X^i(z)，
      顶点算子 𝒴(e^{mk}, z) 对应 :e^{i m k_0·X(z)}:，故零模 (3.3) Res_z[ξ(z) 𝒴(e^{mk}, z)]
      与 v5 的 ∮(dz/2πi) ∂X^i(z) e^{i n k_0·X(z)} 逐字同型（测度 Res_z 与 ∮dz/2πi 同义）。
      G–N 在格点单位下工作（相当于 α' = 1/2），本图保留一般 α'。
    note: |
      被断言的对象。G–N (3.2) 把横向 DDF 算子**定义为零模** A^ξ_m := (ξ(−1)e^{mk})_0，
      与 v5 的围道定义在上面的字典下同型；类光条件 k_0² = 0（G–N: k·k = 0）与横向条件 ε·k_0 = 0
      （G–N: ξ·k = 0）都是 v5 写死的前提，也正是 G–N (3.1)/(3.3) 逐字用到的两条。
  - id: worldsheet.virasoro-generators-free-boson
    inferred: true
    note: |
      目标陈述里的 L_m（Sugawara 型 ½ Σ_n :α_{m-n}·α_n:）。G–N 的 L_(n) 由公理 (2.35) ω_{n+1} = L_(n)
      从共形向量 ω 得到；对自由玻色/格点顶点代数 ω 就是 Sugawara 向量，两者给出同一族算子。
      **但 researcher 本轮未读到 G–N 写出 Sugawara 显式表达式的那一页**（读的是 pp. 571–572, 579–583, 593–600），
      故这条识别在来源处找不到逐字论证，标 inferred。
  - id: worldsheet.momentum-tower-fock-space
    note: |
      目标陈述的量词定义域：「在该扇区的动量塔 ⊕_{N∈Z} F(p + N k_0) 上」，且 L_m 逐层用该层动量。
      G–N 的顶点代数 ℱ 天然含全部格点动量 e^{r+nk}，**塔在其中是自动的**——这正是 (3.5) 的量词
