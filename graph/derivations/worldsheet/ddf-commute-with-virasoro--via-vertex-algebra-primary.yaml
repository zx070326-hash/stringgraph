id: worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary
target: worldsheet.ddf-commute-with-virasoro
kind: proof
status: rigorous
depends_on:
  - id: math.formal-distribution-locality
    note: |
      本推导全程停在形式级数层面所用的框架：模式展开 Y(ψ, z) = Σ_n ψ_n z^{-n-1}、Res、
      形式分布与局域性都在这张卡上。Gebert–Nicolai §2.1 的顶点代数公理体系（含局域性）
      与本卡的 Schottenloher Definition 10.7 是同一个对象，只是记号不同（G–N 写 𝒴，本卡写 A(z)）。
      **本推导不含任何围道、径向排序或收敛性断言**，这正是它区别于 --via-conformal-weight 的地方。
  - id: math.locality-ope-equivalences-v2
    inferred: true
    note: |
      G–N 链条的第一环是 **commutator formula (2.38)**
      `[ψ_m, φ_n] = Σ_{i≥0} C(m,i) (ψ_i φ)_{m+n-i}`（G–N 正文逐字：(2.37)/(2.38) 分别是 Jacobi 恒等式 (2.36)
      的 m = 0 与 l = 0 特例）。这与本卡第 5 条「模式对易子公式」
      `[A_{(m)}, B_{(n)}] = Σ_{j=0}^{N-1} (m choose j) C^j_{(m+n-j)}` **是同一条公式**，
      对应 C^j(w) = 𝒴(ψ_j φ, w)（顶点代数里 OPE 系数场本身是顶点算子，即 math.vertex-algebra-associativity）。
      **「(2.38) 就是本卡第 5 条」这一识别是本项目的推断**：G–N 不引 Schottenloher，Schottenloher 第 10 章
      也不写 (2.38)。故标 inferred。本卡在此只承担「形式分布层面的对易子公式是一条严格定理」这一半，
      G–N 侧的严格性由其自身的公理化推导承担。
  - id: math.vertex-algebra-associativity
    inferred: true
    note: |
      **图中没有「顶点代数 Jacobi 恒等式 / Borcherds 恒等式」卡**（2026-09-11 全图 search 无匹配），
      而 G–N 链条的出发点 (2.36) 正是该公理。本卡（Frenkel–Ben-Zvi Theorem 3.2.1，结合性）
      是 (2.36) 在 m = 0 处的特例（G–N (2.37)），**严格弱于 (2.36)**，
      因此它只是「图中最接近顶点代数公理体系的一张已核实的卡」，不是本推导真正用到的那条恒等式。
      标 inferred，并在 gaps 第 3 条登记缺卡。
  - id: worldsheet.string-cft-is-a-vertex-algebra-v2
    inferred: true
    note: |
      **桥接边：本推导有效状态的直接上限，也是它唯一的实质缺口。**
      G–N 的前提是**格点顶点代数** V_Λ（Λ 为偶格，E₁₀ 情形取洛伦兹号差的 Λ；
      文中另用了自对偶根格的有理扩张作辅助），**不含 bc 鬼场**，也不用路径积分。
      因此本推导**不需要**本卡里的鬼场部分；它需要的是图中尚不存在的一张卡：
      「D 个自由玻色子（洛伦兹不定号差、含类光方向 k_0）的 Heisenberg 顶点代数 ⊗ C[Z k_0]，
      连同顶点算子 e^{i n k_0·X}，构成顶点代数，而动量塔 ⊕_N F(p + N k_0) 是其模」。
      本卡是图中最接近的卡（其 (a) 部分正是 D 个洛伦兹号差自由玻色子），但它
      **既多要了鬼场、又只断言局域性、且其场集合 E 逐字排除 e^{i k·X}**，
      所以这条边只能标 inferred。**本卡无推导、effective 为 open，故本推导的有效状态被压到 open**，
      尽管其自身论证（status: rigorous）是 CMP 论文里的形式级数证明。见 gaps 第 1、2 条。
  - id: worldsheet.ddf-operators-v5
    convention_map: |
      G–N ↔ 本图的字典（**本项目推断**，见 gaps 第 4 条）：G–N 的格点向量对应本图 α_0-归一化的动量
      （r ↔ (2α')^{1/2} p，k ↔ (2α')^{1/2} k_0），于是 G–N 的常设假设 r·k = 1 逐字对应本图的
