id: worldsheet.kac-determinant-level-four--via-lean
target: worldsheet.kac-determinant-level-four
kind: proof
status: formalized
depends_on:
  - id: worldsheet.shapovalov-form-uniqueness
    inferred: false
    note: |
      提供两件事：
      (a) 「归一化逆变型」这一概念本身（目标陈述的前提，Lean 侧 `IsContravariant` + `hB1`）；
      (b) **对称性**——`gram_level_four_det` 的证明开头用十次 `hB.comm` 把下三角的十个元
          换成各自的转置，而 `IsContravariant.comm` 正是该卡 (2)（经 `flip_eq`，即该卡的唯一性
          论证）。**这不是记号约定，是被用到的定理**。
      另外该卡 (3) 的 level 正交在同文件给出实例 `gram_level_three_four`，它不进目标陈述，只作旁证。
      字面依赖：ShapovalovLevelFour.lean import ShapovalovLevelThree.lean import Shapovalov.lean。
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      提供 V(c,h)、|c,h⟩ 与最高权关系 `lie_lgen_hwv_of_pos` / `lie_lgen_zero_hwv` /
      `lie_cgen_hwv`——level-4 的每个 Gram 元都是「把上升模态 L₁/L₂/L₃/L₄ 推过去打到 |c,h⟩ 上」，
      靠的就是这三条。另用到 `levelSpan` / `levelWord`（五条 `desc*_mem_levelSpan` 的陈述，
      以及目标【不断言】(a) 里「4 的合成有八个」那句的定义依据；Lean 侧 `desc31_mem_levelSpan`
      等用 `Composition` 的 blocks `[3, 1]`、`[2, 2]`、`[2, 1, 1]` 并以 `rfl` 闭合，
      `desc4` / `desc1111` 用 `Composition.single 4` / `Composition.ones 4`）。
      **刻意未用**该卡不断言的 PBW / dim V_N = p(N) / V(c,h) ≠ 0；这正是目标【不断言】(a)。
  - id: worldsheet.virasoro-algebra-v2
    inferred: false
    note: |
      Gram 元的每一步都在用 Virasoro 括号的**具体系数**，包括三处中心项：
      `lie_lgen_four_neg_four : ⁅L 4, L (−4)⁆ = 8·L 0 + centralTerm R 4 · C`
      配 `centralTerm_four : centralTerm R 4 = 5`（即 ⟨u₄,u₄⟩ = 8h + **5c** 里的 5），
      level-3 的 `centralTerm R 3 = 2`（进入 ⟨u₃₁,u₃₁⟩ = 12h² + **4ch** + 12h），
      以及 level-2 的 `centralTerm R 2 = 1/2`（进入 ⟨u₂₂,u₂₂⟩ 的 **c²/2** 与 ⟨u₄,u₂₂⟩ 的 3c 等）。
      还用到 `lie_lgen_four_neg_three : ⁅L 4, L(−3)⁆ = 7·L 1`、`lie_lgen_four_neg_two = 6·L 2`、
      `lie_lgen_four_neg_one = 5·L 3`、`lie_lgen_one_neg_two : ⁅L 1, L(−2)⁆ = 3·L(−1)`、
      `lie_lgen_zero_neg_two : ⁅L 0, L(−2)⁆ = 2·L(−2)`，以及 `lie_lgen_lgen` 的一般形式。
      ⇒ 目标 (1)(2) 的全部数值系数**完全来自**该卡的括号与中心项归一化；
      换一套归一化（conv.virasoro-standard 之外）数字就会变。同为 conv.virasoro-standard。
  - id: worldsheet.kac-determinant-level-two
    inferred: false
    note: |
      字面依赖：经 ShapovalovLevelThree.lean 间接 import Shapovalov.lean。目标 (1) 的计算
      **复用**该卡的定义 `desc1` / `desc2` / `desc11`（u₃₁ = ⁅L₋₃, desc1⁆、u₂₂ = ⁅L₋₂, desc2⁆、
      u₂₁₁ = ⁅L₋₂, desc11⁆ 是按它们定义的）与引理 `lie_lgen_one_desc1`、`lie_lgen_zero_desc1`、
      `lie_lgen_two_desc2`、`lie_lgen_two_desc11`、`lie_lgen_one_desc11`、`lie_lgen_zero_desc11`、
      `gram_level_one`、`gram_level_two_aa / _ab / _bb`、`two_mul_centralTerm_two`
      （最后一条在 `gram_level_four_det` 末尾的 `linear_combination` 里把 1/2 消掉）。
      内容上的衔接：目标 (2) 里以平方出现的因子 16h² + 2h(c−5) + c 就是该卡 (3) 除以 2h。
      ⚠ 该卡是 formalized，故这条边**不**压低目标的有效状态。
  - id: worldsheet.kac-determinant-level-three
    inferred: false
    note: |
      字面依赖：ShapovalovLevelFour.lean 直接 import ShapovalovLevelThree.lean。目标 (1) 的计算
      **复用**该卡的定义 `desc111`（u₁₁₁₁ = ⁅L₋₁, desc111⁆ 按它定义）与引理
      `lie_lgen_one_desc111`、`lie_lgen_two_desc111`、`lie_lgen_three_desc1 / _desc11 / _desc111`、
      `lie_lgen_zero_desc11`、`centralTerm_three`、`gram_level_three_111_111`
      （⟨u₁₁₁₁,u₁₁₁₁⟩ 经 L₁ 打到 L₋₁³v 上再回调它）；
      目标 (3) 的证明 `gram_level_four_det_eq_kac` **直接回调**该卡的
      `kac_factor_rs_two` / `kac_factor_rs_three`（rs = 2、3 两对根的清分母二次因式分解），
      只新增 rs = 4 的 `kac_factor_rs_two_two` / `kac_factor_rs_four`。
      内容上的衔接：目标 (2) 的因子 3h² + h(c−7) + c + 2 就是该卡 (2) 的第三个因子。
      ⚠ 该卡是 formalized，故这条边**不**压低目标的有效状态。
