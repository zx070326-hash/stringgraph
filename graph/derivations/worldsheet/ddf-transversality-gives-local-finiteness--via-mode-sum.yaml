summary: |
  两步，都是有限步计算，但接在一个非初等的前置转换之后。

  第 0 步（前置转换，非初等）。把 worldsheet.ddf-operators-v5 的围道积分展成模态和：
    A^i_n = Σ_{m ∈ Z} α^i_m V^{(n)}_m ，
  其中 V^{(n)}_K 是 :e^{i n k_0·X(z)}: 在动量塔上的 z^K 洛朗系数。
  这是形式洛朗展开加取 z^{-1} 系数；由 k_0² = 0 与 2α' k_0·p = 1，单值因子 z^{2α' n k_0·p} = z^n
  在整条塔上是同一个整数幂（Lean 侧 `dotVec_towerMomentum_right_of_isotropic`），
  故指标记账良定义。**本图目前没有一条严格节点覆盖「围道积分 ⟹ 模态和」这个字典**，见 gaps。

  第 1 步（下界截断，不需要横向性）。V^{(n)}_m 把振子能级升高 m − n
  （`Fock.vertexOsc_mem_levelSubmodule`；塔上的 towerShift n 吸收了指标位移 K ↦ K − n）。
  设 |ψ⟩ 处在能级 N。则 V^{(n)}_m |ψ⟩ 的能级是 N + m − n，能级为负的向量为零
  （`Fock.vertexOsc_apply_eq_zero_of_level`），故 m < n − N 的项全为零。

  第 2 步（上界截断，**这里才用横向性**）。ε·k_0 = 0 意味着重标度后的顶点动量满足 b^i = 0，
  于是 [α^i_m, V^{(n)}_K] = 0 对**所有** m（含 m = 0；Lean 侧 `lie_towerMode_towerVertex_of_eq_zero`，
  塔上版本，单个 Fock 空间上的 m = 0 情形要靠 towerShift 才对）。因此可以把 α^i_m 移到右边：
    α^i_m V^{(n)}_m |ψ⟩ = V^{(n)}_m α^i_m |ψ⟩ ，
  而 α^i_m 对 m > N 湮灭能级 N 的态，故 m > N 的项全为零。

  合起来：只有 n − N ≤ m ≤ N 的有限多项可能非零，A^i_n |ψ⟩ 是有限和，
  A^i_n 是代数 Fock 塔上处处有定义的线性算子，全程不用收敛性假设。

  【必要性方向不在本推导的断言范围内】若 ε·k_0 ≠ 0，则 b^i ≠ 0 且
  [α^i_m, V^{(n)}_m] = b^i V^{(n)}_0（`Fock.lie_mode_vertexOsc`），
  于是 α^i_m V^{(n)}_m |ψ⟩ = V^{(n)}_m α^i_m|ψ⟩ + n b^i V^{(n)}_0|ψ⟩，
  第二项与 m 无关且非零，对一切充分大的 m 重复出现，和在代数 Fock 空间上不是局部有限的。
  本推导**不**断言这一条（见目标节点 notes）。
gaps:
  - "**第 0 步（围道积分 ⟹ 模态和）在本图中没有严格依据**。worldsheet.ddf-operators-v5 用围道积分定义 A^i_n；本推导用模态和。两者相同这件事是形式洛朗展开 + 取 z^{-1} 系数，标准但本图无可引用节点（最接近的 worldsheet.ope-pole-mode-commutator-dictionary 是**形式分布版的模态字典**，且它自身在图中没有推导，effective 为 open；worldsheet.ope-commutator-dictionary 是围道 ⟹ 对易子，不是围道 ⟹ 模态和）。这是本推导止步于 physical-argument 的**第一个**理由。两条出路：(a) 另立「DDF 围道 = 模态和」节点；(b) lead 裁定把模态和写进 A^i_n 的定义卡（那样第 0 步消失，本推导变成纯有限步计算）。"
  - "**无 reviewer 复核记录**，故按 docs/STATUS_LEVELS.md 的 rigorous 例外条款（「缺此记录……的一律 physical-argument」）不能标 rigorous。这是**第二个**理由。第 1、2 步本身确实是有限步初等计算，且其两条关键引理已在 Lean 中机器验证，所以一旦 reviewer 复核并在本 notes 补 `reviewer-verified: <agent>, <date>`（同时第 0 步的接缝被处理），本推导即可升到 rigorous。"
  - "**不标 formalized**：A^i_n 与那个模态和在 Lean 里都还没有定义，组装未做（见 sources 第一条的逐字引用）。按 stringformal-2026 的证据标准，formalized 要求目标声明在 Lean 中存在且无 sorry——这里没有目标声明。待办见 formal/TODO.md 的 `ddf-operators` 项。"
  - "本推导只谈**代数** Fock 塔（无完化）。文献里的 A^i_n 作用在有完化/解析结构的空间上时，局部有限性不是必要条件（收敛即可），故本命题在文献框架下**不是**一条被讨论的命题。这是「Lean 侧发现、文献未明写」的典型例子。"
  - "本推导给出的窗口 n − N ≤ m ≤ N 依赖 |ψ⟩ 是**能级齐次**的向量；一般向量按 level 分解后逐块套用（worldsheet.bosonic-fock-space 的 level 分级，Lean 侧 `levelSubmodule`）。这一步在 summary 里被略过。"
  - "k_0·p = 0 的扇区（含 p = 0）不在覆盖范围内：那里 A^i_n 本身没有定义，(★) 不可满足。"
