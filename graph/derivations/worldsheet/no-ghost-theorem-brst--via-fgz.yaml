      ★★【2026-09-11 改指，reviewer-batch24】本边**原先指 math.verma-module-free-over-negative-part
      且标 inferred**，历史如下（三次换代，保留作记录）：
        (1) 原指旧卡 worldsheet.verma-module；
        (2) 改指 worldsheet.verma-module-pbw-basis（本边承载的正是"在负模下自由"那一半）；
