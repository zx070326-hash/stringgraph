      FGZ 在该定理后逐字写「The second isomorphism of Theorem 2.8 is known as the no-ghost theorem
      in the physics literature (8, 9)」，并断言三个空间 T ∩ P、P/rad P、H^0_∞
      「All three isomorphic spaces are positive definite and have dimension p_{(24)}(1 - p·p/2)」。
      本节点的断言 (2)(3) 对应两个同构的复合 H^0_∞ ≅ T ∩ P；
      第一个同构单独立为 worldsheet.brst-cohomology-equals-ocq-physical。
      原先引的 "Theorem 1.2" 系凭记忆填写，与原文不符，已订正。
  - ref: fgz-1986
    loc: "Theorem 2.7（(i) H^i_∞(ℒ, ℒ_0, V(E,p)) = 0 对 i ≠ 0；(ii) dim H^0 = p_{(24)}(1 - p·p/2)），此处已设 D = 26"
    note: |
      本节点断言 (1)「上同调集中在单一鬼数」的严格来源；编号已核实。
