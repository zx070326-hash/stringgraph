      三次的 inferred 理由始终是同一条：**FGZ 说的是"物质 Fock 模在 ℒ⁻ 下自由"，不是本图 Verma 模
      节点定义的 V(c,h)**；由"自由 U(ℒ⁻)-模"到"Verma 模"的识别需要额外一步，而 FGZ 在
      Proposition 2.6 之后的 Remark 里**明确否认**这一步逐字：
      'although V(E, p) in the above proposition is free over ℒ_-, it is **not in general a direct
      sum of Verma modules** … As a counterexample one can choose the case in which p·p is a
      nonpositive even integer.' 旧 note 逐字写着「若日后为『Fock 模在负模下自由』单建节点，
      本边应改指向它并去掉 inferred」。
      **该卡已于 2026-09-11（small-backlog-10）建成**
      （worldsheet.fock-module-free-over-negative-virasoro，推导 --via-fgz-1986，
      源即 Prop 2.6(i) 逐字），本边据此改指并去掉 inferred。
      ⚠ FGZ 的那条 Remark **随本边保留**：它既是旧边必须标 inferred 的理由，
      也是新卡不能被 Verma 卡顶替的理由（新卡的"本命题不断言 (a)"逐字收录了它）。
      ⚠ 同款改指已在 worldsheet.bosonic-relative-cohomology-vanishing--via-fgz-1986 做过。
sources:
