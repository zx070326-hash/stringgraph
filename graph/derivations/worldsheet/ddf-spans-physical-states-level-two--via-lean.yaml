summary: |
  三步证明，逐层对应 LevelTwoCount.lean 的 section B26Two → section Closing：

  **第 1 步（D-无关的维数不等式，`finrank_towerPhys_inf_towerBigrade_two_le`）。**
  把 worldsheet.physical-slice-bounded-by-transverse-count 的 dim H_2 ≤ p_{D−1}(2)、
  worldsheet.transverse-ddf-fock-gram-matrix 一侧的 dim D_2 = p_{D−2}(2)
  （`finrank_ddfSpan_inf_towerBigrade`）、math.level-two-partition-difference 的
  p_{D−1}(2) = p_{D−2}(2) + D（`levelTwo_count_identity`）与两条内部占据数计数
  `card_conjFree_two_le`/`card_ddfLevel_two_ge` 用 `omega` 拼成
    dim(H_phys ⊓ V_2) ≤ dim(ddfSpan ⊓ V_2) + D 。
  这一步对一切 D ≥ 2 成立，不用 D = 26。

  **第 2 步（唯一用到 D=26 的一步，`nullFamilyTwo_mem_towerNullSubmodule` →
  `le_finrank_towerNullSubmodule_inf_towerBigrade_two` → `b26_two_of_D26`）。**
  在标架 F 与 `hD26 : (D:K)=26` 下，构造 D 个候选（索引
  `Option (Option (Fin (D−2)))`）：D−2 个横向 Type-1、1 个沿 a−b̃ 的 Type-1、1 个 Type-2
  （`𝒟₂|0;p_{−2}⟩`）。三支模式匹配核对每个候选落在 H_null ⊓ V_2 里：两支 Type-1 分支
  调用 `typeOneTwo_mem_towerNullSubmodule`（D-无关），唯一的 `none`（Type-2）分支调用
  worldsheet.level-two-null-state-requires-d26 的 `descTwo_single_mem_towerNullSubmodule`
  （**本步是全链唯一消费 `(D:K)=26` 的地方**）。`linearIndependent_nullFamilyTwo`
  （D-无关）给出这 D 个候选线性无关，`finrank_span_eq_card` + `Submodule.finrank_mono`
  得 dim(H_null ⊓ V_2) ≥ D。与第 1 步的不等式相加得 `B26 2`（`b26_two_of_D26`）。

  **第 3 步（翻译成分片张成，`ddfSpans_bigrade_neg_two_two`）。**
  `ddfSpansOn_bigrade_of_b26`（`SliceRank.lean`，D-无关、N-无关的纯逻辑翻译引理，
  把 `B26 N` 翻译成 `DDFSpansOn (towerBigrade (-N) N)`，不对应图上任何节点的论证内容，
  不建 depends_on 边）应用到 `b26_two_of_D26` 的结果上，得
    DDFSpansOn η a b F.hη F.trans (towerBigrade D K (-2) 2) ，
  即目标卡断言。∎

  **四条依赖全部 formalized**（含目标卡本身消费的精确 decl，非各自的 headline decl 两处，
  已在 depends_on 逐条注明），故目标卡 effective = formalized。
gaps:
  - "**内部两条占据数计数引理不建 depends_on 边**：`card_conjFree_two_le`（上界 p_{D−1}(2) ≤ (D−1)+C(D,2)）与 `card_ddfLevel_two_ge`（下界 p_{D−2}(2) ≥ (D−2)+C(D−1,2) 的特化）是 LevelTwoCount.lean 本文件内部的纯计数引理，不对应图上任何既有节点（math.level-two-partition-difference 只承载两者的差 `levelTwo_count_identity`，不承载这两条单侧不等式本身，见该卡 sources note）；本推导把它们当作自身证明内容的一部分，不建独立边。"
  - "**尖锐性未证，登记为未来工作 PR5b″**：本推导只证 D=26 ⟹ B26 2 ⟹ DDFSpansOn(V_2)，不证反方向（D≠26 时 ¬B26 2）。若要证尖锐性，估计需要：(i) 证明 conjFreeSlice 的占据数计数（`card_conjFree_two_le`/`card_ddfLevel_two_ge`）实际取等（不只是上下界），(ii) 证明 D≠26 时 26 个候选零态之外不存在额外零态方向（即 spurious 子模的 Gram 矩阵在 V_2 上的秩恰为 D 而非更多，需要显式算出 `dim(H_spur ⊓ V_2)` 并核实 `dim(H_null ⊓ V_2) = dim(H_spur ⊓ V_2 ⊓ H_phys⊥ 的余核)` 一类的秩配对论证）。估计规模 300–500 行 Lean，需要新的 `conjFreeSlice` 独立性引理与一个'spurious Gram 秩'计算，两者目前都不存在。此项只记账，不代表任何 agent 已认领。"
  - "**curator 未自行跑 `lake build` 与 `check-axioms`**：依据是文件所在分支由 lead 合入 main（见 sources note）。"
