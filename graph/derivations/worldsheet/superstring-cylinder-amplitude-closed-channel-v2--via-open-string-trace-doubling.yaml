summary: |
  **原书的四步（每一步都逐字可核）**：

  1. **拼装（不是推导）**：取玻色弦圆柱振幅 Vol.1 (7.4.1)，换到十维
     （(8π²α't)^{−13} → (8π²α't)^{−5}、η^{−24} → η^{−8}、V₂₆ → V₁₀），
     乘上 type II 弦**一侧**的费米迹 (10.7.9)。原书逐字 'One can immediately write down
     the amplitude by combining …'——**这一步没有推导过程**。
     测度取 dt/**8**t：相对 (7.4.1) 的 dt/2t 多出两个 ½，分别来自 **GSO** 与 **Ω** 投影
     （原书 p.38 明写）。Chan–Paton 给 n²（两条边界各一个指标）。
  2. **按 exp(πiF) 拆成两项**（(10.8.1)(10.8.2a,b)）：Z_{C₂,0} 的迹里**不含** exp(πiF)
     ⇒ ψ^μ 在 σ² 方向反周期；Z_{C₂,1} 含 ⇒ 周期。把圆柱读作闭弦出现又回到真空，
     周期性就翻译成闭弦扇区：**Z_{C₂,0} = NS–NS 交换、Z_{C₂,1} = R–R 交换**（原书逐字）。
     ★ 这个**识别**是后面全部"NS–NS 与 R–R tadpole 分别为零"讨论的技术前提，
     但它本身是一个周期性论证，不是计算。
  3. **换通道**：用 (10.8.3) 的两条模变换（η 的 S 变换 + Z^α_β 的 α/β 对调）并令 **s = π/t**，
     把 t 积分改写成 s 积分，得 (10.8.4) 第一行。
     代数上这一步是机械的；**前缀的闭合已独立复算**（s 的幂次恰好抵消，
     1/(8π(8π²α')⁵) = 1/(262144 π¹¹α'⁵)，见 sources 第三条）。
  4. **长柱展开**：s → ∞ 时 η(is/π)^{−8}[Z⁰₀(is/π)⁴ − Z⁰₁(is/π)⁴] → **16 + O(exp(−2s))**，
     16 是十维无质量态的计数（对照玻色弦 (7.4.4) 的 24）。得 (10.8.4) 第二行。

  **为什么标 physical-argument（三条，按弱到强排）**：
  (1) **第 1 步是"直接写下"**：原书自称 'One can immediately write down the amplitude by
      combining …'，两个部门的拼装没有推导，也没有说明为什么玻色部门可以原样换维数；
  (2) **第 3 步用的 (10.8.3) 第二式带 naive 限定**：它是 (10.7.14) 的特例，而原书对 (10.7.14)
      明确写了 'The reason these modular transformations are naive is that there is no
      diff-invariant way to define the phase of the path integral for purely left-moving
      fermions'——**§10.8 直接用而不重述这个限定**；
  (3) 整个对象是单圈路径积分 / 迹的形式计算，上游（开弦 CFT 的配分函数、Ω 与 GSO 的投影）
      都在路径积分层面。
  ⚠ 本推导里**最硬**的一环是第 3 步的前缀复算（有限步初等计算，抽取记录 §0.4(b) 已闭合并与
  Vol.1 (7.4.3) 对照），但它只保证 (10.8.4) 两行与 (10.8.2a) 彼此自洽，**不提升**第 1、2 步。
  故整体 physical-argument，与 spectrum.one-loop-cylinder-amplitude 一侧的口径一致。
