id: worldsheet.superstring-cylinder-amplitude-closed-channel-v2--via-open-string-trace-doubling
target: worldsheet.superstring-cylinder-amplitude-closed-channel-v2
kind: physical-argument
status: physical-argument
depends_on:
  - id: spectrum.one-loop-cylinder-amplitude
    note: |
      供给**母结构**：玻色弦的圆柱真空振幅 Vol.1 (7.4.1)（算符形式
      Z_{C₂} = ∫₀^∞(dt/2t)Tr'_o[e^{−2πtL₀}]）与其显式形式 (7.4.3)。
      **非 inferred**：原书 p.37 逐字 'One can immediately write down the amplitude by
      **combining the bosonic result (7.4.1), converted to ten dimensions**, with the fermionic
      trace (10.7.9) from one side of the type II string.'
      ⇒ 这是原书**明写**的依赖，不是本图补的。
      ⚠ **两处必须换算**（目标卡设定已写明）：
        (i) 维数 26 → 10：(8π²α't)^{−13} → (8π²α't)^{−5}、V₂₆ → V₁₀；
        (ii) 测度 dt/2t → **dt/8t**：那张卡的表达式是**取向**理论的（它自己的 ⚠ 写了
             "无取向理论里各多一个因子 ½"），本卡是无取向的，且另有 GSO 的 ½
             ⇒ 2 × 2 × 2 = 8（原书 p.38 逐字 'the GSO and Ω projection operators each
             contribute a factor of ½'）。
      ⚠ 那张卡的 η^{−24} 是 24 个横向玻色模的一侧贡献；十维换成 η^{−8}（8 个横向玻色模），
      费米部门由下面那条边补上。
  - id: worldsheet.modular-invariance-requires-eight-transverse-fermions
    note: |
      供给**费米迹** (10.7.9) 的组合 Z_ψ^± = ½[Z⁰₀⁴ − Z⁰₁⁴ − Z¹₀⁴ ∓ Z¹₁⁴] 与 Z^α_β 的定义
      ((10.7.7)–(10.7.8)，'these traces are for a pair of dimensions' ⇒ 四次幂)。
      (10.8.2a,b) 的两个方括号就是这个组合按 **exp(πiF) 是否出现**（即 β = 0 / 1）的拆分。
      **非 inferred**：原书明写 'with the fermionic trace (10.7.9) **from one side of the type II
      string**'。
      ⚠ 只借迹的**形式**，**不借**那张卡的结论（"横向费米子个数必须是 8 的倍数"）。
      ⚠ 同时供给断言 (3) 里 (10.8.3) 第二式 Z^α_β(it) = Z^β_{−α}(i/t) 的对象——它是 §10.7
      (10.7.14) 的特例，而 (10.7.14) 原书明确带 **naive** 限定（见 gaps 第一条）。
  - id: math.dedekind-eta-s-transformation
    note: |
      供给 (10.8.3) 的**第一式** η(it) = t^{−1/2}η(i/t)。
      **非 inferred**：原书逐字把它写作 (10.8.3) 的一半并明说 'Using the modular transformations'。
      ⚠ **换算**：那张卡的形式是 η(−1/τ) = (−iτ)^{1/2}η(τ)（主分支）；取 τ = it（t > 0）得
      −1/τ = i/t、(−iτ)^{1/2} = t^{1/2}，即 η(i/t) = t^{1/2}η(it)，与 (10.8.3) 的
      η(it) = t^{−1/2}η(i/t) **同一式**。这一步是纯代入，无额外假设。
      ★ 本边同时是 α' 幂次复算的关键输入（η(iπ/s)^{−8} = (π/s)⁴η(is/π)^{−8}），
      见目标卡 sources 第三条的复算链。
  - id: spectrum.chan-paton-factors
    note: |
      供给 **n²**：圆柱的两条边界各挂一个 Chan–Paton 指标，迹给出 n²。
      **非 inferred**：这是 Vol.1 (7.4.3) 里 n² 的来源（spectrum.one-loop-cylinder-amplitude
      的断言 (3) 明写"n² 来自圆柱的两条边界各挂一个 Chan–Paton 指标
      （spectrum.chan-paton-factors）"），经上面那条边继承到十维。
      ⚠ 本书记号下 **Sp(k) 对应 n = 2k**（抽取记录 §1 的记号表，经 Vol.1 (7.4.22) 继承）。
      ⚠ 本边只供 n 这个计数，**不**供 SO(n)/Sp(n) 两种投影的选择（那在 (10.8.18)–(10.8.19)，
      属 tadpole 卡）。
  - id: worldsheet.open-superstring-gso-projection
    note: |
      供给测度 dt/**8**t 里来自 **GSO 投影**的那个 ½（该卡断言 (3)：投影算符
      (1 + ε exp(πiF))/2 在迹里贡献一个因子 ½；原书 p.38 逐字 'Note that the GSO and Ω
      projection operators each contribute a factor of ½.'），
      以及「按 exp(πiF) 是否出现在迹里分成两项」这个分法所用的算符 exp(πiF) 本身。
      **非 inferred**：本推导用的是**开弦**迹上的 GSO 投影，与该卡的对象逐字同一；
      归一化那句话就在 (10.8.2) 下方，(10.8.2a,b) 的分项也正是按 exp(πiF) 的插入与否分的。
      ★★【2026-09-11 改指并去 inferred，small-backlog-13】本边**原指
      worldsheet.gso-projection（闭弦 IIA/IIB/type 0 的 GSO）并标 inferred**，
      理由是 reviewer-batch23 的裁定（lead 落地）逐字：
        「该卡是闭弦 IIA/IIB/type 0 的 GSO 投影，本推导用的是开弦迹里 exp(πiF) 投影算符
          贡献的 ½，**对象不完全同一**。」
      本轮新建了**开弦**的窄卡 worldsheet.open-superstring-gso-projection
      （§10.6 p.30 的 I / Ĩ 两个选择 + §10.8 p.38 的 ½），对象自此同一 ⇒ 去掉 inferred。
      ⚠ 该卡**只**给定义层面的内容；「开弦**必须**做 GSO」与「两个选择的谱」仍在
      worldsheet.type-i-open-string-gauge-multiplet 上，本边**不**借那两件。
      ⚠ 该卡「不断言 (c)」提醒：'The two possibilities' 带着「与闭超弦一致耦合」的前提，
      **不是**「开超弦的 GSO 只有两种」；本推导也不需要那个枚举。
  - id: worldsheet.worldsheet-parity
    inferred: true
    note: |
      供给测度里来自 **Ω 投影**的那个 ½（同一句逐字），即本卡是**无取向**理论的圆柱。
      **标 inferred，理由与 worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences
