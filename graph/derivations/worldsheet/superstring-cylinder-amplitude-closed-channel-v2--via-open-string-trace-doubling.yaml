      原书在 (10.8.4) 处**不写** 16 = 哪些态的计数，也不在那里引 §10.6 的谱。
      旧边 note 与本推导 gaps 第三条里写的正解逐字是：
        「⇒ 正解：为 (7.4.4)/(10.8.4) 的"长柱极限里最轻态的计数"单建一条卡（本图无），
          届时本边改指它并去掉 inferred。」
      **那张卡本轮已建**（spectrum.long-cylinder-lightest-state-count），
      且内容比正解更弱：只断言常数项的**数值**，不断言它是任何东西的计数。
      ⇒ 本边改指它并**去掉 inferred**：数值 16 在原书同页逐字可读。
      ⚠ 本边不影响断言 (1)(2) 与断言 (3) 的第一行（那三条只用模变换），
      只支撑第二行把 η^{−8}[Z⁰₀⁴ − Z⁰₁⁴] 展开成 [16 + O(e^{−2s})] 的那一步。
      ⚠ **本边不供给任何计数释义**：目标卡「不断言 (h)」与新卡「不断言 (a)」口径一致——
      原书只说**那一项**来自无质量闭弦 tadpole，没说**那个数**等于无质量态的个数。
