  - id: worldsheet.ddf-transversality-gives-local-finiteness-v2
    inferred: false
    note: |
      **使 A^ε_n 的模态和是有限和**，从而「把伴随逐项搬过去」这件事有意义。
      Lean 侧本推导用的是该卡的 formal.lean_decl
      `StringFormal.NoGhost.ddfSummand_apply_eq_zero_of_notMem_window`：
      证明里取窗口 s = `ddfWindow n v ∪ (ddfWindow (−n) w).image (−·)`，
      两侧的项在 s 外逐向量为零，于是两个有限和可以逐项比对。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
