  - id: worldsheet.fock-indefinite-form
    inferred: false
    note: |
      **偏振振子模那一半的伴随**：(α^μ_m)† = α^μ_{−m}（该卡 (1)(b)），
      经 `Fock.pairing_mode_left` 延拓到**一切整数 m 含 m = 0**，
      再由 `towerPairing_towerMode_left` 逐层提升到塔上，最后由
      `Fock.towerPairing_towerModeVec_left` 对偏振指标求和得 (α^ε_p)† = α^ε_{−p}。
      **不**使用该卡的 (4)（不定性）——那是类时方向的事。
      ⚠ 该卡 effective = formalized，不压低本推导状态。
