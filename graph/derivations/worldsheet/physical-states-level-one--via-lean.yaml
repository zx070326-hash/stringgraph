  - ref: polchinski-1998-v1
    loc: "§4.1，eq. (4.1.16)、(4.1.17)、(4.1.18)，p.123–124"
    note: |
      **文献侧的平行论证**（不是本推导的形式化证据）：抽取记录
      literature/extractions/polchinski-1998-v1.md#E56，式号与内容已核实。
      Polchinski 的计算与 Lean 的路线在数学内容上一一对应（见 summary 的逐条对照），
      但 Polchinski 的论述把 A = −1 与 A ≷ −1 三栏一起讨论，其中只有 A = −1 一栏
