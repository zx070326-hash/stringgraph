id: worldsheet.type-i-unoriented-closed-spectrum--via-omega-projection
target: worldsheet.type-i-unoriented-closed-spectrum
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.type-ii-massless-spectrum
    note: 供给被投影的对象（IIB 的无质量谱）。
  - id: worldsheet.gso-projection
    note: 供给 IIB 的定义（两侧同一 GSO 投影），Ω 作用在其上。
  - id: worldsheet.closed-superstring-worldsheet-parity-action
    note: |
      供给**闭超弦上的世界面宇称 Ω 及其在世界面费米子上的作用**：
      Ω ψ(w) Ω^{−1} = ψ̃(w̄)、Ω ψ̃(w̄) Ω^{−1} = ψ(w)（即 **Ω 交换左移与右移**），
      一般插入 R = Ω exp(πiβF + πiβ̃F̃) 时带相位 exp(πiβ) / exp(πiβ̃)（(10.8.8a,b) 的中间项），
      以及 Ω² 与 ψ、ψ̃ 对易（(10.8.9) 的代数内容）；
      玻色部门上的 Ω（闭弦 σ ↦ −σ、Ω α_n Ω^{−1} = ᾱ_n、无取向投影 (1+Ω)/2）由该卡
      `uses: worldsheet.worldsheet-parity` 一并带入。
      **非 inferred（2026-09-11 由 inferred 改正，curator theta-cards）**：该卡的断言 (1)(2) 逐字取自
      原书 **§10.8 (10.8.8a,b)** 的算符等式 Rψ(w)R^{−1} = exp(πiβ)ψ̃(w̄)，
      即「Ω 在闭超弦上如何作用」在原书里是写出来的，本图现在也有了节点。
      ⚠⚠ **本边只供给「Ω 交换左右」这一条，不供给它在自旋场 V_s 上的作用**：
      该卡的「不断言 (a)」逐字声明「**Ω 把 V_sṼ_{s'} 送到 Ṽ_{s'}V_s**」这句在原书 §10.6
      **没有逐字出处**，是本图的读法。本推导 summary 第 (2) 步正是这样用的
      ⇒ **那一层仍是缺口**，见 gaps 第二条（已按此改写）。
      ⚠ **方向别搞反、也别成环**：该卡**不** `uses` worldsheet.type-i-unoriented-closed-spectrum
      （它的 notes 逐字写明这是硬约束，理由就是避免与本边成环）；已核对本边不引入环
      （该卡的 uses 只有 worldsheet-parity / rns-fermion-periodicity / rns-fermion-number-operator）。
      ⚠ 该卡 own status = rigorous，但其 effective 被 uses 里的 RNS 两张卡压到 physical-argument，
      与本推导同级，故本边不改变目标卡的有效状态。
sources:
  - ref: polchinski-1998-v2
    loc: "§10.6, eq. (10.6.16)–(10.6.18), pp. 29–30"
    note: L1。
  - ref: polchinski-1998-v2
    loc: "§10.8, eq. (10.8.13)（Ωψ_r^μΩ^{−1} = exp(−πir)ψ_r^μ）、(10.8.14)（Ω² = exp(πiF)），p. 40"
    note: |
      L1（E48）。这两式给出 Ω 在超弦上的完整作用，但它们出现在 §10.8，
      本卡的论证（§10.6）在原书中先于它们，且不引用它们。
summary: |
  三步：
  (1) Ω 是 IIB 的一个对称性（左右两侧的 GSO 投影相同，故 Ω 把谱映到自身）。
  (2) 在 R–R 扇区，顶点算子写作 V_s Ṽ_{s'}，其按 8 × 8 = [0] + [2] + [4]_+ 变换。
      Ω 交换左右，即把 V_s Ṽ_{s'} 变成 Ṽ_{s'} V_s；由 R 顶点算子的费米性质
      Ṽ_{s'}V_s = −V_sṼ_{s'}。故 Ω = +1 的投影挑出在交换 s ↔ s' 下**反对称**的部分，
      即 [2]（[0] 与 [4]_+ 是对称的，被投掉）。
  (3) NS–NS 与 NS–R / R–NS 扇区同理投影，留下 (2)（引力子）、[0]（dilaton）与
      8′ + 56 的一份（两个引力微子里只剩一个线性组合）。
      合起来即 (10.6.18)。

  【status 的理由】上游全部 physical-argument；
  第 (2) 步的符号（R 顶点算子的费米性质）在原书里只有一个从句，本图无节点。
gaps:
  - "**「R 顶点算子的费米性质给出额外负号」这一步在本图无节点**：原书只有一个从句（'where the final sign comes from the fermionic nature of the R vertex operators'）。它实质上依赖 §10.4 末的 cocycle 与 §10.6 的自旋-统计讨论（E44），本图都没有建。"
  - "**【2026-09-11 已关闭（curator theta-cards）】Ω 在超弦上的作用未在图中定义**：
     本条此前逐字写着「worldsheet.worldsheet-parity 是玻色弦语境的（该依赖边已标 inferred）。
     超弦的完整作用（(10.8.13)、(10.8.14)：Ω² = exp(πiF)）在 §10.8 才给出，本图无节点。」
     ⇒ **闭弦一侧已建卡**：**worldsheet.closed-superstring-worldsheet-parity-action**
     （(10.8.8a,b)/(10.8.9)：Ωψ(w)Ω^{−1} = ψ̃(w̄)，Ω² 与 ψ、ψ̃ 对易），本推导的那条边**已改指它并去掉 inferred**。
     ⚠ **残余（必须一起读）**：该卡覆盖的是**闭**超弦；本条原文提到的 (10.8.13)/(10.8.14)
     （Ωψ_r^μΩ^{−1} = exp(−πir)ψ_r^μ、**Ω² = exp(πiF)**）是**开**超弦一侧，在另一张卡
     worldsheet.superstring-worldsheet-parity-action 上，**本推导用不到**
     （本推导处理的是闭弦谱的 Ω 投影）。两张卡不得互相替代。
     ⚠ 该卡对**超共形鬼场 β、γ 上的 Ω 作用**同样不断言（原书本处不提）。"
  - "**「Ω 把 V_sṼ_{s'} 送到 Ṽ_{s'}V_s」这一步在原书没有逐字出处（本推导现在最实质的缺口）**：
     summary 第 (2) 步把「Ω 交换左右」搬到**自旋场** V_s 上。新接的
     worldsheet.closed-superstring-worldsheet-parity-action **只给 Ω 在 ψ、ψ̃ 上的作用**，
     其「不断言 (a)」逐字声明：『**Ω 把 V_s Ṽ_{s'} 送到 Ṽ_{s'} V_s**」这句本身 …
     **在原书 §10.6 没有逐字出处**（抽取记录 #E45 是**转述**）… V_s 是**自旋场**（R 扇区基态算子），
     不是 ψ 的多项式，断言 (2) 的「Ω 交换 ψ ↔ ψ̃」**不自动**给出它在 V_s 上的作用。』
     ⇒ **这一步是本图的读法**，与上一条 gap（R 顶点算子的费米性质给出额外负号）同源，
     都指向 §10.4 末的 cocycle 与 §10.6 的自旋-统计讨论（抽取记录 #E44），本图都没有建。"
  - "**表示论分解无支撑**：8 × 8 = [0] + [2] + [4]_+ 与「哪些部分对称/反对称」依赖附录 B.1（未读）。"
  - "**「规范掉一个离散对称性」这一操作本身在本图无形式化**：它是世界面上对无取向曲面求和（Klein 瓶、Möbius 带），玻色弦一侧本图也只有 worldsheet.worldsheet-parity 这一张卡。"
