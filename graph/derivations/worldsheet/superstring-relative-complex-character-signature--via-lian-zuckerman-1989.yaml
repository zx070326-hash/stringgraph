depends_on:
  - id: math.super-virasoro-algebra
    convention_map: |
      本图的中心荷归一化是 c/12：[L_m,L_n] = (m−n)L_{m+n} + (c/12)(m³−m)δ、
      {G_r,G_s} = 2L_{r+s} + (c/12)(4r²−1)δ。
      **LZ 用 c/8 与 c/2**（p.302 逐字）：[L_m,L_n] = (m−n)L_{m+n} + (c/8)(m³ − 2κm)δ_{m+n}、
      {G_{m+κ}, G_{n−κ}} = 2L_{m+n} + (c/2)(m² + 2κm)δ_{m+n}。换算两条：
        (1) **中心荷**：c_本图 = (3/2)·c_LZ ⇒ LZ 的 c_LZ = D = 10 ↔ 本图 c^m = 15。
        (2) **R 扇区 (κ = 0) 的 L₀ 零点**：LZ 的 {G₀,G₀} = 2L₀（无中心项），本图是
            2L₀ − c/12 ⇒ **L₀^LZ = L₀^本图 − c/24**。
      ⚠ 本命题是复形层面的特征标/号差计算，只用相对复形的分次（相对次数）与 ⟨,⟩_rel；
      两条换算不改分次，只影响「LZ 的 D = 10 ⟺ 本图 c^m = 15」与 R 扇区 L₀ = 0 条件的读法（(H1)(H3)）。
    note: |
      对象接口边：LZ 的 Vir_κ（N = 1 超 Virasoro 代数，κ = ½ / 0 两扇区）就是本图这张卡的对象。
      与 worldsheet.superstring-relative-cohomology-vanishing-v2--via-lian-zuckerman-1989 的同名边同款。
  - id: worldsheet.superstring-brst-additional-conditions
    note: |
      供给相对复形 (H3) 的定义（NS：b₀ = L₀ = 0；R：另加 β₀ = G₀ = 0），与 LZ **Definition 2.2**
      逐条对应；**Definition 2.11 的 R 扇区 ⟨,⟩_rel 用到的 D_R = π(G₀) + ρ(G₀) 也是这张卡的总 G₀**。
      本命题断言的对象 C_rel(p,κ) 就是这个复形，本边是最核心的对象对接边。
      ⚠ 该定义卡自身 physical-argument（上游 OPE / 路径积分链），是本推导 effective 被封顶的原因之一；
      **不降低本推导自身的 rigorous**（LZ 在自己的框架里把复形定义为良定义对象）。
  - id: worldsheet.superconformal-ghost-modes
    note: |
      供给 bc 与 βγ 的模式、（反）对易关系与 Bose-sea charge（LZ p.303 (1)–(4)），
      以及 **(H5) 的表示选择** T_{1/2}（κ=½）/ **T₀ ⊕ T₁**（κ=0）（LZ p.306 (7)）。
      特征标与号差的分情形计算是在这个鬼 Fock 空间 ⊗ 物质 Fock 空间上做的，
      公式右端的 ½(2κ+1) 前因子正是两扇区鬼零模结构差异的表现。
  - id: worldsheet.superconformal-ghost-unit-operator-vacuum
    note: |
      供给 (H5) 的背景：βγ 的真空选择不唯一且不等价（LZ p.304 逐字 'Representations corresponding to
      distinct charges are inequivalent.'）。本命题的公式绑定在 T₀ ⊕ T₁ 上（目标卡「不断言 (d)」）；
