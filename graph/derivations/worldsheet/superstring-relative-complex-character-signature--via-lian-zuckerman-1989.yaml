summary: |
  **LZ 的论证（本图未逐字转录，按 E5/§9.2/auditor 转录的骨架记）**：

  1. **对象**：固定 p ≠ 0、扇区 κ，相对复形 C_rel(p,κ)（Definition 2.2）在固定 p 下是有限维的分次空间
     （L₀ = 0 固定振子能级 N = κ − p·p/2 附近，相对次数只取有限多个值）；
     其上有 Definition 2.11 的厄米型 ⟨,⟩_rel（R 扇区经 D_R 原像定义，因为 ⟨T₁,T₁⟩_T = 0）。
  2. **特征标**：char C_rel(p,κ) = Σ_n (−1)^n dim C^n_rel 由鬼 Fock 空间 ⊗ 物质 Fock 空间的
     分次计数得出：鬼部门（bc 与 βγ，含零模表示 T_{1/2} / T₀ ⊕ T₁）的贡献与物质部门
     （α^μ_{−n}、d^μ_{−n+κ}、旋量因子 R(p,κ)）的贡献相乘，取相对次数分次的交错和；
     结果是 ½(2κ+1) · dim R(p,κ) · p^{(8)}_κ(κ − p·p/2)。
     （p^{(8)}_κ 的定义本图未取得；旁证 Prop 2.18 的 φ_κ(q)^{−8} 表明它是 8 个横向方向的
     玻色+费米计数系数。）
  3. **号差**：sign C_rel(p,κ) = Σ_n sign C^n_rel 按 p·p 的情形（auditor 转录的 'Case 1（p·p = 0）'
     等）逐一计算 ⟨,⟩_rel 在每个 C^n_rel 上的惯性指数，得到与 2 相同的表达式。
     ⇒ char = sign，即负惯性指数的交错和为零。
  4. **结论**：三项等式 char C_rel = ½(2κ+1) dim R(p,κ) p^{(8)}_κ(κ − p·p/2) = sign C_rel。

  **这一步不做**：上同调层面的任何事——把 char 变成 dim H⁰_rel、把 sign 变成 sign H⁰_rel
  要经 Euler–Poincaré 原理（特征标版 math.euler-poincare-principle；号差版本图无卡）与
  Theorem 2.4，那是 Corollary 2.15(i)(ii) 两张卡的事。

  **★ 证明结构（2026-09-11 补：researcher 第四轮页图逐字，extraction §10.3/§10.4，期刊 pp.312–317 六页）**：

  原文明写引用的编号结果**只有三条**：**Definition 1.3**（R 扇区旋量空间 R(p,0) 上的厄米型 ⟨,⟩_R）、
  **Definition 2.2**（ℬ/ℱ/C_rel 的定义，逐字 'Recall also that ℱ(p,κ) = ℬ(p,κ) ∩ Ker K (Definition 2.2)'）、
  **Theorem 2.7**（R 扇区 ℱ(p,0) 上 D_R 上同调平凡 ⇒ 收缩同伦 ε；两次使用：dim ℱ^n(p,0) = 2 dim C^n_rel(p,0)，
  以及 Lemma 2.14.3 的基计数）。外加**证明体内自造的五条带编号引理 Lemma 2.14.1–2.14.5**（印在 Prop 2.14 的
  证明里，pp.313–316，与 Theorem 3.3.1 同一体例）与定义 2.11 / 2.12 / 2.13。步骤：
    (a) 写出 ℬ(p,κ) 的典范基 Ω（p.312 式 (3)，含归一化常数 N_Ω）；
    (b) Σ_n(−1)^n dim ℱ^n(p,κ) = const term Tr⟨(−1)^{U+κ}q^K(A)⟩（(4)），并用 U 与 K 的显式表达式化为
        q^{(p·p/2)−κ} φ_κ(q)^{−8} dim R(p,κ)（(5)，φ_κ 由 **Definition 2.13** 给出，Def 2.13 引 [10] = Kac–Wakimoto）；
    (c) κ=½ 由 (4)(5) 直接得 char；κ=0 另需 dim ℱ^n(p,0) = 2 dim C^n_rel(p,0)（(6)，'Theorem 2.7 implies that …'）；
    (d) **Lemma 2.14.1**：若基 A 有「典范配对性质」则 sign W = Tr⟨1(A)⟩_W（自证，附 Remark 与 Counter Example
        W = R²，说明**任意基不行**）；**Lemma 2.14.2**：ℬ(p,½) 的基 A_s 有该性质 ⇒ (7)(8) 给出 sign C_rel(p,½)；
    (e) κ=0 分两种情形：**Case 1 p·p = 0**（C_rel(p,0) 由 16 个 Ψ^i_± 张成，'Using Definition 1.3, 2.11' 直接读出
        sign C_rel(p,0) = Σ_{i=1..16} √−1(Ψ^i_+, Ψ^i_−)_R = **16**）；**Case 2 p·p/2 为负整数**（(9) ℬ(p,0) = R(p,0) ⊗ 𝒮，
        由 Definition 1.3 造 p·d₀ 的本征基使同号配对为零，(13) ( , )_ℬ = ( , )_R ⊗ ( , )_𝒮，
        **Lemma 2.14.3/2.14.4/2.14.5** ⇒ (17)(18)(19)）。
  ★ **证明里没有任何一步引用 Theorem 2.4（消灭定理）**，也不引 Prop 2.18 / Cor 2.19 / §3 的任何内容，
  **不引任何外部文献**。⇒ **Prop 2.14 独立于消灭定理，方向是 Corollary 2.15 = Theorem 2.4 + Prop 2.14(ii)**，
  不是 Prop 2.14 依赖 Theorem 2.4。本推导据此**不挂** worldsheet.superstring-relative-cohomology-vanishing-v2
  的边（见 notes）。
  ★ **非退化性在证明里是被用的**：(i) 的证明逐字 'By non-degeneracy we have Q* = Q'；其来源是 p.311
    Definition 2.11 正上方的过渡句（承载者 Proposition 2.10(i)(iii)），见目标卡 sources 第四条。
  ★ pp.313–316 **没有出现 D = 10 这个数字**：临界维数只以「横向维数 8」（φ_κ(q)^{−8}）与「旋量维数 16/32」
    （R(p,0) 侧）的形式露面。

  【为什么标 rigorous】按 lead 指示「rigorous 若有印出证明，否则 physical-argument」：
  (1) 结论是**带编号的命题**（Proposition 2.14(ii)），期刊是 Communications in Mathematical Physics；
  (2) **证明是印出的**（pp.312–317，五页分情形计算；auditor 转录过其中的 (4)(5)(6) 与 Case 1），
      不是「一点思考就知道」式的断言；
  (3) 论证全在有限维分次向量空间与其上的厄米型里（维数计数、惯性指数），不涉路径积分、不涉收敛性。
  ⚠ **限制（2026-09-11 收紧后的版本）**：此前的限制是「陈述只有转录、证明只有骨架」，且附带一条降级条件
  「若 researcher 取 pp.312–317 页图后发现与 E5 转录不符则降级」。**该条件已检验并满足**：§10.3 逐字复核
  与 E5 一致、无更正 ⇒ **维持 rigorous**，且可追溯性从「L1 页级 + 转录」升到「L1 逐字（陈述）+ L1 步骤表（证明）」。
  仍未逐行复核的是 Lemma 2.14.1–2.14.5 的证明与三个迹计算的中间步骤（gaps 第一条），
  以及 §10.5 标为「需复核」的两行下标（Case 1 的 (Ψ^i_+, Ψ^i_−)_R 孰左孰右、Case 2 的本征基构造式）——
  这两行**都没有写进目标卡的 statement**，故不影响本卡断言。

  【有效状态为什么被封顶】接口卡 worldsheet.superstring-brst-additional-conditions、
  worldsheet.superconformal-ghost-modes 等自身 physical-argument（上游 OPE / 路径积分链），
  按 min 规则封顶。**这不是 LZ 的论证有缺口**，而是本图把「LZ 的对象 = Polchinski 的对象」
  经那些卡记账的后果，与消灭卡、维数卡同口径。
