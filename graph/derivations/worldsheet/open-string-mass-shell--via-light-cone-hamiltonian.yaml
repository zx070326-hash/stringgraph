id: worldsheet.open-string-mass-shell--via-light-cone-hamiltonian
target: worldsheet.open-string-mass-shell
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.open-string-mode-expansion
  - id: worldsheet.transverse-oscillator-commutators
  - id: worldsheet.light-cone-normal-ordering-constant
  - id: worldsheet.light-cone-coordinates
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.19)（光锥哈密顿量）、eq. (1.3.36)（质量壳；已核实）"
    note: |
      抽取记录 polchinski-1998-v1#E17，双源核实（Headrick 习题 1.7、Schrans §1.13）。
      中间步骤的公式号未逐条核对。
summary: |
  在光锥坐标下 m^2 = -p·p = 2p^+p^- - p^ip^i（用 worldsheet.light-cone-coordinates 的内积）。
  光锥规范把 p^- 与光锥哈密顿量 H 等同（差符号），H 由横向场的自由场哈密顿量给出：
  H ∝ (p^ip^i + (1/α')(N + A))/(2p^+)。代入即得 m^2 = (1/α')(N + A)，
  其中 N = Σ_{n≥1} α^i_{-n}α^i_n 由横向振子对易关系确认为能级算符（本征值 ∈ Z_{≥0}），
  A 是正规序常数。按 a = -A 改写为 α'm^2 = N - a。
gaps:
  - "A 的取值 -(D-2)/24 依赖 ζ/截断正规化，故本推导有效状态不高于 physical-argument（依赖 worldsheet.light-cone-normal-ordering-constant）。"
  - "把经典 α^-_0 提升为算符时的排序选择见依赖节点的 gaps；本推导不重复。"
  - "本推导只给开弦。闭弦对应式见 worldsheet.closed-string-mass-formula。"
  - "整体因子（2p^+H 与 α' 的配比）依赖 τ、ℓ 的归一化，见 conv.worldsheet-coordinate-length；本推导只跟踪结构，Schrans 已核实的特例 α'm^2 = N - 1（D = 26）用作系数的交叉检验。"
author: curator-polchinski-ch1
created: "2026-09-10"
