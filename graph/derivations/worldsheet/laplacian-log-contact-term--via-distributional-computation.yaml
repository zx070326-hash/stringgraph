summary: |
  由 worldsheet.laplace-fundamental-solution-2d（Lieb–Loss Thm 6.20，n = 2，带完整证明）出发，
  在 conv.worldsheet-complex-coords 下做换算。写 x = (σ^1, σ^2)、z = σ^1 + iσ^2、|z| = |x|：

    (1) Δ ln|x| = 2π δ(σ^1) δ(σ^2)                      [Lieb–Loss 6.20, n = 2；δ 相对 dσ^1 dσ^2]
    (2) ln|z|^2 = 2 ln|z|  ⇒  Δ ln|z|^2 = 4π δ(σ^1) δ(σ^2)
    (3) ∂ = (1/2)(∂_1 - i∂_2), ∂̄ = (1/2)(∂_1 + i∂_2)  ⇒  ∂∂̄ = (1/4)Δ
        ⇒  ∂∂̄ ln|z|^2 = π δ(σ^1) δ(σ^2)
    (4) δ^2(z,z̄) = (1/2) δ(σ^1) δ(σ^2)  ⇒  π δ(σ^1)δ(σ^2) = 2π δ^2(z,z̄)
    ⇒  ∂∂̄ ln|z|^2 = 2π δ^2(z, z̄)。

  **两个因子 2 缺一不可**：步骤 (3) 的 ∂∂̄ = Δ/4 与步骤 (4) 的 δ^2 = (1/2)δδ。
  若把 δ^2(z,z̄) 误当成 δ(σ^1)δ(σ^2)，右端系数会变成 π 而不是 2π。
  一致性检查（与目标陈述的测试函数形式吻合）：
    ∫ d^2 z (∂∂̄ ln|z|^2) f = ∫ 2 dσ^1 dσ^2 · π δ(σ^1)δ(σ^2) f = 2π f(0)，
    且 ∫ d^2 z δ^2(z,z̄) = ∫ 2dσ^1 dσ^2 · (1/2)δ(σ^1)δ(σ^2) = 1 ✓。

  历史上本图曾用另外两条路线（围道 / ln(|z|^2+ε) 正规化，见 headrick-2008 习题 2.1 解答与
  schrans-2020 §2.6）验证同一系数；它们现在只作核对源，论证由 Lieb–Loss 6.20 承担。
gaps:
