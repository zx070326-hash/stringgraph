     由 schrans-2020 §2.6（笔记 p.45）在 σ^a 坐标下的显式 Stokes 验算佐证（核对源，L1）。
     它是有限步初等换元/系数记账，前提（两条归一化）已在 conv.worldsheet-complex-coords 写全，
     但**尚未经 reviewer 独立复核**；见 notes 对 docs/STATUS_LEVELS.md rigorous 例外条款的读法。"
  - "δ^2(z,z̄) = (1/2)δ(σ^1)δ(σ^2) 的原始出处是 Polchinski 前言 p. xviii，
     对原书只有 L3 证据（经 schrans-2020 两次转述「the delta function convention from p xviii」），
     原文措辞未核对（math-sources.md Q3）。若这条归一化被证伪，本节点右端系数即错因子 2。"
  - "本条只对紧支光滑测试函数成立；Polchinski 后续把它作用在算子插入上（而非测试函数上），
     那一步的缺口属 worldsheet.operator-equation-of-motion，不属本节点。"
