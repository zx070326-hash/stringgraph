    inferred: true
    note: |
      供给本推导 §6 显式代表元构造所仿的**模板**：Dedushenko §6 的
      Ω = 1 − S^{−1}U + … 逐字仿 Polchinski §4.4（本图这张卡的推导
      --via-polchinski-4-4 的第 5 步）。
      **标 inferred**：Dedushenko 引的是 polchinski-1998-v1 §4.4 这篇文献，
      不是本图这张卡；且他自己的主论证走谱序列，代表元构造只是补充。
      ⇒ 本推导因此**继承**玻色弦一侧那条"下三角矩阵一般性质 / S^{−1} 级数收敛性"的缺口
