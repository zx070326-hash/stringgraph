                                      （lian-zuckerman-1989 Theorem 2.20，rigorous）
    相对上同调正定（固定表示）       → worldsheet.no-ghost-theorem-superstring-cohomological
    绝对 ↔ 相对的关系（固定表示）    → lian-zuckerman-1989 Theorem 5.1 / 5.4，**本图未建卡**

