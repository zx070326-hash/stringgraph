      供给"βγ 有不等价真空"这一事实——**这正是本卡要回答的问题的前提**：
      若 βγ 真空唯一，picture 无关性就无从谈起。
      lian-zuckerman-1989 p.304 逐字 'Representations corresponding to distinct charges are
      inequivalent.' 是同一事实的数学侧陈述。
  - id: worldsheet.rns-super-virasoro-generators
