summary: |
  七输入组装（逐层对应 LevelThreeCount.lean 的 section Closing）：

  **h1-h6（D-无关的维数不等式与计数恒等式）**：
  h1 = dim H_3 ≤ p_{D−1}(3)（worldsheet.physical-slice-bounded-by-transverse-count）；
  h2/h4/h5 = 内部占据数上下界（不建边）；
  h3 = p_{D−1}(3) = p_{D−2}(3) + p_{D−1}(2) + (D−1)（math.level-three-partition-difference）；
  h6 = dim Q_{−3,2} ≥ p_{D−1}(2)（worldsheet.quasi-physical-slice-dimension）。

  **h7（唯一用到 D=26 的一步）**：`le_finrank_towerNull_inf_towerBigrade_three` 给
  dim(H_null ⊓ V_3) ≥ dim Q_{−3,2} + (D−1)，构造 Type-1⊕Type-2 组合映射
  （定义域 towerSeed(−3,2) × ker(transFunctional(−3))），其单射性由
  worldsheet.level-three-null-family-transversal 的横截性定理给出，其像落在
  H_null ⊓ V_3 里的两半分别由（Type-1）NullSeedsTwo.lean 的共享铺垫引理与
  （Type-2）本文件的 `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`
  （经 worldsheet.level-two-null-state-requires-d26 已登记的一般充分性引理
  `descTwo_mem_towerNullSubmodule`，D=26 在此进入）给出。

  **收尾**：七项经 `omega` 拼成 `b26_three_of_D26`，再经 D-无关、N-无关的纯逻辑
  翻译引理 `ddfSpansOn_bigrade_of_b26`（不建 depends_on 边）得目标卡断言
  `ddfSpans_bigrade_neg_three_three`。
