  - id: math.level-three-partition-difference
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl**：`levelThree_count_identity` 作为 `b26_three_of_D26`
      的 `h3`，给出 p_{D−1}(3) = p_{D−2}(3) + p_{D−1}(2) + (D−1)。
  - id: worldsheet.level-three-null-family-transversal
    inferred: false
    note: |
      **不是逐字调用同一条 decl，是其所在同一 section 的姊妹定理，且核心机制被字面
      调用**：本卡 `h7`（`b26_three_of_D26` 内联证明块）字面等于
      `le_finrank_towerNull_inf_towerBigrade_three`（同文件 section NullBoundThree，
      紧邻横截性引理所在的 section Independence），其证明体内部构造的
      `typeTwoAugRaw_injective` 直接调用横截性引理
      `eq_zero_of_towerLop_neg_one_add_descTwo_oneSeed`（即本依赖目标卡的
      formal.lean_decl）来证明 Type-1⊕Type-2 组合映射单射——这是本卡维数下界
      h7 的核心步骤，非外围工具。
  - id: worldsheet.null-states-lower-bound-type-one
    inferred: true
    note: |
      **不是字面调用链，是共享底层引理的姊妹机制**：`le_finrank_towerNull_inf_towerBigrade_three`
      不调用该卡 formal.lean_decl `le_finrank_towerNull_inf_towerBigrade_succ`；两者
      各自独立调用同一条更底层的铺垫引理
      `towerLop_neg_one_mem_towerNullSubmodule_of_mem_towerBigrade`
      （NullSeedsTwo.lean 第 476 行）来处理各自的 Type-1 半。任务书要求把"level-3 的
      Type-1 族 = L₋₁ 作用于 Q_{−3,2}"这一物理对应关系挂到该卡，本卡据此照办，但因为
      不是可核实的字面调用链，标 `inferred: true`（与
      worldsheet.level-three-null-family-transversal--via-lean 里对同一条底层引理的
      **字面**调用——`towerLop_neg_one_injective`——标 `inferred: false` 形成对照，
      理由是那里的引理被直接 `exact`，这里是"两条 h7/该卡头牌定理各自独立调用同一
      更深层引理"的结构类比，不是调用关系）。
  - id: worldsheet.level-two-null-state-requires-d26
    inferred: false
    note: |
      **精确 decl 非该卡 formal.lean_decl，经由一般化引理**：h7 内部的 Type-2 半调用
      本文件的 `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`（任意 rung j、
      level N 满足 j+N=−2 的版本），其证明体直接调用 `descTwo_mem_towerNullSubmodule`
      （NullSeedsTwo.lean 的一般充分性引理：`hD26 : (D:R)=26` + `L₀y=−y` ⟹
      `𝒟₂y ∈ towerNullSubmodule`）——这条引理正是该卡 sources.loc 已登记的 "descTwo_mem_towerNullSubmodule"
      （该卡的铺垫链之一，非其 headline `descTwo_mem_towerPhysSubmodule_iff`）。
      本卡消费的是这条被登记的铺垫引理本身，故 `inferred: false`。
