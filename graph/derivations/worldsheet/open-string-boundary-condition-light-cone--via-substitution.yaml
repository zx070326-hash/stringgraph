id: worldsheet.open-string-boundary-condition-light-cone--via-substitution
target: worldsheet.open-string-boundary-condition-light-cone
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.open-string-neumann-boundary-condition
  - id: worldsheet.light-cone-gauge
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.13)（(1.2.28) 在光锥规范度规下的分量形式；已核实）"
    note: 抽取记录 polchinski-1998-v1#E12，Schrans §1.11 给出逐字表达式。
summary: |
  展开 ∂^σ X^μ = γ^{σa} ∂_a X^μ = γ^{στ} ∂_τ X^μ + γ^{σσ} ∂_σ X^μ，
  用二维逆度规 γ^{ab} = (1/γ) ε^{ac} ε^{bd} γ_{cd} 的显式分量
  γ^{στ} = -γ_{τσ}/γ，γ^{σσ} = γ_{ττ}/γ，并用 det γ = -1（光锥规范 (LC2)），
  即得 ∂^σ X^μ = γ_{τσ} ∂_τ X^μ - γ_{ττ} ∂_σ X^μ。令其在端点为零即得 (1.3.13)。
gaps:
  - "纯代数改写，不引入新的物理输入；但其前提（Neumann 而非 Dirichlet）继承自 worldsheet.open-string-neumann-boundary-condition。"
  - "整体符号与因子依赖 det γ = -1 的规范选择；若 Weyl 规范取法不同，需重新配平因子。"
author: curator-polchinski-ch1
