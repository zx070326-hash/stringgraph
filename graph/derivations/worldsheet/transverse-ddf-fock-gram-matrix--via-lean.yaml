summary: |
  本推导是**图侧接线**：目标陈述的三条结论各由 formal/StringFormal/NoGhost/DDFGram.lean 中
  具名、无 sorry 的 Lean 声明承载（对应表见目标卡的 DDFGram source）。论证结构：

  **第一步：把 A^ε_n 打包成 Heisenberg 族。** `ddfFamily η a b ε hη hεb i n := ddfOp η a b (ε i) … n`，
  形状正是抽象母定理 `StringFormal.gram_of_heisenberg_family` 需要的 `ι → ℤ → End R M`，
  载体 M := `TowerFock D R`（= 目标卡的塔 T(k;k_0)）。

  **第二步：四条假设在 DDF 上被逐条证出（而不是假设）。**
    · (H1) `ddfFamily_ccr` = `lie_ddfOp_ddfOp`（给 m (ε_i·ε_j) δ_{m+n,0}）**＋ 正交归一 `horth`**；
    · (H2) `ddfFamily_adj` = `Fock.towerPairing_ddfOp_left`；
    · (H3) `ddfFamily_ann` = `ddfOp_towerVacuum_of_pos`（证明是蓝图预言的一行：
           n > 0 时 `ddfWindow n towerVacuum = Finset.Icc n 0 = ∅`）；
    · (H4) `Fock.towerPairing_towerVacuum_self`（⟨0;k|0;k⟩ = 1，把整个 Gram 矩阵的总标度钉死）。
  「产生算子两两对易」不是第五条假设：`commute_heisCreation_ddfFamily` 由 (H1) 得出，
  它使 `ddfMonomial d := ∏ (A^{ε_i}_{−n})^{d(i,n)} |0;k⟩` 与因子次序无关（目标卡【被断言的对象】那段）。

  **第三步：目标 (1)。** `ddf_gram_diagonal d e = if d = e then heisNorm R d else 0`，
  一行实例化母定理；两半 `ddf_gram_of_ne` / `ddf_gram_self`；bundled 版（ι = Fin (D−2)，
  取 `TransverseFrame`）是 `towerPairing_frameMonomial`。`heisNorm R d = ∏ n^{d(i,n)} d(i,n)!`
  逐字是目标 (1) 的右端。

  **第四步：目标 (2)。** 三条：
    · `linearIndependent_ddfMonomial`（[Field K] [CharZero K]）——线性无关；
    · `ddf_gram_pos`（[PartialOrder] [IsStrictOrderedRing]）——每个 |{d}⟩ 的范数 > 0；
    · **`ddf_span_pos`**（[Field] [LinearOrder] [IsStrictOrderedRing]）——
      0 ≠ v ∈ `ddfSpan` ⇒ ⟨v,v⟩ > 0，即目标 (2) 末句那条不等式本身；
      它经 `towerPairing_linearCombination_frameMonomial`（⟨Σ c_d|d⟩, Σ c_d|d⟩⟩ = Σ c_d² ‖d‖，
      即目标 (2) 里写出的那个求和式）与 `Finset.sum_pos'` 完成。
  ★ 「H^⊥(k) 是什么」由 **`ddfSpan_eq_span_range_frameMonomial`** 钉住：LightCone.lean 里按
  产生算子列表定义的 `ddfSpan` 与按占据函数 d 定义的单项式张成**是同一个子模**。
  没有这条，(2) 的「⟨·,·⟩ 限制到 H^⊥(k) 上正定」在 Lean 侧读不出来。

  **第五步：目标 (3)。** `ddfLevel d := Σ n·d(i,n)`，`ddf_gram_of_level_ne`：N(d) ≠ N(e) ⇒ 配对为零
  （由 (1) 加 N(d) ≠ N(e) ⇒ d ≠ e）。**2026-09-11 追记**：末句的层归属现已形式化——
  `frameMonomial_mem_towerRungSubmodule`（|{d}⟩ ∈ rung −N(d)）与 `ddf_gram_of_level_ne_of_rung`
  （同一正交性改由层间正交证出，前件更弱，见 notes (e)）；只剩 rung ↔ 振子能级的联动未做（见 gaps）。

  【为什么标 formalized】目标 (1)(2) 与 (3) 的主断言各有具名无 sorry 的 Lean 声明；
  五条依赖卡 effective 全为 formalized。`--via-oscillator-recursion`（手写递推，rigorous）
  保留并存，工具取高者。
  ⚠【2026-09-11（lightcone-frame）更新】第六条依赖 worldsheet.ddf-light-cone-frame 是
  **rigorous** 的定义卡（接口边，供给标架定义），故上一句的「五条依赖卡 effective 全为
  formalized」已过时，本推导 **effective = rigorous**。`status: formalized` 是本推导自身论证的
  等级（Lean 声明无 sorry，未变）；effective 由工具计算，两者不一致正是 min 规则的预期表现。
  详见那条依赖的 note。
  ⚠【同日改判（同一分支，commit 1152cbf 之后）：该 depends_on 边**已撤回**】
  上一段描述的状态**不再是现状**：本推导仍是五条依赖，effective 回到 formalized。
  撤回理由两条：(1) 目标陈述把 ε^i·k_0 = 0 与 ε^i·ε^j = δ^{ij} 逐字写在【设定】里，
  `ddf_gram_diagonal` 的假设与之一一对应，读懂 lean_decl 不需要那张定义卡——按
  docs/STATUS_LEVELS.md「接口边（2026-09-12 裁决）」末句，只提供语境的边**不得存在**；
  (2) `tests/test_graph.py::test_seed_no_ghost_v4_drops_to_physical_argument_after_ddf_split`
  第 271 行钉死本目标卡 effective = formalized，加边后 pytest 变红（该测试的 docstring 末段
  逐字记录了本卡升到 formalized 的来历，属于项目刻意保护的不变量）。
  ⇒ 改为在目标陈述卡上加 `uses: worldsheet.ddf-light-cone-frame`（proposition 的 `uses`
  不参与传播），指针仍在图里，状态不受影响。若 lead 要传播效果，见 commit 1152cbf 的原文，
  并须同步改那条测试断言（工具侧改动，单独提交，由 lead 裁决）。
gaps:
  - "**(3) 的末句已关闭（2026-09-11 追记，DDFGram rung 定位合入 main 后）**：原 gap 写「|{d}⟩ 落在塔的第 N(d) 层……没有对应声明」。现在有了：`ddfMonomial_mem_towerRungSubmodule` / `frameMonomial_mem_towerRungSubmodule` 给 |{d}⟩ ∈ towerRungSubmodule(−N(d))（即动量 k − N(d) k_0；塔的层指标取 +j·k_0，故是 **rung −N(d)**），`ddf_gram_of_level_ne_of_rung` 把「N(d) ≠ N(e) ⇒ ⟨{d},{e}⟩ = 0」**改由层间正交**（`towerPairing_eq_zero_of_mem_towerRungSubmodule`）证出，逐字兑现目标 (3) 末句「也可由塔的层间正交直接读出」。`ddfSpan_eq_iSup_rung` 另给 ddfSpan = ⨆_N (ddfSpan ⊓ rung −N)，使 Gram 矩阵成为分块对角。**仍缺**：「rung 与振子能级的联动」——|{d}⟩ ∈ towerBigrade(−N(d), N(d))（即振子能级恰为 N(d)）**未做**；只有 rung 那一半，没有 level 那一半。
    ⇒ **【2026-09-12 追记（curator）：这条『联动』缺口已在下游关闭，但不改本推导状态】** `formal/StringFormal/NoGhost/SliceDim.lean :: StringFormal.NoGhost.frameMonomial_mem_towerBigrade`
    （蓝图 §B′ PR2；分支 agent/formalizer/general-n-pr012，提交 9328c03 合入 main）证出
    `|{d}⟩ ∈ towerBigrade D R (−N(d)) N(d)`，即 rung 与 level 的联动。⚠ **论证形状不是
    『算出 ddfOp 的振子能级』**：Lean 文件头逐字——'The proof does *not* compute the
    oscillator level of `ddfOp`. Instead: `|d⟩` sits on rung `-N(d)` (已由本推导 (3) 关闭的
    rung 那一半给出) and is physical (`ddfMonomial_mem_towerPhysSubmodule`); each of its
    bigraded components is again physical (`Glue.towerBigradeProj_mem_towerPhysSubmodule`);
    and a nonzero physical vector in the slice `(j, M)` must satisfy `α'k² + j + M = a₀`
    (`massShell_of_mem_towerBigrade`), which at `j = -N(d)` forces `M = N(d)`'——即靠
    **物理性 + 质壳条件**把双分次压到单一分量，不是直接验证 A^ε_n 的模数与振子数满足
    N(d) = Σ n_i。类型类比本推导所在 section 更窄的一层：`frameMonomial_mem_towerBigrade`
    所在的 `section Bigrade` 要 `[CommRing R] [Algebra ℚ R] [NoZeroDivisors R] [CharZero R]`
    （`massShell_of_mem_towerBigrade` 把标量方程 `α'k²+j+M=a₀` 化成整数方程 `j+M=0` 需要
    这两条），比本推导目标 (1)(2)(3) 本身的假设（(1) 只需 `[Algebra ℚ R]`；(2)(3) 见 summary
    第四、五步）更强。**不建新 depends_on 边**：目标卡 `worldsheet.transverse-ddf-fock-gram-matrix`
    的 effective 被 `tests/test_graph.py::test_seed_no_ghost_v4_drops_to_physical_argument_after_ddf_split`
    钉在 formalized，本文件历史上（2026-09-12，lightcone-frame 接口边一节）已有一次
    「加边后 pytest 变红，随即撤回改为 statement 的 `uses`」的先例；`frameMonomial_mem_towerBigrade`
    对本推导的用法是**下游**（`worldsheet.ddf-spanning-rank-inequality` 与
    `worldsheet.ddf-spanning-hypothesis--via-rank-inequalities` 的边才真正消费它），
    本推导自身的三条结论 (1)(2)(3) 不需要它。⇒ 本推导 `status: formalized`
    **不变**，只在此追加一条 gap 说明「联动」缺口已被下游关闭，指向消费它的那两条新推导。"
  - "**目标 (1) 的『任意交换环』由母卡承载，不由本文件承载**：`ddf_gram_diagonal` 带 `[Algebra ℚ R]`（`ddfOp` 的构造需要 1/2 一类的有理数）。完全一般的条件命题是 `StringFormal.gram_of_heisenberg_family`（任意交换环，图上 math.heisenberg-family-gram-matrix）。见 notes (d)。"
  - "**(H1)–(H4) 在本卡里仍是假设**（目标卡边界 (a)）：Lean 把它们在 DDF 上证出来了，但那是 `ddfFamily_*` 四条定理的内容，不是本卡的断言；本卡的机检链之所以经过它们，只因 lean_decl 取的是 DDF 实例。两种读法的分界写在 notes 与两条 depends_on 的 note 里。"
  - "**无张成**（Lean 文件头 Mathematical notes 第 4 条 / Gaps 第 1 条）：没有任何声明说 DDF 态穷尽横向物理谱。`ddf_span_pos` + `ddfSpan_le_towerPhysSubmodule` 只给「DDF 扇区是物理子空间里的一个正定子空间」；整条无鬼定理还差 `hspan : H_phys ≤ ddfSpan ⊔ H_null`（`ddf-spans`，蓝图 §B）。目标卡边界 (b) 同款。"
  - "**横向标架是输入不是构造**（Lean 文件头 Gaps 第 2 条）：`TransverseFrame η b` 在 ℚ-代数 + D ≥ 3 上由 Witness.lean 的 `witnessTransverseFrame` 造出，但**没有**「每个类光 b 都容许正交归一标架」这条定理；一般环上为假。⇒ 目标卡设定里的 ε^i·ε^j = δ^{ij} 在 Lean 里是 hypothesis + 一个见证，不是定理。"
  - "**curator 未自行跑 `lake build` 与 `check-axioms`**：依据是 noghost-c4 由 lead 合入 main。本分支不含 Lean 改动。"
notes: |
  【四条前件收紧 —— 引用本推导前必读（curator，2026-09-11，small-backlog-14 追加项）】

  (a) **抽象母定理的 CCR 与伴随量化到全部 ℤ（含 0），比目标卡的 m, n ∈ Z \ {0} 强。**
      `gram_of_heisenberg_family` 的 `hccr` / `hadj` 写的是 `∀ (m n : ℤ)`，目标卡 (H1)(H2) 写的是
      `m, n ∈ Z \ {0}`。DDF 侧不受影响（`lie_ddfOp_ddfOp` 与 `towerPairing_ddfOp_left` 本来就对全部
      整数模式成立，`ddfFamily_ccr` / `ddfFamily_adj` 照抄），但记账上要诚实：
      **Lean 的前件比卡更强**。查证结论：**证明体里从未在 n = 0 处使用这两条假设**
      （产生标号跑 `ι × ℕ+`，湮灭那步的 Leibniz 只用 n > 0），
      ⇒ 假设**可以放宽到 n ≠ 0 而未放宽**。这不是缺口，是一条未收紧的裕度；
      若将来有人要把本卡用在「A^i_0 不存在或不满足 CCR」的设定上，需要先做这次放宽。

  (b) **正交归一 ε_i·ε_j = δ_{ij} 是一条真前件，不是横向性的推论。**
      `lie_ddfOp_ddfOp` 对**任意**一对横向偏振只给 ⁅A^ε_m, A^δ_n⁆ = m (ε·δ) δ_{m+n,0}；
      把它变成 m δ_{ij} δ_{m+n,0} 的是 `horth`（Lean 文件头逐字："Orthonormality is a real extra
      hypothesis: without it the DDF Gram matrix is the (constant) transverse Gram matrix tensored
      with the Heisenberg one, and is diagonal only after diagonalising ε_i · ε_j."）。
      目标卡把它写在**设定**里（「横向偏振……满足 ε^i·k_0 = 0 **且 ε^i·ε^j = δ^{ij}**」）而不是
      写进 (H1)–(H4)，两处都对，但读卡时容易滑过去。⇒ **不要**把本卡读成「横向性 ⟹ 对角 Gram」。
      存在性见 Witness.lean 的 `noghost_transverse_gram_satisfiable`（ℝ 上 D ≥ 3），
      「D − 2 个横向方向」这件事在此进入；**此处不需要 D = 26**（文件头 Mathematical notes 第 1 条）。

  (c) **「DDF 态是物理态」用质量壳，且截距不自由。**
      `ddfMonomial_mem_towerPhysSubmodule` 成立的截距是 **a₀ = ½ α_0² = α' k²**（由真空读出，
      不是独立参数；Witness.lean 的快子归一化 α' k² = 1 才使它等于 1）。
      ⇒ 目标卡边界 (d)「不使用质量壳条件」**仍然成立**：(1)(2)(3) 确实与 k² 无关，
      `ddf_gram_diagonal` 的语句里没有 a₀。但**一旦要说「H^⊥(k) 落在物理态空间里」**
      （目标卡边界 (d) 明说那是下游的事），就必须带上 a₀ = α' k² 这个取值。
      本推导不断言那件事；记在这里是因为 DDFGram.lean 顺手证了它，容易被下游误当作本卡的一部分。

  (d) **`[Algebra ℚ R]` 只是 `ddfOp` 构造的代价，不是命题的需要。**
      目标 (1) 说「任意交换环」，而 `ddf_gram_diagonal` 带 `[Algebra ℚ R]`。
      抽象命题 `gram_of_heisenberg_family` 对**任意交换环**成立（math.heisenberg-family-gram-matrix），
      ℚ-代数是构造 DDF 算子（顶点算子的指数、1/2 一类系数）才需要的。
      ⇒ 记账读法：目标卡 (1) 的一般性由**母卡**承载，本文件承载的是「DDF 族确实满足 (H1)–(H4)」
      这一实例化。两条边（math.heisenberg-family-gram-matrix 与本文件）合起来才覆盖卡面。

  (e) **(3) 的层间正交证明前件比 (1)(2) 弱（2026-09-11 追记）。**
      `ddf_gram_of_level_ne_of_rung` 的证明**只用动量守恒**：`ddfOp_mem_towerRungSubmodule`
      （A^ε_n 把 rung j 送到 j + n）逐因子归纳给 |{d}⟩ ∈ rung −N(d)，再用不同 rung 本来正交。
      它**不用**正交归一 `horth`、不用 Heisenberg 递推、不用 (H2)(H4)（DDFGram.lean docstring 逐字：
      'it needs neither the orthonormality of the frame nor the Heisenberg recursion, only momentum
      conservation'）。⚠ 但 Lean 语句里 `horth` 仍出现：`ddfMonomial` 这个**对象**的定义用
      `commute_heisCreation_ddfFamily hη hbb hba hεb horth` 保证因子次序无关，故签名带着它；
      是对象带前件，不是证明用前件。
      更底层的 `ddfOp_mem_towerRungSubmodule` 是**纯运动学**：只需 `hη`、`hεb`（定义 A^ε_n 本身所需的
      那两条），**不需要** `hbb`/`hba`/正交归一——这是 worldsheet.ddf-operators-v6 那个对象的一条独立性质
      （「A^ε_n 把动量 k + j k_0 移到 k + (j+n) k_0」），该卡目前未登记；那张卡在另一 claim 下，已报告 lead。

  【与 --via-oscillator-recursion 并存】那条是本图自补的手写递推（rigorous，走
  docs/STATUS_LEVELS.md 的例外条款），**保留不删**：它是 Lean 版的前身与独立复核物，
  按「一个陈述可挂多条推导、工具取最强者」的规则两条并存。

  curator，2026-09-11，small-backlog-14（lead 追加第 6 项）。
