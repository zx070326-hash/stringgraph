      （a = -A）；本推导与目标陈述用的是 a，取 a = (D-2)/24。
  - id: worldsheet.open-string-mass-shell
    note: |
      本推导的 summary 用 α'm^2 = N - a 把 Δ_n = 0 的解读成谱条件。该质量壳现已单列
