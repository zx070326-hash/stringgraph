  - id: worldsheet.light-cone-normal-ordering-constant
    note: |
      本推导的 summary 与 gaps 已经用到 a = (D-2)/24（横向零点能经 ζ 正规化），
      原先它只写在 gaps 里而没有对应的依赖边。该结果现已单列节点
      （Polchinski §1.3，A 的定义式 **(1.3.31)**、ζ 正规化 (1.3.32)、结果 **(1.3.35)** `A = (2−D)/24`，
      式号 2026-09-11 经原书核实落实），已列入本推导 sources 的 §1.3 条目，故这条边有来源支撑，非 inferred。
    convention_map: |
