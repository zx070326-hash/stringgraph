summary: |
  机器检查的证明，在 formal/StringFormal/NoGhost/LightCone.lean，
  蓝图 formal/BLUEPRINT-noghost.md §B.6 的 N = 1 增量。论证是**四步**。

  **第 1 步（下到单层）。** 设 x ∈ H_phys(a₀) ∩ T_{−1,1}。由 `mem_towerBigrade`，
  x = Finsupp.single (−1) P（支撑在第 −1 层），且 P 的振子能级为 1。
  层化引理 `single_mem_towerPhysSubmodule_iff` 把「x 在塔上物理」化为
  「P 在动量 p_{−1} = a − b 的 Fock 空间上物理」（L_m 逐层作用，纯记账）。

  **第 2 步（解能级 1 的物理态）。** `Fock.mem_physSubmodule_inf_levelSubmodule_one_iff` 给出
  **完整**解：存在偏振 e 使
    P = polState η e := Σ_μ η_μ e^μ α^μ_{−1}|0; p_{−1}⟩，
  并且 **η(e, p_{−1}) = 0**（这是 L_1 条件），外加一条质壳标量条件。
  ⚠ 质壳那一条在证明里**被丢弃**（`obtain ⟨e, hPe, -, htrans⟩` 的 `-`），
  这正是目标卡「不需要 (N)(S)」那一条的机检依据。

  **第 3 步（拆偏振）。** 对 e 用假设 (C)（`hspan`，
  worldsheet.transverse-frame-spans-orthogonal-complement 的谓词）：由 η(e, p_{−1}) = 0 得
    e = Σ_{i=1}^{D−2} c_i ε_i + c_0 p_{−1} 。
  再用 polState 的线性性（`polState_add`、`polState_smul`、`polState_sum`）把它抬到态上：
    P = Σ_i c_i · polState(ε_i) + c_0 · polState(p_{−1}) 。

  **第 4 步（认出两端）。**
  · **横向项 = DDF 态**：`single_polState_vec_mem_ddfSpan` 给
      single(−1)(polState η ε_i) = A^{ε_i}_{−1}|0; k⟩ ∈ D(Ε)，
    这一步**恰是**领头项引理 `ddfOp_neg_one_apply_towerVacuum`
    （A^ε_{−1}|0;k⟩ = α^ε_{−1}|0;k−k_0⟩，无修正项），**它需要 (T′) η(ε_i, a) = 0**。
  · **纵向项 = 伪态**：`towerLop_neg_one_apply_single_vacuum_eq` 给
      L_{−1}|0; k−k_0⟩ = single(−1)(polState η p_{−1})，
    即纵向偏振方向恰是该层动量方向。
  两项合起来 x ∈ D(Ε) ⊔ span{L_{−1}|0;k−k_0⟩}。∎

  **见证版**：`witness_towerPhys_bigrade_one_le_ddfSpan_sup_spurious` 把 (T′) 与 (C) 分别用
  `dotVec_witnessTransverseFrame_witnessMomentum` 与 `witness_frameSpansOrthogonal` 兑现，
  故在显式光锥标架上本结论**无条件**成立（不是空条件命题）。
gaps:
  - |
    **N = 2 未做，这是本支下一个真实障碍**。formal/TODO.md 的 `noghost-b` 逐字登记两块：
    (a) 领头项在 n = 2 与 A^ε_{−1}A^δ_{−1} 上的类比——窗口变成 {−2,…,0}，
    顶点算子的 1 级、2 级系数 Φ_1、Φ_2 真正开始贡献，需要 `creaExp` 的**层 2 分量**；
    (b) `Fock.mem_physSubmodule_inf_levelSubmodule_one_iff` 的能级 2 类比，
    即 L_1/L_2 条件在能级 2 上的**完整**解——`NoGhost/LevelTwo.lean` 只覆盖 SO(D−1) 标量试探族
    （其文件头自述）。两块都没有的情况下，N = 2 连陈述都写不出来。
    ⚠ D = 26 正是从 N = 2 起才进入（蓝图 §B.5），故 N = 1 的完成**不**触及 (B-26)。
  - |
    **只给一个方向的包含**。反向（DDF 态与伪态确实物理）是另一支
    （worldsheet.ddf-operators-preserve-physical-states，已 formalized；
    Lean 侧另有 `ddfSpan_le_towerPhysSubmodule`），本推导不涉及，也不给出等式。
  - |
    **不涉及任何正定性**。「H^⊥ 上 Gram 正定」由
    worldsheet.transverse-ddf-fock-gram-matrix 承载，与本推导无交集；
    把本卡读成「无鬼定理的 N = 1 情形」是**误读**——无鬼定理要的是内积半正定，
    本卡只给子空间包含。
  - |
    **伪态未证为零模态**。目标卡【不断言】(c)：a₀ = 1 时 L_{−1}|0;k−k_0⟩ 才是零模态
    （Lean `Fock.Lop_neg_one_apply_one_mem_nullSubmodule`，本推导未调用），
    一般 a₀ 下它只是伪态。因此本卡**不**支持「物理态模零模态 ≅ 横向空间」这种读法。
  - |
    **(T′) 与 (C) 在一般标架下不可去**，见各自卡的 notes（两个反例，其中 (T′) 的那个是机检存在性）。
    本推导把它们写成前提是**诚实**而非保守：文献默认的光锥标架
    （ε_i ∈ span{k_0,p}^⊥）同时给出这两条，但那步论证需要实二次型的非退化性，
    在一般交换 Q-代数上不可用。
  - |
    **继承 DDF 定义卡的对象缺口**：本图/Lean 的 A^ε_n 是**模态和**，与文献的**围道积分** A^i_n
    是同一个算子这件事只有 physical-argument 级承载
    （worldsheet.ddf-contour-equals-mode-sum）。回译到 Goddard (6.4) 时必须引用它。
