      M(1) = S(𝔥 ⊗ t^{-1}ℂ[t^{-1}]) 与该卡的 F(D, R) 是同一个空间（该卡逐字声明「无零模」，
      正对应 Li–Wang 的 M(1) 里零模不在 Fock 空间中而由模的参数 λ 携带）。
