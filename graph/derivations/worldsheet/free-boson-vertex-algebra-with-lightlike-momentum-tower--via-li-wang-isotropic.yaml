      §4 设定逐字：「Let 𝔥 be a finite-dimensional vector space equipped with a nondegenerate symmetric
      bilinear form ⟨·,·⟩ and let L ⊂ 𝔥 a free abelian group with **⟨α,β⟩ = 0 for α, β ∈ L**」
