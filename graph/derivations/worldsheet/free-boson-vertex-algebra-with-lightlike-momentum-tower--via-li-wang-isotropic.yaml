summary: |
  **把 math.lattice-vertex-algebra 实例化到「𝔥 = ℂ^D 带 η、L = Z k 类光」，四步，全部初等。**

  第 1 步（把物理数据装进 Li–Wang 的假设）。取 𝔥 = ℂ^D，双线性型为 η 的复线性延拓——
  它在 ℂ 上非退化（η 可逆）。取 k := (2α')^{1/2} k_0，L := Z k。
  由 k_0² = 0 得对一切 α = jk, β = j'k ∈ L
    ⟨α, β⟩ = j j' · 2α' k_0² = 0,
  故 (3.5) ⟨α,α⟩ = 0 ∈ 2Z 成立，且更强地 **⟨·,·⟩|_L ≡ 0**（Li–Wang §4 的标题条件，逐字命中）。
  取常值 ε ≡ 1：(3.6) 显然；(3.7) 两端都是 1；(3.8) 要求 ε(α,β)ε(β,α)^{-1} = (−1)^{⟨α,β⟩} = (−1)^0 = 1，
  左端 = 1，成立。⇒ **(3.5)–(3.8) 全部满足，且扭群代数退化为普通群代数 ℂ[Z k]**（见 gaps 第 1 条）。

  第 2 步（顶点代数）。由 math.lattice-vertex-algebra（= Li–Wang Theorem 3.6 前半），
    V = ℂ[Z k] ⊗ M(1)
  是顶点代数，M(1) 是其顶点子代数。**只是 vertex algebra，不是 VOA**（目标陈述 (N3)）。

  第 3 步（模 = 动量塔）。取 U := M(1, p̃)：level-1 的 ĥ-模，h(0) 作用为标量 ⟨h, p̃⟩，h(n)（n ≥ 1）湮灭。
  验 **Condition C_L**（Li–Wang Definition 3.5）三条：
    · restricted level 1 —— 按构造；
    · 对每个 α = jk ∈ L，α(0) 半单且本征值为整数 —— α(0) 在 U 上是标量 j⟨k, p̃⟩ = j · 2α'(k_0·p)，
      由整性条件 (I) 它是整数（**这一条就是 (I) 的全部用途**）；
    · α(n)（n ≥ 1）局部幂零 —— 最高权模上按 level 分次，任一向量被有限多次湮灭打到 0。
  于是 Theorem 3.6 后半给出：V_(𝔥,L)(U) = ℂ[L] ⊗ U 是 **V-模**，且 U 不可约 ⇒ 它不可约
  （U 的不可约性即 Li–Wang Proposition 3.9 的 M(1,λ,U_1) 情形）。

  第 4 步（逐层识别为本图的塔）。
    ℂ[L] ⊗ U = ⊕_{j ∈ Z} ( e^{jk} ⊗ M(1, p̃) )。
  第 j 层上 h(0) 的本征值是 ⟨h, p̃⟩ + j⟨h, k⟩ = ⟨h, p̃ + jk⟩（e^{jk} 携带动量 jk），
  即该层的动量是 p̃ + j k = (2α')^{1/2}(p + j k_0)。按 worldsheet.momentum-tower-fock-space
  的装法（零模 α^μ_0|_j = (2α')^{1/2}(p + j k_0)^μ、振子部分与层无关），逐层有
    e^{jk} ⊗ M(1, p̃) ↔ F(p + j k_0),   ⊕_{j} ↔ T(p; k_0),
  而 𝒴(e^{nk}, z) 的零模把第 j 层送到第 j+n 层，正是该卡 (1) 的 S_n = e^{i n k_0·x}。

  第 5 步（分类，目标陈述 (3)(iv)）。由 (3.17) 此处
    L° = { λ ∈ 𝔥 : ⟨k, λ⟩ ∈ Z },
  Theorem 3.10 + Proposition 3.11 给出使 𝔲(0) 半单作用的不可约 V-模的完全分类与同构判据。
  **关键读数**：L° 只对 λ 沿 k 的配对提整性要求，**λ 本身不必在格里、⟨λ,λ⟩ 不必是偶整数**
  ⇒ 目标陈述里 p 的横向与纵向分量可**连续**取值。这正面补上了两条 G–N 推导 gaps 第 2 条
  「连续动量 vs 格点动量」那道接缝（那里登记为本项目推断，现在有 (3.17) 这个带编号出处）。
gaps:
  - |
    **★ 扭群代数在秩 1 类光时退化为普通群代数，这一步是本项目的推断。**
    Gebert–Nicolai 刊 p. 585 逐字警告一般情形**必须**用扭群代数 R{Λ}（否则 Jacobi 恒等式的符号不对）。
    本推导第 1 步论证此处 ε ≡ 1 满足 (3.6)–(3.8)（(3.8) 的右端 (−1)^{⟨α,β⟩} 在 ⟨·,·⟩|_L ≡ 0 时恒为 1），
    并与 G–N (2.81) `e^r e^s = (−1)^{r·s} e^s e^r`（秩 1 类光时右端 = 1）、
    Li–Wang Remark 3.4 的显式 ε（秩 1 时恒为 1）两处互洽。
    ⚠ **但没有任何来源把「此特例下扭群代数 = 普通群代数」这句话写出来**
    （literature/extractions/math-sources.md §36.5 末逐字登记为 researcher 的推断）。
    **影响评估**：即使这条推断有误，目标陈述仍成立——Li–Wang 的 (3.5)–(3.8) 只要求**存在**这样的 ε，
    而 ε ≡ 1 的验证是三行代数；受影响的只是「可以把 ℂ_ε[L] 写成 ℂ[L]」这句方便话。
    目标陈述因此把 ℂ[L] 与 ℂ_ε[L] 两种写法都留在 (1) 里。
  - |
    **本推导不涉及塔上的双线性型、伴随或正定性。**
    worldsheet.momentum-tower-fock-space (2)(4) 的层间正交是**约定式定义**，Li–Wang 侧没有任何型；
    本推导的识别只在「向量空间 + 逐层算子 + 移位」这一层做，**刻意不触碰型**。
    ⚠ **Q36（literature/extractions/math-sources.md §38.5、§38.6）**：2026-09-11 的检索
    **没有找到任何关于「带不定 Hermitian 内积的顶点代数」的带编号定理**。
    **无鬼定理回 rigorous 的真瓶颈在那一层**，由 worldsheet.fock-indefinite-form /
    worldsheet.ddf-operators-adjoint / worldsheet.transverse-ddf-fock-gram-matrix 一族承载，不在本卡。
  - |
    **「不是 VOA」的第二个理由（L_0 本征空间无限维）是本项目的观察。**
    有来源的那条是 G–N 刊 p. 583「正定 ⇒ VOA」的逆否；本推导额外注意到此处 L_0 在 e^{jk} 上的本征值
    = ⟨jk, jk⟩/2 = 0（因 L 迷向），故**谱下有界**但每个本征空间含全部 j ∈ Z 而**无限维**，
    违反 G–N 刊 p. 579 的第二条附加条件。**没有来源写出这一句**，故登记在此，
    目标陈述 (N3)(b) 也已标明是本项目观察。
  - |
    **共形向量与 Virasoro 生成元不在本推导内。**
    本推导不断言 V 上有共形向量 ω，也不断言 ω_{n+1} 与本图 Sugawara 型
    worldsheet.virasoro-generators-free-boson 的 L_m 是同一族算子。
    后者目前仍是 worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 里的一条 inferred 边，
    **本轮不解决**（那需要 G–N 写出 Sugawara 显式表达式的那一页，researcher 本轮未读到）。
  - |
    **顶点算子 𝒴(e^{jk}, z) ↔ 物理写法 :e^{i j k_0·X(z)}: 的字典不在本推导内**（目标陈述 (N6)）。
    该字典登记在 worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 的 convention_map 里，
    并在那里标明是本项目推断。
  - |
    **E^-(·, x)、Δ̄(·, x) 在图内无定义卡**（与 math.lattice-vertex-algebra--via-li-wang 的同名 gap 相同）。
    目标陈述照抄 Li–Wang (3.10) 作为记号。这不影响结论的严格性，但图内无法据此做显式计算。
  - |
    **Lean 侧未起步**：Mathlib/Algebra/Vertex/ 只有 VertexOperator 骨架，Locality 仍在 TODO。
    **本推导不得标 formalized。** 注意 worldsheet.momentum-tower-fock-space 自身是 formalized，
    但本推导的结论（「塔是格点顶点代数的模」）远超 Lean 侧现有内容。
notes: |
  【status 定级理由】`status` 是本推导自身论证的严格程度。
  自身论证 = 把一条带编号、带完整证明的数学定理（Li–Wang Theorem 3.6 + Theorem 3.10 + (3.17)）
  实例化到一组具体数据上，验证其假设（三行初等代数：⟨jk, j'k⟩ = 0、ε ≡ 1 满足 (3.6)–(3.8)、
  Condition C_L 三条），再做一次逐项的定义对照（第 4 步）。**没有任何形式操作、渐近或路径积分**，
  故 **rigorous**。
  gaps 里的三条本项目推断（扭群代数退化、L_0 本征空间无限维、Q36）都**不进入**目标陈述所断言的内容：
  第一条即使有误结论不变（见该 gap 的影响评估），第二条只出现在「不断言」清单的括注里且已标明，
  第三条明确被排除在本卡之外。

  【本卡对全图的作用】两条 G–N 推导的桥接边由
  worldsheet.string-cft-is-a-vertex-algebra-v2（effective = open）改挂到本卡（effective = rigorous），
  从而把 worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 与
  worldsheet.ddf-transverse-oscillator-algebra--via-zero-mode-bracket 的 effective 从 open 提到 rigorous。
  **但无鬼定理本身能否回 rigorous 取决于另外两条链**
  （worldsheet.ddf-operators-adjoint 与 worldsheet.transverse-ddf-fock-gram-matrix，
  它们走的是内积/伴随那一层，即 Q36 的瓶颈）——本轮不动它们。

  【不碰的东西】本节点不改 worldsheet.momentum-tower-fock-space、worldsheet.ddf-operators-v5、
  worldsheet.string-cft-is-a-vertex-algebra-v2，也不碰 graph/milestones/。
