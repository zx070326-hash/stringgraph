      **非 inferred**：本推导只引用该卡已写出的条件本身，不引用它的任何 DDF 内容。
    convention_map: |
      α'-无量纲化字典（目标陈述内部已写出，此处复述以便审计）：格点向量 = (2α')^{1/2} × 物理动量，
      于是 ⟨q̃_1, q̃_2⟩ = 2α'(q_1·q_2)，而 Li–Wang 的整性条件 ⟨k, λ⟩ ∈ Z 逐字对应
      本图的 2α'(k_0·p) ∈ Z。**这一步字典与
      worldsheet.ddf-commute-with-virasoro--via-vertex-algebra-primary 里对 G–N 用的是同一个**，
      但那里字典的另一半（ξ(z) ↔ ∂X^i(z)、Res_z ↔ ∮dz/2πi）本卡不需要，因为本卡不谈 DDF 算子。
      G–N 与 Li–Wang 都在 α' = 1/2（格点单位）下工作；一般 α' 的形式仍是本图自己的写法。
