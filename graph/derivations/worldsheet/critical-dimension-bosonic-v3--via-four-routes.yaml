  与 worldsheet.critical-dimension-bosonic-v2--via-four-routes 并存（后者内容未动，
  它指向 v2，不指向本卡的目标）。v2 那条推导本身没有错，只是目标陈述被换代。

  **依赖边未变、来源定位大改**：本推导与 v2 版推导的 depends_on 是同一组 7 条边，
  故图的形状与有效状态不变（physical-argument）。实质变化有两类：
    (1) 目标陈述按第二轮回译审计的六项裁定改写（见 summary）；
