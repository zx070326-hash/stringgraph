        §1.3 (1.3.40) p.23（并撤销「习题 1.3」的说法）、§4.1 level 2 = p.124 + 习题 4.1
        （(4.1.24)–(4.1.28) 不存在）、§4.3 (4.3.9)（不是 (4.3.10)）、
        §3.4 (3.4.23) p.94（且原书写 D = 26，Q6 关闭）、§2.4 (2.4.22) p.48（Q4/E34 关闭）。
  这两类改动都不改变任何依赖边的 inferred 标记：两条「不标 inferred」的公共输入边
