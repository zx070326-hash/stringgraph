  （(2.4.22) 取代了无锚点的 §2.4 末，(2.5.12) 在原书 (3.4.23) 处被显式引用）。

  **【2026-09-11 后续改动：(I) 的边改指 -v2】**按 ms.critical-dimension-bosonic 第三轮
