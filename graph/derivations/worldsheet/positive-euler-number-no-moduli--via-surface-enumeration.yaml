  - 原 gap 第三条里「RP₂ 的 μ = 0 连节点都缺」→ **作废**：已建 worldsheet.rp2-conformal-killing-group。
  - 原 summary「原书只作对偶断言、未附论证」→ **已改正**（见 summary 的订正段）。

  status 仍按 lead 2026-09-11 裁决（docs/STATUS_LEVELS.md「断言 + 骨架」条）定为
  physical-argument：枚举骨架完整、缺口逐条记录，结论在文献中无争议，不属 conjecture。

  **剩余的升级路径**：
  (a) 新建「S₂ / D₂ 上无非零全局全纯二次微分 ⇒ μ = 0」的卡，关闭第 (2) 步的两格；
  (b) 为「拓扑曲面上共形结构唯一」（单值化）登记数学来源并建节点，撤
      worldsheet.tree-level-worldsheet-topologies 那条边的 inferred；
  (c) reviewer 复核 math.positive-euler-surfaces-are-sphere-disk-rp2--via-normal-form-enumeration
      的两行算术，使第 (1) 步升到 rigorous；
  (d) 为 μ 的带边定义补节点。
  (a)+(b)+(c)+(d) 全部完成后，本条可按枚举的完备性重新评估。
