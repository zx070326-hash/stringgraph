  - id: worldsheet.transverse-ddf-fock-gram-matrix
    inferred: false
    note: |
      **DDF 扇区正定**：`StringFormal.NoGhost.ddf_span_pos`（DDFGram.lean；该卡 --via-lean 推导
      summary 第四步登记的那条）——有序域上 0 ≠ d ∈ ddfSpan ⇒ ⟨d, d⟩_T > 0。
      在 (1a) 的证明里给 ⟨d,d⟩ ≥ 0（`(ddf_span_pos …).le`，d = 0 时用 `simp`）；
      在 (1b) 的证明里由 ⟨d,d⟩ = 0 逼出 d = 0（`absurd hdd (ne_of_gt (ddf_span_pos …))`）。
      ⚠ 该卡的 formal.lean_decl 是 `ddf_gram_diagonal`，`ddf_span_pos` 是同一文件里由它推出的
