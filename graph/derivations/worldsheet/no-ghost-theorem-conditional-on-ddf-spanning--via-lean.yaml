  - "**没有 `noGhostEquiv`**（Assembly.lean Gaps 第 2 条）：不构造 ddfSpan ≃ₗ H_phys ⧸ H_null。单射由 `ddf_span_pos` 得，满射逐字 = 前件；同构不比本推导的结论 + 前件多任何信息，故不写。目标卡边界 (c) 同款。"
  - "**假设集非空性未证**（Assembly.lean Gaps 第 3 条）：Witness.lean / WitnessInt.lean 兑现四条几何假设与一个标架，但**没有**任何 (D, k, k_0, Ε) 上 `DDFSpans` 的见证。即本推导目前是一条**空条件命题**可能性未被排除的陈述——不过这与「26 只在前件里」的记账无关。"
  - "**有序域是额外结构**：`[LinearOrder K] [IsStrictOrderedRing K]`。目标卡把它写进设定；在一般交换 Q-代数上 (1a)(2) 的「≥ 0」无意义，(1b) 与第 1 步的范数计算则不需要序（Lean 侧 `towerPairing_self_eq_of_spans` 带 `omit [LinearOrder K] [IsStrictOrderedRing K]`）。"
  - "**curator 未自行跑 `lake build` 与 `check-axioms`**：依据是 noghost-c5 由 lead 合入 main。本分支不含 Lean 改动。"
