summary: |
  机器检查的证明，formal/StringFormal/NoGhost/Assembly.lean §NoGhost（蓝图 §C.5）。
  整个文件是「若 DDFSpans 则 …」的形式；**D = 26 一次不出现**，有序域是唯一的额外结构
  （「正定」需要序）。四步：

  **第 1 步（范数计算，`towerPairing_self_eq_of_spans`）。** 设 Ψ ∈ H_phys。
  由前件 `hspan` 拆 Ψ = d + χ，d ∈ ddfSpan、χ ∈ H_null。d 是物理态
  （`ddfSpan_le_towerPhysSubmodule`），χ 与一切物理态正交，故
  `towerPairing_add_null` 给 ⟨Ψ, Ψ⟩_T = ⟨d, d⟩_T（两个交叉项与 ⟨χ,χ⟩ 都为零）。

  **第 2 步（(1a)，`towerPairing_self_nonneg_of_mem_towerPhys_of_spans`）。**
  ⟨Ψ,Ψ⟩_T = ⟨d,d⟩_T；d = 0 时为 0，否则 `ddf_span_pos` 给 > 0。故 ≥ 0。

  **第 3 步（(1b)，`towerPairing_self_eq_zero_iff_mem_towerNullSubmodule_of_spans`）。**
  ⇐：零态自身范数为零（`towerPairing_self_eq_zero_of_mem_towerNullSubmodule`）。
  ⇒：⟨Ψ,Ψ⟩ = 0 ⇒ ⟨d,d⟩ = 0（第 1 步）⇒ d = 0（否则 `ddf_span_pos` 给 > 0，矛盾）⇒ Ψ = χ ∈ H_null。

  **第 4 步（(2)，`no_ghost_of_spans`）。** 取商中任意类 x，用 `towerPhysMk_surjective` 取代表元 Ψ，
  `towerQuotientPairing_mk` 把 ⟨x,x⟩_quot 化为 ⟨Ψ,Ψ⟩_T；(1a) 给 ≥ 0；若 = 0 则由 (1b) Ψ ∈ H_null，
  `mem_towerNullInPhys` + `Submodule.Quotient.mk_eq_zero` 给 x = 0。∎

  【为什么标 formalized（own）而 effective 会是 open】
  目标声明无 sorry；五条依赖里四条 effective = formalized，
  **一条（前件 worldsheet.ddf-spanning-hypothesis）effective = open**。
  按 effective = min 规则本推导与目标卡的有效状态为 open。这是条件命题的正确记账，
  见目标卡 notes 与上面前件那条边的 note。
