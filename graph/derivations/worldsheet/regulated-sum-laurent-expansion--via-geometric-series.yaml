id: worldsheet.regulated-sum-laurent-expansion--via-geometric-series
target: worldsheet.regulated-sum-laurent-expansion
kind: proof
status: rigorous
depends_on: []
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.32)（p.22；指数截断求和，发散项 1/(εa)^2，有限部分 -1/12）"
    note: |
      抽取记录 polchinski-1998-v1#E15，[已核实]。本推导给出的是该展开的完整初等证明，
      不依赖文献的严格性；文献只提供该式在书中的位置。
summary: |
  令 x = e^{-u} ∈ (0,1)。由几何级数 Σ_{n≥0} x^n = 1/(1-x) 逐项求导（在 |x| < 1 内一致收敛，
  求导合法）得 Σ_{n≥1} n x^n = x/(1-x)^2。代回 x = e^{-u}：
    e^{-u}/(1-e^{-u})^2 = 1/(e^{u/2} - e^{-u/2})^2 = 1/(4 sinh^2(u/2)).
  用 2 sinh(u/2) = u (1 + u^2/24 + O(u^4)) 得
    4 sinh^2(u/2) = u^2 (1 + u^2/12 + O(u^4)),
  故 1/(4 sinh^2(u/2)) = u^{-2}(1 - u^2/12 + O(u^4)) = u^{-2} - 1/12 + O(u^2)。
  奇次项为零因为 1/(4 sinh^2(u/2)) 是 u 的偶函数。
gaps:
  - "无。这是初等实分析，逐步可验证。存在的只是「它与物理零点能的关系」这一层，那不属本节点，见 worldsheet.zeta-regularized-sum-of-integers。"
  - "两个 -1/12（指数截断的常数项与 ζ(-1)）相等不是巧合而是 Abel/ζ 正规化一致性的一个实例；本推导只并列陈述二者，未证明一般的正规化方案无关性。"
