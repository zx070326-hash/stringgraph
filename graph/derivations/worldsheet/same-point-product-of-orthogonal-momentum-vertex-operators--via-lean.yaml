summary: |
  机器检查的证明。三块内容，每一块都在目标卡里有对应的断言编号。

  **第一块（目标 (1)，局部有限性；这是本推导的实质部分）。**
  下端是现成的：`vertexOsc_apply_eq_zero_of_levelBound_lt` 直接给
  `levelBound P + K < 0 ⟹ V^{(b′)}_K P = 0`（`_of_lt`）。
  上端是新内容，分两步：
  · `Fock.vertexAnn_mem_levelSubmodule`：湮灭半 Ψ^b_M 把 level N 的分量送到 level N − M，
    对单项式按 level **强归纳**，用 `vertexAnn_mul_X` 逐个剥 X_v；
    推论 `vertexAnn_apply_eq_zero_of_level`（M > N 时为零）与
    **`levelBound_vertexAnn_le`：levelBound (Ψ^b_M P) ≤ levelBound P，且界对 M 一致**。
  · 有了它，`vertexOsc_creaExp_mul_of_dotVec_zero`（b·b′ = 0）把 V^{(b′)}_K P 里的相干态因子
    Φ^{b′}_{K+M} 提到 V^{(b)}_{L−K} 的**左边**，剩下的是 Ψ^{b′}_M P，其 level 界与 K 无关；
    于是 `vertexOsc_vertexOsc_apply_eq_zero_of_gt` 给出
    「levelBound P + (L − K) < 0 ⟹ V^{(b)}_{L−K} V^{(b′)}_K P = 0，**与 K 无关**」。
  两端合起来就是窗口 `vertexProdIdx L P = Finset.Icc (-(levelBound P)) (L + levelBound P)`
  （`vertexOsc_vertexOsc_apply_eq_zero_of_notMem_vertexProdIdx`）。

  **第二块（目标 (2) 的真空值）。** `vertexProduct_apply_one`：在窗口 Icc 0 L 上逐项用
  `vertexOsc_apply_creaExp_of_dotVec_zero`（V^{(b)}_J Φ^{b′}_K = Φ^b_J Φ^{b′}_K），
  得到卷积 Σ_{p+q=L} Φ^b_p Φ^{b′}_q，再由 **`creaExpPair_eq_creaExp_add`** 等于 Φ^{b+b′}_L
  = V^{(b+b′)}_L(1)。⚠ 那条加法公式本身**不需要** b·b′ = 0：它是欧拉递推的唯一性
  （`creaExpPair` 的卷积满足**同一条** b+b′ 的欧拉递推，再在 ℚ-代数里除以 j）。

  **第三块（目标 (2) 的组装，刚性）。** `Fock.vertexProduct` 用 `lsumLocFin` 把和装成算子
  （局部有限性是定义的参数，故 `hdot` 出现在定义里）。`vertexProduct_X_mul` 证明 W_L 满足
  **b + b′ 的产生模态递推**：两个 V 各移自己的洛朗指标，把第二个修正项重标 K ↦ K+n 后
  （私有引理 `sum_add_right_eq_sum`）两项并成 W_{L+n}，系数相加正好是 (b + b′)^μ。
  与第二块的真空值一起喂给 `Fock.vertexOsc_unique`，即得 W_L = V^{(b+b′)}_L。

  **假设核对**：全程只有 `hdot : dotVec η b' b = 0`。**没有** `hη : η_μ² = 1`
  （文件里没有任何把时空指标对度规缩并两次的地方），**没有** DDF 归一化 `dotVec η b a = 1`
  （文件头 "Mathematical remarks" 第 3 条逐字：「Nothing here uses that hypothesis.」），
  没有对 L 的限制，没有 b ≠ b′，没有 b、b′ 类光。
gaps:
  - |
    (i) **「b·b′ ≠ 0 时公式为假」未被证明**。目标【不断言】(a)：那只是 Lean 文件头
    "Mathematical remarks" 第 2 条的数学注记（逐字引在目标 sources 的 note 里），**不是定理**；
    Lean 侧甚至没有定义单值因子 (1 − w/z)^{−b·b′} 所需的形式级数。
    ⇒ 「正交性是必要的」这句话目前的地位是 **formalizer 的断言 + 一条可核对的机制说明**
    （局部有限性确实在 b·b′ ≠ 0 时失效，因为提相干态因子那一步用掉了 hdot），
    不是机器检查的否定结论。reviewer 若要收紧，应要求形式化一个反例
    （例如在 R = ℚ[t]、b·b′ = t 上算出某个使 K-求和无界的向量）。
  - |
    (ii) **"同点"是代数意义的，不是解析意义的**。目标【不断言】(d)：本推导里"同点乘积"
    只指洛朗指标相加 J + K = L，没有两个插入点 z、w 与 z → w 的极限，
    也没有任何 OPE/径向排序。把本卡读成"OPE 的领头项"需要
    worldsheet.ope-commutator-dictionary 一类的字典，本推导不提供。
  - |
    (iii) **产生半的加法公式在图上没有自己的卡**，本推导对
    worldsheet.orthogonal-momentum-vertex-operators-commute 的那条边因此标 inferred
    （指向的是承载那个 Lean 文件的卡，不是它的命题）。已在 depends_on 里提请 lead 拆卡。
  - |
    (iv) **加权和 (5b) 不在本推导内**，故本推导**不**支持
    worldsheet.ddf-transverse-oscillator-algebra-v2 的任何部分，只是其第 (5a) 块输入。
    (5b) 见 worldsheet.tower-vertex-weighted-mode-sum；把两者接到 A^ε_n 上的
    双重局部有限和 Leibniz 组装**仍未做**（formal/TODO.md `ddf-operators` 的「[A,A] 的整条链」段）。
  - |
    (v) **一般交换 ℚ-代数，无实结构、无幺正性、无解析结构、无零模**；η_μ 是 R 中任意一族元素。
    ℚ-代数是必需的：真空值那一步要在欧拉递推里除以 j。
