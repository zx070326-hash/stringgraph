  【本推导与姊妹推导 orthogonal-momentum-vertex-operators-commute--via-lean 的分工】
  两者都在 b·b′ = 0 下工作、都用同一条刚性引理收尾，但**用掉正交性的地方不同**：
  姊妹推导只需要"平移原样固定另一动量的相干态系数"（`vertexSub_creaExp_of_dotVec_zero`，
  全文件唯一一处），本推导额外需要把相干态因子**提到左边**并配上湮灭半的一致 level 界。
  后者是 (5a) 比 (5) 难的全部原因，也是本推导 gaps (i) 里"机制说明"的内容。
