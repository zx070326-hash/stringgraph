id: worldsheet.critical-dimension-weyl-anomaly--via-anomaly-cancellation
target: worldsheet.critical-dimension-weyl-anomaly
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.weyl-anomaly-trace
  - id: worldsheet.weyl-anomaly-central-charge-constant
  - id: worldsheet.bc-ghost-central-charge
  - id: worldsheet.faddeev-popov-ghost-action
  - id: worldsheet.free-boson-central-charge-d
  - id: worldsheet.conformal-gauge-fixing
sources:
  - ref: polchinski-1998-v1
    loc: "§3.4 结尾，p.95–96，式号约在 (3.4.24)–(3.4.32) 区间（**未核实**，见 Q6）"
    note: |
      按抽取记录 E53/Q6 的明确要求不写死式号。已知硬约束：§3.4 = p.90–96，
      (3.4.31) 在 p.96–97。
  - ref: schrans-2020
    loc: "§3.26 \"Theories with a Quantum Anomaly\""
    note: |
      对「Weyl 不变性是**局域**的规范冗余，有反常即规范对称性被破坏，
      后果涉及幺正性」这一论点的复述。逐字：「the scale invariance is local; it is a gauge
      redundancy and if there is an anomaly the result is that the gauge symmetry is broken,
      with implications for e.g. unitarity」——**这是 schrans-2020 的措辞，不是 Polchinski 的**
      （抽取记录 E53 明确标注了这一点）。
summary: |
  (1) Weyl 是规范冗余：Polyakov 路径积分对 diff × Weyl 取商，规范固定用掉了 Weyl
      （worldsheet.conformal-gauge-fixing）。若 Weyl 在量子层面有反常，规范固定不自洽。
  (2) 反常的大小正比于中心荷（worldsheet.weyl-anomaly-trace：⟨T^a_a⟩ = -(c/12) R），
      且中心荷是常数（worldsheet.weyl-anomaly-central-charge-constant）。
  (3) 规范固定引入的 Faddeev–Popov 鬼场是 λ = 2 的 bc 系统
      （worldsheet.faddeev-popov-ghost-action），贡献 c^g = -26
      （worldsheet.bc-ghost-central-charge）。
  (4) 总反常正比于 c^{tot} = c^m + c^g；要求它为零得 c^m = 26。
  (5) 若物质部门是 D 个平坦时空自由标量，c^m = D（worldsheet.free-boson-central-charge-d），
      故 D = 26。
gaps:
  - "**每一步都是物理论证**：路径积分测度的 Weyl 变分（(2)）、Faddeev–Popov 手续（(3)）、
     以及 c^m = D 与 c^g = -26 各自的 OPE 计算，全部封顶在 physical-argument。
     本推导不引入新的严格性，只做合成。"
  - "「有反常 ⇒ 理论不一致」这一步在来源中是物理论断而非定理：书中没有证明
     『c^{tot} ≠ 0 的玻色弦一定破坏幺正性』，只论证了规范固定的自洽性要求。
     注意非临界弦（Liouville）的存在说明 c^{tot} ≠ 0 并非绝对不可处理，
     而是需要把 Liouville 模式当作动力学自由度——那超出本节点的范围。"
  - "**来源定位是本批最弱的一处**：结论的公式号完全未核实，且未确认 Polchinski 写的是
     『c^m = 26』还是直接写『D = 26』（抽取记录 Q6 明确要求人工核对）。
     本节点按更一般的形式（c^m = 26，特例 D = 26）陈述，若原书只写 D = 26，
     则本节点的陈述强于来源，须相应修订。"
  - "本推导只定 D（或 c^m），不定截距 a = 1；与 worldsheet.critical-dimension-brst 相同。"
author: curator-polchinski-ch2-3
created: "2026-09-10"
