id: worldsheet.modular-fundamental-domain--via-modular-reduction
target: worldsheet.modular-fundamental-domain
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.modular-group-psl2z
    note: 提供作用在 τ 上的群与 Im(γ·τ) = Im τ/|cτ+d|²。
  - id: worldsheet.modular-group-generated-by-s-and-t-v2
    note: |
      归约算法只用 S 与 T 两个生成元，故需要「S、T 生成 PSL(2,Z)」才能保证归约覆盖整个群轨道。
      ⚠ **2026-09-11 两次更新**：(i) 该上游节点现已 formalized
      （Mathlib `SpecialLinearGroup.SL2Z_generators` 经
      `StringFormal.ModularGroupGen.psl_closure_S_T`），**不再只有 physical-argument 级论证**
      ——本条备注的原文「该节点自身只有 physical-argument 级论证」已过时；
      (ii) 该卡同日拆成「生成性」与「两条关系」两张，本边改指生成性那一张（v2）。
      本推导只用生成性（关系 S² = (ST)³ = 1 在归约算法里用不到），故不加关系卡的边。
      ⚠ 本推导自身仍是 physical-argument：瓶颈不在这条边，而在 summary 的终止性论证
      与边界认同（见 gaps）。
  - id: worldsheet.torus-modular-equivalence
    note: |
      提供「同一 PSL(2,Z) 轨道 ⇒ 同一环面」，使 F₀ 中的代表元确实代表一个环面等价类。
sources:
  - ref: polchinski-1998-v1
    loc: "§5.1, eq. (5.1.15), p.148"
    note: |
      抽取记录 #E72，L1（schrans-2020 笔记 p.248）。
summary: |
  标准归约：用 T 的幂把 Re τ 平移进 [−½, ½]；若此时 |τ| < 1，用 S 把 τ 换成 −1/τ，
  由 Im(S·τ) = Im τ/|τ|² 可知 Im τ 严格增大；重复。因为 Im τ 在每步 S 之后严格增大，
  而对固定的 τ 轨道 Im 的取值集合在正数区间上无聚点（|cτ+d|² 取到的值离散），
  过程有限步终止，终点落在 F₀ 内。
gaps:
  - |
    **边界的处理在原书中不完整**。伴读者 schrans-2020 逐字写「we have been quite cavalier
    about the boundaries of F₀」并把读者引向 Zwiebach 2nd ed. §26.6。本节点陈述里写出的两条
    边界认同（Re τ = ±½ 由 T、|τ| = 1 的两半由 S）是**结论**，来源里没有证明它们穷尽了
    F₀ 内部的重复。
  - |
    **终止性论证是 curator 补的**：抽取记录 E72 只记录了 F₀ 的形状与「每个环面等价于唯一一个
    落在 F₀ 的 τ」这个断言，没有记录归约算法或终止性论证。上面 summary 里
    「Im τ 严格增大且过程有限步终止」这段是标准推理，**不是来源逐字**，其中
    「|cτ+d|² 取值离散」一步本身也未在本图中论证。
  - |
    **依赖链拖低（2026-09-11 已解除，本条改为记账）**：原文「本推导用到
    worldsheet.modular-group-generated-by-s-and-t，而那条的生成性在本书中只是断言」。
    现状：生成性已形式化（`StringFormal.ModularGroupGen.psl_closure_S_T`，实质内容是 Mathlib 的
    `SpecialLinearGroup.SL2Z_generators`），上游卡 effective = formalized，本边改指
    worldsheet.modular-group-generated-by-s-and-t-v2。
    ⇒ **本推导的瓶颈已不在这条边**，而在本节 gaps 第 1、2 条（边界认同、终止性论证是 curator 补的）。
    ⚠ 「原书对生成性零证明」这件文献事实**没变**。
  - |
    **来源强度（2026-09-11 更新，本条原写「(5.1.15) 只经 schrans-2020 核对（对笔记 L1，对原书 L3）」，已过时）**：
    式号、页码、内容三者现已经 Cambridge Books Online 原书页图
    （ch.5 PDF p.4 = 印刷 p.148）**L1 确认无误**
    （literature/extractions/polchinski-1998-v1-ch7.md §0.1 步骤 6 / #E24 备注 2）。
    ⇒ **来源强度不再是本推导的缺口**。真正的缺口是**原书自己不给证明**：p.148 逐字
    「Using the modular transformations (5.1.13), **it can be shown that** every τ is equivalent
    to exactly one point in the region F₀ … except on the boundaries which are identified as shown
    in the figure.」——「it can be shown」，无证明、无引文。
    本推导 summary 里的归约过程因此是**本图自己补的标准推理**，不是来源逐字（与 gaps 第一条同源）。
    ⚠ 另注（不影响本推导，但引用时要当心）：原书 §7.3 (7.3.14)（p.219）用的是**开区域**
    |τ| > 1、|τ₁| < ½、τ₂ > 0，与 (5.1.15) 的闭区域差一层零测度边界，原书未说明缘由
    （两处都 L1；见目标陈述 notes 末段）。
notes: |
  升级路径：登记 Zwiebach 2nd ed.（或 Serre, *A Course in Arithmetic*, Ch. VII, Thm 1）
  到 literature/sources.bib，另起一条 `--via-<数学来源>` 的 rigorous 推导。
  本条保留为「Polchinski 书内路线」的记账。
