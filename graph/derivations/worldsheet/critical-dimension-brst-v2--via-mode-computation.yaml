  - "**没有任何数学文献印出这条判据。** 已逐一核实并排除：fgz-1986（Prop 1.2 是一般分次李代数的 d²=0，不含 26；26 只在 Prop 2.1(i) 的鬼场一侧）、lian-zuckerman-1991（Prop 1.11(i) 的 d²=0 无条件成立且不含 26；26 只在 Prop 3.3(iii) 且是单向 if）、lian-zuckerman-1989（是 RNS 超弦）。kato-ogawa-1983 正文未获取（ScienceDirect 403）。⇒ **本推导将来的 rigorous 会完全依赖 reviewer 复算**，不依赖任何印出的证明；这也是它与 --via-fgz-ghost-representation（依据是逐字核实的编号命题 + PNAS 体裁统一口径）在档位依据上的根本差别。"
  - "⟸ 与 ⟹ 两个方向的文献可追溯性不对称（⟹ 有 KO 摘要 L2 + IMNU 1986 的 L1 转述；⟸ 只有 Polchinski 的形式计算 + brst-nilpotent-at-c26）。这一不对称与本推导的状态无关（本推导的两个方向都靠复算），但下游引用时须知。"
  - "本推导只定出 c^m = 26，不定 D = 26（须再加 worldsheet.free-boson-central-charge-d，formalized），也不定截距 a。"
  - "无穷模式和的重排合法性由受限模条件保证，这一点在任何来源里都没有被陈述；它是本图（陈述卡）的增补。"
notes: |
  reviewer-verified: reviewer-brst-nilpotency, 2026-09-12
  复核了什么（两句）：(1) 从 worldsheet.brst-quantization-v2 的模式定义（{b_m,c_n} = δ、L^g_n、Q_B 的三项、
  a^g = −1、受限模）与 worldsheet.virasoro-algebra-v2 的中心项独立重算 {Q_B, Q_B}，得系数多项式
  f(m) = ((c^m − 26)/12)(m³ − m) − 2(1 + a^g) m，a^g = −1 时即本卡 summary 与目标陈述写的公式；
  (2) gaps 第 1 条点名的三处——(m³ − m) 系数、三次鬼场项与物质项交叉相消（逐项精确相消，依赖三次项
  在 m → −m 改写下的那个负号）、a^g = −1 被吸收（等价于把三次项改用 SL(2,C) 正规序写）——全部通过。
  另：鬼场一侧的 −26 在复算中是**算出来的**（有限窗求和 Σ_{p=−1−q}^{−2}(p−q)(p+2q) = −(13/6)(q³−q)），
  不是从依赖边搬来的，故那条边得到一条独立佐证。交叉验证两条：Polchinski (4.3.10) 的 j_B j_B 单极点
  换成模式后与本式逐项相同（含整体符号与 1/12 归一化）；显式 Fock 模（D = 1,2,3 个自由玻色子 + 鬼场
  Fock 模，精确有理数）上的机器复算对 a^g ∈ {−2,−1,−1/2,0,1} 逐个吻合。
  逐步计算（每一次正规序重排都写出）见 docs/reviews/brst-nilpotency-recompute-2026-09-12.md。

  ⚠ **复核附带发现，不影响本推导结论，交 lead/curator**：两张前提卡的正规序规定互不一致且都没有定义。
  worldsheet.brst-quantization-v2 写「L_n = L^m_n + L^g_n + a^g δ_{n,0} 在 (m³−m) 形式下中心荷为 c^m + c^g」，
  要求其 L^g 取**能级序**；worldsheet.bc-ghost-central-charge-lambda-two 写「[L^g_m, L^g_n] 的中心项
  = (−26/12) m(m²−1)」，要求其 L^g 取 **SL(2,C) 序**。两者相差 δ_{m,0}（SL(2,C) 序下 L^g_0|↓⟩ = −|↓⟩，
  能级序下为 0），逐字拼接两卡公式会把 m 线性项算错 2m。本推导不受影响（−26 自算、m 线性项已独立核对）。
  建议：定义卡换代时把 `: :` 的规定写进 statement，或在 conv. 层加一条鬼场正规序约定。

  【已关闭的 TODO，历史原文照录】 reviewer-verified: **TODO —— 本推导升 rigorous 的全部依据。** 请 reviewer 独立重算
  {Q_B, Q_B} 的模式和（尤其是 (m³ − m) 系数与 a^g = −1 被吸收进 L_0 的那一步），
  并在此处按格式留 `reviewer-verified: <agent>, <date>`。缺此记录不得标 rigorous
  （docs/STATUS_LEVELS.md 等级 4 的例外条款）。

  **本卡按草案 §C 的条件性要求建成 physical-argument。** 草案原文逐字：
  「⚠ **未经 reviewer 独立复算，不得标 rigorous。** 先以 `status: physical-argument` 建卡、
  复算通过后再由 lead 批准升级」。ROADMAP R3 同样写「**未复算不得标 rigorous**，先建成
  physical-argument」。先例是 worldsheet.free-boson-central-charge-d--via-mode-algebra
  （同样靠 reviewer 复核 + 编号来源升 rigorous）。
  ⚠ **后果**：worldsheet.critical-dimension-brst-v2 的 effective 现在仍是 physical-argument，
  尚未变成 R3「(III) 整条从瓶颈树消失」所预期的 rigorous；里程碑
  ms.critical-dimension-brst-nilpotency 因此以 `audit.status: draft` 建卡等待。
  ⚠ **`kind` 也随之取 physical-argument（草案写的是 `kind: proof`）**：`validate` 强制
  「kind: proof requires status formalized or rigorous」。复算通过、lead 批准升级时，
  **kind 与 status 必须一起改**（physical-argument → proof / rigorous）。

