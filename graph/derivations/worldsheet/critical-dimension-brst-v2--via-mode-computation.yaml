  上面两段（草案 §C 的条件性建卡、⚠ 后果）写于升级之前，保留作历史：其中「effective 现在仍是
  physical-argument」一句自本次升级起过期——worldsheet.critical-dimension-brst-v2 的 effective 现为
  rigorous（工具取最强推导，旧推导 --via-nilpotency 仍为 physical-argument 且不动）。
  里程碑 ms.critical-dimension-brst-nilpotency 的 audit.status 仍是 draft：按 docs/STATUS_LEVELS.md
