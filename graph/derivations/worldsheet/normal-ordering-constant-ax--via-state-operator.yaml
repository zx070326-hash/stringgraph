depends_on:
  - id: worldsheet.state-operator-isomorphism
  - id: worldsheet.virasoro-generators-free-boson
  - id: worldsheet.conformal-normal-ordering-v2
    note: |
      **换代（curator 2026-09-11）**：原为 worldsheet.conformal-normal-ordering（v1）。
      v1 的 statement 首句限定「对自由标量理论」，v2 把设定放宽到任意自由场并写出费米换序符号；
      X 部门逐字退化为 v1，**本推导的内容与有效状态均不变**。
  - id: worldsheet.energy-momentum-laurent-modes
  - id: worldsheet.energy-momentum-tensor-free-scalar
    note: |
      两种正规序都是对**同一个** T(z) = -(1/α') :∂X^μ ∂X_μ: 的 Laurent 模而言的；
      没有自由标量能动张量的具体表达式，「L_0 的两种写法只差一个 c-数」无从说起。
  - id: worldsheet.open-string-doubling-trick
    inferred: true
    note: |
      **为什么需要这条边**：a^X = 0 的论证发生在**无边界的平面**（径向量子化，
      worldsheet.state-operator-isomorphism；单位算子 ↔ 原点处的基态）。但本推导要定的
      a^X 是**开弦** L_0 的两种正规序之差：所依赖的
      worldsheet.virasoro-generators-free-boson 的物理来源正是 Polchinski §2.7 (2.7.25)/(2.7.27)
      的**开弦** L_m 与 α_0 = (2α')^{1/2} p（抽取记录 #E41），而开弦世界面是带边的（上半平面）。
      把平面 CFT 上「围道 = 整圆」的 L_m 与开弦上「围道 = 半圆」的 L_m 认同，用的正是
      doubling trick（T̄ 是 T 的镜像解析延拓，半圆补成整圆，只剩一族 {L_m}）。
      没有这一步，「单位算子对应的态被所有 α_{n>0} 湮灭且 L_0 本征值为 0」这一平面结论
      搬不到开弦的 Fock 空间上。
      **标 inferred 的理由**：本推导来源 loc（§2.7 (2.7.7)/(2.7.9)/(2.7.11)）处读不到对 §2.6 (2.6.25)
      的回指——抽取记录 #E42 逐条列出「文献列出的依赖」是 E38、E43（态-算子同构），
      **不含** E40（§2.6，doubling trick 所在条目）；相邻的 #E41（开弦 L_m）才列了 E40。
      原书正文在付费墙后（抽取记录 §0），本图无法核实 §2.7 原地是否有回指，故照实标 inferred。
sources:
  - ref: polchinski-1998-v1
    loc: "§2.9「Zero-point energies」小节，p.72–73（态-算子映射定正规序常数）+ exercises 2.13, 2.14；另 §2.7 p.60 (2.7.11)/(2.7.12) 是**另一条**路线（两种正规序的关系），原书逐字 \"giving a second derivation of a^X = 0\""
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——⚠ **本推导的 loc 实质改指**】

      旧 loc 写 §2.7 (2.7.7)/(2.7.9)/(2.7.11)，并把它当成态-算子路线的出处。**这是错的**：
      (2.7.8)/(2.7.9) 走的是 **Virasoro 代数**路线（原书 p.59 逐字 "The simplest uses the
      Virasoro algebra"），本图已为它新建 --via-virasoro-algebra。

      态-算子路线在原书里是**第三条**，出处有两个：
        (a) p.62 逐字：「The constant can also be obtained by working out the relation between
            `: :` and `° °` for the CFT (**exercises 2.13, 2.14**).」
        (b) p.72–73 §2.9 的「Zero-point energies」小节，原书 p.73 逐字自陈：
            「We have now given **three honest ways** of calculating normal ordering constants:
             from the Virasoro algebra as in eq. (2.7.8), by relating the two forms of normal
             ordering as in eq. (2.7.11), and **from the state–operator mapping above**.」
      即本推导对应第三条，且其中一半（(a)）在原书里是**习题**而非正文推导。
      见 literature/extractions/polchinski-1998-v1.md §12.1（E42/E43）与 §12.4（E15）。
  - ref: polchinski-1998-v1
    loc: "§2.7, eq. (2.7.7)（L_0 = α'p²/4 + Σ(α_{−n}·α_n) + a^X，本推导要定的就是这个 a^X）、(2.7.9)（a^X = 0），p.59"
    note: |
      这两式只提供「a^X 是什么」与「答案是 0」，**不提供本推导的论证**
      （论证在上面那条 loc）。分列两条来源即为区分二者。
summary: |
  两种正规序都把 L_0 写成同一个双线性式加一个常数，故差是 c-数 a^X，可以在任一个态上读出。
  取单位算子 1：按 worldsheet.state-operator-isomorphism，它对应的态是基态 |0⟩，
  且由共形不变性 L_0 |0⟩ = h(1) |0⟩ = 0（单位算子的共形权为 0）。
  另一方面产生-湮灭正规序的 L_0 = (1/2)α_0·α_0 + Σ_{n≥1}α_{-n}·α_n 在 |0; k=0⟩ 上取值 0。
  两者相减得 a^X = 0。
  与 §1.3 的 zeta 正规化路线（Σ_{n≥1} n → -1/12，给出光锥正规序常数 A = -(D-2)/24）
  相容：那里的 -(D-2)/24 是横向振子在**光锥规范**下的零点能，本节点的 a^X 是
  协变 X 部门共形正规序与产生-湮灭正规序之差，两者是不同的量，各自为零/非零并不矛盾。
gaps:
  - "整条论证以 worldsheet.state-operator-isomorphism 为前提，而该同构在来源中是路径积分
     构造而非定理（见其 --via-radial-quantization 的 gaps）。故本推导封顶在 physical-argument。"
  - "「单位算子的共形权为 0」在来源中是定义性的（1 与 T 的 OPE 无奇异项），未单列节点。"
  - "本推导只覆盖 X 部门。鬼场的对应常数是 a^g = -1（worldsheet.bc-ghost-normal-ordering-constant）；
     抽取记录 §1.1 / E43 中的 a^g = 0 已由 reviewer-ch23（2026-09-10）裁定为误记，
     并于 2026-09-11 由原书页图四处逐字确认为 −1。"
  - "**本推导对应原书三条路线中的第三条，而第三条在原书里有一半是习题**（p.62：
     「The constant can also be obtained ... (exercises 2.13, 2.14)」）。原书正文实际走的是
     Virasoro 代数路线 (2.7.8)，见 worldsheet.normal-ordering-constant-ax--via-virasoro-algebra。
     本推导保留的价值在于它是一条**独立**路线（不用 (2.6.22) 的 SL(2,R) 子代数），
     但它的认识论代价是必须假定 worldsheet.state-operator-isomorphism。"
  - "新增的 worldsheet.open-string-doubling-trick 边限定在**纯 Neumann** 边界条件
     （见该节点 notes 的「与 D 膜的关系」）。若某些方向取 Dirichlet，本推导的结论 a^X = 0
     是否逐字不变，本图未验证。"
