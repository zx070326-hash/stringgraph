id: worldsheet.leading-regge-trajectory--via-spin-counting
target: worldsheet.leading-regge-trajectory
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.open-string-mass-shell
  - id: worldsheet.transverse-oscillator-commutators
  - id: worldsheet.open-string-intercept
    note: |
      用 a = 1 把 N = α'm^2 + a 写成 α'm^2 + 1。抽取记录 #E19 明确记本条
      「用到 D = 26 下的 α'm^2 = N - 1」，故这条边有来源支撑。
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3, eq. (1.3.43)（p.24；领头 Regge 轨迹；已核实）"
    note: 抽取记录 polchinski-1998-v1#E19；Schrans §1.13 给出推导 S^{23} ≤ N。
summary: |
  能级 N 的态由 α^i_{-n} 的乘积生成，且 Σ n（各振子的模数之和）= N。
  转动生成元 J^{ij} = -i Σ_{n≥1}(1/n)(α^i_{-n}α^j_n - α^j_{-n}α^i_n) 在单个 α^i_{-n}
  上给出的最大自旋贡献是 1（每个振子最多贡献一个矢量指标），
  而模数越大的振子「花掉」的能级越多。因此在给定 N 下，
  自旋最大的态是把能级全部用在 n = 1 的振子上：N 个 α^i_{-1} 的对称无迹组合，自旋 S = N。
  故 S ≤ N，配合 α'm^2 = N - a 与 a = 1 得 S ≤ α'm^2 + 1。
gaps:
  - "自旋上界的论证按「每个 α^i_{-1} 贡献一个矢量指标」的计数进行，属标准表示论计数；文献（Schrans）只对具体生成元 S^{23} 演示，未给一般的最高权论证。"
  - "有效状态受依赖拖累：α'm^2 = N - a 与 a = 1 都不高于 physical-argument。"
  - "只对开弦。闭弦的领头轨迹是 S ≤ α'm^2/2 + 2（左右各一份），不在本节点。"
author: curator-polchinski-ch1
created: "2026-09-10"
