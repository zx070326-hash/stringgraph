id: worldsheet.ope-commutator-dictionary--via-locality-theorem
target: worldsheet.ope-commutator-dictionary
kind: proof
status: rigorous
depends_on:
  - id: math.locality-ope-equivalences
    note: |
      Schottenloher Theorem 10.10 第 4 条（物理写法的 OPE，奇异部分 Σ_j C^j(w)/(z−w)^{j+1}）⟺ 第 5 条
      （模式对易子 [A_(m), B_(n)] = Σ_j (m choose j) C^j_(m+n−j)）就是目标节点「OPE 的极点结构 ⟺ 模的对易关系」
      在形式分布层面的逐字对应；p.179 作者本人把第 4 条译成物理记号并说明「|z| > |w|」只是选 i_{z,w}。
  - id: math.formal-distribution-locality
    note: |
      Theorem 10.10 的前提（第 1 条）；也是把弦论的场当作 End(V)[[z^{±1}]] 中的形式分布并谈论其局域性所需的定义。
  - id: worldsheet.string-cft-is-a-vertex-algebra
    note: |
      把 Theorem 10.10 用到弦论上，必须先知道 A = T、∂X、b、c 等场两两满足形式局域性——这正是该节点的 (i)。
      **该节点目前无推导（open）**，因此本推导的有效状态被压到 open。这是刻意的：图上由此显示
      「严格路线存在，卡在弦 CFT 是否顶点代数」。
sources:
  - ref: schottenloher-2008
    loc: "Ch. 10, Theorem 10.10 (第 4 条 ⟺ 第 5 条), p. 178；p. 179 物理记号翻译段（A(z)B(w) ∼ Σ_{j=0}^{N−1} C^j(w)/(z−w)^{j+1}，「with the implicit assumption of |z| > |w| in order to justify 1/(z−w)^{j+1} = i_{z,w} 1/(z−w)^{j+1}」）；(10.2) p. 180：T(z)T(w) ∼ (c/2)/(z−w)⁴ + 2T(w)/(z−w)² + ∂_w T(w)/(z−w) 给出 Virasoro 关系的例子"
    note: |
      **L1（researcher 2026-09-11，math-sources.md §11.3–§11.4）**。注意 p.180 正文两处「Theorem 10.5」「Lemma 10.5」
      几乎肯定应为 Theorem 10.10（Q12），本推导按 10.10 引用。
  - ref: gui-2023-lectures
    loc: "2026-07-15 版, §7.7 p. 73–74：从复解析局域性经 OPE 推出 Lie 括号版（箭头图 Complex analytic –7.11→ OPE –7.12→ Lie algebraic），逐字「in the same way as deriving the algebraic Jacobi identity from the complex analytic one using residue theorem」"
    note: |
      只用来说明「围道/留数路线」在数学侧也存在且严格，对应目标节点的围道写法；本推导的主线走形式侧（Schottenloher），
      不依赖 Gui 的解析前提。「三版等价」在 Gui 书中没有编号定理，故 loc 只写小节。
summary: |
  设弦论世界面 CFT 的态空间 V 与全纯场集合 E 满足 worldsheet.string-cft-is-a-vertex-algebra 的 (i)：
  E 中任意 A(z), B(z) 作为 End(V)[[z^{±1}]] 中的形式分布互为局域（费米型取反对易子），局域阶 N。
  (1) 记号换算：物理侧权 h_A 的场按 A(z) = Σ_m A_m z^{-m-h_A}（模 A_m = ∮ z^{m+h_A-1} A(z) dz/2πi）展开，
      形式分布侧按 A(z) = Σ_n A_{(n)} z^{-n-1} 展开；二者只是模指标的重标 A_{(n)} = A_{n-h_A+1}，
      即 A_m = A_{(m+h_A-1)}。目标节点的 [A_m, B_n] 就是 [A_{(m+h_A-1)}, B_{(n+h_B-1)}]。
  (2) 由 math.locality-ope-equivalences（Theorem 10.10, 1 ⇒ 4）：局域性给出
        A(z)B(w) = Σ_{j=0}^{N-1} i_{z,w} (z-w)^{-(j+1)} C^j(w) + :A(z)B(w):,
      其中 C^j(w) = Res_z (z-w)^j [A(z),B(w)]（Proposition 10.6）。这就是物理写法的 OPE 奇异部分
        A(z)B(w) ∼ Σ_j C^j(w)/(z-w)^{j+1}，
      而「|z| > |w|」在这里的含义**只是**选定 i_{z,w} 这种形式展开（p.179）——即目标节点里「|z| > |w| 的围道对应 A 在左」这一句的形式版本。
  (3) 由 Theorem 10.10（4 ⇒ 5）：同一组 C^j 给出
        [A_{(m)}, B_{(n)}] = Σ_{j=0}^{N-1} (m choose j) C^j_{(m+n-j)}。
      按 (1) 换回物理模指标，即目标节点断言的「OPE 中 (z-w)^{-(j+1)} 的极点系数 C^j 经留数直接给出模的对易关系」：
      物理侧的「绕 z = w 的小围道取留数」在形式侧对应于 Res_z 与 (m choose j) 的二项式系数
      （即 z^{m+h_A-1} 在 z = w 处 Taylor 展开的系数）。
  (4) 例（p.180 (10.2)）：A = B = T，N = 4，C^3 = (c/2)·1、C^1 = 2T、C^0 = ∂T（C^2 = 0），
      第 5 条给出 [L_m, L_n] = (m-n) L_{m+n} + (c/12) m(m²-1) δ_{m+n,0}，与 conv.virasoro-standard 一致——
      这正是目标节点 summary 里「四阶极点的留数给出中心项」的形式版本。
  以上每一步都在 End(V)[[z^{±1}, w^{±1}]] 内完成，**不使用**任何收敛性、径向排序或围道变形；
  「围道变形的合法性」这个物理侧缺口在形式侧根本不出现——代价是前提 (i) 必须另行建立。
gaps:
  - "**唯一的实质缺口在前提**：worldsheet.string-cft-is-a-vertex-algebra 无推导（open）。本推导的有效状态因此为 open，
     目标节点的 best_derivation 仍是围道变形那条（physical-argument）。要让本路线生效，需要为该节点补一条推导
     （或先建只含形式局域性 (i) 的弱节点并改挂）。"
  - "**目标节点的措辞是围道语言**（径向排序 R、|z|>|w| 减 |z|<|w| 的围道差、绕 w 的小围道），本推导给出的是同一字典的
     形式分布版本；「R{A(z)B(w)} 作为全纯函数、两种排序互为解析延拓」这一层含义（Gui Theorem 8.1）本推导**不**覆盖，
     只覆盖「极点系数 ⟺ 模对易子」这一层。若审计认为目标节点的文本本质上包含解析延拓的断言，
     应把本推导改挂到一个只含代数字典的新节点。"
  - "**模指标重标 (1) 是本图的补白**：Schottenloher 用 A_(n)（z^{-n-1}），Polchinski 用带权偏移的 A_m（z^{-m-h_A}）；
     两者的换算在两本书里都没有并列写出。"
  - "费米型场（b, c）需要 Theorem 10.10 的超代数版本（对易子换反对易子、二项式系数不变）；Schottenloher Ch.10 的
     陈述是玻色型，超代数版本的编号本轮未核实。本推导对 bc 部门的适用性因此额外依赖这一未核实的推广。"
  - "Theorem 10.10 第 5 条求和下限的转录疑点（Q10）见 math.locality-ope-equivalences--via-schottenloher 的 gaps。"
notes: |
  **设计意图（任务书第 6 项）**：本推导与既有的 worldsheet.ope-commutator-dictionary--via-contour-deformation 并存。
  工具取最强的推导：围道那条 physical-argument（3）> 本条 open（−1），故目标节点的有效状态与 best_derivation 不变。
  但图上现在能看到一条 status: rigorous 的路线，以及它被哪一个 open 节点压住——
  `uv run stringgraph why worldsheet.ope-commutator-dictionary` 只显示最强路线，本条要用 status/report 或直接读文件看。

  **为什么 status 写 rigorous**：本推导自身的论证（Theorem 10.10 的两个蕴含 + 模指标重标 + 一个例子）是有限步形式代数，
  来源是数学教材中带证明的定理。status 是「自身论证的严格程度」，有效状态由工具算——这正是把 open 的前提
  显式列进 depends_on 而不是藏进 gaps 的意义。

  **既有推导不改**：grep 到的 8 条依赖 worldsheet.operator-product-expansion 的推导
  （bc-ghost-central-charge--via-ope、free-boson-central-charge-d--via-ope、free-scalar-propagator--via-path-integral、
  ope-associativity-bootstrap--via-ope、ope-commutator-dictionary--via-contour-deformation、
  schwarzian-transformation-of-t--via-ope、state-operator-isomorphism--via-radial-quantization、ward-identity--via-path-integral）
  用的都是物理 OPE（含收敛半径断言），depends_on 一律不动。
