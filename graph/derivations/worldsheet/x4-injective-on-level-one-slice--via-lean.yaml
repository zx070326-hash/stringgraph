summary: |
  两条独立路线到达同一结论，逐字核对一致：
  (1) proof.md 的手证路线：Fact 0/1（振子计数分级、L_n 层次记账，backed by
      worldsheet.bosonic-fock-space / worldsheet.fock-space-virasoro-representation，
      两者均非本推导的载重依赖，见目标卡"不需要"清单）→ Lemma 0（[L_n,α^μ_m]=-mα^μ_{n+m}，
      n≠0 时正规序歧义自动消失，且与已形式化的 Sugawara.lean:Lop_apply_mode 独立吻合）→
      子引理（L_{-n} 保持 ≥2 振子子空间，不下漏到 ≤1，归纳证明）→ Lemma A（词的领头单振子
      分量 = 部分和之积 × α^μ_{-s_k}，对每个 D、每个 p、每个词成立）→ Lemma B（x4 的五项
      代入给出领头系数 -408，手算 + 脚本对 D∈{6,8,10,12} 交叉验证）→ 主定理（-408≠0，
      特征零域 ⟹ 单射）。
  (2) Lean 形式化路线（SixSliceInjective.lean，由 formalizer 独立选择的更短路线）：复用已有
      的 towerModeVec/力矩泛函工具箱（towerModeVec_apply_towerLop，即 proof.md 的 Lemma 0），
      而非 proof.md 从零搭建的振子计数分级；主引理以 norm_num 收尾于逐词引理之上，算出
      常数 -2040（= 5 × (-408)，力矩阶数归一化差异，非零性等价，见目标卡 notes）。
  两条路线互相独立、殊途同归；status.yaml 记录 reviewer 与 lead 均已核对 x4 的系数/词序
  与 Lean 侧 SeedTransferSix.lean:x4_apply 逐字吻合。
