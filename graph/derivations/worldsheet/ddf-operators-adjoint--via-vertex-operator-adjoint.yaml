  - "**文献只有一句断言，没有推导；summary 三步没有逐字来源。** GSW §2.3.3 的定位强度是章节页码 L4/L2、式号与正文 L0（brst-cohomology-sources.md §5.2–5.3），GT 1972 正文未获取。教科书对伴随关系只写「A^i_n 是厄米的」一类的一句话。第 1、2 步的模反射规则与逐因子取伴随是本项目按标准径向量子化规则重建的，**未与任何原文核对**。"
  - "**第 2 步的顶点算子伴随 (V^{(n)}_J)† = V^{(−n)}_{−J} 是本推导唯一的非初等步骤。** 【2026-09-11（三）更新】它**已有承载节点**：worldsheet.vertex-operator-adjoint（推导 --via-radial-conjugation，status physical-argument），本条已加为依赖，本推导 summary 第 2 步不再是裸断言。**但缺口本身没有关闭，只是搬了家**：那条命题的论证仍依赖指数算符两半的重排序（E_+E_- ↔ E_-E_+）与「厄米共轭在径向量子化下作用为 z ↦ 1/z̄」这条规则。【2026-09-11（四）更新】后两条里**第二条现在有节点了**：worldsheet.radial-hermitian-conjugation（definition，own rigorous / effective physical-argument），本条已把它加为本推导的非 inferred 依赖（第 1 步也用它）；同理「:e^{i n k_0·X}: 在 k_0² = 0 时权为 0」现由 worldsheet.exponential-vertex-operator-weight 承载。**剩下真正无节点的只有一条：同一个算符内部 E_+ 与 E_- 的重排序**（文献侧只有分离插入点的 Polchinski (6.6.24)）。三条缺口的现址仍是 worldsheet.vertex-operator-adjoint--via-radial-conjugation 的 gaps 第 2、3、4 条（前两条已改写为「已有承载节点 + 缺口搬家」）。本推导 status 仍无法高于 physical-argument：两张新卡自身的 effective 就是 physical-argument，且本推导另被 worldsheet.ddf-transverse-oscillator-algebra 封顶。"
  - "**Lean 侧未起步：V(b)_J† = V(−b)_{−J} 未证。** `formal/StringFormal/NoGhost/VertexOperator.lean` 已有正规序指数的两半（`Fock.creaExp`、`Fock.vertexSub`）与模 `Fock.vertexOsc`，也有 b·b = 0（`dotVec η b b = 0`）作为显式假设，但**没有任何关于伴随的定理**——worldsheet.ddf-operators-v5 的 notes (4) 逐字登记「顶点算子的伴随 V(b)_J† = V(−b)_{−J} 未做（需 E_+E_- 重排序）」。另有结构性障碍：Lean 侧只有 R-双线性型 `Fock.pairing`，**无 sesquilinear 结构**，故即使做完也只覆盖目标边界 (a) 说的实极化情形，不覆盖复 Hermitian 形式。"
  - "**「†」是双线性型的转置，不是 Hermitian 共轭**（继承 worldsheet.fock-indefinite-form 与 worldsheet.virasoro-generators-adjoint 的同一条 gap）。物理上的协变 Fock 空间是复空间，A^† 还含一次复共轭；本推导第 2 步里「X^μ 厄米」这句话在双线性型版本中要读成「转置下不变」。两者在实极化下一致，**复情形未证**。这条对本节点尤其要紧，因为无鬼定理断言的是 Hermitian 形式的半正定性。"
  - "**塔上的双线性型是约定式引入的，不是被证明的。** 【2026-09-11（三）更新】它**已有承载节点**：worldsheet.momentum-tower-fock-space，其 (2) 把塔上的型定义为各层 worldsheet.fock-indefinite-form 之型的直和并**显式声明「层间正交是本定义规定的，不是被证明的」**；本条已加为依赖。**缺口本身没有关闭**：worldsheet.fock-indefinite-form 是**逐固定动量扇区**陈述的（其 Lean 侧 `Fock.pairing` 也是），不同动量层之间的正交性在本图中仍是输入而非结论（物理上它是动量本征态的正交性 ⟨p|p'⟩ ∝ δ^D(p−p')，而本图**没有节点**承载连续动量本征态与 δ 归一化）。目标 (1) 的等式跨两个不同层，因此实质使用这条约定。Lean 侧另缺塔上的型本身（DDF.lean 全文 grep `pairing` 零命中，2026-09-11 curator 核）。"
  - "**目标 (2) 的正定性需要额外假设**：系数环是有序域（如 R = ℝ）且 ⟨0;k|0;k⟩ = 1。前者本图中最接近的登记是 worldsheet.fock-indefinite-form 的 Lean 侧 `Fock.pairing_indefinite_field`（有序环即可）；后者是归一化选择，不是被推出的。目标陈述已把两者写成前提。"
  - "**退化扇区 k_0·p = 0（含 p = 0）不覆盖**：那里 A^i_n 本身没有定义（worldsheet.ddf-operators-v5）。"
  - "**第 3 步的递推没有逐步展开**。summary 只写了递推的形状（搬伴随 → 对易穿过 → 打真空），没有写归纳的严格记账（对 Σ_{(i,n)} d(i,n) 的归纳、d ≠ e 时「某处必然剩下打不掉的湮灭因子」的精确论证）。这一步是初等的、与自由振子 Fock 空间逐字同型，但若要按 docs/STATUS_LEVELS.md 的 rigorous 例外条款单独升级第 (2) 条，必须写全并由 reviewer 复核。**【2026-09-11（四）更新】这件事已经做了，但做在另一张卡上**：worldsheet.transverse-ddf-fock-gram-matrix（条件命题，把 (1)(a)(b) 与真空归一化写成显式假设 (H1)–(H4)）的推导 --via-oscillator-recursion 逐步写全了归纳记账（湮灭算符穿过创生算符串的 Leibniz 引理 + 对 |d| 的归纳 + 有序域上的正定），status rigorous，reviewer 复核清单已列、`reviewer-verified: <pending>`。**本推导的 summary 第 3 步与本 gap 保留原样**：目标 worldsheet.ddf-operators-adjoint 的第 (2) 条把 (1) 当已证事实用，本推导对它的支撑仍只是上面那段形状描述。要引用严格版本请指向新卡。"
