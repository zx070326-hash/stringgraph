summary: |
  文献里这一条只有一句话（「A^i_n 是厄米的」）。下面是把那句话展开成的标准论证，
  三步；每一步都注明它是标准规则还是本项目的重建。

  **第 1 步（模反射规则）。** 径向量子化中，一个由厄米场构成的权 h 主场 J(z) 的模
  J_m := ∮ (dz/2πi) z^{m+h−1} J(z) 在 Fock 双线性型下满足 (J_m)† = J̄_{−m}
  （J̄ 是共轭场；J 厄米时 J̄ = J）。
  【2026-09-11（四）】这条规则现由 worldsheet.radial-hermitian-conjugation 承载
  （该卡 (3)；双线性型版本用 z ↦ 1/z，见该卡边界 (b)。注意该卡 (4)：
  若改用「z^K 的系数」指标，反射是 K ↦ −K − 2h，本步用的是上面的模指标，故是纯反射 m ↦ −m）。
  这正是本图中两条已有节点背后的同一条规则：
  h = 1 的 ∂X^μ 给 (α^μ_m)† = α^μ_{−m}（worldsheet.fock-indefinite-form (1)(b)），
  h = 2 的 Sugawara L_m 给 L_m† = L_{−m}（worldsheet.virasoro-generators-adjoint，已形式化）。
  DDF 算子的被积量 O^i_n(z) = ∂X^i(z) e^{i n k_0·X(z)} 是权 1 主场
  （worldsheet.ddf-commute-with-virasoro 的论证内容：k_0² = 0 与 ε^i·k_0 = 0 把
  T·O 的三阶与二阶极点都杀掉；【2026-09-11（四）】其中「指数因子权为 0」这一半现由
  worldsheet.exponential-vertex-operator-weight (3) 承载，本推导经
  worldsheet.ddf-commute-with-virasoro 与 worldsheet.vertex-operator-adjoint 两条边
  间接依赖它，故不另加边），故 A^i_n = ∮ (dz/2πi) O^i_n(z) 就是它的第 n 个模，
  于是 (A^i_n)† = (Ō^i_n 的第 −n 个模)。剩下的全部工作是确认 Ō^i_n = O^i_{−n}。

  **第 2 步（逐因子取伴随，即 Ō^i_n = O^i_{−n}）。** 把 A^i_n 展成模态和
    A^i_n = Σ_{m ∈ Z} α^i_m V^{(n)}_m，
  其中 V^{(n)}_J 是正规序指数算符 :e^{i n k_0·X(z)}: 的 **z^J 洛朗系数**
  （含零模移位 e^{i n k_0·x}，它把动量 p 送到 p + n k_0）。
  【2026-09-11（四）：求和指标约定统一，lead 裁决「采 Lean 写法」】本步原写作
  A^i_n = Σ_m α^i_m V^{(n)}_{−m}，其中 V^{(n)}_J 读作「第 J 个**模**」（即 z^{−J} 的系数）；
  现改为与 `formal/StringFormal/NoGhost/DDF.lean` 文件头逐字一致的
  **A^i_n = Σ_{m ∈ Z} α^i_m ∘ V^{(n)}_m**（V 读作 z^J 的**系数**）。
  **两种写法只差 m ↦ −m 的重标，内容完全相同**；改写的理由是形式化将沿用 Lean 那套，
  且本图内其余两处早已用它：worldsheet.vertex-operator-adjoint（其陈述逐字写「**z^J 的系数**，
  与 Lean 侧 `Fock.vertexOsc` / `towerVertex` 的指标约定相同」）与
  worldsheet.ddf-transversality-gives-local-finiteness（「V^{(n)}_K 是 z^K 洛朗系数」，
  局部有限窗口 n − N ≤ m ≤ N）。本步此前是本图内**唯一**的例外。
  围道核对（初等，两行）：∂X^i(z) ∝ Σ_m α^i_m z^{−m−1}，:e^{i n k_0·X(z)}: = Σ_K V^{(n)}_K z^K，
  ∮ (dz/2πi) 取总 z^{−1} 系数，即 (−m−1) + K = −1，故 K = m，得 A^i_n ∝ Σ_m α^i_m V^{(n)}_m。
  注意伴随规则 (V^{(n)}_J)† = V^{(−n)}_{−J} 的**形状在两种约定下相同**（指标反射与
  J ↦ −J 的换名对易），故本步引用的 worldsheet.vertex-operator-adjoint 无需改写。
  两个因子之间**没有缩并**，因为交叉缩并的系数正比于
  ε^i·k_0 = 0；因此可以逐因子取伴随：
    · (α^i_m)† = α^i_{−m}，对**一切整数 m 含 m = 0**（worldsheet.fock-indefinite-form (1)(b)
      加 worldsheet.virasoro-generators-adjoint 在 Lean 侧对 m = 0 的延拓；
      m = 0 时 α^i_0 = (2α')^{1/2} p^i 是标量，对双线性型自伴）；
    · (V^{(n)}_J)† = V^{(−n)}_{−J}。这一步是**本推导唯一的非初等步骤**
      （【2026-09-11（三）】现由 worldsheet.vertex-operator-adjoint 承载，见依赖首条）：
      X^μ 厄米蕴含 (:e^{i n k_0·X(z)}:)† 形式上是 :e^{−i n k_0·X(1/z̄)}:，
      即 k_0 → −k_0 且模指标反射；把它写成模的等式需要把指数算符的湮灭半 E_+ 与产生半 E_-
      **重排序**（E_+E_- ↔ E_-E_+），而重排序产生的因子正比于 z^{2α' n² k_0·k_0}，
      **由 k_0² = 0 恒为 1**。这是类光条件在本推导中的关键作用。
  合起来
    (A^i_n)† = Σ_{m ∈ Z} (V^{(n)}_m)† (α^i_m)† = Σ_{m ∈ Z} V^{(−n)}_{−m} α^i_{−m}
             = Σ_{m ∈ Z} V^{(−n)}_m α^i_m = Σ_{m ∈ Z} α^i_m V^{(−n)}_m = A^i_{−n}
  （第三个等号把求和指标反射 m ↦ −m；第四个等号用两个因子对易——同样因为 ε^i·k_0 = 0）。
  动量记账自洽：左端把 F(p + n k_0) 送回 F(p)，右端 A^i_{−n} 正是如此，这就是目标 (1) 里
  v ∈ F(p)、w ∈ F(p + n k_0) 的量词来源。

  **第 3 步（Gram 矩阵，目标 (2)）。** 这一步是纯代数的、有限步的。设已有
  (1)、(a) [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}、(b) A^i_n|0;k⟩ = 0 (n > 0) 与 ⟨0;k|0;k⟩ = 1。
  算两个 DDF 单项式的配对 ⟨{d}, {e}⟩：用 (1) 把左边的每个 A^i_{−n} 搬到右边变成 A^i_{+n}，
  再用 (a) 把它逐个对易穿过右边的 A^j_{−m}（每穿过一次给 c-数 n δ^{ij} δ_{n,m}），
  最后用 (b) 让它打在 |0;k⟩ 上得零。这与自由振子 Fock 空间上的标准 Wick 递推**逐字相同**
  （worldsheet.fock-indefinite-form 陈述 (2) 的证明结构），结论也逐字相同，
  只是 η^{μμ} 换成 δ^{ij}：
    · d ≠ e 时递推在某处必然剩下一个打不掉的湮灭因子，得 0（正交）；
    · d = e 时逐个因子给出 n^{d(i,n)} · d(i,n)!，乘起来即对角元；
    · 因 i 全是**类空横向**方向（δ^{ii} = +1）且 n ≥ 1，对角元是正整数的乘积，
      在有序域上严格为正 ⟹ H^⊥(k) 上的型正定。
  能级分级正交是 (a) 的直接推论，也可以从「不同能级落在塔的不同层、动量不同」直接读出
  （层间正交是塔的双线性型的定义）。

  这三步合起来就是 worldsheet.no-ghost-theorem-v4 第 (1b) 步里那句
  「其 Gram 矩阵就是 24 个横向振子 Fock 空间的正定 Gram 矩阵」的完整依据：
  横向振子代数（worldsheet.ddf-transverse-oscillator-algebra）只给对易子，
  正定性还需要本推导的 (1) 与真空归一化。
