summary: |
  设 A、B 为全纯、Grassmann 宇称 ε_A、ε_B 的算子。径向排序对奇算子带符号：
    R{A(z)B(w)} = A(z)B(w)（|z|>|w|），  R{A(z)B(w)} = (−1)^{ε_A ε_B} B(w)A(z)（|z|<|w|）。
  于是
    A_m B_n = ∮_{|z|>|w|} (dw/2πi) w^{n+h_B−1} (dz/2πi) z^{m+h_A−1} R{A(z)B(w)} ，
    B_n A_m = (−1)^{ε_A ε_B} ∮_{|z|<|w|} (同上) R{A(z)B(w)} 。
  作分次括号
    [A_m, B_n} = A_m B_n − (−1)^{ε_A ε_B} B_n A_m
               = ∮_{|z|>|w|} R{AB} − (−1)^{ε_A ε_B}(−1)^{ε_A ε_B} ∮_{|z|<|w|} R{AB}
               = ∮_{|z|>|w|} R{AB} − ∮_{|z|<|w|} R{AB} ，
  两个 (−1)^{ε_A ε_B} 相乘为 +1，故两条围道之差仍是**同一个**全纯函数 R{A(z)B(w)} 的两条围道之差，
  按 (2.6.14)/Fig. 2.3 变形成绕 w 的小围道 C_w，在其上代入 OPE 逐阶取留数。
  这就把玻色型字典的每一步原样搬到费米型：**唯一的改动是左端从 [·,·] 变成 [·,·}**。
  ε_A ε_B = 0 时 [·,·} = [·,·]，退化为 worldsheet.ope-commutator-dictionary。

  **实例 (1) 的验算**（bc，权 (λ, 1−λ)，b_m = ∮ z^{m+λ−1} b、c_n = ∮ w^{n−λ} c）：
    {b_m, c_n} = ∮_0 (dw/2πi) w^{n−λ} Res_{z→w} z^{m+λ−1} · (1/(z−w))
               = ∮_0 (dw/2πi) w^{n−λ} w^{m+λ−1} = ∮_0 (dw/2πi) w^{m+n−1} = δ_{m+n,0} ，
  与原书 (2.7.17) {b_m, c_n} = δ_{m,−n} 一致，且与 λ 无关（与原书 §2.7 通篇按一般 λ 书写相符）。
gaps:
  - "**原书未单列费米版**：Polchinski Vol.1 §2.6 只写玻色型 (2.6.14)；费米型版本在 (2.7.17)、(4.3.10) 与 Vol.2 §10.1
     被直接使用而不被陈述。本推导的 summary 是本图对围道论证的推广复述，**没有逐字来源**
     （docs/STATUS_LEVELS.md「断言 + 骨架」档位）。"
  - "**奇算子的径向排序符号在原书 §2.6 是否明写，本图未核实**：本推导把它作为 Wick 定理费米版
     （worldsheet.conformal-normal-ordering-v2）的推论使用，边标 inferred。若原书在 (2.6.12)–(2.6.14) 附近
     有明写，researcher 核实后可把该边改为非 inferred 并补 loc。"
  - "**OPE 级数收敛与围道变形的合法性在来源中未证明**（lead 裁决 1，2026-09-10）：与玻色型字典共享同一缺口，
     这是本推导封顶在 physical-argument 的主因。"
  - "**半整数权场的分支处理未展开**：statement 只说「指标取相应的半整数使被积函数单值」，R 扇区
     （指标整数、被积函数带 z^{1/2} 分支）不在本卡范围内；见 worldsheet.rns-modes-satisfy-super-virasoro--via-contour 的 gaps。"
  - "**严格路线缺席**：玻色型有 worldsheet.ope-pole-mode-commutator-dictionary（Schottenloher Thm 10.10 的形式分布版），
     费米型需要该定理的超代数版，编号本轮未核实；若立卡应另建「费米型形式分布版」卡而不挂在本卡上。"
