depends_on:
  - id: worldsheet.ope-commutator-dictionary
    note: |
      提供围道变形本身（原书 (2.6.14) + Fig. 2.3：|z|>|w| 的围道减 |z|<|w| 的围道 = 绕 w 的小围道）
      与「在小围道上代入 OPE、逐阶取留数」的手续。本推导对它**只加一个符号**，围道论证逐字沿用。
      ⚠ 这条边是本推导封顶在 physical-argument 的原因之一：该卡自己声明围道变形等价于 OPE 在环域内收敛，
      而收敛性在来源中不被证明。
  - id: worldsheet.operator-product-expansion
    note: 提供 OPE 框架与其收敛域假定（原书 §2.2）；留数逐项计算依赖它。
  - id: worldsheet.conformal-normal-ordering-v2
    inferred: true
    note: |
      提供「费米型场的乘积在换序时带 (−1)」这一 Grassmann 规则（该卡 statement 的「费米换序符号」段：
      正规序积与场本身有相同的 Grassmann 宇称与交换规则），本推导用它写出带符号的径向排序
      R{A(z)B(w)} = (−1)^{ε_A ε_B} B(w)A(z)（|z|<|w|）。
      **标 inferred**：原书 §2.6 对奇算子的径向排序符号在抽取记录里没有逐字条目
      （(2.6.14) 附近只写玻色型），本图未核实原书是否在该处明写；这条边的论证位置只能指到
      该卡自己引用的 Wick 定理费米版。
  - id: worldsheet.state-operator-isomorphism
    inferred: true
    note: |
      与 worldsheet.ope-commutator-dictionary--via-contour-deformation 同样的理由：「R 排序的乘积定义算子在
      Hilbert 空间上的作用」这一步在本图中只有该卡提供支撑，原书 §2.6 不显式引用。标 inferred。
  - id: worldsheet.bc-ghost-cft
    note: |
      **只用于实例 (1) 的核对**：提供 b(z)c(0) ∼ 1/z、权 (λ, 1−λ) 与模展开
      b(z) = Σ b_n z^{−n−λ}、c(z) = Σ c_n z^{−n−(1−λ)}（原书 (2.5.4)–(2.5.7)、(2.7.16)）。
      本推导把字典代入它，验算得 {b_m, c_n} = δ_{m+n,0}，与原书 (2.7.17) 一致。
      实例 (2)、(3) 由各自的卡（worldsheet.brst-nilpotent-at-c26、worldsheet.rns-modes-satisfy-super-virasoro）
      承载，本推导不挂边。
