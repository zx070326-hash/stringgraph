id: worldsheet.current-algebra-level-quantization--via-su2-pseudospin
target: worldsheet.current-algebra-level-quantization
kind: physical-argument
status: physical-argument
depends_on:
  - id: math.affine-lie-algebra-current-ope
    note: |
      供给模代数 (11.5.3)，在 Cartan–Weyl 基下验证 (11.5.12a) 与 (11.5.12b) 两组都满足 SU(2) 代数；
      其中 (11.5.12b) 的 J³ 里多出的 k̂/α² 正是 [E_1^α, E_{−1}^{−α}] 的中心项贡献。
  - id: math.compact-lie-algebra-index-and-casimir
    note: |
      供给李代数、结构常数与不变内积。⚠ Cartan–Weyl 基 (H^i, E^α)、根 α 与归一化 (11.4.12)/(11.4.14)
      **不在**该卡上（原书 pp. 61–65 抽取时跳读）；本推导按原书记号使用，见 gaps。
  - id: worldsheet.current-algebra-central-term-positive
    note: 供给 k̂ ≥ 0（故 k ≥ 0）与「非平凡流 ⇒ k̂ > 0」（故 k > 0）；原书 (11.5.13) 一句话里的「nonnegative … positive for a nontrivial current」由此而来。
sources:
  - ref: polchinski-1998-v2
    loc: "§11.5, eq. (11.5.10)–(11.5.13), pp. 67–68"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E60）。
      原书自评（逐字）：'The reader can verify that the two sets … also satisfy the SU(2) algebra'。
summary: |
  对任一根 α，由 J³ = α·H/α²、J^± = E^{±α}（(11.5.10)）得 SU(2)（(11.5.11)）。
  流代数的零模组 (11.5.12a) 与 pseudospin 组 (11.5.12b)（E_{±1} 与移位后的 J³）都满足 SU(2)
  （原书：'The reader can verify'）。SU(2) 幺正表示中 2J³ ∈ Z，两组的 2J³ 相差 2k̂/α²，
  故 2k̂/α² ∈ Z 对一切根成立；取最长根 ψ 得 level k = 2k̂/ψ² ∈ Z。
  结合 k̂ ≥ 0（worldsheet.current-algebra-central-term-positive）得 k 为非负整数，非平凡流时为正。
gaps:
  - "**(11.5.12a,b) 满足 SU(2) 代数原书不算**（'The reader can verify'）：本推导未复算。"
  - "**「2J³ ∈ Z」用的是 SU(2) 幺正表示论，且隐含态空间在 pseudospin SU(2) 下完全可约**：原书不引、不证；本图无 SU(2) 表示论节点。"
  - "**Cartan–Weyl 基与根的归一化 (11.4.12)/(11.4.14) 内容未核实**（原书 pp. 61–65 跳读）：本推导按原书记号使用 α²、ψ²，未核对 E^α 的归一化是否使 (11.5.11) 恰为标准 SU(2)。"
  - "**「取长根最强」**：原书一句话断言（2k̂/α² ∈ Z 对 α² 最大者最强），本图未核对短根条件是否被长根条件蕴含（对非单 laced 代数需 ψ²/α² ∈ {2, 3}）。"
author: curator-polchinski-v2-ch11-current
