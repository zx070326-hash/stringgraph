id: worldsheet.diff-weyl-metric-variation--via-infinitesimal-transformation
target: worldsheet.diff-weyl-metric-variation
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.metric-variation-operator-p1
    note: 提供 P₁ 的定义，本式的对称无迹部分就是 −2 P₁δσ。
sources:
  - ref: polchinski-1998-v1
    loc: "§5.2, eq. (5.2.4)–(5.2.5), p.151；同式即 §3.3 的 (3.3.16)"
    note: |
      抽取记录 #E73，L1（schrans-2020 §5.6–§5.7，笔记 p.248–249）。
summary: |
  微分同胚由向量场 δσ^a 生成，度规按李导数变分 δg_ab = −(∇_a δσ_b + ∇_b δσ_a)；
  Weyl 变换给 δg_ab = 2δω g_ab。相加后按「对称无迹 + 纯迹」分解：
    −(∇_aδσ_b + ∇_bδσ_a) = −2·½(∇_aδσ_b + ∇_bδσ_a − g_ab∇·δσ) − g_ab ∇·δσ
                          = −2(P₁δσ)_ab − g_ab ∇·δσ,
  代入即得 δg_ab = −2(P₁δσ)_ab + (2δω − ∇·δσ) g_ab。
gaps:
  - |
    **李导数的符号约定未在来源中核实**：δg_ab = −(∇_aδσ_b + ∇_bδσ_a) 里的整体负号
    对应「主动」变换约定（坐标 σ'^a = σ^a + δσ^a 下场的变化）。抽取记录 E73 只给出最终式
    (5.2.4)，没有给出中间步骤，故本图**无法核实原书用的是哪一种符号约定**；
    本推导的分解在两种约定下同构（只差 δσ → −δσ），不影响下游的 ker P₁ 计数。
  - |
    **本推导只覆盖代数分解本身**：「所考虑的变换群就是 diff × Weyl」是 §5.2 的
    设定，不在本卡论证范围内（它由 Polyakov 作用量的对称性提供，见 notes）。
  - |
    **来源强度**：式号 (5.2.4)/(5.2.5) 只经 schrans-2020 伴读笔记核对（对笔记 L1，对原书 L3）；
    本项目至今没有 Polchinski Vol.1 正文。
notes: |
  reviewer-verified: reviewer-ch5, 2026-09-11
  —— reviewer 独立复核了 summary 里的分解（有限步初等代数，前提：二维、
  Levi-Civita 联络、对称无迹 + 纯迹分解已写全），故按 docs/STATUS_LEVELS.md 的
  rigorous 例外条款（lead 2026-09-10）标 kind: proof / status: rigorous。

  **删掉的两条 inferred 边（reviewer-ch5, 2026-09-11）**：
  原先挂有 worldsheet.polyakov-action-symmetries 与 worldsheet.polyakov-weyl-invariance
  两条跨号差的 inferred 边。动机是记下「所考虑的变换群为何是 diff × Weyl」这个前提；
  但本推导实际使用的只有李导数公式与 Weyl 变换的定义式，并不使用「它们是作用量的
  对称性」这一事实；把两条跨号差边（各带 convention_map）挂在一条纯代数推导上，只会把
  Wick 旋转的未登记缺口拖进本卡。动机保留在此；若下游需要该前提，应在使用它的
  那张卡（如规范固定、Faddeev–Popov）上记账。
author: curator-polchinski-ch5
