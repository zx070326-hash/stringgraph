      ⚠ **强度说明**：Lean 的 `IsContravariant` 直接按生成元写成
      `B ⁅L n, x⁆ y = B x ⁅L (-n), y⁆`，**没有**在证明里调用 `antiInvolution_lie`
      （反自同构那一条）——两步子模论证只需要「L_n 的伴随是 L_{−n}」这个逐生成元的等式。
      故本边是**概念性/记号性依赖**（σ 的定义），不是对该卡 (2) 的逻辑依赖。
      即便如此保留这条边：目标陈述里「即 L_n 在 B 下的伴随是 σ(L_n) = L_{−n}」一句字面引用了 σ，
      而 σ 必须在图上有定义点；且下游 worldsheet.shapovalov-form-existence 的构造
      （σ-扭对偶）**确实**要用 `antiInvolution_lie`。
