summary: |
  证明分两条独立的线拼接：

  **线 A（L_{-1} 单射性，`towerLop_neg_one_injective`，第 186 行）**：用 K-代数事实
  ⁅L_{-1},K_1⁆=−K_0、K_0=1（`towerLop_neg_one_apply_kOp_one`，第 148 行，直接调用
  worldsheet.gt-longitudinal-k-algebra 断言 (1)(3)）得到降级公式
  `L_{-1} K_1^{k+1} x = -(k+1)·K_1^k x`（`towerLop_neg_one_apply_kOp_one_pow`，第 161 行，
  对 K_1 的幂做归纳）；再证片 (j,M) 上任意向量 x 经 K_1 幂次升到 M+1 层之上必为零
  （`kOp_eq_towerModeVec` 与占据数几何耗尽），从 `L_{-1}x=0` 出发沿 K_1^k x 反向归纳，
  逐步"除以非零自然数"（`eq_zero_of_natCast_smul_eq_zero`，用到 `Algebra ℚ R`）排空到
  x=0。全程 D 与截距均不出现。

  **线 B（typeOneMap 及其维数下界，第 942-1003 行）**：把线 A 的单射性限制到映射
  `typeOneMap : Q_{-(N+1),N} → H_null ⊓ V_{N+1}`（`(towerLop η a b (-1)).restrict`，
  良定义靠截距条件 haa 使 Type-1 后代满足零态判据）；`typeOneMap_injective`
  （第 957 行）把线 A 的单射性搬到这个限制映射上；配
  worldsheet.quasi-physical-slice-dimension 给出的
  `dim Q_{-(N+1),N} ≥ p_{D−1}(N)`（`le_finrank_towerSeed`），用单射线性映射不减维数
  （`LinearMap.finrank_le_finrank_of_injective`）得到目标卡断言
  `dim(H_null ⊓ V_{N+1}) ≥ p_{D−1}(N)`。

  **为什么标 formalized**：目标卡的全部断言由 `le_finrank_towerNull_inf_towerBigrade_succ`
  这一条无 sorry 的 Lean 定理逐字给出；三条依赖（K-代数、光锥标架、准物理片维数下界）
  effective 均为 formalized，不压低本推导状态。
