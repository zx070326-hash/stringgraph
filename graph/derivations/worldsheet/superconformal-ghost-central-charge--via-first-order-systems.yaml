id: worldsheet.superconformal-ghost-central-charge--via-first-order-systems
target: worldsheet.superconformal-ghost-central-charge
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.bc-ghost-central-charge
    note: |
      供给方括号里的第一项 −3(2λ−1)^2 + 1（λ = 2 时 −26）。
      **不标 inferred**：原书 (10.1.19) 把这一项逐字写成 (10.1.19) 的第一个方括号，
      并在 (10.1.20) 逐字写 '−26 + 11 = −15'，即在原地引用了 bc 系统的中心荷。
  - id: worldsheet.beta-gamma-central-charge
    note: |
      供给第二项 3(2λ−2)^2 − 1（λ = 2 即 λ' = λ − 1/2 = 3/2 时 +11）。
      **不标 inferred**：同上，(10.1.20) 的 '−26 + 11' 里的 11 就是它。
      convention_map：那张卡用自己的权参数 λ'（β 的权），本卡用 λ（b 的权），
      关系是 λ' = λ − 1/2（原书 (10.1.16b): h_β = λ − 1/2）。故
      3(2λ'−1)^2 − 1 = 3(2λ−2)^2 − 1，与 (10.1.19) 的第二个方括号逐字一致。
    convention_map: "λ'(β 的权) = λ(b 的权) − 1/2；代入后 3(2λ'−1)^2 − 1 = 3(2λ−2)^2 − 1"
  - id: worldsheet.tt-ope-central-charge
    note: 供给中心荷的定义与归一化（两项相加是同一个 c 的加性，靠 TT OPE 四阶极点的线性性）。
sources:
  - ref: polchinski-1998-v2
    loc: "§10.1, eq. (10.1.19), p. 4（两个方括号之和 = 9 − 12λ）；eq. (10.1.16a,b), p. 4（权，含 h_β = λ − 1/2）；eq. (10.1.20), p. 4（λ = 2 的 −26 + 11 = −15）"
    note: L1（抽取记录 E11、E12）。原书直接给出，无中间步骤。
  - ref: polchinski-1998-v2
    loc: "§11.1, eq. (11.1.2a,b), p. 46–47（统一通式 c_h = (−1)^{2h+1}[3(2h−1)^2 − 1] 与 c_2 = −26、c_{3/2} = +11）"
    note: |
      按抽取记录 Q11 的建议引入的第二条一手来源：它把两个方括号统一成一条带统计符号的公式，
      式号与表达式均已 L1 核实。**这是本推导定位最强的一处。**
summary: |
  两步：
  (1) 加性。bc 与 βγ 是两个互不耦合的一阶系统（作用量 (10.1.17) 是两项之和），
      故中心荷相加。这一步用 TT OPE 四阶极点的线性性。
  (2) 各自的值。bc（反对易，权 (λ, 1−λ)）给 −3(2λ−1)^2 + 1；
      βγ（对易，权 (λ−1/2, 3/2−λ)）给 3(2(λ−1/2)−1)^2 − 1 = 3(2λ−2)^2 − 1。
      两项相加：−3(4λ^2 − 4λ + 1) + 1 + 3(4λ^2 − 8λ + 4) − 1 = 12λ − 3 − 24λ + 12 = 9 − 12λ。✓
      λ = 2：9 − 24 = −15，且分项为 −26 与 +11。✓
  (11.1.2a) 的通式给同一结果，并把「对易 ⟹ 反号」写成显式因子 (−1)^{2h+1}。

  【status 的理由】两条上游节点的有效状态都是 physical-argument
  （bc 与 βγ 的中心荷都来自 OPE/路径积分层面的计算，且 βγ 的一般 λ 表达式在 v1 抽取记录里
  标未核实——本推导用 Vol.2 (10.1.19)/(11.1.2a) 补上了这个定位）。
  第 (2) 步本身是有限步代数，但没有 reviewer 复核记录，按「不确定选低一级」不升 rigorous。
gaps:
  - "**「对易场的中心荷 = 同权反对易场的反号」这条规则在本图无独立论证节点**：worldsheet.beta-gamma-central-charge--via-statistics-flip 记的是同一条规则，其自身也是 physical-argument。(11.1.2a) 的因子 (−1)^{2h+1} 是同一事实的更简洁写法，原书同样只陈述不证明。"
  - "**λ = 2 的选取有一个未在本卡记账的自由度**：原书 §10.5 脚注 3（p. 24）指出 bcβγ 理论有一族由 β → xβ, γ → x^{−1}γ 联系的超共形对称性，一般 BRST 构造 (4.3.14) 才挑出 (10.1.21) 那一组。中心荷在这一族里不变，故不影响本推导；但下游 worldsheet.superstring-brst-charge 依赖该选择。"
  - "**代数化简 9 − 12λ 缺 reviewer 复核记录**（这是本推导不能按 STATUS_LEVELS 的 rigorous 例外升级的形式障碍；计算已写在 summary 里，两行可查）。"
