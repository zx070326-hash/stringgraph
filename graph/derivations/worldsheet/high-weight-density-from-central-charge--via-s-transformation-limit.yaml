status: physical-argument
depends_on:
  - id: worldsheet.torus-partition-function-general-cft
    note: 提供逐态求和 Z(τ) = Σ_i q^{h_i−c/24}q̄^{h̃_i−c̃/24}，以及 −c/24 前因子（结论的整个内容就在它）。
  - id: worldsheet.modular-group-psl2z
    inferred: true
    note: |
      **inferred: true**。原书此处只说「Using modular invariance」，并未指明用的是
      S : τ ↦ −1/τ 这**一个元素**（虽然 τ = iℓ ↦ i/ℓ 显然就是 S）。本图补这条边以说明
      所用的是模群的哪个元素。
      ⚠ 2026-09-11 改指（reviewer-v1-ch7 建议）：原先挂
      `worldsheet.modular-group-generated-by-s-and-t`，**那是错的层级**——本推导只用到
      S 这**单个元素的存在与作用方式**（它是定义卡 worldsheet.modular-group-psl2z 的内容），
      **完全不用「S、T 生成全模群」这条定理**。而后者在本图是 proposition 且原书未证，
      挂它会把一条本推导用不到的未证命题算进依赖闭包、虚报瓶颈。
sources:
  - ref: polchinski-1998-v1
    loc: "§7.2, eq. (7.2.30) 与同页脚注 1, p.213"
    note: 抽取记录 literature/extractions/polchinski-1998-v1-ch7.md#E14，L1（原书页图逐字）。
summary: |
  取 τ = iℓ。ℓ → 0 时 q = exp(−2πℓ) → 1，求和不再被压制，配分函数由高权态密度支配。
  用模不变性把它换到 τ = i/ℓ：那里 q = exp(−2π/ℓ) → 0，求和被**最低权态**支配。
  在紧酉 CFT 中最低权态就是单位态（h = h̃ = 0），其贡献是前因子
  q^{−c/24}q̄^{−c̃/24}|_{τ=i/ℓ} = exp[π(c+c̃)/(12ℓ)]。故 Z(iℓ) ≈ exp[π(c+c̃)/(12ℓ)]。
gaps:
  - "**无误差估计**：原书用 ≈，不给出次领头项，也不说明「最低权态支配」在什么意义下成立
     （需要态密度的增长与 q^{h} 的压制竞争的定量控制）。"
  - "**模不变性是输入而非结论**：本推导把模不变性当假设用。若 CFT 不模不变，结论不成立。"
  - "**紧、酉两条假设的必要性只在脚注里以例子说明**（非酉 ⇒ 负权算子支配；线性 dilaton ⇒
     非紧 + 无平移不变性），**没有反例的完整构造**。"
  - "**「高权态密度」这个量在陈述里没有独立定义**：原书由 Z 的行为反推密度，
     两者的严格对应（Tauber 型定理）不在来源中。"
notes: |
