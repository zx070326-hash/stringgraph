    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E69，L1（读到 schrans-2020 §5.1
      笔记 p.243–244；**原书正文本项目未取得**，见抽取记录 §5.0）。
summary: |
  用 diff × Weyl 把环面度规化为 Ricci 标量为零的度规；二维零曲率度规**局域**平坦，
  故可取局部平坦坐标 σ^a。剩下的规范不变信息是坐标的周期性条件，一般形如
  σ^a ≅ σ^a + 2π(m u^a + n v^a)。转到复坐标 w = σ¹ + iσ²，再用一个旋转把 u 转到实轴、
  用一个 Weyl 重标度把 |u| 归一，周期性化为 w ≅ w + 2πm + 2πnτ，τ = v¹ + iv²。
  度规正定要求 det g = (Im τ)² > 0，故 τ 落在上半平面（取 Im τ > 0 这一支）。
  于是环面的度规在 diff × Weyl 之后只剩两个实参数 (Re τ, Im τ)，即 μ = 2。
gaps:
  - |
    **局域平坦 → 整体平坦的跨越没有论证**。本图现有的 worldsheet.conformal-gauge-fixing
    明确只断言局部结论。「环面的共形类里存在整体平坦度规」在数学上是单值化定理
    （或等价地：2∇²ω = R 在紧曲面上可解当且仅当 ∫√g R = 0，即 χ = 0）的内容，
    Polchinski 此处没有证明，本图也没有节点承载它。这是本推导不能高于 physical-argument
    的**首要**理由。
  - |
    「把 u 转到实轴并归一后 τ 唯一确定该环面」这一步只是构造，未论证得到的 τ 与所选周期基底
    无关——事实上它**依赖**基底，这正是 worldsheet.torus-modular-equivalence 的内容；
    本推导的结论因此只是「存在某个 τ」，不含唯一性。
  - |
    **来源强度**：式号 (5.1.9)–(5.1.11) 与全部中间步骤都只经 schrans-2020 伴读笔记核对（L1
    对笔记、L3 对原书）。本项目至今没有 Polchinski Vol.1 正文，见抽取记录 §5.0 与 Q9。
notes: |
  与 worldsheet.torus-two-moduli-two-ckv 的关系见目标节点的 notes：两条路线独立给出 μ = 2。
