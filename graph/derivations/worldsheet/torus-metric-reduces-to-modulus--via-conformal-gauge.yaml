id: worldsheet.torus-metric-reduces-to-modulus--via-conformal-gauge
target: worldsheet.torus-metric-reduces-to-modulus
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.conformal-gauge-fixing
    note: |
      提供「二维度规局域可化为 δ_ab（等价地 R = 0）」这一步。**只覆盖局部**：
      该节点的 statement 里明写「本节点不断言全局规范固定的存在性」。
  - id: worldsheet.torus-modulus
    note: 论证的终点对象（平坦环面 T²(τ)）由这张定义卡给出。
  - id: worldsheet.polyakov-action-symmetries
    inferred: true
    note: |
      inferred：抽取记录 E69 没有把 diff 不变性列为依赖，但「用微分同胚把一个周期转到实轴」
      这一步用到的正是 Polyakov 作用量的 diff 对称性。论证在 §1.2，本推导来源 §5.1 只是使用它。
    convention_map: |
      跨 family `worldsheet-signature`：该节点写在洛伦兹世界面（conv.worldsheet-lorentzian，
      度规 γ_ab 号差 (−,+)），本推导在欧氏世界面（conv.worldsheet-euclidean）。
      换算按 conv.worldsheet-euclidean 的 Wick 旋转字典 (a)–(d)：σ² = iσ⁰、(−γ)^{1/2} ↔ g^{1/2}、
      S_P^L = i S_P^E。**微分同胚不变性本身与号差无关**（它是坐标变换下的协变性，
      对任何号差的度规都成立），故本条换算不带来新的物理内容。
      ⚠ 继承 conv.worldsheet-euclidean notes 里登记的缺口：Wick 旋转在路径积分层面的合法性
      本图无节点，故凡跨本 family 的推导一律不高于 physical-argument。
  - id: worldsheet.polyakov-weyl-invariance
    inferred: true
    note: |
      inferred：同上，「用 Weyl 变换把度规化到平坦、并把周期长度归一」用到 Weyl 对称性，
      §5.1 只使用不论证。
    convention_map: |
      跨 family `worldsheet-signature`，换算同上一条（conv.worldsheet-euclidean 的 Wick 旋转字典）。
      Weyl 变换 g_ab → e^{2ω} g_ab 的形式在两种号差下逐字相同，d = 2 时 √g g^{ab} 的 Weyl 权
      也相同，故 Weyl 不变性的陈述跨号差不变。
sources:
