summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/DDFOperator.lean。目标声明逐字为

    theorem ddfSummand_apply_eq_zero_of_notMem_window (η a b ε : Fin D → R)
        (hη : ∀ μ, η μ * η μ = 1) (hεb : dotVec η ε b = 0) (n : ℤ) (x : TowerFock D R) (j : ℤ)
        (hj : j ∉ ddfWindow n x) : ddfSummand η a b ε n j x = 0

  其中 `ddfSummand η a b ε n j = towerModeVec η a b ε j * towerVertex η b n j`（即 α^ε_j V^{(n)}_j），
  `ddfWindow n x = Finset.Icc (n − towerLevelBound x) (towerModeBound x)`（即本卡的 W(n, x)）。
  **假设只有 `hη`（η_μ² = 1）与 `hεb`（ε·k_0 = 0）；x 是任意塔向量，不要求能级齐次；
  n 是任意整数，含 n = 0。**

  证明分两侧，机制不同：

  **下截断（`ddfShifted_apply_eq_zero_of_lt`，不用横向性）。**
  j < n − towerLevelBound x 时先由 `towerVertex_apply_eq_zero_of_lt` 得 V^{(n)}_j x = 0，
  再复合 α^ε_j。`towerVertex_apply_eq_zero_of_lt` 逐层归约到
  `Fock.vertexOsc_apply_eq_zero_of_levelBound_lt`：`vertexOsc η c K` 把能级恰好升高 K
  （`Fock.vertexOsc_mem_levelSubmodule`），而 `Fock.levelBound P + K < 0` 时目标能级为负，
  能级为负的子模是零。塔上的指标移位 K ↦ K − n 由 `towerVertex` 的定义
  （`towerShift n ∘ towerDiag (fun _ => Fock.vertexOsc η (n·b) (K − n))`）吸收。

  **上截断（`ddfShifted_apply_eq_zero_of_gt`，这里才用横向性）。**
  横向性 `hεb` 给 `towerModeVec_mul_towerVertex_of_transverse`：
  α^ε_p ∘ V^{(n)}_K = V^{(n)}_K ∘ α^ε_p 对**所有** p（**含 p = 0**）。
  这一条的上游是 `lie_towerModeVec_towerVertex`：⁅α^ε_p, V^{(n)}_K⁆ = n (ε·k_0) V^{(n)}_{K−p}，
  横向时右端为零。把 α^ε_j 移到右边后，j > towerModeBound x 时
  `towerModeVec_apply_eq_zero_of_lt` 给 α^ε_j x = 0。
  ⚠ 塔上的 p = 0 情形**必须**靠 `towerShift`：单个 Fock 空间上 [α^μ_0, V_K] 恒为零
  （零模是标量），塔上才有正确的动量记账。

  **合并**（`ddfSummand_eq_ddfShifted` 把 `ddfSummand n j` 写成 `ddfShifted n 0 j`，
  再对 j 落在窗口哪一侧分情形）即得目标。

  **组装到算子（本卡陈述的后两句）**：
  `ddfOp η a b ε hη hεb n = lsumLocFin (fun j => ddfSummand η a b ε n j) (ddfWindow n) (…)`
  ——第三个参数就是上面这条定理，所以横向性是 `ddfOp` 的**定义参数**；
  `ddfOp_apply` 给出「任何满足『窗口外为零』的有限集 s 都算得对」，
  即本卡「可以用任何包含 W(n, x) 的有限指标集来计算」那一句。
gaps:
  - |
    **本推导只覆盖本卡陈述的内容，不覆盖它与文献的接口**：文献把 A^i_n 写成围道积分
    ∮ (dz/2πi) ∂X^i e^{i n k_0·X}；本图（v6）与 Lean 都用模态和。两者相同这件事
    是 worldsheet.ddf-operators-v6 的 notes 里登记的 **open 缺口**
    （本图最接近的 worldsheet.ope-pole-mode-commutator-dictionary 是形式分布版且 effective = open）。
    按 lead 2026-09-11 裁决，该字典不写进任何陈述，故不压低本推导；
    **但把本卡结论回译成文献陈述的下游（ms.no-ghost-theorem 的回译审计）必须显式引用它。**
  - |
    **必要性方向（ε·k_0 ≠ 0 ⟹ 和不局部有限）未证**。Lean 有
    `lie_towerModeVec_towerVertex`（⁅α^ε_p, V^{(n)}_K⁆ = n (ε·k_0) V^{(n)}_{K−p}），
    这是必要性论证的关键一步，但「余项对无穷多个 m 都非零」还需要 n ≠ 0 与 V^{(n)}_0 x ≠ 0，
    两者 Lean 侧都没有。本卡的【明确不断言】(a) 已排除该方向。
  - |
    **本卡陈述里的 M(x) ≤ L(x) 未在 Lean 中具名**（因此本卡不把 v1 的窗口 n − N ≤ m ≤ N
    写进陈述，只在 notes 里说明它是推论）。这是一行初等观察（指标 r 的振子至少贡献能级 r），
    但按项目规矩不写成"已形式化"。
  - |
    **一般交换环，无实结构**：R 只是 Q-代数，η 只满足 η_μ² = 1。
    「存在类光 k_0 使 k_0·p ≠ 0」在一般 R 上为假，故本推导（与 v6）都只把
    k_0² = 0、2α' k_0·p = 1 当给定数据。要谈可满足性需 R = R 与洛伦兹锥，是独立待办。
  - |
    **k_0·p = 0 的扇区（含 p = 0）不在覆盖范围内**：那里 v6 的 (S) 不可满足。
    ⚠ 但注意本推导本身**并不使用** (S)，所以严格地说 Lean 的局部有限性在该扇区照样成立；
    受限的是 v6 定义卡的适用范围，不是本推导的论证。
