id: worldsheet.disk-conformal-killing-group--via-real-mobius-subgroup
target: worldsheet.disk-conformal-killing-group
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.sphere-conformal-killing-group
    note: |
      提供母群：D₂ 的 CKV 是 S₂ 的 CKV 中与认同 z ∼ 1/z̄ 相容的子集，
      所以先要有 δz = a₀ + a₁z + a₂z² 与 PSL(2,C)。同出第 6 章，不标 inferred。
  - id: worldsheet.tree-level-worldsheet-topologies
    note: 提供 D₂ = S₂/(z ∼ 1/z̄) ≅ 上半平面 H 这一实现，本推导的「相容性」条件就是对它写的。
  - id: math.mobius-group-sharply-three-transitive
    note: |
      提供 (2) 的两半：PSL(2,R) 在同循环序的边界三点组上单可迁（故三点可固定且固定方式唯一），
      以及它保持 ∂H 的循环序（故两种循环序是两条轨道）。
      ⚠ 该数学节点本身在本图中只有 physical-argument 级的论证（无文献来源），见其 gaps。
