      提供 (2) 的两半：PSL(2,R) 在同循环序的边界三点组上单可迁（故三点可固定且固定方式唯一），
      以及它保持 ∂H 的循环序（故两种循环序是两条轨道）。
      ⚠ **2026-09-11 更新**：该数学节点的推导 --via-cross-ratio 现为 `rigorous`
