    loc: "§6.4 开头, **p. 178**：D₂ 表为上半平面、边界坐标 y 实；无模；用 CKG PSL(2,R) 把三个顶点算子固定到边界上任意位置；**该群不改变循环序**，故须对两种排序求和。**无式号**"
    note: |
      **★ 2026-09-11 订正（curator-ckg-followups），两处：**
      (1) **页码**：§6.4 开头在书上 **p. 178**，不是原先写的「p.179 附近」；
