          即对伴读者 L1、对原书 L3。researcher 取到原书 ch.6 页图后，本条现为
          **原书 L1 逐字**（literature/extractions/math-sources.md §39.8(C)；
          Cambridge Core ch.6 PDF，PDF 页 = 书页 − 165）。原文逐字：
          「We represent the disk as the upper half-plane so the boundary coordinate y is real.
          There are no moduli. After fixing the metric, the CKG PSL(2,R) can be used to fix the
          three vertex operators to arbitrary positions y₁, y₂, y₃ on the boundary, except that
          this group **does not change the cyclic ordering** of the vertex operators so we must
          sum over the two orderings.」
      **本条无式号**（原书此处确实不带式号），与抽取记录 §7 的记载一致。
      ⚠ 原书只说 "arbitrary positions"，**没有说「唯一」**；唯一性由
      math.mobius-group-sharply-three-transitive（单可迁）承载，本推导已挂该依赖。
  - ref: polchinski-1998-v1
    loc: "§6.4, eq. (6.4.2)：三 tachyon 开弦振幅中显式出现的「+ ⟨k₂ ↔ k₃⟩」项"
    note: |
      抽取记录 #E97，L1。本推导用它作为「两种循环序不被 PSL(2,R) 联系」的**书内旁证**：
      若两者等价则不会有这一项。⚠ 这是 curator 的推理，不是原书的论证。
  - ref: schrans-2020
    loc: "§6.27（笔记 p.299）与图 6.7（核对源）"
  - ref: milicic-riemann-surfaces
    loc: "Theorem 1.7.3, p.10（Aut(D(0,1)) 是 SU(1,1) 的满同态像，核 {±I}）+ §1.9, p.11 的**无编号**正文句（Ψ : SL(2,R) → SU(1,1) 是群同构）"
    note: |
      **数学侧可选补强（2026-09-11 由 curator-ckg-followups 补），L1 逐字**（math-sources.md §39.7.1）。
      Theorem 1.7.3 原文：「The homomorphism γ ⟼ φ₀ ∘ φ_γ ∘ φ₀⁻¹ is a surjective homomorphism of
      SU(1,1) onto the group of all holomorphic automorphisms Aut(D(0,1)) of D(0,1).
      The kernel of this homomorphism is {±I}.」
      §1.9 (p.11) 原文：「Therefore, Ψ : SL(2,R) ⟶ SU(1,1) is a group isomorphism.」
      （Ψ(S) = TST⁻¹，T = (1/√2)·[[1, i],[i, 1]]。）
      ⚠⚠ **「Aut(D) = PSL(2,R)」在这份讲义里没有单一编号**：它是 Theorem 1.7.3 与 §1.9 两处合成。
      引用时**要么写这两处、要么只引 SU(1,1) 版**，不得凭空写成某一条定理。
      ⚠ **本条不承载本推导的任何一步**：本推导走 Polchinski 的「取 S₂ 的相容子群」路线，
      只需要 PSL(2,R) ⊆ CKG(D₂)，**不需要**穷尽性；目标陈述也不断言穷尽性。
      登记它是为了给日后的 --via-automorphism-group 路线留接口，并与球面侧的 Theorem 1.5.2 对称。
      ⚠ 该文件未印年份，bib key 不带年份（`milicic-riemann-surfaces`），
      偏离 literature/CLAUDE.md 的 key 规范，待 lead 裁决。
summary: |
  **(1) 取相容子群。** D₂ = S₂/(z ∼ 1/z̄)。一个 S₂ 上的 CKV 下降到商空间，
  当且仅当它与该认同对易；等价地，把它写在上半平面模型上，要求它切于边界（不把边界点移出实轴），
  即 δz|_{z ∈ R} 取实值。代入 δz = a₀ + a₁z + a₂z²，令 z ∈ R 取三个不同实值，
  得 a₀, a₁, a₂ 全为实。故实参数由 6 降为 3，κ(D₂) = 3；
  指数化得到实系数 Möbius 变换群 PSL(2,R)，它保持 Im z 的符号，故保持 H。

  **(2) 三点固定与循环序。** 由 math.mobius-group-sharply-three-transitive：
  PSL(2,R) 在「∂H 上按同一循环序排列的三元组」集合上单可迁，
  于是三个边界坐标可以（且只能以唯一方式）被固定到指定值——这就是振幅里「用 CKG 固定三点」的操作；
  同时 PSL(2,R) ⊂ 保定向自同构群，在 ∂H ≅ S¹ 上保持循环序，
  故 (y₁,y₂,y₃) 与 (y₁,y₃,y₂) 落在两条不同轨道上，振幅必须对两者求和。

  **与 Riemann–Roch 的对照（不作为本推导的依据）**：χ(D₂) = 1、μ = 0 时 κ = 3χ + μ = 3，与 (1) 一致。
gaps:
  - "**★ 已结案，不再是 gap（2026-09-11，curator-ckg-followups，依 math-sources.md §39.8(C)）。**
     原记录：「[S] 的逐字句子说两种排法『are linked by a PSL(2,R) transformation』，与本推导相反，
     须有原书者核对 §6.4 开头的原文措辞。」
     **裁定结果：原书站本推导这一边。** 书上 **p. 178** 逐字写
     「this group **does not change the cyclic ordering** of the vertex operators so we must sum
     over the two orderings」。⇒ 本推导当初的选择正确，**[S] §6.27 那句是伴读者的错误**
     （建议进 [[lit-polchinski-v1-equation-anchors]] 的「[S] 已确证的错误」清单）。
     两条原依据的现状：(a)「PSL(2,R) 保定向 ⇒ 保循环序」现有原书正文背书，
     且其数学承载 math.mobius-group-sharply-three-transitive--via-cross-ratio 已是 rigorous
     （reviewer-ch6 复核）；(b) (6.4.2) 的「+ ⟨k₂↔k₃⟩」项仍是有效的书内旁证。
     **残余项**：原书说的是 'arbitrary positions'，**没有说唯一**，见 sources 第一条的末尾警告。"
  - "**Riemann–Roch 路线仍未接（2026-09-11 更新）**：原记录写「上游 ch5 节点尚未进入 main」——
     ch5 节点现已在 main（worldsheet.riemann-roch-kappa-minus-mu），故这半句作废。
     但 summary 末段**仍只作对照、不建边**，理由变了：
     (i) 该 RR 卡正在被另一名 curator 换代为 -v2（限可定向曲面），换代未落地前接边会指向旧 id；
     (ii) 更实质的是 **μ(D₂) = 0 那一半在图上仍是断言**
     （见 worldsheet.positive-euler-number-no-moduli--via-surface-enumeration 的 gaps 第二条），
     用 κ = 3χ + μ 反推 κ = 3 需要先有 μ = 0，否则只是把断言搬家。
     ⇒ **待办**：换代落地、且 μ(D₂) = 0 接上
     math.no-holomorphic-quadratic-differentials-on-sphere-and-disk 之后，
     由 lead 派单补一条 --via-riemann-roch 的独立推导。"
  - "**「CKV 下降到商空间 ⟺ 切于边界」这一步未严格化**：本推导用的是『向量场与对合 z ↦ 1/z̄ 对易』
     的直观版本；严格处理需要在带边曲面上定义共形 Killing 方程的边界条件（第 5 章 E73/E74 的
     带边推广），本图与来源都没有。"
  - "**PSL(2,R) 记号的书内位置（2026-09-11 更新）**：原「未核实」的说法已作废。
     researcher 取到原书 ch.6 页图后确认，该记号在原书出现于**两处、均无式号**：
     **p. 168**（§6.1「The disk」，(6.1.8) 之后，「…which is PSL(2,R), the Möbius group with real
     parameters」）与 **p. 178**（§6.4 开头，本推导第一条 source 的逐字引文）。两处 loc 均已写死
     （p.168 那条登记在目标陈述 worldsheet.disk-conformal-killing-group 的第一条 source）。
     **残余项**：κ = 3 这个数值在原书 §6.4 开头**没有出现**——researcher 读了 pp.178–181，
     那里只说 there are no moduli，不给 κ；κ = 3 的书内位置是 §5.2 的 (5.2.11a)（p.152），
     该 loc 登记在目标陈述上。本推导对 κ = 3 走的是自己的计数（实系数 a₀,a₁,a₂），不引式号。"
  - "本推导只谈共形 Killing 群，**不**谈无取向弦的额外投影（RP₂、Ω），那在 spectrum.unoriented-* 诸节点。"
notes: |
  **升级到 rigorous 的条件（★ 2026-09-11 更新，curator-ckg-followups）。** 原记录列了三件事，现状是：
  - **(a) math.mobius-group-sharply-three-transitive 取得数学文献来源 —— 部分办掉。**
    该卡现挂了 milicic-riemann-surfaces 的 Theorem 1.5.2，且其推导 --via-cross-ratio 已是
    `rigorous`（reviewer-ch6 复核，初等可复核例外）。⚠ 但 Miličić 那条覆盖的是 Aut(P¹)，
    **单可迁性与循环序两轨道本身仍无带编号的数学来源**。
  - **(b)「CKV 下降到带边商空间」这一步有节点承载 —— 仍未办**（见 gaps 第三条）。
    这是本推导现在最实质的缺口：本图的 μ/κ 定义写在紧无边曲面上，带边时 P₁ 的边界条件无来源。
  - **(c) 文献歧义由原书裁定 —— 已办**，见 gaps 第一条与 sources 第一条的逐字引文。
  ⇒ **当前瓶颈是 (b)，其次是 (a) 的残余项。**

  **数学侧的可选补强（本轮登记，但不承载本推导）**：milicic-riemann-surfaces 的
  Theorem 1.7.3 + §1.9 给出 Aut(D) ≅ SU(1,1)/{±I} ≅ PSL(2,R)，即 PSL(2,R) **穷尽**圆盘的
  全纯自同构。本推导走的是 Polchinski 的「从 S₂ 取相容子群」路线，**不**需要穷尽性，
  目标陈述也不断言穷尽性；登记它是为了日后可能新建的 --via-automorphism-group 路线
  （与球面侧的同名推导对偶）。⚠ 若要建那条路线，必须先解决「Aut(D) = PSL(2,R) 在该讲义里
  没有单一编号」这个问题（要么写两处 loc，要么只写 SU(1,1) 版）。
