summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/PhysicalStates.lean 的
  `Grading` 与 `Phys` 两节。逐条对应：

  **(1) 物理态的 level 分量仍是物理态**（`levelComponent_mem_physSubmodule`；
  双向版 `mem_physSubmodule_iff_levelComponent`）。设 ψ ∈ H_phys，即 L_0ψ = a·ψ 且
  L_nψ = 0 (n > 0)。对 P_N ψ 验两件事：
    · L_0 部分：由 `levelComponent_Lop`（取 n = 0，故 N' = N）得
      L_0 (P_N ψ) = P_N (L_0 ψ) = P_N (a·ψ) = a·(P_N ψ)（末步用 P_N 的 R-线性）。
    · n > 0 部分：分两种情形。若 N < n，则 `Lop_apply_eq_zero_of_level_lt` 直接给
      L_n (P_N ψ) = 0（level N 的向量被指标大于 N 的 L_n 湮灭）。
      若 n ≤ N，则由 `levelComponent_Lop`（取 N' = (N − n)）得
      L_n (P_N ψ) = P_{N−n} (L_n ψ) = P_{N−n} 0 = 0。
  反方向（每个分量物理 ⇒ ψ 物理）由 `sum_levelComponent`（ψ 是其分量的有限和）
  与 H_phys 是子模（`Submodule.sum_mem`）立得。

  **(2) H_phys = ⨆_N (H_phys ⊓ F_N)**（`physSubmodule_eq_iSup_inf_levelSubmodule`）。
  两个包含：
    · ⊇：每个 H_phys ⊓ F_N ≤ H_phys（`inf_le_left`），故上确界 ≤ H_phys。
    · ⊆：给定 ψ ∈ H_phys，用 `sum_levelComponent` 写 ψ = Σ_N P_N ψ（有限和，
      求和集是 ψ.support 在 level 下的像）；每一项由第 (1) 条落在 H_phys 里、
      由 `levelComponent_mem` 落在 F_N 里，故落在 H_phys ⊓ F_N ≤ ⨆；
      再用 `Submodule.sum_mem` 收尾。
  **这一步只给出 ⨆（生成），没有给出内直和**：见陈述边界 (a) 与 gaps (i)。

  **(3) level N 上的物理态条件**（`sub_intercept_apply_of_mem_levelSubmodule`
  → `mem_physSubmodule_iff_of_mem_levelSubmodule` → `mem_physSubmodule_inf_levelSubmodule_iff`）。
  第一条把 worldsheet.open-string-l0-equals-level-plus-mass 的
  `Lop_zero_apply_of_mem_levelSubmodule` 代入 (L_0 − a₀·id)，在 ψ ∈ F_N 上得
    (L_0 − a₀·id) ψ = (½ · zeroModeSq η a + N − a₀) • ψ,
  其中 `invTwo R * zeroModeSq η a` 就是 α'k²（Sugawara.lean 的零模约定）。
  于是 L_0 条件 L_0ψ = a₀·ψ 与标量条件 (α'k² + N − a₀)•ψ = 0 互推
  （`sub_eq_zero`），n ≥ 1 的条件原样保留；再与 `Submodule.mem_inf` 拼成
  `mem_physSubmodule_inf_levelSubmodule_iff`，即陈述第 (3) 条逐字。
  本条需要假设 hη : ∀ μ, η μ * η μ = 1（经由上述 L_0 引理传入）。

  **(4) 非零物理态强迫质量壳**（`massShell_of_mem_physSubmodule`，假设 `[NoZeroDivisors R]`）。
  由第 (3) 条得 (α'k² + N − a₀) • ψ = 0。取 ψ 的一个非零系数 coeff d ψ ≠ 0
  （ψ ≠ 0 时存在，否则 `MvPolynomial.ext` 给 ψ = 0），对该系数取值得
  (α'k² + N − a₀) · coeff d ψ = 0；R 无零因子且 coeff d ψ ≠ 0 故第一个因子为零，
  即 α'k² + N = a₀。与 conv.metric-mostly-plus 的 k² = −m² 合起来就是 α'm² = N − a。
gaps:
  - |
    (i) **level 分解是 ⨆ 而非 DirectSum**（PhysicalStates.lean 文件头 gap 1）。
    `physSubmodule_eq_iSup_inf_levelSubmodule` 只给出「H_phys 由它的 level 片生成」，
    「该上确界是内直和」未被打包成 `DirectSum.IsInternal`
    （根源是 Fock.lean 没有给 Fock 空间本身提供该结构）。
    数学上直性是显然的（多项式环的加权齐次分解），但**未形式化**，
    故陈述第 (2) 条只写 ⨆。任何要用「逐 level **唯一**分解」的下游必须先补这一条。
  - |
    (ii) **逐动量扇区、代数版、对角 η、R 为交换 ℚ-代数**：继承
    worldsheet.bosonic-fock-space 的缺口与 Sugawara.lean 的零模缺口。
    k 只以标量参数 a^μ = (2α')^{1/2} k^μ 出现，没有位置算符 x^μ，没有对 k 的直积分；
    η 必须对角，且第 (3)(4) 条另需 η^{μμ}η_{μμ} = 1；Fock 空间是多项式代数（未完化）。
  - |
    (iii) **两种 L_m 定义未被证明等同**（继承 worldsheet.virasoro-generators-free-boson
    的缺口）。Lean 覆盖的是振子双线性 + 产生-湮灭正规序的 Sugawara 型 L_m；
    文献里同一批 L_n 也常由全纯 T 的 Laurent 模（共形正规序）定义，
    两者在本图与 Lean 里都没有被证明给出同一组算子。
  - |
    (iv) **level N 不是数算符的本征值（在 Lean 里）**。N 自始至终是加权齐次次数；
    「N = Σ_{n≥1} α_{−n}·α_n 的本征值」是标准事实但未单列节点、未形式化。
    继承 worldsheet.open-string-l0-equals-level-plus-mass 的边界 (b)。
  - |
    (v) **不给出维数与配分函数**。F_N 有限生成（`Fock.levelSubmodule_fg`）已在
    worldsheet.bosonic-fock-space 里，但 dim (H_phys ⊓ F_N) 的计数（横向自由度、
    p(N) 型公式）既不在本推导也不在图中其他节点。
  - |
    (vi) **文献侧无逐字对应**。第 (1)(2) 条在 Polchinski / GSW 里是隐含的标准做法
    （L_0 与 N 对易、L_n 移动 level），不是成文定理；本推导的陈述是按 Lean 定理
    规范化出来的。第 (3)(4) 条在 N = 1 处有已核实的 (4.1.16) 对应，一般 N 无逐字核实。
notes: |
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
