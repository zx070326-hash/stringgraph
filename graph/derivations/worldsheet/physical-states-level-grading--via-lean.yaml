  自动化公理检查脚本（formal/TODO.md 的 scripts/check_axioms.lean）仍未做。

  【记号换算】Lean 用 `a₀ : R` 表示截距、`a : Fin D → R` 表示零模参数；
  本图的陈述里截距写 a、零模写 α_0，与 conv.intercept-sign-a、conv.alpha-prime-regge 一致。

  本推导由 curator 于 2026-09-11 建立，与 worldsheet.open-string-intercept 的换代
  （→ worldsheet.open-string-intercept-v2）同批：拆卡把「质量公式」从「a = 1」里分出来，
  本卡则把「质量公式的逐 level 版本」补成一条独立的 formalized 命题，
  两件事合起来使 α'm² = N − a 不再被 physical-argument 的截距断言封顶。
