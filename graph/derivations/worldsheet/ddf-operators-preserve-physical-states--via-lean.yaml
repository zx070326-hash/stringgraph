summary: |
  机器检查的证明，两行，全部在 formal/StringFormal/NoGhost/DDFOperatorAll.lean。

  **第 1 步：质壳条件（`ddfOp_mem_towerL0Submodule`）。**
  设 L_0 Ψ = a₀ • Ψ。把 `lie_towerLop_ddfOp … 0 n`（即 ⁅L_0, A^ε_n⁆ = 0，
  **这正是 m = 0 那一支买到的东西**）作用在 Ψ 上展开得 L_0(A^ε_n Ψ) = A^ε_n(L_0 Ψ)，
  再代入假设与 `map_smul`：
    L_0 (A^ε_n Ψ) = A^ε_n (a₀ • Ψ) = a₀ • (A^ε_n Ψ)。
  **截距 a₀ 逐字不变**，因为它就在等式两边同一个位置上。

  **第 2 步：正模条件（`ddfOp_mem_towerPositiveModeSubmodule`，TowerPhysical.lean）。**
  对 m ≥ 1：L_m(A^ε_n Ψ) = A^ε_n(L_m Ψ) + ⁅L_m, A^ε_n⁆Ψ = 0 + 0 = 0。
  这一半在 m ≠ 0 时代就已经有了（图中弱节点
  worldsheet.ddf-operators-preserve-positive-mode-conditions）。

  **合并**（`ddfOp_mem_towerPhysSubmodule`）：`towerPhysSubmodule = towerL0Submodule ⊓
  towerPositiveModeSubmodule`，故 `Submodule.mem_inf` 两行拼起来即得。

  **为什么 a₀ 不需要随层改（本卡陈述里那一句的机器验证依据）。**
  塔上的 L_0 在第 j 层用该层动量 p_j = p + j k_0；在 (N) k_0² = 0、(S) 2α' k_0·p = 1 下
  `invTwo_mul_zeroModeSq_towerMomentum` 给 α' p_j² = α' p² + j，故第 j 层能级 N 处的
  L_0 本征值是 α' p² + j + N。A^ε_n 把层 +n、能级 −n，
  `invTwo_zeroModeSq_towerMomentum_add_shift_cancel` 逐字说这两个移位在该本征值中相消
  （TowerPhysical.lean 文件头逐字：「the eigenvalue becomes
  `α' k² + (j' + n) + (N - n) = α' k² + j' + N`: **unchanged**, and independently of the
  summation index `j`」）。
  ⚠ 这条记账**不进入**第 1 步的证明（第 1 步只用括号），它解释的是**为什么** ⁅L_0, A^ε_n⁆ = 0
  这件事在物理上说得通，以及为什么不需要「逐层不同的截距」这种额外约定。
gaps:
  - |
    **只给包含，不给张成**。本推导完全不涉及「塔上任意物理态 = DDF 态 + 零模态」，
    那是无鬼定理的困难一半（formal/TODO.md 的 `ddf-spans` 项，未做）。
    ⚠ 文献（goddard-2008 (5.4) 引出句、GSW §2.3.3）把「保持」与「生成物理态」写在同一句话里，
    回译时**不要**把本卡读成后者。
  - |
    **塔上的物理子模与单个 Fock 空间上的 `Fock.physSubmodule` 之间没有承载节点。**
    本推导用的是 `towerPhysSubmodule`（TowerPhysical.lean 定义，两条条件逐层装上），
    依赖边指向 worldsheet.old-covariant-physical-states 是取其**条件的内容**，
    不是取其单 Fock 的实现。二者的关系在 TowerPhysical.lean 文件头有逐字说明，
    但本图没有一张卡断言它。auditor 回译时应按塔上的陈述读本卡。
  - |
    **本推导继承 worldsheet.ddf-commute-with-virasoro--via-lean 的全部前提与缺口**，
    特别是：本图的 A^ε_n 是 v6 的**模态和**，与文献的**围道积分** A^i_n 是同一个算子这件事
    只有 physical-argument 级承载（worldsheet.ddf-contour-equals-mode-sum）。
    凡要把本结论回译成文献陈述的下游必须显式引用那条缺口。
  - |
    **一般交换 Q-代数，无实结构、无正定性**。本卡与 H_phys 上的内积、幺正性、
    模的正定性全无关系；a₀ 是任意环元素，本推导不涉及 a₀ = 1。
    k_0·p = 0 的扇区（含 p = 0）不在覆盖范围内。
  - |
    **不断言 A^ε_n Ψ ≠ 0**。Lean 的结论是子模包含，允许像为零。
    「DDF 态非平凡」在本图与 Lean 中均无节点。
