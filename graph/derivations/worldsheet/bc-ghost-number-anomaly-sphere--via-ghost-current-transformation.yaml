summary: |
  **(1) 反常变换。** 鬼数流 j 在坐标变换下不按权 1 的张量变换，λ = 2 的情形为
    (∂_z u) j_u(u) = j_z(z) + (3/2) (∂²_z u)/(∂_z u)。
  这条来自 bc 系统的背景荷（j 的 OPE 中 T(z)j(0) 有三阶极点）。

  **(2) 代入 u = 1/z。** ∂_z u = −z^{−2}，∂²_z u = 2z^{−3}，故
    (3/2)(∂²_z u)/(∂_z u) = (3/2)·(2z^{−3})/(−z^{−2}) = −3/z。
  即两片上的鬼流相差一个 −3/z 的项。

  **(3) 围道积分。** 鬼数由 ∮ (dz/2πi) j(z) 给出。z 片上绕原点的围道与 u 片上绕 u = 0
  （即 z = ∞）的围道之差，正是 (2) 中 −3/z 项的留数，绝对值为 **3**。
  于是「z = 0 附近算出的鬼数」与「z = ∞ 附近算出的鬼数」相差 3：
  球面上鬼数不守恒 3 个单位（每个手征部门），非零期望值必须多带 3 个 c（gh(c) = +1）。
  反全纯部门同理，合计 6，与 κ(S₂) = 6 一致。
