id: worldsheet.ddf-contour-equals-mode-sum--via-voa-residue
target: worldsheet.ddf-contour-equals-mode-sum
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower
    inferred: false
    note: |
      提供 VOA 作用的空间与两个场的作用域：动量塔 T(p;k_0) = ⊕_j F(p+jk_0) 是
      Heisenberg 顶点代数 V_(𝔥, Z k) 的（不可约）模（Li–Wang Theorem 3.6 / Def 3.5 Condition C_L）；
      整性条件 (I) ⟨k, p̃⟩ = 2α'(k_0·p) ∈ Z 给出顶点算子模的整数指标，
      取 (★) 2α' k_0·p = 1 即本卡的归一化。
      本推导「逐项相乘后逐向量有限」所用的场公理（GN 正规性公理 (2.32) /
      Schottenloher Def 10.12）也在这张卡建立的框架里。
      ⚠ 这条边**只**承载上述结构；「物理 :e: = VOA 𝒴(e)」那条字典**不**在这张卡里
      （其边界 (N6) 逐字排除），已单列为下一条依赖。
  - id: worldsheet.physical-exponential-equals-voa-vertex-operator
    inferred: false
    note: |
      **本推导与文献之间那条实质字典，2026-09-15 由 inferred flag 提升为显式节点。**
      断言：在类光动量塔上 :e^{i n k_0·X(z)}: = 𝒴(e^{n k_0}, z)
      （秩 1 类光 ⟹ 扭群 2-cocycle ε(mk,nk) = 1，c_{n k_0} = 1）。
      本推导第 0 步把物理对象接入 VOA 框架**全靠这一条**：
      GN (3.2)–(3.3) 的留数演算是对 𝒴(e^{mk}, z) 说的，而本卡断言的左端
      (1/2πi)∮ ε·P(z) V(n k_0, z) dz 里的 V 是物理正规序指数。
      该节点 effective = physical-argument（cocycle 平凡有 GN (3.1) 逐字来源，
      但两套算子的识别无任何来源逐字断言，且跨连续动量↔离散格、δ-归一化两条接缝）。
      **本推导的 effective 因此诚实地落到 physical-argument**，见 notes。
  - id: worldsheet.ddf-transversality-gives-local-finiteness-v2
    inferred: false
    note: |
      横向性 ε·k_0 = 0 使模态和 Σ_m α^ε_m V^{(n)}_m 在塔上逐向量有限，
      即右端作为线性算子有定义。同一横向性在 VOA 侧使 ξ(z) 与 𝒴(e^{mk},z) 无奇异 OPE
      （GN (3.3) 逐字：「normal ordering … unnecessary due to ξ·k = 0」），
      对应 Schottenloher Thm 10.10 N=0 的无奇异条件——两副面孔，同一前提。
  - id: worldsheet.exponential-vertex-operator-modes
    inferred: false
    note: |
      等式**右端**的对象 V^{(n)}_K：本卡（z^K-系数约定）把它定义为 E₋E₊ 的卷积。
      **本推导要证的正是「Res 积 = 这个卷积」**，故本卡的 V^{(n)}_K 与 VOA 侧的
      Y(ξ(−1)e^{mk},z) 的零模（Bakalov–Kac (2.22)）是同一个对象的两套定义。
      见下方唯一 inferred 边：这两套定义的等同仍是本项目推断。
  - id: worldsheet.ddf-operators-v6
    inferred: false
    note: |
      等式右端的算子 A^ε_n = Σ_m α^ε_m V^{(n)}_m 与 (T)(N)(S) 三个条件、z^K-系数约定。
      本推导证明的等价即「文献的 A^i_n = v6 的 A^ε_n」。v6 的定义是收敛侧，
      不需要额外的 inferred 论证；inferred 的那条在下面（物理 :e: ↔ VOA 𝒴(e)）。
  - id: worldsheet.momentum-tower-fock-space
    inferred: false
    note: |
      塔与零模移位 e^{i n k_0·x}：VOA 侧的 𝒴(e^{nk},z) 的零模给出移位 j ↦ j+n，
      与塔上 F(p+jk_0) → F(p+(j+n)k_0) 的移位一致；整数指标由 2α' k_0·p = 1 给出。
sources:
  - ref: gebert-nicolai-1995
    loc: "§3.1 'DDF vertex operators', 刊 p.593, eq. (3.2)–(3.3)"
    note: |
      **本推导最核心的直接源。L1↩（gsw-1987-v1.md §4 E15，标「[L1 已核实]」；本轮未重开
      pure.mpg.de/rest/items/item_153125_1/component/file_153124/content 读刊 p.593 复核）。**
      (3.2) 定义横向 DDF 算子为零模：A^ξ_m := (ξ(−1)e^{mk})_0；
      (3.3) 等号链：= Res_z[𝒴(ξ(−1)e^{mk},z)] = Res_z[ξ(z)𝒴(e^{mk},z)]；
      正文续：「where normal ordering in the last line is unnecessary due to ξ·k = 0」。
      这三行直接承载本卡断言：围道/Res = 零模 = 卷积模态和，横向性为无奇异条件。
      (3.1) 给 ε(mk,nk)=1（类光秩 1 ⟹ cocycle 平凡），支持上方 inferred 桥的合理性。
      另（2.16)/(2.17) 给模=留数的基本定义；(2.32) 正规性公理给局部有限性。
  - ref: schottenloher-2008
    loc: "Ch. 10, Def 10.1 (p.173), Def 10.9 (p.178), Thm 10.10 第 1/4 条 (p.178, N=0 时)"
    note: |
      **形式留数演算的数学基础。L1↩（math-sources.md §11、§11A）。**
      Def 10.1：Res_z A(z) = A_{−1}（留数 = 负一次系数，tautology 级严格）。
      Def 10.9：正规序积 :A(z)B(w): = A(z)_+ B(w) + B(w)A(z)_-；给出模式卷积公式。
      Thm 10.10（取 N=0，即无奇异项）：A(z)B(w) = :A(z)B(w):（普通积=正规序积），
      这正是「横向性 ⟹ 同点乘积=正规序积 ⟹ 留数提取合法」的数学断言。
      ⚠ 印本 Thm 10.10 第 5 条求和下限印作 j=1，已裁定为排印错误（正确 j=0）；
      本推导只用第 1/4 条（局域性等价于 N=0 无奇异），不受影响。
  - ref: bakalov-kac-2004
    loc: "(2.22), p.9"
    note: |
      **把「零模」翻回「模态卷积和」的来源。L1↩（math-sources.md §37.4(a)）。**
      (2.22) 逐字：Y(a,w)_{(n)}Y(b,w) = Y(a_{(n)}b, w)；取 n=−1 即
      Y(ξ(−1)e^{mk},w) = Y(ξ(−1),w)_{(−1)}Y(e^{mk},w) = :ξ(w)𝒴(e^{mk},w):。
      取 Res_w 后即零模 = 卷积模态和，与 GN (3.2)/(3.3) 的链路一致。
      ⚠ Bakalov–Kac 未逐字写出「模态和」形式；「零模 = Res」逐字写在 GN (3.3)，
      本条作机制来源，GN 作直接源。
summary: |
  本推导沿 Gebert–Nicolai 1995 §3.1 的四步走，逐条说明旧推导 gaps 的处理。

  **第 0 步：把物理对象接入 VOA 框架（显式桥节点）。**
  前提：动量塔 T(p;k_0) 是 Heisenberg 顶点代数 V_{(𝔥,Zk)} 的 VOA 模
  （worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower，rigorous）。
  在此框架里：ξ(z) = 𝒴(ξ(−1),z) 是 Heisenberg 场（= 物理 ε·P(z)）；
  𝒴(e^{mk},z) 是格点顶点算子（= 物理 :e^{imk_0X}: 的 VOA 版本，cocycle c_{mk}=1 由 (3.1) 确认）。
  这一步**全靠显式桥节点** worldsheet.physical-exponential-equals-voa-vertex-operator
  （effective = physical-argument）：GN 的留数演算是对 𝒴(e^{mk},z) 说的，
  而本卡断言左端的 V(n k_0, z) 是物理正规序指数，两者的识别就是那张卡。
  **2026-09-15 重建模**：此步此前是本推导的一条 `inferred: true` 边，
  graph-reviewer 与 lead 裁定那是虚高（见 notes），已提成显式节点。

  **第 1 步：Res_z = 「取 z^{−1} 系数」（严格，tautology 级）。**
  Schottenloher Def 10.1（p.173）逐字定义 Res_z A(z) = A_{−1}，
  即 (1/2πi)∮ A(z)dz = Res_z A(z) 在形式留数意义下恒成立。**旧 gap #2（围道语义）仍保留**：
  若文献意在真实围道积分，则需要算子值函数的收敛性；本推导限定在形式留数读法，与旧推导同。

  **第 2 步：横向性 ε·k_0 = 0 使同点乘积 = 正规序积（gap #4 已收敛）。**
  GN (3.3) 正文逐字：「normal ordering in the last line is unnecessary due to ξ·k = 0」。
  数学机制：横向性 ⟹ ξ(z) 与 𝒴(e^{mk},z) 的 OPE 无奇异项（N=0）⟹ Thm 10.10（N=0）⟹
  普通积 = 正规序积，逐项相乘无正规序处方（Def 10.9）。
  **旧 gap #4「横向性使两因子无缩并……文献未逐字如此说」已被 GN (3.3) 推翻。**
  这是本推导相对旧 physical-argument 推导的最大增量：gap #4 从「本项目推断」升为「有 L1 来源的文献断言」。

  **第 3 步：两场乘积的 Res = 卷积模态和（gap #1 已收敛）。**
  横向性保证同点乘积良定义（第 2 步）；场公理 GN (2.32)（正规性：∀φ, ψ_n φ = 0 for n≫0）
  保证每个幂次的模式卷积 Σ_m A_m B_{K−m} 逐向量有限（局部有限性）。
  Def 10.9 给出卷积公式；Bakalov–Kac (2.22) 确认零模 = 正规序积的分量 = 卷积模态和。
  GN (3.2)/(3.3) 把这个过程逐字写出：Res_z[ξ(z)𝒴(e^{mk},z)] = (ξ(−1)e^{mk})_0 = A^ξ_m。
  **旧 gap #1「重排在算子层面无论证」已收敛**：在 VOA 框架里「重排」就是 Def 10.9 + Thm 10.10(N=0)
  + 场公理 (2.32)，全部带编号定义/定理，全程无收敛性假设（形式级数）。

  **第 4 步：gap #3（:e: = ΣV z^K 未对接）已收敛为显式桥节点。**
  旧 gap #3 说「正规序 :e^{ink_0X}: 的展开 = E₋E₊ 拆分，与 Lean vertexOsc 的对接缺节点」。
  在 VOA 侧这个展开正是 𝒴(e^{nk},z) 的定义（Li–Wang (3.10)）；
  对接缺口收敛为第 0 步的那条桥
  worldsheet.physical-exponential-equals-voa-vertex-operator，不再是独立缺口——
  **但那张卡是 physical-argument，所以这个缺口是「被命名并显式记账」，不是「被消除」。**

  **status 判断（2026-09-15 重建模后）。**
  · **own status 仍是 rigorous**，且这一条未变：本推导第 1–3 步的论证
    （形式留数 = 取 z^{−1} 系数；横向性 ⟹ 无奇异 ⟹ 普通积 = 正规序积；
    正规性公理 ⟹ 卷积逐向量有限；零模 = 卷积模态和）全部落在带编号的定义/定理上
    （Schottenloher Def 10.1/10.9/Thm 10.10(N=0)、Bakalov–Kac (2.22)、GN (2.32)/(3.2)/(3.3)），
    全程形式级数、无收敛性假设。**这些步骤本身确实是严格的。**
  · **effective 是 physical-argument**，因为依赖里有一条 physical-argument 的显式桥
    （worldsheet.physical-exponential-equals-voa-vertex-operator）。
    这**不是**对上述论证的否定，而是「严格的推理作用在一个尚未严格建立的前提上」
    的正确记账方式。
  · **为什么不再用 inferred flag**：graph-reviewer 与 lead 于 2026-09-15 裁定，
    把这条无源的实质识别藏进 inferred flag 是**虚高**——
    tools/stringgraph/propagate.py 的 `_combine_deps` 只看依赖的 effective level，
    两端都 rigorous 时 flag 被忽略，于是它既承重又对 `uv run stringgraph why` 不可见。
    提成节点后它正常沿图传播，`why worldsheet.ddf-contour-equals-mode-sum` 能指名它。
  · **本推导现在没有任何 inferred 边。**

  **保留的真限制**：gap #2（围道语义，形式留数 vs 真实积分）与 gap #6（k_0·p=0 扇区不覆盖）不变。
notes: |
  【2026-09-15 重建模：inferred flag ⟹ 显式桥节点（lead + graph-reviewer 裁决）】
  本推导首版（提交 4f46fde）把「物理 :e^{i n k_0·X(z)}: = VOA 𝒴(e^{n k_0}, z)」
  写成对 worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower 的一条
  `inferred: true` 边，并标 status: rigorous，使目标卡 effective 升为 rigorous。
  **graph-reviewer 与 lead 裁定这是虚高**，理由是工具层面的：
  `tools/stringgraph/propagate.py` 的 `_combine_deps` 只按依赖的 **effective level** 取下界，
  **不读 `inferred` 字段**（`inferred` 只在 validate 的「每条边要有来源」检查与 report 的
  inferred-edge 清单里出现）。于是当依赖两端都是 rigorous 时，inferred flag
  对状态传播**完全无影响**——这条无源的实质识别既承重，又对
  `uv run stringgraph why worldsheet.ddf-contour-equals-mode-sum` 不可见。

  修正办法**不是**降本推导的 own status（第 1–3 步的论证确实严格，降它等于谎报另一个方向），
  而是把那条命题提成显式节点 worldsheet.physical-exponential-equals-voa-vertex-operator
  并给它一条诚实的 physical-argument 推导。结果：
  · 本推导 own = rigorous（不变），effective = physical-argument（由桥节点传播）；
  · 目标卡 worldsheet.ddf-contour-equals-mode-sum 的 effective 回到 physical-argument；
  · `why` 树能**指名**桥节点为瓶颈，旗舰链的回译审计看得见它。

  【一般教训（建议 lead 考虑写进 graph/CLAUDE.md）】
  `inferred: true` 的正确用法是标「**这条边的论证**在来源里找不到，但被依赖的**命题本身**
  是图内已有节点」。若那条边实际携带一条**图外的、尚无节点的实质命题**，
  正确做法是把那条命题立成节点。否则该命题会被 flag 掩盖：
  它既不进 `why` 的瓶颈树，也不进 `status` 的 conjectures 集合。
  本推导首版就是后一种误用的实例。

  【本推导与旧 physical-argument 推导的分工（不变）】
  worldsheet.ddf-contour-equals-mode-sum--via-laurent-coefficient-extraction 保留不动，
  它锚定**文献的围道写法**（goddard-2008 (5.1)–(5.3) 逐字）；
  本推导锚定 **VOA 侧**的 GN (3.2)–(3.3)。两条推导并存，卡的 effective 取 max。
  重建模后两条的 effective 都是 physical-argument，但瓶颈不同：
  旧推导的瓶颈是它自身的 status（重排无严格承载），本推导的瓶颈是桥节点（有源可查的待办）。
  **本推导仍是更有价值的那条**：它把缺口从「五处 gap」收敛成「一条具名命题」。
