summary: |
  **原书的四步（每一步都逐字可核）**：

  1. **写下迹里插入的算符**：无取向 + GSO 的联合投影算符是 **(10.8.15) 的四项形式**
     (1+Ω+Ω²+Ω³)/4（因开超弦上 **Ω² = exp(πiF)**，(10.8.14)），
     展开后本步只需两个迹：含 **Ω** 与含 **Ω exp(πiF)** 的，统一写成 R = Ω exp(πiβF)。
     测度取 dt/**8**t（GSO 与 Ω 各一个 ½）；玻色部门取 Vol.1 (7.4.22) 换到十维（原书逐字）；
     Chan–Paton 给 **±n**（一条边界 ⇒ 一个 CP 迹；SO(n) 给 +n、Sp(k) 给 −n，Vol.1 (7.4.22) 的计数）。
  2. **由周期性读出扇区归属**：(10.8.16) 给 ψ^μ(w + 4πit) = ψ^μ(w − 2π)，于是
     **迹的 R 扇区**里场在 σ² 方向周期 ⇒ 对应 **R–R 交换**；**迹的 NS 扇区**给 NS–NS 交换。
     ⚠⚠ **这条判据与圆柱相反**（圆柱按「迹里是否出现 exp(πiF)」分），Klein 瓶又是第三条。
     原书接着说 'It is slightly easier to focus on the R–R exchange'，故本卡算的是 **R–R 一侧**。
  3. **算两个迹之和**：(10.8.17) 给
     −16q^{1/3}∏[1+(−1)^m q^m]⁸ − (1−1)⁴q^{1/3}∏[1−(−1)^m q^m]⁸ = Z⁰₁(2it)⁴Z¹₀(2it)⁴。
     ⚠ 第二项系数 **(1−1)⁴ = 0**，本推导**不使用**它，也不采用抽取者对它的解读（Q3）。
  4. **换通道并取长柱极限**：合成 (10.8.18) 第一行（'rewriting the bosonic part slightly'）；
     用模变换并令 **s = π/4t** 得第二行；s → ∞ 展开得第三行
     **±2in(2⁵V₁₀/(8π(8π²α')⁵))∫₀^∞ ds[16 + O(e^{−2s})]**，**上号对应 SO(n)**。
     ⚠ **原书在这一步直接写等号**，不重述 (10.8.3)、不写换元过程（见 gaps 第二条）。

  **为什么标 physical-argument（四条，按弱到强排）**：
  (1) **第 1 步的玻色部门是「换维数照搬」**：原书只说 'We have used (7.4.22) in D = 10.'
      与 'rewriting the bosonic part slightly'，**不说** ϑ₀₀η 的组合如何变成 η⁸Z⁰₀⁴
      （那一步的核对是抽取者做的，见 gaps 第三条）；且 Vol.1 那一式自身的 ± 号只有计数、无验证；
  (2) **第 4 步的模变换链原书不写**，本图也未展开；所用的 (10.8.3) 第二式带 **naive** 限定
      （§10.7 (10.7.14)：纯左移费米子的路径积分相位没有 diff 不变的定义）；
  (3) **(10.8.12) 依赖的超弦版 doubling trick (10.2.15) 本图无节点**（见 gaps 第六条）；
  (4) 整个对象是单圈路径积分 / 迹的形式计算。
  ⚠ 本推导里**最硬**的一环是前缀的复算（三个面的公因子，抽取记录 §0.4(b) 已在圆柱与 Klein 瓶
  两条独立换元上闭合），但它**不提升**第 1–3 步。故整体 physical-argument，与另外两张同族卡
  （圆柱、Klein 瓶）口径一致。
