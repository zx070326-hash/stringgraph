notes: |
  ★★【本推导把 tadpole 推导里 Möbius 那一支的悬空合上（curator，2026-09-11，klein-mobius）】
  在此之前 (10.8.16)–(10.8.18) 只活在
  worldsheet.type-i-tadpole-cancellation-so32-v2--via-one-loop-divergences 的 summary 第 (3) 步
  （逐字只有一行「Möbius 带 M₂：Z_{M₂,1} ∝ ±2n·2^5（上号 SO(n)）」）。
  本卡与 worldsheet.superstring-klein-bottle-amplitude-closed-channel 一起，
  把那条推导 gaps 里「Klein 瓶与 Möbius 带两支仍无节点」这一条关闭。

  ★【三条扇区判据各不相同，这是本族卡最容易出错的地方】
  · 圆柱（#E65）：按**迹里是否出现 exp(πiF)** 分——不出现 ⇒ NS–NS，出现 ⇒ R–R；
  · Klein 瓶（#E69）：按**在 σ² → σ² + 4πt 下是否反周期**分——反周期 ⇒ NS–NS
    （权重 Ω exp(πiF) 或 Ω exp(πiF̃) 的两项，且两者相等）；
  · Möbius 带（#E71）：按**迹的 R / NS 扇区**分——**R 扇区 ⇒ R–R 交换**，NS 扇区 ⇒ NS–NS。
  抽取记录在 #E71 特别标注「**注意这与圆柱相反**」。⇒ 三张卡不得互相套用判据。

  ★【本卡给的是 R–R 侧，另外两张给 NS–NS 侧】做 (10.8.19) 的 R–R 求和时：
  圆柱与 Klein 瓶要各自用 Z_{C₂,1} = −Z_{C₂,0}、Z_{K₂,1} = −Z_{K₂,0}（**两条都不在那两张卡的
  断言里**，属 §10.7 的超对称论证），Möbius 则直接用本卡。抽取记录 §0.4(a) 的交叉核验就是这么做的：
  −iK[n² + 2¹⁰ ∓ 2·32·n] = −iK(n ∓ 32)²，K 是三个面的公因子。

  【本推导对 GSO 的记账比圆柱那张卡更贴切】〔2026-09-11 更新，small-backlog-13：**已作废，
  三条推导现在口径一致**〕旧版此处写：圆柱推导把 GSO 的 ½ 挂在 worldsheet.gso-projection
  （**闭弦** IIA/IIB 的 GSO）上并被 reviewer-batch23 改标 inferred；本推导挂的是
  worldsheet.type-i-open-string-gauge-multiplet（**开弦**的 GSO 投影，§10.6 p.30 逐字），
  对象同一，故非 inferred。⇒ 并写下正解逐字：
    「⇒ 若日后为『开弦 GSO 投影』单建一张窄卡，三条推导应一起改指它。」
  ★★★【该正解已落实】本轮新建 **worldsheet.open-superstring-gso-projection**（definition：
  GSO 投影是什么算符、I / Ĩ 两个选择的扇区标号、投影算符 (1 + ε exp(πiF))/2 在迹里给一个 ½），
  并：
    · 本推导从 type-i-open-string-gauge-multiplet 边上**拆出** GSO 那一件，新增一条指向新卡的
      **非 inferred** 边；原边此后只承担 SO(n)/辛群的**候选集**；
    · 圆柱推导那条指向**闭弦** worldsheet.gso-projection 的 **inferred** 边改指新卡并**去 inferred**。
  ⚠ **Klein 瓶那一支不改**：它的 GSO 边指的是 (10.8.7) 的**闭弦**投影算符
    [(1+exp(πiF))/2]·[(1+exp(πiF̃))/2]，对象本来就是闭弦 worldsheet.gso-projection，非 inferred。

