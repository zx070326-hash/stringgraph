summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/LevelTwo.lean 的 `Ghost` 一节。三步：

  1. **动量**（`exists_zeroModeSq_eq_neg_two`，目标第 (1) 条）。在 D ≥ 2 的有序域上显式取
     a^0 = 3/2、a^1 = 1/2、其余分量为 0，用 `Finset.sum_subset` 把
     `zeroModeSq (minkowski D K) a = Σ_μ η^{μμ}(a^μ)²` 的求和缩到 {0,1} 两项，
     再用 `minkowski_timelike`（η^{00} = −1）与 `minkowski_spacelike`（η^{11} = +1）
     得 −9/4 + 1/4 = −2。**用两个分量是必须的**：单分量要求 (a^0)² = 2，在 ℚ 上无解
     （见目标 notes）。

  2. **该动量上的物理态与其模**（目标第 (2) 条）。
     `levelTwoScalar_intercept_one_mem_physSubmodule`：把 s = −2 代入
     worldsheet.ocq-level-two-scalar-norm-closed-form 第 (2) 条的三个条件，
     质量壳 ½(−2) + 2 = 1 = a 成立，(V1) 2 + 2(D−1)/5 + 2(D+4)/10·(−2) = 0 与
     (V2) D + 2(D−1)/5·(−2) + (D+4)/10·(−2) = 0 由 `field_simp; ring` 验证。
     `pairing_levelTwoScalar_intercept_one`：把 s = −2 与两个系数代入该卡第 (1) 条的
     ⟨ψ₂,ψ₂⟩ = 2D + 2s c₂² + 2s²c₃² + 4s c₃，`field_simp; ring` 得 −2(D−26)(D−1)/25。

  3. **拼装**（`exists_mem_physSubmodule_pairing_self_neg`，目标第 (3) 条）。
     由 D > 26 在有序域上得 (D : K) > 26（`exact_mod_cast`），
     故分子 −2(D−26)(D−1) < 0（`nlinarith`）、分母 25 > 0，`div_neg_iff` 给
     ⟨ψ₂,ψ₂⟩ < 0。见证 (b, ψ₂) 即目标的 ∃。
     文件末尾另有一条具体的 `example`：D = 27、K = ℚ 时物理态子空间含鬼。
gaps:
  - |
    (i) 【已关闭 2026-09-11】目标第 (4) 条现由 `exists_mem_physSubmodule_pairing_self_neg'`
    的结论 `b ≠ 0` 逐字覆盖；formalizer 指出 b ≠ 0 只需 zeroModeSq b ≠ 0，不需 D > 26。
  - |
    (ii) **只覆盖 a = 1**。「D > 26 时对任意截距 a 均有负模态」未证，也无可核实的文献来源。
  - |
    (iii) **只给一个见证**。不给负模态的个数、不给能级 N ≥ 3、不给非标量部分。
  - |
    (iv) **需要域与有序结构**。第 (1) 条的动量构造用了除法（3/2、1/2）与序（判负）。
    在一般有序交换环上第 (1) 条可能失败（ℤ 上 −x² + y² = −2 无解），
    故本卡不能直接推广到任意有序环——这与
    worldsheet.fock-indefinite-form--via-lean 的 `pairing_indefinite`（只需有序环）不同。
  - |
    (v) **继承整个形式化岛的缺口**：逐动量扇区（无位置算符 x^μ、无对 k 的直积分）、代数版
    （无完化）、对角 η、R-双线性型而非 Hermitian 半双线性型。
    因此「负模态」是双线性型意义下的 ⟨ψ,ψ⟩ < 0，不是 Hilbert 空间上的负范数。
  - |
    (vi) 【已关闭 2026-09-11】formal/TODO.md 已登记「无 sorry，公理只有标准三条」并附复核命令；
    lead 在合并后于 main 重跑 lake build 与 check-axioms（见 sources note）。
