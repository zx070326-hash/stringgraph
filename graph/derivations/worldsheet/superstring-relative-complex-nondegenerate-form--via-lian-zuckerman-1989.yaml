  - "**D_R* = −D_R 的出处链**：良定义性（步骤 3）与重建（summary 末）都用它。它是 **Proposition 2.10(ii)** 的第一句，同时也是 **Proposition 1.7(iii)**；而 Prop 1.7 的证明大半外包给 [13] = Ohta PRD D33、[15] = Terao–Uehara PLB 168B（E1 逐字），**两篇本图未登记 bib、未读**。⇒ 本推导对这条关键算符恒等式没有可核的独立来源，本图也未为它立卡。"
