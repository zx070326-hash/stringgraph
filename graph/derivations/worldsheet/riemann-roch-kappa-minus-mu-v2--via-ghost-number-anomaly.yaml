summary: |
  把鬼数反常当作**算子方程**，于是路径积分中的鬼数不守恒：
    δ_{g#} ∫[dφ] e^{−S} ∝ ε ∫ d²σ ĝ^{1/2} ∇_a j^a = ε ∫ d²σ ĝ^{1/2} ((1−2λ)/4) R 。
  代 λ = 2 与 χ = (1/4π)∫ d²σ ĝ^{1/2} R，右端 ∝ χ（比例常数在本路线不被算出）。
  另一方面，(5.3.9) 中 b 插入有 μ 个、c 插入有 κ 个，鬼数流计的是 c 数减 b 数，
  故同一个变分给出 iε(κ − μ) ∝ εχ。
  **比例常数不是算出来的，而是用球面这一个例子标定的**：球面 χ = 2、μ = 0、κ = 6
  给 6 = 3·2，于是常数定为 3，得 κ − μ = 3χ。
  （伴读者明说环面 χ = 0 定不出常数，只有球面能用。）
gaps:
  - |
    **比例常数靠单个例子标定**。这是本推导最实质的弱点：论证只给出 κ − μ ∝ χ，
    系数 3 由球面的 (χ, μ, κ) = (2, 0, 6) 定出。若球面的 κ = 6 有误，整条结论随之改变。
    而**球面的 κ = 6、μ = 0 出自原书 §6.1 的 (6.1.5)**，属第 6 章。
    **悬空的依赖边已于 2026-09-11 补上**（ch.5 与 ch.6 两支均已合入 main）：
    κ(S₂) = 6 挂 worldsheet.sphere-conformal-killing-group，
    同一反常在 S₂ 上的独立佐证挂 worldsheet.bc-ghost-number-anomaly-sphere（inferred）。
    **残余（本 gap 未关闭的部分）**：标定还要用 **μ(S₂) = 0**，而
    worldsheet.sphere-conformal-killing-group 的 statement **明确声明不断言 μ(S₂) = 0**，
    本图目前**没有任何节点断言 μ(S₂) = 0**——最接近的
    worldsheet.positive-euler-number-no-moduli（χ > 0 ⇒ μ = 0）在原书里是与 (5.2.9) 同处
    §5.2 的对偶断言，拿它来标定 (5.2.9) 有**循环之嫌**，故本图**不建这条边**，
    留给 auditor 裁决。在此之前，标定的 μ = 0 一半仍是断言。
  - |
    **「反常是算子方程」这一步没有论证**：从配分函数的 Weyl 变分到「∇_a j^a 作为算子方程
    可以插进任意关联函数」需要论证反常的局域性与与插入的对易性，来源里只有断言。
  - |
    **上游 worldsheet.ghost-number-current-weyl-anomaly 携带一处勘误依赖**（习题 3.6 的符号错，
    勘误表本项目未取得）与 OPE 收敛缺口。
  - |
    **路径积分层面的形式操作**：δ_{g#} 作用在 ∫[dφ]e^{−S} 上、测度的鬼数变换等，
    均无数学定义。
  - |
    **来源强度**：式号 (5.3.20)/(5.3.21)/(5.2.9) 只经 schrans-2020 核对
    （(5.2.9) 是正文级引用，是本章最强的一条；对原书仍为 L3）。
notes: |
  **本推导不是数学上的 Riemann–Roch 证明**，只是本书采用的物理路线。
  升级路径：另起一条挂数学来源的推导（Riemann–Roch 或 P₁ 的椭圆指标定理），
