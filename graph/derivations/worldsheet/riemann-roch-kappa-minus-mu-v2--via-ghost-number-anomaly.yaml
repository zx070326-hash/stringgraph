summary: |
  原书 §5.3 末「The Riemann–Roch theorem」小节的三步（pp.158–159，L1 页图）：

  (1) **(5.3.19)**：全纯 bc 系（不含 b̃, c̃）鬼流的守恒反常 ∇_a j^a = ((1−2λ)/4) R，
      原文逐字「the current conservation anomaly **derived in exercise 3.6**」——系数外包给习题。

  (2) **(5.3.20)**：Noether 定理把守恒流与不变性联系起来；对不守恒的流，「by the same argument」
        δ([dφ]e^{−S}) / ([dφ]e^{−S}) = (iε/2π) ∫ d²σ g^{1/2} ∇_a j^a → −iε (2λ−1)/2 · χ ，
      其中用了 χ = (1/4π)∫ g^{1/2} R。鬼数对称性 δb = −iεb、δc = iεc；路径积分非零时测度、作用量、
      插入的变换必须相消，故「the number of c minus the number of b insertions is 3χ/2」——
      **系数 3/2 = (2·2−1)/2 是把 λ = 2 代进反常系数算出来的**。

  (3) **(5.3.21)**：同一差值由零模计数给出
        ½(κ − μ) = ½(dim ker P₁ − dim ker P₁^T) ，
      原文专门解释 ½：「The factor of ½ appears because we have taken the holomorphic theory only;
      the antiholomorphic theory gives an equal contribution.」
      令 (2) 与 (3) 相等：½(κ − μ) = 3χ/2 ⇒ **κ − μ = 3χ**，即 (5.2.9)。

  原书随后给一般 bc 系的 **(5.3.22)** dim ker P_n − dim ker P_n^T = (2n+1)χ（「one finds in the same way」，
  算子定义在 exercise 3.2）；本卡是其 n = 1（λ = 2）情形。

  **整条论证不使用任何具体曲面**：没有球面、没有 χ = 2、没有 κ = 6，比例常数不是标定的。
gaps:
  - |
    **(a) 反常系数外包给 exercise 3.6**：(5.3.19) 的系数 (1−2λ)/4 在正文零推导（逐字 "derived in
    exercise 3.6"），而 [S] 指出该习题在官方勘误表里有符号错、勘误表本项目未取得
    （见 worldsheet.ghost-number-current-weyl-anomaly 的 source note）。
    ⚠ 2026-09-11 起这条缺口**直接压在结论系数上**：常数 3 就是从这个系数算出来的。
  - |
    **(b) (5.3.20) 的「by the same argument」没有写出论证**：从 Noether 定理到「不守恒流的
    散度积分给出测度的变分」这一步只有这五个字；把反常当作可插进任意关联函数的**算子方程**
    需要论证反常的局域性与与插入的对易性，来源里只有断言。
  - |
    **(c) (5.3.22) 的一般 n 情形零推导**：原文只说「one finds in the same way」。本卡只用 n = 1，
    故这条不压低本卡，但记录在案：若下游要 n ≠ 1 的情形，须自建推导。
  - |
    **路径积分层面的形式操作**：δ_{g#} 作用在 ∫[dφ]e^{−S} 上、测度的鬼数变换等，均无数学定义。
notes: |
  **本推导不是数学上的 Riemann–Roch 证明**，只是本书采用的物理路线。
