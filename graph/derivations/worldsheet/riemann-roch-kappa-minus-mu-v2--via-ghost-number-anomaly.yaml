  - **删边** worldsheet.sphere-conformal-killing-group（原 inferred，note 写「比例常数的标定输入」）：
    原书 §5.3 的论证**不经球面**——pp.158–159 上没有 sphere、χ = 2、κ = 6、μ = 0 任一字样，
    也没有任何「定常数」的动作；常数 3 是把 λ = 2 代进 (5.3.19)/(5.3.20) 的 (2λ−1)/2 算出的。
    「用球面标定」是伴读笔记 [S] §5.22–§5.23/§6.67 的讲法，不是原书的讲法。
    该边 2026-09-11 早些时候已因「原书 p.159 未读」改标 inferred，其撤销条件（读到页图并确认就地用球面）
