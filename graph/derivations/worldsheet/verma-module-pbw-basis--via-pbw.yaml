id: worldsheet.verma-module-pbw-basis--via-pbw
target: worldsheet.verma-module-pbw-basis
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.verma-module-v2
    note: |
      非 inferred：本推导的对象就是该节点定义的 V(c,h) = U(Vir)/J(c,h)，
      而且用到该节点的两条结论：(i) V(c,h) 由 |c,h⟩ 在 U(Vir) 下生成（exists_smul_hwv），
      (ii) V_N 的定义与 L_0 在其上作用为 h + N。所引文献（kac-1979、kac-raina-1987）
      用的是同一构造（诱导模 U(Vir) ⊗_{U(b)} K_{c,h}，与对左理想取商等价，见 summary 第 (1) 步）；
      **但这些来源的分节/讲号未核实**，见 gaps 与各 source 的 loc。
  - id: worldsheet.virasoro-algebra-v2
    note: |
      非 inferred：PBW 的输入是 Vir 的三角分解 Vir = Vir_- ⊕ (K L_0 ⊕ K C) ⊕ Vir_+
      与 Vir_- 作为 K-模自由（基 {L_{-n} : n ≥ 1}），两者都直接来自该节点的陈述
      （括号关系 + 「{L_n} ∪ {C} 张成、Vir ≅ W(K) × K」）。归一化同为 conv.virasoro-standard；
      中心项的具体系数与本推导无关（Vir_- 内部的括号 [L_{-m}, L_{-n}] 没有中心项）。
sources:
  - ref: kac-1979
    loc: "§1（Verma 模的构造与逆变形式；PBW 基是其中行列式表述的前提）；**分节号未核实**，且 sources.bib 对本 key 指向哪一篇 Kac 存疑"
  - ref: kac-raina-1987
    loc: "Virasoro 代数的最高权表示、Verma 模及其特征标这一主题；**不写 Lecture 编号**（sources.bib 的版本陷阱：第 1 版与第 2 版讲号不可互换）"
  - ref: feigin-fuchs-1982
    loc: "§2（Verma 模之间的同态与奇异向量；论证在 level N 的 p(N) 维分量上进行）；**分节号未核实**"
    note: |
      本条只作旁证：Feigin–Fuchs 的正文默认 PBW 基与 dim V_N = p(N)（否则 Kac 行列式
      无从写出），但本项目未取得正文，没有逐字核实他们在哪里陈述这一条。
summary: |
  标准论证，三步：

  (1) **诱导模的识别**。设 b := span_K{L_n : n ≥ 0} ⊕ K·C（Borel 子代数），
      χ_{c,h} : b → K 为由 L_0 ↦ h、C ↦ c、L_n ↦ 0 (n > 0) 给出的一维表示 K_{c,h}
      （χ 是李代数同态：b 的导代数落在 {L_n : n > 0} 里）。
      worldsheet.verma-module-v2 定义的左理想 J(c,h) 恰是 U(Vir)·ker(χ_{c,h} 在 U(b) 上的延拓)，
      故
        V(c,h) = U(Vir)/J(c,h) ≅ U(Vir) ⊗_{U(b)} K_{c,h}。

  (2) **PBW**。三角分解 Vir = Vir_- ⊕ b（K-模直和），其中 Vir_- = span_K{L_{-n} : n ≥ 1}。
      Poincaré–Birkhoff–Witt 定理给出 K-模同构 U(Vir) ≅ U(Vir_-) ⊗_K U(b)，
      从而诱导模作为左 U(Vir_-)-模自由、秩 1、由 1 ⊗ 1 = |c,h⟩ 生成：
        V(c,h) ≅ U(Vir_-)  （作为 U(Vir_-)-模）。
      再对 Vir_- 用一次 PBW（取基 L_{-1}, L_{-2}, … 与降序），得 U(Vir_-) 的 K-基
        L_{-n_1} L_{-n_2} … L_{-n_k},  n_1 ≥ … ≥ n_k ≥ 1。
      作用在 |c,h⟩ 上即目标陈述 (1)。

  (3) **计数**。上述基元在 L_0 下的本征值为 h + Σ_i n_i（worldsheet.descendant-weight-grading
      的计算，本推导不另挂依赖：它由 (2) 的基与 virasoro-algebra-v2 的括号直接得到），
      故 level N 的基元恰对应 N 的分拆 (n_1 ≥ … ≥ n_k ≥ 1)，个数为 p(N)，给出 (2)；
      N = 0 只有空积一项，故 dim V_0 = 1、|c,h⟩ ≠ 0，给出 (3)。

  这条论证对**所有** (c,h) 一致成立：PBW 不看 (c,h) 取什么值。不可约性才看，那是
  worldsheet.kac-determinant 的事。
gaps:
  - "**未形式化，且不是「补细节」而是缺一条上游定理**。Mathlib v4.33.1 **没有** PBW 定理
     （`Mathlib/Algebra/Lie/Free.lean` 与 `SerreConstruction.lean` 都注明缺此定理），
     故 (2) 的两次 PBW 都做不了。formal/StringFormal/Virasoro/Verma.lean 只证到**无序**词
     张成（`negSpan_eq_top`）与每片有限生成（`levelSpan_fg`）。
     formal/TODO.md 的 `pbw-verma` 一项把缺口拆成两半：(a) straightening（有序词已张成，
     给出 dim V_N ≤ p(N)，对词长与逆序数双重归纳，不依赖上游）；
     (b) 线性无关（= U(Vir_-) 的 PBW + 诱导模自由性，依赖上游）。"
  - "**「V(c,h) ≠ 0」在形式化侧是空缺**。在 (b) 之前，Verma.lean 中的一切结论都可能是空洞真
     （V(c,h) = 0 时全部平凡成立），且没有便宜替代品——任意 (c,h) 的非零最高权模本身
     就是要构造的东西，只有 (c,h) = (0,0) 时平凡模现成可用。这正是把非零性放进本节点
     而不是 worldsheet.verma-module-v2 的原因。"
  - "**PBW 定理本身在 literature/sources.bib 中没有条目**。本推导第 (2) 步引用的是
     Poincaré–Birkhoff–Witt 定理（任何李代数教科书；对 Vir_- 这种自由模上的李代数，
     结论对任意交换基环成立）。建议 researcher 登记一条标准来源（如 Dixmier 或 Humphreys），
     届时把它加进本推导的 sources。"
  - "**文献定位强度低**。三条 source 的分节/讲号全部未核实：kac-1979 连指向哪一篇都存疑
     （sources.bib 记有 FGZ 引 ICM Helsinki 1978 的疑点），kac-raina-1987 按 sources.bib
     的要求不得写 Lecture 号，feigin-fuchs-1982 正文未取得。因此本推导的可核对性依赖
     「这是教科书标准结论」这一集体判断，而不是逐字核实。若 researcher 能取得
     kac-raina-1987 第 1 版正文并定位到具体 Lecture，应回填。"
  - "**基环**。目标陈述限定在特征零的域 K 上，只是为了用「维数」和「特征标」的语言；
     PBW 与自由性对任意交换环 R（Vir_- 作为 R-模自由）都成立，
     而 worldsheet.verma-module-v2 的构造部分本就对任意 ℚ-代数成立。
     若日后需要一般 R 上的版本，应新建节点而不是改本节点的陈述。"
notes: |
  【status 的选择】按 docs/STATUS_LEVELS.md：4 = rigorous 要求「有发表的、数学界接受的
  完整证明；来源必须是数学文献或数学物理文献」。PBW 及其对 Verma 模的推论是被数学界
  完全接受的标准定理，来源是数学文献，故 rigorous。不能标 formalized（见 gaps 第一条），
  也没有理由降到 physical-argument（论证里没有任何形式操作或渐近近似）。
  本推导**不**援引 docs/STATUS_LEVELS.md 的 rigorous 例外条款（那是给「有限步初等计算 +
  reviewer 复核」用的），它靠的是已发表的完整证明。

  【与 worldsheet.descendant-weight-grading 的关系】那条命题只说降算符提高 L_0 本征值、
  且明确声明**不**断言线性无关；本推导第 (3) 步用到的正是它的计算部分，但因为该计算
  由 (2) 的基与 virasoro-algebra-v2 的括号直接重做只需两行，本推导没有另挂那条依赖，
  以免制造一条只为复用两行计算的边。
