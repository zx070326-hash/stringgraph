summary: |
  本推导 = 上游代数结论（math.verma-module-free-over-negative-part）+ 三处本项目侧的补写。

  (a) **记号与排序的搬运**。上游按来源写法给出基
        L_{-n_m} L_{-n_{m-1}} … L_{-n_1} |c,h⟩,   1 ≤ n_1 ≤ … ≤ n_m,
      目标卡片写成
        L_{-n_1} L_{-n_2} … L_{-n_k} |c,h⟩,       n_1 ≥ n_2 ≥ … ≥ n_k ≥ 1。
      **这两者是同一组基元**：只是把下标序列反过来标号（k = m，本项目的 n_i = 来源的 n_{m+1-i}），
      因子从左到右的实际排列（大下标在左）完全一致。目标卡片的范围说明 (b) 另行指出：
      即使把序反成 n_1 ≤ … ≤ n_k，得到的是同一分拆的另一种代表元，维数结论不变。

  (b) **分级维数与特征标**。上游已给 dim_F V_N = p(N)（L_0 本征值 h + Σ n_i，基元 ↔ N 的分拆）。
      目标卡片额外要形式特征标
        Σ_{N ≥ 0} p(N) q^{h+N} = q^h ∏_{n ≥ 1} (1 − q^n)^{-1}，
      这一步是 Euler 的分拆生成函数恒等式（形式幂级数恒等式，不涉及收敛）。

  (c) **范围说明的落实**。目标卡片的 (a)「与不可约性无关」、(c)「未形式化」两条范围说明，
      分别对应上游节点的范围说明与本推导 gaps 的记账，不是新的数学内容。

  目标卡片的 (3)（V(c,h) ≠ 0 对所有 (c,h)）直接就是上游的 (4)，不需要任何补写。
gaps:
  - "**未形式化，且缺口是精确的一条上游定理：Mathlib 没有 PBW（读取日期 2026-09-11）**。
     两条 L1 证据：(i) `Mathlib/Algebra/Lie/UniversalEnveloping` 的全部 17 个声明只围绕构造与泛性质
     （Rel、ringCon、UniversalEnvelopingAlgebra、mkAlgHom、ι、lift、lift_unique、hom_ext 等），
     **没有滤过、没有与对称代数的同构，连 TODO 段都没有**；(ii) virasoro-lean-2025 的作者逐字自陈
     「Mathlib does not currently have the PBW theorem」，并称补上它是 \"a major undertaking\"。
     ⇒ **本推导的 status 上限是 rigorous，不得标 formalized，直到 Mathlib 有 PBW 为止。**
     复查时同时看 `Mathlib/Algebra/Lie/UniversalEnveloping.lean` 与 Mathlib 的 1000.yaml 跟踪表；
     若届时 Mathlib 有了 PBW，本条与 math.pbw-theorem 的同名记录须一并重估。"
  - "**图内已形式化的是哪一半**：formal/TODO.md 的 `pbw-verma` 把缺口拆成两半——
     (a) straightening（有序词张成，给出 dim V_N ≤ p(N)）**已形式化**（2026-09-11，
     formal/StringFormal/Virasoro/VermaPBW.lean，图节点 worldsheet.verma-level-spanned-by-partitions）；
     (b) 线性无关（= U(vir₋) 的 PBW + 诱导模自由性）**未做**，它是 math.pbw-theorem 的下游。
     换成目标陈述的编号：**(2) 的上半（dim V_N ≤ p(N)）已形式化；(1)、(2) 的等号与 (3) 都需要线性无关。**"
  - "**原证明计划有误（formalizer 更正，2026-09-11）**：formal/TODO.md 原先写的
     「对（词长, 逆序数）双重归纳」**不成立**——Leibniz 律第二项 L_b (L_a X) 经内层整理后长度不减
     （内层 straightening 可产生比原尾巴更长的词），双重归纳的度量不单调。
     VermaPBW.lean 实际用的有效度量是 wordWeight = Σ_i i·l_i（表头不贡献），它在负模态词上 ≤ 0，
     换序步与对易子步都使它**严格增大**（故 wordMeasure = (−wordWeight).toNat 严格下降）；
     且 `straighten` 的结论**必须带 wordMeasure 不增**这一上界，否则嵌套整理无法被归纳假设覆盖。
     这条记的是 straightening 细节在形式化时暴露的问题，不影响本推导 rigorous 的结论——
     文献侧的 PBW 证明不走这条归纳。"
  - "**「V(c,h) ≠ 0」在形式化侧是空缺**。在线性无关那一半做出来之前，Verma.lean 中的一切结论
     都可能是空洞真（V(c,h) = 0 时全部平凡成立），且没有便宜替代品——任意 (c,h) 的非零最高权模
     本身就是要构造的东西，只有 (c,h) = (0,0) 时平凡模现成可用。这正是把非零性放进目标卡片
     而不是 worldsheet.verma-module-v2 的原因。"
  - "**Euler 恒等式无来源**：summary (b) 用的 Σ p(N) q^N = ∏ (1−q^n)^{-1} 是形式幂级数层面的标准恒等式，
     本图没有为它建节点也没有登记来源。若 reviewer 要求，可补一条 math 节点；本批未做。"
  - "**上游的两条未结案疑问会传下来**：Humphreys §17.3 的字母编号（Q14）与 §17.1 对 L 的假设（Q15，
     决定 math.verma-module-free-over-negative-part--via-pbw-theorem 那条 inferred 边能否撤）。
     见 math.pbw-theorem 的 notes。"
