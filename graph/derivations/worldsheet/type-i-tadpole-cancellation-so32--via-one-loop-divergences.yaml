summary: |
  按三个拓扑分别算长柱极限的发散，再相加：
  (1) 柱面 C₂：Z_{C₂} = Z_{C₂,0} + Z_{C₂,1}（NS–NS 与 R–R 交换）；
      模变换后 Z_{C₂,0} ∝ n² ∫ds[16 + …]，发散来自 s → ∞ 的无质量闭弦 tadpole；
      Z_{C₂,1} 有等值反号的发散。
  (2) Klein 瓶 K₂：Z_{K₂,0} ∝ 2^10，Z_{K₂,1} = −Z_{K₂,0}。
  (3) Möbius 带 M₂：Z_{M₂,1} ∝ ±2n·2^5（上号 SO(n)）。
  (4) 相加 R–R 部分：n² ∓ 2·32·n + 32² = (n ∓ 32)²，即 (10.8.19)。
      故 R–R tadpole 为零 ⟺ n = 32 且取正交投影 ⟺ 规范群 SO(32)。
  (5) 为什么这是真正的不一致：发散对应 10-形式势 C_10 的 tadpole，
      C_10 无动能项 ⟹ 传播子 1/0 ⟹ 发散 μ_10²/0；C_10 的运动方程就是 μ_10 = 0，
      **不能**用背景场的修正吸收。
  (6) 脚注 7：不能只要求每个拓扑的 NS–NS + R–R 之和为零（超对称已保证这一点），
      必须要求两者**各自**在拓扑求和后为零。

  【status 的理由（四条）】
  (1) C_10 那一步原书自称是「猜」，所谓的 'more detailed analysis' 不给；
  (2) tadpole 的整体符号未由计算定出（原书自承 'This calculation does not determine the sign'）；
  (3) 本图没有 Vol.1 §7.4 的单圈振幅节点，计算链大部分在图上悬空；
  (4) 整个计算是路径积分/模变换层面的形式操作。
gaps:
  - "**C_10 的引入是「猜」的**：原书逐字 'One can guess the resolution of this as follows' 与 'as indeed a more detailed analysis does show'——**不给该分析**。这是本推导最弱的一环，因为「发散代表真正的不一致」这个结论完全依赖它。"
  - "**tadpole 的整体符号未定**：原书逐字 'This calculation does not determine the sign of the tadpole, but it should be n ∓ 32'。理由（cross-cap 数只 mod 2 守恒，边界数则不然）是一条幺正性论证，本图无节点。"
  - "**辛支「无解」这一步是读出来的，不是原书论证的**：候选集只有 SO(n) 与辛群（Sp(k) ↔ n = 2k）；取 (10.8.19) 的下号得 (n + 32)²，对任何 n ≥ 0 都不为零 ⇒ 辛支不给解。原书只写 'changing from a symplectic to orthogonal projection changes the sign of RP₂'，**不明说辛支无解**；§10.8 全节也不出现 'USp(32)'。同理「纯闭弦无取向理论 n = 0 也不一致」是由 (10.8.19) 代入 n = 0 读出的（Z₁ ∝ −i·32² ≠ 0），原书不单独讨论（sec10-8.md#E75）。"
  - "**不得与 consistency.type-i-hexagon-so32-iff 建边**：§10.8 全节不出现 'anomaly'；§10.6 p. 31 用 'There is a further inconsistency …' 与 'We will also see, in chapter 12, …' 把发散与时空反常**并列**；§12.2 p. 102 逐字说 type I 的规范群由 tadpole 相消定。建边会伪造来源里没有的推理。详见目标卡片 notes 的（限定 4）。"
  - "**本图没有 Vol.1 §7.4 的单圈振幅节点**，也没有 Vol.2 §10.7 的完整环面振幅节点：三个拓扑的模变换与长柱极限在图上无支撑。→ 待建 spectrum.one-loop-vacuum-amplitudes 一族。"
  - "**Ω 在超弦上的作用（(10.8.13)/(10.8.14)）本图无节点**（依赖边已标 inferred）。"
  - "**时空反常路线不在本推导范围**：第 12 章给出 SO(32) 唯一性的另一个独立理由，本轮未读。GS 1984 那条路线由本图 consistency 区另行承载。"
