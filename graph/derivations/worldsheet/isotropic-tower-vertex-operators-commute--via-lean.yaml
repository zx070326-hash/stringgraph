  - id: worldsheet.momentum-tower-fock-space
    inferred: false
    note: |
      提供塔 T(p;k_0) = ⊕_{N∈Z} F(p + N k_0)（Lean 侧 `TowerFock D R = ℤ →₀ Fock D R`）
      与**层移位算子** e^{i n k_0·x}（`towerShift n`，该卡 (1)：S_0 = id、S_m S_n = S_{m+n}），
