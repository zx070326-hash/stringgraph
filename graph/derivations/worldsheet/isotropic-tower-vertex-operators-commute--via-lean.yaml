      `towerVertex` 在该卡里只是定义 A^ε_n 时顺带引入的记号，没有自己的节点。
      ⇒ 这条边指向的是"该卡文本里的一段记号约定"，不是该卡 formal 声明的内容，故标 inferred。
      ⚠ 正确的修法（提请 lead）：把 `towerVertex` 拆成一张 formalized 定义卡
      （与单 Fock 的 `Fock.vertexOsc` 定义卡配对），让本卡与
