summary: |
  机器检查的证明，三行半，全部力气已由被依赖的两张卡出完。

  **第一步：动量算术（`dotVec_vertexMomentum`）。** 塔上第 n 个顶点算子的动量是
  `vertexMomentum b n = n·b`（逐分量 (n : R) * b μ），故
    (m k_0)·(n k_0) = (m n)(k_0 · k_0)，
  代入假设 `hbb : dotVec η b b = 0` 得 `hdot : dotVec η (n·b) (m·b) = 0`。
  ⇒ 这一步是把"类光性"翻译成"正交性"的全部内容，一行 `Finset.sum_congr` + `ring`。

  **第二步：逐层化归（`Finsupp.lhom_ext`）。** 塔是 `ℤ →₀ Fock D R`，
  两个线性算子相等只需在所有 `Finsupp.single j P` 上相等。代入
  `towerVertex_single`（四次）后两边变成
    single (j + n + m) ( V^{(m k_0)}_{J−m} ( V^{(n k_0)}_{K−n} P ) )   （左）
    single (j + m + n) ( V^{(n k_0)}_{K−n} ( V^{(m k_0)}_{J−m} P ) )   （右）。

  **第三步：两个半各自收工。**
  · **振子半**：内容部分由 worldsheet.orthogonal-momentum-vertex-operators-commute
    的 `Fock.vertexOsc_comm_of_dotVec_zero` 以 `hdot`、洛朗指标 (J−m, K−n) 调用，直接相等。
  · **零模半**：层标签 `show j + n + m = j + m + n from by ring`。

  `lie_towerVertex_towerVertex_of_isotropic` 是上式的李括号改写
  （`LieRing.of_associative_ring_bracket` + `sub_self`）。

  **假设核对**：全程只有 `hbb : dotVec η b b = 0`。**没有** `hη : η_μ² = 1`，
  **没有** DDF 归一化 `dotVec η b a = 1`，没有 m, n, J, K 的限制，没有 b ≠ 0。
gaps:
  - |
    (i) **「k_0² ≠ 0 时不对易」未被证明**。目标【不断言】(a)：那只是 Lean 文件头的数学注记
    （逐字引在目标 sources 的 note 里），**不是定理**。Lean 侧甚至没有定义单值因子
    (w/z)^{mn k_0²} 所需的形式级数。
    ⇒ 「类光性是必要的」这句话目前的地位是：**formalizer 的断言 + 一条可核对的系数计算**
    （塔上共形权那一侧的系数含层指标 j，见 formal/TODO.md (3e)，那一侧的必要性论据更硬），
    不是机器检查的否定结论。reviewer 若要收紧，应要求形式化一个反例
    （例如在 R = ℚ[t]、b·b = t 上算出某个不为零的对易子）。
  - |
    (ii) **零模只是层移位，没有真正的 Heisenberg 零模**。目标【不断言】(c)：
    x^μ 只以 e^{i n k_0·x}（`towerShift`）的形式出现，[x^μ, p^ν] 未形式化；
    塔建在**固定的** p 与 k_0 上，不是全动量空间；没有余循环/Klein 因子。
    ⇒ 本推导**不**支持"一般动量格上的顶点算子对易/反对易"一类陈述
    （那属于 math.lattice-vertex-algebra 的范围）。
  - |
    (iii) **同点乘积 (5a) 与加权和 (5b) 未做**，故本推导不支持
    worldsheet.ddf-transverse-oscillator-algebra 的任何部分，只是其第一块输入。
    见目标 notes 与姊妹卡 notes 的转录。
  - |
    (iv) **`towerVertex` 在图上没有自己的定义卡**，本推导对
    worldsheet.ddf-operators-v6 的那条边因此标 inferred（指向的是该卡文本里的记号段落，
    不是它的 formal 声明 `ddfOp`）。curator 已在本轮报告中提请 lead 补定义卡。
  - |
    (v) **一般交换 ℚ-代数，无实结构、无幺正性、无解析结构**；η_μ 是 R 中任意一族元素。
notes: |
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
  （lake build 通过、目标声明无 sorry、公理仅 propext / Classical.choice / Quot.sound）。
  合并前应由 lead 跑 `uv run stringgraph check-axioms`。

  【本推导的"短"是有意义的信号】三步里有两步是记账（Finsupp 逐层、层标签加法），
  真正的数学全在 worldsheet.orthogonal-momentum-vertex-operators-commute 里。
  这恰好说明两张卡的拆分是对的：**把"正交动量无缩并"与"塔上动量都与 k_0 成比例"
  分开之后，类光性的作用就只剩一行算术 (m k_0)·(n k_0) = mn k_0²**，
  而不是混在一大团计算里说不清它在哪儿被用到。
