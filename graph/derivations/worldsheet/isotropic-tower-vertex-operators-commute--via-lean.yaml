    note: |
      **振子半的全部内容**。Lean 侧 `towerVertex_comm_of_isotropic` 的证明在逐层化归后
      直接调用 `Fock.vertexOsc_comm_of_dotVec_zero η (vertexMomentum b m) (vertexMomentum b n) hdot
