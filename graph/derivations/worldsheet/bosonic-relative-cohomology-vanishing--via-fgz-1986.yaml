     ⚠ 仍未关闭的**另一半**移到下一条：新卡自身的来源 fgz-1986 不印出 Prop 2.6 的证明。"
  - "**新挂的实边所指的卡，其来源本身不带印出的证明**：fgz-1986 是 PNAS 公告体裁，
     Proposition 2.6 只给陈述。⇒ 本推导对「V(E,p) 是 ℒ⁻-自由」的可追溯性止于「数学期刊上署名的
     编号命题」，与本推导对 Theorem 2.7 的处境同型（见上一条 gap 与新卡推导
     worldsheet.fock-module-free-over-negative-virasoro--via-fgz-1986 的 gaps 第一条）。
     关闭方式相同：定位 FGZ 的后续长文并逐行复核。"
  - "**〔2026-09-11 新增，researcher 第二轮 §9.9.4〕FGZ 自列的四条输入在逻辑上冗余**：
     Prop 2.4 = Thm 1.12 + Prop 1.3（原文逐字 'This implies the following'），故
     'Thm 2.7 → Thm 1.12' 与 'Thm 2.7 → Prop 2.4 → Thm 1.12' 是同一条论证的两次记账。
     本图按原文建的实边**仍然正确**（不必标 inferred），但工具若要算「最小依赖集」或做猜想计数，
     **Thm 1.12 与 Prop 1.3 不应被计两次**。⚠ 本图目前**没有** Prop 2.4 / Thm 1.12 / Prop 1.3 的卡，
