summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/PhysicalStates.lean 的 `Null` 一节。

  **陈述 (1)（S ⊆ H_phys^⊥）** = `Fock.spuriousSubmodule_le_orthComplement`：
    spuriousSubmodule η a ≤ orthComplement η (physSubmodule η a a₀)。
  证明三行：`iSup_le` 两次把上确界拆成「对每个 n ≥ 1 与每个 ψ，L_{−n}ψ 与所有物理态 φ 正交」；
  `pairing_Lop_left η a (-n) ψ φ` 把 ⟨L_{−n}ψ, φ⟩ 换成 ⟨ψ, L_n φ⟩（`neg_neg` 处理指标符号）；
  `Lop_apply_eq_zero_of_mem_physSubmodule hφ hn` 给 L_n φ = 0（n ≥ 1），`map_zero` 收尾。
  质量壳条件在整个证明中**没有出现**——这正是本卡与带质量壳版本分家的技术理由。

  **陈述 (1′)（S ∩ H_phys ⊆ H_0）** = `Fock.spurious_inf_physSubmodule_le_nullSubmodule`：
    spuriousSubmodule η a ⊓ physSubmodule η a a₀ ≤ nullSubmodule η a a₀，
  证明是把 (1) 与 `nullSubmodule = physSubmodule ⊓ orthComplement physSubmodule` 的定义拼一行
  （`⟨hχ.2, spuriousSubmodule_le_orthComplement η a a₀ hχ.1⟩`）。
  「零范数」是 `pairing_self_eq_zero_of_mem_nullSubmodule`（把零态自己代进它与所有物理态正交那一条）。
  具体形式 `Fock.Lop_neg_apply_mem_nullSubmodule`：若 L_{−n}ψ（n ≥ 1）恰好是物理态，它就是零模态；
  这一条正是 worldsheet.physical-states-level-one 第 (3) 条所调用的引理。
gaps:
  - |
    (i) **不给反包含 H_0 ⊆ S ∩ H_phys**。PhysicalStates.lean 文件头 "Mathematical gaps" 第 2 条
    明确记为未证；那是无鬼定理难的那一半。目标陈述本身也不断言它。
  - |
    (ii) **双线性型而非 Hermitian 形式**（继承 worldsheet.virasoro-generators-adjoint--via-lean
    的 gaps (i)、worldsheet.fock-indefinite-form--via-lean 的 gaps (iv)）。
    「正交」「零范数」都是 R-双线性型 `Fock.pairing` 意义下的；
    复 Fock 空间上的半双线性（Hermitian）形式未形式化。实极化下两者一致。
  - |
    (iii) **逐动量扇区、代数版、对角 η、R 为交换 ℚ-代数**：继承
    worldsheet.bosonic-fock-space 的缺口 (i)(ii)(iii) 与 Sugawara.lean 的零模缺口。
    没有位置算符 x^μ，没有对 k 的直积分，故「固定动量扇区 F(k)」在 Lean 侧是全局参数而非分解指标。
  - |
    (iv) **不覆盖「加零态不改变内积／商空间上的诱导形式良定义」**。那是
    worldsheet.spurious-orthogonal-to-physical 陈述 (2) 的后半，本卡不含它，
    Lean 里也没有具名引理（见该卡 --via-lean 的 gaps (i)）。
notes: |
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
