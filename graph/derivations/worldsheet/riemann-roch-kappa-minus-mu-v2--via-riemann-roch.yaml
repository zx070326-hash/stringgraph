  - id: worldsheet.moduli-holomorphic-quadratic-differentials
    inferred: true
    note: |
      **桥 (B2)**：μ = 2·dim_C H⁰(X, K²)。
      该卡给出「共形规范复坐标下模的条件 ⇔ ∂_z̄ δ'g_zz = 0，即 δ'g_zz 是全纯二次微分；
      μ 等于处处正则的全纯二次微分空间的**实**维数」。δ'g_z̄z̄ = (δ'g_zz)‾ 给出因子 2。
      标 inferred 的理由同上：这一步实质上是 Teichmüller 理论（coker P₁ ≅ H⁰(K²)），
