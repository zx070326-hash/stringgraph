summary: |
  **数学路线，不用球面标定、不用按亏格分情形。**

  设 M 紧、无边、连通、可定向，带欧氏度规 g_ab。

  (0) **复结构**：二维 Riemann 度规经 diff × Weyl 化到共形规范 ĝ_ab = δ_ab
      （worldsheet.conformal-gauge-fixing，**只在局部**），各片的复坐标 z = σ¹ + iσ² 之间
      过渡函数全纯，于是 M 带上复结构、成为**紧黎曼面 X**，亏格 g，χ = 2 − 2g。
      ⚠ 这一步的全局性是本推导的缺口，见 gaps 第 2 条。

  (1) **桥 (B1)**：共形 Killing 方程 (P₁δσ)_ab = 0 在共形规范复坐标下就是 ∂̄ δz = 0，
      即 δz 是 X 上处处正则的**全纯向量场**；δz̄ = (δz)‾ 由保实性定死。故
        κ = dim_R ker P₁ = 2 · dim_C H⁰(X, K^{−1}) 。

  (2) **桥 (B2)**：模的条件（无迹 + 无散度）在同一规范下就是 ∂_z̄ δ'g_zz = 0，
      即 δ'g_zz 是**全纯二次微分**；δ'g_z̄z̄ = (δ'g_zz)‾。故
        μ = dim_R ker P₁^T = 2 · dim_C H⁰(X, K²) 。

  (3) **数学输入**（一次 Riemann–Roch，取 D = 2K，用 deg K = 2g − 2）：
        dim_C H⁰(X, K²) − dim_C H⁰(X, K^{−1}) = 3g − 3     （对**一切** g）。

  (4) **合成**：
        κ − μ = 2[ dim_C H⁰(K^{−1}) − dim_C H⁰(K²) ]
              = −2 (3g − 3)
              = 6 − 6g
              = 3 (2 − 2g) = 3 χ 。   ∎

  **两处与物理路线的实质差别**（这是本条存在的理由）：
  - **比例常数 3 由指标计算算出**，且**不经任何反常系数**。
    ⚠ 2026-09-11 订正：此处原写「不是用球面 (χ, μ, κ) = (2, 0, 6) 标定的」并引姊妹推导的
    「标定 gap」——那条 gap 已撤销（原书 §5.3 不经球面，常数由 λ = 2 代入 (5.3.19)/(5.3.20) 算出，
    见 polchinski-1998-v1.md §16）。两条路线的真实差别是：物理路线的 3 来自
    bc 鬼流反常系数 (1−2λ)/4|_{λ=2}（外包给 exercise 3.6，带勘误依赖），本条的 3 来自
    deg K = 2g − 2 与 Riemann–Roch，**不依赖任何物理输入或单个曲面的数值**。
  - **不需要按 g = 0 / 1 / ≥ 2 分情形**：Riemann–Roch 对任意除子成立，
    作差之后 g = 0、g = 1 不是例外。
  检验（结论的推论，不是输入）：g = 0 给 κ − μ = 6 = 3·2 ✓；g = 1 给 0 = 3·0 ✓。
gaps:
  - |
    **★ 主缺口：两座桥只到 physical-argument，本条的有效状态因此被压在 physical-argument。**
    (B1) κ = 2·dim H⁰(K^{−1}) 与 (B2) μ = 2·dim H⁰(K²) 把**物理定义的计数**
    （共形 Killing 方程的解数、无迹横向度规变分的模数）等同于**层上同调维数**，
    这**不是 Riemann–Roch 的内容**。researcher 本轮**没有找到任何带编号的数学来源**
    陈述这两条（math-sources.md §42.8、Q33；候选入口：Teichmüller 理论、Ahlfors–Bers 原始文献、
    Farkas–Kra V.2）。
    ⇒ **这是本图刻意暴露的结论：数学路线的瓶颈不在 Riemann–Roch，而在这两座桥。**
    补上带编号来源、把两张桥卡提到 rigorous，本条的有效状态才会跟着上去。
  - |
    **共形规范的全局性未论证**：本推导第 (0) 步要把带度规的闭曲面变成**黎曼面**
    （等温坐标的存在性 + 过渡函数全纯），而 worldsheet.conformal-gauge-fixing 的 statement
    明写「**在局部**」且「**不**断言全局规范固定的存在性」。
    本图既无「等温坐标存在性（Korn–Lichtenstein）」节点，也无来源。
    ⚠ 注意这与「全局规范固定」不是同一件事：本推导只需要**复结构**，
    不需要把度规整体化到单位形式（后者恰恰因为存在模而不可能）。
  - |
    **复维 → 实维的因子 2 只由桥卡的散文承载**：κ、μ 是**实**计数，H⁰ 是**复**维数，
    两者差一个因子 2，依据是 δz̄ = (δz)‾、δ'g_z̄z̄ = (δ'g_zz)‾（保实性）。
    图里没有单独的节点记这一步；若因子 2 记错，结论会差一倍。
  - |
    **缺 reviewer 独立复核记录**：即便两座桥日后升到 rigorous，本条自身按
    docs/STATUS_LEVELS.md 的 rigorous 例外条款还需要 `reviewer-verified: <agent>, <date>`
    （第 (4) 步是三行算术）。目前两条都不满足，故 kind/status 都是 physical-argument。
  - |
    **只覆盖可定向**（目标卡 v2 已相应收窄）。Riemann–Roch 是黎曼面上的定理，
    不可定向世界面（Klein 瓶、RP₂、Möbius 带）要走定向双覆盖 + 对合不变子空间，
    **本图无任何来源**（math-sources.md Q34）。这也是 v1 被 supersede 的原因。
  - |
    **单个数值不由本条给出**：本条只给差。要断言 μ(S₂) = 0 或 g ≥ 2 时 κ = 0，
    还需要「deg D < 0 ⇒ l(D) = 0」（math.riemann-roch-theorem 的「不断言 (b)」），
    本图尚无该节点。
notes: |
