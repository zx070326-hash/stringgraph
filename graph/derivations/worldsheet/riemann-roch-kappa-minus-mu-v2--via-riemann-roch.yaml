  - id: worldsheet.ckv-holomorphic-in-conformal-gauge
    inferred: true
    note: |
      **桥 (B1)**：κ = 2·dim_C H⁰(X, K^{−1})。
      该卡给出「共形规范复坐标下 CKV 方程 ⇔ ∂̄ δz = 0，且 δz̄ = (δz)‾ 使变换保实；
      κ = dim_R ker P₁ 等于世界面上处处正则的全纯向量场的**实**维数」。
      本推导再把「处处正则的全纯向量场空间」认同为黎曼面 X 的 H⁰(X, K^{−1})（全纯切丛的整体截面），
      并用 δz̄ = (δz)‾ 得实维 = 2×复维。
      标 inferred 的两个理由（math-sources.md §42.8）：
      (a) **本轮没有找到任何带编号的数学来源**这样陈述「CKV ↔ 全纯向量场」；
      (b) 该卡是**共形规范**下的局部陈述，把它接到 X 上的层上同调需要全局复结构，
