  - id: worldsheet.open-string-mass-shell
    note: |
      本推导的最后一步「由 α'm^2 = N - a 得 0 = 1 - a」直接用质量壳条件。该条件
      现已单列节点，来源是已核实的 Polchinski (1.3.36)，落在本推导 sources 已引的
      「§1.3，约 eq. (1.3.32)-(1.3.36)」区间内，故非 inferred。
  - id: worldsheet.transverse-oscillator-commutators
    note: |
      「N = 1 能级恰有 D-2 个态 α^i_{-1}|0;k⟩」这一计数用的是横向振子代数
      （每个 i 一份 Heisenberg 代数、无鬼）。该代数现已单列节点，来源是已核实的
      Polchinski (1.3.25b)，同在 §1.3，故非 inferred。
      支撑区间为 (1.3.25b)、约 (1.3.32)–(1.3.36)；其中 (1.3.25b) 是本分支（curator-polchinski-ch1）
      在 reviewer-ch1 审查后扩充的，原条目的 sources.loc 只写到 约 (1.3.32)–(1.3.36)。
sources:
  - ref: polchinski-1998-v1
    loc: "§1.3（光锥谱：第一激发级 α^i_{-1}|0;k⟩ 须为无质量 SO(D-2) 矢量；横向振子代数），(1.3.25b)、约 (1.3.32)–(1.3.36)"
    note: "抽取记录 polchinski-1998-v1#E18。公式号为近似定位。"
  - ref: gsw-1987-v1
    loc: "§2.3.1（光锥谱与小群表示）"
    note: 已从 mostly-minus / α'=1/2 转写。
summary: |
  光锥量子化把独立自由度定为 D-2 个横向振子，故 N = 1 能级恰有 D-2 个态 α^i_{-1}|0;k⟩
  (i = 2..D-1)，它们构成 SO(D-2) 的矢量表示。
  洛伦兹不变性要求每个质量能级的态构成对应小群的表示：无质量态的小群是 SO(D-2)，
  有质量态的小群是 SO(D-1)。要排除「N = 1 能级有质量」，须排除这 D-2 个态构成 SO(D-1) 的
  **任何**表示——非平凡的与平凡的都要排除，故分两步：

  (1) **非平凡表示由维数计数排除**：当 D ≥ 6 时 SO(D-1) 的最小非平凡真表示是 D-1 维矢量
      （「SO(n) 的最小非平凡真表示是 n 维矢量」只对 n ≥ 5 成立，故这里要求 D-1 ≥ 5），
      而 D-2 < D-1，装不下。（D = 5 是这一步的**例外**，见 gaps 第 3 条：SO(4) 有 3 维的
      自对偶 2-形式表示，恰好容得下 D-2 = 3 个态。D = 4 由 gaps 第 3 条另行覆盖。）

  (2) **平凡表示（D-2 个 SO(D-1) 单态）由「限制到 SO(D-2) 须为矢量」排除**：这 D-2 个态
      α^i_{-1}|0;k⟩（i = 2..D-1）在光锥规范下按构造就是 SO(D-2) 的**矢量**表示，而 SO(D-1)
      的单态限制到子群 SO(D-2) 上仍是单态，D-2 个单态的直和不含 SO(D-2) 矢量
      （D ≥ 4 时 SO(D-2) 矢量非平凡）。故「level 1 是 D-2 个 SO(D-1) 单态」与已知的
      SO(D-2) 矢量结构矛盾，被排除。
      （这一步此前只写在 gaps 第 3 条里、只对 D = 4 用到；2026-09-11 按 ms.critical-dimension-bosonic
      第三轮审计 3(b) 提升到 summary，对所有 D 成立——原先的 summary 只做了 (1)，
      逻辑上排除不掉单态。）

  两步合起来：N = 1 能级必须无质量，由 α' m^2 = N - a 得 0 = 1 - a，即 a = 1。
  这是陈述中的 (c) ⇒ (a)。
gaps:
  - "论证输入是'谱必须组织成洛伦兹小群表示'这一物理要求（光锥规范已破坏显式洛伦兹协变），属一致性要求而非定理，故记为 physical-argument。"
  - "**D ≤ 3 的低维情形不在论证范围内**（SO(D-1) 的表示计数论证失效）；本项目只关心 D = 26 附近，未处理。（2026-09-11 按 ms.critical-dimension-bosonic 第三轮审计 3(b) 由「D ≤ 4」改为「D ≤ 3」：本条原文把 D = 4 也划出范围，与下面 gaps 第 3 条**自相矛盾**——那一条已经证明 D = 4 被覆盖（level 1 只有 2 个态，SO(3) 的 2 维表示只能是 1⊕1，限制到 SO(2) 荷为 0，不含 SO(2) 矢量的荷 ±1，故非平凡表示与单态都排除掉）。auditor 第三轮复核该论证成立。真正未覆盖的低维只剩 D ≤ 3，另加 D = 5 这一处**孤立**的例外，见下条。)"
  - "**D = 5 时 summary 的关键一步为假**（ms.critical-dimension-bosonic 第一轮回译审计 C3，2026-09-11 指出；**待 reviewer 复核**）：summary 写「当 D ≥ 5 时 SO(D−1) 的最小非平凡表示是 D−1 维矢量」，这在 D = 5 不成立——SO(4) 有 3 维的自对偶 2-形式表示（(j₁,j₂) = (1,0)，因 j₁+j₂ ∈ Z 而确是 SO(4) 而非仅 Spin(4) 的真表示），恰好容得下 D−2 = 3 个态 α^i_{−1}|0;k⟩，且它限制到无质量小群 SO(3) 上正是矢量，故维数计数与限制**都排除不掉**「level 1 有质量」这一可能。「最小非平凡真表示是 n 维矢量」只对 SO(n)、n ≥ 5 成立。后果：本推导实际覆盖的是 D = 4（level 1 只有 2 个态，装不进 SO(3) 的任何非平凡表示；两个单态限制到 SO(2) 也不是矢量）与 D ≥ 6；**D = 5 需要别的输入**（协变的矢量结构，或 worldsheet.critical-dimension-light-cone 的洛伦兹代数论证）。目标陈述 worldsheet.open-string-intercept-v2 的「(a)(b)(c) 对任意 D ≥ 4 等价于 a = 1」中，(c) 那一条在图内因此没有 D = 5 的支撑（(a)(b) 由 --via-null-state-decoupling 支撑，对 D ≥ 2 成立，不受影响）；陈述不可变，ms.critical-dimension-bosonic 的 canonical_text (V) 已改为按刻画分列维数范围。本推导 status 维持 physical-argument：论证形状未变，只是覆盖范围收窄。**2026-09-11 补记（第三轮审计 3(b)）**：本条里对 D = 4 用到的「两个单态限制到 SO(2) 也不是矢量」那一步，其实是排除**任意** D 下的「D−2 个 SO(D−1) 单态」所必需的，原先只在本条对 D = 4 写出，现已提升到 summary 的第 (2) 步，对所有 D ≥ 4 成立；summary 原先只做维数计数，逻辑上排除不掉单态。这一提升**不改变**本推导的覆盖范围（仍是 D = 4 与 D ≥ 6），只是把论证补完整。"
  - "本推导给出 a = 1，不给出 D = 26。与 worldsheet.critical-dimension-light-cone--via-lorentz-algebra 共用 light-cone-quantization 定义，但那条另外用了 ζ 正规化，本条不用。"
  - "抽取记录 literature/extractions/polchinski-1998-v1.md 现已存在，#E18 的编号与内容经 curator 核对一致（第一激发能级的 SO(D-2) 矢量计数）。但该记录的 §0 与 Q2 指出：Polchinski §1.3 正文究竟走的是表示论计数还是显式洛伦兹代数验算**未核对原书**，且 D=26 的结论必在已核实的 (1.3.36) 之后（约 (1.3.37)-(1.3.42)，式号未核实）。"
