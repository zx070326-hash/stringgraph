  - "fgz-1986 中没有以 {d, b_m} = L_m 形式出现的编号陈述，故本命题目前**没有已核实的数学文献编号来源**；可追溯性只到 Polchinski §4.3 (4.3.6)（式号由 schrans-2020 目录核实，原书未核对）。"
