summary: |
  在受限模 V 上，对固定的 v ∈ V 与固定的 m，下面每一步的模式和都只有**有限多项非零**
  （存在 N = N(v) 使 L^m_n v = b_n v = c_n v = 0 对 n > N，且反对易子 {b_m, c_n} = δ_{m+n,0}
  只在单一 n 处非零），因此下列重排全部合法——这正是把本推导标为纯代数计算的前提。

  逐项算 {Q_B, b_m}：

  1. **物质项** Σ_n c_n L^m_{−n}：因 b_m 与 L^m_{−n} 对易（物质与鬼场部门独立），
     { Σ_n c_n L^m_{−n}, b_m } = Σ_n {c_n, b_m} L^m_{−n} = Σ_n δ_{n+m,0} L^m_{−n} = L^m_m。

  2. **鬼场三次项** Σ_{k,n} ((k−n)/2) : c_k c_n b_{−k−n} :：与 b_m 取反对易子时，
     b_m 只与两个 c 反对易（{b_m, b_j} = 0），每个 c 给一个 δ。用 (k − n)/2 关于
     k ↔ n 的反对称性把两个贡献合并，得
       Σ_n (( −m − n) − n)/2 · 2 · : c_n b_{−m−n} : 型的项，
     整理后恰是 Σ_n (2m − n) : b_n c_{m−n} : = L^g_m
     （用 worldsheet.brst-quantization 中 L^g_n = Σ_k (2n − k) : b_k c_{n−k} : 的写法，
     并用 {b, c} 的反对易把 : c b : 换成 : b c : 时的符号）。

  3. **正规序常数项** a^g c_0：{a^g c_0, b_m} = a^g {c_0, b_m} = a^g δ_{m,0}。

  三项相加：{Q_B, b_m} = L^m_m + L^g_m + a^g δ_{m,0} = L^tot_m。

  一致性核对（不构成独立证明，但排除符号错误）：
    - m = 0 给 {Q_B, b_0} = L^m_0 + L^g_0 − 1，与 worldsheet.brst-quantization 中相对复形
      的两个条件 b_0|ψ⟩ = 0、L_0|ψ⟩ = 0 相容（Q_B 保持该子空间，
      见 worldsheet.brst-preserves-relative-complex）；
    - 作用在 |ψ⟩ ⊗ |↓⟩ 上（L^g_0|↓⟩ = 0）给 (L^m_0 − 1)|ψ⟩，即截距 a = 1，
      与 schrans-2020 [4.226] 一致。
gaps:
