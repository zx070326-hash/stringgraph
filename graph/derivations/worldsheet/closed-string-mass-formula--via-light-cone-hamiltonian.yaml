summary: |
  与开弦同样地由 m^2 = 2p^+p^- - p^ip^i 出发，把光锥哈密顿量用闭弦模式展开写出。
  左行与右行各贡献一份自由场哈密顿量，各带一个正规序常数，
  用闭弦零模归一化 α_0 = ᾱ_0 = (α'/2)^{1/2}p 配平因子，得
  m^2 = (2/α')(N + Ñ + A + Ã)。左右行的横向振子结构相同故 A = Ã = -(D-2)/24。
  在 D = 26 与 N = Ñ 下代入即得 α'm^2 = 4(N-1)。
gaps:
  - "A = Ã = -(D-2)/24 依赖 ζ/截断正规化，故有效状态不高于 physical-argument。"
  - "化简式 α'm^2 = 4(N-1) 是否在 Polchinski 书中显式出现未核实（抽取记录 §3 清单）；本推导给出它作为代入 level matching 与 D = 26 的直接推论。"
  - "整体因子依赖 ℓ、c、τ 的归一化（conv.worldsheet-coordinate-length）；已核实的 (1.4.8) 用作系数的交叉检验。"
