summary: |
  机器检查的证明：显式写出见证并逐条核验。

  1. **标架**：D ≥ 3 时取三个互异指标 0（frameTime）、1（frameSpace）、2（frameTrans）；
     η := `Fock.minkowski D R` = diag(−1, +1, …, +1)，`minkowski_sq` 给 (η)。
  2. **见证**：b := e_0 + e_1（`witnessLight`）；a := ½ e_0 + (3/2) e_1（`witnessMomentum`）；
     ε := e_2（`witnessPolarization (frameTrans)`）。
  3. **逐条核验**（每条是 `dotVec` 在两个 `Pi.single` 之和上的展开，工具引理 `dotVec_pair` /
     `dotVec_single_pair_of_ne` / `dotVec_single_single` 把它化成两三项的环等式，`ring` 或
     `linear_combination two_mul_invTwo` 收尾）：
       (N) η(b,b) = −1 + 1 = 0                       `dotVec_witnessLight_self`
       (S) η(b,a) = −½ + 3/2 = 1                     `dotVec_witnessLight_witnessMomentum`
       (T) η(ε,b) = 0（指标 2 ∉ {0,1}）               `dotVec_witnessPolarization_witnessLight`
       (U) η(ε,ε) = η_2 = +1                         `dotVec_witnessPolarization_witnessPolarization`（i = j）
       (M) ½ η(a,a) = ½(−¼ + 9/4) = 1                `invTwo_mul_zeroModeSq_witnessMomentum`
  4. 六元组打包成 `∃ η a b ε, … ∧ …` 即目标卡断言。

  **假设集的必要性**：½ 的出现不是方便——(S) 与 (M) 在此标架下联立强制 a = (½, 3/2, 0, …)
  （目标卡 notes），故本文件需 `[Algebra ℚ R]`——**但仅因 (M) 的 invTwo 写法而需要**（reviewer-batch26 更正：ℤ 上有见证 a = (0,1,1,0,…)，见目标卡 notes）；D ≥ 3 用于 `frameTrans`（ε 需要 0、1 之外的方向）。
