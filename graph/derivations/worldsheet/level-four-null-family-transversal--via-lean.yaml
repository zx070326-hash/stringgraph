summary: |
  七步纯振子代数论证（详见目标卡 statement 的【机制】段）：
  (1)-(2) 四条力矩方程通过反对称化消去 a、b、c、n 贡献，得
      3[(δ·ρ)m_ε−(ε·ρ)m_δ] = 4(ρ·p)[(δ·p)m_ε−(ε·p)m_δ]；
  (3) 取 ρ:=p_j 用 3−4p²≠0 得 (δ·p)m_ε=(ε·p)m_δ 对一切 ε,δ；
  (4) 回代得该式对一切 ρ 成立；
  (5) 取 ρ:=u=δ（横向单位偏振）用 huu、hu 得纵向矩 m_{p_j}=0；
  (6) 用 (3) 与 hpp（p·p≠0）解出 m_ε=0 对一切 ε；代回四条方程得 n≡0；
  (7) m、n 全零 ⇒（两次调用 fock-state-determined-by-moments）ψ=0；
      代回原方程用 towerLop_neg_one_injective 得 φ=0。
gaps:
  - |
    本推导未证"该机制对任意满足 p_j·p_j≠0、3−4(p_j·p_j)≠0 且横向单位偏振存在的
    rung/level 组合成立"这一更一般的陈述（目标卡【本卡明确不断言】(c) 已声明范围
    只到 level-4 反对角片专属的具体系数）；level-5 起两族计数本身已知不再精确匹配
    （worldsheet.ddf-spanning-rank-inequality notes【2026-09-12（五）】），需要全新的
    力矩方程组与全新的重叠分析，未来工作。
notes: |
  本推导只服务目标卡（横截性引理本身），不重复目标卡 sources.loc 已详细列出的
