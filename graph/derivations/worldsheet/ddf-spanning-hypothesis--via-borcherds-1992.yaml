      worldsheet.ddf-spanning-rank-inequality 的记法），N ≥ 6 是当前前沿；
      代价：对一般 N 开放，故 effective = open。
  ⇒ **后者的价值不因前者而消失**：本推导不能替代 --via-rank-inequalities（不产出 Lean 陈述），
  --via-rank-inequalities 也不能替代本推导（它是 open 的）。两条推导**并存**，
