  【D = 26 在本推导里的位置，以及**为什么不为它单列一条边**】
  Borcherds 的 26 经 Lemma 5.4 进入：Thm 5.1 的假设是「Virasoro 中心元在 V 上作用为乘 24」，
  Lemma 5.4 的证明用到「V 上 24、张 II_{1,1} 后 H 上 26」，§5 正文逐字：
  「The 26 comes from the 24 in theorem 5.1 plus the dimension of II_{1,1}.」。
  本项目里与「c = D」对应的是 worldsheet.free-boson-vertex-algebra-conformal-vector
  （该卡断言 V_{(𝔥,Zk)} 的共形向量 ω 的中心荷 = D，且 L_n = ω_{n+1} 与 Sugawara L_n 同族）。
  **那条边本推导刻意不连**：Borcherds 的证明体不调用该卡的任何声明，该卡也不承载
  「H_phys ⊆ D(Ε)+H_null」这个包含式的任何一步——按本项目已确立的**接口边裁决**
  （「只提供语境不承担论证的边不得存在」，先例见
  worldsheet.no-ghost-theorem-v4--via-goddard-thorn 撤出 ddf-contour-equals-mode-sum 那条边、
  以及 critical-dimension-light-cone-v2--via-lorentz-algebra 的 auditor 2026-09-12 裁定 R2），
  连它会**多压出一个 physical-argument 瓶颈**（该卡 own = physical-argument），
  使 `why` 的瓶颈树从「唯一的算子字典缺口」变成两枝，掩盖本推导真正未闭合的那一条。
  ⇒ D = 26 的对应关系**记在这里**（并见 summary 的三空间字典段），不单列为 depends_on 边。
  ⚠ 这与目标卡边界 (c)「D = 26 在无鬼定理链条上唯一进入本卡」不冲突：
  那句话说的是 26 在**整条链**里的位置，本推导只是这条链上的一条推导。

  【本推导不改动目标卡的任何 statement 文本，也不标 formalized】
  目标卡 statement 是命题 (B) 的不可变卡片（项目原则 1），本推导只在同名目标卡的 `notes`
  追加而不动正文（见目标卡 notes 【2026-09-15 追加】段）。
  **不标 formalized**：Borcherds 的证明不在本仓库的 Lean 里，`formal.lean_decl` 无所指；
  目标卡的 `formal.lean_decl = StringFormal.NoGhost.DDFSpans` 是一个 `def … : Prop`
  而非定理（目标卡 sources 第二条 ⚠ 逐字已记录），本推导不能借用它。
  ⚠ 本推导**没有**在 Lean 里做任何事，故不涉及 `lake build` / `check-axioms`；
  合并前由 lead 按项目纪律决定是否额外跑。
