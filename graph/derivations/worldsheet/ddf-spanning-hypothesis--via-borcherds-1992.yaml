      **围道积分** A^μ_n = (1/2πi)∮P^μ(z)V(n k_0,z)dz。三者是同一族算子的三种写法：
          K_i  (VOA 语言，Borcherds)
          ↗   ↖
        A^i_n (围道，GSW/GT/goddard-2008)  ⟷  A^ε_n (模态和，v6，本项目)
      横向那条等号由本条边指向的卡承载（洛朗系数记账：幂次条件 (−m−1) + K = −1 恰给 K = m）。
      **该卡 effective = physical-argument**：它的 gaps 第 1 条逐字写「第 3 步的重排在算子层面
      没有论证」，notes 逐字写「本推导为什么不是 rigorous：rigorous 的例外条款要求「前提完整 +
      有限步初等计算 + reviewer 已独立复核并记录」，本推导的前提里含一个**未定义的对象**
      （围道积分的算子值被积量），故前提不完整，例外条款不适用」。
      ⇒ (1) 标 `inferred: true` 的理由**不是**「本卡不引用它」——本推导**确实**引用它：
      没有这条边，「Borcherds 张成的 T¹ 就是本项目张成的 D(Ε)」这句话在图上无节点可指。
      标 inferred 的理由是**从 A^ε_n 到文献围道 A^i_n、再到 Borcherds 的 K_i 的逐字字典
      在一手文献里未成文**（borcherds-1992.md §未解决的疑问第 2 条逐字：
      「K_i ↔ DDF 算子 A^ε_n 的逐字对应……**属标准知识但非本文成文**」；
      ddf-spanning-no-source-check-2026-09-14.md §5 第 1 条**强制**要求 curator 把这一步
      标 `inferred: true` 并留 note）。
      (2) **这就是把本推导 effective 压到 physical-argument 的那条边**——预期行为，
