      （商模 H_phys(a₀)/H_null(a₀) 上的诱导型 ⟨·,·⟩_quot）。
      **非 inferred**：H_null 的定义与商型的良定义性都是本卡的逐字内容，已 formalized
      （Lean `towerNullSubmodule`、`towerQuotientPairing`），不需要跨语言字典。
      ⚠ 该卡边界 (a) 明写「**不断言反包含 H_null(a₀) ⊆ H_spur**」，故本推导**不得**由本边
      推出「商掉的是伪态而非正交根基」。Borcherds Lemma 5.5 的 N¹ 逐字是 P¹ 的根、
