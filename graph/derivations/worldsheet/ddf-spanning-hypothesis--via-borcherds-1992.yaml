  - id: worldsheet.tower-physical-quotient-form
    inferred: false
    note: |
      **H_null 与商型（目标陈述左端的「+ H_null」）。** 目标卡【三个子空间】第三条逐字：
      「**零态** H_null := H_phys ∩ H_phys^⊥ = { Χ ∈ H_phys : ⟨Χ, Ψ⟩_T = 0 ∀ Ψ ∈ H_phys }
