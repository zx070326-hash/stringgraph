sources:
  - ref: borcherds-1992
    loc: "§5 'The no-ghost theorem'，Theorem 5.1 + Lemmas 5.1–5.5（含 Lemma 5.1 前的子空间定义段 H、P、S、N = S∩P、T、K = K_i 生成的空间、Ve^r），以及 §5 正文的 D=26 那句"
    note: |
      **本条承载本推导的全部论证。L1**（researcher 2026-09-14 逐页读图；
      抽取记录 literature/extractions/borcherds-1992.md §E1/E2/E3）。
      ⚠ **引用陷阱（该抽取记录首部逐字警告）**：作者主页重排本页码 1,2,3,… 与期刊
      Invent. Math. 109, 405–444 **不对应**（Theorem 5.1 落在重排本 p.19），
      故本条 loc **只写节号/定理号，不写页码**。

      **E1 = Theorem 5.1（L1 逐字要点）**：设 V 带非退化双线性形式、被 Virasoro 代数作用
      （L_i 的伴随是 L_{−i}、中心元作用为乘 24、L_0 本征值非负整数且各本征空间有限维），
      被保结构群 G 作用；V_{II_{1,1}} 为二维偶自对偶洛伦兹格 II_{1,1} 二重覆盖的顶点代数；
      P¹ := {v ∈ V ⊗ V_{II_{1,1}} : L_0 v = v, L_i v = 0 ∀ i > 0}，P¹_r 是其中
      II_{1,1}-度数为 r 的子空间。**结论逐字**：
        「Then the quotient of P¹_r by the nullspace of its bilinear form is **naturally
        isomorphic**, as a G module with an invariant bilinear form, to V^{1−(r,r)/2}
        if r ≠ 0 and to V¹ ⊕ R² if r = 0.」
      同构是**双向**的：既是单射（正范数、无鬼）又是**满射**——V^{1−(r,r)/2} 的每个元素都
      来自某物理态模零态，即横向/DDF 态**张成完整**物理子空间。**满射这一半逐字就是 (B)**。

      **E2 = 证明链 Lemmas 5.1–5.5（L1 逐字）**。Borcherds 明写这是 Goddard–Thorn 1972
      原始证明的复述（逐字：「The original proof of Goddard and Thorn [21] works for the
      cases we need with only trivial modifications. For convenience we give a quick sketch
      of their proof.」）：
        1. **Lemma 5.1**：T 中非零范矢量 f 经 L_{m_1}…K_{n_1}…(f) 生成的态线性独立、
           张成一个在 K_i/L_i 下不变、形式非退化的空间
           （证明：**内积矩阵可排成上三角、对角非零**）。
        2. **Lemma 5.2**：T 上双线性形式非退化；K = T ⊕ (K 的零化空间)。
        3. **Lemma 5.3**：**Ve^r ≅ T**（自然同构）。
        4. **Lemma 5.4**：L_{i<0} 生成的结合代数由把 S¹ 映入 S 的元素生成
           （证明用到「Virasoro 中心在 V 上作用为 24、故在 H 上为 26」——**D = 26 在此步进入**）。
        5. **Lemma 5.5**：**P¹ = T¹ ⊕ N¹**（直和分解：任一物理态 = 横向态 + 零态）。
      收尾逐字：「The no ghost theorem now follows immediately, because by lemma 5.3
      V^{1−(r,r)/2}e^r is isomorphic to T¹, and by lemma 5.5 T¹ is isomorphic to the quotient
      of P¹ by its nullspace.」

      **三空间字典**（borcherds-1992.md §约定末段，L1）：
        Borcherds **P¹**（L_0 本征值 1、被 L_{i>0} 湮灭）↔ 本项目 **H_phys**；
        Borcherds **T¹**（横向空间，被所有 K_i (i>0) 湮灭者）↔ 本项目 **D(Ε)**（DDF 张成）；
        Borcherds **N¹ = P¹ 的双线性形式的根** ↔ 本项目 **H_null**。
      **Lemma 5.5 逐字就是张成命题**：P¹ = T¹ ⊕ N¹，在直和意义下比目标卡的 ⊆ 更强。
      ⚠ 这一步跨语言等同**不是** Borcherds 写的：全篇不出现 A^ε_n、不出现动量塔、不出现 α'。
      字典缺口见同名推导 depends_on 第 2、3 条边与 gaps 第 1、3 条。
      **本图不得把本条来源当成「Borcherds 逐字证了本项目命题」来引用。**

      **E3 = D = 26 的地位（L1 逐字）**：§5 正文「The 26 comes from the 24 in theorem 5.1
      plus the dimension of II_{1,1}.」；§6 Remark「it is only when this [conformal] vector has
      dimension 24 that we can apply the no-ghost theorem to identify the homogeneous pieces of M
      with those of V. … this need not be true if the conformal vector has dimension greater
      than 24, even if the inner product on V is positive definite.」

      **证据等级与严格程度**：L1（作者主页 TeX 重排本落盘后逐页读图）。Borcherds 自称
      「quick sketch」，但每一步都给了证明理由（Lemma 5.1 给内积矩阵的上三角论证、
      Lemma 5.4 指认 24/26 的来源），且这是发表在 Invent. Math. 的**编号定理**，
      属 Borcherds 获 1998 Fields 奖的工作所含内容。
      **本推导 own status = rigorous 即依据此条**（见 notes【为什么 own = rigorous】）。
      ⚠ 重排本 vs 期刊印本逐字一致性为 **L0**（作者本人重排，风险低，但严格计属未与期刊扫描件
      逐字复核）——该抽取记录 §未解决的疑问第 1 条已登记。
  - ref: fgz-1986
    loc: "Theorem 2.8 的**第二个同构**（PNAS 83, 8442–8446），配套 Theorem 2.7(ii)（维数 p_(24)(1 − p·p/2)）与 Theorem 1.12（消灭）"
    note: |
      **独立等价来源，不承载本推导的证明体。** FGZ Theorem 2.8 第二个同构（L1，
      literature/extractions/brst-cohomology-sources.md §1.3）：
        T ∩ P ≅ P / rad P     （横向空间 ≅ 物理态模零态），
      三空间正定、维数 p_(24)(1 − p·p/2)；**FGZ 自己指认这就是无鬼定理**（原文逐字：
      「The second isomorphism … is known as the no-ghost theorem in the physics literature
      (8,9)」，其中 8 = Goddard–Thorn 1972、9 = Brower 1972）。
      ⇒ 与 borcherds-1992 那条来源**相互独立**（半无限上同调 vs VOA 计数），
      且给出同一结论的**维数版本**（维数配平即完整性即满射）。
      ⚠ 列它的理由有二：(i) 独立性——本推导结论不依赖单篇文献的可靠性；
      (ii) 维数版本把「张成」写成一条可核的等式 p_(24)(1 − p·p/2)，
      与目标卡 notes【为什么 26 只在这里】记录的本项目特征标计数（φ(q)^{−(D−2)}
      对 φ(q)^{−(D−1)} 减零态）是同一件事的两个算法。
      ⚠ **本条不承载论证**：FGZ 的证明梗概在 PNAS 六页短文里，完整长文本项目未获取
      （brst-cohomology-sources.md §1.3 的 L1 覆盖以定理陈述为限），故本推导的**证明体**
      逐字只走 borcherds-1992 一条。
      ⚠ bib key 是 `fgz-1986`，别名 `frenkel-garland-zuckerman-1986` 见 sources.bib 该条
      note 的查重锚点段（改 key 会破坏 graph/ 全部已有引用，不要改）。
  - ref: goddard-2008
    loc: "§6 'No-Ghost Theorem', p.15, eq. (6.4)（arXiv:0802.3249v1）"
    note: |
      **不承载本推导的论证。列它是为记账目标卡 status 变化的前后关系**：
      目标卡此前唯一引用的文献来源就是本条——一句无证明结论（逐字「For D = 26, if |ψ⟩ is a
      physical state … it can be written in the form |ψ⟩ = |f⟩ + |n⟩」，|f⟩ 为 DDF 态、
      |n⟩ 为零模态），转引 goddard-thorn-1972 [45]，而后者正文本项目未获取。
      目标卡 sources 第一条与 notes 逐字：「文献侧只有一句结论（转引 GT 1972），
      **连「骨架 + 断言」都算不上**（docs/STATUS_LEVELS.md 的「断言 + 骨架」档位要求来源给出
      论证骨架）」——这正是它此前 status = open 的理由。
      本推导补上的那份**论证骨架**来自 borcherds-1992 §5 的 Lemmas 5.1–5.5。
      ⚠ 本推导**不**声称 Goddard 2008 (6.4) 与本推导结论在量词上逐字一致：
      原文在 D = 26 上断言，目标卡按边界 (c) 不为任何 D 断言；原文的 |n⟩ 是零模态、
      本项目的 H_null 逐字是零模态子模，**这一半一致**（目标卡 sources 第一条已记录这两处
      措辞差别，本推导不改动它）。
summary: |
  Borcherds 1992 §5（Invent. Math. 109, 405–444）的 Theorem 5.1 连同证明链 Lemmas 5.1–5.5，
  是目标命题 **(B) H_phys ⊆ D(Ε) + H_null** 的一条**已发表、带完整证明、期刊编号**的论证。
  本推导把这条 VOA 语言的证明接进本项目的模态和 DDF 框架。

  **论证骨架（borcherds-1992 §5，L1 逐字）**
  Borcherds 在顶点代数 V ⊗ V_{II_{1,1}} 上取物理空间 P¹ = {v : L_0 v = v, L_i v = 0 (i>0)}，
  横向空间 T¹ = P¹ 中被所有 K_i (i>0) 湮灭者（K_i = v_{i−1}，v = e^{−w}_{−2}e^w，
  w 为 II_{1,1} 中类光矢量），零化空间 N¹ = P¹ 的双线性形式的根。链是：

    **Thm 5.1 结论**：P¹_r 模去其双线性形式的零化空间，**自然同构**于 V^{1−(r,r)/2}（r ≠ 0）。
    自然同构 ⇒ **满射** ⇒ V^{1−(r,r)/2} 的每个元素都来自某物理态模零态 ⇒ **横向态张成**。
    这就是 (B) 的满射/完整性那一半。
    **Lemma 5.5**：**P¹ = T¹ ⊕ N¹** —— 逐字就是张成分解：任一物理态 = 横向态 ⊕ 零态。
    **Lemma 5.3**：Ve^r ≅ T —— 把 Thm 5.1 右端的 V^{1−(r,r)/2} 与左端的 T¹ 接上。
    **Lemma 5.4**：L_{i<0} 生成的结合代数由把 S¹ 映入 S 的元素生成；证明用到
    「Virasoro 中心在 V 上作用为 24、故在 H 上为 26」——**D = 26 在此步进入**。
    **Lemma 5.1 / 5.2**：T 中非零范矢量经 L、K 生成的态线性独立且形式非退化（内积矩阵上三角、
    对角非零）；T 上形式非退化且 K = T ⊕ (K 的零化空间)——5.3/5.5 的正交性输入。
    收尾逐字：「The no ghost theorem now follows immediately, because by lemma 5.3
    V^{1−(r,r)/2}e^r is isomorphic to T¹, and by lemma 5.5 T¹ is isomorphic to the quotient of
    P¹ by its nullspace.」

  **三空间字典（本项目的对应，borcherds-1992.md §约定末段 L1）**
      (Borcherds P¹, T¹, N¹)  ↔  本项目 (H_phys, D(Ε), H_null)。
  Lemma 5.5 由此读作 H_phys = D(Ε) + H_null——**比目标卡的 ⊆ 更强**（它是直和分解），
  故目标卡的断言成立。**D = 26 经 Lemma 5.4 的「c = 24 横向张 II_{1,1} 后 26」进入**，
  与目标卡 notes【为什么 26 只在这里】的判断（DDF 态特征标 φ(q)^{−(D−2)} 对物理态模零态的
  φ(q)^{−(D−1)} 减零态，只在 D = 26、a₀ = 1 时相等）**完全吻合**。
  这是本推导相对目标卡原有文献来源（goddard-2008 (6.4) 一句无证明结论）的实质增量：
  **26 的来源现在有一步可指认的证明（Lemma 5.4），而不是一个假设。**

  **独立等价来源（不承载论证）**
  FGZ 1986 Theorem 2.8 的第二个同构 T ∩ P ≅ P/rad P，维数 p_(24)(1 − p·p/2)，
  FGZ 自认这就是无鬼定理。与 Borcherds 一条独立（半无限上同调 vs VOA 计数），
  给出同一结论的维数版本；列在 sources 但不走它的证明体（PNAS 六页只有梗概，
  完整长文未获取）。

  **本推导真正未闭合的缺口（见 gaps）**
  两条，**并列**，都停在 physical-argument：
  (1) **对象识别**：Borcherds 的 V ⊗ V_{II_{1,1}} 与本项目的动量塔是同一个对象吗——由
      worldsheet.momentum-tower-is-borcherds-no-ghost-instance 承载（2026-09-21 从一条
      `inferred: true` 边提成节点，见该边 note）。
  (2) **算子字典**：从 Borcherds 的 K_i / 文献的围道 A^i_n 到本项目 v6 的模态和 A^ε_n 的等价——
      由 worldsheet.ddf-contour-equals-mode-sum 承载，该边仍标 `inferred: true`
      （理由是**那条边的论证**在来源里找不到，而命题本身已是图内节点；
      这正是 `inferred` 的唯一正确用法）。
  两者**共同**把本推导的 effective 压到 physical-argument——这是预期且刻意正确的记账。
  **不要**为抬高 effective 而删这两条边或把它们降回 flag：那会把「Borcherds 用 VOA 语言证的、
  本项目用模态和语言写的，两者之间差一部未成文的对象字典和一部未成文的算子字典」
  这个真实缺口抹掉。
