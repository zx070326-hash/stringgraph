id: worldsheet.kac-determinant-v2--via-feigin-fuchs
target: worldsheet.kac-determinant-v2
kind: proof
status: rigorous
depends_on:
  - id: math.verma-module-free-over-negative-part
    note: |
      **2026-09-11 拆卡换代（第一次）**：本边原指旧卡 worldsheet.verma-module，改指
      worldsheet.verma-module-pbw-basis（它 depends_on verma-module-v2，构造与分级仍在链上）。
      理由：Kac 行列式是逆变（Shapovalov）形式在 level N 的 **PBW 基**下的 Gram 行列式，
      其 p(N) × p(N) 的规模与「行列式」这一说法本身都需要归入 PBW 基的那一半
      （有序单项式构成基、dim V_N = p(N)），只有构造与分级写不出这条公式。
      **2026-09-11 合并换代（第二次）**：worldsheet.verma-module-pbw-basis 已 superseded_by
      **math.verma-module-free-over-negative-part**（两卡内容逐条重叠，后者来源更好：virasoro-lean-2025
      §12 p.11 的 L1 逐字转录 vs. 前者三条未核实到命题级的 sources），其推导已删除，本边随之改指。
      两卡的 (1)(2)(3) ↔ (1)(2)(3)(4) 一一对应；唯一的记法差别是基元下标的标号顺序
      （前者 n_1 ≥ … ≥ n_k，后者 1 ≤ n_1 ≤ … ≤ n_m），**同一组基元**，见新目标推导的 notes。
  - id: worldsheet.virasoro-algebra-v2
  - id: worldsheet.kac-determinant-level-two
    inferred: true
    note: |
      **2026-09-11 新增，记账用的边：N = 2 的独立低阶核对，不承载本推导的论证。**
      那张卡（formalized，Lean 的 `IsContravariant.gram_level_two_det`）给出
      det = 2h(16h² + 2h(c−5) + c)，与本目标在 N = 2 的形状逐项吻合
      （指标 (1,1)(1,2)(2,1)、指数 p(1) = p(0) = 1、h_{1,1} = 0、两根之和 (5−c)/8 与之积 c/16、
      α₂ = 32 > 0；核对见那张卡的 notes 与本目标 notes 的 (B)）。
      ⚠ **`inferred: true`**：本推导所引的两条来源（feigin-fuchs-1982 §3.2 / §4.2）
      **没有**引用这条低阶核对，它也不是 FF 论证的一步；这条边纯粹记录
      「图里存在一条独立的、机器验证过的 N = 2 检验」。
      ⚠ 它**不能**升级本推导：那张卡是**张成集**的 Gram 行列式，与 Kac 行列式相差
      「{L₋₂v, L₋₁²v} 线性无关」（= dim V_2 = p(2)），而后者恰是本推导第一条边
      math.verma-module-free-over-negative-part 提供的东西。故无循环，但也无新信息量。
sources:
  - ref: feigin-fuchs-1982
    loc: "§3.2 «Теорема Каца», Теорема 3.1（陈述，俄文原刊第 58 页）+ §4.2 «Доказательство теоремы 3.1»（证明，俄文原刊第 62 页）"
    note: |
      **2026-09-11 订正**：原 loc「§2（完整证明）」**是错的**——§2 讲的是「不变算子 ↔ 特殊向量」的
      辅助构造与主系统的渐近解。researcher L1 逐页读图核实（math-sources.md §34.2）：
      论文自述结构（p. 47）逐字「В **§ 3** формулируется **теорема Каца** … Заключительный
      **§ 4 содержит доказательство теоремы Каца**」。
      §4.2 的证明用 §4.1 显式构造的特殊向量 ξ^k_{m,n}（Предложение 4.1、4.2）
      + §3 的 Предложение 3.2、3.3 + 归纳，末句逐字
      «Таким образом, det² M_{h,c}(r) делится на ∏∏_{j|i} Φ_{j,i/j}(h,c)^{p(r−i)}，
      и очевидное вычисление степеней показывает, что частное есть константа»。
      ⚠ 原文是 **det²** 且用无根号的 Φ_{α,β}，常数只被断言**非零**；三种参数化的对照与
      researcher 的一致性验算见 math-sources.md §34.8（**那一小节是推断，不是原文**）。
      ⚠ **本条正是目标 v2 里「α_N 是非零常数」的唯一来源**，且经一步换算：
      若 ∏_{α,β} Φ_{α,β} = ∏_{r,s} (h − h_{r,s})²，则 det² = C ∏ 与 det = α_N ∏ 给出 α_N² = C，
      于是 «C ≠ 0» ⟺ α_N ≠ 0。这一步的参数化对照就是上面 §34.8，**属推断层**；
      「α_N > 0」两条来源都不支持，故 v2 的陈述只写「非零」（见目标卡 notes (A)）。
      ⚠ 英译本（Funct. Anal. Appl. 16 (1982) 114–126）的编号与页码未核实（Q25）。
  - ref: kac-1979
    loc: "pp. 441-445（编号未核实，**不得写 Theorem 1**）"
    note: |
      **2026-09-11 订正：原 loc「Theorem 1（陈述与证明概要）」两处都无据，已删。**
      (a) 内部编号 L0（LNP 94 正文未获取：Springer 认证墙 + archive.org 无 Austin 1978 那卷，
          math-sources.md §34.1 第 4 点、§34.10 Q23）；
      (b) 「概述证明」无据——FF 只说 «Кацу удалось вычислить определитель…»（Kac 算出了这个行列式），
          并把「可约性问题**已由 Kac 1979 解决**」写在明处，同时自称提供的是**新证明**
          （«новое доказательство теоремы Каца»，p. 47 逐字）。
      本条在本推导中只承载**归属**：FF 的参考文献 [2] 逐字就是本条，Теорема 3.1 标注 «(см. [2])»。
      ⚠ 另有一句常被引作「Kac 只宣布不证明」的证据（FF 俄文 p. 59 首句
      «доказательство теоремы 2.1 не опубликовано»），**本项目禁止引用**：
      字面印的是 2.1 而 §2 里没有编号为 2.1 的定理，语义上只能指 3.1，判读未钉死（Q26）。
summary: |
  Feigin–Fuchs 1982 §4.2 给出 Kac 行列式的**完整证明**：用 §4.1 显式构造的特殊（奇异）向量
  ξ^k_{m,n} 证明 det² M_{h,c}(r) 被 ∏_i ∏_{j|i} Φ_{j,i/j}(h,c)^{p(r−i)} 整除，
  再用次数计数说明商是常数。零点集与重数由此定出。数学界接受为定理。

  **归属的实情（2026-09-11 核实后改写）**：
  · FF **自称给的是一个新证明**（«новое доказательство теоремы Каца»），
    并把「可约性问题已由 Kac 1979 [2] 解决」写在明处；
  · 关于 Kac 那篇，FF 只写「Кацу удалось вычислить определитель M_{h,c}(k)」
    （Kac 成功算出了这个行列式），**没有说 Kac 概述了证明**——
    原 summary 的「Kac 给出公式并概述证明」因此**已删**；
  · 与此**不一致的另一条历史线**：schottenloher-2008 把该定理归给 [Kac80] = ICM Helsinki
    （kac-1980-icm），证明外包给 [KR87]/[CdG94]，**全章不引 Feigin–Fuchs**。
    本图对「首发权」**不做裁决**，两条线都登记在目标卡的 sources 里。
