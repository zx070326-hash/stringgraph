summary: |
  两步有限计算，前提在陈述中已完整写出。

  第一步（伴随关系）：Fock 内积由 ⟨0;k|0;k'⟩ 的归一化与 (α^μ_n)† = α^μ_{-n} 确定
  （worldsheet.fock-indefinite-form）。由 L_n = (1/2) Σ_m : α_{n-m} · α_m :（含零模 α_0 ∝ k，
  k 实）逐项取伴随，正规序内的因子两两互换只改变有限多项的排列而不改变值（玻色情形对易子
  仅在 m + (n−m) = 0 时非零，那些项已被正规序固定），得
    (L_n)† = L_{-n}   （所有 n ∈ Z）。
  这一步只用到有限多项：作用在 L_0 分级的某一固定级上时，L_n 的模式和只有有限多项非零。

  第二步（正交性）：取 |ψ⟩ ∈ H_phys(k)，|χ⟩ = Σ_{n≥1} L_{-n}|χ_n⟩（按定义只有有限多项非零）。
    ⟨ψ|χ⟩ = Σ_{n≥1} ⟨ψ| L_{-n} |χ_n⟩ = Σ_{n≥1} ⟨ (L_{-n})† ψ | χ_n ⟩ = Σ_{n≥1} ⟨ L_n ψ | χ_n ⟩ = 0，
  最后一步用物理态条件 L_n|ψ⟩ = 0 (n > 0)。注意这里**不**用到 (L_0 − a)|ψ⟩ = 0，
  质量壳条件只保证 |χ⟩ 与 |ψ⟩ 落在同一个 L_0 本征值上（否则 ⟨ψ|χ⟩ 因 L_0 自伴而自动为零，
  结论仍成立）。

  推论 (2)：|χ⟩ ∈ N(k) 时 |χ⟩ 既在 H_phys(k) 又在 S(k)，由 (1) 对每个物理态正交，
  特别地 ⟨χ|χ⟩ = 0，故 N(k) ⊆ H_0(k)；双线性展开
    ⟨ψ + χ|ψ' + χ'⟩ = ⟨ψ|ψ'⟩ + ⟨ψ|χ'⟩ + ⟨χ|ψ'⟩ + ⟨χ|χ'⟩
  的后三项都是"物理态与伪态"的配对，由 (1) 全为零。
