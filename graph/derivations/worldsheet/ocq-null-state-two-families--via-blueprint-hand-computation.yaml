summary: |
  取 D = 26、a₀ = 1（唯二的两条外部假设，(N)(S) 恒定沿用 worldsheet.ddf-operators-v6）。
  对固定 N ≥ 2，rung r := −N，Q_M 与 𝒟₂ 依目标卡【设定】定义。

  **Type 1**：对 φ ∈ Q_{N−1}（L_0-本征值 h_{r,N−1}），用 Virasoro 对易关系
  [L_m, L_{−1}] = (m+1)L_{m−1}（对一切 m）展开 L_mL_{−1}φ = (m+1)L_{m−1}φ + L_{−1}L_mφ：
    · m ≥ 2：第二项因 φ 准物理为零；第一项 (m+1)L_{m−1}φ 中 m−1 ≥ 1，同样因 φ 准物理为零。
      ⇒ L_mχ₁(φ) = 0 对一切 m ≥ 2，不需任何额外假设。
    · m = 1：第二项为零；第一项 2L_0φ = 2h_{r,N−1}φ。取 a₀ = 1 时 h_{r,N−1} = a₀ − N + (N−1)
      = a₀ − 1 = 0，故 L_1χ₁(φ) = 0。

  **Type 2**：对 φ ∈ Q_{N−2}（L_0-本征值 h_{r,N−2} = a₀ − 2，取 a₀=1 时为 −1），逐项展开
  L_mD₂φ = 2L_mL_{−2}φ + 3L_mL_{−1}²φ，用 [L_m,L_{−2}] = (m+2)L_{m−2}（m≠2）、
  [L_m,L_{−1}] = (m+1)L_{m−1}、[L_2,L_{−2}] = 4L_0 + (c/2)·id：
    · m ≥ 3：两项各自展开后的中间项都因 φ 准物理（L_kφ = 0，k ≥ 1）逐一消去
      （具体：m−2 ≥ 1、m−1 ≥ 2 ⇒ L_{m−2}φ = L_{m−1}φ = 0；L_{−1}L_mL_{−1}φ 与
      L_{−1}L_{m}φ 一侧的中间对易子同样落在 φ 的湮灭区）。⇒ L_mχ₂(φ) = 0 对一切 m ≥ 3，
      不需任何额外假设。
    · m = 1：得 L_1D₂φ = 12(h_{r,N−2}+1)L_{−1}φ；取 a₀=1（h_{r,N−2}=−1）时系数为零。
    · m = 2：先算 L_2L_{−2}φ = (4h_{r,N−2}+c/2)φ、L_2L_{−1}²φ = 6h_{r,N−2}φ
      （中间步 L_2L_{−1}φ = 3L_1φ + L_{−1}L_2φ = 0 用了 φ 准物理），合并得
      L_2D₂φ = (26h_{r,N−2}+c)φ。h_{r,N−2}=−1 时为 (c−26)φ，故 L_2χ₂(φ) = 0
      **当且仅当** c = 26 = D。

  **落在 H_null**：χ₁(φ) = L_{−1}φ、χ₂(φ) = 2L_{−2}φ + 3L_{−1}(L_{−1}φ) 都是 L_{−1}、L_{−2}
  像之和，manifestly ∈ H_spur；配合上面已证的 ∈ H_phys(a₀=1)，由
  worldsheet.tower-physical-quotient-form 断言 (2)（H_spur ∩ H_phys(a₀) ⊆ H_null(a₀)，
  formalized，"易方向"）直接得 χ₁(φ)、χ₂(φ) ∈ H_null(a₀=1)。

  **N = 2 数值核对**：dim Q_0 = 1（层真空）、dim Q_1 = D−1 = 25（L_1 : F_1→F_0 典型满射，
  核维数 D−1），Type 1 给 25 个、Type 2 给 1 个，合计 26，与
  worldsheet.ddf-spanning-rank-inequality notes (i) 独立算出的答案吻合（数值核对，
  非恒等式证明——两处的显式基未做变换比对）。
