  - id: worldsheet.energy-momentum-laurent-modes
  - id: worldsheet.tt-ope-central-charge-v2
    note: |
      【2026-09-11 换代改指（curator-small-backlog-3）】原指 worldsheet.tt-ope-central-charge（v1），该卡已 superseded_by v2：v1 把「TT OPE 极点结构由共形不变性确定」这条命题内嵌在定义卡里，现拆为定义卡 v2 + 命题卡 worldsheet.tt-ope-pole-structure-from-conformal-invariance。本推导用的是**定义半**（c = TT OPE 四阶极点系数的两倍、及其与 conv.virasoro-standard 的归一化），故改指 v2；论证与有效状态不变。
      本推导只用 c 这个数（经 worldsheet.schwarzian-transformation-of-t 进入 (c/12)S(z;w)）及其归一化——只用定义。
sources:
  - ref: polchinski-1998-v1
    loc: "§2.6, eq. (2.6.9)、(2.6.10)，p.53–54（式号经 schrans-2020 核实，系数未核实）"
summary: |
  直接代入 worldsheet.schwarzian-transformation-of-t 的变换律，取 z = exp(-i w)：
    ∂z/∂w = -i z,  (∂z/∂w)^2 = -z^2,
    z' = -i z,  z'' = -z,  z''' = i z  （' = d/dw）,
    S(z; w) = z'''/z' - (3/2)(z''/z')^2 = (-1) - (3/2)(-i)^2 = -1 + 3/2 = 1/2。
  故 T_{cyl}(w) = (∂z/∂w)^2 T_{pl}(z) + (c/12) S(z; w) = -z^2 T_{pl}(z) + c/24。
  再把两侧展成模：平面上 T_{pl}(z) = Σ_m L_m z^{-m-2}，柱面上 T_{cyl}(w) 的零模即
  σ^2 平移的生成元，读出 H = L_0 + L̄_0 - (c + c̄)/24。
gaps:
  - "本推导继承 worldsheet.schwarzian-transformation-of-t 的全部缺口（OPE 收敛与围道变形，
     lead 裁决 1）。Schwarzian 的值 S(z;w) = 1/2 本身是初等微积分，不构成额外缺口。"
  - "「柱面上 T 的零模就是哈密顿量」用到径向量子化中标度变换 ↔ 柱面时间平移的对应，
     在本图中由 worldsheet.state-operator-isomorphism 承担，此处未列为显式依赖
