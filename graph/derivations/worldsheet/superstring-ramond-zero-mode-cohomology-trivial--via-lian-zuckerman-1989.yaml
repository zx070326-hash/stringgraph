summary: |
  **LZ 的论证（两句，逐字见 sources 第一条；本图逐字转录，未加工）**：

  1. **对象**：固定 p ≠ 0、R 扇区 κ = 0。ℱ(p,0) = Ker b₀ ∩ Ker β₀ ∩ Ker K（Definition 2.2），
     其上 D_R|_ℱ 平方为零（D_R² = K，Prop 1.7(ix)，而 ℱ ⊂ Ker K），故 (ℱ(p,0), D_R|_ℱ) 是复形，
     且按定义 Ker D_R|_ℱ = ℱ(p,0) ∩ Ker D_R = C_rel(p,0)。
  2. **一行公式**：p ≠ 0 ⇒ 存在坐标方向使 p¹ ≠ 0，于是在 ℱ 上
         **{ D_R|_ℱ , d¹₀ / p¹ } = 1**。
     （本图补的算术：D_R 的零模项是 p·d₀，{p·d₀, d¹₀} = p_μ g^{μ1} = p¹；G₀ 的非零模项与鬼场项
     与 d¹₀ 的反对易子为零。**这一步 LZ 未印出**，见 depends_on 的 inferred 边与 gaps 第一条。）
  3. **收缩**：设 Ω ∈ Ker D_R|_ℱ。把 2 的公式作用在 Ω 上：
         Ω = D_R (d¹₀Ω/p¹) + (d¹₀/p¹)(D_RΩ) = D_R (d¹₀Ω/p¹)，
     故 Ω ∈ Im D_R|_ℱ。⇒ **Ker D_R|_ℱ ⊂ Im D_R|_ℱ**；反向包含由 (D_R|_ℱ)² = 0 得。
     ⇒ 上同调为零，且 **C_rel(p,0) = D_R ℱ(p,0)**。
  4. **收缩同伦形式**：2 的公式就是 ε := d¹₀/p¹ 满足 {D_R|_ℱ, ε} = 1，即 ε 是收缩同伦。
     LZ 在 p.311 的 Remark 里正是这样回指本定理的（sources 第二条逐字）。

  **这一步不做**：
  · 不碰 Q_B 上同调。本卡的微分是 **D_R = 总 G₀**，是零模方向的微分；
    Q_B 的消灭定理是 Theorem 2.4（§3 全章，经 Prop 3.2/3.3 与超李代数同调的正合序列 Theorem 3.3.1），
    与本卡在论证上毫无交集。两者在 LZ 的顺序里也是分开的（2.4 在 p.309，2.7 在 p.310）。
  · 不做分次的事：由本定理到 dim ℱ^n(p,0) = 2 dim C^n_rel(p,0)（p.313 式 (6)）另需
    「D_R 保持相对次数」，目标卡「不断言 (c)」照此排除。

  【为什么标 rigorous】
  (1) 结论是**带编号的定理**（Theorem 2.7），期刊是 Communications in Mathematical Physics；
  (2) **证明是印出的**，且是**显式构造**（收缩同伦 ε = d¹₀/p¹ 当场写出），
      不是「一点思考就知道」式的断言——这正是 docs/STATUS_LEVELS.md「断言 + 骨架」裁决要区分开的另一侧；
  (3) 论证全在线性代数里（一个反对易子恒等式 + 一次代入），不涉路径积分、不涉收敛性、不涉维数计数。
  ⚠ **限制**：证明只有两句，其中「{D_R|_ℱ, d¹₀/p¹} = 1」与「d¹₀/p¹ 把 ℱ 映到 ℱ」两步都是
  **断言**（LZ 未印出计算）。两步都是一行的初等验算，但本图**没有**按
  docs/STATUS_LEVELS.md 的 rigorous 例外流程走（无 reviewer 独立复核记录），
  故本推导的 rigorous 是按「发表的数学文献 + 印出的证明」那一档给的，不是按例外条款。
  两步逐条记在 gaps。

  【有效状态为什么被封顶】接口卡 worldsheet.superstring-brst-additional-conditions
  自身 physical-argument（上游 OPE / 路径积分链），按 min 规则封顶。**这不是 LZ 的论证有缺口**，
  而是本图把「LZ 的对象 = Polchinski 的对象」经那张卡记账的后果，与消灭卡、维数卡、
  特征标/号差卡同口径。
gaps:
  - "**「{D_R|_ℱ, d¹₀/p¹} = 1」这一步 LZ 未印出计算**：p.310 的证明把它当作已知（'we have {D_R|_F, d¹₀/p¹} = 1'）。本图在 summary 2 补了算术（D_R 的零模项 p·d₀ + Clifford 关系 {d^μ₀,d^ν₀} = g^{μν}），并据此对 worldsheet.rns-ramond-zero-modes-clifford 拉了 **inferred 边**。这一步依赖 D_R 的显式模式和（Definition 1.6）里零模项的系数，本图未逐字核该系数（extraction E1 的 Q 表达式里 π(G_{−n+κ})γ_{n+κ} 一项与 D_R 的关系未展开）。"
  - "**「ε = d¹₀/p¹ 确实把 ℱ(p,0) 映到 ℱ(p,0)」未被任何一方写出**：收缩论证要求 ε 保持 Ker b₀ ∩ Ker β₀ ∩ Ker K。这需要 d¹₀ 与 b₀、β₀ 反/对易（物质与鬼场部门独立）且 [K, d¹₀] = 0（d₀ 在能级 0）。**LZ 一字未提**，本图也未补证；目标卡把 ε: ℱ → ℱ 照抄 LZ 在 p.311 Remark 的写法（'a contracting homotopy ε : ℱ → ℱ'），即依赖该断言。"
  - "**设定 (H6) 的 D_R² = K 出处是 Proposition 1.7(ix)，而 Prop 1.7 的证明大半外包给物理文献**（E1 逐字：'(iv) to (viii) are obtained by straightforward computations, some of which are done in [13, 15, 19]'；[13] = Ohta PRD D33、[15] = Terao–Uehara PLB 168B，两篇本图**未登记 bib、未读**）。目标卡把它写成设定而非断言，代价是「(ℱ, D_R|_ℱ) 是复形」这件事在本图无独立来源。⇒ 若将来为 Prop 1.7 立卡，本推导应补一条边。"
  - "**「p ≠ 0 ⇒ 存在 p¹ ≠ 0」用的是哪种非零**：LZ 的 p ∈ R^{D−1,1} 是 Lorentz 矢量，p ≠ 0 指分量不全为零（可以 p·p = 0）。原文写 'say p¹ ≠ 0' 即取某个**非零分量的方向**，本图读成「某个坐标方向」。⚠ 若该方向是类时方向，g^{11} 的符号会变（号差 ((D−1)+, 1−)），ε 的归一化差一个号；**LZ 用上标 1（空间方向）写，本图未核 LZ 是否隐含 p 的空间分量非零**。extraction §6 复核-1 记的 p.305 Remark 只给半空间 {p^D > 0}，不排除 p 的空间分量全为零（纯时间动量）。⇒ 这是一处**真实的边界情形缺口**：p = (0,…,0,p^D) 时 LZ 的写法要改取 d^D₀/p^D。"
  - "**R 扇区零模表示的依赖未检验**：本卡绑定在 (H5) 的 T₀ ⊕ T₁ 上。换成 FOK / Henneaux 的 C[γ₀] 后 ℱ 的定义与本结论是否不变，本图未核（目标卡「不断言 (g)」）。LZ 选 T₀ ⊕ T₁ 的理由是 p.306 逐字「deg 上有界」，与本定理无直接关系。"
  - "**与 Corrigan–Goddard / Henneaux 的物理版对应未入图**：extraction E4 备注说本定理是那批工作的数学版，但 LZ 正文**不引 Henneaux**（extraction §3 逐字），本图也未登记那两篇 bib。⇒ 本卡目前只有一条来源。"
notes: |
  【本卡关闭的 gap（curator 2026-09-11，lz-thm27）】
  worldsheet.superstring-relative-complex-character-signature--via-lian-zuckerman-1989 的 gaps 首条
  （reviewer-batch29）逐字：「LZ Theorem 2.7（R 扇区 D_R 上同调平凡 / 收缩同伦）无卡、无边 …
  建卡后应加非 inferred 边。」本轮同批：该推导加一条指向本卡目标的**非 inferred** 边
  （依据是 Prop 2.14 证明里两处点名引用，见 sources 第四条），并改写该 gap 为已关闭。

  【编号陷阱】**LZ 1989 Theorem 2.7 ≠ FGZ 1986 Theorem 2.7**。后者是玻色弦 Q_B 上同调的消灭定理 +
  维数公式，已立卡 worldsheet.bosonic-relative-cohomology-vanishing / -dimension。
  本推导与那两条毫无关系，不得互引。

  【为什么不挂 worldsheet.superstring-brst-charge】Q_B 在本定理里一次都不出现：微分是 D_R。
  LZ 的 Prop 1.7(v) {Q, D_R} = 0 是另一条，属 Prop 2.14(i) 的证明（那里也未点名，
  若建边须标 inferred，见特征标/号差推导的 notes）。

  【为什么不挂 worldsheet.fock-indefinite-form】本定理不涉及任何内积/厄米型——它是纯粹的
  「核 = 像」陈述。厄米型进入的是下一张卡
  worldsheet.superstring-relative-complex-nondegenerate-form（Definition 2.11 的 ⟨,⟩_rel）。

  按 literature/extractions/lian-zuckerman-1989.md E4（第一轮逐字）与 §10.2 / §10.4
  （researcher 第四轮页图，L1 逐字）建立。curator，2026-09-11。
