id: worldsheet.superstring-ramond-zero-mode-cohomology-trivial--via-lian-zuckerman-1989
target: worldsheet.superstring-ramond-zero-mode-cohomology-trivial
kind: proof
status: rigorous
depends_on:
  - id: math.super-virasoro-algebra
    convention_map: |
      本图的中心荷归一化是 c/12：[L_m,L_n] = (m−n)L_{m+n} + (c/12)(m³−m)δ、
      {G_r,G_s} = 2L_{r+s} + (c/12)(4r²−1)δ。
      **LZ 用 c/8 与 c/2**（p.302 逐字）：[L_m,L_n] = (m−n)L_{m+n} + (c/8)(m³ − 2κm)δ_{m+n}、
      {G_{m+κ}, G_{n−κ}} = 2L_{m+n} + (c/2)(m² + 2κm)δ_{m+n}。换算两条（与
      worldsheet.superstring-relative-complex-character-signature--via-lian-zuckerman-1989 的同名边同）：
        (1) **中心荷**：c_本图 = (3/2)·c_LZ ⇒ LZ 的 c_LZ = D = 10 ↔ 本图 c^m = 15。
        (2) **R 扇区 (κ = 0) 的 L₀ 零点**：LZ 的 {G₀,G₀} = 2L₀（**无**中心项），本图是
            2L₀ − c/12 ⇒ **L₀^LZ = L₀^本图 − c/24**。
      ★ 换算 (2) 在本卡**承重**：设定 (H6) 的 D_R² = K 正是 R 扇区的 {G₀,G₀} = 2L₀ 在
      「物质 + 鬼场总量、总中心荷为零」下的写法。若按本图的 c/12 归一化读，
      {G₀,G₀} = 2L₀ − c/12 的中心项要靠物质 (c=15) 与鬼场 (c=−15) 相消才为零。
      ⚠ 本卡的断言（上同调平凡 / 收缩同伦）本身不含中心荷，两条换算只影响 (H3)(H6) 的读法。
    note: |
      对象接口边：LZ 的 Vir_κ（N = 1 超 Virasoro 代数，κ = 0 即 Ramond 模式集）就是本图这张卡的对象；
      本卡的微分 D_R 就是它的 G₀（物质 + 鬼场总量）。
  - id: worldsheet.superstring-brst-additional-conditions
    note: |
      供给设定 (H4) 的两个空间：ℱ(p,0) = Ker b₀ ∩ Ker β₀ ∩ Ker K 与 C_rel(p,0) = ℱ(p,0) ∩ Ker D_R，
      与 LZ **Definition 2.2** 逐条对应（该卡逐字：b₀|ψ⟩ = L₀|ψ⟩ = 0 两扇区都加，
      β₀|ψ⟩ = G₀|ψ⟩ = 0 只在 R 扇区）；**本卡的 D_R = π(G₀) + ρ(G₀) 就是这张卡的总 G₀，
      K = π(L₀) + ρ(L₀) 就是这张卡的总 L₀**。本边是最核心的对象对接边。
      ★ 本卡断言的内容恰是「把 (H4) 的两个条件分成两步加」时第二步的结构：
      先加 b₀ = β₀ = L₀ = 0 得 ℱ，再加 G₀ = 0 得 C_rel；Theorem 2.7 说第二步的 Ker 恰等于 Im。
      ⚠ 该定义卡自身 physical-argument（上游 OPE / 路径积分链），是本推导 effective 被封顶的原因；
      **不降低本推导自身的 rigorous**（LZ 在自己的框架里把这两个空间定义为良定义对象）。
  - id: worldsheet.superconformal-ghost-modes
    note: |
      供给 bc 与 βγ 的模式与（反）对易关系（LZ p.303 (1)–(4)：[γ_{m+κ}, β_{n−κ}] = δ_{m+n}、
      {c_m, b_n} = δ_{m+n}），因而供给 (H4) 里 Ker b₀ ∩ Ker β₀ 的两个零模 b₀、β₀；
      并供给 (H5) 的 R 扇区零模表示语境（LZ p.306 (7)：κ = 0 取 **T₀ ⊕ T₁**）。
      ★ 本卡的证明还用到 ε = d¹₀/p¹ 把 ℱ 映到 ℱ，这需要 d¹₀ 与 b₀、β₀ 反/对易——
      即物质费米零模与鬼场零模属于互相独立的部门，这一点由本卡（鬼场侧）与
      worldsheet.rns-super-virasoro-generators（物质侧）合起来供给；LZ 未明写（见 gaps 第二条）。
  - id: worldsheet.rns-super-virasoro-generators
    convention_map: |
      本图（Polchinski Vol.2）的 G_r = Σ_n α^μ_n ψ_{μ, r−n}，故 **G₀ = Σ_n α^μ_n ψ_{μ,−n}
      含零模项 α^μ₀ ψ_{μ0}**；开弦归一化 α^μ₀ = (α'/2)^{1/2} p^μ（conv.alpha-prime-regge）。
      **LZ 取 α₀ = p**（p.303 的 U(κ) = C[α^μ_{−n}, d^μ_{−n+κ}]|p⟩ 与 p.310 证明里的 {D_R, d¹₀/p¹} = 1
      逐字要求分母正好是 p¹）。⇒ 两侧的零模项差一个 (α'/2)^{1/2} 因子；LZ 的 ε = d¹₀/p¹ 在本图归一化下是
      ε = ψ^1₀ / [(α'/2)^{1/2} p^1]。**这个因子只改 ε 的归一化，不改「存在 ε 使 {D_R, ε} = 1」这个断言。**
      正规序常数：本图把 a^m 写在 L_m 内部（Vol.2），Vol.1 写 (L₀ + A)；conv.intercept-sign-a 的 a = −A。
      LZ 的 K = π(L₀) + ρ(L₀) 是「常数已吸进去」的那种，与 Vol.2 同款。
    note: |
      供给物质部门的 G₀ 与费米零模 d^μ₀（= 本图的 ψ^μ₀）：**LZ 证明里的 d¹₀ 就住在这里**，
      且 D_R 的 p·d₀ 项来自这张卡的 G₀ 零模项 α^μ₀ψ_{μ0}。同时供给物质 Fock 空间
      V(p,0) = R(p,0) ⊗ U(0)（LZ p.303）。
  - id: worldsheet.rns-ramond-zero-modes-clifford
    inferred: true
    note: |
      供给 R 扇区费米零模的 Clifford 关系 {ψ^μ₀, ψ^ν₀} = η^{μν}（该卡逐字，取自
      {ψ^μ_r, ψ^ν_s} = η^{μν}δ_{r,−s} 的 r = s = 0），**这是 LZ 那条一行公式
      {D_R|_ℱ, d¹₀/p¹} = 1 成立的算术根据**：{p·d₀, d¹₀} = p_μ {d^μ₀, d¹₀} = p_μ g^{μ1} = p¹，
      而 G₀ 的其余项与鬼场项都与 d¹₀ 反对易为零。
      **标 inferred**：LZ **只写出结果公式 {D_R|_ℱ, d¹₀/p¹} = 1，没有写这一步计算**
      （p.310 的证明全文只有两句，见 sources 第一条）；把它归到 Clifford 关系是本图的补线。
      ⚠ 另一处 inferred 成分：该卡是 **Polchinski 的 ψ^μ₀ 与 η^{μν}**，LZ 写 d^μ₀ 与 g^{μν}
      （p.302「g^{μν} is the inverse of the Lorentz metric with signature ((D−1)+, 1−)」，
      与 conv.metric-mostly-plus 一致），两侧记号的等同也是本图所加。
