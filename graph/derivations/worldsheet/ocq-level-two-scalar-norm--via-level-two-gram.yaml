sources:
  - ref: polchinski-1998-v1
    loc: "§4.1，level 2 的物理条件与伪态条件，(4.1.19)–(4.1.28) 区间，p.124；式号未核实"
    note: |
      Polchinski 只结论性地断言"A = −1 且 D = 26 时才出现额外零态"，不给一般 (D, a) 的闭式。
      抽取记录 polchinski-1998-v1.md#E57。schrans-2020 §4.8 的方括号编号 [4.24]/[4.28]/[4.32]
      复现了三条物理条件，但那是笔记自己的编号，对应的原书式号未核实。
  - ref: gsw-1987-v1
    loc: "§2.2.2–2.2.3"
    note: 已从 mostly-minus / α' = 1/2 转写；只给零态存在条件，不给闭式。
summary: |
  有限维精确线性代数。全部步骤如下，可徒手复核（记 α_0^μ = (2α')^{1/2}k^μ，K := α_0·α_0 = 2α'k²）。

  **基**（N = 2，只用 η 与 α_0 构造）：
    A := α_{-1}·α_{-1}|0;k⟩,   B := (α_0·α_{-1})²|0;k⟩,   C := (α_0·α_{-2})|0;k⟩。

  **质量壳**：(L_0 − a)|ψ⟩ = 0 且 N = 2 ⇒ K/2 + 2 = a ⇒ K = 2(a − 2)。

  **L_1、L_2 在这一级上的有效形式**（更高模式作用在 N = 2 上给零）：
    L_1 = α_0·α_1 + α_{-1}·α_2 + …,     L_2 = (1/2) α_1·α_1 + α_0·α_2 + …。

  **作用结果**（用 [α^μ_m, α^ν_n] = m η^{μν} δ_{m+n,0}，记 u := (α_0·α_{-1})|0;k⟩）：
    L_1 A = 2u,        L_1 B = 2K u,      L_1 C = 2u,
    L_2 A = D|0;k⟩,    L_2 B = K|0;k⟩,    L_2 C = 2K|0;k⟩。
  （例：L_1 A 的唯一贡献来自 α_0·α_1，α_1 与两个 α_{-1} 各缩并一次给 2u；
   L_2 A 的唯一贡献来自 (1/2)α_1·α_1，两次缩并给 (1/2)·2·δ^ν_ν = D。）

  **物理条件**（|ψ_2⟩ = A + c_2 C + c_3 B）：
    L_1|ψ_2⟩ = (2 + 2K c_3 + 2c_2) u = 0        ⇒  1 + K c_3 + c_2 = 0,
    L_2|ψ_2⟩ = (D + K c_3 + 2K c_2)|0;k⟩ = 0    ⇒  D + K c_3 + 2K c_2 = 0。
  两个线性方程、两个未知数，行列式 K(1 − 2K) = 2(a−2)(9 − 4a) ≠ 0（前提 a ≠ 2, a ≠ 9/4），
  故解唯一：代入 K = 2(a − 2) 得
    c_2 = (1 − D)/(4a − 9),        c_3 = (D − 4a + 8)/(2(4a − 9)(a − 2))。
  这证明陈述 (1)，并同时说明解空间确实是一维（三个系数、两个独立条件、系数矩阵满秩）。

  **Gram 矩阵**（用 (α^μ_n)† = α^μ_{−n} 与 ⟨0;k|0;k⟩ = 1；由上面的作用结果直接读出）：
    ⟨A|A⟩ = 2D,   ⟨A|B⟩ = ⟨B|A⟩ = 2K,   ⟨B|B⟩ = 2K²,   ⟨C|C⟩ = 2K,   ⟨A|C⟩ = ⟨B|C⟩ = 0。
  故
    ⟨ψ_2|ψ_2⟩ = 2D + 4c_3 K + 2c_3²K² + 2c_2²K。
  代入 c_2、c_3、K 并通分（分母 (4a − 9)²）：
    ⟨ψ_2|ψ_2⟩ = 2(D − 1)(16a² + 2Da − 74a + 84 − 3D)/(4a − 9)²
              = (D − 1)[16a² + (2D − 74)a + 84 − 3D] · 2/(4a − 9)²，
  即陈述 (2)，正因子为 2/(4a − 9)² > 0。

  **推论**：a = 1 代入方括号得 16 + 2D − 74 + 84 − 3D = 26 − D，即 (3a)；
  判别式 (2D − 74)² − 64(84 − 3D) = 4D² − 104D + 100 = 4(D − 1)(D − 25)；
  它在 D ≤ 24 时为负（无实根、恒正）、在 D = 25 时恰为零（二重根
  a = −(2D − 74)/32 = 24/32 = 3/4，代入方括号得 16·9/16 − 24·3/4 + 9 = 0）、
  在 D ≥ 26 时为正（两个相异实根），即 (3b)；
  D = 26 代入方括号得 16a² − 22a + 6 = 2(8a − 3)(a − 1)，
  在 a = 1/2, 3/4, 9/10 处整式取值 −1, −25/8, −42/25，乘 25·2/(4a−9)² 分别得
  −50/49, −25/12, −350/243，即 (3c)。
gaps:
  - "本推导只覆盖由 η 与 α_0 张成的三维子空间（小群标量部分）。level-2 物理态空间的其余部分（无迹横向对称张量等）的模不在本推导范围内；那部分在 D ≤ 26 时恒正，本推导不证。"
  - "退化点 a = 2（K = 0，零动量/无质量退化）与 a = 9/4（系数矩阵奇异）被前提排除，未处理。"
  - "文献侧只支持定性结论（D = 26、a = 1 时出现额外零态）。闭式来自本项目两次独立核算，见目标陈述的 notes。"
  - "【2026-09-11 更新】本推导现已连 worldsheet.open-string-l0-equals-level-plus-mass（main 上的 formalized 节点，只断言 L_0 在 level N 分量上的读值，不打包 a^X = 0），故质量壳这一步不再是无来源的。仍**刻意不连** worldsheet.open-string-l0-level-form 这条边，尽管它的断言 (i)（L_0 = α'p² + N）也是本推导用的质量壳形式。理由：本推导只需要 worldsheet.virasoro-generators-free-boson 的 L_m = (1/2)Σ_n :α_{m−n}·α_n: 在 m = 0 处的读值（一行代入，纯代数，rigorous），而 open-string-l0-level-form 还打包了断言 (ii)（共形正规序与产生-湮灭正规序给同一算符，即 a^X = 0），那一条走 OPE/态-算子路线，会把本推导的有效状态压到 physical-argument。连一条本推导用不到的边去换取一个更低的有效状态，不是诚实降级而是记账错误（同 worldsheet.brst-quantization 的 notes 中「是否 uses bc-ghost-cft」的裁断）。若 reviewer 认为 (i) 与 m = 0 代入之间还有本推导未论证的一步，应把该边补回并接受降级。"
