  故该见证需要 **D ≥ 2** 与除法（域）。这一点在手算里被「取 k 使 α'k² = −1」一句掩盖了，
  在任意基环上并非自动；Lean 侧由 `Fock.exists_zeroModeSq_eq_neg_two` 承担。
  下游用途见 worldsheet.negative-norm-physical-state-above-26。

