  Gram 矩阵 ⟨A,A⟩ = 2D、⟨A,B⟩ = 2K、⟨B,B⟩ = 2K²、⟨C,C⟩ = 2K、⟨A,C⟩ = ⟨B,C⟩ = 0，
  以及两条物理条件与系数 c_2 = (1−D)/(4a−9)、c_3 = (D−4a+8)/(2(4a−9)(a−2))。
  Lean 版把闭式写成**清分母**形式 (4a−9)²⟨ψ₂,ψ₂⟩ = 2(D−1)[…]，故在任意交换 ℚ-代数上成立，
  不需要 4a ≠ 9；本目标写成 ⟨ψ₂,ψ₂⟩ = (D−1)[…]·2/(4a−9)² 时必须先设 4a ≠ 9。
  **本目标的第 (1) 条（三维标量子空间中物理态解空间一维）与第 (3b)(3c) 条（判别式分类：
  D ≤ 24 / D = 25 二重根 a = 3/4 / D ≥ 26，以及 D = 26 时 2(8a−3)(a−1) 在 3/8 < a < 1 上为负）
  未形式化**，这正是本目标不能整体升为 formalized、必须另立
  worldsheet.ocq-level-two-scalar-norm-closed-form 一卡的原因（拆卡由 formalizer 建议、lead 同意）。
  本推导的 status 仍为 rigorous，summary 与目标陈述一字未动。

  【附带登记：a = 1 的质量壳动量在 ℚ 上需要两个分量】（formalizer，LevelTwo.lean 文件头 Gaps
  第 2 条与 formal/TODO.md 的 `negative-norm-above-26`）本目标第 (3a) 条落在 a = 1，
  对应质量壳 α'k² = a − 2 = −1，即 α_0·α_0 = −2。在 ℚ 上**单个非零分量无解**
