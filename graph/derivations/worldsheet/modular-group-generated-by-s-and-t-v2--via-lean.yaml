summary: |
  机器检查的证明，`formal/StringFormal/Math/ModularGroupGenerators.lean`，
  只 import Mathlib 的 `FixedDetMatrices` 与 `ProjectiveSpecialLinearGroup`。两步：

  **(1) 硬的一半是 Mathlib 的。** `SpecialLinearGroup.SL2Z_generators :
  Subgroup.closure {ModularGroup.S, ModularGroup.T} = ⊤`（`Mathlib/LinearAlgebra/Matrix/
  FixedDetMatrices.lean`，Chris Birkbeck），证法是对行列式 1 的整数矩阵作辗转相除归纳
  （`FixedDetMatrices.induction_on`）。本文件把它原样再导出为 `sl_closure_S_T`。
  ⇒ **生成性本图不自证，也不审计 Mathlib 的那段归纳**，证据标准由 lake build + 公理集合承载。

  **(2) 搬到 PSL。** `psl := QuotientGroup.mk' (Subgroup.center SL(2,ℤ))`；
  `MonoidHom.map_closure` + `Set.image_pair` 把 `map psl (closure {S,T})` 化成
  `closure {psl S, psl T}`，再用商映射满射（`MonoidHom.range_eq_top`）得 = ⊤。
  样板抄自 Mathlib `NumberTheory/ModularForms/LevelOne/Basic.lean:60`。∎

  **注意本推导不用任何关系**：`sl_S_sq`、`sl_ST_cube` 在同一个 Lean 文件里，但
  `psl_closure_S_T` 的证明不调用它们。这正是 2026-09-11 把 v1 拆成
  「生成性（本卡）」与「关系（math.psl2z-s-t-relations）」两张卡的技术理由。
gaps:
  - |
    **（记账，不是缺口）Lean 的 PSL 取法**：Mathlib 的 `Matrix.ProjectiveSpecialLinearGroup`
    是 `SL(2,ℤ) ⧸ Z(SL(2,ℤ))`，本文件（`ModularGroupGenerators.lean`）自己只证
    `−1 ∈ Z(SL(2,ℤ))`（`neg_one_mem_center`）。
    ★ **2026-09-11（curator lean-wire-12）改写：「群的识别 SL/Z(SL) = SL/{±I}」已经机检。**
    桥层现有三级：
      · 集合层 `StringFormal.Bridge.center_eq_pm_one :
        (Subgroup.center SL(2, ℤ) : Set SL(2, ℤ)) = {1, -1}`（提交 c15b0db，合并 845b9b9；
        证法：Mathlib `Matrix.SpecialLinearGroup.mem_center_iff` 给出中心元是纯量阵 r·I
        且 r² = 1，在 ℤ 上迫使 r = ±1）；
      · **子群层** `StringFormal.Bridge.psl2z_eq_quotient_pm_one :
        Subgroup.center SL(2, ℤ) = Subgroup.closure {(-1 : SL(2, ℤ))}`，同义写法
        `StringFormal.Bridge.center_eq_zpowers_neg_one`（= `Subgroup.zpowers (-1)`）——
        即**被商掉的那个子群**本身相等，不再依赖「子群由承载集合决定」这一句人话推理
        （提交 3a36c36，合并 930b265）；
      · **商的外延性** `StringFormal.Bridge.pslMk_eq_iff (g h : SL(2, ℤ)) :
        pslMk g = pslMk h ↔ g = h ∨ g = -h`——Mathlib 的商恰好把 {g, −g} 粘起来，
        陈述里一个字都不提中心。
    这正是本 gap 旧版要求的「把 Z = {±I} ⇒ SL/Z = SL/{±I} 那一行外延性写出来」，已兑现
    ⇒ **不再需要人读两条声明作比对**。
    **余下的不是证明步骤，而是陈述搬运**：`center_eq_pm_one`（及其子群形式）**不在本卡
    `lean_decl` `psl_closure_S_T` 的证明链上**——那条定理里的 `PSL(2, ℤ)` 从一开始就是
    Mathlib 的那个对象，证明（`MonoidHom.map_closure` + 商映射满射）用不到中心长什么样。
    桥层那三条的用途是让本图确认「卡面文字 `SL(2,Z)/{±I}` 指的就是这个 Lean 对象」；
    这种文字↔对象的对应由 sources 与 depends_on 承担，按其性质不会变成一条机检蕴涵，
    故本条永久保留为**记账**，不再作为待办。
    该事实的卡是 math.sl2z-center-is-pm-one（own=formalized），本推导有一条 depends_on 边指它。
  - |
    **不含 ℍ 上的作用**。「S 是 τ ↦ −1/τ、T 是 τ ↦ τ+1」这一识别不在本文件内
    （docstring 逐字 "Nothing here is about the action on `ℍ`"）。目标卡正文用 Möbius 映射
    写 S、T，这一层翻译靠 depends_on 的定义卡承担（桥层已机检，但在定义卡那一侧）。
  - |
    **不含表现（presentation）、不含关系**。目标卡「不断言」(a)(b) 与 Lean 一致：
    本推导既不证 S² = (ST)³ = 1（那是 math.psl2z-s-t-relations），
    也不证 PSL(2,Z) ≅ ℤ/2 ∗ ℤ/3（需要基本域上的乒乓引理，Mathlib v4.33.1 没有）。
  - |
    **不含归约算法的终止性**。目标卡「不断言」(c)：`closure {S,T} = ⊤` 只说每个元素是
    S、T 的有限字，不给字长界，也不给「把 τ 移进 F₀」的算法——
    worldsheet.modular-fundamental-domain--via-modular-reduction 的终止性论证
    **不因本推导变严格**。
