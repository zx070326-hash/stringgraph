    loc: "§5.1, eq. (5.1.12), p.148（物理侧转述：原书只给 S、T 两个「生成变换」，零证明）；§7.2, p.210（再次用而不证）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E70 与 polchinski-1998-v1-ch7.md#E9，
