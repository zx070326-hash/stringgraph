        · 「等价地在 SL(2,Z) 层」 → `sl_closure_S_T : Subgroup.closure ({S, T} : Set SL(2, ℤ)) = ⊤`。
      ⚠ **同文件的 `sl_S_sq` / `sl_ST_cube` / `psl_S_sq` / `psl_ST_cube`（两条关系）
