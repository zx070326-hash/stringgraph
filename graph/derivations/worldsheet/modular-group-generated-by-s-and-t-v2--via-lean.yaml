depends_on:
  - id: worldsheet.modular-group-psl2z
    inferred: false
    note: |
      提供群本身与 S、T 的矩阵：Lean 侧的 `ModularGroup.S`、`ModularGroup.T`（Mathlib）就是
      该定义卡写的 S = ((0,−1),(1,0))、T = ((1,1),(0,1))，`SL(2, ℤ)` 就是该卡的 SL(2,Z)。
      ⚠ **「S : τ ↦ −1/τ、T : τ ↦ τ+1」这一识别本推导不覆盖**：`ModularGroupGenerators.lean`
      全程只在群里算，不碰 ℍ 上的作用（文件 docstring 逐字："Nothing here is about the action
      on `ℍ`"）。该识别在 Mathlib 里是 `UpperHalfPlane.modular_S_smul` / `modular_T_smul`，
      并已由桥层 `StringFormal.Bridge.psl2z_S_smul` / `psl2z_T_smul` 机检，但那是**定义卡**
      那一侧的声明，不在本卡 `lean_decl`（`psl_closure_S_T`）的证明链上。
      故这条边同时承担「定义」与「未被本推导机检的那一步识别」。
      ⚠ **PSL 的取法**：定义卡写 PSL(2,Z) = SL(2,Z)/{±I}，Lean 用 Mathlib 的
      `Matrix.ProjectiveSpecialLinearGroup` = `SL(2,ℤ) ⧸ Z(SL(2,ℤ))`；两者是同一个群这件事
      已由桥层机检——集合层 `StringFormal.Bridge.center_eq_pm_one`（c15b0db），
      子群层 `StringFormal.Bridge.psl2z_eq_quotient_pm_one` / `center_eq_zpowers_neg_one`
      与商的外延性 `StringFormal.Bridge.pslMk_eq_iff`（930b265）。见 gaps 首条。
      ⚠ 该定义卡已于 2026-09-11 接桥层（`lean_decl: StringFormal.Bridge.psl2z_smul_eq`）
      升为 formalized，故本推导 own=formalized 不再被它按 min 规则压到 rigorous。
  - id: math.sl2z-center-is-pm-one
    inferred: false
    note: |
      **供给「Lean 的 PSL = 卡面的 SL(2,Z)/{±I}」这一步**，即 gaps 首条点名的那组桥层声明：
      `StringFormal.Bridge.center_eq_pm_one : (Subgroup.center SL(2, ℤ) : Set SL(2, ℤ)) = {1, -1}`
      （集合层，c15b0db，合并 845b9b9），以及 2026-09-11 新增的子群层
      `StringFormal.Bridge.psl2z_eq_quotient_pm_one : Subgroup.center SL(2, ℤ) = Subgroup.closure {(-1 : SL(2, ℤ))}`
      （同义写法 `center_eq_zpowers_neg_one`）与商的外延性
      `StringFormal.Bridge.pslMk_eq_iff (g h) : pslMk g = pslMk h ↔ g = h ∨ g = -h`（930b265）。
      本卡 `lean_decl` 是 `psl_closure_S_T : Subgroup.closure {psl S, psl T} = ⊤`，其中的
      `PSL(2, ℤ)` 是 Mathlib 的 `SL(2,ℤ) ⧸ Z(SL(2,ℤ))`；要说它就是目标卡正文写的
      `SL(2,Z)/{±I}`，**必须**知道中心恰是 {±I}——`ModularGroupGenerators.lean` 自己只证了
      `−1 ∈ Z(SL(2,ℤ))`（`neg_one_mem_center`），那不够。
      **非 inferred**：这一步在本推导 gaps 首条里逐字点名了这些 Lean 声明及其提交 sha，
      在桥层文件里可以直接读到。
      **【接口边，非机检环节】**（docs/STATUS_LEVELS.md「接口边」节，2026-09-12 裁决；
      字面标签便于 grep）：本边供给目标 statement 里点名的**群识别**（Z(SL(2,ℤ)) = {±I}），
      对应的桥层声明是 `StringFormal.Bridge.center_eq_pm_one` /
      `psl2z_eq_quotient_pm_one` / `pslMk_eq_iff`。
      ⚠⚠ **它不在本卡 `lean_decl` 的机检证明链上**（gaps 首条逐字：「`center_eq_pm_one`
      （及其子群形式）不在 `psl_closure_S_T` 的证明链上——那条定理的对象本就是 Mathlib 的
      PSL」）。本边供给的是**陈述层面的群识别**，不是证明步骤；2026-09-11 补上
      `psl2z_eq_quotient_pm_one` / `pslMk_eq_iff` 使「两个商相等」本身成为机检事实，
      但它们同样不出现在 `psl_closure_S_T` 的证明里。
      ⚠ 2026-09-11（curator small-backlog-9）新增：该事实此前在图上**没有节点**，
      本轮从 worldsheet.modular-group-psl2z 拆出；指向定义卡的那条边保留
      （它供给群、S/T 的矩阵，以及「S、T 是 H 上那两个 Möbius 映射」这一未被本推导机检的识别）。
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Math/ModularGroupGenerators.lean :: StringFormal.ModularGroupGen.psl_closure_S_T；支撑链 sl_closure_S_T（Mathlib SpecialLinearGroup.SL2Z_generators 的再导出）→ psl_closure_S_T"
    note: |
