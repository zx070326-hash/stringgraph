  第 3 步发现的 R 扇区不相容本身就说明「无限定的 (10.8.14)」不是一条可以标 rigorous 的命题。

  ★【本推导与 reviewer 的复核的关系】断言 (2) 的算符代数由 reviewer（graph-reviewer，
