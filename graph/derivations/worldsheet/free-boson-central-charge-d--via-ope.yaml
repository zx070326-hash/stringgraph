     它依赖 a^X = 0（worldsheet.normal-ordering-constant-ax）才能把两种正规序的 L_0 认同，
     且该节点自身封顶在 physical-argument（其 (iii) 用态-算子同构）。
     独立于此的模式路线见 worldsheet.free-boson-central-charge-d--via-mode-algebra。"
