  - id: worldsheet.normal-ordering-constant-ax
    note: |
      模式路线与 OPE 路线的 L_0 分别用产生-湮灭正规序与共形正规序定义，二者相差 a^X；
      只有 a^X = 0 才能说「两条路线定出的是同一个 L_0」，从而中心项可以直接比较。
      a^X ≠ 0 会在 [L_m, L_n] 的中心项里留下 m 相关的移位。
  - id: worldsheet.normal-ordering-modes-agree
    inferred: false
    note: |
      **本步骤此前只以散文写在本推导的边注与 gaps 里，2026-09-11 提为独立节点**
      （docs/ROADMAP.md 待建清单）。本推导实际用到的是它的 **X 半边**：
      断言 (ii)「L_m^{(共形)} = L_m^{(产生-湮灭)} 对一切 m ≠ 0」与 (iv)「中心荷与正规序无关」，
      加上 (iii) 的 a^X = 0 把 m = 0 也对上。没有这一步，本推导第 4 段
      「把 OPE 翻译成 L_m 的对易关系」得到的 c 与 worldsheet.virasoro-generators-free-boson
      那组 L_m 的中心荷是两个不同对象。
      来源同 §2.7 (2.7.5)–(2.7.11)（与上面两条边同一段落）。
      ⚠ 该节点同时覆盖鬼场部门，故本边把整条 bc 鬼场链牵进本推导的依赖闭包；
      这是**过量依赖**（对 effective status 无影响，两条链都是 physical-argument）。
      若要收紧，按该节点 notes 的建议新建只含 X 半边的弱节点，不要改它的 statement。
