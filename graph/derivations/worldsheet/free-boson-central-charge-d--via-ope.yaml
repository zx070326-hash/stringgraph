summary: |
  用 worldsheet.conformal-normal-ordering 的交叉缩并规则直接算
    T(z) T(0),  T(z) = -(1/α') : ∂X^μ ∂X_μ :(z)。
  每次缩并给出一个 ∂∂ 作用在传播子 -(α'/2) η^{μν} ln|z|^2 上的因子，
  即 ⟨∂X^μ(z) ∂X^ν(0)⟩ = -(α'/2) η^{μν} / z^2。
  **双缩并**（两个 X 都缩并）给出不含算子的项：
    (1/α'^2) · 2 · (α'/2)^2 · η^{μν}η_{μν} / z^4 = (1/2) D / z^4,
  与 worldsheet.tt-ope-central-charge 的定义式 c/(2z^4) 比较即得 c = D
  （η^{μν}η_{μν} = δ^μ_μ = D 是唯一出现 D 的地方）。
  单缩并给出 (2/z^2)T(0) 与 (1/z)∂T(0)，与定义式一致，说明归一化自洽。
  最后经 worldsheet.ope-commutator-dictionary 把该 OPE 翻译成 L_m 的对易关系，
  得到中心荷为 D 的 Virasoro 代数。
gaps:
