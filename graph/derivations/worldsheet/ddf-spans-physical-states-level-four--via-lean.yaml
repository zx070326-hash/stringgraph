      dim Q_{−4,2} ≥ p_{D−1}(2)）。与 level-three derivation 不同：level-three 的
      Type-1 半走的是 `ker(transFunctional)` 的秩零化度（不经 `le_finrank_towerSeed`），
      本卡 Type-1、Type-2 两半都经这条同一引理，故本推导挂两次同一条边（无需重复列出
      两个 depends_on 条目，此处一次性说明两次调用）。
  - id: math.level-four-partition-difference
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl**：`levelFour_count_identity` 作为 `b26_four_of_D26`
      的 `h3`，给出 p_{D−1}(4) = p_{D−2}(4) + p_{D−1}(3) + p_{D−1}(2)。
  - id: worldsheet.transverse-ddf-fock-gram-matrix
    inferred: false
    note: |
      **精确 decl 非该卡 formal.lean_decl**：本推导调用的是 `finrank_ddfSpan_inf_towerBigrade`
      （`SliceDim.lean`，`b26_four_of_D26` 结尾 `rw [finrank_ddfSpan_inf_towerBigrade
      F.hη F.frame.isotropic F.hba F.trans 4]`），不是该卡 formal.lean_decl
      `ddf_gram_diagonal`。与 worldsheet.ddf-spans-physical-states-level-two/-level-three
      --via-lean 同一记法，给 dim D_4 = p_{D−2}(4)。
  - id: worldsheet.level-four-null-family-transversal
    inferred: false
    note: |
      **不是逐字调用同一条 decl，是其所在同一 section 的姊妹定理，且核心机制被字面
      调用**：本卡 `h9`（`b26_four_of_D26` 内联证明块）字面等于
      `le_finrank_towerNull_inf_towerBigrade_four`（同文件 section ClosingFour/
      NullBoundFour，紧邻横截性引理所在的 section Transversality），其证明体内部
      `typeTwoAugFour_injective`（第 1081 行，`hD:3≤D`）直接调用横截性引理
      `eq_zero_of_towerLop_neg_one_add_descTwo_at_four`（即本依赖目标卡的
      formal.lean_decl）来证明 Type-1⊕Type-2 组合映射单射——这是本卡维数下界
      h9 的核心步骤，非外围工具。
  - id: worldsheet.level-two-null-state-requires-d26
    inferred: false
    note: |
      **精确 decl 非该卡 formal.lean_decl，经由一般化引理**：h9 内部的 Type-2 半调用
      本文件的 `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`（任意 rung j、
      level N 满足 j+N=−2 的版本），其证明体直接调用 `descTwo_mem_towerNullSubmodule`
      （NullSeedsTwo.lean 的一般充分性引理：`hD26 : (D:R)=26` + `L₀y=−y` ⟹
      `𝒟₂y ∈ towerNullSubmodule`）——这条引理正是该卡 sources.loc 已登记的
      "descTwo_mem_towerNullSubmodule"（该卡的铺垫链之一，非其 headline
      `descTwo_mem_towerPhysSubmodule_iff`）。本卡消费的是这条被登记的铺垫引理本身，
      故 `inferred: false`。与 worldsheet.ddf-spans-physical-states-level-three--via-lean
      挂同一条边，理由相同（三片共用同一条 D=26 入口）。
