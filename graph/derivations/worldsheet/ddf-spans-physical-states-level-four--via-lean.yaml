      标架对象 `F : DDFLightConeFrame η a b` 是本卡三条主定理
      （`b26_four_of_D26`、`ddfSpans_bigrade_neg_four_four`，以及 h9 引用的
      `le_finrank_towerNull_inf_towerBigrade_four`）的共同参数；证明体使用
