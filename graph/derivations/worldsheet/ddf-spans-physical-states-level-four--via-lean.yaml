summary: |
  九输入组装（逐层对应 LevelFourCount.lean 的 section ClosingFour）：

  **h1-h6（D-无关的维数不等式与计数恒等式）**：
  h1 = dim H_4 ≤ p_{D−1}(4)（worldsheet.physical-slice-bounded-by-transverse-count）；
  h2/h4/h5/h6 = 内部占据数上下界（不建边）；
  h3 = p_{D−1}(4) = p_{D−2}(4) + p_{D−1}(3) + p_{D−1}(2)（math.level-four-partition-difference）。

  **h7、h8（两次同一条引理）**：`le_finrank_towerSeed` 分别给
  dim Q_{−4,3} ≥ p_{D−1}(3) 与 dim Q_{−4,2} ≥ p_{D−1}(2)
  （worldsheet.quasi-physical-slice-dimension）。

  **h9（唯一用到 D=26 且唯一用到 hD:3≤D 的一步）**：
  `le_finrank_towerNull_inf_towerBigrade_four` 给 dim(H_null ⊓ V_4) ≥ dim Q_{−4,3} + dim Q_{−4,2}，
  构造 Type-1⊕Type-2 组合映射（定义域 towerSeed(−4,3) × towerSeed(−4,2)），其单射性由
  worldsheet.level-four-null-family-transversal 的横截性定理给出（需要 3≤D 供给横向
  单位偏振），其像落在 H_null ⊓ V_4 里的两半分别由（Type-1）NullSeedsTwo.lean 的共享
  铺垫引理与（Type-2）本文件的 `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`
  （经 worldsheet.level-two-null-state-requires-d26 已登记的一般充分性引理
  `descTwo_mem_towerNullSubmodule`，D=26 在此进入）给出。

  **收尾**：九项经 `omega` 拼成 `b26_four_of_D26`，再经 D-无关、N-无关的纯逻辑翻译引理
  `ddfSpansOn_bigrade_of_b26`（不建 depends_on 边）得目标卡断言
  `ddfSpans_bigrade_neg_four_four`。
