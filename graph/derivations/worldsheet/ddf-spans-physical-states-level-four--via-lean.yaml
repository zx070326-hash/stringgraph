  - "**N≥5 未覆盖，且已知计数本身不再精确匹配**：worldsheet.ddf-spanning-rank-inequality notes【2026-09-12（五）】记录两族计数从 N=5 起差 1（Euler 五边形数障碍）；N≥12 起需要新奇异向量族。这不是'尚未形式化'而是'已知机制需要扩充'，不受本次工作影响。"
