      `F.dotVec_self_eq_two hD2`（给出 a₀ = 1）。
  - id: worldsheet.physical-slice-bounded-by-transverse-count
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl**：`finrank_towerPhys_inf_towerBigrade_le` 作为
      `b26_four_of_D26` 的 `h1`，给出 dim(H_phys ⊓ V_4) ≤ p_{D−1}(4)，对一切 D、
      一切 N 成立（该卡断言本身）。
  - id: worldsheet.quasi-physical-slice-dimension
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl 两次**：`le_finrank_towerSeed` 作为 `b26_four_of_D26`
      的 `h7`（`le_finrank_towerSeed (K:=K) hD2 F (-((4:ℕ):ℤ)) 3`，level-3 实例，给
