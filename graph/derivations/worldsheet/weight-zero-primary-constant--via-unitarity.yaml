id: worldsheet.weight-zero-primary-constant--via-unitarity
target: worldsheet.weight-zero-primary-constant
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.descendant-weight-grading-v2
    inferred: false
    note: |
      2026-09-11 由 worldsheet.descendant-weight-grading 改指（那张卡已 superseded_by v2）。
      本推导用到的只是「L_{−1}|O⟩ 的 L_0 本征值是 h_O + 1」这类本征值计算，
      v2 逐字包含且更一般（任意 Virasoro 模、只要 L_0 v = h v）；
      本推导**不**用旧卡末句的 ⊕ 分解（那句已知在一般基环上错，见旧卡 notes），
      它需要的「每个态要么是最高权态要么是 descendant」这一分解由幺正性承担，见 gaps。
  - id: worldsheet.primary-field-v2
    note: |
      【2026-09-11 就地换代】原先指向 worldsheet.primary-field，该卡已 superseded_by
      worldsheet.primary-field-v2。v2 只把 statement 里错误的非主场例子「X^μ」换成「∂²X^μ」
      并加了一段「本定义相对哪个 CFT 而言」；权的定义、主场判据、有限变换律逐字未动，
      故换代不改变本推导的论证与状态。
  - id: worldsheet.virasoro-algebra-v2
  - id: worldsheet.state-operator-isomorphism
    note: |
      论证在态与算子之间来回（「L_{-1}|O⟩ = 0 即 ∂O = 0」），需要该同构。
      原先这条依赖是经 worldsheet.descendant-weight-grading 间接得到的；
      后者已改写为纯表示论命题、不再依赖态-算子同构，故此处改为显式依赖。
sources:
  - ref: polchinski-1998-v1
    loc: "§2.9, eq. (2.9.15)，p.72（式号经 schrans-2020 核实）"
summary: |
  在幺正 CFT 中所有态的范数非负，由此可推出 L_0 的谱非负、且 h = 0 的态只有真空
  （这是 h = 0 处 Virasoro 模的标准论证：⟨O|L_1 L_{-1}|O⟩ = 2 h_O ⟨O|O⟩，
  h_O = 0 时右端为零，故 L_{-1}|O⟩ 是零范数态；在幺正理论中零范数态必为零向量）。
  于是 L_{-1}|O⟩ = 0，按态-算子对应即 ∂O = 0；反全纯部门同理给 ∂̄O = 0。
gaps:
  - "「幺正 ⇒ 零范数态为零向量」用到内积的正定性；对本图中真正关心的弦论世界面理论，
     X^0 方向与鬼场方向的内积**都不是**正定的，因此本条**不适用于**玻色弦的完整世界面 CFT，
     只适用于幺正的物质 CFT。本图未在陈述中把这一限定进一步细化，
     引用本节点时须自行检查幺正性前提。"
  - "论证经 worldsheet.state-operator-isomorphism 在态与算子之间来回（『L_{-1}|O⟩ = 0 即 ∂O = 0』），
     继承其 physical-argument 状态。已改为**显式依赖**（见 depends_on）：
     worldsheet.descendant-weight-grading 现已改写为纯表示论命题，不再代为承载这条依赖。
     （2026-09-11：该卡已 superseded_by worldsheet.descendant-weight-grading-v2，本推导已改指 v2。）"
  - "Polchinski 在此处的具体论证路线未核实（只核实了 (2.9.15) 的式号与标题）；
     本 summary 复述的是标准论证。"
author: curator-polchinski-ch2-3
