id: worldsheet.kac-determinant-level-two--via-lean
target: worldsheet.kac-determinant-level-two
kind: proof
status: formalized
depends_on:
  - id: worldsheet.shapovalov-form-uniqueness
    inferred: false
    note: |
      提供两件事：
      (a) 「归一化逆变型」这一概念本身（目标陈述的前提就是它，Lean 侧 `IsContravariant` + `hB1`）；
      (b) **对称性**——`gram_level_two_det` 的证明里有一步 `hB.comm (desc11) (desc2)`
          把 ⟨b, a⟩ 换成 ⟨a, b⟩，而 `IsContravariant.comm` 正是该卡 (2)
          （经 `flip_eq`，即该卡的唯一性论证）。**这不是记号约定，是被用到的定理**。
      另外该卡的 (3) level 正交在同文件给出 `gram_level_one_two`（⟨L₋₁v, L₋₂v⟩ = 0），
      它不进本目标的陈述，只作旁证。字面依赖（同文件，上两节）。
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      提供 V(c,h)、|c,h⟩ 与最高权关系 `lie_lgen_hwv_of_pos` / `lie_lgen_zero_hwv` /
      `lie_cgen_hwv`——所有 Gram 元的计算都是「把上升模态推过去打到 |c,h⟩ 上」，
      靠的就是这三条。另用到 `levelSpan` 与 `levelWord`（`desc*_mem_levelSpan` 的陈述，
      以及目标【不断言】(a) 里「{a,b} 张成 V_2」那句的定义依据：V_2 = span{levelWord 2 cmp}，
      而 2 的合成恰有 [2] 与 [1,1]）。
      **刻意未用**该卡不断言的 PBW / dim V_N = p(N) / V(c,h) ≠ 0；这正是目标
      【不断言】(a) 的内容。字面依赖（Shapovalov.lean import Verma.lean）。
  - id: worldsheet.virasoro-algebra-v2
    inferred: false
    note: |
      Gram 元的每一步都在用 Virasoro 括号的**具体系数**，包括中心项：
      `lie_lgen_two_neg_two : ⁅L 2, L (−2)⁆ = 4·L 0 + centralTerm R 2 · C`，
      其中 `centralTerm R n = (n³ − n)/12` 就是该卡陈述里的中心项，
      配套 `two_mul_centralTerm_two : 2·centralTerm R 2 = 1`（即 c/2 那个系数）。
      ⇒ 目标 (2) 的 `4h + c/2` 与 (3) 里 c 的出现**完全来自**该卡的中心项归一化；
      换一套归一化（conv.virasoro-standard 之外）数值就会变。同为 conv.virasoro-standard。
      还用到 `lie_lgen_lgen` 的一般形式与 `lie_lgen_one_neg_one`（⁅L1, L−1⁆ = 2 L0，无中心项）。
sources:
  - ref: stringformal-2026
    loc: "formal/StringFormal/Virasoro/Shapovalov.lean :: StringFormal.Virasoro.{desc1, desc2, desc11, lie_lgen_one_neg_one, lie_lgen_zero_neg_one, lie_lgen_two_neg_two, lie_lgen_two_neg_one, lie_lgen_one_desc1, lie_lgen_zero_desc1, lie_lgen_two_desc1, lie_lgen_two_desc2, lie_lgen_two_desc11, lie_lgen_one_desc11, two_mul_centralTerm_two, desc1_mem_levelSpan, desc2_mem_levelSpan, desc11_mem_levelSpan, IsContravariant.gram_level_one, IsContravariant.gram_level_two_aa, IsContravariant.gram_level_two_ab, IsContravariant.gram_level_two_bb, IsContravariant.gram_level_two_det, IsContravariant.gram_level_one_two}；上游调用 StringFormal.Virasoro.{lie_lgen_hwv_of_pos, lie_lgen_zero_hwv, lie_cgen_hwv, levelWord, levelSpan, IsContravariant.comm} 与 VirasoroAlgebra.{lie_lgen_lgen, centralTerm}"
    note: |
      本仓库，形式化侧提交 **0c5f1f5**（"formal: compute the level-1 and level-2 Gram matrices
      and the N=2 Kac determinant"），由 lead 以 **b95a406**
      （"merge: Shapovalov form on the Virasoro Verma module (formalizer)"）合入 main；
      Lean 4 + Mathlib v4.33.1。文件头 Status 段自述「No `sorry`, no new axioms.」，
      其 gap 第 2 条逐字：「Gram matrix entries are stated for the *specific vectors*
      `L_{-1}|c,h⟩`, `L_{-2}|c,h⟩`, `L_{-1}²|c,h⟩`, not for a basis of `V_N`, because no basis is
      available without PBW. The level-2 determinant is therefore the Kac determinant only *if*
      those two vectors are independent, which is again `pbw-verma`.」
      **curator 未自行重跑 `lake build`**；依据是该自述、formal/TODO.md 的 `shapovalov-form`
      勾选与 b95a406 已在 main 上。合并前应由 lead 跑 `uv run stringgraph check-axioms`。
summary: |
  机器检查的计算，全部在 formal/StringFormal/Virasoro/Shapovalov.lean 的 "Low-level Gram
  matrices" 一节。每条 Gram 元都是同一个模式：用逆变性把一个降算符搬到左边变成升算符，
  再用 Virasoro 括号把升算符推到 |c,h⟩ 上打成 0（或标量）。

  **先算的四条括号作用**（`leibniz_lie` + `lie_lgen_lgen` + 最高权关系）：
    L₁ L₋₁ v = 2h·v                    (`lie_lgen_one_desc1`)
    L₀ L₋₁ v = (h+1)·L₋₁ v             (`lie_lgen_zero_desc1`)
    L₂ L₋₁ v = 0                       (`lie_lgen_two_desc1`)
    L₂ L₋₂ v = (4h + (c/2))·v          (`lie_lgen_two_desc2`；c/2 来自 centralTerm R 2)
    L₂ L₋₁² v = 6h·v                   (`lie_lgen_two_desc11`)
    L₁ L₋₁² v = (4h+2)·L₋₁ v           (`lie_lgen_one_desc11`)

  **(1)** `gram_level_one`：⟨L₋₁v, L₋₁v⟩ = ⟨v, L₁L₋₁v⟩ = 2h·⟨v,v⟩ = 2h。
  **(2)** `gram_level_two_aa`：⟨a,a⟩ = ⟨v, L₂L₋₂v⟩ = 4h + c/2。
          `gram_level_two_ab`：⟨a,b⟩ = ⟨v, L₂L₋₁²v⟩ = 6h。
          `gram_level_two_bb`：⟨b,b⟩ = ⟨L₋₁v, L₁L₋₁²v⟩ = (4h+2)·⟨L₋₁v,L₋₁v⟩ = (4h+2)·2h = 8h²+4h
          （最后一步回调 (1)）。
  **(3)** `gram_level_two_det`：把 (2) 三式代入 ⟨a,a⟩⟨b,b⟩ − ⟨a,b⟩⟨b,a⟩，
          用 `IsContravariant.comm` 把 ⟨b,a⟩ 换成 ⟨a,b⟩，再由
          `linear_combination (4c h² + 2c h) * two_mul_centralTerm_two` 消掉 centralTerm：
          (4h + c/2)(8h²+4h) − 36h² = 32h³ + 4ch² − 20h² + 2ch = 2h(16h² + 2h(c−5) + c)。
          （`two_mul_centralTerm_two : 2·centralTerm R 2 = 1` 是「c/2」在任意 ℚ-代数上
          被正确处理的那一步——Lean 里 1/12 是 `inv12`，不是有理数字面量。）

  **配套但不进目标陈述**：`gram_level_one_two : ⟨L₋₁v, L₋₂v⟩ = 0`
  （worldsheet.shapovalov-form-uniqueness (3) 的实例），
  以及 `desc1_mem_levelSpan` / `desc2_mem_levelSpan` / `desc11_mem_levelSpan`。

  **目标 (4)（与 Kac 公式 N = 2 的比较）不在 Lean 里**，是 curator 的手算核对，
  见目标卡 notes；本推导不为它背书，见 gaps (ii)。
gaps:
  - |
    (i) **{L₋₂v, L₋₁²v} 张成 V_2 这件事在 Lean 里没有具名引理**。
    Lean 只有三条 `desc*_mem_levelSpan`（**属于** levelSpan）。张成性是
    `levelSpan R c h 2 = span (range (levelWord R c h 2))` 与「2 的合成恰有 [2] 与 [1,1]」
    的直接读出（一行 `Composition` 枚举），**但没有人写下来**。
    目标陈述【不断言】(a) 里「它们张成 V_2」这半句因此是 **rigorous 级的一行推论**，
    不是逐字机器检查的。⚠ 这不影响目标 (1)(2)(3) 的 formalized——那三条完全不提 V_2。
  - |
    (ii) **目标 (4) 的比较是手算，不在 Lean、也不在任何来源的逐字内容里**。
    Lean 给的是多项式 `2*h*(16*h^2 + 2*h*(c-5) + c)`；把它写成
    32(h−0)(h−h_{1,2})(h−h_{2,1}) 并与 schottenloher-2008 Theorem 6.12 的 h_{p,q}(c) 对上，
    是 curator 在目标卡 notes 里做的（researcher 已在 math-sources.md §34.8 独立做过
    c = 1 与 c = 1/2 的数值核对）。⇒ (4) 的严格程度是「curator 手算 + researcher 数值核对」，
    **不是 formalized**。若 reviewer 认为这足以阻止目标卡整体标 formalized，
    正确的修法是把 (4) 拆成单独的卡，而不是把本推导降级。
  - |
    (iii) **与「Kac 行列式」的等同缺 PBW**。见目标【不断言】(a)：需要
    math.verma-module-free-over-negative-part 的 dim V_2 = p(2) = 2（线性无关）。
    在此之前 (3) 是张成集的 Gram 行列式。本推导**刻意不引**那张卡，
    以免把 formalized 拖低成 rigorous——目标陈述已把这一步排除在外。
  - |
    (iv) **B 的存在性不在本推导内**。目标是「设 B 是归一化逆变型，则……」的条件命题。
    存在性见 worldsheet.shapovalov-form-existence。若不存在这样的 B，
    目标全部空洞成立。
notes: |
  status: formalized 的证据标准见 literature/sources.bib 的 stringformal-2026 条目
  （lake build 通过、目标声明无 sorry、公理仅 propext / Classical.choice / Quot.sound）。

  【为什么这条推导对无鬼定理岛有价值】它是图上第一处把「Virasoro 中心荷 c 通过中心项
  进入内积数值」这件事机器验证到底的地方（(2) 的 c/2 全部来自 ⁅L2, L−2⁆ 的中心项）。
  同一模式在 worldsheet.ocq-level-two-scalar-norm-closed-form 那边以自由玻色子实现出现，
  两者互为独立核对：那边 c = D，本卡的 c 是抽象中心荷。
  ⚠ 两卡目前**没有**边相连，因为它们的 Virasoro 模不同（Verma vs Fock），
  把它们接起来需要 Verma → Fock 的模映射（Kytölä 的 Thm 12.7 有，本图暂无节点）。
