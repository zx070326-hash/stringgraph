summary: |
  用 (1.2.32) 的 R' = e^{-2ω}(R - 2∇_a∂^a ω) 与 (-γ')^{1/2} = e^{2ω}(-γ)^{1/2} 得
    ∫_M (-γ')^{1/2} R' = ∫_M (-γ)^{1/2} (R - 2∇_a ∂^a ω).
  多出的 -2∫_M (-γ)^{1/2} ∇_a ∂^a ω 是全散度，由散度定理化为 -2∫_{∂M} ds n^a ∂_a ω。
  边界项用 ds' = e^{ω} ds 与 k' = e^{-ω}(k + n^a ∂_a ω) 得
    ∫_{∂M} ds' k' = ∫_{∂M} ds (k + n^a ∂_a ω)。
  按 χ 的系数 1/(4π) 与 1/(2π) 组合，两处 n^a ∂_a ω 的贡献
  (-2/(4π)) 与 (+1/(2π)) 精确相消，故 χ[γ'] = χ[γ]。
gaps:
  - "边界的测地曲率变换式 k' = e^{-ω}(k + n^a ∂_a ω) 与 ds' = e^{ω} ds 不在抽取记录中，是 curator 补入的标准二维几何公式，无来源核对；无边界情形（闭世界面）不受此影响。"
  - "散度定理的应用假定 M 紧、ω 光滑、边界光滑（无角点）；文献不讨论角点，而带角点的世界面（如开弦树图）会给 χ 补角贡献。"
  - "Polchinski 的原文措辞未核实（正文未获取，见抽取记录 §0）；本条标 rigorous 的依据是该计算是标准二维黎曼几何，可独立复核。"
