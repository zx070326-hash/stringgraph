summary: |
  机器检查的证明，全部在 formal/StringFormal/NoGhost/Sugawara.lean 的 `Representation` 一节。

  1. **构造 Witt 层的表示**。Witt 代数 W_R 在 R 上以 `WittAlgebra.lgen R n`（n ∈ Z）为基，
     用 `Basis.constr` 把 n ↦ L_n 线性延拓成 `wittRep : W_R →ₗ[R] End_R(F)`
     （`wittRep_lgen : wittRep (ℓ n) = L_n`）。良定义性即 `Basis.constr` 的泛性质，无内容。

  2. **保括号（Witt 层）**，`wittRep_lie`。要证的是双线性映射的相等
       (w, w') ↦ wittRep ⁅w, w'⁆    与    (w, w') ↦ ⁅wittRep w, wittRep w'⁆。
     两边都写成 `W_R →ₗ[R] W_R →ₗ[R] End_R(F)`（文件里的私有 `bilRep` / `bilRep'`），
     再用 `Basis.ext` 逐对基元 (ℓ m, ℓ n) 比较，归结为
       L_m L_n - L_n L_m = (m-n) L_{m+n} + （中心项）
     ——但 Witt 代数没有中心元，故这一步只在中心项为零时成立。文件的做法是先在 Witt 层
     处理无中心项的部分，中心项在第 3 步经 Virasoro 的 2-上圈吸收。
     核心输入是 `lie_Lop_Lop`（worldsheet.free-boson-central-charge-d）。

  3. **抬到 Virasoro 层**。`virRep := wittRep ∘ toWitt + toSpanSingleton (D • id) ∘ centralPart`，
     即把 X ∈ Vir_R 分解为「Witt 部分 + 中心部分」，中心部分乘以标量 D。
     由构造直接得 `virRep_lgen : ρ(L_n) = L_n` 与 `virRep_cgen : ρ(C) = D · id`。

  4. **保括号（Virasoro 层）**，`virRep_lie`。用 Vir_R 的括号公式
     （`VirasoroAlgebra.toProd_lie`：Witt 分量是 Witt 括号，中心分量是 2-上圈
     `cocycleBilin` 在 Witt 分量上的取值），把左边展开成
       wittRep ⁅toWitt X, toWitt Y⁆ + cocycleBilin(toWitt X, toWitt Y) · (D • id);
     右边用 `lie_add_left` / `lie_add_right` 展开，中心项与一切对易（`lie_smul_id_left/right`
     给零），剩下的正是第 2 步的 `wittRep_lie`。两边逐项相等。
     这一步用到 hη : ∀ μ, η μ * η μ = 1（经 `wittRep_lie` 传下来）。
gaps:
  - |
    **未打包成 `LieHom`**（formalizer 记录的缺口，Sugawara.lean 文件头 "Mathematical gaps" 第 4 条）。
    Mathlib v4.33.1 只通过 `local instance`（`LieRing.ofAssociativeRing`）让 `Module.End R M`
    成为 `LieRing`，该实例出了那个文件就不可用，故同态性质写成裸定理 `virRep_lie`
    而不是 bundled 的 `VirasoroAlgebra R →ₗ⁅R⁆ Module.End R (Fock D R)`。
    **数学内容完全相同**（R-线性 + 保括号 = 李代数同态的定义），
    但下游若想把它当 `LieHom` 用（例如接 Mathlib 的表示论 API），还需要重新打包。
  - |
    **η 对角且 η^{μμ} η_{μμ} = 1**（假设 `hη`），零模是标量参数 a : Fin D → R（无 x^μ），
    R 必须是交换 ℚ-代数，Fock 空间是**代数版**（未取完化）。
    这些限制继承自 worldsheet.free-boson-central-charge-d--via-lean 的 gaps 与
    worldsheet.bosonic-fock-space 的缺口 (i)(ii)(iii)，此处不重复论证。
  - |
    **与内积无关**：本推导不涉及 worldsheet.fock-indefinite-form 的 `Fock.pairing`，
    特别是 **L_n^† = L_{-n} 未证**，故本条**不**能用来支持「F 是 Virasoro 代数的
    幺正/*-表示」这类陈述。无鬼定理需要的正是后者。
  - |
    **不断言不可约性、最高权、Verma 商结构**。Lean 里有 `eq_smul_id_of_lie_mode`
    （F 在**振子代数**上的刚性），但**没有** F 在 Virasoro 代数上的不可约性，
    也没有把 F 与 worldsheet.verma-module 联系起来的任何结果。
  - |
    **Vir_R 的「基」在 Lean 中未打包**（继承 worldsheet.virasoro-algebra-v2 缺口 (i)）：
    `Basis (Option ℤ) R (VirasoroAlgebra R)` 实例尚未构造，Lean 只有「张成 + 模同构
    Vir ≅ W(R) × R」。本节点陈述里说「Vir_R 作为 R-模自由，基为 {L_n} ∪ {C}」，
    严格说这一句的 Lean 对应是 `toProdₗ` 加 Witt 侧的基，而不是一条 `Basis` 声明。
    `virRep` 的良定义性并不受影响——它是由 Witt 基的 `Basis.constr` 加中心方向的
    `toSpanSingleton` **构造**出来的，不需要 Vir 的基。
