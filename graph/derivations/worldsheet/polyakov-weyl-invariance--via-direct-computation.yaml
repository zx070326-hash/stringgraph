sources:
  - ref: polchinski-1998-v1
    loc: "§1.2, eq. **(1.2.21)**, p.13（Weyl 变换 `X′^μ = X^μ`, `γ′_ab(τ,σ) = exp(2ω(τ,σ))γ_ab(τ,σ)`）"
    note: |
      抽取记录 polchinski-1998-v1#E7。
      **【订正 2026-09-11（curator-v1-sec13，L1 页图逐字）】** **Weyl 变换的式号是 (1.2.21)，p.13**，
      不是旧写的「约 (1.2.19)–(1.2.20)」——(1.2.19) 是 Poincaré、(1.2.20) 是 diff。
      Weyl 变换写法此前只由 Headrick 习题 1.3 第 (8) 式确认，现由原书直接确认，升到 **L1**。
      ⚠ 本推导 summary 末句「一般 d 维：(−γ′)^{1/2} = e^{dω}(−γ)^{1/2}，故因子为 e^{(d−2)ω}」
      **不是原书 §1.2 的内容**，是本图补的（该处只讲二维），gaps 未列此点，此处记账。
summary: |
  在二维，γ'_{ab} = e^{2ω} γ_{ab} 给出 det γ' = e^{4ω} det γ，故 (-γ')^{1/2} = e^{2ω}(-γ)^{1/2}；
  同时 γ'^{ab} = e^{-2ω} γ^{ab}。两个因子相乘 e^{2ω} · e^{-2ω} = 1，
  而 X^μ 不变故 ∂_a X^μ ∂_b X_μ 不变。因此被积式逐点不变，S_P 不变。
  一般 d 维：(-γ')^{1/2} = e^{dω}(-γ)^{1/2}，故因子为 e^{(d-2)ω}，仅 d = 2 时为 1。
gaps:
  - "经典陈述；量子层面（路径积分测度）Weyl 不变性一般被破坏，见 §3.4 的 Weyl 反常。本推导不涉及测度。"
  - "Polchinski 的原文措辞未核实（正文未获取）；本条标 rigorous 的依据是该计算是初等线性代数，可独立复核。"
