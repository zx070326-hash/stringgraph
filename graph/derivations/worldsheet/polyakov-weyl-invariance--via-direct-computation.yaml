id: worldsheet.polyakov-weyl-invariance--via-direct-computation
target: worldsheet.polyakov-weyl-invariance
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.polyakov-action
sources:
  - ref: polchinski-1998-v1
    loc: "§1.2，约 eq. (1.2.19)–(1.2.20)（Weyl 变换 γ'_ab = e^{2ω} γ_ab）"
    note: |
      抽取记录 polchinski-1998-v1#E7；Weyl 变换写法经 Headrick 习题 1.3 第 (8) 式确认，
      公式号未核对原书。
summary: |
  在二维，γ'_{ab} = e^{2ω} γ_{ab} 给出 det γ' = e^{4ω} det γ，故 (-γ')^{1/2} = e^{2ω}(-γ)^{1/2}；
  同时 γ'^{ab} = e^{-2ω} γ^{ab}。两个因子相乘 e^{2ω} · e^{-2ω} = 1，
  而 X^μ 不变故 ∂_a X^μ ∂_b X_μ 不变。因此被积式逐点不变，S_P 不变。
  一般 d 维：(-γ')^{1/2} = e^{dω}(-γ)^{1/2}，故因子为 e^{(d-2)ω}，仅 d = 2 时为 1。
gaps:
  - "经典陈述；量子层面（路径积分测度）Weyl 不变性一般被破坏，见 §3.4 的 Weyl 反常。本推导不涉及测度。"
  - "Polchinski 的原文措辞未核实（正文未获取）；本条标 rigorous 的依据是该计算是初等线性代数，可独立复核。"
