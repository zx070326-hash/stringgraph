id: worldsheet.ghost-number-current-weyl-anomaly--via-tj-ope
target: worldsheet.ghost-number-current-weyl-anomaly
kind: physical-argument
status: physical-argument
depends_on:
  - id: worldsheet.bc-ghost-cft
    note: |
      提供 bc 系统、鬼数流 j = −:bc:、以及「j 不是主场，在共形变换下带反常项
      （(2.5.15)–(2.5.17)）」——那个反常项就是这里三阶极点的来源。
  - id: worldsheet.weyl-anomaly-trace
    note: |
      提供 Weyl 反常的一般形式：由局域性与量纲分析，反常只能正比于 R，系数由短距离展开定出。
      本推导把同一套论证从 ⟨T^a_a⟩ 搬到 ∇_a j^a。
  - id: worldsheet.operator-product-expansion
    note: 系数由 T(z)j(0) 的 OPE 三阶极点读出，故依赖 OPE 及其收敛性假定。
sources:
  - ref: polchinski-1998-v1
    loc: "§5.3, eq. (5.3.19), p.158（L1 页图，抽取记录 §16.2）；**§2.5, eq. (2.5.15), 印刷 p.51（L1，两轮页图）**：T(z)j(0) ∼ +(1−2λ)/z³ + (1/z²)j(0) + (1/z)∂j(0)，三阶极点系数逐字是 **+(1−2λ)**；(2.5.14) j = −:bc:；(3.4.9)；exercise 3.6, p.119（换算规则「Tj 的 z^{−3} 系数 + T̃j̃ 的 z̄^{−3} 系数 = 4a」，证明留读者）"
    note: |
      抽取记录 #E81，L1（schrans-2020 §5.21，笔记 p.260–261）。
      伴读者先由习题 3.6 的形式 ∇_a j^a = aR 读系数，再独立重做一遍
      （把 δ_W 作用在两边，条目 [5.79]–[5.85]）验证 a = α。
      **★ 2026-09-11（curator-small-backlog-5，依 researcher polchinski-1998-v1.md §18，p.119 页图 L1）**：
      exercise 3.6 题面逐字「On dimensional grounds, a current that is conserved on a flat world-sheet has the
      possible anomaly ∇_a j^a = aR. By comparing the Weyl transformations of the two sides, show that the sum
      of the coefficients of z^{−3} in T j and of z̄^{−3} in T̃ j̃ is 4a.」——题面**不含** 3、λ、bc、(1−2λ)/4。
      系数链：exercise 3.6（规则，证明留读者）→ §2.5 **(2.5.15), 印刷 p.51** → (5.3.19) a = (1−2λ)/4
      （全纯系统 T̃j̃ = 0，故 4a = 1−2λ）→ λ = 2 → (5.3.20) 的 3χ/2。
      「把规则用到 bc 系统」这一步正文与习题都不写。
      **★ 2026-09-11（curator-small-backlog-6，依 researcher polchinski-1998-v1.md §19，印刷 p.51 页图）**：
      (2.5.15) 的式号与逐字形式已由 ch.2 单章 PDF 页图**第二次独立核实，本条来源因此升为 L1**；
      Q18.1 正式关闭，此前「§18 Q18.1 那轮未复读 pp.50–76 故记 L0，以 E36 为准」的记账已过时。
      ⚠⚠ **符号陷阱（§19.2）**：原书紧接 (2.5.15) 之后写
        ε^{−1}δj = −v∂j − j∂v + **((2λ−1)/2)** ∂²v ,                                  (2.5.16)
        (∂_z z') j_{z'}(z') = j_z(z) + **((2λ−1)/2)** (∂²_z z' / ∂_z z') ,                    (2.5.17)
      其反常项系数 (2λ−1)/2 与 (2.5.15) 三阶极点的 (1−2λ) **反号**（另差一个 1/2）。
      **本推导读的是 (2.5.15)**；若误用 (2.5.16)/(2.5.17) 的系数代入换算规则，(5.3.19) 的整体符号会翻转，
      λ = 2 时将得 +3/4 而非 −3/4。
summary: |
  bc 系统的鬼数流 j 不是主场：T(z)j(0) 的展开带一个三阶极点，系数 (1 − 2λ)。
  按与 Weyl 反常同样的局域性 + 量纲论证，弯曲世界面上 ∇_a j^a 只能正比于 R；
  比例常数由上述三阶极点定出，得 ∇_a j^a = ((1 − 2λ)/4) R。λ = 2 给 −(3/4)R。
gaps:
  - |
    **围道 + OPE 路线的既定缺口**（lead 2026-09-10 裁决）：OPE 级数的收敛性与围道变形的
    合法性在来源中未被证明，凡此类推导一律 physical-argument。
  - |
    **反常的「可能形式」∇_a j^a = aR 本身只由量纲论证给出**（2026-09-11 依 §18.1 (a)）：
    exercise 3.6 题面首句逐字 "On dimensional grounds, a current that is conserved on a flat world-sheet has
    the **possible** anomaly"——不是推导出来的。
  - |
    **换算规则「Tj 的 z^{−3} 系数 + T̃j̃ 的 z̄^{−3} 系数 = 4a」的证明留给读者**（§18.1 (b)）：
    题面末句 "show that"；正文 (5.3.19) 只写 "derived in exercise 3.6"。
  - |
    **从换算规则到 (1−2λ)/4 还缺一步**（§18.1 (c)）：需要代入 bc 系统的 Tj OPE (2.5.15) 的 z^{−3} 系数 (1−2λ)，
    并用「本系统只有全纯部分 ⇒ T̃j̃ 项为零」；这一步正文与习题都不写。
    ⚠ 此前 gaps 写「系数的读出所依据的习题 3.6」，措辞已收窄为「换算规则出自习题 3.6」——习题里**没有**那个数。
  - |
    ⚠ **勘误依赖**：习题 3.6 在印刷版里有符号错
    （schrans-2020 逐字「a sign error on exercise 3.6, as per Joe's errata page」）。
    **Polchinski 官方勘误表本项目未能取得**，该事实目前只有 schrans-2020 单源支撑（L3）。
    若勘误内容与此不符，本式的整体符号需要重定；故本图只把系数的**绝对值关系**当作有来源的内容。
    ★ **部分缓解（2026-09-11，§19.3/§19.4）**：三条**印刷**式 (2.5.15)、(5.3.19)、(5.3.20) 在
    Gauss–Bonnet ∫d²σ g^{1/2}R = 4πχ 下两步复算完全自洽（a = q/4 同号；(iε/2π)((1−2λ)/4)4πχ
    = −iε(2λ−1)χ/2 与 (5.3.20) 右端逐字相同）⇒ 即使习题 3.6 印刷版确有符号错，那个错没有传播到正文这三条。
    ⚠ 勘误表本身仍未取得（Q18.2 开），本缺口不关闭，定级不变。
  - |
    **系数 1/4 与三阶极点归一化本图未独立验证**：来源只给出结论式与 OPE 的形状，没有中间步骤；
    本图没有 (2.5.15) 的独立节点（其逐字形式 +(1−2λ)/z³ + (1/z²)j + (1/z)∂j 已有 L1 页图，
    抽取记录 E36 表与 §19.2），也没有核实 (3.4.9) 的归一化。
    ⚠ §19.3 只验证了 (2.5.15)、(5.3.19)、(5.3.20) 三者的数字与符号在 Gauss–Bonnet 下相容，
    **没有**补上 (2.5.15) → (5.3.19) 这一步的论证。
  - |
    **反常作为算子方程的地位没有论证**：从「配分函数的 Weyl 变分」到「∇_a j^a 是算子方程」
    这一步在下游（Riemann–Roch）被当成前提使用，来源里没有证明。
  - |
    **来源强度**：式号 (5.3.19) 只经 schrans-2020 核对（对笔记 L1，对原书 L3）。
