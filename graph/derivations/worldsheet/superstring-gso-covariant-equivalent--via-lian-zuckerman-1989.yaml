summary: |
  **LZ 的论证（四步，全部逐字可核，见 sources 第一条）**：

  1. **造投影子**：Definition 4.1 先把 GSO 的物质 G-parity Ḡ_κ（p.328 正文版，指数只含物质
     费米模 d）**延拓**到相对复形上（加 b_{−n}c_n + c_{−n}b_n 两项）。
     关键观察是 (1)：**Q 反转 Ḡ_κ 的本征值**（Q : ½(1 ± Ḡ_κ)C^n_rel → ½(1 ∓ Ḡ_κ)C^{n+1}_rel），
     所以与 Q 对易的不是 ½(1 ± Ḡ_κ) 而是
       **P̄_± = ½(1 ± (−1)^{U+κ}Ḡ_κ)**   （鬼数算符 U 补上缺的那个符号），
     于是 (P̄_±C*_rel, Q) 是两个子复形（LZ 命名 **GSO 子复形**）。
  2. **证 (i)（正交分解）**：P̄_± 关于 ⟨,⟩_rel 是**正交投影子**——P̄²_± = P̄_±、P̄_±* = P̄_±、
     P̄_+P̄_− = P̄_−P̄_+ = 0、P̄_+ + P̄_− = 1——且 [Q, P̄_±] = 0。由这五条即得
       [ω] ↦ [P̄_+ω] + [P̄_−ω]
     是 H*_rel → H*(P̄_+C_rel) ⊕ H*(P̄_−C_rel) 的**等距**，右端是正交直和。
  3. **证 (ii) 的"集中在 n = 0"**：原文逐字 'Combining (i) and **Theorem 2.4**'——
     由 (i) 的分解与消灭定理（H^n_rel = 0 除 n = 0）得 H^n(P̄_+C_rel) = 0 除 n = 0。
     ⇒ **这一步是本推导继承 Theorem 2.4 全部前提（尤其 p ≠ 0）的地方。**
  4. **证 (ii) 的维数**：Euler–Poincaré 原理给 Σ_n (−1)^n dim P̄_+C_rel = dim H⁰(P̄_+C_rel)，
     左端就是 char P̄_+C_rel，由 **Proposition 4.2** 等于 **8p₀^{(8)}(−p·p/2)**。
     ⇒ dim H⁰(P̄_+C_rel) = 8p₀^{(8)}(−p·p/2)。
     由于右端**不含 κ**，两个扇区的维数相等，即目标卡的断言 (3)。

  **作者对这件事的定位（照实记，不是本图的评价）**：p.330 逐字
  'Thus we have achieved the **"covariant"** equivalent of the GSO projection.'
  ——动词是 **achieved**，引号**只包 covariant**。GSO 截断的原始提案归
  Gliozzi–Scherk–Olive 1977，LZ 明说那是在 "old covariant" 形式下提的（p.328）。
  ⇒ **本推导不主张 LZ 证明了 GSO 投影**，只主张 Prop 4.3 的两条断言。

  【为什么标 rigorous】四条：
  (1) 结论是**带编号的命题**（Proposition 4.3），陈述与证明都已逐字核实（L1 页图）；
  (2) 证明的三条输入都是原文明写的编号结果（Theorem 2.4、Euler–Poincaré 原理、
      Proposition 4.2），无"一点思考就知道"式的断言；唯一的 'It is easy to check' 用在投影子的
      四条代数恒等式上，那确实是一行演算（researcher §7.3 第 4 点）；
  (3) 论证全在有定义的复形与分次模范畴里，不涉路径积分、不涉收敛性；
  (4) 期刊是 Communications in Mathematical Physics。
  与 worldsheet.superstring-relative-cohomology-vanishing-v2--via-lian-zuckerman-1989 的
  记账口径一致。

  【有效状态为什么仍会被封顶】依赖里的 worldsheet.superstring-brst-charge、
  worldsheet.superstring-brst-additional-conditions 等定义卡自身是 physical-argument
  （上游是 OPE / 路径积分链），按 docs/STATUS_LEVELS.md 的 min 规则封顶。
  **这不是 LZ 的论证有缺口**，而是本图把"LZ 的对象 = Polchinski 的对象"这一步经由那些卡
  记账的后果。
