notes: |
  【本推导与 worldsheet.gso-projection / no-ghost-theorem-superstring 的分工（未接线）】
  按 lead 指示，本轮**不改**那两张卡的依赖边，只在它们的 notes 里记下"本卡是唯一 rigorous
  候选来源"。理由是两侧的投影算子不是同一个对象（见 gaps 第六条）。
  ⇒ 图上现在的局面是：Polchinski 链（gso-projection，一致性条件的重述）与数学链（本卡，
  Prop 4.3）**并存且不相连**，连接点是一条未核实的字典。这个局面是有意留下的，
  比硬接一条 inferred 边更诚实。

  【本卡的 status 与 worldsheet.no-ghost-theorem-superstring 断言 (4) 的对比】
  那张卡的 (4) 在原书里的全部论证是 'The proof is a direct imitation of the bosonic argument
  of chapter 4.'（physical-argument）；本卡是带编号、带完整证明的 Proposition（rigorous）。
  **这正是本卡值得单建的理由**：同一件事在物理文献里是一句话，在数学文献里是一条命题，
  图上应当能看出这个强度差。

