target: worldsheet.shapovalov-form-existence
kind: proof
status: formalized
depends_on:
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      提供本推导的**核心工具**，分两块：
      (a) **万有性质**（(1)(2) 用）：`vermaLift`（把任一 Virasoro 模里的权 (c,h) 最高权向量
          提升为等变映射）、`vermaLift_hwv`、`vermaLift_lie`（等变性，逆变性由它一行推出）；
          另有最高权关系 `lie_lgen_hwv_of_pos` / `lie_lgen_zero_hwv` / `lie_cgen_hwv`
          （σ-扭对偶里 C 按标量作用那一步 `lie_cgen_eq` 经 `exists_smul_hwv` 归约到它）。
      (b) **L_0 分级**（(4) 用）：`levelSpan`、level 移位 `lie_lgen_mem_levelSpan_of_neg`
          （n < 0 时 L_n : V_N → V_{N+|n|}，**任意 ℚ-代数、对 c,h 无假设**）、
          `lie_lgen_zero_of_mem_levelSpan`，以及**域上**的内直和
          `isInternal_levelSpan` / `levelSpan_iSupIndep`（该卡陈述里「若 R = K 是特征零的域，
          则 V(c,h) = ⊕_N V_N 且 V_N 恰是 L_0 的 (h+N)-特征子空间」那一段）。
      **刻意未用**该卡不断言的 PBW / dim V_N = p(N) / V(c,h) ≠ 0；
      (4) 把 V(c,h) ≠ 0 当作**假设**（并证明它同时是必要条件），不去证它。
      字面依赖（Shapovalov.lean import Verma.lean，逐条调用）。
  - id: math.virasoro-anti-involution
    inferred: false
    note: |
      **本推导对该卡 (2)「σ 是反自同构」的依赖是实质性的**（与 uniqueness 那条推导不同）：
      σ-扭对偶 `ContraDual` 上的作用定义为 (X·φ)(v) := φ(σ(X)·v)，
      要验证它是**李模**（`lie_lie` 公理，Lean 的 `ContraDual.instLieRingModule`）
      必须用 σ⁅X,Y⁆ = ⁅σY, σX⁆，即 `VirasoroAlgebra.antiInvolution_lie`
      （该实例的 `lie_lie` 字段第一步就 rw 它）。
      换言之：**若 σ 不是反自同构，σ-扭对偶就不是 Virasoro 模，(1)(2) 的构造路线不存在。**
      此外 (1) 的取值 `antiInvolution_lgen`（L_n ↦ L_{−n}）、`antiInvolution_cgen`（C ↦ C）
      在 `shapovalov_isContravariant` 与 `IsShapovalovFunctional.isHighestWeightVector`
      里逐条用到。字面依赖（同文件，上一节）。
