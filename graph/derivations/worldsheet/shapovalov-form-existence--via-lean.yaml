id: worldsheet.shapovalov-form-existence--via-lean
target: worldsheet.shapovalov-form-existence
kind: proof
status: formalized
depends_on:
  - id: worldsheet.verma-module-v2
    inferred: false
    note: |
      提供本推导的**核心工具——万有性质**：`vermaLift`（把任一 Virasoro 模里的权 (c,h)
      最高权向量提升为等变映射）、`vermaLift_hwv`、`vermaLift_lie`（等变性，逆变性由它一行推出）。
      另用到最高权关系 `lie_lgen_hwv_of_pos` / `lie_lgen_zero_hwv` / `lie_cgen_hwv`
      （(2) 的 «(i) ⇒ (ii)» 与 σ-扭对偶里 C 按标量作用那一步 `lie_cgen_eq`，
      后者经 `exists_smul_hwv` 把 V 的任意元写成 u·|c,h⟩ 后归约到 `lie_cgen_hwv`）。
      **刻意未用**该卡的分级（levelSpan）与它不断言的 PBW / dim V_N = p(N) / V ≠ 0。
      字面依赖（Shapovalov.lean import Verma.lean，逐条调用）。
  - id: math.virasoro-anti-involution
    inferred: false
    note: |
      **本推导对该卡 (2)「σ 是反自同构」的依赖是实质性的**（与 uniqueness 那条推导不同）：
      σ-扭对偶 `ContraDual` 上的作用定义为 (X·φ)(v) := φ(σ(X)·v)，
      要验证它是**李模**（`lie_lie` 公理，Lean 的 `ContraDual.instLieRingModule`）
      必须用 σ⁅X,Y⁆ = ⁅σY, σX⁆，即 `VirasoroAlgebra.antiInvolution_lie`
      （Shapovalov.lean 中该实例的 `lie_lie` 字段第一步就 rw 它）。
      换言之：**若 σ 不是反自同构，σ-扭对偶就不是 Virasoro 模，整条构造路线不存在。**
      此外 (1) 的取值 `antiInvolution_lgen`（L_n ↦ L_{−n}）、`antiInvolution_cgen`（C ↦ C）
      在 `shapovalov_isContravariant` 与 `IsShapovalovFunctional.isHighestWeightVector`
      里逐条用到。字面依赖（同文件，上一节）。
