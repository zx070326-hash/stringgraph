    loc: "formal/StringFormal/Virasoro/Shapovalov.lean :: StringFormal.Virasoro.{lie_cgen_eq, ContraDual, ContraDual.{ofLin, toLin, toLinₗ, ext, toLin_ofLin, lie_apply}, IsShapovalovFunctional, IsShapovalovFunctional.isHighestWeightVector, shapovalov, shapovalov_apply, shapovalov_hwv_hwv, shapovalov_isContravariant, existsUnique_isContravariant, hwv_ne_zero_of_isContravariant, isShapovalovFunctional_of_isContravariant, exists_isContravariant_iff}；上游调用 StringFormal.Virasoro.{vermaLift, vermaLift_hwv, vermaLift_lie, exists_smul_hwv, lie_lgen_hwv_of_pos, lie_lgen_zero_hwv, lie_cgen_hwv, eq_of_isContravariant} 与 VirasoroAlgebra.{antiInvolution_lgen, antiInvolution_cgen, antiInvolution_lie}"
    note: |
      本仓库，形式化侧提交 **1731c49**（σ-扭对偶与构造）与 **bbc1354**（等价那一半），
