      与 worldsheet.no-ghost-theorem-conditional-on-ddf-spanning--via-lean 的同名边
      引用同一条 Lean 引理、同一映射关系。
  - id: worldsheet.tower-physical-quotient-form
    inferred: false
    note: |
      **两条引理都来自这张卡记录的零态结构**：(1) `towerNullSubmodule_le_towerPhysSubmodule`
      （TowerNull.lean）给出 `hT : towerNullSubmodule ⊓ V_N ≤ H_phys ⊓ V_N`；
      (2) `towerPairing_self_eq_zero_of_mem_towerNullSubmodule`（同文件）在
      `ddfSpan_inf_towerNullSubmodule_eq_bot` 的证明里把零态的自配对判零，
      与 `ddf_span_pos` 的假设为正矛盾，逼出 `hdisj : D_N ⊓ Z_N = ⊥`。
  - id: worldsheet.transverse-ddf-fock-gram-matrix
    inferred: false
    note: |
      **DDF 扇区正定**：`ddf_span_pos`（DDFGram.lean，该卡 --via-lean 推导 summary 第四步
      登记的同一条结论）在 `ddfSpan_inf_towerNullSubmodule_eq_bot` 的证明里给出
      「0 ≠ x ∈ ddfSpan ⇒ ⟨x,x⟩ > 0」，是判定 `D_N ⊓ Z_N = ⊥` 的另一半（配合上面
      的零态自配对为零）。⚠ 这是本推导链条上**唯一用到序结构**（`[LinearOrder K]
      [IsStrictOrderedRing K]`）的地方——`B26` 本身（上一条边）不含序，`ddfSpansOn_bigrade_of_b26`
      的结论也不含序，序只出现在这一步的证明内部，与 `formal/BLUEPRINT-noghost.md`
      「B′ 订正」第 4 条的记账逐字一致。
sources:
