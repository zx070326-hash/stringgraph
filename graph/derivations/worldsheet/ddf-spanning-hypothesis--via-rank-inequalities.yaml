      它与 Mathlib 的秩–零化度定理属于同一层级的背景数学，不是本项目的物理论证内容。
  - ref: goddard-2008
    loc: "§6 'No-Ghost Theorem', p.15；文献直接断言整塔张成，不经过逐片秩不等式"
    note: |
      **不承载本推导的论证**。逐片秩不等式改写是本项目为形式化引入的中间步骤
