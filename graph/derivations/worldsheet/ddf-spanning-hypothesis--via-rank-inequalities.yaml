    inferred: false
    note: |
      **条件命题的前件，不是证明步骤——本推导真正的量词方向是 ∀N。** Lean 声明
      `ddfSpans_of_forall_b26 (h : ∀ N : ℕ, B26 η a b hη Ε N) : DDFSpans η a b hη Ε`
      把「本卡对每个 N 成立」逐字作为假设参数 `h`，证明体第一步就是
      `ddfSpansOn_bigrade_of_b26 hbb hba (h N)`（对每个 N 代入 `h N`）。**非 inferred**。
      ⚠ **该卡 open（刻意无推导）会把本推导的 effective 压到 open——这是刻意且正确的记账**：
      与 worldsheet.no-ghost-theorem-conditional-on-ddf-spanning--via-lean 对
      worldsheet.ddf-spanning-hypothesis 本身的处理同型，本推导自身 status 仍是 formalized
      （Lean 无 sorry），工具会同时显示 own=formalized / effective=open，两者都对。
      **不要**为抬高 effective 而删这条边或给前件挂弱推导——那正是本推导存在的意义：
      把「困难的整塔张成假设」逐字压成「困难的逐 N 秩不等式假设」，猜想负担搬了位置，
      没有被抹去。
  - id: worldsheet.ddf-operators-preserve-physical-states
    inferred: false
    note: |
      **DDF 态是物理态**：`ddfSpan_le_towerPhysSubmodule`（LightCone.lean），在
      `ddfSpansOn_bigrade_of_b26` 的证明里给出 `hS : ddfSpan ⊓ V_N ≤ H_phys ⊓ V_N`
