    loc: "formal/StringFormal/NoGhost/SliceRank.lean :: StringFormal.NoGhost.ddfSpans_of_forall_b26（目标声明，第 200 行，依赖 ddfSpansOn_bigrade_of_b26 第 172 行、ddfSpan_inf_towerNullSubmodule_eq_bot 第 126 行、eq_sup_of_finrank_le 第 98 行）；消耗 formal/StringFormal/NoGhost/Glue.lean :: StringFormal.NoGhost.ddfSpans_of_forall_antidiagonal_slice_int（拼装引理，把逐片结论组装成整塔 DDFSpans）"
    note: |
      本仓库，Lean 4 + Mathlib v4.33.1，无 sorry（分支 agent/formalizer/general-n-pr012，
      经提交 9328c03 合入 main）。**curator 未自行重跑 `lake build`**；合并前应由 lead 跑
      `uv run stringgraph check-axioms`。
      **`eq_sup_of_finrank_le`（第 98 行）是纯抽象线性代数**（`S,T ≤ H`、`S⊓T=⊥`、
      `dim H ≤ dim S + dim T` ⇒ `H = S⊔T`，只用 `Submodule.finrank_sup_add_finrank_inf_eq` 与
