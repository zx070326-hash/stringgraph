summary: |
  LZ 1989 Theorem 2.20 的证明是"**显式包含映射 + 等距 + 维数相等**"三步：

  1. **构造映射**：λ : P → C⁰_rel，λ(v) = v ⊗ |q_F = 1⟩ ⊗ |q_B = 1 − κ⟩。
     鬼部门的两个因子选得恰好使 λ(v) 落在相对复形里（被 b₀ 零化，R 扇区还被 β₀ 零化），
     且鬼数为 0。于是 λ 诱导 P → H⁰_rel。
  2. **等距**：λ 诱导的 P/λ^{−1}B⁰_rel → H⁰_rel 是**保厄米形式**的单射。
     这一步要用：R 扇区相对复形上的形式是 Definition 2.11 的 ⟨u,v⟩_rel = √−1⟨u, v̂⟩_B
     （朴素形式在 C_rel(p,0) 上恒零，因 ⟨T₁, T₁⟩_T = 0），其良定义性由 Theorem 2.7
     （p ≠ 0 时 D_R 的上同调为零，故 v̂ 存在）保证；Q 关于该形式自伴（Proposition 2.14(i)）
     使上同调上的形式良定义。λ^{−1}B⁰_rel 恰是 P 上形式的根基 rad P。
  3. **维数相等 ⇒ 满射 ⇒ 同构**：
       dim H⁰_rel = ½(2κ+1) dim R(p,κ) p^{(8)}_κ(κ − p·p/2)   （Corollary 2.15(i)），
       dim T∩P   = ½(2κ+1) dim R(p,κ) p^{(8)}_κ(κ − p·p/2)   （Corollary 2.19(i)），
     两式**逐字相同**；再由 Corollary 2.19(ii)（T∩P 正定）得 T∩P ↪ P 诱导 T∩P ≅ P/rad P。
     合起来即 T ∩ P ≅ P/rad P ≅ H⁰_rel，且都是酉同构。

  其中 T 的存在性是 Proposition 2.18，证明**不用** DDF/谱生成代数（作者逐字说明），
  而用超 Virasoro 的 Kac 行列式与相关幺正性结果；T(p,0) 分成 T⁺ ⊕ T⁻。

  【为什么标 rigorous】与 worldsheet.no-ghost-theorem-superstring-cohomological--via-lian-zuckerman-1989
  同三条理由：带编号的定理 + 完整证明（§2–§3）；论证在有定义的模范畴里（过滤有限、deg 有上界、
  算子和逐项有限）；Communications in Mathematical Physics。
  与玻色弦一侧 worldsheet.brst-cohomology-equals-ocq-physical--via-fgz 的记账口径一致。

  【有效状态为什么仍是 physical-argument】依赖里的
  worldsheet.ocq-superstring-physical-states、worldsheet.superstring-brst-charge 等卡
  自身是 physical-argument，按 min 规则封顶。要抬高须先把超弦 OCQ/BRST 设定写成数学上自足的
  定义卡（Lean 岛候选）。已列入报告。
