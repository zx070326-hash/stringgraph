  figueroa-ofarrill-kimura-1989 **不建立任何同构**（只证正定性，§6 的迹恒等式判据），
  ito-morozumi-nojiri-uehara-1986 与 ohta-1986 也不用上同调语言、不证 BRST ↔ OCQ 的等价
  （IMNU 的物理态条件本身就是协变条件）。Polchinski §10.5 把两个同构与正定性写成同一句话
  但不给证明、不引文献。⇒ 目前只有 LZ 1989 Theorem 2.20 一条来源覆盖本卡。

  【与玻色弦一侧的对应】
    LZ 1989 Theorem 2.20 的第一个同构 P/rad P ≅ H⁰_rel
      ↔ fgz-1986 Theorem 2.8 的第一个同构（本图 worldsheet.brst-cohomology-equals-ocq-physical）；
    第二个同构 T∩P ≅ P/rad P
      ↔ fgz-1986 Theorem 2.8 的第二个同构（FGZ 自述那才是物理文献里的无鬼定理；
        本图 worldsheet.no-ghost-theorem-brst 的断言 (2)）。
  ⚠ **命名差异要记住**：FGZ 把"第二个同构"叫无鬼定理，LZ 1989 把"H⁰_rel 正定"
  （Corollary 2.15(ii)）叫无鬼定理。本图按各自作者的自命名分卡：
  正定性 → worldsheet.no-ghost-theorem-superstring-cohomological；
  两个同构 → 本卡。

