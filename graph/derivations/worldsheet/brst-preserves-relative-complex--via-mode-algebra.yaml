    note: |
      提供 Q_B、受限模、相对复形 {b_0Ψ = 0, L_0Ψ = 0} 的定义。
      （2026-09-11 由 worldsheet.brst-quantization 换代到 v2。c^g 的取值不进入 (1)(2)(3) 的代数；
