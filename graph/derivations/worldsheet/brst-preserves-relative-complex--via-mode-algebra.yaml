sources:
  - ref: polchinski-1998-v1
    loc: "§4.3，p.134（无编号正文断言：Q_B 保持 Ĥ；Ĥ 上需要新内积）；eq. (4.3.6)、(4.3.17)、(4.3.18)"
    note: 式号经 schrans-2020 目录核实；p.134 的两条断言原书无编号。抽取记录 polchinski-1998-v1.md#E66。
summary: |
  全部是受限模上的有限步反对易子代数（每个模式和逐项有限，见 worldsheet.brst-quantization）。

  **(1)** 设 b_0|Ψ⟩ = 0、L_0|Ψ⟩ = 0。
    - b_0 Q_B|Ψ⟩ = ({b_0, Q_B} − Q_B b_0)|Ψ⟩ = L_0|Ψ⟩ − 0 = 0。
    - [Q_B, L_0] = 0：把 L_0 在固定动量扇区上写成 α'p² + N^tot − 1，其中 N^tot 是总 level
      算符（[N^tot, α_{−n}] = n α_{−n}，[N^tot, c_{−n}] = n c_{−n}，[N^tot, b_{−n}] = n b_{−n}）。
      Q_B 的每一项的 level 移动为零：c_n L^m_{−n} 移动 −n + n = 0，
      : c_m c_n b_{−m−n} : 移动 −m − n + (m + n) = 0，c_0 移动 0；故 [N^tot, Q_B] = 0。
      又动量算符 p 与 Q_B 的每一项对易（物质 Virasoro 模不改变动量，鬼场模与 p 无关），
      故 [α'p², Q_B] = 0，合起来 [L_0, Q_B] = 0。
      于是 L_0 Q_B|Ψ⟩ = Q_B L_0|Ψ⟩ = 0。
      **这一步不用 Q_B² = 0**。另一条路是超李代数的导子恒等式
      [Q_B, {Q_B, b_0}] = [Q_B², b_0]（对奇算符 Q_B、b_0 直接展开即得），
      它给出同一结论但需要 Q_B² = 0，即 c^m = 26。
  于是 Q_B|Ψ⟩ ∈ C_rel，(C_rel, Q_B|_{C_rel}) 是复形；c^m = 26 时 Q_B² = 0，H_rel 才是上同调。

  **(2)** 取 |Ψ⟩, |Ψ'⟩ ∈ C_rel。分两步。

  *第一步：Q_B† = Q_B*。由 worldsheet.bc-ghost-hermitian-conjugation 的
  b_n† = b_{−n}、c_n† = c_{−n} 与 (AB)† = B†A†，把 Q_B 的每一项取伴随：
    (c_n L^m_{−n})† = (L^m_{−n})† c_n† = L^m_n c_{−n}，
  重新求和后与原式同形（哑指标 n → −n）；三次鬼场项的伴随仍是 : c c b : 型
  （配合 (m−n)/2 的反对称性），常数项 −c_0 的伴随是 −c_0。

  *第二步：把 Q_B 移过 c_0*。
    ⟨Q_BΨ, Ψ'⟩_rel = ⟨Ψ|Q_B† c_0|Ψ'⟩ = ⟨Ψ|Q_B c_0|Ψ'⟩
                   = ⟨Ψ|{Q_B, c_0}|Ψ'⟩ − ⟨Ψ|c_0 Q_B|Ψ'⟩
                   = ⟨Ψ|{Q_B, c_0}|Ψ'⟩ − ⟨Ψ, Q_BΨ'⟩_rel。
  逐项算 {Q_B, c_0}：
    · 物质项 {c_n L^m_{−n}, c_0} = {c_n, c_0} L^m_{−n} = 0（{c_m, c_n} = 0）；
    · 常数项 {−c_0, c_0} = −2c_0² = 0；
    · 三次鬼场项：对三个奇因子的乘积，{ABC, c_0} = AB{C, c_0}（把 c_0 移过 A、B 各得一个负号，
      两次相消，且 {c_m, c_0} = {c_n, c_0} = 0）；用 {b_j, c_0} = δ_{j,0} 得只有 −m−n = 0
      的项存活，系数 (m − n)/2 在 n = −m 处等于 m，故
        {Q_B, c_0} = Σ_{m ∈ Z} m : c_m c_{−m} : = −2 Σ_{m ≥ 1} m c_{−m} c_m。
  该算符只由非零 c 模构成，**不含 b_0、c_0**，故把 b_0-湮灭扇区（即"无 c_0 激发"的 |↓⟩ 扇区）
  映到自身。在该扇区内，没有 c_0 插入的配对因 ⟨↓|↓⟩ = 0 而为零，故 ⟨Ψ|{Q_B, c_0}|Ψ'⟩ = 0。
  代回得
    ⟨Q_BΨ, Ψ'⟩_rel = − ⟨Ψ, Q_BΨ'⟩_rel，
  这是 (2)。（若把厄米共轭对奇算符改成带额外 (−1) 的约定，符号会翻转；本图用的是
  (AB)† = B†A†，故负号是确定的。）

  **(3)** 由 (2)：⟨Ψ, Q_BΛ⟩_rel = −⟨Q_BΨ, Λ⟩_rel = 0（|Ψ⟩ 闭）。
  故形式在 ker/im 上良定义：改变代表元 Ψ → Ψ + Q_BΛ 不改变 ⟨Ψ, Ψ'⟩_rel。
gaps:
  - "第一步的 Q_B† = Q_B 中，三次鬼场项的伴随与正规序的重排在本 summary 中是叙述性的（「与原式同形」），未逐项写出。这是本推导现存最实在的缺口。"
  - "受限模条件是本项目补上的假设，Polchinski §4.3 未声明。"
  - "本推导不覆盖 k^+ = 0 / 零动量扇区（那里相对复形的结构不同），也不断言任何正定性。"
  - "(1) 中把 L_0 写成 α'p² + N^tot − 1 用的是固定动量扇区上的分解；在完整的含位置算符的 Fock 空间上这一步需要额外说明（本图无节点，同 worldsheet.open-string-l0-equals-level-plus-mass 的边界 (b)(c)）。"
