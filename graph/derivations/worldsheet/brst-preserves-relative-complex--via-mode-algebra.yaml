  - id: worldsheet.bc-ghost-hermitian-conjugation
    note: "提供 b_n† = b_{−n}、c_n† = c_{−n}、⟨↓|c_0|↓⟩ = 1、⟨↓|↓⟩ = 0 与 ⟨Ψ,Ψ'⟩_rel := ⟨Ψ|c_0|Ψ'⟩，是 (2)(3) 的前提。"
  - id: worldsheet.brst-nilpotent-at-c26
    note: |
      提供 c^m = 26 时 Q_B² = 0。**只用于 (1) 的最后一句**（H_rel 是上同调）；
