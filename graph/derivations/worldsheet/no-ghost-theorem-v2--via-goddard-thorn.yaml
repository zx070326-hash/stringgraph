summary: |
  第 (1) 条：在 D = 26、a = 1 且动量满足 k·k_0 ≠ 0 的扇区，DDF 算子 A^i_n（i = 2..25）
  与所有 L_m 对易，且满足横向振子代数 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}，
  故它们作用在基态上生成的态全部是物理态，且其 Gram 矩阵就是横向振子 Fock 空间的（正定）Gram 矩阵。
  再证任意物理态可写成 DDF 态加零模态，于是 ⟨ψ|ψ⟩ ≥ 0，且 H_phys/H_0 → H^⊥ 是保内积的双射
  （等距同构，保 L_0 分级）。
  第 (2) 条：D > 26、a = 1 时，在 DDF 态之外还需要纵向（Brower/DDF 纵向算子）方向，
  用它们显式构造出负模物理态。与此一致的独立核算：level-2 标量物理态的模正比于
  (D-1)[16a^2 + (2D-74)a + 84 - 3D]，在 a = 1 处为 (D-1)(26-D)，D > 26 时严格为负
  （ms.no-ghost-theorem 审计 B1 的精确计算）。
gaps:
  - "本推导只覆盖新陈述的两条：D = 26、a = 1 与 D > 26、a = 1。D ≤ 25、a ≤ 1 的无鬼性（通常归于 Brower 1972 / Thorn）不在本陈述内，需另建节点；旧陈述 worldsheet.no-ghost-theorem 把它写成\"D ≤ 26 且 a ≤ 1\"是错的（审计 B1：D = 26、3/8 < a < 1 时 level-2 已有负模）。"
  - "第 (2) 条对一般 a 的加强（\"D > 26 时对任意 a 均有负模态\"）未纳入陈述：goddard-thorn-1972 与 brower-1972 均无抽取记录，无法核实该加强的出处与条件（审计 B4）。本推导只支持 a = 1 的弱形式。"
  - "goddard-thorn-1972 的 \"Theorem 1\" 与 brower-1972 的 §II–III 均为未核实的定位；在 researcher 补齐前，本推导的可追溯性弱于 status: rigorous 通常要求的水平。"
  - "从物理文献到形式化的差距：需要把\"DDF 态张成 H_phys 模零模态\"这一步写成 Fock 空间上的线性代数命题（含 k·k_0 ≠ 0 扇区的显式处理）。抽取记录 E68 建议对照 BRST 版本（worldsheet.no-ghost-theorem-brst）的分级 + 三角矩阵论证，后者更接近可形式化的形式。"
  - "零动量 / k·k_0 = 0 扇区被陈述显式排除，本推导不覆盖。"
