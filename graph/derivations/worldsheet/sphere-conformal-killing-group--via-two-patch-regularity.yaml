summary: |
  三步初等计算。

  **(1) 全纯性 + z 片正则 ⇒ Taylor 级数。** 共形 Killing 方程在复坐标下即 ∂̄ δz = 0
  （加反全纯侧的 ∂ δz̄ = 0），故 δz 是 z 的全纯函数；在 z = 0 处正则给出
  δz = Σ_{n ≥ 0} a_n z^n，收敛半径至少覆盖 z 片的紧子集。

  **(2) 换片。** 向量场分量按 u = 1/z 变换：δu = (du/dz) δz = −z^{−2} δz = −u² Σ_n a_n u^{−n}
  = Σ_n a_n u^{2−n}。在 u = 0（即 z = ∞）处正则要求所有负幂次消失，即 2 − n ≥ 0，
  故 **a_n = 0 对一切 n > 2**，只剩 a₀, a₁, a₂。

  **(3) 指数化。** δz = a₀ + a₁z + a₂z² 分别生成平移、标度 + 旋转、特殊共形（inversion∘平移∘inversion）；
  三者生成的整体变换群是 Möbius 群 z ↦ (αz + β)/(γz + δ)（αδ − βγ = 1），
  由于 (α,β,γ,δ) 与其整体反号给出同一变换，群为 PSL(2,C)。实参数计数：3 复 = 6 实 = κ(S₂)。
gaps:
  - "**★ 2026-09-11 结案（curator-ckg-followups）：原第一条 gap「上游 ch5 节点尚未进入 main」已作废。**
     ch5 节点现已在 main，本推导已补上两条 depends_on：worldsheet.conformal-killing-equation
     （CKV 的定义与方程 (P₁δσ)_ab = 0，(5.2.7)）与 worldsheet.ckv-holomorphic-in-conformal-gauge
     （共形规范复坐标下该方程 ⟺ ∂̄δz = 0）。**残余项**：Riemann–Roch（E75, (5.2.9)）给出的
     κ − μ = 3χ = 6 仍只作为独立交叉检验，**本推导不建那条边**——理由是
     worldsheet.riemann-roch-kappa-minus-mu 正在被另一名 curator 换代为 -v2，
     且 μ(S₂) = 0 那一半在图上仍是断言（见
     worldsheet.positive-euler-number-no-moduli--via-surface-enumeration 的 gaps 第二条）。
     换代落地后由 lead 决定是否接边。"
  - "**第 (3) 步『指数化』未论证**：由三个无穷小生成元得到整体群 PSL(2,C)（而不只是其单位分支
     的李代数 sl(2,C)），需要 S₂ 上共形自同构群的整体分类，本推导与来源都没有做。
     严格说本推导只证明了 CKV 的**李代数**是 3 维复的，「有限群是 PSL(2,C)」是标准断言。"
  - "**「δz 在 S₂ 上处处正则」这一 CKV 定义与第 5 章的定义的关系（2026-09-11 更新）**：
     第 5 章的 CKV 是「diff×Weyl 下使度规不变的向量场」（worldsheet.conformal-killing-equation），
     与这里的「全局全纯向量场」在共形规范下的等价性**现已有节点承载**
     （worldsheet.ckv-holomorphic-in-conformal-gauge，已补为依赖）。
     **残余缺口**：该节点自陈只做了**局部**改写，「曲面用几片覆盖、过渡函数下 δz 按权 −1 的
     向量场变换」这个**整体**部分在它那里没有论证——而本推导第 (2) 步恰恰用的就是这个变换律
     （δu = −z^{−2}δz）。本推导的这一步取自 Polchinski §6.1 (6.1.4a) 附近，不是从该节点推出的。"
  - "**PSL(2,C) 记号的书内位置（2026-09-11 更新）**：原「未核实」的说法已作废——
     researcher 取到原书 ch.6 页图后确认，**PSL(2,C) 定义在书上 p.168，(6.1.6) 上方，无式号**
     （math-sources.md §39.6(c)，逐字见 worldsheet.disk-conformal-killing-group 的第一条 source）。
     **残余项**：本推导用的 (6.1.5a)/(6.1.5b) 两个式号仍只来自伴读者 [S]，**原书未核对**。"
  - "**本推导自身仍无数学侧文献来源**（2026-09-11 更新）：它等价于『P¹ 上全局全纯向量场 = sl(2,C)』，
     是标准复几何结果，但**这条两片 Laurent 计算本身**在本图里没有数学教材来源。
     按 docs/STATUS_LEVELS.md，rigorous 需要数学文献来源，或按『初等可复核』例外需 reviewer 复核
     并留 `reviewer-verified` 记录——**两者仍都没有**，故本推导保持 physical-argument。
     ⚠ 注意区分：目标陈述现已有**另一条**带数学来源的推导
     worldsheet.sphere-conformal-killing-group--via-automorphism-group（走 Miličić Thm 1.5.2），
     但那条覆盖的是**群**（Aut(P¹) = PSL(2,C)），它自己另有『群 ⇒ 向量场空间』的缺口。
     两条路线互补，都没有单独关掉整条陈述。"
