status: physical-argument
depends_on:
  - id: worldsheet.brst-current-bosonic-string
  - id: worldsheet.primary-field
    note: "提供权 h 主场的判据（T(z)O(w) 只有二阶与一阶极点），本命题的\"是否主场\"按此判据。"
  - id: worldsheet.tt-ope-central-charge
    note: "提供 T(z)T(w) OPE 中的 c/2·(z−w)^{−4} 项，是三阶极点系数正比于 c^tot 的来源。"
  - id: worldsheet.bc-ghost-central-charge
    note: "提供 c^g = −3(2λ−1)² + 1 = −26（λ = 2），把 c^tot = c^m + c^g 写成 c^m − 26。"
  - id: worldsheet.operator-product-expansion
    note: "本推导整体是 OPE 层面的计算。"
sources:
