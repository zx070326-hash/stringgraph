    loc: "§4.3，eq. (4.3.11)，p.133"
    note: 式号经 schrans-2020 目录核实；表达式未核实，原书未核对。抽取记录 polchinski-1998-v1.md#E64 备注。
summary: |
  把 T^tot(z) j_B(w) 的 OPE 逐项算出：

  1. **T^m 与 c T^m 的缩并**：T^m T^m 的 OPE 给 (c^m/2)(z−w)^{−4} 项，
     与 j_B 中 c(w) 相乘后贡献一个 (c^m/2) c(w)(z−w)^{−4}·(移到三阶极点的组合)；
     其余项组装成 j_B/(z−w)² + ∂j_B/(z−w) 的一部分。
  2. **T^g 与鬼场项的缩并**：同理给出正比于 c^g 的高阶极点，
     以及 j_B 的二阶/一阶极点的鬼场部分。
  3. **(3/2)∂²c 项**：它本身是权 −1 的场 c 的二阶导数，与 T^tot 的 OPE 给出固定的
     三阶极点贡献；(3/2) 这个系数正是选来把 1 与 2 中"不含中心荷"的那部分三阶极点抵消掉的。

  合并后所有非主场型奇异项归并成单一的三阶极点，其系数正比于 c^m + c^g = c^tot：
    T^tot(z) j_B(w) ∼ (c^tot/2) c(w)/(z−w)³ + j_B(w)/(z−w)² + ∂j_B(w)/(z−w)。
  由 worldsheet.primary-field 的判据，j_B 是权 1 主场 ⟺ 三阶极点消失 ⟺ c^tot = 0。
  再由 worldsheet.bc-ghost-central-charge 的 c^g = −26 得 c^m = 26；
  对 D 个平坦自由玻色子（worldsheet.free-boson-central-charge-d 的 c^m = D）即 D = 26。
gaps:
  - "按 lead 2026-09-10 的裁决：凡靠围道变形 + OPE 得到算子关系的推导一律 physical-argument。OPE 级数收敛与围道变形合法性在来源中未证明。"
  - "三阶极点的整体常数与 (3/2) 全导数项的系数绑定，而后者**未核对原书**（抽取记录 E62 的表达式栏）。本推导只论证\"额外奇异项正比于 c^tot\"这一结构性事实，不论证系数的具体数值。"
  - "第 1、2 步的缩并在本 summary 中是叙述性的，未逐项写出。schrans-2020 目录只给条目名 `The BRST Current as a Primary Field`，没有可引的中间步骤；本图未核对原书 (4.3.11)。"
  - "本推导不给出 Q_B² = 0 ⟺ c^m = 26（那是 worldsheet.critical-dimension-brst--via-nilpotency，走模式代数而非 OPE）。两条路线互相独立，本图不把它们互相依赖。"
