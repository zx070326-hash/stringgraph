depends_on:
  - id: worldsheet.string-s-matrix
    note: 提供 (5.3.9) 的被积表达式（模积分 + b 插入 + c 插入 + 顶点算子），本卡讲的是它的 BRST 变分。
  - id: worldsheet.b-insertion-brst-variation
    note: |
      提供 (5.4.6)：δ_B(b, ∂_{t^k}ĝ) = iε(T^m + T^g, ∂_{t^k}ĝ)——**「BRST 变分把 b 插入换成
      对模求导的生成元」正是「全导数」的来源**。那张卡的 notes 明说本命题当时未建节点。
  - id: worldsheet.vertex-operator-brst-variation
    note: |
      提供 (5.4.5)：δ_B V = iε∂(cV)，即顶点算子那一半的变分是世界面上的全导数、积分后为零。
      ⚠ 原书逐字「we leave it as an exercise to show that they have the BRST variation …」
