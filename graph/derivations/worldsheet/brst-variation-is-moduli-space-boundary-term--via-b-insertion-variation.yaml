summary: |
  (5.3.9) 的被积表达式里，BRST 变分作用在两类因子上：
  (a) 顶点算子：δ_B V = iε∂_a(c^a V)（(5.4.5)），是**世界面**上的全导数，积掉；
  (b) 每个模的 b 插入：δ_B(b,∂_{t^k}ĝ) = iε(T^m+T^g, ∂_{t^k}ĝ)（(5.4.6)），
      而 (T, ∂_{t^k}ĝ) 正是「对模 t^k 求导」的生成元，故它把被积函数变成
      **模空间上的全导数** ∂_{t^k}(…)^k。
  于是 ∫_F d^μt ∂_{t^k}(…)^k = ∮_{∂F}(…)，即振幅的 BRST 变分只剩模空间的边界项。
  原书随后说「in most cases there is no surface contribution, due to … the canceled propagator
  argument」，并承认该论证在某些情形不适用。
gaps:
  - "**(a) 那一半是习题**：原书逐字「we leave it as an exercise to show that」（(5.4.5)）。"
  - "**边界项是否为零没有一般论证**：原书靠 canceled propagator argument（一个解析延拓型论证）
     打发，并逐字承认「In certain circumstances this argument does not apply」。
     本图**没有**该论证的节点，故 (2)「负模态解耦」在本图里是**有条件的**。"
  - "**「(T, ∂_{t^k}ĝ) = 对模求导的生成元」这一步在本图没有独立节点**：它是把能动张量与度规的模导数
     配对解释成 ∂_{t^k} 作用在路径积分上，属路径积分层面的形式操作。"
  - "**路径积分测度未定义**（继承自 worldsheet.string-s-matrix）；测度的 BRST 不变性（无 BRST 反常）
     是额外假设，见 worldsheet.brst-gauge-choice-independence 的 statement。"
