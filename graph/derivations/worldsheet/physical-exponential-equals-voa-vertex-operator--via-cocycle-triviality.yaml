      VOA 侧算子 𝒴(e^{n k_0}, z) 的定义来源：(3.9) V_(𝔥,L) := ℂ_ε[L] ⊗ M(1)、
      (3.10) Y(e^α ⊗ u, x) 的显式公式，以及 ε 的三条条件 (3.6)–(3.8)。
      该卡正文逐字记「某些特例下 ε 可取为常值 1（例如 ⟨·,·⟩|_L ≡ 0 时），
      但那是特例的性质，不是本命题的内容」——本推导断言 (1) 正是那个特例，
      故这条边承载「ε ≡ 1 合法」这一半，**不**承载「物理 :e: = 𝒴(e)」那一半。
  - id: worldsheet.exponential-vertex-operator-modes
    inferred: false
    note: |
      物理侧算子 :e^{i n k_0·X(z)}: 的振子部分的定义（E₋E₊ 拆分，z^K-系数约定，
      Lean `Fock.vertexOsc`）。本推导断言 (2) 的左端由这张卡 + 零模移位给出。
      ⚠ 该卡边界 (e) **逐字排除**本卡的内容：「不断言本卡的 V 与文献围道写法下的
      顶点算子是同一个对象」，并点名这属于 ddf-contour-equals-mode-sum 所处理的同一类问题。
  - id: worldsheet.momentum-tower-fock-space
    inferred: false
    note: |
      物理侧的零模那一半：塔上的移位算子 e^{i n k_0·x}（该卡 (1) 的 S_n），
      与 VOA 侧 𝒴(e^{nk}, z) 的零模给出的移位 j ↦ j + n 相对应
      （free-boson 塔卡 (3)(iii) 逐字指出这两个移位是同一个）。
sources:
