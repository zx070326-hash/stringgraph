    loc: "§3.1 'DDF vertex operators', 刊 p.593, eq. (3.1)（ε(mk, nk) = 1）"
    note: |
      **断言 (1) 的逐字来源。L1↩（gsw-1987-v1.md §4 E15 标「[L1 已核实]」；
      本轮未重开刊 p.593 页图复核）。**
