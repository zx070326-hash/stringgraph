    loc: "(3.6)–(3.8)（ε 的三条条件）, p.12；(3.9)/(3.10), p.12"
    note: |
      **ε ≡ 1 合法性的判据来源。L1↩（math-sources.md §36.3）。**
      本推导只需验证常值 1 满足 (3.6)(3.7)(3.8)，其中 (3.8) 的右端
