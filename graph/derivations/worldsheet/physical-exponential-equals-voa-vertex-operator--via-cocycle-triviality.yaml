    inferred: false
    note: |
      提供 VOA 侧的全部结构：V_(𝔥, Z k) = ℂ_ε[Z k] ⊗ M(1) 是顶点代数，
      动量塔 ⊕_j F(p + j k_0) 是它的（不可约）模（Li–Wang Theorem 3.6 / Def 3.5）。
      **该卡 (1) 已逐字做出本推导断言 (1) 的计算**：⟨jk, j'k⟩ = j j' · 2α' k_0² = 0，
      故 ε ≡ 1 满足 (3.6)–(3.8)，ℂ_ε[L] = ℂ[L]。
      ⚠ 该卡边界 (N6) **逐字排除**本卡的断言 (2)，故它只承载前置，不承载结论。
  - id: math.lattice-vertex-algebra
    inferred: false
