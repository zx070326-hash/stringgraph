id: worldsheet.ddf-spans-physical-states-level-five--via-lean
target: worldsheet.ddf-spans-physical-states-level-five
kind: proof
status: formalized
depends_on:
  - id: worldsheet.ddf-light-cone-frame
    inferred: false
    note: |
      标架对象 `F : DDFLightConeFrame η a b` 是本卡三条主定理
      （`b26_five_of_D26`、`ddfSpans_bigrade_neg_five_five`，以及 h9 引用的
      `le_finrank_towerNull_inf_towerBigrade_five`）的共同参数；证明体使用
      `F.hη`、`F.trans`、`F.hba`、`F.frame.isotropic`，以及**关键的**
      `F.dotVec_self_eq_two hD`（给出 a₀ = 1，第 839 行 `haa`）。与 level-four 不同的是
      这里 `dotVec_self_eq_two` 只需 `hD : 2 ≤ D`（level-four 用 3 ≤ D）。
  - id: worldsheet.physical-slice-bounded-by-transverse-count
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl**：`finrank_towerPhys_inf_towerBigrade_le` 作为
      `b26_five_of_D26` 的 `h1`（`finrank_towerPhys_inf_towerBigrade_le (K:=K) hD F 5`），
      给出 dim(H_phys ⊓ V_5) ≤ p_{D−1}(5)，对一切 D、一切 N 成立（该卡断言本身）。
  - id: worldsheet.quasi-physical-slice-dimension
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl 两次**：`le_finrank_towerSeed` 作为 `b26_five_of_D26`
      的 `h7`（`le_finrank_towerSeed (K:=K) hD F (-((5:ℕ):ℤ)) 4`，level-4 实例，给
