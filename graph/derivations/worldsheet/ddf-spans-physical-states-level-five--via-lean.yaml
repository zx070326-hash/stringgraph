      dim Q_{−5,3} ≥ p_{D−1}(3)）。与 level-four derivation 同型：Type-1、Type-2 两半都经
      这条同一引理，故本推导挂两次同一条边（此处一次性说明两次调用）。
  - id: math.level-five-partition-difference
    inferred: false
    note: |
      **逐字调用其 formal.lean_decl**：`levelFive_count_identity (D:=D) hD` 作为
      `b26_five_of_D26` 的 `h3`，给出 p_{D−1}(5) + 1 = p_{D−2}(5) + p_{D−1}(4) + p_{D−1}(3)。
      **与 level-four 的 h3 的结构差别**：左端多一个 +1（Euler 五边形数 κ₅=1），这个 +1
      在最终 `omega` 里与 h9 内的 +1（两族重叠）相消。
  - id: worldsheet.transverse-ddf-fock-gram-matrix
    inferred: false
    note: |
      **精确 decl 非该卡 formal.lean_decl**：本推导调用的是 `finrank_ddfSpan_inf_towerBigrade`
      （`SliceDim.lean`，`b26_five_of_D26` 结尾 `rw [finrank_ddfSpan_inf_towerBigrade
      F.hη F.frame.isotropic F.hba F.trans 5]`），不是该卡 formal.lean_decl
      `ddf_gram_diagonal`。与 worldsheet.ddf-spans-physical-states-level-two/-three/-four
      --via-lean 同一记法，给 dim D_5 = p_{D−2}(5)。
  - id: worldsheet.level-five-null-family-kernel-bound
    inferred: false
    note: |
      **h9 的核心新输入，逐字调用其种子版 decl**：`b26_five_of_D26` 的 `h9`（内联证明块）
      字面等于 `le_finrank_towerNull_inf_towerBigrade_five hD F haa hD26`（同文件 section
      KernelFive），其证明体对 seedPair 用秩-零化度，核维数由
      `finrank_ker_seedPair_five_le_one`（该依赖目标卡的 formal.lean_decl 的种子版推论，
      即 dim ker T₅ ≤ 1）控制——这正是本片区别于 N=4 的地方：N=4 那里对应映射**单射**
      （worldsheet.level-four-null-family-transversal，ker=0），N=5 这里核可以**一维**
      （ker≤1），多出的 +1 与 h3 的 +1 相消。故本卡改挂此边（而非 N=4 的横截性卡）。
  - id: worldsheet.level-two-null-state-requires-d26
    inferred: false
    note: |
      **精确 decl 非该卡 formal.lean_decl，经由一般化引理**：h9 内部（
      `le_finrank_towerNull_inf_towerBigrade_five` 的 `hmem` 证明块，第 788 行）的 Type-2 半
      调用本文件的 `descTwo_mem_towerNullSubmodule_of_mem_towerBigrade`，其证明体直接调用
      `descTwo_mem_towerNullSubmodule`（NullSeedsTwo.lean 的一般充分性引理：`hD26 : (D:R)=26`
      + `L₀y=−y` ⟹ `𝒟₂y ∈ towerNullSubmodule`）——这条引理正是该卡 sources.loc 已登记的
      "descTwo_mem_towerNullSubmodule"（该卡的铺垫链之一，非其 headline
      `descTwo_mem_towerPhysSubmodule_iff`）。**这是本推导唯一让 (D:K)=26 进入的边**。
      与 worldsheet.ddf-spans-physical-states-level-three/-four--via-lean 挂同一条边，理由
      相同（各片共用同一条 D=26 入口）。
