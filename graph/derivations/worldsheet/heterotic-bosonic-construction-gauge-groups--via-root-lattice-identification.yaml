depends_on:
  - id: compact.heterotic-narain-lattice-even-self-dual
    note: 供给「内部格必须偶自对偶」这一条件（d = 10 时为 16 维欧氏）。
  - id: math.even-self-dual-euclidean-lattices-dimension-16
    note: |
      供给「16 维只有 Γ_16 与 Γ_8 ⊕ Γ_8 两种」这一分类。
      ⚠ 这条在本图只有 Polchinski 的一句断言支撑（无数学来源），是本推导的主要瓶颈。
  - id: worldsheet.heterotic-so32-massless-spectrum
    note: |
      供给费米子构造下 SO(32) 情形的规范玻色子内容（496 = 伴随），用于第 (3) 步的「同一对群」比对。
  - id: worldsheet.heterotic-e8e8-construction
    note: |
      供给费米子构造下 E₈ × E₈ 情形的规范玻色子内容（120 + 128 = 248），同上。
sources:
