id: worldsheet.heterotic-bosonic-construction-gauge-groups--via-root-lattice-identification
target: worldsheet.heterotic-bosonic-construction-gauge-groups
kind: physical-argument
status: physical-argument
depends_on:
  - id: compact.heterotic-narain-lattice-even-self-dual
    note: 供给「内部格必须偶自对偶」这一条件（d = 10 时为 16 维欧氏）。
  - id: math.even-unimodular-rank-16-classification
    inferred: true
    note: |
      供给「16 维偶幺模格恰有两类：`D_16^+` 与 `E_8 ⊕ E_8`，且两者不同构」
      （Chenevier–Lannes Corollaire 3.6，rigorous）。
      **inferred 的理由**：Polchinski §11.6 对这条数学定理**不证、不引任何文献**
      （逐字只有 'for dimension 16 there are exactly two such lattices'），
      在本推导的 sources.loc 处**找不到**它的论证；这条边是本项目接上去的
      （math-sources.md §47.6(a)）。
  - id: math.even-self-dual-euclidean-lattices-dimension-16-v2
    inferred: true
    note: |
      供给记号字典：Polchinski 的 `Γ_16` = `D_16^+`、`Γ_8` = `E_8`，从而上一条边的两个同构类
      就是原书写的 `Γ_16` 与 `Γ_8 × Γ_8`。
      **inferred 的理由**：没有任何一处文献把 Polchinski 的坐标记号与数学侧的 `D_16^+` 连起来，
      该等同是本项目做的坐标比对（math-sources.md §47.5 明确要求标 inferred）。
      ⚠ 该卡本身是 physical-argument（比对未经 reviewer 复核），故它现在是这条支链的瓶颈之一。
  - id: worldsheet.heterotic-so32-massless-spectrum
    note: |
      供给费米子构造下 SO(32) 情形的规范玻色子内容（496 = 伴随），用于第 (3) 步的「同一对群」比对。
  - id: worldsheet.heterotic-e8e8-construction
    note: |
      供给费米子构造下 E₈ × E₈ 情形的规范玻色子内容（120 + 128 = 248），同上。
  - id: math.compact-lie-algebra-index-and-casimir
    inferred: false
    note: |
      原书 §11.6 p. 75 **明写**回指 §11.4：'the points of length-squared two are just the SO(32) roots (11.4.16)' /
      'the E₈ roots (11.4.21)'，故第 (2) 步对 §11.4 的依赖是原书自己给出的，非本图推断。
      ⚠ 但该卡**只**覆盖 §11.4 前段 (11.4.1)–(11.4.7)（李代数、不变内积、指标、Casimir），
      被引用的 (11.4.16)/(11.4.21) 根系本身在 pp. 61–65 跳读区、内容未核实、**不在该卡上**
      （该卡「不断言」(3)）。这条边把依赖落到原书指定的节，但没有闭合根系缺口——见 gaps 第 1 条。
      边由本图补（2026-09-11，curator-polchinski-v2-ch11-current）。
sources:
  - ref: polchinski-1998-v2
    loc: "§11.6, pp. 74–75（逐字见目标卡 sources）"
    note: |
      L1（抽取记录 polchinski-1998-v2.md E63）。
      ⚠ 被引用的 (11.4.16)、(11.4.21) 内容未核实（pp. 61–65 跳读）。
summary: |
  d = 10 时内部格是 16 维偶自对偶欧氏格，只有 Γ_16 与 Γ_8 ⊕ Γ_8 两种。
  左移零点能 −1 ⇒ 无质量态由一个单位激发给出，其中顶点算子型的是 l_L² = 2 的格点。
  原书说这些点恰是 SO(32) 的根（Γ_16）或两份 E₈ 的根（Γ_8 ⊕ Γ_8），
  故两个格给出的规范群与 §11.2 费米子构造得到的**同一对**：SO(32) 与 E₈ × E₈。
  两种构造经玻色化等价（原书：'It is easy to see'）。
gaps:
  - "**「l_L² = 2 的格点恰是根系」这一步依赖 (11.4.16)/(11.4.21)，而这两式的内容本轮未核实**（原书 pp. 61–65 跳读，抽取者只见到对它们的引用）。要坐实必须补读那五页页图。"
  - "**李代数根系与规范群的对应在本图只有半张卡**：2026-09-11 起 §11.4 前段（(11.4.1)–(11.4.7)）入图为 math.compact-lie-algebra-index-and-casimir 并按原书回指接入；但根系、Cartan–Weyl 基、伴随表示维数（(11.4.12)–(11.4.21)）仍无节点。"
  - "**'It is easy to see that the earlier fermionic construction and the present bosonic one are equivalent under bosonization.' 是全部论证**：原书不验证两种构造的等价性；本图无玻色化节点。"
  - "**（2026-09-11 已部分解决）分类那条边的上游原先只有教科书断言**；现已改指 math.even-unimodular-rank-16-classification（Chenevier–Lannes Corollaire 3.6，rigorous）与记号桥 math.even-self-dual-euclidean-lattices-dimension-16-v2。⚠ **但本推导整体仍是 physical-argument**：瓶颈已从「数学定理没有来源」转移到 (i) 记号桥未经复核（v2 卡，physical-argument）、(ii) 上游 compact.heterotic-narain-lattice-even-self-dual 那条「一致 CFT ⟺ 偶自对偶格」的物理桥、(iii) 下面几条 (11.4.16)/(11.4.21) 与玻色化的缺口。"
  - "**「同一对群」的比对是本图做的核对**：原书说 'the same two gauge groups … found earlier'，但不逐项对照 496 与 248 的表示内容。"
