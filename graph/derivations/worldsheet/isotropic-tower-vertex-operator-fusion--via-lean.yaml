summary: |
  机器检查的证明。主定理本体三步，全部力气已由被依赖的单 Fock 卡出完。

  **第一步：动量算术（`dotVec_vertexMomentum` + `vertexMomentum_add`）。**
  塔上第 n 个顶点算子的动量是 `vertexMomentum b n = n·b`（逐分量 (n : R) * b μ），故
    (m k_0)·(n k_0) = (m n)(k_0·k_0)，  m k_0 + n k_0 = (m+n) k_0。
  代入 `hbb : dotVec η b b = 0` 得 `hdot : dotVec η (n·b) (m·b) = 0`。
  ⇒ 这一步是把"类光性"翻译成"正交性"的全部内容（`funext` + `push_cast` + `ring`）。

  **第二步：单层版（`sum_towerVertex_towerVertex_single_of_isotropic`）。**
  在 `Finsupp.single j P` 上，两次 `towerVertex_single` 把被求和项写成
    single (j + n + m) ( V^{(m k_0)}_{L−m−n−(K−n)} ( V^{(n k_0)}_{K−n} P ) )。
  层标签与 K 无关，故可用 `Finsupp.single_finsetSum` 把 single 提到外面；
  内层求和经 `Finset.sum_image`（K ↦ K − n，单射）重标后正好是单 Fock 卡的有限和形式，
  以窗口 `hs (K + n)` 调用，得 V^{(m k_0 + n k_0)}_{L−m−n} P。
  最后 `vertexMomentum_add`、`towerVertex_single`，加两条指标恒等式
  `j + n + m = j + (m+n)`、`L − m − n = L − (m+n)`（都是 `by ring`）收尾。

  **第三步：任意塔矢量（`sum_towerVertex_towerVertex_of_isotropic`）。**
  x = Σ_{j ∈ x.support} single j (x j)（`sum_single_eq`），两个求和交换（`Finset.sum_comm`），
  逐层用第二步，窗口由 `Finset.le_sup` 给出的
  levelBound (x j) ≤ towerLevelBound x 放大（`omega`）。

  **目标断言 (1)（界与内层指标一致）** 是姊妹文件的
  `towerVertex_towerVertex_apply_eq_zero_of_lt`：同样逐层化归，内层调用
  `Fock.vertexOsc_vertexOsc_apply_eq_zero_of_gt`（即单 Fock 卡断言 (1) 的上端），
  注意它**对内层洛朗指标 B 完全自由**——这正是单 Fock 卡"上端界与 K 无关"那条的塔上继承。

  **假设核对**：除窗口假设外全程只有 `hbb : dotVec η b b = 0`。**没有** `hη : η_μ² = 1`，
  **没有** DDF 归一化 `dotVec η b a = 1`，没有 m, n, L 的限制，没有 b ≠ 0。
gaps:
  - |
    (i) **「k_0² ≠ 0 时融合公式为假」未被证明**。目标【不断言】(a)：那只是
    `sum_towerVertex_towerVertex_single_of_isotropic` 的 docstring（逐字引在目标 sources 的
    note 里），**不是定理**；Lean 侧没有定义单值因子 (w/z)^{mn k_0²} 所需的形式级数。
    ⇒ 「类光性第三处承重」这句话的地位是 **formalizer 的断言 + 一条可核对的机制说明**
    （正交性确实在局部有限性与真空值两处被用掉），不是机器检查的否定结论。
  - |
    (ii) **零模只是层移位，没有真正的 Heisenberg 零模**。目标【不断言】(e)：
    x^μ 只以 e^{i n k_0·x}（`towerShift`）的形式出现，[x^μ, p^ν] 未形式化；
    塔建在**固定的** p 与 k_0 上，不是全动量空间；没有余循环/Klein 因子。
    ⇒ 本推导**不**支持"一般动量格上的顶点算子融合"（那属于 math.lattice-vertex-algebra）。
  - |
    (iii) **`towerVertex` 在图上没有自己的定义卡**，本推导对 worldsheet.ddf-operators-v6
    的那条边因此标 inferred。已第三次提请 lead 补定义卡。
  - |
    (iv) **本推导不支持 worldsheet.ddf-transverse-oscillator-algebra-v2 的任何部分**，
    只是其 (5a) 块。(5b) 见 worldsheet.tower-vertex-weighted-mode-sum；把 (5)(5a)(5b)
    接到 A^ε_n 上的**双重局部有限和 Leibniz 组装**仍未做
    （formal/TODO.md `ddf-operators` 的「[A,A] 的整条链」段，formalizer-ddf-algebra 进行中）。
  - |
    (v) **一般交换 ℚ-代数，无实结构、无幺正性、无解析结构**；η_μ 是 R 中任意一族元素。
