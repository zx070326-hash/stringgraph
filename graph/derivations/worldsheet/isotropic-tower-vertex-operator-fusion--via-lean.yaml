  【本推导的"短"是有意义的信号，与姊妹对完全平行】
  三步里两步是记账（Finsupp 逐层、指标重标与层标签加法），真正的数学全在
  worldsheet.same-point-product-of-orthogonal-momentum-vertex-operators 里。
  这与 worldsheet.isotropic-tower-vertex-operators-commute--via-lean 的 notes 说的同一件事：
  **把"正交动量无缩并"与"塔上动量都与 k_0 成比例"分开之后，
  类光性的作用就只剩一行算术 (m k_0)·(n k_0) = mn k_0²**。
