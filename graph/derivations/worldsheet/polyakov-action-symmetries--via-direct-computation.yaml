sources:
  - ref: polchinski-1998-v1
    loc: "§1.2, p.13：Poincaré 不变性 **(1.2.19)**、diff 不变性 **(1.2.20)**（Weyl 不变性是 **(1.2.21)**，属另一节点）"
    note: |
      抽取记录 polchinski-1998-v1#E7。
      **【订正 2026-09-11（curator-v1-sec13，L1 页图逐字）】** 三条对称性在原书里各有独立式号：
      **(1.2.19) Poincaré / (1.2.20) diff / (1.2.21) Weyl**，均在 p.13。
      本推导只证前两条，故 loc 收窄到 (1.2.19)–(1.2.20)；「约」与「公式号未核对原书」撤销。
      ⚠ 旧 note 说「对称性的内容本身（尤其 **Weyl 变换写法**）由 Headrick 习题 1.3 确认」——
      **Weyl 不属于本推导**，那句支撑属于 worldsheet.polyakov-weyl-invariance--via-direct-computation。
summary: |
  (i) Poincaré：被积式中 X^μ 只以 ∂_a X^μ ∂_b X^ν η_{μν} 出现；Λ ∈ O(1,D-1) 保持 η_{μν}，
  常数平移 b^μ 被导数杀掉，故被积式逐点不变。
  (ii) diff：X^μ 是世界面标量，γ_{ab} 按 (0,2) 张量变换，因此 γ^{ab}∂_a X·∂_b X 是标量，
  (-γ)^{1/2} d^2σ 是标量密度乘测度，二者之积在坐标变换下不变；对整个积分区域用变量替换公式即得。
gaps:
  - "微分同胚不变性此处按坐标变换的形式计算给出（局部、光滑、保定向）；不含大微分同胚/模空间的讨论，也不含边界项的处理（开弦边界见 worldsheet.open-string-neumann-boundary-condition）。"
  - "Polchinski 的原文措辞未核实（正文未获取，见抽取记录 §0）；本条标 rigorous 的依据是该计算本身是初等张量分析，可独立复核，不依赖文献的严格性声明。"
notes: |
