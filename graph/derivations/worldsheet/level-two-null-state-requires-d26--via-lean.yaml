summary: |
  **第 1 步（TowerVirasoro.lean）**：把单 Fock 空间上的 Virasoro 括号关系 `Fock.lie_Lop_Lop`
  （`worldsheet.free-boson-central-charge-d` 的 formal.lean_decl，中心荷 c = D）经
  `Finsupp.lhom_ext` 逐纤维提升到塔 `TowerFock D R = ℤ →₀ Fock D R` 上，得
  `lie_towerLop_towerLop`：⁅L_m,L_n⁆ = (m−n)L_{m+n} + D·centralTerm(m)·δ_{m+n,0}·id，
  中心荷与 rung 无关（动量只进 L_0 的本征值）。

  **第 2 步（NullSeedsTwo.lean，六个"原子"引理）**：把 `lie_towerLop_towerLop`
  在 φ 满足 hpos（正模湮灭）与 h0（L_0 本征值）的假设下逐个具体 (m,n) 求值，得
  `towerLop_{zero,one,two}_apply_towerLop_neg_{one,two}` 六条算子等式（本卡陈述 (1)
  的代数骨架，对应 §B″.2 那张 2×2 Gram 表的六个条目，但写成算子等式而非内积）。

  **第 3 步（陈述 (1) 的两条验证方程）**：把这六条原子组合，先证一般 h 版本
  `towerLop_one_apply_descTwo`（系数 12(h+1)）与
  `towerLop_two_apply_descTwo_of_eigenvalue`（系数 26h+D，用到
  `two_mul_centralTerm_two_eq_one : 2·centralTerm R 2 = 1`），
  再代入 h = −1（`towerLop_two_apply_descTwo`，系数退化为 D−26；
  `towerLop_one_apply_descTwo` 在 h=−1 处系数为 12·0=0，是本卡陈述 (1) 第一句的直接读出）。

  **第 4 步（陈述 (2)，充分性）**：`descTwo_mem_towerPhysSubmodule`
  在 `hD26 : (D:R)=26` 与 `h0` 下逐条核对 L₀/L₁/L₂/L_{n≥3} 四款物理态条件
  （L₀ ← `towerLop_zero_apply_descTwo`，无条件；L₁ ← 第 3 步，h=−1 使之为零；
  L₂ ← 第 3 步 + hD26 使 D−26=0；L_{n≥3} ← `towerLop_apply_descTwo_of_three_le`，
  由分级无条件成立），得 `descTwo η a b φ ∈ towerPhysSubmodule η a b (1:R)`。
  再用 `descTwo_mem_towerSpuriousSubmodule`（𝒟₂φ 按构造属于 H_spur，
  无条件于 D）与 `worldsheet.tower-physical-quotient-form` 断言 (2)
  （`towerSpurious_inf_towerPhys_le_towerNull`）取交，得
  `descTwo_mem_towerNullSubmodule : descTwo η a b φ ∈ towerNullSubmodule η a b (1:R)`。

  **第 5 步（陈述 (3)，必要性）**：在 `[NoZeroDivisors R]` 与 `hφ : φ ≠ 0` 下，
  `towerLop_two_apply_descTwo_eq_zero_iff` 把第 3 步的等式 `L₂𝒟₂φ = (D−26)•φ`
  改写成 `L₂𝒟₂φ = 0 ↔ (D:R) = 26`（`smul_eq_zero` 排除 φ=0 分支）；
  `descTwo_mem_towerPhysSubmodule_iff`（本卡陈述 statement 的 `formal.lean_decl`）
  把它与 `mem_towerPhysSubmodule` 的 L₂ 分量拼接成
  `descTwo η a b φ ∈ towerPhysSubmodule η a b (1:R) ↔ (D:R) = 26`。
gaps:
  - |
    **不构造 φ 的存在性或非零性**。本推导的一切结论都是「若存在满足假设的 φ」的条件式；
    满足假设且非零的具体 φ（例如层真空 `Finsupp.single (-2) (1 : Fock D R)`）由
    NullSeedsTwo.lean 的 `Slices` 节给出对象层面的实例
    （`descTwo_single_mem_towerNullSubmodule`），但「该向量非零」**未在 Lean 内证明**
    ——文件头 Gap 2 逐字：Gram 判据在 c=26,h=−1 处恰好空转（`kacDet2 26 (−1)=0`），
    需要 `MvPolynomial` 系数论证（`X_{(μ,2)}` 系数是 `5η_μp^μ`），未做。
    本推导（乃至目标卡）都不依赖这一步，但下游若要用本卡论证"确实存在非平凡零态"
    则必须显式引用这条缺口。
  - |
    **不覆盖 N ≠ 2**。目标卡陈述只做 𝒟₂ = 2L₋₂+3L₋₁²（level-2）这一个算子；
    一般 N 的类似机制（Type 2 族）是 worldsheet.ocq-null-state-two-families
    的内容，status physical-argument（手算），本推导与之互相独立，不构成加强关系
    （该卡仍需单独的形式化才能升级）。
  - |
    **接口边 worldsheet.ddf-operators-preserve-physical-states 只提供对象，不提供论证**
    （见上面该边的 note）。若该卡未来被换代或删除，读者应改为直接指向
    `formal/StringFormal/NoGhost/TowerPhysical.lean` 的 `towerPhysSubmodule` 定义，
    而不是该卡自己的命题内容。
  - |
    **一般交换 ℚ-代数，无实结构**。本推导全程不涉及内积正定性、幺正性；
    `R` 上无序，"负模态"等物理直觉不适用于本推导本身。
