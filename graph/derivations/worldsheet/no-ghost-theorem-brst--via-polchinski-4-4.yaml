  - ref: polchinski-1998-v1
    loc: "§4.3：Q_B、b_n、c_n 的模式代数与鬼数（依赖 worldsheet.brst-quantization 的定义在此处给出）"
summary: |
  Polchinski §4.4 的论证（E68 的六步）：
  1. 引入光锥振子组合 α^±_m（需要 k^+ ≠ 0），其对易关系见 (4.4.7)；
  2. 按 "light-cone number"（计 α^+ 与鬼场 c 的激发数减去 α^- 与 b 的）给算符分次，
     把 Q_B 分解为 Q_B = Q_1 + Q_0 + Q_{-1}（(4.4.10)），其中 Q_1 是次数最高的部分，Q_1^2 = 0（(4.4.13)）；
  3. 构造 R 使 S = {Q_1, R} 是数算符，S 同时计鬼场激发与纵向（光锥）振子激发，且 [Q_1, S] = 0；
  4. S ≠ 0 的态必是 Q_1-恰当的（标准的"四重态机制"/Hodge 型论证），故 coh(Q_1) = ker S
     = 横向振子激发张成的空间 H^⊥；
  5. U = {Q_B, R} - S 严格降低 light-cone number（下三角），由此推出 ker(S+U) ≅ ker S，
     进而 coh(Q_B) ≅ coh(Q_1) = H^⊥（(4.4.19) 给出上同调态的形式）；
  6. H^⊥ 上诱导的内积正定：⟨ψ|ψ'⟩ = ⟨ψ_0|ψ'_0⟩，因为交叉项的 light-cone number 不为零，
     而 ψ_0 落在横向 Fock 空间里，横向振子代数的内积正定。
  鬼数集中性（陈述的第 (1) 条）来自第 4 步：ker S 中的态只含横向激发与 |↓⟩，鬼数固定。

  标 physical-argument 而非 rigorous 的理由：这是 Fock 空间上的形式代数操作，
  滤子/分级论证在无穷维空间上的收敛性与完备化问题未处理（E68 的自评：
  "这是 Polchinski 全书中最接近数学证明的一段，但仍未处理收敛/完备化"）。
  严格版本见 worldsheet.no-ghost-theorem-brst--via-fgz。
gaps:
  - "滤子论证（Q_B = Q_1 + Q_0 + Q_{-1}，S = {Q_1, R}，下三角性）在无穷维分级空间上的收敛性未论证；把\"下三角\"推到\"ker(S+U) ≅ ker S\"需要每个分级片有限维或谱序列在有限步退化，Polchinski 未声明该假设。
     **【2026-09-11 原书逐字定位，作者自承】** 这一步在原书 p.140 逐字是：「Now, U = {Q_0+Q_{−1}, R}
     lowers N^lc by one or two units. In terms of N^lc, S is diagonal and U is lower triangular.
     **By general properties of lower triangular matrices**, the kernel of S + U can be no larger than
     that of its diagonal part S. In fact they are isomorphic… **The factors of S^{−1} make sense
     because they always act on states of N^lc < 0, where S is invertible.**」
     即原书把这一步交给「下三角矩阵的一般性质」，并只用最后那句话为 (4.4.19) 的级数
     |ψ⟩ = (1 − S^{−1}U + S^{−1}US^{−1}U − …)|ψ_0⟩ 辩护。
     **这是整条无鬼定理链上最该形式化的一步**（抽取记录 §12.10 表 C 第 9 项即此条）：
     需要的是「N^lc 分级的每片上 S 可逆且级数在有限步终止」这类论断，原书没有陈述也没有证明。"
  - "受限模条件（见 worldsheet.brst-quantization）在 §4.4 未被提及，本推导默认它成立。"
  - "k^+ = 0 与 k = 0 的动量扇区未覆盖：光锥振子组合的定义在那里退化。陈述已把它们排除。
     **【2026-09-11】** 原书 p.139 逐字「**We choose a Lorentz frame in which the momentum component
     k⁺ is nonzero.**」——即 k⁺ ≠ 0 是原书**显式声明的假设**，不是本图补的限定。
     (4.4.13)/(4.4.14) 里 Q_1 与 R 的定义式都含 k⁺ 或 1/k⁺ 因子。"
  - "相对复形上内积的鬼场零模归一化（⟨↓|c_0|↓⟩ = 1）未与 Polchinski 的内积逐字核对。
     **【2026-09-11 这条缺口的实质已查明】** 原书 §4.4 用的**不是** (4.3.18a) 那个内积，而是
     p.135 明说的**约化内积** ⟨ ‖ ⟩：「Therefore we use in `Ĥ` a **reduced inner product** ⟨ ‖ ⟩
     in which we simply **ignore the X⁰ and ghost zero modes**.」(4.4.20) 的正定性断言
     ⟨ψ‖ψ'⟩ = ⟨ψ_0‖ψ_0'⟩ 就是在这个约化内积上作出的。
     → 本推导目标节点用 ⟨ψ|c_0|ψ'⟩ 处理鬼场零模，与原书的「直接忽略零模」**不是同一个构造**；
     两者是否给出同一个诱导内积，本图未验证。形式化时必须先定死用哪一个。"
  - "**§4.4 证的是比本推导目标更强的定理，本推导只用了它的特例。** 原书 p.137 逐字设定是
     「d free X^μ fields including μ = 0, plus some **compact unitary CFT K** of central charge 26 − d,
     plus the ghosts」，四条假设为：(i) K 紧致（L^K_0 谱离散）；(ii) K 内积正定；
     (iii) 总中心荷使 Q_B 幂零；(iv) k⁺ ≠ 0。目标节点 worldsheet.no-ghost-theorem-brst 取 K 平凡、
     d = 26，(i)(ii) 自动满足。**一般形式在本图没有节点**（缺「紧致幺正 CFT」的定义卡），
     已列入报告交 lead。"
  - "本推导不建立 BRST 上同调与旧协变物理态空间 H_phys/H_0 的等价（Kato–Ogawa 定理）；后者现已单独建节点 worldsheet.brst-cohomology-equals-ocq-physical（FGZ 1986 Theorem 2.8 第一个同构）。worldsheet.no-ghost-theorem-v2 与本陈述仍是两条独立命题。
     **【2026-09-11】** 原书自己把这条等价放在 (4.4.21) H_OCQ = H_BRST = H_light-cone 里一并证明
     （(4.4.22)–(4.4.27) 是 OCQ 侧的良定义性、单射、满射三步），
     即原书**不**把它当成独立定理。本图拆成两个节点是本项目的选择，与原书的组织方式不同。"
