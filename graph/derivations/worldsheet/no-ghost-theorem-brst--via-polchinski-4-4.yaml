sources:
  - ref: polchinski-1998-v1
    loc: "§4.4（pp.137–142）：(4.4.1) L_m = L^X_m + L^K_m + L^g_m；(4.4.6)/(4.4.7) 光锥振子组合与其对易关系；(4.4.8) N^lc；**(4.4.9)** Q_B = Q_1 + Q_0 + Q_{−1}；(4.4.10) [N^lc, Q_j] = jQ_j；(4.4.11) [N^g, Q_j] = Q_j；**(4.4.12)** 分级展开 ⇒ Q_1² = 0；(4.4.13) Q_1 的显式式；(4.4.14) R；(4.4.15) S = {Q_1,R}；(4.4.16)/(4.4.17)；(4.4.18) S + U ≡ {Q_B,R}；(4.4.19) 上同调态的形式；**(4.4.20)** ⟨ψ‖ψ'⟩ = ⟨ψ_0‖ψ_0'⟩（正定性）；(4.4.21) H_OCQ = H_BRST = H_light-cone；(4.4.22)–(4.4.27) OCQ 侧的对照"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐页）——**两处式号错位订正**，
      旧 note 的「非核对原书」撤销】

      ⚠ 旧 loc 有两处差一号：
        Q_B = Q_1 + Q_0 + Q_{−1}   是 **(4.4.9)**（旧写 (4.4.10)）；
        Q_1² = 0                    是 **(4.4.12)**（旧写 (4.4.13)）。
      另 summary 第 6 步引的「内积 (4.4.23)」应是 **(4.4.20)**；(4.4.23) 是 OCQ 侧的
      Q_B|ψ,↓⟩ = Σ_{n≥0}c_{−n}(L^m_n − δ_{n,0})|ψ,↓⟩。（statement 与 summary 不改，此处记账。）

      **本推导第 5 步（下三角论证）在原书里的逐字形式（p.140）**：
        "Now, U = {Q_0+Q_{−1}, R} lowers N^lc by one or two units. In terms of N^lc, S is diagonal
         and U is lower triangular. **By general properties of lower triangular matrices**, the
         kernel of S + U can be no larger than that of its diagonal part S. In fact they are
         isomorphic… The factors of S^{−1} make sense because they always act on states of
         N^lc < 0, where S is invertible."
      → 「lower triangular matrices 的一般性质」在**无穷维 Fock 空间**上不是一条现成定理；
        原书紧接的那句 S^{−1} 辩护是它给出的全部理由。这是本推导 gaps 第一条所指的那一步，
        现已有原书逐字定位（见 gaps）。

      **第 3–4 步走的是哪条路（p.139，逐字）**：
        "One can find the cohomology directly by considering the action of Q_1 in the occupation
         basis. **We will leave this as an exercise**（= 习题 4.6），and instead use a standard
         strategy which will also be useful in generalizing to Q_B."
      → 即「直接算 Q_1 的上同调」这条路在原书里是**习题**，正文走的是 S = {Q_1,R} 的标准策略。

      见 literature/extractions/polchinski-1998-v1.md §12.3（E58/E68）与 §12.10 表 B 第 9 项、
      表 C 第 9 项。
