depends_on:
  - id: worldsheet.free-boson-vertex-algebra-with-lightlike-momentum-tower
    inferred: false
    note: |
      **本项目侧的 VOA 结构。** 该卡 (2)(3) 逐字给出：V_(𝔥, Z k) = ℂ[Z k] ⊗ M(1) 是顶点代数，
      动量塔 ⊕_j F(p + j k_0) 是它的不可约模（Li–Wang Thm 3.6 / Def 3.5），
