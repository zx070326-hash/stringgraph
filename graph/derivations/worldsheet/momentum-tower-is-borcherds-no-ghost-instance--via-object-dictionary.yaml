      本推导断言 (1) 的「塔确实是某个格点顶点代数的模、且层指标 j 是格度数」这一半逐字来自它。
      ⚠ 该卡边界 (N2)(N4)(N5)(N6) **逐字排除**本卡的断言 (2)(3)，故它只承载前置、不承载结论
      ——这正是本卡被立出来的理由。
