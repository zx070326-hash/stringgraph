  - id: math.lattice-vertex-algebra
    inferred: false
    note: |
      **Borcherds 侧 V_{II_{1,1}} 的构造来源**：格点顶点代数 V_(𝔥,L) = ℂ_ε[L] ⊗ M(1)，
