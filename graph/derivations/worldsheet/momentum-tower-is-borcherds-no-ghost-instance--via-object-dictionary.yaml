      **H_phys(a₀) 与 H_null(a₀) := H_phys ∩ H_phys^⊥ 的定义，以及商型的良定义性**
      （已 formalized：Lean `towerNullSubmodule`、`towerQuotientPairing`）。
      断言 (2) 的 Φ(H_phys) ↔ P¹、Φ(H_null) ↔ N¹ 两对里，本项目侧的那一端由本卡给出。
