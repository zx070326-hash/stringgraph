summary: |
  把 borcherds-1992 §5 的三个空间与本项目动量塔上的三个空间逐对对上，
  论证是**对象识别式**的（构造两侧的同一套数据，指出它们逐层同构），不是定理证明。

  **论证骨架**
  1. **两侧都是格点顶点代数的模**（math.lattice-vertex-algebra，该卡对格只要求 ⟨α,α⟩ ∈ 2Z）：
     本项目侧是退化秩 1 格 Z k（free-boson 塔卡 (1)(2)(3)），Borcherds 侧是非退化秩 2 格 II_{1,1}。
  2. **层指标 ↔ 格度数**：塔按 j ∈ Z 分层（free-boson 塔卡 (3)(iii)），
     Borcherds 按 II_{1,1}-度数 r 分片；取 Borcherds 造 K_i 用的类光方向 w = k_0，
     则 r 的沿 w 那一个分量就是 j。**这一步是本推导的取法，不是文献的句子**（边界 (d)）。
  3. **物理子空间的定义两侧同形**：Borcherds 的 P¹ = {L_0 v = v, L_i v = 0 (i>0)} 与本项目
     worldsheet.tower-physical-quotient-form 的 H_phys(a₀) 是同一组条件（a₀ = 1 时逐字相同）。
  4. **零态两侧同形**：Borcherds 的 N¹ 逐字是「P 的双线性形式的根」，
     本项目 H_null := H_phys ∩ H_phys^⊥ 逐字是同一件事。**三对里最无争议的一对。**
  5. **横向空间**：Borcherds 的 T¹ 是被所有 K_i (i>0) 湮灭者，本项目的 D(Ε) 是 DDF 张成。
     两者同一**当且仅当** K_i 与 A^ε_n 是同一族算子——那是 worldsheet.ddf-contour-equals-mode-sum
     的内容，**本推导按需取用、不重复承载**（本卡边界 (b)）。
  6. **逐度数求和**：Borcherds 对每个固定 r 说话（故其 L_0 本征空间有限维假设成立），
     本项目把全部 rung 放进一个空间（故该假设为假，free-boson 塔卡 (N3)(b) 逐字）。
     本推导断言逐度数结论求和后给出塔上结论。**这一步本图无来源，是 status 停在
     physical-argument 的主因**（本卡边界 (a)）。

  **为什么 status = physical-argument 而不更高**
  第 2、6 两步是本推导自己的取法与读法，一手文献里不成文；第 5 步把困难外包给一张
  自身 effective = physical-argument 的卡。按 docs/STATUS_LEVELS.md 的 rigorous 例外条款
  （「前提完整 + 有限步初等计算 + reviewer 已独立复核并记录」），本推导前提**不完整**
  （Thm 5.1 的一条假设在本项目侧为假，绕法未论证），例外条款不适用。

  **为什么不是 conjecture**
  结论真伪不在争议中：Borcherds 自述 §5 是 Goddard–Thorn 1972 原始证明的复述，而 GT 正是
  在 DDF 框架里工作的；三空间字典是该领域的标准读法。按 STATUS_LEVELS.md 2026-09-11 裁决，
  「论证不完整」走 physical-argument + gaps，「结论可能为假」才走 conjecture。
gaps:
  - |
    **【逐度数 ⇒ 整塔：本推导最实质的未论证步】**
    Thm 5.1 的假设逐字含「all the eigenspaces of L_0 are finite dimensional」。
    Borcherds 的 P¹_r 固定度数 r，故满足；本项目的塔
    T(p;k_0) = ⊕_{j∈Z} F(p + j k_0) 的每个 L_0 本征空间含全部 j（free-boson 塔卡 (N3)(b) 逐字
    「故**无限维**」），故**不**满足。本推导的绕法是「Borcherds 的结论逐 r 成立，求和回塔上」，
    但「逐度数成立 ⇒ 塔上成立」在本图**无节点、无来源**。
    ⚠ 这一步看似平凡（直和上的逐分量陈述），但它要求 H_phys、D(Ε)、H_null **三者都与分层相容**
    （即都等于各自逐层部分的直和）。本图中 H_phys 的分层相容性由 L_0 的逐层作用给出，
    但 **D(Ε) 的分层相容性依赖 DDF 算子的层移性质**（worldsheet.ddf-operators-v6 的 A^ε_n 把
    rung j 移到 j + n），而 H_null 的分层相容性依赖型的层间正交——**后者是约定而非结论**
    （本卡边界 (c)）。三者中任一条不成立，求和这一步就断。**补它的路**：把三条分层相容性
    分别立成节点（H_phys 那条可能已可由现有 formalized 结果给出），本推导即可升到 rigorous 的候选。
  - |
    **【秩 2 vs 秩 1：w 的去向未辨】**
    Borcherds 的 II_{1,1} 有**两条**类光方向；本项目的塔只沿**一条** k_0 分片，
    横向方向 Ε 是 D−2 条**类空**方向。本推导取 w = k_0（K_i 与 A^ε_n 同族的标准读法），
    但「另一条类光方向在本项目记号里是什么」**未回答**。
    ⚠ 物理上的标准答案是「另一条类光方向由 p 的纵向分量提供」（DDF 构造里 k_0 与 p 张成
    二维洛伦兹平面，2α' k_0·p = 1 正是该平面的配对归一化），这与 II_{1,1} 的 Gram 矩阵
    ((0,−1),(−1,0)) 形状吻合。**但本图无任何节点写下这句话，也无来源**，
    故只作为本 gap 的旁注登记，**不**进本推导的论证体。
  - |
    **【型的相容性按需取用、未证明】**
    断言 (2) 的 Φ(H_null) = N¹ 这一对要求两侧的双线性型在 Φ 下相容。
    本项目塔上的型的层间正交是 worldsheet.momentum-tower-fock-space (2) 的**规定**
    （该卡 notes【层间正交这条约定的风险登记】逐字：「在连续动量的物理表述里这条对应
    δ^D(p − p') 的正交性，是标准且无争议的；但在本图的离散代数模型里它是**输入而非结论**」），
    Borcherds 的型由顶点代数结构**构造**而来。本推导按需取用相容性，不证明。
  - |
    **【本推导不承载算子字典，也不免除它】**
    断言 (2) 的 Φ(D(Ε)) = T¹ 只在「K_i 与本项目 A^ε_n 是同一族算子」之下才有内容。
    那条缝由 worldsheet.ddf-contour-equals-mode-sum（effective = physical-argument）承载，
    在 worldsheet.ddf-spanning-hypothesis--via-borcherds-1992 里是**另一条**依赖边。
    ⇒ 本卡与该卡是该推导**两条并列的 physical-argument 瓶颈**，不是一条。
    立本卡的记账价值正在于此：此前 `why worldsheet.ddf-spanning-hypothesis` 的瓶颈树只有
    算子字典一枝，对象识别缺口完全不可见。
