  **status 定级理由**：kind 与 status 都取 physical-argument。不适用
  docs/STATUS_LEVELS.md 的 rigorous 例外条款，理由两条（对应 gaps 第 2、3、4 条）：
  论证以两条本图无节点的规则（径向共轭作用为 z ↦ 1/z̄；指数算符两半的换序）为前提，
  不是「前提已完整写出的有限步初等计算」；且两条相关来源的核实等级分别是
  GSW 式号 L0（正文未获取）与 Polchinski (6.6.24) 已核实但**讲的是另一个对象**
  （分离插入点的 OPE，非同点重排序）。**无 reviewer-verified 记录。**
  【2026-09-11（四）更新】第一条规则现在**有**节点了
  （worldsheet.radial-hermitian-conjugation），但那张卡本身的 effective 也是
  physical-argument（被 worldsheet.state-operator-isomorphism 封顶），
  且它的 (1) 没有文献式号锚点，故 status 定级**不变**；
  第二条（指数算符两半的换序）仍然没有节点。

  即使不看上述两点，本推导也被 worldsheet.free-scalar-propagator 与
  worldsheet.conformal-normal-ordering-v2（均 effective = physical-argument）从上方封顶。

  **推导名 `--via-radial-conjugation`**：与同族的
  `worldsheet.ddf-commute-with-virasoro--via-conformal-weight`、
  `worldsheet.ddf-transverse-oscillator-algebra--via-conformal-weight` 区分。
  那两条走「权与围道形变」（T 与被积量的 OPE、两个被积量之间的 OPE），
  本条走「径向厄米共轭 z ↦ 1/z̄ + 指数算符两半的重排序」，机器不同。

  **本推导没有第二条独立路线。** 数学侧（顶点算子代数的不变双线性型与 adjoint vertex operator）
  原则上给得出严格版本，需 researcher 先取得带编号的可引用陈述；届时应新增
  `--via-voa-invariant-form` 的独立推导，而不是改本条。见目标节点 notes【升级路径】(ii)。

  **最短升级路径是 Lean（目标节点 notes【升级路径】(i)）。** 关键观察：在**代数** Fock 空间
  （worldsheet.bosonic-fock-space 的多项式模型）上，第 3 步的「重排序」不是解析操作——
  E_- 是「乘以多项式环的一个显式元素」（`Fock.creaExp`），E_+ 是「变量平移」（`Fock.vertexSub`），
  两者换序只是「先乘后平移 vs 先平移后乘」，代价是把被乘的元素也平移一次，
  而那个代价正是 z^{2α' n² k_0²} 的代数化身，在 b·b = 0 时为 1。
  因此本推导的唯一非初等步骤在代数模型里预期是初等的；
  但**本推导没有写出那个论证**（写出并经 reviewer 复核后，可考虑按 rigorous 例外条款升级）。
