summary: |
  机器检查的证明，在 formal/StringFormal/NoGhost/TowerPhysical.lean。**一行代数**。

  子空间的定义（Lean `towerPositiveModeSubmodule η a b`）逐字是
    ⨅_{m : ℤ} ⨅_{0 < m} ker (towerLop η a b m)，
  展开引理 `mem_towerPositiveModeSubmodule` 把它化为「∀ m > 0, L_m Ψ = 0」。
  它是子模，因为它是线性映射核的交。

  设 Ψ ∈ P，取 m ≥ 1。由上游 [L_m, A^ε_n] = 0（Lean `lie_towerLop_ddfOp_of_pos`，
  在 (N) k_0² = 0、(S) 2α' k_0·p = 1、(T) ε·k_0 = 0 之下）把括号展开为
    L_m ∘ A^ε_n = A^ε_n ∘ L_m ，
  作用在 Ψ 上：
    L_m (A^ε_n Ψ) = A^ε_n (L_m Ψ) = A^ε_n 0 = 0 。
  对一切 m ≥ 1 成立，故 A^ε_n Ψ ∈ P。∎

  Lean 里就是 `rw [h', hΨ m hm, map_zero]` 三步（`h'` 是把
  `LieRing.of_associative_ring_bracket` 展开并 `sub_eq_zero` 之后的交换律）。

  **n 无限制**（含 n = 0），与 worldsheet.ddf-operators-v6 的 (2) 一致。
gaps:
  - |
    **不覆盖质壳（L_0）条件，故不能推出「A^ε_n 把物理态映为物理态」**。
    需要 [L_0, A^ε_n] = 0，即共形权恒等式的 m = 0 情形，**未形式化**
    （根在单 Fock：Sugawara 求和在 m = 0 时 j = 0 与 j = m 两项重合，
    见 worldsheet.exponential-vertex-operator-mode-weight-identity 的 gaps 第 1 条）。
    Lean 侧 `towerPhysSubmodule`（含两条条件的塔上物理子模）**已定义但没有保持性定理**。
    ⚠ 注意 **L_0 那一侧的层依赖不是障碍**：`towerLop η a b 0` 在第 j 层已用该层动量，
    (L_0 − a₀)Ψ = 0 是统一条件，本征值 α'k² + j + N 在 A^ε_n 的「层 +n、能级 −n」
    移位下不变（Lean `invTwo_zeroModeSq_towerMomentum_add_shift_cancel`，
    且与求和指标 j 无关）。缺的**只有那个括号**。
  - |
    **只断言"映入"，不断言"映满"或"单"**：本推导对 A^ε_n 在 P 上的像一无所知，
    也不断言 A^ε_n ≠ 0。DDF 态张成物理谱是完全另一件事（formal/TODO.md 的 `ddf-spans`，未做）。
  - |
    **P(p;k_0) 上没有任何正定性内容**。无鬼定理要的是内积的正定性，
    本推导只谈线性子空间的保持。塔上的配对见 worldsheet.momentum-tower-fock-space
    （其层间正交是**约定式**定义，不是被证明的）。
  - |
    **与文献路线没有共同步骤**。文献（GSW、goddard-2008）从「被积量是权 1 primary」
    经 OPE + 围道形变一次性得到完整物理态保持；本推导是塔上的代数推理，且只覆盖一半。
    更根本地：**「本图/Lean 的 A^ε_n 与文献的围道积分 A^i_n 是同一个算子」在本图中没有节点承载**
    （worldsheet.ddf-operators-v6 notes 登记的 open 缺口）。回译到文献时必须引用它。
  - |
    **一般交换 Q-代数，无实结构**。(N)(S) 只作为给定数据，其可满足性未证；
    k_0·p = 0 的扇区（含 p = 0）不在覆盖范围内。
