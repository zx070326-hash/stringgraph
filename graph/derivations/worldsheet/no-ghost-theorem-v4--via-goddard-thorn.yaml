      K_n|ψ⟩ = 0, n > 0, in addition to the physical state conditions … The K_n together with
      the L_n form an extension of the Virasoro algebra'，E7 L1），并把它归给 [45] = GT 1972；
      E7 按语：「(6.3) 的 [L_m, K_n] = −n K_{m+n} 是 GT 证明真正用的代数」。
      本推导 notes【（七）】此前自报「[K_m, A^ε_n] = 0 与领头项结构在图内均无节点」，本边关闭前一半。
      ⚠ **本边只供给代数，不供给刻画 (6.2) 本身**（「物理态 + K 条件 = DDF 态」）：那是 (B-26)
      所在处，仍在 gaps（见新增的 (B-26) 条）。
      **有效状态后果**：该卡当前 effective = physical-argument（推导 --via-mode-algebra，
      文献无证明、Lean 未落地），本推导的 effective 由 rigorous **降为 physical-argument**。
