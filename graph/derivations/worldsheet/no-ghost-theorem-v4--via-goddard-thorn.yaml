      **【同日更新】已落地**：formalizer-noghost-a 合入 main（6ed1638），该卡接上 --via-lean
      （`StringFormal.NoGhost.lie_towerLop_kOp` 等，Longitudinal.lean 里 `towerK` 改名 `kOp`），
