  - "【2026-09-11 新增，small-backlog-12；formal/BLUEPRINT-noghost.md §B.5/§D.3 第 3、4 条】**(B-26) 本推导的真正承重点，与上面「两篇 1972 论文正文未获取」那条不同**：那条讲的是**可追溯性**，本条讲的是**论证结构**。把 DDF 代数、伴随、横向 Gram 正定、特征标计数全部走完之后（这些**与 D 无关**：ch H_phys = φ(q)^{−(D−1)}、ch H^⊥ = φ(q)^{−(D−2)} 对任意 D 成立，独立核算 N = 1 时 25 = 24 + 1、N = 2、D = 26 时 350 = p_{25}(2)），剩下的、也是**唯一含 26 的断言**是：**(B-26) H_phys 中 H^⊥ 之外的那 p_{D−1}(N) − p_{D−2}(N) 个方向在 D = 26 时恰为零模态**（等价：H_phys 上双线性型的秩恰为 p_{D−2}(N)）。**这是 D = 26 唯一进入之处**——它不出现在 DDF 代数（worldsheet.ddf-transverse-oscillator-algebra-v2）、伴随（worldsheet.ddf-operators-adjoint-v2）、横向 Gram 正定（worldsheet.transverse-ddf-fock-gram-matrix）或 K_n 代数（worldsheet.gt-longitudinal-k-algebra）里。文献支撑只有 Goddard 2008 §6 (6.4) 一句无证明结论（逐字 'For D = 26, if |ψ⟩ is a physical state … it can be written in the form |ψ⟩ = |f⟩ + |n⟩'，转引 GT 1972 [45]，正文未获取）。两条已知机制都还没有可形式化的证明：**GT 机制**（物理态再加 K_n|ψ⟩ = 0 就恰是 DDF 态，对一般物理态要减掉一个伪态把 K 条件配平，可解性用到 D = 26、a = 1——本项目尚未理解其细节）与 **Brower 机制**（纵向算子 A^L_{−n} 生成多余方向，其 Gram ∝ (26 − D)，需要形式化 1/(k_0·P(z))，蓝图 §A.3 判为高成本）。即使拿到 1972 正文，形式化仍需在两者之间做一次尚未做出的选择。**方法论推论**：这解释了 worldsheet.no-ghost-theorem-subcritical（D ≤ 25 半正定）与本目标 (1b)（D = 26 等距同构）是**强度不同的两件事**而不是同一结论的两个区间——D < 26 时秩更大但仍半正定，D > 26 时多出的方向有负模（LevelTwo.lean 的 ⟨ψ₂,ψ₂⟩ = −2(D−26)(D−1)/25 是 N = 2 的显式见证）。"
