      ψ₂ = [α_{−1}·α_{−1} + (D−1)/5·(α_0·α_{−2}) + (D+4)/10·(α_0·α_{−1})²]|k⟩
      与质量壳 α'k² = −1 上的动量，机器验证了 ψ₂ ∈ H_phys 且
      ⟨ψ₂,ψ₂⟩ = −2(D−26)(D−1)/25 < 0（formalized）。
      **非 inferred**：本推导 summary 第 (2) 条早已把「level-2 标量物理态的模正比于
      (D−1)[16a²+(2D−74)a+84−3D]，在 a = 1 处为 (D−1)(26−D)」写成与纵向算子构造并列的
      独立核算，这张卡正是那次核算的承载节点，现在还带了机器检查。
      **注意本条不改变本推导的论证**：本推导第 (2) 条走的仍是 Brower/DDF 纵向算子构造
      （文献路线，正文未获取）；这条依赖是同一结论的第二条、完全独立的路线。
      **有效状态不变**：该卡 effective 为 formalized，本推导的封顶仍在第 (1) 条那侧
      （两条 DDF 对易关系与 ddf-operators-adjoint，均 physical-argument）。
  - id: worldsheet.gt-longitudinal-k-algebra
    inferred: false
    note: |
      【2026-09-11 新增，small-backlog-12；依 formal/BLUEPRINT-noghost.md §A.0/§D.3 第 1 条】
      供给张成步（summary 第 (1) 条「再证塔上任意物理态可写成 DDF 态加零模态」）的**代数工具**：
      纵向算子 K_n = k_0·α_n 及其代数 [L_m, K_n] = −n K_{m+n}、[K_m, K_n] = 0、K_0 = 1、
      K_m† = K_{−m}、[K_m, A^ε_n] = 0。
      **非 inferred**：Goddard 2008 §6 p.15 (6.2)(6.3) **逐字**以 K_n 表述张成步的框架
