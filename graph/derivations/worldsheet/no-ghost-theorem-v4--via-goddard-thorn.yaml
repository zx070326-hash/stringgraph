id: worldsheet.no-ghost-theorem-v4--via-goddard-thorn
target: worldsheet.no-ghost-theorem-v4
kind: proof
status: rigorous
depends_on:
  - id: worldsheet.old-covariant-physical-states
  - id: worldsheet.ddf-operators-v6
    note: |
      【2026-09-11 就地换代】原为 worldsheet.ddf-operators-v4。v4 被拆成一张纯定义卡（本条）
      加三条命题（下面两条 + worldsheet.ddf-transversality-gives-local-finiteness）。
      本条只提供 A^i_n 的定义、类光去心直线与归一化 (★)，不再提供任何代数性质。
      来源覆盖沿用：v5 的 sources 与 v4 逐字相同（GSW §2.3.3 / GT 1972 / Polchinski §4.1）。
  - id: worldsheet.ddf-commute-with-virasoro
    note: |
      【2026-09-11 新增，来自 v4 拆卡】本推导第 (1b) 步「A^i_{-n} 作用在物理态 |0;k⟩ 上
      得到的仍是物理态」直接就是这条命题（[L_m, A^i_n] = 0 加质量壳记账）。
      在 v4 未拆时它是 worldsheet.ddf-operators-v4 陈述文本的一部分，故本条不是新依赖，
      只是把已有依赖显式化。来源覆盖沿用 v4（GSW §2.3.3 / GT 1972），
      另加 goddard-2008 作为「physical state = DDF 态 + 零模态」的二手证据。
  - id: worldsheet.ddf-transverse-oscillator-algebra-v2
    note: |
      【2026-09-11 新增，来自 v4 拆卡】本推导第 (1b) 步「其 Gram 矩阵就是 24 个横向振子
      Fock 空间的正定 Gram 矩阵」依赖这条命题。同上，v4 未拆时它是定义卡文本的一部分，
      不是新依赖。来源覆盖沿用 v4。
      注意本条**不含** (A^i_n)† = A^i_{−n}（Gram 矩阵计算还需要它，见下一条依赖）。

      【2026-09-11（五）换代，curator，分支 agent/curator/ddf-algebra-split】原指
      worldsheet.ddf-transverse-oscillator-algebra（已 superseded）。那张卡把**两个命题**
      捆在一起：对易关系 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}（现为本依赖 v2，陈述逐字去掉末句）
      与末句「与世界面横向振子 α^i_n 的代数逐字同型」（现为
      worldsheet.ddf-algebra-isomorphic-to-transverse-oscillators，physical-argument）。
      **本推导只改指 v2，不加同构卡的边**，理由：
      (a) 目标陈述 worldsheet.no-ghost-theorem-v4 的 (1b) 断言的是 H_phys(k;k_0)/H_0(k;k_0) 与
          **横向 DDF Fock 空间** H^⊥(k) 等距同构，H^⊥(k) 通篇由 A^i_{−n} 定义（标题逐字「24 个横向
          **DDF** 振子的 Fock 空间」）；陈述**从不**声称 H^⊥(k) 与光锥横向振子的 Fock 空间同构，
          故光锥侧那张卡不是本论证的输入。
      (b) 本推导 summary 里「其 Gram 矩阵就是 24 个横向振子 Fock 空间的正定 Gram 矩阵」一句
          读起来像在用那个同构，但它实际引用的是 Gram 矩阵的**显式对角元** ∏ n^{d} d!，
          由 worldsheet.transverse-ddf-fock-gram-matrix（已在本推导依赖中）给出，
          那套算术只用到 (H1) 对易关系 + (H2) 伴随关系 + 真空归一化，与 α^i_n 无关。
      (c) 文献侧也没有逐字用到那个同构：goddard-2008 的「physical state = DDF 态 + 零模态」
          与 fgz-1986 Theorem 2.8 的「All three isomorphic spaces are positive definite」
          都是在 DDF / 横向空间自身上陈述正定性。
      **有效状态的后果**：v2 的 effective 由 physical-argument 升为 **rigorous**
      （推导 --via-zero-mode-bracket，G–N CMP §3.1 的零模李括号路线，拆卡前被末句比较压住），
      故本条依赖**不再是**本推导的上限。目标 worldsheet.no-ghost-theorem-v4 的 effective
      **仍是 physical-argument**，瓶颈只剩内积/伴随那一层（worldsheet.ddf-operators-adjoint
      与 worldsheet.transverse-ddf-fock-gram-matrix，后者被前者封顶）。
  - id: worldsheet.ddf-operators-adjoint-v2
    note: |
      【2026-09-11（二）新增，ms.no-ghost-theorem 第五轮审计建议，lead 已同意】
      本推导第 (1b) 步「其 Gram 矩阵就是 24 个横向振子 Fock 空间的**正定** Gram 矩阵」
      需要伴随关系 (A^i_n)† = A^i_{−n}：上一条依赖的横向振子代数**只给对易子**，
      单凭对易子算不出任何配对值，正定性还要伴随关系加真空归一化 ⟨0;k|0;k⟩ = 1。
      该节点的第 (2) 条正是这一步的完整记账（对角正定，对角元 ∏ n^{d} · d!）。
      此前本推导 gaps 的【2026-09-11 新增】末条把它登记为「本图无节点」的缺口，现已建卡，
      该 gap 条目相应更新。
      来源覆盖沿用 v4（GSW §2.3.3 / GT 1972，另加 goddard-2008 作为二手证据），
      与上两条对易关系节点同一处、同一核实等级（式号 L0）。
      **有效状态不因此再降**：本推导的 effective 在 DDF 拆卡后已是 physical-argument，
      新依赖的 effective 同样是 physical-argument。
      【2026-09-12 换代，curator，分支 agent/curator/adjoint-wire】原指
      worldsheet.ddf-operators-adjoint（已 superseded）。v2 **只含伴随关系 (1)**；
      上面提到的「该节点的第 (2) 条（Gram 矩阵记账）」现由下一条依赖
      worldsheet.transverse-ddf-fock-gram-matrix 单独承载，本条边只承担伴随关系本身。
      ⚠ **上面两处「effective = physical-argument」已过时**：v2 现为 **formalized**
      （推导 --via-lean，lean_decl `StringFormal.NoGhost.Fock.towerPairing_ddfOp_left`，
      formal/StringFormal/NoGhost/VertexAdjoint.lean，fb006f5，16 条声明公理干净）。
      ⇒ **伴随这一层不再是本推导的瓶颈**。
  - id: worldsheet.transverse-ddf-fock-gram-matrix
    note: |
      【2026-09-11（四）新增，拆卡后接线，lead 裁决】本推导第 (1b) 步「其 Gram 矩阵就是
      24 个横向振子 Fock 空间的**正定** Gram 矩阵」这一句里的**矩阵本身**由该节点承载：
      在 (H1) 横向振子代数、(H2) 伴随关系、(H3) 真空湮灭、(H4) 真空归一化四条假设下，
      DDF 单项式基正交、对角元 ∏ n^{d(i,n)} d(i,n)!、有序域上正定。
      它与上一条依赖 worldsheet.ddf-operators-adjoint **分工明确、不重复**：
      那一条承载 (H2) 本身（伴随关系 (A^i_n)† = A^i_{−n}，physical-argument），
      本条承载「有了 (H1)(H2)(H3)(H4) 之后 Gram 矩阵长什么样」这步蕴含
      （推导 --via-oscillator-recursion，status rigorous，reviewer 复核待补）。
      该节点是 worldsheet.ddf-operators-adjoint 第 (2) 条的拆卡产物，旧卡未换代。
      **有效状态不因此变化**：新节点 depends_on 旧卡与 worldsheet.ddf-transverse-oscillator-algebra，
      其 effective 同样是 physical-argument，与本推导既有的上限同级。
  - id: worldsheet.momentum-tower-fock-space
    note: |
      【2026-09-11（三）新增，立卡后接线】目标陈述 (1b) 断言的空间
        H_phys(k; k_0) := ⊕_{N ≥ 0} H_phys(k − N k_0)
      是**动量塔的子空间**，其上的内积（也就是 (1b-i) 说「正定」的那个型、
      (1b-ii) 说「保内积」的那个型）是塔上层间正交的双线性型；
      H_0(k;k_0) 的定义（塔内与全部物理态正交的子空间）与目标 notes【扇区覆盖】里
      「不同动量的 Fock 态互相正交」一句，也都在塔上、依赖同一条层间正交约定。
      该对象与该型现由本条依赖承载，本推导与目标陈述不再自行引入。
      这条边**不是 inferred**：塔是目标陈述 (1b) 量词的定义域，
      不是「某处文献的论证依赖它」——恰恰相反，文献不把塔写成对象，
      见本推导 gaps 的【v3 起】「逐动量塔打包是本项目对文献表述的规范化」一条。
      **有效状态不变**：该卡 status rigorous、依赖均 formalized，
      本推导既有的上限（两条 DDF 对易关系与 ddf-operators-adjoint，均 physical-argument）不受影响。
  - id: worldsheet.virasoro-algebra-v2
  - id: worldsheet.negative-norm-physical-state-above-26
