  - id: worldsheet.kac-determinant-v2
    inferred: true
    note: |
      Goddard–Thorn 原文不引用 Kac 行列式（1979 年才有）。现代数学化表述
      （如 Frenkel–Garland–Zuckerman 1986 的 BRST 上同调证明）会用到 Verma 模结构。
      标 inferred 表示"现代严格证明依赖它"而非"原文依赖它"。
      **2026-09-11：本边由 worldsheet.kac-determinant 改指其接替者
      worldsheet.kac-determinant-v2**（后者只把 α_N 的「正常数」改为「非零常数」，
      其余陈述与 sources 逐字相同）。本推导不使用 α_N 的符号，故换代对本边**无实质影响**。
  - id: worldsheet.ddf-spanning-hypothesis
    inferred: false
    note: |
      【2026-09-15 新增，curator，分支 agent/curator/noghost-ddf-wiring】
      本推导 summary 第 (1) 条「再证塔上任意物理态可写成 DDF 态加零模态」即本节点的断言
      H_phys ⊆ D(Ε) + H_null；推导 gaps 的 (B-26) 一条逐字写明「这是 D = 26 唯一进入之处」
      且「剩余的非机检内容 = worldsheet.ddf-spanning-hypothesis 一条」（2026-09-11 noghost-conditional
      追记），但该节点此前从未出现在 depends_on 中，工具不可见，导致 effective 虚高为 rigorous。
      本边把这一隐含依赖显式化。
      **非 inferred**：来源直接是本推导 sources 已登记的 goddard-2008 §6 (6.4)（逐字
      'For D = 26, if |ψ⟩ is a physical state … it can be written in the form |ψ⟩ = |f⟩ + |n⟩'，
      |f⟩ 为 DDF 态、|n⟩ 为零模态），正是 worldsheet.ddf-spanning-hypothesis 的 statement 断言。
      不需要新文献；本推导的 sources 列表无需改动。
      **有效状态后果**：worldsheet.ddf-spanning-hypothesis 的 effective = physical-argument
      （最强推导 --via-borcherds-1992，被 worldsheet.ddf-contour-equals-mode-sum 封顶），
      加入后本推导的 effective 由虚高的 rigorous 降为 **physical-argument**，
      与推导 notes 和里程碑 R8-3/R9-4 记载的「(B-26) 未证」一致。这不是新弱点，
      而是把此前被 gaps 文字承载却对工具不可见的猜想负担正确地接入图中。
sources:
  - ref: goddard-thorn-1972
    loc: "无编号；摘要末句 'absence of ghosts for d ⩽ 26'，正文未获取"
    note: |
      2026-09-10 核实（brst-cohomology-sources.md §3.1）：正文四条路径全部失败，
      文中是否有编号定理不能确认也不能否认；三条间接证据（Goddard 2008 综述复述时不给编号、
      FGZ 1986 引为 ref 8 时不给编号、该刊 4 页快报体例）一致指向"无编号"。
      摘要不提 intercept，本条只覆盖 a = 1。
  - ref: brower-thorn-1971
    loc: "Goddard 2008 综述 arXiv:0802.3249 归属于此文；本文摘要未见维数条件，未裁决"
    note: |
      支持本推导第 (2) 条（D > 26 有负模）的候选来源。Goddard 2008（作者本人综述，见 goddard-2008）
      把「D > 26 时物理态中出现鬼」归给 Brower–Thorn 1971（其 ref [29]），而不是 1972 年那两篇。
      但 Brower–Thorn 1971 摘要只提 leading nine trajectories，无维数条件。
      二手归属与一手摘要存在张力，未裁决，如实登记。见 brst-cohomology-sources.md §3.2。
  - ref: goddard-2008
    loc: "arXiv:0802.3249，无鬼定理一节（逐字：'The No-Ghost Theorem follows for D < 26 by embedding in the D = 26 case.'）"
    note: |
      作者本人的历史综述，是 goddard-thorn-1972 / brower-1972 适用范围的二手（L3）证据来源：
      (a) 通篇在 α_0 = 1 下陈述无鬼定理（逐字「If α_0 = 1 … so that Virasoro's conditions obtain」，
          并称 α_0 = 1「we shall in general take to be the case in what follows」）；
      (b) D < 26 不是独立情形，而是由嵌入 D = 26 得到；
      (c) D > 26 出鬼归给 Brower–Thorn 1971；
      (d) 「physical state = DDF 态 + 零模态」的写法是本推导第 (1b) 步的直接依据。
      综述本身不含新证明，故只作为归属与适用范围的证据，不作为本推导的数学来源。
  - ref: fgz-1986
    loc: "Theorem 2.8 第二个同构（T ∩ P ≅ P/rad P），固定动量 p ≠ 0，维数 p_{(24)}(1 - p·p/2)"
    note: |
      编号已核实（brst-cohomology-sources.md §1.3）。这是目标陈述采用**逐动量**表述的可引用依据，
      也是 (1b-i) 正定性的可引用依据（原文逐字「All three isomorphic spaces are positive definite」）。
      FGZ 的横向空间 T 与本推导用的 DDF Fock 空间 H^⊥(k) 实现方式不同（见目标节点 sources 的注）。
      FGZ 逐字的动量条件 p ≠ 0 也是目标陈述 v4 第 (2) 条采用 p ≠ 0 量词的依据（第三轮审计 C3）。
  - ref: brower-1972
    loc: "§II–III（节号未核实）"
    note: |
      用谱生成代数（Virasoro 代数在物理态空间上的作用）给出的独立证明。
      节号形式沿用 v2/v3 的推导，节号本身未与原文核对（APS 403，正文未获取），需 researcher 补齐。
  - ref: gsw-1987-v1
    loc: "§2.3.2–2.3.3（教科书版本）"
    note: GSW 用 mostly-minus 号差，已按 conv.metric-mostly-plus 转写；GSW 取 α' = 1/2。
  - ref: polchinski-1998-v1
    loc: "§4.4 末，p.143（逐字）：「Eq. (4.4.19) defines an OCQ-physical state in each cohomology class. For the special case of flat spacetime this state can be constructed more explicitly by using the **Del Giudice–Di Vecchia–Fubini (DDF) operators**. To explain these we will need to develop some more vertex operator technology, **so this is deferred to chapter 8**.」；DDF 的正文在 §8.2，eq. (8.2.27), p.240"
    note: |
      【2026-09-11（五）新增，researcher 第六轮原书核实，curator 落实】
      本条**只承担可追溯性**，不承载数学论证（原书把 DDF 的构造推迟到第 8 章，
      §4.4 内部的证明不用 DDF）。它更正了本图先前的一处事实错误：
      「Polchinski 本书从未把 DDF 与 §4.4 接起来」是**错的**——p.143 明写了这条连接。
      因此凡以「本书没接」为理由标 `inferred` 的边都可以撤销该标记。
      ⚠ **实际核查结果（curator 2026-09-11，逐条扫描全图所有 `inferred: true` 边的 note）：
      本图中没有任何一条 inferred 边是以这个理由标的。** ddf-* 一带现存的 inferred 边，
      其理由分别是「GSW 不逐条列出缩并步骤」「机制样板而非文献引用」
      「桥接到尚不存在的顶点代数卡」「GT 原文不引 Kac 行列式」，与 Polchinski 的 §4.4/§8.2
      连接**无关**，故**不撤销任何标记**。
      worldsheet.no-ghost-theorem-v4 的 statement notes 里写「具体在 ddf-* 一带……已在报告中交 lead」
      这句**指向为空**；本条即该核查的落地记录，供 auditor 与后续 agent 免于重复排查。
      见 literature/extractions/polchinski-1998-v1.md §12.10 表 B 第 22 项与 §12.3。
summary: |
  本推导与 worldsheet.no-ghost-theorem-v3--via-goddard-thorn（以及更早的 v2 版本）是同一个论证，
  只是目标陈述换成了 v4（第三轮审计 B1 的动量量词 + A1 的类光去心直线），论证强度不变
  （status 仍为 rigorous）。

  第 (1) 条：设 D = 26、a = 1，固定类光参考方向 k_0（去心直线 {λ k_0 : λ ∈ R \ {0}}，标度按
  2α' k_0·p = 1 逐塔取定，符号随 sign(k_0·p)，见 worldsheet.ddf-operators-v5）。DDF 算子
  A^i_n（i = 2..25）与所有 L_m 对易（worldsheet.ddf-commute-with-virasoro），
  满足横向振子代数 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}（worldsheet.ddf-transverse-oscillator-algebra），
  且把动量移到 p + n k_0。取快子壳上的基态 |0; k⟩（α' k^2 = 1，k_0·k ≠ 0，它本身是物理态），
  则 A^i_{-n} 生成的全部态都是物理态，动量落在塔 {k - N k_0 : N ≥ 0} 上，能级 N = Σ_j n_j，
  其 Gram 矩阵就是 24 个横向振子 Fock 空间的正定 Gram 矩阵
  （伴随关系 (A^i_n)† = A^i_{−n} 与由它加上述代数、真空归一化得到的对角正定 Gram 矩阵，
  见 worldsheet.ddf-operators-adjoint）。
  再证塔上任意物理态可写成 DDF 态加零模态（Goddard 2008 的「physical state = DDF + null」形式），
  于是 ⟨ψ|ψ⟩ ≥ 0，且包含映射诱导的 H^⊥(k) → H_phys(k;k_0)/H_0(k;k_0) 是保内积的双射（等距同构），
  逐能级 N 成立故保 N 分级。（分级用 N 而非 L_0：H_phys 上 L_0 ≡ a 是常数。）

  第 (2) 条：D > 26、a = 1 时，在 DDF 态之外还需要纵向（Brower/DDF 纵向算子）方向，
  用它们显式构造出负模物理态；该构造在**非零动量**上进行（纵向算子与 DDF 算子一样需要
  k_0·p ≠ 0，故所得 |ψ⟩ 自动落在某个 p ≠ 0 上），这正是 v4 显式写出的量词。
  与此一致的独立核算：level-2 标量物理态的模正比于 (D-1)[16a^2 + (2D-74)a + 84 - 3D]，
  在 a = 1 处为 (D-1)(26-D)，D > 26 时严格为负（ms.no-ghost-theorem 第一轮审计 B1 的精确计算；
  第二、三轮审计在 N ≤ 3 上数值复核了 D = 26,27,28，且第三轮确认负模出现在类时动量上，
  即 p ≠ 0 且对任意类光 k_0 有 k_0·p ≠ 0）。
gaps:
  - "本推导只覆盖目标陈述的两条：D = 26、a = 1 与 D > 26、a = 1。D ≤ 25、a ≤ 1 的无鬼性不在本陈述内；该分支现已单独建节点：**worldsheet.no-ghost-theorem-subcritical**（Lian–Zuckerman 1991 Theorem 3.5(ii)，L1 逐字，primary-sources-round2.md §1.6）。此前把该分支归给「Brower 1972 / Thorn」的说法**按现有证据不成立**（Brower 摘要限定在 unit Regge intercept）。注意新节点的设定与本推导不同，见下一条。此外，最早的 worldsheet.no-ghost-theorem 把该区域写成\"D ≤ 26 且 a ≤ 1\"是错的（第一轮审计 B1：D = 26、3/8 < a < 1 时 level-2 已有负模）。"
  - "第 (2) 条对一般 a 的加强（\"D > 26 时对任意 a 均有负模态\"）未纳入陈述：goddard-thorn-1972 与 brower-1972 均无抽取记录，无法核实该加强的出处与条件（第一轮审计 B4）。本推导只支持 a = 1 的弱形式。"
  - "goddard-thorn-1972 的 loc 已按核实结果改为「无编号；摘要末句」：原先写的 \"Theorem 1\" 无任何来源支持（brst-cohomology-sources.md §3.1）。brower-1972 的 §II–III 仍是未核实的定位（APS 403，正文未获取）。两篇 1972 年论文的正文都未获取，故本推导的可追溯性仍弱于 status: rigorous 通常要求的水平——这是本推导目前最大的问题。"
  - "两篇 1972 年论文（按可得证据）都只覆盖 a = 1：goddard-thorn-1972 摘要不提 intercept（Veneziano 模型以 α_0 = 1 为前提），brower-1972 摘要把结果限定在 unit Regge intercept。Goddard 2008 综述通篇在 α_0 = 1 下陈述，且完全不讨论 α_0 < 1。**2026-09-10 更新（primary-sources-round2.md §1.6、§4）：a ≤ 1 分支不再是无来源的**——D ≤ 25、a ≤ 1 的情形现由 worldsheet.no-ghost-theorem-subcritical 覆盖，来源是 lian-zuckerman-1991 Theorem 3.5(ii)（L1 逐字，Commun. Math. Phys. 135, 570）。但两者**设定不同，不能互相替换**：(1) LZ 的证明必须补一个中心荷 c = 26 − D 的不可约 Vir 模 L(26−D, 1−h) 才能做 BRST 相对上同调（总中心荷 26），本推导是纯 D 玻色子的 DDF 论证，是两条独立路线（LZ 的补充模只出现在上同调一侧，被断言的空间仍是纯 D 玻色子的 H_phys/H_0；D = 26、a = 1 时补充模退化为平凡模 L(0,0)，两条路线在临界点重合）；(2) LZ 另加下界 D ≥ 2 与对动量 p 的三条假设，本推导与目标陈述都没有这些；(3) LZ 的断言是「对每个 p 正定」的全称等价，不给出负模的显式构造，而本推导第 (2) 条走的是显式纵向算子构造。故本陈述仍不对 D ≤ 25 作任何断言，引用时应指向新节点。"
  - "从物理文献到形式化的差距：需要把\"DDF 态张成 H_phys 模零模态\"这一步写成 Fock 空间上的线性代数命题（含 k_0·k ≠ 0 扇区的显式处理）。抽取记录 E68 建议对照 BRST 版本（worldsheet.no-ghost-theorem-brst）的分级 + 三角矩阵论证，后者更接近可形式化的形式。"
  - "零动量 / k_0·k = 0 扇区被陈述显式排除（v4 已把该排除提到全局前言），本推导不覆盖。"
  - "【v3 起；2026-09-11（三）更新】目标陈述的\"逐动量塔\"打包（对固定 k 取 ⊕_{N≥0} H_phys(k - N k_0) 再模零模态）是本项目对文献表述的规范化，没有一处来源逐字如此写：GT 1972 / GSW / Goddard 2008 用的是\"每个物理态 = DDF 态 + 零模态\"的形式（不做动量记账），FGZ 1986 Theorem 2.8 在固定单个动量（单个能级）上陈述且横向空间 T 的实现方式不同。【（三）更新】该规范化现已落成一张可引用的定义卡 **worldsheet.momentum-tower-fock-space**（已加为本推导依赖），塔、移位算子 e^{i n k_0·x} 与塔上的型都在那里定义。**但两点未变**：(i) 文献侧仍无逐字来源，那张卡的 sources 对 GSW 同样标注「GSW 不把动量塔写成一个有名字的对象」；(ii) 打包用的\"不同动量的 Fock 态正交\"在本图中是**约定式定义**（那张卡的 (2) 显式声明「层间正交是本定义规定的，不是被证明的」），物理上对应 ⟨p|p'⟩ ∝ δ^D(p−p')，而本图**没有节点**承载连续动量本征态与 δ 归一化。此外\"H^⊥(k) 的 DDF 能级等于 H_phys 一侧的振子能级\"这一步在文献里仍是隐含的记账（Lean 侧只有质量壳一半 `invTwo_mul_zeroModeSq_towerMomentum`），形式化时必须显式证明。"
  - "【v3 起】基态在壳条件 α' k^2 = a = 1 与归一化 2α' k_0·k = 1 的一般 α' 形式来自本项目的量纲恢复（worldsheet.ddf-operators-v4 说明 (c)），文献均在 α' = 1/2 下工作。换算是初等的，但无逐字来源。"
  - "【v4 新增】目标陈述第 (2) 条的动量量词 p ≠ 0 **没有逐字来源**：候选来源（brower-thorn-1971 / goddard-thorn-1972 / brower-1972）都不讨论 p = 0 的退化情形。该量词来自 ms.no-ghost-theorem 第三轮审计的独立核算（p = 0 时 α^0_{-1}|0;0⟩ 对任意 D 都是负模物理态），以及 fgz-1986 Theorem 2.8 逐字的 p ≠ 0 条件（但 FGZ 那条是 D = 26 的正定性陈述，不是 D > 26 的负模陈述）。本推导第 (2) 条的纵向算子构造确实落在 p ≠ 0 上，但这一步同样只有本项目的核算，没有文献逐字。**2026-09-10 更新（ms.no-ghost-theorem 第四轮审计 A2(iii)/C3）**：(2) 的 p ≠ 0 有 L1 来源：worldsheet.no-ghost-theorem-subcritical（LZ 1991 Thm 3.5(ii) 反方向，(P2) ⇒ p ≠ 0）；本推导不依赖它。理由：本推导走纯 D 玻色子的 DDF / 纵向算子路线，LZ 走带补充模 L(26−D, 1−h) 的 BRST 相对上同调，是两条独立论证，故**不**把 lian-zuckerman-1991 并入本推导的 sources（一条推导一个论证）。也不另挂一条只支撑 (2) 的 v4 推导——一条推导须支撑整条目标陈述，而 LZ 不覆盖 v4 的 (1)。LZ 的完整论证已作为独立陈述节点 worldsheet.no-ghost-theorem-subcritical 在图中登记。**2026-09-11（四）更新：(2) 现由 Lean 直接给出见证。** worldsheet.negative-norm-physical-state-above-26（formalized，`Fock.exists_mem_physSubmodule_pairing_self_neg`，LevelTwo.lean，合并提交 c32f026）机器验证了：有序域上 D > 26、a = 1 时存在动量与 level-2 标量物理态使 ⟨ψ,ψ⟩ < 0，动量取在 α'k² = −1 的质量壳上（`Fock.exists_zeroModeSq_eq_neg_two`，需 D ≥ 2 与两个非零分量），故 α_0·α_0 = −2 ≠ 0，即 p ≠ 0。该卡已加为本推导的依赖。**仍未关闭的部分**：(a) 「p ≠ 0」这一步在 Lean 里是由 α_0·α_0 = −2 得到的两行推论，`exists_mem_physSubmodule_pairing_self_neg` 的结论本身没有把动量的非零性一并输出（见该卡推导的 gaps (i)）；(b) 文献侧的**逐字来源**仍然没有（Lean 见证是本仓库的构造，不是文献）；(c) 本推导自己的第 (2) 条论证（纵向算子构造）仍未形式化，Lean 走的是另一条路线。"
  - "【2026-09-11 新增，reviewer-ch4】**零态的两个定义在本推导里不是前提而是结论**：本推导商掉的 H_0（H_phys 的根基）与 worldsheet.ocq-spurious-states-v2（原 v1 已换代）的 N（物理态 ∩ 伪态）在 D = 26、a = 1 时相等，这一点**不需要单独假设**——它是 GT 分解（每个物理态 = DDF 态 + 伪态）、横向 DDF 空间上内积正定、以及 N ⊥ H_phys（worldsheet.spurious-orthogonal-to-physical）这三条的两行推论：设 ψ ∈ H_0，写 ψ = ψ_T + χ（χ 伪态），则对任意 DDF 态 φ 有 0 = ⟨ψ, φ⟩ = ⟨ψ_T, φ⟩，由横向正定得 ψ_T = 0，故 ψ = χ ∈ N；反向 N ∩ H_phys ⊆ H_0 就是 spurious-orthogonal-to-physical。因此不必为 H_0 ⊆ N 另立前提。注意 worldsheet.ocq-spurious-states-v2 与 worldsheet.spurious-orthogonal-to-physical 只证 N ⊆ H_0 这一半，反向那一半的论证在本推导内部（依赖 GT 分解），一般 (D, a) 下不成立。"
  - "【v4 新增】worldsheet.ddf-operators-v4 相对 v3 只改了参考方向的参数化（射线 → 去心直线），本推导的论证一字未变；此处登记以便日后追溯换代不影响论证强度。"
  - "【形式化进度 2026-09-11】Fock 空间（worldsheet.bosonic-fock-space）、Sugawara 构造与 c = D、老协变物理态条件、Virasoro 生成元的伴随 L_m^† = L_{−m}、以及指数顶点算子 :e^{i n k_0·X}: 的**振子部分**与 DDF **动量塔**（`formal/StringFormal/NoGhost/VertexOperator.lean`、`DDF.lean`，无 sorry，公理仅标准三条；合并提交 9691057）已在 Lean 中机器验证。**但本推导的两个核心步骤仍未形式化**：(i) DDF 算子 A^i_n = Σ_m α^i_m V^{(n)}_m 本身未定义，连带 [L_m, A^i_n] = 0 与 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0} 未证；(ii) 第 (1) 条的**张成定理**（\"塔上任意物理态 = DDF 态 + 零模态\"）未做。待办见 formal/TODO.md 的 `ddf-operators` 与 `ddf-spans` 两项。附带发现：横向性 ε·k_0 = 0 不只是使被积量成为权 1 primary 的条件，还是 A^i_n 的模态和在代数 Fock 空间上局部有限（从而 A^i_n 良定义）的必要输入；详见 worldsheet.ddf-operators-v4 的 notes【Lean 进展 2026-09-11】。"
  - "【2026-09-11 新增：DDF 拆卡后的诚实记账】worldsheet.ddf-operators-v4（definition, rigorous）被拆为 worldsheet.ddf-operators-v5（definition, rigorous）+ 三条命题。本推导第 (1) 条实际用到其中两条：**[L_m, A^i_n] = 0**（worldsheet.ddf-commute-with-virasoro）与 **[A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}**（worldsheet.ddf-transverse-oscillator-algebra）。两条的论证在文献里都是 OPE + 围道形变，来源（GSW §2.3.3 式号 L0、GT 1972 正文未获取）无一核实到式号，故各自的推导是 **physical-argument**。于是本推导虽仍标 rigorous，目标 worldsheet.no-ghost-theorem-v4 的 **effective 状态降为 physical-argument**。拆卡前这两条命题写在一张 rigorous 的定义卡的陈述文本里，因而被当作「定义的一部分」传播为 rigorous——那是记账错误，不是论证更强。本条把这一点显式登记，以免日后被误读为「无鬼定理曾经是 rigorous 后来退步了」。"
  - "【2026-09-11 新增】worldsheet.no-ghost-theorem-v4 的 **statement 文本**内两处引用 `worldsheet.ddf-operators-v4`（记号出处：F(p) 的零模约定、A^i_{-n} 的定义）。按根 CLAUDE.md 原则 1，已提交节点的 statement 文本不可变，故那两处**不改**；换代只在本推导的 depends_on 上做。读者应把那两处理解为指向 worldsheet.ddf-operators-v5（v4 的 statement 前半段与 v5 逐字相同，差别只是 v4 末段多两句代数断言，而那两句现由本推导显式依赖的两条命题承载）。里程碑 graph/milestones/no-ghost-theorem.yaml 的 canonical_text 与回译记录中提到 ddf-operators-v4 的地方同样未改（里程碑归 auditor）。"
  - "【2026-09-11 新增；2026-09-11（二）更新；2026-09-11（三）再更新】(A^i_n)† = A^i_{−n} 是第 (1b) 步「H^⊥(k) 的 Gram 矩阵是 24 个横向振子 Fock 空间的正定 Gram 矩阵」的必需输入（横向振子代数只给对易子，正定性还要伴随关系与真空归一化）。原文写的「**在本图中没有节点**」已过时：该命题现由 **worldsheet.ddf-operators-adjoint**（推导 --via-vertex-operator-adjoint，physical-argument）承载，并已加入本推导的 depends_on。**但缺口只是从「无节点」变成「有节点、论证仍弱」**：文献侧只有一句无证明的断言（GSW §2.3.3，式号 L0）。【（三）更新】其中的顶点算子伴随 V^{(n)}_J† = V^{(−n)}_{−J} 也**已有承载节点**：worldsheet.vertex-operator-adjoint（推导 --via-radial-conjugation，physical-argument），故「在本图中仍无承载节点」一句同样过时；仍未关闭的是它下面三条更基础的缺口——「:e^{i n k_0·X}: 在 k_0² = 0 时权为 0」无节点、「厄米共轭在径向量子化下作用为 z ↦ 1/z̄」无节点、指数算符两半的同点重排序无节点（现址：worldsheet.vertex-operator-adjoint--via-radial-conjugation 的 gaps 第 2、3、4 条）。Lean 侧 V(b)_J† = V(−b)_{−J} 同样未做，塔上的双线性型也未做（DDF.lean 全文 grep `pairing` 零命中，2026-09-11 curator 核），且当前只有 R-双线性型、无 sesquilinear 结构，故连实极化以外的情形都不覆盖。【（四）更新，2026-09-11】(1b) 里的另一半——「有了伴随关系与横向振子代数之后，Gram 矩阵**是什么**」——现由 **worldsheet.transverse-ddf-fock-gram-matrix**（推导 --via-oscillator-recursion，status rigorous，条件命题，reviewer 复核待补）承载，已加入本推导的 depends_on。这一半此前是 worldsheet.ddf-operators-adjoint 陈述的第 (2) 条，混在一张 physical-argument 的卡里，看不出「递推本身是严格的、只有前件不严格」。**本推导的 effective 不变**（仍被两条 DDF 对易关系与伴随关系封顶为 physical-argument）；改动的只是可审计性。【（五）更新，2026-09-12】本条的绝大部分已消解：(i) 伴随关系现由 **worldsheet.ddf-operators-adjoint-v2** 承载且为 **formalized**（`Fock.towerPairing_ddfOp_left`，VertexAdjoint.lean，fb006f5），本推导的这条依赖已改指 v2；(ii) 其上游 worldsheet.vertex-operator-adjoint 同为 formalized（`Fock.towerPairing_towerVertex_left`）；(iii) 上面列的三条更基础缺口中，**「指数算符两半的同点重排序」这一条不是被补上而是被证明为虚构的**——伴随把正规序的 E₋(b)E₊(b) 送成 E₊(b)†E₋(b)† = E₋(−b)E₊(−b)，本身即正规序，无换序、无 c-数因子、**不需要 k_0² = 0**；另两条（指数权为 0、径向共轭 z ↦ 1/z̄）**仍是** physical-argument，但它们只出现在旧推导 --via-radial-conjugation 的路线上，**不在** formalized 路线上，故不再压低本推导。(iv)「塔上的双线性型也未做」已过时：`Fock.towerPairing` 已在 TowerPairing.lean 中（momentum-tower-fock-space 现为 formalized）。**仍未消解的只有「R-双线性、无 sesquilinear 结构」**：Lean 侧的「†」是双线性型的转置，而无鬼定理断言的是 Hermitian 形式的半正定性；这条现址是 worldsheet.ddf-operators-adjoint-v2--via-lean 的 gaps