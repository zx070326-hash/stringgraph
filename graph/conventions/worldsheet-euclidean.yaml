id: conv.worldsheet-euclidean
family: worldsheet-signature
title: 世界面号差：欧氏（g_ab 正定，S_P 前因子 +1/4πα'）
definition: |
  世界面度规取**欧氏**号差 (+,+)，记作 g_{ab}，g ≡ det g_{ab} > 0，体积元 g^{1/2} d^2σ。
  Polyakov 作用量写作
    S_P^E[X, g] = + (1/(4π α')) ∫_M d^2σ  g^{1/2} g^{ab} ∂_a X^μ ∂_b X_μ,
  路径积分权重是 e^{-S_P^E}（不是 e^{iS}）。本约定是 Polchinski Vol.1 **第 2 章起**（CFT、
  Polyakov 路径积分、Weyl 反常、鬼场）的默认，故取为本 family 的 canonical。

  ── Wick 旋转字典（洛伦兹 conv.worldsheet-lorentzian → 欧氏，本节点） ──
  世界面坐标 (σ^0, σ^1) = (τ, σ) 连续到 (σ^1, σ^2)，取
    σ^2 = i σ^0    （等价地 σ^0 = -i σ^2，即 τ = -i σ^2）。
  于是逐项：
    (a) 度规与体积元：  γ_{ab}（号差 (-,+)，γ = det γ < 0）→ g_{ab}（号差 (+,+)，g > 0），
        (-γ)^{1/2}  ↔  g^{1/2}；平坦情形 γ_{ab} = diag(-1, +1) ↔ g_{ab} = δ_{ab}。
    (b) 导数与测度：  ∂_0 = i ∂_2，  dσ^0 = -i dσ^2，  ∫ dσ^0 dσ^1 = -i ∫ dσ^1 dσ^2。
    (c) 作用量与前因子：把 (a)(b) 代入洛伦兹作用量
          S_P^L = -(1/(4π α')) ∫ dσ^0 dσ^1 (-γ)^{1/2} γ^{ab} ∂_a X^μ ∂_b X_μ
        得  S_P^L = i S_P^E，  其中 S_P^E 如上式（前因子由 -1/4πα' 变为 +1/4πα'）。
        因此权重 e^{i S_P^L} = e^{- S_P^E}。
        **口诀：号差翻转的同时作用量整体反号**，两处符号变化都必须做，只做一处会差一个整体负号。
    (d) 与复坐标的接口（conv.worldsheet-complex-coords）：取 z = σ^1 + i σ^2，
          δ^{ab} ∂_a X ∂_b X = (∂_1 X)^2 + (∂_2 X)^2 = 4 ∂X ∂̄X,
          d^2 z = 2 dσ^1 dσ^2   （即 d^2σ ≡ dσ^1 dσ^2 = (1/2) d^2 z）。
        于是平坦（共形规范）下
          S_P^E = (1/(4π α')) ∫ d^2σ δ^{ab} ∂_a X^μ ∂_b X_μ
                = (1/(2π α')) ∫ d^2 z  ∂X^μ ∂̄X_μ,
        这正是 worldsheet.free-scalar-cft-action 的形式。使用 (d) 的节点必须同时声明
        conv.worldsheet-complex-coords，因为 d^2 z = 2 dσ^1 dσ^2 的 Jacobian 约定进入前因子。
        ⚠ 本节点开头的 g ≡ det g_{ab} > 0 **只在实坐标基 (σ^1, σ^2) 下成立**：转到 (z, z̄) 基后
        g_{zz̄} = g_{z̄z} = 1/2、g_{zz} = g_{z̄z̄} = 0，det g_{ab} = −1/4 < 0，体积元须写
        (−g)^{1/2} = 1/2（schrans-2020 笔记 [2.9]–[2.10]，L1；Polchinski 原文是否这样写未核实）。
        欧氏号差指的是实基下的正定性，不是任意基下行列式的符号。

  ⚠ 本 family 只管**世界面**号差，与时空号差（family `metric`，conv.metric-mostly-plus）
  完全独立：本图第 2–3 章的节点同时是「世界面欧氏 + 时空 mostly-plus 洛伦兹」，
  即靶空间仍是洛伦兹的，X^0 的动能项仍带 η_{00} = -1 的相反符号
  （这正是 worldsheet.free-scalar-cft-action 里「作用量对实洛伦兹型靶空间不正定」那句话的来源）。
canonical: true
sources:
  - ref: polchinski-1998-v1
    loc: "§2.1, p.32，(2.1.1) 下方正文（无式号）：\"in the first seven sections all equations make sense if σ² is replaced with iσ⁰\"；欧氏约定（作用量整体变号）本身见 **Appendix A, eq. (A.1.31), p.335**（逐字是 S_E 的定义式，**不是** e^{iS_L} = e^{−S_E}，见下方 2026-09-11 note）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——Q10 关闭，本条 note 取代旧的
      「[S] 与 [H] 都查不到 ⇒ 不要当成已核实」判断】

      原书 p.32，§2.1，(2.1.1) 正下方那一段，逐字：
        "This is the Polyakov action (1.2.13), except that the world-sheet metric γ_ab has been
         replaced with a flat Euclidean metric δ_ab, signature (+,+). **The overall sign change of
         the action is a result of the Euclidean convention (A.1.31).** As we will see, most string
         calculations are carried out on a Euclidean world-sheet. At least for flat metrics, the
         relation between Euclidean and Minkowski amplitudes is given by a standard analytic
         continuation, explained in the appendix. In fact, the results of the present chapter apply
         equally to a Minkowski world-sheet, and **in the first seven sections all equations make
         sense if σ² is replaced with iσ⁰**. For the index μ we still take the flat Minkowski metric."

      第二处，p.34，(2.1.13a,b) 正上方，逐字：
        "**Under the Minkowski continuation σ² = iσ⁰**, a holomorphic field becomes a function only
         of σ⁰ − σ¹ and an antiholomorphic field a function only of σ⁰ + σ¹."

      三点结论（替代此前的 negative evidence 判断）：
      (1) **σ² = iσ⁰ 确实在原书里**，但从来不是式子（两处都是散文，无式号），
          且**方向与本节点的字典相反**：Polchinski 的行文是「本章是欧氏的；若要闵氏，
          把 σ² 换成 iσ⁰」，不是「把闵氏 Wick 旋转到欧氏」。本节点字典 (b)(c) 仍是
          curator 补出的换算，方向自洽，但**不得声称是原书逐字**。
      (2) **e^{iS_L} = e^{−S_E} 不在 §2.1**。原书把「作用量整体变号」的依据外包给
          **Appendix A, eq. (A.1.31)**（逐字 "the Euclidean convention (A.1.31)"）。
          这是本条唯一的硬式号锚点。**(A.1.31) 本身本项目尚未取页**（Appendix A 是 pp.329–346），
          是一条低成本后续任务，见 §12.10 表 D 第 1 项。
      (3) **另一个必须分开的 Wick 旋转**（p.34，(2.1.14) 正下方，逐字）：
            "The path integral over X⁰ is a wrong-sign Gaussian, so it should be understood to be
             defined by the **analytic continuation X⁰ → −iX^D**."
          这是**时空**方向的解析延拓，与世界面的 σ² = iσ⁰ 是两件不同的事，本节点不包含它。

      措辞等级由 L0 升到 **L1**。旧 note 中「检索后端把 σ²=iσ⁰ 溯源到 Tong 是循环佐证」
      的警告仍然有效（正确出处就是上面 p.32/p.34 两处）。
      见 literature/extractions/polchinski-1998-v1.md §12.1（Q10）与 §12.10 表 B 第 2 项。
  - ref: polchinski-1998-v1
    loc: "**★ 本约定在原书里的一手落点：§3.2, p.82 开篇（(3.2.1) 之上，无式号）逐字：\"We make one change from chapter 1: **the Minkowskian world-sheet metric `γ_ab` is replaced with a Euclidean world-sheet metric `g_ab(σ¹,σ²)`, of signature `(+,+)`**. The integral runs over all Euclidean metrics and over all embeddings `X^μ(σ¹,σ²)` of the world-sheet in Minkowski spacetime:\"，紧接 **(3.2.1)** `∫ [dX dg] exp(−S)`、**(3.2.2)** `S = S_X + λχ`、**(3.2.3a)** `S_X = (1/4πα') ∫_M d²σ g^{1/2} g^{ab} ∂_a X^μ ∂_b X_μ`**"
    note: |
      **【2026-09-11 新增（curator-v1-sec15，researcher 第九轮 ch.3 页图，印刷 p.82–83，L1）】**
      本条是本约定此前**空着的那个 loc**：§13.1 已把 (A.1.31) 排除为本约定的出处
      （(A.1.31) 是 `S_E` 的定义式，讲的是单自由度量子力学的欧氏作用量，不是世界面号差），
      本轮补上正确的一条 —— **世界面号差由闵氏改欧氏这件事，原书是在 §3.2 开篇一句散文里宣布的**
      （无式号），逐字见上方 loc。

      同时关闭两条旧记账：
      1. **「权重写成 e^{−S} 而非 e^{iS} 未逐字核实」**（本卡上一条 source 的 note 末句）
         **现已核实**：**(3.2.1) 逐字就是 `∫ [dX dg] exp(−S)`**（p.82），L1。
      2. **欧氏 Polyakov 作用量的式号与前因子确认**：(3.2.3a) 逐字 `S_X = (1/4πα') ∫_M d²σ
         g^{1/2} g^{ab} ∂_a X^μ ∂_b X_μ`，与本卡 definition 里的 `S_P^E` **前因子 +1/(4πα')
         与 `g^{1/2}` 写法逐字一致**（此前只经 schrans-2020 目录核实式号）。

      ★★ **本轮最重要的一条：原书自陈的强度（三处逐字，p.82–83）**，
      它决定任何「欧氏世界面路径积分 = 闵氏振幅」为前提的链的状态上限：
      (i) p.82："We will take the Euclidean theory (3.2.1) as our starting point … **However, let us
          give a brief formal argument that it is equivalent to the Minkowski theory with which we
          began.**"
      (ii) p.83："The same procedure works for the Polyakov action if we write the metric in terms of
          a tetrad, `γ_ab = −e⁰_a e⁰_b + e¹_a e¹_b`, and make the same rotation on `e⁰_a`.
          **This provides a formal justification for the equivalence of the Minkowski and Euclidean
          path integrals.¹ It has been shown by explicit calculation that they define the same
          amplitudes, respectively, in the light-cone and conformal gauges.**"
          ⚠ "It has been shown" 是**被动、无引文**（第 3 章正文不带引文，见 §13.3(f)）。
      (iii) **脚注 1（p.83）逐字**："In more than two dimensions, things are not so simple because the
          Hilbert action behaves in a more complicated way under the rotation. No simple rotation
          damps the path integral. **In particular, the meaning of the Euclidean path integral for
          four-dimensional gravity is very uncertain.**"
      ⇒ **在本书里，世界面欧氏化的地位是 "a brief formal argument" / "a formal justification"**，
      与 §13.1 记的 App. A 一线（Wick 旋转的真论证只对单自由度 QM 做过，且路径积分公式本身
      "rather heuristically"）完全一致。**凡跨本 family 的 convention_map、以及任何断言
      「欧氏路径积分 = 闵氏振幅」的命题卡，其自身状态封顶 `physical-argument`**，
      且脚注 1 说明这条论证在二维以上根本不成立（不是本图的判断，是作者写的）。
      见 literature/extractions/polchinski-1998-v1.md §15.1(a)(c)(d)。
  - ref: polchinski-1998-v1
    loc: "§3.3（p.87–89）：Faddeev–Popov 手续 (3.3.16)/(3.3.18)/(3.3.21)/(3.3.24) 全在欧氏号差、度规记号 g_{ab} 下进行（式号经 schrans-2020 目录核实）"
    note: |
      §3.3 的 FP 手续是本约定在第 3 章被使用的直接证据。
      ~~**权重写成 e^{-S} 而非 e^{iS} 这一点在本图未逐字核实原书措辞。**~~
      **【2026-09-11 作废，已核实】(3.2.1) 逐字 `∫ [dX dg] exp(−S)`，p.82，L1**——见上一条 source。
  - ref: polchinski-1998-v1
    loc: "**Appendix A §A.1「Bosonic fields」，斜体小标题 *Euclidean path integrals* 之下，p.335**：闵氏拉氏路径积分权重 exp[(i/ħ)∫dt L] 是 **(A.1.14)**（p.331）；欧氏路径积分 = ∫[dq] exp[∫₀^U du L(q, i∂_u q)] 是 **(A.1.30)**（p.335）；`S_E = ∫du L_E(q, ∂_u q) = −∫du L(q, i∂_u q)` 是 **(A.1.31)**（p.335）。**本约定 definition 段 (c) 里的 e^{iS_P^L} = e^{−S_P^E} 是这三式的合成，原书没有把它写成任何一个式子。**"
    note: |
      【原书核实 2026-09-11（researcher 第七轮，L1 页图逐字，App. A pp.329–338 读毕）——
      **部分推翻本卡此前的表述：(A.1.31) 不是 `e^{iS_L} = e^{−S_E}`**】

      (A.1.31) 的逐字上下文（p.335）：
        "The weight in the Euclidean path integral is **conventionally defined to be** `exp(−S_E)`,
         so the Euclidean action contains a minus sign,
             `S_E = ∫ du L_E(q, ∂_u q) = − ∫ du L(q, i∂_u q) .`   (A.1.31)
         Euclidean path integrals are usually the more well-defined, because the exponential of the
         action is damped rather than oscillatory. The Minkowski matrix elements can then be obtained
         by analytic continuation."

      三条硬结论：
      1. **(A.1.31) 是 `S_E` 的定义式**，不是 `e^{iS_L} = e^{−S_E}`。「权重是 exp(−S_E)」是式子上方的
         **散文**，且原书用词是 "**conventionally defined to be**"（约定如此定义），不是「可以证明等于」。
      2. **`e^{iS_L} = e^{−S_E}` 这个等式在原书里根本不存在。** 它只有把 **(A.1.14)**（闵氏权重
         exp[(i/ħ)∫dt L]，p.331）+ **(A.1.30)**（欧氏权重逐字写作 `exp[∫₀^U du L(q, i∂_u q)]`，
         指数上**没有 −S_E 字样**，p.335）+ **(A.1.31)** 三者串起来才成立。
         **这个串接是本项目做的，不是原书的任何一行。** 本卡 definition 段 (c) 末句
         「因此权重 e^{i S_P^L} = e^{- S_P^E}」按项目原则 1 不改文本，在此记账为
         **合成结论（相当于 inferred: true）**，凡引用该句的节点须知其来源是三式合成。
      3. **Wick 旋转在原书里的方向是 `t = −iu`，不是 `σ² = iσ⁰`。** p.335 逐字：
         "**Taking the times to be purely imaginary, `t = −iu` for real `u`, defines the *Euclidean*
         amplitudes**"。`t = −iu`（App. A）与 `σ² = iσ⁰`（§2.1）方向一致（u = it），
         但**原书从未把这两个记号并排写出**，两者的桥接同样是本项目的推断。

      ★ **本轮新记的两条作者自承缺口（都直接封顶任何以路径积分为根的链）**：
      (i) **Wick 旋转的真论证只对单自由度量子力学做过。** p.335，(A.1.27)–(A.1.29) 之间逐字：
          "…one only encounters `exp(−iHΔt)` for positive `Δt`. Now continue analytically by uniformly
           rotating all times in the complex plane, `t → e^{−iθ}t` for any phase `0 ≤ θ ≤ π`. The real
           part of the exponent is `−E sinθ Δt`, where `E` is the energy of the intermediate state.
           **Because the Hamiltonian is bounded below for a stable system**, the sum over intermediate
           states is safely convergent and no singularities are encountered — the continued amplitude
           is well defined."
          即论证依赖「**H 下有界**」这条假设，且**是对单自由度量子力学做的**；
          **原书没有说它对世界面 CFT / 弦 S-矩阵也成立。** 本卡 notes 末段那条
          「Wick 旋转在路径积分层面的合法性本图完全没有节点」的警告因此**得到原书侧的确认**，
          且现在知道原书能给的最强的东西是什么。
      (ii) **路径积分公式本身的推导是 heuristic 的。** p.332 逐字：
          "The derivation of the path integral formula treated the continuum limit `ε → 0`
           **rather heuristically**. Renormalization theory is the study of this limiting process,
           and is rather well understood."
          同页还有："**Actually, we will evaluate explicitly only a few Gaussian path integrals.**
           We use the path integral primarily to derive some general results, such as operator
           equations and sewing relations."
          ⇒ **凡以「Polyakov 路径积分」为根的链，其根部状态封顶 `physical-argument`，作者明说。**
          （本卡是 convention，不参与状态传播；这两条记在这里是因为它们是同一段附录的内容，
          真正受影响的是 worldsheet.string-s-matrix 等以路径积分为根的命题卡。）

      ⚠ ~~**本轮未读 App. A pp.339–346**（§A.2 起，推测费米场/Grassmann）。~~
      **【2026-09-11 关闭（curator-v1-sec15）】App. A pp.339–346 已由 researcher 第九轮读毕**：
      §A.2 是 Grassmann（Berezin）积分与费米路径积分，**确实不含任何世界面号差内容**，
      对本约定无新增；它给出的是一般费米测度 (A.2.24)–(A.2.27) 与两条作者自承缺口
      （行列式符号手工固定、宇称不对称时相位不确定），落点见 math.berezin-integral 与
      worldsheet.genus-g-ghost-path-integral。
      见 literature/extractions/polchinski-1998-v1.md §13.1(a)(b)(c)(d)(e) 与 §15.2。
  - ref: schrans-2020
    loc: "目录条目 2.1–2.4（p.33）、3.7–3.10（p.88–89）：公式号的核对来源，非内容来源"
notes: |
  由 curator 于 2026-09-10 新建，起因是 worldsheet.conformal-gauge-fixing--via-local-frame
  与 worldsheet.faddeev-popov-ghost-action--via-fp-procedure 两条推导的 gaps 都明确记录了
  「洛伦兹 → 欧氏世界面的转写没有节点……建议 lead/auditor 决定是否新建
  conv.worldsheet-signature-euclidean 一族」。本 family 即此。

  取欧氏为 canonical 的理由：本图当前的重心（CFT、Virasoro、BRST、Weyl 反常、无鬼定理）
  全部在欧氏世界面上；第 1 章的洛伦兹号差只覆盖经典作用量与光锥量子化。
  docs/CONVENTIONS.md 原写「欧氏号差用于 CFT 陈述，洛伦兹号差用于光锥量子化陈述，各自显式标注」，
  没有指定 canonical；本节点按「一个 family 恰好一个 canonical」的 schema 要求取欧氏，
  这**不表示**洛伦兹写法是错的，只表示跨号差的边由 convention_map 承担换算。

  ⚠ 未建节点的物理内容：Wick 旋转在**路径积分层面**（而不只是作用量层面）的合法性
  ——测度 DX 的连续、洛伦兹与欧氏关联函数的 Osterwalder–Schrader 型对应、
  以及一般（非静态、非解析）世界面上「σ^2 = i σ^0」是否有整体意义——本图完全没有节点，
  也不在 Polchinski 的论证范围内。凡跨本 family 的 convention_map 都继承这一缺口，
  因此跨号差的推导一律不高于 physical-argument。

  **2026-09-11（curator-v1-locs，原书核实落地）**：definition 第 31–34 行括注里
  「Polchinski 原文是否这样写未核实」这句现已可撤销：原书 (2.1.6) 逐字给出分量表
  g_{zz̄} = g_{z̄z} = 1/2、g_{zz} = g_{z̄z̄} = 0、g^{zz̄} = g^{z̄z} = 2（L1，抽取记录 §12.1）。
  按不可违背原则 1 不改 definition 文本，此处记账：该括注中的「未核实」现为**已核实**，
  且注意**原书给的是分量表，不是 [S] 写的 ds² = dz dz̄**。
  另：上面 sources 第二条（§3.2–§3.3）里「权重写成 e^{-S} 而非 e^{iS} 未逐字核实」这句
  **仍然成立**——第 3 章的路径积分权重措辞未取页。

  **2026-09-11（curator-v1-sec13，§13.1 落地）**：Appendix A 已取页，(A.1.31) 逐字到手，
  结论是它**不是** `e^{iS_L} = e^{−S_E}`，而是 `S_E` 的定义式；旧 note (2) 里
  「(A.1.31) 本身本项目尚未取页」这句现已作废。**definition 段 (c) 末句的那个等式，
  以及 (b) 的 σ² = iσ⁰ ↔ t = −iu 桥接，都是本项目的合成/推断，不是原书逐字**——
  详见上方新增的 Appendix A sources note。凡跨本 family 的 convention_map 除继承本卡
  notes 已列的缺口外，还继承那条 note 里记的两条作者自承缺口
  （Wick 旋转只对单自由度 QM 有真论证；路径积分连续极限 "rather heuristically"）。
