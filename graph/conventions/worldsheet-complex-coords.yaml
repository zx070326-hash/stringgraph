id: conv.worldsheet-complex-coords
family: worldsheet-complex-coords
title: 欧氏世界面复坐标与面积元 d^2 z = 2 dσ^1 dσ^2
definition: |
  欧氏世界面上取复坐标
    z = σ^1 + i σ^2,  z̄ = σ^1 - i σ^2,
    ∂ ≡ ∂_z = (1/2)(∂_1 - i ∂_2),  ∂̄ ≡ ∂_z̄ = (1/2)(∂_1 + i ∂_2)。
  复度规 g_{zz̄} = g_{z̄z} = 1/2，g_{zz} = g_{z̄z̄} = 0；指标升降 v^z = g^{zz̄} v_z̄ = 2 v_z̄。
  面积元取 Jacobian 为 2 的约定
    d^2 z ≡ 2 dσ^1 dσ^2,
  相应地 delta 函数归一化为
    ∫ d^2 z  δ^2(z, z̄) = 1,  即 δ^2(z, z̄) = (1/2) δ(σ^1) δ(σ^2)。
  在此约定下二维 Laplace 算子的基本解写成 ∂ ∂̄ ln|z|^2 = 2π δ^2(z, z̄)。

  ⚠ 与常见的 d^2 z = dσ^1 dσ^2（Jacobian 取 1）约定相差因子 2，
  会直接改变 ∂∂̄ ln|z|^2 = 2π δ^2 中的 2π、传播子归一化以及作用量前因子。
  凡使用这些公式的节点必须声明本约定。
canonical: true
sources:
  - ref: polchinski-1998-v1
    loc: "§2.1, eq. (2.1.2)（复坐标）、(2.1.3)（复导数）、(2.1.6)（复度规）、(2.1.7)（Jacobian d^2 z = 2 dσ^1 dσ^2）"
  - ref: schrans-2020
    loc: "目录条目 2.1–2.4（p.33）：上述四个公式号的核对来源，非内容来源"
notes: |
  由 curator 于 2026-09-10 从抽取记录 polchinski-1998-v1 E25 建立。
  四个公式号经第三方伴读笔记 schrans-2020 的目录逐条核实（`2.1–2.4 p 33`），
  但**未核对原书**，见 literature/extractions/polchinski-1998-v1.md 第 0 节与 Q9。
  本 family 目前只有一个节点；若日后引入 d^2 z = dσ^1 dσ^2 的文献（如部分 CFT 综述），
  应新建一个 canonical: false 的兄弟节点并写清换算。
