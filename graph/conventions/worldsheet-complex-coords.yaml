id: conv.worldsheet-complex-coords
family: worldsheet-complex-coords
title: 欧氏世界面复坐标与面积元 d^2 z = 2 dσ^1 dσ^2
definition: |
  欧氏世界面上取复坐标
    z = σ^1 + i σ^2,  z̄ = σ^1 - i σ^2,
    ∂ ≡ ∂_z = (1/2)(∂_1 - i ∂_2),  ∂̄ ≡ ∂_z̄ = (1/2)(∂_1 + i ∂_2)。
  复度规 g_{zz̄} = g_{z̄z} = 1/2，g_{zz} = g_{z̄z̄} = 0；指标升降 v^z = g^{zz̄} v_z̄ = 2 v_z̄。
  面积元取 Jacobian 为 2 的约定
    d^2 z ≡ 2 dσ^1 dσ^2,
  相应地 delta 函数归一化为
    ∫ d^2 z  δ^2(z, z̄) = 1,  即 δ^2(z, z̄) = (1/2) δ(σ^1) δ(σ^2)。
  在此约定下二维 Laplace 算子的基本解写成 ∂ ∂̄ ln|z|^2 = 2π δ^2(z, z̄)。

  ⚠ 与常见的 d^2 z = dσ^1 dσ^2（Jacobian 取 1）约定相差因子 2，
  会直接改变 ∂∂̄ ln|z|^2 = 2π δ^2 中的 2π、传播子归一化以及作用量前因子。
  凡使用这些公式的节点必须声明本约定。
canonical: true
sources:
  - ref: polchinski-1998-v1
    loc: "Notation, p. xviii（逐字：d²z ≡ 2 dx dy, δ²(z,z̄) ≡ ½ δ(x)δ(y)，并自陈「these differ from most of the literature, where the coefficient is 1 in each definition」）；§2.1 eq. (2.1.2)（复坐标）、(2.1.3)（复导数）、(2.1.6)（复度规分量表）、(2.1.7)（d²z = 2 dσ¹dσ²，且 d²z|det g|^{1/2} = dσ¹dσ²）、(2.1.8)（∫d²z δ²(z,z̄) = 1，故 δ²(z,z̄) = ½δ(σ¹)δ(σ²)）；p.33 脚注 1"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）——本条取代先前所有「未核对原书」的限定】

      (1) **前言 p. xviii 的 δ 函数约定确实存在，且逐字如上**（Notation 是独立的 pp. xviii–xx，
          不是 Preface pp. xv–xvii）。原书自陈与多数文献差因子 2，这正是本节点 definition 的
          ⚠ 段落所记的内容，现有一手依据。
      (2) **(2.1.8) 这个式号现予恢复**：先前 reviewer-ch23 因核对源目录无此条而撤回，
          本轮页图确认 (2.1.8) 就是 `∫d²z δ²(z,z̄) = 1`（故 δ²(z,z̄) = ½δ(σ¹)δ(σ²)）。
      (3) **p.33 脚注 1 是第三个锚点**，逐字：
            "This differs from much of the literature, where d²z is defined as dσ¹dσ².
             **Correlated with this, the ½ is omitted from the definition of δ²(z,z̄).**"
      (4) (2.1.2)/(2.1.3)/(2.1.6)/(2.1.7) 四式全部 L1 确认；其中 **(2.1.6) 原书给的是分量表
          `g_{zz̄} = g_{z̄z} = ½, g_{zz} = g_{z̄z̄} = 0, g^{zz̄} = g^{z̄z} = 2`，不是 [S] 写的 ds² = dz dz̄**。
      (5) (2.1.24) `∂∂̄ ln|z|² = 2πδ²(z,z̄)` 亦 L1 确认，与本约定的两个因子 2 自洽
          （见 worldsheet.laplacian-log-contact-term）。

      §12.10 表 B 第 4 项建议新建一条 `family: complex-coordinate-measure` 的约定；
      **本次不新建**：其内容（d²z ≡ 2dxdy 与 δ² ≡ ½δδ）已完整落在本节点的 definition 里，
      拆开会产生两个必须同时声明的约定（与 lead 2026-09-10 的裁决一致，见下方 notes）。
      见 literature/extractions/polchinski-1998-v1.md §12.9、§12.1（E25/E26）与 §12.10 表 B 第 4 项。
  - ref: schrans-2020
    loc: "目录条目 2.1–2.4（p.33）：上述公式号的核对来源；§2.2（p.43）复导数、§2.4（p.44）d^2 z = 2dσ^1dσ^2、§2.6（p.45）delta 归一化与 (2.1.24) 的显式验算。均为核对源，非内容来源"
notes: |
  由 curator 于 2026-09-10 从抽取记录 polchinski-1998-v1 E25 建立。
  四个公式号经第三方伴读笔记 schrans-2020 的目录逐条核实（`2.1–2.4 p 33`），
  但**未核对原书**，见 literature/extractions/polchinski-1998-v1.md 第 0 节与 Q9。
  本 family 目前只有一个节点；若日后引入 d^2 z = dσ^1 dσ^2 的文献（如部分 CFT 综述），
  应新建一个 canonical: false 的兄弟节点并写清换算。

  **2026-09-10（curator-laplace-source）**：definition 里 δ^2(z,z̄) = (1/2) δ(σ^1) δ(σ^2) 这一行
  原已写出，本次只订正其来源标注（撤回未核实的式号 (2.1.8)，改标前言 p. xviii + (2.1.7)）。
  这一行是 worldsheet.laplacian-log-contact-term 右端 2π 系数的支点之一：
  它与 (2.1.3) 的 ∂∂̄ = Δ/4 一起，把 Lieb–Loss Thm 6.20 的 Δ ln|x| = 2π δ(σ^1)δ(σ^2)
  换成 ∂∂̄ ln|z|^2 = 2π δ^2(z,z̄)。**两个因子 2 缺一不可**：若把 δ^2 误当作 δ(σ^1)δ(σ^2)，
  系数会变成 π。凡涉及 (2.1.24)、XX 传播子归一化、α' 因子的节点都吃这条约定。
  按 lead 裁决**不**新建 family: delta-normalization 的独立约定节点（researcher §5.1 曾建议新建），
  理由：本节点的 definition 已把 d^2 z 与 δ^2 绑成一套，拆开会产生两个必须同时声明的约定，
  反而更容易漏声明。若日后引入 d^2 z = dσ^1 dσ^2 的文献，再按本 family 加 canonical: false 的兄弟节点。
