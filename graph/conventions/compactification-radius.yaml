id: conv.compactification-radius
family: compactification-radius
title: 环面紧化半径 R 的归一化（X ≅ X + 2πR，绕数 w，对偶半径 α'/R）
definition: |
  一维环面紧化取紧化坐标的周期为 2πR：
    X^{25}(σ) ≅ X^{25}(σ) + 2πR,
  即 R 是**坐标半径**（与 √α' 同量纲），环面的周长为 2πR。由此：
    - 紧化方向的动量本征值取 p = n/R（n ∈ Z）；
    - 闭弦允许绕数扇区 X^{25}(σ^1 + 2π, σ^2) = X^{25}(σ^1, σ^2) + 2πRw（w ∈ Z），
      绕数对左右行动量的贡献取 wR/α'；
    - 对偶半径记 R' ≡ α'/R；自对偶半径是 R = √α'。
  k 维紧化时紧化坐标为 X^m（m = 1..k），周期性由 X^m ≅ X^m + 2πR n^m（n^m ∈ Z）给出，
  R 是各方向共用的整体尺度；环面的形状与体积由度规 G_{mn} 与反对称张量 B_{mn} 承载
  （见 compact.narain-lattice）。

  **无量纲半径 r**：本图在 Narain 格的一维例子中使用
    r ≡ R (2/α')^{1/2},   于是  ℓ_L = n/r + w r/2,  ℓ_R = n/r − w r/2,
  自对偶点 R = √α' 对应 r = √2。
canonical: true
sources:
  - ref: polchinski-1998-v1
    loc: "§8.1, eq. (8.1.5)（p = n/R）；§8.2, eq. (8.2.3)（绕数边界条件）、(8.2.7)（k_L, k_R）；§8.3（R ↔ α'/R 与 R = √α'）"
    note: |
      抽取记录 literature/extractions/polchinski-1998-v1.md#E115/#E120/#E122，证据等级 L1
      （Schrans 伴读笔记页图；L1 只保证「Schrans 确实这么写」，不保证原书逐字）。
      ⚠ (8.2.2)（弦上的动量量子化）与 (8.2.3)（绕数边界条件）的式号只有 Schrans 正文的
      交叉引用锚定，其目录无独立条目（抽取记录 §10）。
notes: |
  由 curator 在转写 Polchinski 第 8 章时新增（2026-09-11）。
  本 family 只有一个成员：它记录的是「R 是坐标半径、动量 n/R、绕数项 wR/α'」这一整套
  归一化选择，与「用无量纲半径 r」或「用 α' = 2 单位」的写法互斥。

  ⚠ 无量纲半径的换算 r = R(2/α')^{1/2} 是 curator 由 ℓ = (α'/2)^{1/2} k 与 (8.4.26) 反解
  得到的（两行代数），**任何来源都没有逐字给出这个换算式**；抽取记录 #E141 只给出
  「一维时（用无量纲半径 r）ℓ_L = n/r + wr/2」而不说明 r 与 R 的关系。
