id: conv.metric-mostly-plus
family: metric
title: 度规号差 mostly-plus
definition: |
  时空度规号差取 (-,+,+,...,+)。Polchinski 全书约定。
canonical: true
sources:
  - ref: polchinski-1998-v1
    loc: "Notation, p. xviii（逐字：\"This book uses the +++ conventions of Misner, Thorne, and Wheeler (1973). In particular, the signature of the metric is (− + + … +).\"）"
    note: |
      【原书核实 2026-09-11（researcher 第六轮，L1 页图逐字）】
      本条原写「前言 Conventions 表」，位置不准：本书的 Preface 是 pp. xv–xvii，
      **Notation 是独立的 pp. xviii–xx**，MTW 号差声明在 p. xviii 第一段。
      见 literature/extractions/polchinski-1998-v1.md §12.9 与 §12.10 表 B 第 1 项。
      同段还声明「the constants ħ and c are set to 1, but the Regge slope α' is kept explicit」，
      是 conv.alpha-prime-regge 的一手依据（见该节点）。
      引用版本锚定：Cambridge Books Online 数字化本（© 1998, 2005，即 2005 平装、含 2000 年 corrections）。
