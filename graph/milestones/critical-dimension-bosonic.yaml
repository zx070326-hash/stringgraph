            statement 里没有这条前提，它把 a 当作 Δ_n 中的自由参数。若 a 已由前提固定为 (D−2)/24，
            则 Δ_n = n(26−D)/12，闭合 ⟺ D = 26，a = 1 是随之而来的推论，"同时定出 D 与 a"的
