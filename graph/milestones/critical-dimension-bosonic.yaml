canonical_source:
  ref: polchinski-1998-v1
  loc: |
    §4.1（旧协变量子化），p.121–125。选它的理由：原书中**有两处**各自由一条连贯的分析同时定出
    a = 1 与 D = 26——§4.1（OCQ 零态分析）与 §1.3（光锥，结论式 (1.3.40), p.23，A = −1 与 D = 26
    写在**同一式**里）——本里程碑取 §4.1，理由见下（此前写「§4.1 是唯一同时定出二者的位置」，
    据第一轮审计 B2 于 2026-09-11 改正）。
    **【2026-09-11 原书核实后的取舍理由更新】**第一轮写的取舍理由是「§4.1 的式号核实等级更高
    （§1.3 只有页码核实、式号未核实）」——该理由**已作废**：§1.3 的结论式经原书核实为 (1.3.40),
    p.23（L1）。现在的取舍理由改为**论证的自陈严格程度**：原书 p.21 对光锥路线逐字自陈
    「we will try to show that the result is **plausible without a complete treatment**」，
    p.24「We will show this **indirectly** in the coming chapters」，p.90 又称 §1.3 是
    「rather **heuristically**」；而 §4.1 的 OCQ 零态分析是原书自己承诺的「honest」路线。
    注意本文件 (I) 里「四条路线中唯一同时定出 D 与 a 的一条」指的是**图内的四条路线**，
    与这里说的**原书位置**不是同一件事，两处「唯一」不冲突。
    §4.1 内部的分布：level 1（eq. (4.1.16)–(4.1.18)，p.123–124，**式号与内容已核实**，抽取记录 polchinski-1998-v1#E56）
    给 A = −1 即 a = 1；A > −1 / A = −1 / A < −1 三种情形是 p.124 的**散文**（无式号），
    (4.1.19) 是 A = −1 时的规范等价 e_μ ≅ e_μ + γk_μ；
    level 2 给 D = 26 的一步是 **p.124 正文断言 + 习题 4.1**（原书逐字「The derivation is left to
    the reader」）——**订正**：此前写「约 eq. (4.1.19)–(4.1.28)，页码已核实/式号未核实，#E57」，
    而原书核实（§12.3 / §12.10 表 B 第 12 行）表明 **(4.1.24)–(4.1.28) 不存在**，此前转述的那套
    level-2 联立方程来自第三方笔记的习题解答；
    节末（p.124–125，#E58）只**陈述**无鬼定理并把证明推迟到 §4.4（p.137–142，原书 §4.1 逐字
    「as will be shown in section 4.4」、§4.4 逐字「we prove」）。已按 conv.intercept-sign-a 做 a = −A 换算。
    **无单一位置覆盖本 canonical_text 的全部合取**；其余三条路线在原书的位置分别是：
    §1.3（光锥，A = −1 与 D = 26 同在 eq. **(1.3.40)**, p.23，**式号与内容已核实**，#E18/Q2；
    原书正文走表示论计数——**订正**：此前写「显式的 [J^{i−}, J^{j−}] 验证是习题 1.3」，
    原书核实表明该验算书里既没做也没留成习题，只在 p.21 被描述并推给共形规范路线；
    本里程碑 (I) 的 Δ_n 显式形式只由 GSW §2.3.1 (2.3.32) 支撑）；
    §4.3（BRST，陈述式 eq. **(4.3.9)**，**式号与内容均已核实**——**订正**：#E64 与此前的本文件把它
    挂在 (4.3.10)，而 (4.3.10) 是 j_B j_B 的 OPE，结论式是 (4.3.9)；最短推导用 Jacobi 恒等式，
    是习题 4.3。这是四条路线中定位最强的一处，也是**全书唯一逐字写出 c^m = 26** 的一处，
    但只覆盖 c^m（经公共输入 c^m = D 才到 D）、不覆盖 a）；
    §3.4（Weyl 反常，"Discussion" 小节，eq. **(3.4.23)**, p.94，**式号、页码与内容均已核实**，
    #E53/Q6 已关闭——**订正**：此前写「p.95–96，式号约 (3.4.24)–(3.4.32)，完全未核实」。
    ⚠ 原书 (3.4.23) 写的是 `c = c^X + c^g = D − 26` 与「Weyl-invariant **only for D = 26**」，
    即**那里写的是 D = 26 而不是 c^m = 26**；一般物质 CFT 的形式在 §3.4 只有散文（p.95、p.96）
    与 (3.4.15) 支撑，逐字的 c^m = 26 在 §4.3 (4.3.9)。故 (IV) 的一般形式由三处联合支撑，
    这是本里程碑在来源侧最弱的一处，取代了此前登记的「式号完全未核实」）。
    另外两个公共输入的位置：c^X = D 见 §2.4 eq. **(2.4.22)** 与 p.48 正文（Q4/E34 已关闭，
    此前记为「无锚点」）；c^g = −26 见 §2.5 eq. (2.5.12), p.51（且原书在 (3.4.23) 处显式引用它）。
audit:
  status: draft
  back_translation:
    by: physics-auditor
    text: |
      回译（第二轮，physics-auditor，2026-09-11；写于读 canonical_text 与第一轮记录之前）

      约定：时空度规 (−,+,…,+)；Virasoro 归一化 [L_m,L_n]=(m−n)L_{m+n}+(c/12)m(m²−1)δ，自由玻色子 c=1；
      弦尺度用 Regge 斜率 α'，开弦 α'm²=N−a，a 的取值不属约定；截距记号 a 使物理态条件为
      (L_0−a)|ψ⟩=0，Polchinski 的 A 换算为 a=−A。中心荷写 c^m（物质）、c^g（鬼）。

      命题是五条 (I)–(V) 的合取，仅此。它不说 (I)–(IV) 彼此等价、不说任一条推出另一条，
      也不说它们是四份输入互不相关的证据。

      (I) 光锥。设 D 维开弦按光锥规范量子化，J^{i−}（i=2..D−1）因代入 α^−_n=L^⊥_n/(√(2α')p^+)
      成为横向模式三次式；并取 a 为横向零点能的 ζ 正规化值 a=(D−2)/24。则
      [J^{i−},J^{j−}] = −(1/(2α'(p^+)²)) Σ_{n≥1} Δ_n (α^i_{−n}α^j_n − α^j_{−n}α^i_n)，
      Δ_n = n(26−D)/12 + (1/n)[(D−26)/12 + 2(1−a)]（总归一化随 α'、p^+ 约定，Δ_n 形状不随）；
      于是「对所有 n≥1 Δ_n=0」（洛伦兹代数在 H_lc 闭合）当且仅当 D=26 且 a=1。
      这是四条中唯一同时给出 D 与 a、也是唯一以「当且仅当」给出 D 的路线。

      (II) 旧协变。H_phys 为旧协变物理态空间（(L_0−a)ψ=0，L_{n>0}ψ=0），H_0⊂H_phys 为内积的零模态
      （卡片称之为伪态）子空间；全部断言限于非退化（非零）动量扇区（DDF 所需）。
      若 D=26 且 a=1，则 (a) Fock 内积在 H_phys 上半正定，(b) H_phys/H_0 上诱导内积正定，
      (c) H_phys/H_0 与 24 个横向振子的 Fock 空间等距同构。
      并且：若 D>26、a=1，则（非零动量处）存在负模物理态。
      逻辑形状是「(26,1) 处幺正、D>26 处不幺正」，不是「幺正⟹D=26」；D≤25 一侧不作任何断言
      （亚临界另有节点，走补充模+BRST 相对上同调，附 D≥2 与三条动量假设）。

      (III) BRST。Q_B 为 λ=2 bc 系统、a^g=−1、物质中心荷 c^m 的 BRST 荷，作用在受限模上
      （每个向量被除有限多个外的 L^m_n、b_n、c_n 零化）。则
      Q_B² = (1/2)Σ_{m∈Z}((c^m−26)/12)(m³−m)c_{−m}c_m，故 Q_B²=0 ⟺ c^m=26 ⟺ c^m+c^g=0。
      只定 c^m，不定 a。

      (IV) Weyl 反常。Polyakov 路径积分对 diff×Weyl 取商，Weyl 是规范冗余并被用于定规范；
      量子 Weyl 反常正比于中心荷且该中心荷为常数；FP 鬼是 λ=2 bc 系统，c^g=−26。
      则反常抵消 ⟺ c^m+c^g=c^m−26=0 ⟺ c^m=26。只定 c^m，不定 a。

      (III)(IV) 与 D=26 的关系：两条得到的是 c^m=26 而非 D=26。作为约束 c^m=26 弱于 D=26
      （任何 c=26 的物质 CFT 都行，平坦 26 维只是一个解）；作为结论则强于 D=26（对任意物质 CFT 成立）。
      从 c^m=26 到 D=26 需再加一步 c^m=D（D 个平坦自由玻色子），这一步是 (III)(IV) 的公共输入，
      不是任一路线的产物；在物质部门取 D 个平坦自由玻色子时，(III)(IV) 各自给出 D=26。

      (V) 开弦截距 a=1，只对开弦，且与 D 无关地成立。对任意 D≥4，下面三条各自等价于 a=1：
      (a) level 1 的态无质量；(b) 第一级伪态 L_{−1}|0;k⟩∝k·α_{−1}|0;k⟩ 自身满足物理态条件
      （因而是零模态），从而 e^μ→e^μ+λk^μ 是规范自由度；(c) level 1 独立态构成无质量小群 SO(D−2)
      的矢量表示，而非有质量小群 SO(D−1) 的某个表示。
      a=1 出现在 (I) 的结论与 (II) 的前提；(III)(IV) 不涉及 a。对闭弦不作断言（闭弦 (a,ã)=(1,1)，
      α'm²/4=N−a，本图无节点）。

      「独立」只指论证方式独立，不指输入独立：(III)(IV) 共享 c^g=−26 与 c^m=D，判据都是 c^m−26=0，
      只在机制上不同（模式代数中 {Q_B,Q_B} vs 路径积分测度的 Weyl 变分）；若 c^g 或 c^m 算错，两条同时失效，
      不得当作两份独立证据。(II)(III) 之间图中有等价节点 brst-cohomology-equals-ocq-physical，
      本命题不用它、也不据此断言两路线等价。(I) 与 (II)(III)(IV) 的等价在图中无节点。
      (I) 与 (V) 共享光锥一侧输入（横向对易关系、开弦质量壳、ζ 正规序常数）。

      不断言：(1) (I)–(IV) 互相蕴含/等价；(2) D≤25 时的任何事（任意 a）；(3) 闭弦截距/质量壳、
      紧化背景（c^m=26 而 D≠26）；(4) D=26 是一致性的充分条件（相互作用、模不变性、快子在外）；
      (5) a=1 与 D=26 之间有蕴含（(V) 对任意 D≥4 等价于 a=1；(III)(IV) 不给 a）。
