        R2. v2 (I) 末句"唯一以「当且仅当」形式给出 D 的一条"与 v2 自己的 (III)（Q_B² = 0 ⟺ c^m = 26）
            及路线节点 critical-dimension-brst 末句"Q_B² = 0 ⟺ D = 26"相抵触。
        R3. v2 (III) 的结论"Q_B² = 0 ⟺ c^m = 26"省掉了路线节点里的前提"诸 c_{−m}c_m 在 V 上线性无关
            （对忠实的 Fock 型受限模成立）"——⟹ 方向需要它。
        R4. v2 (II) 对 D ≤ 25 不作断言，但路线节点 old-covariant 的 statement 有 D < 26 的断言
            （半正定但 (c) 不成立）；v2 比路线节点弱，方向安全。
