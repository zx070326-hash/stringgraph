id: ms.critical-dimension-bosonic
statement_id: worldsheet.critical-dimension-bosonic
canonical_text: |
  【本里程碑断言什么】
  对 D 维自由玻色弦，D = 26 不是由单一论证得到的：它是四条**论证方式互不相同**的路线各自挑出的同一个值。
  本里程碑断言下列 (I)–(IV) 四条路线各自的结论，以及开弦截距 a = 1（(V)）。
  本里程碑**不**断言四条路线互相等价，**不**断言由任一条可推出另一条，也**不**把它们当作四份互不相关的
  独立证据（见【独立性的限定】）。

  【约定】度规 conv.metric-mostly-plus；Virasoro 中心荷记号 conv.virasoro-standard；
  开弦 α' 归一化与质量壳 α' m² = N − a 取 conv.alpha-prime-regge；截距记号取 conv.intercept-sign-a，
  即物理态条件写 (L_0 − a)|ψ⟩ = 0、临界值 a = 1，与 Polchinski 的 A = −a 换算（本里程碑的 a = 1
  对应原书的 A = −1）。中心荷一律写上标 c^m（物质）、c^g（鬼场），以免与鬼场模式 c_n 撞号。

  (I) 光锥路线（洛伦兹代数闭合）。前提：开弦光锥规范量子化，洛伦兹生成元 J^{i−} 由横向振子表示
      （代入 α^−_n = L^⊥_n/((2α')^{1/2} p^+) 后是横向模式的三次式），正规序常数取横向零点能的 ζ 正规化值
      a = (D−2)/24。结论：[J^{i−}, J^{j−}] = −(1/(2α'(p^+)²)) Σ_{n≥1} Δ_n (α^i_{−n}α^j_n − α^j_{−n}α^i_n)，
      Δ_n = n(26−D)/12 + (1/n)[(D−26)/12 + 2(1−a)]，故洛伦兹代数在 H_lc 上闭合（对所有 n ≥ 1 有 Δ_n = 0）
      **当且仅当** D = 26 且 a = 1。这是四条路线中**唯一**同时定出 D 与 a 的一条。
      （节点：worldsheet.critical-dimension-light-cone）

  (II) 旧协变路线（无鬼定理的等号情形）。前提：旧协变物理态空间 H_phys（(L_0 − a)|ψ⟩ = 0，L_n|ψ⟩ = 0, n > 0），
      H_0 为其零模态子空间。结论：**若** D = 26 且 a = 1，则 Fock 内积在 H_phys 上半正定、H_phys/H_0 上诱导
      内积正定、且 H_phys/H_0 与 24 个横向振子的 Fock 空间等距同构；**且** D > 26（在 a = 1 时、限于非零动量）
      存在负模物理态。注意这条路线的逻辑形式是「在 D = 26, a = 1 处幺正，在 D > 26 处不幺正」，
      **不是**「幺正 ⟹ D = 26」的等价式：D ≤ 25 一侧本里程碑不作断言（该分支在图中另有节点
      worldsheet.no-ghost-theorem-subcritical，走的是补充模 + BRST 相对上同调的另一条路线，且附带 D ≥ 2
      与三条动量假设）。此路线的一切断言只在非退化动量扇区上成立（DDF 构造所需），细则见 ms.no-ghost-theorem。
      （节点：worldsheet.critical-dimension-old-covariant → worldsheet.no-ghost-theorem-v4）

  (III) BRST 路线（BRST 荷幂零）。前提：bc 系统权 λ = 2、鬼场正规序常数 a^g = −1、物质中心荷 c^m 的 BRST 荷 Q_B，
      作用在**受限模**上（每个向量被除有限多个模式外的 L^m_n、b_n、c_n 零化，以保证 Q_B 与 Q_B² 逐项有限）。
      结论：Q_B² = (1/2) Σ_{m∈Z} ((c^m − 26)/12)(m³ − m) c_{−m} c_m，故 Q_B² = 0 ⟺ c^m = 26 ⟺ 总中心荷
      c^m + c^g = 0；物质取 D 个平坦自由玻色子时 c^m = D，于是 D = 26。
      本路线**只**定出 c^m（即 D），**不**定出截距 a。
      （节点：worldsheet.critical-dimension-brst）

  (IV) Weyl 反常路线（总中心荷为零）。前提：Polyakov 路径积分对 diff × Weyl 取商，Weyl 是**规范冗余**并被用来
      固定规范；量子层面 Weyl 反常正比于中心荷且该中心荷为常数；Faddeev–Popov 鬼场是 λ = 2 的 bc 系统，
      贡献 c^g = −26。结论：反常抵消要求 c^{tot} = c^m + c^g = c^m − 26 = 0，即 c^m = 26；
      物质取 D 个平坦自由标量（c^m = D）时 D = 26。
      注意「c^m = 26」比「D = 26」更一般：任何中心荷为 26 的物质 CFT 都满足它，平坦 26 维时空只是其一个解。
      （节点：worldsheet.critical-dimension-weyl-anomaly）

  (V) 截距 a = 1，**只对开弦**。它与 D 的取值无关地成立：level N = 1 的态无质量、第一级伪态
      L_{−1}|0;k⟩ ∝ k·α_{−1}|0;k⟩ 同时是物理态（因而是零模态，给出偏振的规范自由度 e^μ → e^μ + λk^μ）、
      level 1 的独立态构成无质量小群 SO(D−2) 的矢量表示——这三条刻画对任意 D ≥ 4 都各自等价于 a = 1。
      a = 1 出现在路线 (I) 与 (II) 的前提/结论里；路线 (III) 与 (IV) 完全不涉及 a。
      本里程碑**不**对闭弦作任何断言：闭弦的对应量是 (a, ã) = (1, 1) 与质量壳 α'm²/4 = N − a，本图未建节点。
      （节点：worldsheet.open-string-intercept-v2）

  【各路线的非严格步骤】本里程碑的四条路线中只有 (II) 在图中是 rigorous，其余三条封顶在 physical-argument：
    (I) 零点能 Σ_{n≥1} n = ζ(−1) = −1/12 用 ζ 函数正规化，没有算子层面的定义；J^{i−} 是三次式，
        [J^{i−}, J^{j−}] 的计算涉及无穷模式和的重排与正规序重整，文献按形式操作处理，无收敛性论证；
        Polchinski §1.3 正文走的是表示论计数（第一激发级须为无质量 SO(D−2) 矢量），显式的代数闭合验证
        在原书是习题 1.3，本里程碑陈述的是 GSW §2.3.1 的显式版本。
    (II) 图中的推导链（Goddard–Thorn/DDF + Kac 行列式 + PBW）是 rigorous，但**来源可追溯性弱**：
        goddard-thorn-1972 正文未获取，只有摘要末句 'absence of ghosts for d ⩽ 26'，无编号定理；
        且被依赖的陈述卡末句关于 D < 26 的说法不被 worldsheet.no-ghost-theorem-v4 支撑
        （见推导 worldsheet.critical-dimension-old-covariant--via-no-ghost 的 gaps），故本里程碑在 (II) 中不采用该句。
    (III) 反方向（c^m = 26 ⟹ Q_B² = 0）目前**没有文献来源**：kato-ogawa-1983 摘要只给「⟹」
        （"the conditions D = 26 and α_0 = 1 … are required by the nilpotency"，正文未获取）；
        fgz-1986 与 lian-zuckerman-1991 都把 c = 26 当作构造相对复形的**假设**而非结论。
        只有 Polchinski §4.3 的形式模式/OPE 计算支撑「当且仅当」，且该计算未声明受限模限制、
        未论证无穷模式和重排的合法性。c^g = −26 与 c^m = D 两步在该推导中是 inferred 边。
    (IV) 路径积分测度的 Weyl 变分、Faddeev–Popov 手续、c^g = −26 的 OPE 计算均是物理论证；
        「有反常 ⟹ 理论不一致」在来源中是物理论断而非定理（非临界弦/Liouville 说明 c^{tot} ≠ 0
        并非绝对不可处理，只是要把 Liouville 模式当作动力学自由度）；且该处结论的**公式号完全未核实**，
        并且尚未人工确认原书写的是「c^m = 26」还是直接写「D = 26」（抽取记录 E53 / Q6）。
    (V) 两条推导都是 physical-argument：光锥路线的输入是「谱须组织成洛伦兹小群表示」，
        OCQ 路线的输入是「伪态必须解耦」，都是一致性要求而非定理；且光锥路线同样经过 ζ 正规化。
        a = 1 的**充分**方向（a = 1 时纵向态在 k² = 0 处退耦）已形式化，**排他性**方向未形式化。

  【独立性的限定】「四条独立论证」指**论证方式**独立，不指输入独立：
    - (III) 与 (IV) 共享 c^g = −26 与 c^m = D 两个输入，判据都是同一个数 c^m − 26 = 0，
      差别只在把它们拼起来的机制（模式代数中 {Q_B, Q_B} 的计算 vs 路径积分测度的 Weyl 变分）。
      若 c^g 或 c^m 的计算有误，两条同时失效，故**不得**把它们当作两份互不相关的证据。
    - (II) 与 (III) 之间有一条已建的等价节点 worldsheet.brst-cohomology-equals-ocq-physical
      （BRST 相对上同调 ≅ H_phys/H_0，FGZ 1986 Theorem 2.8 第一个同构）；本里程碑不使用它，
      也不因此断言两条路线等价。
    - (I) 与 (II)(III)(IV) 之间的等价在本图中**无节点**。
    - (I)(V) 共享光锥一侧的输入（横向振子对易关系、开弦质量壳、ζ 正规化的正规序常数）。

  【本里程碑不断言什么】
  (1) 不断言四条路线互相蕴含或等价（见上一节）。
  (2) 不断言 D ≤ 25 时会发生什么（无论 a 取何值）。
  (3) 不对闭弦截距、闭弦质量壳、或紧化背景（c^m = 26 但 D ≠ 26 的解）作断言。
  (4) 不断言 D = 26 是玻色弦一致性的**充分**条件（相互作用、模不变性、快子等均在范围外）。
  (5) 不断言 a = 1 与 D = 26 之间有蕴含关系：(V) 的三条刻画对任意 D ≥ 4 都等价于 a = 1。

  【本 canonical_text 与 statement_id 现行文本的差异——须 lead 裁决，故 audit.status = draft】
  本里程碑指向的 worldsheet.critical-dimension-bosonic 的现行 statement 文本写的是
  「在以下**三种**独立意义下要求 D = 26 且 a = 1：(i) 光锥 (ii) 旧协变 (iii) BRST」。已知四处不一致：
    D1. **路线数**。第四条路线 worldsheet.critical-dimension-weyl-anomaly 已建节点，但该卡文本写死「三种」，
        且其唯一推导 --via-three-routes 的 depends_on **不含**第四条路线。故本 canonical_text 的 (IV)
        在图上**没有**从 statement_id 出发的支撑路径，也不影响该 statement 的有效状态。
    D2. **「独立」的强度**。该卡写「三种独立意义」，但 (iii) 与 (iv) 共享 c^g = −26 与 c^m = D
        （见【独立性的限定】），「独立」只能在「论证方式」的意义上成立。
    D3. **a = 1 的归属**。该卡把 a = 1 写进三条路线的共同结论，但 (iii)（BRST 幂零）在本图中
        **只**给出 c^m = 26，不给 a；(iv) 同样不给 a。（旁注：Polchinski §4.3 的 Q_B 模式展开里
        末项 −c_0 就是鬼场正规序常数、数值上等于 a = 1，但那是**代入**的输入，不是该路线的结论；
        kato-ogawa-1983 摘要把 D = 26 与 α_0 = 1 一并归给幂零性，本图按「一个节点一个命题」拆开。）
    D4. **开/闭弦与约定**。该卡未区分开弦与闭弦：a = 1 是开弦量，(ii)(iii)(iv) 与开闭弦无关；
        且该卡的 uses_conventions **未声明 conv.intercept-sign-a**，而「a = 1」的符号恰恰依赖该约定
        （Polchinski 的同一命题写作 A = −1）。
  处理方式：本轮只建里程碑、不改任何已提交的陈述或推导（项目原则 1）。**建议 lead 新建
  worldsheet.critical-dimension-bosonic-v2**：把 (i)–(iv) 各自的前提与结论分开写、把 a = 1 限定为开弦、
  显式声明 conv.intercept-sign-a、并把 --via-three-routes 换代为四路线版本；届时本里程碑的
  statement_id 应改指 v2，旧卡写 superseded_by。在此之前本里程碑维持 draft，不得 approved。
canonical_source:
  ref: polchinski-1998-v1
  loc: |
    §4.1（旧协变量子化），p.121–125。选它的理由：这是原书中唯一由一条连贯的分析同时定出 a = 1 与 D = 26
    的位置——level 1（eq. (4.1.16)–(4.1.18)，p.123–124，**式号与内容已核实**，抽取记录 polchinski-1998-v1#E56）
    给 A = −1 即 a = 1；level 2（约 eq. (4.1.19)–(4.1.28)，p.124，**页码已核实/式号未核实**，#E57）
    给出「只有 A = −1 且 D = 26 时才出现额外零模态、内积才保持半正定」；节末（p.124–125，
    **页码已核实/式号未核实**，#E58）陈述无鬼定理并把证明推迟到 §4.4。已按 conv.intercept-sign-a 做 a = −A 换算。
    **无单一位置覆盖本 canonical_text 的全部合取**；其余三条路线在原书的位置分别是：
    §1.3（光锥，D = 26 与 A = −1，约 eq. (1.3.37)–(1.3.42)，p.23–24，页码已核实/式号未核实，#E18；
    原书正文走表示论计数，显式的 [J^{i−}, J^{j−}] 验证是习题 1.3）；
    §4.3（BRST，eq. (4.3.10)，p.132，**式号与内容均已核实**，#E64——这是四条路线中定位最强的一处，
    但只覆盖 D = 26、不覆盖 a）；
    §3.4（Weyl 反常，p.95–96，式号约 (3.4.24)–(3.4.32)，**完全未核实**，#E53/Q6——本里程碑定位最弱的一处）。
