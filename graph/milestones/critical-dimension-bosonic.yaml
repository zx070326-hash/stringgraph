id: ms.critical-dimension-bosonic
statement_id: worldsheet.critical-dimension-bosonic-v3
canonical_text: |
  【本里程碑断言什么】
  对 D 维自由玻色弦，D = 26 不是由单一论证得到的：它是四条**论证方式互不相同**的路线各自挑出
  D = 26（其中 (III)(IV) 直接挑出的是 c^m = 26，要经公共输入 c^m = D 才到 D = 26）。
  本里程碑断言下列 (I)–(IV) 四条路线各自的结论，以及开弦截距 a = 1（(V)）。
  本里程碑**不**断言四条路线互相等价，**不**断言由任一条可推出另一条，也**不**把它们当作四份互不相关的
  独立证据（见【独立性的限定】）。

  【约定】度规 conv.metric-mostly-plus；Virasoro 中心荷记号 conv.virasoro-standard；
  开弦 α' 归一化与质量壳 α' m² = N − a 取 conv.alpha-prime-regge；截距记号取 conv.intercept-sign-a，
  即物理态条件写 (L_0 − a)|ψ⟩ = 0、临界值 a = 1，与 Polchinski 的 A = −a 换算（本里程碑的 a = 1
  对应原书的 A = −1）。中心荷一律写上标 c^m（物质）、c^g（鬼场），以免与鬼场模式 c_n 撞号。

  (I) 光锥路线（洛伦兹代数闭合）。前提：开弦光锥规范量子化，洛伦兹生成元 J^{i−} 由横向振子表示
      （代入 α^−_n = L^⊥_n/((2α')^{1/2} p^+) 后是横向模式的三次式），正规序常数 a 在本路线中
      **作为待定参数**进入 Δ_n，**不**预先代入 ζ 正规化值——路线卡
      worldsheet.critical-dimension-light-cone 即如此写（GSW §2.3.1 的显式版本），
      正是因此该路线才能由同一条论证**同时推出** D = 26 与 a = 1。
      ζ 正规化值 a = (D−2)/24（横向零点能）不是本路线的前提，它只出现在该路线卡的推导
      worldsheet.critical-dimension-light-cone--via-lorentz-algebra 里，作为 Polchinski §1.3 正文
      走的另一条形状：把 a = (D−2)/24 先代入则 Δ_n 退化为 n(26−D)/12，闭合 ⟺ D = 26，
      a = 1 成为随之而来的推论而非并列结论。两种形状结论相容，本里程碑取路线卡的形状。
      结论：[J^{i−}, J^{j−}] = −(1/(2α'(p^+)²)) Σ_{n≥1} Δ_n (α^i_{−n}α^j_n − α^j_{−n}α^i_n)，
      Δ_n = n(26−D)/12 + (1/n)[(D−26)/12 + 2(1−a)]，故洛伦兹代数在 H_lc 上闭合（对所有 n ≥ 1 有 Δ_n = 0）
      **当且仅当** D = 26 且 a = 1。这是四条路线中**唯一**同时定出 D 与 a 的一条。
      本条另设前提 **D ≥ 4**（即至少存在两个不同的横向指标 i ≠ j）：D = 3 时只有一个横向指标，
      反对称组合 α^i_{−n}α^j_n − α^j_{−n}α^i_n 恒为零，对易子对**任意** (D, a) 都消失，
      「仅当」方向在那里有反例；D = 2 无横向振子，命题空真。
      （2026-09-11 第二轮审计 N2 提出，v3 已写入陈述；路线卡 worldsheet.critical-dimension-light-cone
      的陈述**尚未**加这条限定，故 v3 与本 canonical 均**弱于**该路线卡，方向安全。）
      （节点：worldsheet.critical-dimension-light-cone）

  (II) 旧协变路线（无鬼定理的等号情形）。前提：旧协变物理态空间 H_phys（(L_0 − a)|ψ⟩ = 0，L_n|ψ⟩ = 0, n > 0），
      H_0 为其零模态子空间。结论：**若** D = 26 且 a = 1，则 Fock 内积在 H_phys 上半正定、H_phys/H_0 上诱导
      内积正定、且 H_phys/H_0 与 24 个横向振子的 Fock 空间等距同构；**且** D > 26（在 a = 1 时、限于非零动量）
      存在负模物理态。注意这条路线的逻辑形式是「在 D = 26, a = 1 处幺正，在 D > 26 处不幺正」，
      **不是**「幺正 ⟹ D = 26」的等价式：D ≤ 25 一侧本里程碑不作断言（该分支在图中另有节点
      worldsheet.no-ghost-theorem-subcritical，走的是补充模 + BRST 相对上同调的另一条路线，且附带 D ≥ 2
      与三条动量假设）。此路线的一切断言只在非退化动量扇区上成立（DDF 构造所需），细则见 ms.no-ghost-theorem。
      （节点：worldsheet.critical-dimension-old-covariant-v2 → worldsheet.no-ghost-theorem-v4）

  (III) BRST 路线（BRST 荷幂零）。前提：bc 系统权 λ = 2、鬼场正规序常数 a^g = −1、物质中心荷 c^m 的 BRST 荷 Q_B，
      作用在**受限模**上（每个向量被除有限多个模式外的 L^m_n、b_n、c_n 零化，以保证 Q_B 与 Q_B² 逐项有限）。
      结论：Q_B² = (1/2) Σ_{m∈Z} ((c^m − 26)/12)(m³ − m) c_{−m} c_m，故 Q_B² = 0 ⟺ c^m = 26 ⟺ 总中心荷
      c^m + c^g = 0；物质取 D 个平坦自由玻色子时 c^m = D，于是 D = 26。
      **⟹ 方向另需一条前提**：诸 c_{−m} c_m 在该模上线性无关（路线卡
      worldsheet.critical-dimension-brst-v2 的措辞是「对忠实的 Fock 型受限模成立」）。
      缺此前提时 Q_B² = 0 ⟹ c^m = 26 不成立（在平凡模上 Q_B² 恒为零而 c^m 任意）；
      ⟸ 方向不需要它。
      本路线**只**定出 c^m，**不**定出截距 a。
      （节点：worldsheet.critical-dimension-brst-v2）

  (IV) Weyl 反常路线（总中心荷为零）。前提：Polyakov 路径积分对 diff × Weyl 取商，Weyl 是**规范冗余**并被用来
      固定规范；量子层面 Weyl 反常正比于中心荷且该中心荷为常数；Faddeev–Popov 鬼场是 λ = 2 的 bc 系统，
      贡献 c^g = −26。结论：反常抵消要求 c^{tot} = c^m + c^g = c^m − 26 = 0，即 c^m = 26；
      物质取 D 个平坦自由标量（c^m = D）时 D = 26。
      注意「c^m = 26」比「D = 26」更一般：任何中心荷为 26 的物质 CFT 都满足它，平坦 26 维时空只是其一个解。
      （节点：worldsheet.critical-dimension-weyl-anomaly-v2）

  (V) 开弦截距：**一致性要求 a = 1**，**只对开弦**，且这一要求与 D 的取值无关。
      这里的「一致性」指下列三条中的任一条，每条都单独等价于 a = 1（路线卡
      worldsheet.open-string-intercept-v2 即如此写；2026-09-11 第二轮审计 N3）：
      (a) level N = 1 的态无质量、(b) 第一级伪态
      L_{−1}|0;k⟩ ∝ k·α_{−1}|0;k⟩ 同时是物理态（因而是零模态，给出偏振的规范自由度 e^μ → e^μ + λk^μ）、
      (c) level 1 的独立态构成无质量小群 SO(D−2) 的矢量表示（标号 (a)(b)(c) 与 v2/v3 卡片一致）——
      这三条刻画各自等价于 a = 1，
      但**图内成立的维数范围各不相同**：零态刻画 (a)(b)（伪态 L_{−1}|0;k⟩ 同时是物理态）由推导
      worldsheet.open-string-intercept-v2--via-null-state-decoupling 支撑，对 D ≥ 2 成立
      （只需存在 k ≠ 0 且 k² = 0）；表示论刻画 (c) 由推导
      worldsheet.open-string-intercept-v2--via-light-cone-representation 支撑，该推导自陈
      只覆盖 D ≥ 5，且其中「SO(D−1) 的最小非平凡表示是 D−1 维矢量」一步在 D = 5 为假
      （SO(4) 有 3 维自对偶 2-形式表示，D−2 = 3 个态按维数装得进去，且其限制到 SO(3) 恰是矢量，
      维数计数与限制都排除不掉），故 (c) 在图内实际只覆盖 D = 4 与 D ≥ 6，D = 5 待补
      （该漏洞已记入上述推导的 gaps，待 reviewer 复核）。
      a = 1 出现在路线 (I) 与 (II) 的前提/结论里；路线 (III) 与 (IV) 完全不涉及 a。
      本里程碑**不**对闭弦作任何断言：闭弦的对应量是 (a, ã) = (1, 1) 与质量壳 α'm²/4 = N − a，本图未建节点。
      （节点：worldsheet.open-string-intercept-v2）

  【各路线的非严格步骤】本里程碑的四条路线中只有 (II) 在图中是 rigorous（2026-09-11 拆
  ddf-operators-v4 → v5 后 (II) 的**有效状态**亦为 physical-argument：其推导链的 DDF 部分
  现由 worldsheet.ddf-commute-with-virasoro 与 worldsheet.ddf-transverse-oscillator-algebra
  两张 physical-argument 卡承载，见 ms.no-ghost-theorem 第五轮；下文 (II) 一条所说的
  「图中的推导链是 rigorous」指的是各推导节点**自身**的 status，不再是有效状态），
  其余三条封顶在 physical-argument：
    (I) 零点能 Σ_{n≥1} n = ζ(−1) = −1/12 用 ζ 函数正规化，没有算子层面的定义（原书 p.22 给的
        丢弃发散项的理由是「Weyl invariance **requires** that it be canceled」，不是任意选择）；
        J^{i−} 是三次式，[J^{i−}, J^{j−}] 的计算涉及无穷模式和的重排与正规序重整，文献按形式操作
        处理，无收敛性论证；
        Polchinski §1.3 正文走的是表示论计数（第一激发级须为无质量 SO(D−2) 矢量，结论式 (1.3.40), p.23），
        本里程碑陈述的是 GSW §2.3.1 (2.3.32) 的显式版本。
        **【2026-09-11 原书核实订正】**此前本段写「显式的代数闭合验证在原书是习题 1.3」——**不成立**：
        抽取记录 polchinski-1998-v1.md §12.5 的结论是该验算书里既没有做、也没有留成习题，
        原书只在 p.21 描述它并推给共形规范路线。作者三处自降严格程度（逐字）：p.21「plausible without
        a complete treatment」、p.24「We will show this **indirectly** in the coming chapters」、
        p.90「rather **heuristically** explained in section 1.3」。故 (I) 的 Δ_n 显式形式在图中
        **只**由 GSW 支撑，Polchinski 只支撑同一结论的表示论形状。
    (II) 图中的推导链（Goddard–Thorn/DDF + Kac 行列式 + PBW）是 rigorous，但**来源可追溯性弱**：
        goddard-thorn-1972 正文未获取，只有摘要末句 'absence of ghosts for d ⩽ 26'，无编号定理。
        **【2026-09-11 记账订正，第二轮审计 N1】**此前本段还写「被依赖的陈述卡末句关于 D < 26 的说法
        不被 worldsheet.no-ghost-theorem-v4 支撑（见推导 worldsheet.critical-dimension-old-covariant--via-no-ghost
        的 gaps），故本里程碑在 (II) 中不采用该句」——该免责已**失实**：那句关于 D < 26 的末句属于
        **换代前的旧卡** worldsheet.critical-dimension-old-covariant，现在被依赖的
        worldsheet.critical-dimension-old-covariant-v2 已删去它并明写「D ≤ 25 不作断言」，
        被引的推导文件也已改名为 -v2--via-no-ghost。故该免责不再需要，此处只保留历史记载。
    (III) 「当且仅当」的两个方向来源强度**不同**，必须分开记账：
        **⟹ 方向（Q_B² = 0 ⟹ c^m = 26），即真正定出临界维数的那一半，没有数学来源**：
        只有 kato-ogawa-1983 摘要的一句 "the conditions D = 26 and α_0 = 1 … are **required by**
        the nilpotency"（方向确为 ⟹，但正文未获取、定理编号未核实），以及 Polchinski §4.3 的
        形式模式/OPE 计算——后者未声明受限模限制、未论证无穷模式和重排的合法性，也未写出
        ⟹ 方向所需的线性无关（忠实性）前提（见上文 (III) 的前提）。
        **⟸ 方向（c^m = 26 ⟹ Q_B² = 0）有数学来源**：fgz-1986 Proposition 1.2（d² = 0，
        前提 H²(g) = 0 与 γ = 0 写在正文）配合 §2.1 的 "from this point on we will assume that
        π(c) = 26 Id_V"，讲的正是这一方向；图中已由节点 worldsheet.brst-nilpotent-at-c26
        承载（提交 bcb83db），路线卡的推导 --via-nilpotency 的 gaps 亦已指出。
        fgz-1986 与 lian-zuckerman-1991 把 c = 26 当作构造相对复形的**假设**而非结论，
        这恰恰说明二者支撑 ⟸ 而**不**支撑 ⟹；本节此前把两件事混为「反方向没有来源」，
        方向写反，据第一轮审计 B1 于 2026-09-11 改正。
        另：c^g = −26 与 c^m = D 两步在推导 --via-nilpotency 中是 inferred 边。
    (IV) 路径积分测度的 Weyl 变分、Faddeev–Popov 手续、c^g = −26 的 OPE 计算均是物理论证；
        「有反常 ⟹ 理论不一致」在来源中是物理论断而非定理（非临界弦/Liouville 说明 c^{tot} ≠ 0
        并非绝对不可处理，只是要把 Liouville 模式当作动力学自由度）。
        **【2026-09-11 原书核实：Q6 关闭，本段此前的「完全未核实」已作废】**§3.4 的结论式是
        **(3.4.23), p.94**（逐字 `c = c^X + c^g = D − 26`，随后「The theory is Weyl-invariant
        **only for D = 26**」），即**原书那里写的是 D = 26，不是 c^m = 26**。一般物质 CFT 的形式
        在 §3.4 只以散文出现（p.95「a flat world-sheet CFT can be coupled to a curved metric in a
        Weyl-invariant way **if and only if the total central charge c is zero**」、p.96「Weyl
        invariance holds in the quantum theory **if and only if a₁ = −c/12 vanishes**」），
        其带式号的形式是 (3.4.15)（c = −12a₁, T^a_a = −(c/12)R）；**逐字写出 `c^m = 26` 的是
        §4.3 (4.3.9)**。故 (IV) 采用的一般形式由「§3.4 散文 + (3.4.15) + §4.3 (4.3.9)」联合支撑，
        不由单一式号支撑——这是 (IV) 在来源侧的实际弱点，取代了此前登记的「式号未核实」。
        另：原书在 (3.4.23) 处**显式引用 (2.5.12)** 作为 c^g = −26 的来源，故那条依赖在书里是明写的。
        路线卡 worldsheet.critical-dimension-weyl-anomaly-v2 的 notes 仍把 Q6 记为开放疑问，
        换代时应改挂 §4.3 (4.3.9) 并删去该疑问（已记入 v3 推导的 gaps）。
    (V) 两条推导都是 physical-argument：光锥路线的输入是「谱须组织成洛伦兹小群表示」，
        OCQ 路线的输入是「伪态必须解耦」，都是一致性要求而非定理；且光锥路线同样经过 ζ 正规化。
        a = 1 的**充分**方向（a = 1 时纵向态在 k² = 0 处退耦）已形式化，**排他性**方向未形式化。

  【独立性的限定】「四条独立论证」指**论证方式**独立，不指输入独立：
    - (III) 与 (IV) 共享 c^g = −26 与 c^m = D 两个输入，判据都是同一个数 c^m − 26 = 0，
      差别只在把它们拼起来的机制（模式代数中 {Q_B, Q_B} 的计算 vs 路径积分测度的 Weyl 变分）。
      若 c^g 或 c^m 的计算有误，两条同时失效，故**不得**把它们当作两份互不相关的证据。
    - (II) 与 (III) 之间有一条已建的等价节点 worldsheet.brst-cohomology-equals-ocq-physical
      （BRST 相对上同调 ≅ H_phys/H_0，FGZ 1986 Theorem 2.8 第一个同构）；本里程碑不使用它，
      也不因此断言两条路线等价。
    - (I) 与 (II)(III)(IV) 之间的等价在本图中**无节点**。
    - (I)(V) 共享光锥一侧的输入（横向振子对易关系、开弦质量壳、ζ 正规化的正规序常数）。

  【本里程碑不断言什么】
  (1) 不断言四条路线互相蕴含或等价（见上一节）。
  (2) 不断言 D ≤ 25 时会发生什么（无论 a 取何值）。
  (3) 不对闭弦截距、闭弦质量壳、或紧化背景（c^m = 26 但 D ≠ 26 的解）作断言。
  (4) 不断言 D = 26 是玻色弦一致性的**充分**条件（相互作用、模不变性、快子等均在范围外）。
  (5) 不断言 a = 1 与 D = 26 之间有蕴含关系：(V) 的三条刻画各自等价于 a = 1，与 D 的取值无关
      （各刻画在图内成立的维数范围见 (V)：(a)(b) 对 D ≥ 2，(c) 只覆盖 D = 4 与 D ≥ 6）。
  (6) **不断言**「(I) 是唯一以『当且仅当』形式给出 D 的路线」。换代前的
      worldsheet.critical-dimension-bosonic-v2 在 (I) 末尾有这半句，它与 (III)（Q_B² = 0 ⟺ c^m = 26，
      再经 c^m = D 给 ⟺ D = 26）抵触，(IV) 的判据 c^{tot} = 0 在实质上也是双向的。
      **v3 已删去该半句**，并在自己的【本命题不断言什么】(6) 明示不作该断言，故本条与
      statement 现在是**同一句话**，不再是「canonical 对不可变陈述卡的免责」。
      本里程碑 (I) 只断言光锥路线是四条中**唯一同时定出 D 与 a** 的一条（这一点不受影响：
      (III)(IV) 完全不给 a，(II) 把 a = 1 当前提）。
      **【2026-09-11 记账订正，第二轮审计 N1】**此前本条末尾写「与 (II) 对
      worldsheet.critical-dimension-old-covariant-v2 末句关于 D < 26 的处理同款」——失实：
      被免责的那句属于换代前的旧卡 worldsheet.critical-dimension-old-covariant，
      -v2 卡本身没有该末句（它明写 D ≤ 25 不作断言）。该类比已删除。

  【本 canonical_text 与 statement_id 的差异：已由 v2 解决（2026-09-11）；第一轮回译已完成，裁定 drift】
  本里程碑原先指向 worldsheet.critical-dimension-bosonic，该卡的 statement 写的是
  「在以下**三种**独立意义下要求 D = 26 且 a = 1：(i) 光锥 (ii) 旧协变 (iii) BRST」，
  与本 canonical_text 有四处不一致（起草时记为 D1 路线数、D2「独立」的强度、
  D3 a = 1 的归属、D4 开/闭弦与约定）。
  这四处**已由换代解决**：curator 于 2026-09-11 新建 worldsheet.critical-dimension-bosonic-v2
  （按 (I)–(V) 分列四条路线各自的前提与结论；「独立」降为「论证方式独立」并写明 (III)(IV)
  共享 c^g = −26 与 c^m = D；a = 1 限定为开弦并单列为 (V)；显式声明 conv.intercept-sign-a）
  与推导 worldsheet.critical-dimension-bosonic-v2--via-four-routes（四条路线 +
  open-string-intercept-v2 + free-boson-central-charge-d + bc-ghost-central-charge），
  旧卡写 superseded_by 指向 v2、statement 文本一字未动。
  本里程碑的 statement_id 曾随之改指 v2；**2026-09-11 又随第二轮回译的裁定改指
  worldsheet.critical-dimension-bosonic-v3**（见下段）。
