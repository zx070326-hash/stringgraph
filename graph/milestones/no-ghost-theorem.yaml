id: ms.no-ghost-theorem
statement_id: worldsheet.no-ghost-theorem-v3
canonical_text: |
  对 D 维自由玻色开弦，在旧协变量子化中定义物理态为满足 (L_0 - a)|ψ⟩ = 0 与 L_n|ψ⟩ = 0 (n>0) 的态
  （截距记号 a 按 conv.intercept-sign-a，即 Polchinski 的 A = -a）；零模态指与所有物理态正交的物理态。
  一切断言在**固定动量**下进行：F(p) 是建在动量本征态 |0; p⟩ 上的 Fock 空间，H_phys(p) = H_phys ∩ F(p)；
  质量壳 α' m^2 = N - a（m^2 = -p^2）把 H_phys(p) 中态的振子能级定为 N = a - α' p^2。
  (1) 当 D = 26 且 a = 1 时，固定一条类光参考方向（射线 {λ k_0 : λ > 0}，k_0^2 = 0；k_0 的标度按 DDF
      归一化 2α' k_0·p = 1 逐塔取定，条件 k_0·p ≠ 0 只依赖方向、不依赖标度）：
      (a) 对扇区 {p : k_0·p ≠ 0} 内每个动量 p 与每个 |ψ⟩ ∈ H_phys(p)，⟨ψ|ψ⟩ ≥ 0（半正定）；
      (b) 对每个在快子壳上（α' k^2 = a = 1）且 k_0·k ≠ 0 的动量 k，把物理态限制到动量塔
          {k - N k_0 : N ≥ 0} 上得到 H_phys(k; k_0) = ⊕_{N ≥ 0} H_phys(k - N k_0)，模掉其零模态子空间
          H_0(k; k_0) 后诱导内积正定；并且包含映射诱导出与横向 DDF Fock 空间 H^⊥(k)
          （由 24 个横向 DDF 算子 A^i_{-n}，i = 2..25，n ≥ 1，作用在 |0; k⟩ 上生成）之间的**等距同构**
          （保内积的线性双射）。该同构保持**能级 N** 分级（不是 L_0 分级：在 H_phys 上 L_0 ≡ a = 1 是常数，
          L_0 分级平凡）。
      k_0·k = 0 的动量扇区（特别是 k = 0）不在本里程碑范围内：DDF 构造在那里退化。
  (2) 当 D > 26 时，**至少在 a = 1 的情形**存在负模物理态。
      （依第二轮审计建议 C2 显式写出对 a 的量化：本里程碑只断言 a = 1。文献中更强的形式"对任意 a 均存在
      负模物理态"通常归于 Brower 1972 / Thorn，其出处与确切条件尚未核实，故不纳入 canonical_text。）
  本里程碑不对 D ≤ 25 作任何断言（无论 a 取何值），也不对 D = 26、a ≠ 1 作断言。
canonical_source:
  ref: goddard-thorn-1972
  loc: "无编号定理；结论见摘要末句 'absence of ghosts for d ⩽ 26'。正文未获取，见 literature/extractions/brst-cohomology-sources.md §3"
audit:
  status: draft
  back_translation:
    by: physics-auditor
    text: |
      【第二轮回译，2026-09-10，对象 worldsheet.no-ghost-theorem-v2。仅依据该节点的 statement / uses_conventions、
      它引用的 worldsheet.old-covariant-physical-states 与 worldsheet.ddf-operators-v2 的 statement 字段、
      以及三条约定节点写成；无 formal_statement，无 Lean 声明。写于读 canonical_text 之前。】

      设定。取 D 个自由玻色子（单组振子 α^μ_n，μ = 0..D-1）的 Fock 空间 F，时空度规 η_{μν} 号差 (-,+,...,+)。
      F 上的内积由 (α^μ_n)^† = α^μ_{-n} 与 η_{μν} 诱导，一般是不定的。Virasoro 生成元 L_n 取 Sugawara 型构造，
      中心荷 c = D，满足 [L_m, L_n] = (m-n) L_{m+n} + (c/12) m(m^2-1) δ_{m+n,0}。质量壳记为 α' m^2 = N - a，
      a 是截距常数，物理态条件写成 (L_0 - a)|ψ⟩ = 0（a 记号，不是 Polchinski 的 A = -a）。
      定义 H_phys = {|ψ⟩ ∈ F : (L_0 - a)|ψ⟩ = 0 且 L_n|ψ⟩ = 0 对所有 n > 0}，
      H_0 = {|χ⟩ ∈ H_phys : ⟨χ|ψ⟩ = 0 对所有 |ψ⟩ ∈ H_phys}（零模态子空间）。

      断言 (1)。假设 D = 26 且 a = 1。任取一个类光参考动量 k_0（k_0^2 = 0），并且只考虑动量 k 满足 k·k_0 ≠ 0 的态
      （这是 DDF 算子归一化 k_0·k = 1 所需要的条件）。那么在这个扇区上：
        (1a) 对每一个 |ψ⟩ ∈ H_phys，⟨ψ|ψ⟩ ≥ 0。即 Fock 内积限制到 H_phys 上是半正定的。
        (1b) 商空间 H_phys / H_0 上由 Fock 内积诱导的内积是正定的；并且存在一个保内积的线性双射（等距同构，
             不只是抽象线性同构），把 H_phys / H_0 映到 H^⊥，其中 H^⊥ 是由 24 个横向 DDF 算子 A^i_{-n}
             （i = 2..25，n ≥ 1）作用在基态 |0; k⟩ 上张成的 Fock 空间。这些 DDF 算子与所有 L_m 对易，
             满足横向振子代数 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}（i 取 2..D-1，0、1 方向组成光锥对）。
             该同构保持分级，分级由 L_0 给出。
        动量满足 k·k_0 = 0 的态（尤其 k = 0）不在断言范围内。

      断言 (2)。假设 D > 26 且 a = 1。则存在 |ψ⟩ ∈ H_phys 使 ⟨ψ|ψ⟩ < 0，即 H_phys 中有负模态。
      （本陈述对 D > 26、a ≠ 1 不作断言。）

      不作断言的情形：D ≤ 25（任何 a）；D = 26 且 a ≠ 1；D > 26 且 a ≠ 1；k·k_0 = 0 扇区。
      陈述不含"退耦""不幺正"之类的措辞。

      回译时注意到的陈述内部疑点（在读 canonical_text 之前记下）：
        Q1 "固定一个 k_0" 与 ddf-operators-v2 的 "k_0·p = 1" 归一化：若 k_0 真的固定，只有 k_0·p = 1 的动量才满足
           归一化，而不是全部 k_0·p ≠ 0；须按扇区把 k_0 重标度（k_0 类光，重标度仍类光）。
        Q2 (1b) 中 H^⊥ 建在单个 |0; k⟩ 上，其动量只覆盖 k - N k_0（N ≥ 0）；而 H_phys / H_0 的量词范围是整个
           k·k_0 ≠ 0 扇区（连续动量）。二者不可能作为整体等距同构，除非逐动量陈述。
        Q3 (1b) 说"分级由 L_0 给出"，但 H_phys 上 L_0 = a = 1 是常数，作为分级是平凡的；真正的分级是能级 N。
        Q4 |0; k⟩ 未要求 k 在快子壳（α' k^2 = a = 1）上；不在壳则 H^⊥ ⊄ H_phys。
    verdict: drift
