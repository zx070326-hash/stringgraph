      （原稿留在 graph/build/round3-back-translation.txt，gitignore）。】

      背景与约定。考虑 D 维时空中的自由玻色开弦，度规号差 (−,+,…,+)。只有一组振子 α^μ_n，Virasoro 生成元按
      Sugawara 构造，c = D，代数 [L_m,L_n] = (m−n)L_{m+n} + (D/12)m(m²−1)δ。Fock 内积由 (α^μ_n)† = α^μ_{−n} 与
      η_{μν} 诱导；由于 η_{00} = −1，这个内积在整个 Fock 空间上不定。物理态空间 H_phys 是满足 (L_0 − a)|ψ⟩ = 0 与
      L_n|ψ⟩ = 0（所有 n > 0）的态；a 是截距，符号约定为 (L_0 − a)，即 Polchinski 的 A = −a。零模态指 H_phys 中
      与全部物理态正交的态。零模 α^μ_0 = (2α')^{1/2} p^μ；F(p) 是动量本征值为 p 的 Fock 空间，
      H_phys(p) = H_phys ∩ F(p)。质量壳 α' m² = N − a，m² = −p²，所以动量为 p 的物理态的振子能级是 N = a − α' p²。

      (1) 取 D = 26、a = 1。任选一条类光射线 {λk_0 : λ > 0}（k_0² = 0）。k_0 的标度不预先固定，而是对每个被作用的
          动量 p 按 2α' k_0·p = 1 取定（这样一来 k_0·p ≠ 0 是前提；这个条件只与射线方向有关，与标度无关）。
          以下只讨论满足 k_0·p ≠ 0 的动量 p。

          (1a) 对任意这样的 p 和任意 |ψ⟩ ∈ H_phys(p)，⟨ψ|ψ⟩ ≥ 0。即：在该扇区内不存在负模物理态。

          (1b) 取一个快子壳动量 k：α' k² = 1（即 N = 0 的质量壳；mostly-plus 下 k² > 0，m² = −1/α'），
               且 k_0·k ≠ 0，k_0 已重标为 2α' k_0·k = 1。定义
                 - 动量塔上的物理态空间 H_phys(k;k_0) = ⊕_{N≥0} H_phys(k − N k_0)；
                 - 其零模子空间 H_0(k;k_0) = 塔内与塔内所有态正交的态；
                 - 横向 DDF Fock 空间 H^⊥(k) = 由 A^{i_1}_{−n_1}…A^{i_r}_{−n_r}|0;k⟩ 张成，r ≥ 0，n_j ≥ 1，
                   i_j 取 24 个横向方向 2..25。DDF 算子 A^i_n = ∮ dz/2πi ∂X^i e^{i n k_0·X}，与所有 L_m 对易，
                   满足 [A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}；A^i_n 把动量 p 移到 p + n k_0，故 A^i_{−n} 把动量
                   移到 p − n k_0，能级升高 n。
               陈述里给出的自洽性说明：k_0² = 0 与 2α'k_0·k = 1 使 α'(k − N k_0)² = 1 − N，所以 H_phys(k − N k_0)
               里的态自动处在能级 N；因此 H^⊥(k) ⊂ H_phys(k;k_0)。
               结论：
                 (1b-i)   商 H_phys(k;k_0)/H_0(k;k_0) 上诱导的内积正定；
                 (1b-ii)  H^⊥(k) → H_phys(k;k_0)/H_0(k;k_0)（包含再取商）是保内积的线性双射；
                 (1b-iii) 这个双射保持能级 N：DDF 一侧 N = Σ n_j，物理态一侧 N = 振子能级 = 动量分级
                          （p = k − N k_0）= a − α'p²。它不是 L_0 分级——在 H_phys 上 L_0 = 1 恒定。

          对 k_0·k = 0 的动量（包括 k = 0）不作断言。

      (2) 取 D > 26。则在 a = 1 时 H_phys 里存在负模态：∃ |ψ⟩ ∈ H_phys，⟨ψ|ψ⟩ < 0。对 a ≠ 1 不作断言。

      对 D ≤ 25（任意 a）不作断言；对 D = 26、a ≠ 1 不作断言。

      量词归纳：(1a) 是"∀p∀ψ"；(1b) 是"∀k（快子壳、k_0·k≠0）"下由包含+商映射给定的等距同构；(2) 是"∃ψ"。
      结论强度：(1a) 半正定；(1b-i) 商上正定；(1b-ii) 等距同构（不只是线性同构）。陈述没有说 D = 26 是无鬼的
      必要条件，也没有说 a = 1 是必要条件；(2) 只给出 D > 26、a = 1 的反例存在性。
