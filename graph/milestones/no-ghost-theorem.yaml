id: ms.no-ghost-theorem
statement_id: worldsheet.no-ghost-theorem-v4
canonical_text: |
  对 D 维自由玻色开弦，在旧协变量子化中定义物理态为满足 (L_0 - a)|ψ⟩ = 0 与 L_n|ψ⟩ = 0 (n>0) 的态
  （截距记号 a 按 conv.intercept-sign-a，即 Polchinski 的 A = -a）；零模态指与所有物理态正交的物理态。
  一切断言在**固定动量**下进行：F(p) 是建在动量本征态 |0; p⟩ 上的 Fock 空间，H_phys(p) = H_phys ∩ F(p)；
  质量壳 α' m^2 = N - a（m^2 = -p^2）把 H_phys(p) 中态的振子能级定为 N = a - α' p^2。
  【全局动量限定，对下述 (1) 与 (2) **同时**生效】本里程碑的一切断言都只在非退化动量扇区上作出：
  零动量 p = 0 一律不在范围内；在已固定类光参考方向 k_0 的语境（即 (1)）中进一步排除 k_0·p = 0 的动量。
  理由是 DDF 构造在这些动量上退化。这条限定不是只管 (1) 的旁注——(2) 的断言同样只在 p ≠ 0 上作出，
  并在 (2) 内部显式写出（若省去该量词，(2) 对 D = 26 亦真、丧失区分力，见第三轮审计 B1）。
  (1) 当 D = 26 且 a = 1 时，固定一条类光参考方向（去心直线 {λ k_0 : λ ∈ R \ {0}}，k_0^2 = 0；k_0 的标度
      按 DDF 归一化 2α' k_0·p = 1 逐塔取定，λ 的符号随 sign(k_0·p)；条件 k_0·p ≠ 0 只依赖方向、不依赖标度）：
      (a) 对扇区 {p : k_0·p ≠ 0} 内每个动量 p 与每个 |ψ⟩ ∈ H_phys(p)，⟨ψ|ψ⟩ ≥ 0（半正定）；
      (b) 对每个在快子壳上（α' k^2 = a = 1）且 k_0·k ≠ 0 的动量 k，把物理态限制到动量塔
          {k - N k_0 : N ≥ 0} 上得到 H_phys(k; k_0) = ⊕_{N ≥ 0} H_phys(k - N k_0)，模掉其零模态子空间
          H_0(k; k_0) 后诱导内积正定；并且包含映射诱导出与横向 DDF Fock 空间 H^⊥(k)
          （由 24 个横向 DDF 算子 A^i_{-n}，i = 2..25，n ≥ 1，作用在 |0; k⟩ 上生成）之间的**等距同构**
          （保内积的线性双射）。该同构保持**能级 N** 分级（不是 L_0 分级：在 H_phys 上 L_0 ≡ a = 1 是常数，
          L_0 分级平凡）。
  (2) 当 D > 26 时，**至少在 a = 1 的情形**存在非零动量上的负模物理态：存在动量 p ≠ 0 与
      |ψ⟩ ∈ H_phys(p) 使 ⟨ψ|ψ⟩ < 0。
      （量词 p ≠ 0 不可省：p = 0 时 α^0_{-1}|0; 0⟩ 对任意 D（含 D = 26）都是物理态且模为 η^{00} = -1，
      故省去量词会使本条对 D = 26 亦真、区分不了 D > 26——第三轮审计 B1。
      依第二轮审计建议 C2 显式写出对 a 的量化：本里程碑只断言 a = 1。文献中更强的形式"对任意 a 均存在
      负模物理态"通常归于 Brower 1972 / Thorn，其出处与确切条件尚未核实，故不纳入 canonical_text。）
  本里程碑不对 D ≤ 25 作任何断言（无论 a 取何值），也不对 D = 26、a ≠ 1 作断言。
canonical_source:
  ref: goddard-thorn-1972
  loc: "无编号定理；结论见摘要末句 'absence of ghosts for d ⩽ 26'。正文未获取，见 literature/extractions/brst-cohomology-sources.md §3"
audit:
  status: back-translated
  back_translation:
    by: physics-auditor
    text: |
      【回译，第四轮，physics-auditor，2026-09-10。仅依据 no-ghost-theorem-v4 / ddf-operators-v4 /
      old-covariant-physical-states 的 statement 与 uses_conventions 字段及四个约定节点写成；
      写此文时未读 canonical_text、推导、notes、前三轮 diff_notes。formal/ 中尚无对应 Lean 声明。】

      背景与约定。取 D 个自由玻色子 X^μ（μ = 0..D-1），时空度规号差 (-,+,...,+)。开弦，只有一组
      振子 α^μ_n（n ∈ Z），零模 α^μ_0 = (2α')^{1/2} p^μ，α' 是 Regge 斜率。Fock 空间 F 上的内积由
      (α^μ_n)^† = α^μ_{-n} 与 η_{μν} 诱导，因 η_{00} = -1 而不定。Virasoro 生成元 L_n 由 Sugawara
      构造给出，满足 [L_m, L_n] = (m-n) L_{m+n} + (c/12) m(m^2-1) δ_{m+n,0}，c = D。
      物理态空间 H_phys = {ψ ∈ F : (L_0 - a)ψ = 0, L_n ψ = 0 ∀ n ≥ 1}；这里 a 是截距，
      按 Goddard–Thorn/GSW 记号（Polchinski 的 A = -a）。零模态 = H_phys 中与全部物理态正交的态。
      F(p) 是建在动量本征态 |0; p⟩ 上的 Fock 空间，H_phys(p) = H_phys ∩ F(p)。
      质量壳 α' m^2 = N - a，m^2 = -p^2，故 ψ ∈ H_phys(p) 的振子能级是 N = a - α' p^2。

      DDF 算子（ddf-operators-v4）。横向指标 i = 2..D-1（共 D-2 个）。取一条类光去心直线
      {λ k_0 : λ ∈ R\{0}}，k_0 ≠ 0，k_0^2 = 0。A^i_n = ∮ dz/(2πi) ∂X^i e^{i n k_0·X}，n ≠ 0，
      其中 k_0 的标度按 2α' k_0·p = 1 取定（p 是被作用态的动量），故必须 k_0·p ≠ 0；
      标度因子 λ = 1/(2α' k_0·p) 的符号随 sign(k_0·p)。A^i_n 把动量 p 移到 p + n k_0，
      且 k_0·(p + n k_0) = k_0·p，故一次归一化对整条塔 {p + n k_0} 有效。
      [L_m, A^i_n] = 0，[A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}。

      全局限定。以下 (1)(2) 的一切断言都只在 p ≠ 0 上作出；在 (1)（已固定 k_0）中进一步只在
      k_0·p ≠ 0 上作出。p = 0 或（在 (1) 中）k_0·p = 0 的动量不在本陈述范围内。

      (1) 设 D = 26 且 a = 1。固定一条类光去心直线 {λ k_0}，k_0^2 = 0；对每个动量 p 按
          2α' k_0·p = 1 逐塔取定 k_0 的标度（含符号）。在扇区 {p : k_0·p ≠ 0} 上：
        (1a) 对任意 p 满足 k_0·p ≠ 0、任意 ψ ∈ H_phys(p)：⟨ψ|ψ⟩ ≥ 0。
        (1b) 设 k 满足 α' k^2 = 1（即 N = 0 的快子壳）且 k_0·k ≠ 0，k_0 已按 2α' k_0·k = 1 归一化。
             令 H_phys(k; k_0) = ⊕_{N ≥ 0} H_phys(k - N k_0)（由 α'(k - N k_0)^2 = 1 - N，
             其第 N 个直和项恰是能级 N 的物理态），
             H_0(k; k_0) = {χ ∈ H_phys(k; k_0) : ⟨χ|ψ⟩ = 0 ∀ ψ ∈ H_phys(k; k_0)}，
             H^⊥(k) = span{A^{i_1}_{-n_1} ⋯ A^{i_r}_{-n_r} |0; k⟩ : r ≥ 0, n_j ≥ 1, i_j ∈ {2,...,25}}
             （A^i_{-n} 把动量移到 p - n k_0、能级升 n，所以 H^⊥(k) ⊂ H_phys(k; k_0)）。则
          (1b-i)   H_phys(k; k_0)/H_0(k; k_0) 上由 Fock 内积诱导的内积正定；
          (1b-ii)  H^⊥(k) ↪ H_phys(k; k_0) ↠ H_phys(k; k_0)/H_0(k; k_0) 是等距同构：
                   线性双射且保内积；
          (1b-iii) 该同构保能级分级：左边 N = Σ n_j，右边 N = 振子能级 = a - α' p^2，
                   等价于动量 p = k - N k_0。（不是 L_0 分级；H_phys 上 L_0 ≡ 1。）

      (2) 设 D > 26 且 a = 1。则存在动量 p ≠ 0 与 ψ ∈ H_phys(p) 使 ⟨ψ|ψ⟩ < 0。
          （p ≠ 0 是断言的一部分：p = 0 处对任意 D 都有负模物理态，故若不加量词本条对 D = 26 亦真。）
          对一般 a 不作断言。

      不断言的内容：D ≤ 25（任何 a）；D = 26 且 a ≠ 1；D > 26 且 a ≠ 1。
    verdict: faithful
    diff_notes: |
      【第五轮（维护性），2026-09-11，physics-auditor。statement_id 与 canonical_text 均未变，故不重做回译；
      第四轮回译文本与 faithful 裁定维持。本轮是拆卡后的记账核对，按任务要求先读了 canonical_text。】

      R5-1. 〔任务第 1 步：canonical_text 的 ddf-operators-v4 → v5〕**未改，因为无可改之处。**逐行检查（grep）：
            canonical_text（第 3–27 行）**不含** `ddf-operators-v4` 字样，也不含 v5；它只写「按 DDF 归一化 2α' k_0·p = 1」，
            不指向任何 DDF 节点 id。任务前提「canonical_text 三处仍引 v4」不成立。本文件里 `ddf-operators-v4` 共出现五处，
            全在本 audit 块内（第四轮回译文本开头的材料清单、回译第二段的括注、第四轮 diff_notes 的参照材料、
            第三轮末尾的【v4 变更记】两处）——它们是「当时读的是哪个节点」的历史记录，改动会伪造审计过程，一律原样保留。
            真正含三处 v4 引用的是 **statement** worldsheet.no-ghost-theorem-v4 的文本（记号段、(1) 引言的归一化出处、(1b) 的
            A^i_{-n} 出处），按根 CLAUDE.md 原则 1 不可变，curator 已在该节点 notes 加【2026-09-11 补注】说明读作 v5。
            核对结论：v4 与 v5 的 statement 从首段到说明 (c) 逐字相同（diff 只在末段：v4 的两句代数断言 ↔ v5 的免责段），
            去心直线与归一化 (★) 未变；故 canonical_text (1) 引言「去心直线 {λ k_0 : λ ∈ R \ {0}}、2α' k_0·p = 1 逐塔取定、
            λ 符号随 sign(k_0·p)」与 v5 一致，不需要任何改动。

      R5-2. 〔任务第 2 步：有效状态下降的记账，`uv run stringgraph why worldsheet.no-ghost-theorem-v4`〕
            own status rigorous，effective **physical-argument**，best_derivation 仍是 --via-goddard-thorn（自身 rigorous），
            被两条依赖压低：
            (a) worldsheet.ddf-commute-with-virasoro（[L_m, A^i_n] = 0）：own physical-argument，推导 --via-conformal-weight
                走 OPE + 围道形变，7 条依赖全是 physical-argument（energy-momentum-laurent-modes、normal-ordering-modes-agree、
                energy-momentum-tensor-free-scalar、free-scalar-propagator、conformal-normal-ordering、primary-field、
                ope-commutator-dictionary），根部汇到 operator-product-expansion / operator-equation-of-motion。
                **缺什么**：Lean 侧共形权恒等式 L_m^{(a+b)} V_J − V_J L_m^{(a)} = (J + b·a − m + (m+1)·½ b·b) V_{J−m} 的
                **基例**（L_m 作用在 `Fock.creaExp` 上），归纳步已有；formalizer 的 VertexWeight.lean **进行中**。
            (b) worldsheet.ddf-transverse-oscillator-algebra（[A^i_m, A^j_n] = m δ^{ij} δ_{m+n,0}）：own physical-argument，
                4 条依赖 physical-argument（free-scalar-propagator、conformal-normal-ordering、ope-commutator-dictionary、
                transverse-oscillator-commutators ← light-cone-gauge-lagrangian ← polyakov-nambu-goto-classical-equivalence）。
                **缺什么**：两个顶点算子的乘积 / 重排序（VertexOperator.lean 文件头逐字「No operator products」），Lean 侧**未起步**；
                另加 (A^i_n)† = A^i_{−n} 无节点（Gram 矩阵正定性还需要它，第 (1b) 条的隐含缺口，推导 gaps 已登记）。
            记账性质：两条对易关系拆卡前写在 `kind: definition` + `status: rigorous` 的 ddf-operators-v4 文本里，以「定义的一部分」
            传播 rigorous；图中从未独立论证，文献（GSW §2.3.3 式号 L0、GT 1972 正文未获取、Goddard 2008 只预设）也不证。
            这是拆卡暴露的既有事实，不是论证退步。worldsheet.critical-dimension-old-covariant 的 effective 同步降为 physical-argument。
            注意升级的正确形态：现有两条 --via-conformal-weight 推导被 ope-commutator-dictionary 等根节点封顶，**改它们的 status
            字段不可能提升 effective**；须新增一条不经过 OPE 机器的推导（Lean 路线给 formalized，或数学文献顶点代数的带编号严格证明）。
            **陈述忠实性不受影响：第四轮 faithful 裁定维持。** audit.status 保持 back-translated，本轮不置 approved。

      R5-3. 〔任务第 3 步：船长在 effective = physical-argument 时 approved 是否与里程碑定义冲突〕**不冲突，建议可以批。**
            依据：graph/CLAUDE.md 定义里程碑为「经人审计的规范陈述，指向一个 statement id」；docs/VISION.md 第一层「少数里程碑陈述
            由物理学家（船长）逐条确认**自然语言表述与规范约定**，并通过回译审计」；本 skill 的比对项全部是量词、前提、结论强度、
            边界情形。三处都说审计对象是**陈述的忠实性**，不是推导的严格性。推导严格性由 docs/STATUS_LEVELS.md 的 effective 承担，
            「有效状态由工具计算，不手写」（根 CLAUDE.md 原则 2），且 `stringgraph report` 对每个里程碑单列其猜想依赖——设计上
            就是让「已批准的陈述」与「其推导链多严格」是两个正交的轴。若把 approved 绑到 effective ≥ rigorous，会得到反向激励：
            为了保住批准而不拆定义卡，正是本次拆卡纠正的那种记账错误。
            两点附带建议：(i) 船长批准时应知晓 effective 目前是 physical-argument、瓶颈是 R5-2 的两条对易关系（ROADMAP「待船长裁决」
            已写明）；(ii) 建议 lead 在 docs/STATUS_LEVELS.md 或 graph/CLAUDE.md 加一句「audit.status = approved 只断言陈述忠实，
            不断言 effective 等级」，以免日后读者把 approved 误读为 rigorous。这是文档补充，不阻止批准。

      R5-4. 〔任务第 4 步：ddf-transverse-oscillator-algebra 新增前提 vs canonical_text (1b) 的 H^⊥(k)〕**自洽。**
            (a) m, n ≠ 0：(1b) 的 H^⊥(k) 由 A^i_{-n_j}、n_j ≥ 1 作用在 |0; k⟩ 上生成，所用指标全为 −n_j ≤ −1；Gram 矩阵计算
                另需 (A^i_n)† = A^i_{−n}（n ≥ 1）把湮灭侧搬过来，指标为 +n ≥ 1。两侧都不含 0，**前提 m, n ≠ 0 自动满足**；
                且 v4/v5 定义处本来就写 n ∈ Z \ {0}，命题只是把定义域的量词重复写出。
            (b) ε^i·ε^j = δ^{ij}：canonical_text 不出现 ε，只写「24 个横向 DDF 算子 A^i_{-n}，i = 2..25」。「横向」按 v5 首句
                「与 worldsheet.light-cone-quantization 一致」，该节点的内积 a·b = −(a^+b^- + a^-b^+) + a^i b^i 使横向坐标标架
                正交归一，δ^{ij} 本在其中；且第二、三、四轮数值复核取 k_0 = (1,1,0,…)/√2 落在 0–1 平面，横向 ε^i = e_i 同时满足
                ε^i·k_0 = 0 与 ε^i·ε^j = δ^{ij}。故新增前提与 (1b) 相容，不是新假设。
                附带精度观察（属 ddf-operators-v5，不属本里程碑，不阻止）：v5 引入偏振 ε^i 却在公式里写坐标分量 ∂X^i；
                两者一致要求 k_0 无横向分量（k_0 在 0–1 平面内），即「固定类光去心直线」同时固定了横向标架。v5 未明写这一点，
                形式化时须显式选定；对一般方向的 k_0 应读作 ε^i·∂X。建议 curator 在 v5 notes 登记，不需要 v6。

      R5-5. 本轮未改 canonical_text、statement_id、verdict、back_translation.text；只加本块。

      【第四轮 diff_notes，2026-09-10，对象 worldsheet.no-ghost-theorem-v4 与按 v4 改写后的 canonical_text】
      参照材料（回译写完后才读）：canonical_text；v4 / ddf-operators-v4 的 notes 与 sources；推导
      worldsheet.no-ghost-theorem-v4--via-goddard-thorn（含 gaps）；worldsheet.no-ghost-theorem-subcritical 全文；
      literature/extractions/brst-cohomology-sources.md §1.3（FGZ Thm 2.8 逐字）、§3–§4；primary-sources-round2.md
      §1.6（LZ 1991 Thm 3.5 逐字）、§4、§9.3；polchinski-1998-v1.md E58/E68。GT 1972 正文仍未获取。
      数值复核脚本重写为 graph/build/noghost_round4_check.py（gitignore，不入库；uv run --with numpy），
      α' = 1/2、mostly-plus，k = (0,√2,0,…)、k_0 = (1,1,0,…)/√2，p_N = k − N k_0，直接求 L_1..L_N 公共核再看 Fock
      Gram 矩阵在核上的特征值符号 (负,零,正)：
        D=26, a=1, p_N（p ≠ 0、k_0·p = 1 ≠ 0）：N=1/2/3 = (0,1,24) / (0,26,324) / (0,375,3200)，正特征值个数 = p_24(N)，
            且每个 p_N 的质量壳能级 a − α'p_N² 恰为 N；dim H_phys(p_N) = 25/350/3575。⇒ (1a)(1b-i)(1b-ii 维数)(1b-iii) N ≤ 3 通过。
        D=27, a=1, 同一塔：N=1 (0,1,25)，N=2 (1,26,350)，N=3 (26,377,3575)。p_2、p_3 类时、非零、k_0·p = 1。⇒ (2) 的见证
            在 p ≠ 0 上存在。
        D=26, a=1, p=0：N=1 (1,0,25)，N=2 (25,0,325)。⇒ 第三轮 B1 的反例复现：不加 p ≠ 0 量词则 (2) 对 D=26 亦真。
        D=26, a=1, N=1, p=(1,1,0,…)（p ≠ 0、p² = 0 在壳、k_0·p = 0）：(0,1,24)，无负模。⇒ (1) 多排除的 k_0·p = 0 扇区
            在 N=1 处无鬼（与第三轮 B2 一致），排除是收窄而非必要，允许。

      A. 任务指定的核查项
      A1. 〔(a) 全局动量限定是否同时约束 (1)(2)〕是，且无歧义。v4 把限定写成独立段落置于 (1)(2) 之前，逐字写明
          「对下述 (1) 与 (2) **同时**生效」，并在 (2) 内部重复写出量词「存在动量 p ≠ 0 与 |ψ⟩ ∈ H_phys(p)」——两层保险，
          任一层单独都足以钉死读法。对 (1)：全称量词的范围被限到 {p : k_0·p ≠ 0}（蕴含 p ≠ 0）；对 (2)：存在量词的见证
          被限到 p ≠ 0。二者与"一切断言只在非退化扇区上作出"的读法一致，无第三轮那种"按位置读"的歧义。
          附带自洽性：(1b) 的塔 {k − N k_0} 自动落在扇区内（k_0·(k − N k_0) = k_0·k ≠ 0 ⇒ 每个塔动量非零且 k_0·p ≠ 0），
          故 (1b) 不需要另加扇区条件。canonical_text 的对应段落与 v4 语义逐条相同。
