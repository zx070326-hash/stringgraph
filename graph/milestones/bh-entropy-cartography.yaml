      - canonical_text 写"不在本里程碑审计范围内"，回译写"不在数学脊柱上"、"不在本回译范围内"。

      裁定：faithful。canonical_text 与回译在命题内容上语义等价，措辞差异不改变陈述范围。
      数学脊柱（Φ₁₀ → DMZ → Sen）均为 rigorous，物理识别（①②③）均为 physical-argument，
      边界清晰。
