      数学对象。Igusa 权 10 尖点形式 Φ₁₀(Ω) 是 Sp(4,ℤ)（整 Siegel 模群）的权 10 尖点形式，
      Ω = [[ρ, v], [v, σ]] 为 Siegel 上半空间（度 2）变量（ρ,σ∈ℍ，v∈ℂ，Im Ω>0）。
      由 Borcherds 升举公式定义，在 Sp(4,ℤ) 权 10 尖点形式空间中（至标量倍）唯一，
      零点除子位于超曲面 {mρ + nσ + lv ∈ ℤ，4mn−l²=1} 的 Sp(4,ℤ)-轨道上（即 Humbert
      曲面 H₁），沿该轨道为**二重**零点：Div(Φ₁₀) = 2H₁。
      【2026-09-20 physics-auditor 复核订正，见 docs/reviews/phi10-zero-multiplicity-defect-2026-09-20.md
      与 docs/reviews/phi10-multiplicity-normalization-2026-09-20.md】：本段在 2026-09-15
      批准版本中原写「唯一零点……为单零点」，与本项目已登记的一手来源矛盾——
      literature/sources.bib 的 gritsenko-nikulin-1996 条目 note 给出 Div(Δ₅)=H₁ 且
      χ₁₀=Φ₁₀=Δ₅²（p.7 环生成元列表），故 Div(Φ₁₀)=2·Div(Δ₅)=2H₁（重数 2，非 1）；
      sen-2008-precision-counting 条目 note 给出独立物理 threshold-integral 推导
      （(C.25)/(C.26)：Φ̂(ρ,σ,v)=−4π²v²g(ρ)g(σ)+O(v⁴)），在 v=0 附近显式为 v² 阶（二重）零点，
      与前者局部吻合。经本轮复核，图内 holography.dvv-wall-crossing-identification 的
      Δd=(−1)^{Q·P+1}(Q·P)·d_{1/2}(Q²/2)·d_{1/2}(P²/2) 跳变公式（线性正比于 Q·P）也只与
      二重极点的留数（Laurent 展开 1/(w²h(Ω))，Res[f(w)/w²]=f'(0)：取 f(w)=e^{-2πi(Q·P)w}
      时 f'(0)∝Q·P；简单极点 1/(wh(Ω)) 给出的 Res[f(w)/w]=f(0) 是与 Q·P 无关的常数，
      给不出这个线性因子）自洽——三条独立证据一致指向重数 2。本段已按二重零点订正；
      **此订正先于 holography.igusa-cusp-form-phi10 / phi10-wall-crossing-poles 的 v2 卡落地**，
      v2 落地后本里程碑应重新核对是否需要把依赖链的指针改到新 id（本里程碑自身的
      statement_id 是 holography.mock-jacobi-coefficient-positivity，该卡本身不含此断言，
      本段属回译时对依赖链背景信息的转述，不是本里程碑核心命题的一部分）。

      DMZ 正则分解定理（rigorous）。设 φ(τ,z) 是指标 m∈ℤ_{>0} 的亚纯 Jacobi 形式
      （weight k∈ℤ，对 SL(2,ℤ)×ℤ² 变换），极点仅在 z∈ℚτ+ℚ 处（即极点在 z=0 的
      SL(2,ℤ)×ℤ² 轨道上，阶数≤2）。则 φ 存在唯一典范正则分解
        φ(τ,z) = φ_F(τ,z) + φ_P(τ,z)，
      其中 (a) φ_F（有限部）是指标 m 的 mock Jacobi 形式（权 k），满足 Jacobi 群变换律，
      其完成量 φ̂_F 在非全纯修正下满足模变换；(b) φ_P（极部）是有限个 Appell-Lerch 和
        A_{m,s}(τ,z) = e^{2πi s z} ∑_{r∈ℤ} q^{mr²+(2ms+1)r} y^{2mr+2ms+1} / (1−q^r y)
      的线性组合，与 φ 的极点结构精确吻合；(c) 分解在 J_{k,m}^{cusp}=0 时严格唯一。
      对 1/Φ₁₀（固定 n 后作为指标 m 的 Jacobi 形式），分解给出"单心 dyon 贡献 φ_F"与
      "多中心贡献 φ_P"的数学分离。证明：Dabholkar-Murthy-Zagier 2012 §3 Theorem 1.1。

      mock Jacobi 系数正性定理（rigorous）。设 ψ_m^F 为 DMZ 分解后指标 m 的 mock Jacobi 形式
      （有限部），其傅里叶系数记为 c_m^F(n,ℓ)：ψ_m^F(τ,z) = ∑ c_m^F(n,ℓ) q^n y^ℓ。
      另设单心（免死）指标 d_*(m,n,ℓ) 为沿吸引子围道 𝒞_* 的积分
        d_*(m,n,ℓ) = ∫_{𝒞_*} dρ dσ dv · e^{−2πi(mρ+nσ+ℓ(v+½))} / Φ₁₀(ρ,σ,v)，
      即 1/Φ₁₀ 在电荷依赖点（吸引子点）的傅里叶系数。注意：d_* 一般不等于 (−1)^{ℓ+1} c_m^F(n,ℓ)，
      后者只在代表元范围内与之相等，范围外须减多心留数。

      则：
      (a) 代表元范围正性（Rosselló Thm 1）：对所有整数 m>0、n≥m、0≤ℓ≤m，
            (−1)^{ℓ+1} c_m^F(n,ℓ) > 0。
          在此范围内（ℓ≤m≤n ⇒ ℓ<2m 且 ℓ<2n）多心贡献为零，此时 d_*(m,n,ℓ) = (−1)^{ℓ+1} c_m^F(n,ℓ)。

      (b) 全范围正性（Rosselló Cor 1.1）：对所有 m,n,ℓ∈ℤ 满足
            m≥1,  n≥1,  Δ=4mn−ℓ²>0,  gcd(m,n,ℓ)=1（torsion I=1），
          有
            d_*(m,n,ℓ) > 0。
          注意：对象是单心指标 d_*，不是全范围 (−1)^{ℓ+1} c_m^F(n,ℓ)——后者在全范围为假。
          反例：(m,n,ℓ)=(10,1,6)，c_10^F(1,6)=1393564656，(−1)^7 c_10^F(1,6)<0，
          但减去多心留数后 d_*(10,1,6)=50064>0（等于代表元 d_*(1,1,0)=(−1)c_1^F(1,0)）。

      覆盖范围。Bringmann-Murthy 2012 覆盖 mock Jacobi 形式指标 m=1,2（对这两个 m 覆盖全部 Δ>0，
      含小判别式）；Rosselló 2024 补齐 m≥3（m=3,4,5 显式验证，m≥6 一般论证），两者合并覆盖
      全部 m,n≥1、Δ>0、gcd=1。证明方法：S-对偶约化到代表元 + Rademacher 展开 +
      Kloosterman/Bessel 显式定界，纯解析数论，不依赖物理假设。

      物理识别（不在审计范围）。"d_* = immortal dyon 简并度、c_m^F = 其生成函数系数"的识别
      属于 physical-argument（依赖 4d-5d 提升、SUSY 非重整化、S-对偶、supergravity BPS 解分析），
      不在本回译范围内。

      陈述范围。本里程碑审计的纯数学脊柱：Φ₁₀ 的 Siegel 模形式性质 → DMZ 分解定理 →
      mock Jacobi 系数 c_m^F 在代表元范围的符号正性（(a)）+ 单心指标 d_* 在全范围的正性（(b)）。
      三者均为 rigorous 数学结果。
