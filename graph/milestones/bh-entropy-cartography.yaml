id: ms.bh-entropy-cartography
statement_id: holography.immortal-dyon-index-positive
canonical_text: |
  N=4 弦论黑洞熵计数的数学脊柱（Φ₁₀ → DMZ 分解 → Sen 正性）：

  **数学背景**：Igusa 权 10 尖点形式 Φ₁₀(Ω) 是 Sp(4,ℤ) 的唯一（至标量）权 10 尖点形式，
  其倒数 1/Φ₁₀ 可作傅里叶展开 ∑ d(m,n,l) e^{2πi(mρ+nσ+lv)}。对固定 n，将 1/Φ₁₀
  视为 (ρ,v) 的亚纯 Jacobi 形式（指标 m）。

  **DMZ 正则分解定理**（Dabholkar-Murthy-Zagier 2012，严格数学）：任何指标 m 的亚纯 Jacobi 形式
  φ（极点仅在有理格点）存在唯一典范分解
    φ(τ,z) = φ_F(τ,z) + φ_P(τ,z)，
  其中 φ_F 是 mock Jacobi 形式（有限部），φ_P 是 Appell-Lerch 和（极部）。
  当 φ = 1/Φ₁₀ 时，分解定理直接适用。

  **Sen 正性定理**（Bringmann-Murthy 2012 对充分大判别式 + Rosselló 2024 对所有情形）：
  设 d_F(m,n,l) 为 φ_F 的傅里叶系数，则对所有满足
    d = 4mn − l² > 0，  gcd(m,n,l) = 1
  的整数三元组 (m,n,l)，有
    d_F(m,n,l) > 0。
  证明方法：解析数论（Hardy-Ramanujan 圆法、Kloosterman 和估计），完全在 mock 模形式框架内，
  不依赖物理假设。

  **物理意义**（不在本里程碑审计范围内）：DVV（Dijkgraaf-Verlinde-Verlinde 1997）提议
  d(m,n,l) = 1/4-BPS dyon 螺旋超迹，DMZ 识别 φ_F 系数 = 单心（immortal）dyon 贡献，
  故 Sen 正性对应黑洞微观简并度正性。这些识别是 physical-argument（依赖 4d-5d 提升、
  超对称非重整化、对偶论证、supergravity BPS 解分析），不是严格数学推论。

  **本里程碑审计的是纯数学脊柱**：Φ₁₀ 作为 Siegel 模形式的性质 → DMZ 分解定理 →
  mock Jacobi 系数 d_F(m,n,l)>0 的解析数论证明。三者均为 rigorous 数学结果。
canonical_source:
  ref: rossello-2024
  loc: "主定理（所有 d>0，gcd=1 情形的完整证明，关闭 Sen positivity 猜想）"
audit:
  status: back-translated
  back_translation:
    by: physics-auditor
    text: |
      【回译，第一轮，physics-auditor，2026-09-14。仅依据 holography.immortal-dyon-index-positive
      及其依赖链（holography.dmz-mock-jacobi-decomposition, holography.igusa-cusp-form-phi10）
      的 statement 字段写成；写此文时未读各节点的 notes、前人审计记录。无 formal/ Lean 声明。】

      数学对象与定义。Igusa 权 10 尖点形式 Φ₁₀(Ω) 是 Sp(4,ℤ) 整 Siegel 模群的权 10 尖点形式，
      其中 Ω = [[ρ,v],[v,σ]] 为 Siegel 上半空间（度 2）变量（ρ,σ∈ℍ，v∈ℂ，Im Ω>0）。
      Φ₁₀ 由 Borcherds 升举公式给出，在 Sp(4,ℤ) 权 10 尖点形式空间中（至标量倍）唯一，
      唯一零点位于判别式 4mn−l²=1 的超平面族的 Sp(4,ℤ)-轨道上。

      DMZ 正则分解定理（数学，rigorous）。设 φ(τ,z) 是指标 m∈ℤ_{>0} 的亚纯 Jacobi 形式
      （weight k∈ℤ，对 SL(2,ℤ)×ℤ² 变换），极点仅在 z∈ℚτ+ℚ 处（即极点在 z=0 的
      SL(2,ℤ)×ℤ² 轨道上，阶数 ≤2）。则 φ 存在唯一典范正则分解
        φ(τ,z) = φ_F(τ,z) + φ_P(τ,z)，
      其中 φ_F（有限部）是指标 m 的 mock Jacobi 形式（权 k），满足 Jacobi 群变换律，
      其完成量 φ̂_F 在非全纯修正下满足模变换；φ_P（极部）是有限个 Appell-Lerch 和
        A_{m,s}(τ,z) = e^{2πi s z} ∑_{r∈ℤ} q^{mr²+(2ms+1)r} y^{2mr+2ms+1} / (1−q^r y)
      的线性组合，与 φ 的极点结构精确吻合。分解在 J_{k,m}^{cusp}=0 时严格唯一；
      对 1/Φ₁₀（固定 n 后作为指标 m 的 Jacobi 形式）该条件成立。
      证明：Dabholkar-Murthy-Zagier 2012 §3 Theorem 1.1，使用 Fourier 展开、
      Appell-Lerch 和的模变换性质与 Jacobi 形式维数论证，是严格数学定理。

      Sen 正性定理（数学，rigorous）。设 d_F(m,n,l) 为 DMZ 分解后有限部 φ_F 的傅里叶系数。
      则对所有满足以下条件的整数三元组 (m,n,l)：
        d = 4mn − l² > 0，  gcd(m,n,l) = 1，
      有
        d_F(m,n,l) > 0。
      证明分两阶段：
      (1) Bringmann-Murthy 2012：用 Hardy-Ramanujan 圆法对 d_F(m,n,l) 做精确渐近展开，
          结合 Kloosterman 和估计，证明对充分大判别式 d≫1 有 d_F>0；
      (2) Rosselló 2024：对所有 d>0、gcd=1 情形（包括小判别式）证明 d_F>0，
          完全关闭 Sen positivity 猜想。
      两篇均以严格数学（解析数论，不依赖物理假设）证明 mock Jacobi 系数正性。

      物理识别（不在数学脊柱上）。以下三条物理识别是 physical-argument，不在本回译范围内：
      识别①（DVV 1997）：d(m,n,l) = 1/4-BPS dyon 螺旋超迹 −B₆(Q,P)；
      识别②（Sen 2007, Denef-Moore 2007）：围道选择 = 模空间壁穿越；
      识别③（DMZ 2012）：φ_F 系数 = 单心（immortal）dyon 贡献。
      这些识别依赖 4d-5d 提升、SUSY 非重整化、S-对偶、supergravity BPS 解分析，
      不是纯数学推论。

      陈述范围。本里程碑审计的是纯数学链：Φ₁₀ 存在与唯一性（Igusa 1962，Siegel 模形式维数公式）
      → DMZ 分解定理（DMZ 2012 §3 Theorem 1.1，严格证明）→ Sen 正性定理
      （BM 2012 + Rosselló 2024，解析数论）。三者均为 rigorous 数学结果，
      不依赖弦论或对偶论证。物理意义（黑洞熵、dyon 简并度）由识别①②③单独承担，
      是 physical-argument，不在里程碑陈述内。
    verdict: faithful
    diff_notes: |
      比对对象：canonical_text（本里程碑卡）↔ 回译（仅依据三个 statement 节点）。

      一致之处：
      - 数学脊柱三步（Φ₁₀ → DMZ 分解 → Sen 正性）在 canonical_text 与回译中表述一致。
      - DMZ 分解定理的条件（亚纯 Jacobi 形式、极点在有理格点、指标 m）精确对应。
      - Sen 正性定理的条件（d>0、gcd=1）与结论（d_F>0）完全一致。
      - 两侧均明确区分数学脊柱（rigorous）与物理识别（physical-argument），
        并将识别①②③排除在里程碑审计范围外。

      措辞差异（不影响语义等价）：
