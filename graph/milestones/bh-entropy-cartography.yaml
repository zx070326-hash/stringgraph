statement_id: holography.mock-jacobi-coefficient-positivity
canonical_text: |
  N=4 弦论黑洞熵计数的数学脊柱（Φ₁₀ → DMZ 分解 → mock Jacobi 系数正性）：

  **数学背景**：Igusa 权 10 尖点形式 Φ₁₀(Ω) 是 Sp(4,ℤ) 的唯一（至标量）权 10 尖点形式，
  其倒数 1/Φ₁₀ 可作傅里叶展开 ∑ d(m,n,l) e^{2πi(mρ+nσ+lv)}。对固定 n，将 1/Φ₁₀
  视为 (ρ,v) 的亚纯 Jacobi 形式（指标 m）。

  **DMZ 正则分解定理**（Dabholkar-Murthy-Zagier 2012，严格数学）：任何指标 m 的亚纯 Jacobi 形式
  φ（极点仅在有理格点）存在唯一典范分解
    φ(τ,z) = φ_F(τ,z) + φ_P(τ,z)，
  其中 φ_F 是 mock Jacobi 形式（有限部），φ_P 是 Appell-Lerch 和（极部）。
  当 φ = 1/Φ₁₀ 时，分解定理直接适用。

  **mock Jacobi 系数正性定理**：设 ψ_m^F 为 DMZ 分解后的指标 m mock Jacobi 形式（有限部），
  其傅里叶系数记为 c_m^F(n,ℓ)；另设 d_*(m,n,ℓ) 为沿吸引子围道 𝒞_* 的积分
  （1/Φ₁₀ 在电荷依赖点的傅里叶系数，即单心指标）。则：

  (a) **代表元范围**（Rosselló 2024 Thm 1）：对所有 m>0、n≥m、0≤ℓ≤m，
      (−1)^{ℓ+1} c_m^F(n,ℓ) > 0。
      在此范围内 d_*(m,n,ℓ) = (−1)^{ℓ+1} c_m^F(n,ℓ)（多心贡献为零）。

  (b) **全范围**（Rosselló 2024 Cor 1.1）：对所有 m,n≥1、Δ=4mn−ℓ²>0、gcd(m,n,ℓ)=1，
      d_*(m,n,ℓ) > 0。
      此处正性对象是**单心指标 d_***，不是 c_m^F——后者在全范围正性为假，
      反例 (m,n,ℓ)=(10,1,6) 有 (−1)^{6+1} c_10^F(1,6) < 0，但 d_*(10,1,6) = 50064 > 0。

  证明覆盖：Bringmann-Murthy 2012 覆盖 **mock Jacobi 指标 m=1,2**（对这两个 m 覆盖全部 Δ>0，
  含小判别式，**不是**"充分大判别式"）；Rosselló 2024 补齐 m≥3，合并覆盖全部 m,n≥1、Δ>0、gcd=1。
  证明方法：S-对偶约化到代表元 + Rademacher 展开 + Kloosterman/Bessel 定界，完全在 mock 模形式
  与解析数论框架内，不依赖物理假设。

  **物理意义**（不在本里程碑审计范围内）：DVV（Dijkgraaf-Verlinde-Verlinde 1997）提议
  d(m,n,l) = 1/4-BPS dyon 螺旋超迹，DMZ 识别 φ_F 系数与 d_* = 单心（immortal）dyon 贡献，
  故 d_* 正性对应黑洞微观简并度正性。这些识别是 physical-argument（依赖 4d-5d 提升、
  超对称非重整化、对偶论证、supergravity BPS 解分析），不是严格数学推论。

  **本里程碑审计的是纯数学脊柱**：Φ₁₀ 作为 Siegel 模形式的性质 → DMZ 分解定理 →
  mock Jacobi 系数 c_m^F 在代表元范围的符号正性 + 单心指标 d_* 在全范围的正性。三者均为 rigorous 数学结果。
