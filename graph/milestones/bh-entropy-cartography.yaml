  back_translation:
    by: physics-auditor
    text: |
      【回译，第二轮，physics-auditor，2026-09-15。task #20 拆卡后重锚至 holography.mock-jacobi-coefficient-positivity
      + 订正 d_*/c_m^F 与 BM 覆盖范围。仅依据该卡及其依赖链（holography.dmz-mock-jacobi-decomposition,
      holography.igusa-cusp-form-phi10）的 statement 字段写成；写此文时未读 canonical_text、各节点的 notes、
      前人审计记录。无 formal/ Lean 声明。】

      数学对象。Igusa 权 10 尖点形式 Φ₁₀(Ω) 是 Sp(4,ℤ)（整 Siegel 模群）的权 10 尖点形式，
      Ω = [[ρ, v], [v, σ]] 为 Siegel 上半空间（度 2）变量（ρ,σ∈ℍ，v∈ℂ，Im Ω>0）。
      由 Borcherds 升举公式定义，在 Sp(4,ℤ) 权 10 尖点形式空间中（至标量倍）唯一，
      唯一零点位于超曲面 {mρ + nσ + lv ∈ ℤ，4mn−l²=1} 的 Sp(4,ℤ)-轨道上，为单零点。

      DMZ 正则分解定理（rigorous）。设 φ(τ,z) 是指标 m∈ℤ_{>0} 的亚纯 Jacobi 形式
      （weight k∈ℤ，对 SL(2,ℤ)×ℤ² 变换），极点仅在 z∈ℚτ+ℚ 处（即极点在 z=0 的
      SL(2,ℤ)×ℤ² 轨道上，阶数≤2）。则 φ 存在唯一典范正则分解
        φ(τ,z) = φ_F(τ,z) + φ_P(τ,z)，
      其中 (a) φ_F（有限部）是指标 m 的 mock Jacobi 形式（权 k），满足 Jacobi 群变换律，
      其完成量 φ̂_F 在非全纯修正下满足模变换；(b) φ_P（极部）是有限个 Appell-Lerch 和
        A_{m,s}(τ,z) = e^{2πi s z} ∑_{r∈ℤ} q^{mr²+(2ms+1)r} y^{2mr+2ms+1} / (1−q^r y)
      的线性组合，与 φ 的极点结构精确吻合；(c) 分解在 J_{k,m}^{cusp}=0 时严格唯一。
      对 1/Φ₁₀（固定 n 后作为指标 m 的 Jacobi 形式），分解给出"单心 dyon 贡献 φ_F"与
      "多中心贡献 φ_P"的数学分离。证明：Dabholkar-Murthy-Zagier 2012 §3 Theorem 1.1。

      mock Jacobi 系数正性定理（rigorous）。设 ψ_m^F 为 DMZ 分解后指标 m 的 mock Jacobi 形式
      （有限部），其傅里叶系数记为 c_m^F(n,ℓ)：ψ_m^F(τ,z) = ∑ c_m^F(n,ℓ) q^n y^ℓ。
      另设单心（免死）指标 d_*(m,n,ℓ) 为沿吸引子围道 𝒞_* 的积分
        d_*(m,n,ℓ) = ∫_{𝒞_*} dρ dσ dv · e^{−2πi(mρ+nσ+ℓ(v+½))} / Φ₁₀(ρ,σ,v)，
      即 1/Φ₁₀ 在电荷依赖点（吸引子点）的傅里叶系数。注意：d_* 一般不等于 (−1)^{ℓ+1} c_m^F(n,ℓ)，
      后者只在代表元范围内与之相等，范围外须减多心留数。

      则：
      (a) 代表元范围正性（Rosselló Thm 1）：对所有整数 m>0、n≥m、0≤ℓ≤m，
            (−1)^{ℓ+1} c_m^F(n,ℓ) > 0。
          在此范围内（ℓ≤m≤n ⇒ ℓ<2m 且 ℓ<2n）多心贡献为零，此时 d_*(m,n,ℓ) = (−1)^{ℓ+1} c_m^F(n,ℓ)。

      (b) 全范围正性（Rosselló Cor 1.1）：对所有 m,n,ℓ∈ℤ 满足
            m≥1,  n≥1,  Δ=4mn−ℓ²>0,  gcd(m,n,ℓ)=1（torsion I=1），
          有
            d_*(m,n,ℓ) > 0。
          注意：对象是单心指标 d_*，不是全范围 (−1)^{ℓ+1} c_m^F(n,ℓ)——后者在全范围为假。
          反例：(m,n,ℓ)=(10,1,6)，c_10^F(1,6)=1393564656，(−1)^7 c_10^F(1,6)<0，
          但减去多心留数后 d_*(10,1,6)=50064>0（等于代表元 d_*(1,1,0)=(−1)c_1^F(1,0)）。

      覆盖范围。Bringmann-Murthy 2012 覆盖 mock Jacobi 形式指标 m=1,2（对这两个 m 覆盖全部 Δ>0，
      含小判别式）；Rosselló 2024 补齐 m≥3（m=3,4,5 显式验证，m≥6 一般论证），两者合并覆盖
      全部 m,n≥1、Δ>0、gcd=1。证明方法：S-对偶约化到代表元 + Rademacher 展开 +
      Kloosterman/Bessel 显式定界，纯解析数论，不依赖物理假设。

      物理识别（不在审计范围）。"d_* = immortal dyon 简并度、c_m^F = 其生成函数系数"的识别
      属于 physical-argument（依赖 4d-5d 提升、SUSY 非重整化、S-对偶、supergravity BPS 解分析），
      不在本回译范围内。

      陈述范围。本里程碑审计的纯数学脊柱：Φ₁₀ 的 Siegel 模形式性质 → DMZ 分解定理 →
      mock Jacobi 系数 c_m^F 在代表元范围的符号正性（(a)）+ 单心指标 d_* 在全范围的正性（(b)）。
      三者均为 rigorous 数学结果。
    verdict: faithful
    diff_notes: |
      比对对象：canonical_text（本里程碑，#20 修订后）↔ 回译（仅依据 holography.mock-jacobi-coefficient-positivity
      及其依赖链的 statement 字段，未读 canonical_text）。

      一致之处（核心命题）：
      - 数学脊柱三步（Φ₁₀ → DMZ 分解 → mock Jacobi 系数正性）在两侧表述完全一致。
      - Φ₁₀ 定义、唯一性、零点结构精确对应。
      - DMZ 分解定理的前提（亚纯 Jacobi 形式、极点在有理格点、指标 m）、结论
        （φ = φ_F + φ_P，唯一性条件 J_{k,m}^{cusp}=0）、严格度（rigorous，DMZ 2012）一致。
      - mock Jacobi 系数正性定理的两个结论精确对应：
        (a) 代表元范围（m>0, n≥m, 0≤ℓ≤m）：(−1)^{ℓ+1} c_m^F(n,ℓ) > 0；
        (b) 全范围（m,n≥1, Δ>0, gcd=1）：d_*(m,n,ℓ) > 0。
      - 两侧均明确指出对象分层：(a) 的对象是 c_m^F，(b) 的对象是 d_*（不是全范围 c_m^F），
        并写明反例 (10,1,6)。
      - 覆盖范围一致：Bringmann-Murthy 2012 覆盖指标 m=1,2（对这两个 m 覆盖全部 Δ>0，
        含小判别式，**不是**"充分大判别式"）；Rosselló 2024 补齐 m≥3。
      - 证明方法一致：S-对偶约化 + Rademacher 展开 + Kloosterman/Bessel 定界，纯解析数论。
      - 两侧均明确区分数学脊柱（rigorous）与物理识别（physical-argument），
        后者不在审计范围内。

      措辞差异（不影响语义）：
      - canonical_text 分段标题："数学背景"、"DMZ 正则分解定理"、"mock Jacobi 系数正性定理"、
        "物理意义"；回译用："数学对象"、"DMZ 正则分解定理"、"mock Jacobi 系数正性定理"、
        "覆盖范围"、"物理识别"、"陈述范围"。
      - canonical_text 在 Φ₁₀ 段提到"可作傅里叶展开 ∑ d(m,n,l) e^{2πi(mρ+nσ+lv)}"；
        回译未写 1/Φ₁₀ 的傅里叶展开（但写了 Borcherds 升举公式的存在）。
      - canonical_text 把 d_* 定义放在正性定理段首，紧接 c_m^F 定义；回译在同一位置给出同样定义，
        措辞略有不同但数学内容相同（围道积分式逐项一致）。
      - canonical_text 在 (b) 后用"此处正性对象是**单心指标 d_***，不是 c_m^F"强调；
        回译在 (b) 开头用"注意：对象是单心指标 d_*，不是全范围 (−1)^{ℓ+1} c_m^F(n,ℓ)——
        后者在全范围为假"完成同一强调。
      - canonical_text 把"Bringmann-Murthy 覆盖 m=1,2"放在正性定理段的"证明覆盖"子段；
        回译单列"覆盖范围"段落。结论表述一致。

      已订正的两个错误（task #20 修正目标，在 canonical_text 与 statement 均已修正，回译一致）：
      1. BM 覆盖范围：两侧均写"指标 m=1,2（对这两个 m 覆盖全部 Δ>0，含小判别式）"，
         **不是**"充分大判别式"。订正依据：extractions/bringmann-murthy-2012.md C1、
         extractions/rossello-2024.md E3。
      2. 全范围正性对象：两侧均写"(b) 的对象是 d_*(m,n,ℓ)>0"，**不是**"全范围 c_m^F>0"；
         并均写明反例 (10,1,6)。订正依据：extractions/rossello-2024.md R1–R4。

      裁定：faithful。canonical_text 与回译在命题内容上语义等价，措辞差异只在分段标题与叙述顺序，
      不改变陈述范围。数学脊柱（Φ₁₀ → DMZ → 正性）均 rigorous，物理识别（dyon 简并度）
      为 physical-argument，边界清晰。两个已知错误已在两侧同步订正。
