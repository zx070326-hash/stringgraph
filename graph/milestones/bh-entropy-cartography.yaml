      【回译，第二轮，physics-auditor，2026-09-15。task #20 拆卡后重锚至 holography.mock-jacobi-coefficient-positivity
      + 订正 d_*/c_m^F 与 BM 覆盖范围。仅依据该卡及其依赖链（holography.dmz-mock-jacobi-decomposition,
