[project]
name = "stringgraph"
version = "0.1.0"
description = "Machine-readable dependency graph of string theory results with epistemic status tracking"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.scripts]
stringgraph = "stringgraph.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/stringgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
