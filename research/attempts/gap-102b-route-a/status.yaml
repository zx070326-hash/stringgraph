    初等不等式链），故 j=±1 是唯一候选，再由整除性论证（引理 C）排除 j=±1。
    此结果比原委托目标更强：不需要"Λ充分大"，任意 Λ 都成立（数论障碍，
    与几何/解析大小无关）。
  - proof.md §5：n2≠0 分支——建立 Sen (D.6)/(D.7) 的 p_L²/p_R² 恒等式工具，
