  ### 裁决要点 1：lead 点名的风险（§4 的"equivalently"）——CONFIRMED，无缺口

  lead 的疑虑是：S₆ 单射只给出 `dim S₆(Q) = D-1`，并**不显然**给出包含方向
  `ker(seedPair) ⊆ S₆(Q)`。reviewer 用只依赖已 formalized/无 sorry 砖块的论证重建了等价性：

  - `seedPair_eq_comp`（DescendantKernel.lean:344-348，已 Read 核实）**按定义**给出
    `ker(seedPair) = ker(descPair) ∩ (Q_5 × Q_4)`——这是定义性事实，不是假设。
  - 合冲恒等式（SeedTransferSix.lean:196-206，对 D、η、动量**无条件**，已 Read 核实）给出
    `S(V_{-6,1}) ⊆ ker(descPair)` 对**每个** u 成立，不需要种子条件。
  - (K6) `finrank_ker_descPair_six_le` 给出 `dim ker(descPair) ≤ D`。
  - 本定理（S₆ 整片单射）给出 `dim S(V_{-6,1}) = D`。
  - 三者合起来**强制** `S(V_{-6,1}) = ker(descPair)` 精确相等。
  - ⭐ **关键**：`mem_towerSeed_neg_six_one_iff`（SeedCriterionSix.lean:301-307，已 Read 核实）
    的量词是 `hu : u ∈ towerBigrade D K (-6) 1`，即跑遍**整片** V_{-6,1}，**不是**只跑 Q_{-6,1}。
    这正是推出 `{u ∈ V_{-6,1} : x4u∈Q_5 ∧ y3u∈Q_4} = Q_{-6,1}` 精确相等所需要的，
    再配合 S 单射即得 `ker(seedPair) = S(V_{-6,1}) ∩ (Q_5×Q_4) = S(Q_{-6,1})` 精确相等。

  ⇒ claim.md §4 确实如 prover 自评的那样"是已证引理之上的初等线性代数"，**没有藏一步实质新命题**。
  **lead 的主要疑虑就此解决：缺的那个包含方向不是缺的，它由已关闭的种子判据 iff 提供，
  而那条 iff 恰好是在正确的（整片）定义域上陈述的。**

