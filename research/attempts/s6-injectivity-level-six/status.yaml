  Completed lemmas (proof.md):
    - Fact 0 (oscillator-count bigrading of the free Fock space) and Fact 1 (L_n's
      level-bookkeeping) -- elementary structural facts, backed by
      worldsheet.bosonic-fock-space / worldsheet.fock-space-virasoro-representation.
    - Lemma 0: [L_n, alpha^mu_m] = -m alpha^mu_{n+m} for every n != 0, derived by hand
      from the bare CCR + Sugawara definition (Wick contraction), including an
      explicit resolution of the normal-ordering-ambiguity worry (vacuous for n != 0
      since the CCR commutator is identically zero whenever the two mode indices sum
      to n != 0, which holds for every term of L_n's sum whenever n != 0 -- and this
      proof only ever applies L_{-1}..L_{-4}). Cross-checked: this is *exactly* the
      already-proven, no-sorry Lean lemma Sugawara.lean:Lop_apply_mode (verified by
      direct Read, lines 955-981), confirming the hand derivation independently.
    - Sub-lemma (oscillator-count monotonicity): L_{-n} (n>=1) maps the
      >=2-oscillator subspace into itself (never leaks down to <=1 oscillators),
      proved by a clean nested induction (on monomial oscillator count r, base case
      r=2 spelled out in full, general r by peeling one factor at a time).
    - Lemma A: the leading single-oscillator component of any word L_{-n_k}...L_{-n_1}
      applied to alpha^mu_{-1}|0;p> is exactly (product of partial sums s_0*s_1*...*
      s_{k-1}) * alpha^mu_{-s_k}|0;p>, proved by induction on word length using Lemma 0
      + the sub-lemma. Fully general: works for every D, every p, every word.
    - Lemma B: explicit evaluation of Lemma A on the specific 3-term (y3) and 5-term
      (x4) words gives universal constants +30 (y3) and -408 (x4), hand-computed via
      an explicit table and cross-checked against scripts/verify_leading_coefficient.py
      for D in {6,8,10,12} (exact match, no discrepancy).
    - Main theorem: x4 alone, and y3 alone, are each injective on F(p)_1 for every D,
      K (CharZero), eta (hη), p -- because -408 != 0 and 30 != 0 in characteristic
      zero. A fortiori S6 = (x4,.)x(y3,.) is injective. Cross-checked against
      scripts/verify_single_operator_injectivity.py (D in {3,4,5,6,7,10,26,27}) and
      scripts/verify_s6_injectivity.py (D in {3,4,5,10,25,26,27,30}).

