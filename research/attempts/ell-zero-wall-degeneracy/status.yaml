  **结论（2026-09-20，修正版）**：Proposition A **已证明**。围道**确实穿过**极点 v=1/2
  （通过周期性），但留数 ∝ ℓ = 0 使 ℓ=0 情形自动良定。**这不是"问题不存在"（首版错误），
  而是"问题自动解决"**。

  **首版错误与修正过程（如实记录）**：
  - 首版 proof.md §3.1-3.4（commit 920a4e0 之前）错误地认为"极点 v=−1/2 在围道 [0,1] 外，
    问题不存在，应撤回 [GAP-ℓ0]"，基于对周期性的误解（以为围道是无周期的闭区间 [0,1]）。
  - Lead 在中途修正指出：Φ₁₀ 的 Fourier 展开指标为整数 ⇒ **自动周期 1**（不需要显式声明
    v ~ v+1）；Sen (D.19) 零点分支取 (m₁,n₁,m₂,n₂,j)=(0,0,m₂,0,1) 时 m₂ 是**完全自由的整数**
    （判别式 4m₁n₁+4m₂n₂+j²=1 在 n₂=0 时恒满足）⇒ 零点在全体 v∈ℤ ⇒ 平移后极点在 v∈ℤ−1/2
    ⇒ v=1/2（通过周期性与 v=−1/2 等同）**在围道内部**。
  - 修正后（commit ffe8893 + 920a4e0 + 046e9a1）：围道确实穿过极点，但 §2 推导的
    Res ∝ ℓ 机制（v-偶性 + 二阶零点 + 指数核导数项）使 ℓ=0 时留数为零 ⇒ d_*(m,n,0) 自动良定。

  **数学结论（完整、严格，依赖外部前提）**：
  - **§3.1-3.3**（极点定位）：Φ₁₀ 的周期 1（Fourier 展开）+ m₂ 自由性（Sen (D.19)）⇒ 零点在
    全体 v∈ℤ ⇒ 𝒢 := −1/Φ₁₀(ρ,σ,v+1/2) 的极点在 v∈ℤ−1/2，特别地 v=1/2 在围道 v₁∈[0,1] 内。
  - **§2.1-2.5**（留数 ∝ ℓ）：v-偶性（[EXT-Even]）+ 二阶零点（[EXT-Div]）⇒ Φ₁₀ = w²h，
    h 只含偶次项 ⇒ 𝒢 不含 s^{−1} 项。但指数核 e^{−2πiℓv} = 1 − 2πiℓ·s + O(s²) 的线性项
    与 s^{−2} 项相乘 ⇒ **Res_{v=1/2}[𝒢·e^{−2πiℓv}] = −2πiℓ·(1/h₀)**，正比于 ℓ。
  - **§4.1**（Proposition A）：ℓ=0 时 Res=0 ⇒ 微扰围道两侧之差 = 2πi×0 = 0 ⇒ d_*(m,n,0)
    自动良定，不需要主值规定。

  **对 gap-102b 的影响**：
  - [GAP-ℓ0] 标注是**正确的**，不应撤回。它正确识别了真实问题：围道穿过极点（通过周期性）。
  - 本 attempt 是**解决方案**：证明留数 ∝ ℓ = 0 使 ℓ=0 情形自动良定。
  - 建议在 gap-102b-route-a/proof.md 引用本证明，说明 ℓ=0 边界已闭合。

  **物理解释（§4.2）**：
  - ℓ = Q·P = 0 的 dyon 落在边缘稳定壁上（marginal stability wall 边界）。
  - 壁跨越跳变 Δd ∝ ⟨Γ₁,Γ₂⟩ = Q·P（Denef–Moore 1998）在 ℓ=0 时退化为零 ⇒ "透明墙"
    （壁两侧指标相同）。
  - §2.5 的 Res ∝ ℓ 机制从 Siegel 模形式的解析性质直接推出壁跨越的线性依赖，可能是首次
    （待 WebSearch 核查 ⇒ [GAP-4.2]）。

  **与 Rosselló Cor 1.1 的兼容性**：完全一致。ℓ=0 时 Δ=4mn>0 满足 Cor 1.1 判别式，
  本证明确认 d_*(m,n,0) 良定义（留数为零使定义无歧义），与 Cor 1.1 断言其>0 完全兼容。

