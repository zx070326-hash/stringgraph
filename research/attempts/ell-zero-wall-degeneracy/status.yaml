  - **§3.1-3.3**（极点定位）：Φ₁₀ 的周期 1（Fourier 展开）+ m₂ 自由性（Sen (D.19)）⇒ 零点在
    全体 v∈ℤ ⇒ 𝒢 := −1/Φ₁₀(ρ,σ,v+1/2) 的极点在 v∈ℤ−1/2，特别地 v=1/2 在围道 v₁∈[0,1] 内。
  - **§2.1-2.5**（留数 ∝ ℓ）：v-偶性（[EXT-Even]）+ 二阶零点（[EXT-Div]）⇒ Φ₁₀ = w²h，
