    与 s^{−2} 项相乘 ⇒ **Res_{v=1/2}[𝒢·e^{−2πiℓv}] = (−1)^ℓ·2πiℓ·(1/h₀)**，正比于 ℓ。
    （符号见上方 verdict 的【lead 订正】(1)：首版此式有两处符号错误，均为与 ℓ 无关的常数因子。）
