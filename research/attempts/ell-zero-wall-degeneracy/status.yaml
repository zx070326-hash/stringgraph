notes: |
  **结论（2026-09-20）**：原问题不存在。gap-102b-route-a 标注的 [GAP-ℓ0]（"ℓ=0 时围道穿过
  Φ₁₀ 零点，需要主值规定"）基于对定义 D 的半周期平移 v ↦ v+1/2 的忽略。

  **数学事实**：
  - 未平移时，Φ₁₀ 在 v=0 有二阶零点（Sen 2008 (D.19) + Gritsenko-Nikulin 1996 交叉验证）。
  - 定义 D 中被积函数是 𝒢 := −1/Φ₁₀(ρ,σ,v+1/2)，平移后极点在 v=−1/2。
  - 围道 C_* 定义为 v₁∈[0,1]（Rosselló (2.22) 逐字，闭区间，无周期性等同）。
  - 极点 v=−1/2 在围道外部（−1/2 < 0），积分不穿过极点，是普通收敛积分。

  **gap-102b 的诊断**：gap-102b §3 正确地指出"Φ₁₀ 在 v=0 有零点且围道 v₁∈[0,1] 穿过"，
  但忽略了定义 D 已经把被积函数平移到 Φ₁₀(ρ,σ,v+1/2)，极点移出围道。建议 gap-102b
  [GAP-ℓ0] 标注撤回或改写为"需核实定义 D 的平移后极点位置（已核实，在围道外）"。

  **本 attempt 的独立贡献**：
  - 证明了"Φ₁₀ 的 v-偶性 ⇒ 二阶极点留数（对 v）恒为零"（proof.md §2，依赖外部前提
    [EXT-Div]: Div(Φ₁₀)=2H₁ 与 [EXT-Even]: Φ₁₀(ρ,σ,−v)=Φ₁₀(ρ,σ,v)）。该结果在本情形下
    未触发（极点不在围道上），但可能在其它情形有用。
  - 解释了壁跨越跳变 Δd ∝ (Q·P) 为何是**线性**的（对应二阶极点留数，而非一阶极点的常数）。

  **与 Rosselló Cor 1.1 的兼容性**：完全一致。d_*(m,n,0) 是普通收敛积分（极点在围道外），
  Cor 1.1 断言其 >0 是合法的，无需排除 ℓ=0 或单独处理。

  **开放的技术性 GAP（非阻塞）**：
  - [GAP-3.3]: 排除 Sen (D.19) 其它零点分支在 ℓ=0 时与围道相遇。但 Rosselló Cor 1.1
    已提供间接证据（d_*(m,n,0)>0 说明积分收敛）。
  - [GAP-4.2]: ℓ=0 边界的物理意义（吸引子机制如何使围道避开极点、Q·P=0 壁的物理解释），
    待文献核查（WebSearch），未在本轮完成。

  **毕业路径**：无（原问题不存在，不构成新图节点）。本 attempt 可作为 gap-102b 的
  **勘误记录**保留，或并入 gap-102b-route-a/proof.md 作注释。§2 的 v-偶性引理若有
  独立价值，可单独提成图节点，但物理相关性待评估。

  **下一步建议**：
  1. 向 lead 报告：gap-102b [GAP-ℓ0] 标注应撤回（原问题不存在）。
  2. 在 gap-102b-route-a/proof.md §3 添加注释，说明定义 D 的半周期平移使极点移出围道。
