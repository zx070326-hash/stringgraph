# --- REVIEW OF THM 4.5, round 1, 2026-09-23 --------------------------------
# First adversarial review this attempt has received (reviewer was null until
# now). Two independent questions were asked: is Thm 4.5 correct, and what is
# left of it after the Witten prior art recorded in prior_art_thm_4_5 below.
review_thm_4_5:
  correctness:
    verdict: correct-with-gaps
    no_error_found: >-
      The reviewer traced the full chain at proof.md:201-425 and found NO
      computational mistake. Checks that came back clean: rank T_- = 2g-2+n+r
      = 2 for (0;4,0), so [K2]'s iff genuinely applies rather than only the
      one-directional half (proof.md:410); Lemma 4.2's weight-0 descent, where
      -1 acts on L hence on L^3 with weight 1 and Lambda^2 of a weight-1 rank-2
      bundle is weight 0, and T_X = rho^* T_calX because mu_2 -> X -> calX is
      etale; the rank self-check T_-^v = h^0(O(1)) = 2 (proof.md:286-287); the
      root-stack canonical degree deg omega_calX = -2 + 3*(1/2) = -1/2, which
      is the standard mu_2-root-stack-at-3-points formula and is independently
      cross-checked against div(d lambda) at proof.md:375-379 - the reviewer
      judged that cross-check a genuine non-trivial internal test, not
      decoration; and the Serre-duality vanishing, deg omega_calX^3 = -3/2 < 0
      => H^0 = 0 => H^1 = 0, standard for a tame proper stacky curve.
    gaps_remaining:
      - id: R-1
        where: proof.md:254-260 (the attempt's own GAP-1)
        what: >-
          The identification of X -> calX as precisely the mu_2-root stack
          (tau^2 = t, residual automorphism tau -> -tau) is IMPORTED from [K8],
          not re-derived from FKP. The general shape - spin-curve moduli near a
          node acquiring root-stack structure - is standard in the twisted-curve
          literature (Abramovich-Jarvis, Chiodo), so it is plausible, but the
          reviewer did not re-derive it. IMPORTANT: the attempt's own
          robustness argument (a half-integral local order is impossible on a
          scheme) is only PARTIAL mitigation - it establishes that the
          ramification is divisible by 2, NOT that the stack is exactly the
          diagonal-rigidified root stack claimed.
      - id: R-2
        where: proof.md:289-391 (Prop. 4.3, the explicit frame computation)
        what: >-
          Not redone from scratch by the reviewer. What WAS checked is internal
          consistency: the three independently derived local orders
          (-1/2, -1/2, +3/2) at lambda = 0, 1, infinity reproduce -div(d lambda)
          POINTWISE, not merely in total degree, and nothing in the setup forces
          that a priori. With Remark 4.6's margin (threshold needs deg > -1, the
          computed value is +1/2, and even a grossly wrong fallback of -4 would
          not break the theorem) the reviewer rates this plausible with
          reasonably high confidence but NOT independently confirmed.
      - id: R-3
        where: claim.md:52
        what: >-
          Sourcing only, not correctness. [K2] is cited solely as [CN Prop 2.2];
          the same fact is a numbered Donagi-Witten result (Cor. 2.3,
          arXiv:1304.7798 p.19), which is older and arguably the primary source.
          Add it.

# --- one-line answer -------------------------------------------------------
answer: >-
  Mixed (a) + (b) + (c), by region. (b) The threshold of paper.md Cor 8.5 is
  NOT sharp: the known non-projected region is the whole of g>=2, the two extra
  cells (2;0,0) and (2;1,0) coming from [CN Thm 1.1(2)] and [DW Thm 1.2] +
  restriction. This is NOT new - paper.md already records both transfers in
  four places; what is missing there is only the assembled statement. (a) Below
  that, a determinate corner is genuinely split: odd rank <= 1 (Cor 1.3) and
  the new case Sbar_{0;4,0} (Thm 4.5), hence everything of bosonic dimension
  <= 1 (Thm 5.1). (c) The rest of g <= 1, plus the odd component at g=2 with
  n >= 1, is open in both directions.
novelty: >-
  Section 3 (the g=2 row) is bookkeeping over published inputs, zero novelty.
  The new content is Section 4 (Sbar_{0;4,0} is split, with the computation
  Lambda^2 T_-^v = T_X on the mu_2-root stack) and the elementary Sections 1
  and 5.1, which give paper.md a positive direction it explicitly disclaims
  having (its section 1.5(2): "Nothing in the positive direction").

# --- !! PRIOR-ART COLLISION ON THM 4.5, recorded by lead 2026-09-23 --------
# Source: literature/extractions/supermoduli-genus0-splitness-prior-art.md
# (researcher round agent/researcher/supermoduli-genus0-splitness-prior-art,
#  merged to main 2026-09-23; all quotes L1 page-image verified).
# The "new content" sentence above was written WITHOUT this information and
# must not be read as still standing. A reviewer must settle the residue
# before Thm 4.5 is described as new anywhere.
prior_art_thm_4_5:
  verdict: >-
    The BARE STATEMENT "Sbar_{0;4,0} is split" is NOT new. Witten,
    arXiv:1209.2459 section 5.1.3, typeset p.54-55, asks the identical
    question verbatim ("The supermanifold hat-M_{0,4} has dimension 1|2. Is
    this supermanifold split?") about the COMPACTIFIED object and answers yes,
    exhibiting an explicit splitting - the OSp(1|2)-invariant super cross ratio
    (5.13) - and the equally explicit second splitting (5.14). He attributes
    the splittings to Nelson (Superstrings '88) and Giddings, CMP 143 (1992).
    The attempt cites neither; "Witten" appears in proof.md only as the W of
    Donagi-Witten. paper.md section 1.5(2)'s "Nothing in the positive
    direction" is a statement about paper.md, not about the literature.
  what_may_survive: >-
    Witten's argument is at the SUPERMANIFOLD / coarse level - a holomorphic
    map to CP^1 - and he presents it BEFORE introducing the orbifold structure
    (p.56), never returning to claim the splitting survives it; he outsources
    the stack-level precision to a private letter from Deligne, which this
    project cannot register. The extraction records this discontinuity as a
    fact of the source and explicitly declines to judge whether it is
    substantive. Thm 4.5 is stack-level (mu_2-gerbe over the mu_2-root stack of
    (P^1, 0+1+inf), Lambda^2 T_-^v = T_X, Serre duality). So the candidate
    residue is exactly: "split AS A STACK, by an obstruction-class computation
    rather than by exhibiting a map". That is a narrower claim than the one in
    the novelty field, and NOBODY HAS CHECKED IT.
  also_settled_by_that_round: >-
    (i) "odd rank 2 => projected <=> split", used by the attempt via [CN Prop
    2.2], is also Donagi-Witten arXiv:1304.7798 Corollary 2.3, p.19 - a
    numbered corollary, not folklore. (ii) The general mechanism "odd rank 2 +
    negative canonical degree => omega_2 = 0" is FALSE as a general statement
    (Vishnyakova's non-split Q^{1|2} over CP^1); degrees must be computed case
    by case, which Thm 4.5 does. (iii) No counter-statement exists anywhere:
    every published non-projectedness result is quantified g >= 2 or g >= 5.
  action_required_before_graduation: >-
    Cite Witten section 5.1.3 (and its Nelson/Giddings attribution) in proof.md
    section 4, restate the novelty claim as the stack-level residue above or
    drop it, and have the reviewer rule on whether that residue is real. Note
    the attempt's own next_targets list below was chosen on the assumption that
    (0;4,0) was newly settled here; the targets themselves are unaffected.

# --- what is proved --------------------------------------------------------
results:
  - id: lemma-1.1
    statement: >-
      A smooth DM superstack with rank T_- <= 1 is canonically split.
    status: complete
    depends_on_literature: []
  - id: cor-1.3
    statement: >-
      Sbar_{g;n,2r} is split whenever 2g-2+n+r <= 1 (8 stable triples).
    status: complete
    depends_on_literature: [FKP-ThmA]
  - id: lemma-2.1
    statement: >-
      Projectedness/splitness restricts to open substacks; contrapositively
      non-projectedness of the smooth locus implies it for the compactification.
    status: complete
    depends_on_literature: []
    note: >-
      Stated verbatim as a remark by Donagi-Witten (Rem 1.4) but never used in
      paper.md. It is the key that closes (2;1,0).
  - id: thm-3.3
    statement: >-
      Sbar_{g;n,2r} is non-projected for EVERY g>=2, every n, every r; and for
      r=0 the even component is non-projected for every g>=2, every n.
    status: complete
    depends_on_literature: [DW-Thm1.2, CN-Thm1.1(2), paper.md-Cor8.5]
  - id: thm-4.5
    statement: >-
      Sbar_{0;4,0} (dimension (1|2), odd rank 2) is SPLIT. Proof: its bosonic
      truncation is a mu_2-gerbe over the mu_2-root stack of (P^1, 0+1+inf);
      Lambda^2 T_-^v = T_X there (computed from an explicit frame of
      3/2-differentials); so omega_2 lives in H^1(X, omega_X^{-2}) = 0 by Serre
      duality; rank 2 then upgrades omega_2 = 0 to splitness via [CN Prop 2.2].
    status: complete-with-one-imported-step
    depends_on_literature: [FKP-ThmA, FKP-eq9.6, FKP-Lemma7.9, CN-Prop2.2]
  - id: thm-5.1
    statement: >-
      Sbar_{g;n,2r} is split whenever its bosonic dimension 3g-3+n+2r <= 1
      (exactly six stable triples).
    status: complete
  - id: prop-5.3
    statement: >-
      The SMOOTH genus-0 spaces S_{0;n,0} are split (OSp(1|2) gauge fixing).
    status: sketch-only
    note: not load-bearing; see GAP-2.

# --- honest gaps -----------------------------------------------------------
gaps:
  - id: GAP-1
    where: proof.md, Lemma 4.1
    what: >-
      "tau^2 = t at an NS node, and the residual mu_2 acts by tau -> -tau" is
      imported, not re-derived from [FKP]. It is equivalent to FKP eq (9.6)
      (O(Delta_NS)|_B = Psi_1^-1 Psi_2^-1) combined with Psi_i^2 = psi_i, and I
      verified that equivalence. Confirmed a posteriori by the computation in
      section 4.3, which produces a half-integral order lambda^{-1/2} -
      impossible on a scheme. Remark 4.6 shows Thm 4.5 survives even if this
      description were wrong.
  - id: GAP-2
    where: proof.md, Prop 5.3
    what: >-
      Freeness of the OSp(1|2) action and representability of the quotient are
      not checked. Nothing else depends on Prop 5.3.
  - id: GAP-3
    where: proof.md, section 5.3(2)
    what: >-
      I found no mechanism producing a nonzero omega_2 from genus <= 1 data,
      and did NOT prove that none exists. The open region is open in both
      directions.

# --- open region -----------------------------------------------------------
open_region:
  - "g = 1 with n + r >= 2"
  - "g = 0 with n + r >= 4, except (n,r) = (4,0)"
  - "the odd parity component Sbar^-_{2;n,0} for n >= 1"
next_targets:
  - >-
    Sbar_{1;2,0} and Sbar_{0;3,2}: the two smallest cells where odd rank is
    still exactly 2 (so [CN Prop 2.2] remains an iff) but the bosonic base is a
    surface, killing the degree argument. Concrete, finite work, no new idea
    needed.
  - >-
    Sbar^-_{2;n,0}, n>=1: the unique place where [DW], [CN] and paper.md all
    stop at the same wall. DW says verbatim they do not resolve even spin
    structure + odd parity + n>=1.

