  2026-09-23，theorem-prover / agent/prover/supermoduli-ramond-components。

  任务：攻 research/papers/supermoduli-punctured-nonprojected/paper.md §10.3 的 [GAP-COMP]
  —— r>=1 时 S̄_{g;n,2r} 的连通分量分类未知，故论文定理 B 只能断言整个叠非投影。

  ## 结果（一句话）

  r>=1 时 S̄_{g;n,2r}（以及超叠 𝔖̄_{g;n,2r}）**连通**，故 [GAP-COMP] 在 Ramond 情形是空的：
  不存在可加细的分量结构，定理 B 已经就是分量级陈述。

  ## 但是：数学不是新的（查重后如实修订）

  Jarvis, "Geometry of the moduli of higher spin curves", Internat. J. Math. 11 (2000) 637-663
  （预印本 arXiv:math/9809138v3）Thm 3.3.1 / 3.3.11 已给出一般情形的分量个数。
  取 r_Jarvis=2、Ramond 点 m_i=1、NS 点 m_i=0，他的 ℓ_{g,2}(m)=gcd(2,2,m_•) 在全部五种情形
  （g>=2 / g=1 / g=0，有 / 无 Ramond）与本 attempt 的结论**逐格相符**。

  而且 Jarvis 这篇就是 **FKP 自己的参考文献 [22]**（FKP p.13 引它说明 S̄_{g,n_NS,n_R} 是光滑固有
  DM 叠，但没引其中的不可约性定理）。

  ⇒ **[GAP-COMP] 应重新分类为「文献缺口」，不是数学缺口。** 关闭它不需要新数学，引
  Jarvis Thm 3.3.11 即可。详见 prior-art.md。

