     Hecke 理论闭合。
  3. **恒等式 d_* = (−1)^{ℓ+1}c_m^F(n,ℓ) 本身有定义域限制**（对 I=1 也是）：数值上当且仅当
     n ≥ m 成立。反例 (m,n,ℓ)=(5,1,4)（与 (1,1,0) 同轨道，d_*=50064）而 (−1)^{ℓ+1}c_5^F(1,4)
