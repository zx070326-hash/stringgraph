  三条原创发现：
  1. **DGM 0803.2692 eq(51) 与 eq(52) 互不相容**。eq(50)+(51) 与 eq(52) 的第 s 项差一个
     (−1)^{ℓ−ℓ/s}，对偶数 s 且 ℓ/s 奇数为 −1。最小显式整数见证（脚本精确算出）：
     I=2, (m,n,ℓ)=(4,1,2)：eq(52) 给 16542306，eq(51) 给 16440894，差 101412 = 4·d_*(1,1,1)。
     与 eq(52) 相容的生成函数唯一地是 Σ_{s|I} s/Φ₁₀(s²ρ,σ,sv+(s−1)/2)（半周期平移），
     这与 2009.01172 eq(2.11)+(2.13) 联立解出的闭式一致。未查到 DGM erratum。
  2. **crux 1 是否定的**：𝒯_I 不是标准 Hecke 算子（只有"降幂部分"，且只给 Γ₀(I) 而非
     Sp(4,ℤ) 不变性）。故"把 eq(51) 升级成纯数学 Hecke 恒等式"这条路走不通——除子和是
     一个定义，不是模形式恒等式。测绘「缝 A」未闭合点 (ii) 仍未闭合，且现在知道它不能靠
     Hecke 理论闭合。
  3. **恒等式 d_* = (−1)^{ℓ+1}c_m^F(n,ℓ) 本身有定义域限制**（对 I=1 也是）：数值扫描的 96 个
     反例全部满足 n < m（即 n ≥ m ⟹ 恒等式成立，逆不真）。反例 (m,n,ℓ)=(5,1,4)（与 (1,1,0)
     同 GL(2,ℤ) 轨道，d_*=50064）而 (−1)^{ℓ+1}c_5^F(1,4) = −2023536 < 0。原因：c_m^F 只依赖
     (Δ, ℓ mod 2m)，不是 SL(2,ℤ)-不变标号。这解释了 arXiv:2510.05219 摘要的
     "with some restrictions"。推论：任何除子和论证都必须先做 Gauss 约化（或直接用吸引子围道）。

