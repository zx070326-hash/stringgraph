  GN1998 代数 G 的分母函数是 ψ₅（权重 5），扭转分母 Den_ω = (−i)·ψ₅(τ,z+½,σ)，而 Φ₁₀ = ψ₅²
  权重 10；原命题"Den_ω = C·Φ₁₀"权重差 5，不可能成立。正确等式为 Φ₁₀(τ,z+½,σ) = −Den_ω²。
