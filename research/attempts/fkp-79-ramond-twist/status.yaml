notes: |
  ================================================================
  一句话结论
  ================================================================
  **结果 (a)。** FKP Lemma 7.9 在 ω_C ⇝ ω_C(R) 之下**成立**，不需要任何额外条件，
  带 Ramond 穿孔的完整局部计算已写在 proof.md §4–§7。因此 (7.8) 对任意 m_i ≥ 0、
  任意 n_i ≥ 0 成立，`[GAP-FKP-RAMOND]` 在 Lemma 7.9 这一点上**可以撤销**。
  副产品：FKP 那句无出处的 "It is well known that …" 在 proof.md §5.2 被证明了，不再被引用。

  ================================================================
  已完成的引理清单（proof.md 的结构）
  ================================================================
  §1   逐字来源（全部来自 220 dpi 渲染页图，不用 pdftotext）：
       Def 2.4 (p.6)、Lemma 2.6 与 (2.5) (p.7)、§7.5 与 Lemma 7.9 陈述 (p.47)、
       Lemma 7.9 证明全文 (p.48)、§2.2 与 (2.2)/(2.3) (p.5)。
  §1.4 把扭转被丢掉的三处逐条列表；并给出**取证结论**：Lemma 7.9 证明里那句
       "L ≅ Hom(L,ω_C)" 是逐字抄自 **Remark 2.3 (p.5)**（无穿孔）而非 (2.5) (p.7)（带穿孔），
       是同一篇论文里两条公式之间的抄错，不是概念错误。
  §4.1 引理 4.1：偶基上 O_Z ≅ O_{Z_0} ⊕ j_*L ⊕ j'_*L'，含理由（O_Y 无奇部 ⇒ 奇部无粘接条件）。
  §4.2 引理 4.2：有限态射的 Hom 伴随（自证，四行）。
  §4.3 引理 4.3：ω_Z^- = Hom(F, ω_{Z_0})，以及 (ω_Z(R^Z))^- = Hom(F, ω_{Z_0}(D))；
       关键点是 O_Z(R^Z) 是**偶**可逆层，从 Z_0 拉回，故与宇称分裂可交换。
  §4.4 δ_Z^- 是**块对角**的，且等于 ι ∘ (j_*Φ_X ⊕ j'_*Φ_{X'})——即 FKP 那句
       "It is easy to see that above map is precisely δ^-" 的理由。
  §5   **主命题**（= (2.4) 对 Z）。两区域局部性论证：
       §5.1 节点之外：扭转在场，且逐字**就是**假设 (2.5)；
       §5.2 节点附近（与 R 不交，由 Def 2.4 的 "disjoint" 强制）：O(D) 被重言截面
            **典范平凡化**，扭转命题退化为无扭转命题，后者在局部模型 A = k[[u,v]]/(uv)
            上被显式算完：Ann_A(v) = (u)、η = du/u、du ↦ uη、α 是单位 ⇒ 同构。
  §6   Def 2.4 其余条件（δ_Z 的构造与投影公式、光滑轨迹与穿孔、CM 条件、稳定性），
       逐条核对对 R 的依赖：全部为零，除了 §6.2 第二次用到 R ∩ P = ∅。
  §7   定理 7.1 = 带 Ramond 扭转的 Lemma 7.9；(7.8)/(7.9) 对任意 m_i, n_i 成立。
  §8   扭转究竟住在哪里 + 对本项目 §10.1 措辞的纠正。
  §9   足迹审计 I：Lemma 8.7 / Cor 8.8 / Remark 8.10 / Example 8.9 的作用域（见下）。
  §10  足迹审计 II：(7.1) 的地位与带穿孔形式 (7.1_R)（见下）。
  §11  仍然开放的 [GAP]。

  ================================================================
  判定的决定性一步
  ================================================================
  **扭转在节点附近是典范平凡的，在节点之外就是假设本身。**
  唯一承重的前提是 z ∉ Supp(R^Z)，而这由 Def 2.4 第一条 "**disjoint** closed subschemes
  called NS-punctures and R-punctures" 直接给出。所以是 (a) 不是 (b)：没有新增条件。
  反过来，这也**解释**了为什么 §7.6（Ramond 节点粘接）是真的困难：那里 §5.2 整段塌掉。

  ================================================================
  本项目 paper.md §10.1 应该怎么改（三条，lead 施工）
  ================================================================
  A. **撤销 `[GAP-FKP-RAMOND]` 在 Lemma 7.9 处的部分。** 改写成：
     "FKP 的 Lemma 7.9 陈述与证明均在 ω_C 而非 ω_C(R) 下写出（p.47 的显示式与 p.48 的正文
     都缺扭转；该公式逐字抄自 p.5 的 Remark 2.3 而非 p.7 的 (2.5)）。本项目在
     research/attempts/fkp-79-ramond-twist/proof.md 独立重写了该局部计算，带扭转的陈述成立，
     无需额外条件。"
  B. **删掉 "the entire derivation chain leading to (9.6) runs on NS-only lemmas" 这句。**
     它是错的，见下面的足迹审计。
  C. **修掉 §10.1 现有的理由句**："replacing ω_C by ω_C(R) is a verbatim substitution there"
     ——这句自相矛盾（在与 R 不交的邻域上根本没有东西可替换，而真正不能逐字替换的地方恰好
     被这句排除掉了）。正确说法是 proof.md §8 的两区域分解。

  ================================================================
  足迹审计 I（独立页图核对 p.56 / p.57 / p.58 / p.59 / p.60）
  ================================================================
  ⚠ **本项目记录错了一条，必须纠正。**
  `research/attempts/supermoduli-elliptic-tail-punctured/status.yaml` 的
  [GAP-LIT] 第 1b 条写："Lemma 8.7 与 Corollary 8.8 **也只对 NS 穿孔陈述** …
  即：(9.6) 的推导链条**整条都走在只对 NS 陈述的引理上**。"
  这句**不成立**。逐字证据：

  - p.56 §8.4 开头：「Let π : X → S be a stable supercurve with NS punctures P_1,…,P_m
    **and Ramond divisors R_1,…,R_n**.」Lemma 8.7 与 Cor 8.8 都在这个 setup 之内。
  - p.57 Remark 8.10 **正面处理 Ramond**：「For every Ramond divisor R_j ⊂ X let us consider
    the line bundle on the base, Φ_j := Ber(π_*O_{R_j})^{-1} ≃ Ber(π_*ω_{R_j}). Note that
    Φ_j = Φ_{R_j} (see (7.10)), so the line bundles Φ_j^2 are canonically trivialized.」
  - p.57 Example 8.9 **确实只对 NS**：「a family of supercurves with **NS-punctures** over an
    *even* base S … (C,L) … with **spin-structures**」。
  - **Example 8.9 不在 FKP 的 (9.6) 链上**：Lemma 8.11 的证明 (p.58) 用的是 (8.2)+Lemma 8.7
    +ω^3(2R)/ω^3 的滤过+Φ_j^2 的平凡化；Lemma 9.1(i) (p.59) 逐字引 **Cor 8.8**；
    Lemma 9.1(ii) 证明 (p.60) 逐字引 **Remark 8.10**；p.60 末尾逐字引 **Lemma 8.7**。
    三处引用的全是带穿孔一般性的陈述，没有一处引 Example 8.9。
  - 另有一条更强的理由：Lemma 8.7 / Cor 8.8 里所有对象都沿 P_i 拉回，而 P_i ∩ R = ∅，
    所以 P_i^*ω(R) = P_i^*ω——那里写 ω 而不写 ω(R) **连省略都算不上**。

  ⚠ 但**不要反向误读**：Example 8.9 虽不在 FKP 链上，却在**我们自己论文**的
  Lemma 5.5 / Remark 5.7 里被用来识别尾巴的 psi-线 𝔫。那次使用在亏格 h 因子上（恰好
  1 个 NS、0 个 Ramond），Example 8.9 的两条前提逐字满足，合法。本尝试不扩展 Example 8.9。

  ================================================================
  足迹审计 II：(7.1)
  ================================================================
  结论：**公式该改，但"印刷有误 / misprint"这个说法是错的。**

  - p.41 §7.1 的前提行逐字是「Let π : X → S be **a family of stable supercurves** such that
    the map from S to the deformation space of each node is smooth」——**没有穿孔**。
    其局部公式 δ(dz) = θ[dz|dθ]、δ(dθ) = [dz|dθ] 是 NS（非退化）标准形 D = ∂_θ + θ∂_z 的公式，
    不是 Ramond 标准形的公式。所以 (7.1) 是**在它自己声明的作用域内正确并被正确证明**的陈述，
    不是打字错误；缺的是"带穿孔时它读作 (7.1_R)"这句话，而 Lemma 9.1(iv) 恰好需要那一句
    （p.60 逐字：「(iv) This follows from parts (i), (ii) and from the exact sequence (7.1) …」）。
  - 正确的带穿孔形式：0 → ω²_{X/S}(R) → j_*Ω_{U/S} → ω_{X/S}(R) → 0。
    本尝试给了两条独立推导（proof.md §10.2）：(a) Berezinian 秩计算；(b) Ramond 标准形
    D = ∂_θ + θz∂_z 的局部计算（核由 dz − θz dθ 生成）。
  - **随后发现 FKP 自己在 p.5 就印了这条序列**（proof.md §10.2bis 逐字）：
    0 → 𝒟^{-2}(-R) → Ω_{X/S} → 𝒟^{-1} → 0，配 (2.3) 𝒟 ≃ ω^{-1}(-R)，
    代入即得 0 → ω²(R) → Ω → ω(R) → 0。三条独立来源一致。
  - **不损害 (9.6)**：Lemma 9.1(iv) 比较的是 j_*Ω_U 与 Ω_{X̃/B}(D_1+D_2)——(7.1_R) 的**中间项**
    与 (7.1) 逐字相同，两端的扭转在 X_B 与 X̃ 两侧对称出现、在取余核时抵消；
    且 p.60 末尾那条序列被限制在 D_1,D_2 附近，与 R 不交。
    [GAP] 未把 Lemma 9.1 整个证明在 (7.1_R) 下重写一遍。

  ================================================================
  仍然开放的 [GAP]（完整版见 proof.md §11）
  ================================================================
  1. [GAP: S1] 节点处 ω_{Z_0} 的 Rosenlicht/Serre 描述（η = du/u，du ↦ uη）作为标准事实引用，
     未重证。经典、与超几何无关、与 R 无关。
  2. [GAP: general base] (2.4) 按定义是逐纤维条件，故 §5 在代数闭域上足够；§6.1/§6.3 在一般 S
     上按 FKP 自己的处理走，本文只核对了它们对 R 的依赖（为零），没有重做基变换/平坦性记账。
  3. [GAP: 最后一个箭头] FKP 在 Lemma 7.9 的显示式里没有给
     j_*ω ⊕ j'_*ω' → ω_Z 这个箭头命名。本文取它为典范的无留数（trace）包含——唯一自然的候选，
     且在此解释下引理为真。顺带记录：该包含**单但不满**（节点处像是 (u)η ⊕ (v)η ⊊ Aη，
     余长 1），这是无害且必需的，因为 ω_Z(R^Z)^- 的茎恰好就是那个真子模。
  4. [GAP: Remark 2.3] p.5 的 Remark 2.3 印的是无扭转的 L² ≅ ω_C，而它的前提行没有限制
     R = ∅。它究竟是默认无穿孔、还是与 Lemma 7.9 证明犯同一个省略，本文未判定。
     本文任何一步都不依赖 Remark 2.3（全部用 p.7 的 (2.5)）。
  5. [GAP: Lemma 9.1(iv)] 见足迹审计 II 最后一条。
  6. 本文与 §7.6（Ramond 节点粘接、(7.11)/(7.12)）无关，且 §8 解释了为什么这条路走不过去。

  ================================================================
  与 `fkp-96-punctured`（分支 agent/prover/fkp-96-punctured）的比对
  ================================================================
  比对在本尝试的 proof.md 已推完、已写完、已 commit（1c6aeae, f5c40a0）之后才读对方，
  读的是 git show agent/prover/fkp-96-punctured:research/attempts/fkp-96-punctured/proof.md。

  **结论：两条推导相互印证，都对；不是同一条路，但共用同一个决定性局部事实。**

  (1) **结论完全一致。** 它的 Prop 4.3 + Cor 4.4 与本文的定理 7.1 是同一个命题
      （对任意 m_i、任意偶 n_i，(7.8)/(7.9) 良定义）。两边都判 (a)。

  (2) **机制不同，而且恰好互换。**
      - 对 **Lemma 7.9**：它走**整体对偶**——Lemma 4.1（j^!ω_{Z_0} ≅ ω_C + 投影公式）
        把 Hom(j_*L, ω_{Z_0}(D)) 一步换成 j_*Hom(L, ω_C(Σr_i))，再整体用一次 (2.5)，
        全程不分节点内外。本文走**两区域局部性**：节点外就是 (2.5)，节点附近扭转典范平凡
        后手算局部模型。
      - 对 **(7.1)**：它走**局部性**（它的 Cor 5.2 "where the twist is invisible"，
        用 s_R 在 X∖R 上平凡化）+ 引 FKP p.5 的 (2.2)/(2.3)。本文走**独立推导**
        （Berezinian 秩 + Ramond 标准形），事后才去核 p.5。
      也就是说：**它在 7.9 用整体对偶、在 7.1 用局部性；本文在 7.9 用局部性、在 7.1 用计算。**
      两个命题各自被两种不同机制各证了一遍。这比"一条推导 + 一次复核"强。

  (3) **决定性的局部事实是同一个**，两边都独立写出来了：
      A = k[[u,v]]/(uv)，Ann_A(v) = (u)，ω_{Z_0} 局部由 η = du/u = −dv/v 生成，
      分支包含 du ↦ uη。它出现在它的 Lemma 4.1(1) 证明里，出现在本文的 (5.1)–(5.2) 里，
      字面相同。两边也都把 Rosenlicht 的 ω_{Z_0} 描述当标准事实引用（共同的 [GAP]）。
      它的 Remark 4.2 把这件事说成"两个相反扭转相消：j^*ω_{Z_0} = ω_C(p_0)，
      Hom(O_C,O_{Z_0}) = O_C(−p_0)"——这个说法是对的，且比本文 §5.2 更简洁。

  (4) **它被自己列为"最需要被攻击的第二号目标"的那一步（Prop 4.3 的
      Hom(ℒ, ω_{Z_0}(D)) ≅ ℒ），本文逐条查过，没有发现错误。**
      - Lemma 4.1(1)：(x)η = k[[x]]·xη = k[[x]]dx = ω_{C,p_0} ✓（因为 xη = x·dx/x = dx）。
      - Lemma 4.1(2)：N 可逆时 Hom(O_C, F⊗N) ≅ Hom(O_C,F)⊗N，且作为 O_C-模等于 ⊗j^*N ✓。
      - Lemma 4.1(3)：闭浸入的 Hom 伴随 ✓（= 本文引理 4.2）。
      - j^*O_{Z_0}(D) = O_C(Σr_i)，理由是 r'_j 落在 C'∖{p'} ✓（= 本文 (H3)）。
      - 它也补了"所得同构**就是** δ_Z^-"这一步（它的 §4.3 倒数第二段），本文用块对角性
        给出同一结论。
      我的判断：**这一步是对的，可以从它的"最需攻击"清单上摘下来。**

  (5) **一处措辞分歧（不是数学分歧）。** 简报里转述它说 "FKP (7.1) **印刷有误**"。
      我核了 p.41 的前提行与局部公式，判定 (7.1) 在它自己声明的无穿孔作用域内是**正确**的，
      不是印刷错误，而是**作用域缺口**（缺"带穿孔时读作 (7.1_R)"这一句）。
      顺带说明：对方 proof.md 原文并没有用 "misprint" 这个词，它写的是
      "written for R = ∅ … as printed, false or unproved when Ramond punctures are present"，
      与本文判断相容。**"印刷有误"这个说法是转述引入的，不是它的原话，也不准确。**

  (6) **足迹审计（Lemma 8.7 / Cor 8.8 / Remark 8.10 / Example 8.9）两边独立同意**：
      前三者已在带穿孔一般性下陈述，只有 Example 8.9 是真正 NS-only，且不在 FKP 的 (9.6) 链上。
      本文额外给了一条它没给的理由：Lemma 8.7 / Cor 8.8 的所有对象沿 P_i 拉回，P_i ∩ R = ∅，
      故 P_i^*ω(R) = P_i^*ω，那里连省略都算不上。
      它额外给了一条本文没给的：Example 8.9 在**我们自己论文** Lemma 5.5(b)/Remark 5.7 里
      仍被使用（NS 侧，合法），所以 `[GAP-FKP-RAMOND]` 在那一点上**不**撤销。两条都要记。

  (7) **没有发现它有错的地方。** 如果发现了我会直说；没有。

