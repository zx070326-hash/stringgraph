  status_ruling: rigorous
  ruling_basis: |
    - **不是 `formalized`**：`[GAP-LEAN]` 开着，三条定理无 Lean 实现。无讨论余地。
    - **不是 `physical-argument`**：reviewer 逐步核了引理 1–13、推论 1.1/1.2/6.1、
      Thm 1 (1)–(5)、Thm 2 (0)–(5)、Thm 3 (1)–(4)，无断言级跳步；唯一整条借用的
      (4.4) `effective: formalized` 且已证不循环；`E_+|_W = id` 是精确恒等式而非
      领项近似。四条 `[GAP]` 无一构成"论证本身不严格"。
    - F1、F3 不触及 proof.md 三定理的严格性（一个在 claim.md 前件表、一个是措辞），
      按根 CLAUDE.md 原则 2 不压档。
  attacked_and_cleared: |
    【Q1 领项系数】`K_0 = η(b,p_j) = η(b,a) + jη(b,b) = 1 + j·0 = 1`。(N) 杀掉唯一的
    j-依赖项，对一切 j ∈ ℤ 恒为 1，与 |j| 和符号无关；且拿到的是精确的**单位元 1**
    而非"≠ 0"——在一般交换环上后者不够、前者够。滤过从不作用在无穷维对象上
    （先按能级切成 μ = ⊕_N μ_N），`M = N+1` 是层内常数，且该取法是**紧的**
    （M = N 会失效）。

    【Q2 b6fba30 的系数环放宽】行列式始终作用在有限的 p_D(N) × p_D(N) 方阵上；
    无穷维只出现在最后一步 ⊕_N，而那步不用行列式。对角块确为置换矩阵。
    结论与 lead 事前的担心相反：**改写前的版本才是有洞的**——旧路线要走
    "单射 ⟹ 满射"，这在一般交换环上是假的（ℤ --×2--> ℤ），而目标卡的系数环设定
    是"交换 ℚ-代数"而非域。b6fba30 是**必要的修复**。

    【Q3 注 3.2 的 S^⊥⊥ = S】成立。三条件逐条核过：逐层有限自由（秩 p_D(N)）、
    配对完美（引理 5(d)，Gram 的 (a,b) 块 det = −1，与 η(a,a) 取值无关）、
    S 是直和项（推论 1.1）。有了直和项，`F = A ⊕ B ⟹ Ann(B) ≅ A*,
    Ann(Ann(B)) = B` 是纯直和项引理，对任意交换环成立，不需 Noether、不需局部环。
    注 3.2 "必须先有推论 1.1"的诊断准确——reviewer 试过绕开直和项的替代路线，
