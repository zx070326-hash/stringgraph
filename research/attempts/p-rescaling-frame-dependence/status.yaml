origin: |
  research/papers/torsion-dyon-shift-positivity/paper.md §9 (line 350) defers the question
  of whether the "P-rescaling" torsion divisor-sum formulae in the literature are frame
  dependent, and the paper nowhere bounds the blast radius of its own negative finding.

questions:
  - id: Q1
    text: Which literature formulae form the P-rescaling family? Verbatim, with PDF equation numbers.
    state: answered
    answer: |
      NOT Banerjee-Sen-Srivastava (the pre-registered guess; refuted - BSS 0802.1556 (1)+(2)+(7)
      put Q^2/2 in the sigma-check slot, the slot carrying s^2, so BSS is Q-rescaling).
      The P-rescaling family is
        - Alexandrov-Nampuri 2009.01172 eq (2.13), with (2.6) fixing m = P^2/2  [L1, p.5-6];
        - Bossard-Cosnier-Horeau-Pioline 1806.03330 eq (5.80), Gram argument
          (Q^2, QP/d ; QP/d, P^2/d^2)  [L1, p.64].
      Q-rescaling: DGM 0803.2692 (3.27)/(3.28), BSS 0802.1556 (7), CNR 2007.10302 (3.40)
      (CNR's letters look like AN's but m = Q_m^2/2 is magnetic there, so the divided slot is
      electric).  Full table with verbatim quotations and L1/L3 labels in lit-findings.md.
  - id: Q2
    text: Is the P-rescaling divisor sum likewise frame dependent? Explicit integer witness or proof of independence.
    state: answered
    answer: |
      Yes, and by the same mechanism.  proof.md Theorem B: one torsion-2 lattice in U+U,
      two frames (Q,P) and (Q,P-Q), invariants (4,8,8) and (4,4,0), BOTH satisfying the
      arithmetic hypotheses I^2|n and I|l under which the literature states the formula, give
      D'_2 = 7999235715072 and 7999541469408, difference 305754336 - the exact transpose of
      paper.md Remark 6.3, as Theorem A (D'_I(m,n,l) = D_I(n,m,l)) predicts.
      Theorem C: the exact invariance group of D'_I is Gamma_0(I) = {c = 0 mod I}, not
      Gamma^0(I).  Proposition 5.1: the adapted frames of a fixed lattice are exactly one
      coset, so both formulae ARE well posed as functions of (lattice, adapted type); only
      the step of dropping the adaptedness from the notation fails.
  - id: Q3
    text: Blast radius - which papers use D_I (or D'_I) as a charge function, classified into load-bearing / adapted-only / transcription-only.
    state: answered
    answer: |
      Small, and smaller than the shape of the negative result suggests.  Table in
      lit-findings.md §7.  Of the eight located papers writing a torsion divisor sum, SIX are
      (yi3 / adapted-only) - including DGM itself, whose §4.1 proves the Gamma^0(I) restriction
      and supplies a different Z_I^(l) per coset.  TWO are (jia3 / load-bearing) but narrowly:
      AN 2009.01172 (2.13) and CNR 2007.10302 §3.7, each needing ONE sentence's hypothesis
      tightened ("on a P-adapted frame" / "on a Q-adapted frame"); no computed number in
      either paper is wrong.  Four further papers are (bing3 / transcription-only).
      Carries [GAP: survey completeness] - nine of 98 DGM-citing records were triaged.

