notes: |
  2026-09-23 open. claim.md written before any computation, per project lifecycle.
  Working hypotheses (NOT results):
   - the P-family is Banerjee-Sen-Srivastava 0802.0544 + 0802.1556;
   - transfer should be by the reflection d_*(m,n,l) = d_*(n,m,l), but the lattice-theoretic
     side (which frames count as "adapted") must be redone, not assumed;
   - BSS's formula carries an extra average over shifts k/sbar^2, l/sbar, so it is NOT the
     bare divisor sum and must be Fourier-analysed from scratch.
