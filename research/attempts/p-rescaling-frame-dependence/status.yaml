  WHAT IS PROVED (proof.md):
   - Thm A  D'_I(m,n,l) = D_I(n,m,l).  Two lines from the GL(2,Z) class-function property.
            Machine: 8750 instances, 0 violations.  This is the precise form of BCP's
            "in agreement with [41,72]".
   - Thm C  D_I is Gamma^0(I)-invariant, D'_I is Gamma_0(I)-invariant, via
            V_s = W_s U W_s^{-1} = [[a, b/s],[c s, d]], integral iff s|b.
            NOT NEW: this is DGM (4.5)-(4.7) on the charge side, and CNR App. A (A.9)-(A.11).
            Sharp: at (4,8,0), I=2, the three Gamma^0(2) cosets give three DIFFERENT values.
   - Prop 5.1  adapted frames of a fixed lattice = exactly one Gamma^0(I) (resp Gamma_0(I))
            coset.  Proof uses primitivity of the non-divided charge + unimodularity of Lambda.
   - Thm B  the integer witness, above.
   - Thm D  under DGM + S-duality the index is NOT a function of (m,n,l,I): at (4,8,8,2) both
            a Q-adapted and a P-adapted lattice exist and carry 7999541469408 vs 7999235715072.
            This QUANTIFIES BSS 0802.0544 §6.3 (three T-duality orbits at fixed (Q^2,P^2,Q.P)).
   - Prop 8.1  BSS (7) is the SIGNED sum, weights s(-1)^{l-l/s}: change variables
            sigma~ = s^2 sigma-check, v~ = s v-check; the Jacobian 1/s^3 cancels the s^3.
            So BSS is on the DGM (3.26)+(3.27) side, not the bare (3.28) side.
   - Thm E  the signed sum is ALSO Gamma^0(I)-invariant.  Key step: l' - l'/s = (ad+bc)(l - l/s)
            mod 2, and ad+bc = 1+2bc is odd.  So the DGM eq(51)/eq(52) sign question is
            ORTHOGONAL to the frame question; neither resolves the other.

  THE FINDING THAT NARROWS THIS ATTEMPT (report it, do not resist it):
   DGM 0803.2692 §4.1 state and prove the Gamma^0(I) restriction themselves and say outright
   that a DIFFERENT partition function Z_I^(l) must be used on each other SL(2,Z)/Gamma^0(I)
   coset (lit-findings.md F3b, L1, printed pp.18-19).  The frame dependence reported by
   paper.md Remark 6.3 is the CONTENT of DGM §4.1, not an oversight.  What is new here is
   the exact-integer measurement, the transfer to the P-rescaling operator, Prop 5.1, and
   Thm D/E.

  CROSS-TASK MESSAGES FOR THE LEAD (this attempt may not edit those files):
   1. research/papers/torsion-dyon-shift-positivity/paper.md §9 line 350 says the literature
      formulae "rescale P rather than Q" and names the BSS family.  The naming is wrong:
      BSS is Q-rescaling.  The P-family is AN 2009.01172 and BCP 1806.03330.
   2. Same paper, §4: its variable dictionary rho <-> sigma_AN, v <-> z_AN, sigma <-> tau_AN
      correctly identifies which slot carries s^2, but paper.md's rho carries Q^2/2 while AN's
      sigma carries P^2/2, so the dictionary silently identifies the electric with the magnetic
      invariant.  Theorem 4.1 survives as an identity about Phi_10; the sentence asserting that
      AN's framework corrects DGM does not follow from AN alone.  Details lit-findings.md F7d.
   3. literature/extractions/dgm-eq51-eq52-third-party-crosscheck.md §E1/E2 reads the
      l=1, sbar=2 term of BSS (4) ("v-check + 1/2") as independent support for a half-integer
      shift.  It is not: BSS say the k,l sums are a periodisation, and they undo them in (7),
      where no shift survives.  See proof.md §8.1.
