  convention_consistency: |
    This is the hazard the task brief specifically flagged, and the attempt handles it
    correctly and explicitly rather than by accident. claim.md/proof.md fix their OWN
    notation once (m=Q^2/2, n=P^2/2, l=Q.P) and never silently borrow a paper's letters:
    proof.md section 0 states in so many words "Which charge is divided is the only safe
    identifier. Letter conventions differ across the literature: DGM and CNR divide the
    electric invariant Q^2/2 by s^2; Alexandrov-Nampuri and BCP divide the magnetic
    invariant P^2/2, even though AN's letters (n=Q^2/2, m=P^2/2) make (2.13) look like DGM's
    (3.28) when read left-to-right." My own page-image check of AN (2.6) confirms AN's
    letters ARE the opposite of DGM's (n=electric there, not m), and confirms the "which slot
    is squared" criterion was applied correctly in both directions (AN: P^2/2 divided,
    P-rescaling; BSS: Q^2/2 divided via sigma-check, Q-rescaling). No metric-signature or
    alpha'-normalization issue arises since d_* and the divisor sums are purely combinatorial
    (integer Fourier coefficients of a fixed Siegel modular form), so those root-CLAUDE.md
    convention axes (principle 6) do not apply here; the live convention axis is "which
    physical charge sits in which chemical-potential slot", and it is handled correctly
    throughout, including in the cross-task warning about paper.md's own section 4 dictionary
    (item 2 of the "cross-task messages" block, which I independently believe is correct: AN's
    sigma carries P^2/2 per my own eq.(2.6) check, while paper.md's rho carries Q^2/2 per its
    own section 2, so identifying paper.md's rho with AN's sigma does silently swap electric
    and magnetic -- this is a self-reported problem in a SIBLING document, correctly flagged
    and correctly out of this attempt's write scope).
