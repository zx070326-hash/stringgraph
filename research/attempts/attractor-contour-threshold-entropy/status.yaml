  it's not a measurable quantity like dilaton or string coupling. Writing the
  relationship as "Λ₀ = π/(2S_BH)" is misleading because:
  - Λ is dimensionless (Siegel coordinates), S_BH has dimensions
  - The equation only makes sense in specific units
  - It's essentially a restatement of Δ = (charge invariant) in different notation

