  from Sen 2008 §5, DVV 1997, or dedicated N=4 entropy literature. If the
  coefficient differs (e.g., 2π or π/2), the "π/(2S_BH)" expression changes
  numerically but the dimensional conclusion (mostly trivial) remains.

