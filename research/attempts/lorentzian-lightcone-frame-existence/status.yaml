  · [GAP-RANK]   D = 4+r（r ≥ 1）时 W ≅ T ⊕ R^r 自由，但未检查自由基能否取成 η|_W-正交归一；
                 D = 3（m = 1，Picard 群层面）是否有反例**未知**。
  · [GAP-LEAN-5] 定理 5 未 Lean 化（Mathlib 无 Witt 消去；本文特意写成显式等距复合以绕开）。
  · [GAP-LEAN-7] 引理 7.1/定理 7 的 Lean 组装（三步簿记，砖已全在仓库里且无 sorry）。
  · [TODO-PRIOR-ART] 按项目规则「先做后查」，到期点是毕业进图或对外；毕业前需检索
                 (1) 洛伦兹格上 DDF 标架存在性是否已有文献命题（G–N 1995 §3.2 只有一句
                 "we can always find"，无证明——这正是本 attempt 的起因）；
                 (2) 「光锥标架在一般交换环上不存在」这类反例是否已被形式化文献提出。
                 **本文不声称任何一条数学是新的**（见 claim.md §4(a)）。

  【给 lead 的跨任务发现（本 attempt 不动 graph/，只报告）】
  1. 标架卡【不断言】(b) 括号里「这在一般环上为假」是一条实质断言，卡上**无凭据**，
     且它前面列的两个反例支持不了它（那两个说「某一组 ε 不好」，而 §6.0 证明同一个
     (η,a,b,b̃) 上**存在**好的 ε，全在 ℤ 内）。定理 6 是本图内第一个凭据。
  2. 标架卡 2026-09-12 追记点名的「剩下唯一没有的」= 「{b,b̃,ε_i} 线性无关」
     **现在是定理**（推论 1.2），任意 `[CommRing R]`，不需要 Field/ℚ-代数/hD。可直接 Lean 化。
  3. `worldsheet.transverse-frame-spans-orthogonal-complement` 卡 notes 里
     「ε ⊥ v 是完备性的必要条件（否则 ε ∉ v^⊥ 而右端落在 v^⊥ 内）」的**括号理由不成立**
     （span 比 v^⊥ 大不矛盾），但结论对（定理 3）。建议该卡换代时订正（proof.md 注 3.3）。
  4. 同卡【一般情形该怎么补】把障碍归给「缺实二次型工具」——**误诊**：域上恒真（定理 5，
     不用实性），环上的真障碍是投射模非自由（定理 6）。两卡给的补法（把 span{k_0,p}^⊥
     写进定义）仍然正确，但理由要换（proof.md 注 6.1、§8.1 L7）。
  5. 对下游有直接用处的一条：`worldsheet.ddf-spans-physical-states-level-one` 与
     `research/attempts/tower-native-ddf-spanning` 把 (T′) 写进前件**不损失一般性**
     ——只要结论只谈 `ddfSpan` / `A^ε_n (n ≠ 0)`（定理 7 + 推论 7.2）；
     若结论里出现 `A^ε_0` 或标架向量本身（如 (F8)），则**会**损失一般性，必须保留 (T′)
     （proof.md 注 7.3 给了精确分界）。

review_2026_09_25:
  reviewer: rev-frame-exist
  verdict: verified
  scope: "claim.md + proof.md §0–§8 + scripts/verify.py 全文，逐定理独立复算"
  needs_recheck: false        # reviewer 明示：下列修改均不需要复审
  findings: |
    A1. 必改（CONFIRMED，假陈述）——「原始命题在域 char ≠ 2 上为真」是错的。
        字面原始命题在一切环上为假（缺快子壳），定理 6 反驳的是 **(A)-加强后**的版本。
        详见上面 notes 里的 🔴 更正框。
        已改：claim.md §0（划掉 + 🔴 框）、proof.md §6 头部（⚠ 框 (1)）、
              proof.md §8.3（🔴 框）、本文件 notes（🔴 框）。
    A2. 轻微（proof.md 定理 6 第四步）——「反设 w⃗_1, w⃗_2 是 T 的 R-基」里"2 个"
        没有来路。补：由 T ⊕ R ≅ R³ 与交换环的 IBN（不变基数）得基恰有 2 元。
        一行补丁，不是洞。已改（proof.md 第四步）。
    A3. 轻微（措辞越界）——定理 6 头部「与 ½ ∈ R 全都无关」过强：第二步由
        2 u·w⃗ = 0 推 u·w⃗ = 0 用了 2 可逆。意思（障碍不是分母是投影模）对，字面不对。
        已改：claim.md 第 166–171 行、proof.md §6 头部 ⚠ 框 (2)。
        （正文总表第 890 行本来就写「需要 ½：是（ℚ-代数）」，与更正一致。）
    A4. 轻微（注 7.3 分界少列一类）——除 A^ε_0 与标架向量本身外，第三类不可转移的是
        **裸振子** α^ε_p（`transOp`/`towerModeVec`）：α^{ε+λb}_p = α^ε_p + λK_p 且 K_p ≠ 0。
        `LightCone.lean` 的 `ddfOp_neg_one_apply_towerVacuum` 是活的实例。
        收紧后的判据：**结论只经由 A^ε_n（n ≠ 0）与 ddfSpan 依赖 ε**。
        已改：claim.md 定理 7 条目、proof.md 注 7.3。
    A5. 轻微（多余的理由）——「两者 Hasse–Witt 不变量不同」不必要且未算：判别式
        已经不同（+1 vs −1 mod 平方）。已改：proof.md 约第 434 行。
    E.  图卡 `graph/statements/worldsheet/ddf-light-cone-frame.yaml` notes 的三处忠实性问题
        （lead 待处理，单独提交）：
        (i) 「在一切 char ≠ 2 的域上存在性为真」缺 η = diag(−1,+1,…) 限定，且按 A1 要加 (A)；
        (ii) 「η|_W 非退化」说得比 proof.md 多；
        (iii) 「不可 Lean 化」应为「目前不可（本仓库 pin 的 Mathlib 无毛球定理）」。
    F.  reviewer 主动给出的 [GAP-RANK] 解法（见下）。
  gap_rank_resolution: |
    reviewer 顺手解掉了 [GAP-RANK] 的 r ≥ 1 部分：球面环例子在 D = 4 + r（r ≥ 1）时
    **确实有标架**，所以它不能用来把定理 6 推广到高维。理由：T ⊕ Ru = R³ 是**正交**
    分解且 u·u = 1，故 W ≅ R^{r+2}_std（标准正交自由模）。
    D = 5 的显式构造：E_i = (0, e_i − u_i u, u_i)，i = 1,2,3，已核为多项式恒等式。
    ⇒ 定理 6 的反例**只在 D = 4 上有效**；D ≥ 5 的一般环上是否有反例仍未知，
      D = 3（m = 1）也仍未知。[GAP-RANK] 因此从「未检查」收窄为「r ≥ 1 时此例不成立，
      需要别的环」——这是**收窄**，不是解决，毕业时按后者措辞。
    ⚠ 本条是 reviewer 的主动产出，lead 未独立复算 E_i 的恒等式。
