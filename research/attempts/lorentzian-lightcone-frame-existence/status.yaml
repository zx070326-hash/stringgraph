notes: |
  【靶子变更（如实记录，claim.md §0 是正文）】
  原始派工：把标架卡【不断言】(b) 拒绝断言的存在性一般形式
  「(F1)–(F4) ⟹ ∃ε 使 (F5)–(F8)」变成精确命题并裁决。
  派工中途收到只读裁定（同伴核查 + coordinator 独立复算，明示可推翻），要点：
  (S) 不是差额；(C)「{a,b,ε_i} 是基」是推论不是前件（det G = −1，任意交换环）；
  于是只剩 (T′) 是真缺口；并自我更正「(F8) 与 (C) 不是一回事」。
  本轮裁决（判断权在 prover）：
  · 裁定关于 (C) 的部分**正确**，已独立复算，写成定理 1，并顺带证出
    「{b,b̃,ε_i} 也是基」——那是标架卡 2026-09-12 追记点名的「剩下唯一没有的」那条。
  · 裁定关于「只剩 (T′)」的部分**只对一半**：(T′) 由一行零向平移
    ε_i ↦ ε_i − η(ε_i,a)b 免费得到（定理 2），真正的缺口是
    **(T)(O) 横向标架本身的存在性**（Lean `TransverseFrame η b` 是否非空），
    裁定未提及它。该问题在域上恒真（定理 5），在一般交换 ℚ-代数上**为假**（定理 6）。
  · coordinator 要求正面处理的坑（目标卡对「一切 (T)(O) 标架」量化，
    而存在违反 (T′) 的合法标架）由定理 7 填掉：A^{ε+λb}_n = A^ε_n（n ≠ 0），
    坏标架与好标架给出**同一组** DDF 算子，故「对一切标架」可由「对 (T′) 标架」逐字推出。
  ⇒ **本 attempt 最终证的不是原始命题**：~~原始命题的裁决是「一般交换 ℚ-代数上为假，
    域（char ≠ 2）上为真且有充要判据」~~，并附 (F5)–(F8) 之间的完整蕴含关系。

  🔴 **2026-09-25 更正（`rev-frame-exist` finding A1，上面划掉的那句是假的）**：
    字面的原始命题「(F1)–(F4) ⟹ ∃ε 使 (F5)–(F8)」在**任何**环上都为假，包括 ℚ 和 ℝ，
    而且理由平凡：(F1)–(F4) 不蕴含快子壳 η(a,a) = 2，而定理 3 说 (F8) ⟹ η(a,a) = 2。
    反例（域上）：K = ℚ，D = 3，η = diag(−1,1,1)，b = (1,1,0)，a = (0,1,0)，
    b̃ = −a + (t/2)b 取 t = 1 得 (½,−½,0)，(F1)–(F4) 全成立而 η(a,a) = 1 ≠ 2。
    这与本 attempt 自己的推论 5.1(ii) 一致（那里「域上为真」的前提里就有 η(a,a) = 2）。
    **正确的裁决分三条**：
      (i) 字面原始命题：一切环上为假（缺快子壳；定理 3）。
      (ii) 补上 (A)（即 η(a,a) = 2）后：域 char ≠ 2 上为真，且有充要判据（定理 5 + 推论 5.1）。
      (iii) 补上 (A) 后在一般交换 ℚ-代数上**仍为假**（定理 6 的球面环反例满足 (A)）——
           这才是定理 6 的真正内容，也是它不平凡的原因。
    毕业影响：定理 6 的卡面必须写成「反驳的是 **(A)-加强后**的存在性断言」，
    不能写成「反驳了标架卡【不断言】(b) 的字面命题」（后者不需要定理 6 就假）。

  【进度】
  2026-09-25：claim.md 落盘（定理 1–7 的精确表述 + 量词/代价表）。
  proof.md §0–§8 全部落盘：§1 定理 1（det G = −1 ⟹ 基，任意交换环）+ 推论 1.1/1.2；
  §2 定理 2（零向平移给 (T′)）；§3 定理 3（(F8) ⟺ 快子壳 ∧ (T′)，严格强于 Lean 的
