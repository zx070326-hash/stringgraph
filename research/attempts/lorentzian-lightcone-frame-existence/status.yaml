  【给 lead 的跨任务发现（本 attempt 不动 graph/，只报告）】
  1. 标架卡【不断言】(b) 括号里「这在一般环上为假」是一条实质断言，卡上**无凭据**，
     且它前面列的两个反例支持不了它（那两个说「某一组 ε 不好」，而 §6.0 证明同一个
     (η,a,b,b̃) 上**存在**好的 ε，全在 ℤ 内）。定理 6 是本图内第一个凭据。
  2. 标架卡 2026-09-12 追记点名的「剩下唯一没有的」= 「{b,b̃,ε_i} 线性无关」
     **现在是定理**（推论 1.2），任意 `[CommRing R]`，不需要 Field/ℚ-代数/hD。可直接 Lean 化。
  3. `worldsheet.transverse-frame-spans-orthogonal-complement` 卡 notes 里
     「ε ⊥ v 是完备性的必要条件（否则 ε ∉ v^⊥ 而右端落在 v^⊥ 内）」的**括号理由不成立**
     （span 比 v^⊥ 大不矛盾），但结论对（定理 3）。建议该卡换代时订正（proof.md 注 3.3）。
  4. 同卡【一般情形该怎么补】把障碍归给「缺实二次型工具」——**误诊**：域上恒真（定理 5，
     不用实性），环上的真障碍是投射模非自由（定理 6）。两卡给的补法（把 span{k_0,p}^⊥
     写进定义）仍然正确，但理由要换（proof.md 注 6.1、§8.1 L7）。
  5. 对下游有直接用处的一条：`worldsheet.ddf-spans-physical-states-level-one` 与
     `research/attempts/tower-native-ddf-spanning` 把 (T′) 写进前件**不损失一般性**
     ——只要结论只谈 `ddfSpan` / `A^ε_n (n ≠ 0)`（定理 7 + 推论 7.2）；
     若结论里出现 `A^ε_0` 或标架向量本身（如 (F8)），则**会**损失一般性，必须保留 (T′)
     （proof.md 注 7.3 给了精确分界）。
