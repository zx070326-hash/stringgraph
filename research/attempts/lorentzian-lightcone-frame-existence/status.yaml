  §5 定理 5（域 char ≠ 2 上的充要判据，反射 + Eichler 构造，不用 Witt 消去、不用实数）；
  §6 定理 6（球面环反例：原始命题在图与 Lean 的实际量词下**为假**）+ 推论 6.0
  （`WitnessInt` 的 D=3 整数见证经平移成为 ℤ 上完整标架）；
  §7 引理 7.1 + 定理 7（A^b_n = 0、A^ε_n 只看 ε mod b）+ 推论 7.2（量词转移）；
  §8 核验目标卡自带草图与三条 curator 手算、量词代价总表、[GAP] 清单、档位建议。
  scripts/verify.py 全绿（引理 5.3 三支分别命中 37/3/1）。
  ⇒ state 改 under-review，请 graph-reviewer 对抗性审查。**verdict 与 state=verified 不由 prover 填。**

