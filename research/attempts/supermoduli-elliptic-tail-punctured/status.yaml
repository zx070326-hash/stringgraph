  === 本尝试对自身的判断 ===
  路线可行，结论方向（非投影）本轮认为成立。核心论证是把 CN 的证明在一个更一般的粘接态射上
  重新装配，每条引理都逐条核对过「逐字相同 / 需要修改」，修改点只有两处且都不影响论证结构。
  §6.2 的反向检验（本方法结构上碰不到 CN 已证分裂的 S̄^-_2）是一条强的无隐藏错误的证据。
  但因 [GAP-LIT] 未闭合（外部依赖未登记）、[GAP-FKP-RAMOND] 与 [GAP-COMP] 未走完，诚实起见
  暂留 draft，不自行升 under-review。

  **请 lead 派 graph-reviewer 做对抗性审查**——本轮自认为主线论证已完整，最值得被挑战的三点是：
  (a) 引理 4.4 的 (c) 步「不去算尾巴的 psi-线」是否真的合法（会不会漏掉尾巴那条线其实依赖 p）；
  (b) 命题 4.5 的正合列拼接在带穿孔情形是否仍然成立（[GAP-IMM]）；
  (c) §6.4 对「忘却态射平凡化」的反驳是否站得住。

  === 2026-09-18 对抗审查结果（lead 记录）===
  上面 (a)(b)(c) 三点**全部 CLEAR**，且 reviewer 对每一点都给出了比原稿更强的理由：
  (a) 常值性的正确依据是 Ψ 的**定义**（FKP p.57 "Ψ ≃ Ψ̃ ≃ π_*(I_P/I_D)"、
      "P*ω_{D/S} ≃ Ber(Ψ) = Ψ^{-1}"）+ 平坦基变换，不是原稿引的那句 exterior product。
      另**穷举核对**了 𝔫 的下游用法：只出现两次（命题 4.5、引理 4.6），两处都只消耗 dim 𝔫 = 1，
      推论 4.7 / 定理 M / 命题 4.8 再不触及。原稿"推广是免费的"这一自夸**属实，不是修辞**。
      且 Example 8.9 的两条前提（只有 NS 穿孔；L^2 ≅ ω_C **不带扭转**）在它**唯一**被使用的
      Ψ₁ 侧**逐字满足**（亏格 h 因子恰好 1 个 NS、0 个 Ramond）；Ψ₂ 侧确实会失败，而本文从不在
      那一侧引用它。**规避是合法的，不是躲闪。**
  (b) 见 [GAP-IMM] 的关闭。另核实 FKP Lemma 7.10 本身是带穿孔一般性的（证明开头逐字
      "Let X be a stable supercurve with punctures…"，括注 "(where we take into account all the
      punctures on both sides)"），且 (7.8) 显示式的指标与本文 §4.1 的取法逐字吻合。
      原稿自评「不比 CN 弱也不比 CN 强」经核对 CN p.19 **属实**。
  (c) 两条理由都成立。reviewer 独立复现了 grep：FKP 两处 "forget" 都是局部计算里的"不管穿孔"，
      不构造态射；CN 三处都是忘却**自旋结构**。且 reviewer **加强**了第二条理由——
      dπ_₋ 在 DW 族奇切空间上是 H^1(C, L^{-1}(-Σp_i)) → H^1(C, L^{-1})，**满射**且核 n 维
      （余核是摩天楼层，其 H^1 为零），故 Λ²dπ_₋ 满、与之复合确实是层的单射；
      但层单射只在余核的 H^0 满射时才给出 H^1 单射，而那是关于整个叠的整体陈述，
      作者与 reviewer 都无法判定。**反驳成立。**
  另有一条 reviewer 主动补的、标为 PLAUSIBLE（非 CONFIRMED）的佐证：g=2 只够到偶分量
  **不是差一点没够到，而是本该如此**——CN 证 𝔐̄₂^- 分裂的路子依赖亏格 2 特有的无穿孔性质
  （每条亏格 2 曲线超椭圆、有一个区分出来的奇 theta 特征），加上 n≥2 个标记点后这些全不存活。

