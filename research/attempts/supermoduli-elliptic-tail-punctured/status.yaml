  S̄_{g;n,2r} 在 g>=3（任意 n,r）以及 g=2（只要 n+2r>=2）时非投影。DW 的 n<=g-1 限制被完全
  去掉；Donagi–Ott 的 g>=5r+1 与 Wang 的 g>=n+5r+3 被替换成 g>=2，且**不依赖 Wang**，因此
  不继承 physical-argument 天花板。同时得到一条同等重要的负面结论（命题 N）。

