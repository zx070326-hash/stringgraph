  1. **定理 A 不毕业进图。** `D = 2` 的横向维数是 `D − 2 = 0`，无鬼定理在那里没有内容；
     该结果是对证明方法的正确性检查，不是一条会被人依赖的命题。建成节点无人 `uses`、
     不支持 `claim.md` 的 Thm 5.1′、`effective` 零移动——按「图是仪器，不是产品」，
     建它只是装饰。定理 A 作为 `proof.md` 里的完整原创证明保留，有需要时随时可毕业。
  2. **不派复审，state 保持 `draft`。** 原则 8：本轮不移动任何节点的 `effective`
     （lead 在 main 上独立复跑 `uv run stringgraph status
     worldsheet.ddf-spanning-hypothesis-v2` 确认 `own_status: formalized` /
     `effective: physical-argument` / best_derivation 不变），且不属四种必审情形
     （不标 formalized、不进里程碑、不对外、无人在其上施工）。零影响即停手信号。
  3. **本轮的产出记在负面那一栏，这是正确的记法。** `D ≥ 3` 的「猜生成集 + 算秩」
     被判死路，且给出了结构性理由（`T_j` 是全局递归定义的对象），与 N≥6 DDF-秩墙同型。
     已写进 `docs/ROADMAP.md` 高杠杆前沿第 1 项——那一项此前写着 Borcherds 旁路
     「成败未知」，现在它有了一个具名障碍。这是本轮唯一改变项目决策的信息。
  4. **下一轮若继续攻 P1，走建议 (a)（P3 + Lemma 5.5 塔上版本，自顶向下）。**
     明确**不要**再派「猜 `T_j` 生成集」型任务——本轮已证其无效，重派等于重踩。
