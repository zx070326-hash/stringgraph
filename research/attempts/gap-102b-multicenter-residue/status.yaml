     「镜像重写」不需要发生。** 此结论在裁决 (c) 下不受影响。

  2. **§2（BSS 证明骨架复核 + 数值验证）——VERIFIED**（亲自核实，**reviewer 实跑了脚本**）。
     跑 `scripts/verify_A2B2_inequality.py` 确认：(A) 1680 组奇偶性论证无反例；
     (B) 68880 组三元组精确 Fraction 算术无反例；(C) 符号归约确认不等式对一切实 a∈[−1,1] 成立。
     该脚本独立验证了 BSS §B.4 的完成配方 + 奇偶性论证给出的 B₂⊆B 包含。

  3. **§3 引理 2（变量角色对应）——SUPPORT，数学上正确**（亲自核实，**且用了与原稿不同的独立标准**）。
     reviewer 不采用原稿的围道虚部标度，改用**傅里叶相位系数**标准，直接从两文的积分定义读出：
