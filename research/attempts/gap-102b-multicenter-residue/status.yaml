  **影响评估（lead 分析，供 reviewer 核对而非替代其裁决）**：

  1. 结论**大概率稳健**，但**路线可能要镜像**。Φ₁₀ 在 ρ↔σ 下对称，故 d_*(m,n,ℓ)
     在 m↔n 下对称；BSS 同时证了电荷集 A 与 B 两支（Thm 5.4(a)/(b)），二者互为
     ρ↔σ 镜像。若引理 1 的荷指派写反，则目标域 `n≥m` 落进的是 **A₂ 而非 B₂**，
     用的是 **Thm 5.4(a) 而非 (b)**，覆盖性结论不变，但 §3 引理 2 的变量对应表、
     §4 的整体符号推导**全部需要按镜像重写**。
  2. 因此「BSS 已证一个包含目标域的超集 ⟹ 此 GAP 从来不是公开文献空白」这个
     **核心 prior-art 发现本身不依赖该指派**，仍然成立且仍然重要。
  3. 但 §3/§4 现有文字是按 (b) 支写的，**若指派反了则这两节的具体链条失效**，
     不能按现状毕业。
