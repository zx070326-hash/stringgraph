    已自测的 `torsion-immortal-positivity-hecke/scripts/coefficients.py`
    独立算出对称代表元 (1,1,0) 处的值，与 Rosselló 和 BSS 各自论文里报告的
    +50064 三方吻合，确定符号为"无额外差"。
  - proof.md §5：组装定理，§6：诚实评估。

  **诚实标注的唯一剩余 [GAP]**（proof.md §4/§6）：BSS"Φ̃₁ exactly the inverse
