     故 n_B = m_Rosselló、m_B = n_Rosselló。目标域 `n≥m≥1, 0≤ℓ≤m`（Rosselló 记号）
     译为 `m_B≥n_B≥1, 0≤ℓ_B≤n_B`（BSS 记号），**⊆ B₂（BSS eq 5.65）**。
