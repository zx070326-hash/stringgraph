  2026-09-12 (theorem-prover): proof.md 完成，认为命题 (S) 已证。路线与 claim.md 骨架
  有两处实质偏离，都是简化：

  1. 骨架第 2 步（"至多两个非阿贝尔因子"）给的理由（Tr F² 正定所以不能恒为零）对阿贝尔
     方向是错的。正确结构是 Lemma 1：u(1) 因子在**伴随**表示里 ad = 0，所以条件 (i) 对
     阿贝尔部分完全不设限，(i) 只是半单部分 𝔤' 的条件，m = 496 − dim 𝔤' 由 (ii) 定死。
     这正是 u(1)^496 与 e₈⊕u(1)^248 成为解的原因（平凡满足，非真抵消）。
  2. 骨架第 3 步建议查 Okubo / van Ritbergen 的迹恒等式系数表。没有必要：由极大环面定理，
     Tr H^k = Σ_{α∈Φ} α(H)^k，全部系数直接从根系算出，无需任何二手系数表，也完全避开了
     antonelli-2015 的错误数据。同时 (i) 在 F → λF 下齐次（含 λ=i），所以归一化/厄米约定
     无关，不需要 conv.gauge-trace-normalization 的细节。

  关键收缩：dim 𝔤 = 496 ⟹ 每个单因子 dim ≤ 496 ⟹ Killing-Cartan 下恰好 66 个紧致单李
  代数，是有限穷举。scripts/root_power_sums.py 用精确有理数（fractions，无第三方依赖）
  逐个判定，结果：满足 (i) 的只有 so(32) 与 e₈；满足两因子所需更强条件 (P) 的只有 e₈。
  配分后恰好四解，脚本末尾机器复现该配分。

