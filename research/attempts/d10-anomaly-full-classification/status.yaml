  一处非实质笔误(PLAUSIBLE, 不影响任何结论, 建议 prover 后续订正, 不构成打回理由):
  6.1 Warning 印出的第二个切片方程 "120 = N^2/3 + 6N - N^3/75" 在 1..59 内有两个整数根
  N=15 与 N=30, 而正文称"公共解 N=30"。我从 slice x=(a,-a,b,-b,0,...) 独立重推
  (p2=2s, p4=2(s^2-2e), p6=2(s^3-3se), s=a^2+b^2, e=a^2b^2)得到的两个残差系数是
  coeff(s^3)=4N+120-N^2/3-2N+N^3/225(根 30, 60, -15)与 coeff(s*e)=2N^2/3-12N-240
  (根 30, -12), 后者与印出的第二个方程不同。两者都在 N=30 同时为零(逐点验证 N=30 处两
  系数确为 0, N=29/31/32 处不为 0), 且直接跑脚本确认 su(15) 不通过切片检验、su(30) 通过。即陷阱真实
  存在、被正确处理、结论无误, 只是 Warning 中该方程的写法多出伪根 15。不影响 6.1 的排除
