notes: |
  Opened 2026-09-23. Target: settle split vs non-projected for the two smallest cells with
  odd rank exactly 2 and 2-dimensional bosonic base, in the FKP compactification convention
  used by research/papers/supermoduli-punctured-nonprojected/paper.md.

  Source-verification discipline: every formula used as grounds for a step is checked against
  a RENDERED PDF PAGE IMAGE (Read tool on the pdf), not pdftotext. Pages actually read as
  images are logged in proof.md Appendix A.

  2026-09-23, second prover pass: proof.md now exists (Parts 0-6), built from scratch, with
  every load-bearing formula re-derived or checked against a page image (log in Appendix A).
  This supersedes and discharges the previous "lead" warning (which said no proof.md existed;
  that is no longer true, and the warning has been removed rather than kept):
  the "planned state of play" that warning referred to was never independently re-verified in
  this pass and should not be assumed correct beyond what is restated below.

  ACTUAL current state of play (backed by proof.md, as of this commit):
  - Claim 1 (odd rank 2 => split <=> projected <=> omega_2 = 0): PROVED (proof.md Part 1,
    Lemma 1), by two independent routes: (i) direct citation of Correa-Noja Def 2.1/Prop 2.2,
    verbatim-checked against arXiv:2606.06733 p.2-3; (ii) independent re-derivation from
    Donagi-Witten's filtration fact + their Cor 2.3/2.4, verbatim-checked against
    arXiv:1304.7798v2 p.13-14, 18-19.
  - Claim 2 (uncompactified cells split): PROVED (proof.md Part 4, Lemma 4), via Serre's
    affine-vanishing theorem, after proving M_{0,5} and M_{1,2} are both affine varieties
    (explicit charts / fibration arguments). This makes precise Donagi-Witten's own vague
    remark about "the nature of the reduced spaces for small g".
  - Claim 3 (structure of bosonic truncations): PARTIAL. Cell (B) only: the NS/Ramond typing
    of all 10 boundary divisors of \overline M_{0,5} is verified by direct Riemann-Roch
    degree-parity computation (proof.md Part 3, Lemma 3), matching the claim's prediction
    exactly; the "non-locally-free at node => literal mu_2-root-stack" translation is
    imported as standard, flagged [GAP: root-stack representability]. Cell (A)'s analogous
    structure (Claim 3(2)-(3), the genus-1 boundary divisors and the odd/even theta-
    characteristic split) was NOT attempted this pass; flagged [GAP: cell-A structure]
    (proof.md Part 5.3).
  - Claim 4 (inertia-character criterion cannot decide either cell): NOT ATTEMPTED this pass
    (deprioritized: even if established it is a negative meta-claim, of the same character as
    the already-completed Claim-1-mechanism exhaustion, and does not by itself move Claim 6).
  - Claim 5 (obstruction is boundary-supported): PROVED (proof.md Part 4, Corollary 4.1), as
    an immediate consequence of Claim 2 (Lemma 4) plus Correa-Noja's etale-pullback
    compatibility of omega_2 (open immersions are etale) via the standard local-cohomology
    long exact sequence.
  - Claim 6 (the dichotomy, split vs non-projected): STILL OPEN, the core unresolved target.
    A genuinely new structural finding narrows it: proof.md Part 2 (Lemma 2 + Corollary 2.1)
    proves, by an independent Riemann-Roch/Serre-duality computation generalizing paper.md's
    narrower Lemma 8.2(i), that the ONE published technique for proving omega_2 != 0 in this
    literature (Donagi-Witten's one-point obstruction family) is structurally unavailable for
    BOTH cells, since it requires a smooth curve component of genus >= 2 somewhere and both
    cells have total genus <= 1. Combined with Corollary 4.1 (localizes the search to the
    boundary) and Lemma 3 (pins down the boundary node-typing for cell B), Claim 6 for cell
    (B) is reduced to a well-posed, finite, three-step computation (explicit Chern class of
    det F_X via Grothendieck-Riemann-Roch/psi-class calculus on \overline M_{0,5}; the
    tangent bundle of the root stack; a Mayer-Vietoris local-cohomology computation on the
    normal-crossing boundary) -- NONE of these three steps were carried out this pass; they
    are recorded as explicit [GAP]s in proof.md Part 5 (Sec. 5.1-5.2), not silently skipped.
    Cell (A) is further behind (Claim 3 not yet nailed down for it).

  Honest verdict on viability (full reasoning in proof.md Part 6): this path is MORE viable
  than it looked going in, not less -- Corollary 4.1 turns the original 2-dimensional global
  vanishing problem (which defeated the prior attempt's curve-degree method) into a local
  (Mayer-Vietoris on an explicit normal-crossing boundary) problem with completely classical
  tools available (psi-class calculus on \overline M_{0,5} is fully algorithmic). The
  remaining work is real, bounded, and mechanical -- not conceptually stuck -- but it was NOT
  completed this pass. Recommend the attempt stay open (state: draft) for a future prover to
  carry out proof.md Part 5's three [GAP]s for cell (B), then redo Part 3's method for cell
  (A) (Picard group of an elliptic curve is divisible, so the parity-obstruction argument of
  Lemma 3 needs new input there, flagged explicitly in Part 5.3).
