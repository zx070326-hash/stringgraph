summary: >
  Upgrades Remark 6.3 of research/papers/torsion-dyon-shift-positivity/paper.md from a single
  counterexample to a structure theorem. Result: the torsion divisor sum
  D_I(m,n,l) = sum_{s|I} s d_*(m/s^2, n, l/s) is a function of the pair (L, H), where L is the
  rank-2 charge lattice and H is a cyclic isotropic subgroup of order I of the discriminant group
  D_L = L^v/L; the tuple (m,n,l,I) records L and I but NOT H, which is the whole content of the
  frame dependence. The S-duality- and T-duality-invariant object is
  D(L in Lambda) = sum over rank-2 lattices N with L <= N <= Lambda of [N:L] * d_*(N),
  which equals D_I in every adapted frame -- this object is the PAPER'S OWN frak-D(L)
  (paper.md:470-475), not a discovery of this attempt; what is new here is the frame-side
  analysis (Theorems A, B, Prop. 2.6, Prop. 7.1).
  CORRECTED 2026-09-23: an earlier version of this field said the paper's section 9 criterion
  "exactly when the relevant discriminants have class number 1" is REFUTED. The paper never made
  that claim -- it states sufficiency and explicitly declines necessity (paper.md:352, Cor. 6.10,
  Problem 9.1, paper.md:509). Nothing is refuted. What is proved is both directions of the
  criterion: the "if" half is the paper's Prop. 6.5, and the "only if" half answers the paper's
  own Problem 9.1 -- the correct criterion is a class-GROUP condition ([f1]^2 = 1 or [p]^2 = 1)
  when v_p(content) = 1, and a content/Hecke condition when v_p(content) >= 2 (the regime of the
  paper's own witness).

