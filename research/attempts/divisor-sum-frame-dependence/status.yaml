gaps:
  - "[GAP-I1]: every statement mentioning d_* is conditional on Input (I1), d_* is a GL(2,Z)-class
     function (= Prop A.1 of the paper, itself physical-argument). The lattice theory is
     unconditional."
  - "[GAP-INJ]: Theorems C3, E, E'' characterize when the CHAIN OF ISOMETRY CLASSES is constant.
     That gives frame-independence of the integer D_I; the converse needs d_* to separate
     non-isometric lattices of equal determinant, which is not known. So 'frame-DEPENDENT' verdicts
     are, strictly, verdicts about the class chain except where an explicit integer witness is
     computed (dstar_output.txt supplies four such witnesses)."
  - "[GAP-NONCYCLIC]: when M/L is non-cyclic, D(L in Lambda) is still well defined but NOTHING here
     derives that it is the physically correct single-centred degeneracy. Prop 2.7 makes the
     non-uniqueness explicit. Settling it requires returning to the attractor-contour derivation."
  - "[OPEN-PRIMEPOWER]: C_{p^a} and the class map are computed only for a = 1. General I reduces to
     prime powers by CRT (Lemma 3.1), but a >= 2 is untabulated."
  - "[OPEN-INERT]: in the v_p(content) >= 2 inert case the criterion is reduced to the classical
     Hecke/Brandt question 'do the p+1 index-p sublattices lie in one class?'; no closed form given."
