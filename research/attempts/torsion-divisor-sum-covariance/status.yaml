notes: |
  2026-09-18 (theorem-prover，"提高规格"专项第 1 轮，分支 agent/prover/dyon-uplift):

  **本轮的核心产出是在本项目论文 `research/papers/torsion-dyon-shift-positivity/paper.md`
  里发现一处真错误，并给出修正。** 错误不在论文的数学部分，而在物理前提：

  - `paper.md` §7 的 **(P′)**（"d_*^{(I)}(m,n,ℓ) = 挠 I、不变量 (m,n,ℓ) 的 dyon 的免死简并度"）
    与免死指标的 S-对偶不变性 **不相容**。反例是精确整数（proof.md Thm 3.1 / Thm 5.1）：
    同一个格 L ⊆ U⊕U（挠 I=2）的两组基 (2w, u) 与 (−2w−u, −u) 都可容许（4|m, 2|ℓ），
    不变量分别是 (4,4,0) 与 (8,4,8)，而 eq(52) 的右端分别是
    7999541469408 与 7999235715072（差 305754336 ≠ 0）。
    另有 I=2 的 S 变换见证（差 1317411999552）与 I=3 见证（差 23433111576）。
    见证 A/C 的框架 2 里 Q,P **都是本原向量**，故不能用"电荷不本原"解释掉。
  - 论文的数学命题（Prop 3.1 / Prop 4.1 / Thm 5.2 / Thm 6.1 的代数与围道部分）本轮
    **未发现任何错误**，也**未改动**。Thm 6.1 的假设域「I²|m, I|ℓ」按 Lemma 1.6 恰好参数化
    "适配框架"，作为纯数学陈述是对的；错的是把 (m,n,ℓ) 当作电荷的完全标签。
  - **修正**：把 (P′) 换成 **(P′_ad)**——只在满足 `Q ∈ IΛ` 的**适配**框架上断言
    （由 Lemma 1.5 这是一个 Γ₀(I) 轨道，与 A-N eq(2.16)、Banerjee–Sen 0801.0149、
    姊妹尝试 Prop 7.1 的 Γ₀(I) 一致，也正是 DGM 推导路径"重标 ρ→s²ρ, v→sv"实际支持的陈述）。
    这**严格更弱**；而正性结论（Cor 7.2）反而覆盖**更多**电荷：全部满足 m,n≥1、Δ>0 且
    M/L 循环（只要 Q 或 P 本原即自动满足）的挠 I 电荷，而不只是可容许三元组。
    **这就是本轮"提高规格"的实质：前提更弱、结论更强、不再有已知反例。**

  **已证清单**（proof.md）：Lemma 1.1（I=[M:L]）、1.2（适配⟹可容许）、1.3（适配框架存在
  ⟺ M/L 循环）、1.4（Q 或 P 本原 ⟹ 循环）、1.5（适配框架 = Γ₀(I) 轨道）、1.6（可容许三元组集
  = 适配框架不变量集，U⊕U 中显式实现）、Prop 2.1（eq(52) 第 s 项 = 上格 ℤ(Q/s)+ℤP 的 d_*）、
  Prop 2.3（若每个 Δ/s² 的类数为 1 则 D_I 框架无关——**解释了该错误为何能过两轮审查**：
  论文 §3 的见证 Δ=12 落在 Δ/4=3 类数 1 的盲区）、Thm 3.1、Thm 4.1（(m,n,ℓ,I) 非完全不变量）、
  Thm 5.1（(P′) 证伪）、Thm 6.1/6.2（协变改写 𝔇(L)=Σ[L':L]d_*(T_{L'})，权重 s 唯一）、
  Thm 7.1/Cor 7.2/7.3（正性在 𝔇 与任意非负权重下存活）。

  **四问裁定**：
  - **Q1（能否去掉条件性）= 部分可攻，但不是按原设想的方式。** (a) A-N eq(2.11)/(2.13) 是同一
    物理断言的再陈述，不构成独立推导腿；(b) 纯 Φ₁₀ 算术路线（Hecke / Maass lift / Fricke /
    Atkin–Lehner）**此路不通**：姊妹尝试 §8 已证 𝒯_I=Σ s𝒱_s 不是 Φ₁₀ 上的 Hecke 算子，
    Atkin–Lehner 本征权是 ±s^{−10} 而非 s；(c) **回退路线成功且超出预期**——前提被换成严格更弱的
    (P′_ad)/(P″)，且原前提被证伪。条件性没有被消除（(P′_ad) 仍是物理前提），但被换成一条
    与自身推导路径自洽、且没有反例的前提。
  - **Q2（GAP-BKM）= 需要外部输入，本轮不可攻。** ω = exp(πi ad H_r) 是**内**自同构，而 Borcherds
    的扭转分母公式是对**图**自同构陈述的；项目内只有 Den_ω 的乘积侧，没有和侧。我曾想用
    "χ(α)=(−1)^{r(α)} 是线性特征 ⟹ 扭转恒等式 = 未扭转恒等式在 e^α ↦ (−1)^{r(α)}e^α 处的特化"
    收口，但这与 paper.md §8 记录的 Φ₁₀(z+1/2) = −Den_ω²（权 5 的平方）不相容——不是纯代换。
    **只能作为 [GAP] 标注的观察，不能当定理**。建议保留 §8 Problem 8.1 为开放问题。
  - **Q3（推广到 CHL / 其它 N=4）= 缺一块外部砖。** Theorem C（adj(T) 恒等式 + 围道协变）是纯线性
    代数，本轮未见任何阻碍搬到 Φ_k（CHL level N）上；Lemma 1.1–1.6 的格论部分只用到"偶格 + 饱和"，
    也搬得过去（CHL 的电荷格非自对偶，但仍是偶格，Lemma 1.2 的证明只用偶性）。**唯一缺的是
    Rosselló 型 I=1 正性定理**（Cor 1.1 的 Φ_k 版本），项目内与公开文献都没有。
    诚实结论：**推广的骨架可以写，但结论会退化成"条件于一条尚不存在的正性定理"**，
    本轮不建议写进论文。
  - **Q4（诚实清单与投稿准备）**：见 proof.md §9（对 paper.md 的 5 条具体修改建议）与 §10（GAP 清单）。
    要点：(1) §7 的 (P′) **必须改**，否则论文断言一个有精确整数反例的命题；
    (2) `paper.md:101` 的 `[reference]` 占位符：本轮用 `scripts/benchmark_crosscheck.py` 确认
    引擎在 5 个电荷点上精确重现流传的简并度表（50064 / 32861184 / 632078672 / 9337042944 /
    113477152800），且**这些点上总指标 = 免死指标**（故这些数确实校验 d_*），但**可引用的表号未能
    逐字核实**（ar5iv 对 0708.1270 §5 截断、hep-th/0505094 HTML 转换失败）——建议先改成列出
    benchmark 数值的诚实措辞，表号由 researcher 用出版版 PDF 补；
    (3) **任务书里"seam A 的 F1 形式缺口"这一前提已过期**：姊妹尝试 status.yaml 第 83/222 行
    记录 F1 已于 2026-09-15 在 proof.md §4（Thm 4.1 第 4 步）补齐。无需在论文里提。

  **开放 [GAP]**（proof.md §10）：(1) (P′_ad) 本身仍未证；(2) 𝔇(L) 在 M/L 非循环（Q,P 均非本原）
  时的物理正确性未证，只是提案；(3) **BSS 0802.0544/0802.1556 的分数平移求和公式是否也框架依赖，
  未检验**——它们缩放 σ̌（即 P）而非 ρ，结构不同；若 BSS 公式确实框架协变，那它才是挠 I 的正确通式，
  而 eq(52) 是它在适配框架下的特例，这是下一轮最值得做的独立检验；(4) benchmark 表号未核实；
  (5) 本文件的格论判据是否已在 Banerjee–Sen 正文中出现，未做穷尽检索。

  **诚实的新颖性边界**（proof.md §8）：定性结论（挠 r 时 (Q²,P²,Q·P) 不足、只有 Γ⁰(r) 显式不变）
  **不是新的物理发现**——Banerjee–Sen arXiv:0801.0149 (2008) **正文**已声明（2026-09-18 订正：
  原写"摘要即声明"，位置错误，内容属实）；arXiv:2510.05219 **未核实、无抽取记录，已在 proof.md §8
  标 [GAP] 并停止引用**。此前写的"它也把'指标只依赖 (m,n,ℓ)'显式限制在挠 1"这一断言暂不作数。
  本轮增量 = 精确整数见证 + 类数判据（为何被漏掉）+ 格论判据
  (Q ∈ IΛ) + 对本项目论文前提的证伪 + 正性的协变改写。

  **未改动 paper.md**（不在本尝试 claim 范围，且属 lead 决策）。请 lead 派 graph-reviewer 复核
  Thm 3.1/5.1（对抗性重点：见证的 Λ-可实现性、两框架确实同一个 L、d_* 数值、以及 (B4) 的引用是否
  超出论文自身默认），并决定是否按 §9 修改论文。

  **投稿建议（Q4，供 lead 参考，非数学结论）**：改完 §7 后，论文的骨架是"Igusa 尖点形式傅里叶系数的
  算术（Thm C + Thm 6.1 + 本轮的格论字典，全部严格）+ 一条条件于 (P′_ad) 的物理推论 + 一条关于
  DGM eq(51)/(52) 的勘误性观察"。这个配比最适合 **JHEP**：它接受"结论条件于一条明确标出的物理前提"，
  也容得下勘误性内容；CNTP/Lett. Math. Phys. 会要求把物理前提整段剥掉，而剥掉之后剩下的纯数学
  （d_* 的 GL(2,ℤ) 类函数性 + 除子和恒等式 + 适配框架判据）单独成文偏短、且承重的正性输入
  （Rosselló Cor 1.1）是别人的定理。**建议 JHEP**，并在 §7/§8 明确标注两处仍开放的 [GAP]。
  另：本轮的框架依赖性见证与已解禁的 eq(51)/(52) 矛盾是同一件事的两面，联系 DGM 原作者时应一并给出。

  **总裁定（一句话）**：这篇论文现在**可以**提高规格，最短路径是把 §7 的 (P′) 换成 (P′_ad) 并加一条
  "D_I 不是 S-对偶不变量"的 Remark（带见证 A 的数字）——这一步不需要任何新的物理输入，
  而且顺带把主结论从"框架依赖的三元组集合"搬到"S-对偶不变的电荷集合"上。
  彻底去掉条件性（证明 (P′_ad)）本轮判定为**短期不可行**。
