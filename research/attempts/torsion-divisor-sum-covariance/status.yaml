verdict: |
  CONFIRMED (2026-09-18). 证伪成立。五个攻击面全部独立复核，无一推翻结论。

  **攻击面 1（最关键：(B4) 的 S-对偶引用是否超出论文自身默认）— 攻击不成立，
  即证伪站得住。** paper.md 全文检索后确认：§7 的 (P′) 逐字把 d_*^{(I)} 写成
  (m,n,ℓ) 加 I 的函数，Thm 6.1 的假设 (I²|m, I|ℓ, m,n≥1, Δ>0) 同样是纯整数条件，
  **没有任何框架标记，没有任何一处限制 (P′) 的定义域**。而论文自己的 Appendix A
  (Prop A.1) 与姊妹尝试已过审的 Prop 4.4 **已经把 T ↦ UᵀTU 当作 d_* 的真不变性
  在用**。故"只在适配框架下成立"这一隐含限定词没有任何文本依据；不相容是由论文
  自身的约定加上 N=4 理论中无争议的 S-对偶精确性**逼出来的**，不是审查者强加的。
  reviewer 明言：找不到任何一种能让不相容消失的站得住的读法。

  **攻击面 2（两框架是否同一个格）— CONFIRMED.** 自写矩阵代码（未 import 本尝试
  脚本）复算四组见证的 UᵀTU，全部精确重现，det U = 1；独立重建见证 A、C 在 U⊕U
  中的 Q,P，挠数 gcd(Q∧P)、不变量 (m,n,ℓ)、本原性 content(Q)/content(P) 全部吻合，
  含"框架 2 中 Q,P 均本原"这一条。

  **攻击面 3（物理电荷格 Λ 中可实现性）— PLAUSIBLE，小缺陷不致命。** claim.md 把 Λ
  说成 heterotic on T⁶ 的电荷格，而 paper.md 的设定是 type II on K3×T²；两者是标准
  对偶描述、共用 Γ^{6,22}，U⊕U 在任一描述下都是本原直和项，故见证确实可实现。
  **但本尝试从未写出或引用这个桥接事实**——需补一句话。

  **攻击面 4（数值）— CONFIRMED.** 从零自写引擎（未 import coefficients.py），先用
  50064 / 25353 / 32861184 / 1127472 标定，独立重现全部 5 个 benchmark 值与三组见证
  用到的**每一个** d_* 到末位，含 d_*(9,6,-3)=4315653393218540262504。
  **恒等变换对照精确给 0**，故非零差必须由真正非平凡的 SL(2,Z) 重标架才产生，
  不是脚本产物。

  **攻击面 5（类数盲区 Prop 2.3）— CONFIRMED，双向独立证据。** 自写枚举器（未复用
  本尝试的 reduce_form）复算 Δ=3 恰好 1 个类 (1,1,1)，坐实论文 §3 自选的 Δ=12 见证
  (Δ/2²=3) 结构上无法暴露框架依赖。反向也验了：Δ=16 → 2 类、Δ=32 → 3 类、Δ=23 → 2 类，
  恰是见证 A/B/C 中出现的 Δ/s²；并用自己的 Smith 标准型饱和计算确认两框架的除数和项
  **确实落进不同的类**（Δ=16 处 (1,0,4) vs (2,0,2)）。

  ⭐ **证伪的锐化（reviewer 澄清了一处口径，结论不变但陈述更强）**：
  d_* 本身**是** GL(2,Z) 不变的，故 Prop 4.4 / Appendix A **完好无损、无冲突**；
  失效的是除数和 D_I。reviewer 算的 7999169992704 是两框架**共同的 s=1 项**（相等，
  正因 d_* 不变且 (4,4,0)~(8,4,8) 同类）；本尝试表里的 7999541469408 / 7999235715072
  是 **D_I = eq(52) 右端全和** = d_*[s=1] + 2·d_*[s=2]。两者精确对账（lead 独立复核）：
    7999169992704 + 2×185738352 = 7999541469408
    7999169992704 + 2×32861184  = 7999235715072
    差 305754336 = 2·[d_*(1,4,0) − d_*(2,2,0)]
  即**全部非不变性集中在 s=2 项**，因为 s=2 子格在两框架里落入不同 GL(2,Z) 类。
  这也正好解释了类数盲区机制：Δ/s² 类数为 1 时 s=2 项无处可分岔。
  **证伪依赖的是 D_I 这一对不等，不是 d_* 那一对**；而 (P′) 恰恰把 D_I（非裸 d_*）
  与物理指标等同。两套数字完全自洽，只是同一计算的不同层级。

  **新颖性边界核实**：
  - Banerjee–Sen 0801.0149 的引文**内容属实，但位于正文而非摘要**。本尝试
    proof.md/status.yaml 写的"摘要即声明"是**位置事实错误**（abstract → body），
    一词之差，但属引用缺陷，须改。
  - **BS 2008 并未抢先**：全文检索 "automorphism" / "Borcherds" / "Kac-Moody" /
    "Weyl vector" / "Hecke" **零出现**，停留在定性的 Γ⁰(r) 子群约束层面。本轮的三样
    增量——精确整数见证、GL(2,Z) 类数判据、格论判据 Q∈IΛ——**均未被抢先**。
  - **arXiv:2510.05219 = UNVERIFIED**：仓库内无任何 extraction 记录，reviewer 无网络。
    proof.md 关于它的断言目前**无源**，补抽取前**不得照原样引用**。
