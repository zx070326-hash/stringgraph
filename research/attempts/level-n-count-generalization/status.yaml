      immediate corollary of the generating-function factorization P_R(X)^{m+1} =
      P_R(X)^m * P_R(X). No gaps.
    - Claim 3 (kappa_N(m) := p_m(N)+p_{m+1}(N-1)+p_{m+1}(N-2)-p_{m+1}(N)): general
      bookkeeping formula kappa_N(m) = sum_s Delta(s) p_m(N-s) derived from Claim 2;
      evaluated explicitly for N<=7 using only the 7 known small values p(0..7). Found
      kappa_6(m) = m+1 (NOT constant -- new finding, first N where kappa depends on m)
      and kappa_7(m) = C(m+3,2). Both triple/numerically verified.
    - Claim 4 (N=7 explicit 10-shape closed form for p_m(7)): derived by hand from the
      15 partitions of 7 grouped into 10 shapes, cross-checked against Claim 1's general
      formula, and verified numerically for m=1..5 against three independent Python
      computations (partition-grouping / generating-function DP / brute-force
      recursion), all agreeing exactly.
