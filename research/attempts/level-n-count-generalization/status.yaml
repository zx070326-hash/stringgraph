  2026-09-16, prover agent (role=prover, branch agent/prover/level-n-generalization).

  Task: derive a general N>=7 formula for p_m(N) (m-colored partition counts used by
  formal/StringFormal/NoGhost/Level{Two..Six}Count.lean), verify numerically, and
  prepare a Lean skeleton for N=7. All three deliverables (formula derivation, numerical
