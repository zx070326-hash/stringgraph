    ⇒ 类光性**不是**为了让单值因子对上。
  - 推论 6.3：⟨k,k⟩ = 0 ⟺ 移位与层指标无关 ⟺ 落在图/Lean 的层无关 towerVertex 形式里。
    附**反例**：s ≠ 0 时取 ns > 0、K = nν，在 |0;1⟩ 上层无关候选给 |0;1+n⟩ ≠ 0，
    真实算子给 0（因 −2ns < 0，E₋ 无负幂）。
  - 引理 6.4 + 命题 6.5：秩 1 上每个容许 ε 都是上边缘；换 ε 不改变 (A′-a) 的右端，
    至多把左端生成向量重标度一个**与层无关**的 λ(nk)，而 (C3) 把它钉死为 1。
  - 定理 6.8（量词完整的反驳）：设 L 为偶格、ε 满足 (3.6)–(3.8)，若**存在**一对 γ*,δ* ∈ L 使
    ⟨γ*,δ*⟩ 为奇，则**不存在**任何（分层等变同构 Ψ，无 cocycle 归一化的算子族）满足 (A) 型等式。
    证明路线：最低非零 x-幂的系数匹配 ⟹ ε(γ,δ)c_{γ+δ} = c_δ ⟹（δ=0 + (3.6)）c 常值 ⟹ ε ≡ 1
    ⟹ 与 (3.8) 的 (−1)^{⟨γ,δ⟩} = −1 矛盾。
  - 注 6.10 的**锐化**：正确的分界**不是**「秩 1 vs 秩 ≥ 2」，而是「⟨·,·⟩|_L 是否处处取偶值」。

