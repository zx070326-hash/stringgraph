  === ⭐ 第二条发现：类光性的作用此前归错了因 ===
  prior-art.md §3 末的**结论**（类光性是该命题成立的条件本身）本轮同意；但**理由要换**：
  - 在秩 1 上，闭合 cocycle 缺口的是「秩 1 + 偶」而**不是**类光：L = Zk 时
    ⟨mk,nk⟩ = mn⟨k,k⟩ ∈ 2Z 恒为偶，故 (−1)^{⟨α,β⟩} ≡ 1，ε ≡ 1 合法，**即使 ⟨k,k⟩ ≠ 0**。
  - 而且两侧的单值指数 nν + nj⟨k,k⟩ 对**任意秩 1 偶格**逐字相等——类光性也不是为了让它们对上。
  - 类光性的真正作用：⟨k,k⟩ = 0 ⟺ 单值指数与层指标 j 无关 ⟺ 存在**层无关**的整数移位
    K ↦ K − nν。而图/Lean 侧的物理算子恰恰写成层无关的单一指标
    （towerDiag (fun _ => ... (K − n)) 里的 fun _ =>）。故 ⟨k,k⟩ ≠ 0 时，图/Lean 现有的
    towerVertex **不再是**物理顶点算子的 z^K 系数（需要层依赖移位 K − n(ν + j⟨k,k⟩)）。
  ⚠ 这**不是**对 prior-art.md 的纠错：那份文件讲的是一般偶格（举 Leech），其秩 ≥ 2 的反驳
    （存在奇配对 ⟹ (3.14) 要求反对易 ⟹ 物理侧对易的 e^{ikx_0} 不满足）完全正确，本轮保留并沿用。
    本轮只是补上了「秩 1 这一侧到底是什么在起作用」。prior-art.md 本轮未改动。

