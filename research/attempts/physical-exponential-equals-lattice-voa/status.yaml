  === ⭐ 本轮最重要的发现：目标卡断言 (2) 的字面表述不成立 ===
  任务书要求「若发现该命题在本项目设定下其实不成立或需要额外前提，这是最有价值的交付，
  立刻如实写进 claim.md 并在 status.yaml 标明」。确有此事，如下（详见 claim.md §2.2）：

  目标卡 worldsheet.physical-exponential-equals-voa-vertex-operator 断言 (2) 的括注逐字写
      「V^{(n)}_K = 零模移位 ∘ worldsheet.exponential-vertex-operator-modes 的 V^{(b)}_K」
  即 V^{(n)}_K = S_n ∘ V^{(b_n)}_K，**没有指标移位**。但正确形式是
      V^{(n)}_K = S_n ∘ V^{(b_n)}_{K − nν},   ν := 2α'(k_0·p) ∈ Z.
  两种读法两种缺陷：
  (读法 1，字面) 左端 = S_n E₋E₊，右端 = z^{nν} S_n E₋E₊，差一个 z^{nν}；
                 在卡自身设定下（ν ≠ 0，典型 ν = 1）**对一切 n ≠ 0 为假**。
  (读法 2，宽容) 若把「零模移位」读成整个零模因子 e^{ink_0·x} z^{2α'nk_0·p̂}，等式成立，
                 但括注指名的两张承载卡合起来**造不出左端**：z^{2α'nk_0·p̂} 在图中**无承载节点**。
  两项独立旁证：
  (i) worldsheet.ddf-operators-v6（formalized）逐字带移位：
      towerVertex η b n K = towerShift n ∘ towerDiag(Fock.vertexOsc η (n·b) (K − n))；
      **图内已形式化的 V^{(n)}_K 带移位，桥卡括注不带，两者不是同一个对象。**
  (ii) 桥卡的唯一推导 --via-cocycle-triviality 的 summary 逐字把 z^{2α'nk_0·(p+Nk_0)}
      匹配给 VOA 侧的 x^{⟨α,β⟩}；但本设定下 ⟨α,β⟩ = ⟨nk,Nk⟩ = 0，故 x^{⟨α,β⟩} = 1，
      承载不了 z^n。单值因子的真正 VOA 来源是 Δ̄(α,−x) 里的 x^{α(0)}（Δ̄ 那条 summary 从未提）。
      **该推导内部不自洽。**

  ⇒ 本尝试要证的是**订正后**的 Claim A（claim.md §2.1），不是卡上那句话。
  🔴 处置移交 lead：即使 Claim A 日后被证明，目标卡也**不能直接升级**——它的陈述文本要么假、
