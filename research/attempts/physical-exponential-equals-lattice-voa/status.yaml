  【第二轮注：以上状态第二轮未重跑；proof.md §0.4 的砖块表沿用这份实跑记录。】

  === 断言 (1) 的处置（纪律）===
  ε(mk,nk) = 1 有两条 L1 来源（gebert-nicolai-1995 §3.1 (3.1)；li-wang-2008 §4 p.21 逐字
  "the normalized 2-cocycle ε … is trivial in the sense that ε(α,β) = 1 for all α,β ∈ L"）。
