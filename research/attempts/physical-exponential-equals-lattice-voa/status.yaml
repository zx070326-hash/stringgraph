  === 断言 (1) 的处置（纪律）===
  ε(mk,nk) = 1 有两条 L1 来源（gebert-nicolai-1995 §3.1 (3.1)；li-wang-2008 §4 p.21 逐字
  "the normalized 2-cocycle ε … is trivial in the sense that ε(α,β) = 1 for all α,β ∈ L"）。
  🔴 **不重证，只引用**，并已在 claim.md §2.3 写明它对断言 (2) **必要而不充分**
  （不触及振子部分的逐项符号、单值因子、识别映射 Φ 的规范、以及系数良定义性）。

  === 原创性边界（claim.md §0，纪律）===
  ✅ 可主张「首次给出**证明**」；🔴 **绝不可主张「首次陈述」**——grotenhuis-2020 p.106
  已有逐字陈述（"We recognise this expression as the lattice vertex operators Y(|α⟩,z)…"）。
  引用该先例时必须同时说出口 prior-art.md §2 的五条限定词（本科论文/非同行评议；论证强度为零且
  公式内部不自洽——(6.6) 掉了 (6.5) 的 √(α'/2) 却保留 z^{α'kp}，且 α_n z^{-m} 的 m 全文未定义；
  命题是正定偶格 Leech 而非秩 1 类光 + 连续动量塔；作者自陈关键推广步骤是 Assuming；零模因子对不上）
  以及 §3 的 cocycle 硬伤（物理侧一个因子 e^{ikx_0} vs VOA 侧两个因子 e^α c_α，(3.14) 在奇配对上
  强制反对易 ⟹ 该识别在一般偶格上**是错的**）。

  === 仍然开放的 [GAP] 清单（完整版见 claim.md §5）===
  (a) cocycle：ε ≡ 1 的合法性已闭合（不重证）。未闭合：不同 ε 之间的同构是否保持 (A) 的右端；
      §0.4 的一般偶格反驳尚无量词完整的陈述与证明。
  (b) 连续动量 ↔ 离散格：**两层必须分清**。代数模型内部由 free-boson-…-momentum-tower
      (3)(iii)(iv) 承载（认为可用），但该卡的「逐层识别」只写了「↔」没给映射，claim.md §1.5 的
      Φ 是本轮补写的，其存在唯一性论证本轮**未写出**。代数模型 ↔ 物理文献的连续动量 Fock 表示
      这一层在图中**根本没有节点**，本尝试也不证；故 (A) 成立 ≠「物理学家写的那个等式成立」。
      另 li-wang-2008 Remark 3.13 指出 ℂL ≠ 𝔥 时另有 level-1 不可约模族，「物理塔对应的就是
      M(1,p̃)」这一取法本轮未独立论证。
  (c) δ 归一化：物理侧 ⟨p|p'⟩ = δ^D(p−p') 在代数塔上根本没有定义（momentum-tower 卡 (2) 逐字
      自陈层间正交是「本定义规定的，不是被证明的」）。(A) 两端都不涉及型，但 δ 归一化并未消失——
      它化身为 Φ 的层间标度规范 c_j。(A) **只对常值规范 c_j ≡ 1 成立**，而「常值规范是对的那个」
      是前提不是结论，且图内无 δ 归一化可供比对。
  (d) 物理记号 ↔ 图对象的锚定：把 :e^{ink_0·X(z)}: 解释成 (P1)(P2)(P3) 的复合是**约定**不是定理，
      且在图现状下**不可能**成为定理（X^μ(z) 含 ln z 与 x^μ，不是 Fock 塔上良定义的形式洛朗级数）。
  (e) 图内缺失定义卡：单值因子 z^{2α'nk_0·p̂} 无承载节点；Li–Wang 的 E^±(α,x)、Δ̄(α,x) 无定义卡
      （math.lattice-vertex-algebra 的推导 gaps 已登记同一条）。**非数学缺口，但是毕业阻塞项。**
  (f) 类光性与高秩的两条结构性论断（层无关性刻画；高秩反驳）本轮只有骨架，未写证明。
  (g) 目标卡处置（见上「最重要的发现」），属 curator/lead 权限。

  === 本尝试对路线可行性的当前判断（claim 阶段，非结论）===
  Claim A 被判断为**很可能成立且可证**：它整个活在图内的代数模型里，两端都由 claim.md §2.6 的
  五条有限步核对 (i)–(v) 构成，每条都是定义展开 + 符号核对，没有分析学、没有收敛性、没有围道。
  独立性门槛（prior-art §4 判据 3）看得出可以满足：右端 Y_W 来自 li-wang-2008 (3.14)，
  其存在性早于本尝试且与物理记号零接触；左端由早于本尝试就已 Lean 形式化的 towerShift /
  Fock.vertexOsc 拼出，定义里不出现顶点代数。
  **最可能卡住的地方不是数学而是边界**：接缝 (c)（δ 归一化 ⇝ Φ 的层间规范 c_j）与接缝 (d)
  （物理符号锚定）都在本图内**无可比对物**，因此即便 Claim A 全证下来，它也只是
  「图对象 = 图对象」的定理，桥卡想要的「物理学家那个等式 = VOA 那个等式」仍差一步解释性论证。
  技术上最容易出错的一步是 Li–Wang 脚注 3 的 E^± 参数正负号陷阱（同一记号在 [Li3] 与本文里
  参数差一个负号）与 Δ̄(α,−x) = x^{α(0)}E^+(−α,x) 里两个负号的相消。

